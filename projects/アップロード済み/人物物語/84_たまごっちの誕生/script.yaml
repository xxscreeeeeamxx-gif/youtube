meta:
  title: 【たまごっちの誕生】「刺激が強すぎる」と言われた死ぬおもちゃが1億個【ずんだもん解説】
  slug: tamagotchi-yokoi-v2
  summary: 1996年に発売された、手のひらの卵の中で生き物を育てるおもちゃ、たまごっち。企画したのは、バンダイを飛び出して小さな会社を開いた横井昭裕です。パソコンの画面で泳ぐ熱帯魚から「人間と同じ時間で生きるペット」を思いつき、世話をしないと死ぬ仕組みを入れました。社内で「刺激が強すぎる」と言われた企画は、どうやって世に出たのか。行列と品切れの裏側まで、再現ドラマでたどります。
  tags:
  - たまごっち
  - 横井昭裕
  - バンダイ
  - ウィズ
  - おもちゃ
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 雑学
  thumbnail:
    top: 死ぬおもちゃ
    bottom: たまごっちの誕生
  mode: drama
  narrator: reimu
