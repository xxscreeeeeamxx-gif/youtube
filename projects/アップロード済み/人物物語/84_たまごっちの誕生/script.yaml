scenes:
- id: co_shinu
  title: ''
  background: tg_kaigi
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 横井昭裕, emotion: normal}
  - {who: bandai, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1995年、のちのたまごっちの企画書を持った小さな会社の社長がバンダイを訪ねます。
    reading: せんきゅうひゃく きゅうじゅうごねん、のちの たまごっちの きかくしょお もった ちいさな かいしゃの しゃちょうが ばんだいお たずねます。
  - speaker: zundamon
    emotion: normal
    text: 卵の形の時計の中で、生き物を育てるおもちゃです。
  - speaker: bandai
    emotion: happy
    text: 育てるおもちゃ、いいですね。
  - speaker: zundamon
    emotion: normal
    text: ただ、世話をしないと死にます。
  - speaker: bandai
    emotion: surprised
    text: ……死ぬ！？ おもちゃが、ですか！？
  - speaker: bandai
    emotion: thinking
    text: 面白い。……でも死ぬのは、社内で刺激が強すぎるって言われますよ。
  - speaker: bandai
    emotion: thinking
    text: 死ぬところだけ、なしにできませんか。
  - speaker: zundamon
    emotion: normal
    text: そこは、譲れません。
    se: don
  - speaker: reimu
    text: この男は、横井昭裕。刺激が強すぎると言われたたまごっちは、30年で1億個を超えました。
    reading: この おとこわ よこい あきひろ。しげきが つよすぎると いわれた たまごっちわ、さんじゅうねんで いちおくこお こえました。
- id: hook
  title: ''
  background: tg_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: sad}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: sad
    text: つむぎ、たまごっちが死んだのだ。一日出かけてただけなのに！
  - speaker: tsumugi
    emotion: thinking
    text: 一日、ごはんも掃除もしなかったのね。
    beat: true
  - speaker: zundamon
    emotion: angry
    text: なんで、止めるボタンが無いのだ！
  - speaker: tsumugi
    emotion: normal
    text: わざと付けなかったの。その死ぬおもちゃが、1億個売れたのよ。
  - speaker: zundamon
    emotion: surprised
    text: 死ぬのに、なんで1億個も売れるの？
    telops:
    - {text: 死ぬおもちゃが1億個？, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、生き物好きなおもちゃ会社の新人よ。
- id: card1977
  title: ''
  background: tg_card_1977
  cuts:
  - speaker: reimu
    text: 1977年。東京のおもちゃ会社バンダイに、22歳の新人が入ります。
    reading: せんきゅうひゃく ななじゅうななねん。とうきょうの おもちゃ がいしゃ ばんだいに、にじゅうにさいの しんじんが はいります。
- id: ch1_bandai
  title: 女の子向けの占い
  background: tg_bandai
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 横井昭裕, emotion: normal}
  - {who: joushi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 横井昭裕は東京の生まれ。子どものころから、生き物を飼うのが好きでした。
    reading: よこい あきひろわ とうきょうの うまれ。こどもの ころから いきものお かうのが すきでした。
  - speaker: reimu
    text: 入社した横井は、バンダイのキャラクターを使った小さな液晶ゲームを手がけます。
    reading: にゅうしゃした よこいわ、ばんだいの きゃらくたーお つかった ちいさな えきしょう げーむお てがけます。
  - speaker: joushi
    emotion: normal
    text: 横井。次の企画はあるか？
  - speaker: zundamon
    emotion: normal
    text: はい。女の子向けの、電子の占いです。
  - speaker: joushi
    emotion: surprised
    text: 占い！？
  - speaker: joushi
    emotion: thinking
    text: 占いは売れないんだ。前に出した占いの機械も、売れなかっただろ。
  - speaker: zundamon
    emotion: normal
    text: 倉庫で、その機械を見てきました。
  - speaker: zundamon
    emotion: normal
    text: あれは男の子っぽく作ったから、売れなかったんです。
  - speaker: joushi
    emotion: angry
    text: 売れなかった物は、全部ダメなんだよ。
  - speaker: joushi
    emotion: normal
    text: この山を見ろ。売れそうにない企画は、全部ボツだ。
    background: tg_bandai_botsu
  - speaker: joushi
    emotion: thinking
    text: ……一番上のは、おれが出したやつだがな。
    beat: true
  - speaker: zundamon
    emotion: normal
    text: 占いは、女の子に人気があります。女の子向けに作れば、売れます。
  - speaker: joushi
    emotion: thinking
    text: ……お前がそこまで言うなら、やってみろ。
  - speaker: joushi
    emotion: angry
    text: その代わり、ボツの山を1枚増やすなよ。
    se: hammer
  - speaker: reimu
    text: 女の子向けに作ったハートの形の占いのゲームは、売れました。
    reading: おんなのこむけに つくった はーとの かたちの うらないの げーむわ、うれました。
- id: ch1_kanban
  title: 自分の力か看板の力か
  background: tg_bandai
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 横井昭裕, emotion: thinking}
  - {who: joushi, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 入社から10年ほど。横井の企画は、売れるようになっていました。
    reading: にゅうしゃから じゅうねんほど。よこいの きかくわ、うれる ように なって いました。
  - speaker: joushi
    emotion: happy
    text: 横井、この前のやつ売れてるぞ。お前の手柄だ。
  - speaker: zundamon
    emotion: thinking
    text: ……本当に、ボクの力でしょうか。
  - speaker: joushi
    emotion: surprised
    text: '[は|はぁ]？'
  - speaker: zundamon
    emotion: thinking
    text: バンダイの看板の力かもしれません。
  - speaker: joushi
    emotion: thinking
    text: どっちでもいいだろ。売れたんだから。
  - speaker: zundamon
    emotion: normal
    text: ボクには、そこが分からなくなりました。
  - speaker: zundamon
    emotion: normal
    text: 自分の会社でやって、確かめてみたいんです。
    telops:
    - {text: 自分の力か 看板の力か, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: joushi
    emotion: surprised
    text: 辞めるのか！？
  - speaker: joushi
    emotion: thinking
    text: 看板を下ろしたら、誰も話なんか聞いてくれんぞ。
  - speaker: joushi
    emotion: sad
    text: ……それに、次の占いは誰が作るんだ。
    beat: true
  - speaker: reimu
    text: 1986年、31歳でウィズという会社を作ります。翌年バンダイを辞め、社長になりました。
    reading: せんきゅうひゃく はちじゅうろくねん さんじゅういっさいで うぃずと いう かいしゃお つくります。よくねん ばんだいお やめ、しゃちょうに なりました。
- id: ch2_wiz
  title: 食うため7割・夢3割
  background: tg_wiz
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 横井昭裕, emotion: normal}
  - {who: shain, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 独立しても、おもちゃの仕事はすぐには来ません。
    reading: どくりつ しても おもちゃの しごとわ すぐにわ きません。
  - speaker: shain
    emotion: happy
    text: 社長、仕事が取れました！ スーパーのチラシです。
  - speaker: zundamon
    emotion: normal
    text: 引き受けよう。家賃と給料がいる。
  - speaker: shain
    emotion: normal
    text: 次は商品の箱のデザイン。その次は、会議で使うパネルです。
    background: tg_wiz_chirashi
  - speaker: zundamon
    emotion: normal
    text: それも、やろう。
  - speaker: shain
    emotion: normal
    text: その次は、また別のスーパーのチラシです。
  - speaker: shain
    emotion: thinking
    text: ……社長。うちって、おもちゃを考える会社でしたよね。
  - speaker: shain
    emotion: angry
    text: これじゃ、チラシを考える会社です。
    se: tsukkomi
  - speaker: zundamon
    emotion: thinking
    text: ……分かった。決まりを作ろう。
  - speaker: zundamon
    emotion: normal
    text: 仕事は、食うためが7割。夢のためが3割だ。
  - speaker: shain
    emotion: surprised
    text: 3割は、おもちゃの企画をやれるんですね！
  - speaker: zundamon
    emotion: happy
    text: その3割で、勝負するのだ。
  - speaker: shain
    emotion: thinking
    text: ……で、7割のほうのチラシは今夜中です。
  - speaker: zundamon
    emotion: normal
    text: ……やろう。
    beat: true
  - speaker: reimu
    text: 最初の3年ほどは勢いで乗り切りましたが、5年目ごろから苦しくなります。
    reading: さいしょの さんねんほどわ いきおいで のりきりましたが、ごねんめごろから くるしく なります。
- id: card1995
  title: ''
  background: tg_card_1995
  cuts:
  - speaker: reimu
    text: 1995年。業績の落ちていたバンダイから、ウィズに依頼が届きます。
    reading: せんきゅうひゃく きゅうじゅうごねん。ぎょうせきの おちて いた ばんだいから、うぃずに いらいが とどきます。
- id: ch3_irai
  title: 当たるものなら何でも
  background: tg_wiz
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 横井昭裕, emotion: normal}
  - {who: bandai, x: 0.7, emotion: normal}
  cuts:
  - speaker: bandai
    emotion: normal
    text: 横井さん。来年に出す企画を、何か持ってきてもらえませんか。
  - speaker: zundamon
    emotion: normal
    text: 来年の、ですか。
  - speaker: bandai
    emotion: thinking
    text: 正直、うちの会社の調子が良くないんです。
  - speaker: zundamon
    emotion: normal
    text: どんなものが、いいでしょう。
  - speaker: bandai
    emotion: happy
    text: 当たるものなら、なんでも。
  - speaker: zundamon
    emotion: thinking
    text: ……なんでも、ですか。
  - speaker: bandai
    emotion: normal
    text: ええ。当たるものなら。
  - speaker: bandai
    emotion: thinking
    text: ……当たらないものは、困ります。
    beat: true
  - speaker: reimu
    text: ウィズでは週に1回、情報会議を開いていました。
    reading: うぃずでわ しゅうに いっかい じょうほう かいぎお ひらいて いました。
  - speaker: reimu
    text: 決まりは一つ。おもちゃやゲームの外から、話を持ってくることです。
    reading: きまりわ ひとつ。おもちゃや げーむの そとから はなしお もってくる ことです。
- id: ch3_kaigi
  title: パソコンの熱帯魚
  background: tg_pc
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 横井昭裕, emotion: normal}
  - {who: shain, x: 0.7, emotion: happy}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: 今週は、面白い話はあるか。
  - speaker: shain
    emotion: happy
    text: 社長。新聞に、パソコンで熱帯魚を飼うソフトが流行ってるって出てました。
  - speaker: zundamon
    emotion: surprised
    text: パソコンで、魚を？
  - speaker: shain
    emotion: normal
    text: 画面の水槽の中で、24時間ずっと泳いでるんです。
  - speaker: shain
    emotion: happy
    text: うちのチームにも、はまってる人がいます。
  - speaker: shain
    emotion: thinking
    text: 夜中も気になって見ちゃうから、魚より人間のほうが寝不足です。
    beat: true
  - speaker: reimu
    text: そのソフトは、アクアゾーンという名前でした。
    reading: その そふとわ、あくあぞーんと いう なまえでした。
  - speaker: zundamon
    emotion: thinking
    text: ……ゲームの中は、ふつうゲームの時間で動く。
  - speaker: zundamon
    emotion: thinking
    text: 何年もの時間が、あっという間に過ぎたりする。
  - speaker: zundamon
    emotion: surprised
    text: でもこの魚は、人間と同じ時間で生きてる。
  - speaker: zundamon
    emotion: happy
    text: 同じ時間で生きてると、本当に生きてるように感じるんだ！
    se: hirameki
    telops:
    - {text: 人間と同じ時間で生きる, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: 横井は、この気づきがたまごっちの出発点になったと話しています。
    reading: よこいわ この きづきが たまごっちの しゅっぱつてんに なったと はなして います。
- id: ch3_katachi
  title: 卵とウォッチ
  background: tg_wiz
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 横井昭裕, emotion: thinking}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: でも、パソコンじゃ持ち歩けない。
  - speaker: shain
    emotion: thinking
    text: 24時間一緒にいるなら、持ち歩ける大きさですね。
  - speaker: zundamon
    emotion: normal
    text: 前に作った液晶ゲームくらいの、手のひらの大きさにしよう。
  - speaker: shain
    emotion: thinking
    text: 手のひらに乗る、生き物……。
  - speaker: zundamon
    emotion: normal
    text: しかも時計にする。時間を見るついでに、世話もできる。
  - speaker: shain
    emotion: normal
    text: 形は、どうします？
  - speaker: zundamon
    emotion: normal
    text: 動物は、卵から生まれる。卵の形にしよう。
  - speaker: zundamon
    emotion: normal
    text: それに、卵の形のおもちゃは外れが少ないんだ。
  - speaker: shain
    emotion: thinking
    text: 卵の形の、時計……。
  - speaker: reimu
    text: たまごとウォッチを合わせて、名前はたまごっちになりました。
    reading: たまごと うぉっちお あわせて、なまえわ たまごっちに なりました。
  - speaker: shain
    emotion: happy
    text: たまごっち！ 言いやすいです！
    se: jaan
- id: ch3_chara
  title: 変わっていく生き物
  background: tg_sketch
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 横井昭裕, emotion: normal}
  - {who: designer, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: 中に住む生き物は、犬や猫にはしない。
  - speaker: designer
    emotion: thinking
    text: この小さな画面だと、本物の動物は嘘っぽくなりますもんね。
  - speaker: zundamon
    emotion: normal
    text: 見たことのない、架空の生き物にしよう。
  - speaker: zundamon
    emotion: thinking
    text: クワガタは幼虫からさなぎ、成虫と姿が変わる。
  - speaker: zundamon
    emotion: normal
    text: 育つたびに、形ががらっと変わる生き物にしたい。
  - speaker: designer
    emotion: happy
    text: 次に何になるか、楽しみになりますね。
  - speaker: designer
    emotion: normal
    text: じゃあ最初は、これでどうです？ 殻に入った不格好なやつ。
  - speaker: designer
    emotion: thinking
    text: ……正直、かわいくないって言われそうですけど。
  - speaker: zundamon
    emotion: happy
    text: いや、これでいこう。
  - speaker: designer
    emotion: surprised
    text: いくんですか！？
    se: manuke
- id: ch4_shi
  title: かわいいのは2割
  background: tg_wiz
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 横井昭裕, emotion: normal}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: もう一つ、どうしても入れたいことがある。
  - speaker: shain
    emotion: surprised
    text: まだあるんですか。
  - speaker: zundamon
    emotion: normal
    text: ボクは熱帯魚からフクロウまで、いろんな生き物を飼ってきた。
  - speaker: shain
    emotion: thinking
    text: ……社長、それもう動物園の人ですよ。
    beat: true
  - speaker: zundamon
    emotion: thinking
    text: ペットがかわいいのは、2割か3割。
  - speaker: zundamon
    emotion: thinking
    text: 残りは、面倒な世話なんだ。
    telops:
    - {text: かわいいのは2割, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: shain
    emotion: thinking
    text: 水替えに、えさやりに掃除……。
  - speaker: zundamon
    emotion: sad
    text: 海の魚は、どんなに工夫しても2週間ほどで死なせてしまった。
  - speaker: zundamon
    emotion: normal
    text: だから死なせないように、必死で世話をした。
  - speaker: zundamon
    emotion: normal
    text: 大変だからこそ、かわいいと感じるんだ。
  - speaker: shain
    emotion: thinking
    text: でもおもちゃって、面倒をなくす方向でやってきましたよね。
  - speaker: zundamon
    emotion: normal
    text: だから、あえて入れる。
  - speaker: zundamon
    emotion: normal
