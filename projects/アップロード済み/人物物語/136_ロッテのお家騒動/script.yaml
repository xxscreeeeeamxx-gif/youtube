meta:
  title: 取締役6人の解任を告げたロッテの創業者、翌朝に自分の代表権を外された【ずんだもん解説】
  slug: lotte-shigemitsu
  hook_line: 6人の解任を告げた創業者は、なぜ翌朝、自分の代表権を失ったのか。
  summary: 2015年7月27日、東京・新宿。ロッテの創業者で92歳の重光武雄は、本社で取締役6人を外すと告げました。翌朝、本人のいない取締役会で外されたのは、創業者自身の代表権でした。ガムで始めた会社、韓国で大きくなった稼ぎ、3つに分かれた親会社の株。父のひと声と取締役会の多数決は、どちらが強かったのか。日韓の判決と報道、会社と当事者の発表を主語を分けて並べ、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 韓国大法院「ロッテグループ会長等に対する贈賄等事件、大法院の判断は？」（2019年10月24日掲載・2018도16652） https://www.scourt.go.kr/portal/gongbo/PeoplePopupView.work?gubun=21&sDate=201910&seqNum=2414
