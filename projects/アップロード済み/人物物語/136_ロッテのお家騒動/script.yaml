    text: 実際には、創業者が自分で持つ株はわずかでした。
    reading: じっさいにわ、そうぎょうしゃが じぶんで もつ かぶわ わずかでした。
- id: ch13_taitei
  title: ''
  background: lt_houtei
  stage:
  - {who: zundamon, x: 0.14, flip: true, tag: 重光, emotion: angry}
  - {who: saibancho, x: 0.86, emotion: normal}
  cuts:
  - speaker: saibancho
    emotion: normal
    text: 後でご説明ください。その程度のお話でしたら、退廷されてもよいでしょう。
  - speaker: zundamon
    emotion: angry
    text: ……なんで、こうなる！
  - speaker: reimu
    text: 大声は約20分続き、退廷のとき創業者は杖を投げました。被告席の次男と長女は、涙をぬぐいます。
    reading: おおごえわ やく にじゅっぷん つづき、たいていの とき そうぎょうしゃわ つえお なげました。ひこくせきの じなんと ちょうじょわ なみだお ぬぐいます。
# ---- 2018年10月5日・二審（名前と年齢は中身が台帳に無いのでナレだけ。拘束されない） ----
- id: card2018
  title: ''
  background: lt_card_2018
  cuts:
  - speaker: reimu
    text: 2018年10月5日、ソウル高裁。二審の判決の日です。
    reading: にせん じゅうはちねん じゅうがつ いつか、そうる こうさい。にしんの はんけつの ひです。
- id: ch14_nishin
  title: 名前と年齢
  background: lt_houtei
  stage:
  - {who: zundamon, x: 0.14, flip: true, tag: 重光, emotion: sad}
  - {who: saibancho, x: 0.86, emotion: normal}
  cuts:
  - speaker: reimu
    text: 一審は懲役4年で、高齢と健康を理由に拘束されず。二審の日、車椅子の創業者は名前と年齢を答えました。
    reading: いっしんわ ちょうえき よねんで、こうれいと けんこうお りゆうに こうそく されず。にしんの ひ、くるまいすの そうぎょうしゃわ なまえと ねんれいお こたえました。
  - speaker: reimu
    text: 二審の判決は、懲役3年と罰金30億ウォン。この日も、法廷で拘束はされませんでした。
    reading: にしんの はんけつわ、ちょうえき さんねんと ばっきん さんじゅうおく うぉん。この ひも、ほうていで こうそくわ されませんでした。
# ---- 今の部屋（大法院で確定。人ごと・罪名ごとに分ける。大統領の事件は1行） ----
- id: heya4
  title: 人ごとに違う判決
  background: lt_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 結局、誰が有罪で誰が無罪なの？
  - speaker: tsumugi
    emotion: normal
    text: 人ごとに違うの。2019年10月に、韓国の[大法院|だいほういん]で確定した結果で言うわね。
  - speaker: tsumugi
    emotion: normal
    text: 父は、懲役3年と罰金30億ウォン。会社のお[金|かね]をめぐる横領や背任などの罪よ。
  - speaker: tsumugi
    emotion: thinking
    text: でも検察は満97歳の高齢と末期の認知症などで受刑は難しいとして、刑の執行を止めたの。
  - speaker: zundamon
    emotion: surprised
    text: じゃあ、刑務所には……。
  - speaker: tsumugi
    emotion: normal
    text: 一度も入っていないわ。
  - speaker: tsumugi
    emotion: normal
    text: 次男は、大統領の求めで財団に70億ウォンを出したことが贈賄とされたの。
  - speaker: tsumugi
    emotion: normal
    text: 2018年2月の[一審|いっしん]では実刑。二審で釈放されるまで、235日拘束されたわ。
  - speaker: zundamon
    emotion: surprised
    text: 235日も……。
  - speaker: tsumugi
    emotion: normal
    text: 確定は贈賄と背任で、懲役2年6か月と執行猶予4年。
  - speaker: tsumugi
    emotion: normal
    text: 働いていない家族への給料の横領は、二審で無罪になったわ。
  - speaker: tsumugi
    emotion: normal
    text: 長男は、[一審|いっしん]から最後まで無罪よ。
  - speaker: zundamon
    emotion: thinking
    text: 人ごとに、ばらばらなのだ……。
    beat: true
# ---- 2020年1月19日・死去（ソウル峨山病院、満98歳。立ち会いは報道として） ----
- id: card2020
  title: ''
  background: lt_card_2020
  bgm: 223am
  cuts:
  - speaker: reimu
    text: 2020年1月19日、ソウルの病院。創業者は98歳で亡くなります。
    reading: にせん にじゅうねん いちがつ じゅうくにち、そうるの びょういん。そうぎょうしゃわ きゅうじゅうはっさいで なくなります。
- id: ch15_byoin
  title: 父の最期
  background: lt_byoin
  stage:
  - {who: kisha, x: 0.84, emotion: sad}
  cuts:
  - speaker: kisha
    emotion: sad
    text: 日本への出張から急いで戻った次男と、長男たちが最期に立ち会ったそうです。
    se: namida
- id: ch15_igon
  title: ''
  background: lt_shinbun
  stage:
  - {who: kisha, x: 0.84, emotion: surprised}
  cuts:
  - speaker: kisha
    emotion: surprised
    text: 6月24日、ロッテの側が創業者の自筆の遺言を発表しました。
  - speaker: kisha
    emotion: normal
    text: 2000年に書かれ、東京の事務所の金庫にあったと。
  - speaker: kisha
    emotion: normal
    text: 後継者は次男。長男には研究開発を任せる、という中身です。
  - speaker: kisha
    emotion: thinking
    text: 長男の側は、1月にロッテが遺言は無いと公表していたのに非常に不自然だとしています。
# ---- 論争1：次男が父を追い出した？（「クーデター」は長男が否定した言葉なので俗説に使わない。判決は要旨を伝える記事の言葉） ----
- id: ronso1
  title: 次男が父を追い出した？
  background: lt_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ 次男が父を会社から追い出したって！
  - speaker: tsumugi
    emotion: normal
    text: そう見える事実はあるの。本人のいない取締役会で、招集は前の日の深夜のメール。
  - speaker: tsumugi
    emotion: normal
    text: 父は決議の無効を東京地裁に訴えたわ。判決は、招集の手続きが適法でないと認めたの。
  - speaker: zundamon
    emotion: happy
    text: やっぱりなのだ！
  - speaker: tsumugi
    emotion: normal
    text: でも同じ判決は、決議を有効としたの。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: 判決の要旨を伝えた記事によれば、理由はこうなの。
  - speaker: reimu
    text: 他の取締役の意思は固く、重光氏が出席してもなお影響はなかった。
    reading: ほかの とりしまりやくの いしわ かたく、しげみつしが しゅっせき しても なお えいきょうわ なかった。
    telops:
    - {text: "地裁「出席してもなお影響はなかった」", size: sm, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: そのあとの総会でも、株主は毎回次男の側を選んでいるわ。
  - speaker: tsumugi
    emotion: thinking
    text: 父の声と、会社のルールがぶつかった。裁判所は、ルールのほうを有効としたの。
  - speaker: zundamon
    emotion: thinking
    text: 追い出したんじゃなくて、ルールで外れた……。
    beat: true
# ---- 論争2：長男が父を担ぎ出した？（「利用した」「操った」と言わない。後見は家庭法院、録音の評価は会社の側） ----
- id: ronso2
  title: 長男が父を担ぎ出した？
  background: lt_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: じゃあ、長男が年をとったお父さんを担ぎ出したんだ！
  - speaker: tsumugi
    emotion: normal
    text: 韓国の新聞は、東京行きは長男が主導したと書いたわ。会社の側は、録音の意図を疑った。
  - speaker: zundamon
    emotion: happy
    text: 決まりだね！
  - speaker: tsumugi
    emotion: normal
    text: でも長男は、父が自分の権限を行使したものだと話したわ。
    se: zukko
  - speaker: tsumugi
    emotion: normal
    text: 創業家の会社の[光潤社|こうじゅんしゃ]はいまも最大の株主で、長男がその社長よ。
  - speaker: tsumugi
    emotion: thinking
    text: 長男は父の意思だったと言い、会社は父の判断する力を疑った。
  - speaker: tsumugi
    emotion: normal
    text: '[家庭法院|かていほういん]は2016年、判断する力が落ちていると認めた。言えるのは、そこまでよ。'
  - speaker: zundamon
    emotion: thinking
    text: 誰が悪い、とは決められないのか……。
# ---- 本当の注意点（法律の助言にしない。持株会の理事長1人は2016年の報道） ----
- id: chui
  title: 作る人と持つ人
  background: lt_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 1つめ。会社を作った人と株を持つ人と経営を決める人は、別の人になりうる。
  - speaker: tsumugi
    emotion: normal
    text: 家族の店でも、誰が持ち分を持って誰が決めるのか。元気なうちにはっきりさせておくこと。
  - speaker: zundamon
    emotion: thinking
    text: 作った人が、いちばん強いとは限らないのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 2つめ。遺言は、いつ書いたかと置き場所が争いになるの。
  - speaker: tsumugi
    emotion: normal
    text: 2000年の遺言が20年後に金庫から出て、長男はその経緯を疑ったわ。
  - speaker: zundamon
    emotion: thinking
    text: 書いただけじゃ、足りないのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 書いたら、置き場所を信頼できる人に伝えておくこと。
  - speaker: tsumugi
    emotion: normal
    text: 3つめ。持株会の票は、理事長1人がまとめて入れることがあるの。
  - speaker: tsumugi
    emotion: normal
    text: 自分の会社に持株会があったら、決まりを一度読んでおいてね。
# ---- 現代（2026年11月時点。係争中の訴えは時点を付ける。業績の数字は使わない） ----
- id: card2026
  title: ''
  background: lt_card_2026
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 2026年。あの取締役会から、11年がたちました。
    reading: にせん にじゅうろくねん。あの とりしまりやくかいから、じゅういちねんが たちました。
- id: ima
  title: ロッテのいま
  background: lt_gendai
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: ロッテは、いまどうなってるの？
  - speaker: tsumugi
    emotion: normal
    text: ロッテホールディングスの会長は、次男の重光昭夫。社長は2021年から玉塚元一よ。
  - speaker: tsumugi
    emotion: normal
    text: 取締役には、次男の長男の重光聡も名を連ねているわ。
  - speaker: tsumugi
    emotion: normal
    text: 長男の側は2016年から毎年、株主として提案を出してきたの。
  - speaker: tsumugi
    emotion: thinking
    text: 2026年6月の総会で、12回目の否決よ。
    telops:
    - {text: "長男の側の提案　12回目の否決", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 12回も！？
  - speaker: tsumugi
    emotion: normal
    text: 2025年7月には、次男ら取締役を相手に約144億円の株主代表訴訟も起こした。
  - speaker: tsumugi
    emotion: normal
    text: 2026年11月の時点で、その裁判は続いているわ。
  - speaker: zundamon
    emotion: thinking
    text: ガムは、どうなったの？
  - speaker: tsumugi
    emotion: happy
    text: 1950年代に出たガムの名前は、いまも店で見かけるわね。
# ---- 締め（茶番の部活を回収。「葬儀が最後」は長男の2025年の言葉として） ----
- id: shime
  title: ''
  background: lt_heya
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 決めたのだ！ 新しい部活を作って、部長はボクで決まりなのだ！
  - speaker: tsumugi
    emotion: normal
    text: 部員は？
  - speaker: zundamon
    emotion: happy
    text: ボク1人なのだ。
  - speaker: tsumugi
    emotion: happy
    text: それなら、多数決でも負けないわね。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: あの7月の午後、創業者は6人を外すと告げた。翌朝、外されたのは自分の代表権だった。
  - speaker: tsumugi
    emotion: normal
    text: 私が作った会社だと言っても、決めたのは取締役会と株主の票だったの。
  - speaker: zundamon
    emotion: thinking
    text: 兄弟は、そのあと会っているの？
  - speaker: tsumugi
    emotion: thinking
    text: 近年兄弟で顔を合わせたことはあるかと聞かれて、長男は2025年にこう答えたわ。
  - speaker: reimu
    text: 全然ないですね。2020年の父の葬儀が最後です。
    reading: ぜんぜん ないですね。にせん にじゅうねんの ちちの そうぎが さいごです。
  - speaker: zundamon
    emotion: sad
    text: 会社は残ったのに……。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 作った人と持つ人と、決める人。あなたの家の店や会社でも、一度確かめてみてね。
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
