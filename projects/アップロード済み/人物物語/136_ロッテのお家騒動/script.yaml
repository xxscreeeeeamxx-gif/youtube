scenes:
# ---- 先出し（2015年7月27日・新宿の本社。「指さし」「よろしく頼む」は伝え聞きなのでここでは使わない。6人に次男と佃社長を含む。笑いの SE なし） ----
- id: co_honsha
  title: ''
  background: lt_honsha
  bgm: serious
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 重光会長, emotion: angry}
  - {who: shain, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2015年7月27日、東京・新宿のロッテ本社。92歳の創業者、重光武雄が韓国からチャーター機で来ます。
    reading: にせん じゅうごねん しちがつ にじゅうしちにち、とうきょう しんじゅくの ろって ほんしゃ。きゅうじゅうにさいの そうぎょうしゃ しげみつ たけおが かんこくから ちゃーたーきで きます。
  - speaker: shain
    emotion: surprised
    text: 会長、本日はどういったご用件で……。
    background: lt_kaichoshitsu
  - speaker: zundamon
    emotion: angry
    text: 取締役は、私のほかの6人とも外す。
  - speaker: shain
    emotion: surprised
    text: ご次男の、副会長もですか！？
  - speaker: zundamon
    emotion: angry
    text: 次男もだ。
    pause_after: 0.6
# ---- 翌朝の取締役会（本人はいない。空いた席の前に人を立たせない） ----
- id: co_yokuasa
  title: ''
  background: lt_torishimari_kara
  cuts:
  - speaker: reimu
    text: 翌朝の取締役会。創業者は出られませんでした。前の日の深夜に、メールで招集が届いていました。
    reading: よくあさの とりしまりやくかい。そうぎょうしゃわ でられませんでした。まえの ひの しんやに めーるで しょうしゅうが とどいて いました。
  - speaker: reimu
    text: 外されたのは、創業者の代表権でした。
    reading: はずされたのわ、そうぎょうしゃの だいひょうけんでした。
- id: co_hitokoto
  title: ''
  background: lt_kaichoshitsu
  stage:
  - {who: zundamon, x: 0.3, flip: true, tag: 重光, emotion: sad}
  cuts:
  - speaker: zundamon
    emotion: sad
    text: ……私が作った会社だぞ。
  - speaker: reimu
    text: 2017年3月、創業者は車椅子で法廷に入ります。被告は、家族5人です。
    reading: にせん じゅうななねん さんがつ、そうぎょうしゃわ くるまいすで ほうていに はいります。ひこくわ かぞく ごにんです。
# ---- 今の部屋（作った部活の部長選挙。20秒以内。笑いの SE は入れず一拍だけ） ----
- id: hook
  title: ''
  background: lt_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ボクが作った部活なのに、部長選挙で負けたのだ！
  - speaker: tsumugi
    emotion: normal
    text: 部員は何人？
  - speaker: zundamon
    emotion: sad
    text: ……ボク以外、全員あっちに入れたのだ。
    beat: true
  - speaker: tsumugi
    emotion: thinking
    text: ガムの会社を作った人も、自分の会社で代表を外されたの。
  - speaker: tsumugi
    emotion: normal
    text: ガムから日本と韓国の大企業を作った創業者は、なぜ自分の会社の代表を外されたのか。
    telops:
    - {text: "作った会社の代表を なぜ外された？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 作った人を、代表から外せるの！？
# ---- 1941年（時を戻すのはここ1回。30秒以内。83円は聯合と評伝） ----
- id: card1941
  title: ''
  background: lt_card_1941
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1941年。20歳の辛格浩が83円を持って、朝鮮半島から日本へ渡ります。のちの重光武雄です。
    reading: せんきゅうひゃく よんじゅういちねん。はたちの しん ぎょくほが はちじゅうさんえんお もって ちょうせん はんとうから にほんえ わたります。のちの しげみつ たけおです。
- id: ch1_gum
  title: 83円で海を渡る
  background: lt_yamiichi
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 重光武雄, emotion: happy}
  - {who: kyaku, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 配達をしながら学び、戦後はガムに目をつけます。1948年6月、東京で株式会社ロッテを作りました。
    reading: はいたつお しながら まなび、せんごわ がむに めお つけます。せんきゅうひゃく よんじゅうはちねん ろくがつ とうきょうで かぶしきがいしゃ ろってお つくりました。
  - speaker: kyaku
    emotion: normal
    text: 兄さん、そのガムは進駐軍のかい。
  - speaker: zundamon
    emotion: happy
    text: いいえ、うちの会社で作ったガムです！
    se: jaan
  - speaker: kyaku
    emotion: surprised
    text: へえ、日本でガムを作るのかい。
  - speaker: reimu
    text: この会社を、彼はのちに100%自分が持つ会社だと言います。
    reading: この かいしゃお、かれわ のちに ひゃく ぱーせんと じぶんが もつ かいしゃだと いいます。
# ---- 1961〜1979年・日本で稼いで韓国へ（懸賞は1961年。韓国の数字はナレで2015年と時点を付ける） ----
- id: ch2_kankoku
  title: 日本で稼いで韓国へ
  background: lt_kojo
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 重光社長, emotion: happy}
  - {who: shain, x: 0.8, emotion: surprised}
  cuts:
  - speaker: shain
    emotion: surprised
    text: 社長！ 1000万円の懸賞に、応募が760万通です！
  - speaker: zundamon
    emotion: happy
    text: '[日本中|にほんじゅう]が、うちのガムを噛んでるな。'
  - speaker: zundamon
    emotion: normal
    text: 日本で稼いだ[金|かね]で、韓国にも工場を建てる。
  - speaker: reimu
    text: 1967年に韓国でロッテ製菓。1973年にホテルロッテ。1979年には、ソウルにロッテホテルが開きます。
    reading: せんきゅうひゃく ろくじゅうななねんに かんこくで ろって せいか。せんきゅうひゃく ななじゅうさんねんに ほてる ろって。せんきゅうひゃく ななじゅうくねんにわ そうるに ろって ほてるが ひらきます。
    background: lt_seoul
  - speaker: reimu
    text: これが後で効きます。2015年の売上は韓国が約9兆円、日本は約4000億円でした。
    reading: これが あとで ききます。にせん じゅうごねんの うりあげわ かんこくが やく きゅうちょうえん、にほんわ やく よんせんおくえんでした。
    telops:
    - {text: "韓国約9兆円／日本約4000億円", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
# ---- 2007年・親会社の会議室（株の比率は2016年の報道としてナレで。円グラフの紙の前に人を立たせない） ----
- id: ch2_kaigi
  title: 東京の親会社
  background: lt_kaigi
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 重光社長, emotion: happy}
  - {who: yakuin, x: 0.86, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2007年、東京に持株会社のロッテホールディングスができます。
    reading: にせん ななねん、とうきょうに もちかぶがいしゃの ろって ほーるでぃんぐすが できます。
  - speaker: yakuin
    emotion: normal
    text: 社長。日本と韓国のロッテを、この親会社が束ねます。
  - speaker: zundamon
    emotion: happy
    text: 日本も韓国も、私の会社だ。
    se: levelup
  - speaker: yakuin
    emotion: normal
    text: こちらが、親会社の株主の一覧です。
  - speaker: zundamon
    emotion: normal
    text: 株主の名前など誰でもいい。ロッテは、私が作ったんだ。
  - speaker: reimu
    text: 2016年の報道では、創業家の会社の光潤社・従業員持株会・関係会社と役員持株会がほぼ3分の1ずつ。
    reading: にせん じゅうろくねんの ほうどうでわ、そうぎょうけの かいしゃの こうじゅんしゃと じゅうぎょういん もちかぶかいと かんけいがいしゃ やくいん もちかぶかいが ほぼ さんぶんの いちずつ。
  - speaker: yakuin
    emotion: thinking
    text: ……社長。株主総会で勝つのは、株の多い側ですが。
  - speaker: zundamon
    emotion: angry
    text: 私に逆らう株主など、おらん。
  - speaker: reimu
    text: 2015年の夏、そのうち2つの塊が次男の側につきます。
    reading: にせん じゅうごねんの なつ、その うち ふたつの かたまりが じなんの がわに つきます。
# ---- 今の部屋（100円と2000円は「20倍以上」の言い換え。代表は取締役会、取締役は株主総会） ----
- id: heya1
  title: ''
  background: lt_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 売上は韓国が20倍以上なのに、親会社は東京なの！？
  - speaker: tsumugi
    emotion: normal
    text: 日本のロッテが100円売るあいだに、韓国は2000円以上売る。
  - speaker: tsumugi
    emotion: normal
    text: その両方を、東京の親会社が束ねていたの。
  - speaker: tsumugi
    emotion: thinking
    text: しかも創業者が自分で持つ株は、わずかだったわ。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、会社を持っていたのは誰なのだ？
  - speaker: tsumugi
    emotion: normal
    text: その親会社で代表を選ぶのは取締役会。取締役を選ぶのは、株主総会よ。
  - speaker: zundamon
    emotion: surprised
    text: 作った人のひと声じゃ、決まらないのだ！？
    se: bikkuri
  - speaker: tsumugi
    emotion: thinking
    text: 父のひと声と、取締役会の多数決。どっちが強いのか。
    telops:
    - {text: "父のひと声 vs 取締役会の多数決", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
# ---- 2009年・2人の副会長（「日本は長男、韓国は次男」は評伝の整理。息子たちに台詞を作らない。ソウルへの転居と次男の韓国会長は2011年） ----
- id: card2009
  title: ''
  background: lt_card_2009
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 2009年7月。創業者は社長を退いて会長に。長男の宏之と次男の昭夫は、そろって副会長になります。
    reading: にせん きゅうねん しちがつ。そうぎょうしゃわ しゃちょうお しりぞいて かいちょうに。ちょうなんの ひろゆきと じなんの あきおわ そろって ふくかいちょうに なります。
- id: ch3_fukukaicho
  title: 2人の副会長
  background: lt_kaichoshitsu
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 重光会長, emotion: happy}
  - {who: hisho, x: 0.8, emotion: normal}
  cuts:
  - speaker: hisho
    emotion: normal
    text: 会長。新しい社長には、佃さんが就かれます。
  - speaker: hisho
    emotion: normal
    text: 日本は宏之副会長、韓国は昭夫副会長という分担ですね。
  - speaker: zundamon
    emotion: happy
    text: 2人の上に、私がいる。それでいい。
  - speaker: hisho
    emotion: normal
    text: 2011年に入りました。会長、ソウルのお住まいの準備ができました。
  - speaker: hisho
    emotion: normal
    text: 韓国ロッテの会長には、昭夫副会長が就かれます。
  - speaker: zundamon
    emotion: happy
    text: 日本も韓国も、ここから見る。
  - speaker: reimu
    text: 2人の副会長のうち1人が外されるのは、2014年の暮れです。
    reading: ふたりの ふくかいちょうの うち ひとりが はずされるのわ、にせん じゅうよねんの くれです。
# ---- 2014年12月〜2015年1月・長男が外される（同意は長男の側の資料。理由は会社が明かさない。判決は確定した高裁の判断） ----
- id: ch4_chonan
  title: 長男が外される
  background: lt_kaichoshitsu
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 重光会長, emotion: sad}
  - {who: hisho, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2014年12月。長男の側の資料によれば、創業者は社長の説明を受けて長男の解任に同意します。
    reading: にせん じゅうよねん じゅうにがつ。ちょうなんの がわの しりょうに よれば そうぎょうしゃわ しゃちょうの せつめいお うけて ちょうなんの かいにんに どうい します。
  - speaker: hisho
    emotion: normal
    text: 会長、社長からのご報告です。宏之副会長の件で。
  - speaker: zundamon
    emotion: sad
    text: ……分かった。
  - speaker: hisho
    emotion: sad
    text: 会長。取締役会で、宏之副会長の解職が決まりました。
- id: ch4_kisha
  title: ''
  background: lt_honsha
  stage:
  - {who: kisha, x: 0.8, emotion: normal}
  cuts:
  - speaker: kisha
    emotion: normal
    text: ロッテの発表です。1月8日の臨時株主総会で、長男を取締役から解任しました。
  - speaker: kisha
    emotion: normal
    text: 解任の理由は、お答えできないとしています。
- id: heya2
  title: ''
  background: lt_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: お父さんが、自分の息子を外したのだ？
  - speaker: tsumugi
    emotion: normal
    text: 日本だけじゃないの。3月には、韓国のグループ会社の役員からも外れたわ。
  - speaker: tsumugi
    emotion: normal
    text: 長男の側は、社長が父にうその説明を重ねたと言っているの。
  - speaker: tsumugi
    emotion: normal
    text: 1月8日に長男が事情を話して、父は誤りに気づいたとも書いているわ。
  - speaker: zundamon
    emotion: angry
    text: じゃあ、長男は悪くないのだ！
  - speaker: tsumugi
    emotion: normal
    text: 一方で裁判所は、長男の側に別の問題を見たの。
    se: hammer
  - speaker: tsumugi
    emotion: normal
    text: 長男は、グループ会社4社の役員から外されたのは不当だとして賠償を求めたわ。
  - speaker: tsumugi
    emotion: normal
    text: 高裁は、長男が取締役会で担当者にうその説明をさせたなどと認めたの。
  - speaker: zundamon
    emotion: surprised
    text: えっ、長男のほうが！？
  - speaker: tsumugi
    emotion: normal
    text: 解任されてもやむを得ない理由があった。2019年に、そう確定したわ。
  - speaker: zundamon
    emotion: thinking
    text: 言い分が、真っ二つ……。
  - speaker: tsumugi
    emotion: thinking
    text: 作った人の声は、会社のどこまで届くのか。
  - speaker: tsumugi
    emotion: normal
    text: 長男の側によれば、父は2015年7月に次男にも退くよう求めていたの。
# ---- 2015年7月なかば・次男の代表権（日付は15日か16日で割れるので「なかば」） ----
- id: ch5_jinan
  title: 次男の代表権
  background: lt_kaichoshitsu
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 重光会長, emotion: normal}
  - {who: hisho, x: 0.8, emotion: surprised}
  cuts:
  - speaker: hisho
    emotion: surprised
