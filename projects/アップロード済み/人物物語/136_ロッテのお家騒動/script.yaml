  - テレ東BIZ「ロッテ 兄弟対決 決着は」（2015年8月17日） https://txbiz.tv-tokyo.co.jp/wbs/newsl/post_95725
  - AFPBB News「韓国ロッテ会長、執行猶予確定　朴前大統領汚職事件」（2019年10月17日） https://www.afpbb.com/articles/-/3249978
