        text: "1894年、静岡。豊田喜一郎が生まれます。"
        reading: "せんはっぴゃくきゅうじゅうよねん、しずおか。とよだきいちろうが うまれます。"
      - speaker: reimu
        text: "父の佐吉は、そのころ織機の研究に没頭していました。"
        reading: "ちちの さきちわ そのころ しょっきの けんきゅうに ぼっとう して いました。"
      - speaker: reimu
        text: "豊橋と名古屋を行き来する日々です。"
        reading: "とよはしと なごやお いきき する ひびです。"
      - speaker: zundamon
        emotion: normal
        text: "じいちゃん。父ちゃんは、今どこなのだ。"
      - speaker: sofu
        emotion: thinking
        text: "……名古屋かのう。今月は帰っとらん。"
      - speaker: zundamon
        emotion: normal
        text: "先月も帰ってないのだ。"
      - speaker: sofu
        emotion: sad
        text: "……機械を直しとるんじゃ。"
      - speaker: zundamon
        emotion: thinking
        text: "……機械のほうが、大事なのか。"
      - speaker: sofu
        emotion: surprised
        text: "そうは言うとらん。"
      - speaker: zundamon
        emotion: normal
        text: "でも、機械のところにおるのだ。"
      - speaker: sofu
        emotion: normal
        text: "……そりゃ、そうじゃな。"
      - speaker: reimu
        text: "喜一郎は三歳ごろまで、祖父母のもとで育ちました。"
        reading: "きいちろうわ さんさいごろまで、そふぼの もとで そだちました。"
      - speaker: zundamon
        emotion: normal
        text: "じいちゃん。ボクも機械のところに行くのだ。"
      - speaker: sofu
        emotion: surprised
        text: "……なんでじゃ。"
      - speaker: zundamon
        emotion: normal
        text: "そこにおれば、会えるのだ。"
      - speaker: sofu
        emotion: sad
        text: "……そうか。"

