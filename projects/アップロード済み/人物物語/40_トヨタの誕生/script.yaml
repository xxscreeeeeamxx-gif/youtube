        text: "つむぎ、車を買うのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "免許は。"
      - speaker: zundamon
        emotion: surprised
        text: "……まだなのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "順番。"
      - speaker: zundamon
        emotion: normal
        text: "でも車は、乗るより見るものなのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "そういう楽しみ方もあるけどね。"
      - speaker: zundamon
        emotion: happy
        text: "よし、じゃあ自分で作るのだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "飛んだね。免許より遠いよ。"
      - speaker: zundamon
        emotion: angry
        text: "作れば免許はあとから付いてくるのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "付いてこないよ。……でもね。"
      - speaker: tsumugi
        emotion: normal
        text: "同じことを本気でやった人がいるの。"
      - speaker: zundamon
        emotion: surprised
        text: "……いるのか。"
      - speaker: tsumugi
        emotion: normal
        text: "いま世界でいちばん車を売ってる会社。"
      - speaker: tsumugi
        emotion: normal
        text: "あれ、もとは[機織り機|はたおりき]の会社。"
      - speaker: zundamon
        emotion: surprised
        text: "[は|はぁ]、[機織り機|はたおりき]！？"
        se: don
        telops:
          - {text: "もとは機織り機の会社", size: xl, position: middle-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
      - speaker: tsumugi
        emotion: normal
        text: "うん。布を織る機械。"
      - speaker: zundamon
        emotion: thinking
        text: "……布とエンジン、遠すぎないか。"
      - speaker: tsumugi
        emotion: normal
        text: "遠いよ。だから、九割が屑になった。"

