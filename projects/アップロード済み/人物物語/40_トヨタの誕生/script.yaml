    - {id: shain, label: "自動車部の社員", voice: 12, pitch: 0.04}
    - {id: shainb, label: "鋳物場の職人", voice: 12, pitch: -0.02}
    - {id: oshima, label: "大島理三郎", voice: 13, pitch: -0.04, item: hat}
    - {id: ginkou, label: "銀行の人", voice: 13, pitch: -0.1, item: hat}
    - {id: ishida, label: "石田退三", voice: 13, pitch: 0.02, item: hat}
    - {id: kumiai, label: "組合の人", voice: 12, pitch: -0.06}
scenes:
  - id: hook
    title: ""
    background: il_toy_ima
    bgm: shuffle_shuffle
    stage:
