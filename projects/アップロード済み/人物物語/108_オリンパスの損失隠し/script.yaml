  - speaker: tsumugi
    emotion: thinking
    text: 2011年に会社が示した目標は、約65億円よ。
  - speaker: zundamon
    emotion: surprised
    text: '[14分の1|じゅうよんぶんのいち]！？'
  - speaker: tsumugi
    emotion: normal
    text: しかも買って1年後、3社ののれん557億円を減損したの。
  - speaker: zundamon
    emotion: surprised
    text: 1年で、ほとんど消したのだ！
  - speaker: tsumugi
    emotion: normal
