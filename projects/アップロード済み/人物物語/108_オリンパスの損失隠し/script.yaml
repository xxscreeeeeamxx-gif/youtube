  - speaker: tsumugi
    emotion: normal
    text: 2026年3月期の売上は、1兆107億円。
  - speaker: zundamon
    emotion: surprised
    text: 1兆円を超えてるのだ！
  - speaker: tsumugi
    emotion: thinking
    text: でも営業利益は971億円で、前の年の1625億円から減ったわ。
  - speaker: tsumugi
    emotion: normal
    text: 世界で約2000人分の仕事を減らす計画も、進めてるの。
  - speaker: tsumugi
    emotion: normal
    text: 一方で6月には、イスラエルの会社を約433億円で買って子会社にしたわ。
  - speaker: zundamon
    emotion: thinking
    text: 減らしながら、買ってもいるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: それから10月、アメリカの食品医薬品局から警告書を受け取ったの。
  - speaker: tsumugi
    emotion: normal
    text: 対象の6つの拠点には、ジャイラスのアメリカの拠点も入ってる。
  - speaker: zundamon
    emotion: surprised
    text: ジャイラスって、あの！？
  - speaker: tsumugi
    emotion: thinking
    text: 同じ会社の拠点でも、今回は品質の指摘。2011年の会計の不正とは別の話よ。
  - speaker: tsumugi
    emotion: normal
    text: 19日には、国内3か所で作った一部の製品に輸入警告も出たわ。
  - speaker: tsumugi
    emotion: normal
    text: 会社は、すでに手元にある製品は説明書どおりに使えば安全で有効だとしてる。
  - speaker: tsumugi
    emotion: normal
    text: 10月の発表では、業績の予想は変えないとしてたわ。
