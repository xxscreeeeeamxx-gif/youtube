scenes:
# ---- 先出し（2011年10月14日・本社の取締役会） ----
- id: co_kainin
  title: ''
  background: ol_torishimari
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 社長, emotion: thinking}
  - {who: kikukawa, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2011年10月14日、オリンパスの取締役会。社長の著書によれば、会長はこう切り出します。
    reading: にせん じゅういちねん じゅうがつ じゅうよっか、おりんぱすの とりしまりやくかい。しゃちょうの ちょしょに よれば、かいちょうわ こう きりだします。
  - speaker: kikukawa
    emotion: normal
    text: 議題を変えます。ウッドフォード氏の、社長からの解職です。
  - speaker: kikukawa
    emotion: angry
    text: ウッドフォード氏は利害関係があるため、発言は許されません。
    se: don
  - speaker: reimu
    text: 自分以外の全員が、手を挙げました。
    reading: じぶん いがいの ぜんいんが、てお あげました。
    telops:
    - {text: "賛成　社長以外の全員", size: lg, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
- id: co_bus
  title: ''
  background: ol_yakuin
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 元社長, emotion: sad}
  - {who: shain, x: 0.7, emotion: thinking}
  cuts:
  - speaker: shain
    emotion: thinking
    text: マンションの鍵と、パソコンと携帯をお返しください。
  - speaker: zundamon
    emotion: sad
    text: ……空港へは？
  - speaker: shain
    emotion: normal
    text: バスで行ってください。
    beat: true
  - speaker: reimu
    background: ol_kuko
    text: この男は、マイケル・ウッドフォード。オリンパスの社長に就いて、半年でした。
    reading: この おとこわ、まいける うっどふぉーど。おりんぱすの しゃちょうに ついて、はんとし でした。
  - speaker: reimu
    text: 1か月足らずで、会社は1990年代からの損失隠しを認めます。
    reading: いっかげつ たらずで、かいしゃわ せんきゅうひゃく きゅうじゅうねんだいからの そんしつかくしお みとめます。
- id: hook
  title: ''
  background: ol_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ マンションの理事長になったのだ！
  - speaker: tsumugi
    emotion: normal
    text: 帳簿は見た？
  - speaker: zundamon
    emotion: normal
    text: 前の理事長が、見なくていいって。
  - speaker: tsumugi
    emotion: thinking
    text: ……それ、一番見るべきやつよ。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: オリンパスの社長も、自分の会社の買収を知らされなかったの。
    telops:
    - {text: "社長にも知らされない買収", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: thinking
    text: それを問いただした社長が、解任されたのよ。
  - speaker: zundamon
    emotion: surprised
    text: 問いただしたらクビ！？ 何を隠してたのだ！？
# ---- 2009年・尾瀬（記者の側） ----
- id: card2009
  title: ''
  background: ol_card_2009
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 2009年8月。経済記者の山口義正が、オリンパスに勤める友人と尾瀬を歩いていました。
    reading: にせん きゅうねん はちがつ。けいざい きしゃの やまぐち よしまさが、おりんぱすに つとめる ゆうじんと おぜお あるいて いました。
- id: p1_oze
  title: 尾瀬の山道
  background: ol_oze
  stage:
  - {who: yamaguchi, x: 0.3, flip: true, emotion: normal}
  - {who: yujin, x: 0.7, emotion: thinking}
  cuts:
  - speaker: yujin
    emotion: thinking
    text: ウチの会社は、バカなことをやっている。
  - speaker: yujin
    emotion: normal
    text: 売上が[2〜3億円|にさんおくえん]の会社を、約300億円で買ってるんだ。
  - speaker: reimu
    text: 山口は取材を重ねます。この買収を、のちに社長になる英国人は知らされていません。
    reading: やまぐちわ しゅざいお かさねます。この ばいしゅうお、のちに しゃちょうに なる えいこくじんわ しらされて いません。
# ---- 2011年2月・社長に選ばれる ----
- id: card2011
  title: ''
  background: ol_card_2011
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 2011年2月。オリンパスが、英国人を社長に選びます。
    reading: にせん じゅういちねん にがつ。おりんぱすが、えいこくじんお しゃちょうに えらびます。
- id: p1_shimei
  title: 英国人の社長
  background: ol_yakuin
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 社長, emotion: normal}
  - {who: kikukawa, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: マイケル・ウッドフォード、50歳。20歳で英国の子会社に入り、30年オリンパスで働いてきました。
    reading: まいける うっどふぉーど、ごじゅっさい。はたちで えいこくの こがいしゃに はいり、さんじゅうねん おりんぱすで はたらいて きました。
  - speaker: reimu
    text: 会社は、グローバル化の取り組みをさらに加速させるためと発表しました。
    reading: かいしゃわ、ぐろーばるかの とりくみお さらに かそく させる ためと はっぴょう しました。
  - speaker: zundamon
    emotion: normal
    text: ……お引き受けします。
  - speaker: reimu
    text: 会社を前に進める役を任された男は、8か月後に追い出されます。
    reading: かいしゃお まえに すすめる やくお まかされた おとこわ、はちかげつごに おいだされます。
# ---- 2011年7〜8月・社長だけが知らない記事 ----
- id: p2_mail
  title: 2通のメール
  background: ol_hotel
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.5, tag: 社長, emotion: normal}
  cuts:
  - speaker: reimu
    text: 7月。ドイツに出張していた社長に、メールが2通届きます。
    reading: しちがつ。どいつに しゅっちょう して いた しゃちょうに、めーるが につう とどきます。
  - speaker: zundamon
    emotion: normal
    text: 同僚からだ。最新の[FACTA|ファクタ]を、読みましたか？
  - speaker: zundamon
    emotion: thinking
    text: 友人からも、同じことを。
  - speaker: zundamon
    emotion: surprised
    text: '[FACTA|ファクタ]……？ 聞いたことのない雑誌だ。'
  - speaker: reimu
    text: 7月20日発売の月刊誌、FACTAの8月号のことでした。
    reading: しちがつ はつか はつばいの げっかんし、ふぁくたの はちがつごうの ことでした。
- id: p2_tokyo
  title: 社長だけが知らない
  background: ol_yakuin
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 社長, emotion: thinking}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 東京に戻った月曜日。社内の誰も、記事のことを口にしません。
    reading: とうきょうに もどった げつようび。しゃないの だれも、きじの ことお くちに しません。
  - speaker: zundamon
    emotion: normal
    text: 例の[FACTA|ファクタ]の記事は、読んだかい？
  - speaker: shain
    emotion: sad
    text: ……はい。
  - speaker: zundamon
    emotion: normal
    text: 何が書いてある？
  - speaker: shain
    emotion: thinking
    text: 会長から、社長には言うなと言われていまして……。
  - speaker: zundamon
    emotion: surprised
    text: 社長の私に、言うなと？
    se: gaan
  - speaker: shain
    emotion: sad
    text: 申し訳ありません。
  - speaker: zundamon
    emotion: thinking
    text: 中身だけでも、教えてくれないか。
  - speaker: shain
    emotion: sad
    text: ……私の口からは。
- id: p2_kokunai
  title: 国内のことだから
  background: ol_kaigi
  bgm: serious
  stage:
  - {who: zundamon, x: 0.22, flip: true, tag: 社長, emotion: thinking}
  - {who: kikukawa, x: 0.56, emotion: normal}
  - {who: mori, x: 0.78, emotion: normal}
  cuts:
  - speaker: reimu
    text: 8月。社長は、会長と副社長に説明を求めます。
    reading: はちがつ。しゃちょうわ、かいちょうと ふくしゃちょうに せつめいお もとめます。
  - speaker: reimu
    text: 本人は著書に、記事のほんの一部でも本当なら首が飛ぶと書いています。
    reading: ほんにんわ ちょしょに、きじの ほんの いちぶでも ほんとうなら くびが とぶと かいて います。
  - speaker: zundamon
    emotion: normal
    text: 記事の英訳を読みました。[零細企業|れいさいきぎょう]3社の買収に700億円も投じた、と。
  - speaker: zundamon
    emotion: normal
    text: 国内3社の買収について、説明してください。
  - speaker: reimu
    text: 本人によれば、2人は詳しい説明を断ってこう言いました。
    reading: ほんにんに よれば、ふたりわ くわしい せつめいお ことわって こう いいました。
  - speaker: kikukawa
    emotion: normal
    text: 国内のことだから、あなたは知らなくていい。
    telops:
    - {text: "会長・副社長（本人によれば）「あなたは知らなくていい」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: ……知らなくていい？
    beat: true
  - speaker: zundamon
    emotion: angry
    text: 社長は私です。最後の責任を負うのは、私です。
- id: p2_nedan
  title: ''
  background: ol_kaigi
  cuts:
  - speaker: reimu
    text: 3社は、資源リサイクルと電子レンジ用の調理容器と健康食品の会社でした。
    reading: さんしゃわ、しげん りさいくると でんしれんじようの ちょうり ようきと けんこう しょくひんの かいしゃでした。
  - speaker: reimu
    text: のちの報告書によると、健康食品の会社の株はファンドが1株5万円で手に入れたもの。
    reading: のちの ほうこくしょに よると、けんこう しょくひんの かいしゃの かぶわ ふぁんどが ひとかぶ ごまんえんで てに いれた もの。
  - speaker: reimu
    text: オリンパスはそれを1株2050万円で。1000円のラーメンに、41万円を払う倍率です。
    reading: おりんぱすわ それお ひとかぶ にせん ごじゅうまんえんで。せんえんの らーめんに、よんじゅう いちまんえんお はらう ばいりつです。
    telops:
    - {text: "1株5万円 → 2050万円（410倍）", size: xl, position: top-center, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: 社長が問うのは、もう1つ。英国の会社ジャイラスを買ったときの、助言の報酬です。
    reading: しゃちょうが とうのわ、もう ひとつ。えいこくの かいしゃ じゃいらすお かった ときの、じょげんの ほうしゅうです。
  - speaker: reimu
    text: その支払いの先に何があったのか、社長はまだ知りません。
    reading: その しはらいの さきに なにが あったのか、しゃちょうわ まだ しりません。
# ---- 2011年9月・6通の手紙 ----
- id: p3_tegami
  title: 6通の手紙
  background: ol_yakuin
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 社長, emotion: normal}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 9月。社長は取締役会にあてて、正式な手紙を書きます。
    reading: くがつ。しゃちょうわ とりしまりやくかいに あてて、せいしきな てがみお かきます。
  - speaker: zundamon
    emotion: normal
    text: 説明を求める手紙だ。届けてくれ。
  - speaker: shain
    emotion: normal
    text: お届けします。
  - speaker: zundamon
    emotion: thinking
    text: 返事は？
  - speaker: shain
    emotion: sad
    text: ……まだです。
  - speaker: zundamon
    emotion: normal
    text: では、2通目だ。
  - speaker: shain
    emotion: sad
    text: ……まだです。
  - speaker: zundamon
    emotion: angry
    text: 3通目。4通目。
  - speaker: shain
    emotion: sad
    text: まだです。まだです。
  - speaker: zundamon
    emotion: angry
    text: 5通目と6通目は、監査法人の幹部にも写しを送ってくれ。
  - speaker: shain
    emotion: surprised
    text: 外部にも、ですか。
  - speaker: zundamon
    emotion: normal
    text: 外にもだ。
  - speaker: shain
    emotion: sad
    text: ……満足なお返事は、どれにもありません。
  - speaker: zundamon
    emotion: sad
    text: 6通出して、まともな答えは1つも無しか。
    se: chin
  - speaker: reimu
    text: 記事の続報が出ても、役員やメディアや株主は動かない。社長はそのことに、衝撃を受けたと語っています。
    reading: きじの ぞくほうが でても、やくいんや めでぃあや かぶぬしわ うごかない。しゃちょうわ その ことに、しょうげきお うけたと かたって います。
- id: p3_ceo
  title: CEOになる
  background: ol_torishimari
  bgm: serious
  stage:
  - {who: zundamon, x: 0.22, flip: true, tag: 社長, emotion: normal}
  - {who: yakuin, x: 0.56, emotion: thinking}
  - {who: yakuin2, x: 0.78, emotion: normal}
  cuts:
  - speaker: reimu
    text: 9月30日の取締役会。社長は、最高経営責任者のCEOも任されます。10月1日付けです。
    reading: くがつ さんじゅうにちの とりしまりやくかい。しゃちょうわ、さいこう けいえい せきにんしゃの しーいーおーも まかされます。じゅうがつ ついたちづけです。
  - speaker: yakuin2
    emotion: normal
    text: '[CEO|シーイーオー]の肩書まで、求めたそうですね。'
  - speaker: yakuin
    emotion: thinking
    text: 4月から、会長がお持ちだった肩書ですよ。
  - speaker: zundamon
    emotion: normal
    text: 権限がなければ、会社は経営できません。責任も持てません。
  - speaker: yakuin
    emotion: thinking
    text: なぜ外部の監査に、調査を頼んでいるんです。
  - speaker: yakuin2
    emotion: normal
    text: ジャイラスを買って3年も経つのに、なぜ今さら気にするんです。
  - speaker: zundamon
    emotion: surprised
    text: 7億ドル近い助言の費用です。問題にするのは、当たり前でしょう。
  - speaker: reimu
    text: 本人はこの日の役員会を、非常におかしな雰囲気だったと語っています。
    reading: ほんにんわ この ひの やくいんかいお、ひじょうに おかしな ふんいきだったと かたって います。
# ---- 2011年10月・ロンドン、PwCの報告書 ----
- id: p3_pwc
  title: 買収額の3割
  background: ol_kaigi
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 社長, emotion: thinking}
  - {who: pwc, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 10月3日。社長はロンドンに戻り、会計事務所のPwCに調べてもらいます。
    reading: じゅうがつ みっか。しゃちょうわ ろんどんに もどり、かいけい じむしょの ぴーだぶりゅーしーに しらべて もらいます。
  - speaker: zundamon
