  - speaker: zundamon
    emotion: thinking
    text: 決算書の、のれんと減損の欄を見ればいいのだ。
  - speaker: tsumugi
    emotion: normal
    text: 働く人へ。この会社では2007年にも、上司のことを通報した社員が配置転換されてる。
  - speaker: tsumugi
    emotion: normal
    text: 損失隠しとは別の件で、裁判で違法とされたわ。
  - speaker: tsumugi
    emotion: normal
    text: 2022年6月からは、窓口の担当者が秘密を漏らすと罰則の対象よ。
  - speaker: tsumugi
    emotion: thinking
    text: 通報する前に、会社の規程と行政の窓口を確かめてね。
  - speaker: zundamon
    emotion: normal
    text: 守る仕組みを、先に調べるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 報告書は、事を荒立てず[大過|タイカ]なく職務を乗り切ろうとする意識も原因に挙げてるわ。
  - speaker: zundamon
    emotion: thinking
    text: 見て見ぬふり、ということか。
# ---- 今 ----
- id: gendai
