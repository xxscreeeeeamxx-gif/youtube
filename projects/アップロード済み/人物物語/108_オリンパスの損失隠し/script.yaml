meta:
  title: オリンパス元社長「私を辞めさせれば“嵐は去る”とでも思ったのだろう」会社は損失隠しを認めた【ずんだもん解説】
  slug: olympus-woodford
  hook_line: 社長にも知らされない買収を問いただした英国人社長は、なぜ解任されたのか。
  summary: 2011年10月14日の朝、オリンパスの取締役会で、社長のマイケル・ウッドフォードが解任されます。20歳で英国の子会社に入り、社長に就いて半年でした。彼が問いただしていたのは、社長にも知らされなかった買収と、その支払い。会社は、経営の方向性と手法の食い違いを理由に挙げました。何が隠されていたのか。本人の著書と会見、会社の発表、第三者委員会の報告書、判決を並べて、再現ドラマでたどります。（2026年11月時点）
  sources:
  - オリンパス「一連の報道に対する当社の見解について」（2011年10月19日） https://www.olympus.co.jp/ir/data/announcement/pdf/nr111019.pdf
  - オリンパス「過去の損失計上先送りに関するお知らせ」（2011年11月8日） https://www.olympus.co.jp/ir/data/announcement/pdf/nr111108.pdf
  - オリンパス 第三者委員会「調査報告書 要約版」（2011年12月6日） https://www.olympus.co.jp/ir/data/announcement/pdf/if111206corpj_1.pdf
  - 証券取引等監視委員会「オリンパス株式会社に係る有価証券報告書等虚偽記載事件の告発について」（2012年3月6日） https://www.fsa.go.jp/sesc/news/c_2012/2012/20120306-1.html
  - 東洋経済オンライン「不透明なカネの流れ、必ず日本に戻って真相を究明する」（2011年10月21日） https://toyokeizai.net/articles/-/7971
  - 日本経済新聞「オリンパス粉飾 旧経営陣、594億円の賠償確定」（2020年10月26日） https://www.nikkei.com/article/DGXMZO65459660W0A021C2CR8000/
  tags:
  - オリンパス
  - オリンパス事件
  - マイケル・ウッドフォード
  - 損失隠し
  - 粉飾決算
  - 第三者委員会
  - 内部告発
  - FACTA
  - 菊川剛
  - 企業統治
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 平成史
