# olympus-woodford 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 社長・元社長 / label: 会長・副社長・山口義正・高山社長・笹社長 ほか）とテロップ・章タイトルは表示専用なのでタグを付けていない。
# ウッドフォード・ジャイラス・ボブ・ホワイトはカタカナなので台帳に入れていない。
# 山田・山口・高山・笹は名札かナレにだけ出る（山口は編集者の「山口さん」で、標準の読みで読める）。
# 特別背任（はいにん）は読みに「は」を含むのでタグにしない。VOICEVOX は標準でトクベツハイニンと読む。
# 2026-11-01 見直し: 形骸化はタグを付けるとケイガ/イカと切れるので台帳から外し、素のまま読ませる（ケエガイカ）。
# 菊川・成田行き・大過のタグはカタカナで書いた（ひらがなだと キク/カワトモリガ、ナリ/タユキ、タ/イカナク と切れた）。
# 「表に」は [表|おもて] タグで直した（素だと ヒョウニ）。台帳には入れていない（発表・代表にも掛かるため）。
# 忸怩（ジクジ）は素で正しく読めたので台帳に入れていない。
