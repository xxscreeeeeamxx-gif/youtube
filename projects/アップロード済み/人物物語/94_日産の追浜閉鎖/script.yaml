scenes:
# ---- 先出し（2025年7月15日の会見） ----
- id: co_kaiken
  title: ''
  background: ns_kaiken
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 記者, emotion: normal}
  - {who: espinosa, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 2025年7月15日。日産の社長が、追浜工場の車づくりを終えると発表します。
    reading: にせんにじゅうごねん しちがつ じゅうごにち。にっさんの しゃちょうが、おっぱま こうじょうの くるまづくりお おえると はっぴょう します。
  - speaker: espinosa
    emotion: thinking
    text: '[追浜|オッパマ]は何十回も足を運んだ工場ですし、まさに日産のアイコンなのです。'
  - speaker: espinosa
    emotion: thinking
    text: なのでこの判断についてはキャリアでも一番の苦渋の決断でした。
    telops:
    - {text: "日産社長（通訳）　一番の苦渋の決断", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: ……60年以上、車を作ってきた工場です。
  - speaker: reimu
    text: 日産の最終損益は2年続けて赤字。合わせて約1兆2000億円です。
    reading: にっさんの さいしゅう そんえきわ にねん つづけて あかじ。あわせて やく いっちょう にせんおくえんです。
    telops:
    - {text: "最終赤字　2年で約1兆2000億円", size: lg, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: 技術の日産に、何が起きたのでしょうか。
    reading: ぎじゅつの にっさんに、なにが おきたのでしょうか。
# ---- 今の部屋（車の鍵） ----
- id: hook
  title: ''
  background: ns_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ ボクの車の鍵なのだ。日産のノートなのだ！
  - speaker: tsumugi
    emotion: normal
    text: そのノート、今は[追浜|オッパマ]工場で作ってるのよ。
  - speaker: zundamon
    emotion: surprised
    text: 車づくりをやめる工場なのだ！？
    se: bikkuri
  - speaker: tsumugi
    emotion: thinking
    text: 最終赤字が2年続いて、1兆2000億円。そのなかで決めたの。
  - speaker: zundamon
    emotion: thinking
    text: 技術の日産が、なんでそこまで……。
  - speaker: tsumugi
    emotion: normal
    text: 答えは今の社長の、ある一言にあるの。
# ---- 仕組み：とにかく販売台数 ----
- id: ch1_volume
  title: とにかく販売台数
  background: ns_yakuin
  bgm: curious
  stage:
  - {who: espinosa, x: 0.5, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 2026年7月。エスピノーサ社長は通信社の取材で、以前の日産をこう語りました。
    reading: にせんにじゅうろくねん しちがつ。えすぴのーさ しゃちょうわ つうしんしゃの しゅざいで、いぜんの にっさんお こう かたりました。
  - speaker: espinosa
    emotion: thinking
    text: 以前は『とにかく販売台数、販売台数、販売台数』という感じだった。
    telops:
    - {text: "日産社長　以前は「とにかく販売台数」", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: espinosa
    emotion: normal
    text: これは自動車会社の運営として好ましい方法ではない
- id: ch1_power88
  title: ''
  background: ns_kaiken
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 記者, emotion: normal}
  - {who: kisha2, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2011年6月。日産は新しい中期計画を発表します。名前は、日産パワー88。
    reading: にせん じゅういちねん ろくがつ。にっさんわ あたらしい ちゅうき けいかくお はっぴょう します。なまえわ にっさん ぱわー えいてぃえいと。
  - speaker: kisha2
    emotion: normal
    text: '[88|エイティエイト]って、[何|なん]の数字だ。'
  - speaker: zundamon
    emotion: normal
    text: 世界シェア8%と、営業利益率8%。2016年度までにです。
    telops:
    - {text: "パワー88　世界シェア8%・利益率8%", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: kisha2
    emotion: thinking
    text: 利益率8%って、どのくらいだ。
  - speaker: zundamon
    emotion: happy
    text: 100円売って、8円もうけます。
    se: hirameki
  - speaker: kisha2
    emotion: normal
    text: シェア8%は？
  - speaker: zundamon
    emotion: normal
    text: 世界で売れる車の、100台に8台です。
  - speaker: kisha2
    emotion: thinking
    text: 台数を、一気に増やす計画か。
  - speaker: reimu
    text: どちらの8%にも、日産は届きませんでした。
    reading: どちらの はちぱーせんとにも、にっさんわ とどきませんでした。
  - speaker: reimu
    text: この計画の投資が余った生産能力を残した、と会社はのちに説明します。
    reading: この けいかくの とうしが あまった せいさん のうりょくお のこしたと、かいしゃわ のちに せつめい します。
- id: ch1_america
  title: 値引きとレンタカー
  background: ns_america
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 記者, emotion: normal}
  - {who: dealer, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 2020年ごろ。アメリカの日産の販売店です。
    reading: にせんにじゅうねん ごろ。あめりかの にっさんの はんばいてんです。
  - speaker: dealer
    emotion: happy
    text: いらっしゃい！ 今ならローグが3000ドル引きだよ！
  - speaker: zundamon
    emotion: surprised
    text: 3000ドル！？ 新車ですよね。
  - speaker: dealer
    emotion: normal
    text: 新車さ。モデルが出てから、だいぶたってるけどね。
  - speaker: zundamon
    emotion: normal
    text: どのくらいですか。
  - speaker: dealer
    emotion: normal
    text: 日産の車は平均で5年以上。業界のふつうは4年くらいだ。
  - speaker: zundamon
    emotion: thinking
    text: 古くなった分を、値引きで売る……。
  - speaker: dealer
    emotion: happy
    text: それに日産は、レンタカー会社にもまとめて売ってるんだ！
  - speaker: zundamon
    emotion: surprised
    text: まとめて！？
  - speaker: dealer
    emotion: happy
    text: 台数は出るよ。台数だけは。
    beat: true
  - speaker: reimu
    text: 2019年、当時の社長は値引きとレンタカー向けに頼り、ブランドの価値が下がったと説明しています。
    reading: にせん じゅうくねん とうじの しゃちょうわ ねびきと れんたかーむけに たより、ぶらんどの かちが さがったと せつめい して います。
  - speaker: zundamon
    emotion: thinking
    text: 安く売るほど、日産の名前が安くなるのだ……。
- id: ch1_hybrid
  title: ''
  background: ns_showroom
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 記者, emotion: normal}
  - {who: dealer, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 2024年。アメリカでは、ハイブリッド車の人気が急に高まります。
    reading: にせん にじゅうよねん。あめりかでわ、はいぶりっどしゃの にんきが きゅうに たかまります。
  - speaker: dealer
    emotion: thinking
    text: お客さんがみんな、ハイブリッドはあるかって聞くんだ。
  - speaker: zundamon
    emotion: normal
    text: 日産の答えは。
  - speaker: dealer
    emotion: sad
    text: ……うちには、無い。
    background: ns_showroom_kara
    se: chin
  - speaker: zundamon
    emotion: surprised
    text: 日本には、[e-POWER|イーパワー]があるのに！？
  - speaker: dealer
    emotion: sad
    text: アメリカには、まだ来てないんだ。
  - speaker: zundamon
    emotion: thinking
    text: 技術の日産なのに、売れ筋が無い……。
  - speaker: reimu
    text: 北米の上期の営業損益は、前の年の2414億円の黒字から、41億円の赤字に変わります。
    reading: ほくべいの かみきの えいぎょう そんえきわ まえの としの にせん よんひゃく じゅうよんおくえんの くろじから、よんじゅういちおくえんの あかじに かわります。
- id: ch1_tsukon
  title: 痛恨の極み
  background: ns_kaiken
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 記者, emotion: normal}
  - {who: uchida, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 2024年11月7日。上期の決算で、営業利益は前の年の約1割に落ちました。
    reading: にせん にじゅうよねん じゅういちがつ なのか。かみきの けっさんで、えいぎょう りえきわ まえの としの やく いちわりに おちました。
  - speaker: zundamon
    emotion: normal
    text: 北米の赤字について、お聞かせください。
  - speaker: uchida
    emotion: thinking
    text: 厳しい状況を迎えていることは痛恨の極み。
    telops:
    - {text: "内田社長　痛恨の極み", size: lg, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: uchida
    emotion: thinking
    text: 顧客ニーズに応える商品をタイムリーに提供できていないことも課題
  - speaker: zundamon
    emotion: normal
    text: ハイブリッドが、無いということですか。
  - speaker: reimu
    text: 日産は、アメリカで急に伸びたハイブリッドなどを持っていない、と説明しました。
    reading: にっさんわ あめりかで きゅうに のびた はいぶりっどなどお もって いないと、せつめい しました。
  - speaker: reimu
    text: 9000人の削減と、世界の生産能力の2割削減も発表します。
    reading: きゅうせんにんの さくげんと、せかいの せいさん のうりょくの にわり さくげんも はっぴょう します。
  - speaker: uchida
    emotion: normal
    text: 今回の結果を踏まえ経営としての責任を示すため、私の報酬を今月から50％返上する。
  - speaker: zundamon
    emotion: thinking
    text: 台数のために広げた工場を、今度は減らすのだ……。
    se: shobon
  - speaker: reimu
    text: この年度の営業利益率は0.6%。100円売って、残るのは60銭です。
    reading: この ねんどの えいぎょう りえきりつわ れいてんろく ぱーせんと。ひゃくえん うって、のこるのわ ろくじっせんです。
  - speaker: reimu
    text: なぜ、ここまで来たのか。日産が一度目の立て直しに挑んだ、1999年から見ていきます。
    reading: なぜ ここまで きたのか。にっさんが いちどめの たてなおしに いどんだ、せんきゅうひゃく きゅうじゅうくねんから みて いきます。
# ---- 1999年 リバイバルプラン ----
- id: card1999
  title: ''
  background: ns_card_1999
  bgm: curious
  cuts:
  - speaker: reimu
    text: 1999年3月。赤字の年が続いていた日産は、フランスのルノーから36.8%の出資を受けます。
    reading: せんきゅうひゃく きゅうじゅうくねん さんがつ。あかじの としが つづいて いた にっさんわ、ふらんすの るのーから さんじゅうろくてんはち ぱーせんとの しゅっしお うけます。
- id: ch2_renault
  title: ''
  background: ns_paris
  cuts:
  - speaker: reimu
    text: 6月、カルロス・ゴーン氏がCOOに。9月には、ルノーから17人の管理職が来ます。
    reading: ろくがつ かるろす ごーんしが しーおーおーに。くがつにわ、るのーから じゅうななにんの かんりしょくが きます。
- id: ch2_plan
  title: 2万1000人と5つの工場
  background: ns_kaiken
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 記者, emotion: surprised}
  - {who: kisha2, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 10月18日。日産が再建の計画を発表します。記者は、この年に入ったばかりの新人でした。
    reading: じゅうがつ じゅうはちにち。にっさんが さいけんの けいかくお はっぴょう します。きしゃわ この としに はいった ばかりの しんじんでした。
  - speaker: kisha2
    emotion: normal
    text: おい新人。資料の数字、読み上げてみろ。
  - speaker: zundamon
    emotion: surprised
    text: はいっ！ 人員の削減、2万1000人……。
  - speaker: kisha2
    emotion: normal
    text: それから。
  - speaker: zundamon
    emotion: thinking
    text: '[村山|ムラヤマ]工場など、5つの工場を閉鎖……。'
    telops:
    - {text: "1999年　2万1000人削減・5工場閉鎖", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: kisha2
    emotion: normal
    text: 部品を買う会社も、1145社から600社に絞るそうだ。
  - speaker: zundamon
    emotion: surprised
    text: ほぼ半分！？
  - speaker: kisha2
    emotion: normal
    text: 約束も3つある。2000年度に黒字、2002年度に利益率4.5%超え。
  - speaker: kisha2
    emotion: normal
    text: それに借金を半分。
  - speaker: zundamon
    emotion: thinking
    text: 1つでも外れたら、どうなるんですか。
  - speaker: reimu
    text: 報道によれば、1つでも外れたら経営陣が全員辞める、という約束でした。
    reading: ほうどうに よれば ひとつでも はずれたら けいえいじんが ぜんいん やめる という やくそくでした。
  - speaker: zundamon
    emotion: surprised
    text: 全員！？ 本気なのだ……。
  - speaker: kisha2
    emotion: thinking
    text: 新人。お前が辞めるわけじゃないぞ。
    beat: true
  - speaker: reimu
    text: 26年後。日産はもう一度、2万人と工場の閉鎖を発表することになります。
    reading: にじゅうろくねんご。にっさんわ もう いちど、にまんにんと こうじょうの へいさお はっぴょう する ことに なります。
- id: ch2_vji
  title: V字回復
  background: ns_kaigi
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 記者, emotion: normal}
  - {who: ghosn, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1999年度の最終損益は、6844億円の赤字でした。そして2001年5月の決算です。
    reading: せんきゅうひゃく きゅうじゅうくねんどの さいしゅう そんえきわ、ろくせん はっぴゃく よんじゅうよんおくえんの あかじでした。そして にせんいちねん ごがつの けっさんです。
  - speaker: zundamon
    emotion: surprised
    text: 2000年度の最終利益……3311億円！？
    background: ns_kaigi_up
    se: levelup
    telops:
    - {text: "最終利益3311億円　過去最高", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: ghosn
    emotion: happy
    text: 我々は[NRP|エヌアールピー]発表後の一年目に、我々の知り得る限り
  - speaker: ghosn
    emotion: happy
    text: 当社の歴史上最高の業績をあげる事ができた。
  - speaker: zundamon
    emotion: surprised
    text: 6844億円の赤字から、1年で……。
  - speaker: reimu
    text: 翌年には、3つの約束を1年早く達成したと説明します。
    reading: よくねんにわ、みっつの やくそくお いちねん はやく たっせい したと せつめい します。
  - speaker: zundamon
    emotion: happy
    text: 数字で約束して、数字で返す。覚えたのだ！
  - speaker: reimu
    text: 次の計画の約束には、販売を100万台増やすことが入りました。
    reading: つぎの けいかくの やくそくにわ、はんばいお ひゃくまんだい ふやす ことが はいりました。
  - speaker: zundamon
    emotion: thinking
    text: 次は、台数の約束……。
  - speaker: reimu
    text: 数字で立ち直った会社は、なぜ数字で崩れていったのか。
    reading: すうじで たちなおった かいしゃわ、なぜ すうじで くずれて いったのか。
# ---- 2016年 追浜のe-POWER ----
- id: card2016
  title: ''
