- id: ch4_taiho
  title: ''
  background: ns_kuko
  cuts:
  - speaker: reimu
    text: 東京地検特捜部が、日産のゴーン会長とケリー代表取締役を逮捕します。
    reading: とうきょう ちけん とくそうぶが、にっさんの ごーん かいちょうと けりー だいひょう とりしまりやくお たいほ します。
  - speaker: reimu
    text: 容疑は、ゴーン会長の報酬を有価証券報告書に少なく書いた、金融商品取引法違反でした。
    reading: ようぎわ ごーん かいちょうの ほうしゅうお ゆうか しょうけん ほうこくしょに すくなく かいた、きんゆう しょうひん とりひきほう いはんでした。
  - speaker: reimu
    text: ゴーン氏はのちに、容疑は事実無根だと主張します。
    reading: ごーんしわ のちに、ようぎわ じじつ むこんだと しゅちょう します。
- id: ch4_saikawa
  title: ゴーン統治の負の側面
  background: ns_kaiken
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 記者, emotion: surprised}
  - {who: saikawa, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 同じ日の夜遅く、西川社長がひとりで会見に立ちます。
    reading: おなじ ひの よる おそく、さいかわ しゃちょうが ひとりで かいけんに たちます。
  - speaker: saikawa
    emotion: thinking
    text: 非常識の時間の会見で申し訳ありません
  - speaker: zundamon
    emotion: normal
    text: 会社は、何を見つけたんですか。
  - speaker: reimu
    text: 日産は、内部通報を受けて数か月、社内で調べてきたと発表しました。
    reading: にっさんわ ないぶ つうほうお うけて すうかげつ、しゃないで しらべて きたと はっぴょう しました。
  - speaker: reimu
    text: 日産が挙げた不正は、報酬の過少な記載と、目的を偽った投資資金や私的な経費の支出です。
    reading: にっさんが あげた ふせいわ ほうしゅうの かしょうな きさいと、もくてきお いつわった とうし しきんや してきな けいひの ししゅつです。
  - speaker: zundamon
    emotion: thinking
    text: 今の、お気持ちは。
  - speaker: saikawa
    emotion: angry
    text: 残念という言葉ではなく、強い憤りということ。
  - speaker: saikawa
    emotion: thinking
    text: 私としては落胆ということを強く覚えています
  - speaker: zundamon
    emotion: normal
    text: なぜ、止められなかったんですか。
  - speaker: saikawa
    emotion: thinking
    text: ふり返ると、2005年にルノーと日産の[CEO|シーイーオー]を兼務することになり
  - speaker: saikawa
    emotion: thinking
    text: その結果として将来的に何が起きるのかということをあまり議論しませんでした。
  - speaker: saikawa
    emotion: normal
    text: その中で権力が集中していったと言えるのではないかと思っています
  - speaker: saikawa
    emotion: angry
    text: 長年にわたるゴーン統治の[負|ふ]の側面と言わざるを得ません
    se: don
    telops:
    - {text: "西川社長　ゴーン統治の負の側面", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: ……20年近く、日産の顔だった人なのだ。
  - speaker: reimu
    text: 3日後、取締役会はゴーン氏の会長職を解きます。
    reading: みっかご、とりしまりやくかいわ ごーんしの かいちょうしょくお ときます。
