meta:
  title: 「販売台数、販売台数、販売台数」を追った日産、最終赤字が2年続き追浜工場の生産終了へ【ずんだもん解説】
  slug: nissan-oppama
  summary: 2025年7月、日産の社長は60年以上続いた追浜工場の車づくりを終えると発表しました。最終損益は2年続けて赤字です。1999年にルノーと組み、数字で立ち直ったはずの会社に何が起きていたのか。1999年から日産を追ってきた記者の目で、拡大の時代の「台数」、会長の逮捕とトップの交代、ホンダとの52日の統合協議、そして再建のいままでを、経営者の会見の言葉と双方の言い分を並べて再現ドラマでたどります。（2026年10月時点）
  hook_line: 技術の日産は、なぜ2年で約1兆2000億円の最終赤字を出したのか。
  sources:
  - 日産「追浜工場の車両生産を日産自動車九州に統合へ」2025年7月15日 https://global.nissannews.com/ja-JP/releases/250715-01-j
  - 日産「2025年度通期決算」2026年5月13日 https://global.nissannews.com/ja-JP/releases/260513-01-j
  - 日産「経営再建計画 Re:Nissanを発表」2025年5月13日 https://global.nissannews.com/ja-JP/releases/250513-02-j
  - 日産「日産リバイバルプラン」1999年10月18日 https://www.nissan-global.com/JP/DOCUMENT/PDF/FINANCIAL/REVIVAL/DETAIL/1999/fs_re_detail1999h.pdf
  - 日産「Hondaとの経営統合の検討に関する基本合意書」2024年12月23日 https://global.nissannews.com/ja-JP/releases/241223-01-j
  - 日産「2026年度第1四半期決算」2026年8月3日 https://global.nissannews.com/ja-JP/releases/260803-01-j
  tags:
  - 日産
  - 追浜工場
  - 日産自動車
  - カルロス・ゴーン
  - エスピノーサ
  - リバイバルプラン
  - Re:Nissan
  - ホンダ
  - 経営統合
  - e-POWER
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 平成史
  thumbnail:
    top: 販売台数を追った
    bottom: 追浜工場の生産終了
  mode: drama
  narrator: reimu
