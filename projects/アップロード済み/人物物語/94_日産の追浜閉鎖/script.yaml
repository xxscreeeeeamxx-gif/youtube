  - speaker: zundamon
    emotion: thinking
    text: 家賃を払いながら、立て直す……。
  - speaker: kisha2
    emotion: thinking
    text: 26年前は出資で立て直した。今度は売って借りて、立て直す。
  - speaker: zundamon
    emotion: thinking
