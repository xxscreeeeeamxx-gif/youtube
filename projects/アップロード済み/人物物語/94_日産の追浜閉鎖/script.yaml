- id: ch10_chui2
  title: 本当の注意点
  background: ns_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。車種を56から45に減らす計画よ。
  - speaker: tsumugi
    emotion: normal
    text: 乗ってる車に次のモデルが出るのか。下取りや部品のことも、販売店で確かめるのが確実ね。
  - speaker: zundamon
    emotion: happy
