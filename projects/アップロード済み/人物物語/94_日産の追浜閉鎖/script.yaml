  - {who: uchida, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 2020年5月。2019年度の最終損益は6712億円の赤字。20年ぶりの大きさです。
    reading: にせんにじゅうねん ごがつ。にせん じゅうくねんどの さいしゅう そんえきわ ろくせん ななひゃく じゅうにおくえんの あかじ。にじゅうねんぶりの おおきさです。
  - speaker: reimu
    text: 世界の生産能力は720万台から540万台へ。車種も2割減らします。
    reading: せかいの せいさん のうりょくわ ななひゃく にじゅうまんだいから ごひゃく よんじゅうまんだいえ。しゃしゅも にわり へらします。
