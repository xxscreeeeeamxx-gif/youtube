  - speaker: uchida
    emotion: thinking
    text: 失敗を認め、正しい方向に向かうことが欠かせない
  - speaker: reimu
    text: 翌月、内田社長は経済誌の取材にこう語っています。
    reading: よくげつ うちだ しゃちょうわ、けいざいしの しゅざいに こう かたって います。
  - speaker: uchida
    emotion: thinking
