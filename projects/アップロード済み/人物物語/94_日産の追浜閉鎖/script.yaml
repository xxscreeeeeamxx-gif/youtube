    emotion: sad
    text: ネットには、日産はもうすぐ潰れるって書いてあったのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 2024年11月に英紙は、日産に近い幹部の言葉としてこう報じたの。
  - speaker: tsumugi
    emotion: thinking
