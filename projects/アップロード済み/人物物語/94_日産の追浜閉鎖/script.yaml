  - speaker: kisha2
    emotion: normal
    text: 違うのは、1999年はルノーの出資があったことだ。
  - speaker: zundamon
    emotion: thinking
    text: 今度は、ホンダとの話が壊れたあとの自力の再建……。
  - speaker: kisha2
    emotion: normal
    text: 約束は、2026年度までに車の事業の営業利益を黒字にすることだ。
  - speaker: zundamon
    emotion: normal
    text: 数字で約束する。そこは、26年前と同じですね。
  - speaker: kisha2
    emotion: thinking
    text: 守れなかったら、また読み上げることになるぞ。
  - speaker: zundamon
    emotion: sad
