  - speaker: zundamon
    emotion: surprised
    text: 2兆円！？
  - speaker: tsumugi
    emotion: normal
    text: 本業の営業損益も、2年とも黒字だったの。
  - speaker: tsumugi
    emotion: thinking
    text: ただ海外の大手3社の格付けは、投資に向かない水準まで下がってる。
  - speaker: tsumugi
    emotion: normal
    text: すぐ潰れる説も、もう安心説も言い過ぎってことね。
  - speaker: zundamon
