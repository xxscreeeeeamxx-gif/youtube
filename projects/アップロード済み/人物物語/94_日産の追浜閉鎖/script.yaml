  - speaker: kisha2
    emotion: normal
    text: いや。20年借りて、そのまま使うそうだ。
  - speaker: zundamon
    emotion: thinking
    text: 自分の家を売って、家賃を払って住むのと同じですか。
  - speaker: kisha2
    emotion: normal
