    reading: にがつ じゅうさんにち。りょうしゃわ きほん ごういお かいやく し、りょうしゃちょうが べつべつに かいけん します。
  - speaker: reimu
    text: ホンダの三部社長は、スピード感を踏まえると危機感を覚えた、と語りました。
