  background: ns_kaiken
  bgm: serious
  stage:
  - {who: ghosn, x: 0.5, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2019年12月29日。保釈中のゴーン氏が、出国の記録の無いまま日本を出ます。
    reading: にせん じゅうくねん じゅうにがつ にじゅうくにち。ほしゃくちゅうの ごーんしが、しゅっこくの きろくの ない まま にほんお でます。
  - speaker: reimu
    text: 31日、ゴーン氏は声明を出しました。
    reading: さんじゅういちにち、ごーんしわ せいめいお だしました。
  - speaker: ghosn
    emotion: normal
    text: 私はいまレバノンにいる。
  - speaker: ghosn
    emotion: angry
    text: 私は正義から逃げたのではない。不公正と政治的迫害から逃れたのだ
  - speaker: reimu
    text: 年が明けて1月7日。日産は、日本の司法制度を無視した行為であり、極めて遺憾、と声明を出しました。
    reading: としが あけて いちがつ なのか。にっさんわ にほんの しほう せいどお むし した こういで あり、きわめて いかんと せいめいお だしました。
- id: ch5_next
  title: 2度目の大赤字
  background: ns_kaigi_akaji
  stage:
