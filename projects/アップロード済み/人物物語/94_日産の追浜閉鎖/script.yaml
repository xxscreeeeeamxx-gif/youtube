    se: namida
- id: ch9_honsha
  title: 本社を売って借りる
  background: ns_yakuin
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 記者, emotion: normal}
  - {who: kisha2, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2025年は、お金の手当ても続きます。
    reading: にせんにじゅうごねんわ、おかねの てあても つづきます。
  - speaker: kisha2
    emotion: normal
    text: 7月の社債などは約8600億円。利率は最大[8.125%|はってんいちにーごパーセント]、日産で過去最高だ。
  - speaker: zundamon
    emotion: surprised
    text: 高い利子でも、借りるんですね。
  - speaker: kisha2
    emotion: thinking
