# ---- 論争の章（今の部屋） ----
- id: ch10_ronso
  title: ゴーン氏がいなくなったから？
  background: ns_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、ネットで見たのだ！
  - speaker: zundamon
    emotion: angry
    text: 日産が傾いたのは、ゴーンさんがいなくなったからだって！
  - speaker: tsumugi
    emotion: normal
    text: ゴーンさんの時代に、V字回復したのは本当よ。
  - speaker: tsumugi
    emotion: normal
    text: 577万台の最高も2017年度。2018年の秋に、会長は逮捕されたの。
  - speaker: tsumugi
    emotion: normal
    text: それに、ゴーンさん本人も近いことを言ってるの。
  - speaker: tsumugi
    emotion: normal
    text: 今の日産は自らの弱さと失敗によって疎外されてしまった、って。
  - speaker: zundamon
    emotion: happy
    text: 本人が言うなら、間違いないのだ！
  - speaker: tsumugi
    emotion: thinking
    text: それは、ゴーンさんの言い分ね。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: 今の社長は、10年ほど前の経営陣が800万台を目指したことを挙げてる。
  - speaker: tsumugi
    emotion: normal
    text: 2019年には[西川|さいかわ]社長が、値引き頼みと余った工場の問題を説明してたわ。
  - speaker: zundamon
    emotion: surprised
    text: 言ってることが、正反対！
  - speaker: tsumugi
    emotion: normal
    text: どっちか1人のせいにはできないの。いくつも重なったのよ。
  - speaker: zundamon
    emotion: surprised
    text: いくつも？
  - speaker: tsumugi
    emotion: normal
    text: 台数を追って広げた工場と、値引き。トップが次々に替わった混乱。
  - speaker: tsumugi
    emotion: normal
    text: アメリカのハイブリッドの遅れに、中国の変化。
  - speaker: tsumugi
    emotion: thinking
    text: 中国の販売は2018年の156万台から、2024年は約70万台よ。
  - speaker: zundamon
    emotion: surprised
    text: 半分以下！？
  - speaker: tsumugi
    emotion: normal
    text: 中国では新エネルギー車が急に伸びて、値下げの競争も激しくなったの。
  - speaker: zundamon
    emotion: thinking
    text: 安売りの戦いに、今度は巻き込まれる側……。
  - speaker: tsumugi
    emotion: normal
    text: 今はアメリカの関税やインフレも、利益を削ってるわ。
  - speaker: zundamon
    emotion: thinking
    text: 原因は、1つじゃないのか……。
  - speaker: zundamon
    emotion: happy
    text: なら、台数なんて追わなきゃいいのだ！
  - speaker: tsumugi
    emotion: normal
    text: 売れなかったら、工場はもっと余るわよ。
  - speaker: zundamon
    emotion: thinking
    text: ……難しいのだ。
  - speaker: tsumugi
    emotion: normal
    text: だから工場のほうを、売れる台数に合わせて減らしてるの。
- id: ch10_saiban
  title: ゴーン氏の裁判は
  background: ns_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: そもそもゴーンさんは、有罪になったのだ？
  - speaker: tsumugi
    emotion: normal
    text: なってないわ。日本では、裁判が開かれてないの。
  - speaker: zundamon
    emotion: surprised
    text: 開かれてない！？
  - speaker: tsumugi
    emotion: normal
    text: 国外に出たから、起訴されたまま裁判ができないのよ。
  - speaker: tsumugi
    emotion: normal
    text: '[一審|いっしん]と二審で有罪とされたのは、一緒に起訴されたケリー元代表取締役。'
    background: ns_houtei
  - speaker: tsumugi
    emotion: normal
    text: それも2017年度の分だけで、執行猶予つき。日産の会社としては罰金2億円よ。
  - speaker: zundamon
    emotion: thinking
    text: 本人じゃないのか。
  - speaker: tsumugi
    emotion: normal
    text: その判決で裁判所は、ゴーンさんの未払いの報酬約91億円を認めたの。
  - speaker: tsumugi
    emotion: normal
    text: 退任後に払う予定で、報告書に書くべきだったお[金|かね]ってこと。
  - speaker: tsumugi
    emotion: thinking
    text: ゴーンさんは、報酬は決まっていないし払われてもいないと主張してるわ。
  - speaker: tsumugi
    emotion: normal
    text: 特別背任のほうは、一度も審理されてないわ。
  - speaker: zundamon
    emotion: surprised
    text: 一度も！？
  - speaker: tsumugi
    emotion: normal
    text: ゴーンさんは、日産と検察の共謀で逮捕が仕組まれたと主張してる。
  - speaker: tsumugi
    emotion: normal
    text: 日産は陰謀を否定して、社内調査で不正の証拠が見つかったと言ってるわ。
  - speaker: tsumugi
    emotion: normal
    text: 2020年に日産は、約100億円の賠償を求めてゴーンさんを訴えたわ。
  - speaker: tsumugi
    emotion: thinking
    text: 長い拘束の扱いも、国内外で議論になったわ。
  - speaker: zundamon
    emotion: thinking
    text: 言い分は、ぶつかったままなのか……。
  - speaker: tsumugi
    emotion: normal
    text: フランスでは別の件の裁判が開かれて、判決は2027年1月の予定よ。
  - speaker: zundamon
    emotion: thinking
    text: まだ、終わってない話なのか。
- id: ch10_ev
  title: EVで出遅れたから？
  background: ns_heya
  stage:
