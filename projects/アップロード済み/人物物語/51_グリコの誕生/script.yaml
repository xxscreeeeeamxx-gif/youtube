  - speaker: reimu
    text: 戦前に大連に作った工場など、国の外の財産も、敗戦ですべて失いました。
    reading: せんぜんに だいれんに つくった こうじょう など、くにの そとの ざいさんも はいせんで すべて うしないました。
  - speaker: reimu
    text: 戦後は、公職追放も受けたとされています。
    reading: せんごわ こうしょく ついほうも うけたと されています。
- id: ch9_saiken
  title: ''
  background: gl_koba
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 江崎利一, emotion: happy}
  - {who: shain2, x: 0.7, emotion: happy}
  cuts:
  - speaker: shain2
    emotion: happy
    text: 社長。おもちゃが、また作れるようになりました。
  - speaker: zundamon
    emotion: happy
    text: '[何|なに]でできてるのだ？'
  - speaker: shain2
    emotion: normal
    text: 紙と、粘土と、ゴムです。まだ、ろくな材料がなくて。
  - speaker: zundamon
    emotion: happy
    text: それでいい。子どもが開けたときに、何か入っていることが大事なのだ。
  - speaker: reimu
    text: 1950年には、牡蠣のエキスで持ち直した長男の誠一を、39歳で亡くしたとされています。
    reading: せんきゅうひゃく ごじゅうねんにわ、かきの えきすで もちなおした ちょうなんの せいいちお さんじゅうきゅうさいで なくしたと されています。
  - speaker: reimu
    text: 1951年に大阪と東京の工場を建て直し、1953年には故郷の佐賀にも工場を作ります。
    reading: せんきゅうひゃく ごじゅういちねんに おおさかと とうきょうの こうじょうお たてなおし、せんきゅうひゃく ごじゅうさんねんにわ こきょうの さがにも こうじょうお つくります。
  - speaker: shain2
    emotion: thinking
    text: 社長。ハートの粒は、作るのに手間がかかります。
  - speaker: zundamon
    emotion: thinking
    text: たくさん作るなら、四角のほうが早いか……。
  - speaker: reimu
    text: 1953年から、粒は四角になります。
    reading: せんきゅうひゃく ごじゅうさんねんから つぶわ しかくに なります。
  - speaker: reimu
    text: 1955年には、1粒で2度おいしいアーモンドグリコが生まれます。
    reading: せんきゅうひゃく ごじゅうごねんにわ、ひとつぶで にど おいしい あーもんど ぐりこが うまれます。
  - speaker: reimu
    text: 1963年にはプリッツを売り出し、翌年には売れ筋に絞るため、商品の数を8割以上減らしました。
    reading: せんきゅうひゃく ろくじゅうさんねんにわ ぷりっつお うりだし、よくねんにわ うれすじに しぼる ため しょうひんの かずお はちわり いじょう へらしました。
- id: card1966
  title: ''
  background: gl_card_1966
  cuts:
  - speaker: reimu
    text: 1966年。細いプレッツェルにチョコをかけた、新しい菓子が試験販売されます。
    reading: せんきゅうひゃく ろくじゅうろくねん。ほそい ぷれっつぇるに ちょこお かけた、あたらしい かしが しけん はんばい されます。
- id: ch10_pocky
  title: ポッキンと鳴る
  background: gl_kaigi
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 江崎利一, emotion: thinking}
  - {who: shain2, x: 0.7, emotion: happy}
  cuts:
  - speaker: shain2
    emotion: happy
    text: 社長。チョコをかけた細い棒の試作品です。名前の案は、チョコテックです。
  - speaker: zundamon
    emotion: thinking
    text: 端っこだけ、チョコがかかってないのだ。
  - speaker: shain2
    emotion: normal
    text: そこを持てば、手が汚れません。
  - speaker: zundamon
    emotion: happy
    text: かじると、ポッキンといい音がするな。
  - speaker: shain2
    emotion: surprised
    text: 実はその音から、ポッキーという名前も考えているんです。
  - speaker: zundamon
    emotion: happy
    text: チョコテックより、ずっと覚えやすいのだ。
  - speaker: reimu
    text: 名前は、はじめのチョコテックから、全国で売り出すまでにポッキーへ変わりました。
    reading: なまえわ はじめの ちょこてっくから、ぜんこくで うりだすまでに ぽっきーえ かわりました。
  - speaker: reimu
    text: 1968年に、全国で売り出されます。
    reading: せんきゅうひゃく ろくじゅうはちねんに ぜんこくで うりだされます。
  - speaker: reimu
    text: 1973年、利一は社長を退いて会長になります。
    reading: せんきゅうひゃく ななじゅうさんねん りいちわ しゃちょうお しりぞいて かいちょうに なります。
- id: ch10_shi
  title: ''
  background: gl_kawara
  bgm: amacha_hoshizora
  cuts:
  - speaker: reimu
    text: 1980年2月、江崎利一は97歳で亡くなりました。
    reading: せんきゅうひゃく はちじゅうねん にがつ えざき りいちわ きゅうじゅうななさいで なくなりました。
- id: ch11_keisan
  title: 300メートルの計算
  background: gl_track
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: つむぎ。一粒300メートルって、今もちゃんと計算してあるのだ？
  - speaker: tsumugi
    emotion: normal
    text: 会社の説明だと、1粒のエネルギーは16.5キロカロリー。
  - speaker: tsumugi
    emotion: normal
    text: '[20歳|はたち]の男の人が、分速160メートルで走るとするの。'
  - speaker: zundamon
    emotion: thinking
    text: 分速160メートルって、どれくらいの速さなのだ？
  - speaker: tsumugi
    emotion: normal
    text: 1キロを6分ちょっとで走る速さ。ジョギングくらいね。
  - speaker: zundamon
    emotion: sad
    text: ボクには、それでもけっこうきついのだ。
  - speaker: tsumugi
    emotion: normal
    text: そのとき使うエネルギーは、1分ごとに8.71キロカロリーよ。
  - speaker: zundamon
    emotion: thinking
    text: 16.5を8.71で割ると……。
  - speaker: tsumugi
    emotion: normal
    text: 1.89分。その[間|あいだ]に走れるのが、だいたい300メートルよ。
  - speaker: zundamon
    emotion: surprised
    text: ほんとに、300メートルなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: ただ、使うエネルギーは体重で変わるわ。体の大きい人ほど、同じ距離でたくさん使うの。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、大きい人は300メートルより手前でゴールなのだ。
  - speaker: tsumugi
    emotion: normal
    text: そういうこと。目安の数字なのよ。
  - speaker: zundamon
    emotion: sad
    text: ボクの10粒作戦も、目安だったのだ。
  - speaker: tsumugi
    emotion: angry
    text: 目安より先に、走る前に食べすぎないことよ。
- id: ch12_ronsou
  title: モデルは誰？
  background: gl_shiryo
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。ネットで見たのだ。あの走る人のモデルは、昔の有名な選手だって。
  - speaker: tsumugi
    emotion: normal
    text: よく言われる話ね。フィリピンのカタロン選手だっていう説もあるわ。
  - speaker: zundamon
    emotion: happy
    text: やっぱり、本物の選手なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: でも会社は、特定のモデルはいないと答えてるの。
  - speaker: zundamon
    emotion: surprised
    text: いないのだ！？
  - speaker: tsumugi
    emotion: normal
    text: かけっこのゴール姿がもとで、当時の選手の姿も参考にしたという説明よ。
  - speaker: zundamon
    emotion: thinking
    text: 一人じゃなくて、みんなのゴールなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 顔や体つきも、時代に合わせて何度も描き直されてるわ。
  - speaker: zundamon
    emotion: thinking
    text: マークは何度も変わったのに、中身の牡蠣は今も入ってるのだ？
  - speaker: tsumugi
    emotion: normal
    text: 入ってるわ。原材料に、かきエキスと書いてあるの。量は公表されてないけどね。
  - speaker: tsumugi
    emotion: normal
    text: 会社は、2004年に、植物のでんぷんからグリコーゲンを大量に作る方法も開発してるの。
  - speaker: zundamon
    emotion: surprised
    text: 牡蠣がなくても、作れるようになったのか。
  - speaker: tsumugi
    emotion: thinking
    text: それでも、キャラメルのグリコは、今も牡蠣のエキスのままよ。
  - speaker: zundamon
    emotion: happy
    text: なら、たくさん食べれば、たくさん元気になるのだ。
  - speaker: tsumugi
    emotion: angry
    text: それが一番の勘違いよ。キャラメルは、砂糖のお菓子なの。
  - speaker: tsumugi
    emotion: normal
    text: むし歯を防ぐには、砂糖の量だけじゃなく、食べる回数を減らすのが大事なの。
  - speaker: zundamon
    emotion: sad
    text: ちょこちょこ食べるのが、一番よくないのだ。
  - speaker: tsumugi
    emotion: thinking
    text: それと、小さい子ののど詰まり。
  - speaker: tsumugi
    emotion: normal
    text: 食べ物がのどに詰まって亡くなった14歳までの子のうち、9割は5歳以下なの。
  - speaker: zundamon
    emotion: surprised
    text: 9割も！
  - speaker: tsumugi
    emotion: normal
    text: 小さい子があめを食べるときは、大人が目を離さないで。
  - speaker: tsumugi
    emotion: angry
    text: 走りながらは、もちろんだめよ。
  - speaker: zundamon
    emotion: sad
    text: ボクの、走りながら作戦……。
- id: ch13_gendai
  title: 55億個のおもちゃ
  background: gl_sekai
  bgm: amacha_milkyway
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: グリコのおもちゃは、これまでにおよそ3万種類、55億個も作られてきたの。
  - speaker: zundamon
    emotion: surprised
    text: 55億個！ 世界の人口の、3分の2くらいなのだ。
  - speaker: tsumugi
    emotion: happy
    text: 会社の中では、おまけとは呼ばないそうよ。お菓子と同じ、商品の一部だから。
  - speaker: zundamon
    emotion: happy
    text: 二大天職の、遊ぶほうなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 今のグリコには、木でできたおもちゃが入ってるわ。
  - speaker: tsumugi
    emotion: normal
    text: 粒は1953年から34年間、四角だったの。1987年に、ハート形に戻ったのよ。
  - speaker: zundamon
    emotion: happy
    text: ハートの形にも、歴史があるのだ。
  - speaker: tsumugi
    emotion: normal
    text: 道頓堀の看板は、今は6代目。2014年から、LEDで光ってるわ。
  - speaker: zundamon
    emotion: happy
    text: 今も、あのマークが川に映ってるのだ。
  - speaker: zundamon
    emotion: thinking
    text: ポッキーは、今どれくらい売れてるのだ？
  - speaker: tsumugi
    emotion: normal
    text: およそ30の国と地域で売られていて、2015年ごろで1年に5億箱ほど。
  - speaker: zundamon
    emotion: surprised
    text: 5億箱！
  - speaker: tsumugi
    emotion: normal
    text: ヨーロッパでは、ミカドっていう名前で売られてるの。
  - speaker: tsumugi
    emotion: happy
    text: 2020年には、ギネス世界記録にも認められたの。
  - speaker: tsumugi
    emotion: normal
    text: チョコがけビスケットのブランドで、売り上げ世界一ってね。
  - speaker: zundamon
    emotion: happy
    text: 11月11日は、ポッキーとプリッツの日なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 2025年には、ポッキーの形そのものが、立体商標にもなったの。
  - speaker: tsumugi
    emotion: thinking
    text: 始まりは、捨てられていた牡蠣の煮汁。
  - speaker: tsumugi
    emotion: thinking
    text: それが100年たっても売られてるのは、どうしてだと思う？
  - speaker: zundamon
    emotion: thinking
    text: 薬じゃなくて、子どもが毎日欲しがるお菓子にしたからなのだ。
- id: shime
  title: ''
  background: gl_ima
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: つむぎ。今日は、1粒だけ食べて、300メートル歩いてみるのだ。
  - speaker: tsumugi
    emotion: happy
    text: いいわね。歩きながらじゃなくて、食べてからね。
  - speaker: zundamon
    emotion: happy
    text: 残りの粒は、ちゃんと箱に戻したぞ。
  - speaker: tsumugi
    emotion: thinking
    text: おもちゃの箱のほうは？
  - speaker: zundamon
    emotion: surprised
    text: ……もう、開けて遊んでたのだ。
  - speaker: tsumugi
    emotion: angry
    text: 遊ぶほうの天職は、もう果たしてるのね。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: 今度グリコの箱を開けたら、原材料の欄を見てみて。かきエキスって、書いてあるから。
  - speaker: zundamon
    emotion: normal
    text: 捨てられた煮汁が、100年たっても箱の中にあるのだ。
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
