meta:
  title: 【グリコの誕生】捨てられていた牡蠣の煮汁から、一粒300メートル【ずんだもん解説】
  slug: glico-ezaki
  summary: 赤い箱の、ハート形のキャラメル。原材料の欄には、今も牡蠣のエキスと書かれています。お菓子になぜ牡蠣なのか。始まりは、佐賀の川べりで捨てられていた煮汁でした。貧しい薬屋に生まれ、朝の塩売りから商いを覚えた男は、なぜ薬ではなくお菓子を選んだのか。一粒300メートルとゴールインマークの裏側も。
  tags:
  - グリコ
  - 江崎利一
  - グリコーゲン
  - 一粒300メートル
  - ゴールインマーク
  - ポッキー
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
