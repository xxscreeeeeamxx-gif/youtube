  - speaker: zundamon
    emotion: sad
    text: ……見れば、分かる。
  - speaker: shain2
    emotion: sad
    text: 機械も、材料も、何も残っていません。
  - speaker: zundamon
    emotion: thinking
    text: 焼け残った食堂がある。今日から、あそこが社長室なのだ。
  - speaker: shain2
    emotion: surprised
    text: 食堂で、仕事をするんですか。
  - speaker: zundamon
    emotion: normal
    text: みんなを集めてくれ。話があるのだ。
- id: ch9_enzetsu
  title: ''
  background: gl_yakeato
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 江崎利一, emotion: normal}
  - {who: shain2, x: 0.7, emotion: thinking}
