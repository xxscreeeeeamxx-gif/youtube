    voice: 12
    pitch: -0.04
scenes:
- id: hook
  title: ''
  background: pc_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、見るのだ。三菱の鉛筆なのだ。
  - speaker: zundamon
    emotion: thinking
    text: 三菱って、あの大きな会社の仲間なのだ？
  - speaker: tsumugi
    emotion: normal
    text: それが、違うの。三菱鉛筆は、三菱グループじゃないのよ。
  - speaker: zundamon
    emotion: surprised
    text: 名前まで同じなのに、違う会社なのだ！？
  - speaker: tsumugi
    emotion: normal
    text: マークの登録は、三菱財閥より10年以上も早いの。
  - speaker: zundamon
    emotion: surprised
    text: 登録だけなら、鉛筆のほうが先なのだ！？
  - speaker: reimu
    text: 日本で初めて、鉛筆を工業として作り始めた人がいます。
    reading: にほんで はじめて えんぴつお こうぎょうと して つくりはじめた ひとが います。
  - speaker: reimu
    text: 眞崎仁六。今の三菱鉛筆の、創業者です。
    reading: まさき にろく。いまの みつびし えんぴつの そうぎょうしゃです。
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、パリの万博で見た、鉛筆の展示だったの。
  - speaker: zundamon
    emotion: thinking
    text: それまで、鉛筆を知らなかったのだ？
- id: ch0_zenshi
  title: 家康の鉛筆
  background: pc_kunozan
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 実は日本には、もっと古い鉛筆が残ってるの。
  - speaker: tsumugi
    emotion: normal
    text: 静岡の久能山東照宮には、家康の鉛筆があるわ。
  - speaker: tsumugi
    emotion: normal
    text: 今残っている、日本で一番古い鉛筆とされてるの。
  - speaker: zundamon
    emotion: surprised
    text: 家康も、鉛筆で書いてたのだ？
  - speaker: tsumugi
    emotion: thinking
    text: 先に使った跡はあるけど、ケースに削った跡がなくて、あまり使われなかったみたい。
  - speaker: tsumugi
    emotion: normal
    text: 和紙には、書きにくかったのかもしれないわね。
  - speaker: tsumugi
    emotion: normal
    text: スペインの使者が、贈ったと考えられてるの。
  - speaker: tsumugi
    emotion: normal
    text: 芯の黒鉛は、メキシコ産なんですって。
  - speaker: zundamon
    emotion: surprised
    text: 海の向こうから来た鉛筆なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 伊達政宗のお墓からも、筆のような形の鉛筆が、1974年の調査で見つかってるわ。
  - speaker: zundamon
    emotion: happy
    text: 殿様たちの、珍しい道具だったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 幕末には、ペリーの贈り物の中にも、鉛筆があったと伝わるわ。
  - speaker: tsumugi
    emotion: normal
    text: 明治に入ると、鉛筆を作ってみた人も何人かいたの。
  - speaker: tsumugi
    emotion: normal
    text: 1873年のウィーン万博へ学びに行った人たちが、作り方を持ち帰ったわ。
  - speaker: tsumugi
    emotion: normal
    text: 翌年には、小池卯八郎という人が、鉛筆の工房を開いてるの。
  - speaker: zundamon
    emotion: surprised
    text: 仁六より、先に作った人がいたのだ！
  - speaker: tsumugi
    emotion: normal
    text: のちのトンボ鉛筆につながる職人も、このころ独学で鉛筆を作り始めてるわ。
  - speaker: tsumugi
    emotion: normal
    text: でも、工業として作り始めたのは眞崎仁六だ、と三菱鉛筆は説明してるわ。
- id: ch1_saga
  title: ''
  background: pc_saga
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 眞崎仁六は、1848年、今の佐賀市に生まれました。
    reading: まさき にろくわ せんはっぴゃく よんじゅうはちねん いまの さがしに うまれました。
  - speaker: reimu
    text: 18歳で長崎へ出て、英語を学びます。
    reading: じゅうはっさいで ながさきえ でて えいごお まなびます。
  - speaker: reimu
    text: 明治に入ると東京へ出て、まず汽船の会社で、書記として働きました。
    reading: めいじに はいると とうきょうえ でて、まず きせんの かいしゃで しょきと して はたらきました。
  - speaker: reimu
    text: その後、同じ佐賀出身の大隈重信の紹介で、美術工芸品を海外に売る会社に入ります。
    reading: その ご おなじ さが しゅっしんの おおくま しげのぶの しょうかいで、びじゅつ こうげいひんお かいがいに うる かいしゃに はいります。
  - speaker: reimu
    text: 起立工商会社。仁六は、そこで技師長を務めます。
    reading: きりつ こうしょう がいしゃ。にろくわ そこで ぎしちょうお つとめます。
  - speaker: reimu
    text: 社長の松尾儀助も、佐賀の出身でした。
    reading: しゃちょうの まつお ぎすけも さがの しゅっしんでした。
  - speaker: reimu
    text: 1876年には、アメリカのフィラデルフィア万博を見て、驚いたと伝わります。
    reading: せんはっぴゃく ななじゅうろくねんにわ あめりかの ふぃらでるふぃあ ばんぱくお みて、おどろいたと つたわります。
  - speaker: reimu
    text: 翌年、上野の博覧会を見ても、アメリカと比べて、失望するばかりだったといいます。
    reading: よくねん うえのの はくらんかいお みても あめりかと くらべて、しつぼう するばかりだったと いいます。
- id: card1878
  title: ''
  background: pc_card_1878
  cuts:
  - speaker: reimu
    text: 1878年。パリで、万国博覧会が開かれます。
    reading: せんはっぴゃく ななじゅうはちねん。ぱりで ばんこく はくらんかいが ひらかれます。
- id: ch2_paris
  title: パリの鉛筆
  background: pc_paris
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 眞崎仁六, emotion: normal}
  - {who: kakari, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 仁六は30歳。会社の仕事で、パリへ出かけました。
    reading: にろくわ さんじゅっさい。かいしゃの しごとで ぱりえ でかけました。
  - speaker: reimu
    text: 万博は、5月から11月まで開かれた大きな催しでした。
    reading: ばんぱくわ ごがつから じゅういちがつまで ひらかれた おおきな もよおしでした。
  - speaker: reimu
    text: 会場の片すみに、いろいろな鉛筆が並んでいました。
    reading: かいじょうの かたすみに いろいろな えんぴつが ならんでいました。
  - speaker: zundamon
    emotion: surprised
    text: これは、[何|なん]なのだ？ 筆でもないし、墨も付けていないのだ。
  - speaker: kakari
    emotion: happy
    text: 鉛筆です。削れば、どこでもすぐに書けますよ。
  - speaker: zundamon
    emotion: thinking
    text: これは、どこの国で作っているのだ？
  - speaker: kakari
    emotion: normal
    text: ドイツやイギリス、フランスの鉛筆ですね。
  - speaker: zundamon
    emotion: thinking
    text: 日本の鉛筆は、ここには並んでいないのだ……。
  - speaker: zundamon
    emotion: thinking
    text: 墨をすらなくても、すぐに書けるのだ……。
  - speaker: zundamon
    emotion: happy
    text: こんなに便利なもの、日本でも作りたいのだ。
  - speaker: reimu
    text: 仁六は、このとき初めて鉛筆を見た、と三菱鉛筆は説明しています。
    reading: にろくわ この とき はじめて えんぴつお みたと みつびし えんぴつわ せつめい しています。
  - speaker: reimu
    text: 会場の片すみの鉛筆が、仁六の一生を決めた。鉛筆の業界団体の歴史には、そう書かれています。
    reading: かいじょうの かたすみの えんぴつが にろくの いっしょうお きめた。えんぴつの ぎょうかい だんたいの れきしにわ そう かかれています。
- id: ch2_kigen
  title: ''
  background: pc_sekai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: そもそも鉛筆は、どこで生まれたのだ？
  - speaker: tsumugi
    emotion: normal
    text: 16世紀のイギリスで、とても質のいい黒鉛が見つかったの。
  - speaker: tsumugi
    emotion: normal
    text: 羊飼いが、倒れた木の下で見つけた、という言い伝えもあるわ。
  - speaker: tsumugi
    emotion: normal
    text: 黒鉛をそのまま棒に切って、書くのに使ったのが始まりよ。
  - speaker: tsumugi
    emotion: normal
    text: 1565年ごろには、スイスの学者が、筒の先に黒鉛を入れた筆記具を書き残してるわ。
  - speaker: tsumugi
    emotion: normal
    text: 黒鉛は大砲の弾の型にも使われて、とても大事にされたの。
  - speaker: tsumugi
    emotion: normal
    text: 掘る期間を決めて、運ぶときは兵隊が守った、という話まで伝わってるわ。
  - speaker: zundamon
    emotion: happy
    text: 天然の、鉛筆の芯なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 大きく変わったのは1795年。フランスのコンテという人が特許を取ったの。
  - speaker: tsumugi
    emotion: normal
    text: イギリスと戦争になって、黒鉛が手に入らなくなったからよ。
  - speaker: tsumugi
    emotion: normal
    text: 黒鉛の粉に粘土を混ぜて焼けば、芯になる。混ぜる割合で、濃さも変えられる。
  - speaker: zundamon
    emotion: surprised
    text: 今の作り方と、同じなのだ！
  - speaker: tsumugi
    emotion: normal
    text: ほぼ同じころ、ハルトムートという、ウィーンの人も同じような芯を作ってるの。
  - speaker: tsumugi
    emotion: normal
    text: アメリカでは、作家のソローの家が、鉛筆工場を営んでいたこともあるのよ。
  - speaker: tsumugi
    emotion: normal
    text: 明治のはじめの日本では、木の筆と書いて、[木筆|ぼくひつ]とも呼ばれていたわ。
  - speaker: tsumugi
    emotion: normal
    text: 日本は、鉛筆をほとんど輸入に頼っていたわ。
  - speaker: tsumugi
    emotion: normal
    text: 1885年には、2万5000グロス以上を輸入したという記録もあるの。
  - speaker: zundamon
    emotion: surprised
    text: 1グロスは144本。つまり、360万本以上なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: でも、仁六には、作り方を教えてくれる[人|ひと]がいなかったの。
- id: ch3_shin
  title: 黒鉛と粘土
  background: pc_yoru
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 眞崎仁六, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 持ち帰った知識は、芯は黒鉛と粘土を混ぜたものらしい、ということだけでした。
    reading: もちかえった ちしきわ しんわ こくえんと ねんどお まぜた ものらしいと いう ことだけでした。
  - speaker: reimu
    text: 仁六は会社勤めを続けながら、今の銀座にあった自宅で、芯の研究を始めます。
    reading: にろくわ かいしゃづとめお つづけながら、いまの ぎんざに あった じたくで しんの けんきゅうお はじめます。
  - speaker: zundamon
    emotion: thinking
    text: 黒鉛と粘土を混ぜるらしいのだ。でも、どれくらい混ぜればいいのだ？
  - speaker: zundamon
    emotion: sad
    text: ……ぽろぽろ、崩れてしまったのだ。
  - speaker: zundamon
    emotion: thinking
    text: 粘土を増やすと、硬くなって、色が薄くなるのだ。
  - speaker: zundamon
    emotion: sad
    text: 黒鉛を増やすと、今度はすぐに折れてしまうのだ……。
  - speaker: zundamon
    emotion: thinking
    text: 焼き方も、変えてみるのだ。
  - speaker: reimu
    text: 師匠はいません。仁六は、材料も作り方も、自分で探していきました。
    reading: ししょうわ いません。にろくわ ざいりょうも つくりかたも じぶんで さがして いきました。
  - speaker: reimu
    text: たどり着いたのは、鹿児島の加世田の黒鉛と、栃木の烏山の粘土でした。
    reading: たどりついたのわ かごしまの かせだの こくえんと、とちぎの からすやまの ねんどでした。
  - speaker: zundamon
    emotion: happy
    text: この黒鉛と粘土なら、なめらかに書けるのだ！
- id: ch3_kaisetsu
  title: ''
  background: pc_zukai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 今の芯も、黒鉛と粘土を混ぜて、焼き固めて作るの。
  - speaker: tsumugi
    emotion: normal
    text: 黒鉛が多いほど、黒くて柔らかい。粘土が多いほど、硬くて薄くなるわ。
  - speaker: tsumugi
    emotion: normal
    text: HBなら、黒鉛と粘土はおよそ7対3よ。
  - speaker: zundamon
    emotion: happy
    text: 料理の、レシピみたいなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 1000度から1200度で焼いて、最後に熱い油をしみこませるの。
  - speaker: zundamon
    emotion: surprised
    text: 油で、なめらかにするのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 仁六は、この割合を、誰にも教わらずに探したのね。
- id: ch3_jiku
  title: ''
  background: pc_yoru
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 眞崎仁六, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 次は、芯を包む木です。
    reading: つぎわ しんお つつむ きです。
  - speaker: reimu
    text: 石油の缶を包んでいた外国の木の板も、試してみたと伝わります。
    reading: せきゆの かんお つつんでいた がいこくの きの いたも ためして みたと つたわります。
  - speaker: zundamon
    emotion: thinking
    text: 削りやすくて、曲がりにくい木はないのだ……。
  - speaker: zundamon
    emotion: happy
    text: 北海道のアララギなのだ！ よく削れて、まっすぐなのだ！
  - speaker: reimu
    text: アララギは、イチイの北海道での呼び名です。
    reading: あららぎわ いちいの ほっかいどうでの よびなです。
  - speaker: reimu
    text: 明治の終わりの本は、誰にも師事することなく、自分で考えた機械で作っている、と書いています。
    reading: めいじの おわりの ほんわ だれにも しじ する ことなく、じぶんで かんがえた きかいで つくっていると かいています。
  - speaker: zundamon
    emotion: happy
    text: 先生がいないなら、自分で作るしかないのだ。
  - speaker: reimu
    text: 芯だけで約5年。木と機械にも、さらに数年かかりました。
    reading: しんだけで やく ごねん。きと きかいにも さらに すうねん かかりました。
- id: card1887
  title: ''
  background: pc_card_1887
  cuts:
  - speaker: reimu
    text: 1887年。仁六は会社を辞め、東京の内藤新宿に、鉛筆の工場を開きます。
    reading: せんはっぴゃく はちじゅうななねん。にろくわ かいしゃお やめ とうきょうの ないとう しんじゅくに えんぴつの こうじょうお ひらきます。
  - speaker: reimu
    text: パリで鉛筆を見てから、およそ9年がたっていました。
    reading: ぱりで えんぴつお みてから およそ きゅうねんが たっていました。
- id: ch4_suisha
  title: 竹やぶの水車
  background: pc_suisha
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 眞崎仁六, emotion: normal}
  - {who: kouin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 玉川上水から分かれた流れで、水車を回す工場でした。
    reading: たまがわ じょうすいから わかれた ながれで すいしゃお まわす こうじょうでした。
  - speaker: reimu
    text: 1914年の雑誌の記事は、その様子をこう書いています。
    reading: せんきゅうひゃく じゅうよねんの ざっしの きじわ その ようすお こう かいています。
  - speaker: reimu
    text: 一面の竹やぶで、昼間から狐や狸が出る。水車の軒は傾いている。
    reading: いちめんの たけやぶで ひるまから きつねや たぬきが でる。すいしゃの のきわ かたむいている。
  - speaker: reimu
    text: 壁は落ち、雨は漏り、風は吹き込む。
    reading: かべわ おち あめわ もり かぜわ ふきこむ。
  - speaker: kouin
    emotion: surprised
    text: 親方、また狸が出ました！
  - speaker: zundamon
    emotion: happy
    text: 狸も、鉛筆を見に来たのだ。
    se: oti
  - speaker: kouin
    emotion: sad
    text: ……雨漏りのほうを、なんとかしてほしいです。
  - speaker: kouin
    emotion: thinking
    text: 親方、この機械は、どこで買ったんですか？
  - speaker: zundamon
    emotion: happy
    text: 買ってないのだ。自分で作ったのだ。
  - speaker: reimu
    text: 鉛筆そのものでも、らせん状の金具で芯を押さえる仕組みの特許を取っています。
    reading: えんぴつ そのものでも らせんじょうの かなぐで しんお おさえる しくみの とっきょお とっています。
  - speaker: reimu
