meta:
  title: 【鉛筆の誕生】財閥より先に「三菱」を登録した男が、独学で作った国産の鉛筆【ずんだもん解説】
  slug: masaki-pencil
  summary: 三菱鉛筆は、三菱グループの会社ではありません。しかもそのマークは、三菱財閥より10年以上早く登録されていました。明治11年、パリ万博の会場の片すみで鉛筆に出会った、佐賀出身の眞崎仁六。持ち帰った手がかりは、芯は黒鉛と粘土を混ぜたものらしい、ということだけでした。師匠のいない鉛筆づくりを、再現ドラマでたどります。
  tags:
  - 鉛筆
  - 三菱鉛筆
  - 眞崎仁六
  - uni
  - 文房具
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 雑学
  thumbnail:
    top: 三菱より先に登録
    bottom: 鉛筆の誕生
  mode: drama
  narrator: reimu
  mobs:
