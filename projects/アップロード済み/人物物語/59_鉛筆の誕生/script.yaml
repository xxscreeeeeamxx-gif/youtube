  - speaker: tsumugi
    emotion: thinking
    text: 大金の話は、作り話。最初は、アメリカもソ連も鉛筆を使ってたの。
  - speaker: tsumugi
    emotion: normal
    text: 無重力だと、折れた芯のかけらが漂って、機械に入り込むおそれがあるのよ。
  - speaker: tsumugi
    emotion: thinking
    text: 1967年に宇宙船の火事の事故が起きてからは、燃えやすさも心配されたの。
  - speaker: tsumugi
    emotion: normal
    text: NASAが1965年に買ったシャーペンは、1本128ドル余り。批判を浴びたの。
  - speaker: tsumugi
    emotion: normal
    text: 宇宙で書けるペンは、アメリカの民間の会社が、自分のお金で作ったの。
  - speaker: tsumugi
    emotion: normal
    text: NASAは1967年から、そのペンを1本2ドル39セントで買ったわ。
  - speaker: tsumugi
    emotion: normal
    text: ソ連も、1969年にはそのペンを買ってるわ。
  - speaker: zundamon
    emotion: surprised
    text: 鉛筆にも、苦手な場所があったのだ。
- id: ch12_gendai
  title: 今の鉛筆
  background: pc_gendai
  bgm: amacha_milkyway
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 日本の鉛筆の生産が一番多かったのは、1966年。約13億8500万本よ。
  - speaker: tsumugi
    emotion: normal
    text: 2025年は約1億600万本。一番多かったころの、1割もないの。
  - speaker: zundamon
    emotion: sad
    text: シャーペンに、押されてるのだ。
  - speaker: tsumugi
    emotion: normal
    text: 子どもの数も減ってるの。小学生は、1958年の半分以下よ。
  - speaker: tsumugi
    emotion: normal
    text: 1992年には、トンボの鉛筆が、鉛筆で初めてエコマークを取ってるわ。
  - speaker: tsumugi
    emotion: normal
    text: 2006年には、国内で作る本数より、輸入する本数のほうが多くなったわ。
  - speaker: tsumugi
    emotion: normal
    text: 売り上げではシャーペンが上。でも作る本数では、まだ鉛筆が少しだけ多いのよ。
  - speaker: tsumugi
    emotion: normal
    text: 子ども向けでは、1979年から2Bが一番売れている、とメーカーの人は話してるわ。
  - speaker: tsumugi
    emotion: normal
    text: 昔は仕事や図面で、HBがたくさん使われてたの。
  - speaker: tsumugi
    emotion: normal
    text: パソコンの時代になって、それが減ったのも大きいのよ。
  - speaker: zundamon
    emotion: thinking
    text: 子どもの力が弱くなったから、2Bなのかと思ったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 書写の研究者は、筆圧が下がった傾向は見られない、と話してるわ。
  - speaker: tsumugi
    emotion: normal
    text: シャーペンでは、2008年に出たクルトガが、15年続けて一番売れたの。
  - speaker: tsumugi
    emotion: normal
    text: 2025年には、三菱鉛筆の新しい工場が、山形県で動き出したわ。
  - speaker: tsumugi
    emotion: normal
    text: 2026年の9月からは、ユニやハイユニの箱が、プラスチックから紙に変わり始めたの。
  - speaker: tsumugi
    emotion: normal
    text: 世界全体では、年に140億本以上作られている、という数字もあるの。
  - speaker: zundamon
    emotion: happy
    text: 鉛筆は、まだまだ現役なのだ。
- id: shime
  title: ''
  background: pc_ima2
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、この紙のマーク、もう一回よく見るのだ。
  - speaker: tsumugi
    emotion: normal
    text: 家紋の三つのうろこと、3種類の鉛筆ね。
  - speaker: zundamon
    emotion: happy
    text: 三菱より先に登録された、三菱なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 手がかりは、黒鉛と粘土を混ぜたものらしい、という一言だけだったのよね。
  - speaker: zundamon
    emotion: normal
    text: 竹やぶの[水車小屋|すいしゃごや]から、今の鉛筆につながってるのだ。
  - speaker: tsumugi
    emotion: normal
    text: 次に鉛筆を削るときは、六角形と、木のにおいを気にしてみて。
  - speaker: zundamon
    emotion: happy
    text: 明治の人が、手探りで作った道具なのだ。
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴ありがとうございました！
    duet_with: tsumugi
