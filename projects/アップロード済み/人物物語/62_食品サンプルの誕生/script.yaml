  - speaker: tsumugi
    emotion: normal
    text: 実は、それより前から、料理の模型はあったの。
  - speaker: tsumugi
    emotion: normal
    text: 記録で一番古いのは、1917年の京都。栄養の指導に使う料理の模型よ。
  - speaker: tsumugi
    emotion: normal
    text: 作ったのは、島津製作所で標本を作っていた、西尾惣次郎たちなの。
  - speaker: zundamon
    emotion: surprised
    text: 京都が、先だったのだ！
  - speaker: tsumugi
    emotion: normal
    text: 1923年には、東京の白木屋という百貨店の食堂が、
  - speaker: tsumugi
    emotion: normal
    text: 料理の見本を並べて、食券を売り始めたわ。
  - speaker: tsumugi
    emotion: normal
    text: 見本を作ったのは、人体や生き物の模型を作っていた、[須藤|すどう]勉という職人よ。
  - speaker: tsumugi
    emotion: normal
