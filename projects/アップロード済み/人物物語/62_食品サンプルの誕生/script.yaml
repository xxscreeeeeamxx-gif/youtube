  - speaker: tsumugi
    emotion: normal
    text: ただ、ロウは溶かせばやり直せる。樹脂は、一度固めたらやり直せないの。
  - speaker: zundamon
    emotion: thinking
    text: 樹脂のほうが、一発勝負なのだ。
  - speaker: tsumugi
    emotion: normal
