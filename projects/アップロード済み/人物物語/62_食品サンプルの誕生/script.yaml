  - speaker: zundamon
    emotion: happy
    text: だから、この店の料理から、型を取らせてほしいのだ。
  - speaker: tenshu
    emotion: surprised
    text: うちの料理を、写すんか。
  - speaker: zundamon
    emotion: happy
    text: 盛り付けも、器も、そっくりにするのだ。
  - speaker: reimu
    text: 数年のうちに、九州にも支店を開いたといいます。
    reading: すうねんの うちに きゅうしゅうにも してんお ひらいたと いいます。
- id: ch3_kigen
