  background: sp_senji
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, emotion: normal}
  - {who: kouin, x: 0.7, emotion: normal}
  cuts:
  - speaker: kouin
    emotion: thinking
    text: 岩崎さん、今は何を作るんです？
  - speaker: zundamon
    emotion: normal
    text: 戦死した人の、霊前に供える料理の模型なのだ。
  - speaker: zundamon
    emotion: normal
    text: 本物の食べ物は、もう供えられない家が多いのだ。
  - speaker: kouin
    emotion: sad
    text: ……うちの近所でも、葬式が続いてます。
  - speaker: zundamon
    emotion: normal
    text: お膳の料理を、ひとつずつ写すのだ。ご飯も、お吸い物も。
  - speaker: kouin
    emotion: normal
    text: 食べ物がない時でも、お膳だけは整えてあげられますね。
  - speaker: zundamon
    emotion: normal
    text: パラフィンは、ほとんど手に入らないのだ。少ない量で作る工夫をするのだ。
  - speaker: reimu
    text: 戦争に動員されていない女性たちを雇い、供え物の模型を作って売ったといいます。
    reading: せんそうに どういん されていない じょせいたちお やとい、そなえものの もけいお つくって うったと いいます。
  - speaker: zundamon
    emotion: happy
    text: 形は、珪藻土で作るのだ。
  - speaker: zundamon
    emotion: happy
    text: ロウは、表面に吹き付けるだけにするのだ。
  - speaker: kouin
    emotion: surprised
    text: それなら、ロウがほんの少しで済みますね。
  - speaker: reimu
    text: 珪藻土で形を作り、パラフィンを吹き付ける方法で、ロウを大きく節約したとされます。
    reading: けいそうどで かたちお つくり、ぱらふぃんお ふきつける ほうほうで ろうお おおきく せつやく したと されます。
- id: card1948
