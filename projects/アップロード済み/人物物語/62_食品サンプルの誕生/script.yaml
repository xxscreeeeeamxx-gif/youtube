  - speaker: zundamon
    emotion: thinking
    text: じゃあ、高いお店ほど、豪華なサンプルを置くのだ？
  - speaker: tsumugi
    emotion: normal
    text: それが逆なの。
  - speaker: tsumugi
    emotion: normal
    text: 2002年の野瀬さんの調べでは、最低1000円以上の店には、サンプルがないの。
  - speaker: zundamon
    emotion: thinking
    text: 高級なお店は、見本がなくても入ってもらえるのだ。
  - speaker: zundamon
    emotion: thinking
    text: ところで、サンプルは、本物の料理にプラスチックをかぶせてるのだ？
  - speaker: tsumugi
    emotion: normal
    text: そう思っていた外国の観光客もいるけど、違うわ。本物は、型を取るのに使うだけよ。
  - speaker: zundamon
    emotion: thinking
    text: 最初のサンプルはオムライス、って聞いたこともあるのだ。
  - speaker: tsumugi
    emotion: normal
    text: そう書いてある資料もあるけど、会社の公式の説明では、オムレツなの。
  - speaker: zundamon
    emotion: happy
    text: ぼくが最初に指さしたのも、オムライスだったのだ。
  - speaker: zundamon
    emotion: thinking
    text: 昔の人は、字が読めなかったから、サンプルが広まったのだ？
  - speaker: tsumugi
    emotion: normal
    text: そう言われることもあるけど、根拠は弱いの。
  - speaker: tsumugi
    emotion: normal
    text: 洋食みたいに、初めて聞く料理は、名前だけじゃ想像できなかったのよ。
  - speaker: tsumugi
    emotion: normal
    text: 見本を見て選んで、食券を買う。食堂の混雑を減らすのにも役立ったの。
  - speaker: zundamon
    emotion: happy
    text: 字が読めても、オムレツの形は分からないのだ。
  - speaker: zundamon
    emotion: thinking
    text: サンプルって、日本にしかないのだ？
  - speaker: tsumugi
    emotion: normal
    text: 韓国では、1988年のソウルオリンピックをきっかけに広まったの。
  - speaker: tsumugi
    emotion: normal
    text: でも、店先にメニューとして並べる文化は、日本生まれ。
  - speaker: tsumugi
    emotion: normal
    text: 今も日本で、一番根付いてるの。
  - speaker: zundamon
    emotion: thinking
    text: ところで、1個いくらくらいするのだ？
  - speaker: tsumugi
    emotion: normal
    text: 値段は、注文で作ると、一品6000円から1万円くらいが目安よ。
- id: ch8_gendai
  title: 世界のサンプル
  background: sp_gendai
  bgm: pop
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 国内のシェアは、いわさきグループで7割ほどだそうよ。
  - speaker: tsumugi
    emotion: normal
    text: 郡上八幡は、日本の食品サンプルの約6割を作っている、ともいわれるの。
  - speaker: zundamon
    emotion: happy
    text: 本当に、サンプルの町になったのだ！
  - speaker: tsumugi
    emotion: normal
    text: 郡上のサンプル会社の多くは、岩崎模型製造で学んで独立した人たちだそうよ。
  - speaker: tsumugi
    emotion: normal
    text: バブルが崩れて仕事が減った1990年代からは、観光客の作る体験が増えたわ。
  - speaker: zundamon
    emotion: happy
    text: 天ぷらとレタスの体験なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 2007年ごろには、岩崎模型製造の体験だけで、年間1万人以上が来ていたの。
  - speaker: tsumugi
    emotion: normal
    text: 東京の合羽橋でも、2010年から、ロウの製作体験が始まったわ。
  - speaker: tsumugi
    emotion: normal
    text: 合羽橋の店では、キーホルダーやマグネットが、外国の観光客に人気よ。
  - speaker: tsumugi
    emotion: normal
    text: 2016年の9月12日には、瀧三さんの誕生日に、グーグルのトップの絵にもなったわ。
  - speaker: zundamon
    emotion: happy
    text: 世界中の人が、瀧三さんを見たのだ。
  - speaker: tsumugi
    emotion: normal
    text: 2020年には、記念オムを、今の職人がロウで再現したわ。
  - speaker: tsumugi
    emotion: normal
    text: 3月26日は、サン、プ、ルの語呂合わせで、食品サンプルの日として登録されてるの。
  - speaker: zundamon
    emotion: happy
    text: サンプルの記念日なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 2024年からは、ロンドンで食品サンプルの展覧会も開かれたの。
  - speaker: tsumugi
    emotion: normal
    text: 47都道府県の料理を、新しく作って並べたそうよ。
  - speaker: zundamon
    emotion: surprised
    text: 宮城のずんだ餅も、ロンドンに行ったのだ！
  - speaker: tsumugi
    emotion: normal
    text: そのあと、ロサンゼルスでも展示されたわ。
  - speaker: tsumugi
    emotion: normal
    text: 2025年には、瀧三さんの息子が作ったクジラの模型が、30年ぶりに公開されたの。
  - speaker: zundamon
    emotion: surprised
    text: クジラまで、作ったのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 全長16メートルのザトウクジラで、作るのに10年かかったそうよ。
  - speaker: tsumugi
    emotion: thinking
    text: ただ最近は、コストを抑えるため、サンプルをポスターに替える店もあるの。
  - speaker: tsumugi
    emotion: normal
    text: それで今は、医療用の模型や、栄養指導の教材にも、技術を広げてるそうよ。
  - speaker: zundamon
    emotion: happy
    text: 両手を使って、工夫を続けてるのだ。
