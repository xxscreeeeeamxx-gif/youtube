meta:
  title: 【食品サンプルの誕生】妻が焼いたシワだらけのオムレツを、ロウでそっくり写した男【ずんだもん解説】
  slug: iwasaki-sample
  summary: 飲食店の店先に並ぶ食品サンプル。これを最初に商売にしたのは、岐阜県郡上八幡に生まれた岩崎瀧三でした。子どものころ見た、水に落ちて花のように開くロウ。妻のすゞが焼いたシワだらけのオムレツ。本物の10倍の値段で月ぎめで貸すという売り方。戦争で陳列が禁じられても、故郷で作り続けた男と、日本独特の食品サンプル文化の歩みを、再現ドラマでたどります。
  tags:
  - 食品サンプル
  - 岩崎瀧三
  - 郡上八幡
  - いわさき
  - 合羽橋
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 雑学
  thumbnail:
    top: 妻のオムレツを写した
    bottom: 食品サンプルの誕生
  mode: drama
  narrator: reimu
  mobs:
  - id: shujin
    label: 主人
    voice: 42
    pitch: 0.04
  - id: itoko
    label: いとこ
    voice: 12
    pitch: 0.04
  - id: tenshu
    label: 店主
    voice: 42
    pitch: 0.1
  - id: hyakka
    label: 百貨店
    voice: 13
    pitch: 0.02
  - id: yakunin
    label: 役人
    voice: 13
    pitch: -0.06
  - id: kouin
    label: 工員
    voice: 8
    pitch: 0.04
  - id: shinnyu
    label: 新入社員
    voice: 12
    pitch: 0.18
scenes:
- id: hook
  title: ''
  background: sp_mise
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、このお店にするのだ。このオムライス、すごくおいしそうなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 店先の食品サンプルね。
  - speaker: zundamon
    emotion: happy
    text: すみません、このサンプルと同じのをくださいなのだ。
- id: hook2
  title: ''
  background: sp_table
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: ……来たけど、サンプルより、ちょっと小さい気がするのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 気のせいよ。
  - speaker: zundamon
    emotion: normal
    text: 決めたのだ。次からは、サンプルのほうを食べるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: それ、食べられないわよ。
  - speaker: zundamon
    emotion: happy
    text: だったら、サンプルを買って帰るのだ。ずっとおいしそうなままなのだ！
  - speaker: tsumugi
    emotion: normal
    text: 実はサンプルも、1年ほどで色があせてくるの。
  - speaker: zundamon
    emotion: surprised
    text: サンプルにも、賞味期限があるのだ！？
    se: oti
  - speaker: reimu
    text: 食品サンプル。飲食店の店先に並ぶ、料理の見本です。
    reading: しょくひん さんぷる。いんしょくてんの みせさきに ならぶ りょうりの みほんです。
  - speaker: reimu
    text: 国内の市場は、2009年の推計で約80億円でした。
    reading: こくないの しじょうわ にせんきゅうねんの すいけいで やく はちじゅうおくえんでした。
  - speaker: reimu
    text: これを最初に商売にしたのは、岐阜県郡上八幡生まれの、岩崎瀧三という男でした。
    reading: これお さいしょに しょうばいに したのわ、ぎふけん ぐじょうはちまん うまれの いわさき たきぞうと いう おとこでした。
  - speaker: tsumugi
    emotion: normal
    text: 最初の一品は、奥さんが焼いたオムレツだったのよ。
  - speaker: zundamon
    emotion: surprised
    text: オムライスじゃなくて、オムレツなのだ！？
- id: card1895
  title: ''
  background: sp_card_1895
  cuts:
  - speaker: reimu
    text: 1895年。岐阜県の城下町、郡上八幡で、岩崎瀧三が生まれます。
    reading: せんはっぴゃく きゅうじゅうごねん。ぎふけんの じょうかまち ぐじょうはちまんで いわさき たきぞうが うまれます。
- id: ch1_rou
  title: ロウの花
  background: sp_jinja
  bgm: amacha_hoshizora
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, scale: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 3歳のとき顔にやけどを負い、家で絵や字をかいて遊ぶ子どもだったといいます。
    reading: さんさいの とき かおに やけどお おい、いえで えや じお かいて あそぶ こどもだったと いいます。
  - speaker: reimu
    text: ある日、近所の神社で、ろうそくを灯す行事がありました。
    reading: あるひ きんじょの じんじゃで ろうそくお ともす ぎょうじが ありました。
  - speaker: zundamon
    emotion: normal
    text: ろうそくのロウが、水たまりに落ちたのだ。
  - speaker: zundamon
    emotion: surprised
    text: ……水の中で、白い花みたいに開いたのだ！
  - speaker: zundamon
    emotion: happy
    text: 熱いロウが、水で冷えると、形が固まるのだ。
  - speaker: zundamon
    emotion: happy
    text: もう一回、落としてみるのだ。
  - speaker: zundamon
    emotion: thinking
    text: こっちの畳にも、ロウがこぼれてるのだ。
  - speaker: zundamon
    emotion: surprised
    text: 畳に落ちたロウには、畳の目が、そのまま写ってるのだ。
  - speaker: zundamon
    emotion: happy
    text: ロウは、触れたものの形を、写し取るのだ。
  - speaker: reimu
    text: 畳に落ちたロウに畳の目が写っていた、という話も、会社の人によって語られています。
    reading: たたみに おちた ろうに たたみの めが うつって いたと いう はなしも、かいしゃの ひとに よって かたられて います。
  - speaker: reimu
    text: 梅の花びらのような、白いロウの花。この光景が、強く心に残ったと伝わります。
    reading: うめの はなびらの ような しろい ろうの はな。この こうけいが つよく こころに のこったと つたわります。
- id: ch1_hoko
  title: 大阪へ
  background: sp_hoko
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, scale: 0.9, emotion: normal}
  - {who: shujin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 15歳のころ、瀧三は柳行李ひとつを担いで、大阪へ奉公に出ます。
    reading: じゅうごさいの ころ、たきぞうわ やなぎごうり ひとつお かついで おおさかえ ほうこうに でます。
  - speaker: shujin
    emotion: normal
    text: 郡上から来た子やな。今日から、しっかり働いてもらうで。
  - speaker: zundamon
    emotion: happy
    text: はい。大阪で、一旗あげるのだ。
  - speaker: shujin
    emotion: thinking
    text: 一旗なあ。まずは、店の掃除からや。
  - speaker: reimu
    text: ところが、体を壊したり、新しい商売に挑んでは失敗したりの日々が続きました。
    reading: ところが からだお こわしたり、あたらしい しょうばいに いどんでわ しっぱい したりの ひびが つづきました。
  - speaker: zundamon
    emotion: sad
    text: ……今度も、うまくいかなかったのだ。
  - speaker: shujin
    emotion: normal
    text: 落ち込んでも、腹は減るやろ。ほれ、飯や。
  - speaker: zundamon
    emotion: normal
    text: ……いつか、自分にしかできない商売を見つけるのだ。
- id: card1931
  title: ''
  background: sp_card_1931
  cuts:
  - speaker: reimu
    text: 1931年。36歳の瀧三は、大阪で妻のすゞと暮らしていました。
    reading: せんきゅうひゃく さんじゅういちねん。さんじゅうろくさいの たきぞうわ おおさかで つまの すずと くらして いました。
- id: ch2_itoko
  title: いとこが持ってきた肉
  background: sp_ie
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 岩崎瀧三, emotion: normal}
  - {who: itoko, x: 0.52, emotion: normal}
  - {who: tsumugi, x: 0.8, tag: 岩崎すゞ, emotion: normal}
  cuts:
  - speaker: reimu
    text: 瀧三は、弁当や仕出しの仕事をしていたといいます。家には、すゞのいとこが住みついていました。
    reading: たきぞうわ べんとうや しだしの しごとお して いたと いいます。いえにわ すずの いとこが すみついて いました。
  - speaker: itoko
    emotion: happy
    text: 瀧三さん、本物そっくりの肉の模型を、見たことがありますか？
  - speaker: zundamon
    emotion: thinking
    text: 肉の、模型なのだ？
  - speaker: itoko
    emotion: normal
    text: 学校で使う教材でね。すき焼きの肉が、本物にしか見えないんですよ。
  - speaker: zundamon
    emotion: thinking
    text: ……それは、ロウでできているのだ。ぼくには分かるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: それより、家賃がまた払われてないのよ。
  - speaker: itoko
    emotion: sad
    text: ……す、すみません。
- id: ch2_itoko_kie
  title: ''
  background: sp_ie
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, emotion: thinking}
  - {who: tsumugi, x: 0.7, tag: 岩崎すゞ, emotion: thinking}
  cuts:
  - speaker: reimu
    text: いとこは家賃を払わないまま、姿を消してしまいます。
    reading: いとこわ やちんお はらわない まま すがたお けして しまいます。
  - speaker: tsumugi
    emotion: thinking
    text: ……あの子、とうとう出ていったわ。
  - speaker: zundamon
    emotion: thinking
    text: あの肉の模型だけは、気になるのだ。
- id: ch2_itoko2
  title: ''
  background: sp_ie2
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, emotion: normal}
  - {who: itoko, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: ところがしばらくして、その模型と作り方を持って、戻ってきたのです。
    reading: ところが しばらく して、その もけいと つくりかたお もって もどってきたのです。
  - speaker: zundamon
    emotion: angry
    text: ……家賃も払わずに、どこへ行ってたのだ。
  - speaker: itoko
    emotion: sad
    text: すみません。でも、これを見てください。
  - speaker: itoko
    emotion: normal
    text: これが、その肉と、グリーンピースの模型です。
  - speaker: zundamon
    emotion: surprised
    text: ……やっぱり、ロウなのだ！
  - speaker: reimu
    text: 模型を扱う知人が会社のお金を使い込み、その穴埋めのために、模型と作り方を手放したのだと伝わります。
    reading: もけいお あつかう ちじんが かいしゃの おかねお つかいこみ、その あなうめの ために もけいと つくりかたお てばなしたのだと つたわります。
- id: ch2_hint
  title: 毎日捨てられる料理
  background: sp_shokudo
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, emotion: normal}
  - {who: tenshu, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: そのころの食堂は、毎日わざわざ本物の料理を作って、店先に並べていました。
    reading: その ころの しょくどうわ、まいにち わざわざ ほんものの りょうりお つくって みせさきに ならべて いました。
  - speaker: tenshu
    emotion: thinking
    text: 夏場は、並べた料理がすぐ傷んでな。毎日作っては、捨てとるんや。
  - speaker: zundamon
    emotion: thinking
    text: 見本の料理を、毎日捨てるのだ？
  - speaker: tenshu
    emotion: normal
    text: 見本がないと、客は[何|なん]の料理か分からんからな。
  - speaker: zundamon
    emotion: happy
    text: ……腐らない見本があれば、ほしいのだ？
  - speaker: tenshu
    emotion: surprised
    text: そんなもんがあったら、誰でもほしいわ。
  - speaker: reimu
    text: 料理の見本には需要がある。瀧三は、そう確信します。
    reading: りょうりの みほんにわ じゅようが ある。たきぞうわ そう かくしん します。
- id: ch2_shisaku
  title: 夜中の試作
  background: sp_shisaku
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, emotion: normal}
  - {who: tsumugi, x: 0.7, tag: 岩崎すゞ, emotion: normal}
  cuts:
  - speaker: reimu
    text: 仕事から帰ると、夜中まで試作を続けたといいます。
    reading: しごとから かえると よなかまで しさくお つづけたと いいます。
  - speaker: zundamon
    emotion: normal
    text: 本物の料理から、型を取るのだ。
  - speaker: zundamon
    emotion: thinking
    text: ゼラチン、寒天、石膏……。
  - speaker: zundamon
    emotion: happy
    text: 一番よく写るのは、寒天なのだ。
  - speaker: tsumugi
    emotion: normal
    text: その型に、ロウを流すのね。
  - speaker: zundamon
    emotion: happy
    text: 色を溶かしたロウを流して、固まったら取り出すのだ。
  - speaker: tsumugi
    emotion: thinking
    text: あなた、もう夜中の2時よ。
  - speaker: zundamon
    emotion: normal
    text: あと一つだけなのだ。
  - speaker: zundamon
    emotion: sad
    text: ……あっ、割れたのだ。
  - speaker: zundamon
    emotion: sad
    text: ロウは本物らしく見えるけど、もろすぎるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 障子を紙で裏から張るみたいに、内側に紙や[綿|わた]を貼って、補強したらどうかしら。
  - speaker: zundamon
    emotion: surprised
    text: ……裏打ちなのだ！
  - speaker: zundamon
    emotion: happy
    text: 割れないのだ！ すゞ、大手柄なのだ！
  - speaker: reimu
    text: 紙や綿の裏打ちで、見本は割れにくくなりました。すゞの思いつきだったとも伝わります。
    reading: かみや わたの うらうちで みほんわ われにくく なりました。すずの おもいつきだったとも つたわります。
- id: ch2_omu
  title: 記念オム
  background: sp_omu1
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, emotion: happy}
  - {who: tsumugi, x: 0.7, tag: 岩崎すゞ, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1932年の春。すゞが焼いたオムレツを、型に取ることにしました。
    reading: せんきゅうひゃく さんじゅうにねんの はる。すずが やいた おむれつお かたに とる ことに しました。
  - speaker: tsumugi
    emotion: sad
    text: ごめんなさい。シワが寄って、きれいに焼けなかったわ。
  - speaker: zundamon
    emotion: happy
    text: いいのだ。このシワも、そのまま写すのだ。
  - speaker: tsumugi
    emotion: thinking
    text: シワまで？
  - speaker: zundamon
    emotion: normal
    text: 焼き色も、ケチャップも、全部ロウで作るのだ。中は[綿|わた]で裏打ちして、空洞にするのだ。
- id: ch2_omu2
  title: ''
  background: sp_omu
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, emotion: happy}
  - {who: tsumugi, x: 0.7, tag: 岩崎すゞ, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: できたのだ。すゞ、どっちが本物か、当ててみるのだ。
  - speaker: tsumugi
    emotion: surprised
    text: ……分からないわ。どっちが本物なの？
  - speaker: zundamon
    emotion: happy
    text: 右が、ロウのオムレツなのだ！
  - speaker: tsumugi
    emotion: happy
    text: シワの形まで、私が焼いたのと同じね。
  - speaker: zundamon
    emotion: happy
    text: 最初の一品は、記念のオムレツ。記念オムと呼ぶのだ。
  - speaker: zundamon
    emotion: happy
    text: これで、商売になるのだ！
  - speaker: reimu
    text: シワまで写したので、かえって本物らしくなったそうです。
    reading: しわまで うつしたので かえって ほんものらしく なったそうです。
  - speaker: reimu
    text: 本物そっくりの出来に、夫婦でたいそう喜んだそうです。
    reading: ほんものそっくりの できに ふうふで たいそう よろこんだそうです。
- id: card1932
  title: ''
  background: sp_card_1932
  cuts:
  - speaker: reimu
    text: 1932年6月1日。大阪の老松町で、岩崎製作所が始まります。
    reading: せんきゅうひゃく さんじゅうにねん ろくがつ ついたち。おおさかの おいまつちょうで いわさき せいさくしょが はじまります。
- id: ch3_kashi
  title: 月に本物の10倍
  background: sp_shokudo2
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, emotion: happy}
  - {who: tenshu, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 瀧三は、見本を入れた桐の箱を両手に持って、食堂を回りました。
    reading: たきぞうわ みほんお いれた きりの はこお りょうてに もって しょくどうお まわりました。
  - speaker: zundamon
    emotion: happy
    text: この箱の中を、見てほしいのだ。
  - speaker: tenshu
    emotion: surprised
    text: ……なんや、うまそうなオムレツやな。
  - speaker: zundamon
    emotion: happy
    text: ロウでできた、腐らない見本なのだ。
  - speaker: tenshu
    emotion: thinking
    text: ほう。けど、こんな[細工物|さいくもの]、高いんやろ？
  - speaker: zundamon
    emotion: normal
    text: 売るんじゃないのだ。月ぎめで、貸すのだ。
  - speaker: zundamon
    emotion: normal
    text: 1か月の貸し賃は、本物の料理の10倍なのだ。
  - speaker: tenshu
    emotion: surprised
    text: 10倍！？
  - speaker: zundamon
    emotion: happy
    text: 毎日作って捨てるより、ずっと安いのだ。汚れたら、すぐ取り替えるのだ。
  - speaker: tenshu
    emotion: thinking
    text: 貸してもらうんなら、傷んでも、こっちの損にはならんな。
  - speaker: zundamon
    emotion: happy
    text: そうなのだ。手入れも、ぼくの仕事なのだ。
  - speaker: tenshu
    emotion: happy
    text: ……それなら、置いてみるか。
  - speaker: reimu
    text: この貸し付けの仕組みは、今も続く、独自の売り方です。
    reading: この かしつけの しくみわ いまも つづく どくじの うりかたです。
- id: ch3_sogo
  title: 百貨店の大食堂
  background: sp_sogo
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, emotion: normal}
  - {who: hyakka, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: この年、大阪の十合百貨店が、瀧三の見本を採用します。
    reading: この とし おおさかの そごう ひゃっかてんが たきぞうの みほんお さいよう します。
  - speaker: hyakka
    emotion: normal
    text: 岩崎さん、大食堂のケースに、この見本を並べましょう。
  - speaker: zundamon
    emotion: happy
    text: 百貨店の食堂なら、たくさんの人が見るのだ。
  - speaker: hyakka
    emotion: happy
    text: 初めて見る洋食でも、見本があれば、お客さんが迷いませんからね。
  - speaker: reimu
    text: 流行の先端だった百貨店で人目に触れたことが、転機になりました。
    reading: りゅうこうの せんたんだった ひゃっかてんで ひとめに ふれた ことが てんきに なりました。
  - speaker: hyakka
    emotion: surprised
    text: 岩崎さん、うちの見本を見て、よその百貨店からも問い合わせが来てますよ。
  - speaker: zundamon
    emotion: surprised
    text: よその百貨店からも、なのだ！？
  - speaker: hyakka
    emotion: happy
    text: 見本の前で足を止めるお客さんが、多いんです。
  - speaker: zundamon
    emotion: happy
    text: 大阪から、全国に広げるのだ！
  - speaker: reimu
    text: ほかの百貨店からも、注文が相次ぎました。
    reading: ほかの ひゃっかてんからも ちゅうもんが あいつぎました。
