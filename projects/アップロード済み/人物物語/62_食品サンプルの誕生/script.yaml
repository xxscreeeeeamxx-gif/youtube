  - speaker: zundamon
    emotion: surprised
    text: 見本を、並べられないのだ？
  - speaker: zundamon
    emotion: sad
    text: ……分かったのだ。
  - speaker: reimu
    text: 空襲も迫り、瀧三は故郷の郡上八幡へ疎開します。
    reading: くうしゅうも せまり たきぞうわ こきょうの ぐじょうはちまんえ そかい します。
- id: ch4_gujo
