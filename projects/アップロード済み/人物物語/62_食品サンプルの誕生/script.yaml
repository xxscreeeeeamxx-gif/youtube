  - {who: tenshu, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1933年からは、店に出向いて、その場で作る出張製作を始めます。
    reading: せんきゅうひゃく さんじゅうさんねんからわ、みせに でむいて その ばで つくる しゅっちょう せいさくお はじめます。
  - speaker: tenshu
    emotion: normal
