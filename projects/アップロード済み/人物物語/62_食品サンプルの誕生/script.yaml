  - speaker: tsumugi
    emotion: normal
    text: ご飯の粒のように、専門の会社から仕入れる部品もあるの。
  - speaker: tsumugi
    emotion: normal
    text: 一皿は、型取りから仕上げまで、原則一人の職人が作るの。
  - speaker: zundamon
    emotion: thinking
    text: 一つ作るのに、どのくらいかかるのだ？
  - speaker: tsumugi
    emotion: normal
    text: 注文してから届くまで、3週間ほどが目安だそうよ。
  - speaker: tsumugi
    emotion: thinking
    text: 一番難しいのは色付け。一人前まで何年もかかるそうよ。
  - speaker: tsumugi
    emotion: normal
    text: 手作業だから、100個作れば、100個とも違うそうよ。
  - speaker: zundamon
    emotion: happy
    text: 同じ料理でも、一つずつ顔が違うのだ。
  - speaker: tsumugi
    emotion: normal
    text: のり巻きのかんぴょうは、関東と関西で色を変えるそうよ。
  - speaker: zundamon
    emotion: surprised
