  - speaker: tsumugi
    emotion: normal
    text: 色は、スプレーや筆で一つずつ付けて、最後につやを出すのよ。
  - speaker: zundamon
    emotion: thinking
    text: 棚の部品が、すごい数なのだ。
  - speaker: tsumugi
    emotion: normal
