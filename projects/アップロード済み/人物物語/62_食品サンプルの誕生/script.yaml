  - speaker: tsumugi
    emotion: normal
    text: 野瀬さん自身は、起源はおそらく京都、とも話しているわ。
  - speaker: tsumugi
    emotion: normal
    text: その中で、見本づくりを初めから商売にしたのが、瀧三さんなのよ。
  - speaker: zundamon
    emotion: happy
    text: 発明した人じゃなくて、広めた人なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 野瀬さんによると、関西では早くから、町の小さな店もサンプルを置いたようなの。
- id: card1939
  title: ''
  background: sp_card_1939
  cuts:
  - speaker: reimu
    text: 1939年。材料のパラフィンが、国の統制品になります。
    reading: せんきゅうひゃく さんじゅうきゅうねん。ざいりょうの ぱらふぃんが くにの とうせいひんに なります。
- id: ch4_senji
