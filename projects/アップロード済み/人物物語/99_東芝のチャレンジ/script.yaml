    text: 修理や問い合わせの窓口も、それぞれの会社。保証書で確かめてね。
  - speaker: zundamon
    emotion: thinking
    text: 保証書、どこにしまったっけ……。
  - speaker: tsumugi
    emotion: normal
    text: それと、東芝の株は今は市場で買えないわ。
  - speaker: tsumugi
    emotion: normal
    text: 過去最高益の大半も、持っているキオクシア株の値上がりなの。
  - speaker: tsumugi
    emotion: thinking
    text: 株価が下がれば、逆に損が出るわ。
  - speaker: zundamon
    emotion: thinking
    text: 4兆円稼いだ、とは言えないのか。
  - speaker: tsumugi
    emotion: normal
    text: そう言うと、言い過ぎね。本業の伸びは、営業利益率で見るのよ。
