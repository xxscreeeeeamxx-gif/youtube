meta:
  title: 東芝が社内で「チャレンジ」と呼んだ利益目標、その先で74年の上場に幕【ずんだもん解説】
  slug: toshiba-delisting
  hook_line: 日本の電機の名門・東芝は、なぜ74年の上場をやめるまでになったのか。
  summary: 2015年7月、東芝の家電の設計の部屋に、第三者委員会の報告書のコピーが届きます。社内で「チャレンジ」と呼ばれた利益目標とは、何だったのか。家電の売却、海外の原発、株主との対立を経て、名門は2023年に上場をやめます。1991年入社の冷蔵庫の技術者（架空の人物）の目で、報告書の認定と裁判所の判断、会社と株主と国の言い分を並べて、再現ドラマでたどります。（2026年10月時点）
  sources:
  - 東芝「第三者委員会 調査報告書（全文）」（2015年7月21日） https://www.global.toshiba/content/dam/toshiba/migration/corp/irAssets/about/ir/jp/news/20150721_1.pdf
  - 金融庁「株式会社東芝に係る有価証券報告書等の虚偽記載に対する課徴金納付命令の決定について」（2015年12月25日） https://www.fsa.go.jp/news/27/syouken/20151225-2.html
  - 東芝「当社海外連結子会社ウェスチングハウス社等の再生手続の申立について」（2017年3月29日） https://www.global.toshiba/content/dam/toshiba/migration/corp/irAssets/about/ir/jp/news/20170329_1.pdf
  - 東芝「調査報告書（第181期定時株主総会の運営）」（2021年6月10日） https://www.global.toshiba/content/dam/toshiba/migration/corp/irAssets/about/ir/jp/stock/pdf/tsm182_4.pdf
  - 東芝「TBJHによる公開買付けの結果」（2023年9月21日） https://www.global.toshiba/content/dam/toshiba/jp/ir/corporate/news/20230921_1.pdf
  - 時事通信「東芝側の逆転敗訴が確定 不正会計、旧経営陣の責任認めず―最高裁」（2026年10月15日） https://www.jiji.com/jc/article?k=2026101500951&g=soc
