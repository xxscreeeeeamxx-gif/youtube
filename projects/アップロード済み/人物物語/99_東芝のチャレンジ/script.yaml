scenes:
# ---- 先出し（2023年12月19日・最後の売買日） ----
- id: co_owarine
  title: ''
  background: tb_shoken
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 技術者, emotion: thinking}
  - {who: doryo, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 2023年12月19日。東芝の株が売り買いされる、最後の日です。
    reading: にせん にじゅうさんねん じゅうにがつ じゅうくにち。とうしばの かぶが うりかい される、さいごの ひです。
  - speaker: doryo
    emotion: thinking
    text: '[終値|おわりね]は4590円だってさ。明日で上場廃止だ。'
  - speaker: zundamon
    emotion: thinking
    text: ……74年も、上場してたんだよな。
  - speaker: doryo
    emotion: normal
    text: お前の冷蔵庫には、まだ東芝って書いてあるのにな。
  - speaker: zundamon
    emotion: sad
    text: 作ってる会社は、もう[美的集団|びてきしゅうだん]のグループだけどね。
  - speaker: reimu
    text: 経営破綻ではありません。TOB、株の公開買い付けによる非公開化です。
    reading: けいえい はたんでわ ありません。てぃーおーびー、かぶの こうかい かいつけに よる ひこうかいかです。
    telops:
    - {text: "終値4590円　74年の上場に幕", size: lg, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: 日本の電機の名門は、なぜ上場をやめるまでになったのでしょう。
    reading: にほんの でんきの めいもんわ、なぜ じょうじょうお やめる までに なったのでしょう。
# ---- 今の部屋（東芝の冷蔵庫） ----
- id: hook
  title: ''
  background: tb_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ 東芝の冷蔵庫を買ったのだ！
  - speaker: tsumugi
    emotion: normal
    text: その冷蔵庫の会社は、2016年から中国の[美的集団|びてきしゅうだん]のグループよ。
  - speaker: zundamon
    emotion: surprised
    text: えっ！？ 東芝が作ってるんじゃないのだ！？
    se: bikkuri
  - speaker: tsumugi
    emotion: normal
    text: 東芝は家電を売って、株の上場もやめたの。
  - speaker: zundamon
    emotion: thinking
    text: 名門の東芝が、なんでそこまで……。
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、社内でチャレンジと呼ばれた数字なの。
# ---- 2015年7月21日・報告書が出た日 ----
- id: card2015
  title: ''
  background: tb_card_2015
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 2015年7月21日。東芝の、家電の設計の部屋です。
    reading: にせん じゅうごねん しちがつ にじゅういちにち。とうしばの かでんの せっけいの へやです。
  - speaker: reimu
    text: 冷蔵庫を設計しているのは、1991年に入社した技術者です。
    reading: れいぞうこお せっけい して いるのわ、せんきゅうひゃく きゅうじゅういちねんに にゅうしゃ した ぎじゅつしゃです。
- id: ch1_challenge
  title: チャレンジという言葉
  background: tb_sekkei
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 技術者, emotion: normal}
  - {who: senpai, x: 0.7, emotion: thinking}
  cuts:
  - speaker: senpai
    emotion: thinking
    text: 第三者委員会の報告書だ。全文で303ページある。
  - speaker: zundamon
    emotion: surprised
    text: 303ページ！？ 冷蔵庫の説明書より分厚いですね。
  - speaker: senpai
    emotion: angry
    text: 比べるな。読め。
    beat: true
  - speaker: senpai
    emotion: normal
    text: 委員会が調べた7年分で、利益の修正は1518億円だ。
  - speaker: zundamon
    emotion: surprised
    text: せ、1518億円！？ うちの会社で、何が起きてたんです……。
  - speaker: senpai
    emotion: normal
    text: カギは、この言葉だ。チャレンジ。
  - speaker: zundamon
    emotion: happy
    text: いい言葉じゃないですか。ボクのチャレンジは、冷蔵庫の省エネです。
  - speaker: senpai
    emotion: thinking
    text: そのチャレンジとは、違う。
    se: hammer
  - speaker: senpai
    emotion: normal
    text: 社長に各部門が数字を報告する、社長月例って会議がある。
  - speaker: senpai
    emotion: normal
    text: そこで社長が示す収益改善の目標を、社内でチャレンジと呼んでた。
  - speaker: senpai
    emotion: normal
    text: 報告書によると、四半期末が近づいてもう届かない時期にも示された。
  - speaker: senpai
    emotion: thinking
    text: しかも会社の実力以上に、かさ上げした数字でな。
  - speaker: zundamon
    emotion: thinking
    text: 届かないのに、どうやって合わせるんです？
  - speaker: senpai
    emotion: normal
    text: 報告書の言葉だと、来期の利益の先取りと今期の費用の先送りだ。
  - speaker: zundamon
    emotion: thinking
    text: 先に取って、後に回す。じゃあ来期は？
  - speaker: senpai
    emotion: normal
    text: 穴から始まる。そこへ、また大きなチャレンジが来る。
  - speaker: zundamon
    emotion: surprised
    text: 雪だるまじゃないですか！
  - speaker: senpai
    emotion: normal
    text: 報告書も、その繰り返しで規模が広がったと認定してる。
  - speaker: senpai
    emotion: normal
    text: 一番分かりやすいのが、2012年9月のパソコンだ。
# ---- 報告書の再現：2012年9月の社長月例 ----
- id: ch1_getsurei
  title: 残り3日で120億円
  background: tb_getsurei
  bgm: serious
  stage:
  - {who: cp, x: 0.28, flip: true, emotion: thinking}
  - {who: shacho, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: ここからは、報告書に残る2012年9月の社長月例です。
    reading: ここからわ ほうこくしょに のこる にせん じゅうにねん くがつの しゃちょう げつれいです。
  - speaker: cp
    emotion: thinking
    text: '[上期|かみき]の見込みは、マイナス201億円。80億円の改善にチャレンジします。'
  - speaker: shacho
    emotion: angry
    text: 全くダメ。やり直し。
    se: don
    telops:
    - {text: "報告書の記録　社長「全くダメ。やり直し。」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: reimu
    text: 27日、見込みはさらに悪化。報告書によると、社長は残り3日での120億円の利益改善を強く求めました。
    reading: にじゅうしちにち、みこみわ さらに あっか。ほうこくしょに よると しゃちょうわ のこり みっかでの ひゃくにじゅうおくえんの りえき かいぜんお つよく もとめました。
    background: tb_getsurei_akaji
    telops:
    - {text: "残り3日で120億円", size: lg, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: 翌28日、部門は119億円の損益対策を報告し、社長らは実施を認めました。
    reading: よく にじゅうはちにち、ぶもんわ ひゃくじゅうきゅうおくえんの そんえき たいさくお ほうこく し しゃちょうらわ じっしお みとめました。
# ---- 設計の部屋：売上より多い利益 ----
- id: ch1_bunshi
  title: 売上より多い利益
  background: tb_sekkei
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 技術者, emotion: surprised}
  - {who: senpai, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 3日で120億円！？ [1日|いちにち]40億円じゃないですか！
  - speaker: senpai
    emotion: normal
    text: 報告書の別紙だと、その月のパソコンは売上624億円。営業利益は651億円だ。
    telops:
    - {text: "2012年9月のパソコン　売上624億円・営業利益651億円", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: ……売上より、もうけのほうが多い？
  - speaker: senpai
    emotion: normal
    text: '[1億分の1|イチオクブンノイチ]にすると、624円売った店が651円もうけたことになる。'
  - speaker: zundamon
    emotion: angry
    text: 仕入れがタダでも、ムリですよ！
    se: tsukkomi
  - speaker: senpai
    emotion: thinking
    text: 翌月の10月は、マイナス573億円だ。
  - speaker: zundamon
    emotion: sad
    text: しぼんだ……。
  - speaker: senpai
    emotion: normal
    text: 報告書は、月別の損益だけでも異常さは[一見|いっけん]して明白だったと書いてる。
  - speaker: zundamon
    emotion: thinking
    text: でも、どうやったら売上を超えるんです？
  - speaker: senpai
    emotion: normal
    text: パソコンは、台湾の会社に組み立てを任せてる。
  - speaker: senpai
    emotion: normal
    text: 東芝が部品をまとめて買って、その会社に買った値段より高く渡す。
  - speaker: zundamon
    emotion: surprised
    text: 高く？ なんでわざわざ。
  - speaker: senpai
    emotion: normal
    text: 仕入れ値を、よその会社に知られないためだそうだ。
  - speaker: senpai
    emotion: normal
    text: 組み上がったパソコンは、東芝が買い取る。これが[Buy-Sell|バイセル]取引だ。
  - speaker: senpai
    emotion: thinking
    text: 報告書が問題にしたのは、四半期末に必要以上の部品を押し込んだことだ。
  - speaker: senpai
    emotion: thinking
    text: 高く渡した差額で、その期の利益をかさ上げした。そう認定してる。
  - speaker: zundamon
    emotion: thinking
    text: 押し込んだ[分|ぶん]、翌月にしぼむのか。
  - speaker: reimu
    text: このバイセルを、のちの裁判所は報告書とは違う目で見ることになります。
    reading: この ばいせるお のちの さいばんしょわ、ほうこくしょとわ ちがう めで みる ことに なります。
# ---- 請求書を来期へ・工事・風土 ----
- id: ch1_co
  title: 請求書を来期へ
  background: tb_sekkei
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 技術者, emotion: thinking}
  - {who: senpai, x: 0.7, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: うちの家電は、関係ないですよね？
  - speaker: senpai
    emotion: thinking
    text: 報告書によると、テレビでは広告や物流の請求書を次の四半期へ遅らせてもらってた。
  - speaker: senpai
    emotion: normal
    text: 社内の呼び名は、キャリーオーバーだ。
  - speaker: zundamon
    emotion: thinking
    text: 今月のカード払いを、来月の分にする家計簿みたいな……。
  - speaker: senpai
    emotion: normal
    text: 払う額は同じなのに、今月だけ黒字に見えるやつだ。
  - speaker: senpai
    emotion: normal
    text: インフラの工事では、受注のときに80億円ほどの損失が見込まれた案件がある。
  - speaker: senpai
    emotion: thinking
    text: それでも、損失の引当金を積まなかった。報告書の認定だ。
  - speaker: zundamon
    emotion: thinking
    text: 分かってた損を、後回し……。
  - speaker: senpai
    emotion: thinking
    text: 上司の意向に逆らうことができない企業風土があった、と報告書は書いてる。
  - speaker: zundamon
    emotion: sad
    text: ……逆らえない、か。
    beat: true
  - speaker: reimu
    text: 部品と請求書と工事。数字の合わせ方は、この会社をどこへ連れていくのでしょう。
    reading: ぶひんと せいきゅうしょと こうじ。すうじの あわせかたわ、この かいしゃお どこえ つれて いくのでしょう。
# ---- 何でも作る名門（短く） ----
- id: ch1_meimon
  title: 何でも作る名門
  background: tb_sekkei
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 技術者, emotion: sad}
  - {who: senpai, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: sad
    text: うちは、[からくり儀右衛門|カラクリギエモン]が銀座に作った工場から始まった会社なのに。
  - speaker: senpai
    emotion: normal
    text: 日本で最初の炭素電球を作った、[白熱舎|はくねつしゃ]もご先祖だな。
  - speaker: zundamon
    emotion: normal
    text: 電球から原子力まで、何でも作る名門です。
    se: jaan
  - speaker: reimu
    text: 何でも作る会社。その何でもを、この会社は次々に手放していくことになります。
    reading: なんでも つくる かいしゃ。その なんでもお この かいしゃわ、つぎつぎに てばなして いく ことに なります。
  - speaker: senpai
    emotion: normal
    text: 原子力といえば、2006年に54億ドルで買ったアメリカの会社もある。
  - speaker: zundamon
    emotion: normal
    text: ウェスチングハウスですね。原子力の事業が、2015年までに約3倍になる見込みって。
  - speaker: senpai
    emotion: thinking
    text: 買ったのは、パソコン出身の[西田|ニシダ]さんが社長のときだ。
  - speaker: reimu
    text: 54億ドルは、当時のレートで約6210億円。このウェスチングハウスが、2017年に東芝の底を抜きます。
    reading: ごじゅうよんおくどるわ とうじの れーとで やく ろくせん にひゃく じゅうおくえん。この うぇすちんぐはうすが にせん じゅうななねんに とうしばの そこお ぬきます。
  - speaker: senpai
    emotion: normal
    text: その[西田|ニシダ]さんが社長だったころの社長月例も、報告書に出てくる。
# ---- 報告書の再現：2008年12月の社長月例 ----
- id: ch1_2008
  title: 2008年の社長月例
  background: tb_getsurei
  bgm: serious
  stage:
  - {who: cp, x: 0.28, flip: true, emotion: thinking}
  - {who: shacho08, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 報告書に残る、2008年12月の社長月例。リーマン・ショックの後です。
    reading: ほうこくしょに のこる にせん はちねん じゅうにがつの しゃちょう げつれい。りーまん しょっくの あとです。
  - speaker: cp
    emotion: thinking
    text: 第3四半期の営業利益は、マイナス184億円の見込みです。
  - speaker: shacho08
    emotion: angry
    text: こんな数字はずかしくて、公表できない。
  - speaker: reimu
    text: 報告書によると、この期も部品の押し込みが行われ、12月だけで営業利益207億円。
    reading: ほうこくしょに よると この きも ぶひんの おしこみが おこなわれ、じゅうにがつ だけで えいぎょう りえき にひゃく ななおくえん。
  - speaker: reimu
    text: 翌1月は、マイナス192億円でした。
    reading: よく いちがつわ まいなす ひゃく きゅうじゅうにおくえんでした。
    background: tb_getsurei_akaji
  - speaker: reimu
    text: 2008年の社長は、西田厚聰です。
    reading: にせん はちねんの しゃちょうわ、にしだ あつとしです。
- id: ch1_2008_kakikata
  title: ''
  background: tb_sekkei
