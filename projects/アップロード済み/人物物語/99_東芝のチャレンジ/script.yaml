  - speaker: tsumugi
    emotion: normal
    text: 経産大臣は事実関係に疑問があると反論したから、ここも両方の言い分があるの。
  - speaker: tsumugi
    emotion: normal
    text: 株主が東芝を助けて、ぶつかって。最後は国内の連合が全部買ったの。
  - speaker: zundamon
