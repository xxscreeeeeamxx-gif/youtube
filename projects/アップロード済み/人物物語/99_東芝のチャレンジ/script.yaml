# ---- 論争の章 ----
- id: ronso1
  title: 東芝は不正で潰れた？
  background: tb_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、ネットで見たのだ！
  - speaker: zundamon
    emotion: angry
    text: 東芝は、粉飾決算と原発で潰れたって！
  - speaker: tsumugi
    emotion: normal
    text: まず、東芝は潰れてないの。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: 上場廃止は、株の買い付けによる非公開化。ウェスチングハウスは、アメリカの再生手続よ。
  - speaker: zundamon
    emotion: surprised
    text: 東芝は、潰れてなかったのか。
  - speaker: tsumugi
    emotion: normal
    text: 次に言葉。報告書は不適切な会計処理。金融庁は虚偽記載。大手の報道は不正会計よ。
  - speaker: zundamon
    emotion: thinking
    text: 呼び方が、ばらばらだ。
  - speaker: tsumugi
    emotion: normal
    text: 会社としての東芝は虚偽記載の事実と課徴金を認めて、決算を訂正したの。
  - speaker: zundamon
    emotion: angry
    text: じゃあ、悪いのは社長たちなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: そこは、分けて考えるの。
  - speaker: tsumugi
    emotion: normal
    text: 報告書は、経営トップらを含めた組織的な関与があったと認定したわ。
  - speaker: tsumugi
    emotion: normal
    text: でも刑事では、誰も責任を問われていない。[監視委|かんしい]は、告発を断念したの。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、お[金|かね]の責任は？
  - speaker: tsumugi
    emotion: normal
    text: 会社が旧経営陣5人に、32億円の賠償を求めて訴えたの。
  - speaker: tsumugi
    emotion: thinking
    text: 訴えられた5人のうち[西田|ニシダ]さんは、裁判の途中の2017年に亡くなってるわ。
  - speaker: tsumugi
    emotion: normal
    text: '[一審|いっしん]はインフラの工事の引当てを違法として、一部に賠償を命じたわ。'
  - speaker: tsumugi
    emotion: normal
    text: パソコンの取引は違反とせず、[西田|ニシダ]さんの責任も認めなかったの。
  - speaker: tsumugi
    emotion: normal
    text: 二審は逆転。バイセルを、適法としたの。
  - speaker: tsumugi
    emotion: normal
    text: 一般的な会計基準はなく、各企業で独自の会計処理をしていたって。
  - speaker: tsumugi
    emotion: normal
    text: インフラは、一部で引当てが適切でなかったと指摘したの。
  - speaker: tsumugi
    emotion: normal
    text: でも会社の規模を踏まえると、重要事項の虚偽記載とまでは認められないって判断よ。
  - speaker: tsumugi
    emotion: thinking
    text: そして2026年10月14日。最高裁が、東芝の上告を退けたの。
  - speaker: tsumugi
    emotion: normal
    text: 旧経営陣の賠償責任を認めない判決が、確定したわ。
    telops:
    - {text: "最高裁　旧経営陣の賠償責任を認めず確定", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 報告書と裁判で、答えが違うのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 報告書は、会社の中で何が起きたかを調べたもの。
  - speaker: tsumugi
    emotion: normal
    text: 裁判は、個人がお[金|かね]を払う責任があるかを法律で決めたものなの。
  - speaker: tsumugi
    emotion: normal
    text: 会社は認めた。個人の責任は、裁判では認められなかった。どっちも本当よ。
  - speaker: zundamon
    emotion: thinking
    text: 白黒つけたいのに、灰色なのだ……。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 金額の桁も見てね。利益の訂正は、7年分で2248億円。
  - speaker: tsumugi
    emotion: normal
    text: 原子力は、のれんの[減損|げんそん]の見通しだけで1年に7125億円よ。
  - speaker: zundamon
    emotion: surprised
    text: 原発のほうが、ずっと大きい……。
