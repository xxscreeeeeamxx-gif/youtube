    reading: けいさんしょうの たいおうわ、せいさくと して とうぜんだと いう たちばです。
  - speaker: kabunushi
    emotion: thinking
    text: 調べた側と国の側で、言い分が真っ向から違うのか。
  - speaker: reimu
    text: 6月の総会では、取締役会の議長の再任が否決。社長も4月に替わっていました。
    reading: ろくがつの そうかいでわ とりしまりやくかいの ぎちょうの さいにんが ひけつ。しゃちょうも しがつに かわって いました。
  - speaker: reimu
    text: 翌2022年3月には、会社を2つに分ける案も株主総会で否決されます。
    reading: よく にせん にじゅうにねん さんがつにわ、かいしゃお ふたつに わける あんも かぶぬし そうかいで ひけつ されます。
  - speaker: kabunushi
    emotion: sad
