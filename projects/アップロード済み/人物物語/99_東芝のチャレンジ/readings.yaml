# toshiba-delisting 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# 東芝 は dictionary.yaml に登録済み（トウシバ）なのでタグを付けていない。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 技術者 / label: 経理の先輩・田中社長・綱川社長・島田社長・池谷副社長 ほか）とテロップは表示専用なのでタグを付けていない。
# 「元（もと）」は 元社長 などにも掛かるので台帳に入れず、締めの1か所だけ本文のタグで読ませている。
# 2026-10-23 見直し: 西田・からくり儀右衛門・経産省・1億分の1 のタグの読みはカタカナで書いた（[西田|ニシダ] など）。
# 「押し込んだ分」が ワケ と読まれたので本文で [分|ぶん] を付けた（分 は 7年分 などにも掛かるので台帳には入れない）。
