scenes:
# ---- 先出し（2010年春・役員会議室） ----
- id: co_issen
  title: ''
  background: jl_kaigi
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 稲盛和夫, emotion: thinking}
  - {who: shikko, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2010年の春。破綻した日本航空の本社で、役員が予算の説明をしています。
    reading: にせん じゅうねんの はる。はたん した にほん こうくうの ほんしゃで、やくいんが よさんの せつめいお して います。
  - speaker: shikko
    emotion: normal
    text: こちらの事業に、10億円ほどの予算を執行したく……。
  - speaker: zundamon
    emotion: angry
    text: あんたには10億円どころか、[一銭|いっせん]もあずけられませんな。
    se: don
  - speaker: shikko
    emotion: surprised
    text: い、[一銭|いっせん]も……。
  - speaker: reimu
    text: 会長は、京セラを作った稲盛和夫、78歳。航空の仕事は、これが初めてです。
    reading: かいちょうわ、きょうせらお つくった いなもり かずお ななじゅうはっさい。こうくうの しごとわ これが はじめてです。
  - speaker: reimu
    text: この会社は1月、負債2兆3221億円で破綻しました。それが2年8か月で、上場に戻ります。
    reading: この かいしゃわ いちがつ、ふさい にちょう さんぜん にひゃく にじゅういちおくえんで はたん しました。それが にねん はちかげつで じょうじょうに もどります。
    telops:
    - {text: "負債2兆3221億円", size: lg, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: 毎日1000機を飛ばしていた会社は、なぜ破綻したのか。航空の素人は、どう立て直したのでしょう。
    reading: まいにち せんきお とばして いた かいしゃわ、なぜ はたん したのか。こうくうの しろうとわ どう たてなおしたのでしょう。
# ---- 今の部屋（旅行かばん） ----
- id: hook
  title: ''
  background: jl_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ 冬休みの飛行機、[JAL|ジャル]で予約したのだ！
  - speaker: tsumugi
    emotion: normal
    text: その会社、2010年に一度破綻してるのよ。
  - speaker: zundamon
    emotion: surprised
    text: えっ！？ じゃあボクの飛行機、飛ぶの！？
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 破綻した日も、飛行機は飛んでたの。
  - speaker: zundamon
    emotion: thinking
    text: 飛んでるのに、なんでつぶれるの？
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、3か月遅れで届く数字なの。
# ---- 2010年2月・本社 ----
- id: card2010
  title: ''
  background: jl_card_2010
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 2010年2月。東京・天王洲アイルの、日本航空の本社です。
    reading: にせん じゅうねん にがつ。とうきょう てんのうず あいるの にほん こうくうの ほんしゃです。
  - speaker: reimu
    text: 会長に就いたばかりの稲盛は、月々の決算を見たいと言いました。
    reading: かいちょうに ついた ばかりの いなもりわ、つきづきの けっさんお みたいと いいました。
- id: ch1_kessan
  title: 3か月遅れの決算
  background: jl_kaigi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 稲盛和夫, emotion: normal}
  - {who: keiri, x: 0.7, emotion: normal}
  cuts:
  - speaker: keiri
    emotion: normal
    text: 会長、こちらが最新の決算です。
  - speaker: zundamon
    emotion: thinking
    text: ……これは、3か月も4か月も前の数字ですな。
  - speaker: keiri
    emotion: normal
    text: 当社には世界中に支店があって毎日1000機飛んでいる。
    telops:
    - {text: "幹部「毎日1000機飛んでいる」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: keiri
    emotion: normal
    text: 各支店や空港の数字を集めて、まとめるのだから時間がかかるのは当然です。
  - speaker: zundamon
    emotion: angry
    text: そんなのは経営なんかではありません。
    se: tsukkomi
  - speaker: zundamon
    emotion: angry
    text: 飛行機のコックピットには、計器がいっぱいあって……
  - speaker: zundamon
    emotion: normal
    text: その計器を全部見なければ、安全に飛べないはずだろう。
  - speaker: keiri
    emotion: thinking
    text: ……はあ。
- id: ch1_binbetsu
  title: ''
  background: jl_kaigi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 稲盛和夫, emotion: normal}
  - {who: keiri, x: 0.7, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: 経営とは、会計学的な計数を見てするのが基本です。
  - speaker: zundamon
    emotion: normal
    text: どの[便|びん]がもうかって、どの[便|びん]が赤字なんです？
  - speaker: keiri
    emotion: thinking
    text: '[便ごと|びんごと]の損得は……分かりません。'
  - speaker: zundamon
    emotion: surprised
    text: 1000機も飛ばして、1[便ごと|びんごと]の損得が誰にも分からない？
  - speaker: keiri
    emotion: normal
    text: 全体で黒字なら、赤字の路線も守る。それが、うちの考え方でして。
  - speaker: zundamon
    emotion: thinking
    text: その全体は、黒字なんですか。
  - speaker: keiri
    emotion: sad
    text: いえ。去年の4月から9月の半年で、最終赤字は1312億円です。
  - speaker: zundamon
    emotion: thinking
    text: '[1日|いちにち]にすると？'
  - speaker: keiri
    emotion: sad
    text: 約7億円。1時間で、約3000万円です。
    background: jl_kaigi_akaji
    telops:
    - {text: "1時間に約3000万円の赤字", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: zundamon
    emotion: angry
    text: この会議も、1時間やれば3000万円の赤字ですな。
  - speaker: keiri
    emotion: surprised
    text: ……で、では手短に。
    se: manuke
  - speaker: keiri
    emotion: thinking
    text: リーマン・ショックと新型インフルで、国際線の旅客収入は4割以上減りまして。
  - speaker: keiri
    emotion: normal
    text: 同じ波は、[ANA|エーエヌエー]さんにも来てますが……。
  - speaker: zundamon
    emotion: thinking
    text: なら、差は会社の中ですな。
  - speaker: keiri
    emotion: thinking
    text: もう一つ重いのが、企業年金です。
  - speaker: zundamon
    emotion: surprised
    text: 年金？
  - speaker: keiri
    emotion: normal
    text: 予定利率が、4.5％のままなんです。この低金利の時代に。
  - speaker: keiri
    emotion: thinking
    text: 積み立ての不足は、3000億円を超えるといわれます。
  - speaker: zundamon
    emotion: thinking
    text: 見えない借金ですな……。
# ---- 降りられない路線 ----
- id: ch1_rosen
  title: 降りられない路線
  background: jl_kaigi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 稲盛和夫, emotion: thinking}
  - {who: rosen, x: 0.7, emotion: normal}
  cuts:
  - speaker: rosen
    emotion: normal
    text: 路線の担当です。赤字の路線も、簡単には降りられないんです。
  - speaker: zundamon
    emotion: thinking
    text: なぜです？
  - speaker: rosen
    emotion: normal
    text: たとえば静岡空港の福岡線には、搭乗率の保証という約束があります。
  - speaker: rosen
    emotion: normal
    text: 搭乗率が70％を切ったら、県が1席あたり1万5800円を払うんです。
    telops:
    - {text: "1席あたり1万5800円", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 席が[埋まらない|うまらない]と、県がお[金|かね]を！？
    beat: true
  - speaker: rosen
    emotion: thinking
    text: うちは静岡から、4月で撤退します。県は、払わないと伝えてきました。
  - speaker: rosen
    emotion: normal
    text: 地元や政治から、飛ばしてくれと頼まれる路線も多いんです。
  - speaker: rosen
    emotion: normal
    text: 飛行機も、ジャンボのような大型機が多くて。ピークで、約80機ありました。
  - speaker: zundamon
    emotion: thinking
    text: 大きすぎる飛行機で、降りられない路線を飛ぶ。
  - speaker: zundamon
    emotion: thinking
    text: そのうえ、1[便ごと|びんごと]の損得は誰も知らん。
  - speaker: zundamon
    emotion: angry
    text: ……つぶれん[方|ほう]が、おかしいですな。
    beat: true
  - speaker: reimu
    text: このとき、まだ誰も、この会社が2年8か月で上場に戻るとは思っていません。
    reading: この とき まだ だれも、この かいしゃが にねん はちかげつで じょうじょうに もどるとわ おもって いません。
  - speaker: reimu
    text: 素人の会長、稲盛和夫とは何者なのか。
    reading: しろうとの かいちょう、いなもり かずおとわ なにものなのか。
# ---- 稲盛のはじまり（短く） ----
- id: card1963
  title: ''
  background: jl_card_1963
  bgm: curious
  cuts:
  - speaker: reimu
    text: 1963年。京都セラミック、いまの京セラの滋賀工場ができました。
    reading: せんきゅうひゃく ろくじゅうさんねん。きょうと せらみっく、いまの きょうせらの しが こうじょうが できました。
  - speaker: reimu
    text: 4年前、27歳の稲盛が資本金300万円で作った会社です。
    reading: よねん まえ、にじゅうななさいの いなもりが しほんきん さんびゃくまんえんで つくった かいしゃです。
- id: ch2_ameba
  title: アメーバの始まり
  background: jl_seramikku
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 稲盛和夫, emotion: normal}
  - {who: hancho, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: 班長さん。この組の[生産高|せいさんだか]から、人件費以外の経費を引きなさい。
  - speaker: hancho
    emotion: thinking
    text: 引いて、どうするんです？
  - speaker: zundamon
    emotion: normal
    text: それを、みんなの総労働時間で割る。
  - speaker: hancho
    emotion: thinking
    text: ……1時間あたり、いくら生んだかが分かりますね。
  - speaker: zundamon
    emotion: happy
    text: そう。会社を小さな組に分けて、組ごとに採算を見るんです。
  - speaker: hancho
    emotion: normal
    text: 組の大きさは、決まってるんですか。
  - speaker: zundamon
    emotion: normal
    text: 仕事に合わせて、変えなさい。アメーバのようにな。
  - speaker: hancho
    emotion: surprised
    text: アメーバって……ボクら、単細胞ですか。
    se: tenten
  - speaker: zundamon
    emotion: happy
    text: 組ごとに採算を立てて、自分で動く。ほめ言葉ですな。
  - speaker: reimu
    text: 時間当り採算と、アメーバ経営。この物差しが、47年後に日本航空で効いてきます。
    reading: じかん あたり さいさんと、あめーば けいえい。この ものさしが よんじゅうななねんごに にほん こうくうで きいて きます。
- id: card1984
  title: ''
  background: jl_card_1984
  cuts:
  - speaker: reimu
    text: 1984年。稲盛は、NTTに挑む第二電電を作ります。京セラに、通信の技術者はいませんでした。
    reading: せんきゅうひゃく はちじゅうよねん。いなもりわ えぬてぃーてぃーに いどむ だいに でんでんお つくります。きょうせらに つうしんの ぎじゅつしゃわ いませんでした。
- id: ch2_ddi
  title: ''
  background: jl_seramikku
  stage:
  - {who: zundamon, x: 0.4, flip: true, tag: 稲盛和夫, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 長距離電話は、高すぎる。誰かが、値段を下げなあかん。
  - speaker: zundamon
    emotion: thinking
    text: けど、通信を始める動機は善なのか。そこに、[私心|ししん]はないのか。
  - speaker: zundamon
    emotion: normal
    text: '[動機善|ドーキゼン]なりや、[私心|ししん]なかりしか。……毎晩、自分に聞くのだ。'
  - speaker: reimu
    text: この第二電電が、いまのKDDIです。25年後、稲盛はまた、知らない業界の再建を頼まれることになります。
    reading: この だいに でんでんが、いまの けーでぃーでぃーあいです。にじゅうごねんご いなもりわ また、しらない ぎょうかいの さいけんお たのまれる ことに なります。
# ---- 破綻（2009年9月〜2010年1月） ----
- id: card2009
  title: ''
  background: jl_card_2009
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 2009年9月。政権交代で、国土交通大臣に前原誠司が就きます。
    reading: にせん くねん くがつ。せいけん こうたいで、こくど こうつう だいじんに まえはら せいじが つきます。
- id: ch3_maehara
  title: 法的整理は考えていない
  background: jl_kaiken
  stage:
  - {who: maehara, x: 0.28, flip: true, emotion: normal}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: kisha
    emotion: normal
    text: 大臣、日本航空は法的整理になるんでしょうか。
  - speaker: maehara
    emotion: normal
    text: 法的整理はまったく考えていない。
  - speaker: reimu
    text: 9月24日の会見です。翌日、前原は直轄のタスクフォースを置き、日本航空の自主再建の案は白紙に戻ります。
    reading: くがつ にじゅうよっかの かいけんです。よくじつ まえはらわ ちょっかつの たすくふぉーすお おき、にほん こうくうの じしゅ さいけんの あんわ はくしに もどります。
  - speaker: reimu
    text: 10月29日。日本航空は、企業再生支援機構に支援の検討を申し入れます。その日の会見です。
    reading: じゅうがつ にじゅうくにち。にほん こうくうわ きぎょう さいせい しえん きこうに しえんの けんとうお もうしいれます。その ひの かいけんです。
  - speaker: kisha
    emotion: thinking
    text: 一つの会社のために、なぜ国がそこまで？
  - speaker: maehara
    emotion: normal
    text: 日本の[空|そら]を飛ぶ6割の飛行機は日本航空。
  - speaker: maehara
    emotion: thinking
    text: '[万一|まんいち]、[日航機|にっこうき]が飛ばなくなると日本経済や外国との交流に大きな支障が出る。'
  - speaker: maehara
    emotion: normal
    text: '[一企業|いちきぎょう]だが[公的色彩|こうてきしきさい]が強い。'
  - speaker: kisha
    emotion: surprised
    text: ……6割。
- id: ch3_irai
  title: 引き受けた理由
  background: jl_yakuin
  bgm: 223am
  stage:
