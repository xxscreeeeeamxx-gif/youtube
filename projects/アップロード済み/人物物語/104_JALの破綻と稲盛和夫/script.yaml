- id: ch5_saiban
  title: 165人の裁判
  background: jl_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 大みそかに165人……。これ、裁判になったの？
  - speaker: tsumugi
    emotion: thinking
