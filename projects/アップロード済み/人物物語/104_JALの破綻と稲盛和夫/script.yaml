meta:
  title: 破綻したJALの会長・稲盛和夫「一銭もあずけられませんな」、2年8か月で再上場【ずんだもん解説】
  slug: jal-inamori
  hook_line: 毎日1000機を飛ばしていた日本航空は、なぜ破綻し、どう上場に戻ったのか。
  summary: 2010年1月、日本航空は負債2兆3221億円で破綻します。会長に来たのは、京セラを作った78歳の稲盛和夫。航空の仕事は初めてでした。本社で出てきたのは、3か月も前の決算。毎日1000機を飛ばしながら1便ごとの損得が見えない会社で、素人の会長は何を変えたのか。整理解雇の裁判、公的資金と税の議論、ANAの主張も、双方の言い分を並べながら、再現ドラマでたどります。（2026年10月時点）
  sources:
  - 国土交通省航空局「日本航空の再生について」（2012年11月） https://www.mlit.go.jp/common/000987884.pdf
  - 参議院 国土交通委員会調査室「ＪＡＬの再生問題」『立法と調査』No.301（2010年2月） https://www.sangiin.go.jp/japanese/annai/chousa/rippou_chousa/backnumber/2010pdf/20100201169.pdf
  - 国土交通省「日本航空の上場に当たっての国土交通大臣コメント」（2012年9月19日） https://www.mlit.go.jp/report/press/kouku04_hh_000064.html
  - 京セラ 稲盛ライブラリー「日本航空の再生を支援（2010年）」 https://www.kyocera.co.jp/inamori/archive/episode/episode-18.html
  - 帝国データバンク 倒産速報「株式会社日本航空など3社」（2010年1月19日） https://www.tdb.co.jp/report/bankruptcy/flash/3201/
  - 日本経済新聞「元パイロットも敗訴確定 日航整理解雇訴訟」（2015年2月6日） https://www.nikkei.com/article/DGXLASDG06H3U_W5A200C1000000/
  tags:
  - JAL
  - 日本航空
  - 稲盛和夫
  - 経営破綻
  - 会社更生法
  - 再上場
  - アメーバ経営
  - JALフィロソフィ
  - 企業再生支援機構
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 平成史
