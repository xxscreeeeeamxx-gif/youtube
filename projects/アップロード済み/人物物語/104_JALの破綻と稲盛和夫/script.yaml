  - speaker: tsumugi
    emotion: normal
    text: 物差しは国際基準だから、昔の利益とは比べられないけどね。
  - speaker: zundamon
    emotion: happy
    text: じゃあ今年は、もっと最高なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 今期の予想は、8月の時点で1800億円。減益の見通しなの。
  - speaker: tsumugi
    emotion: thinking
    text: 4月から6月は燃料の高さと円安で、本業のもうけが72％減ったわ。
  - speaker: zundamon
    emotion: surprised
    text: な、72％！？
    se: gaan
  - speaker: tsumugi
    emotion: normal
    text: ここまでの数字は、2026年10月の時点のものよ。
  - speaker: tsumugi
    emotion: thinking
    text: 2024年1月2日。羽田の滑走路で、日本航空の機と海上保安庁の機がぶつかったの。
  - speaker: tsumugi
    emotion: thinking
    text: '[海保|カイホ]の機は6人のうち5人が亡くなったわ。日本航空の機の乗客と乗員は、脱出したの。'
  - speaker: zundamon
    emotion: sad
    text: ……そうだったんだ。
  - speaker: tsumugi
    emotion: thinking
    text: 今年5月には客室乗務員2人が乗務の前の晩にお酒を飲んで、[便|びん]が42分遅れたの。
  - speaker: tsumugi
    emotion: thinking
    text: 6月に国が厳重注意。社長は、月の報酬を2か月30％減らしたわ。
  - speaker: tsumugi
    emotion: normal
    text: 会社は7月に、再発を防ぐ策を国に出したわ。
  - speaker: zundamon
    emotion: thinking
    text: 手帳には、[尊い|とうとい]命をお預かりする仕事って……。
  - speaker: tsumugi
    emotion: normal
    text: 3月には、2035年までの長い計画も出したの。
  - speaker: tsumugi
    emotion: normal
    text: 2030年度に、本業のもうけ3000億円を目指すって。
  - speaker: tsumugi
    emotion: normal
    text: 利益の半分を、フルサービスの航空以外で稼ぐ体制も目指すの。
  - speaker: zundamon
    emotion: surprised
    text: 飛行機の会社が、飛行機以外で？
  - speaker: tsumugi
    emotion: happy
    text: 格安航空やマイル、金融などね。
  - speaker: tsumugi
    emotion: normal
    text: フィロソフィの教育は2022年の論文の時点でも、名前を変えて続いてたわ。
# ---- 論争の章 ----
- id: ronso1
  title: 税金で救われた？
  background: jl_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、ネットで見たのだ！
  - speaker: zundamon
    emotion: angry
    text: '[JAL|ジャル]は、税金で救われたって！'
  - speaker: tsumugi
    emotion: normal
    text: 半分は合ってて、半分は違うの。
  - speaker: tsumugi
    emotion: normal
    text: 国と民間がお[金|かね]を出し合った機構が、3500億円を出資したわ。
  - speaker: tsumugi
    emotion: normal
    text: 政府が全部の株を持つ銀行も、つなぎのお[金|かね]を貸したの。
  - speaker: tsumugi
    emotion: normal
    text: 法人税も軽くなったわ。過去の赤字を、あとの利益と差し引ける仕組みなの。
  - speaker: tsumugi
    emotion: normal
    text: 2011年度だけで、約350億円よ。
  - speaker: zundamon
    emotion: angry
    text: やっぱり、まけてもらってるのだ！
  - speaker: tsumugi
    emotion: normal
    text: '[ANA|エーエヌエー]も、税金をまけてもらっていると主張したわ。'
  - speaker: tsumugi
    emotion: normal
    text: でも機構の3500億円は、再上場で6633億円になって戻ったの。
  - speaker: zundamon
    emotion: surprised
    text: 増えて、戻ってる！？
    beat: true
  - speaker: tsumugi
    emotion: thinking
    text: 損をかぶったのは、主に銀行と株主と社員よ。
  - speaker: tsumugi
    emotion: thinking
    text: 銀行は5215億円を[棒引き|ぼうびき]。株は100％減資で、全部消えたわ。
  - speaker: tsumugi
    emotion: thinking
    text: グループの人員は[3分の1|さんぶんのいち]減って、平均の給料は28％下がった。年金も減ったの。
  - speaker: tsumugi
    emotion: normal
    text: 赤字を繰り越す仕組みは日本の法人の約7割が使う、ふつうの制度でもあるの。
  - speaker: zundamon
    emotion: thinking
    text: 救われたのか、救われてないのか……。
  - speaker: tsumugi
    emotion: normal
    text: 出したお[金|かね]は戻った。でも、税の軽さとたくさんの人の負担があった。両方なのよ。
- id: ronso2
  title: 稲盛マジック？
  background: jl_heya
  stage:
