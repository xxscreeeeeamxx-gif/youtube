# jal-inamori 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 稲盛和夫 / label: 経理の幹部・植木義晴・瀬戸委員長 ほか）とテロップ・章タイトルは表示専用なのでタグを付けていない。
# 大西（オオニシ）は標準の読みで読めるので台帳に入れていない（つむぎの「大西さん」はタグなし）。
# 便（びん）・方（ほう）・分（ぶん）・根（ね）・値（あたい）・年（とし）・空（そら）は
# 定期便・考え方・半分・根っこ・値段・2010年・空港 などにも掛かるので台帳に入れず、本文の該当箇所だけタグを付けた。
# 2026-10-28 見直し: 稲盛・海保・鶴丸・動機善・棒引き(ch5_keikaku)・1日付 のタグの読みはカタカナで書いた（[稲盛|イナモリ] など）。
# 大西の『根』『切れる』は括弧ごとタグにした（[『根』を|ねを]・[『切れる』|きれる]）。
