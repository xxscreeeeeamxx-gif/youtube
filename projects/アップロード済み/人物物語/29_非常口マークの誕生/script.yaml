# 非常口マーク再現ドラマ・ミーム版（[太田幸夫|おおたゆきお]・1939→存命）。投稿前に必ず目視レビュー。
# 配役: ずんだもん=太田幸夫 / つむぎ=消防庁の担当者（実名は出さない） / ナレ=ゆっくり
# ★ミーム禁止の章: sennichi / kemuri / taiyo / newjapan（いずれも多数の死者が出た火災）
# ★存命人物なので、家族・私生活・内面の創作はしない。会話は仕事上のやりとりに限る
# 裏取り: 太田幸夫Wikipedia / 非常口Wikipedia / PRESIDENT Online「日本発、世界標準デザイン！
#   『非常口サイン』」/ Balloon Inc.「非常口ピクトグラムデザイン」/ イロハニアート
# 確定事実:
#   1939 愛知県刈谷市生まれ / 1958 愛知県立刈谷高校卒 / 1962 多摩美術大学美術学部図案科卒
#   1966 多摩美大学院修了、イタリア・ベニス国立美術学院グラフィックデザイン科修了
#   留学中から視覚言語 LoCoS（ロコス）を研究開発
#   1967-70 東京造形大学 助手・講師 / 1970-72 助教授 / 1972-75 ピクトリアル研究所 主任研究員
#   1985-99 多摩美術大学 非常勤講師・教授。現在は太田幸夫デザインアソシエーツ代表
#   1972-5-13 千日デパート火災（大阪）死者118人。誘導灯が梁の付近にあり、煙と停電で見えず
#   1973-11-29 大洋デパート火災（熊本）死者104人。誘導灯が小さく非常口の位置が分からず混乱
#   1979-3 消防庁がデザインを公募。応募は約3300点
#   小谷松敏文の案が入選 → 太田幸夫が改良（58点のバリエーションを制作）
#   入選案に「足先に影をつけてほしい」という条件が加えられた
#   1982-1-20 消防庁告示 / 1982-4-1 施行
#   1982-2-8 ホテルニュージャパン火災 死者33人（施行の直前）
#   施行から1年半で70%以上の誘導灯が新表示に取り換えられた（表示板だけ交換した例が多い）
#   1980 ISO へ提出。すでにソ連案が決まりかけており、再度議論になった
#   視認テストで日本案が優れると判定され、ソ連が案を取り下げた
#   日本案の視認性は通常照明下で約2割、煙の中では約1割よかったと言われている
#   1987 ISO 6309:1987（Fire protection--Safety signs）に採用され国際規格になった
#   緑は赤の補色で炎の中でも見えやすく、気持ちを落ち着ける効果も期待できる
#   太田の言葉「走る人型を囲む空間が見る人を包む空間とつながって走る人は見る人の投影になる」
#   のちに、非常口のある方向が直観的に分かるよう左右を反転させて使うようになった
#   JIS規格の図形なので、いまは誰でも使える公共のデザインになっている
meta:
  title: "【非常口マークの誕生】あの緑の人を描いたのは日本人だった【ずんだもん解説】"
  slug: "exit-sign"
  summary: "毎日どこかで見ている、緑の非常口マーク。あれを描いたのは日本人です。きっかけは、1970年代に百人以上が亡くなった二つのデパート火災でした。文字の表示では、なぜ人は逃げられなかったのか。そして世界標準になるまでに、日本案は何と競ったのか。ずんだもんが太田幸夫を演じる再現ドラマです。"
  tags: ["非常口", "ピクトグラム", "太田幸夫", "デザイン", "ISO", "防災", "再現ドラマ", "ゆっくり", "ずんだもん", "技術史", "ミーム"]
  thumbnail:
    top: "世界に配った"
    bottom: "あの緑の人は日本人"
  mode: drama
  narrator: reimu
  mobs:
    - {id: kyoju, label: "美大の教授", voice: 13, pitch: -0.06, item: book}
    - {id: tenin, label: "ベニスの店主", voice: 12, pitch: 0.04, item: mustache}
    - {id: kacho, label: "消防庁の課長", voice: 13, pitch: -0.1, item: hat}
    - {id: iinkai, label: "ISOの委員", voice: 13, pitch: -0.04, item: mustache}
    - {id: soren, label: "ソ連の代表", voice: 13, pitch: -0.08}
    - {id: gakusei, label: "学生", voice: 12, pitch: 0.07}
scenes:
  - id: hook
    title: ""
    background: il_es_ima
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: zundamon
        emotion: thinking
        text: "つむぎさん。あの緑のやつ。あそこで走ってる人、誰なのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "非常口のマークね。"
      - speaker: zundamon
        emotion: angry
        text: "毎日見てるのに、名前を知らないのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "じゃあ、あれ誰が描いたと思う？"
      - speaker: zundamon
        emotion: normal
        text: "どうせ外国だろ。"
      - speaker: tsumugi
        emotion: normal
        text: "[日本人|にほんじん]だよ。"
        telops:
          - {text: "描いたのは日本人", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#0A1E3A", glow: "#4AA8E8", anim: up}
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "えっ。日本の、あの緑のやつが、世界にあるのか。"
      - speaker: tsumugi
        emotion: happy
        text: "世界にあるよ。しかも、使うのにお金はいらない。"
      - speaker: zundamon
        emotion: angry
        text: "取れよ！ 世界中の建物からちょっとずつもらえば大勝利だぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "お金がいらないから、世界中に付いたの。"
      - speaker: zundamon
        emotion: thinking
        text: "……あーね。ああいうのは全部外国だと思ってたぞ。"
      - speaker: zundamon
        emotion: normal
        text: "……というか、ボクは毎日あれを見てるぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "見てるね。駅でも、ビルでも、映画館でも。"
      - speaker: zundamon
        emotion: normal
        text: "[日本中|にほんじゅう]にあるのか。"
      - speaker: tsumugi
        emotion: happy
        text: "あるよ。会ってる回数だけなら、家族より多いかも。"
      - speaker: zundamon
        emotion: surprised
        text: "ファッ！？ 言われてみると重い関係だぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "そういうこと。じゃあ、どうしてそのマークが必要になったと思う？"
      - speaker: zundamon
        emotion: happy
        text: "そりゃあ、あったほうがオシャレだからなのだ。"
      - speaker: tsumugi
        emotion: sad
        text: "……ううん。人がたくさん亡くなったからだよ。"
      - speaker: zundamon
        emotion: surprised
        text: "……えっ。"
      - speaker: tsumugi
        emotion: normal
        text: "昔の非常口は、ただ漢字で、非常口、って書いてあるだけだったの。"
      - speaker: zundamon
        emotion: normal
        text: "読めるならいいじゃないか。何が問題なんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "煙が入ってきたら、読める？"
      - speaker: zundamon
        emotion: thinking
        text: "……煙。……あっ。"
      - speaker: tsumugi
        emotion: normal
        text: "停電したら、光らない。日本語が読めない人には通じない。"
      - speaker: zundamon
        emotion: sad
        text: "……三つとも、いちばん必要なときに効かないやつなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。それで、百人以上が亡くなる火事が二回起きた。"
      - speaker: zundamon
        emotion: sad
        text: "……二回。"
      - speaker: tsumugi
        emotion: normal
        text: "そのあと[国|くに]が、全国からデザインを募集したの。三千枚以上集まった。"
      - speaker: zundamon
        emotion: surprised
        text: "三千！？ 情報量が多すぎるぞ。"
      - speaker: tsumugi
        emotion: happy
        text: "その中から一枚を選んで、直して、世界に出した人がいる。"
      - speaker: zundamon
        emotion: normal
        text: "……その人が、あの走ってる人を描いたのか。"
      - speaker: tsumugi
        emotion: normal
        text: "[太田幸夫|おおたゆきお]さん。デザイナーだよ。"
      - speaker: zundamon
        emotion: normal
        text: "……知らない名前なのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "でも、あなたはその人の絵を、たぶん今日も見てる。"
      - speaker: zundamon
        emotion: surprised
        text: "……ボク、そんな有名人と毎日会ってたのか。"

  - id: umare
    title: "1939・愛知県刈谷"
    background: il_es_jitaku
    bgm: warm
    stage:
      - {who: zundamon, x: 0.42, tag: "太田", scale: 0.8, flip: true}
    cuts:
      - speaker: reimu
        text: "1939年、[太田幸夫|おおたゆきお]は愛知県[刈谷|かりや]市に生まれました。"
        reading: "せんきゅうひゃくさんじゅうきゅうねん、おおたゆきおわあいちけんかりやしにうまれました。"
      - speaker: reimu
        text: "1958年に[刈谷|かりや]高校を卒業し、東京の[多摩|たま]美術大学へ進みます。"
        reading: "せんきゅうひゃくごじゅうはちねんにかりやこうこうをそつぎょうし、とうきょうのたまびじゅつだいがくえすすみます。"
      - speaker: zundamon
        emotion: happy
        text: "絵を描くのは、飽きないのだ。"
      - speaker: zundamon
        emotion: thinking
        text: "でも、うまい絵を描く人はいくらでもいる。"
      - speaker: zundamon
        emotion: normal
        text: "ボクが描きたいのは、うまい絵じゃないぞ。"
      - speaker: reimu
        text: "彼が選んだのは、[図案|ずあん]の道でした。"
        reading: "かれがえらんだのわ、ずあんのみちでした。"
      - speaker: reimu
        text: "いまで言う、デザインです。"
        reading: "いまでいう、でざいんです。"

  - id: tamabi
    title: "1962・多摩美術大学"
    background: il_es_daigaku
    bgm: haru_kitchen
    stage:
      - {who: zundamon, x: 0.3, tag: "太田", flip: true}
      - {who: kyoju, x: 0.72}
    cuts:
      - speaker: kyoju
        emotion: normal
        text: "[太田|おおた]くん。また看板の写真ばかり撮っているな。"
      - speaker: zundamon
        emotion: normal
        text: "はい。街の看板を集めています。"
      - speaker: kyoju
        emotion: thinking
        text: "何のために。"
      - speaker: zundamon
        emotion: normal
        text: "読めない看板と、読める看板の違いを知りたいんです。"
      - speaker: kyoju
        emotion: normal
        text: "美しい看板、ではなくてか。"
      - speaker: zundamon
        emotion: normal
        text: "はい。きれいでも、通じなければ看板じゃないので。"
      - speaker: kyoju
        emotion: surprised
        text: "……変わった学生だな。"
      - speaker: zundamon
        emotion: happy
        text: "よく言われます。看板の話だけは、うるさいので。"
      - speaker: kyoju
        emotion: normal
        text: "だが、その考え方はデザインの本筋だ。覚えておきなさい。"
      - speaker: zundamon
        emotion: normal
        text: "はい。"
      - speaker: kyoju
        emotion: thinking
        text: "ところで、君は卒業したらどうするんだ。"
      - speaker: zundamon
        emotion: normal
        text: "……もう少し、学びたいと思っています。"
      - speaker: kyoju
        emotion: normal
        text: "どこで。"
      - speaker: zundamon
        emotion: normal
        text: "イタリアです。"
      - speaker: kyoju
        emotion: surprised
        se: don
        text: "イタリア！？ 急にスケールがバグったな。"
      - speaker: zundamon
        emotion: happy
        text: "はい。ベニスに、いい学校があると聞きました。"
      - speaker: kyoju
        emotion: thinking
        text: "……言葉は。"
      - speaker: zundamon
        emotion: normal
        text: "できません。初期装備で行きます。"
      - speaker: kyoju
        emotion: angry
        text: "できないのか。"
      - speaker: zundamon
        emotion: happy
        text: "だから行くんです。"
      - speaker: kyoju
        emotion: surprised
        text: "……なぜ、そこで前向きになれるんだ。メンタルが鋼だな。"
      - speaker: reimu
        text: "1962年、[太田|おおた]は[多摩|たま]美術大学を卒業します。"
        reading: "せんきゅうひゃくろくじゅうにねん、おおたわたまびじゅつだいがくをそつぎょうします。"
      - speaker: reimu
        text: "その後、大学院に進み、イタリアへ渡りました。"
        reading: "そのご、だいがくいんにすすみ、いたりあえわたりました。"

  - id: venezia
    title: "1966・ベニス"
    background: il_es_venezia
    bgm: hirusagari
    stage:
      - {who: zundamon, x: 0.3, tag: "太田", flip: true}
      - {who: tenin, x: 0.72}
    cuts:
      - speaker: reimu
        text: "ベニスは、水の上に建てられた街です。"
        reading: "べにすわ、みずのうえにたてられたまちです。"
      - speaker: reimu
        text: "[太田|おおた]は国立美術学院で、グラフィックデザインを学びました。"
        reading: "おおたわこくりつびじゅつがくいんで、ぐらふぃっくでざいんをまなびました。"
      - speaker: zundamon
        emotion: thinking
        text: "……困った。買い物ができないのだ。"
      - speaker: tenin
        emotion: normal
        text: "ボンジョルノ！ ケ コーザ デジデラ？"
      - speaker: zundamon
        emotion: sad
        text: "……すみません。分かりません。"
      - speaker: tenin
        emotion: thinking
        text: "ノン カピスコ？ アッローラ、ディンミ ディンミ！"
      - speaker: zundamon
        emotion: sad
        text: "……情報量が増えて、逆に詰んだぞ。"
      - speaker: reimu
        text: "店主はため息をつくと、紙に何かを描いて差し出しました。"
        reading: "てんしゅわためいきをつくと、かみになにかをかいてさしだしました。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "……あっ。パンだ。パンって描いてあるぞ。"
      - speaker: tenin
        emotion: happy
        text: "シー！ ドゥーエ？ トレ？"
      - speaker: zundamon
        emotion: happy
        text: "二つです。指を立てるだけで通じた。実質、無料の通訳なのだ。"
      - speaker: reimu
        text: "店主は笑って、パンを二つ渡してくれました。"
        reading: "てんしゅわわらって、ぱんをふたつわたしてくれました。"
      - speaker: zundamon
        emotion: normal
        text: "……いま、言葉はひとつも通じてないぞ。絵が強すぎる。"
      - speaker: zundamon
        emotion: thinking
        text: "でも、意味は届いた。値段も、数も。"
      - speaker: zundamon
        emotion: surprised
        text: "……絵は、言葉より速いのだ。"
        telops:
          - {text: "絵は、言葉より速い", size: lg, position: bottom-center, color: "#FFFFFF", stroke: "#20303C", glow: "#7ADFA8", anim: up}
      - speaker: reimu
        text: "この体験が、のちの仕事の芯になります。"
        reading: "このたいけんが、のちのしごとのしんになります。"

  - id: locos
    title: "言葉のいらない言葉"
    background: il_es_atelier
    bgm: curious
    stage:
      - {who: zundamon, x: 0.3, tag: "太田", flip: true}
      - {who: gakusei, x: 0.72}
    cuts:
      - speaker: reimu
        text: "[太田|おおた]は留学中から、[LoCoS|ロコス]という視覚言語の研究を始めます。"
        reading: "おおたわりゅうがくちゅうから、ろこすというしかくげんごのけんきゅうをはじめます。"
      - speaker: reimu
        text: "絵文字だけで文章を書き、世界の誰にでも読ませようという試みでした。"
        reading: "えもじだけでぶんしょうをかき、せかいのだれにでもよませようというこころみでした。"
      - speaker: gakusei
        emotion: thinking
        text: "先生。これ、字じゃなくて絵ですよね。"
      - speaker: zundamon
        emotion: normal
        text: "絵で書く言葉なのだ。並べ方に決まりがある。"
      - speaker: gakusei
        emotion: normal
        text: "……読めるように、なるんですか。"
      - speaker: zundamon
        emotion: happy
        text: "なる。しかも、習うのに何年もいらない。チュートリアルが短いのだ。"
      - speaker: gakusei
        emotion: surprised
        text: "え、じゃあ英語より速いってことですか。"
      - speaker: zundamon
        emotion: normal
        text: "そこを狙ってる。言葉を覚える前に、意味だけ渡すのだ。"
      - speaker: gakusei
        emotion: thinking
        text: "……でも先生、それ、何の役に立つんですか。"
      - speaker: zundamon
        emotion: normal
        text: "いい質問だぞ。"
      - speaker: zundamon
        emotion: normal
        text: "たとえば、外国の空港。文字が読めなくても、便所には行けるだろう。"
      - speaker: gakusei
        emotion: happy
        text: "……あー、あの人のマークですね。"
      - speaker: zundamon
        emotion: normal
        text: "あれが答えなのだ。絵は、国境で止まらない。"
      - speaker: gakusei
        emotion: normal
        text: "先生、めちゃくちゃ楽しそうですね。"
      - speaker: zundamon
        emotion: happy
        text: "楽しいぞ。完全に沼だが、まだ誰も本気にしてくれない。"
      - speaker: gakusei
        emotion: sad
        text: "……売れないやつですか。"
      - speaker: zundamon
        emotion: happy
        text: "一円にもならないな。"
      - speaker: gakusei
        emotion: surprised
        text: "言い切りましたね。潔さだけは尊敬します。"
      - speaker: reimu
        text: "帰国後、[太田|おおた]は東京造形大学で教え、のちに研究所へ移ります。"
        reading: "きこくご、おおたわとうきょうぞうけいだいがくでおしえ、のちにけんきゅうじょえうつります。"
      - speaker: reimu
        text: "看板や案内の絵を、来る日も来る日も設計する日々でした。"
        reading: "かんばんやあんないのえを、くるひもくるひもせっけいするひびでした。"
      - speaker: reimu
        text: "その仕事に、日本中を揺らす出来事が近づいていました。"
        reading: "そのしごとに、にほんじゅうをゆらすできごとがちかづいていました。"

  - id: sennichi
    title: "1972・5月13日"
    background: il_es_depart
    bgm: 223am
    stage:
      - {who: tsumugi, x: 0.5, tag: "消防庁"}
    cuts:
      - speaker: reimu
        text: "1972年5月13日、大阪の[千日|せんにち]デパートで火災が起きました。"
        reading: "せんきゅうひゃくななじゅうにねんごがつじゅうさんにち、おおさかのせんにちでぱーとでかさいがおきました。"
      - speaker: reimu
        text: "夜の10時半ごろ、工事中だった3階から火が出ます。"
        reading: "よるのじゅうじはんごろ、こうじちゅうだったさんがいからひがでます。"
      - speaker: reimu
        text: "亡くなった方は、118人でした。"
        reading: "なくなったかたわ、ひゃくじゅうはちにんでした。"
      - speaker: tsumugi
        emotion: sad
        text: "……上の階の人が、いちばん多い。"
      - speaker: tsumugi
        emotion: normal
        text: "煙は、下から上へ上がるから。"
      - speaker: reimu
        text: "誘導灯は、天井の[梁|はり]の近くに付いていました。"
        reading: "ゆうどうとうわ、てんじょうのはりのちかくについていました。"
      - speaker: reimu
        text: "煙は天井にたまります。上にある表示から、先に見えなくなりました。"
        reading: "けむりわてんじょうにたまります。うえにあるひょうじから、さきにみえなくなりました。"
      - speaker: tsumugi
        emotion: sad
        text: "……そして、停電した。"
      - speaker: reimu
        text: "非常用の電源がなく、誘導灯は消えたと記録されています。"
        reading: "ひじょうようのでんげんがなく、ゆうどうとうわきえたときろくされています。"
      - speaker: tsumugi
        emotion: sad
        text: "暗い。煙い。表示は消えている。"
      - speaker: tsumugi
        emotion: normal
        text: "……その中で、出口を探すことになる。"

  - id: kemuri
    title: ""
    background: il_es_kemuri
    bgm: 223am
    stage:
      - {who: tsumugi, x: 0.5, tag: "消防庁"}
    cuts:
      - speaker: reimu
