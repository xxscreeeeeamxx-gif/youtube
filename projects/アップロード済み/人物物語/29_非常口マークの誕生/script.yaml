      - speaker: zundamon
        emotion: normal
        text: "……よし。これで出す。"

  - id: kokuji
    title: "1982・1月20日"
    background: il_es_shobo
    bgm: warm
    stage:
      - {who: zundamon, x: 0.3, tag: "太田", flip: true}
      - {who: tsumugi, x: 0.74, tag: "消防庁"}
    cuts:
      - speaker: reimu
        text: "1982年1月20日、新しい表示が消防庁から[告示|こくじ]されました。"
