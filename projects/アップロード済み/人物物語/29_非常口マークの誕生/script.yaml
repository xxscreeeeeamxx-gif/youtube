        emotion: normal
        text: "[補色|ほしょく]といいます。赤の[補色|ほしょく]は、緑です。"
        telops:
          - {text: "赤の補色は、緑", size: xl, position: bottom-center, color: "#8FE8B0", stroke: "#0A2A18", glow: "#3FBF77", anim: up}
      - speaker: tsumugi
        emotion: surprised
        text: "……炎の中で、いちばん浮き上がる色。"
      - speaker: zundamon
        emotion: normal
        text: "そう言われています。しかも、緑にはもう一つ効き目がある。"
      - speaker: tsumugi
        emotion: thinking
        text: "……なんですか。"
      - speaker: zundamon
        emotion: normal
        text: "気持ちが、少し落ち着く。"
      - speaker: tsumugi
        emotion: surprised
        text: "……落ち着く。"
      - speaker: zundamon
        emotion: normal
        text: "火事で人が死ぬ理由の多くは、慌てて動くことです。"
      - speaker: zundamon
        emotion: normal
        text: "同じ方向に走って、押し合って、動けなくなる。"
      - speaker: tsumugi
        emotion: sad
        text: "……熊本のときが、それでした。"
      - speaker: zundamon
        emotion: normal
        text: "だから、目に入った瞬間に少しだけ息をつける色がいい。"
      - speaker: tsumugi
        emotion: normal
        text: "……看板が、人の速度まで決めるんですね。"
      - speaker: zundamon
        emotion: normal
        text: "決めます。デザインは、飾りじゃないのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "……先生、いま、めちゃくちゃかっこよかったです。"
      - speaker: zundamon
        emotion: happy
        text: "そこは録音しておいてほしいぞ。次から使うので。"

  - id: hashiru
    title: "走っているのは、誰か"
    background: il_es_jitaku
