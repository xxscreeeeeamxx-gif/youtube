      - speaker: tsumugi
        emotion: normal
        text: "文字は、目で追って、頭で読んで、意味にする。"
      - speaker: tsumugi
        emotion: sad
        text: "……その三つを、煙の中でやらないといけない。"
      - speaker: reimu
        text: "板は小さく、位置も高く、日本語が読めなければ意味を持ちません。"
        reading: "いたわちいさく、いちもたかく、にほんごがよめなければいみをもちません。"
      - speaker: tsumugi
        emotion: sad
        text: "……いちばん必要なときに、いちばん効かない。"

  - id: taiyo
    title: "1973・11月29日"
    background: il_es_depart
    bgm: 223am
    stage:
      - {who: tsumugi, x: 0.3, tag: "消防庁"}
      - {who: kacho, x: 0.72}
    cuts:
      - speaker: reimu
        text: "翌年の11月29日、今度は熊本の[大洋|たいよう]デパートで火災が起きます。"
        reading: "よくねんのじゅういちがつにじゅうくにち、こんどわくまもとのたいようでぱーとでかさいがおきます。"
      - speaker: reimu
        text: "亡くなった方は、104人でした。"
        reading: "なくなったかたわ、ひゃくよにんでした。"
      - speaker: kacho
        emotion: sad
        text: "……また、同じところで止まっている。"
      - speaker: tsumugi
        emotion: normal
        text: "誘導灯が小さくて、非常口の場所が分からなかったと。"
      - speaker: kacho
        emotion: sad
        text: "分からないから、人が同じ方向に集まる。"
      - speaker: tsumugi
        emotion: sad
        text: "……そして、動けなくなる。"
      - speaker: kacho
        emotion: angry
        text: "一年半で二回だ。偶然じゃない。"
      - speaker: tsumugi
        emotion: normal
        text: "……表示のほうを、変えないといけません。"

  - id: naze
    title: "読めない、見えない、通じない"
    background: il_es_shobo
    bgm: serious
    stage:
      - {who: tsumugi, x: 0.3, tag: "消防庁"}
      - {who: kacho, x: 0.72}
    cuts:
      - speaker: kacho
        emotion: normal
        text: "問題を整理しよう。何が悪かった。"
      - speaker: tsumugi
        emotion: normal
        text: "三つあります。まず、文字であること。"
      - speaker: kacho
        emotion: thinking
        text: "読めない人がいる、ということか。"
      - speaker: tsumugi
        emotion: normal
        text: "はい。子どもも、外国の方も。"
      - speaker: kacho
        emotion: normal
        text: "二つ目。"
      - speaker: tsumugi
        emotion: normal
        text: "小さいこと。遠くから見えません。"
      - speaker: kacho
        emotion: normal
        text: "三つ目。"
      - speaker: tsumugi
        emotion: sad
        text: "……煙の中で、いちばん先に見えなくなる高さに付いていること。"
      - speaker: kacho
        emotion: angry
        text: "全部、火事のときに効かない条件だな。"
      - speaker: tsumugi
        emotion: normal
        text: "はい。平時のことしか考えていない設計でした。"
      - speaker: kacho
        emotion: thinking
        text: "……で、どうする。文字をやめるのか。"
      - speaker: tsumugi
        emotion: normal
        text: "やめます。絵にします。"
      - speaker: kacho
        emotion: surprised
        text: "絵。"
      - speaker: tsumugi
        emotion: normal
        text: "絵なら、読まなくていい。見た瞬間に意味になります。"
      - speaker: kacho
        emotion: thinking
        text: "……だが、どんな絵にする。"
      - speaker: tsumugi
        emotion: normal
        text: "そこが決まっていません。だから、集めます。"
      - speaker: kacho
        emotion: surprised
        text: "集める？"
      - speaker: tsumugi
        emotion: normal
        text: "全国から募集します。デザインを、公募で。"
      - speaker: kacho
        emotion: angry
        text: "役所が絵を募集するのか。前例がない。無理ゲーだぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "前例どおりにやって、二回同じことが起きました。"
      - speaker: kacho
        emotion: surprised
        text: "……。"
      - speaker: tsumugi
        emotion: normal
        text: "誰にでも分かる絵は、この国のどこかの誰かが、もう描いているかもしれません。"
      - speaker: kacho
        emotion: normal
        text: "……分かった。やろう。"
      - speaker: reimu
        text: "1979年、消防庁はデザインを公募しました。"
        reading: "せんきゅうひゃくななじゅうきゅうねん、しょうぼうちょうわでざいんをこうぼしました。"

  - id: koubo
    title: "1979・3300の応募"
    background: il_es_koubo
    bgm: pop
    stage:
      - {who: tsumugi, x: 0.3, tag: "消防庁"}
      - {who: kacho, x: 0.72}
    cuts:
      - speaker: reimu
        text: "集まった案は、およそ3300点にのぼりました。"
        reading: "あつまったあんわ、およそさんぜんさんびゃくてんにのぼりました。"
      - speaker: kacho
        emotion: surprised
        se: don
        text: "……三千を超えたのか。"
      - speaker: tsumugi
        emotion: happy
        text: "はい。壁が足りません。会場がもう沼です。"
      - speaker: kacho
        emotion: normal
        text: "どんなものが来ている。"
      - speaker: tsumugi
        emotion: normal
        text: "扉だけの案、矢印だけの案、走る人の案。"
      - speaker: kacho
        emotion: thinking
        text: "……走る人が多いな。みんな同じところに着いている。"
      - speaker: tsumugi
        emotion: normal
        text: "はい。逃げる人を描こう、で完全に一致してます。"
      - speaker: kacho
        emotion: normal
        text: "似ているなら、どうやって選ぶんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "見比べません。実験します。"
      - speaker: kacho
        emotion: surprised
        text: "実験？"
      - speaker: tsumugi
        emotion: normal
        text: "遠くから見せて、どれが速く伝わるかを測ります。"
      - speaker: kacho
        emotion: thinking
        text: "……好みで決めない、ということか。"
      - speaker: tsumugi
        emotion: normal
        text: "好みで決めたら、また人が死にます。そこは譲れません。"
      - speaker: kacho
        emotion: surprised
        text: "……そうだな。"
      - speaker: reimu
        text: "図形の評価実験などを経て、[小谷松敏文|こやまつとしふみ]の案が選ばれました。"
        reading: "ずけいのひょうかじっけんなどをへて、こやまつとしふみのあんがえらばれました。"
      - speaker: kacho
        emotion: normal
        text: "……これか。走っている人と、扉。"
      - speaker: tsumugi
        emotion: normal
        text: "はい。素直で、強い案です。"
      - speaker: kacho
        emotion: thinking
        text: "では、これで決まりだな。"
      - speaker: tsumugi
        emotion: normal
        text: "……いえ。ここから、もう一段あります。"
      - speaker: kacho
        emotion: surprised
        text: "まだやるのか。"
      - speaker: tsumugi
        emotion: normal
        text: "選ぶことと、使えるようにすることは、別の仕事なので。"
      - speaker: kacho
        emotion: normal
        text: "……誰に頼む。"
      - speaker: tsumugi
        emotion: normal
        text: "絵で意味を渡す研究を、ずっとやっている人がいます。"

  - id: irai
    title: "改良を頼まれた男"
    background: il_es_shobo
    bgm: warm
    stage:
      - {who: zundamon, x: 0.3, tag: "太田", flip: true}
      - {who: tsumugi, x: 0.74, tag: "消防庁"}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "[太田|おおた]先生。お忙しいところ、すみません。"
      - speaker: zundamon
        emotion: normal
        text: "いえ。看板の相談なら、いつでも来てください。"
      - speaker: tsumugi
        emotion: normal
        text: "看板です。ただ、少し重いやつで。"
      - speaker: zundamon
        emotion: thinking
        text: "……重い、というと。"
      - speaker: tsumugi
        emotion: sad
        text: "非常口の表示です。二回の火事で、二百人以上が亡くなりました。"
      - speaker: zundamon
        emotion: surprised
        text: "……。"
      - speaker: tsumugi
        emotion: normal
        text: "公募で案は選びました。これを、使えるところまで持っていきたい。"
      - speaker: zundamon
        emotion: normal
        text: "……見せてください。"
      - speaker: tsumugi
        emotion: normal
        text: "こちらです。"
      - speaker: zundamon
        emotion: thinking
        text: "……なるほど。走る人と、扉。考え方は、もう正しい。"
      - speaker: tsumugi
        emotion: happy
        text: "そう思われますか。"
      - speaker: zundamon
        emotion: normal
        text: "はい。ただ、これは紙の上の絵です。"
      - speaker: tsumugi
        emotion: thinking
        text: "……といいますと。"
      - speaker: zundamon
        emotion: normal
        text: "この絵が置かれるのは、天井の近くです。"
      - speaker: zundamon
        emotion: normal
        text: "見る人は、下から、斜めに、走りながら見る。"
      - speaker: tsumugi
        emotion: surprised
        text: "……止まって見る人はいない、ということですか。"
      - speaker: zundamon
        emotion: normal
        text: "誰も止まりません。止まって鑑賞する看板じゃないので。"
      - speaker: tsumugi
        emotion: normal
        text: "……確かに。"
      - speaker: zundamon
        emotion: normal
        text: "だから、線の太さも、余白も、全部そこに合わせ直します。"
      - speaker: tsumugi
        emotion: normal
        text: "お願いできますか。"
      - speaker: zundamon
        emotion: normal
        text: "やります。ただ、条件があります。"
      - speaker: tsumugi
        emotion: thinking
        text: "……はい。"
      - speaker: zundamon
        emotion: normal
        text: "一発では決めません。何十枚も作って、見比べさせてください。"
      - speaker: tsumugi
        emotion: happy
        text: "……こちらこそ、そうしてほしいです。"
      - speaker: zundamon
        emotion: normal
        text: "話が早いのだ。有識者がいると助かるぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "あと、こちらからも一つだけ、注文があります。"
      - speaker: zundamon
        emotion: thinking
        text: "……なんでしょう。"
      - speaker: tsumugi
        emotion: normal
        text: "足の先に、影をつけてほしいんです。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "……影。"

  - id: ashiato
    title: "足先に、影をつけてほしい"
    background: il_es_atelier
    bgm: curious
    stage:
      - {who: zundamon, x: 0.3, tag: "太田", flip: true}
      - {who: tsumugi, x: 0.74, tag: "消防庁"}
    cuts:
      - speaker: zundamon
        emotion: thinking
        text: "……なぜ、影がいるんですか。"
      - speaker: tsumugi
        emotion: normal
        text: "影がないと、浮いて見えるんです。"
      - speaker: zundamon
        emotion: surprised
        text: "……ああ。地面に立っていない。"
      - speaker: tsumugi
        emotion: normal
        text: "はい。飛んでいるようにも、倒れているようにも見えてしまう。"
      - speaker: zundamon
        emotion: normal
        text: "……走っていると分からせるには、地面がいるのか。"
      - speaker: tsumugi
        emotion: normal
        text: "そういう指摘が出ました。"
      - speaker: zundamon
        emotion: happy
        text: "……いい注文なのだ。指摘が的確すぎるぞ。"
      - speaker: tsumugi
        emotion: happy
        text: "褒められると照れます。"
      - speaker: reimu
        text: "[太田|おおた]は、この案をもとに58点のデザインを作りました。"
        reading: "おおたわ、このあんをもとにごじゅうはってんのでざいんをつくりました。"
      - speaker: zundamon
        emotion: normal
        text: "……まず、腕の角度を五通り。"
      - speaker: zundamon
        emotion: normal
        text: "次に、足の開きを四通り。"
      - speaker: zundamon
        emotion: thinking
        text: "……頭の大きさも、変えてみるか。"
      - speaker: tsumugi
        emotion: surprised
        text: "先生、もう三十枚を超えてます。完全に周回してませんか。"
      - speaker: zundamon
        emotion: happy
        text: "まだ増えるぞ。ここからがレベル上げなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "……どこまで作るんですか。"
      - speaker: zundamon
        emotion: normal
        text: "答えが出るまでなのだ。作らないと、比べられない。"
      - speaker: tsumugi
        emotion: thinking
        text: "……頭の中で決めない、と。"
      - speaker: zundamon
        emotion: normal
        text: "頭の[中|なか]はあてになりません。目で見て、遠ざけて、確かめる。"
      - speaker: zundamon
        emotion: normal
        text: "これを、こつこつ削ると呼んでいます。"
      - speaker: tsumugi
        emotion: happy
        text: "……先生、楽しんでますね。"
      - speaker: zundamon
        emotion: happy
        text: "楽しいぞ。ただ、線を一本細くするだけで意味が変わる。"
      - speaker: tsumugi
        emotion: surprised
        text: "そんなに変わりますか。"
      - speaker: zundamon
        emotion: normal
        text: "変わる。細すぎると、遠くで消える。ナーフのしすぎだ。"
      - speaker: zundamon
        emotion: normal
        text: "太すぎると、人の形が塊になる。"
      - speaker: tsumugi
        emotion: thinking
        text: "……ちょうどいい太さが、どこかにある。"
      - speaker: zundamon
        emotion: normal
        text: "ある。それを探すのが、この仕事なのだ。"
      - speaker: reimu
        text: "58点は並べられ、遠くから、斜めから、繰り返し比べられました。"
        reading: "ごじゅうはってんわならべられ、とおくから、ななめから、くりかえしくらべられました。"
      - speaker: zundamon
        emotion: normal
        text: "……これだ。"
      - speaker: tsumugi
        emotion: normal
        text: "どれですか。"
      - speaker: zundamon
        emotion: normal
        text: "前に傾いていて、腕が振れていて、足先に影がある。"
      - speaker: zundamon
        emotion: normal
        text: "十メートル離れても、走っていると分かる。"
      - speaker: tsumugi
        emotion: happy
        text: "……決まりですね。"
      - speaker: zundamon
        emotion: thinking
        text: "いや。色が、まだなのだ。"

  - id: midori
    title: "なぜ、緑なのか"
    background: il_es_atelier
    bgm: curious
    stage:
      - {who: zundamon, x: 0.3, tag: "太田", flip: true}
      - {who: tsumugi, x: 0.74, tag: "消防庁"}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "色は、赤ではないんですか。"
      - speaker: zundamon
        emotion: normal
        text: "赤は、だめなのだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "……えっ。危険は赤、で勝ち確だと思ってました。"
      - speaker: zundamon
        emotion: normal
        text: "そう。だから消火器も、火災報知器も赤です。"
      - speaker: tsumugi
        emotion: thinking
        text: "……なのに、なぜ。"
      - speaker: zundamon
        emotion: normal
        text: "火事のとき、まわりが何色になりますか。"
      - speaker: tsumugi
        emotion: surprised
        se: don
        text: "……赤。"
      - speaker: zundamon
        emotion: normal
        text: "炎の色です。その中に赤い看板を置いたら、背景と同化して消える。"
      - speaker: tsumugi
        emotion: sad
        text: "……いちばん要るときに、また見えなくなる。"
      - speaker: zundamon
        emotion: normal
        text: "そこで、赤の反対側の色を使うのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "反対側……。"
