        text: "今日から一つだけ、やってほしいことがあるの。"
      - speaker: zundamon
        emotion: normal
        text: "なんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "知らない建物に入ったら、緑を一回だけ探してみて。"
      - speaker: zundamon
        emotion: thinking
        text: "……入った瞬間にか。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。三秒でいい。どっち向きに走ってるかまで見る。"
      - speaker: zundamon
        emotion: normal
        text: "……三秒なら、できるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "その三秒は、たぶん一生使わない。"
      - speaker: zundamon
        emotion: surprised
        text: "……使わないのか。"
      - speaker: tsumugi
        emotion: happy
        text: "使わないほうがいいでしょ。"
      - speaker: zundamon
        emotion: happy
        text: "……確かに。使う日が来ないのが、いちばんの大勝利なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "あのマークも、たぶん同じ気持ちで作られてるよ。"
      - speaker: zundamon
        emotion: normal
        text: "……ずっと見られないまま、そこにいるのが理想か。"
      - speaker: tsumugi
        emotion: normal
