meta:
  title: 「もう後がないという時にリリースしたのがモンストです」赤字のmixiの会社、売上9倍に【ずんだもん解説】
  slug: mixi-kimura
  hook_line: SNSの王者は、なぜ赤字になり、なぜゲーム1本で生き返ったのか。
  summary: 2013年10月、SNSのmixiを動かす会社ミクシィの開発室。会社が1年の見通しを赤字に書き換えた9日後、木村弘毅たちは4人で集まって遊ぶゲームを出そうとしていました。招待状と足あとで広がった日本のSNSは、スマホへの移り変わりの中で上場以来初めての赤字に。よその会社のゲームに場所を貸していた会社は、なぜ自分たちで1本を作ったのか。本人と関係者の公の言葉、決算の資料をもとに、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 株式会社ミクシィ「2014年度 通期決算説明会」資料（2015年5月） https://pdf.irpocket.com/C2121/H3x0/rK9b/OC0F.pdf
  - 株式会社MIXI「2026年３月期 決算短信〔日本基準〕(連結)」（2026年5月15日） https://www.nikkei.com/markets/ir/irftp/data/tdnr/tdnetg3/20260515/fxd6u1/140120260514535353.pdf
  - 日本経済新聞「悩めるミクシィ、笠原社長の誤算と覚悟」（2012年11月22日） https://www.nikkei.com/article/DGXBZO48711810S2A121C1000000/
  - ITmedia NEWS「ミクシィ、上場来初の赤字転落・4〜6月期 「厳しい状況だが立ち止まらない」と朝倉社長」（2013年8月9日） https://www.itmedia.co.jp/news/articles/1308/09/news110.html
  - ITmedia NEWS「ミクシィ、通期で赤字転落へ mixiゲーム課金不振で売り上げ大幅減」（2013年10月1日） https://www.itmedia.co.jp/news/articles/1310/01/news088.html
  - 国民生活センター「子どものオンラインゲーム 無断課金につながるあぶない場面に注意！！」（2024年3月13日） https://www.kokusen.go.jp/news/data/n-20240313_1.html
