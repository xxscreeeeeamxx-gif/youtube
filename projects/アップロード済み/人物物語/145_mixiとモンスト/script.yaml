scenes:
# ---- 先出し（2013年10月・開発室。台帳3章の候補①。見通しは1年の見通しの数字。「落ちました」は岡本の回想の範囲。木村の言葉は2024年の経済界のインタビュー、語尾そのまま。笑いの SE なし。泣く・叫ぶ芝居なし。スマホの画面は見せない） ----
- id: co_kaihatsu
  title: ''
  background: mi_kaihatsu_4
  bgm: serious
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 木村, emotion: normal}
  - {who: buka, x: 0.86, emotion: sad}
  cuts:
  - speaker: reimu
    text: 2013年10月、ミクシィの開発室。ゲームの会社ではなく、SNSのmixiを動かす会社です。
    reading: にせん じゅうさんねん じゅうがつ、みくしいの かいはつしつ。げーむの かいしゃでわ なく、えすえぬえすの みくしいお うごかす かいしゃです。
  - speaker: buka
    emotion: sad
    text: ……会社の1年の見通し、[16億円|ジュウロクオクエン]の赤字に書き換えだそうです。
  - speaker: zundamon
    emotion: normal
    text: 10日に出すのだ。4人で集まって遊ぶゲームを。
  - speaker: buka
    emotion: surprised
    text: 配信の日です！ ……サーバーが、落ちました！
    telops:
    - {text: "10月10日 配信の日", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: ……人が、来すぎてるのか。
  - speaker: reimu
    text: この男は、ゲームを企画した木村弘毅。2024年にこう話しています。
    reading: この おとこわ、げーむお きかく した きむら こうき。にせん にじゅうよねんに こう はなして います。
  - speaker: zundamon
    emotion: normal
    text: もう[後|あと]がないという時にリリースしたのがモンストです。
  - speaker: reimu
    text: このゲームで、ミクシィの売上は1年で9倍になります。
    reading: この げーむで、みくしいの うりあげわ いちねんで きゅうばいに なります。
# ---- 今の部屋（集まっても全員スマホ。20秒以内。問いに直結） ----
- id: hook
  title: ''
  background: mi_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: みんなで集まったのに、全員スマホ見てるのだ！
  - speaker: tsumugi
    emotion: normal
    text: ずんだもんも、見てるわよ。
    se: hammer
  - speaker: zundamon
    emotion: surprised
    text: ……ボクは、見張ってるだけなのだ。
  - speaker: tsumugi
    emotion: thinking
    text: それを、10年以上前に気にした人がいるの。
  - speaker: tsumugi
    emotion: normal
    text: SNSの王者はなぜ赤字になり、なぜゲーム1本で生き返ったのか。
    telops:
    - {text: "SNSの王者は なぜ赤字に？ なぜゲーム1本で？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: ゲーム1本で！？
# ---- 2004年・会社の端っこの3人 → 2006年の上場（主人公はまだいない。笠原の言葉は2026年の振り返りと2006年の上場の会見。出どころを言う。生い立ちは無し） ----
- id: card2004
  title: ''
  background: mi_card_2004
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 2004年2月。求人サイトの会社の端っこで、mixiが始まります。
    reading: にせん よねん にがつ。きゅうじん さいとの かいしゃの はしっこで、みくしいが はじまります。
- id: ch1_hashikko
  title: 端っこの3人
  background: mi_hashikko
  stage:
  - {who: kasahara, x: 0.3, flip: true, emotion: happy}
  cuts:
  - speaker: reimu
    text: 始めたのは、社長の笠原健治。2026年に、こう振り返ります。
    reading: はじめたのわ、しゃちょうの かさはら けんじ。にせん にじゅうろくねんに、こう ふりかえります。
  - speaker: kasahara
    emotion: happy
    text: 社内に3人ぐらいのチームをつくって、会社の端っこの方で始めたのがmixiです。
- id: ch1_jojo
  title: ''
  background: mi_board_kai
  stage:
  - {who: kasahara, x: 0.16, flip: true, emotion: happy}
  cuts:
  - speaker: reimu
    text: 2006年9月、上場の日。買い注文が多すぎて値が付かず、笠原は会見でこう話します。
    reading: にせん ろくねん くがつ、じょうじょうの ひ。かいちゅうもんが おおすぎて ねが つかず、かさはらわ かいけんで こう はなします。
  - speaker: kasahara
    emotion: normal
    text: ありがたいことだが、同時に責任の重さを実感している。
# ---- 2008年6月・入社と異動（経歴はナレ1行。家族は出さない。背景差し替え：SNS の明るい島 → 段ボールの島。言葉は2026年の講演） ----
- id: card2008
  title: ''
  background: mi_card_2008
  cuts:
  - speaker: reimu
    text: 2008年6月。32歳の木村弘毅が、ミクシィに入ります。
    reading: にせん はちねん ろくがつ。さんじゅうにさいの きむら こうきが、みくしいに はいります。
- id: ch1_sasen
  title: 左遷されたという思い
  background: mi_sns_shima
  bgm: curious
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 木村, emotion: happy}
  - {who: joshi, x: 0.86, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: SNSの企画、がんばります！
  - speaker: joshi
    emotion: happy
    text: 携帯のコンテンツの会社から来た人だね。期待してるよ。
  - speaker: joshi
    emotion: normal
    text: '[木村|キムラ]さん。ゲームの部署へ、異動です。'
  - speaker: zundamon
    emotion: surprised
    text: ……入って、まだ3か月ほどですが。
  - speaker: zundamon
    emotion: sad
    text: ……段ボールの島なのだ。
    background: mi_game_shima
    se: shobon
  - speaker: reimu
    text: 木村は2026年の講演で、このときをこう話しています。
    reading: きむらわ にせん にじゅうろくねんの こうえんで、この ときお こう はなして います。
  - speaker: zundamon
    emotion: sad
    text: 当時は本流から外された、左遷されたという思いもありました。
    telops:
    - {text: "木村「左遷されたという思いもありました」", size: md, position: top-right, color: "#8AD0FF", stroke: "#0A1A2A", glow: "#2A6ACC", anim: up}
  - speaker: reimu
    text: 左遷されたと思った隅の島から、なぜ会社を生き返らせるゲームが出たのか。
    reading: させん されたと おもった すみの しまから、なぜ かいしゃお いきかえらせる げーむが でたのか。
# ---- 2009〜2011年・場所を貸す商売（材料1。大家さんのたとえ。名刺の山の笑い。言葉は2026年の講演。1人で遊ぶゲームの気付きは2013年初めなので「のちに」。2013年の数字はナレの予告として。家賃は1万分の1にしたたとえ） ----
- id: ch2_ooya
  title: 場所を貸す商売
  background: mi_game_shima
  bgm: pop
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 木村, emotion: normal}
  - {who: senpai, x: 0.86, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2009年。mixiの中で、よその会社のゲームを遊べる仕組みが始まります。
    reading: にせん きゅうねん。みくしいの なかで、よその かいしゃの げーむお あそべる しくみが はじまります。
  - speaker: senpai
    emotion: normal
    text: '[木村|キムラ]。うちは場所を貸して、売上の一部をもらう。'
  - speaker: senpai
    emotion: happy
    text: 大家さんみたいなものだ。
  - speaker: zundamon
    emotion: normal
    text: ……大家さん、ですか。
  - speaker: senpai
    emotion: normal
    text: 入ってくるのはmixiの広告と、よその会社のゲームの課金の一部。
  - speaker: zundamon
    emotion: happy
    text: 人が来るほど、家賃が入るんですね。
  - speaker: senpai
    emotion: happy
    text: そういうこと。
  - speaker: senpai
    emotion: happy
    text: サンシャイン牧場なんて、3か月足らずで300万人だ。
  - speaker: zundamon
    emotion: surprised
    text: 畑のゲームに、300万人……。
- id: ch2_meishi1
  title: ''
  background: mi_meishi
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 木村, emotion: normal}
  - {who: sap1, x: 0.86, emotion: happy}
  cuts:
  - speaker: sap1
    emotion: happy
    text: はじめまして！ ゲームを作っている会社です！
  - speaker: sap1
    emotion: happy
    text: うちのゲームも、mixiに並べてください！
- id: ch2_meishi3
  title: ''
  background: mi_meishi
  stage:
  - {who: zundamon, x: 0.14, flip: true, tag: 木村, emotion: normal}
  - {who: sap1, x: 0.66, scale: 0.8, emotion: happy}
  - {who: sap2, x: 0.78, scale: 0.8, emotion: happy}
  - {who: sap3, x: 0.9, scale: 0.8, emotion: happy}
  cuts:
  - speaker: sap2
    emotion: happy
    text: うちもです！ 名刺、置いていきます！
  - speaker: sap3
    emotion: happy
    text: うちも、うちも！
  - speaker: zundamon
    emotion: surprised
    text: 名刺で、机が見えないのだ！
    se: manuke
- id: ch2_suhyaku
  title: ''
  background: mi_meishi
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 木村, emotion: normal}
  - {who: senpai, x: 0.86, emotion: normal}
  cuts:
  - speaker: reimu
    text: 木村は2026年に、この頃をこう振り返ります。
    reading: きむらわ にせん にじゅうろくねんに、この ころお こう ふりかえります。
  - speaker: zundamon
    emotion: normal
    text: ゲームプラットフォーム側で数百社、
  - speaker: zundamon
    emotion: happy
    text: 数多くのゲームタイトルのデータを見る経験ができたのは学びになりましたね。
  - speaker: reimu
    text: のちに木村は、1人で黙々と遊ぶゲームが多いことが気になり始めます。これが後で効きます。
    reading: のちに きむらわ ひとりで もくもくと あそぶ げーむが おおい ことが きに なりはじめます。これが あとで ききます。
  - speaker: zundamon
    emotion: thinking
    text: ……お客さんがいなくなったら、大家さんはどうなるんですか。
  - speaker: senpai
    emotion: angry
    text: 家賃が入らない。……縁起でもないこと言うな。
    beat: true
  - speaker: reimu
    text: その日は4年後に来ます。2013年4〜6月、広告と課金を合わせたmixiの売上は2年前のほぼ半分に。
    reading: その ひわ よねんごに きます。にせん じゅうさんねん しがつから ろくがつ、こうこくと かきんお あわせた みくしいの うりあげわ にねんまえの ほぼ はんぶんに。
    background: mi_meishi_han
    telops:
    - {text: "mixiの売上 2年でほぼ半分", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: 家賃で言えば、35万円が18万8000円に。客の減った大家は、ここからどうするのか。
    reading: やちんで いえば、さんじゅうごまんえんが じゅうはちまん はっせんえんに。きゃくの へった おおやわ、ここから どう するのか。
# ---- 2011年・つむぎの部屋で「あった、あった」の1つ目（招待状・15歳から・ガラケー・マイミク・足あと。利用者の書き込みは出さない。笠原の反省は2012年の日経の取材） ----
- id: ch3_ashiato
  title: 招待状と足あと
  background: mi_heya
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 2011年5月、mixiの月間の利用者は[1547万人|センゴヒャクヨンジュウナナマンニン]で山を迎えたの。
  - speaker: tsumugi
    emotion: normal
    text: その月に1回でも入った人の数よ。
  - speaker: zundamon
    emotion: happy
    text: mixiって、入るのに招待状が要ったのだ？
  - speaker: tsumugi
    emotion: normal
    text: そう。2010年3月までは、会員に招かれないと入れなかったの。
  - speaker: tsumugi
    emotion: normal
    text: 2008年12月からは、[15歳|ジュウゴサイ]から使えるようになったわ。
  - speaker: tsumugi
    emotion: happy
    text: ガラケーでも見られて、友だちはマイミクと呼んだの。
  - speaker: zundamon
    emotion: happy
    text: マイミクって、みんな何人いたのだ？
  - speaker: tsumugi
    emotion: normal
    text: 2008年の時点で、平均は24〜25人よ。
  - speaker: zundamon
    emotion: sad
    text: ……ボクより、ずっと多い。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: それに足あと。自分のページを見に来た人が、分かる仕組みよ。
  - speaker: zundamon
    emotion: surprised
    text: 見に行ったら、バレるのだ！？
    se: bikkuri
  - speaker: tsumugi
    emotion: happy
    text: 気まずいけど、見に来てくれたしるしでもあったの。
  - speaker: tsumugi
    emotion: normal
    text: 2011年6月、その足あとが訪問者に変わったの。
  - speaker: tsumugi
    emotion: normal
    text: 見に来た日時も、出なくなったわ。
  - speaker: tsumugi
    emotion: normal
    text: 反対のコミュニティに集まった人は、合わせて約26万人よ。
  - speaker: zundamon
    emotion: surprised
    text: 26万人……。
  - speaker: tsumugi
    emotion: thinking
    text: '[1547万人|センゴヒャクヨンジュウナナマンニン]の山から、会社はなぜ2年あまりで赤字に落ちたのか。'
  - speaker: tsumugi
    emotion: normal
    text: '[笠原|カサハラ]は翌年の取材で、足あとについてこう反省しているわ。'
  - speaker: tsumugi
    emotion: normal
    text: 閲覧者のメリットよりも投稿者のデメリットが大きかった
# ---- 2012年春〜2013年1月・3つの知らせ（身売り説・コンプガチャ・mixiパーク。3段の笑い。コナミを悪く言わない。木村の言葉は2024年） ----
- id: ch4_shirase
  title: 3つの知らせ
  background: mi_game_shima
  bgm: pop
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 木村, emotion: normal}
  - {who: shain1, x: 0.56, emotion: normal}
