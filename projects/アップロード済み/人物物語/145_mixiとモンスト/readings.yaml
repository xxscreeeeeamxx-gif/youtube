# 2026-11-19 台本を書いたあと、セリフ全行を話者ごとの VOICEVOX スタイル（ずんだもん3・つむぎ8・モブは meta.mobs の voice）で
# audio_query にかけた結果:
# - 木村・笠原・岡本・朝倉 はタグなしでも キムラ・カサハラ・オカモト・アサクラ（1語）。カタカナのタグでも同じ読み・同じ区切り
#   （キムラサン・キムラデ・カサハラワ・オカモトサン・オカモトノ・アサクラノ）→ 全出現にカタカナのタグ。
# - mixi はタグなしで ミクシイ（ミクシイデス・ミクシイニ・ミクシイガ）。台帳に入れていない。ミクシィ（社名）も ミクシイ。
# - mixi2 はタグなしだと ミクシイニ（ミクシィ・に）になった → [mixi2|ミクシィツー] で ミクシイツウオ（1語）。
# - 「こう話しているわ」は、直前が「2024年に」「2025年に」で読点が無いと コオワ/シテ（講話して）になった
#   → その2行は「こう語っているわ」（コオ/カタッテ）。読点のある「2025年に、こう話しているわ」は コオ/ハナシテ で正しい。
# - 16億円 はタグなしで ジュウ/ロクオクエン と2句 → [16億円|ジュウロクオクエン] で1句。
#   80億円 も ハチジュウ/オクエン → [80億円|ハチジュウオクエン] で1句。
#   1547万人 はタグなしで セン/ゴヒャク/ヨンジュウ/ナナマンニン と4句 → [1547万人|センゴヒャクヨンジュウナナマンニン] で2句。
#   1500万人 は [1500万人|センゴヒャクマンニン] で1句。
#   1129億円 は [1129億円|センヒャクニジュウキュウオクエン] にすると キュ/ウオクエン と崩れた → タグなし（センヒャク/ニジュウ/キュウオクエン）。
#   121億円・1713億円・222億円・527億円・4億7000万円・4億8000万円・1402万人 はタグなしで読める（数の区切りだけ）。
# - 「段ボールの島、なのだ」は シマ/ナ/ノダ と切れた → 「……段ボールの島なのだ。」（シマナ/ノダ）。
# - 「3つ目は、ボクらのなのだ」は ボクラ/ノナ/ノダ と崩れた → 「ボクらのアプリなのだ」（ボクラノ/アプリナ/ノダ）。
# - 一本足 はタグなしで イッポン/アシ。[一本足|いっぽんあし] は イッ/ポン/アシ と切れた → タグなし。
# - 188 は [188|イチハチハチ] で イチハチハチニ（ひらがなのタグは「は」が助詞になるのでカタカナ）。
# - 正しく読んだ（タグなし）: モンスト・モンスターストライク・モンハン・モンスターハンター（モンスタアハンタアオ）・
#   Facebook（フェイスブック）・Twitter（ツイッタア）・iPhone（アイフォオン）・LINE（ライン）・SNS（エスエヌエス）・
