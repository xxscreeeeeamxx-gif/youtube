# mixi-kimura 読み台帳（人名・社名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある（カタカナのタグ）。
# ナレ（ゆっくり）は reading: のひらがなで読ませている（タグは付けていない）。
# 名札（tag: 木村 / label: 部下・笠原・上司・先輩・ゲーム会社・社員・記者・客・岡本・朝倉・チーム・学生・森田・生徒）・
# テロップ・章タイトル・meta.summary は表示専用なのでタグを付けていない。
