    text: 株主に払った賠償のぶん、ですよね。
  - speaker: senpai
    emotion: normal
    text: これで、元オーナーの持ち株はゼロだ。
  - speaker: shinjin
    emotion: sad
    text: 1株も、ですか。
  - speaker: senpai
    emotion: sad
    text: 1株もだ。
    beat: true
# ---- 論争：父の代のせい？ ----
- id: ronso1
  title: 父の代のせい？
  background: tj_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ 名前だけの株主は父の代からで、本人は背負わされただけって！
  - speaker: tsumugi
    emotion: normal
    text: 始まったのは、たしかに彼が継ぐ前。少なくとも1957年ごろからよ。
  - speaker: tsumugi
    emotion: normal
    text: 1964年までは、父の事務所が株券をまとめて預かってたの。
  - speaker: tsumugi
    emotion: thinking
    text: 誰がなぜ始めたかは、西武鉄道が調べても分からなかったの。
  - speaker: zundamon
    emotion: happy
    text: じゃあ、本人は悪くないのだ！
  - speaker: tsumugi
    emotion: thinking
    text: そうとも言えないの。
    se: hammer
  - speaker: tsumugi
    emotion: normal
    text: 起訴状だと、彼が知ったのは5月25日。会見まで、141日あるの。
  - speaker: tsumugi
    emotion: normal
    text: そのあいだに例年どおりの報告書が出て、公表の前に株が売られた。本人も法廷で認めたわ。
  - speaker: tsumugi
    emotion: thinking
    text: 検察は、彼が部下の直そうという進言を退けたとも主張したわ。
  - speaker: zundamon
    emotion: thinking
    text: 父のせいとも全部知ってたとも、言えないのか……。
  - speaker: tsumugi
    emotion: normal
    text: 始まったのは、彼が継ぐ前。裁かれたのは、その141日にしたことよ。
# ---- 論争：ただの書類のミス？ ----
- id: ronso2
  title: ただの書類のミス？
  background: tj_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: でも決算の数字は、うそじゃないのだ！ 80%の決まりに引っかかっただけなのだ！
  - speaker: tsumugi
    emotion: normal
    text: 売上や利益のうそじゃないのは、その通り。うそだったのは、株主の顔ぶれよ。
  - speaker: zundamon
    emotion: happy
    text: じゃあ、ただの書類のミスなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: それは違うわ。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: 東証が上場廃止にしたのは、80%を超えたからだけじゃないの。
  - speaker: tsumugi
    emotion: normal
    text: 虚偽記載の影響が重大で、投資者を守るためと決めたのよ。
  - speaker: tsumugi
    emotion: thinking
    text: 判決も、コクドの持ち株の数は投資の判断を大きく変えうる事実だとしてるわ。
  - speaker: zundamon
    emotion: thinking
    text: 数字のうそじゃなくて……。
  - speaker: tsumugi
    emotion: normal
    text: 誰の会社か、といううそ。それは、株を買う人が一番知りたいことだったの。
    telops:
    - {text: "数字ではなく「誰の会社か」のうそ", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: 最後は銀行と外国のファンドに、会社を取られたのだ？
  - speaker: tsumugi
    emotion: normal
    text: 立て直しの形は、社外の5人の委員会の答申からよ。
  - speaker: tsumugi
    emotion: normal
    text: 大株主になった外国のファンドも、2017年に全部売って出ていったわ。
  - speaker: zundamon
    emotion: thinking
    text: 取られた、とは言えないのか……。
# ---- 本当の注意点 ----
- id: chui
  title: 大株主の欄
  background: tj_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 有価証券報告書の大株主の欄も、うそのことがあるの。
  - speaker: tsumugi
    emotion: thinking
    text: 西武鉄道は上の10人を63.68%と書いて、本当は88.57%だったわ。
  - speaker: zundamon
    emotion: surprised
    text: 書いてある数字が、そもそも違ったのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 上場廃止のあいだ、約1万4千人の株主がお[金|かね]を取り戻す道を失ったの。
  - speaker: zundamon
    emotion: sad
    text: 1万4千人も……。
  - speaker: tsumugi
    emotion: normal
    text: もう1つ。前例だからという言葉が、うそを半世紀つないだの。
  - speaker: tsumugi
    emotion: thinking
    text: 見つけたのは、事件のあとの人事異動で来た新任の部長と課長だったわ。
  - speaker: zundamon
    emotion: surprised
    text: なぜって聞いた、あの課長なのだ！
  - speaker: tsumugi
    emotion: normal
    text: そういうものだと言われた書類は、一度だけなぜと聞いていいの。
  - speaker: zundamon
    emotion: thinking
    text: ボクの同好会の名簿も……。
  - speaker: tsumugi
    emotion: thinking
    text: 聞かれた元社員の数人は、自分の名前が用いられていることを知らなかったって。
  - speaker: tsumugi
    emotion: normal
    text: 名前は、知らないうちに使われていることがあるのよ。
  - speaker: zundamon
    emotion: sad
    text: ……5人に、ちゃんと聞いてくるのだ。
    se: shobon
