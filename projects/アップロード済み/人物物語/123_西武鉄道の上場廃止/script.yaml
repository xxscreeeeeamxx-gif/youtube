meta:
  title: 「全く疎く、ノータッチだった」と会見で語った西武の総帥、141日後に逮捕された【ずんだもん解説】
  slug: seibu-tsutsumi
  hook_line: 「ノータッチだった」と語った西武の総帥は、なぜ有罪になったのか。
  summary: 2004年10月13日、西武グループの総帥だった堤義明は、すべての役職を退く会見で「ノータッチだった」と語りました。上場している西武鉄道を、上場していないコクドが握る形。その株主名簿には、本人も知らない約1,200人の名前が並び、印鑑は会社の棚にありました。55年続いた上場は、なぜ65日後に終わったのか。証券取引等監視委員会の資料、西武鉄道の発表、当時の報道をもとに、会社と本人の言葉を主語つきで並べて、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 証券取引等監視委員会「証券取引等監視委員会の活動状況」（2005年） https://www.fsa.go.jp/sesc/reports/n_16/n_16d.pdf
  - 証券取引等監視委員会「告発事件の概要一覧表」 https://www.fsa.go.jp/sesc/actions/koku_gaiyou.htm
  - 西武鉄道「コクド管理株の発生の原因・経緯等について」（2004年11月12日） https://www.seiburailway.jp/company/ir/disclosure/ka-04-33.pdf
  - 小谷融「証券不祥事と法規制〜西武鉄道事件〜」『大阪経大論集』67巻6号（2017年） https://www.jstage.jst.go.jp/article/keidaironshu/67/6/67_43/_pdf
  - ダイヤモンド・オンライン「堤義明が急拡大“前夜”に語った『三菱のような企業集団が夢』」（2020年4月22日） https://diamond.jp/articles/-/235248
  tags:
  - 西武鉄道
  - 堤義明
  - コクド
  - 上場廃止
  - 有価証券報告書
  - 虚偽記載
