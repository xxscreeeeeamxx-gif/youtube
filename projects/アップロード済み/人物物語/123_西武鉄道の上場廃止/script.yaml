scenes:
# ---- 先出し（2004年10月13日の会見） ----
- id: co_kaiken
  title: ''
  background: tj_kaiken
  bgm: serious
  stage:
  - {who: zundamon, x: 0.5, tag: 堤義明, emotion: sad}
  cuts:
  - speaker: reimu
    text: 2004年10月13日、東京のホテル。西武グループの総帥、堤義明、70歳。すべての役職を退く会見です。
    reading: にせんよねん じゅうがつ じゅうさんにち、とうきょうの ほてる。せいぶ ぐるーぷの そうすい つつみ よしあき ななじゅっさい。すべての やくしょくお しりぞく かいけんです。
  - speaker: zundamon
    emotion: sad
    text: 株式実務とか法の手続き規定などには、率直なところ全く疎く、ノータッチだった
  - speaker: reimu
    text: 起訴状によれば、彼は141日前に届け出のうそを知り、公表の前にグループの会社が株を売っていました。
    reading: きそじょうに よれば かれわ ひゃくよんじゅういちにち まえに とどけでの うそお しり、こうひょうの まえに ぐるーぷの かいしゃが かぶお うって いました。
  - speaker: reimu
    text: 12日後、彼の球団は日本一に。65日後、西武鉄道は上場廃止。141日後、彼は逮捕されます。
    reading: じゅうににちご、かれの きゅうだんわ にほんいちに。ろくじゅうごにちご、せいぶ てつどうわ じょうじょう はいし。ひゃくよんじゅういちにちご、かれわ たいほ されます。
# ---- 今の部屋（名前だけの部員） ----
- id: hook
  title: ''
  background: tj_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: ずんだ餅同好会、部員5人そろったのだ！
  - speaker: tsumugi
    emotion: normal
    text: 誰が入ったの？
  - speaker: zundamon
    emotion: happy
    text: クラスの子の名前を書いて、ハンコも押しといたのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 本人たち、知ってるの？
  - speaker: zundamon
    emotion: normal
    text: 知らないのだ。
    se: zukko
  - speaker: tsumugi
    emotion: thinking
    text: それを47年以上やってた会社があるの。でも裁かれたのは、最後の数か月だけ。
  - speaker: zundamon
    emotion: surprised
    text: ノータッチだったのに、なんで有罪なの！？
    telops:
    - {text: "「ノータッチ」と言った総帥は なぜ有罪に？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
# ---- 2004年5月・43%と65% ----
- id: ch1_houkoku
  title: 43%と65%
  background: tj_yakuin
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 堤義明, emotion: normal}
  - {who: yakuin, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 起訴状によれば、2004年5月25日。堤は、コクドの役員から報告を受けます。
    reading: きそじょうに よれば にせんよねん ごがつ にじゅうごにち。つつみわ、こくどの やくいんから ほうこくお うけます。
  - speaker: yakuin
    emotion: thinking
    text: 西武鉄道の報告書に、うちの持ち株が少なく書かれ続けています。
  - speaker: zundamon
    emotion: normal
    text: ……。
  - speaker: yakuin
    emotion: normal
    text: 届け出は約43%。本当は、約65%です。
    telops:
    - {text: "届け出 約43% → 本当は 約65%", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: yakuin
    emotion: thinking
    text: 上の10人の持ち株を足すと、88%になります。
  - speaker: yakuin
    emotion: sad
    text: 上場を続ける決まりは、80%以下です。
  - speaker: reimu
    text: このあと公表の前に、コクドは株を売ります。ばれる前に売った株は、誰が買ったのか。
    reading: この あと こうひょうの まえに、こくどわ かぶお うります。ばれる まえに うった かぶわ、だれが かったのか。
- id: ch1_room
  title: ''
  background: tj_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 43%と65%って、何が困るの？
  - speaker: tsumugi
    emotion: normal
    text: 上場していないコクドが、上場している西武鉄道を握ってる形なの。
  - speaker: tsumugi
    emotion: thinking
    text: だれでも買える店の看板なのに、品物の9割近くを店主の身内と仲間が押さえてるのよ。
  - speaker: zundamon
    emotion: surprised
    text: それじゃ、ほかの人はほとんど買えないよ！
    se: bikkuri
  - speaker: zundamon
    emotion: thinking
    text: でも届け出は43%。残りの株は、誰の名前になってたの？
  - speaker: tsumugi
    emotion: thinking
    text: 名前だけの株主よ。
# ---- 名前だけの株主（2004年の株式の担当の棚） ----
- id: ch1_meigi
  title: 名前だけの株主
  background: tj_kabushiki_new
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 1,200人の株主は、どこにいたのか。名前は、本人も知らない元社員らのものでした。
    reading: せんにひゃくにんの かぶぬしわ、どこに いたのか。なまえわ、ほんにんも しらない もと しゃいんらの ものでした。
  - speaker: reimu
    text: その人たちの印鑑は、西武鉄道の社内の棚にしまわれていました。
    reading: その ひとたちの いんかんわ、せいぶ てつどうの しゃないの たなに しまわれて いました。
- id: ch1_room2
  title: ''
  background: tj_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 知らない人の名前の株って、1人いくらぶんなの？
  - speaker: tsumugi
    emotion: normal
    text: 平均で約9万株。1株1,200円ほどなら、約1億円よ。
    telops:
    - {text: "知らないうちに 平均で1億円分の株主", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 知らないうちに、1億円の株主！？
  - speaker: zundamon
    emotion: happy
    text: ボクも知らないうちに、1億円の株主になりたいのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 本人には、1円も入らないわよ。配当はコクドへ行くんだから。
    beat: true
  - speaker: tsumugi
    emotion: thinking
    text: 名簿には、[堤義明|つつみよしあき]の名前で81万株もあったの。
  - speaker: zundamon
    emotion: thinking
    text: その81万株の[堤義明|つつみよしあき]は、本人なの？
  - speaker: tsumugi
    emotion: normal
    text: それも、コクドが管理する株だったの。
  - speaker: zundamon
    emotion: surprised
    text: 本人の名前の株まで、本人のじゃないのだ！？
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: しかもこの名簿のうそは、彼がグループを継ぐ前から続いてたの。
# ---- 1964年・父の事務所の株券 ----
- id: card1964
  title: ''
  background: tj_card_1964
  bgm: 223am
  cuts:
  - speaker: reimu
    text: 1964年4月。西武グループをつくった父、堤康次郎が亡くなります。75歳でした。
    reading: せんきゅうひゃく ろくじゅうよねん しがつ。せいぶ ぐるーぷお つくった ちち つつみ やすじろうが なくなります。ななじゅうごさい でした。
- id: ch2_bunsitsu
  title: 広尾分室の株券
  background: tj_bunsitsu
  stage:
  - {who: jimuin, x: 0.28, flip: true, emotion: sad}
  - {who: jimuin2, x: 0.7, emotion: thinking}
  cuts:
  - speaker: jimuin2
    emotion: thinking
    text: 棚の西武鉄道の株券は、どこへ運びます？
  - speaker: jimuin
    emotion: sad
    text: 全部、コクドだ。事務所の後始末だよ。
  - speaker: jimuin2
    emotion: surprised
    text: この束を、全部……。
    background: tj_bunsitsu_hako
  - speaker: jimuin2
    emotion: normal
    text: 後を継ぐのは、三男の義明さんだそうですね。
  - speaker: jimuin
    emotion: normal
    text: 29歳だそうだ。
  - speaker: reimu
    text: 名前だけの株主が、いつなぜ始まったのか。西武鉄道はのちに調べても、よく判りませんでしたと書いています。
    reading: なまえだけの かぶぬしが、いつ なぜ はじまったのか。せいぶ てつどうわ のちに しらべても、よく わかりませんでしたと かいて います。
  - speaker: reimu
    text: この箱の中身が、40年後に西武鉄道の上場を終わらせます。
    reading: この はこの なかみが、よんじゅうねんごに せいぶ てつどうの じょうじょうお おわらせます。
# ---- 1977年・三菱のような事業集団 ----
- id: ch3_yume
  title: 三菱のような事業集団
  background: tj_yakuin
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 堤義明, emotion: normal}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1977年。42歳の堤は、経済誌のインタビューでこう語っています。
    reading: せんきゅうひゃく ななじゅうななねん。よんじゅうにさいの つつみわ けいざいしの いんたびゅーで こう かたって います。
  - speaker: zundamon
    emotion: normal
    text: 西武集団を三菱のような事業集団にしたいというのが一つの夢ですね
  - speaker: kisha
    emotion: surprised
    text: 三菱のような、ですか。
  - speaker: reimu
    text: 理想を言えば、苗場のようなスキー場を全国に10か所造りたいとも話しました。
    reading: りそうお いえば なえばの ような すきーじょうお ぜんこくに じゅっかしょ つくりたいとも はなしました。
  - speaker: reimu
    text: 翌年には、プロ野球の球団を買います。
    reading: よくねんにわ、ぷろやきゅうの きゅうだんお かいます。
# ---- 1983年ごろ・株主コード92 ----
- id: ch4_code92
  title: 株主コード92
  background: tj_kabushiki
  bgm: curious
  stage:
  - {who: senpai, x: 0.28, flip: true, emotion: normal}
  - {who: shinjin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1983年ごろ。西武鉄道は、株主の名簿をコンピューターに移します。
    reading: せんきゅうひゃく はちじゅうさんねん ごろ。せいぶ てつどうわ、かぶぬしの めいぼお こんぴゅーたーに うつします。
  - speaker: shinjin
    emotion: normal
    text: 先輩。この棚の印鑑は、誰のですか。
  - speaker: senpai
    emotion: normal
    text: 92番の人たちのだ。
  - speaker: shinjin
    emotion: thinking
    text: 92番？
  - speaker: senpai
    emotion: normal
    text: コンピューターの株主コードだ。92番は、コクドの株だ。
  - speaker: shinjin
    emotion: surprised
    text: でも名簿には、知らない人の名前が並んでますよ。
  - speaker: senpai
    emotion: normal
    text: 名前はな。
  - speaker: shinjin
    emotion: thinking
    text: 前の担当の人からは、どう引き継いだんですか。
  - speaker: senpai
    emotion: normal
    text: コクドの指示に基づいて処理するように、だ。
    telops:
    - {text: "引き継ぎの言葉「コクドの指示に基づいて処理するように」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: shinjin
    emotion: normal
    text: それで、何をするんです？
  - speaker: senpai
    emotion: normal
    text: 株主総会の招集通知を作る。
  - speaker: shinjin
    emotion: happy
    text: じゃあ、切手を貼りますね！
  - speaker: senpai
    emotion: normal
    text: 送らない。
  - speaker: shinjin
    emotion: surprised
    text: 作るのに！？
  - speaker: senpai
    emotion: normal
    text: 作って、送らない。
  - speaker: shinjin
    emotion: thinking
    text: 配当は？
  - speaker: senpai
    emotion: normal
    text: コクドに払う。
  - speaker: shinjin
    emotion: thinking
    text: 来年の通知は……。
  - speaker: senpai
    emotion: normal
    text: 作って、送らない。
  - speaker: shinjin
    emotion: normal
    text: ……切手代、浮きますね。
    beat: true
# ---- 1984年・対談 ----
- id: ch4_taidan
  title: ''
  background: tj_yakuin
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.5, tag: 堤義明, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1984年。堤は住友銀行の磯田一郎との対談で、銀行が企業を育てた話の中でこう語っています。
    reading: せんきゅうひゃく はちじゅうよねん。つつみわ すみとも ぎんこうの いそだ いちろうとの たいだんで、ぎんこうが きぎょうお そだてた はなしの なかで こう かたって います。
  - speaker: zundamon
    emotion: normal
    text: 私のところなんかも昔、止められたら倒産というのはなんべんかあったんですよ
# ---- 1987年・世界一の富豪 ----
- id: ch5_fugo
  title: 世界一の富豪
  background: tj_kabushiki
  bgm: natsuyasumi
  stage:
  - {who: senpai, x: 0.28, flip: true, emotion: normal}
  - {who: shinjin, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1987年。アメリカの経済誌フォーブスは、堤義明を世界一の富豪と書きました。
    reading: せんきゅうひゃく はちじゅうななねん。あめりかの けいざいし ふぉーぶすわ、つつみ よしあきお せかいいちの ふごうと かきました。
  - speaker: shinjin
    emotion: happy
    text: 先輩！ うちの社長、世界一のお[金|かね]持ちですって！
    se: levelup
  - speaker: senpai
    emotion: normal
    text: そうか。
  - speaker: shinjin
    emotion: happy
    text: スキー場は33か所。ホテルも、どんどん増えてます！
  - speaker: shinjin
    emotion: happy
    text: 野球の球団まで、持ってますし！
  - speaker: senpai
    emotion: normal
    text: 通知、作るぞ。
  - speaker: shinjin
    emotion: thinking
    text: ……送らないやつですね。
    beat: true
  - speaker: reimu
    text: 届け出の数字の上では、西武鉄道は上場の基準を満たしていました。
    reading: とどけでの すうじの うえでわ、せいぶ てつどうわ じょうじょうの きじゅんお みたして いました。
  - speaker: reimu
    text: それから17年。株式の担当には、ほとんど異動がありませんでした。
    reading: それから じゅうななねん。かぶしきの たんとうにわ ほとんど いどうが ありませんでした。
    background: tj_kabushiki_new
  - speaker: shinjin
    emotion: thinking
    text: ……変わったのは、パソコンだけですね。
  - speaker: senpai
    emotion: normal
    text: 前例どおりだ。
    beat: true
# ---- 2004年・総会屋の事件と6月の1通 ----
- id: card2004
  title: ''
  background: tj_card_2004
  bgm: serious
  cuts:
