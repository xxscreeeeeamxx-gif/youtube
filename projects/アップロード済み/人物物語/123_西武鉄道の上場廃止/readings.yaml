# seibu-tsutsumi 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 堤義明 / label: 役員・先輩・コクド社員・東証の職員・管理本部長 ほか）・テロップ・章タイトル（広尾分室の株券 ほか）は
# 表示専用なのでタグを付けていない。
#
# 2026-11-14 台本を書いた担当が VOICEVOX の audio_query で確かめたこと（音声の合成はしていない）:
# - 堤義明 はタグなしでも ツツミ/ヨシアキ と読むが、台帳に入れたのでセリフは [堤義明|つつみよしあき]（ツツミ/ヨシアキ）。
#   カタカナのタグ [堤義明|ツツミヨシアキ] は ツツミヨシ/アキ に割れたので使わない。
# - 義明 は dictionary.yaml に ヨシアキ があるのでタグなし（「三男の義明さん」= ヨシアキサン）。
# - 堤清二 は [堤清二|つつみせいじ] で ツツミセイジ。西山隆一郎・後藤高志 はひらがなのタグで ニシヤマ/リュウイチロオ・ゴトオ/タカシ。
# - 後藤さん（タグなし）は ゴトオサン。
# - 「前行け前行け」はタグなしだと ゼンイケ/マエ/イケ になったので、[前行け前行け|まえいけまえいけ] にした（マエイケマエイケト）。
#   1語目だけのタグ・カタカナのタグは マエ/イケ に割れた。
# - 大株主 は辞書に無いと ダイカブヌシ。2026-11-14 の見直しのあと dictionary.yaml（オオカブヌシ・accent 3）と
#   readings_common.yaml に入ったので、セリフのタグは外した（辞書に登録済みの語にタグを重ねない）。
#   辞書の変更がコミットされないなら、セリフを [大株主|オオカブヌシ] に戻すこと。
# - 懲役2年6月 は [懲役2年6月|ちょうえきにねんろっかげつ] で チョオエキニネン/ロッカゲツ。
# - 市場 は「市場を通さずに」で [市場|しじょう]（シジョオオ）。
# - 本文で直したもの（台帳には入れない）:
#   ・賠償の分＝バイショオノワケ → 「賠償のぶん」
#   ・その間に＝ソノカンニ → 「そのあいだに」
#   ・誰の会社か、のうそ＝ノオソ → 「誰の会社か、といううそ」（見直しの直す10）
#   ・このあと金融庁が＝アトキンユウチョオガ → 「このあと、金融庁の点検で」（見直しの任意13）
#   ・西山隆一郎よ＝リュウイ/チロオヨ に割れるので「〜が務めてるわ」で終える（見直しの直す12）
# - タグなしで正しく読むので台帳に入れていない語（入れるとセリフの全出現にタグが要る）:
#   疎く＝ウトク、株式実務＝カブシキジツム、手続き規定＝テツズキキテエ、率直＝ソッチョク、第一線＝ダイイッセン、
#   取締役その他＝トリシマリヤクソノタ、当該株式＝トオガイカブシキ、実質所有者＝ジッシツショユウシャ、
#   株主名簿上＝カブヌシメエボジョオ、招集通知＝ショオシュウツウチ、監理ポスト＝カンリポスト、後始末＝アトシマツ、
#   三男＝サンナン、西武集団＝セエブシュウダン、被告会社＝ヒコクガイシャ、執行を猶予＝シッコオオ/ユウヨ、
#   有価証券報告書＝ユウカショオケンホオコクショ、虚偽記載＝キョギキサイ、生え抜き＝ハエヌキ、答申＝トオシン、
#   前例＝ゼンレエ、印鑑＝インカン、株券＝カブケン、10月20日＝ハツカ、9月＝クガツ、1,200円＝センニヒャクエン。
