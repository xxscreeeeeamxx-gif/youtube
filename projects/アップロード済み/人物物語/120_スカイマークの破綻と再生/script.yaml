meta:
  title: スカイマーク元社長「完全に裸の王様でした」、売上の2倍の買い物を解約され半年で民事再生【ずんだもん解説】
  slug: skymark-saisei
  hook_line: 売上の2倍の買い物を、なぜ誰も止めず、誰が会社を拾ったのか。
  summary: 2014年7月、霞が関の会見で、スカイマークの社長・西久保愼一は「資金繰りに問題はない」と語りました。大手の半額で飛ぶ会社に35億円を出し、「1年だけなら」と社長になったIT企業の経営者。手荒な改革のあと、誰も反対しなくなった会議室で、世界最大の旅客機6機の約束が決まります。会社はなぜそこまで行き、清算の前夜に誰が拾ったのか。会見・国会・取材に残る本人たちの言葉と、国や会社の文書をもとに、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 日本経済新聞「スカイマーク西久保社長「一方的に解約の連絡が来た」」（2014年7月29日） https://www.nikkei.com/article/DGXLMSGD29H0D_Z20C14A7I00000/
  - 国会会議録 衆議院 国土交通委員会 第164回国会 第12号（2006年4月11日、参考人 西久保愼一） https://kokkai.ndl.go.jp/txt/116404319X01220060411/24
  - 国土交通省 報道発表「スカイマーク株式会社に対する業務改善勧告について」（2010年4月6日） https://www.mlit.go.jp/report/press/cab10_hh_000024.html
  - スカイマーク「再生計画認可決定に関するお知らせ（再生債務者案可決）」（2015年8月5日） https://www.skymark.co.jp/ja/company/press/150805_press.pdf
  - スカイマーク「民事再生手続の終結のお知らせ」（2016年3月28日） https://www.skymark.co.jp/ja/company/press/160328_press.pdf
  - JBpress「スカイマーク元社長が初めて語る経営破綻の真相」（2018年7月13日） https://jbpress.ismedia.jp/articles/-/53551
  tags:
  - スカイマーク
  - 西久保愼一
  - 佐山展生
  - エアバス
  - A380
  - 民事再生
  - 円安
  - インテグラル
  - 定時運航率
  - 再上場
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 平成史
