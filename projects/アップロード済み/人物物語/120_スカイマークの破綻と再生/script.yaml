    text: ネットで見たのだ！ [A380|エーサンハチマル]を買ったから潰れたって！
  - speaker: tsumugi
    emotion: normal
    text: そう言える事実はあるの。売上の2倍を超える代金に、払えなかった前払い。
  - speaker: tsumugi
    emotion: normal
    text: 求められた7億ドルは、当時のお[金|かね]で700億円から800億円ほど。
  - speaker: zundamon
    emotion: surprised
    text: 1年の売上に近いのだ！
  - speaker: tsumugi
    emotion: normal
    text: 本人も2018年に、あれは完全な失敗でしたと話してる。
  - speaker: zundamon
    emotion: sad
    text: 本人が、そう言ってるのだ……。
  - speaker: tsumugi
    emotion: thinking
    text: プランの段階で止めておくべきでした、とも話してるわ。
  - speaker: tsumugi
    emotion: thinking
    text: でも、いちばん大きな債権者は[A330|エーサンサンマル]を貸したリース会社だったの。
  - speaker: zundamon
    emotion: surprised
    text: 買う約束じゃなくて、借りる約束のほう！？
  - speaker: tsumugi
    emotion: normal
    text: '[A380|エーサンハチマル]は買う約束、[A330|エーサンサンマル]は借りる約束。どっちもドルで払うのよ。'
  - speaker: tsumugi
    emotion: normal
    text: 申請の理由の先頭も、[A330|エーサンサンマル]のドル建てのリース料と円安だったわ。
  - speaker: zundamon
    emotion: surprised
    text: '[円安|えんやす]が、ここでも出てくるのだ！'
  - speaker: tsumugi
    emotion: normal
    text: 本人も2024年に、いちばんの要因は円安だと話してる。
  - speaker: tsumugi
    emotion: normal
    text: 2020年の講演では、これという特定のものはないとも言ってるわ。
  - speaker: tsumugi
    emotion: normal
    text: '[佐山|さやま]は、単純に大きな飛行機を調達しすぎただけと言ったの。'
  - speaker: zundamon
    emotion: thinking
    text: 大きな飛行機の約束を2つ抱えたところに、円安が来たのか……。
  - speaker: tsumugi
    emotion: normal
    text: どれが一番効いたかは、当事者の言い方が少しずつ違うのよ。
