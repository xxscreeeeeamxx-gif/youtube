scenes:
# ---- 先出し（2014年7月29日・国交省での会見 → 2018年の取材） ----
- id: co_kaiken
  title: ''
  background: sm_kaiken
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 西久保愼一, emotion: normal}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2014年7月、霞が関。大型機の契約を解かれた、スカイマークの社長・西久保愼一の会見です。
    reading: にせん じゅうよねん しちがつ、かすみがせき。おおがたきの けいやくお とかれた すかいまーくの しゃちょう にしくぼ しんいちの かいけんです。
  - speaker: kisha
    emotion: normal
    text: エアバスとの交渉の現状は。
  - speaker: zundamon
    emotion: normal
    text: 十分な話し合いがもたれていない。……正式な会議も一度もない。
  - speaker: kisha
    emotion: normal
    text: ……資金繰りは。
  - speaker: zundamon
    emotion: normal
    text: 資金繰りに問題はない。
  - speaker: reimu
    text: 半年後、会社は民事再生を申し立て、この人は社長を退きます。4年後の取材で、本人はこう振り返ります。
    reading: はんとしご かいしゃわ みんじ さいせいお もうしたて、この ひとわ しゃちょうお しりぞきます。よねんごの しゅざいで、ほんにんわ こう ふりかえります。
  - speaker: zundamon
    emotion: sad
    background: sm_jimusho
    text: 今にして思えば、当時の僕は完全に裸の王様でした。
    se: don
    telops:
    - {text: "西久保（2018年）「当時の僕は完全に裸の王様でした」", size: md, position: top-center, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
# ---- 今の部屋（ドル払いのプラモデル） ----
- id: hook
  title: ''
  background: sm_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: お小遣いの2倍の飛行機のプラモ、海外通販で6個予約したのだ！
  - speaker: zundamon
    emotion: happy
    text: 毎月少しずつ払えばいけるのだ！
  - speaker: tsumugi
    emotion: thinking
    text: それ、ドル払いでしょ。円安になったら？
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 売上の2倍を超える飛行機を、買う約束をした航空会社があるの。
  - speaker: zundamon
    emotion: surprised
    text: なんでそこまで行っちゃったのだ！？
  - speaker: tsumugi
    emotion: thinking
    text: 潰れかけたその会社を、拾った人もいるのよ。
    telops:
    - {text: "売上の2倍超の買い物 なぜそこまで行き 誰が拾った？", size: md, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
# ---- 1998年・大手の半額 ----
- id: card1998
  title: ''
  background: sm_card_1998
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1998年9月、羽田〜福岡。新しい航空会社、スカイマークの初便です。
    reading: せんきゅうひゃく きゅうじゅうはちねん くがつ、はねだ ふくおか。あたらしい こうくう がいしゃ すかいまーくの しょびんです。
- id: ch1_kuko
  title: 大手の半額で飛ぶ
  background: sm_kuko
  stage:
  - {who: kyaku, x: 0.5, emotion: surprised}
  cuts:
  - speaker: kyaku
    emotion: surprised
    text: 福岡まで1万3700円！？ 大手の半額じゃないか！
  - speaker: kyaku
    emotion: happy
    text: チェックインの紙も、スーパーのレシートみたいに薄いな。
  - speaker: reimu
    text: 大手は2万7000円。差は1万3300円です。それでも5年後、たまった赤字は120億円を超えます。
    reading: おおてわ にまん ななせんえん。さわ いちまん さんぜん さんびゃくえんです。それでも ごねんご、たまった あかじわ ひゃく にじゅうおくえんお こえます。
# ---- 2003年・35億円の男と、2時に始まる会議 ----
- id: card2003
  title: ''
  background: sm_card_2003
  bgm: curious
  cuts:
  - speaker: reimu
    text: 2003年。35億円を出して筆頭株主になったのは、ITの会社の経営者、48歳の西久保愼一です。
    reading: にせん さんねん。さんじゅうごおくえんお だして ひっとう かぶぬしに なったのわ、あいてぃーの かいしゃの けいえいしゃ よんじゅうはっさいの にしくぼ しんいちです。
- id: ch1_kaigi
  title: 2時に始まる会議
  background: sm_kaigi_2ji
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 西久保愼一, emotion: normal}
  - {who: kanbu, x: 0.7, emotion: normal}
  cuts:
  - speaker: kanbu
    emotion: normal
    text: 顧問、幹部会議は2時からです。どうぞ。
  - speaker: kanbu
    emotion: normal
    text: ……3時です。昼に出た者が、いま戻りました。
  - speaker: kanbu
    emotion: happy
    background: sm_kaigi_4ji
    text: そろいました！ 4時です。
    se: zukko
  - speaker: kanbu
    emotion: normal
    text: 顧問。社長を、引き受けていただけませんか。
  - speaker: kanbu
    emotion: thinking
    text: 1週間たちました。やはり、顧問しかいません。
  - speaker: reimu
    text: 本人は2018年に、こう振り返っています。
    reading: ほんにんわ にせん じゅうはちねんに、こう ふりかえって います。
  - speaker: zundamon
    emotion: thinking
    text: これでよく飛行機が飛んでいるなと思いましたね。
  - speaker: zundamon
    emotion: sad
    text: 自分も、[金|かね]をドブに捨ててしまったなと。
  - speaker: zundamon
    emotion: normal
    text: 『1年だけなら』という条件で引き受けたんです。
  - speaker: reimu
    text: やがて社長に。1年だけのはずが、11年続きます。
    reading: やがて しゃちょうに。いちねん だけの はずが、じゅういちねん つづきます。
  - speaker: zundamon
    emotion: normal
    text: 僕はかなり手荒な社内改革をやって、それから会社が上手くいきだしたわけです。
  - speaker: zundamon
    emotion: sad
    text: そうしたら、社員がほとんど僕に逆らわなくなってしまっていた。
# ---- 2010年11月・誰も反対しない会議室 ----
- id: ch1_a380
  title: 売上の2倍を超える買い物
  background: sm_kaigi_4ji
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 西久保愼一, emotion: normal}
  - {who: kanbu, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 2010年11月。会社はエアバスと、世界最大の旅客機A380を6機買う基本合意を結びます。
    reading: にせん じゅうねん じゅういちがつ。かいしゃわ えあばすと せかい さいだいの りょかくき えーさんはちまるお ろっき かう きほん ごういお むすびます。
  - speaker: kanbu
    emotion: happy
    text: 2階建てで、3クラスで525席ですか！
  - speaker: kanbu
    emotion: happy
    text: これで国際線ですね。夢がありますなあ。
  - speaker: kanbu
    emotion: happy
    text: 社長の案に、反対の方は。……いませんね。
  - speaker: reimu
    text: このときのことを、本人は2018年にこう振り返ります。
    reading: この ときの ことお、ほんにんわ にせん じゅうはちねんに こう ふりかえります。
  - speaker: zundamon
    emotion: sad
    text: '[A380|エーサンハチマル]の導入を言い出した時も、誰も反対しなかった。'
  - speaker: zundamon
    emotion: normal
    text: 『それは素晴らしい。絶対いけますよ』なんてね。
  - speaker: zundamon
    emotion: sad
    text: 気づかなかった僕のミスです。
  - speaker: reimu
    text: 6機の代金は、2014年の会社の見込みで1915億円。年間の売上の2倍を超えます。
    reading: ろっきの だいきんわ、にせん じゅうよねんの かいしゃの みこみで せん きゅうひゃく じゅうごおくえん。ねんかんの うりあげの にばいお こえます。
    telops:
    - {text: "A380 6機 1915億円 ＝売上の2倍超", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: そしてこの買い物は、ドルで払う約束でした。
    reading: そして この かいものわ、どるで はらう やくそくでした。
# ---- 今の部屋（国会と国の勧告を読む） ----
- id: ch1_kiroku
  title: 国会と国の勧告
  background: sm_heya
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: ドル払い！？ ボクのプラモと同じなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 額は、売上の2倍を超えるけどね。
    se: hammer
  - speaker: zundamon
    emotion: surprised
    text: 売上の2倍って、どのくらいなのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 年収500万円の家が、合わせて1100万円の車を6台買う約束をしたようなものね。
  - speaker: zundamon
    emotion: surprised
    text: それを、誰も止めなかったの！？
  - speaker: tsumugi
    emotion: normal
    text: 2006年、本人は国会に[参考人|サンコウニン]として呼ばれてこう認めてる。
  - speaker: tsumugi
    emotion: thinking
    text: 整備期限を過ぎて運航していたというこういった恥ずべき状況。
  - speaker: zundamon
    emotion: sad
    text: 自分で、恥ずべきって言ったのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 別の答えでは、安全がまず第一優先であることには変わりはないとも言ってるわ。
  - speaker: tsumugi
    emotion: normal
    text: そして2010年4月、国土交通省の業務改善勧告。理由はこう。
  - speaker: tsumugi
    emotion: thinking
    text: 社長及び安全統括管理者が機長の安全優先の判断を尊重せず運航を指示した事案。
  - speaker: tsumugi
    emotion: normal
    text: 操縦室内でデジタルカメラを使用した事案、管制指示を逸脱した運航を行った事案。
  - speaker: tsumugi
    emotion: normal
    text: これが連続して発生したことから、とあるわ。
  - speaker: zundamon
    emotion: sad
    text: 国の文書に、そこまで書かれたのだ……。
  - speaker: tsumugi
    emotion: normal
    text: '[A380|エーサンハチマル]の基本合意は、この勧告の7か月後よ。'
  - speaker: tsumugi
    emotion: thinking
    text: その約束が会社をどこまで追い込み、誰が拾ったのか。
# ---- 2012年・過去最高益とニューヨーク ----
- id: card2012
  title: ''
  background: sm_card_2012
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 2012年3月期。営業利益は152億円で、会社の過去最高になります。
    reading: にせん じゅうにねん さんがつき。えいぎょう りえきわ ひゃく ごじゅうにおくえんで、かいしゃの かこ さいこうに なります。
- id: ch2_ny
  title: 過去最高益とニューヨーク
  background: sm_kaiken
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 西久保愼一, emotion: happy}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: kisha
    emotion: normal
    text: '[A380|エーサンハチマル]は、どの路線から飛ばしますか。'
  - speaker: zundamon
    emotion: happy
    text: 第一候補はニューヨーク路線で動いている。
  - speaker: zundamon
    emotion: normal
    text: ロンドン路線はヨーロッパの景気が好ましくないので、その次くらいにしようと考えている。
  - speaker: kisha
    emotion: normal
    text: '[羽田|ハネダ]の発着枠の配分の影響は。'
  - speaker: zundamon
    emotion: normal
    text: 幹線は[A330|エーサンサンマル]を入れていくので提供座席数が1.8倍くらいになり、
  - speaker: zundamon
    emotion: happy
    text: 枠を10枠くらいもらうのに匹敵する。
  - speaker: reimu
    text: 11月の中間決算の説明会の言葉です。このA380は、1機もこの会社に届きませんでした。
    reading: じゅういちがつの ちゅうかん けっさんの せつめいかいの ことばです。この えーさんはちまるわ、いっきも この かいしゃに とどきませんでした。
# ---- 2014年・円安と払えない8億円 ----
- id: card2014
  title: ''
  background: sm_card_2014
  bgm: serious
  cuts:
  - speaker: reimu
    text: 2014年4月。前の年度、会社は5年ぶりの赤字になっていました。
    reading: にせん じゅうよねん しがつ。まえの ねんど、かいしゃわ ごねんぶりの あかじに なって いました。
- id: ch3_enyasu
  title: 円安と払えない8億円
  background: sm_kaigi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 西久保愼一, emotion: normal}
  - {who: keiri, x: 0.7, emotion: normal}
  cuts:
  - speaker: keiri
    emotion: normal
    text: 社長、うちの支払いの6割はドル払いです。
  - speaker: keiri
    emotion: normal
    text: 燃料も借りている機体も、外国人パイロットのお給料も。
  - speaker: keiri
    emotion: normal
    text: 整備の部品も、ドルです。
  - speaker: keiri
    emotion: normal
    text: 1万ドルの支払いが、1ドル80円なら80万円。
  - speaker: keiri
    emotion: sad
    background: sm_kaigi_akaji
    text: 120円なら、120万円です。
    se: gaan
  - speaker: keiri
    emotion: sad
    text: 社長。今月の[A380|エーサンハチマル]の前払い、8億円が払えません。
  - speaker: reimu
    text: 円安は、このあと1ドル120円ほどまで進みます。本人の説明では、毎月約8億円の赤字になりました。
    reading: えんやすわ このあと いちどる ひゃく にじゅうえん ほどまで すすみます。ほんにんの せつめいでわ、まいつき やく はちおくえんの あかじに なりました。
    telops:
    - {text: "円安で 毎月 約8億円の赤字", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
- id: ch3_kosho
  title: 大手の傘下という条件
  background: sm_yakuin
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 西久保愼一, emotion: normal}
  - {who: airbus, x: 0.7, emotion: normal}
  cuts:
  - speaker: airbus
    emotion: normal
    text: 4機は解約、製造中の2機は受け取りを延ばしたいというお話ですね。
  - speaker: airbus
    emotion: normal
    text: 大手航空会社の傘下に入るのが契約変更を受け入れる条件。
  - speaker: reimu
    text: 会社の説明では、この条件を示され、西久保は断ります。
    reading: かいしゃの せつめいでわ この じょうけんお しめされ、にしくぼわ ことわります。
- id: ch3_jishu
  title: ''
  background: sm_shacho
  stage:
  - {who: zundamon, x: 0.5, tag: 西久保愼一, emotion: normal}
  cuts:
  - speaker: reimu
    text: 6月13日、借りたA330の就航の前日。大手などに買われるという噂を、西久保はこう否定します。
    reading: ろくがつ じゅうさんにち、かりた えーさんさんまるの しゅうこうの ぜんじつ。おおてなどに かわれると いう うわさお、にしくぼわ こう ひてい します。
  - speaker: zundamon
    emotion: normal
