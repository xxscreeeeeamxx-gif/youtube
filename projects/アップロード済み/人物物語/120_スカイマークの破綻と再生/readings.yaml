# skymark-saisei 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 西久保愼一 / label: 佐山展生・井手隆司・有森社長・洞駿・国交大臣 など）・テロップ・章タイトルは表示専用なのでタグを付けていない。
# 西久保愼一・西久保・井手隆司・有森正和・洞駿・霞が関・那覇 はナレと名札だけに出る（セリフでは「社長」「本人」「会長」と呼ぶ）。
# 佐山 はセリフでは [佐山|さやま] にした（つむぎの論争・注意点の章）。
# 羽田 は読みに「は」を含むので、セリフのタグはカタカナ [羽田|ハネダ] にした（ひらがなだと助詞のワに化けるおそれ）。
# A380・A330・737・B737 はカタカナのタグで固定した（A380 は読みに「ハ」を含むのでカタカナ必須）。
# エアバス・インテグラル・イントレピッド・スカイマーク はカタカナのまま読めるので台帳に入れていない。
# 方（ほう）・金（かね）は文脈で読みが割れるので台帳に入れず、本文の該当箇所だけタグを付けた（[方|ほう]が燃えます・[金|かね]をドブに・使い道のない[金|かね]）。
# 6分の1 は [6分の1|ろくぶんのいち]、CA は [CA|シーエー] にした。
# 借入枠 はタグを付けると カリイレ/ワク に割れ、タグなしで カリイレワク と1語で読むので、台帳から外した（2026-11-08 見直しの任意8）。
# 利益相反 はタグなしだと リエキアイハン になるので、カタカナのタグ [利益相反|リエキソウハン] にした（見直しの直す14。ひらがなのタグは読みに「は」を含むため使わない）。
# 737 は [737|ななさんなな] にした（カタカナのタグだと ナナサン/ナナ に割れた。見直しの直す15）。
