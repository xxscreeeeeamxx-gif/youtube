# - ナガセヴィータ は ナガセビイタ（ヴィ→ビ。VOICEVOX の仕様）。
# - 直したもの:
#   ・止める人がいない は トメル/ジンガ/イナイ になった → 止める[人|ひと]がいない（2か所）で トメル/ヒトガ。
#   ・会計監査人 は カイケエカンサジン になった。[会計監査人|かいけいかんさにん] は カイケイカンサニ/ン と切れ、
#     会計監査[人|にん] も カンサニ/ン と切れた → [会計監査人|カイケイカンサニン] で1句（2か所）。
#   ・中国銀行は、何て？ は ナニテ になった → [何|なん]て で ナンテ。
#   ・破綻のあと兄とは は アトケエトワ（兄＝ケイ）になった → 破綻のあとは[兄|あに]と で アトワ/アニト。
#   ・3〜4年前 は サン、/ヨネン/マエ と「〜」で切れた（見直しの指摘）→ [3〜4年前|さんよねんまえ] で サンヨネン/マエカラ。
#   ・林原家 は ハヤシバラカ になった。[林原家|はやしばらけ] は ハヤシ/バラケ と切れた → [林原家|ハヤシバラケ] で1語。
