# 2026-11-18 台本を書いたあと、セリフ全197行を VOICEVOX の audio_query（各話者の声）にかけた結果:
# - 林原 はタグなしで、どの文でも ハヤシバラ（ハヤシバラワ・ハヤシバラモ・ハヤシバラサンワ・ハヤシバラノ・ハヤシバラオ）。
