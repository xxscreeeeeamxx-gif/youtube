  - speaker: shain
    emotion: normal
    text: 長瀬産業が、出資と融資で700億円を出すそうだ。
  - speaker: shinjin
    emotion: thinking
    text: この駅前の土地も、売るんですよね。
  - speaker: shain
    emotion: normal
    text: 9月には、イオンモールに約200億円で売る契約をした。持っていた中国銀行の株も売る。
  - speaker: shinjin
    emotion: sad
    text: 前の社長が、博物館を建てたかった土地ですよね……。
  - speaker: shain
