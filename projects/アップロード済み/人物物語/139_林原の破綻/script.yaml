  - speaker: shinjin
    emotion: surprised
    text: 約93%！？
    se: bikkuri
    telops:
    - {text: "銀行などへ約93%　取引先には全額", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: shain
    emotion: normal
    text: 新聞は、更生法では異例の高さだと書いている。
# ---- 2012年3月26日・岡山市内の会見（管財人の言葉は山陽新聞の原文） ----
