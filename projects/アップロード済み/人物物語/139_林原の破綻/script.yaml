  - speaker: tsumugi
    emotion: normal
    text: 家のお[金|かね]も、1人に任せきりにしないこと。
  - speaker: zundamon
    emotion: normal
    text: 通帳は、2人で見るのだ。
  - speaker: tsumugi
    emotion: normal
