    telops:
    - {text: "調査委員会「特別背任罪が成立する可能性がある」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: shinjin
    emotion: surprised
    text: じゃあ、捕まるんですか？
  - speaker: shain
    emotion: normal
    text: 可能性がある、と書いただけだ。罪かどうかを決めるのは裁判所だよ。
  - speaker: reimu
    text: 管財人は旧経営陣4人に損害賠償を求める手続きを、裁判所に申し立てていました。
    reading: かんざいにんわ きゅう けいえいじん よにんに そんがい ばいしょうお もとめる てつづきお、さいばんしょに もうしたてて いました。
# ---- 2011年8月〜2012年3月・700億円と93%（700億円は出資と融資の合計。93%は更生債権等への弁済率。取引先の代金は別に全額） ----
