scenes:
# ---- 先出し（2011年2月2日・ADRの債権者会議。会議の場所は言わない（「岡山の」は会社に掛ける）。笑いの SE なし） ----
# 弁護士と銀行員は名前の無いモブ。林原の言葉は日経ビジネスを引いたブログの1言だけで、言い回しを足さない。ファクスと空いた席は本編（ch11_kaigi）で見せる
- id: co_kaigi
  title: ''
  background: hy_kaigi
  bgm: serious
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 林原社長, emotion: sad}
  - {who: bengoshi, x: 0.52, emotion: normal}
  - {who: ginko, x: 0.82, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2011年2月2日。トレハロースで知られる岡山の会社、林原と約30の銀行などの会議です。
    reading: にせん じゅういちねん にがつ ふつか。とれはろーすで しられる おかやまの かいしゃ、はやしばらと やく さんじゅうの ぎんこう などの かいぎです。
  - speaker: bengoshi
    emotion: normal
    text: 林原は、裁判所に会社更生法を申し立てます。
  - speaker: ginko
    emotion: surprised
    text: 調整は、これからのはずでしょう！
  - speaker: zundamon
    emotion: sad
    text: すべての責任が私にある
    pause_after: 0.6
  - speaker: reimu
    text: この男は、社長の林原健。負債は、林原1社で1322億円でした。
    reading: この おとこわ、しゃちょうの はやしばら けん。ふさいわ はやしばら いっしゃで せん さんびゃく にじゅうに おくえんでした。
  - speaker: reimu
    text: 9年近く前、彼は新聞の取材にこう話していました。『結果責任は、社長がかぶればいいんです。』
    reading: くねん ちかく まえ、かれわ しんぶんの しゅざいに こう はなして いました。けっか せきにんわ しゃちょうが かぶれば いいんです。
  - speaker: reimu
    text: 会社は約30年、銀行に本当と違う決算書を見せていました。
    reading: かいしゃわ やく さんじゅうねん、ぎんこうに ほんとうと ちがう けっさんしょお みせて いました。
# ---- 今の部屋（相手ごとに違う点数。回収は締め） ----
- id: hook
  title: ''
  background: hy_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.46, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: テスト、お母さんには80点で友だちには95点って言ったのだ！
  - speaker: tsumugi
    emotion: normal
    text: 本当は？
  - speaker: zundamon
    emotion: normal
    text: ……40点。
  - speaker: tsumugi
    emotion: thinking
    text: お母さんと友だちが話したら？
  - speaker: zundamon
    emotion: sad
    text: ……話さないのだ。
    se: tenten
  - speaker: tsumugi
    emotion: thinking
    text: 林原も2010年、2つの銀行が数字を見せ合った日から終わりが始まったの。
  - speaker: tsumugi
    emotion: normal
    text: 研究で知られた会社は、なぜ銀行ごとに違う決算書を作ったのか。
    telops:
    - {text: "研究の会社は なぜ銀行ごとに違う決算書を？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: テストと、同じなのだ！？
# ---- 1961年4月・19歳の社長（30秒以内。父は1行のナレまで。父との対立は使わない） ----
- id: card1961
  title: ''
  background: hy_card_1961
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1961年4月。父の林原一郎の急逝で、慶応大学の学生だった19歳の林原健が社長になります。
    reading: せんきゅうひゃく ろくじゅういちねん しがつ。ちちの はやしばら いちろうの きゅうせいで、けいおう だいがくの がくせいだった じゅうきゅうさいの はやしばら けんが しゃちょうに なります。
- id: ch1_kojo
  title: 19歳の社長
  background: hy_kojo
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 林原社長, emotion: normal}
  - {who: koin, x: 0.9, emotion: happy}
  cuts:
  - speaker: koin
    emotion: happy
    text: 新しい社長、ここが水あめの釜です。
  - speaker: koin
    emotion: normal
    text: 学生さんが社長で、大丈夫ですかね。
  - speaker: zundamon
    emotion: sad
    text: ……僕も、そう思います。
    beat: true
  - speaker: reimu
    text: この19歳が50年後に銀行ごとに違う決算書のことで頭を下げるとは、まだ誰も思っていません。
    reading: この じゅうきゅうさいが ごじゅうねんごに ぎんこうごとに ちがう けっさんしょの ことで あたまお さげるとわ、まだ だれも おもって いません。
# ---- 1970〜1994年・研究所（1kg 3〜5万円→100分の1は会社の説明。見つけた研究員は名前を出さない） ----
- id: ch2_kenkyu
  title: 100分の1の糖
  background: hy_kenkyujo
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 林原社長, emotion: normal}
  - {who: kenkyuin, x: 0.8, emotion: happy}
  cuts:
  - speaker: reimu
    text: 林原は1970年に研究の会社をつくり、1994年には糖のトレハロースの量産を始めます。
    reading: はやしばらわ せんきゅうひゃく ななじゅうねんに けんきゅうの かいしゃお つくり、せんきゅうひゃく きゅうじゅうよねんにわ とうの とれはろーすの りょうさんお はじめます。
  - speaker: kenkyuin
    emotion: happy
    text: 社長！ 1キロ3万円以上した糖が、100分の1の値段です！
  - speaker: zundamon
    emotion: surprised
    text: 100分の1！？
    se: bikkuri
# ---- 2002年5月30日掲載・中国新聞の取材（問いと答えは原文の組み合わせのまま。答えの途中を少し省く） ----
- id: ch2_shuzai
  title: ''
  background: hy_shachoshitsu
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 林原社長, emotion: normal}
  - {who: kisha, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2002年5月、新聞の取材です。
    reading: にせん にねん ごがつ、しんぶんの しゅざいです。
  - speaker: kisha
    emotion: normal
    text: 肝心の研究テーマは、どうやって決めているのでしょうか。
  - speaker: zundamon
    emotion: normal
    text: うちの研究テーマは、すべて私の名前で下に伝えている。
  - speaker: zundamon
    emotion: normal
    text: でないと研究者に結果責任がかかりますからね。
  - speaker: zundamon
    emotion: happy
    text: 結果責任は、社長がかぶればいいんです。
    telops:
    - {text: "林原「結果責任は、社長がかぶればいいんです」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
# ---- 社長室（数字は会社の発表。4.7倍は負債1322億円÷売上281億円。株100%・取締役会・会計監査人は兄の本の要旨＋長瀬産業の開示。弟は舞台に出さない） ----
- id: ch3_shacho
  title: 研究は社長、お金は弟
  background: hy_shachoshitsu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 林原社長, emotion: normal}
  - {who: hisho, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 破綻直前の2010年10月期。会社の発表では本業のもうけは45億円、残ったのは12億円。
    reading: はたん ちょくぜんの にせん じゅうねん じゅうがつき。かいしゃの はっぴょうでわ ほんぎょうの もうけわ よんじゅうご おくえん、のこったのわ じゅうに おくえん。
    telops:
    - {text: "会社発表　45億円 → 12億円", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: 負債は、年商の約4.7倍です。
    reading: ふさいわ、ねんしょうの やく よんてん ななばいです。
  - speaker: reimu
    text: 林原健の本によれば、株は家族で100%。兄弟の意見が合えば、取締役会を開く必要もありません。
    reading: はやしばら けんの ほんに よれば、かぶわ かぞくで ひゃく ぱーせんと。きょうだいの いけんが あえば、とりしまりやくかいお ひらく ひつようも ありません。
  - speaker: reimu
    text: 会計監査人も、置いていませんでした。
    reading: かいけい かんさにんも、おいて いませんでした。
  - speaker: hisho
    emotion: normal
    text: 社長、銀行の借入のご報告ですが……。
  - speaker: zundamon
    emotion: normal
    text: お[金|かね]のことは、専務に任せてある。
  - speaker: hisho
    emotion: thinking
    text: 数字は、ご覧にならないんですか？
  - speaker: zundamon
    emotion: happy
    text: 私は、研究を見る。
    beat: true
  - speaker: reimu
    text: 経理は、弟で専務の林原靖。兄はのちに本で『私は1日3時間しか出社しない』と書いています。
    reading: けいりわ、おとうとで せんむの はやしばら やすし。あにわ のちに ほんで わたしわ いちにち さんじかんしか しゅっしゃ しないと かいて います。
  - speaker: hisho
    emotion: surprised
    text: 社長、もうお帰りですか？
  - speaker: zundamon
    emotion: happy
    text: 研究所に、顔を出してくる。
    beat: true
  - speaker: hisho
    emotion: thinking
    text: もうかってるのに、なんでお[金|かね]が残らないんだろう……。
# ---- 会計監査人（住友信託の勧めと弟の反対は兄の本の要旨。弟の言い分を必ず並べる。秘書は名前の無いモブ） ----
- id: ch4_kansa
  title: 会計監査人は置かない
  background: hy_shachoshitsu
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 林原社長, emotion: normal}
  - {who: hisho, x: 0.8, emotion: normal}
  cuts:
  - speaker: hisho
    emotion: normal
    text: 社長、住友信託さんから[会計監査人|カイケイカンサニン]を置いてはと勧められました。
  - speaker: zundamon
    emotion: normal
    text: 専務に聞いてみよう。
  - speaker: reimu
    text: 兄の本によれば、弟は反対しました。『社長がしたいことができなくなるよ』
    reading: あにの ほんに よれば、おとうとわ はんたい しました。しゃちょうが したい ことが できなく なるよ。
  - speaker: reimu
    text: 弟のほうは、兄の本には事実と違う所があると話しています。
    reading: おとうとの ほうわ、あにの ほんにわ じじつと ちがう ところが あると はなして います。
  - speaker: hisho
    emotion: thinking
    text: では、誰が外から数字を見るんですか？
  - speaker: zundamon
    emotion: thinking
    text: ……誰だろう。
    se: manuke
# ---- 今の部屋（身近な値段：年収500万円の家に2350万円は台帳の例え。4.7倍は台帳の計算） ----
- id: heya1
  title: ''
  background: hy_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 45億円もうけて、残ったのは12億円なのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 家計に直すと、年収500万円の家に借金が2350万円あるようなものよ。
  - speaker: zundamon
    emotion: surprised
    text: 家が1軒、建っちゃう！
  - speaker: tsumugi
    emotion: normal
    text: しかも数字を見るのは身内だけ。外から止める[人|ひと]がいないの。
  - speaker: tsumugi
    emotion: thinking
    text: 本業でもうけても、なぜお[金|かね]が残らなかったのか。
  - speaker: tsumugi
    emotion: normal
    text: 手がかりは、駅前の広い土地と恐竜よ。
  - speaker: zundamon
    emotion: surprised
    text: 恐竜！？
# ---- 駅前の土地（7割を不動産・3割を研究は東洋経済。博物館の予定は2002年の本人の話。388億円は東京地裁の調査委員の報告） ----
- id: ch5_ekimae
  title: 駅前の土地と恐竜
  background: hy_ekimae
  bgm: pop
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 林原社長, emotion: happy}
  - {who: shain, x: 0.8, emotion: surprised}
  cuts:
  - speaker: reimu
    text: もうけの7割は不動産へ、3割は研究へ。林原は、水あめの利益で土地を買い集めました。
    reading: もうけの ななわりわ ふどうさんえ、さんわりわ けんきゅうえ。はやしばらわ、みずあめの りえきで とちお かいあつめました。
  - speaker: shain
    emotion: surprised
    text: 社長、駅前にこんな広い土地が！
  - speaker: zundamon
    emotion: happy
    text: 土地から入るお[金|かね]で、10年かかる研究を支えるんだ。
  - speaker: shain
    emotion: happy
    text: 土地があれば、銀行も貸してくれますしね。
  - speaker: zundamon
    emotion: happy
    text: そう。研究のお[金|かね]は、それで回る。
  - speaker: shain
    emotion: normal
    text: この土地には、何を建てるんです？
  - speaker: zundamon
    emotion: happy
    text: 博物館だ。恐竜の骨を並べたい。
  - speaker: shain
    emotion: thinking
    text: 恐竜は、どこから？
  - speaker: zundamon
    emotion: happy
    text: ゴビ砂漠から、掘ってくる。
  - speaker: reimu
    text: のちに裁判所が選んだ調査委員は、12年で本業の外に388億円が出たと書きます。うち不動産が293億円。
    reading: のちに さいばんしょが えらんだ ちょうさいいんわ、じゅうにねんで ほんぎょうの そとに さんびゃく はちじゅうはち おくえんが でたと かきます。うち ふどうさんが にひゃく きゅうじゅうさん おくえん。
# ---- 1993年〜・ゴビ砂漠（骨の形の前に人を立たせない。千円は2002年の本人の言葉。実在の化石は描かない） ----
- id: ch5_gobi
  title: ''
  background: hy_gobi
  stage:
  - {who: hakkutsu, x: 0.15, flip: true, emotion: happy}
  - {who: kenkyuin, x: 0.85, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1993年から、林原はモンゴルのゴビ砂漠で恐竜の化石を掘ります。
    reading: せんきゅうひゃく きゅうじゅうさんねんから、はやしばらわ もんごるの ごびさばくで きょうりゅうの かせきお ほります。
  - speaker: hakkutsu
    emotion: happy
