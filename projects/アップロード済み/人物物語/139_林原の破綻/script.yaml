  - speaker: shinjin
    emotion: surprised
    text: 全員が、ですか。
  - speaker: shain
    emotion: normal
    text: 2月には長瀬産業の100%子会社になる。社名は、林原のままだ。
  - speaker: reimu
    text: 2012年3月、更生手続きが終わります。グループ4社の約1400億円の債務に、返す原資は約1300億円。
    reading: にせん じゅうにねん さんがつ、こうせい てつづきが おわります。ぐるーぷ よんしゃの やく せん よんひゃく おくえんの さいむに、かえす げんしわ やく せん さんびゃく おくえん。
