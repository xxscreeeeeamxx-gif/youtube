meta:
  title: 「結果責任は、社長がかぶればいい」トレハロースの林原の社長、銀行ごとに違う決算書で破綻【ずんだもん解説】
  slug: hayashibara
  hook_line: 本業は黒字と発表していた林原は、なぜ銀行ごとに違う決算書を見せたのか。
  summary: 2011年2月2日、トレハロースで知られる岡山の林原。債権者会議の休憩のあと、会社更生法へ移ることが告げられます。社長の林原健は「すべての責任が私にある」と頭を下げました。本業は黒字と発表していた研究の会社は、銀行には約30年、本当と違う決算書を見せていました。研究は社長、お金は弟。2つの銀行が数字を見せ合った日に、何が見えたのか。兄の本、弟の講演、調査委員会の報告を主語を分けて並べ、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 長瀬産業「更生会社株式会社林原等の更生計画認可決定の確定、株式取得（完全子会社化）に関するお知らせ」（2012年1月31日） https://www.nagase.co.jp/assetfiles/tekijikaiji/20120131-2.pdf
  - 長瀬産業「株式会社林原の更生手続終結に関するお知らせ」（2012年3月26日） https://www.nagase.co.jp/assetfiles/tekijikaiji/20120326.pdf
  - 長瀬産業・林原「株式会社林原 社名変更のお知らせ【2024年4月1日より】」（2023年8月10日） https://www.nagase.co.jp/assetfiles/uploads/20230810_GCD_01.pdf
  - 東洋経済オンライン「林原のはがれたメッキ、ウソの上塗り３０年」（2011年2月10日） https://toyokeizai.net/articles/-/5848
  - 日本経済新聞「『資金流出、前社長ら主導』 林原不正経理で調査委」（2011年8月14日） https://www.nikkei.com/article/DGXNNSE2INK01_T10C11A8000000/
  - 日本経済新聞「林原元社長ら書類送検 不正に融資枠増額させた疑い」（2012年12月10日） https://www.nikkei.com/article/DGXNASDG1002E_Q2A211C1CC0000/
