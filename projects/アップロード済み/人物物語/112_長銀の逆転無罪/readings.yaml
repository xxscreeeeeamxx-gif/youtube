# chogin-onogi 読み台帳（人名・社名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 大野木克信 / label: 上田清司・村田吉隆・滝実・中野清・宮澤喜一・鈴木恒男）・テロップ・章タイトルは
# 表示専用なのでタグを付けていない。滝実・中野清・上田清司は名札だけに出て、読ませていない。
# 大野木は VOICEVOX でオオノキと読まれないよう、タグの読みをカタカナで書いた（[大野木|オオノギ]）。
# 2026-11-02 見直し: どの書き方でも区切りが割れるので、セリフでは名前を避けた（委員長の「大野木参考人。」だけ会議録どおり残す）。
# 原判決 はタグなしだとハラハンケツになるので [原判決|ゲンハンケツ] にした。前会長・通達等 はタグを外したほうが1語で読むので外した。
# 18行・14行・17行 はひらがなのタグだと「は」が助詞になるので、カタカナで書いた。八〇％ はタグなしで正しく読む（ひらがなのタグはワチ…と崩れた）。
# 杉浦 は dictionary.yaml に スギウラ があるのでタグを付けていない。
# 日本長期信用銀行 はナレだけに出る（にっぽん と読ませた）。日本リース は読みを確かめられなかったので、
# セリフとナレでは「系列のリース会社」と言い、名前は章タイトルにだけ出した。
# 1株（ひとかぶ）・1行・18行・14行・17行・前会長・等々・通達等・並べて・一審・第１審 は
# 文脈で読みが変わるので、本文の該当箇所にタグを付けた（一審・第１審・1株は台帳にも入れた）。
# 人名
- {surface: 大野木克信, reading: おおのぎかつのぶ}   # ナレと名札だけに出る
- {surface: 大野木, reading: おおのぎ}
- {surface: 杉浦, reading: すぎうら}
- {surface: 村田, reading: むらた}
- {surface: 古田, reading: ふるた}
- {surface: 宮澤, reading: みやざわ}
- {surface: 鈴木恒男, reading: すずきつねお}
