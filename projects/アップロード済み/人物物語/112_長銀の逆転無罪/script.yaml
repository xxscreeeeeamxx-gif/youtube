# ---- 本当の注意点 ----
- id: chui
  title: 預金はどこまで守られる？
  background: cg_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: zundamon
    emotion: happy
    text: ボクの3円、銀行に預ければ全部守られるのだ！
  - speaker: tsumugi
    emotion: normal
    text: いまの預金保険は、1つの銀行ごとに1人あたり元本1000万円とその利息まで。
    telops:
    - {text: "1人1000万円＋利息まで", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 利息のつかない普通預金のような決済用の預金は、全額守られるわ。
  - speaker: zundamon
    emotion: happy
    text: 3円なら、余裕なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: ……守る以前の額ね。
    se: manuke
  - speaker: tsumugi
    emotion: normal
    text: 気をつけたいのは、預金に見えて預金保険の外にある商品よ。
  - speaker: tsumugi
    emotion: normal
    text: '[長銀|ちょうぎん]がお[金|かね]を集めた[金融債|きんゆうさい]は、はじめは預金保険の対象外だったの。'
  - speaker: tsumugi
    emotion: normal
    text: その後の改正で対象に入ったけど、いまも一部や外貨預金は外れてるわ。
  - speaker: zundamon
    emotion: surprised
    text: 銀行の窓口で買っても、守られないものがあるのか！
  - speaker: tsumugi
    emotion: normal
    text: 買う前に、預金保険の対象かどうかを確かめてね。
  - speaker: tsumugi
    emotion: thinking
    text: それと配当が出ている銀行の株でも、0円になったことがあるの。
  - speaker: tsumugi
    emotion: normal
    text: '[長銀|ちょうぎん]は[1株|ひとかぶ]3円を配った4か月後に国有化。株は価値ゼロとされたわ。'
  - speaker: zundamon
    emotion: surprised
    text: ボクの[1株|ひとかぶ]も……！？
  - speaker: tsumugi
    emotion: normal
    text: そういうことがあった、という話よ。買うか売るかは、自分で決めることね。
# ---- 今：3兆円はなぜ国民の負担に ----
- id: ima1
  title: 3兆円はなぜ国民の負担に
  background: cg_heya
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 結局、無罪なのになんで3兆円も国民の負担になったの？
  - speaker: tsumugi
    emotion: normal
    text: 罪に問われたのは、決算書の数え方。国民の負担は、返ってこなかった貸出の穴なの。
  - speaker: tsumugi
    emotion: normal
    text: 国有化のあと、国は[長銀|ちょうぎん]の穴を埋めてから売ったの。金融再生法の決まりよ。
  - speaker: tsumugi
    emotion: normal
    text: 国が[長銀|ちょうぎん]のために動かしたお[金|かね]は、種類の違うものを全部足すと8兆円近く。
  - speaker: tsumugi
    emotion: thinking
    text: そのうち国民の負担と確定したのが、2004年の時点で約3兆2000億円よ。
    telops:
    - {text: "国民負担として確定　約3兆2000億円", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 3兆2000億円……！
  - speaker: tsumugi
    emotion: normal
    text: 買い手は、3年以内に前提が崩れて2割以上値下がりした貸出を国へ戻せたの。
  - speaker: tsumugi
    emotion: normal
    text: '[瑕疵担保|かしたんぽ]という約束よ。'
  - speaker: tsumugi
    emotion: normal
    text: この約束で国が引き取った貸出は、2003年9月末までに8530億円。
  - speaker: tsumugi
    emotion: thinking
    text: デパートのそごうへの債権も、この約束で国へ戻ったわ。
  - speaker: zundamon
    emotion: angry
    text: 外資が10億円で買って、丸もうけなのだ！
  - speaker: tsumugi
    emotion: normal
    text: 2004年の再上場で大きな利益を得た、と国会で批判されたわ。
  - speaker: tsumugi
    emotion: thinking
    text: ただ、その前に国が3兆円を埋めていたの。
