meta:
  title: 「決して長銀が生き延びるためのものではない」と国会で謝った頭取、10年後に逆転無罪【ずんだもん解説】
  slug: chogin-onogi
  hook_line: 2度有罪の長銀の頭取は、なぜ無罪に。無罪なのに、なぜ3兆円が国民の負担に。
  summary: 1998年8月、国会に呼ばれた日本長期信用銀行の頭取、大野木克信。株価50円で出した1株3円の配当を、議員から問いただされます。決算のものさしが変わる途中の1年に、頭取の机には何が届き、銀行の中では何が起きていたのか。国有化、逮捕、2度の有罪、そして10年後の最高裁。判決と補足意見、国会の会議録、各紙の論調を主語つきで並べて、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 最高裁判所第二小法廷 平成20年7月18日判決（平成17年(あ)第1716号） https://www.courts.go.jp/assets/hanrei/hanrei-pdf-36629.pdf
  - 衆議院 金融安定化に関する特別委員会 第143回国会 第5号 会議録（1998年8月31日、参考人 大野木克信） https://kokkai.ndl.go.jp/txt/114304056X00519980831/2
  - 参議院 金融問題及び経済活性化に関する特別委員会 第143回国会 第3号 会議録（1998年9月10日、参考人 大野木克信） https://kokkai.ndl.go.jp/txt/114314057X00319980910/4
  - 衆議院 予算委員会 第159回国会 会議録（2004年2月13日、竹中金融相の答弁） https://kokkai.ndl.go.jp/txt/115905261X00920040213/80
  - 金融再生委員会「ニュー・LTCB・パートナーズの長銀買収に係る買収条件の概要」 https://www.fsa.go.jp/frc/news/n055.pdf
  - SBI新生銀行「公的資金完済のお知らせ」（2025年7月31日） https://corp.sbishinseibank.co.jp/ja/news/news/20250731a.html
  tags:
  - 長銀
