scenes:
# ---- 先出し（1998年8月31日の国会 → 2008年7月18日の最高裁） ----
- id: co_kokkai
  title: ''
  background: cg_kokkai
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大野木克信, emotion: thinking}
  - {who: ueda, x: 0.7, emotion: angry}
  cuts:
  - speaker: reimu
    text: 1998年8月31日、国会。株価50円で配当を出した銀行の頭取が、参考人として呼ばれました。
    reading: せんきゅうひゃく きゅうじゅうはちねん はちがつ さんじゅういちにち、こっかい。かぶか ごじゅうえんで はいとうお だした ぎんこうの とうどりが さんこうにんと して よばれました。
  - speaker: ueda
    emotion: angry
    text: 今でもその考え方は正しいとお思いでしょうか。
  - speaker: zundamon
    emotion: thinking
    text: あの時点でもし配当をやめたといたしますと、
  - speaker: zundamon
    emotion: sad
    text: 恐らくもっとドラスチックなことが起きまして……
  - speaker: reimu
    text: この配当が罪に問われ、頭取は逮捕されます。そして10年後。
    reading: この はいとうが つみに とわれ、とうどりわ たいほ されます。そして じゅうねんご。
- id: co_saikosai
  title: ''
  background: cg_saikosai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大野木克信, emotion: thinking}
  - {who: saibancho, x: 0.7, emotion: normal}
  cuts:
  - speaker: saibancho
    emotion: normal
    text: '[原判決|ゲンハンケツ]及び[第１審|ダイイッシン]判決を破棄する。被告人らはいずれも無罪。'
  - speaker: reimu
    text: この男は、大野木克信。日本長期信用銀行、長銀の頭取でした。
    reading: この おとこわ、おおのぎ かつのぶ。にっぽん ちょうき しんよう ぎんこう、ちょうぎんの とうどりでした。
# ---- 今の部屋（3円の配当） ----
- id: hook
  title: ''
  background: cg_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ 銀行の株の配当、3円届いたのだ！
    se: jaan
  - speaker: tsumugi
    emotion: thinking
    text: ……封筒代のほうが、高そうね。
    beat: true
  - speaker: zundamon
    emotion: happy
    text: 配当を出せる銀行は、つぶれないのだ！
  - speaker: tsumugi
    emotion: normal
    text: '[1株|ひとかぶ]3円の配当を出して、頭取が罪に問われた銀行があるの。'
  - speaker: zundamon
    emotion: surprised
    text: 3円で！？
  - speaker: tsumugi
    emotion: normal
    text: 2度の有罪。でも最高裁で逆転無罪。なのに国民の負担は、3兆円を超えたのよ。
    telops:
    - {text: "無罪なのに 国民の負担3兆円超", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 無罪なのに、なんで3兆円も！？
# ---- 1997年7月31日・頭取あての通達 ----
- id: card1997
  title: ''
  background: cg_card_1997
  bgm: curious
  cuts:
  - speaker: reimu
    text: 1997年7月31日。長銀の頭取室に、大蔵省の銀行局長から通達が届きます。
    reading: せんきゅうひゃく きゅうじゅうななねん しちがつ さんじゅういちにち。ちょうぎんの とうどりしつに、おおくらしょうの ぎんこう きょくちょうから つうたつが とどきます。
- id: ch1_tsutatsu
  title: 頭取あての通達
  background: cg_tochiri
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 大野木克信, emotion: normal}
  - {who: hisho, x: 0.52, emotion: normal}
  - {who: buin, x: 0.8, emotion: normal}
  cuts:
  - speaker: hisho
    emotion: normal
    text: 頭取、大蔵省の銀行局長からです。宛名は、[長銀|ちょうぎん]の代表取締役頭取。
  - speaker: zundamon
    emotion: thinking
    text: 決算の決まりを、変えるのか。
  - speaker: hisho
    emotion: normal
    text: はい。この年度の決算から、だそうです。
  - speaker: zundamon
    emotion: surprised
    text: ……今年度から！？
  - speaker: buin
    emotion: normal
    text: 事業推進部です。変わるのは、系列のノンバンクに貸したお[金|かね]の数え方です。
  - speaker: zundamon
    emotion: thinking
    text: うちの系列のリース会社なんて、取引先が7万社あるぞ。
  - speaker: buin
    emotion: normal
    text: 今までは、うちが支え続けるかぎり回収できないとは数えなくてよかったんです。
  - speaker: buin
    emotion: normal
    text: 子どもへの仕送りを続けている間は、
  - speaker: buin
    emotion: normal
    text: 家計簿に、返ってこないかもと書かなくてよかった。そんな決まりです。
    telops:
    - {text: "古いものさし　仕送り中は焦げ付きと数えない", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: zundamon
    emotion: normal
    text: 親が子を支えるのは、当たり前の世界だからな。
  - speaker: buin
    emotion: thinking
    text: 新しい決まりでは、子どもの懐具合で数えます。
  - speaker: buin
    emotion: thinking
    text: 仕送りしていても、返せない子は返せない子です。
  - speaker: buin
    emotion: thinking
    text: ただ系列のノンバンクにどこまで当てはめるかは、まだはっきりしないんです。
  - speaker: zundamon
    emotion: thinking
    text: 曖昧なのか。
  - speaker: zundamon
    emotion: thinking
    text: ……新しいものさしで正直に数えたら、損はいくらになる。
  - speaker: buin
    emotion: sad
    text: 何千億円の単位です。
    se: gaan
  - speaker: zundamon
    emotion: surprised
    text: な、何千億……！
  - speaker: buin
    emotion: thinking
    text: 利益が飛んで、自己資本の比率も下がります。
  - speaker: zundamon
    emotion: thinking
    text: 市場に危ないと見られたら、お[金|かね]が集まらなくなる。
  - speaker: zundamon
    emotion: sad
    text: ……銀行が、倒れるかもしれん。
  - speaker: reimu
    text: 最高裁ものちに、新しい基準で処理すると銀行経営が危たいにひんする可能性が多分にあった、と書いています。
    reading: さいこうさいも のちに、あたらしい きじゅんで しょり すると ぎんこう けいえいが きたいに ひんする かのうせいが たぶんに あったと かいて います。
  - speaker: zundamon
    emotion: thinking
    text: 配当は、どうなる。
  - speaker: buin
    emotion: thinking
    text: 正直に数えれば、出せないかもしれません。
  - speaker: zundamon
    emotion: angry
    text: 配当をやめたら、それこそ市場が逃げるのだ……。
  - speaker: reimu
    text: このものさしの変わり目の決算で、長銀は1株3円の配当を出します。
    reading: この ものさしの かわりめの けっさんで、ちょうぎんわ ひとかぶ さんえんの はいとうお だします。
  - speaker: reimu
    text: 配当から1年8か月後、国はその株を1株およそ0.4円で売りました。
    reading: はいとうから いちねん はちかげつご、くにわ その かぶお ひとかぶ およそ れいてん よんえんで うりました。
    telops:
    - {text: "1株3円の配当 → 1株0.4円で売却", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: 古いものさしか、新しいものさしか。この数え方が、10年続く裁判で争われます。
    reading: ふるい ものさしか あたらしい ものさしか。この かぞえかたが、じゅうねん つづく さいばんで あらそわれます。
- id: ch1_kokusai
  title: ''
  background: cg_tochiri
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大野木克信, emotion: thinking}
  - {who: hisho, x: 0.7, emotion: sad}
  cuts:
  - speaker: hisho
    emotion: sad
    text: スイスの大銀行との提携も、今月発表したばかりですのに。
  - speaker: zundamon
    emotion: thinking
    text: ……世界と組む前に、足元の数え方か。
  - speaker: hisho
    emotion: normal
    text: 頭取は若いころ、ロンドンにいらしたんですよね。
  - speaker: zundamon
    emotion: normal
    text: ああ。世界の金融は、ずっと先を走っていたよ。
  - speaker: hisho
    emotion: happy
    text: 農学部のご出身で、国際派ですものね。
  - speaker: zundamon
    emotion: sad
    text: その国際派が、いまは帳簿とにらめっこだ。
    beat: true
  - speaker: reimu
    text: 大野木は1959年、東大の農学部から長銀へ。頭取になったのは2年前、58歳のときでした。
    reading: おおのぎわ せんきゅうひゃく ごじゅうくねん、とうだいの のうがくぶから ちょうぎんえ。とうどりに なったのわ にねんまえ ごじゅうはっさいの ときでした。
  - speaker: reimu
    text: 前の頭取が国会の証人喚問に立ち、株主総会を待たずに辞めたあとの、急な就任です。
    reading: まえの とうどりが こっかいの しょうにん かんもんに たち、かぶぬし そうかいお またずに やめた あとの きゅうな しゅうにんです。
  - speaker: reimu
    text: その長銀は、預金ではなく金融債という債券でお金を集める銀行です。これが、のちに効いてきます。
    reading: その ちょうぎんわ よきんでわ なく きんゆうさいと いう さいけんで おかねお あつめる ぎんこうです。これが、のちに きいて きます。
# ---- 1997年6月〜1998年3月・事業推進部 ----
- id: ch2_jigyo
  title: 数度の修正
  background: cg_jigyo
  bgm: kinakusai
  stage:
  - {who: buin, x: 0.28, flip: true, emotion: thinking}
  - {who: gyoin, x: 0.7, emotion: normal}
  cuts:
  - speaker: buin
    emotion: normal
    text: 新しいものさしを、系列向けの貸出にどう当てはめるか。それがうちの部の仕事だ。
  - speaker: buin
    emotion: thinking
    text: 6月末を基準日にした、トライアルの結果が出たぞ。
  - speaker: gyoin
    emotion: surprised
    text: 新しい通達どおりに数えると、[引当|ひきあて]がこんなに要るんですか！
  - speaker: buin
    emotion: thinking
    text: これじゃ、自己資本比率がもたないな。
  - speaker: gyoin
    emotion: thinking
    text: 償却に回せるお[金|かね]にも、限りがありますよ。
  - speaker: buin
    emotion: thinking
    text: 基準の案を、直すしかないか……。
  - speaker: gyoin
    emotion: surprised
    text: 直すって、どっちにです？
  - speaker: buin
    emotion: thinking
    text: ……[引当|ひきあて]が、軽くなるほうにだ。
    beat: true
  - speaker: reimu
    text: 判決によると、事業推進部は自己資本比率の維持を図るなどのため、償却と引当が緩くなる修正を数度加えました。
    reading: はんけつに よると じぎょう すいしんぶわ じこ しほん ひりつの いじお はかるなどの ため、しょうきゃくと ひきあてが ゆるく なる しゅうせいお すうど くわえました。
  - speaker: reimu
    text: 12月末の本番も経て、基準が確定したのは1998年3月30日。決算の締めの、前の日でした。
    reading: じゅうにがつまつの ほんばんも へて、きじゅんが かくてい したのわ せんきゅうひゃく きゅうじゅうはちねん さんがつ さんじゅうにち。けっさんの しめの まえの ひでした。
  - speaker: gyoin
    emotion: thinking
    text: ……数え方ひとつで、何千億円も変わるのか。
  - speaker: buin
    emotion: normal
    text: よその大手も、系列には甘く数えてるはずさ。
  - speaker: gyoin
    emotion: thinking
    text: はず、で決算を組むんですか。
    se: hammer
  - speaker: reimu
    text: この基準で長銀が書いた損失は約2700億円。検察はのちに、本当は約5800億円だったと主張します。
    reading: この きじゅんで ちょうぎんが かいた そんしつわ やく にせん ななひゃくおくえん。けんさつわ のちに、ほんとうわ やく ごせん はっぴゃくおくえんだったと しゅちょう します。
    telops:
    - {text: "検察 約5800億円 ／ 長銀 約2700億円", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: その差、約3100億円の数え方が、罪に問われることになります。
    reading: その さ、やく さんぜん ひゃくおくえんの かぞえかたが つみに とわれる ことに なります。
# ---- 1998年3月・公的資金と常務会 ----
- id: card1998
  title: ''
  background: cg_card_1998
  cuts:
  - speaker: reimu
    text: 1998年3月。長銀は国の審査を通り、公的資金1766億円を受け取ります。
    reading: せんきゅうひゃく きゅうじゅうはちねん さんがつ。ちょうぎんわ くにの しんさお とおり、こうてき しきん せんななひゃく ろくじゅうろくおくえんお うけとります。
- id: ch3_jomukai
  title: 赤字でも1株3円
  background: cg_jomukai
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 大野木克信, emotion: thinking}
  - {who: buin, x: 0.52, emotion: normal}
  - {who: gyoin, x: 0.8, emotion: normal}
  cuts:
  - speaker: buin
    emotion: normal
    text: 3月31日の常務会です。今期の決算の、基本方針をご説明します。
  - speaker: buin
    emotion: thinking
    text: 当期の未処理損失は、約2700億円。赤字です。
    background: cg_jomukai_akaji
  - speaker: zundamon
    emotion: thinking
    text: ……赤字か。
  - speaker: buin
    emotion: normal
    text: ただ、任意積立金を取り崩せば配当は出せます。[1株|ひとかぶ]3円です。
  - speaker: gyoin
    emotion: surprised
    text: 公的資金を入れてもらった年に、配当ですか。
  - speaker: zundamon
    emotion: thinking
    text: やめたら、市場はどう読む。
  - speaker: buin
    emotion: thinking
    text: '[長銀|ちょうぎん]は危ない、と読むでしょう。'
  - speaker: zundamon
    emotion: normal
    text: 安定配当は、続けよう。市場の信認だけは、失えないのだ。
  - speaker: gyoin
    emotion: thinking
    text: 国からはお[金|かね]を入れてもらって、株主には配る。……世間の目は厳しいですよ。
    se: tsukkomi
  - speaker: reimu
    text: 国の審査を通った銀行は7か月後に国のものになり、3兆円を超える国民の負担が生まれます。
    reading: くにの しんさお とおった ぎんこうわ ななかげつごに くにの ものに なり、さんちょうえんお こえる こくみんの ふたんが うまれます。
# ---- 1998年4月7日・25億円の記事 ----
- id: ch4_okura
  title: 25億円の記事
  background: cg_kokkai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大野木克信, emotion: normal}
  - {who: iincho, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 4月7日。大野木は衆議院の大蔵委員会に、参考人として呼ばれます。
    reading: しがつ なのか。おおのぎわ しゅうぎいんの おおくら いいんかいに、さんこうにんと して よばれます。
  - speaker: iincho
    emotion: normal
    text: '[大野木参考人|オーノギサンコーニン]。'
  - speaker: zundamon
    emotion: normal
    text: 杉浦前会長に25億円の退職金を払ったという記事が出ましたけれども、
  - speaker: zundamon
    emotion: angry
    text: あれは全く本当のことではございません。
  - speaker: reimu
    text: 杉浦は、長銀の拡大路線を進めたとされる元会長です。実際の額は8月の国会で、9億7000万円と答えます。
    reading: すぎうらわ、ちょうぎんの かくだい ろせんお すすめたと される もと かいちょうです。じっさいの がくわ はちがつの こっかいで きゅうおく ななせんまんえんと こたえます。
  - speaker: reimu
    text: 同じ日、日本の銀行の金融技術を問われると、大野木はこう答えました。
    reading: おなじ ひ、にほんの ぎんこうの きんゆう ぎじゅつお とわれると おおのぎわ こう こたえました。
  - speaker: zundamon
    emotion: thinking
    text: 少なくとも[長銀|ちょうぎん]に関しましてはかなりおくれていると思っています。
# ---- 1998年4月28日〜6月・決算の承認と株価 ----
- id: ch5_kabuka
  title: 200円が50円に
  background: cg_tochiri
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大野木克信, emotion: thinking}
  - {who: hisho, x: 0.7, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 4月28日、取締役会が決算案を承認します。3月期の決算を、長銀はホームページでこう説明しました。
    reading: しがつ にじゅうはちにち、とりしまりやくかいが けっさんあんお しょうにん します。さんがつきの けっさんお、ちょうぎんわ ほーむぺーじで こう せつめい しました。
  - speaker: reimu
    text: 決算上必要な損失処理は、峠を越えたものと考えています。
    reading: けっさんじょう ひつような そんしつ しょりわ、とうげお こえた ものと かんがえて います。
  - speaker: hisho
    emotion: surprised
    text: 頭取！ 6月に入って、株価がまた下がっています！
    background: cg_shoken
  - speaker: zundamon
    emotion: surprised
    text: 月の初めは、200円台だったはずだ。
  - speaker: hisho
    emotion: thinking
    text: 17日から、出来高がいつもの数倍です。うわさが飛び交っていて……。
  - speaker: zundamon
    emotion: thinking
    text: どんなうわさだ。
  - speaker: hisho
    emotion: thinking
    text: 月刊誌の記事をきっかけに、[長銀|ちょうぎん]は危ないと。
  - speaker: zundamon
    emotion: thinking
    text: うちは預金より、市場からお[金|かね]を集める銀行だ。
  - speaker: zundamon
    emotion: sad
    text: 危ないと思われたら、お[金|かね]が回らなくなる……。
  - speaker: hisho
    emotion: sad
    text: 50円を、割りそうです。
    se: gaan
  - speaker: reimu
    text: 6月の初めに200円台だった株価は、月末には50円。4分の1です。
    reading: ろくがつの はじめに にひゃくえんだいだった かぶかわ、げつまつにわ ごじゅうえん。よんぶんの いちです。
  - speaker: reimu
    text: 長銀が国のものになるまで、あと4か月です。
    reading: ちょうぎんが くにの ものに なるまで、あと よんかげつです。
