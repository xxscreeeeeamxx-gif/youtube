# ---- 1998年9月・日本リースの破綻と退任 ----
- id: ch11_tainin
  title: 日本リースの破綻と退任
  background: cg_tochiri
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大野木克信, emotion: thinking}
  - {who: hisho, x: 0.7, emotion: surprised}
  cuts:
  - speaker: hisho
    emotion: surprised
    text: 頭取！ 系列のリース会社が、会社更生法を申請しました！
  - speaker: zundamon
    emotion: surprised
    text: 取引先が、7万社もある会社だぞ……！
  - speaker: reimu
    text: 9月27日。国会では、戦後最大の破綻と言われた倒産です。
    reading: くがつ にじゅうななにち。こっかいでわ、せんご さいだいの はたんと いわれた とうさんです。
  - speaker: reimu
    text: 翌日の9月28日。大野木は、頭取を退きます。62歳でした。
    reading: よくじつの くがつ にじゅうはちにち。おおのぎわ、とうどりお しりぞきます。ろくじゅうにさいでした。
  - speaker: hisho
    emotion: sad
    text: 後任は、[鈴木恒男|すずきつねお]さんです。
  - speaker: zundamon
    emotion: thinking
    text: ……この部屋の書類も、片付けないとな。
  - speaker: hisho
    emotion: sad
    text: 頭取……。
  - speaker: zundamon
    emotion: sad
    text: もう、頭取じゃないのだ。
    se: namida
# ---- 1998年10月23日・国有化 ----
- id: ch12_kokuyuka
  title: 国有化の第1号
  background: cg_honten
  bgm: serious
  stage:
  - {who: gyoin, x: 0.56, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1998年10月23日。長銀は、預金などの払い戻しを止めるおそれがある、と国に申し出ました。
    reading: せんきゅうひゃく きゅうじゅうはちねん じゅうがつ にじゅうさんにち。ちょうぎんわ よきんなどの はらいもどしお とめる おそれが あると くにに もうしでました。
  - speaker: gyoin
    emotion: sad
    text: ……うちが、国のものになるのか。
    background: cg_honten_yoru
  - speaker: reimu
    text: 金融再生法による一時国有化。その第1号でした。
    reading: きんゆう さいせいほうに よる いちじ こくゆうか。その だいいちごうでした。
  - speaker: gyoin
    emotion: thinking
    text: 前の頭取が辞めて、まだ1か月もたってないのに。
- id: ch12_suzuki
  title: ''
  background: cg_kaiken
  stage:
  - {who: suzuki, x: 0.56, emotion: sad}
  cuts:
  - speaker: reimu
    text: 国有化のときの頭取は、後を継いだ鈴木恒男。会見で、こう口にしました。
    reading: こくゆうかの ときの とうどりわ、あとお ついだ すずき つねお。かいけんで こう くちに しました。
  - speaker: suzuki
    emotion: sad
    text: 急激な環境の変化……。
- id: ch12_shosai
  title: ''
  background: cg_shosai
  stage:
  - {who: zundamon, x: 0.4, flip: true, tag: 大野木克信, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: ……[長銀|ちょうぎん]の株が、ゼロか。
  - speaker: reimu
    text: 長銀の普通株は、価値ゼロとされました。3月に国の資金で引き受けた優先株1300億円分も、対価0円です。
    reading: ちょうぎんの ふつうかぶわ、かち ぜろと されました。さんがつに くにの しきんで ひきうけた ゆうせんかぶ せんさんびゃくおくえんぶんも たいか ぜろえんです。
  - speaker: zundamon
    emotion: sad
    text: '[1株|ひとかぶ]3円を配った株が……。'
    beat: true
  - speaker: reimu
    text: ここから国は、長銀の穴を埋めるために、兆の単位のお金を入れていきます。
    reading: ここから くにわ ちょうぎんの あなお うめる ために、ちょうの たんいの おかねお いれて いきます。
# ---- 1999年・告訴と逮捕 ----
- id: card1999
  title: ''
  background: cg_card_1999
  bgm: 223am
  cuts:
  - speaker: reimu
    text: 1999年5月、捜査が進むなかで、元副頭取ら2人が亡くなりました。
    reading: せんきゅうひゃく きゅうじゅうくねん ごがつ、そうさが すすむ なかで もと ふくとうどりら ふたりが なくなりました。
  - speaker: reimu
    text: 6月4日。国有化された長銀の新しい経営陣が、内部調査委員会の報告をもとに旧経営陣を告訴します。
    reading: ろくがつ よっか。こくゆうか された ちょうぎんの あたらしい けいえいじんが、ないぶ ちょうさ いいんかいの ほうこくお もとに きゅう けいえいじんお こくそ します。
- id: ch13_kokuso
  title: 自分の銀行に訴えられる
  background: cg_shosai
  stage:
  - {who: zundamon, x: 0.4, flip: true, tag: 大野木克信, emotion: sad}
  cuts:
  - speaker: zundamon
    emotion: sad
    text: ……自分がいた銀行に、訴えられるのか。
    beat: true
  - speaker: reimu
    text: 6月10日、東京地検特捜部が、大野木と元副頭取2人を逮捕します。大野木は63歳でした。
    reading: ろくがつ とおか、とうきょう ちけん とくそうぶが おおのぎと もと ふくとうどり ふたりお たいほ します。おおのぎわ ろくじゅうさんさいでした。
  - speaker: reimu
    text: 罪に問われたのは、有価証券報告書の虚偽記載と、違法配当です。
    reading: つみに とわれたのわ、ゆうか しょうけん ほうこくしょの きょぎ きさいと いほう はいとうです。
- id: ch14_kohan
  title: 私は無罪です
  background: cg_houtei
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.4, flip: true, tag: 大野木克信, emotion: normal}
  cuts:
  - speaker: reimu
    text: 11月19日。東京地裁で、初公判が開かれます。
    reading: じゅういちがつ じゅうくにち。とうきょう ちさいで、しょこうはんが ひらかれます。
  - speaker: zundamon
    emotion: normal
    text: 私は、無罪です。
  - speaker: reimu
    text: 弁護側は、当時の決まりと慣行どおりの決算だった、と主張しました。
    reading: べんごがわわ、とうじの きまりと かんこう どおりの けっさんだったと しゅちょう しました。
# ---- 2000年3月1日・10億円の銀行 ----
- id: card2000
  title: ''
  background: cg_card_2000
  cuts:
  - speaker: reimu
    text: 2000年3月1日。国は長銀の普通株、およそ24億株を10億円で売りました。
    reading: にせんねん さんがつ ついたち。くにわ ちょうぎんの ふつうかぶ、およそ にじゅうよんおくかぶお じゅうおくえんで うりました。
- id: ch13_baikyaku
  title: 10億円の銀行
  background: cg_honten
  stage:
  - {who: gyoin, x: 0.28, flip: true, emotion: sad}
  - {who: kisha, x: 0.7, emotion: surprised}
  cuts:
  - speaker: kisha
    emotion: surprised
    text: 10億円！？ 銀行が、10億円で買えるんですか！
  - speaker: gyoin
    emotion: thinking
    text: 買ったのは、アメリカの投資会社が中心のグループです。
  - speaker: kisha
    emotion: thinking
    text: '[1株|ひとかぶ]あたりだと、いくらです？'
  - speaker: gyoin
    emotion: sad
    text: ……0.4円ほどです。
    beat: true
  - speaker: reimu
    text: 1株3円の配当を出した株は、1年8か月で1株およそ0.4円になりました。
    reading: ひとかぶ さんえんの はいとうお だした かぶわ、いちねん はちかげつで ひとかぶ およそ れいてん よんえんに なりました。
  - speaker: gyoin
    emotion: sad
    text: 6月からは、新生銀行になるそうです。[長銀|ちょうぎん]の名前は、消えるんです。
# ---- 2002年・一審 → 2005年・二審 ----
- id: card2002
  title: ''
  background: cg_card_2002
  bgm: serious
  cuts:
  - speaker: reimu
    text: 2002年9月。東京地裁は3人とも有罪とします。大野木は懲役3年、執行猶予4年でした。
    reading: にせん にねん くがつ。とうきょう ちさいわ さんにんとも ゆうざいと します。おおのぎわ ちょうえき さんねん しっこう ゆうよ よねんでした。
- id: ch14_nishin
  title: 2度の有罪
  background: cg_houtei
  stage:
  - {who: kisha, x: 0.28, flip: true, emotion: surprised}
  - {who: bengonin, x: 0.7, emotion: thinking}
  cuts:
  - speaker: kisha
    emotion: surprised
    text: '[一審|いっしん]は有罪！ 3人とも、執行猶予つきです！'
  - speaker: reimu
    text: 2005年6月。二審の東京高裁も、控訴を退けます。
    reading: にせん ごねん ろくがつ。にしんの とうきょう こうさいも、こうそお しりぞけます。
  - speaker: reimu
    text: 二審は、新しい基準に基本的に従うことが、唯一の公正な会計の慣行だ、としました。
    reading: にしんわ あたらしい きじゅんに きほんてきに したがう ことが、ゆいいつの こうせいな かいけいの かんこうだと しました。
  - speaker: reimu
    text: 一審と二審は、3人が数千億円にも上る未処理損失があることを認識しながら決算を承認した、と認めました。
    reading: いっしんと にしんわ さんにんが すうせんおくえんにも のぼる みしょり そんしつが ある ことお にんしき しながら けっさんお しょうにん したと みとめました。
  - speaker: kisha
    emotion: thinking
    text: 2度の有罪……。上告ですか。
  - speaker: bengonin
    emotion: normal
    text: 上告します。当時の決まりと慣行に従った決算です。
# ---- 2008年7月18日・最高裁 ----
- id: card2008
  title: ''
  background: cg_card_2008
  cuts:
  - speaker: reimu
    text: 2008年7月18日。最高裁判所、第二小法廷。大野木は72歳になっていました。
    reading: にせん はちねん しちがつ じゅうはちにち。さいこう さいばんしょ だいに しょうほうてい。おおのぎわ ななじゅうにさいに なって いました。
- id: ch15_saikosai
  title: 逆転無罪
  background: cg_saikosai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大野木克信, emotion: thinking}
  - {who: saibancho, x: 0.7, emotion: normal}
  cuts:
  - speaker: saibancho
    emotion: normal
    text: '[原判決|ゲンハンケツ]及び[第１審|ダイイッシン]判決を破棄する。'
    se: don
  - speaker: saibancho
    emotion: normal
    text: 被告人らはいずれも無罪。
    telops:
    - {text: "最高裁「被告人らはいずれも無罪」", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: saibancho
    emotion: normal
    text: 特に関連ノンバンク等に対する貸出金についての資産査定に関しては、
  - speaker: saibancho
    emotion: normal
    text: 新たな基準として直ちに適用するには、明確性に乏しかったと認められる[上|うえ]、
  - speaker: saibancho
    emotion: normal
    text: 過渡的な状況にあったといえ、
  - speaker: saibancho
    emotion: normal
    text: 資産査定通達等の示す方向性から逸脱するものであったとしても、
  - speaker: saibancho
    emotion: normal
    text: 直ちに違法であったということはできない。
  - speaker: reimu
    text: 大手18行のうち14行が、長銀と同じく系列への将来の支援の分を引当てていませんでした。
    reading: おおて じゅうはちこうの うち じゅうよんこうが、ちょうぎんと おなじく けいれつえの しょうらいの しえんの ぶんお ひきあてて いませんでした。
  - speaker: saibancho
    emotion: normal
    text: 裁判官全員一致の意見で、主文のとおり判決する。
  - speaker: reimu
    text: 逮捕から9年1か月。国会で頭を下げた日から、ほぼ10年でした。
    reading: たいほから くねん いっかげつ。こっかいで あたまお さげた ひから、ほぼ じゅうねんでした。
  - speaker: reimu
    text: 同じ日、民事の裁判でも、旧経営陣の責任は認められずに終わります。
    reading: おなじ ひ、みんじの さいばんでも きゅう けいえいじんの せきにんわ みとめられずに おわります。
# ---- 論争：補足意見と社説 ----
- id: ronso0
  title: 同じ判決の補足意見
  background: cg_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 逆転無罪！ やっぱり、粉飾なんてなかったのだ！
  - speaker: tsumugi
    emotion: normal
    text: 同じ判決に、[古田|ふるた]裁判官の補足意見が付いてるの。
  - speaker: tsumugi
    emotion: thinking
    text: '[長銀|ちょうぎん]の本件決算は、その抱える不良債権の実態と大きくかい離していたものと推認される。'
    telops:
    - {text: "古田裁判官「不良債権の実態と大きくかい離していたものと推認される」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 直ちに違法とはいえないと前置きして、こう続けるの。
  - speaker: tsumugi
    emotion: thinking
    text: 企業会計の開示制度の観点から見れば、
  - speaker: tsumugi
    emotion: thinking
    text: 大きな問題があったものであることは明らかと思われる。
  - speaker: zundamon
    emotion: surprised
    text: 無罪なのに、大きな問題！？
    se: bikkuri
  - speaker: tsumugi
    emotion: normal
    text: 違法かどうかと実態を正しく見せていたかは、別の話なの。
  - speaker: tsumugi
    emotion: normal
    text: 判決のあと、新聞の社説も割れたわ。
  - speaker: tsumugi
    emotion: normal
    text: 読売は、経営責任まで免責されたわけではないと書いたの。
  - speaker: tsumugi
    emotion: normal
    text: 毎日は、銀行の甘い自己管理を許してきた行政と、
  - speaker: tsumugi
    emotion: normal
    text: 行政任せにしてきた政治の責任こそ、最も問われるべきだって。
  - speaker: zundamon
    emotion: surprised
    text: 行政と政治！？
  - speaker: tsumugi
    emotion: thinking
    text: 産経は、不透明な裁量行政が経営者個人の責任に転嫁される弊害を、
  - speaker: tsumugi
    emotion: thinking
    text: 行政当局は重く受け止めるべきだと書いたわ。
  - speaker: tsumugi
    emotion: thinking
    text: 朝日は、刑事も民事も経営者が責任を問われなかったのは、
  - speaker: tsumugi
    emotion: thinking
    text: ツケを負担した国民としてなんとも釈然としないって。
  - speaker: zundamon
    emotion: thinking
    text: 4紙とも、言ってることがバラバラなのだ……。
    beat: true
- id: ronso1
  title: 無罪なら問題なし？
  background: cg_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、ネットで見たのだ！ 無罪なんだから、[長銀|ちょうぎん]は悪くなかったって！
  - speaker: tsumugi
    emotion: normal
    text: 最高裁が言ったのは当時の決まりでは直ちに違法とはいえない、ということなの。
  - speaker: tsumugi
    emotion: normal
    text: 新しい基準は系列ノンバンクについては明確性に乏しくて、過渡的な状況だったって。
  - speaker: tsumugi
    emotion: normal
    text: 大手[18行|ジュウハッコウ]のうち[14行|ジュウヨンコウ]が、[長銀|ちょうぎん]と同じく将来の支援の分を[引当て|ひきあて]てなかったの。
  - speaker: tsumugi
    emotion: normal
    text: '[長銀|ちょうぎん]ともう[1行|いっこう]を除く大手[17行|ジュウナナコウ]にも、合わせて1兆円以上の[引当|ひきあて]不足が指摘されてたわ。'
  - speaker: zundamon
    emotion: happy
    text: みんな同じなら、セーフなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: セーフかアウトかの線が、まだはっきり引かれてなかったのよ。
    se: hammer
  - speaker: tsumugi
    emotion: thinking
    text: 判決によると[長銀|ちょうぎん]ともう[1行|いっこう]は、自分の査定と国の検査のずれが特に大きかったの。
  - speaker: tsumugi
    emotion: normal
    text: 国有化のあとに数え直すと、1999年3月末で債務超過は約2兆8000億円。
  - speaker: zundamon
    emotion: surprised
    text: 債務超過ではございません、だったのに！？
  - speaker: tsumugi
    emotion: normal
    text: 破綻直前の検査で純資産はプラス1600億円だった、という質問も国会で出てるの。
  - speaker: tsumugi
    emotion: thinking
    text: ものさしと時点が変わると、穴の大きさが兆の単位で変わる。
  - speaker: tsumugi
    emotion: normal
    text: だから頭取がうそをついた、とも言い切れないの。
  - speaker: zundamon
    emotion: thinking
    text: 罪にはならなかった。でも裁判官の一人は、帳簿と実態のずれを指摘した……。
  - speaker: tsumugi
    emotion: normal
    text: そう。そこまでが、[並べて|ならべて]言えることね。
- id: ronso2
  title: 国策捜査だった？
  background: cg_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: じゃあ、国策捜査のスケープゴートだったのだ！
  - speaker: tsumugi
    emotion: normal
    text: そういう見方はあるわ。経済誌には、国策捜査の走りともされたと書かれたの。
  - speaker: tsumugi
    emotion: normal
    text: 国会では時効の壁で破綻時の頭取らだけが立件されている、という声も出たの。
  - speaker: tsumugi
    emotion: thinking
    text: 拡大路線を進めたとされる元会長の杉浦は、刑事では立件されていないわ。
  - speaker: zundamon
    emotion: angry
    text: やっぱり、狙い撃ちなのだ！
  - speaker: tsumugi
    emotion: normal
    text: でも訴えたのは、国有化されたあとの[長銀|ちょうぎん]自身なの。
    se: zukko
  - speaker: tsumugi
    emotion: normal
    text: 野党の議員の会も、検察に告発状を出してたわ。
  - speaker: tsumugi
    emotion: normal
    text: '[一審|いっしん]と二審の裁判官は、2度とも有罪にしてるの。'
  - speaker: tsumugi
    emotion: thinking
    text: 与党の議員も国会で、責任をとった姿を見たことがないと銀行を[責め|せめ]てたわね。
  - speaker: zundamon
    emotion: thinking
    text: 狙われたのか、そうじゃないのか……。
  - speaker: tsumugi
    emotion: normal
    text: 狙い撃ちだったという見方がある。一方で、訴えたのは[長銀|ちょうぎん]自身。
  - speaker: tsumugi
    emotion: normal
    text: 裁判所も、2度は有罪とした。並べると、そうなるわ。
- id: ronso3
  title: うわさにつぶされた？
  background: cg_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
