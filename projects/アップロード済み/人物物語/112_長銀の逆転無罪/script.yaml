- id: ima2
  title: 長銀だった銀行の今
  background: cg_heya
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: '[長銀|ちょうぎん]だった銀行は、いまどうなってるの？'
  - speaker: tsumugi
    emotion: normal
    text: 2000年に新生銀行と名前を変えて、2023年にSBI新生銀行になったわ。
    background: cg_gendai
  - speaker: tsumugi
    emotion: normal
    text: そして2025年7月31日。残っていた公的資金、約2300億円が返されたの。
  - speaker: zundamon
    emotion: surprised
    text: 国有化から27年近くで、やっと返し終わったのだ！
  - speaker: tsumugi
    emotion: normal
    text: 12月には、東証にもう一度上場したわ。
  - speaker: zundamon
    emotion: thinking
    text: 名前は変わっても、銀行は続いてたのか……。
