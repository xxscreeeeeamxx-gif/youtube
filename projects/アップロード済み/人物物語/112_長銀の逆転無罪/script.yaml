  - speaker: zundamon
    emotion: sad
    text: ただいま[村田|むらた]先生からのお話、
  - speaker: zundamon
    emotion: sad
    text: 一つ一つが私の心の中に鋭く突き刺さると申しますか、
  - speaker: murata
    emotion: thinking
