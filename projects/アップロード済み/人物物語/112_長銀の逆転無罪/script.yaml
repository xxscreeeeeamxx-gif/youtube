  - speaker: reimu
    text: 議案は可決。配られた約71億円の配当が、のちに違法配当の罪に問われます。
    reading: ぎあんわ かけつ。くばられた やく ななじゅういちおくえんの はいとうが、のちに いほう はいとうの つみに とわれます。
  - speaker: reimu
    text: 翌日の26日、住友信託との合併構想が発表されました。
    reading: よくじつの にじゅうろくにち、すみとも しんたくとの がっぺい こうそうが はっぴょう されました。
