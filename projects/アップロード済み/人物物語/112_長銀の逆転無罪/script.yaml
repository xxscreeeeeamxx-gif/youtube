  - speaker: reimu
    text: 宮澤蔵相も国会で、日銀の考査でも監督庁長官も債務超過と考える理由はないと言っている、と答えました。
    reading: みやざわ ぞうしょうも こっかいで、にちぎんの こうさでも かんとくちょう ちょうかんも さいむ ちょうかと かんがえる りゆうわ ないと いって いると こたえました。
