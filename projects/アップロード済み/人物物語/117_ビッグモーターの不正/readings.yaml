# bigmotor-fusei 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 兼重宏行 / label: 和泉伸二 ほか）・テロップ・章タイトルは表示専用なのでタグを付けていない。
#
# 2026-11-08 VOICEVOX の audio_query で確かめたこと（台本を書いた担当）:
# - 自賠責 はタグなしだと シバイセキ。ひらがなのタグ [自賠責|じばいせき] は ジバ/イセキ に割れたので、
#   カタカナのタグ [自賠責|ジバイセキ] にした（ジバイセキホケン と1語で読む）。
# - 酒々井 は [酒々井|しすい] で シスイ（酒々井BP＝シスイビイピイ、酒々井から＝シスイカラ）。
# - 天地神明・冒瀆・愕然・蟠り は、タグ付きで テンチシンメイ・ボオトク・ガクゼン・ワダカマリ と読む。
# - WECARS は [WECARS|ウィーカーズ] で ウィイカアズ、BALM は [BALM|バーム] で バアム。
# - 忖度・歪 はタグ付きで ソンタク・イビツ。盲従 はタグなしで モオジュウ と読む。
# - 損保（損保ジャパン を含む）・板金・板金塗装部門単独・伊藤忠商事・老舗・常態化・捻出・叱責・歩合給 は
#   タグなしで ソンポ・バンキン・バンキントソオブモンタンドクデ・イトオチュウショオジ・シニセ・ジョオタイカ・
#   ネンシュツ・シッセキ・ブアイキュウ と正しく読むので、台帳に入れていない
#   （入れるとセリフの全出現にタグが要る）。chui の「自分の[損保|そんぽ]に」はタグ付きでも ソンポニ。
# - 本文で直したもの（台帳には入れない）:
#   ・何とか＝ナニトカ → [何|なん]とか
#   ・確かめる人が＝ジンガ → [人|ひと]が
#   ・紹介した分＝ワケ → 「紹介すれば」に言い換え
#   ・4万件＝ヨンマンゲン、年に＝トシニ → 「年間[4万件|ヨンマンケン]」（ネンカンヨンマン/ケン）
#   ・前と後＝ゼントゴ → 「前とあと」（マエト/アト）
# - 何が（報告書には何が）は ナニガ、何度も・何枚も・何百台・何年か・何ら は ナン で正しい。
# - 2026-11-08 見直しの直し（任意8）: ハナテン はタグなし・カタカナのタグだと ハナ/テン に割れるので、
#   [ハナテン|はなてん] にした（ハナテンワ・ハナテンニモ と1語で読む）。
# - 見直しの直す12: 「聞いてはいたの」が キイテ/ハイタノ（履いた）になるので「LINEは、届いていたの」に替えた。
# - 見直しの直す13: 「毎週上から」が マイシュウジョオカラ になるので「毎週、上から」にした。
