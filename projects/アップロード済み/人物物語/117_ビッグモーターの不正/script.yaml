    - {text: "34か所を処分　12か所で指定取り消し", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: front
    emotion: sad
    text: 事業停止、か……。
  - speaker: kojocho
    emotion: sad
    text: 修理も車検も、しばらく受けられないな。
  - speaker: kojocho
    emotion: thinking
    text: 11月30日には、保険代理店の登録も取り消しだそうだ。
  - speaker: front
    emotion: surprised
    text: 下請けの業者さんの保険も、149件のうち121件が圧力による加入だったって……。
  - speaker: reimu
    text: 街路樹の件は、器物損壊の刑事事件になりました。副社長だった宏一は書類送検されましたが、不起訴。
    reading: がいろじゅの けんわ、きぶつ そんかいの けいじ じけんに なりました。ふくしゃちょうだった こういちわ しょるい そうけん されましたが、ふきそ。
  - speaker: reimu
    text: 創業者は送検の対象外です。本社で環境整備を担当した元社員は、罰金30万円の判決を受け控訴しました。
    reading: そうぎょうしゃわ そうけんの たいしょうがいです。ほんしゃで かんきょう せいびお たんとう した もと しゃいんわ、ばっきん さんじゅうまんえんの はんけつお うけ こうそ しました。
# ---- 2024年・事業を手放す ----
- id: ch8_tebanasu
  title: 事業を手放す
  background: bm_tenpo_kara
  bgm: 223am
  stage:
  - {who: kyaku, x: 0.7, emotion: thinking}
  cuts:
  - speaker: kyaku
    emotion: thinking
    text: このお店、これからどうなるのかしら……。
  - speaker: reimu
    text: 2024年5月1日。店と社員は、伊藤忠商事などが出資する新しい会社、WECARSに引き継がれます。
    reading: にせん にじゅうよねん ごがつ ついたち。みせと しゃいんわ、いとうちゅう しょうじなどが しゅっし する あたらしい かいしゃ うぃーかーずに ひきつがれます。
    background: bm_tenpo_new
  - speaker: kyaku
    emotion: surprised
