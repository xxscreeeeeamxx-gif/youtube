scenes:
# ---- 先出し（2023年7月25日・会見。日経の時刻つき速報の順：11:15ごろ「冒瀆ですよ」→ 12:38ごろ「天地神明に」） ----
- id: co_kaiken
  title: ''
  background: bm_kaiken
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 兼重宏行, emotion: sad}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2023年7月、東京。中古車販売の大手、ビッグモーターの創業者、兼重宏行の会見です。
    reading: にせん にじゅうさんねん しちがつ とうきょう。ちゅうこしゃ はんばいの おおて びっぐもーたーの そうぎょうしゃ、かねしげ ひろゆきの かいけんです。
  - speaker: reimu
    text: 報告書が認めた、ゴルフボールで車を叩く手口について。
    reading: ほうこくしょが みとめた ごるふぼーるで くるまお たたく てぐちに ついて。
  - speaker: zundamon
    emotion: angry
    text: ゴルフを愛する人に対する[冒瀆|ぼうとく]ですよ
  - speaker: reimu
    text: 1時間あまりのち。記者は、こう問いました。
    reading: いちじかん あまり のち。きしゃわ こう といました。
  - speaker: kisha
    emotion: normal
    text: 板金部門以外も、不正を認識していたとの疑惑があります。
  - speaker: kisha
    emotion: normal
    text: 社長は現場とLINEでつながっていたのに、本当に不正を認識していなかったんですか。
  - speaker: zundamon
    emotion: sad
    text: '[天地神明|てんちしんめい]に誓って、知りませんでした'
  - speaker: reimu
    text: この翌日、創業者は社長を辞めました。会社はこのあと9か月余りで、事業ごと別の会社に渡ります。
    reading: この よくじつ、そうぎょうしゃわ しゃちょうお やめました。かいしゃわ この あと きゅうかげつ あまりで、じぎょうごと べつの かいしゃに わたります。
# ---- 今の部屋（バンパーの修理の見積書） ----
- id: hook
  title: ''
  background: bm_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ バンパーの修理、見積もり5万円。保険で払えばタダなのだ！
    se: jaan
  - speaker: tsumugi
    emotion: thinking
    text: 保険を使ったら、来年から保険料が上がるわよ。
  - speaker: tsumugi
    emotion: normal
    text: それに、その見積もりは本当に正しい？
  - speaker: zundamon
    emotion: surprised
    text: え……？
  - speaker: tsumugi
    emotion: thinking
    text: 社長が知らなかったと言った不正が、全国の工場で起きていた会社があるの。
    telops:
    - {text: "「知りませんでした」　なぜ全国の工場で？", size: md, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 社長が知らないのに、なんで全国で同じことが起きるの！？
# ---- 2005年・全て直営店だ ----
- id: card2005
  title: ''
  background: bm_card_2005
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 2005年5月。中古車のビッグモーターは、店を41にまで増やしていました。
    reading: にせん ごねん ごがつ。ちゅうこしゃの びっぐもーたーわ、みせお よんじゅういちにまで ふやして いました。
- id: ch1_chokuei
  title: 41店、全て直営
  background: bm_jimusho
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 兼重宏行, emotion: happy}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: kisha
    emotion: normal
    text: グループ各社を含めて、いまは41店。その特徴は。
  - speaker: zundamon
    emotion: happy
    text: 当社の場合は全て直営店だ。
  - speaker: kisha
    emotion: normal
    text: 大阪の老舗、[ハナテン|はなてん]にも資本を入れましたね。
  - speaker: zundamon
    emotion: normal
    text: '[ハナテン|はなてん]は中古車業界の老舗で、関西圏では強いブランド力を持っている。'
  - speaker: reimu
    text: 拠点の長には、粗利益の目標を意識させる。創業者は、そう語っていました。
    reading: きょてんの ちょうにわ あらりえきの もくひょうお いしき させる。そうぎょうしゃわ そう かたって いました。
- id: ch1_iwakuni
  title: ''
  background: bm_seibi_old
  cuts:
  - speaker: reimu
    text: 1970年代に岩国の整備工場から始めた会社は、2023年には約300店・社員約6000人になります。
    reading: せんきゅうひゃく ななじゅうねんだいに いわくにの せいび こうじょうから はじめた かいしゃわ、にせん にじゅうさんねんにわ やく さんびゃくてん しゃいん やく ろくせんにんに なります。
# ---- 2020〜2022年・工場長会議の「アット」 ----
- id: card2020
  title: ''
  background: bm_card_2020
  bgm: serious
  cuts:
  - speaker: reimu
    text: 2020年。板金と塗装の工場は、2014年には14か所。2021年には29か所になります。
    reading: にせん にじゅうねん。ばんきんと とそうの こうじょうわ、にせん じゅうよねんにわ じゅうよんかしょ。にせん にじゅういちねんにわ にじゅうきゅうかしょに なります。
- id: ch2_at
  title: 1台14万円の目標
  background: bm_kaigi
  stage:
  - {who: honbu, x: 0.28, flip: true, emotion: normal}
  - {who: kojocho, x: 0.7, emotion: thinking}
  cuts:
  - speaker: honbu
    emotion: normal
    text: 今週のアットだ。修理1台あたりの工賃と部品のもうけ、全部の工場の分。
  - speaker: honbu
    emotion: normal
    text: 目標は1台14万円前後。届いていない工場は、説明してもらう。
    telops:
    - {text: "アット＝修理1台のもうけ　目標14万円", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: kojocho
    emotion: thinking
    text: 事故の修理代は、来た車の傷の具合で決まりますので……。
  - speaker: honbu
    emotion: angry
    text: "[月末|げつまつ]までに、どうやって数字を達成するんだ。"
    se: don
  - speaker: kojocho
    emotion: sad
    text: お客さんに事故を起こしてくれと言えるものではない……。
  - speaker: kojocho
    emotion: thinking
    text: バンパー1枚の修理にも、1台14万円ですか。
  - speaker: honbu
    emotion: normal
    text: 平均で14万だ。
  - speaker: reimu
    text: 報告書は、この目標に社長が直接かかわっていたとは認めていません。では、誰のための数字だったのか。
    reading: ほうこくしょわ、この もくひょうに しゃちょうが ちょくせつ かかわって いたとわ みとめて いません。でわ だれの ための すうじだったのか。
# ---- 2021年度・事故車を回す損保 ----
- id: ch2_sonpo
  title: 事故車を回す損保
  background: bm_sonpo
  bgm: kinakusai
  stage:
  - {who: sonpo1, x: 0.28, flip: true, emotion: normal}
  - {who: sonpo2, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 同じころ、大手損保の損保ジャパン。事故にあった客に、修理工場を紹介する仕組みがありました。
    reading: おなじ ころ、おおて そんぽの そんぽ じゃぱん。じこに あった きゃくに しゅうり こうじょうお しょうかい する しくみが ありました。
  - speaker: sonpo2
    emotion: thinking
    text: ビッグモーターへの紹介目標は、担当の部で今年度1,902台です。
  - speaker: sonpo2
    emotion: thinking
    text: でも、修理の質の低い工場もあります。
  - speaker: sonpo2
    emotion: thinking
    text: 去年は出向している社員から、こんな報告も。
  - speaker: sonpo2
    emotion: thinking
    text: 工場長たちは叱責を恐れて、[何|なん]とか売上げを捻出しようとしている。
  - speaker: sonpo2
    emotion: sad
    text: それが不正につながりかねない、と。
  - speaker: sonpo1
    emotion: normal
    text: 紹介の台数は、必ず達成してくれ。
  - speaker: sonpo1
    emotion: normal
    text: 紹介すれば、向こうは店でうちの保険を売ってくれる。
  - speaker: sonpo1
    emotion: angry
    text: 紹介が少なければ、担当の損保をよそに替えられるぞ。
  - speaker: sonpo2
    emotion: sad
    text: ……紹介を優先するしか、ないんですね。
  - speaker: reimu
    text: 2022年度、この会社が代理店として扱った保険料は約200億円。その6割が、損保ジャパンの分でした。
    reading: にせん にじゅうにねんど、この かいしゃが だいりてんと して あつかった ほけんりょうわ やく にひゃくおくえん。その ろくわりが そんぽ じゃぱんの ぶんでした。
    telops:
    - {text: "保険料 約200億円　6割が損保ジャパン", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: reimu
    text: 会見で知らなかったと言った社長のもとには、その1年半前、工場の作業員からLINEが届いていました。
    reading: かいけんで しらなかったと いった しゃちょうの もとにわ、その いちねんはん まえ こうじょうの さぎょういんから らいんが とどいて いました。
# ---- 2020〜2022年・写真で見積もる部屋 ----
- id: ch3_pt
  title: 写真で見積もる部屋
  background: bm_pt
  bgm: curious
  stage:
  - {who: pt, x: 0.5, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2020年8月、写真だけで見積もるチームができます。
    reading: にせん にじゅうねん はちがつ、しゃしん だけで みつもる ちーむが できます。
  - speaker: pt
    emotion: normal
    text: 全国の工場の見積もりが、この福岡の事務所に集まる。
  - speaker: pt
    emotion: normal
    text: 工場から写真とチェックシートが届く。これで見積もって、損保と修理代を決める。
  - speaker: pt
    emotion: thinking
    text: 車は見ない。見るのは、送られてきた写真だけ。
  - speaker: pt
    emotion: sad
    text: 年間[4万件|ヨンマンケン]を超えるのに、こっちは多いときでも20人ほど。
  - speaker: pt
    emotion: sad
    text: 今日も、帰りは夜中の0時過ぎか……。
    se: shobon
  - speaker: pt
    emotion: sad
    text: 本部からも、強く言われてるしな。
  - speaker: pt
    emotion: thinking
    text: 写真に写った傷が、そのまま修理代になる。
- id: ch3_kojo
  title: ''
  background: bm_kojo
  stage:
  - {who: kojocho, x: 0.28, flip: true, emotion: normal}
  - {who: front, x: 0.7, emotion: normal}
  cuts:
  - speaker: kojocho
    emotion: normal
    text: その写真じゃ、傷が小さく見えるな。
  - speaker: kojocho
    emotion: normal
    text: 傷のないところにも、矢印の付箋を貼って撮ってくれ。
  - speaker: front
    emotion: thinking
    text: ……はい。
    background: bm_kojo_fusen
  - speaker: kojocho
    emotion: normal
    text: ヘッドライトのカバーも、割れてるほうがいいな。
  - speaker: kojocho
    emotion: normal
    text: こっちの車は、タワーで引いたことにしておけ。
  - speaker: front
    emotion: thinking
    text: 引くほどの曲がりじゃ、ないですけど……。
  - speaker: front
    emotion: sad
    text: これ、お客さんの車ですよね……。
  - speaker: reimu
    text: 報告書は、ゴルフボールを靴下に入れて振り回し、車体を叩いて雹の痕を広げた例も認めています。
    reading: ほうこくしょわ、ごるふぼーるお くつしたに いれて ふりまわし しゃたいお たたいて ひょうの あとお ひろげた れいも みとめて います。
- id: ch3_room
  title: ''
  background: bm_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: sad}
  - {who: tsumugi, x: 0.8, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: sad
    text: それ、お客さんの車なのだ……。
  - speaker: zundamon
    emotion: thinking
    text: 社長が知らなかったなら、誰がこんなことをさせてたの？
  - speaker: tsumugi
    emotion: thinking
    text: アンケートで、板金の経験者382人のうち104人が不正な作業に関わったと答えたの。
  - speaker: zundamon
    emotion: surprised
    text: 4人に1人以上！？
    se: bikkuri
  - speaker: tsumugi
    emotion: normal
    text: 理由でいちばん多いのは、上司からの指示。自分の歩合給を上げるため、は8人よ。
  - speaker: zundamon
    emotion: thinking
    text: タワーで引いたことにする、っていうのは？
  - speaker: tsumugi
    emotion: normal
    text: タワーは、曲がった車の骨組みを鎖で引っぱって直す大きな機械。
  - speaker: tsumugi
    emotion: thinking
    text: 引いたことにすれば、その作業の代金も請求できるの。
  - speaker: tsumugi
    emotion: thinking
    text: 報告書は、社長の指示は認めていないの。でも、工場長たちを追い込むものがあった。
  - speaker: tsumugi
    emotion: thinking
    text: 降格よ。
# ---- 降格の掲示と、点検の前の大掃除 ----
- id: ch3_kokaku
  title: 降格と大掃除
  background: bm_kojo
  bgm: serious
  stage:
  - {who: kojocho, x: 0.28, flip: true, emotion: normal}
  - {who: front, x: 0.7, emotion: surprised}
  cuts:
  - speaker: front
    emotion: surprised
    text: 工場長、社内のサイトに降格の掲示が……。
  - speaker: kojocho
    emotion: sad
    text: 工場長から、フロントへか。理由は、書いてないな。
  - speaker: kojocho
    emotion: sad
    text: 弁明の機会も、なしか。
  - speaker: front
    emotion: sad
    text: 今年だけで、工場長が延べ20人もフロントに……。
  - speaker: reimu
    text: 降格は、次の社長と目されていた副社長らの判断。副社長は、創業者の長男の兼重宏一です。
    reading: こうかくわ、つぎの しゃちょうと もくされて いた ふくしゃちょうらの はんだん。ふくしゃちょうわ そうぎょうしゃの ちょうなんの かねしげ こういちです。
  - speaker: front
    emotion: normal
    text: 来週は、環境整備の点検です。修理より、掃除が先ですね。
  - speaker: kojocho
    emotion: thinking
    text: 隅から隅まで、きれいにしておけ。
  - speaker: reimu
    text: 経営陣の説明では、降格の多くは点検の成績が理由。のちに創業者は、降格と抜てきを社員教育と呼びます。
    reading: けいえいじんの せつめいでわ、こうかくの おおくわ てんけんの せいせきが りゆう。のちに そうぎょうしゃわ、こうかくと ばってきお しゃいん きょういくと よびます。
# ---- 月曜日の本社 ----
- id: ch3_honsha
  title: 取締役会のない会社
  background: bm_yakuin
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 兼重宏行, emotion: normal}
  - {who: honbu, x: 0.7, emotion: normal}
  cuts:
  - speaker: honbu
    emotion: normal
    text: 社長、月曜のご報告に参りました。
  - speaker: honbu
    emotion: normal
    text: 板金の部門は、売上ではグループ全体の2〜3%ほどです。
  - speaker: reimu
    text: 月曜日に役員が三々五々、社長に報告に来る会社。取締役会は、7年近くほとんど開かれていませんでした。
