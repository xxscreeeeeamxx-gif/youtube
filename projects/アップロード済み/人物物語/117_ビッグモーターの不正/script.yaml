  - speaker: honbu
    emotion: happy
    text: それと、今年の経営計画書も刷り上がりました。
  - speaker: honbu
    emotion: normal
    text: 全社員に配る冊子の、最初の言葉です。
  - speaker: honbu
    emotion: normal
    text: 大方針は義を明らかにして、利を計らず。
