    reading: もとの かいしゃわ なまえお ばーむに かえて ほしょうと へんさいお うけもち、じゅうにがつに みんじ さいせいほうの てきようお しんせい しました。
# ---- 論争 ----
- id: ronso1
  title: 社長の指示はあったか
  background: bm_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ 社長の指示で、会社ぐるみで保険金をだまし取ったって！
  - speaker: tsumugi
    emotion: normal
    text: そう見える事実はあるの。
  - speaker: tsumugi
    emotion: normal
    text: 金融庁は、広い範囲の工場で組織的に繰り返されていたと書いてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 1台14万円の目標に、続く降格。開かれない取締役会に、調べられなかった告発。
  - speaker: zundamon
    emotion: angry
    text: ほら、やっぱりなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: でも特別調査委員会は、経営陣の指示で組織的にやった事実までは認められないとしたの。
  - speaker: tsumugi
    emotion: normal
    text: 目標の数字にも社長は直接かかわっていない、と。
  - speaker: tsumugi
    emotion: normal
    text: 保険金の水増しで刑事責任を問われた人は、調べた範囲では見つからなかったわ。
  - speaker: zundamon
    emotion: surprised
    text: じゃあ、社長は関係ないの！？
  - speaker: tsumugi
    emotion: thinking
    text: そうとも言えないの。
    se: hammer
  - speaker: tsumugi
    emotion: thinking
    text: 経営陣の意向によるものと考えても何ら不思議ではない、とも書いてる。
  - speaker: tsumugi
    emotion: normal
    text: 報告書が名付けたのは経営陣に盲従し、[忖度|そんたく]する[歪|いびつ]な企業風土よ。
  - speaker: zundamon
    emotion: thinking
    text: 指示がなくても、全国の工場で同じことが起きる会社だったのか……。
    beat: true
- id: ronso2
  title: 損保は何をしたのか
  background: bm_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: 損保ジャパンもグルだったんでしょ？ 出向した社員が、手口を教えたって！
  - speaker: tsumugi
    emotion: normal
    text: 損保ジャパンからは、2004年から43人が出向していたわ。
  - speaker: tsumugi
    emotion: normal
    text: でも社外調査委員会は、出向者が不正に関わった事実は認められないとしたの。
  - speaker: zundamon
    emotion: surprised
    text: 認められなかったのだ！？
  - speaker: tsumugi
    emotion: thinking
    text: 認定されたのは別のこと。不正の疑いを知りながら、取引を優先したことよ。
  - speaker: zundamon
    emotion: thinking
    text: なんで、疑いを知りながら事故車を回したの？
  - speaker: tsumugi
    emotion: thinking
    text: 紹介の見返りの保険と、担当をよその損保に替えられる心配。報告書はそう書いてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 2023年9月、損保ジャパンの社長は辞任を表明したわ。
  - speaker: tsumugi
    emotion: normal
    text: 昨年の7月に入庫紹介を再開するという、
  - speaker: tsumugi
    emotion: normal
    text: 大きな経営判断ミスをしたことに責任を感じている、って。
  - speaker: tsumugi
    emotion: normal
    text: 翌年1月には、金融庁が業務改善命令を出したの。
  - speaker: zundamon
    emotion: thinking
    text: 不正の請求はしてないけど、疑いを知りながら紹介を再開したのか……。
# ---- 本当の注意点 ----
- id: chui
  title: 修理の前と後の写真
  background: bm_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 事故の修理は損保に紹介された工場でも、修理の前とあとの写真を見せてと頼めるわ。
  - speaker: tsumugi
    emotion: normal
    text: 国のガイドラインが、作業の説明と前後の画像を残すことを求めてるの。
  - speaker: zundamon
    emotion: surprised
    text: 写真を見せてって、言っていいの？
  - speaker: tsumugi
    emotion: happy
    text: いいの。傷がどこに、どれだけあったか確かめてね。
  - speaker: tsumugi
    emotion: normal
    text: それと、保険を使う前に比べること。修理代と、等級が下がって上がる保険料よ。
  - speaker: zundamon
    emotion: sad
    text: ボクのバンパー、5万円……。
    se: shobon
  - speaker: tsumugi
    emotion: thinking
    text: 保険を使うと、次の年から何年か保険料が上がるの。そのほうが高くつくこともあるわ。
  - speaker: tsumugi
    emotion: normal
    text: それから2018年1月から2023年8月に、この会社で事故の修理をした人。
  - speaker: tsumugi
    emotion: normal
    text: 補償の対象になるか、自分の[損保|そんぽ]に聞いてみてね。
  - speaker: tsumugi
    emotion: normal
    text: 車を買う店で保険を勧められても、ほかと比べて決めていいのよ。
