meta:
  title: 「天地神明に誓って、知りませんでした」と言ったビッグモーター創業者、会社は人手に渡った【ずんだもん解説】
  slug: bigmotor-fusei
  hook_line: 創業者が「知りませんでした」と言った不正は、なぜ全国の工場で起きたのか。
  summary: 2023年7月、中古車販売の大手ビッグモーターの創業者・兼重宏行は、会見で「天地神明に誓って、知りませんでした」と語りました。板金の工場に回っていた「1台14万円」の目標。事故車を紹介する損保と、店で売られる保険。写真だけで見積もる部屋。そして1年半前、工場の作業員から社長に届いたLINE。不正はなぜ全国の工場で同じ形で起きたのか。特別調査委員会と損保側の報告書、会見の言葉をもとに、それぞれの言い分を並べて再現ドラマでたどります。（2026年11月時点）
  sources:
  - 株式会社ビッグモーター 特別調査委員会「調査報告書」（2023年6月26日・同社が7月18日に公表／ウェブアーカイブ） https://web.archive.org/web/20230720200919/https://www.bigmotor.co.jp/pdf/research-report.pdf
  - SOMPOホールディングス 自動車保険金不正請求に関する社外調査委員会「調査報告書」（2024年1月16日） https://www.sompo-hd.com/-/media/hd/files/news/2024/20240116_1.pdf
  - 国土交通省「ビッグモーターに対する行政処分等及び同種事案の再発防止について」（2024年3月29日） https://www.mlit.go.jp/report/press/jidosha09_hh_000318.html
  - 金融庁「株式会社ビッグモーター、株式会社ビーエムホールディングス及び株式会社ビーエムハナテンに対する行政処分について」（2023年11月24日） https://www.fsa.go.jp/news/r5/hoken/20231124.html
  - 日本経済新聞「ビッグモーター会見 兼重社長「天地神明に誓って知りませんでした」」（2023年7月25日） https://www.nikkei.com/article/DGXZQOUC250KJ0V20C23A7000000/
  - 株式会社BALM「民事再生手続開始の申立てに関するお知らせ」（2024年12月2日） https://balm-info.jp/assets/pdf/document_241202.pdf
