scenes:
- id: hook
  title: ''
  background: kk_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、カニパーティーだ！ 今日は、カニ食べ放題だぞ。
  - speaker: tsumugi
    emotion: thinking
    text: ……それ、カニカマよね。
  - speaker: zundamon
    emotion: happy
    text: カニカマは実質カニ。殻のいらない、進化したカニだ。
  - speaker: tsumugi
    emotion: angry
    text: 進化の向きが、おかしいのよ。
  - speaker: zundamon
    emotion: normal
    text: 本物っぽく食べるため、ほぐして酢の物にした。
  - speaker: tsumugi
    emotion: thinking
    text: 手間をかけるほど、カニから遠ざかってない？
  - speaker: zundamon
    emotion: happy
    text: カニカマは、カニを目指して生まれた、努力のかたまりだぞ。
  - speaker: tsumugi
    emotion: normal
    text: 残念。最初に作ろうとしてたのは、カニじゃないの。
  - speaker: zundamon
    emotion: surprised
    text: えっ。
  - speaker: tsumugi
    emotion: normal
    text: クラゲよ。
  - speaker: zundamon
    emotion: surprised
    text: クラゲ！？ カニカマの親は、クラゲなのだ！？
  - speaker: zundamon
    emotion: thinking
    text: クラゲからカニって、進化の向きがおかしいのだ！
  - speaker: tsumugi
    emotion: happy
    text: でしょ。しかも、そのクラゲは大失敗。
    se: oti
  - speaker: reimu
    text: カニカマ。すり身をカニの脚の身に似せたかまぼこです。
    reading: かにかま。すりみお かにの あしの みに にせた かまぼこです。
  - speaker: reimu
    text: 最初に売り出したのは1972年、石川県七尾市にある、かまぼこ会社とされます。
    reading: さいしょに うりだしたのわ せんきゅうひゃく ななじゅうにねん、いしかわけん ななおしに ある かまぼこ がいしゃと されます。
  - speaker: zundamon
    emotion: surprised
    text: クラゲの失敗から、カニになったのだ？
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、能登のちくわ屋よ。
- id: ch0_nanao
  title: ''
  background: kk_nanao
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 七尾の杉野家は、江戸時代から魚の問屋と網の漁を営んできたとされます。
    reading: ななおの すぎのけわ えど じだいから さかなの とんやと あみの りょうお いとなんできたと されます。
  - speaker: reimu
    text: 1907年には、初代の杉野作太郎がちくわを作り始めたとされます。
    reading: せんきゅうひゃく ななねんにわ しょだいの すぎの さくたろうが ちくわお つくりはじめたと されます。
  - speaker: reimu
    text: すり身を竹の串に巻いて、炭火で焼く手作りでした。
    reading: すりみお たけの くしに まいて すみびで やく てづくりでした。
  - speaker: reimu
    text: 1923年には気仙沼から職人を招き、サメの身でちくわを作り始めます。
    reading: せんきゅうひゃく にじゅうさんねんにわ けせんぬまから しょくにんお まねき、さめの みで ちくわお つくりはじめます。
  - speaker: reimu
    text: 1949年には、倉庫を冷蔵庫に作り変えます。
    reading: せんきゅうひゃく よんじゅうくねんにわ そうこお れいぞうこに つくりかえます。
- id: card1952
  title: ''
  background: kk_card_1952
  cuts:
  - speaker: reimu
    text: 1952年。スギヨの焼きちくわが、ビタミンちくわに生まれ変わります。
    reading: せんきゅうひゃく ごじゅうにねん。すぎよの やきちくわが びたみん ちくわに うまれかわります。
- id: ch1_chikuwa
  title: 能登のちくわ屋
  background: kk_chikuwa
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 杉野芳人, emotion: happy}
  - {who: shokunin, x: 0.52, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: shokunin
    emotion: normal
    text: 若旦那。長野から、また注文が来てますよ。
  - speaker: zundamon
    emotion: happy
    text: 海のない長野で、うちのちくわが売れてる！
  - speaker: tsumugi
    emotion: normal
    text: サメの肝油のビタミンを売りにして、戦後の栄養不足の中で大ヒットしたの。
  - speaker: tsumugi
    emotion: normal
    text: ビタミンちくわは今も、売り上げの約7割が長野県なの。
  - speaker: zundamon
    emotion: normal
    text: 今日のちくわは、少し塩が強い。手帳に書いておくのだ。
  - speaker: shokunin
    emotion: happy
    text: 若旦那は、食べた物を[何|なん]でも書き留めますね。
  - speaker: shokunin
    emotion: happy
    text: それに、いつも新しい物ばかり考えてる。
  - speaker: zundamon
    emotion: happy
    text: 同じ物だけ作ってたら、つまらない。
  - speaker: reimu
    text: 芳人は、列車が出る間際でも食堂に寄るほどの食通だったと伝えられています。
    reading: よしとわ、れっしゃが でる まぎわでも しょくどうに よる ほどの しょくつうだったと つたえられています。
  - speaker: reimu
    text: 1959年には、人工のカラスミも作り始めます。
    reading: せんきゅうひゃく ごじゅうくねんにわ じんこうの からすみも つくりはじめます。
- id: ch1_surimi
  title: ''
  background: kk_zukai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 同じころ、北海道で、カニカマの土台になる発明が生まれたの。
  - speaker: zundamon
    emotion: thinking
    text: 土台？
  - speaker: tsumugi
    emotion: normal
    text: 冷凍すり身よ。北海道の水産試験場のチームが、1960年ごろに作ったの。
  - speaker: tsumugi
    emotion: normal
    text: そのまま凍らせると、スポンジみたいになって、弾力が出なくなるそうよ。
  - speaker: zundamon
    emotion: surprised
    text: 冷凍できないのだ？
  - speaker: tsumugi
    emotion: normal
    text: そこで、身を水でよく洗って、砂糖と[リン酸塩|りんさんえん]を混ぜてから凍らせた。
  - speaker: zundamon
    emotion: happy
    text: 砂糖で、身を守るのか！
  - speaker: tsumugi
    emotion: normal
    text: これで、スケトウダラのすり身を、一年中いつでも使えるようになったの。
  - speaker: tsumugi
    emotion: normal
    text: 北海道の研究機関は、インスタントラーメンに並ぶ発明だと紹介してるわ。
  - speaker: zundamon
    emotion: surprised
    text: ラーメンと、同じくらい！
  - speaker: tsumugi
    emotion: normal
    text: 冷凍すり身は、1960年には250トン。
  - speaker: tsumugi
    emotion: normal
    text: 1976年には、45万トンまで増えたの。
  - speaker: tsumugi
    emotion: normal
    text: 1972年、スケトウダラの漁獲は日本だけで304万トン。
  - speaker: zundamon
    emotion: happy
    text: カニカマが生まれた年なのだ！
- id: ch2_irai
  title: クラゲを作れ
  background: kk_jimusho
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 杉野芳人, emotion: normal}
  - {who: chinmi, x: 0.52, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1960年代の終わり、スギヨに、珍味の業者から相談が持ち込まれます。
    reading: せんきゅうひゃく ろくじゅうねんだいの おわり すぎよに、ちんみの ぎょうしゃから そうだんが もちこまれます。
  - speaker: chinmi
    emotion: thinking
    text: 杉野さん。中華料理のクラゲが、入ってこないんです。
  - speaker: chinmi
    emotion: sad
    text: 前菜の、クラゲの和え物が出せないって、料理屋さんが困ってまして。
  - speaker: zundamon
    emotion: thinking
    text: クラゲが、入ってこない？
  - speaker: tsumugi
    emotion: normal
    text: 中国の文化大革命と、日中の関係の悪化で、クラゲの輸入が途絶えたの。
  - speaker: chinmi
    emotion: normal
    text: お宅は、人工のカラスミを作りましたよね。
  - speaker: chinmi
    emotion: happy
    text: なら、人工のクラゲも、作れませんか。
  - speaker: zundamon
    emotion: surprised
    text: クラゲを、作る……。
  - speaker: zundamon
    emotion: thinking
    text: クラゲって、そもそも[何|なに]でできてるのだ？
  - speaker: tsumugi
    emotion: normal
    text: ほとんどが水よ。
  - speaker: zundamon
    emotion: surprised
    text: 水を、コリコリにするのか……。
  - speaker: tsumugi
    emotion: thinking
    text: ちくわ屋さんに、クラゲを作れって。無茶な注文ね。
  - speaker: zundamon
    emotion: happy
    text: ……面白そうなのだ。やってみるのだ！
- id: card1970
  title: ''
  background: kk_card_1970
  cuts:
  - speaker: reimu
    text: 1970年。スギヨの研究室で、人工クラゲの開発が始まります。
    reading: せんきゅうひゃく ななじゅうねん。すぎよの けんきゅうしつで じんこう くらげの かいはつが はじまります。
- id: ch3_team
  title: 人工クラゲ
  background: kk_kenkyu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 杉野芳人, emotion: normal}
  - {who: kiyota, x: 0.56, emotion: normal}
  - {who: kenkyu, x: 0.78, emotion: normal}
  cuts:
  - speaker: reimu
    text: 開発の中心は、専務だった杉野芳人。ほかに、かまぼこ職人と研究者、それに最年少の開発主任という4人でした。
    reading: かいはつの ちゅうしんわ せんむだった すぎの よしと。ほかに かまぼこ しょくにんと けんきゅうしゃ、それに さいねんしょうの かいはつ しゅにんと いう よにんでした。
  - speaker: zundamon
    emotion: normal
    text: クラゲを作るなんて、誰もやったことがないのだ。
  - speaker: kenkyu
    emotion: happy
    text: だから、面白いんです。
  - speaker: zundamon
    emotion: normal
    text: クラゲは、コリコリした歯ごたえが命だ。
  - speaker: kenkyu
    emotion: normal
    text: 海藻から取るアルギン酸ナトリウムを、カルシウムの液に落とします。
  - speaker: kiyota
    emotion: surprised
    text: 固まりました。透き[通って|とおって]、プルプルです。
  - speaker: reimu
    text: 研究には、水産試験場の研究者も力を貸しました。
    reading: けんきゅうにわ すいさん しけんじょうの けんきゅうしゃも ちからお かしました。
- id: ch3_shikumi
  title: ''
  background: kk_zukai2
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: アルギン酸は、昆布のぬめりのもとになる成分よ。
  - speaker: tsumugi
    emotion: normal
    text: カルシウムに触れると、つながって、ゼリーみたいに固まるの。
  - speaker: zundamon
    emotion: happy
    text: 人工イクラと、同じ仕組みだ！
  - speaker: tsumugi
    emotion: normal
    text: そう。スギヨは、それに卵白も合わせて、クラゲの食感を目指したの。
- id: ch3_shippai
  title: ''
  background: kk_kenkyu
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 杉野芳人, emotion: happy}
  - {who: kiyota, x: 0.56, emotion: normal}
  - {who: kenkyu, x: 0.78, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見た目も、歯ごたえも、クラゲそっくりだ！
  - speaker: kiyota
    emotion: normal
    text: 中華の味付けを、してみます。醤油と酢で、あえます。
  - speaker: zundamon
    emotion: surprised
    text: ……あれ？ コリコリが、なくなっていくのだ。
  - speaker: kiyota
    emotion: sad
    text: 溶けてます。味を付けると、形が崩れてしまう。
  - speaker: kenkyu
    emotion: thinking
    text: 配合を、変えてみましょう。
  - speaker: zundamon
    emotion: sad
    text: ……また、溶けたのだ。
  - speaker: kiyota
    emotion: thinking
    text: 今度は、タレを薄めてみました。
  - speaker: zundamon
    emotion: sad
    text: ……やっぱり、溶ける。
  - speaker: zundamon
    emotion: thinking
    text: タレをかけずに、食べてもらうのはどうだ？
  - speaker: kenkyu
    emotion: thinking
    text: それだと、味のないゼリーです。
  - speaker: zundamon
    emotion: sad
    text: クラゲへの道は、遠いのだ……。
  - speaker: reimu
    text: 見た目と食感はクラゲに近づいても、味を付けると溶けてしまう。試作は、失敗が続きました。
    reading: みためと しょっかんわ くらげに ちかづいても あじお つけると とけて しまう。しさくわ しっぱいが つづきました。
- id: ch3_hirameki
  title: ''
  background: kk_kenkyu2
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 杉野芳人, emotion: thinking}
  - {who: kiyota, x: 0.56, emotion: sad}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: kiyota
    emotion: sad
    text: この失敗作は、どうしますか。捨てますか。
  - speaker: zundamon
    emotion: thinking
    text: ……もったいない。刻んで、食べてみるのだ。
  - speaker: zundamon
    emotion: surprised
    text: ……この歯ざわり。カニの脚の身みたいなのだ！
  - speaker: kiyota
    emotion: surprised
    text: カニ、ですか？
  - speaker: reimu
    text: 刻んだ失敗作がカニの脚の身に似ていると気づいたのは、杉野専務だったとされます。
    reading: きざんだ しっぱいさくが かにの あしの みに にていると きづいたのわ、すぎの せんむだったと されます。
  - speaker: tsumugi
    emotion: normal
    text: 能登では、おやつに香箱ガニが出るくらい、カニが身近なの。
  - speaker: tsumugi
    emotion: normal
    text: だから気づけた、と孫の社長は話してるわ。
  - speaker: zundamon
    emotion: thinking
    text: でも、クラゲの材料じゃ、味を付けたら溶ける。
  - speaker: zundamon
    emotion: surprised
    text: ……待つのだ。うちの本業は、かまぼこなのだ！
  - speaker: zundamon
    emotion: happy
    text: かまぼこなら、味を付けても溶けないのだ。すぐそばに、立派な材料があったのだ！
  - speaker: tsumugi
    emotion: happy
    text: '[灯台下暗し|とうだいもとくらし]、ってやつね。'
  - speaker: tsumugi
    emotion: thinking
    text: 失敗作まで捨てずに食べるなんて、さすが食通ね。
  - speaker: zundamon
    emotion: happy
    text: クラゲを追いかけて、足元の、かまぼこを忘れてたのだ。
- id: card1972
  title: ''
  background: kk_card_1972
  cuts:
  - speaker: reimu
    text: 1972年7月。すり身のかにあしが生まれます。
    reading: せんきゅうひゃく ななじゅうにねん しちがつ。すりみの かにあしが うまれます。
- id: ch4_kaniashi
  title: かにあし
  background: kk_koba
  bgm: pop
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 杉野芳人, emotion: happy}
  - {who: kiyota, x: 0.56, emotion: happy}
  - {who: shokunin, x: 0.78, emotion: normal}
  cuts:
  - speaker: kiyota
    emotion: happy
    text: 昆布とかつおの出汁で、すり身に味を付けました。
  - speaker: zundamon
    emotion: happy
    text: それを細く刻んで、カニの脚の身をほぐしたみたいにする。
  - speaker: zundamon
    emotion: thinking
    text: でも、包丁で刻んでたら、手間がかかりすぎるのだ。
  - speaker: shokunin
    emotion: normal
    text: 刻むのは、機械に任せましょう。
  - speaker: zundamon
    emotion: happy
    text: 職人さん、頼りになるのだ。
  - speaker: kiyota
    emotion: happy
    text: 食べてみてください。
  - speaker: zundamon
    emotion: happy
    text: ……カニなのだ。ほぐれ方まで、カニの脚の身だぞ！
  - speaker: reimu
    text: 名前は、珍味かまぼこ・かにあし。スギヨは、これを世界初のカニカマとしています。
    reading: なまえわ ちんみ かまぼこ かにあし。すぎよわ これお せかいはつの かにかまと しています。
- id: ch5_tsukiji
  title: 売れないカニ
  background: kk_tsukiji
  bgm: kinakusai
  stage:
  - {who: miyazaki, x: 0.3, emotion: normal}
  - {who: tonya, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 営業担当の宮崎は、かにあしを手に築地市場へ向かいます。
    reading: えいぎょう たんとうの みやざきわ かにあしお てに つきじ しじょうえ むかいます。
  - speaker: miyazaki
    emotion: normal
    text: 能登から来たスギヨです。新作のかまぼこです。
  - speaker: tonya
    emotion: thinking
    text: なんだい、この細切れは。
  - speaker: miyazaki
    emotion: normal
    text: カニの脚に似せた、かまぼこなんです。
