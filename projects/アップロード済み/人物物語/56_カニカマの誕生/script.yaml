meta:
  title: 【カニカマの誕生】人工クラゲを作るはずが、失敗作を刻んだらカニになった【ずんだもん解説】
  slug: sugiyo-kanikama
  summary: スーパーでおなじみのカニカマ。実は最初からカニを目指したわけではありませんでした。能登のちくわ屋に持ち込まれた「人工クラゲを作ってほしい」という依頼。醤油をかけると溶けてしまう失敗作を、刻んで口にした瞬間から話が変わります。築地での門前払い、「インチキ」と呼ばれた日々、そして世界の「SURIMI」へ。
  tags:
  - カニカマ
  - かに風味かまぼこ
  - スギヨ
  - 杉野芳人
  - すり身
  - かまぼこ
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  thumbnail:
    top: クラゲの失敗作だった
    bottom: カニカマの誕生
  mode: drama
  narrator: reimu
