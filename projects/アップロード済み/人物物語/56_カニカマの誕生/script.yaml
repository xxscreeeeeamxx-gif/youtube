  bgm: amacha_milkyway
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 香り箱の名は、北陸で香箱ガニと呼ばれる、雌のズワイガニから来てるの。
  - speaker: zundamon
    emotion: happy
    text: 能登のカニの名前を、もらったのか。
  - speaker: tsumugi
    emotion: normal
    text: 細い繊維を、葉っぱの筋みたいに束ねて、本物の脚の身に近づけたのよ。
  - speaker: zundamon
    emotion: surprised
    text: 刻むから、束ねるへ。30年あまりで、ずいぶん進んだのだ。
- id: ch10_ronsou
  title: 元祖はどっち？
  background: kk_shiryo
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: ネットで、酢の物にしたらカニの味がした、って見たのだ。
  - speaker: tsumugi
    emotion: normal
    text: よく聞く話だけど、確かな記録は見つからないの。
  - speaker: tsumugi
    emotion: normal
    text: 資料に残ってるのは、刻んで食べたら、食感がカニの脚の身だった、って話よ。
  - speaker: zundamon
    emotion: surprised
    text: じゃあ、ボクの酢の物は？
  - speaker: tsumugi
    emotion: happy
    text: ただの、ひと手間ね。
    se: oti
  - speaker: zundamon
    emotion: thinking
    text: 結局、カニカマの元祖は、能登なのだ？ 広島なのだ？
  - speaker: tsumugi
    emotion: normal
    text: 最初は1972年のスギヨ。刻んだ身の形よ。
  - speaker: tsumugi
    emotion: normal
    text: 今よく見る棒の形を最初に作ったのは、1974年の大崎水産。
  - speaker: tsumugi
    emotion: thinking
    text: 1973年に、カニ棒を作ったという別の会社の話もあるわ。
  - speaker: zundamon
    emotion: surprised
    text: 元祖が、いっぱいいるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 特許で独り占めされなかったこともあって、似た商品が広がったと言われてるわ。
  - speaker: zundamon
    emotion: happy
    text: 誰でも作れたから、世界の食べ物になったのだ。
- id: ch11_gendai
  title: 今のカニカマ
  background: kk_gendai
  bgm: amacha_milkyway
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: カニカマは、ヘルシーで糖質も少ない。
  - speaker: tsumugi
    emotion: thinking
    text: 糖質は、むしろ本物のカニより多いのよ。
  - speaker: tsumugi
    emotion: normal
    text: ゆでたズワイガニの炭水化物は、100グラムで0.1グラム。
  - speaker: tsumugi
    emotion: normal
    text: カニカマは、9.2グラムもあるの。
  - speaker: zundamon
    emotion: surprised
    text: 90倍以上なのだ！？
  - speaker: tsumugi
    emotion: normal
    text: でん粉や砂糖が入ってるからね。
  - speaker: tsumugi
    emotion: normal
    text: たんぱく質は12グラムあって、手軽なたんぱく源として人気よ。
  - speaker: zundamon
    emotion: thinking
    text: カニカマに、カニは入ってないのだ？
  - speaker: tsumugi
    emotion: normal
    text: 商品によるの。カニのエキスを使うものも、魚介のエキスだけのものもあるわ。
  - speaker: tsumugi
    emotion: normal
    text: カニのアレルギーがある人は、袋の表示を必ず見てね。
  - speaker: tsumugi
    emotion: normal
    text: 昔は国の基準で、風味かまぼこと書く決まりがあったの。
  - speaker: tsumugi
    emotion: normal
    text: 今も、本物のカニと誤解させる表示は、だめなのよ。
  - speaker: zundamon
    emotion: happy
    text: カニのふりはしても、カニのうそはつかないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 別の会社には、本物のカニとそっくり同じ成分で作ったら、まずかったという話もあるの。
  - speaker: zundamon
    emotion: surprised
    text: 本物そっくりが、正解じゃないのだ？
  - speaker: tsumugi
    emotion: normal
    text: うまみを少し強めて、カニの臭みは消したんですって。
  - speaker: tsumugi
    emotion: normal
    text: 物価が上がった2025年には、手ごろなたんぱく源として、練り物がよく売れたそうよ。
  - speaker: tsumugi
    emotion: normal
    text: 練り物の生産は、1975年の約103万トンが最高なの。
  - speaker: tsumugi
    emotion: normal
    text: カニカマの登場で、一時は盛り返したんですって。
  - speaker: tsumugi
    emotion: thinking
    text: 原料の話もあるの。
  - speaker: tsumugi
    emotion: normal
    text: スケトウダラの日本の漁獲は、2019年には15.6万トンまで減ったの。
  - speaker: tsumugi
    emotion: normal
    text: 今、世界のすり身の約7割は、熱帯の魚から作られてるそうよ。
  - speaker: zundamon
    emotion: happy
    text: カニカマの原料も、世界を旅してるのだ。
- id: ch11_noto
  title: ''
  background: kk_noto
  bgm: amacha_milkyway
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: thinking}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 2022年、カニカマは発売から50年を迎えたの。
  - speaker: tsumugi
    emotion: normal
    text: カニカマが語り手の、短い映画まで作られたわ。
  - speaker: zundamon
    emotion: normal
    text: クラゲの失敗作が、50年も続いたのか。
  - speaker: tsumugi
    emotion: normal
    text: 人工クラゲは、結局、クラゲにはならなかった。
  - speaker: zundamon
    emotion: happy
    text: でも、カニにはなったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 開発に関わった当時の主任は、こう振り返ってるわ。
  - speaker: tsumugi
    emotion: normal
    text: 10年に一度の発明だと喜んだけど、50年続くとは思わなかった、って。
  - speaker: tsumugi
    emotion: normal
    text: 最初の道より、横にできた道のほうが面白かった、とも。
  - speaker: tsumugi
    emotion: thinking
    text: 能登半島地震は、2024年の元日。
  - speaker: tsumugi
    emotion: thinking
    text: スギヨの本社と、3つの工場が被災したの。
  - speaker: zundamon
    emotion: sad
    text: カニカマの、ふるさとが……。
  - speaker: tsumugi
    emotion: normal
    text: それでも、2月の末には、工場を動かし始めたわ。
  - speaker: tsumugi
    emotion: normal
    text: カニカマは、今も能登で作られてるの。
- id: shime
  title: ''
  background: kk_ima
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ！ 今日は、カニカマの日なのだ！
  - speaker: tsumugi
    emotion: normal
    text: カニカマの日は、毎月22日。漢字の[二二|にに]が、カニのハサミに見えるからね。
  - speaker: zundamon
    emotion: happy
    text: だから今日は、カニカマ食べ放題だ！
  - speaker: tsumugi
    emotion: thinking
    text: ……今日、何月か分かってる？
  - speaker: zundamon
    emotion: normal
    text: 6月22日なのだ。
  - speaker: tsumugi
    emotion: happy
    text: 6月だけは、カニカマの日がお休みなの。
    se: oti
  - speaker: zundamon
    emotion: surprised
    text: なんでなのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 6月22日は、本物のかにの日。カニカマは、6月だけ本物に遠慮してるのよ。
  - speaker: zundamon
    emotion: sad
    text: カニカマ、奥ゆかしすぎる……。
  - speaker: tsumugi
    emotion: normal
    text: 今度カニカマを食べるときは、赤い外側と白い中身を、ほぐして見てみて。
  - speaker: tsumugi
    emotion: normal
    text: 溶けてしまうクラゲの失敗作を、捨てずに刻んだ人がいたから、そこにあるのよ。
  - speaker: zundamon
    emotion: normal
    text: 失敗作も、刻み方しだいなのだ。
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴ありがとうございました！
    duet_with: tsumugi
