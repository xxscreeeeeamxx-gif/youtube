meta:
  title: 「聞いちゃった」と会見で認めた村上ファンドの代表、その日の午後に逮捕された【ずんだもん解説】
  slug: murakami-fund
  hook_line: 「物言う株主」は、なぜ自分の買った株で有罪になったのか。
  summary: 2006年6月5日、東京証券取引所の記者クラブ。村上ファンドを率いる村上世彰は「聞いちゃったと言われれば聞いちゃってるんですよね」と語り、その日の午後に逮捕されました。小さなラジオ局が大きなテレビ局の筆頭株主という「ねじれ」、自分から持ちかけた買い集めの話、そして2か月半で99億円あまりの買い付け。「物言う株主」は、なぜ自分の買った株で有罪になったのか。最高裁の決定と判決、本人の会見・著書・対談の言葉を、主語を分けて並べ、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 最高裁判所第一小法廷 平成23年6月6日決定（平成21年(あ)第375号）全文 https://www.sn-hoki.co.jp/snh-cms/contents/tamaster/e13/110606_375.pdf
  - 証券取引等監視委員会「証券取引等監視委員会の活動状況」（2006年8月） https://www.fsa.go.jp/sesc/reports/n_17/n_17b.pdf
  - 日本経済新聞 フジ・メディア・ホールディングスの約2349億円の自社株買い（2026年2月5日） https://www.nikkei.com/article/DGXZQOUC051A10V00C26A2000000/
  - AFPBB News「村上被告に実刑判決、「もの言う株主」に厳しい司法の判断」（2007年7月19日） https://www.afpbb.com/articles/-/2255975
  - 日本経済新聞「村上ファンド元代表の有罪確定へ インサイダー事件」（2011年6月7日） https://www.nikkei.com/article/DGXNASDG0702K_X00C11A6000000/
  - 文藝春秋『生涯投資家』（村上世彰、2017年） https://books.bunshun.jp/ud/book/num/9784163906652
  tags:
  - 村上ファンド
