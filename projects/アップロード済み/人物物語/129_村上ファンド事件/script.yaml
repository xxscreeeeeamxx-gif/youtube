scenes:
# ---- 先出し（2006年6月5日 午前11時・東証の記者クラブ。記者の問いは原文が無いので置かない。会見を嘲らない） ----
- id: co_kaiken
  title: ''
  background: mu_kaiken2
  bgm: serious
  stage:
  - {who: zundamon, x: 0.5, tag: 村上世彰, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2006年6月5日、午前11時。東京証券取引所の記者クラブ。
    reading: にせん ろくねん ろくがつ いつか、ごぜん じゅういちじ。とうきょう しょうけん とりひきじょの きしゃ くらぶ。
  - speaker: reimu
    text: 村上ファンドを率いる村上世彰、46歳の会見です。
    reading: むらかみ ふぁんどお ひきいる むらかみ よしあき、よんじゅうろくさいの かいけんです。
  - speaker: zundamon
    emotion: sad
    text: 聞いちゃったと言われれば聞いちゃってるんですよね
  - speaker: zundamon
    emotion: normal
    text: プロ中のプロとして認識が甘かった点については、
  - speaker: zundamon
    emotion: normal
    text: 私自身が罪を認め、それを甘んじて受けるのが、私がやるべきことと判断した。
  - speaker: reimu
    text: その日の午後、彼はインサイダー取引の疑いで逮捕されます。のちに法廷では、この会見の言葉を言い直します。
    reading: その ひの ごご、かれわ いんさいだー とりひきの うたがいで たいほ されます。のちに ほうていでわ この かいけんの ことばお いいなおします。
# ---- 今の部屋（先に聞いた話で株を買う） ----
- id: hook
  title: ''
  background: mu_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 友だちのお父さんの会社、来週いい発表があるって聞いたのだ！
  - speaker: zundamon
    emotion: happy
    text: 今のうちに、その会社の株を買うのだ！
  - speaker: tsumugi
    emotion: thinking
    text: それ、やったら犯罪になるかもしれないわよ。
    se: hammer
  - speaker: zundamon
    emotion: surprised
    text: 聞いただけなのに！？
  - speaker: tsumugi
    emotion: normal
    text: 先に聞いて、買った。それで有罪になった、物言う株主がいるの。
  - speaker: tsumugi
    emotion: thinking
    text: 彼はなぜ、自分の買った株で有罪になったのか。
    telops:
    - {text: "物言う株主は なぜ自分の買った株で有罪に？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: ものを言う人が、聞いて有罪！？
# ---- 1959〜1999年・官僚から株主へ（30秒以内。子供時代は描かない。父は1行だけ） ----
- id: ch0_kanryo
  title: 官僚から株主へ
  background: mu_shingikai
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.18, flip: true, tag: 村上世彰, emotion: normal}
  cuts:
  - speaker: reimu
    text: 小学生で父から100万円を渡され、株を始めた男。通産省に16年勤め、1999年にファンドを作ります。
    reading: しょうがくせいで ちちから ひゃくまんえんお わたされ、かぶお はじめた おとこ。つうさんしょうに じゅうろくねん つとめ、せんきゅうひゃく きゅうじゅうきゅうねんに ふぁんどお つくります。
# ---- 2002年・東京スタイルの株主総会（社長は故人・台詞なし。会社側が勝った、まで） ----
- id: ch1_sokai
  title: お金を株主に返せ
  background: mu_sokai
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 村上世彰, emotion: normal}
  - {who: yakuin, x: 0.84, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2002年。彼のファンドは、服の会社、東京スタイルの株を9.3%買います。
    reading: にせん にねん。かれの ふぁんどわ、ふくの かいしゃ とうきょう すたいるの かぶお きゅうてんさん ぱーせんと かいます。
  - speaker: yakuin
    emotion: surprised
    text: ファンドの要求は、1株500円の配当と500億円までの自社株買い！
  - speaker: yakuin
    emotion: thinking
    text: お[金|かね]を株主に返せ、か……。
  - speaker: yakuin
    emotion: angry
    text: 株主のくせに、経営に口を出す。物言う株主ってやつか。
  - speaker: yakuin
    emotion: normal
    text: 株主総会は、委任状の奪い合い。[委任状争奪戦|イニンジョウソウダツセン]だ。
  - speaker: yakuin
    emotion: happy
    text: ……通ったのは、うちの案です。
    beat: true
# ---- 2001〜2004年・ラジオ局の株主の円グラフ（局の社員は名前なし。121とは別の時期・別の言い回し） ----
- id: ch2_radio
  title: テレビ局がついてくる株
  background: mu_radio
  stage:
  - {who: soumu, x: 0.16, flip: true, emotion: normal}
  - {who: keiri, x: 0.84, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2001年から彼が買い集めていたのは、東京のラジオ局、ニッポン放送の株でした。
    reading: にせん いちねんから かれが かいあつめて いたのわ、とうきょうの らじおきょく にっぽん ほうそうの かぶでした。
  - speaker: keiri
    emotion: surprised
    text: '[村上|ムラカミ]ファンドが、社外取締役を選べと株主提案です！'
    se: bikkuri
  - speaker: soumu
    emotion: thinking
    text: 関連会社と合わせて、2割近く持つ大株主だからな。
    background: mu_radio_nuri
  - speaker: keiri
    emotion: thinking
    text: 狙いは、うちが持つフジテレビの議決権22.5%か。
  - speaker: soumu
    emotion: thinking
    text: うちの株を買えば、テレビ局までついてくる。おまけのほうが本体より高いお菓子だな。
  - speaker: keiri
    emotion: normal
    text: 総会では提案を取り下げて、資本政策を話し合う場を作ることに。
  - speaker: reimu
    text: ラジオ局が、ずっと大きなテレビ局の筆頭株主。この形は、ねじれと呼ばれました。
    reading: らじおきょくが ずっと おおきな てれびきょくの ひっとう かぶぬし。この かたちわ ねじれと よばれました。
# ---- 今の部屋（5%の線と、本人の本の言葉） ----
- id: heya1
  title: ''
  background: mu_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: お菓子を買ったら、テレビ局がついてくるのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 大きく買う話には、線があるの。
  - speaker: tsumugi
    emotion: normal
    text: 5%以上買い集めると決めた、と買う側から聞いた人は
  - speaker: tsumugi
    emotion: normal
    text: 公表されるまで、その株を買ってはいけない。
    telops:
    - {text: "5%以上買う、と聞いたら 公表まで買えない", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: 友だちのお父さんの話と、同じだ……。
  - speaker: tsumugi
    emotion: thinking
    text: 彼は、誰から何を聞いちゃったのか。
  - speaker: tsumugi
    emotion: normal
    text: 本人は2017年の本に、こう書いているわ。
  - speaker: tsumugi
    emotion: normal
    text: 株主の立場からこの資本関係のおかしさを正したかった。
  - speaker: zundamon
    emotion: happy
    text: 正義の味方なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: フジテレビの[TOB|ティーオービー]などを想定していたとして、こうも書いてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 投資利益が、ファンドマネージャーとして大きな魅力だったことは、もちろん事実だ。
  - speaker: zundamon
    emotion: thinking
    text: 正義とお[金|かね]と、両方……。
    se: tenten
  - speaker: tsumugi
    emotion: thinking
    text: そして最初に話を持ちかけたのは、彼のほうだったの。
  - speaker: zundamon
    emotion: surprised
    text: 聞いた側じゃなくて、誘った側！？
# ---- 2004年9月15日 午前9時・ライブドアの会議室（判決が認めた事実。村上の台詞は決定文の認定の言葉だけ） ----
- id: card2004
  title: ''
  background: mu_card_2004
  bgm: curious
  cuts:
  - speaker: reimu
    text: 2004年9月15日、午前9時。ライブドアの会議室で、45歳の彼は堀江と宮内に会います。
    reading: にせん よねん くがつ じゅうごにち、ごぜん くじ。らいぶどあの かいぎしつで、よんじゅうごさいの かれわ ほりえと みやうちに あいます。
- id: ch3_sasoi
  title: 午前9時の誘い
  background: mu_kaigi
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 村上世彰, emotion: happy}
  - {who: shain, x: 0.84, emotion: normal}
  cuts:
  - speaker: reimu
    text: 判決によれば、彼が部下と見せた資料には、ニッポン放送が持つフジテレビ株は1373億円とありました。
    reading: はんけつに よれば かれが ぶかと みせた しりょうにわ、にっぽん ほうそうが もつ ふじてれびかぶわ せん さんびゃく ななじゅうさんおくえんと ありました。
  - speaker: reimu
    text: そのうえで彼は、こう働きかけたと最高裁は認めています。
    reading: その うえで かれわ、こう はたらきかけたと さいこうさいわ みとめて います。
  - speaker: zundamon
    emotion: happy
    text: '[3分の1|さんぶんのいち]を取得すれば、うちの[18%|じゅうはっパーセント]と合わせて、'
  - speaker: zundamon
    emotion: happy
    text: 経営権を掌握でき、
  - speaker: zundamon
    emotion: normal
    text: たとえ失敗しても、フジテレビの[公開買付け|こうかいかいつけ]などに応じればリスクはない
  - speaker: reimu
    text: 判決によれば、堀江は強い興味を示しました。この誘いが2か月後、彼自身を縛ります。
    reading: はんけつに よれば、ほりえわ つよい きょうみお しめしました。この さそいが にかげつご かれ じしんお しばります。
# ---- 2004年11月8日 午後・村上ファンドの会議室（宮内の台詞は最高裁が認めた1言だけ） ----
- id: ch4_meado
  title: 資金のめどが立ったので
  background: mu_office
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.18, flip: true, tag: 村上世彰, emotion: normal}
  - {who: miyauchi, x: 0.82, emotion: normal}
  cuts:
  - speaker: reimu
    text: 11月8日の午後。今度はライブドアの側が、彼のファンドの会議室に来ます。
    reading: じゅういちがつ ようかの ごご。こんどわ らいぶどあの がわが、かれの ふぁんどの かいぎしつに きます。
  - speaker: miyauchi
    emotion: normal
    text: 資金のめどが立ったので、具体的に進めさせていただきたい。
    se: don
  - speaker: reimu
    text: 最高裁は、この日に宮内がこう述べ、堀江と2人で3分の1を目指すと決意を示した、と認めました。
    telops:
    - {text: "宮内「資金のめどが立ったので」", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
    reading: さいこうさいわ この ひに みやうちが こう のべ、ほりえと ふたりで さんぶんのいちお めざすと けついお しめしたと みとめました。
  - speaker: reimu
    text: 判決によれば、12月のTOBを持ち出す堀江に、彼は2000年に失敗した自分のTOBの例を話します。
    reading: はんけつに よれば じゅうにがつの てぃーおーびーお もちだす ほりえに、かれわ にせんねんに しっぱい した じぶんの てぃーおーびーの れいお はなします。
# ---- 今の部屋（聞いたこと、本人の主張、翌日からの買い付け） ----
- id: heya2
  title: ''
  background: mu_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 5%どころか、[3分の1|さんぶんのいち]を買うって聞いたのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 本人も2017年に、5%以上を買いたいという趣旨の話を聞いたのは事実と話してるわ。
  - speaker: tsumugi
    emotion: thinking
    text: ただし解釈の違いだと思っています、とも。
  - speaker: tsumugi
    emotion: normal
    text: 2006年の声明では、ライブドアの単なる願望だとしか受け止めていなかったと。
  - speaker: zundamon
    emotion: thinking
    text: でも、誘ったのは自分のほうだよ？
  - speaker: tsumugi
    emotion: thinking
    text: 相手の[宮内|ミヤウチ]ものちに法廷で、9月の彼は前のめりだったと証言しているわ。
  - speaker: tsumugi
    emotion: thinking
    text: 判決によれば[18%|じゅうはっパーセント]を持ち続ける約束を紙に、と頼まれても断っているの。
  - speaker: zundamon
    emotion: thinking
    text: 買うのは勧めて、自分は約束しないのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 取ったあとの子会社の分け方まで、話に出たと判決は書いているわ。
  - speaker: zundamon
    emotion: thinking
    text: 聞いただけなら、罪じゃないのだ？
  - speaker: tsumugi
    emotion: thinking
    text: 聞いただけなら、ね。問題は、翌日の11月9日からよ。
  - speaker: tsumugi
    emotion: normal
    text: 1月26日までの2か月半で、ニッポン放送株を193万3100株。99億円あまりよ。
  - speaker: zundamon
    emotion: surprised
    text: 99億円！？
  - speaker: tsumugi
    emotion: normal
    text: 平均で1株約5148円。100株で約51万円の株よ。
  - speaker: tsumugi
    emotion: normal
    text: その100株の束を、2万近く買ったことになるわ。
  - speaker: zundamon
    emotion: surprised
    text: 2万束……！
    se: gaan
  - speaker: tsumugi
    emotion: thinking
    text: ただ二審は、1月6日の会議まではもとの方針どおりに買っていたとみたの。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、1月6日に何があったの？
# ---- 2005年1月6日・3回目の会議（本人がのちに法廷で話した言葉） ----
- id: card2005
  title: ''
  background: mu_card_2005
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 2005年1月6日。3回目の会議です。
    reading: にせん ごねん いちがつ むいか。さんかいめの かいぎです。
- id: ch5_kaigi3
  title: 3回目の会議
  background: mu_kaigi
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 村上世彰, emotion: normal}
  cuts:
  - speaker: reimu
    text: のちに一審の法廷で彼は、TOBを口にするライブドアの2人に、こう言ったと話しています。
    reading: のちに いっしんの ほうていで かれわ、てぃーおーびーお くちに する らいぶどあの ふたりに こう いったと はなして います。
  - speaker: zundamon
    emotion: angry
    text: ガタガタ言わずにまずは[市場|しじょう]で株を買え！
  - speaker: reimu
    text: 二審は、この日からは、ライブドアが本気で大量に買うと分かったうえで、買い続けたとみました。
    reading: にしんわ この ひからわ、らいぶどあが ほんきで たいりょうに かうと わかった うえで かいつづけたと みました。
# ---- 2005年1月17日〜2月10日・5950円と、6050円（121と重ねない。村上の側の売値だけ） ----
