# ---- 論争2：認めたから有罪？ ----
- id: ronso2
  title: 認めたから有罪？
  background: mu_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: でも会見で自分で認めたんだから、有罪は当たり前なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: それも、少し違うの。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 本人は法廷で、幹部の逮捕とファンドの崩壊を防ぐための嘘だったと述べたの。
  - speaker: zundamon
    emotion: thinking
    text: 認めたのも、かばうため……？
  - speaker: tsumugi
    emotion: normal
    text: 研究所の論考も、会見で認めても法廷で有罪を認めるのと同じではないと書いていたわ。
  - speaker: tsumugi
    emotion: thinking
    text: 実際、裁判所は会見の言葉で決めてはいないの。
  - speaker: tsumugi
    emotion: normal
    text: 二審は取り調べの自白の調書に頼らなくても、ほかの証拠で認められると判断したわ。
  - speaker: tsumugi
    emotion: normal
    text: 有罪を支えたのは、会議のやりとりとお[金|かね]の動きだったの。
  - speaker: zundamon
    emotion: surprised
    text: 会見の言葉じゃ、なかったのか……。
    beat: true
# ---- 本当の注意点（茶番の回収） ----
- id: chui
  title: 聞いたら、待つ
  background: mu_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 1つめ。会社の大事な話を公表の前に聞いたら、公表まで売り買いしない。
  - speaker: tsumugi
    emotion: normal
    text: アメリカでは、話を明かすか取引をやめるかを選べと言うの。
  - speaker: zundamon
    emotion: sad
    text: 友だちのお父さんから聞いた話も……？
  - speaker: tsumugi
    emotion: normal
    text: 伝えられた人も、対象になるの。
  - speaker: zundamon
    emotion: sad
    text: ……買うの、やめるのだ。
    se: shobon
  - speaker: tsumugi
    emotion: normal
    text: 2つめ。どうせ実現しない話、と思っても安心できない。
  - speaker: tsumugi
    emotion: normal
    text: 来るか分からない大口のお客さんでも、来るつもりで準備を始めたと聞いたら
  - speaker: tsumugi
    emotion: normal
    text: もう同じ品は買ってはいけない。最高裁は、そういう線を引いたの。
  - speaker: zundamon
    emotion: thinking
    text: 来るかどうかは、関係ないんだ……。
  - speaker: tsumugi
    emotion: normal
    text: 3つめ。株主として会社にものを言うのは、罪じゃないわ。
  - speaker: tsumugi
    emotion: normal
    text: 研究所の論考も、株主価値を訴えた功績は無に帰するわけではないと書いているわ。
  - speaker: tsumugi
    emotion: thinking
    text: 彼の罪は[委任状争奪戦|イニンジョウソウダツセン]でも配当の要求でもなく、聞いたあとに買ったことよ。
  - speaker: zundamon
    emotion: thinking
    text: 言うのはいい。聞いて買うのが、だめ……。
