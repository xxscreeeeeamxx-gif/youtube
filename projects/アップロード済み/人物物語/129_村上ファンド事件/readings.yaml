# murakami-fund 読み台帳（人名・地名・社名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある（人名のタグはカタカナ）。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 村上世彰 / label: 役員・総務・経理・社員・宮内亮治・記者・傍聴人・裁判長）・テロップ・章タイトルは
# 表示専用なのでタグを付けていない。
#
# 2026-11-15 台本を書いたあと、セリフ全行を VOICEVOX の audio_query（話者3）にかけた結果:
# - 聞いちゃったと言われれば聞いちゃってるんですよね ＝ キイチャッタト/イワレレバ/キイチャッテル/ンデスヨネ（崩れない）。
# - 「相手の宮内も」がタグなしで アイテノ/クナイモ になった → [宮内|ミヤウチ]。「財務の宮内さん」はタグなしでも
#   ミヤウチサン だったが、台帳に入れたので両方タグにした。
# - 村上 は [村上|ムラカミ] でもタグなしでも ムラカミ/ファンド・キュウムラカミケエ・ムラカミシガワ で同じ抑揚。
#   発注書どおりカタカナのタグにした。堀江 も [堀江|ホリエ] で ホリエサン（タグなしと同じ）。
# - 3分の1 はタグなしだと サンプンノイチ → [3分の1|さんぶんのいち] で サンブンノ/イチ。
# - 18% はタグなしだと ジュウ/ハチパアセント → [18%|じゅうはっパーセント] で ジュウ/ハッパアセント。
# - 原判決 はタグなしだと ハラハンケツ → [原判決|げんはんけつ] で ゲンハンケツ。
# - 委任状争奪戦 はひらがなのタグだと イ/ニンジョオソオダツセン と切れた → カタカナのタグ
#   [委任状争奪戦|イニンジョウソウダツセン] で イニンジョオソオダツセン（1語）。
# - 一審 は長い文の頭で イチシン になった → [一審|いっしん] で イッシン。二審 はタグなしで ニシン。
# - 懲役2年 は [懲役2年|ちょうえきにねん] で チョオエキニネン（1語）。
# - 物言う株主 はひらがなのタグだと モノユウ になった → タグを外した（タグなしで モノイウ/カブヌシ）。台帳に入れていない。
# - 慄然 はタグを付けると リツ/ゼント と切れた → タグなし（リツゼント）。台帳に入れていない。
# - 引き受け手 はタグなしだと ヒキウケシュ → [引き受け手|ひきうけて]。
# - 金儲け（出国前の取材）は [金儲け|かねもうけ] で カネモオケ。会見の「お金儲けは悪いことですか？」はタグなしで
#   オカネモオケワ と読むので、台帳には入れていない（入れると「お金儲け」にもタグが要る）。
# - 市場 は [市場|しじょう] にした所も、タグなしの「残りの株は市場で売ると」も シジョオ。
# - 追徴金 はひらがなでもカタカナでもタグを付けると ツイ/チョオキン と切れた → タグなし（ツイチョオキン）。台帳に入れていない。
# - 東京地検特捜部 はタグを付けると トウ/キョオチケン… や トクソ/ウブ と切れた → タグなし（トオキョオチケントクソオブ）。
#   台帳に入れていない（ナレは reading で読ませる）。
# - 公開買付け・執行猶予 はタグありでもタグなしと同じ読み・抑揚（コオカイカイツケナドニ・シッコオユウヨニ）。台帳に入れてタグにした。
# 2026-11-15 見直し（mu_fix.md）で直した・足したセリフも audio_query にかけた:
# - 「止めました」（2020年の対談）は トメマシタ になる → [止|や]めました で ヤメマシタ。表示は原文のまま。
#   ch6_uri の社員の「買い付けは止めました」は トメマシタ で意味どおりなのでタグなし。
# - 「やれ行け」は ヤレユケ になる → やれ[行け|いけ] で ヤレイケ（[やれ行け|ヤレイケ] は ヤ/レイケ と切れる）。
# - 「大株主」は オオカブヌシ、「株主提案」は カブヌシテエアン、「選べと」は エラベト、「検事さん」は ケンジサン、
#   「及び」は オヨビ、「7時間」は シチジカン（タグを付けると抑揚が崩れるのでタグなし）、「5.76%」は ゴオテンナナロク、
#   「TOB」は [TOB|ティーオービー] で ティイオオビイ。どれも正しい。
# - 証券取引法（ショオケントリヒキホオ）・
#   黒田電気（クロダデンキ）・六本木（ロッポンギ）・金融商品取引法・1373億円・22.5%・我々・声明・前のめり・
#   ガタガタ・プロ中のプロ・甘んじて・未だに・具体的に進めさせていただきたい はタグなしで正しく読んだ。
#   証券取引法 は発注書の読みに合わせて台帳に入れ、セリフはタグにした（タグありでも ショオケントリヒキホオイハン と1語）。
