scenes:
# ---- 先出し（2026年10月1日のサービスカウンター） ----
- id: co_counter
  title: ''
  background: sy_reji
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 店長, emotion: normal}
  - {who: kyaku, x: 0.7, emotion: angry}
  cuts:
  - speaker: reimu
    text: 2026年10月1日。東京郊外の西友の、サービスカウンターです。
    reading: にせんにじゅうろくねん じゅうがつ ついたち。とうきょう こうがいの せいゆうの さーびす かうんたーです。
  - speaker: kyaku
    emotion: angry
    text: 店長さん。この貼り紙、なんなの？
  - speaker: zundamon
    emotion: normal
    text: 楽天ポイントカードの、サービス終了のお知らせです。
  - speaker: kyaku
    emotion: surprised
    text: 終わっちゃうの！？
    se: bikkuri
  - speaker: zundamon
    emotion: normal
    text: 2027年の[4月4日|シガツヨッカ]までは、お使いいただけます。
  - speaker: kyaku
    emotion: angry
    text: ポイントも無しで、どうやってお客を呼ぶのよ。
  - speaker: zundamon
    emotion: thinking
    text: ……[ロースかつ重|ロースカツジュウ]、ですかね。
  - speaker: kyaku
    emotion: thinking
    text: '[かつ重|カツジュウ]ねえ。……今日も2つ買ったけど。'
    beat: true
  - speaker: reimu
    text: 西友の既存店の売上は、2025年10月から12カ月続けて前の年を上回りました。
    reading: せいゆうの きぞんてんの うりあげわ、にせんにじゅうごねん じゅうがつから じゅうにかげつ つづけて まえの としお うわまわりました。
    telops:
    - {text: "既存店売上　12カ月連続で前年超え", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: 持ち主が次々と替わった老舗に、なぜ九州のディスカウント店の下で客が戻ったのでしょう。
    reading: もちぬしが つぎつぎと かわった しにせに、なぜ きゅうしゅうの でぃすかうんとてんの もとで きゃくが もどったのでしょう。
# ---- 茶番（今の部屋） ----
- id: hook
  title: ''
  background: sy_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ [ロースかつ重|ロースカツジュウ]が299円！ 3つ買ったのだ！
  - speaker: tsumugi
    emotion: surprised
    text: 3つも……。どこで？
  - speaker: zundamon
    emotion: happy
    text: '[西友|せいゆう]。トライアルの名物なんだって。'
  - speaker: tsumugi
    emotion: normal
    text: 西友は去年、トライアルに買われたの。
  - speaker: tsumugi
    emotion: thinking
    text: '[大株主|おおかぶぬし]が替わるのは、25年で5回目。'
  - speaker: zundamon
    emotion: surprised
    text: 替わりすぎなのだ！
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: なのに今は、客が増えてるの。
  - speaker: zundamon
    emotion: surprised
    text: なんで九州のお店の[下|もと]で、客が戻ったのだ！？
# ---- 仕組み1：物差しを替える（2025年7月の店長会議） ----
- id: ch1_kaigi
  title: 物差しを替える
  background: sy_kaigi
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 店長, emotion: normal}
  - {who: honbu, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2025年7月。トライアルの子会社になった西友で、店長たちが本部の会議に呼ばれます。
    reading: にせんにじゅうごねん しちがつ。とらいあるの こがいしゃに なった せいゆうで、てんちょうたちが ほんぶの かいぎに よばれます。
  - speaker: honbu
    emotion: normal
    text: 皆さん。壁の目標を、見てください。
  - speaker: zundamon
    emotion: normal
    text: 営業利益率、ですね。
  - speaker: honbu
    emotion: normal
    text: これを、はがします。
  - speaker: zundamon
    emotion: surprised
    text: '[は|ハ]、はがす！？'
  - speaker: honbu
    emotion: normal
    text: 新しい目標は、[既存店|きぞんてん]客数です。
    se: don
    telops:
    - {text: "目標　利益率→既存店客数", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: 客の、数ですか。
  - speaker: honbu
    emotion: normal
    text: 従来の収益性重視から、お客さま支持の向上を軸とする経営へ転換します。
  - speaker: honbu
    emotion: normal
    text: 最重要[KPI|ケーピーアイ]は、[既存店|きぞんてん]客数です。
  - speaker: zundamon
    emotion: thinking
    text: でも前の社長は、うちの利益は業界トップレベルだって……。
  - speaker: honbu
    emotion: normal
    text: お客さま起点の売場づくりを、徹底します。
  - speaker: zundamon
    emotion: thinking
    text: ……利益より、客なんですね。
- id: ch1_kaigi_b
  title: ''
  background: sy_kaigi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 店長, emotion: thinking}
  - {who: honbu, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: お客さんが1000円買ってくれたら、会社に残るのは49円。
  - speaker: zundamon
    emotion: happy
    text: これが、うちの自慢だったんです。
  - speaker: honbu
    emotion: normal
    text: お客さまの数を、増やします。
  - speaker: zundamon
    emotion: thinking
    text: 49円は、どうなるんですか。
  - speaker: reimu
    text: 1年後、西友の営業利益率は3.0％に下がります。会社は次の年の計画を、2.0％にしました。
    reading: いちねんご せいゆうの えいぎょう りえきりつわ さんてんぜろ ぱーせんとに さがります。かいしゃわ つぎの としの けいかくお、にてんぜろ ぱーせんとに しました。
    background: sy_kaigi_akaji
  - speaker: zundamon
    emotion: surprised
    text: 49円が30円……20円！？
    se: gaan
    telops:
    - {text: "1000円で残るのは　49円→20円", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: その間に、店に来る客の数は、前の年より1割ほど増えていきます。
    reading: その あいだに みせに くる きゃくの かずわ、まえの としより いちわり ほど ふえて いきます。
  - speaker: zundamon
    emotion: thinking
    text: 利益を削って、客を呼んでるのか……。
  - speaker: reimu
    text: 業界トップレベルの利益を出していた西友で、なぜ物差しを替えたら客が増えたのでしょう。
    reading: ぎょうかい とっぷ れべるの りえきお だして いた せいゆうで、なぜ ものさしお かえたら きゃくが ふえたのでしょう。
# ---- 仕組み2：同じ「毎日安い」 ----
- id: ch1_kaigi2
  title: 同じ毎日安い
  background: sy_kaigi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 店長, emotion: normal}
  - {who: honbu, x: 0.7, emotion: normal}
  cuts:
  - speaker: honbu
    emotion: normal
    text: 来月から、トライアルの名物を西友の2店で試します。
  - speaker: zundamon
    emotion: normal
    text: 名物って、なんですか。
  - speaker: honbu
    emotion: happy
    text: '[三元豚|サンゲントン]の[ロースかつ重|ロースカツジュウ]。税込みで299円です。'
  - speaker: zundamon
    emotion: surprised
    text: 299円！？
  - speaker: honbu
    emotion: normal
    text: '[Every Day Low Price|エブリデイ・ロープライス]で、インフレ時代に高い集客力を実現。'
  - speaker: zundamon
    emotion: thinking
    text: 毎日安い、ですか。それなら2008年にも、うちでやりましたよ。
  - speaker: zundamon
    emotion: normal
    text: チラシをやめて、10円下げて。
  - speaker: honbu
    emotion: normal
    text: トライアルも、毎日安いです。
  - speaker: zundamon
    emotion: thinking
    text: ……同じ言葉じゃないですか。
    se: tenten
  - speaker: reimu
    text: 2008年の西友も、毎日安いを掲げて苦しみました。今度は、何が違ったのでしょう。
    reading: にせんはちねんの せいゆうも まいにち やすいお かかげて くるしみました。こんどわ なにが ちがったのでしょう。
  - speaker: reimu
    text: 2000年からの25年で、西友の筆頭株主や親会社の顔ぶれは5回替わりました。
    reading: にせんねんからの にじゅうごねんで、せいゆうの ひっとう かぶぬしや おやがいしゃの かおぶれわ ごかい かわりました。
  - speaker: zundamon
    emotion: thinking
    text: 育てた会社も店も、次々と手放してきました。
  - speaker: zundamon
    emotion: sad
    text: 決めるのは、いつも上の人でしたね。
  - speaker: reimu
    text: トライアルから来た西友の社長は、のちに言います。ウォルマートの傘下にいたから、なじみやすかったと。
    reading: とらいあるから きた せいゆうの しゃちょうわ のちに いいます。うぉるまーとの さんかに いたから なじみやすかったと。
  - speaker: zundamon
    emotion: surprised
    text: ウォルマートの18年が、役に立った……？
# ---- 1963〜2000：生んだもの、手放したもの ----
- id: card1963
  title: ''
  background: sy_card_1963
  bgm: honwaka_puppu
  cuts:
  - speaker: reimu
    text: 1963年。西武流通グループが、チェーンストアの西友ストアーを始めます。
    reading: せんきゅうひゃく ろくじゅうさんねん。せいぶ りゅうつう ぐるーぷが、ちぇーん すとあの せいゆう すとあーお はじめます。
  - speaker: reimu
    text: 率いたのは、のちのセゾングループの堤清二でした。
    reading: ひきいたのわ、のちの せぞん ぐるーぷの つつみ せいじでした。
- id: ch2_shinjin
  title: 西友が生んだもの
  background: sy_uriba
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 新人, emotion: happy}
  - {who: jicho, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1995年4月。のちの店長は、新人として郊外の大型店に入りました。
    reading: せんきゅうひゃく きゅうじゅうごねん しがつ。のちの てんちょうわ、しんじんと して こうがいの おおがたてんに はいりました。
  - speaker: jicho
    emotion: happy
    text: 新人、うちの売り場は広いぞ。服も家電も、食べ物もある。
  - speaker: zundamon
    emotion: happy
    text: なんでもあるんですね。
  - speaker: jicho
    emotion: normal
    text: 物を運ぶ仕組みも、うちは早かった。
  - speaker: jicho
    emotion: normal
    text: 1969年には[府中|ふちゅう]に、小売業で初めての本格的な流通センターを作った。
  - speaker: zundamon
    emotion: normal
    text: 運ぶところから、ですか。
  - speaker: jicho
    emotion: happy
    text: ファミリーマートも[無印良品|ムジルシリョウヒン]も、うちから生まれたんだぞ。
  - speaker: zundamon
    emotion: surprised
    text: コンビニも！？
  - speaker: jicho
    emotion: normal
    text: ファミマの1号店は1973年、埼玉の[狭山|サヤマ]だ。
  - speaker: jicho
    emotion: normal
    text: 無印は1980年に、うちの商品として始まった。
  - speaker: zundamon
    emotion: happy
    text: 先輩。うちって、すごい会社なんですね！
  - speaker: jicho
    emotion: happy
    text: 新人は、まず品出しだ。
    beat: true
  - speaker: reimu
    text: この新人はまだ、育てた子どもを手放す日が来るとは思っていません。
    reading: この しんじんわ まだ、そだてた こどもお てばなす ひが くるとわ おもって いません。
- id: ch2_famima
  title: 子どもを手放す
  background: sy_kyukei
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 社員, emotion: normal}
  - {who: jicho, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1998年2月。西友は、ファミリーマートの株2862万株を、伊藤忠グループに売ります。
    reading: せんきゅうひゃく きゅうじゅうはちねん にがつ。せいゆうわ ふぁみりーまーとの かぶ にせん はっぴゃく ろくじゅうにまんかぶお いとうちゅう ぐるーぷに うります。
  - speaker: jicho
    emotion: thinking
    text: 1350億円だそうだ。[伊藤忠|イトーチュー]が、筆頭株主になる。
  - speaker: zundamon
    emotion: surprised
    text: うちが生んだコンビニを、売っちゃうんですか！？
  - speaker: jicho
    emotion: thinking
    text: セゾングループの不良債権を圧縮して、経営の立て直しを急ぐんだと。
  - speaker: zundamon
    emotion: sad
    text: 育てた子どもで、借金の穴埋め……。
    se: shobon
  - speaker: jicho
    emotion: thinking
    text: '[無印良品|むじるしりょうひん]の会社の株も、大半を売るそうだ。'
  - speaker: reimu
    text: 2000年、西友は日本で初めてのネットスーパーを始めます。同じ年、住友商事が筆頭株主になりました。
    reading: にせんねん、せいゆうわ にほんで はじめての ねっと すーぱーお はじめます。おなじ とし すみとも しょうじが ひっとう かぶぬしに なりました。
  - speaker: zundamon
    emotion: thinking
    text: 持ち主が、替わり始めた……。
# ---- ウォルマート（2002〜2020） ----
- id: card2002
  title: ''
  background: sy_card_2002
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 2002年3月。アメリカの小売りの大手、ウォルマートが西友と提携します。
    reading: にせんにねん さんがつ。あめりかの こうりの おおて、うぉるまーとが せいゆうと ていけい します。
- id: ch3_america
  title: 黒船が来た
  background: sy_america
  cuts:
  - speaker: reimu
    text: ウォルマートは株の6.1％を取り、将来は66.7％まで増やせる取り決めでした。
    reading: うぉるまーとわ かぶの ろくてんいち ぱーせんとお とり、しょうらいわ ろくじゅうろくてんなな ぱーせんとまで ふやせる とりきめでした。
- id: ch3_kurofune
  title: ''
  background: sy_kyukei
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 社員, emotion: normal}
  - {who: jicho, x: 0.7, emotion: surprised}
  cuts:
  - speaker: jicho
    emotion: surprised
    text: 黒船到来だって、どこも大騒ぎだ。
  - speaker: zundamon
    emotion: normal
    text: 黒船って、ペリーの？
  - speaker: jicho
    emotion: angry
    text: 今度はアメリカの、スーパーの船だ！
    se: don
  - speaker: zundamon
    emotion: surprised
    text: スーパーが、海を渡ってきた……。
  - speaker: reimu
    text: 2005年には子会社に。2007年には、残りの株を1株140円で買い集めると発表します。
    reading: にせんごねんにわ こがいしゃに。にせんななねんにわ、のこりの かぶお ひとかぶ ひゃくよんじゅうえんで かいあつめると はっぴょう します。
  - speaker: reimu
    text: このとき西友は約400店。6期続けての赤字が見込まれていました。
