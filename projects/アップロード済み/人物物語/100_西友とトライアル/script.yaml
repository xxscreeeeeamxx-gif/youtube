  - speaker: tsumugi
    emotion: thinking
    text: でも、西友に足りないのはむしろ価格競争力。そう書いた記事もあったの。
  - speaker: tsumugi
    emotion: thinking
    text: 毎日安いを掲げても、毎日安く運べる仕組みが追いつかなかったのね。
- id: ch13_naze
  title: 同じ毎日安いの違い
  background: sy_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: トライアルの毎日安いは、何が違うのだ？
  - speaker: tsumugi
    emotion: normal
    text: レジもカメラもカートも、自分たちで作る[IT|あいてぃー]が土台なの。
  - speaker: tsumugi
    emotion: normal
    text: 撤退した大型スーパーの建物に、居抜きで店を出してきたのも安さの元よ。
  - speaker: tsumugi
    emotion: happy
    text: そして、[ロースかつ重|ロースカツジュウ]みたいな売れる名物を持ち込んだ。
  - speaker: zundamon
    emotion: happy
    text: 10円下げるんじゃなくて、売れる物を持ってきたのだ！
    se: hirameki
  - speaker: zundamon
    emotion: normal
    text: じゃあトライアルになったら、全部安くなるのだ？
  - speaker: tsumugi
    emotion: normal
    text: それも違うの。トライアル自身は2025年6月から、値段の付け方を変えたわ。
  - speaker: tsumugi
    emotion: normal
    text: 安さで呼ぶ品と、価値で選んでもらう品に分けたの。
  - speaker: tsumugi
    emotion: normal
    text: '[粗利率|アラリリツ]は、19.7％から22.1％に上がったわ。'
  - speaker: tsumugi
    emotion: normal
    text: でも客数は一時、前の年の94.6％まで落ちたの。
  - speaker: zundamon
    emotion: surprised
    text: トライアルでも、客が減ったことがあるのか！
  - speaker: tsumugi
    emotion: normal
    text: 品質が上がった、下がったを測った資料は見つからないわ。
  - speaker: tsumugi
    emotion: normal
    text: お墨付きは残って、トライアルの店でも売られてるの。
  - speaker: zundamon
    emotion: thinking
    text: 3826億円は、高い買い物だったのか？
  - speaker: tsumugi
    emotion: thinking
    text: トライアルの1年の営業利益211億円の、約18年分ね。
  - speaker: tsumugi
    emotion: thinking
    text: 買ったときに生まれた、のれんの償却は1年で153億円。
  - speaker: tsumugi
    emotion: thinking
    text: 西友の1年の営業利益138億円より、大きいの。
  - speaker: zundamon
    emotion: surprised
    text: '[1日|いちにち]あたり、約4200万円……！'
  - speaker: tsumugi
    emotion: normal
    text: 一方でグループの営業利益は、過去最高だったわ。
  - speaker: tsumugi
    emotion: normal
    text: トライアルの[永田|ナガタ]社長は、ポジティブなディールであったとしか思っていないって。
  - speaker: tsumugi
    emotion: thinking
    text: 高かったか安かったかは、まだ決まっていないの。
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
- id: ch14_chui
  title: 楽天ポイントはいつまで
  background: sy_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 西友の店で楽天ポイントカードが使えるのは、2027年[4月4日|シガツヨッカ]まで。
    telops:
    - {text: "西友の店の楽天ポイントカード　2027年4月4日まで", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: ポイントが増える日などのキャンペーンは、2026年12月末までに順に終わるの。
  - speaker: zundamon
    emotion: surprised
    text: '[増量日|ゾウリョウビ]も、終わるのか！？'
  - speaker: tsumugi
    emotion: normal
    text: 税抜きで毎週5000円買う人なら、1年で約1300ポイントになるわ。
  - speaker: tsumugi
    emotion: normal
    text: 貯めたポイントは、終わる前に使い道を考えておいてね。
  - speaker: tsumugi
    emotion: normal
    text: ただ、西友ネットスーパーでは楽天ポイントが続くの。
  - speaker: zundamon
    emotion: normal
    text: ネットは続くのか。
  - speaker: tsumugi
    emotion: normal
    text: 2027年1月以降に、トライアルの会員プログラムの新しいサービスが始まる予定。
  - speaker: tsumugi
    emotion: thinking
    text: 中身は、まだ発表されてないわ。
  - speaker: zundamon
    emotion: thinking
    text: 近所の西友も、トライアル西友になるのか？
  - speaker: tsumugi
    emotion: normal
    text: 大型店73店のうち30店を、3年で変える計画よ。全部じゃないの。
  - speaker: tsumugi
    emotion: normal
    text: 変わる店は、いったん閉まるわ。[花小金井|はなこがねい]店は、約1か月だったの。
  - speaker: tsumugi
    emotion: normal
    text: 閉まる店もあるから、近くの店の貼り紙は見ておいてね。
  - speaker: zundamon
    emotion: happy
    text: 貼り紙は、ちゃんと読むのだ。
# ---- 締め（店長の目で） ----
- id: ch15_mise
  title: ''
  background: sy_reji
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 店長, emotion: normal}
  - {who: kyaku, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2026年10月。あのサービスカウンターです。
    reading: にせんにじゅうろくねん じゅうがつ。あの さーびす かうんたーです。
  - speaker: kyaku
    emotion: normal
    text: 店長さん。ポイントが終わったら、どうやってお客を呼ぶの？
  - speaker: zundamon
    emotion: normal
    text: 毎日安い、です。
  - speaker: kyaku
    emotion: thinking
    text: それ、2008年にも聞いたわよ。
    beat: true
  - speaker: zundamon
    emotion: happy
    text: 今度は、安くできる仕掛けごとです。
  - speaker: zundamon
    emotion: happy
    text: それと、[ロースかつ重|ロースカツジュウ]があります。
  - speaker: kyaku
    emotion: happy
    text: じゃあ、明日も来るわ。
  - speaker: reimu
    text: この店も、いずれトライアル西友に変わります。物差しを替えた老舗の転換は、まだ途中です。
    reading: この みせも いずれ とらいある せいゆうに かわります。ものさしお かえた しにせの てんかんわ、まだ とちゅうです。
- id: shime
  title: ''
  background: sy_heya
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: ボク、[ロースかつ重|ロースカツジュウ]で楽天ポイントを貯めるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 1個で1ポイントね。
  - speaker: zundamon
    emotion: happy
    text: '[4月4日|シガツヨッカ]まで、毎日食べるのだ！'
  - speaker: tsumugi
    emotion: thinking
    text: 150ポイント貯まるころには、[かつ重|カツジュウ]を150個食べてるわよ。
  - speaker: zundamon
    emotion: sad
    text: '[かつ重|カツジュウ]だけに、おなかが重いのだ……。'
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: あなたも近くの西友の貼り紙と、ポイントの残りを見ておいてね。
  - speaker: tsumugi
    emotion: thinking
    text: 利益より、客を物差しにした西友。答えが出るのは、これからね。
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
