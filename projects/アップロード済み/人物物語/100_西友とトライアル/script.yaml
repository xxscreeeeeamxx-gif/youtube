meta:
  title: 「地域でいちばん安いお店をめざします」の西友、17年後に九州のトライアルの下で客が戻る【ずんだもん解説】
  slug: seiyu-trial
  hook_line: 大株主が25年で5回替わった西友。なぜトライアルの下で客が戻ったのか。
  summary: 2026年10月、西友は楽天ポイントカードの終了を知らせました。25年で筆頭株主や親会社の顔ぶれが5回替わり、いまの持ち主は九州のディスカウント店トライアル。新しい持ち主は、店の物差しを「利益率」から「客数」に替えます。1995年入社の店長の目で、ウォルマートの「毎日安い」、ファンドと楽天の時代、今の売場までを、会社の発表と報道をもとにした再現ドラマでたどります。（2026年10月時点）
  sources:
  - トライアルホールディングス「株式会社西友の株式の取得（完全子会社化）に関するお知らせ」（2025年3月5日） https://trial-holdings.inc/news/release/67c7e56725df23ba67b568c5/
  - トライアルホールディングス「本決算説明資料 2026年6月期」（2026年8月13日） https://pdf.irpocket.com/C141A/xoA3/MuFf/T9TP/zgQJ.pdf
  - トライアルホールディングス 適時開示「株式会社西友の一部不動産流動化に伴う子会社（孫会社）間の吸収分割…に関するお知らせ」（2026年8月21日） https://pdf.irpocket.com/C141A/xoA3/tx0r/Mj8g/hOsH.pdf
  - 西友「楽天ポイントカードのサービス終了に関するお知らせ」（2026年10月1日） https://www.seiyu.co.jp/assets/images/RakutenPoints_ServiceEnd_261001.pdf
  - KKR「KKR、西友株式をトライアルホールディングスへ譲渡」（2025年3月5日） https://www.kkr.com/content/dam/kkr/country-sites/jp/press-release/2025/20250305-press-release-regarding-seiyu.pdf
  - 流通ニュース「西友／他社チラシ価格照合など低価格路線を宣言」（2008年12月3日） https://www.ryutsuu.biz/backnumber/strategy/%E8%A5%BF%E5%8F%8B%EF%BC%8F%E4%BB%96%E7%A4%BE%E3%83%81%E3%83%A9%E3%82%B7%E4%BE%A1%E6%A0%BC%E7%85%A7%E5%90%88%E3%81%AA%E3%81%A9%E4%BD%8E%E4%BE%A1%E6%A0%BC%E8%B7%AF%E7%B7%9A%E3%82%92%E5%AE%A3%E8%A8%80.html
