# seiyu-trial 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 店長・新人・社員・主任 / label: 永田洋幸・大久保社長・西友社長 など）とテロップは表示専用なのでタグを付けていない。
# 「西友」は3つの辞書がそろって セイユウ と読むので台帳に入れず、セリフの初出（茶番）だけタグを付けた。
# 見直し（2026-10-23）で、セリフのタグの読みを一部カタカナにした（ロースカツジュウ・カツジュウ・シガツヨッカ・
# サンゲントン・ニシオギクボ・ゾウリョウビ・イトーチュー・サヤマ・ムジルシリョウヒン・アラリリツ・英字の略語）。
# 「これは[株主（KKR）|カブヌシ]が…」は、括弧の KKR を読ませない。台帳の読みは発音が同じなのでそのまま。
