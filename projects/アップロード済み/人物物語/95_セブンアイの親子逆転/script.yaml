  - speaker: reimu
    text: 伊藤がなぜ承諾しなかったのか。本人の公の説明は、見つかっていません。
    reading: いとうが なぜ しょうだく しなかったのか。ほんにんの おおやけの せつめいわ みつかって いません。
  - speaker: reimu
    text: 20年前の取材の言葉どおり、鈴木はこの場所を去ります。
    reading: にじゅうねん まえの しゅざいの ことば どおり、すずきわ この ばしょお さります。
