    telops:
    - {text: "鈴木　しかし世代が変わった", size: lg, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: kisha
    emotion: thinking
    text: 世代……。
  - speaker: reimu
    text: 鈴木は会見で、井阪から1人でセブンの成長を支えてきたという趣旨の発言があったと述べました。
    reading: すずきわ かいけんで、いさかから ひとりで せぶんの せいちょうお ささえて きたと いう しゅしの はつげんが あったと のべました。
  - speaker: reimu
    text: 井阪は、この発言を否定しています。
    reading: いさかわ この はつげんお ひてい して います。
  - speaker: kisha
    emotion: thinking
    text: ……どちらの記憶が、正しいのか。
  - speaker: kisha
    emotion: normal
    text: 後継は、どなたに。
  - speaker: zundamon
    emotion: normal
    text: 後継指名は、しない。
  - speaker: kisha
    emotion: surprised
    text: 誰も、ですか。
  - speaker: zundamon
    emotion: normal
    text: しない。
  - speaker: zundamon
    emotion: sad
    text: 引退するのは私の[不徳|ふとく]のいたすところ。
  - speaker: zundamon
    emotion: sad
    text: こんな説明をしなければならないのはざんきに[堪えない|たえない]。
  - speaker: reimu
    text: 同じ会見で、当時の社長は、名誉会長の伊藤から人事案をはっきり断られたと説明しました。
