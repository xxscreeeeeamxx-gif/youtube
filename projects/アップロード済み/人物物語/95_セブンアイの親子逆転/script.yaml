  - speaker: torishimari
    emotion: normal
    text: 取締役は15人。可決には、8人の賛成が要ります。
  - speaker: torishimari
    emotion: normal
    text: 投票は、無記名です。
  - speaker: zundamon
    emotion: normal
    text: 始めてくれ。
  - speaker: torishimari
    emotion: thinking
