scenes:
# ---- 先出し（2026年10月8日の決算会見） ----
- id: co_kaiken
  title: ''
  background: sv_kaiken
  bgm: serious
  stage:
  - {who: akutsu, x: 0.28, flip: true, emotion: normal}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2026年10月8日。セブン-イレブン・ジャパンの社長が、決算の会見に臨みます。
    reading: にせんにじゅうろくねん じゅうがつ ようか。せぶんいれぶん じゃぱんの しゃちょうが けっさんの かいけんに のぞみます。
  - speaker: kisha
    emotion: normal
    text: '[上期|かみき]の営業利益は9.3%減。[下期|しもき]は、どう立て直しますか。'
  - speaker: akutsu
    emotion: normal
    text: やや高いというイメージがある我々の売り場に対して、
  - speaker: akutsu
    emotion: normal
    text: 食卓のニーズに[資する|しする]商品を提供していく。
    telops:
    - {text: "阿久津社長　やや高いというイメージ", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: kisha
    emotion: surprised
    text: やや高い、と……。
  - speaker: reimu
    text: 持ち込むのは、イトーヨーカドーなどで売ってきた安いPB、セブン・ザ・プライスです。
    reading: もちこむのわ いとーよーかどーなどで うってきた やすい ぴーびー、せぶん ざ ぷらいすです。
  - speaker: reimu
    text: 50年あまり前。このコンビニは、そのヨーカ堂でやっていけるのかと言われた事業でした。
    reading: ごじゅうねん あまり まえ。この こんびにわ その よーかどうで やっていけるのかと いわれた じぎょうでした。
  - speaker: reimu
    text: 子は、なぜ親を超え、親を手放すまでになったのでしょうか。
    reading: こわ なぜ おやお こえ、おやお てばなす までに なったのでしょうか。
# ---- 茶番（今の部屋） ----
- id: hook
  title: ''
  background: sv_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 今日もコンビニのおにぎりなのだ。
  - speaker: tsumugi
    emotion: normal
    text: ヨーカドーで買うんじゃなかったの？
  - speaker: zundamon
    emotion: sad
    text: 駅前のヨーカドー、閉まったのだ。
  - speaker: tsumugi
    emotion: thinking
    text: そのヨーカドーを含む事業を、[セブン&アイ|せぶんあんどあい]は去年売ったのよ。
  - speaker: zundamon
    emotion: surprised
    text: セブンが、ヨーカドーを！？
  - speaker: tsumugi
    emotion: normal
    text: '[ヨーカ堂|よーかどう]は、セブンの親だったのにね。'
  - speaker: zundamon
    emotion: angry
    text: 子どもが、親を売ったのだ！？
    se: bikkuri
  - speaker: tsumugi
    emotion: thinking
    text: 株は35%、残してるけどね。
    beat: true
# ---- 0:50〜 仕組み：稼ぐ子と、株を持つ親（1996年の取材） ----
- id: op_shuzai
  title: 稼ぐ子と、株を持つ親
  background: sv_kaigi
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 鈴木敏文, emotion: normal}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1996年。イトーヨーカ堂の社長で、セブン-イレブンを育てた鈴木敏文が、雑誌の取材を受けます。
    reading: せんきゅうひゃく きゅうじゅうろくねん。いとーよーかどうの しゃちょうで せぶんいれぶんお そだてた すずき としふみが、ざっしの しゅざいお うけます。
  - speaker: kisha
    emotion: normal
    text: 収益力で見れば、[セブン-イレブン|せぶんいれぶん]が親の[ヨーカ堂|よーかどう]をしのぎましたね。
  - speaker: zundamon
    emotion: normal
    text: 営業利益は、1994年2月期に抜いた。
  - speaker: kisha
    emotion: surprised
    text: 子が、親を。
  - speaker: kisha
    emotion: happy
    text: ライバル会社の幹部は、こう言ってますよ。
  - speaker: kisha
    emotion: happy
    text: 伊藤[ヨーカ堂|よーかどう]が、鈴木[ヨーカ堂|よーかどう]になった。
    telops:
    - {text: "ライバル幹部　伊藤ヨーカ堂が鈴木ヨーカ堂に", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: kisha
    emotion: normal
    text: 実際どうなんです。もう、鈴木さんの会社では？
  - speaker: zundamon
    emotion: angry
    text: 違う。
  - speaker: kisha
    emotion: normal
    text: '[伊藤家|いとうけ]は、[伊藤興業|いとうこうぎょう]などと合わせて株の約15%を持つオーナーですもんね。'
  - speaker: kisha
    emotion: thinking
    text: 大事な決定は、今も伊藤さんの判断を仰ぐそうで。
  - speaker: zundamon
    emotion: happy
    text: うちのおやじは、仕事を任せてくれる。
  - speaker: kisha
    emotion: surprised
    text: おやじ。
  - speaker: zundamon
    emotion: normal
    text: 僕は、あの人の下だから仕事ができている。
  - speaker: kisha
    emotion: thinking
    text: 稼ぐのは子のセブン。株を持つのは親の[ヨーカ堂|よーかどう]と、[伊藤家|いとうけ]。
  - speaker: kisha
    emotion: thinking
    text: 率いるのは、雇われ社長の鈴木さん。ややこしいですね。
  - speaker: zundamon
    emotion: angry
    text: ややこしくない。それで回っている。
    se: hammer
  - speaker: kisha
    emotion: normal
    text: では、もし伊藤さんに反対されたら？
  - speaker: zundamon
    emotion: thinking
    text: オーナーが、僕のやり方がどうしても気に食わないとなれば
  - speaker: zundamon
    emotion: normal
    text: 僕はいつでも、この場所からいなくなる。
    beat: true
    telops:
    - {text: "鈴木　僕はいつでも、この場所からいなくなる", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: kisha
    emotion: surprised
    text: ……いなくなる。
  - speaker: reimu
    text: このとき、まだ誰も、この言葉が20年後に本当になるとは思っていません。
    reading: この とき まだ だれも、この ことばが にじゅうねんごに ほんとうに なるとわ おもって いません。
- id: op_tsunahiki
  title: 稼ぐ子の綱引き
  background: sv_gendai
  cuts:
  - speaker: reimu
    text: このねじれに、のちに物言う株主と外国の買い手が手を伸ばし、創業家も動きます。
    reading: この ねじれに のちに ものいう かぶぬしと がいこくの かいてが てお のばし、そうぎょうけも うごきます。
    slide:
      title: 稼ぐ子を引っぱる綱
      bullets:
      - 創業家と、雇われの経営者
      - 物言う株主（米国のファンド）
      - 外国からの買収提案
  - speaker: reimu
    text: 綱引きの末の2025年。ヨーカ堂を含む事業は、ファンドに売られます。
    reading: つなひきの すえの にせんにじゅうごねん。よーかどうお ふくむ じぎょうわ ふぁんどに うられます。
  - speaker: reimu
    text: 子は、どうやって親を超えたのか。始まりは、1972年の夏です。
    reading: こわ どうやって おやお こえたのか。はじまりわ せんきゅうひゃく ななじゅうにねんの なつです。
# ---- 1972年 ハワイ ----
- id: card1972
  title: ''
  background: sv_card_1972
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 1972年7月、ハワイ。のちに鈴木が語った、ヨーカ堂の創業者の伊藤雅俊とのやりとりです。
    reading: せんきゅうひゃく ななじゅうにねん しちがつ、はわい。のちに すずきが かたった よーかどうの そうぎょうしゃ いとう まさとしとの やりとりです。
  - speaker: reimu
    text: 鈴木はこのとき39歳。本の問屋から転職して約9年で、売り場に立ったことはありませんでした。
    reading: すずきわ この とき さんじゅうきゅうさい。ほんの とんやから てんしょく して やく くねんで うりばに たった ことわ ありませんでした。
- id: ch1_hawaii
  title: あんなものやっていけるのか
  background: sv_yakuin
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 鈴木敏文, emotion: normal}
  - {who: ito, x: 0.7, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: おやじさん。日本でも、コンビニをやらせてください。
  - speaker: ito
    emotion: thinking
    text: あれは日本の[10銭|じっせん]ストアか雑貨屋に毛の生えたみたいなものだな。
  - speaker: zundamon
    emotion: surprised
    text: 雑貨屋に、毛。
    se: manuke
  - speaker: ito
    emotion: thinking
    text: あんなものやっていけるのか。
    telops:
    - {text: "伊藤雅俊　あんなものやっていけるのか", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#CC0000", anim: up}
  - speaker: zundamon
    emotion: normal
    text: おやじさんがそこまで乗り気でないならば、断ってきますよ。
  - speaker: ito
    emotion: thinking
    text: 今、ここでダメというのももったいないな。
  - speaker: ito
    emotion: normal
    text: そこはあんたたちがよく考えて……。
  - speaker: zundamon
    emotion: surprised
    text: ……え？
  - speaker: zundamon
    emotion: happy
    text: おやじは100%反対ではない。3割程度は脈があるかもしれない。
  - speaker: reimu
    text: つまり、7割は反対です。
    reading: つまり ななわりわ はんたいです。
    beat: true
  - speaker: reimu
    text: この3割の脈から生まれた店が、約20年後、利益で親を抜きます。
    reading: この さんわりの みゃくから うまれた みせが、やく にじゅうねんご りえきで おやお ぬきます。
# ---- 1973年 ダラス ----
- id: ch1_dallas
  title: 冗談ではない
  background: sv_kaigi
  bgm: serious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 鈴木敏文, emotion: normal}
  - {who: tsuyaku, x: 0.52, emotion: normal}
  - {who: southland, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1973年7月、アメリカのダラス。本家のセブン-イレブンを営む、サウスランド社との最後の交渉です。
    reading: せんきゅうひゃく ななじゅうさんねん しちがつ、あめりかの だらす。ほんけの せぶんいれぶんお いとなむ さうすらんどしゃとの さいごの こうしょうです。
  - speaker: southland
    emotion: normal
    text: ロイヤルティーは、売上高の1%。これは譲れません。
  - speaker: tsuyaku
    emotion: normal
    text: 売上の1%を、払ってほしいそうです。
  - speaker: zundamon
    emotion: thinking
    text: 千円売れるたびに、10円が海を渡るのか。
  - speaker: zundamon
    emotion: angry
    text: 冗談ではない。こんな条件では交渉にならない！
    se: don
  - speaker: reimu
    text: 鈴木はのちに新聞の連載で、テーブルをたたいて一歩も退かなかったと書いています。
    reading: すずきわ のちに しんぶんの れんさいで てーぶるお たたいて いっぽも ひかなかったと かいて います。
  - speaker: southland
    emotion: thinking
    text: ……0.6%。これで、どうだ。
  - speaker: tsuyaku
    emotion: happy
    text: 1%から、0.6%まで下がりました！
    telops:
    - {text: "ロイヤルティー　1%→0.6%", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: happy
    text: 千円で、6円。
  - speaker: reimu
    text: このとき払う側だった日本が、18年後には本家の株を買います。
    reading: この とき はらう がわだった にほんが、じゅうはちねんごにわ ほんけの かぶお かいます。
# ---- 1973〜1974年 1号店 ----
- id: ch1_tegami
  title: 最初から加盟店で
  background: sv_yakuin
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 鈴木敏文, emotion: normal}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1973年11月、ヨーカ堂はヨークセブンを作ります。今のセブン-イレブン・ジャパンです。
    reading: せんきゅうひゃく ななじゅうさんねん じゅういちがつ、よーかどうわ よーくせぶんお つくります。いまの せぶんいれぶん じゃぱんです。
  - speaker: shain
    emotion: normal
    text: 最初の何店かは、[直営|ちょくえい]でやりましょう。
  - speaker: zundamon
    emotion: normal
    text: いや。最初から、加盟店でやる。
  - speaker: shain
    emotion: surprised
    text: 1号店からですか！？
  - speaker: zundamon
    emotion: normal
    text: 1号店からだ。
  - speaker: shain
    emotion: thinking
    text: 1号店から失敗したら、どうするんですか。
  - speaker: zundamon
    emotion: normal
    text: そのときは、僕が責任を取る。
  - speaker: shain
    emotion: surprised
    text: 社長でもないのに！？
    beat: true
  - speaker: shain
    emotion: thinking
    text: ……あの、手紙が来てます。新聞を見た、[江東区|こうとうく]の酒屋さんからです。
  - speaker: shain
    emotion: happy
    text: やってみたい、と。
  - speaker: zundamon
    emotion: happy
    text: 来たか。
  - speaker: reimu
    text: 手紙の主は、江東区の酒屋の青年、山本憲司。20代前半でした。
    reading: てがみの ぬしわ こうとうくの さかやの せいねん やまもと けんじ。にじゅうだい ぜんはんでした。
- id: ch1_yakusoku
  title: ''
  background: sv_conbini_1974
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 鈴木敏文, emotion: normal}
  - {who: tenshu, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 鈴木は、この青年にこう約束しました。
    reading: すずきわ この せいねんに こう やくそく しました。
  - speaker: zundamon
    emotion: happy
    text: ぜひ一緒にやりましょう。
  - speaker: zundamon
    emotion: normal
    text: もし3年後に失敗していたら、私が責任を持ってお店を元通りにしてお返しします。
- id: card1974
  title: ''
  background: sv_card_1974
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 1974年5月15日。東京の豊洲に、1号店が開きます。酒屋を改装した、約20坪の店です。
    reading: せんきゅうひゃく ななじゅうよねん ごがつ じゅうごにち。とうきょうの とよすに いちごうてんが ひらきます。さかやお かいそう した やく にじゅっつぼの みせです。
- id: ch1_kaiten
  title: 最初に売れたもの
  background: sv_conbini_1974
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 鈴木敏文, emotion: happy}
  - {who: kyaku, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 開店だ。……あいにくの[雨模様|あまもよう]だが。
  - speaker: kyaku
    emotion: normal
    text: すみません。これ、ください。
  - speaker: zundamon
    emotion: happy
    text: 最初のお客様だ。何を……。
  - speaker: zundamon
    emotion: surprised
    text: サングラス！？
    se: bikkuri
  - speaker: zundamon
    emotion: thinking
    text: ……この[雨模様|あまもよう]の日に。
    beat: true
  - speaker: reimu
    text: 最初に売れたのは、800円のサングラス。鈴木は、今も忘れられないと書いています。
    reading: さいしょに うれたのわ はっぴゃくえんの さんぐらす。すずきわ いまも わすれられないと かいて います。
  - speaker: reimu
    text: この20坪の店から、27年後に国内の小売りの1位が生まれます。
    reading: この にじゅっつぼの みせから、にじゅうななねんごに こくないの こうりの いちいが うまれます。
# ---- 1982年 業革とPOS ----
- id: card1982
  title: ''
  background: sv_card_1982
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1982年。鈴木は親のヨーカ堂で業務改革を始め、10月には子のセブン-イレブンがPOSの導入を始めます。
    reading: せんきゅうひゃく はちじゅうにねん。すずきわ おやの よーかどうで ぎょうむ かいかくお はじめ、じゅうがつにわ こ の せぶんいれぶんが ぽすの どうにゅうお はじめます。
- id: ch2_gyokaku
  title: 売れない品は減らす
  background: sv_gms
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 鈴木敏文, emotion: normal}
  - {who: kanbu, x: 0.7, emotion: thinking}
  cuts:
  - speaker: kanbu
    emotion: thinking
    text: 創業以来はじめての減益です……。
  - speaker: kanbu
    emotion: happy
    text: でも、うちの自慢は[品数|しなかず]の多さです。
  - speaker: zundamon
    emotion: normal
    text: 売れない品は、減らす。
  - speaker: kanbu
    emotion: surprised
    text: 棚が、さびしくなります！
  - speaker: zundamon
    emotion: normal
    text: 売れない品は、棚で眠っているだけだ。
  - speaker: kanbu
    emotion: thinking
    text: ……でも[品数|しなかず]は、うちの看板で。
  - speaker: zundamon
    emotion: angry
    text: 看板より、売れる品だ。
  - speaker: zundamon
    emotion: normal
    text: 何がいつ何個売れたか。[セブン-イレブン|せぶんいれぶん]は、レジでつかもうとしている。
  - speaker: kanbu
    emotion: thinking
    text: 子会社のやり方を、親がまねるんですか……。
    beat: true
# ---- 1991年 本家を買う ----
- id: ch2_honke
  title: 本家を買う
  background: sv_yakuin
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 鈴木敏文, emotion: normal}
  - {who: ito, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1991年3月。経営が破綻した本家のサウスランド社の株を、ヨーカ堂とセブン-イレブンで約7割買います。
    reading: せんきゅうひゃく きゅうじゅういちねん さんがつ。けいえいが はたんした ほんけの さうすらんどしゃの かぶお よーかどうと せぶんいれぶんで やく ななわり かいます。
  - speaker: zundamon
    emotion: normal
    text: 4億ドル以上は投資しない。
  - speaker: zundamon
    emotion: normal
    text: 失敗したらなくなるが、授業料として考えてほしい。
  - speaker: reimu
    text: 鈴木は、こう言って伊藤を説き伏せたと説明しています。伊藤の説明は、少し違います。
    reading: すずきわ こう いって いとうお ときふせたと せつめい して います。いとうの せつめいわ すこし ちがいます。
  - speaker: ito
    emotion: normal
    text: '[セブン-イレブン|せぶんいれぶん]というブランドを守るために救済した。'
  - speaker: reimu
    text: 雑誌は2人の関係を、確執ではなく緊張と書きました。伊藤は、大事なことへの拒否権を持ち続けます。
    reading: ざっしわ ふたりの かんけいお かくしつでわ なく きんちょうと かきました。いとうわ だいじな ことえの きょひけんお もちつづけます。
# ---- 1992〜2001年 子が親を抜く ----
- id: ch2_gyakuten
  title: 子が親を抜く
  background: sv_kaigi
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 鈴木敏文, emotion: normal}
  - {who: torishimari, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1992年10月。総会屋への利益供与事件で伊藤がヨーカ堂の社長を辞め、副社長の鈴木が継ぎます。
    reading: せんきゅうひゃく きゅうじゅうにねん じゅうがつ。そうかいやえの りえき きょうよ じけんで いとうが よーかどうの しゃちょうお やめ、ふくしゃちょうの すずきが つぎます。
  - speaker: torishimari
    emotion: normal
    text: 1994年2月期の決算です。
  - speaker: torishimari
    emotion: surprised
    text: '[セブン-イレブン|せぶんいれぶん]の営業利益が、[ヨーカ堂|よーかどう]を上回りました！'
    background: sv_kaigi_up
    telops:
    - {text: "1994年2月期　子が親を抜く", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: normal
    text: ……そうか。
  - speaker: torishimari
    emotion: happy
    text: 子会社が、親会社より稼いでます！
  - speaker: torishimari
    emotion: surprised
    text: ……あ。ここ、親会社の会議でした。
    beat: true
  - speaker: torishimari
    emotion: thinking
    text: '[ヨーカ堂|よーかどう]のほうは、前の年の839億円が最高でしたが……。'
  - speaker: torishimari
    emotion: thinking
    text: ……そこから、下り坂です。
    beat: true
  - speaker: reimu
    text: 1996年。業務改革の会議は、毎週火曜に開かれていました。
    reading: せんきゅうひゃく きゅうじゅうろくねん。ぎょうむ かいかくの かいぎわ まいしゅう かようびに ひらかれて いました。
  - speaker: zundamon
    emotion: angry
    text: そんな簡単なことを、なぜしていないんだ。
  - speaker: zundamon
    emotion: angry
    text: '[セブン-イレブン|せぶんいれぶん]では、先週からやっているぞ。'
    se: tsukkomi
  - speaker: reimu
    text: 約160人の幹部が、黙りました。
    reading: やく ひゃくろくじゅうにんの かんぶが だまりました。
  - speaker: torishimari
    emotion: thinking
    text: ……先週から。
    beat: true
  - speaker: reimu
    text: 2001年2月、チェーン全店の売上で国内の小売業の1位に。4月には、のちのセブン銀行も作ります。
    reading: にせんいちねん にがつ、ちぇーん ぜんてんの うりあげで こくないの こうりぎょうの いちいに。しがつにわ のちの せぶん ぎんこうも つくります。
# ---- 2005年 親と子が兄弟に（今の部屋） ----
- id: ch2_kaisetsu
  title: 薄い財布と分厚い財布
  background: sv_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 子が親より稼ぐと、何が困るの？
  - speaker: tsumugi
    emotion: thinking
    text: 親が、安く買われるかもしれないの。
  - speaker: tsumugi
    emotion: normal
    text: 2004年の末よ。親の[ヨーカ堂|よーかどう]は、子の[セブン-イレブン|せぶんいれぶん]の株を半分ほど持ってたの。
  - speaker: tsumugi
    emotion: normal
    text: 研究者の計算よ。[ヨーカ堂|よーかどう]の値段から子会社などの株の分を引くと、残りは3643億円。
  - speaker: tsumugi
    emotion: normal
    text: 子の[セブン-イレブン|せぶんいれぶん]の値段は、2兆6579億円。
  - speaker: zundamon
    emotion: surprised
    text: 親が、子の14%しかないのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 薄い財布の中に、分厚い財布が半分入ってる感じね。
  - speaker: zundamon
    emotion: happy
    text: 薄いほうごと買えば、分厚いほうも付いてくるのだ！
  - speaker: tsumugi
    emotion: angry
    text: おまけ付きのお菓子みたいに言わないで。
    se: tsukkomi
  - speaker: tsumugi
    emotion: thinking
    text: 研究者も、その危険があったと見てるの。
  - speaker: tsumugi
    emotion: normal
    text: 2005年9月、3社は持株会社の[セブン&アイ|せぶんあんどあい]・ホールディングスの下にそろうの。
  - speaker: zundamon
    emotion: surprised
    text: 親と子が、同じ親の下の兄弟になったのか。
  - speaker: tsumugi
    emotion: happy
    text: 家系図に描いたら、大混乱ね。
  - speaker: zundamon
    emotion: thinking
    text: お年玉は、誰が誰にあげるのだ？
  - speaker: tsumugi
    emotion: angry
    text: そこは考えなくていいの。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 会社の発表は、目的を変化への対応と基本の徹底と書いてるわ。
  - speaker: tsumugi
    emotion: thinking
    text: 買収の心配には、触れてないの。
  - speaker: tsumugi
    emotion: normal
    text: 研究者は、この形で鈴木さんの権限が絶対的なものになったと見てる。
  - speaker: zundamon
    emotion: thinking
    text: 全部の上に、鈴木さん。
  - speaker: tsumugi
    emotion: thinking
    text: その上にも、株主がいるのよ。
# ---- 2015〜2016年 ファンドの手紙と、井阪への打診 ----
