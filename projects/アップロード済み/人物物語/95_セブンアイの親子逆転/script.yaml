    background: sv_kaigi_akaji
  - speaker: reimu
    text: 株価も、この日の午前に一時9%安まで売られています。
    reading: かぶかも この ひの ごぜんに いちじ きゅうぱーせんと やすまで うられて います。
- id: ch4_kaiken
  title: 世代が変わった
  background: sv_kaiken
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 鈴木敏文, emotion: thinking}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
