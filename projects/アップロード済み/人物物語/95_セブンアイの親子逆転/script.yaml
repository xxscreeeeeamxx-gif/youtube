  - speaker: torishimari
    emotion: normal
    text: '[ヨーカ堂|よーかどう]はグループから離れ、独立した企業として経営を見直すべきだと。'
  - speaker: zundamon
    emotion: thinking
    text: ……[ヨーカ堂|よーかどう]を、切り離せと。
  - speaker: torishimari
    emotion: thinking
    text: サード・ポイントです。百貨店などの買収も、誤りだったと。
  - speaker: zundamon
    emotion: thinking
    text: ……外からも、綱が伸びてきたか。
    beat: true
- id: ch3_dashin
