# ---- 論争の章 ----
- id: ch8_ronso
  title: コンビニはもう飽和なのか
  background: sv_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、ネットで見たのだ！ コンビニは、もう飽和してるって！
  - speaker: tsumugi
    emotion: normal
    text: 数字で見てみよう。国内の[セブン-イレブン|せぶんいれぶん]は、2026年8月末で2万1748店。
  - speaker: tsumugi
    emotion: normal
    text: 今年度は200店増やす計画で、[上期|かみき]に増えたのは26店なの。
  - speaker: zundamon
    emotion: surprised
    text: 26店！？
  - speaker: zundamon
    emotion: thinking
    text: 200のつもりが、26……。
  - speaker: tsumugi
    emotion: normal
    text: 新しく開いたのは210店。差し引くと、180店あまりを閉めてるのね。
  - speaker: zundamon
    emotion: thinking
    text: 開けて、閉めて……。
  - speaker: tsumugi
    emotion: normal
    text: 閉めた分だけ開けてるから、数だけで飽和とは言えないの。
  - speaker: tsumugi
    emotion: normal
    text: 9月の既存店は、客数が4.1%減。売上は、0.5%増えたわ。
  - speaker: zundamon
    emotion: thinking
    text: お客さんが減って、売上が増えた？
  - speaker: tsumugi
    emotion: normal
    text: 1回の買い物の額が、上がってるってことね。
  - speaker: zundamon
    emotion: angry
    text: つまり、値上がりなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: そこは言い切れないの。会社が言ってるのは、高いというイメージよ。
  - speaker: tsumugi
    emotion: normal
    text: 2024年には当時の社長が、低価格の訴求が半年遅れたと話してるわ。
  - speaker: tsumugi
    emotion: normal
    text: 会社の1万人の調査では、63.9%がコンビニは割高と答えたそうよ。
  - speaker: zundamon
    emotion: surprised
    text: ほぼ3人に2人！？
  - speaker: tsumugi
    emotion: thinking
    text: 当時の社長は、価格が高いというイメージを[払拭|ふっしょく]すると言ってたわ。
  - speaker: zundamon
    emotion: thinking
    text: じゃあヨーカドーは、セブンのお荷物だったの？
  - speaker: tsumugi
    emotion: normal
    text: 研究者が、2005年度から2017年度までを足し合わせてるわ。
  - speaker: tsumugi
    emotion: normal
    text: コンビニの営業利益は、約2兆8000億円。スーパーは、約2700億円。
  - speaker: zundamon
    emotion: surprised
    text: 10倍！？
  - speaker: tsumugi
    emotion: normal
    text: なのにスーパーへの設備投資は、約6800億円。稼いだ額より多いの。
  - speaker: zundamon
    emotion: angry
    text: 子が稼いで、親が使う家なのだ！
  - speaker: tsumugi
    emotion: normal
    text: 研究者も、コンビニの超過利益がスーパーや百貨店に投じられてきたと見てるわ。
  - speaker: tsumugi
    emotion: thinking
    text: ただお[金|かね]の流れを正確に追った分析ではないと、本人も断ってるの。
  - speaker: zundamon
    emotion: thinking
    text: お荷物とまでは、言い切れないのか。
  - speaker: tsumugi
    emotion: normal
    text: 会社の説明では、[ヨーカ堂|よーかどう]は2026年2月期に単体で6年ぶりの最終黒字よ。
  - speaker: tsumugi
    emotion: normal
    text: 会長の[真船|まふね]さんは、当たり前のことがないがしろにされていたと話してる。
  - speaker: zundamon
    emotion: happy
    text: 当たり前のこと……ボクの部屋の掃除みたいなものなのだ。
  - speaker: tsumugi
    emotion: angry
    text: それは今すぐやって。
    se: zukko
  - speaker: zundamon
    emotion: surprised
    text: あと、アメリカでは645店も閉店するって！
  - speaker: tsumugi
    emotion: normal
    text: 645店は、2026年度に北米で減らす計画の数ね。
  - speaker: tsumugi
    emotion: normal
    text: 不採算店の閉店のほかに、ガソリンスタンドの[卸|おろし]への切り替えも含むの。
  - speaker: zundamon
    emotion: thinking
    text: 全部が閉店、ってわけじゃないのか。
  - speaker: tsumugi
    emotion: normal
    text: 北米には、1万3000店を超える店があるわ。
  - speaker: zundamon
    emotion: thinking
    text: 1万3000のうちの、645。
  - speaker: tsumugi
    emotion: normal
    text: 約5%ね。新しく開く店も、200店あまりあるわ。
  - speaker: tsumugi
    emotion: thinking
    text: 本当の注意点は、別にあるの。
- id: ch8_chui
  title: 近くの店の選び方
  background: sv_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: コンビニで払ってるのは、近さと時間の分でもあるの。
  - speaker: tsumugi
    emotion: normal
    text: 毎日買う物ほど、一度だけ近所のスーパーと値札を比べてみて。
  - speaker: zundamon
    emotion: thinking
    text: おにぎり1個でも？
  - speaker: tsumugi
    emotion: normal
    text: 毎日1個なら、1年で365個よ。差が10円でも、3650円。
  - speaker: zundamon
    emotion: surprised
    text: 3650円！？
  - speaker: zundamon
    emotion: thinking
    text: でも、夜中に急に食べたくなったら？
  - speaker: tsumugi
    emotion: happy
    text: そのときは、近さを買えばいいのよ。
  - speaker: tsumugi
    emotion: normal
    text: コンビニの側も、安さを売りにした品を増やしてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 2024年9月には、手ごろな価格の品を270品に広げたの。
  - speaker: tsumugi
    emotion: happy
    text: 急がない物はスーパーで。急ぐ物と夜の買い物は、コンビニで。
  - speaker: zundamon
    emotion: happy
    text: 使い分け、なのだ。
# ---- 現代の章 ----
- id: ch9_gendai
  title: セブンのこれから
  background: sv_conbini
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 2026年7月。[セブン&アイ|せぶんあんどあい]は、ソフトバンクなど3社から出資を受けると決めたの。
  - speaker: tsumugi
    emotion: normal
    text: '[PayPay|ぺいぺい]と三井住友カードも入って、合わせて3000億円。1株2070円よ。'
    telops:
    - {text: "1株2,070円で計3000億円の出資", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: クシュタールの提案は、1株2600円だったのだ！
  - speaker: zundamon
    emotion: thinking
    text: 高いほうを、断ったの？
  - speaker: tsumugi
    emotion: thinking
    text: 会社ごと買う値段と一部の株を渡す値段は、同じ物差しで測れないの。
  - speaker: tsumugi
    emotion: normal
    text: 断ったかどうかも、会社とクシュタールで言い分が違うわ。
  - speaker: tsumugi
    emotion: normal
    text: 同じ日、クシュタールはポーランドのコンビニ最大手を約87億ドルで買うと発表したわ。
  - speaker: tsumugi
    emotion: thinking
    text: '[セブン&アイ|せぶんあんどあい]が出資を検討して、7月に見送った会社よ。'
  - speaker: zundamon
    emotion: sad
    text: 逃した魚が、向こうの網に……。
    se: shobon
  - speaker: tsumugi
    emotion: normal
    text: 魚じゃなくて、1万3000店のチェーンよ。
  - speaker: zundamon
    emotion: surprised
    text: クジラなのだ！
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: アメリカの子会社の上場は、最短で27年度に延びたわ。
  - speaker: tsumugi
    emotion: normal
    text: デイカス社長は、最も身近で最初に選ばれる店舗を目指すと話してる。
  - speaker: tsumugi
    emotion: normal
    text: 会員のIDも、[PayPay|ぺいぺい]のIDにまとめていく予定よ。
  - speaker: zundamon
    emotion: happy
    text: ヨーカドーで売ってた安いPBも、セブンの棚に来るのだ。
  - speaker: tsumugi
    emotion: normal
    text: '[下期|しもき]から、順に増やす予定ね。2026年10月の時点では、まだ動いてる話よ。'
  - speaker: tsumugi
    emotion: normal
    text: '[ヨーカ堂|よーかどう]を含む会社の株も、35%は持ったまま。今も関係は続いてるの。'
