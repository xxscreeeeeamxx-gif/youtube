meta:
  title: 「あんなものやっていけるのか」と言われたセブン、半世紀後にかつての親ヨーカ堂を売却【ずんだもん解説】
  slug: seven-i-suzuki
  hook_line: 親の会社の小さな新規事業だったセブン-イレブンは、なぜ親を超えたのか。
  summary: 1972年、イトーヨーカ堂の創業者・伊藤雅俊は、コンビニを「あんなものやっていけるのか」と言いました。押し切ったのは、本の問屋から転職してきた鈴木敏文。小さな新規事業だったセブン-イレブンは、やがて利益で親を上回ります。稼ぐのは子、株を持つのは親と創業家。そのねじれに、物言う株主や外国の買い手が手を伸ばしていきます。2016年の取締役会で何が起きたのか。経営者・創業家・会社・買い手、それぞれの言い分を並べて、再現ドラマでたどります。
  sources:
  - Alimentation Couche-Tard「ALIMENTATION COUCHE-TARD ANNOUNCES WITHDRAWAL OF PROPOSAL TO ACQUIRE SEVEN & I HOLDINGS DUE TO LACK OF ENGAGEMENT」2025年7月16日 https://corporate.couche-tard.com/2025-07-16-ALIMENTATION-COUCHE-TARD-ANNOUNCES-WITHDRAWAL-OF-PROPOSAL-TO-ACQUIRE-SEVEN-I-HOLDINGS-DUE-TO-LACK-OF-ENGAGEMENT
  - セブン&アイ・ホールディングス「アリマンタシォン・クシュタール社からの法的拘束力のない初期的な提案への回答」2024年9月6日 https://www2.jpx.co.jp/disc/33820/140120240906581871.pdf
  - セブン&アイ・ホールディングス「アリマンタシォン・クシュタール社のプレスリリースに関する当社の見解について」2025年7月17日 https://www.7andi.com/company/news/release/202507170913.html
  - セブン&アイ・ホールディングス「2027年2月期 第2四半期（中間期）決算サマリー」2026年10月8日 https://www.7andi.com/company/news/release/202610081530.html
  - 日経ビジネス「伊藤と鈴木、『緊張関係』が生む絶妙バランス」1996年9月30日号 https://business.nikkei.com/atcl/report/16/011100100/011600016/
  - 日本経済新聞「流通のカリスマ退場 セブン&アイ鈴木氏『私の不徳』」2016年4月8日 https://www.nikkei.com/article/DGXLZO99421390Y6A400C1EA2000/
