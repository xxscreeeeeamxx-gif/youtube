  - {who: shagai, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 2016年2月。鈴木は、セブン-イレブン・ジャパンの社長の井阪隆一に、交代を打診します。
    reading: にせんじゅうろくねん にがつ。すずきわ せぶんいれぶん じゃぱんの しゃちょうの いさか りゅういちに こうたいお だしん します。
  - speaker: reimu
    text: 井阪は2日後に、受け入れられないと答えます。3月末、話は人事の委員会へ。
    reading: いさかわ ふつかごに うけいれられないと こたえます。さんがつまつ はなしわ じんじの いいんかいえ。
  - speaker: zundamon
    emotion: normal
    text: '[セブン-イレブン|せぶんいれぶん]の経営に、[新しい機軸|あたらしいきじく]が出ていない。'
  - speaker: shagai
    emotion: thinking
    text: 5期続けて、最高益です。
  - speaker: shagai
    emotion: normal
    text: 最高益の社長を[退かせる|しりぞかせる]理由が、ありません。
  - speaker: zundamon
    emotion: thinking
    text: ……最高益でも、だ。
  - speaker: reimu
    text: 社外取締役の2人が反対し、委員会では結論が出ません。
    reading: しゃがい とりしまりやくの ふたりが はんたいし、いいんかいでわ けつろんが でません。
# ---- 2016年4月7日 取締役会 ----
- id: card2016
  title: ''
  background: sv_card_2016
  bgm: serious
  cuts:
