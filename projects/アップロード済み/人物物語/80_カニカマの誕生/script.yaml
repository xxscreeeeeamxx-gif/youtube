  - speaker: kenkyuin
    emotion: thinking
    text: ……その手帳、もう[何|なん]冊目なんですか。
  - speaker: zundamon
    emotion: happy
    text: 数えるより、食べるほうが忙しくてな。
    se: manuke
  - speaker: kenkyuin
    emotion: happy
    text: いつか、その手帳を読ませてください。
  - speaker: zundamon
    emotion: happy
    text: 読んだら、腹が減るぞ。
- id: card2003
  title: ''
  background: kk_card_2003
  cuts:
  - speaker: reimu
    text: 2003年10月24日。会長の杉野芳人は、72歳で亡くなりました。
    reading: にせん さんねん じゅうがつ にじゅうよっか。かいちょうの すぎの よしとわ、ななじゅうにさいで なくなりました。
- id: ch9_shi
  title: 100年に一度のヒット
  background: kk_yuugure
  bgm: 223am
  cuts:
  - speaker: reimu
    text: 業界の新聞は訃報の中で、かにあしを100年に一度の大ヒット商品と書きました。
    reading: ぎょうかいの しんぶんわ ふほうの なかで、かにあしお ひゃくねんに いちどの だいひっと しょうひんと かきました。
    telops:
    - {text: 100年に一度の大ヒット, size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: 10年に一度と喜んだ発明は、30年たっても売れ続けていました。
    reading: じゅうねんに いちどと よろこんだ はつめいわ、さんじゅうねん たっても うれつづけて いました。
  - speaker: reimu
    text: 11月7日に七尾で社葬が営まれ、喪主は長男の哲也が務めました。
    reading: じゅういちがつ なのかに ななおで しゃそうが いとなまれ、もしゅわ ちょうなんの てつやが つとめました。
- id: ch9_kaoribako
  title: 刻むから束ねるへ
  background: kk_kaoribako
  stage:
  - {who: kenkyuin, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 翌2004年、スギヨは香り箱という高級なカニカマを出します。
    reading: よく にせん よねん、すぎよわ かおりばこと いう こうきゅうな かにかまお だします。
  - speaker: kenkyuin
    emotion: thinking
    text: 会長に、見せたかったな。今度は刻まずに束ねたんです。
  - speaker: kenkyuin
    emotion: normal
    text: 0.6ミリの細い筋を、葉っぱの筋みたいに束ねて……。
  - speaker: reimu
    text: 香り箱は練り物として初めて、スーパーの鮮魚売り場に並びました。
    reading: かおりばこわ ねりものと して はじめて、すーぱーの せんぎょ うりばに ならびました。
  - speaker: kenkyuin
    emotion: happy
    text: 名前は、能登の[香箱|こうばこ]ガニからもらった。
  - speaker: kenkyuin
    emotion: normal
    text: 刻むから束ねるまで、30年あまりか……。
  - speaker: kenkyuin
    emotion: thinking
    text: ……一口、食べてほしかったな。
    se: namida
  - speaker: reimu
    text: 2006年には、農林水産祭で天皇杯を受けます。
    reading: にせん ろくねんにわ、のうりん すいさんさいで てんのうはいお うけます。
- id: ch10_shikumi
  title: カニカマの作り方
  background: kk_zukai3
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 今のカニカマは、こうやって作るの。
  - speaker: tsumugi
    emotion: normal
    text: すり身を薄いシートにのばして、熱で固める。
  - speaker: zundamon
    emotion: thinking
    text: まず、紙みたいにするのだ。
  - speaker: tsumugi
    emotion: normal
    text: そこに細かい筋を入れて、糸みたいにほぐすの。
  - speaker: tsumugi
    emotion: normal
    text: 糸を束ねたら、赤いすり身を塗ったフィルムで巻いて切るのよ。
  - speaker: zundamon
    emotion: thinking
    text: なんで、わざわざ糸みたいにするのだ？
  - speaker: tsumugi
    emotion: normal
    text: カニの脚の身は、細い筋の束でできてるからよ。
  - speaker: zundamon
    emotion: surprised
    text: 赤いのは、外側だけなのだ？
  - speaker: tsumugi
    emotion: normal
    text: そう。フィルムの赤を、表面に写してるの。
  - speaker: zundamon
    emotion: happy
    text: ボク、赤いところだけはがして食べる派なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 一番手間のかかった所から、はがしてるわね。
    se: tsukkomi
  - speaker: zundamon
    emotion: thinking
    text: そもそも、かまぼこはなんでプリプリなの？
  - speaker: tsumugi
    emotion: normal
    text: 塩を入れてすりつぶすと、魚のたんぱく質が溶けて絡み合うの。
  - speaker: tsumugi
    emotion: normal
    text: それを熱すると、網の目のように固まって弾力が出る。これを、かまぼこの足と言うの。
  - speaker: zundamon
    emotion: happy
    text: かまぼこにも、足があるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 足があっても、歩いてはいかないわよ。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 塩は2〜3パーセント。少ないと固まらず、多いとしょっぱい。
  - speaker: zundamon
    emotion: thinking
    text: 塩加減が、ぎりぎりなのか。
  - speaker: tsumugi
    emotion: normal
    text: 製造機は山口県の会社のものが、2011年の時点で世界の約7割だったの。
- id: ch10_kamaboko
  title: ''
  background: kk_kamaboko
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: ちくわとかまぼこって、親戚なの？
  - speaker: tsumugi
    emotion: normal
    text: 親戚どころか、昔はちくわの形をかまぼこと呼んでたの。
  - speaker: tsumugi
    emotion: normal
    text: 一番古い記録は1115年。平安時代の[宴|うたげ]の献立よ。
  - speaker: tsumugi
    emotion: normal
    text: 竹に巻いて焼いた形が、[蒲|がま]の穂という水辺の草に似てたの。
  - speaker: zundamon
    emotion: surprised
    text: '[蒲|がま]の穂に似てるから、かまぼこ！'
  - speaker: tsumugi
    emotion: normal
    text: 板付きが広まってから、元の形を[竹輪|ちくわ]と呼び分けたのよ。
  - speaker: zundamon
    emotion: happy
    text: ちくわの方が、お兄さんだったのか！
  - speaker: tsumugi
    emotion: normal
    text: かまぼこの日は11月15日。1115年にちなんでるの。
- id: ch10_surimi
  title: ''
  background: kk_zukai
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: カニカマの土台には、もう一つ大事な発明があるの。
  - speaker: zundamon
    emotion: thinking
    text: 土台？
  - speaker: tsumugi
    emotion: normal
    text: 冷凍すり身よ。1960年ごろ、北海道の水産試験場のチームが作ったの。
  - speaker: tsumugi
    emotion: normal
    text: すり身をそのまま凍らせると、スポンジみたいになって足が出なくなるの。
  - speaker: zundamon
    emotion: surprised
    text: 冷凍できないのに、どうしたの？
  - speaker: tsumugi
    emotion: normal
    text: 身を水でよく洗って、砂糖と[リン酸塩|りんさんえん]を混ぜてから凍らせたの。
  - speaker: zundamon
    emotion: happy
    text: 砂糖が、身を守るのか！
  - speaker: zundamon
    emotion: happy
    text: ボクの体も砂糖でいっぱいだから、冬でも平気なのだ！
    se: manuke
  - speaker: tsumugi
    emotion: thinking
    text: それは、ただのおやつの食べすぎよ。
  - speaker: tsumugi
    emotion: normal
    text: 凍るときに、たんぱく質が傷むのを防いでくれるの。
  - speaker: tsumugi
    emotion: normal
    text: これでスケトウダラのすり身を、一年中使えるようになったのよ。
  - speaker: tsumugi
    emotion: normal
    text: 冷凍すり身は1960年に250トン。1976年には45万トンまで増えたわ。
  - speaker: zundamon
    emotion: surprised
    text: 16年で、1800倍なのだ！
  - speaker: tsumugi
    emotion: normal
    text: 1972年、スケトウダラの漁獲は日本だけで304万トンあったの。
  - speaker: zundamon
    emotion: happy
    text: かにあしが生まれた年なのだ！
- id: ch11_sekai
  title: 世界のSURIMI
  background: kk_sekai
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: カニカマは今、アジアにもヨーロッパにもアメリカにも工場があるの。
  - speaker: tsumugi
    emotion: normal
    text: 2021年に日本で食べた量は、約5万トン。
  - speaker: tsumugi
    emotion: normal
    text: フランスも、約5万トンよ。
  - speaker: zundamon
    emotion: thinking
    text: 同じくらいなのか。
  - speaker: tsumugi
    emotion: normal
    text: でもフランスの人口は、日本の半分くらいなの。
  - speaker: zundamon
    emotion: surprised
    text: 1人あたりなら、フランスの勝ちなのだ！
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 作る力が世界一のカニカマ工場は、リトアニアにあるわ。
  - speaker: zundamon
    emotion: thinking
    text: リトアニアって、どこなの？
  - speaker: tsumugi
    emotion: normal
    text: バルト海に面した、ヨーロッパの国よ。
  - speaker: tsumugi
    emotion: normal
    text: アメリカでは、カクテルソースを付けてスポーツ観戦のおつまみにするの。
  - speaker: zundamon
    emotion: happy
    text: アメフトを見ながら、カニカマなのだ！
  - speaker: tsumugi
    emotion: normal
    text: 英語では、まねしたカニという意味の名前で売られることもあるわ。
  - speaker: zundamon
    emotion: happy
    text: まねっこなのを、隠してないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 材料の名前のまま、[SURIMI|すりみ]と呼ぶ国もあるの。
  - speaker: zundamon
    emotion: happy
    text: すり身が、世界の言葉になったのか。
- id: ch12_ronsou
  title: 元祖はどっち？
  background: kk_shiryo
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: ネットで見たのだ。失敗作を酢の物にしたら、カニの味がしたって。
  - speaker: tsumugi
    emotion: normal
    text: スギヨが話しているのは、刻んで食べたら食感がカニだったということよ。
  - speaker: zundamon
    emotion: surprised
    text: じゃあ、酢の物の話は？
  - speaker: tsumugi
    emotion: thinking
    text: スギヨの話には、酢の物は出てこないの。
  - speaker: zundamon
    emotion: sad
    text: ……ボク、昨日カニカマを酢の物にしたのに。
  - speaker: tsumugi
    emotion: happy
    text: それは、ただのおいしい一品ね。
    se: hammer
  - speaker: zundamon
    emotion: thinking
    text: 結局、カニカマの元祖は能登なの？
  - speaker: tsumugi
    emotion: normal
    text: 刻んだ形で最初に売ったのは、1972年のスギヨ。
  - speaker: tsumugi
    emotion: normal
    text: 今よく見る棒の形を最初に出したのは、1974年の広島の大崎水産よ。
  - speaker: tsumugi
    emotion: normal
    text: 珍味を作る機械に残ったすり身に、カニの汁が混ざっていたのを味見したの。
  - speaker: zundamon
    emotion: surprised
    text: 広島でも、機械の残りから生まれたのか！
  - speaker: tsumugi
    emotion: normal
    text: 最初の名前はカニスチック。のちに、フィッシュスチックに改めたの。
  - speaker: zundamon
    emotion: thinking
    text: カニから、魚に戻ったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 2代目の社長は機械いじりが好きで、棒を作るラインを自分で設計したの。
  - speaker: zundamon
    emotion: surprised
    text: 社長が自分で！？
  - speaker: tsumugi
    emotion: normal
    text: 組み立ては、隣にあった小さな鉄工所が手伝ったのよ。
  - speaker: tsumugi
    emotion: normal
    text: 1978年には、全自動の製造ラインを完成させたわ。
  - speaker: tsumugi
    emotion: thinking
    text: 1973年に、カニ棒という商品を出した会社もあるわ。
  - speaker: zundamon
    emotion: surprised
    text: 元祖が、3つもあるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 今のスギヨの社長は、カニカマに特許が無かったから広がったと話してるわ。
  - speaker: tsumugi
    emotion: normal
    text: よその会社が真似して競争したから、香り箱も生まれたって。
  - speaker: zundamon
    emotion: happy
    text: 誰でも作れたから、世界中のカニになったのか。
- id: ch13_eiyou
  title: カニカマはヘルシー？
  background: kk_gendai
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: カニカマはヘルシーで、糖質も少ないのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 糖質は、本物のカニよりむしろ多いのよ。
  - speaker: tsumugi
    emotion: normal
    text: ゆでたズワイガニの炭水化物は、100グラムで0.1グラム。
  - speaker: tsumugi
    emotion: normal
    text: カニカマは、9.2グラムあるの。
  - speaker: zundamon
    emotion: surprised
    text: 90倍以上なのだ！？
    se: gaan
    telops:
    - {text: 炭水化物はカニの90倍以上, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: でん粉や砂糖が入ってるからね。
  - speaker: tsumugi
    emotion: normal
    text: そのかわり、たんぱく質が12グラムあって手軽なたんぱく源になるわ。
  - speaker: zundamon
    emotion: thinking
    text: カニカマに、カニは入ってないの？
  - speaker: tsumugi
    emotion: normal
    text: 商品によるの。カニのエキスを使うものも、魚介のエキスだけのものもあるわ。
  - speaker: tsumugi
    emotion: normal
    text: カニのアレルギーがある人は、袋の表示を必ず見てね。
  - speaker: zundamon
    emotion: normal
    text: 名前より、裏の表示を見るのか。
  - speaker: tsumugi
    emotion: normal
    text: スギヨは公正取引委員会と約20年かけて、パッケージの表示の決まりを作ったの。
  - speaker: tsumugi
    emotion: normal
    text: 1990年には、国が風味かまぼこの表示の決まりを作ったの。
  - speaker: zundamon
    emotion: happy
    text: 14回のラベルが、ちゃんと形になったのだ。
  - speaker: tsumugi
    emotion: normal
    text: その決まりは2009年に、国の基準としては廃止されたの。
  - speaker: zundamon
    emotion: surprised
    text: もう、カニと間違える[人|ひと]がいないのだ？
  - speaker: tsumugi
    emotion: thinking
    text: 今でも、本物のカニと誤解させる表示はだめよ。
  - speaker: tsumugi
    emotion: normal
    text: 毎月22日は、カニカマの日。漢字の[二二|にに]が、カニのハサミに見えるからよ。
  - speaker: zundamon
    emotion: happy
    text: じゃあ毎月22日は、カニカマ食べ放題なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: ただし6月だけはお休み。6月22日は、本物のかにの日だから。
  - speaker: zundamon
    emotion: surprised
    text: カニカマ、本物に遠慮してるの！？
    beat: true
- id: ch14_noto
  title: 今も能登で
  background: kk_noto
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 2022年、カニカマは生まれて50年を迎えたの。
  - speaker: zundamon
    emotion: happy
    text: 10年に一度どころか、50年も売れてるのだ。
  - speaker: tsumugi
    emotion: happy
    text: 記念に、カニカマが英国紳士になって歴史を語る動画も作られたの。
  - speaker: zundamon
    emotion: thinking
    text: カニカマに、紳士の役は荷が重いのだ。
    se: tenten
  - speaker: tsumugi
    emotion: normal
    text: チームで一番若かった開発の主任は、50年目にこう振り返ってるわ。
  - speaker: tsumugi
    emotion: normal
    text: 失敗に終わりそうな時、ふっと横を見たら別の道が見えたって。
  - speaker: zundamon
    emotion: happy
    text: 横の道が、カニだったのか。
  - speaker: tsumugi
    emotion: thinking
    text: 2024年の元日、能登半島地震が起きたの。
  - speaker: tsumugi
    emotion: thinking
    text: スギヨの本社と、3つの工場が被災したわ。
  - speaker: zundamon
    emotion: sad
    text: カニカマの、ふるさとが……。
  - speaker: tsumugi
    emotion: normal
    text: スギヨは工場の地下水を、町の人に無料で開放したの。
  - speaker: zundamon
    emotion: normal
    text: 自分たちも被災してるのに……。
  - speaker: tsumugi
    emotion: normal
    text: それでも2月の末には、カニカマの生産を再開したの。
    telops:
    - {text: 2月末にカニカマ再開, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 5月の末には、3つの工場がすべて動き出したわ。
  - speaker: zundamon
    emotion: thinking
    text: ……ちくわは？
  - speaker: tsumugi
    emotion: normal
    text: ビタミンちくわも5月31日に、[七尾|ななお]で5か月ぶりに作り始めたの。
  - speaker: tsumugi
    emotion: happy
    text: 6月1日には長野のスーパーに、おかえりの札と一緒に並んだわ。
  - speaker: tsumugi
    emotion: normal
    text: 2025年には、[芳人|よしと]さんの孫が新しい社長になったわ。
  - speaker: tsumugi
    emotion: normal
    text: 東京の話を明かしたのも、この孫の社長よ。
  - speaker: zundamon
    emotion: happy
    text: 能登だからこそ、なのだ。
  - speaker: tsumugi
    emotion: normal
    text: カニカマは、今も能登で作られてるの。
- id: shime
  title: ''
  background: kk_ima
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ！ 今日はカニカマで、中華のクラゲの和え物を作ったのだ。
  - speaker: tsumugi
    emotion: surprised
    text: カニカマで、クラゲ？
  - speaker: zundamon
    emotion: happy
    text: 進化したカニを、もう一回クラゲに進化させるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 進化の向きが、ぐるっと一周してるわね。
  - speaker: zundamon
    emotion: happy
    text: 細く切って、醤油と酢であえれば……。
  - speaker: tsumugi
