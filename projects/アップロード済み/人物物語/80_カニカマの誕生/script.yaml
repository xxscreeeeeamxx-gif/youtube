meta:
  title: 【カニカマの誕生】人工クラゲを作るはずが、失敗作を刻んだらカニになった【ずんだもん解説】
  slug: sugiyo-kanikama-v2
  summary: スーパーでおなじみのカニカマ。最初からカニを目指したわけではありませんでした。1970年、能登・七尾のちくわ屋に「人工のクラゲを作れないか」という依頼が舞い込みます。開発をまとめたのは、食べた物を何でも手帳に書く食通の専務、杉野芳人。醤油であえると溶けてしまう失敗作を前に、彼は何に気づいたのか。築地での門前払いや「インチキ」と呼ばれた日々も含めて、再現ドラマでたどります。
  tags:
  - カニカマ
  - かに風味かまぼこ
  - スギヨ
  - 杉野芳人
  - すり身
  - かまぼこ
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  thumbnail:
    top: クラゲの失敗作
    bottom: カニカマの誕生
  mode: drama
  narrator: reimu
