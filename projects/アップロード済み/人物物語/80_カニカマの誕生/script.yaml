scenes:
- id: co_kurage
  title: ''
  background: kk_kenkyu
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 杉野芳人, emotion: thinking}
  - {who: shokunin, x: 0.7, emotion: angry}
  cuts:
  - speaker: reimu
    text: 1970年代の初め、能登の七尾。のちにカニカマを生むちくわ屋が、人工のクラゲを作っていました。
    reading: せんきゅうひゃく ななじゅうねんだいの はじめ、のとの ななお。のちに かにかまお うむ ちくわやが、じんこうの くらげお つくって いました。
  - speaker: shokunin
    emotion: angry
    text: 専務。醤油のタレであえたら……また溶けたわい。
  - speaker: zundamon
    emotion: surprised
    text: これで、[何|なん]回目だ。
  - speaker: shokunin
    emotion: thinking
    text: 数えとらん。こんなもん、もう捨てるしかないげん。
  - speaker: zundamon
    emotion: thinking
    text: ……待て。捨てる前に、刻んで食べてみる。
  - speaker: zundamon
    emotion: surprised
    text: ……この歯ざわり。カニの脚の身じゃないか！
    se: don
  - speaker: shokunin
    emotion: surprised
    text: クラゲを作っとって、カニけ！？
    beat: true
  - speaker: reimu
    text: この男は、杉野芳人。失敗作から生まれたかにあしは、2か月でトラック1日5便でも足りなくなります。
    reading: この おとこわ すぎの よしと。しっぱいさくから うまれた かにあしわ、にかげつで とらっく いちにち ごびんでも たりなく なります。
- id: hook
  title: ''
  background: kk_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、今日はカニ食べ放題パーティーなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: ……それ、全部カニカマよね。
  - speaker: zundamon
    emotion: happy
    text: カニカマは実質カニ。殻をむかなくていい、進化したカニなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 進化どころか、もとはクラゲの失敗作よ。
    beat: true
  - speaker: zundamon
    emotion: surprised
    text: クラゲ！？ そもそも、なんでちくわ屋がクラゲを作ってたの？
    telops:
    - {text: なぜちくわ屋がクラゲを？, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、ちくわ屋に届いた無茶な注文よ。
- id: ch0_nanao
  title: ''
  background: kk_nanao
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 能登半島の七尾。杉野家は江戸時代から、網元として魚をとってきました。
    reading: のとはんとうの ななお。すぎのけわ えどじだいから、あみもとと して さかなお とって きました。
  - speaker: reimu
    text: 1907年、初代の杉野作太郎がちくわを作り始めます。
    reading: せんきゅうひゃく ななねん、しょだいの すぎの さくたろうが ちくわお つくり はじめます。
  - speaker: reimu
    text: すり身を竹の串に巻いて、炭火で焼く手作りでした。
    reading: すりみお たけの くしに まいて、すみびで やく てづくりでした。
  - speaker: reimu
    text: 1923年には気仙沼から職人を招き、サメの身でもちくわを作ります。
    reading: せんきゅうひゃく にじゅうさんねんにわ けせんぬまから しょくにんお まねき、さめの みでも ちくわお つくります。
- id: card1952
  title: ''
  background: kk_card_1952
  cuts:
  - speaker: reimu
    text: 1952年。七尾のちくわが、ビタミンちくわとして売り出されます。
    reading: せんきゅうひゃく ごじゅうにねん。ななおの ちくわが、びたみん ちくわと して うりだされます。
- id: ch1_chikuwa
  title: 能登のちくわ屋
  background: kk_chikuwa
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 杉野芳人, emotion: happy}
  - {who: shokunin, x: 0.7, emotion: happy}
  cuts:
  - speaker: shokunin
    emotion: happy
    text: 若旦那。長野から、また注文やぞ。
  - speaker: zundamon
    emotion: surprised
    text: 海のない長野で、うちのちくわが売れてる！
  - speaker: shokunin
    emotion: normal
    text: 戦争のあとで、みんなビタミンが足りんがや。
  - speaker: zundamon
    emotion: happy
    text: ビタミンの名前が、効いてるんだな。
  - speaker: reimu
    text: ビタミンちくわは今も、売り上げの約7割が長野県です。
    reading: びたみん ちくわわ いまも、うりあげの やく ななわりが ながのけんです。
  - speaker: zundamon
    emotion: thinking
    text: 今日の昼のそば、つゆが甘かった。手帳に書いておこう。
  - speaker: shokunin
    emotion: surprised
    text: 若旦那、食べた物を全部書いとるがけ？
  - speaker: zundamon
    emotion: normal
    text: 全部だ。朝のみそ汁の具までな。
  - speaker: shokunin
    emotion: thinking
    text: ……若旦那の手帳、もう[何|なん]冊目や。
  - speaker: zundamon
    emotion: happy
    text: 冊数は数えてない。食べた物なら、全部言える。
  - speaker: shokunin
    emotion: angry
    text: 覚えるとこが、逆やろ。
    se: hammer
  - speaker: reimu
    text: 芳人は列車が出る間際でも、見知らぬ食堂やそば屋を見つけると寄って食べました。
    reading: よしとわ れっしゃが でる まぎわでも、みしらぬ しょくどうや そばやお みつけると よって たべました。
  - speaker: zundamon
    emotion: happy
    text: 列車は次のが来る。でも、あのそば屋には今しか入れない。
  - speaker: shokunin
    emotion: thinking
    text: 若旦那の頭の中は、食べ物でいっぱいやな。
    beat: true
  - speaker: reimu
    text: 1959年には、人工のカラスミも作り始めます。
    reading: せんきゅうひゃく ごじゅうくねんにわ、じんこうの からすみも つくり はじめます。
  - speaker: shokunin
    emotion: surprised
    text: 今度は、カラスミまで作り物け。
  - speaker: zundamon
    emotion: happy
    text: 似せて作るのは、練り物屋の腕の見せどころだ。
- id: ch2_irai
  title: クラゲを作れ
  background: kk_jimusho
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 杉野芳人, emotion: normal}
  - {who: chinmi, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
    text: 1960年代の終わり。中国からの食用クラゲの輸入が止まります。
    reading: せんきゅうひゃく ろくじゅうねんだいの おわり。ちゅうごくからの しょくよう くらげの ゆにゅうが とまります。
  - speaker: chinmi
    emotion: surprised
    text: 杉野さん、えらいこっちゃ。中華のクラゲが入ってきまへん。
  - speaker: chinmi
    emotion: sad
    text: 前菜のクラゲが出されへんて、料理屋さんが泣いてはります。
  - speaker: zundamon
    emotion: thinking
    text: 中国の、文化大革命のあおりですか。
  - speaker: chinmi
    emotion: normal
    text: そうです。そこで、お宅にお願いや。
  - speaker: chinmi
    emotion: happy
    text: 人工のカラスミを作りはったでしょ。ほな、人工のクラゲもいけまっしゃろ。
  - speaker: zundamon
    emotion: surprised
    text: カラスミとクラゲは、だいぶ違いますよ。
  - speaker: chinmi
    emotion: happy
    text: どっちも珍味ですやん。
    se: zukko
  - speaker: zundamon
    emotion: thinking
    text: ……そもそも、クラゲって[何|なに]でできてるんです？
  - speaker: chinmi
    emotion: normal
    text: ほとんど水ですわ。
  - speaker: zundamon
    emotion: surprised
    text: 水を、コリコリにしろと？
  - speaker: chinmi
    emotion: happy
    text: そうです。ほな、頼みましたで！
  - speaker: zundamon
    emotion: surprised
    text: まだ、引き受けるとは言ってません。
  - speaker: chinmi
    emotion: happy
    text: 顔に、やるって書いてありますで。
    beat: true
  - speaker: zundamon
    emotion: happy
    text: ……正直、ちょっと面白そうなのだ。
- id: card1970
  title: ''
  background: kk_card_1970
  cuts:
  - speaker: reimu
    text: 1970年。人工クラゲの開発が始まります。
    reading: せんきゅうひゃく ななじゅうねん。じんこう くらげの かいはつが はじまります。
- id: ch3_team
  title: 人工クラゲ
  background: kk_kenkyu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 杉野芳人, emotion: normal}
  - {who: kenkyu, x: 0.52, emotion: normal}
  - {who: shokunin, x: 0.8, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 開発をまとめるのは、専務の杉野芳人。水産試験場の研究者も力を貸します。
    reading: かいはつお まとめるのわ せんむの すぎの よしと。すいさん しけんじょうの けんきゅうしゃも ちからお かします。
  - speaker: shokunin
    emotion: thinking
    text: 専務。ちくわ屋がクラゲを作るなんて、聞いたことないわ。
  - speaker: zundamon
    emotion: happy
    text: 誰も聞いたことがないから、やるんだ。
  - speaker: shokunin
    emotion: angry
    text: 面白がっとるのは、専務だけやぞ。
    beat: true
  - speaker: kenkyu
    emotion: normal
    text: 使うのは、海藻のぬめりのもと。アルギン酸ナトリウムです。
  - speaker: shokunin
    emotion: thinking
    text: 海藻のぬるぬるで、クラゲになるがけ？
  - speaker: kenkyu
    emotion: normal
    text: これを、カルシウムの液に落とします。
  - speaker: zundamon
    emotion: surprised
    text: 落ちたところから、固まっていく！
  - speaker: kenkyu
    emotion: happy
    text: これに、卵白も合わせます。
  - speaker: zundamon
    emotion: thinking
    text: なんで、カルシウムに触れると固まるんです？
  - speaker: kenkyu
    emotion: normal
    text: アルギン酸は、長い鎖のような形をしています。
  - speaker: kenkyu
    emotion: normal
    text: カルシウムが、鎖と鎖をつなぐ[留め金|とめがね]になるんです。
  - speaker: shokunin
    emotion: normal
    text: '[留め金|とめがね]で網になって、水を閉じ込めるがか。'
  - speaker: kenkyu
    emotion: happy
    text: そうです。人工のイクラも、同じ仕組みです。
  - speaker: zundamon
    emotion: happy
    text: 透き[通って|とおって]、つるつる。見た目はクラゲそっくりだ！
  - speaker: shokunin
    emotion: thinking
    text: 見た目だけなら、ゼリー屋にもできるわ。
    beat: true
- id: ch3_shippai
  title: ''
  background: kk_kenkyu
  bgm: serious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 杉野芳人, emotion: happy}
  - {who: kenkyu, x: 0.52, emotion: normal}
  - {who: shokunin, x: 0.8, emotion: normal}
  cuts:
  - speaker: shokunin
    emotion: normal
    text: 中華の味付けにするぞ。醤油のタレで、あえてみるわ。
  - speaker: zundamon
    emotion: happy
    text: どれ、自慢のコリコリを……あれ？
  - speaker: zundamon
    emotion: surprised
    text: コリコリが、消えていく！
  - speaker: kenkyu
    emotion: thinking
    text: 溶けています。味を付けると、形が保てません。
    telops:
    - {text: 味を付けると溶ける, size: md, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: タレを、うんと薄めてみる。
  - speaker: kenkyu
    emotion: thinking
    text: 薄めても、やっぱり溶けます。
  - speaker: zundamon
    emotion: thinking
    text: ……じゃあ、タレをかけずに出そう。
  - speaker: shokunin
    emotion: angry
    text: 味のないクラゲを、誰が食うがや。
    beat: true
  - speaker: zundamon
    emotion: thinking
    text: なら、タレは食べる直前にかけてもらう。
  - speaker: kenkyu
    emotion: thinking
    text: かけた所から、溶けていきます。
  - speaker: zundamon
    emotion: thinking
    text: 配合を変えよう。もっと固めにするんだ！
  - speaker: kenkyu
    emotion: sad
    text: ……固めにしても、溶けました。
    se: chin
  - speaker: zundamon
    emotion: angry
    text: なら量で勝負だ。全部のバットに、一度にタレを！
  - speaker: shokunin
    emotion: angry
    text: 今度はドロドロや。バットが全部、汁物になったわい。
    background: kk_kenkyu_dorodoro
  - speaker: shokunin
    emotion: thinking
    text: 箸より先に、皿の上で溶けるクラゲやな。
    beat: true
  - speaker: zundamon
    emotion: sad
    text: クラゲへの道は、遠いのだ……。
  - speaker: reimu
    text: 見た目と歯ごたえは近づいても、味を付けると溶ける。試作は失敗が続きました。
    reading: みためと はごたえわ ちかづいても、あじお つけると とける。しさくわ しっぱいが つづきました。
- id: ch3_hirameki
  title: ''
  background: kk_kenkyu2
  bgm: curious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 杉野芳人, emotion: sad}
  - {who: shokunin, x: 0.52, emotion: thinking}
  - {who: kenkyu, x: 0.8, emotion: thinking}
  cuts:
  - speaker: kenkyu
    emotion: sad
    text: 珍味問屋さんには、お断りするしかなさそうです。
  - speaker: zundamon
    emotion: thinking
    text: ……あと一晩だけ、考えさせてくれ。
  - speaker: shokunin
    emotion: thinking
    text: 専務。この失敗作、どうするがや。捨てるけ？
  - speaker: zundamon
    emotion: thinking
    text: ……もったいない。刻んで、食べてみる。
  - speaker: zundamon
    emotion: surprised
    text: ……この歯ざわり。カニの脚の身じゃないか！
    se: hirameki
    telops:
    - {text: 失敗作を刻んだらカニの身, size: md, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: shokunin
    emotion: surprised
    text: クラゲを作っとって、カニけ！？
  - speaker: kenkyu
    emotion: thinking
    text: 刻んだ筋の切れ方が、カニの身のほぐれ方に似ています。
  - speaker: reimu
    text: 能登では香箱ガニが、子どものおやつになるほど身近でした。
    reading: のとでわ こうばこがにが、こどもの おやつに なるほど みぢかでした。
  - speaker: shokunin
    emotion: happy
    text: カニの身なら、能登のもんは子どもの時から食べ慣れとるわ。
  - speaker: zundamon
    emotion: thinking
    text: でも、クラゲの材料じゃ味を付けたら溶ける……。
  - speaker: zundamon
    emotion: surprised
    text: ……待てよ。うちの本業は、かまぼこだ！
  - speaker: shokunin
    emotion: normal
    text: すり身なら、味を付けても溶けんわ。毎日こねとるがやぞ。
  - speaker: zundamon
    emotion: happy
    text: '[灯台下暗し|とうだいもとくらし]だ。近くに立派な原料があったのに、すぐには気付かなんだ。'
  - speaker: shokunin
    emotion: thinking
    text: 気付くまでに、どんだけクラゲを溶かしたがや。
    beat: true
  - speaker: zundamon
    emotion: happy
    text: 手帳に書いておこう。失敗作、カニの歯ざわり。
  - speaker: shokunin
    emotion: surprised
    text: 失敗作まで、書くがけ。
- id: card1972
  title: ''
  background: kk_card_1972
  cuts:
  - speaker: reimu
    text: 1972年7月。すり身の、かにあしが生まれます。
    reading: せんきゅうひゃく ななじゅうにねん しちがつ。すりみの かにあしが うまれます。
- id: ch4_kaniashi
  title: かにあし誕生
  background: kk_koba
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 杉野芳人, emotion: happy}
  - {who: shokunin, x: 0.7, emotion: happy}
  cuts:
  - speaker: shokunin
    emotion: happy
    text: 昆布とかつおの[出汁|だし]で、すり身に味を付けたぞ。
  - speaker: zundamon
    emotion: happy
    text: それを細く刻んで、カニの脚の身をほぐしたみたいにする。
  - speaker: shokunin
    emotion: thinking
    text: 包丁で全部刻んどったら、日が暮れるわ。
  - speaker: zundamon
    emotion: normal
    text: 刻むのは、機械に任せよう。
  - speaker: zundamon
    emotion: happy
    text: ……どうだ。ほぐれ方まで、カニの脚の身だ！
  - speaker: shokunin
    emotion: happy
