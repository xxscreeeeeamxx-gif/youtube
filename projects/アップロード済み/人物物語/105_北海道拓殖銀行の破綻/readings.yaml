# takugin-kawatani 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 河谷禎昌 / label: 山内宏・藤田恒郎・石川要三 ほか）とテロップ・章タイトルは表示専用なのでタグを付けていない。
# 山内宏・藤田恒郎の名の読みは事実台帳で確かめられていないので、本文では読ませていない
# （山内はナレでも「前の頭取」と言い、藤田は姓だけを読ませる）。
# 1行（いっこう）・13行・1日（いちにち）・殿・目処・一言・お札・お上・大通・止めれば・断って・並べて・何とか は
# 文脈で読みが変わるので台帳に入れず、本文の該当箇所だけタグを付けた。
# 2026-11-01 見直し: 河谷・都銀・道銀・船底・追い貸し のタグの読みはカタカナで書いた（[河谷|カワタニ] など）。
# 日債銀 はタグなしのほうが1語で読むので、台帳とタグから外した。
