meta:
  title: 拓銀の最後の頭取「船底を見たら大穴あいてる」、大手銀行のトップでただ一人刑務所へ【ずんだもん解説】
  slug: takugin-kawatani
  hook_line: つぶれないはずの都市銀行は、なぜ破綻し、なぜ頭取だけが服役したのか。
  summary: 1997年11月、日本中がサッカーに沸いた夜が明けて、北海道拓殖銀行の頭取が会見で頭を下げました。都市銀行の破綻は、後にも先にも、この一度だけです。後始末を託された13代目の頭取、河谷禎昌。赤字のホテルなどへの融資を、彼はどう判断したのか。合併はなぜ実らなかったのか。一審の無罪と二審の逆転有罪、最高裁の判断と本人の主張を並べながら、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 衆議院 予算委員会 第141回国会 第10号 会議録（1997年12月9日、参考人 河谷禎昌） https://kokkai.ndl.go.jp/txt/114105261X01019971209/193
  - 参議院 行財政改革・税制等に関する特別委員会 第8号 会議録（1997年11月17日、三塚大蔵大臣の報告） https://kokkai.ndl.go.jp/txt/114114269X00819971117/2
  - 最高裁判所第三小法廷 平成21年11月9日決定（平成18年(あ)第2057号） https://www.courts.go.jp/assets/hanrei/hanrei-pdf-38159.pdf
  - 預金保険機構「預金等全額保護制度下における破綻処理（資金援助）の終了等について」（2003年3月6日） https://www.dic.go.jp/katsudo/page_000901.html
  - ダイヤモンド・オンライン「北海道拓殖銀行『最後の頭取』84歳」（河谷禎昌の著書の抜粋、2019年10月） https://diamond.jp/articles/-/217007
  - 北海道新聞「河谷禎昌さん死去　90歳　北海道拓殖銀行、最後の頭取」（2025年12月15日） https://www.hokkaido-np.co.jp/article/1252127/
  tags:
  - 拓銀
  - 北海道拓殖銀行
