  - speaker: tsumugi
    emotion: normal
    text: それと、銀行がつぶれた日は窓口が混むの。
  - speaker: tsumugi
    emotion: normal
    text: でも[拓銀|たくぎん]の預金は、[北洋|ほくよう]や中央信託に引き継がれたわ。
  - speaker: tsumugi
    emotion: normal
    text: 慌てて解約する前に、国と受け皿の銀行の発表を確かめて。
  - speaker: tsumugi
    emotion: thinking
    text: 取引先の銀行が破綻すると、借りる側も困るの。
  - speaker: tsumugi
    emotion: thinking
    text: 破綻のあと、新しい融資を受けられなくなった会社があったと国会でも取り上げられたわ。
  - speaker: tsumugi
    emotion: normal
    text: それから、銀行の株は0になることもあるの。[拓銀|たくぎん]の株は、上場廃止になったわ。
