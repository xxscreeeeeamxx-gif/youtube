scenes:
# ---- 先出し（1997年11月16日の夜 → 17日の朝） ----
- id: co_yoru
  title: ''
  background: tk_tv_yoru
  bgm: serious
  stage:
  - {who: zundamon, x: 0.4, flip: true, tag: 河谷禎昌, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1997年11月16日の夜。日本中がW杯の初出場に沸くなか、ある銀行の頭取はテレビを見ていました。
    reading: せんきゅうひゃく きゅうじゅうななねん じゅういちがつ じゅうろくにちの よる。にほんじゅうが わーるどかっぷの はつしゅつじょうに わく なか、ある ぎんこうの とうどりわ てれびお みて いました。
  - speaker: zundamon
    emotion: thinking
    text: ……家に帰れば、記者が来てうるさいからな。
  - speaker: zundamon
    emotion: sad
    text: ただ、ぼーっと見てるだけなのだ。
- id: co_kaiken
  title: ''
  background: tk_kaiken
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 河谷禎昌, emotion: sad}
  - {who: kisha, x: 0.7, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 翌朝8時20分。札幌の本店です。
    reading: よくあさ はちじ にじゅっぷん。さっぽろの ほんてんです。
  - speaker: kisha
    emotion: surprised
    text: 頭取！ [拓銀|たくぎん]は、どうなるんですか！
  - speaker: zundamon
    emotion: sad
    text: 大変皆様におかれましては、ご迷惑おかけして大変申し訳ありません。
  - speaker: reimu
    text: 北海道拓殖銀行の破綻です。都市銀行の破綻は後にも先にも、この一度だけです。
    reading: ほっかいどう たくしょく ぎんこうの はたんです。としぎんこうの はたんわ あとにも さきにも、この いちどだけです。
  - speaker: reimu
    text: この頭取は、河谷禎昌。12年後、大手銀行のトップでただ一人刑務所に入ります。
    reading: この とうどりわ、かわたに さだまさ。じゅうにねんご、おおて ぎんこうの とっぷで ただ ひとり けいむしょに はいります。
# ---- 今の部屋（全財産を一つの銀行に） ----
- id: hook
  title: ''
  background: tk_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ ボクの全財産、ぜんぶ一つの銀行に預けたのだ！
    se: jaan
  - speaker: tsumugi
    emotion: normal
    text: なんで一つに？
  - speaker: zundamon
    emotion: happy
    text: 大きい銀行は、絶対つぶれないもん！
  - speaker: tsumugi
    emotion: thinking
    text: その大きい都市銀行が、1997年につぶれたのよ。
  - speaker: zundamon
    emotion: surprised
    text: つぶれないはずの都市銀行が、なんで！？
  - speaker: tsumugi
    emotion: normal
    text: しかも後始末に来た頭取だけが、刑務所に入ったの。
    telops:
    - {text: "なぜ頭取だけが刑務所に？", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: ……なんで、その人だけ？
# ---- 1993年8月・経営会議 ----
- id: card1993
  title: ''
  background: tk_card_1993
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 1993年8月。拓銀の経営会議です。副頭取は河谷禎昌、58歳でした。
    reading: せんきゅうひゃく きゅうじゅうさんねん はちがつ。たくぎんの けいえい かいぎです。ふくとうどりわ かわたに さだまさ ごじゅうはっさいでした。
- id: ch1_kaigi
  title: もう少し時間がほしい
  background: tk_kaigi
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 河谷禎昌, emotion: thinking}
  - {who: yamauchi, x: 0.52, emotion: normal}
  - {who: gyoin, x: 0.8, emotion: thinking}
  cuts:
  - speaker: gyoin
    emotion: thinking
    text: 審査部です。ソフィアグループは先月ご報告したとおり、実質倒産の状態です。
  - speaker: yamauchi
    emotion: surprised
    text: ホテルは、4月に開けたばかりだろう。
  - speaker: gyoin
    emotion: normal
    text: 11階建てで304室。建てるお[金|かね]の大半は、うち[1行|いっこう]で貸しました。
  - speaker: gyoin
    emotion: thinking
    text: ところが毎月の売上では、その月の経費も払えません。
  - speaker: zundamon
    emotion: thinking
    text: 足りない分は？
  - speaker: gyoin
    emotion: normal
    text: うちの追加融資です。[止めれば|とめれば]、その日に倒れます。
  - speaker: zundamon
    emotion: surprised
    text: うちの[金|かね]で、毎月の赤字を埋めてるわけか。
    beat: true
  - speaker: yamauchi
    emotion: thinking
    text: 副頭取。どう見る。
  - speaker: zundamon
    emotion: thinking
    text: 我々もようやく、ソフィアの実態が分かりかけてきたところだ。
  - speaker: zundamon
    emotion: normal
    text: もう少し時間がほしい。
    telops:
    - {text: "河谷「もう少し時間がほしい」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: reimu
    text: 議事録に残る、副頭取の言葉です。このあと5か月、経営会議は開かれませんでした。
    reading: ぎじろくに のこる、ふくとうどりの ことばです。この あと ごかげつ けいえい かいぎわ ひらかれませんでした。
  - speaker: reimu
    text: そのあいだも抜本策のないまま、ホテルへの融資は続きます。
    reading: その あいだも ばっぽんさくの ない まま、ほてるえの ゆうしわ つづきます。
  - speaker: reimu
    text: 河谷は1957年の入行。新人のころに倒産銀座で、貸した金の回収をたたき込まれました。
    reading: かわたにわ せんきゅうひゃく ごじゅうななねんの にゅうこう。しんじんの ころに とうさんぎんざで、かした かねの かいしゅうお たたきこまれました。
  - speaker: reimu
    text: 回収を知る男が、のちに実質倒産の会社への融資で罪に問われます。
    reading: かいしゅうお しる おとこが、のちに じっしつ とうさんの かいしゃえの ゆうしで つみに とわれます。
# ---- 1994年・頭取に ----
- id: card1994
  title: ''
  background: tk_card_1994
  cuts:
  - speaker: reimu
    text: 1994年。頭取が、配当を減らした責任をとって退きます。
    reading: せんきゅうひゃく きゅうじゅうよねん。とうどりが、はいとうお へらした せきにんお とって しりぞきます。
- id: ch1_shimei
  title: 頭取なんてやるんでない
  background: tk_yakuin
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 河谷禎昌, emotion: normal}
  - {who: yamauchi, x: 0.7, emotion: normal}
  cuts:
  - speaker: yamauchi
    emotion: normal
    text: '[河谷|カワタニ]くん。次の頭取を、頼みたい。'
  - speaker: zundamon
    emotion: surprised
    text: ……この時期に、ですか。
  - speaker: yamauchi
    emotion: thinking
    text: 頼む。
- id: ch1_tsuma
  title: ''
  background: tk_yakuin
  stage:
  - {who: zundamon, x: 0.4, flip: true, tag: 河谷禎昌, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: sad
    text: ……女房には、怒られたよ。
  - speaker: zundamon
    emotion: thinking
    text: 頭取なんてやるんでない、こんな時期にね……って。
  - speaker: zundamon
    emotion: thinking
    text: 上にへつらってまで、出世する必要はない。それが口ぐせの人だからな。
  - speaker: reimu
    text: 6月。59歳の河谷は、拓銀の13代目の頭取に就きます。
    reading: ろくがつ。ごじゅうきゅうさいの かわたにわ、たくぎんの じゅうさんだいめの とうどりに つきます。
# ---- 1994年7月〜・ホテルへの融資 ----
- id: ch1_oigashi
  title: 2週間に1回の8800万円
  background: tk_yakuin
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 河谷禎昌, emotion: thinking}
  - {who: gyoin, x: 0.7, emotion: normal}
  cuts:
  - speaker: gyoin
    emotion: normal
    text: 頭取。ソフィアのホテルから、今月分の申し込みです。
  - speaker: zundamon
    emotion: thinking
    text: また、赤字の穴埋めか。
  - speaker: gyoin
    emotion: thinking
    text: 売上だけでは、その月の経費が払えませんので。
  - speaker: gyoin
    emotion: thinking
    text: 担保は、もうほとんど……。
  - speaker: zundamon
    emotion: thinking
    text: 止めたら？
  - speaker: gyoin
    emotion: normal
    text: その日に倒れます。これまで貸した分も、戻りません。
  - speaker: zundamon
    emotion: thinking
    text: ……出そう。
    beat: true
  - speaker: reimu
    text: 河谷の在任中、ホテルを含むソフィアグループ3社への融資は88回。合わせて77億3150万円です。
    reading: かわたにの ざいにんちゅう、ほてるお ふくむ そふぃあぐるーぷ さんしゃえの ゆうしわ はちじゅうはっかい。あわせて ななじゅうななおく さんぜん ひゃくごじゅうまんえんです。
  - speaker: reimu
    text: 平均すると、約2週間に1回。1回あたり8800万円です。家が1軒建つお金です。
    reading: へいきん すると、やく にしゅうかんに いっかい。いっかい あたり はっせん はっぴゃくまんえんです。いえが いっけん たつ おかねです。
    telops:
    - {text: "約2週間に1回・8800万円", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: 河谷はのちに、この融資を本にこう書いています。
    reading: かわたにわ のちに、この ゆうしお ほんに こう かいて います。
  - speaker: zundamon
    emotion: thinking
    text: すでに10万人という兵隊を戦場に送ってしまっている。黙っていると、全滅する。
  - speaker: zundamon
    emotion: thinking
    text: だから[何とか|なんとか]10万の兵の一部でも助けるため、1万人の援軍を送った。
  - speaker: zundamon
    emotion: angry
    text: もしこれで戦死者が出たから罪だというのであれば、[日本中|にほんじゅう]の銀行員が[罪人|ざいにん]になる。
    telops:
    - {text: "河谷「日本中の銀行員が罪人になる」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: reimu
    text: この援軍が、のちに特別背任に問われます。最高裁が求めたのは、客観的な再建計画と行内の正式な承認でした。
    reading: この えんぐんが、のちに とくべつ はいにんに とわれます。さいこうさいが もとめたのわ、きゃっかんてきな さいけん けいかくと こうないの せいしきな しょうにんでした。
# ---- 1994年8月・大蔵省の検査 ----
- id: ch1_funazoko
  title: 船底の大穴
  background: tk_yakuin
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 河谷禎昌, emotion: thinking}
  - {who: gyoin, x: 0.7, emotion: thinking}
  cuts:
  - speaker: gyoin
    emotion: thinking
    text: 頭取、8月の大蔵省の検査です。関連会社まで入れると、不良債権は1兆円近くあります。
  - speaker: zundamon
    emotion: surprised
    text: い、1兆円……！？
  - speaker: zundamon
    emotion: thinking
    text: '[船底|フナゾコ]を見たら、大穴あいてるな……。'
    se: gaan
  - speaker: zundamon
    emotion: sad
    text: ……しまった。
  - speaker: gyoin
    emotion: thinking
    text: 株も土地も、まだ下がり続けています。
  - speaker: zundamon
    emotion: thinking
    text: 何もしなくても、不良債権額がどんどん増えていく。
  - speaker: zundamon
    emotion: sad
    text: まさに悪夢だ。
  - speaker: gyoin
    emotion: normal
    text: 大口はカブトデコムに子会社の抵当証券、それにソフィアです。
  - speaker: zundamon
    emotion: thinking
    text: カブトか……。業務本部長のころ、常務に言ったんだがな。
  - speaker: zundamon
    emotion: angry
    text: これは土地を転がしているだけで危ないぞ、と。
  - speaker: gyoin
    emotion: surprised
    text: それで、どうなったんです？
  - speaker: zundamon
    emotion: sad
    text: 明確な回答は、なかったよ。
  - speaker: gyoin
    emotion: thinking
    text: 新しい会社を育てる部が、営業と審査を一つでやってましたからね。
  - speaker: zundamon
    emotion: thinking
    text: アクセルとブレーキを、同じ足で踏んでたわけだ。
  - speaker: zundamon
    emotion: thinking
    text: ……だが、あの路線を大事な柱と見ていたのは私も同じだ。
  - speaker: gyoin
    emotion: normal
    text: でも、[都銀|トギン]はつぶれませんよね。大蔵省がついてますし……。
  - speaker: zundamon
    emotion: thinking
    text: ……そう、信じたいな。
# ---- 1995〜1996年・合理化 ----
- id: ch2_kubikiri
  title: 首切り河谷
  background: tk_kaigi
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 河谷禎昌, emotion: thinking}
  - {who: gyoin, x: 0.7, emotion: sad}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: ……決算は、どうだった。
  - speaker: gyoin
    emotion: sad
    text: 頭取、1995年3月期の決算です。設立以来、初めての赤字です。
    background: tk_kaigi_akaji
  - speaker: zundamon
    emotion: thinking
    text: ……削れるものは、全部削る。
  - speaker: gyoin
    emotion: surprised
    text: 全部、ですか。
  - speaker: zundamon
    emotion: normal
    text: 野球部などの運動部は廃止。会長と相談役と顧問も、なくす。
  - speaker: gyoin
    emotion: thinking
    text: 人は、どこまで減らします？
  - speaker: zundamon
    emotion: normal
    text: 6500人を、5000人まで。海外の店からは全面的に撤退する。
  - speaker: zundamon
    emotion: normal
    text: ボーナスも、カットだ。
  - speaker: gyoin
    emotion: thinking
    text: '[行内|こうない]では、頭取のことを首切り[河谷|カワタニ]と……。'
  - speaker: zundamon
    emotion: angry
    text: 言わせておけ。
  - speaker: zundamon
    emotion: thinking
    text: 焼け石に水かもしれないが、少しでもやらなければ。
  - speaker: gyoin
    emotion: thinking
    text: '[業容|ぎょうよう]では、[地銀|ちぎん]の横浜銀行にも抜かれました。[都銀|トギン][13行|じゅうさんこう]で、うちはいつも最下位です。'
  - speaker: zundamon
    emotion: angry
    text: 最下位でも、[都銀|トギン]は[都銀|トギン]だ。
  - speaker: gyoin
    emotion: thinking
    text: ……[地銀|ちぎん]に抜かれた[都銀|トギン]、ですけどね。
    se: tsukkomi
  - speaker: zundamon
    emotion: sad
    text: ……一服させてくれ。
  - speaker: gyoin
    emotion: normal
    text: たばこ代も、削りますか。
  - speaker: zundamon
    emotion: angry
    text: それは、最後だ。
    beat: true
  - speaker: reimu
    text: 河谷はのちに、都銀としてのプライドはなかなか捨てきれなかった、と書いています。
    reading: かわたにわ のちに、とぎんと しての ぷらいどわ なかなか すてきれなかったと かいて います。
  - speaker: reimu
