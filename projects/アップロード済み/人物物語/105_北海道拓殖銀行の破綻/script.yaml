    reading: べつの ぎいんわ ふりょう さいけんわ いっちょう せんよんひゃく きゅうじゅうななおくえんでわ ないかと たしかめ、とうやの ほてるえの ろっぴゃく におくえんの たんぽも といます。
  - speaker: zundamon
    emotion: sad
    text: 先生の御指摘のとおり、それが正しゅうございます。
  - speaker: zundamon
    emotion: sad
    text: 極めてゼロに近い担保価値というように私も思っております。
  - speaker: reimu
    text: 本業のもうけで処理すれば10年はかかる、とも指摘されました。
    reading: ほんぎょうの もうけで しょり すれば じゅうねんわ かかるとも してき されました。
  - speaker: zundamon
    emotion: sad
    text: いや、先生のおっしゃるとおりでございます。
  - speaker: zundamon
    emotion: sad
    text: その環境のもとでベストジャッジメントをしたというように私は考えております。
  - speaker: zundamon
    emotion: sad
    text: 結果的にはこういう大きな不良債権を生じたわけでございますので……
  - speaker: zundamon
    emotion: sad
    text: この道義的、社会的責任というのはかなり重大である。
  - speaker: zundamon
    emotion: thinking
    text: '[道銀|ドーギン]さんとの合併がうまくいっておれば……'
  - speaker: zundamon
    emotion: thinking
    text: しかしこれは、ればたらの世界ですから。
    beat: true
  - speaker: zundamon
    emotion: normal
    text: 雇用については、全力を挙げて進めたいと思います。
# ---- 1999〜2003年・逮捕と一審 ----
- id: card1999
  title: ''
  background: tk_card_1999
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 1999年3月。河谷は前の頭取とともに、特別背任の疑いで逮捕されます。64歳でした。
    reading: せんきゅうひゃく きゅうじゅうくねん さんがつ。かわたにわ まえの とうどりと ともに、とくべつ はいにんの うたがいで たいほ されます。ろくじゅうよんさいでした。
  - speaker: reimu
    text: 本人はのちに、署名を迫られて無力感から調書にサインした、と書いています。
    reading: ほんにんわ のちに、しょめいお せまられて むりょくかんから ちょうしょに さいん したと かいて います。
