    text: ボクの全財産も、銀行が倒れたら全額守られるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 1997年は、預金を全額守る特例があったの。
  - speaker: tsumugi
    emotion: normal
    text: いまは1つの銀行ごとに、1人あたり元本1000万円とその利息までよ。
    telops:
