  - speaker: tsumugi
    emotion: normal
    text: 利息のつかない普通預金のような決済用の預金は、全額守られるわ。
  - speaker: zundamon
    emotion: surprised
    text: 1000万円を超えてたら……！？
  - speaker: tsumugi
    emotion: normal
    text: 同じ銀行に1000万円より多く預けてるなら、どこまで守られるかを知っておいてね。
  - speaker: zundamon
    emotion: thinking
    text: ……ボクの全財産、3万円だったのだ。
