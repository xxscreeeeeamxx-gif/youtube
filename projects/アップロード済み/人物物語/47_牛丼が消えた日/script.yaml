  bgm: amacha_hoshizora
  stage:
  - {who: kyaku, x: 0.3, emotion: sad}
  - {who: tenin, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
    text: 店は、最後の一杯を求める客で混み合いました。
    reading: みせわ、さいごの いっぱいお もとめる きゃくで こみあいました。
  - speaker: kyaku
    emotion: sad
    text: '[並盛|なみもり]、一つ。……今日で、最後なんだろ。'
  - speaker: tenin
    emotion: sad
    text: はい。この鍋で、最後です。
  - speaker: kyaku
    emotion: thinking
    text: 明日から、何を食えばいいんだ。
  - speaker: tenin
    emotion: normal
    text: ……必ず、また出します。
  - speaker: kyaku
    emotion: thinking
    text: いつになる。
  - speaker: tenin
    emotion: sad
    text: 分かりません。でも、同じ味で出します。
  - speaker: kyaku
    emotion: normal
    text: ……何年でも、待つよ。
  - speaker: tenin
    emotion: happy
    text: ……ありがとうございます。
  - speaker: reimu
    text: まもなく店には、牛丼の代わりに豚丼が並びます。
    reading: まもなく みせにわ、ぎゅうどんの かわりに ぶたどんが ならびます。
- id: ch10_akaji
  title: ''
  background: gd_jimusho
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 安部修仁, emotion: thinking}
  - {who: shain, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
    text: 吉野家は、本業で赤字に転落します。
    reading: よしのやわ、ほんぎょうで あかじに てんらくします。
  - speaker: shain
    emotion: sad
    text: 社長。お客さんが、ずいぶん減りました。
  - speaker: zundamon
    emotion: thinking
    text: そうだろうな。
  - speaker: shain
    emotion: thinking
    text: 牛丼はまだかって、毎日のように聞かれます。
  - speaker: zundamon
    emotion: sad
    text: ……そうか。
  - speaker: reimu
    text: 2005年2月11日。残っていた在庫で、一日だけ牛丼を出します。
    reading: にせん ごねん にがつ じゅういちにち。のこっていた ざいこで、いちにちだけ ぎゅうどんお だします。
  - speaker: reimu
    text: 1店あたり1500食ほど。数時間で売り切れる店が続きました。
    reading: いってん あたり せんごひゃくしょく ほど。すうじかんで うりきれる みせが つづきました。
  - speaker: shain
    emotion: happy
    text: 社長。あっという間に、売り切れました。
  - speaker: zundamon
    emotion: surprised
    text: ……もう、売り切れたのか。
- id: ch10_saiteishi
  title: ''
  background: gd_jimusho
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 安部修仁, emotion: normal}
  - {who: kakari, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 2005年12月、米国産の牛肉の輸入が再開されます。
    reading: にせん ごねん じゅうにがつ、べいこくさんの ぎゅうにくの ゆにゅうが さいかいされます。
  - speaker: kakari
    emotion: happy
    text: 社長！ 輸入が、再開されました！
  - speaker: zundamon
    emotion: happy
    text: 準備するのだ。鍋も、たれも、人もなのだ。
  - speaker: kakari
    emotion: happy
    text: 店のみんなに、知らせてきます。
  - speaker: reimu
    text: ところが翌月、届いた肉に背骨が混ざっているのが見つかり、輸入はまた止まります。
    reading: ところが よくげつ とどいた にくに せぼねが まざっているのが みつかり、ゆにゅうわ また とまります。
  - speaker: kakari
    emotion: sad
    text: 社長……また、止まりました。
  - speaker: zundamon
    emotion: sad
    text: ……また、待つのだ。
  - speaker: kakari
    emotion: thinking
    text: 店のみんなに、なんて言えば。
  - speaker: zundamon
    emotion: normal
    text: ……ありのままを、伝えてほしいのだ。
  - speaker: kakari
    emotion: sad
    text: ……はい。
  - speaker: reimu
    text: 輸入がもう一度再開されたのは、2006年7月のことでした。
    reading: ゆにゅうが もう いちど さいかい されたのわ、にせん ろくねん しちがつの ことでした。
- id: card2006
  title: ''
  background: gd_card_2006
  cuts:
  - speaker: reimu
    text: 2006年9月18日。
    reading: にせん ろくねん くがつ じゅうはちにち。
- id: ch11_fukkatsu
  title: 950日
  background: gd_gyoretsu
  bgm: amacha_milkyway
  stage:
  - {who: kyaku, x: 0.3, emotion: happy}
  - {who: tenin, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: そして、牛丼が一日限定で戻ってきます。
    reading: そして、ぎゅうどんが いちにち げんていで もどってきます。
  - speaker: reimu
    text: 全国で100万食。牛丼が消えてから、950日目でした。
    reading: ぜんこくで ひゃくまんしょく。ぎゅうどんが きえてから、きゅうひゃく ごじゅうにちめでした。
    telops:
    - {text: "牛丼が消えてから950日", size: lg, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: kyaku
    emotion: happy
    text: '[並盛|なみもり]、一つ。……待ったぞ。'
  - speaker: tenin
    emotion: happy
    text: お待たせしました。
  - speaker: kyaku
    emotion: thinking
    text: ……前と、同じ味だ。
  - speaker: tenin
    emotion: happy
    text: 同じ味で出すって、決めてましたから。
  - speaker: kyaku
    emotion: happy
    text: 何年でも待つって、言っただろ。
  - speaker: tenin
    emotion: happy
    text: 2年半、待たせました。
  - speaker: reimu
    text: 2008年、牛丼を24時間いつでも出せるようになります。
    reading: にせん はちねん、ぎゅうどんお にじゅうよじかん いつでも だせる ように なります。
- id: ch12_ronsou
  title: 意地を張って損をした？
  background: gd_shiryo
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。ネットで見たのだ。吉野家は、意地を張って損をしたって。
  - speaker: tsumugi
    emotion: normal
    text: そういう声は、当時からあったわ。
  - speaker: tsumugi
    emotion: thinking
    text: 牛丼しかない店が牛丼を止めたら、倒れるか弱るって、専門家からも疑問が出たの。
  - speaker: zundamon
    emotion: thinking
    text: 実際、赤字になったのだ。
  - speaker: tsumugi
    emotion: normal
    text: よその店は、別の国の肉に切り替えて、牛丼を出したわ。
  - speaker: tsumugi
    emotion: normal
    text: '[米国産|べいこくさん]を使わずに、そのまま何年も出し続けた店もある。'
  - speaker: zundamon
    emotion: normal
    text: お客さんからすると、そっちのほうが助かったのだ。
  - speaker: tsumugi
    emotion: happy
    text: そうね。食べたいときに食べられるのは、大事なことよ。
  - speaker: zundamon
    emotion: surprised
    text: じゃあ、吉野家が間違ってたのだ？
  - speaker: tsumugi
    emotion: thinking
    text: でも、復活の日に行列ができたのも本当。
  - speaker: tsumugi
    emotion: normal
    text: 同じ味を待っていた人が、それだけいたってことよ。
  - speaker: zundamon
    emotion: thinking
    text: どっちも、正しいのか。
  - speaker: tsumugi
    emotion: normal
    text: お店が違えば、守りたいものも違うの。
  - speaker: zundamon
    emotion: thinking
    text: そもそも、アメリカの牛肉は、危なくないのだ？
  - speaker: tsumugi
    emotion: normal
    text: 心配する声は、復活のときにも出たわ。
  - speaker: tsumugi
    emotion: normal
    text: 病気のもとは、背骨などの決まった部分にたまりやすいの。
  - speaker: tsumugi
    emotion: normal
    text: 大事なのは、そこを取り除く決まりが、守られているかどうか。
  - speaker: tsumugi
    emotion: thinking
    text: 背骨の混ざった肉が見つかったときも、輸入はすぐ止まったでしょ。
  - speaker: zundamon
    emotion: surprised
    text: 決まりを破ったら、すぐ止まるのだ。
  - speaker: tsumugi
    emotion: normal
    text: 2008年には、吉野家の倉庫でも背骨が見つかってる。店には出ていないけどね。
  - speaker: zundamon
    emotion: surprised
    text: 吉野家も、完璧じゃないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 完璧なお店はないわ。だから、見張る仕組みがあるのよ。
  - speaker: zundamon
    emotion: normal
    text: 大事なのは、どこの国の肉かより、決まりを守れているかなのだ。
- id: ch13_intai
  title: 3年後の自分
  background: gd_jimusho
  bgm: amacha_hoshizora
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 安部修仁, emotion: normal}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2014年、安部は22年務めた吉野家の社長を退きました。
    reading: にせん じゅうよねん、あべわ にじゅうにねん つとめた よしのやの しゃちょうお しりぞきました。
  - speaker: kisha
    emotion: normal
    text: 安部さん。迷ったとき、どうやって決めてきたんですか。
  - speaker: zundamon
    emotion: thinking
    text: 3年後の自分から、今の自分を眺めるのだ。
  - speaker: kisha
    emotion: surprised
    text: 3年後から、ですか。
  - speaker: zundamon
    emotion: normal
    text: 3年後の自分が見て、納得できるほうを選ぶのだ。
  - speaker: zundamon
    emotion: normal
    text: 会社が潰れてから、考え方が変わったのだ。
  - speaker: reimu
    text: 倒産を境に、成長を何より優先する経営から、安全を何より優先する経営に変わった、と安部は語っています。
    reading: とうさんお さかいに せいちょうお なにより ゆうせんする けいえいから、あんぜんお なにより ゆうせんする けいえいに かわったと あべわ かたっています。
- id: ch14_gendai
  title: 498円の一杯
  background: gd_ima
  bgm: amacha_milkyway
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 吉野家は今、国内に1300店ほど。
  - speaker: zundamon
    emotion: thinking
    text: 牛丼の値段は、どうなったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 2001年に280円だった[並盛|なみもり]は、
  - speaker: tsumugi
    emotion: normal
    text: 2024年の夏から、498円よ。
  - speaker: zundamon
    emotion: surprised
    text: 倍近いのだ！
  - speaker: tsumugi
    emotion: thinking
    text: お肉も、お[米|こめ]も、いろんなものが値上がりしたからね。
  - speaker: tsumugi
    emotion: normal
    text: 家で温めるだけの、冷凍の牛丼の具も、これまでに5億食に達してるの。
  - speaker: zundamon
    emotion: happy
    text: ボクの家の冷凍庫にも、入ってるぞ。
  - speaker: tsumugi
    emotion: angry
    text: それを使えば、さっきの牛丼も助かったのに。
  - speaker: zundamon
    emotion: sad
    text: 豚肉と粉のたれのことは、忘れてほしいのだ。
- id: shime
  title: ''
  background: gd_ima
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 今度牛丼を食べるときは、ひと口目の味を覚えておいて。
  - speaker: zundamon
    emotion: thinking
    text: 覚えて、どうするのだ。
  - speaker: tsumugi
    emotion: normal
    text: 次に食べたとき、同じ味だったら、それは誰かが毎日守ってる味よ。
  - speaker: zundamon
    emotion: surprised
    text: 同じ味が、当たり前だと思ってたのだ。
  - speaker: tsumugi
    emotion: normal
    text: 当たり前にするために、950日も止めた人たちがいたの。
  - speaker: zundamon
    emotion: thinking
    text: 変えないために、止めたのか。
  - speaker: tsumugi
    emotion: happy
    text: そう。変えずに待つのは、変えるより大変なのよ。
  - speaker: zundamon
    emotion: happy
    text: ボクも、今日から牛丼は変えないのだ。
  - speaker: tsumugi
    emotion: happy
    text: 何にするの？
  - speaker: zundamon
    emotion: happy
    text: 豚丼なのだ。
  - speaker: tsumugi
    emotion: angry
    text: ……それは、変えてるのよ。
    se: oti
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
