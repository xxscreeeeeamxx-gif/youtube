meta:
  title: 【牛丼が消えた日】代わりの肉なら売れた。それでも止めた男【ずんだもん解説】
  slug: yoshinoya-abe
  summary: 牛丼しか売っていない店から、牛丼が消えたことがあります。代わりの肉を使えば、売り続けることはできました。それでも、その店は止めました。決めたのは、時給の高さで店を選んだ元アルバイトの社長です。しかも彼が働いてきた会社は、一度潰れていました。明治の魚市場から始まる、一杯の味をめぐる物語です。
  tags:
  - 吉野家
  - 安部修仁
  - 牛丼
  - BSE
  - 会社更生法
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 外食
  thumbnail:
    top: 牛丼が消えた
    bottom: 牛丼が消えた日
  mode: drama
  narrator: reimu
