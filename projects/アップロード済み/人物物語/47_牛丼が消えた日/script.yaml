scenes:
- id: hook
  title: ''
  background: gd_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。今日は、ボクが牛丼を作るのだ。
  - speaker: tsumugi
    emotion: happy
    text: いいわね。お肉は、何にしたの？
  - speaker: zundamon
    emotion: normal
    text: 豚肉なのだ。牛肉は、高いのだ。
  - speaker: tsumugi
    emotion: thinking
    text: それ、豚丼じゃない？
  - speaker: zundamon
    emotion: happy
    text: 丼に乗ってれば、だいたい牛丼なのだ。
  - speaker: tsumugi
    emotion: angry
    text: だいたいで済ませないで。
  - speaker: zundamon
    emotion: normal
    text: たれも、作るのが面倒だから、粉のスープの素を溶かすぞ。
  - speaker: tsumugi
    emotion: thinking
    text: 手抜きが、二段重ねになってるわよ。
  - speaker: zundamon
    emotion: happy
    text: できたのだ。いただきます。
  - speaker: zundamon
    emotion: thinking
    text: ……牛丼の味が、しない。
  - speaker: tsumugi
    emotion: normal
    text: そりゃ、そうよ。
  - speaker: zundamon
    emotion: angry
    text: なら今度は、牛肉を奮発するぞ。
  - speaker: tsumugi
    emotion: thinking
    text: たれは？
  - speaker: zundamon
    emotion: normal
    text: 粉のままなのだ。
  - speaker: zundamon
    emotion: sad
    text: ……やっぱり、お店の味にならないのだ。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: お肉か、たれか。一つ変えただけで、別の食べ物になるのよ。
  - speaker: zundamon
    emotion: thinking
    text: 牛丼って、代わりがきかないのか。
  - speaker: tsumugi
    emotion: normal
    text: そう考えて、本当に牛丼を止めた人がいるの。
  - speaker: zundamon
    emotion: surprised
    text: 止めた？
  - speaker: tsumugi
    emotion: normal
    text: 20年くらい前、[日本中|にほんじゅう]の吉野家から、牛丼が消えたことがあるのよ。
  - speaker: zundamon
    emotion: surprised
    text: 牛丼屋さんから、牛丼が！？
    se: don
  - speaker: tsumugi
    emotion: thinking
    text: 950日も。
  - speaker: zundamon
    emotion: normal
    text: 代わりのお肉で作れば、よかったのだ。
  - speaker: tsumugi
    emotion: normal
    text: よその店は、そうしたわ。でも、その店はしなかった。
  - speaker: zundamon
    emotion: angry
    text: お客さんが困るのだ。なんでなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 代わりのお肉だと、うちの味にならないからって。
  - speaker: zundamon
    emotion: thinking
    text: ……さっきのボクの牛丼と、同じ話なのだ。
  - speaker: reimu
    text: 牛丼チェーン、吉野家。100年以上続く店です。
    reading: ぎゅうどん ちぇえん、よしのや。ひゃくねん いじょう つづく みせです。
  - speaker: reimu
    text: 牛丼を止めると決めた社長は、アルバイトから入った安部修仁という男でした。
    reading: ぎゅうどんお とめると きめた しゃちょうわ、あるばいとから はいった あべ しゅうじという おとこでした。
  - speaker: zundamon
    emotion: surprised
    text: アルバイトから、社長！？
  - speaker: tsumugi
    emotion: thinking
    text: しかもその会社、一度潰れてるの。
  - speaker: zundamon
    emotion: surprised
    text: 波乱が、多すぎるのだ。
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、明治の魚市場よ。
- id: card1899
  title: ''
  background: gd_card_1899
  cuts:
  - speaker: reimu
    text: 1899年。東京・日本橋の魚市場で、一軒の牛丼の店が始まりました。
    reading: せんはっぴゃく きゅうじゅうきゅうねん。とうきょう にほんばしの うおいちばで、いっけんの ぎゅうどんの みせが はじまりました。
- id: ch0_uogashi
  title: 牛丼しかない店
  background: gd_uogashi
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 魚市場で働く人に、さっと食べてもらう店だったの。
  - speaker: zundamon
    emotion: thinking
    text: '[市場|いちば]の人は、朝が早いのだ。'
  - speaker: tsumugi
    emotion: happy
    text: 店の名前は、創業者が奈良の吉野の桜を好きだったから、と会社は説明してるわ。
  - speaker: zundamon
    emotion: surprised
    text: 桜なのに、牛丼なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 関東大震災で店が焼けて、[市場|いちば]と一緒に築地へ移るの。
  - speaker: zundamon
    emotion: normal
    text: お客さんに、ついていったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 戦後は、二代目の松田瑞穂さんが、店を大きくしていくわ。
  - speaker: tsumugi
    emotion: normal
    text: 1959年には、メニューを牛丼一つに絞ったの。
  - speaker: zundamon
    emotion: surprised
    text: 一つだけ！？ 定食とかは、無いのだ？
  - speaker: tsumugi
    emotion: normal
    text: 無いの。牛丼だけ。
  - speaker: zundamon
    emotion: happy
    text: 選ぶ手間が、省けるぞ。
  - speaker: tsumugi
    emotion: happy
    text: 作る側も、一つを極められるのよ。
  - speaker: tsumugi
    emotion: normal
    text: そして1968年、2号店を出して、チェーンになっていくの。
  - speaker: zundamon
    emotion: surprised
    text: やっと2号店なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 70年近く、かかったわね。
  - speaker: tsumugi
    emotion: normal
    text: ちょうど同じころ、福岡から一人の若者が上京してくるわ。
- id: card1968
  title: ''
  background: gd_card_1968
  cuts:
  - speaker: reimu
    text: 1968年ごろ。福岡の高校を出た安部修仁が、東京へ出てきます。
    reading: せんきゅうひゃく ろくじゅうはちねん ごろ。ふくおかの こうこうお でた あべ しゅうじが、とうきょうえ でてきます。
  - speaker: reimu
    text: 音楽の道を目指して、R&Bのバンドで活動していました。
    reading: おんがくの みちお めざして、あーるあんどびーの ばんどで かつどう していました。
- id: ch1_baito
  title: 時給で選んだ店
  background: gd_tenpo
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 安部修仁, emotion: normal}
  - {who: tencho, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1970年ごろ、安部は吉野家でアルバイトを始めます。
    reading: せんきゅうひゃく ななじゅうねん ごろ、あべわ よしのやで あるばいとお はじめます。
  - speaker: tencho
    emotion: normal
    text: 君、バンドをやってるんだって？
  - speaker: zundamon
    emotion: happy
    text: そうなのだ。
  - speaker: tencho
    emotion: thinking
    text: それで、どうしてうちに？
  - speaker: zundamon
    emotion: normal
    text: 正直に言うと、時給が高かったからなのだ。
  - speaker: tencho
    emotion: happy
    text: 正直でいいね。
  - speaker: tencho
    emotion: normal
    text: うちは牛丼しかない。覚えることは少ないけど、手は抜けないよ。
  - speaker: zundamon
    emotion: happy
    text: 一つしかないなら、すぐ覚えるぞ。
  - speaker: tencho
    emotion: normal
    text: お客さんを待たせないのが、うちのやり方だ。
  - speaker: zundamon
    emotion: surprised
    text: 待たせない。
  - speaker: tencho
    emotion: normal
    text: '[市場|いちば]の人も、会社の人も、急いでるからね。'
  - speaker: zundamon
    emotion: thinking
    text: バンドの練習より、忙しそうなのだ。
  - speaker: tencho
    emotion: happy
    text: 手は、すぐに慣れるよ。
- id: ch1_seishain
  title: ''
  background: gd_tenpo
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 安部修仁, emotion: normal}
  - {who: jinji, x: 0.7, emotion: normal}
  cuts:
  - speaker: jinji
    emotion: normal
    text: 安部くん。社員に、ならないか。
  - speaker: zundamon
    emotion: surprised
    text: ボクが、なのだ？
  - speaker: jinji
    emotion: normal
    text: 働きぶりを、ずっと見てきた。君になら、店を任せられる。
  - speaker: jinji
    emotion: happy
    text: 無理にとは言わない。考えておいてくれ。
  - speaker: zundamon
    emotion: thinking
    text: ……考えてみるのだ。
  - speaker: reimu
    text: 1972年、安部は正社員になりました。
    reading: せんきゅうひゃく ななじゅうにねん、あべわ せいしゃいんに なりました。
  - speaker: reimu
    text: 最初の半年は、築地の店で基本をたたき込まれます。
    reading: さいしょの はんとしわ、つきじの みせで きほんお たたきこまれます。
- id: ch2_tsukiji
  title: 築地の侍
  background: gd_tsukiji
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 安部修仁, emotion: normal}
  - {who: mizuho, x: 0.7, emotion: normal}
  cuts:
  - speaker: mizuho
    emotion: angry
    text: 遅い。
  - speaker: zundamon
    emotion: surprised
    text: まだ、盛り始めたばかりなのだ。
  - speaker: mizuho
    emotion: normal
    text: 客は待っている。
  - speaker: zundamon
    emotion: sad
    text: ……はい。
  - speaker: mizuho
    emotion: thinking
    text: つゆが多い。
  - speaker: zundamon
    emotion: thinking
    text: 多いほうが、お客さんが喜ぶと思ったのだ。
  - speaker: mizuho
    emotion: normal
    text: 決まった味を、毎回出す。それが、うちの約束だ。
  - speaker: zundamon
    emotion: surprised
    text: 毎回、同じ味。
  - speaker: mizuho
    emotion: normal
    text: 一杯でも違えば、客はそれを覚えている。
  - speaker: zundamon
    emotion: thinking
    text: 百杯うまくても、一杯まずいと、そっちを覚えられるのだ。
  - speaker: mizuho
    emotion: normal
    text: そうだ。
  - speaker: zundamon
    emotion: normal
    text: ……もう一回、盛るのだ。
  - speaker: mizuho
    emotion: normal
    text: 遅い。
  - speaker: zundamon
    emotion: angry
    text: 今のは、さっきより速かったぞ！
  - speaker: reimu
    text: 安部はのちに、この社長を、無口でせっかちな侍のような人だったと振り返っています。
    reading: あべわ のちに この しゃちょうお、むくちで せっかちな さむらいの ような ひとだったと ふりかえっています。
- id: ch2_tencho
  title: ''
  background: gd_tenpo
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 安部修仁, emotion: normal}
  - {who: baito, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 安部は入社してまもなく、店長を任されます。
    reading: あべわ にゅうしゃして まもなく、てんちょうお まかされます。
  - speaker: baito
    emotion: thinking
    text: 店長。つゆを多めにって、頼まれたんですけど。
  - speaker: zundamon
    emotion: normal
    text: 頼まれたら、足していいのだ。
  - speaker: baito
    emotion: happy
    text: じゃあ、ほかのお客さんにも、多めにしときます。
  - speaker: zundamon
    emotion: angry
    text: それはダメなのだ。いつもの一杯は、いつもの量なのだ。
  - speaker: baito
    emotion: surprised
    text: 細かいですね。
  - speaker: zundamon
    emotion: normal
    text: 築地で、さんざん言われたのだ。一杯でも違えば、お客さんは覚えてるって。
  - speaker: baito
    emotion: thinking
    text: 店長も、怒られたんですか。
  - speaker: zundamon
    emotion: happy
    text: 遅い、とも言われたぞ。
  - speaker: baito
    emotion: happy
    text: それは、今も言われてそうですね。
  - speaker: zundamon
    emotion: angry
    text: 余計なお世話なのだ。
- id: ch3_kakudai
  title: 200店の勢い
  background: gd_jimusho
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 安部修仁, emotion: normal}
  - {who: douryo, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 入社から5年後の1977年、安部は九州地区の本部長になります。
    reading: にゅうしゃから ごねんごの せんきゅうひゃく ななじゅうななねん、あべわ きゅうしゅう ちくの ほんぶちょうに なります。
  - speaker: douryo
    emotion: happy
    text: 安部、聞いたか。店が、もうすぐ200を超えるぞ。
  - speaker: zundamon
    emotion: surprised
    text: 2号店から、10年くらいなのだ。
  - speaker: douryo
    emotion: happy
    text: アメリカにも店を出してる。次は、アメリカで200店だってさ。
  - speaker: zundamon
    emotion: surprised
    text: 大きく出たのだ。
  - speaker: douryo
    emotion: normal
    text: 店を出せば出すほど、売り上げが増えるんだ。
  - speaker: douryo
    emotion: happy
    text: この勢いなら、どこまでも行けるさ。
- id: ch3_kyushu
  title: ''
  background: gd_tenpo
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 安部修仁, emotion: normal}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: shain
    emotion: normal
    text: 本部長。来月も、新しい店が開きます。
  - speaker: zundamon
    emotion: surprised
    text: 今月も、開いたばかりなのだ。
  - speaker: shain
    emotion: thinking
    text: 本社からは、もっと出せと言われてます。
  - speaker: zundamon
    emotion: happy
    text: どんどん開けるのだ。
  - speaker: shain
    emotion: thinking
    text: ただ、店長の数が追いつきません。
  - speaker: zundamon
    emotion: normal
    text: 新しい人を、急いで育てるのだ。
- id: ch3_kojo
  title: ''
  background: gd_kojo
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.74, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1979年、吉野家は肉を乾かして保存する方法を取り入れ始め、たれも粉に変えました。
    reading: せんきゅうひゃく ななじゅうくねん、よしのやわ にくお かわかして ほぞんする ほうほうお とりいれはじめ たれも こなに かえました。
  - speaker: tsumugi
    emotion: thinking
    text: たくさん運べて、長く置いておける。店を増やすには、便利よね。
  - speaker: zundamon
    emotion: surprised
    text: それ、さっきボクがやった粉のたれなのだ！
  - speaker: tsumugi
    emotion: angry
    text: 規模が違うけどね。
  - speaker: zundamon
    emotion: thinking
    text: 味は、どうなったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 落ちたと、会社自身が振り返ってるわ。
  - speaker: tsumugi
    emotion: thinking
    text: さらに牛肉の値段が上がって、牛丼も値上げしたの。
  - speaker: zundamon
    emotion: sad
    text: 味が落ちて、値段が上がる……。
  - speaker: tsumugi
    emotion: normal
    text: お客さんは、正直よ。
  - speaker: zundamon
    emotion: sad
    text: ……来なくなるのだ。
- id: ch3_mizuppoi
  title: ''
  background: gd_tenpo
  bgm: 223am
  stage:
  - {who: kyaku, x: 0.3, emotion: thinking}
  - {who: tenin, x: 0.7, emotion: normal}
  cuts:
  - speaker: kyaku
    emotion: thinking
    text: なあ。最近、ここの牛丼、なんだか水っぽくないか。
  - speaker: tenin
    emotion: surprised
    text: ……そうですか。
  - speaker: kyaku
    emotion: thinking
    text: 肉も、前はもっとうまかった気がする。
  - speaker: tenin
    emotion: sad
    text: 作り方が、少し変わりまして。
  - speaker: kyaku
    emotion: angry
    text: しかも、値上がりだろ。
  - speaker: tenin
    emotion: sad
    text: ……申し訳ありません。
  - speaker: kyaku
    emotion: normal
    text: 悪いけど、しばらくよそで食うよ。
  - speaker: tenin
    emotion: sad
    text: ……また、いらしてください。
- id: ch4_america
  title: ''
  background: gd_america
  bgm: curious
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: reimu
    text: そのころ安部は、アメリカで店を増やす計画のため、イリノイ州で英語を学んでいました。
    reading: そのころ あべわ あめりかで みせお ふやす けいかくの ため、いりのいしゅうで えいごお まなんでいました。
  - speaker: tsumugi
    emotion: normal
    text: 向こうでは、牛丼をビーフボウルという名前で売ってたの。
  - speaker: zundamon
    emotion: happy
    text: ビーフボウル。かっこいいぞ。
  - speaker: tsumugi
    emotion: thinking
    text: でも、日本の本社のほうが、それどころじゃなくなってきたの。
  - speaker: zundamon
    emotion: surprised
    text: 何があったのだ。
  - speaker: tsumugi
    emotion: thinking
    text: お[金|かね]が回らなくなって、大株主の会社から借りたの。
  - speaker: tsumugi
    emotion: normal
    text: それで、経営の主導権もそっちへ移ったとされてるわ。
  - speaker: reimu
    text: 1980年の春。予定より3か月早く、帰国の命令が届きます。
    reading: せんきゅうひゃく はちじゅうねんの はる。よていより さんかげつ はやく、きこくの めいれいが とどきます。
- id: ch4_kikoku
