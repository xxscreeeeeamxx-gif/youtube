meta:
  title: 【ファミコンの誕生】「ファミコンは死んでしまう」クリスマス直前の全品回収【ずんだもん解説】
  slug: famicom-uemura-v2
  summary: 押し入れから出てきた赤と白のゲーム機。あの本体を作ったのは、シャープから任天堂に移った技術者、上村雅之でした。ある夜、社長の山内溥から電話がかかってきます。無茶な条件を並べられ、大手の半導体メーカーには断られ、部下にも反対されながら、5人ほどで始めた開発。その末に生まれたゲーム機は、発売した年の暮れに思わぬ事態を迎えます。ファミリーコンピュータの誕生を、再現ドラマでたどります。
  tags:
  - ファミコン
  - 上村雅之
  - 任天堂
  - 山内溥
  - ゲーム機
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 雑学
  thumbnail:
    top: 全品回収
    bottom: ファミコンの誕生
  mode: drama
  narrator: reimu
