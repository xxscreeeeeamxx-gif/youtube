scenes:
- id: co_kaishu
  title: ''
  background: fc_shachoshitsu
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上村雅之, emotion: thinking}
  - {who: yamauchi, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1983年の暮れ。京都の任天堂で、発売したばかりのゲーム機に不具合が見つかります。
    reading: せんきゅうひゃく はちじゅうさんねんの くれ。きょうとの にんてんどうで、はつばいした ばかりの げーむきに ふぐあいが みつかります。
  - speaker: yamauchi
    emotion: thinking
    text: おもちゃ屋で、直せるんか？
  - speaker: zundamon
    emotion: sad
    text: ……工場に戻さないと、直せません。
  - speaker: yamauchi
    emotion: normal
    text: ほな、出荷は止める。店に出たもんも、全部引き取れ。
    se: don
  - speaker: zundamon
    emotion: sad
    text: ……ファミコンが、死んでしまうのだ。
  - speaker: reimu
    text: この技術者は、上村雅之。回収されたゲーム機は、世界で6191万台売れることになります。
    reading: この ぎじゅつしゃわ うえむら まさゆき。かいしゅう された げーむきわ、せかいで ろくせん ひゃくきゅうじゅういちまんだい うれる ことに なります。
- id: hook
  title: ''
  background: fc_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。押し入れから、古いゲーム機が出てきたのだ！ でも、映らない。
  - speaker: zundamon
    emotion: happy
    text: だから、カセットをフーフーするのだ！ ……まだ映らない。本体もフーフー！
  - speaker: zundamon
    emotion: happy
    text: 最後の手段。コントローラーもフーフーするのだ！
  - speaker: tsumugi
    emotion: thinking
    text: そこは、吹いても何も変わらないわよ。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: それにフーフーは、端子がさびる原因なの。
  - speaker: tsumugi
    emotion: thinking
    text: そのゲーム機、発売した年の暮れに全部回収されてるのよ。
  - speaker: zundamon
    emotion: thinking
    text: えっ。全部回収されたのに、どうして6191万台も売れたの？
    telops:
    - {text: 全品回収から6191万台, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 作ったのは、上村雅之さん。始まりは、ラジオを組み立てた少年よ。
- id: card1943
  title: ''
  background: fc_card_1943
  cuts:
  - speaker: reimu
    text: 1943年。東京で、上村雅之が生まれます。米子を経て、京都で育ちました。
    reading: せんきゅうひゃく よんじゅうさんねん。とうきょうで うえむら まさゆきが うまれます。よなごお へて、きょうとで そだちました。
- id: ch1_kyoto
  title: ラジオから音が出た
  background: fc_denkiya
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上村雅之, scale: 0.85, emotion: happy}
  - {who: denkiya, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: おじさん。ラジオの部品、ください！
  - speaker: denkiya
    emotion: surprised
    text: また坊主か。この前の部品は、どないした。
  - speaker: zundamon
    emotion: happy
    text: ラジオになったのだ！ ちゃんと、音が出たのだ！
  - speaker: denkiya
    emotion: thinking
    text: ……ほんまに鳴ったんか。
    beat: true
  - speaker: reimu
    text: 自分で組み立てたラジオから音が出て、強く心を動かされたと本人は語っています。
    reading: じぶんで くみたてた らじおから おとが でて、つよく こころお うごかされたと ほんにんわ かたって います。
  - speaker: reimu
    text: 雅之は千葉工業大学に進み、テレビの技術者を目指して電子回路を学びます。
    reading: まさゆきわ ちば こうぎょう だいがくに すすみ、てれびの ぎじゅつしゃお めざして でんし かいろお まなびます。
- id: card1967
  title: ''
  background: fc_card_1967
  cuts:
  - speaker: reimu
    text: 1967年。雅之は、大阪の早川電機に入ります。今のシャープです。
    reading: せんきゅうひゃく ろくじゅうななねん。まさゆきわ おおさかの はやかわ でんきに はいります。いまの しゃーぷです。
- id: ch1_jinji
  title: 光のセンサーを売る
  background: fc_sharp
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上村雅之, emotion: normal}
  - {who: jinji, x: 0.7, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: 課長。東京じゃなくて、関西で働きたいんです。
  - speaker: jinji
    emotion: surprised
    text: 東京のコンピューターの部署やぞ。花形やで。
  - speaker: zundamon
    emotion: normal
    text: 関西に残れるなら、どこでもかまいません。
  - speaker: jinji
    emotion: thinking
    text: ……ちょうど、東京に行きたいという新人がおる。入れ替えるか。
  - speaker: reimu
    text: 入れ替わった先が、たまたま光センサーの販売でした。
    reading: いれかわった さきが、たまたま ひかり せんさーの はんばいでした。
- id: ch1_sharp
  title: ''
  background: fc_sharp
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上村雅之, emotion: happy}
  - {who: douryo, x: 0.7, emotion: normal}
  cuts:
  - speaker: douryo
    emotion: normal
    text: 上村、今週も出張か。
  - speaker: zundamon
    emotion: happy
    text: 九州から静岡まで、工場回りだ！
  - speaker: douryo
    emotion: surprised
    text: 担当の地域、広すぎやろ。
  - speaker: zundamon
    emotion: normal
    text: 製鉄所でも織機の工場でも、光のセンサーは使える。売りに行けば、欲しい物が分かるんだ。
- id: card1968
  title: ''
  background: fc_card_1968
  cuts:
  - speaker: reimu
    text: 1968年5月。雅之は、京都のおもちゃ会社を訪ねます。
    reading: せんきゅうひゃく ろくじゅうはちねん ごがつ。まさゆきわ、きょうとの おもちゃがいしゃお たずねます。
- id: ch1_kousenju
  title: 光線銃のセンサー
  background: fc_nintendo68
  bgm: pop
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 上村雅之, emotion: normal}
  - {who: yamauchi, x: 0.56, emotion: normal}
  - {who: yokoi, x: 0.8, emotion: happy}
  cuts:
  - speaker: yamauchi
    emotion: normal
    text: 任天堂の山内です。こっちは、開発の横井。
  - speaker: yokoi
    emotion: happy
    text: 光線銃を作ってるんです。光を当てたら、[的|まと]が反応するおもちゃです。
  - speaker: zundamon
    emotion: normal
    text: 今日は、うちの光の部品をいろいろ持ってきました。
  - speaker: yokoi
    emotion: thinking
    text: 今の[的|まと]の部品は、反応がちょっと遅いんです。
  - speaker: yokoi
    emotion: surprised
    text: ……この太陽電池、光線銃に使えるんちゃうか。
    se: hirameki
  - speaker: zundamon
    emotion: surprised
    text: 太陽電池を、センサーに？ たしかに、光が当たった瞬間に電気が流れます。
  - speaker: reimu
    text: 12月には試作機ができ、1970年に光線銃SPシリーズが発売されます。
    reading: じゅうにがつにわ しさくきが でき、せんきゅうひゃく ななじゅうねんに こうせんじゅう えすぴー しりーずが はつばい されます。
  - speaker: reimu
    text: シリーズは、およそ160万丁が売れました。
    reading: しりーずわ、およそ ひゃくろくじゅうまんちょうが うれました。
- id: ch1_udon
  title: ''
  background: fc_nintendo68
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上村雅之, emotion: happy}
  - {who: yokoi, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 雅之は外回りの最後に任天堂へ寄り、横井と夜食をとりながら話し込みました。
    reading: まさゆきわ そとまわりの さいごに にんてんどうえ より、よこいと やしょくお とりながら はなしこみました。
  - speaker: yokoi
    emotion: happy
    text: 上村さん、鍋焼きうどん来たで。
  - speaker: zundamon
    emotion: happy
    text: いただきます。……で、さっきの的の話ですけど。
  - speaker: yokoi
    emotion: thinking
    text: 食べながらでも、話は止まらへんのやな。
  - speaker: zundamon
    emotion: surprised
    text: '[熱っ|あつっ]！ ……うどんより、話のほうが熱いのだ。'
    se: bikkuri
    beat: true
  - speaker: reimu
    text: 部品は自分で車に積み、国道24号を走って任天堂へ届けました。
    reading: ぶひんわ じぶんで くるまに つみ、こくどう にじゅうよんごうお はしって にんてんどうえ とどけました。
- id: card1971
  title: ''
  background: fc_card_1971
  cuts:
  - speaker: reimu
    text: 1971年。雅之に、任天堂から声がかかります。
    reading: せんきゅうひゃく ななじゅういちねん。まさゆきに、にんてんどうから こえが かかります。
- id: ch2_sasoi
  title: おもちゃの会社へ
  background: fc_ousetsu
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上村雅之, emotion: thinking}
  - {who: sawai, x: 0.7, emotion: normal}
  cuts:
  - speaker: sawai
    emotion: normal
    text: 上村くん、うちに来てくれんか。任天堂も、これから変わらんといかん。
  - speaker: sawai
    emotion: happy
    text: 軍平くんも、君が来るのを望んどる。
  - speaker: zundamon
    emotion: thinking
    text: ……少し、考えさせてください。
  - speaker: reimu
    text: 声をかけたのは、専務の沢井末造でした。
    reading: こえお かけたのわ、せんむの さわい すえぞうでした。
- id: ch2_douryo
  title: ''
  background: fc_sharp
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上村雅之, emotion: normal}
  - {who: douryo, x: 0.7, emotion: surprised}
  cuts:
  - speaker: douryo
    emotion: surprised
    text: なんでお前、花札とおもちゃの会社に行くんや。
  - speaker: zundamon
    emotion: normal
    text: 自分の力を、試してみたいんだ。
  - speaker: douryo
    emotion: thinking
    text: 大きい会社におったほうが、安泰やで。
  - speaker: zundamon
    emotion: thinking
    text: ……結婚したばかりなのに、アメリカに行ってICを[学べ|まなべ]と言われたんだ。
  - speaker: douryo
    emotion: surprised
    text: そっちが、本音か。
    se: zukko
  - speaker: reimu
    text: 1971年、雅之は任天堂に移りました。
    reading: せんきゅうひゃく ななじゅういちねん、まさゆきわ にんてんどうに うつりました。
- id: ch2_clay
  title: 空いたボウリング場
  background: fc_bowling
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上村雅之, emotion: happy}
  - {who: shain, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1973年。京都の元ボウリング場に、光線銃で遊ぶ射撃場ができます。
    reading: せんきゅうひゃく ななじゅうさんねん。きょうとの もと ぼうりんぐじょうに こうせんじゅうで あそぶ しゃげきじょうが できます。
  - speaker: zundamon
    emotion: happy
    text: 飛んでいく皿の映像を、光線銃で撃ち落とすのだ！
  - speaker: shain
    emotion: happy
    text: 上村さん。よその遊び場からも、注文が来てますよ！
  - speaker: zundamon
    emotion: happy
    text: どんどん作るぞ！ 空いたボウリング場が、全部射撃場になる。
  - speaker: reimu
    text: ところが、この年の秋に石油ショックが起こります。
    reading: ところが、この としの あきに せきゆ しょっくが おこります。
  - speaker: shain
    emotion: sad
    text: 上村さん……。注文が、次々に取り消しです。
  - speaker: zundamon
    emotion: surprised
    text: 取り消し！？ 全部か！？
  - speaker: shain
    emotion: thinking
    text: 景気が悪くなって、遊びにお[金|かね]を出す余裕が無いそうです。
  - speaker: zundamon
    emotion: sad
    text: ……大量に頼んだ部品が、宙に浮いてしまうのだ。
    se: shobon
- id: ch2_tv15
  title: テレビの雑音
  background: fc_kaihatsu77
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上村雅之, emotion: thinking}
  - {who: shain, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1977年。任天堂は三菱電機と組んで、家のテレビにつなぐゲーム機を出します。
    reading: せんきゅうひゃく ななじゅうななねん。にんてんどうわ みつびし でんきと くんで、いえの てれびに つなぐ げーむきお だします。
  - speaker: shain
    emotion: thinking
    text: 上村さん、また苦情です。テレビの映りが悪いって。
  - speaker: zundamon
    emotion: thinking
    text: アンテナの線につなぐから、雑音が入るのか……。
  - speaker: shain
    emotion: sad
    text: お店で直してくれ、と言われても。
  - speaker: zundamon
    emotion: sad
    text: 家のテレビは、一軒ごとに違う。ここが一番難しい。
  - speaker: reimu
    text: この苦労から、家庭用のテレビゲームにかなり悲観的になったと雅之は書いています。
    reading: この くろうから、かていようの てれびげーむに かなり ひかんてきに なったと まさゆきわ かいて います。
- id: ch2_radar
  title: 5人の開発第二部
  background: fc_kaihatsu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上村雅之, emotion: thinking}
  - {who: buka, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
    text: 1979年、雅之は開発第二部の部長になります。
    reading: せんきゅうひゃく ななじゅうきゅうねん、まさゆきわ かいはつ だいにぶの ぶちょうに なります。
  - speaker: reimu
    text: 1980年、アメリカに送った業務用のゲーム機が売れ残ります。作り変えは、横井の開発一部に任されました。
    reading: せんきゅうひゃく はちじゅうねん、あめりかに おくった ぎょうむようの げーむきが うれのこります。つくりかえわ、よこいの かいはつ いちぶに まかされました。
  - speaker: reimu
    text: この作り変えで、宮本茂が考えたのがドンキーコングです。
    reading: この つくりかえで、みやもと しげるが かんがえたのが どんきーこんぐです。
  - speaker: buka
    emotion: sad
    text: 部長、今日もゲーム&ウオッチの手伝いに行ってきます。
  - speaker: zundamon
    emotion: thinking
    text: ……残ったのは、ボクを入れて5人くらいなのだ。
  - speaker: buka
    emotion: thinking
    text: 部長なのに、部下がほとんどいませんね。
    beat: true
- id: card1981
  title: ''
  background: fc_card_1981
  cuts:
  - speaker: reimu
    text: 1981年11月。ある日の夜。
    reading: せんきゅうひゃく はちじゅういちねん じゅういちがつ。ある ひの よる。
- id: ch3_denwa
  title: 夜の電話
  background: fc_denwa
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上村雅之, emotion: normal}
  - {who: yamauchi, x: 0.7, emotion: normal}
  cuts:
  - speaker: yamauchi
    emotion: normal
    text: 上村くん、ゲーム&ウオッチの次、考えんとあかんのや。
  - speaker: zundamon
    emotion: thinking
    text: はあ。
  - speaker: yamauchi
    emotion: normal
    text: 家のテレビにつなぐゲーム機、作ってくれ。
  - speaker: yamauchi
    emotion: happy
    text: 君しかおらん。頼んだで。
  - speaker: zundamon
    emotion: surprised
    text: テ、テレビのですか。あれはちょっと……
  - speaker: zundamon
    emotion: surprised
    text: ……社長？ 社長！
  - speaker: zundamon
    emotion: sad
    text: 切れた。言うだけ言って、切られたのだ。
    se: oti
  - speaker: zundamon
    emotion: thinking
    text: しかも君しかおらんって、うちの部は5人しかいないのだ。
- id: ch3_yokuasa2
  title: ''
  background: fc_shachoshitsu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上村雅之, emotion: surprised}
