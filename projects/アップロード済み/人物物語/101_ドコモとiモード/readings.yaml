# docomo-imode 読み台帳（人名・社名・専門語・英字の語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている（人名・英字・数字もひらがなで書き下した）。
# 名札（tag: 店員・副店長 / label: 店長・常連さん・部長・NTT社長・ドコモ社長・夏野剛 ほか）とテロップは表示専用なのでタグを付けていない。
# ドコモ・NTT・KDDI・MNP・iモード・iPhone・iアプリ はセリフでもタグなし（英字読み・カタカナ読みで通る想定）。voice 後にモーラで確かめること。
# 「5G」「4G」「3G」は VOICEVOX が ゴジー／ヨンジー のように数字読みしやすいので、全部タグで ファイブジー／フォージー／スリージー にした。
