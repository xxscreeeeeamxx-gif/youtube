meta:
  title: 「高品質なネットワークを実感してほしい」と言ったドコモ、10年後「つながりにくい」を認める【ずんだもん解説】
  slug: docomo-imode
  hook_line: ケータイでネットを広めたドコモが、なぜ“つながらない”と言われるのか。
  summary: 2026年3月31日、iモードが27年の歴史を終えました。同じ年、都市部の駅ではドコモが“つながらない”という声がSNSで続いています。1999年にiモードの携帯を売り始めた、駅前の携帯ショップの店員（架空の人物）の目で、5Gの基地局と電波の転用、値下げと完全子会社化、シェアを守る販促までを、会社の説明と記者の見方を分けて再現ドラマでたどります。（2026年10月28日時点）
  sources:
  - NTTドコモ「FOMA・iモードのサービス終了について」 https://www.docomo.ne.jp/info/3g_closed/
  - NTTドコモ「2025年度決算 及び 2026年度業績予想について」（2026年5月8日） https://www.docomo.ne.jp/corporate/ir/binary/pdf/library/presentation/260508/presentation_fy2025_4q.pdf
  - NTTドコモ「2026年度 第1四半期決算について」（2026年8月6日） https://www.docomo.ne.jp/corporate/ir/binary/pdf/library/presentation/260806/presentation_fy2026_1q.pdf
  - NTT「株式会社NTTドコモ株式等（証券コード9437）に対する公開買付けの開始及び資金の借入について」（2020年9月29日） https://group.ntt/jp/newsrelease/2020/09/29/200929b.html
  - ITmedia Mobile「なぜドコモで『つながりにくい』問題が起きているのか 明かされた根本的な要因」（2023年4月27日） https://www.itmedia.co.jp/mobile/articles/2304/27/news103.html
  - ケータイWatch「25年3月の5G基地局の数、ドコモはau・ソフトバンクの半分――総務省調査」（2026年1月14日） https://k-tai.watch.impress.co.jp/docs/news/2077686.html
