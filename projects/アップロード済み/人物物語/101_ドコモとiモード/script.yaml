  - speaker: ii
    emotion: thinking
    text: 収益と利益を失った。
  - speaker: ii
    emotion: thinking
    text: これがずっと続くと苦しい。
  - speaker: kisha
    emotion: normal
    text: '[5G|ファイブジー]の整備は、どうするんですか。'
  - speaker: ii
    emotion: normal
    text: デジタル田園都市構想で、[5G|ファイブジー]をもっと加速してほしいという要請があった。
  - speaker: ii
    emotion: normal
    text: 24年までに90％という要請だったため、
  - speaker: ii
    emotion: thinking
    text: '[4G|フォージー]の周波数再利用を組み込まないと間に合わない。'
  - speaker: kisha
    emotion: thinking
    text: 2年前は、けん制していたやり方ですね。
  - speaker: reimu
    text: 2020年に子会社化。2021年にahamo。2022年に転用。三つは同じ3年の間に重なっていました。
    reading: にせん にじゅうねんに こがいしゃか。にせん にじゅういちねんに あはも。にせん にじゅうにねんに てんよう。みっつわ おなじ さんねんの あいだに かさなって いました。
