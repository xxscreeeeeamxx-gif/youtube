scenes:
# ---- 先出し（2026年3月31日の夜・iモードが終わる日） ----
- id: co_imode
  title: ''
  background: dc_shop
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 副店長, emotion: thinking}
  - {who: jouren, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 2026年3月31日の夜。駅前の、ドコモの携帯ショップです。
    reading: にせん にじゅうろくねん さんがつ さんじゅういちにちの よる。えきまえの どこもの けいたい しょっぷです。
  - speaker: jouren
    emotion: thinking
    text: 今夜で、iモードも終わりか。
  - speaker: zundamon
    emotion: normal
    text: はい。27年、お疲れさまでした。
  - speaker: jouren
    emotion: normal
    text: あんたから買った最初の1台も、iモードだったな。
  - speaker: reimu
    text: iモードの契約は、2010年に約4900万。ケータイでネットを広めたサービスでした。
    reading: あいもーどの けいやくわ、にせん じゅうねんに やく よんせん きゅうひゃくまん。けいたいで ねっとお ひろめた さーびすでした。
# ---- 先出し（同じ年の夏・電車の中） ----
- id: co_densha
  title: ''
  background: dc_densha
  stage:
  - {who: zundamon, x: 0.5, flip: true, tag: 副店長, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 同じ年の夏。SNSでは、ドコモはつながらないという声が続いています。
    reading: おなじ としの なつ。えすえぬえすでわ、どこもわ つながらないと いう こえが つづいて います。
  - speaker: zundamon
    emotion: thinking
    text: アンテナは立ってるのに……ページが止まったのだ。
  - speaker: zundamon
    emotion: sad
    text: ボク、ドコモの店の副店長なのに……。
    beat: true
  - speaker: reimu
    text: 5G基地局は、2025年3月末で他社の約半分。利益は2期続けて減りました。
    reading: ふぁいぶじー きちきょくわ、にせん にじゅうごねん さんがつまつで たしゃの やく はんぶん。りえきわ にき つづけて へりました。
    telops:
    - {text: "5G基地局は他社の約半分（2025年3月末）", size: md, position: top-center, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: 世界で最初にケータイでネットを広めた会社が、なぜつながらないと言われるようになったのでしょう。
    reading: せかいで さいしょに けいたいで ねっとお ひろめた かいしゃが、なぜ つながらないと いわれる ように なったのでしょう。
# ---- 今の部屋（引き出しの折りたたみの携帯） ----
- id: hook
  title: ''
  background: dc_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ 引き出しの奥から、折りたたみの携帯が出てきたのだ！
  - speaker: tsumugi
    emotion: normal
    text: iモードの携帯ね。そのiモードは、今年の3月で終わったわ。
  - speaker: zundamon
    emotion: thinking
    text: 今のスマホなんて、駅でページが止まるのに……。
  - speaker: tsumugi
    emotion: normal
    text: 止まる理由は、駅の電波の道にあるの。
# ---- 2023年の春・駅前のショップ ----
- id: card2023
  title: ''
  background: dc_card_2023
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 2023年の春。同じ駅前の携帯ショップです。店員は、1999年に代理店に入った社員です。
    reading: にせん にじゅうさんねんの はる。おなじ えきまえの けいたい しょっぷです。てんいんわ、せんきゅうひゃく きゅうじゅうきゅうねんに だいりてんに はいった しゃいんです。
- id: ch1_kyaku
  title: 駅でつながらない
  background: dc_shop
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 店員, emotion: normal}
  - {who: wakai, x: 0.52, emotion: angry}
  - {who: tencho, x: 0.8, emotion: thinking}
  cuts:
  - speaker: wakai
    emotion: angry
    text: 新宿駅で、スマホが全然つながらないんですけど！
  - speaker: zundamon
    emotion: normal
    text: 電波のマークは、立ってますよね？
  - speaker: wakai
    emotion: angry
    text: 立ってます。なのにページが止まるんです。
  - speaker: zundamon
    emotion: thinking
    text: 圏外じゃないのに、止まる……。
  - speaker: tencho
    emotion: thinking
    text: 申し訳ありません。本社も、品質の低下を認めています。
  - speaker: zundamon
    emotion: surprised
    text: 認めたんですか！？
- id: ch1_kaiken
  title: ''
  background: dc_kaiken
  stage:
  - {who: hayashi, x: 0.28, flip: true, emotion: thinking}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2023年4月26日。ドコモの5Gの説明会で、部長の林直樹が答えます。
    reading: にせん にじゅうさんねん しがつ にじゅうろくにち。どこもの ふぁいぶじーの せつめいかいで、ぶちょうの はやし なおきが こたえます。
  - speaker: kisha
    emotion: normal
    text: 都市部で、つながりにくいという声が相次いでいます。
  - speaker: hayashi
    emotion: thinking
    text: 全てのトラフィックが[4G|フォージー]側に乗ってしまい、
    telops:
    - {text: "林部長「全てのトラフィックが4G側に乗ってしまい」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: hayashi
    emotion: normal
    text: 時間帯によっては通信速度が低下する事象がある。
  - speaker: kisha
    emotion: surprised
    text: '[4G|フォージー]に……乗ってしまう？'
# ---- 店長の説明：4Gに集まる通信と、基地局の数 ----
- id: ch1_shikumi
  title: 4Gに集まる通信
  background: dc_shop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 店員, emotion: thinking}
  - {who: tencho, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: '[5G|ファイブジー]のスマホなのに、[4G|フォージー]に乗っちゃうんですか？'
  - speaker: tencho
    emotion: normal
    text: '[5G|ファイブジー]が届く場所が、まだ狭いんだ。届かなければ、スマホは[4G|フォージー]でつなぐ。'
  - speaker: tencho
    emotion: thinking
    text: 流れるデータも年々増えて、[4G|フォージー]の道に車が集まる。
  - speaker: zundamon
    emotion: surprised
    text: 新しい道があるのに、みんな古い道で渋滞！？
  - speaker: zundamon
    emotion: normal
    text: じゃあ[5G|ファイブジー]の基地局を、どんどん建てれば！
  - speaker: tencho
    emotion: thinking
    text: 新しい[5G|ファイブジー]の基地局は、ビルの屋上を借りて建てるんだ。
  - speaker: tencho
    emotion: thinking
    text: 持ち主との話し合いに、時間がかかるらしい。
  - speaker: zundamon
    emotion: surprised
    text: 大家さん待ち！？
  - speaker: tencho
    emotion: normal
    text: その間に他社は、[4G|フォージー]の電波を[5G|ファイブジー]に回して[5G|ファイブジー]の場所を一気に広げた。
  - speaker: tencho
    emotion: thinking
    text: ドコモが回し始めたのは、去年の春だ。
  - speaker: zundamon
    emotion: surprised
    text: 遅っ！
  - speaker: reimu
    text: 2年後の2025年3月末。総務省の調べでは、5G基地局はKDDIが11万37局。
    reading: にねんごの にせん にじゅうごねん さんがつまつ。そうむしょうの しらべでわ、ふぁいぶじー きちきょくわ けーでぃーでぃーあいが じゅういちまん さんじゅうななきょく。
  - speaker: reimu
    text: ソフトバンクは10万4441局。ドコモは、5万2532局でした。
    reading: そふとばんくわ じゅうまん よんせん よんひゃく よんじゅういちきょく。どこもわ、ごまん にせん ごひゃく さんじゅうにきょくでした。
  - speaker: zundamon
    emotion: surprised
    text: 半分！？
    se: gaan
  - speaker: reimu
    text: ただ新しい周波数の局だけなら、ドコモはソフトバンクより多い。差の多くは4Gから回した電波などの局でした。
    reading: ただ あたらしい しゅうはすうの きょく だけなら、どこもわ そふとばんくより おおい。さの おおくわ ふぉーじーから まわした でんぱ などの きょくでした。
  - speaker: zundamon
    emotion: thinking
    text: なんで、回すのが遅れたんです？
  - speaker: tencho
    emotion: thinking
    text: 3年前、ドコモの部長が他社のそのやり方をけん制してたんだ。
- id: ch1_2020
  title: ''
  background: dc_kaiken
  stage:
  - {who: nakaminami, x: 0.5, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2020年8月。ドコモの技術企画担当部長の発言です。
    reading: にせん にじゅうねん はちがつ。どこもの ぎじゅつ きかく たんとう ぶちょうの はつげんです。
  - speaker: nakaminami
    emotion: normal
    text: 周波数の幅は変わらないため速度は[4G|フォージー]と同様であるほか、
  - speaker: nakaminami
    emotion: thinking
    text: '[4G|フォージー]ユーザーの通信速度が低下する可能性がある。'
  - speaker: nakaminami
    emotion: thinking
    text: '[5G|ファイブジー]スマホを買って[5G|ファイブジー]エリアに入っても体感速度が向上せず、優良誤認になる恐れがある。'
    telops:
    - {text: "中南直樹部長（2020年）「優良誤認になる恐れ」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
- id: ch1_hanbun
  title: ''
  background: dc_shop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 店員, emotion: thinking}
  - {who: tencho, x: 0.7, emotion: thinking}
  cuts:
  - speaker: tencho
    emotion: normal
    text: ドコモは、新しい周波数の[5G|ファイブジー]を中心に広げてたんだ。
  - speaker: zundamon
    emotion: thinking
    text: その電波の回し方を、今はドコモもやってるんですよね。
  - speaker: tencho
    emotion: normal
    text: 国から、[5G|ファイブジー]を急げと言われてな。
  - speaker: tencho
    emotion: thinking
    text: ただ回しても、道の幅は同じだ。混む駅には新しい周波数が要る。
  - speaker: tencho
    emotion: normal
    text: 本社の資料だと、遅くなる原因は4つあるそうだ。
  - speaker: zundamon
    emotion: surprised
    text: 4つも？
  - speaker: tencho
    emotion: thinking
    text: 通信量の増加・新しい[5G|ファイブジー]の遅れ・再開発・特定の周波数のひっ迫。
  - speaker: tencho
    emotion: thinking
    text: 細い道に、人が集まる。それが駅だ。
  - speaker: zundamon
    emotion: thinking
    text: お客さんの言うつながらないは、駅の道の渋滞なんですね。
  - speaker: tencho
    emotion: thinking
    text: この3年で、ドコモは料金を下げてNTTの完全子会社にもなった。
  - speaker: zundamon
    emotion: sad
    text: 時期が、重なってますね……。
  - speaker: reimu
    text: ではなぜ、ケータイでネットを広めた会社が、電波の道で出遅れたのでしょう。
    reading: でわ なぜ けいたいで ねっとお ひろめた かいしゃが、でんぱの みちで でおくれたのでしょう。
  - speaker: reimu
    text: 始まりは、この店がiモードを売り始めた1999年です。
    reading: はじまりわ、この みせが あいもーどお うりはじめた せんきゅうひゃく きゅうじゅうきゅうねんです。
# ---- 1999年・iモードが始まる ----
- id: card1999
  title: ''
  background: dc_card_1999
  bgm: honwaka_puppu
  cuts:
  - speaker: reimu
    text: 1999年2月22日。ドコモがiモードを始めます。間に合った電話は富士通のF501iの1機種だけ。
    reading: せんきゅうひゃく きゅうじゅうきゅうねん にがつ にじゅうににち。どこもが あいもーどお はじめます。まにあった でんわわ ふじつうの えふ ごーまるいち あいの いっきしゅ だけ。
  - speaker: reimu
    text: 開発を率いたのは榎啓一。リクルートから来た松永真理や、夏野剛らが加わっていました。
    reading: かいはつお ひきいたのわ えのき けいいち。りくるーとから きた まつなが まりや、なつの たけしらが くわわって いました。
- id: ch2_mihon
  title: 1パケットって何？
  background: dc_shop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 店員, emotion: happy}
  - {who: tencho, x: 0.7, emotion: normal}
  cuts:
  - speaker: tencho
    emotion: normal
    text: 今日から、これがiモードの電話だ。
  - speaker: zundamon
    emotion: happy
    text: 見本、ボクが一番に触っていいですか！
  - speaker: tencho
    emotion: angry
    text: お客さんより先に触るな。
    se: tsukkomi
  - speaker: zundamon
    emotion: happy
    text: だって電話なのに、ネットにつながるんですよ！
  - speaker: tencho
    emotion: normal
    text: 月300円と、1パケット0.3円。値段をまず覚えろ。
  - speaker: zundamon
    emotion: thinking
    text: 1パケット、0.3円……。
- id: ch2_packet
  title: ''
  background: dc_shop
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 店員, emotion: happy}
  - {who: kyaku, x: 0.52, emotion: normal}
  - {who: jouren, x: 0.8, emotion: normal}
  cuts:
  - speaker: kyaku
    emotion: normal
    text: ねえ、1パケットって何？
  - speaker: zundamon
    emotion: happy
    text: 128バイトです！
  - speaker: kyaku
    emotion: thinking
    text: ……バイトって何？
  - speaker: zundamon
    emotion: thinking
    text: ええと……とにかく、0.3円です！
  - speaker: kyaku
    emotion: angry
    text: 答えになってないわよ。
    beat: true
  - speaker: jouren
    emotion: happy
    text: オレは買うよ。外でメールが打てるんだろ？
  - speaker: zundamon
    emotion: happy
    text: はい！ 250文字まで送れます。
  - speaker: jouren
    emotion: normal
    text: 1台くれ。いくらだ？
  - speaker: zundamon
    emotion: happy
    text: '[F501i|エフゴーマルイチアイ]、3万5900円です！'
  - speaker: reimu
    text: 128バイトで0.3円。この値段で1GBを使うと約234万円。今のahamoなら約99円です。
    reading: ひゃく にじゅうはち ばいとで れいてん さんえん。この ねだんで いちぎがお つかうと やく にひゃく さんじゅうよんまんえん。いまの あはもなら やく きゅうじゅうきゅうえんです。
    telops:
    - {text: "1GBの値段　1999年は約234万円／今は約99円", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
- id: ch2_senman
  title: 532日で1000万
  background: dc_shop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 店員, emotion: happy}
  - {who: tencho, x: 0.7, emotion: normal}
  cuts:
  - speaker: tencho
    emotion: normal
    text: iモードの契約が、1000万を超えたそうだ。始まって532日だと。
  - speaker: zundamon
    emotion: happy
    text: 1000万！ ボクが売りまくったおかげなのだ！
    se: levelup
  - speaker: tencho
    emotion: thinking
    text: お前が売ったのは、そのうち何台だ。
