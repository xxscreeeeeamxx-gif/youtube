    text: その時点の見通しは、営業利益がほぼ横ばいで当期利益は5％減。値上げも、まだ決まっていません。
    reading: その じてんの みとおしわ、えいぎょう りえきが ほぼ よこばいで とうき りえきわ ごぱーせんと げん。ねあげも、まだ きまって いません。
# ---- 論争の章 ----
- id: ronso1
  title: ドコモはつながらない？
  background: dc_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: つむぎ、ネットで見たのだ！ ドコモはつながらないって！
  - speaker: tsumugi
    emotion: normal
    text: そう言われる理由は、ちゃんとあるの。
  - speaker: tsumugi
    emotion: normal
    text: 2026年1月から3月の調査では、ドコモの[5G|ファイブジー]のダウンロードの速さは1位。
  - speaker: tsumugi
    emotion: normal
    text: 電波が届く広さも、1位だったの。
  - speaker: zundamon
    emotion: surprised
    text: 1位！？ じゃあ、なんで言われるのだ？
  - speaker: tsumugi
    emotion: normal
    text: 一貫した品質っていう項目が、4社で最下位だったの。
  - speaker: tsumugi
    emotion: normal
    text: 動画やアプリが、最後まで止まらずに使えた割合よ。
  - speaker: tsumugi
    emotion: normal
    text: 10月に出た次の調査では、KDDIが一貫した品質の1位になったと発表してるわ。
  - speaker: zundamon
    emotion: thinking
    text: 速いのに、止まる……。
  - speaker: tsumugi
    emotion: normal
    text: 調査会社の担当者は、1つだけの理由ではなく複合的な理由だと話してるわ。
  - speaker: tsumugi
    emotion: normal
    text: 例えば周波数帯の制約や基地局が建設中であることなど、ってね。
  - speaker: tsumugi
    emotion: normal
    text: 広くて速い。でも混む駅では詰まりやすい。それが、つながらないと言われる正体よ。
  - speaker: zundamon
    emotion: thinking
    text: 圏外になるわけじゃ、ないのか。
- id: ronso2
  title: 買われて品質が落ちた？
  background: dc_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットには、NTTに買われて値下げさせられたから品質が落ちたって書いてあるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 時期は、たしかに重なってるの。
  - speaker: tsumugi
    emotion: normal
    text: 子会社化は2020年。[ahamo|アハモ]は2021年。品質の問題は2023年の春よ。
  - speaker: tsumugi
    emotion: normal
    text: 記者の中には、設備投資が絞られていたと見る人もいるわ。
  - speaker: tsumugi
    emotion: thinking
    text: でも当時の[澤田|さわだ]社長と[吉澤|よしざわ]社長は、本件と値下げが結びついていることはないと否定したの。
  - speaker: tsumugi
    emotion: normal
    text: ドコモ自身が挙げた原因は、通信量の増加や新しい[5G|ファイブジー]の遅れなど4つよ。
  - speaker: tsumugi
    emotion: normal
    text: 設備投資は、2025年度には前の年より20％増えてるわ。
  - speaker: zundamon
    emotion: thinking
    text: 1つのせいとは、言えないのだ……。
    se: hirameki
  - speaker: tsumugi
    emotion: normal
    text: 値下げと[5G|ファイブジー]の広げ方の遅れ。
  - speaker: tsumugi
    emotion: normal
    text: 二つが重なった時期に、混む駅の電波の道が足りなくなったの。
  - speaker: tsumugi
    emotion: thinking
    text: 言えるのは、そこまでね。
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
- id: chui
  title: ドコモを使う人へ
  background: dc_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: まず[4G|フォージー]のスマホでも[VoLTE|ボルテ]がオフだと、4月から通話できないの。
  - speaker: tsumugi
    emotion: normal
    text: 設定で、オンになってるか確かめてね。
  - speaker: zundamon
    emotion: surprised
    text: 家族の古いスマホも、見ておくのだ。
  - speaker: tsumugi
    emotion: normal
    text: 次に、[3G|スリージー]の終了に便乗した悪質な販売。困ったら、ドコモの携帯から[151|いちごーいち]よ。
  - speaker: tsumugi
    emotion: normal
    text: それから、速さと詰まりにくさは別に見ること。
  - speaker: tsumugi
    emotion: normal
    text: 自分がよく使う駅で、混む時間に試すのがいちばんよ。
  - speaker: tsumugi
    emotion: normal
    text: 料金は、[1GB|いちギガ]あたりで比べてね。[ahamo|アハモ]なら[30GB|さんじゅうギガ]で2970円。
  - speaker: zundamon
    emotion: thinking
    text: '[1GB|いちギガ]あたり、約99円なのだ。'
  - speaker: tsumugi
    emotion: normal
    text: 値上げは、10月末の時点ではまだ検討中。決まってはいないわ。
