# takata-collapse 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 高田重久 / label: 清水・高田重一郎・高田武三・本田宗一郎 ほか）とテロップ・章タイトル・meta は表示専用なのでタグを付けていない。
# 高田武三の読みは台帳で「たけぞう（英語報道からの推定・要確認）」なので、声には出さず名札だけにした（ナレは「重久の祖父」）。
# 社名のタカタはカタカナ、一族の姓の高田は「たかだ」。株式会社高田工場の読みは確かめていないので台本に出していない。
# 方（かた）・表（おもて）・空（そら）・金（かね）は言い方・一方・表示・空港などにも掛かるので台帳に入れず、本文の該当箇所だけタグを付けた。
