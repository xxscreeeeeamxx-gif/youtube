meta:
  title: 破綻の日のタカタ会長「何が悪かったんだろう」、負債1兆円超・製造業で戦後最大【ずんだもん解説】
  slug: takata-collapse
  hook_line: 命を守るエアバッグの会社タカタは、なぜ製造業で戦後最大の破綻に至ったのか。
  summary: 2017年6月、エアバッグの会社タカタは民事再生を申し立てます。会見に立ったのは、祖父が作り、父が育てた会社の3代目、高田重久でした。命を守るはずの部品で、アメリカなどで死傷者が出ていました。小さな火薬の筒の中で何が起きていたのか。もうかっていた会社は、なぜ倒れたのか。会見と株主総会での本人の言葉、アメリカ議会の記録、自動車メーカーの発表を並べて、再現ドラマでたどります。死傷者の数は、時点と発表元をつけて伝えます。（2026年11月時点）
  sources:
  - タカタ株式会社（現TKJP）「民事再生手続開始の申立て等に関するお知らせ」（2017年6月26日） https://www.tkjpkk.com/pdf/170626_JP.pdf
  - 国土交通省「タカタ製エアバッグ問題の経緯」（2017年7月時点） https://www.mlit.go.jp/common/001198966.pdf
  - 米上院 商業・科学・運輸委員会 公聴会「Examining Takata Airbag Defects and the Vehicle Recall Process」（2014年11月20日） https://www.govinfo.gov/content/pkg/CHRG-113shrg95291/html/CHRG-113shrg95291.htm
  - 本田技研工業「NHTSAのタカタに対する同意命令について」（2015年11月4日） https://global.honda/jp/info/20151104.html
  - タカタ株式会社「スポンサーへの事業譲渡完了に関するお知らせ」（2018年4月12日） https://www.tkjpkk.com/pdf/180412_JP.pdf
  - 国土交通省「タカタ製エアバッグに関するお知らせ」 https://renrakuda.mlit.go.jp/renrakuda/recallinfo-000.html
