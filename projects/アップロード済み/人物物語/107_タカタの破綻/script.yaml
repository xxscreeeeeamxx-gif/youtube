scenes:
# ---- 先出し（2017年6月26日・東京駅前の法律事務所） ----
- id: co_kaiken
  title: ''
  background: tt_kaiken_heya
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 高田重久, emotion: thinking}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2017年6月26日。エアバッグの会社のトップが、東京駅前で会見を開いていました。
    reading: にせん じゅうななねん ろくがつ にじゅうろくにち。えあばっぐの かいしゃの とっぷが、とうきょうえき まえで かいけんお ひらいて いました。
  - speaker: zundamon
    emotion: thinking
    text: ご迷惑をおかけすることになり、タカタを代表しまして心より深くお詫び申し上げます。
  - speaker: kisha
    emotion: normal
    text: エアバッグが破裂する原因は？
  - speaker: zundamon
    emotion: thinking
    text: なぜこの問題が起こったのか不可解。
  - speaker: kisha
    emotion: surprised
    text: 不可解……？
  - speaker: zundamon
    emotion: sad
    text: 何が悪かったんだろう。
  - speaker: reimu
    text: この男は、高田重久。祖父が作り、父が育てた会社の3代目です。
    reading: この おとこわ たかだ しげひさ。そふが つくり、ちちが そだてた かいしゃの さんだいめです。
  - speaker: reimu
    text: この日タカタは破綻します。負債は最終的に1兆円を超え、製造業で戦後最大でした。
    reading: このひ たかたわ はたん します。ふさいわ さいしゅうてきに いっちょうえんお こえ、せいぞうぎょうで せんご さいだいでした。
    telops:
    - {text: "負債1兆円超・製造業で戦後最大", size: lg, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
# ---- 今の部屋（中古の車と、はがき） ----
- id: hook
  title: ''
  background: tt_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ 5万円で買った、中古の車の鍵なのだ！
    se: jaan
  - speaker: tsumugi
    emotion: normal
    text: 車検は、通ったの？
  - speaker: zundamon
    emotion: sad
    text: エアバッグがどうとかで、落ちたのだ。
  - speaker: tsumugi
    emotion: thinking
    text: そのはがき、読んだ？
  - speaker: zundamon
    emotion: normal
    text: 広告だと思って、裏返してあるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: それ、エアバッグのリコールのお知らせよ。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 作ったタカタは、9年前に潰れたの。
  - speaker: zundamon
    emotion: surprised
    text: 命を守るエアバッグの会社が、なんで潰れたの！？
# ---- 2015年6月25日・初めての会見（前半） ----
- id: ch1_kaiken
  title: 初めての会見
  background: tt_kaiken
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 高田重久, emotion: thinking}
  - {who: shimizu, x: 0.52, emotion: normal}
  - {who: kisha, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 破綻の2年前、2015年6月25日。高田は株主総会のあと、初めて記者会見を開きました。
    reading: はたんの にねん まえ、にせん じゅうごねん ろくがつ にじゅうごにち。たかだわ かぶぬし そうかいの あと はじめて きしゃ かいけんお ひらきました。
  - speaker: zundamon
    emotion: thinking
    text: 私から直接皆さまにお話しをさせていただきたいと思い、
  - speaker: zundamon
    emotion: thinking
    text: 急遽この会見を開かせていただくことといたしました。
  - speaker: kisha
    emotion: normal
    text: エアバッグが破裂する原因は、何なんですか。
  - speaker: shimizu
    emotion: normal
    text: 原因がすでに特定されている事案を、当社では[α|アルファ]事案と呼んでおります。
  - speaker: shimizu
    emotion: normal
    text: ガス発生剤の成型工程における[荷重不足|かじゅうぶそく]や、
  - speaker: shimizu
    emotion: normal
    text: 部品の[誤組付け|ごくみつけ]といった製造時の工程管理上の問題でございます。
  - speaker: kisha
    emotion: thinking
    text: 作るときの、手違いですね。
  - speaker: shimizu
    emotion: thinking
    text: まだ不具合の原因が特定できていない事案もございます。
  - speaker: shimizu
    emotion: thinking
    text: これを当社では[β|ベータ]事案と呼んでおります。
  - speaker: kisha
    emotion: surprised
    text: 原因が、分からない……？
  - speaker: shimizu
    emotion: thinking
    text: インフレータ内に水分が侵入し、
  - speaker: shimizu
    emotion: thinking
    text: その水分をガス発生剤が吸湿した結果、発生した可能性が高いと推察されております。
  - speaker: kisha
    emotion: thinking
    text: インフレータ……ガスを出す、火薬の入った筒ですよね。
  - speaker: kisha
    emotion: normal
    text: 原因の分からない[β|ベータ]の分も、タカタの責任では？
  - speaker: zundamon
    emotion: thinking
    text: 残念ながら今の段階では、
  - speaker: zundamon
    emotion: thinking
    text: これについてわれわれ、コメントできる段階ではないというふうに思っております。
  - speaker: kisha
    emotion: thinking
    text: 命を守る部品なのに、原因が分からないまま回収だけが広がっている。
  - speaker: reimu
    text: 国交省によると、2017年6月までの日本のリコール1882万台のうち、1628万台が予防のためでした。
    reading: こくこうしょうに よると にせん じゅうななねん ろくがつまでの にほんの りこーる せんはっぴゃく はちじゅうにまんだいの うち、せんろっぴゃく にじゅうはちまんだいが よぼうの ためでした。
    telops:
    - {text: "予防的リコール 1628万台", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: kisha
    emotion: normal
    text: そもそも、なぜその火薬を使ったんです？
  - speaker: shimizu
    emotion: normal
    text: この[相安定化|そうあんていか][硝酸アンモニウム|しょうさんアンモニウム]のメリットはガス化効率が良く、
  - speaker: shimizu
    emotion: normal
    text: インフレータの小型軽量化が可能になります。
  - speaker: kisha
    emotion: thinking
    text: 小さく軽く、作れる火薬か。
  - speaker: shimizu
    emotion: normal
    text: '[相安定化|そうあんていか][硝酸アンモニウム|しょうさんアンモニウム]の化学的性質につきましては理解が確立しており、'
  - speaker: shimizu
    emotion: normal
    text: 安全性にもまったく問題がなく、ガス発生剤に適した物質であると考えております。
  - speaker: reimu
    text: のちの原因調査で、乾燥剤のない火薬は湿気の中で長く温度の変化にさらされると劣化する、と分かります。
    reading: のちの げんいん ちょうさで かんそうざいの ない かやくわ しっけの なかで ながく おんどの へんかに さらされると れっか すると、わかります。
  - speaker: kisha
    emotion: surprised
    text: 湿気と、長い[年月|ねんげつ]……。
# ---- 会見のあと・記者室 ----
- id: ch1_seikyu
  title: 立て替えの請求
  background: tt_kaigi
  stage:
  - {who: kisha, x: 0.3, flip: true, emotion: thinking}
  - {who: kisha2, x: 0.7, emotion: normal}
  cuts:
  - speaker: kisha2
    emotion: normal
    text: その回収の費用は、誰が払うんだ。
  - speaker: kisha
    emotion: normal
    text: リコールを国に届け出るのは、自動車メーカーだ。まずは、メーカーが払う。
  - speaker: kisha2
    emotion: thinking
    text: 部品を作ったのは、タカタだろ。
  - speaker: kisha
    emotion: thinking
    text: 立て替えた分は、あとで部品の会社に請求が来るだろうな。
  - speaker: reimu
    text: タカタはのちに、その一定の割合が自社の債務になりうると開示します。
    reading: たかたわ のちに、その いっていの わりあいが じしゃの さいむに なりうると かいじ します。
  - speaker: kisha
    emotion: thinking
    text: 届け出るメーカーはたくさんあるのに、部品の会社は1社か。
  - speaker: kisha2
    emotion: surprised
    text: 請求書が、1か所に集まるわけだ。
    se: hirameki
  - speaker: reimu
    text: 東京商工リサーチは、メーカーが立て替えた費用を総額1兆3000億円とみています。
    reading: とうきょう しょうこう りさーちわ、めーかーが たてかえた ひようお そうがく いっちょう さんぜんおくえんと みて います。
  - speaker: kisha2
    emotion: normal
    text: でもタカタは、本業はもうかってるんだろ？
  - speaker: reimu
    text: 2年後の決算でも、本業は390億円の黒字。それでも最終の損益は、796億円の赤字でした。
    reading: にねんごの けっさんでも、ほんぎょうわ さんびゃく きゅうじゅうおくえんの くろじ。それでも さいしゅうの そんえきわ、ななひゃく きゅうじゅうろくおくえんの あかじでした。
    background: tt_kaigi_akaji
  - speaker: kisha
    emotion: thinking
    text: 本業でもうけても、請求に追いつかない……。
    beat: true
  - speaker: reimu
    text: のちの再生計画で、100万円の払いが残る取引先に戻るのは50万5000円です。
    reading: のちの さいせい けいかくで、ひゃくまんえんの はらいが のこる とりひきさきに もどるのわ ごじゅうまん ごせんえんです。
    telops:
    - {text: "100万円 → 戻るのは50万5000円", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: kisha2
    emotion: thinking
    text: 命を守る部品の会社が、どうしてここまで……。
  - speaker: reimu
    text: 命を守る部品の会社は、なぜこの火薬にたどり着いたのか。始まりは、布でした。
    reading: いのちお まもる ぶひんの かいしゃわ なぜ この かやくに たどりついたのか。はじまりわ、ぬのでした。
# ---- 祖父の時代（短く） ----
- id: card1933
  title: ''
  background: tt_card_1933
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1933年。滋賀県の彦根で、重久の祖父が織物の工場を始めます。
    reading: せんきゅうひゃく さんじゅうさんねん。しがけんの ひこねで、しげひさの そふが おりものの こうじょうお はじめます。
- id: ch2_obi
  title: 織物からシートベルトへ
  background: tt_kojo_old
  bgm: honwaka_puppu
  stage:
  - {who: sofu, x: 0.3, flip: true, emotion: normal}
  - {who: koin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1952年。工場では、パラシュートの技術を使った研究が始まります。
    reading: せんきゅうひゃく ごじゅうにねん。こうじょうでわ、ぱらしゅーとの ぎじゅつお つかった けんきゅうが はじまります。
  - speaker: sofu
    emotion: thinking
    text: パラシュートの技術を、車に使えんか。
  - speaker: koin
    emotion: surprised
    text: 車に、パラシュートを！？ 車は、[空|そら]から落ちませんよ。
    se: manuke
  - speaker: sofu
    emotion: angry
    text: 落ちる人を支える布だ。
  - speaker: sofu
    emotion: normal
    text: 車の座席にも、人を支える帯が要るだろう。
  - speaker: koin
    emotion: thinking
    text: 座席に、人を支える帯……。
  - speaker: koin
    emotion: happy
    text: シートベルトですか！
    beat: true
  - speaker: sofu
    emotion: happy
    text: 布で、人を守るんだ。
  - speaker: koin
    emotion: surprised
    text: 織物の工場が、車の部品屋に……。
  - speaker: reimu
    text: 1960年、会社はシートベルトを売り始めます。命を守る布の会社が、のちに火薬を扱います。
    reading: せんきゅうひゃく ろくじゅうねん、かいしゃわ しーとべるとお うりはじめます。いのちお まもる ぬのの かいしゃが、のちに かやくお あつかいます。
# ---- 父と本田宗一郎（日経が伝える話） ----
- id: ch2_honda
  title: 1万分の1ではない
  background: tt_kojo_old
  bgm: curious
  stage:
  - {who: chichi, x: 0.3, flip: true, emotion: normal}
  - {who: soichiro, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 日経が伝える話では、2代目の重一郎はシートベルトを広めようと本田宗一郎に直談判しました。
    reading: にっけいが つたえる はなしでわ、にだいめの じゅういちろうわ しーとべるとお ひろめようと ほんだ そういちろうに じきだんぱん しました。
  - speaker: chichi
    emotion: normal
    text: 本田さん。人間の安全性も考えてほしい。
  - speaker: soichiro
    emotion: normal
    text: 顧客にとって製品は[1万分の1|いちまんぶんのいち]ではない。
    telops:
    - {text: "本田「1万分の1ではない」", size: lg, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: chichi
    emotion: thinking
    text: ……と、言いますと？
  - speaker: soichiro
    emotion: normal
    text: 1万台に1台の不良でも、買った客にはその1台が全部だ。
  - speaker: soichiro
    emotion: angry
    text: 120%の良品でないといけない。
  - speaker: chichi
    emotion: surprised
    text: 100%じゃ、足りないんですか！？
  - speaker: soichiro
    emotion: angry
    text: 足りん。
    se: don
  - speaker: chichi
    emotion: thinking
    text: ……120%の、ベルトか。
  - speaker: reimu
    text: 1963年、ホンダのS500に、日本で初めて2点式のシートベルトが標準で付きました。
    reading: せんきゅうひゃく ろくじゅうさんねん、ほんだの えすごひゃくに にほんで はじめて にてんしきの しーとべるとが ひょうじゅんで つきました。
# ---- エアバッグと、火薬の筒 ----
- id: ch2_airbag
  title: 需要が減る
  background: tt_kojo_old
  bgm: pop
  stage:
  - {who: chichi, x: 0.3, flip: true, emotion: normal}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1976年。今度は、エアバッグの研究の話が持ちかけられます。
    reading: せんきゅうひゃく ななじゅうろくねん。こんどわ、えあばっぐの けんきゅうの はなしが もちかけられます。
  - speaker: shain
    emotion: happy
    text: アメリカの当局やホンダから、エアバッグを研究しないかと！
  - speaker: chichi
    emotion: thinking
    text: エアバッグが広まったら、うちの需要が減るだろう。
  - speaker: shain
    emotion: surprised
    text: 命を守る道具が、増えるのにですか！？
  - speaker: reimu
    text: 重一郎は初め反対し、やがて推し進める側に回ります。社内では、こう繰り返しました。
