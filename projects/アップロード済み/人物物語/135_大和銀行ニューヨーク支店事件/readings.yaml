# daiwa-ny 読み台帳（人名・地名・社名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある（人名・社名のタグはカタカナ）。
# ナレ（ゆっくり）は reading: のひらがなで読ませている（FRB＝えふあーるびー、FBI はセリフだけ）。
# 名札（tag: 井口 / label: 新人・トレーダー・支店の人・検査官・FBI・看守・記者・頭取・裁判長・株主）・テロップ・章タイトルは
# 表示専用なのでタグを付けていない。
#
# 2026-11-18 台本を書いたあと、セリフを VOICEVOX の audio_query（話者3）にかけた結果:
# - 井口 はタグなしでも イグチ。発注書どおりカタカナのタグ [井口|イグチ] にした。
#   「井口俊英さんですね」はタグ [井口俊英|イグチトシヒデ] だと イグチ/トシ/ヒデ と切れた → セリフは [井口|イグチ]さん にした。
# - 大和銀行 はタグなしでも ダイワギンコオ（ヤマトにならない）。発注書どおり [大和銀行|ダイワギンコウ] にした（読みは同じ）。
# - 大蔵省 はひらがなのタグ [大蔵省|おおくらしょう] だと オオクラ/ショオ と切れた → カタカナのタグ [大蔵省|オオクラショウ] で
#   オオクラショオ（1語）。判決の「大蔵省銀行局長の威信を」もカタカナのタグで オオクラショオギンコオキョクチョオノ。
# - 金融監督庁 はカタカナのタグだと キン/ユウカントクチョオ と切れた → タグなし（キンユウカントクチョオ）。台帳に入れていない。
# - 内部統制 はひらがなのタグで ナイブ/トオセイ、カタカナのタグで ナ/イブトオセイ と切れた → タグなし（ナイブトオセエ）。台帳に入れていない。
#   判決の「リスク管理体制（いわゆる内部統制システム）」はタグなしだと システム、/オ と切れた →
#   [リスク管理体制（いわゆる内部統制システム）|リスクかんりたいせい、いわゆるないぶとうせいシステム] で
#   リスクカンリタイセイ、/イワユル/ナイブトオセイシステムオ。
# - ローカル・ルール はタグなしだと ロオカル、/ルウル と「・」で間が入った → [ローカル・ルール|ローカルルール] で ロオカル/ルウルニ。
# - 頭取の会見の「約11億ドル（約1100億円）」はタグなしだと カッコの前後で間が入り オクエン、/ノ と切れた。
#   よみをカタカナにしたタグは ヤクセン/ヒャクオクエンノ と千と百の間で切れた（見直しの指摘）→
#   よみ側を数字にした [約11億ドル（約1100億円）|約11億ドル、約1100億円] で ヤクジュウ/イチオクドル、/ヤクセンヒャク/オクエンノ。
# - 2026-11-18 見直し（dw_fix.md）で直した・足したセリフも audio_query にかけた（禁錮4年だったのに・損で1人・
#   それまでの処理を続けさせた・逃亡を防ぐ・指示や命令・ローカル・ルールに頼った ほか）。結果は下の各行の注記のとおり。
# - 米国債 は [米国債|べいこくさい] で ベイコクサイ（米国債投資＝ベイコクサイトオシ）。
# - 変動金利債・嘱託・保管・明細・禁錮4年・株主代表訴訟・兵庫銀行・住専 はタグありで1語（ヘンドオキンリサイ・ショクタク・
#   ホカン・メイサイ・キンコヨネン・カブヌシダイヒョオソショオ・ヒョオゴギンコオ・ジュウセン）。
# - 流砂 はタグなしだと リュウシャ → [流砂|りゅうさ] で リュウサ。
# - りそな銀行 はタグありでもタグなしと同じ リソナギンコオ。発注書の読みに合わせて台帳に入れ、カタカナのタグにした。
# - FBI は [FBI|エフビーアイ] で エフビイアイ（タグなしでも同じ）。
# - 頭取（トオドリ）・副頭取（フクトオドリ）・FRB（エフアアルビイ）・バンカーズ・トラスト（バンカアズ、/トラスト）・
#   被った（コオムッタ）・帳尻（チョオジリ）・利払い（リバライ）・持たせきり（モタセ/キリ）・９５年（キュウジュウ/ゴネン）は
#   タグなしで正しく読んだ。台帳に入れていない。
