meta:
  title: 「ローカル・ルールに固執し」と判決に書かれた大和銀行の元役員11人、計829億円の賠償命令【ずんだもん解説】
  slug: daiwa-ny
  hook_line: 全部を告白した行員に、銀行はなぜ隠し続けられるかと聞いたのか。
  summary: 1995年7月、大和銀行ニューヨーク支店の行員、井口俊英は頭取あてに30ページあまりの手紙を書きました。11年分の無断の売買で、銀行の損は約11億ドル。11日後、日本の本部からの電話が尋ねたのは、損を隠し続けられるかでした。売る人と金庫番が同じ1人だった支店、倉庫に化けた取引室、米国に知らせなかった約2か月。米国の当局の文書と判決、本人の英語の取材を主語を分けて並べ、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 米連邦準備制度理事会・ニューヨーク州銀行局 Daiwa Bank に対する命令と告発（1995年10月2日） https://www.federalreserve.gov/supervisionreg/files/19951002.pdf
  - 米連邦準備制度理事会・FDIC・ニューヨーク州銀行局 Regulators Announce Termination of Enforcement Orders Against Daiwa Bank（2003年5月5日） https://www.federalreserve.gov/boarddocs/press/enforcement/2003/20030505/default.htm
  - 米司法省 犯罪被害者局 Report to Congress（1999年12月）付録 https://ovc.ojp.gov/sites/ovc/files/pubs/OVC_Archives/repcong2000/app1.html
  - 総務省「参考資料５ 内部統制関連資料」 https://www.soumu.go.jp/main_content/000376783.pdf
  - 金融庁「金融庁オーラルヒストリー作成に係る史談会」（乾文男・2019年7月2日） https://www.fsa.go.jp/common/about/kaikaku/openpolicylab/inui_oral.pdf
  - 'CNBC "I''m not a criminal: Daiwa rogue trader who lost $1 billion"（2014年4月29日） https://www.cnbc.com/2014/04/29/im-not-a-criminal-daiwa-rogue-trader-who-lost-1-billion.html'
