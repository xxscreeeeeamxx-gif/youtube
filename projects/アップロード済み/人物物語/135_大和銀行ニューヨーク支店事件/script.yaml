  - speaker: tsumugi
    emotion: normal
    text: その監督部長だった人は、2019年の金融庁の聞き取りでこう語っているの。
  - speaker: tsumugi
    emotion: normal
    text: '[大蔵省|オオクラショウ]から金融監督機能を切り離すことについて、'
  - speaker: tsumugi
    emotion: normal
    text: 最も影響が大きかったのは、
  - speaker: tsumugi
    emotion: normal
    text: ９５年の[大和銀行|ダイワギンコウ]ニューヨーク支店事件と[住専|じゅうせん]問題だと思います。
  - speaker: zundamon
    emotion: surprised
