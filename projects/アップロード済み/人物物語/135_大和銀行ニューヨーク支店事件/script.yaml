    reading: べいこくに しらせなかった やくいんたちに ついてわ、こうです。
  - speaker: saibancho
    emotion: normal
    text: 我が国内でのみ通用する非公式の[ローカル・ルール|ローカルルール]に固執し、
  - speaker: saibancho
    emotion: normal
    text: '[大蔵省|オオクラショウ]銀行局長の威信を頼りとして[大和銀行|ダイワギンコウ]の危機を克服しようとして、'
  - speaker: saibancho
    emotion: normal
    text: アメリカ当局の厳しい処分を受ける事態を招いた
    telops:
    - {text: "判決「ローカル・ルールに固執し」", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    background: dw_shinbun
    text: 役員11人に、合わせて7億7500万ドル。夕刊には、元役員らに829億円損害賠償の見出しが出ます。
    reading: やくいん じゅういちにんに、あわせて ななおく ななせん ごひゃくまん どる。ゆうかんにわ、もとやくいんらに はっぴゃく にじゅうきゅうおくえん そんがい ばいしょうの みだしが でます。
- id: heya4
  title: ''
  background: dw_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 829億円！？ 罰金なの？
    se: bikkuri
  - speaker: tsumugi
    emotion: normal
    text: 罰金じゃないわ。役員が、銀行に払えと命じられたお[金|かね]よ。
  - speaker: tsumugi
    emotion: normal
    text: 取引の損で払えと言われたのは、ニューヨーク支店長だった元副頭取1人だけ。
  - speaker: zundamon
    emotion: surprised
    text: 1人だけ！？
  - speaker: tsumugi
    emotion: normal
    text: その1人に、5億3000万ドルよ。
  - speaker: tsumugi
    emotion: thinking
    text: 米国に報告しなかった責任では、11人に合わせて約2億4500万ドル。
  - speaker: tsumugi
    emotion: thinking
    text: 頭取たちは、疑う特別な事情が無い限り
  - speaker: tsumugi
    emotion: thinking
    text: 取引の損そのものの監督の責任までは負わない、とも判決は言ったの。
  - speaker: zundamon
    emotion: thinking
    text: 損で1人、言わなかったことで11人……
  - speaker: tsumugi
    emotion: normal
    text: 裁判は高裁へ。2001年12月、和解が成立したわ。
  - speaker: tsumugi
    emotion: normal
    text: 役員49人が連帯して、銀行に2億5000万円を払う和解よ。
  - speaker: zundamon
    emotion: thinking
    text: 829億円の判決が、2億5000万円の和解に……
  - speaker: tsumugi
    emotion: normal
    text: 銀行が、持ち株会社の下に入る直前だったの。
  - speaker: tsumugi
    emotion: thinking
    text: そうなると株主は訴える資格を失うおそれがあった、と論文は説明しているわ。
  - speaker: zundamon
    emotion: thinking
    text: 直前の、和解……
# ---- 本人のその後（2014年の英語の取材は趣旨で。2019年に68歳で死去。家族は出さない） ----
- id: sonogo
  title: その後の井口
  background: dw_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: '[井口|イグチ]さんは、そのあとどうなったの？'
  - speaker: tsumugi
    emotion: normal
    text: 出所するとアトランタで本を書き、2007年に神戸へ戻ったわ。
  - speaker: tsumugi
    emotion: normal
    text: 2014年には、英語の取材でこう語っているの。
  - speaker: tsumugi
    emotion: thinking
    text: 犯罪だとすら思っていない。社内の規則違反にすぎない。そういう趣旨よ。
  - speaker: zundamon
    emotion: angry
    text: '[禁錮4年|きんこよねん]だったのに！？'
  - speaker: tsumugi
    emotion: thinking
    text: 法廷で罪を認めて、刑を受けたのは本人。犯罪ではない、は本人の意見よ。
  - speaker: zundamon
    emotion: thinking
    text: 認めたのも、本人……
  - speaker: tsumugi
    emotion: normal
    text: 2019年4月、彼はフロリダの自宅で亡くなったわ。68歳だった。
  - speaker: zundamon
    emotion: sad
    text: ……68歳
# ---- 論争1：ひとりの行員の不正？（俗説→正面から受ける→言い切らない） ----
- id: ronso1
  title: ひとりの行員の不正？
  background: dw_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ 悪いのは1人の行員で、銀行は被害者だって！
  - speaker: tsumugi
    emotion: normal
    text: そう見える事実はあるの。無断の売買も書類の作り替えも、したのは本人。
  - speaker: tsumugi
    emotion: normal
    text: 銀行もはじめは、大阪の本店は彼の売買を知らなかったと主張していたわ。
  - speaker: zundamon
    emotion: happy
    text: やっぱりなのだ！
  - speaker: tsumugi
    emotion: normal
    text: でも米国が罰したのは、損を出したことじゃないの。分かったあとに隠したことよ。
    se: tsukkomi
  - speaker: zundamon
    emotion: surprised
    text: あとの、2か月……
  - speaker: tsumugi
    emotion: normal
    text: 銀行は16の罪を認めたし、取引室を倉庫に見せたのは支店ぐるみだったわ。
  - speaker: tsumugi
    emotion: thinking
    text: 本人も2014年に、責任は最後はトップに行くという趣旨を話しているの。
  - speaker: tsumugi
    emotion: thinking
    text: 売買は1人。隠したのは、銀行の上も。そう言うのが近いわね。
  - speaker: zundamon
    emotion: thinking
    text: 1人とも、みんなとも言い切れない……
    beat: true
# ---- 論争2：大蔵省が隠せと言った？（判決は命令の証拠なし。大蔵省の場面は作らない） ----
- id: ronso2
  title: 大蔵省が隠せと言った？
  background: dw_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: じゃあ、[大蔵省|オオクラショウ]が隠せって言ったのだ！？
  - speaker: tsumugi
    emotion: normal
    text: '[大蔵省|オオクラショウ]は8月8日に報告を受けたのに、10月まで9月18日だと説明していたの。'
  - speaker: zundamon
    emotion: surprised
    text: 日付まで！？
  - speaker: tsumugi
    emotion: normal
    text: 米国の上院の委員長は、両国政府の信頼の重大な裏切りだと[責め|せめ]たわ。
  - speaker: tsumugi
    emotion: normal
    text: '[井口|イグチ]も本で、銀行と[大蔵省|オオクラショウ]の会合が少なくとも4回あったと書いているの。'
  - speaker: tsumugi
    emotion: thinking
    text: 本が出たとき、銀行も[大蔵省|オオクラショウ]もコメントしなかったわ。
  - speaker: zundamon
    emotion: angry
    text: ほら、やっぱりなのだ！
  - speaker: tsumugi
    emotion: normal
    text: でも判決は、[大蔵省|オオクラショウ]が報告をしないよう指示や命令をした証拠はないとしたの。
    se: hammer
  - speaker: tsumugi
    emotion: thinking
    text: '[責め|せめ]たのは、役所に頼って自分の責任で決めなかったことよ。'
  - speaker: zundamon
    emotion: thinking
    text: 命令がなくても、頼ったのがだめ……
    beat: true
# ---- 本当の注意点（茶番の回収・投資や銀行選びの助言にしない） ----
- id: chui
  title: 言える仕組み
  background: dw_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 1つめ。お[金|かね]を動かす人と、確かめる人を分ける。
  - speaker: tsumugi
    emotion: normal
    text: サークルの会計でも、通帳と印鑑を1人に持たせきりにしない。
  - speaker: zundamon
    emotion: thinking
    text: 金庫番と、売る人……
  - speaker: tsumugi
    emotion: normal
    text: 2つめ。残高は相手から直接、原本で確かめる。
  - speaker: tsumugi
    emotion: thinking
    text: 本人が持ってきたコピーで、合ってると言わないこと。
  - speaker: zundamon
    emotion: thinking
    text: コピーじゃ、だめなのだ……
  - speaker: tsumugi
    emotion: normal
    text: 3つめ。小さな失敗を、言える仕組みを作る。
  - speaker: tsumugi
    emotion: thinking
    text: 本人は2014年、英語の取材でこうも話しているわ。
  - speaker: tsumugi
    emotion: thinking
    text: 一度足を踏み入れたら、[流砂|りゅうさ]のようなもの。そういう趣旨よ。
  - speaker: zundamon
    emotion: sad
    text: 100円が、500円に……
    se: shobon
# ---- 現代（金融監督庁・会社法の内部統制・りそな銀行。因果で言い切らない） ----
