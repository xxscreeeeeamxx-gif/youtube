scenes:
# ---- 先出し（1995年7月・書斎の机 → 7月24日の電話。電話の向こうの役員に台詞を作らない。SEなし） ----
- id: co_tegami
  title: ''
  background: dw_jitaku
  bgm: serious
  stage:
  - {who: zundamon, x: 0.72, tag: 井口, emotion: sad}
  cuts:
  - speaker: reimu
    text: 1995年7月、ニューヨークの近く。大和銀行の行員、井口俊英が頭取あての手紙を書いています。
    reading: せんきゅうひゃく きゅうじゅうごねん しちがつ、にゅーよーくの ちかく。だいわ ぎんこうの こういん、いぐち としひでが とうどりあての てがみお かいて います。
  - speaker: zundamon
    emotion: sad
    text: ……11年分、全部書く
  - speaker: reimu
    text: 30ページあまり。11年分の無断の取引を、全部書いた手紙でした。
    reading: さんじゅっぺーじ あまり。じゅういちねんぶんの むだんの とりひきお ぜんぶ かいた てがみでした。
  - speaker: reimu
    background: dw_jitaku_denwa
    text: 11日後、日本の本部から電話が来ます。
    reading: じゅういちにちご、にっぽんの ほんぶから でんわが きます。
  - speaker: zundamon
    emotion: surprised
    text: ……はい、[井口|イグチ]です
  - speaker: reimu
    text: 聞かれたのは、これからも隠し続けられるかでした。
    reading: きかれたのわ、これからも かくしつづけられるか でした。
  - speaker: zundamon
    emotion: sad
    text: ……隠し続ける、ですか
  - speaker: reimu
    text: 銀行の損は約11億ドル。その年の11月、大和銀行はアメリカから出ていくよう命じられます。
    reading: ぎんこうの そんわ やく じゅういちおく どる。その としの じゅういちがつ、だいわ ぎんこうわ あめりかから でていくよう めいじられます。
# ---- 今の部屋（集金の穴。20秒以内） ----
- id: hook
  title: ''
  background: dw_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 集金が100円足りなかったのだ。お小遣いで埋めたのだ
  - speaker: tsumugi
    emotion: normal
    text: 先生に言った？
  - speaker: zundamon
    emotion: sad
    text: 言ってないのだ。来週は、500円足りないのだ……
    se: chin
  - speaker: tsumugi
    emotion: thinking
    text: 数万ドルの穴を言えずに、11年で11億ドルにした行員がいたの。
  - speaker: tsumugi
    emotion: thinking
    text: 全部を告白したその行員に、銀行はなぜ隠し続けられるかと聞いたのか。
    telops:
    - {text: "全部を告白した行員に なぜ隠し続けられるかと？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 告白したのに！？
# ---- 1976年・嘱託の行員（30秒以内。子供時代は描かない） ----
- id: card1976
  title: ''
  background: dw_card_1976
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1976年1月。24歳の井口は、大和銀行のニューヨーク支店に入ります。
    reading: せんきゅうひゃく ななじゅうろくねん いちがつ。にじゅうよんさいの いぐちわ、だいわ ぎんこうの にゅーよーく してんに はいります。
- id: ch1_shokutaku
  title: 嘱託の行員
  background: dw_shiten
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 井口, emotion: normal}
  - {who: shiten, x: 0.86, emotion: normal}
  cuts:
  - speaker: shiten
    emotion: normal
    text: 高校を出て渡米して、大学のあとは車の販売か。
  - speaker: shiten
    emotion: normal
    text: '[井口|イグチ]くんは[嘱託|しょくたく]で採用だ。預かった証券を管理する、[保管|ほかん]の係を頼む'
  - speaker: zundamon
    emotion: happy
    text: はい。よろしくお願いします
  - speaker: reimu
    text: 現地雇いの嘱託は、本来なら補助の役しかない身分。これが、のちに効いてきます。
    reading: げんちやといの しょくたくわ、ほんらいなら ほじょの やくしか ない みぶん。これが のちに きいて きます。
# ---- 1983〜84年・最初の穴（金額は資料で割れる→数万ドル。5万ドルなら約1200万円） ----
- id: ch2_ana
  title: 最初の穴
  background: dw_torihiki
  bgm: curious
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 井口, emotion: normal}
  - {who: trader, x: 0.86, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1983年ごろ。債券の売り買いも任された彼は、変動金利債の取引で最初の損を出します。
    reading: せんきゅうひゃく はちじゅうさんねん ごろ。さいけんの うりかいも まかされた かれわ、へんどう きんりさいの とりひきで さいしょの そんお だします。
  - speaker: trader
    emotion: surprised
    text: '[井口|イグチ]さん。[変動金利債|へんどうきんりさい]の値が、下がってます！'
  - speaker: zundamon
    emotion: surprised
    text: ……分かってる
  - speaker: zundamon
    emotion: sad
    text: ……言えば、終わりなのだ
  - speaker: zundamon
    emotion: normal
    text: 取り戻せば、誰も困らない
  - speaker: reimu
    text: 最初の穴は数万ドル。5万ドルなら、当時のお金で約1200万円です。
    reading: さいしょの あなわ すうまん どる。ごまん どるなら、とうじの おかねで やく せんにひゃくまんえんです。
  - speaker: reimu
    text: 1984年から、帳簿に載せない無断の米国債の売買が始まります。穴は11年後、約1100億円に。
    reading: せんきゅうひゃく はちじゅうよねんから、ちょうぼに のせない むだんの べいこくさいの ばいばいが はじまります。あなわ じゅういちねんご やく せんひゃくおくえんに。
    telops:
    - {text: "約1200万円→約1100億円", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#CC0000", anim: up}
# ---- 1984〜89年・売る人と金庫番（劇中の職場で仕組みを見せる） ----
- id: ch3_kinko
  title: 金庫の鍵
  background: dw_kinko
  stage:
  - {who: zundamon, x: 0.07, flip: true, tag: 井口, emotion: normal}
  - {who: shinjin, x: 0.93, emotion: normal}
  cuts:
  - speaker: shinjin
    emotion: normal
    text: '[井口|イグチ]さん、新人です。金庫の鍵は、どなたが？'
  - speaker: zundamon
    emotion: normal
    text: ボクだ
  - speaker: shinjin
    emotion: normal
    text: '[米国債|べいこくさい]の売り買いは？'
  - speaker: zundamon
    emotion: normal
    text: ボクだ
  - speaker: shinjin
    emotion: thinking
    text: じゃあ売った国債の確認書は、どこに回せば？
  - speaker: zundamon
    emotion: happy
    text: ボクの机でいい
    se: tenten
  - speaker: shinjin
    emotion: surprised
    text: バンカーズ・トラストから、[保管|ほかん]残高の[明細|めいさい]も届いてます
  - speaker: zundamon
    emotion: normal
    text: それも、ボクが回しておく
  - speaker: reimu
    text: 売る人と金庫の鍵を持つ人、確かめる紙を受け取る人。全部が同じ1人でした。
    reading: うる ひとと きんこの かぎお もつ ひと、たしかめる かみお うけとる ひと。ぜんぶが おなじ ひとりでした。
    telops:
    - {text: "売る人も金庫番も 同じ1人", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
- id: ch3_meisai
  title: ''
  background: dw_meisai
  stage:
  - {who: zundamon, x: 0.06, flip: true, tag: 井口, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: 預けてある国債は、銀行の分も客の分も売らせる
  - speaker: zundamon
    emotion: normal
    text: 売った分は、[明細|めいさい]の上では残っていることにする
  - speaker: reimu
    text: 検査も監査も、残高はこの明細で確かめていました。取り寄せていたのは、彼の係です。
    reading: けんさも かんさも、ざんだかわ この めいさいで たしかめて いました。とりよせて いたのわ、かれの かかりです。
# ---- 今の部屋（通帳のコピーのたとえ・2014年の英語の取材の趣旨・論考の見方・問いに戻る） ----
- id: heya1
  title: ''
  background: dw_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 確かめる紙を、なんで本人が受け取ってたの！？
  - speaker: tsumugi
    emotion: normal
    text: 家計簿なら、通帳を持つ本人が残高のコピーを見せる感じね。
  - speaker: tsumugi
    emotion: normal
    text: そのコピーで、合ってるねと言っていたの。
  - speaker: zundamon
    emotion: angry
    text: そんなの、いくらでも書き換えられるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 本人は2014年、英語の取材でこう語っているの。
  - speaker: tsumugi
    emotion: normal
    text: 取り戻せる見込みがある限り、銀行のために損を取り戻そうとする。
  - speaker: tsumugi
    emotion: thinking
    text: だから、犯罪だという感覚が無い。そういう趣旨よ。
  - speaker: zundamon
    emotion: thinking
    text: 銀行のため……？
  - speaker: tsumugi
    emotion: normal
    text: ある論文の見方では、[嘱託|しょくたく]として腕を認められていた彼は
  - speaker: tsumugi
    emotion: normal
    text: 実績と名誉を、小さな失敗で失うわけにいかなかったの。
  - speaker: zundamon
    emotion: sad
    text: 100円の集金と、同じなのだ……
    beat: true
  - speaker: tsumugi
    emotion: thinking
    text: その本人が11年後、自分から全部を告白するの。
  - speaker: tsumugi
    emotion: thinking
    text: 確かめる紙を握っていた人の告白に、銀行は何と返したのか。
  - speaker: zundamon
    emotion: thinking
    text: 隠し続けられるか、って……
# ---- 1989〜91年・神様（新聞の匿名の言葉はナレで出どころつき・1回） ----
- id: ch4_kamisama
  title: 神様と思われた人
  background: dw_torihiki
  bgm: curious
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 井口, emotion: normal}
  - {who: trader, x: 0.86, emotion: happy}
  cuts:
  - speaker: trader
    emotion: happy
    text: '[井口|イグチ]さん、今月もうちの取引は黒字です！'
  - speaker: zundamon
    emotion: normal
    text: ……[表|おもて]の数字は、な
  - speaker: reimu
    text: 1991年、彼は副支店長格に。事件のあと新聞は、行内の人の話をこう書きます。
    reading: せんきゅうひゃく きゅうじゅういちねん、かれわ ふくしてんちょうかくに。じけんの あと しんぶんわ、こうないの ひとの はなしお こう かきます。
  - speaker: reimu
    text: 副支店長格で、神様とも思われていた人物。部下は約50人いたが、みな彼の教え子で
    reading: ふくしてんちょうかくで、かみさまとも おもわれて いた じんぶつ。ぶかわ やく ごじゅうにん いたが みな かれの おしえごで
  - speaker: reimu
    text: 幹部も彼に仕事を任せきっていた。
    reading: かんぶも かれに しごとお まかせきって いた。
  - speaker: trader
    emotion: happy
    text: さすが、[井口|イグチ]さんです！
  - speaker: zundamon
    emotion: sad
    text: ……さすが、か
# ---- 1992年11月・取引室が倉庫になる日（笑いの場面。支店長・役員の台詞は作らない） ----
- id: ch5_soko
  title: 取引室が倉庫になる日
  background: dw_torihiki
  bgm: pop
  stage:
  - {who: zundamon, x: 0.1, flip: true, tag: 井口, emotion: normal}
  - {who: shinjin, x: 0.92, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 1992年11月。FRBとニューヨーク州の検査が、支店に来ます。
    reading: せんきゅうひゃく きゅうじゅうにねん じゅういちがつ。えふあーるびーと にゅーよーくしゅうの けんさが してんに きます。
  - speaker: shinjin
    emotion: surprised
    text: 支店の上の指示で、検査中はトレーダーがミッドタウンへ移るそうです！
  - speaker: shinjin
    emotion: thinking
    text: ここ、届け出の上では証券の管理だけの事務所ですもんね
  - speaker: zundamon
    emotion: normal
    text: ……取引も、ここでしてるからな
  - speaker: shinjin
    emotion: thinking
    text: 机と画面は、どうします？
  - speaker: zundamon
    emotion: normal
    text: 段ボールで隠す
  - speaker: shinjin
    emotion: thinking
    text: 何箱、積みます？
  - speaker: zundamon
    emotion: angry
    text: 天井まで、積むのだ！
  - speaker: shinjin
    emotion: surprised
    background: dw_torihiki_soko
    text: 照明も、消しますか？
  - speaker: zundamon
    emotion: normal
    text: 消す。ここは倉庫だ
  - speaker: shinjin
    emotion: thinking
    text: ……電話が鳴ったら？
  - speaker: zundamon
    emotion: normal
    text: 倉庫は、電話に出ない
    beat: true
- id: ch5_soko2
  title: ''
  background: dw_torihiki_soko
  stage:
  - {who: zundamon, x: 0.1, flip: true, tag: 井口, emotion: normal}
  - {who: kensakan, x: 0.92, emotion: thinking}
  cuts:
  - speaker: kensakan
    emotion: thinking
    text: ……ここは？
  - speaker: zundamon
    emotion: happy
    text: 倉庫です
  - speaker: kensakan
    emotion: normal
    text: ……倉庫ですね
    se: oti
  - speaker: reimu
    text: これは支店ぐるみの細工でした。この日のことは3年後、銀行が起訴された罪の1つになります。
    reading: これわ してんぐるみの さいくでした。この ひの ことわ さんねんご、ぎんこうが きそ された つみの ひとつに なります。
  - speaker: reimu
    text: 罰を受けるのは、損を出したことか。隠したことか。
    reading: ばつお うけるのわ、そんお だした ことか。かくした ことか。
# ---- 1993年11月・形だけの分離（FRB の見方。名前の無いモブで） ----
- id: ch6_utsushi
  title: 写しと、形だけの分離
  background: dw_shiten
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 井口, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1993年9月には大和銀行の監査役も支店を訪ね、写しで残高の一致を確かめました。
    reading: せんきゅうひゃく きゅうじゅうさんねん くがつにわ だいわ ぎんこうの かんさやくも してんお たずね、うつしで ざんだかの いっちお たしかめました。
  - speaker: zundamon
    emotion: normal
    text: こちらが、[保管|ほかん]残高の写しです
  - speaker: zundamon
    emotion: normal
    text: ……写しの上では、合ってる
    beat: true
- id: ch6_bunri
  title: ''
  background: dw_shiten
  stage:
  - {who: kensakan, x: 0.16, flip: true, emotion: thinking}
  - {who: shiten, x: 0.86, emotion: normal}
  cuts:
  - speaker: kensakan
    emotion: thinking
    text: 去年も言いましたね。取引と[保管|ほかん]、まだ1人で両方では？
  - speaker: shiten
    emotion: normal
