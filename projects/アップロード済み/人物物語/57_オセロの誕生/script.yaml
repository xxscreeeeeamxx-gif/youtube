meta:
  title: 【オセロの誕生】製薬会社の営業マンが、牛乳瓶のフタで作ったゲーム【ずんだもん解説】
  slug: othello-hasegawa
  summary: 挟んで裏返すだけのオセロ。世に送り出したのは、水戸で育った製薬会社の営業マン、長谷川五郎でした。本人が語る原点は、戦争が終わった年の、焼け跡の10分休み。牛乳瓶の紙のフタを重ねて作った駒は、どうやって世界の盤になったのか。英文学者の父が付けた名前、おもちゃ会社の部長との出会い、発売の日に鳴りやまなかった電話。そして、よく似たゲーム、リバーシとの関係にも触れます。
  tags:
  - オセロ
  - 長谷川五郎
  - リバーシ
  - ボードゲーム
  - 水戸
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 雑学
  thumbnail:
    top: 牛乳瓶のフタで作った
    bottom: オセロの誕生
  mode: drama
  narrator: reimu
