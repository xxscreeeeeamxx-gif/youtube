scenes:
- id: hook
  title: ''
  background: os_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、見るのだ。盤の上が、ほとんど黒なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: まだ10手目よ。
  - speaker: zundamon
    emotion: happy
    text: オセロは、たくさん取った方が勝つ。つまり、ボクの勝ちは決まりだ。
  - speaker: tsumugi
    emotion: normal
    text: じゃあ、白の番ね。はい、ここ。
  - speaker: zundamon
    emotion: happy
    text: 何枚取られても、平気なのだ。ボクは、取る天才なのだ。
  - speaker: tsumugi
    emotion: normal
    text: ずんだもんの番よ。
  - speaker: zundamon
    emotion: thinking
    text: ……あれ？ 置けるところが、ないのだ。
  - speaker: zundamon
    emotion: surprised
    text: ……パスなのだ。
  - speaker: tsumugi
    emotion: happy
    text: 私の番ね。隅、もらうわ。
  - speaker: zundamon
    emotion: surprised
    text: また、パスなのだ！？
  - speaker: tsumugi
    emotion: happy
    text: 序盤に取りすぎると、自分の打てる場所がなくなるの。
    se: oti
  - speaker: zundamon
    emotion: sad
    text: 取れば取るほど、追い詰められるゲームだったのだ……。
  - speaker: reimu
    text: オセロ。相手の石を挟んで裏返す、8マス四方の盤のゲームです。
    reading: おせろ。あいての いしお はさんで うらがえす はちます しほうの ばんの げーむです。
  - speaker: reimu
    text: 世界の愛好者は6億人とも言われます。
    reading: せかいの あいこうしゃわ ろくおくにんとも いわれます。
  - speaker: reimu
    text: 世に送り出したのは、水戸で育った、製薬会社の営業マンでした。
    reading: よに おくりだしたのわ みとで そだった せいやく がいしゃの えいぎょう まんでした。
  - speaker: zundamon
    emotion: surprised
    text: 薬の営業マンが、オセロなのだ？
  - speaker: tsumugi
    emotion: normal
    text: 本人が語る始まりは、戦争が終わった年の、焼け跡の10分休みよ。
- id: ch0_mito
  title: ''
  background: os_mito
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 長谷川五郎は1932年、茨城県の水戸で生まれました。
    reading: はせがわ ごろうわ せんきゅうひゃく さんじゅうにねん いばらきけんの みとで うまれました。
  - speaker: reimu
    text: 父の四郎は英文学者で、旧制の水戸高校で教えていました。
    reading: ちちの しろうわ えいぶんがくしゃで きゅうせいの みと こうこうで おしえていました。
  - speaker: reimu
    text: 1945年、五郎は旧制の水戸中学に入り、囲碁に夢中になります。
    reading: せんきゅうひゃく よんじゅうごねん ごろうわ きゅうせいの みと ちゅうがくに はいり いごに むちゅうに なります。
- id: card1945
  title: ''
  background: os_card_1945
  cuts:
  - speaker: reimu
    text: 1945年8月。水戸は空襲を受け、長谷川の家も中学校も焼けました。
    reading: せんきゅうひゃく よんじゅうごねん はちがつ。みとわ くうしゅうお うけ はせがわの いえも ちゅうがっこうも やけました。
  - speaker: reimu
    text: 炎の中で家族と離れ離れになりましたが、全員が無事に再会できたといいます。
    reading: ほのおの なかで かぞくと はなればなれに なりましたが、ぜんいんが ぶじに さいかい できたと いいます。
- id: ch1_aozora
  title: 焼け跡の10分休み
  background: os_aozora
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, scale: 0.85, emotion: normal}
  - {who: doukyu, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: ここからは本人が語る話です。焼け跡の土手に黒板を1枚立てて、青空の下で授業が始まりました。
    reading: ここからわ ほんにんが かたる はなしです。やけあとの どてに こくばんお いちまい たてて、あおぞらの したで じゅぎょうが はじまりました。
  - speaker: zundamon
    emotion: sad
    text: 配給は、カボチャばかりなのだ。みんなの顔が、黄色いのだ。
  - speaker: doukyu
    emotion: happy
    text: 長谷川。碁石を持ってきたから、10分休みに囲碁をやろう。
  - speaker: zundamon
    emotion: normal
    text: いいぞ。でも、ルールは分かるのか？
  - speaker: doukyu
    emotion: thinking
    text: ……[地|じ]を囲むって、どういうことだ？
  - speaker: zundamon
    emotion: thinking
    text: 説明してたら、10分休みが終わっちゃうのだ。
  - speaker: zundamon
    emotion: happy
    text: めんどうくさい。挟んだら、取れることにするのだ！
  - speaker: doukyu
    emotion: surprised
    text: 挟んだら取るのか。それなら、すぐ分かる！
  - speaker: reimu
    text: 本人は、こうして生まれた遊びを、挟み碁と呼んでいます。
    reading: ほんにんわ こうして うまれた あそびお はさみごと よんでいます。
- id: ch1_hasamigo
  title: ''
  background: os_aozora
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 長谷川五郎, scale: 0.85, emotion: normal}
  - {who: doukyu, x: 0.52, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: doukyu
    emotion: thinking
    text: 取った石は、どうするんだ？
  - speaker: zundamon
    emotion: normal
    text: 取った石を、自分の色の石に置き換えるのだ。
  - speaker: doukyu
    emotion: thinking
    text: いちいち置き換えるのは、面倒だな。
  - speaker: zundamon
    emotion: happy
    text: なら、表と裏を白と黒に塗った紙にする。ひっくり返すだけなのだ！
  - speaker: tsumugi
    emotion: normal
    text: 石が黒と白なのは、碁石から始まったから、と本人は説明してるの。
  - speaker: zundamon
    emotion: happy
    text: 10分で1局終わる。これなら、休み時間にぴったりなのだ。
- id: ch1_m
  title: ''
  background: os_kyoushitsu
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, scale: 0.9, emotion: normal}
  - {who: m, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1948年、高校1年のとき。友人のM君が、家で大きな駒を作ってきます。
    reading: せんきゅうひゃく よんじゅうはちねん こうこう いちねんの とき。ゆうじんの えむくんが いえで おおきな こまお つくってきます。
  - speaker: m
    emotion: happy
    text: 長谷川。[挟み碁|はさみご]の駒を、作ってみたぞ。
  - speaker: zundamon
    emotion: surprised
    text: 大きくて、きれいなのだ！
  - speaker: m
    emotion: happy
    text: ボール紙で、作ったんだ。
  - speaker: zundamon
    emotion: happy
    text: この駒で打つと、もっと面白いのだ。
  - speaker: reimu
    text: 駒の直径は3.5センチ。この大きさが今の石につながった、と本人は語っています。
    reading: こまの ちょっけいわ さんてんご せんち。この おおきさが いまの いしに つながったと ほんにんわ かたっています。
- id: ch2_ryouyou
  title: 長い療養
  background: os_byouin
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, emotion: sad}
  - {who: ishi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 高校のころ、五郎は体を壊し、約6年におよぶ療養生活に入ります。
    reading: こうこうの ころ ごろうわ からだお こわし、やく ろくねんに およぶ りょうよう せいかつに はいります。
  - speaker: zundamon
    emotion: sad
    text: 先生。ボクは、いつ学校に戻れるのだ。
  - speaker: ishi
    emotion: normal
    text: 手術をすれば、半年で治る。
  - speaker: ishi
    emotion: happy
    text: でも、長い人生だ。3年や5年、なんでもない。ゆっくりやりなさい。
  - speaker: zundamon
    emotion: thinking
    text: ……ゆっくり、なのだ。
  - speaker: zundamon
    emotion: happy
    text: 新しい薬が、効いたのだ。学校に戻れるのだ！
  - speaker: reimu
    text: 水戸一高を卒業したのは、1956年とされます。
    reading: みと いちこうお そつぎょう したのわ せんきゅうひゃく ごじゅうろくねんと されます。
  - speaker: reimu
    text: この経験から、のちに医師と話せる仕事として、製薬会社の営業を選んだといいます。
    reading: この けいけんから、のちに いしと はなせる しごとと して せいやく がいしゃの えいぎょうお えらんだと いいます。
- id: ch2_daigaku
  title: ''
  background: os_bushitsu
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, emotion: happy}
  - {who: shougi, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 茨城大学に進んだ五郎は、囲碁部の主将になります。
    reading: いばらき だいがくに すすんだ ごろうわ いごぶの しゅしょうに なります。
  - speaker: shougi
    emotion: thinking
    text: 囲碁で勝負したら、囲碁部が勝つに決まってる。
  - speaker: zundamon
    emotion: normal
    text: 将棋なら、将棋部が勝つのだ。
  - speaker: shougi
    emotion: thinking
    text: じゃあ、[何|なに]で勝負するんだ。
  - speaker: zundamon
    emotion: happy
    text: これなのだ。挟んで、返すだけ。
  - speaker: shougi
    emotion: surprised
    text: ……おい、ぎりぎりの勝負になったぞ。
  - speaker: reimu
    text: 囲碁部と将棋部が、この遊びなら互角に戦えた、と本人は書いています。
    reading: いごぶと しょうぎぶが この あそびなら ごかくに たたかえたと ほんにんわ かいています。
  - speaker: reimu
    text: 五郎は茨城大学を首席で卒業し、のちに囲碁も将棋もアマチュア五段の腕前になります。
    reading: ごろうわ いばらき だいがくお しゅせきで そつぎょうし、のちに いごも しょうぎも あまちゅあ ごだんの うでまえに なります。
- id: card1964
  title: ''
  background: os_card_1964
  cuts:
  - speaker: reimu
    text: 1964年。五郎は製薬会社の営業として働いていました。
    reading: せんきゅうひゃく ろくじゅうよねん。ごろうわ せいやく がいしゃの えいぎょうと して はたらいていました。
  - speaker: reimu
    text: 働きながら、弁護士を目指して勉強もしていたといいます。
    reading: はたらきながら べんごしお めざして べんきょうも していたと いいます。
- id: ch3_futa
  title: 牛乳瓶のフタ
  background: os_yoru
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 身近な人に囲碁を教えても、なかなか長続きしなかったそうです。
    reading: みぢかな ひとに いごお おしえても なかなか ながつづき しなかったそうです。
  - speaker: zundamon
    emotion: thinking
    text: 囲碁は、覚えるのに半年かかる。
  - speaker: zundamon
    emotion: thinking
    text: 麻雀でも、2週間はかかる。
  - speaker: zundamon
    emotion: happy
    text: 挟んで返すだけなら、5分で覚えられるのだ。
  - speaker: zundamon
    emotion: thinking
    text: 駒は、どうする……。
  - speaker: zundamon
    emotion: surprised
    text: ……牛乳瓶のフタなのだ！ 丸くて、大きさもちょうどいい。
  - speaker: reimu
    text: 当時は、瓶の牛乳が家に配達された時代。紙のフタは、どこの家にもありました。
    reading: とうじわ びんの ぎゅうにゅうが いえに はいたつ された じだい。かみの ふたわ どこの いえにも ありました。
  - speaker: zundamon
    emotion: thinking
    text: 片面に、[黒い紙|くろいかみ]を貼る。1枚だと、薄くて返しにくい。
  - speaker: zundamon
    emotion: thinking
    text: 2枚。……3枚。
  - speaker: zundamon
    emotion: happy
    text: 3枚重ねると、一番返しやすいのだ！
  - speaker: reimu
    text: 8マス四方の盤と、挟んだ石は全部返すというルールも、このころに整えたそうです。
    reading: はちます しほうの ばんと はさんだ いしわ ぜんぶ かえすと いう るーるも この ころに ととのえたそうです。
- id: ch3_shain
  title: ''
  background: os_kaisha
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, emotion: happy}
  - {who: douryou, x: 0.7, emotion: surprised}
  cuts:
  - speaker: douryou
    emotion: surprised
    text: 長谷川さん。そのフタは、[何|なん]ですか？
  - speaker: zundamon
    emotion: happy
    text: 挟んで、ひっくり返すだけのゲームなのだ。1局やってみるか？
  - speaker: douryou
    emotion: happy
    text: ……面白い！ もう1回！
  - speaker: zundamon
    emotion: happy
    text: そのセット、あげるのだ。昼休みに遊んでくれ。
  - speaker: reimu
    text: 出張から戻ると、本社でも支店でも、昼休みにこの遊びが広まっていたといいます。
    reading: しゅっちょうから もどると、ほんしゃでも してんでも ひるやすみに この あそびが ひろまっていたと いいます。
  - speaker: douryou
    emotion: happy
    text: 囲碁も将棋も知らない私たちでも、夢中になれます！
  - speaker: zundamon
    emotion: surprised
    text: 日本人の半分は、女性なのだ。これは、大変なことになるのだ！
- id: ch3_byouin
  title: ''
  background: os_byouin2
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, emotion: normal}
  - {who: ikyoku, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 営業で回る病院の医局長にも、このゲームを見せました。
    reading: えいぎょうで まわる びょういんの いきょくちょうにも この げーむお みせました。
  - speaker: ikyoku
    emotion: happy
    text: 長谷川さん。このゲームには、華があるね。
  - speaker: ikyoku
    emotion: happy
    text: 患者さんのリハビリに、ぴったりだ。
  - speaker: zundamon
    emotion: happy
    text: 病院でも、遊んでもらえるのだ！
  - speaker: reimu
    text: 患者たちは、自分で飲んだ牛乳のフタを集めて、駒を作ったといいます。
    reading: かんじゃたちわ じぶんで のんだ ぎゅうにゅうの ふたお あつめて こまお つくったと いいます。
- id: card1968
  title: ''
  background: os_card_1968
  cuts:
  - speaker: reimu
    text: 1968年。五郎は交通事故にあい、目指していた弁護士の道をあきらめます。
    reading: せんきゅうひゃく ろくじゅうはちねん。ごろうわ こうつう じこに あい めざしていた べんごしの みちお あきらめます。
  - speaker: reimu
    text: その年、五郎は手作りの試作品を、水戸の実家へ持って帰ります。
    reading: その とし ごろうわ てづくりの しさくひんお みとの じっかえ もって かえります。
- id: ch4_jikka
  title: 名前はオセロ
  background: os_jikka
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 長谷川五郎, emotion: happy}
  - {who: haha, x: 0.56, emotion: happy}
  - {who: chichi, x: 0.78, emotion: thinking}
  cuts:
  - speaker: haha
    emotion: happy
    text: あら。囲碁も将棋も分からない私でも、すぐ覚えられるわ。
  - speaker: chichi
    emotion: thinking
    text: ……もう1局だ。
  - speaker: chichi
    emotion: happy
    text: 形勢がころころ変わる。波瀾万丈で、面白い。
  - speaker: zundamon
    emotion: normal
    text: 父さん。このゲームに、名前を付けてほしいのだ。
  - speaker: chichi
    emotion: thinking
    text: 黒と白が、入れ替わる……。
  - speaker: chichi
    emotion: thinking
    text: シェイクスピアの、オセロだな。
  - speaker: chichi
    emotion: happy
    text: 盤は、緑がいい。
  - speaker: zundamon
    emotion: happy
    text: オセロ……。いい名前なのだ！
  - speaker: reimu
    text: 英文学者の父が、オセロと名付けた。本人は、そう語っています。
    reading: えいぶんがくしゃの ちちが おせろと なづけた。ほんにんわ そう かたっています。
- id: ch4_meimei
  title: ''
  background: os_butai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: オセロって、いったいどんなお芝居なのだ？
  - speaker: tsumugi
    emotion: normal
    text: 黒い肌の将軍オセロと、白い肌の妻デズデモーナが出てくる悲劇よ。
