    emotion: thinking
    text: でも、隅を取れば勝ち、とまでは言えないのが奥深いところね。
  - speaker: tsumugi
    emotion: normal
    text: 序盤の決まった打ち方には、兎、虎、牛、鼠なんて名前も付いてるの。
  - speaker: zundamon
    emotion: surprised
    text: 干支みたいなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 干支にちなんだのかどうかは、はっきりしないのよね。
- id: ch9_computer
  title: ''
  background: os_computer
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 盤面の形は、多めに見積もると、10の28乗通りあるそうよ。
  - speaker: zundamon
    emotion: surprised
    text: 数えきれないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 打ち方の組み合わせで数えると、10の58乗。
  - speaker: tsumugi
    emotion: normal
    text: 囲碁は、10の360乗と言われるわ。
  - speaker: zundamon
    emotion: thinking
    text: オセロは、その中では小さいほうなのだ。
  - speaker: tsumugi
    emotion: normal
    text: だから、囲碁よりずっと早く、コンピュータが追いついたの。
  - speaker: tsumugi
    emotion: normal
    text: 1980年には、コンピュータが、世界王者から初めて1勝をあげたわ。
  - speaker: tsumugi
    emotion: normal
    text: 1997年には、コンピュータが人間の世界王者に6戦全勝したわ。
  - speaker: tsumugi
    emotion: normal
    text: チェスのコンピュータが世界王者に[勝った|かった]、3か月ほどあとのことよ。
  - speaker: tsumugi
    emotion: normal
    text: 2023年には、日本の研究者が、ある結論を計算で示したの。
  - speaker: tsumugi
    emotion: normal
    text: 両方が完璧に打ち続けると、引き分けになる。
  - speaker: zundamon
    emotion: surprised
    text: 神様どうしが打つと、引き分けなのだ！？
  - speaker: tsumugi
    emotion: thinking
    text: 発表の時点では、論文の審査の前だったけどね。
  - speaker: tsumugi
    emotion: normal
    text: 盤を小さくした6マス四方では、後手が必ず勝つことも分かってるの。
  - speaker: tsumugi
    emotion: normal
    text: 人間に、その手順は覚えきれない。勝負は、これからも続くわ。
- id: ch9_senshu
  title: ''
  background: os_senshu
  bgm: pop
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 世界選手権では、日本が強いの。2025年までの47回のうち、36回は日本人が優勝よ。
  - speaker: tsumugi
    emotion: normal
    text: 1978年の世界選手権の決勝では、16歳の日本の選手が、64対0で[勝った|かった]の。
  - speaker: zundamon
    emotion: surprised
    text: 相手の石が、1つも残らなかったのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 2017年からは、個人戦の優勝は、ずっと日本の選手よ。
  - speaker: tsumugi
    emotion: normal
    text: 最多優勝は、[為則英司|ためのりえいじ]の7回。
  - speaker: tsumugi
    emotion: normal
    text: 2018年には、11歳の小学生が、世界チャンピオンになったの。
  - speaker: zundamon
    emotion: surprised
    text: ボクより、ずっと強いのだ……。
- id: ch10_ronsou
  title: 本当に日本生まれ？
  background: os_shiryo
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: オセロは、日本で生まれたゲームなのだ？
  - speaker: tsumugi
    emotion: thinking
    text: そこは、少し注意が要るの。
  - speaker: tsumugi
    emotion: normal
    text: リバーシという、挟んで裏返すゲームが、19世紀のイギリスにあったの。
  - speaker: tsumugi
    emotion: normal
    text: 1883年には、ロンドンで、8マス四方の盤で売り出されてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 日本でも明治から、[源平碁|げんぺいご]という名前で、紅白の石で遊ばれていたの。
  - speaker: zundamon
    emotion: surprised
    text: そっくりなのだ！
  - speaker: tsumugi
    emotion: normal
    text: 五郎も1971年に、[源平碁|げんぺいご]の改良として実用新案を出願してるの。
  - speaker: tsumugi
    emotion: normal
    text: この出願は、のちに認められなかったわ。
  - speaker: tsumugi
    emotion: normal
    text: 発売のころは、兄が遊んでいた[源平碁|げんぺいご]を改良した、と語っていたそうよ。
  - speaker: tsumugi
    emotion: thinking
    text: 焼け跡で生まれた、と強く語るようになったのは、2000年ごろからなの。
  - speaker: tsumugi
    emotion: thinking
    text: 説明は時期によって変わっていて、どれが本当か、今でははっきりしないの。
  - speaker: tsumugi
    emotion: normal
    text: '1977年の本で、元世界王者の[井上博|いのうえひろし]は、また別の話を書いたの。'
  - speaker: tsumugi
    emotion: normal
    text: 最初は[8×9|ハチカケルキュウ]マスの盤で、ルールも、もっと複雑だったそうよ。
  - speaker: zundamon
    emotion: sad
    text: 始まりの話が、どんどん増えるのだ……。
  - speaker: tsumugi
    emotion: normal
    text: ツクダの部長も、似たゲームがあるのは知っていた、と振り返ってるわ。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、オセロは何が新しかったのだ？
  - speaker: tsumugi
    emotion: normal
    text: 始まりの石の置き方を、1つに決めたこと。
  - speaker: tsumugi
    emotion: normal
    text: オセロという名前と、緑の盤と、黒と白の石をそろえたこと。
  - speaker: tsumugi
    emotion: normal
    text: そして大会を開いて、世界中に広めたことね。
  - speaker: zundamon
    emotion: happy
    text: ゲームを遊ぶ場所ごと、作ったのだ。
- id: ch11_gendai
  title: 今のオセロ
  background: os_gendai
  bgm: amacha_milkyway
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: オセロは、2018年3月までに、累計で2509万個が出荷されたの。
  - speaker: tsumugi
    emotion: normal
    text: 世界オセロ連盟には、70を超える国と地域の協会が、入ってるの。
  - speaker: zundamon
    emotion: thinking
    text: スマホのリバーシも、オセロなのだ？
  - speaker: tsumugi
    emotion: normal
    text: オセロという名前は、商標なの。だから、ほかの会社はリバーシと呼ぶのよ。
  - speaker: tsumugi
    emotion: normal
    text: 石の直径は約35ミリ。牛乳瓶のフタで作った試作品と、同じ大きさよ。
  - speaker: zundamon
    emotion: happy
    text: 牛乳瓶のフタの大きさが、世界の決まりになったのだ。
  - speaker: tsumugi
    emotion: normal
    text: ツクダの部長は、親と子どもでも互角に戦えるのが、オセロのいいところだと語ってるわ。
  - speaker: tsumugi
    emotion: normal
    text: 発売日の4月29日は、オセロの誕生日として祝われてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 2023年の誕生日で、発売から50年になったの。
  - speaker: tsumugi
    emotion: thinking
    text: 部長は、3年ほどで消えていくゲームが多い、とも話してたわ。
  - speaker: zundamon
    emotion: happy
    text: 50年も続くのは、とんでもないことなのだ。
- id: shime
  title: ''
  background: os_ima2
  bgm: haru_kitchen
