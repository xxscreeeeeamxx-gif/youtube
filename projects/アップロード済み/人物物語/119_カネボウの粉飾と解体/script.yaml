scenes:
# ---- 先出し（2004年2月16日の会見） ----
- id: co_kaiken
  title: ''
  background: kn_kaiken
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 帆足隆, emotion: sad}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2004年2月16日。名門カネボウの社長、帆足隆の会見です。
    reading: にせんよねん にがつ じゅうろくにち。めいもん かねぼうの しゃちょう ほあし たかしの かいけんです。
  - speaker: zundamon
    emotion: sad
    text: 協議を重ねたが、花王と合意に達しなかった
  - speaker: kisha
    emotion: normal
    text: 経営責任は。
  - speaker: zundamon
    emotion: sad
    text: 辞めるのは簡単だが、しっかりと再生できるメドが立てば判断する
  - speaker: zundamon
    emotion: sad
    text: 再生して後輩に譲るのが経営責任
  - speaker: reimu
    text: 10日後、取締役は全員辞任を表明。1年5か月後、この社長は逮捕されます。
    reading: とおかご とりしまりやくわ ぜんいん じにんお ひょうめい。いちねん ごかげつご、この しゃちょうわ たいほ されます。
# ---- 今の部屋（お菓子の箱を数える） ----
- id: hook
  title: ''
  background: kn_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: このお菓子を全部100円で数えれば、ボクの財産は1万円なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 期限ぎりぎりのそのお菓子、20円でしか売れないわよ。
    se: hammer
  - speaker: zundamon
    emotion: normal
    text: ……売らないから、100円のままでいいのだ。
  - speaker: tsumugi
    emotion: normal
    text: そうやって売れない在庫を高く数えて、黒字に見せた名門があるの。
  - speaker: tsumugi
    emotion: thinking
    text: 化粧品を花王に渡さないと決めて、2年後に会社ごと切り分けられたわ。
  - speaker: zundamon
    emotion: surprised
    text: 化粧品を守ったのに、なんで会社ごと失ったの！？
    telops:
    - {text: "化粧品を守った名門は なぜ会社ごと失った？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
# ---- 1968年・五角形の会社 ----
- id: card1968
  title: ''
  background: kn_card_1968
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1887年創立、戦前は日本最大級の紡績の名門、鐘淵紡績。1968年、45歳の伊藤淳二が社長になります。
    reading: せんはっぴゃく はちじゅうななねん そうりつ、せんぜんわ にほん さいだいきゅうの ぼうせきの めいもん かねがふち ぼうせき。せんきゅうひゃく ろくじゅうはちねん、よんじゅうごさいの いとう じゅんじが しゃちょうに なります。
- id: ch1_gokaku
  title: 五角形の会社
  background: kn_kaigi_old
  stage:
  - {who: ito, x: 0.28, flip: true, emotion: normal}
  - {who: yakuin68, x: 0.7, emotion: normal}
  cuts:
  - speaker: ito
    emotion: normal
    text: 繊維だけでは、この先はない。
  - speaker: yakuin68
    emotion: surprised
    text: では、どうなさるんです？
  - speaker: ito
    emotion: happy
    text: 化粧品に食品、薬品に住宅。繊維と合わせて5本の柱だ。
    se: jaan
  - speaker: yakuin68
    emotion: normal
    text: 黒板の五角形は、そういうことですか。
  - speaker: yakuin68
    emotion: normal
    text: でも化粧品は、繊維に比べたらまだ小さいですよ。
  - speaker: ito
    emotion: happy
    text: だから育てる。
  - speaker: yakuin68
    emotion: thinking
    text: 繊維が赤字になったら、どうします？
  - speaker: ito
    emotion: normal
    text: 化粧品で埋める。
  - speaker: yakuin68
    emotion: normal
    text: お姉ちゃんのバイト代で、お兄ちゃんの借金を払う家ですか。
    beat: true
  - speaker: ito
    emotion: happy
    text: 家族なら、助け合うものだ。
  - speaker: reimu
    text: 36年後、産業再生機構は、この会社を事業部門間の相互もたれあいと書きます。
    reading: さんじゅうろくねんご、さんぎょう さいせい きこうわ この かいしゃお じぎょう ぶもんかんの そうご もたれあいと かきます。
    telops:
    - {text: "機構の診断「事業部門間の相互もたれあい」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: reimu
    text: 稼ぎ頭の化粧品を、手放せるのか。会社はのちに、この問いで割れます。
    reading: かせぎがしらの けしょうひんお、てばなせるのか。かいしゃわ のちに この といで われます。
# ---- 1998年・傍流の社長 ----
- id: card1998
  title: ''
  background: kn_card_1998
  cuts:
  - speaker: reimu
    text: 1998年4月。繊維の名門に、化粧品から来た社長が生まれます。
    reading: せんきゅうひゃく きゅうじゅうはちねん しがつ。せんいの めいもんに、けしょうひんから きた しゃちょうが うまれます。
- id: ch2_bouryu
  title: 傍流の社長
  background: kn_yakuin
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 帆足隆, emotion: normal}
  - {who: yakuin, x: 0.7, emotion: happy}
  cuts:
  - speaker: yakuin
    emotion: happy
    text: 大阪の化粧品の販売会社から、ついに社長ですね。
  - speaker: reimu
    text: 帆足隆、62歳。1961年に25歳で、大阪の化粧品の販売会社に入った人です。
    reading: ほあし たかし ろくじゅうにさい。せんきゅうひゃく ろくじゅういちねんに にじゅうごさいで、おおさかの けしょうひんの はんばいがいしゃに はいった ひとです。
  - speaker: yakuin
    emotion: normal
    text: 歴代の社長は、繊維の出身ばかりでしたからね。
  - speaker: yakuin
    emotion: thinking
    text: 化粧品は稼いでいても、社内じゃ傍流と言われてましたし。
  - speaker: yakuin
    emotion: normal
    text: 社長、会議のお時間です。皆さん、注目してますよ。
  - speaker: reimu
    text: このとき会社の本当の数字は、すでに2年続けて、借金が資産を上回っていました。外には出ていません。
    reading: この とき かいしゃの ほんとうの すうじわ、すでに にねん つづけて しゃっきんが しさんお うわまわって いました。そとにわ でて いません。
  - speaker: reimu
    text: この社長は、なぜ会社そのものを失うのか。始まりは、倉庫の毛布でした。
    reading: この しゃちょうわ、なぜ かいしゃ そのものお うしなうのか。はじまりわ そうこの もうふでした。
# ---- 1998〜2003年・売れない毛布 ----
- id: ch2_soko
  title: 売れない毛布
  background: kn_soko
  bgm: kinakusai
  stage:
  - {who: senpai, x: 0.28, flip: true, emotion: normal}
  - {who: shinjin, x: 0.7, emotion: normal}
  cuts:
  - speaker: senpai
    emotion: normal
    text: この毛布、どこへ行くと思う？
  - speaker: shinjin
    emotion: normal
    text: 商社に売って、お店に並ぶんですよね。
  - speaker: senpai
    emotion: normal
    text: 売れ残ったら、うちが買い取る。
  - speaker: shinjin
    emotion: surprised
    text: うちが！？
  - speaker: senpai
    emotion: normal
    text: それをまた、毛布の会社に売るんだ。
  - speaker: shinjin
    emotion: thinking
    text: じゃあ、この毛布は……
  - speaker: senpai
    emotion: sad
    text: ……また、うちに戻ってくる。
    beat: true
  - speaker: shinjin
    emotion: thinking
    text: お[金|かね]は、もらえるんですか？
  - speaker: senpai
    emotion: normal
    text: 毛布の会社に現金は無い。払いは手形だ。
  - speaker: shinjin
    emotion: normal
    text: あとで払うっていう、約束の紙ですね。
  - speaker: senpai
    emotion: sad
    text: その紙が、たまる一方なんだ。
  - speaker: shinjin
    emotion: surprised
    text: 箱も、天井まで……！？
    background: kn_soko_yama
    se: bikkuri
  - speaker: senpai
    emotion: normal
    text: ぐるぐる回るから、宇宙遊泳って呼ぶ人もいる。
  - speaker: senpai
    emotion: thinking
    text: 相手は[興洋染織|コーヨーセンショク]。うちから、役員が半分近く行ってる。
  - speaker: shinjin
    emotion: surprised
    text: それって、ほとんどうちの子会社じゃないですか。
  - speaker: senpai
    emotion: thinking
    text: ……そう見る人もいる。
  - speaker: reimu
    text: 穴埋めは、帆足が社長になった1998年から。損失は、522億円に上ります。
    reading: あなうめわ ほあしが しゃちょうに なった せんきゅうひゃく きゅうじゅうはちねんから。そんしつわ、ごひゃく にじゅうにおくえんに のぼります。
    telops:
    - {text: "毛布の会社への損失 522億円", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: 帳簿の外に出された会社は、15社。会社を失う種は、もうここにありました。
    reading: ちょうぼの そとに だされた かいしゃわ じゅうごしゃ。かいしゃお うしなう たねわ、もう ここに ありました。
# ---- 1999年・連結外し ----
- id: ch2_hazure
  title: 帳簿の外の15社
  background: kn_kaigi
  stage:
  - {who: yakuin, x: 0.28, flip: true, emotion: thinking}
  - {who: kaikeishi, x: 0.7, emotion: normal}
  cuts:
  - speaker: yakuin
    emotion: thinking
    text: 来年の3月期から、決算に入れる子会社の範囲が広がるそうだな。
  - speaker: yakuin
    emotion: thinking
    text: 毛布の会社も、うちの決算に入ってしまうのか。
  - speaker: reimu
    text: 1999年。報道によると、監査の会計士は、株を持たせる割合を示しながら具体的に助言しました。
    reading: せんきゅうひゃく きゅうじゅうきゅうねん。ほうどうに よると かんさの かいけいしわ、かぶお もたせる わりあいお しめしながら ぐたいてきに じょげん しました。
  - speaker: kaikeishi
    emotion: normal
    text: これ以上持たせるとまずい。
  - speaker: yakuin
    emotion: thinking
    text: では、この割合なら？
  - speaker: kaikeishi
    emotion: normal
    text: これだと外れませんよ。
  - speaker: reimu
    text: 毛布の会社の株は、休眠中の販売代理店に持たせ、資本のつながりを切りました。
    reading: もうふの かいしゃの かぶわ きゅうみんちゅうの はんばい だいりてんに もたせ、しほんの つながりお きりました。
  - speaker: reimu
    text: 会社はのちに、こう訂正します。毛布の会社など15社は、連結子会社とすべきであった。
    reading: かいしゃわ のちに こう ていせい します。もうふの かいしゃなど じゅうごしゃわ、れんけつ こがいしゃと すべきで あった。
    telops:
    - {text: "会社の訂正「15社は連結子会社とすべきであった」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
# ---- 2002年・数字を作る職場 ----
- id: card2002
  title: ''
  background: kn_card_2002
  bgm: serious
  cuts:
  - speaker: reimu
    text: 2002年2月。のちの新聞によると、当時の副社長はこう怒鳴りました。
    reading: にせんにねん にがつ。のちの しんぶんに よると、とうじの ふくしゃちょうわ こう どなりました。
  - speaker: reimu
    text: 「会社をつぶす気か。粉飾してでも事業計画を達成しろ」
    reading: かいしゃお つぶす きか。ふんしょく してでも じぎょう けいかくお たっせい しろ。
- id: ch3_shiten
  title: 数字を作る職場
  background: kn_oroshi
  stage:
  - {who: shitencho, x: 0.28, flip: true, emotion: angry}
  - {who: bucho, x: 0.7, emotion: thinking}
  cuts:
  - speaker: shitencho
    emotion: angry
    text: 大阪支店、今月の数字がまだ足りんぞ。
  - speaker: bucho
    emotion: thinking
    text: 本社から割り当てられた数字、ですよね。
  - speaker: shitencho
    emotion: angry
    text: そうだ。卸さんに、もっと入れてこい。
  - speaker: bucho
    emotion: thinking
    text: 先月も、押し込んだばかりですよ。
  - speaker: bucho
    emotion: thinking
    text: 卸さんの倉庫、もう入りきりません。
    se: zukko
  - speaker: shitencho
    emotion: angry
    text: やれ、お前らそれができなかったら会社潰れるぞ。
  - speaker: bucho
    emotion: sad
    text: ……出来ません。
  - speaker: shitencho
    emotion: angry
    text: 会社潰す気か。
    beat: true
  - speaker: bucho
    emotion: sad
    text: ……はい。
  - speaker: reimu
    text: 期限の近い食品は、ふだんの2割ほどでしか卸せない。それを10割で数えた、と幹部はのちに証言しています。
    reading: きげんの ちかい しょくひんわ ふだんの にわり ほどでしか おろせない。それお じゅうわりで かぞえたと、かんぶわ のちに しょうげん して います。
  - speaker: bucho
    emotion: sad
    text: 20円でしか売れないお菓子を、100円と数える……。
    telops:
    - {text: "20円のお菓子を 100円と数える", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: bucho
    emotion: sad
    text: 1万個なら、80万円の赤字が見えなくなる。
- id: ch3_kuroji
  title: ''
  background: kn_yakuin
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 帆足隆, emotion: normal}
  - {who: yakuin, x: 0.7, emotion: happy}
  cuts:
  - speaker: yakuin
    emotion: happy
    text: 社長、2003年3月期の連結は黒字です。
  - speaker: yakuin
    emotion: happy
    text: 5億1800万円で、発表します。
  - speaker: reimu
    text: この5億円の黒字は、どこから来た数字だったのか。答えは、2年後に出ます。
    reading: この ごおくえんの くろじわ、どこから きた すうじ だったのか。こたえわ にねんごに でます。
# ---- 2003年10月・花王との合意 ----
- id: card2003
  title: ''
  background: kn_card_2003
  bgm: honwaka_puppu
  cuts:
  - speaker: reimu
