meta:
  title: 「再生して後輩に譲るのが経営責任」と語ったカネボウの社長、1年5か月後に逮捕された【ずんだもん解説】
  slug: kanebo-funshoku
  hook_line: 化粧品を花王に渡さなかった名門は、なぜ2年後に会社ごと切り分けられたのか。
  summary: 2004年2月16日、名門カネボウの社長、帆足隆は会見で「再生して後輩に譲るのが経営責任」と語りました。繊維が本流の会社で、化粧品の販売会社から社長になった人です。化粧品が稼いで繊維の赤字を埋める会社、行ったり来たりする毛布、帳簿の外の15社。花王との合意はなぜ破れ、5億円の黒字はどこから来た数字だったのか。産業再生機構の資料と判決、当時の報道をもとに、会社・労組・花王それぞれの言い分を主語つきで並べて、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 産業再生機構「カネボウ株式会社及び株式会社三井住友銀行による産業再生機構活用の意向表明について」（2004年2月16日） https://www8.cao.go.jp/sangyo/ircj/ja/pdf/shien_kanebo_2004021601.pdf
  - 産業再生機構「事業再生計画の概要」（2004年3月10日） https://www8.cao.go.jp/sangyo/ircj/ja/pdf/shien_kanebo_2004031002.pdf
  - 産業再生機構「カネボウ株式会社による過年度決算の訂正発表について」（2005年4月13日） https://www8.cao.go.jp/sangyo/ircj/ja/pdf/shien_kanebo_2005041301.pdf
  - 東京証券取引所「記者会見要旨」（2005年5月12日） https://www.jpx.co.jp/files/tse/about/press/050512.pdf
  - 産業再生機構「株式会社カネボウ化粧品及びカネボウ株式会社にかかる株式及び債権の譲渡等について」（2005年12月16日） https://www8.cao.go.jp/sangyo/ircj/ja/pdf/shien_kanebo_2005121601.pdf
  - 証券取引等監視委員会「証券取引等監視委員会の活動状況」（2006年8月） https://www.fsa.go.jp/sesc/reports/n_17/n_17b.pdf
