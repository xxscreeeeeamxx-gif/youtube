    text: 稼ぎ頭だったからな。お姉ちゃんのバイト代は、本物だったんだ。
  - speaker: shinjin
    emotion: thinking
    text: 2年前は、売らないと決めたのに。
  - speaker: senpai
    emotion: sad
    text: ……2年前は、な。
    beat: true
  - speaker: reimu
    text: 2007年6月、カネボウ株式会社は株主総会で解散を決めました。創立から120年でした。
    reading: にせん ななねん ろくがつ、かねぼう かぶしきがいしゃわ かぶぬし そうかいで かいさんお きめました。そうりつから ひゃくにじゅうねんでした。
  - speaker: senpai
    emotion: normal
    text: 残った事業は、7月からクラシエという名前で出直すそうだ。
    background: kn_honsha_new
  - speaker: shinjin
    emotion: sad
    text: 看板の名前も、変わるんですね。
  - speaker: shinjin
    emotion: sad
    text: 化粧品なきカネボウは、カネボウにあらず。……そう言ってましたよね。
    se: namida
  - speaker: senpai
    emotion: sad
    text: その化粧品だけが、カネボウの名前で残ったんだ。
# ---- 論争：2人の悪人？ ----
- id: ronso1
  title: 2人だけの罪？
  background: kn_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: つむぎ、分かったのだ！ 粉飾は、社長と副社長の2人の悪だくみなのだ！
  - speaker: tsumugi
    emotion: normal
    text: 経営陣で有罪になったのは、たしかにその2人ね。どちらも執行猶予つきよ。
  - speaker: zundamon
    emotion: happy
    text: 悪い2人がいなくなって、一件落着！
  - speaker: tsumugi
    emotion: thinking
    text: でも裁かれたのは、2002年と2003年の3月期の2年分だけ。
  - speaker: zundamon
    emotion: surprised
    text: 2年分だけ！？
  - speaker: tsumugi
    emotion: normal
    text: 会社が自分で直したのは、5年分よ。
  - speaker: tsumugi
    emotion: normal
    text: 社内の調べだと、本当の連結の数字は1996年3月期から借金が資産を上回ってたの。
  - speaker: zundamon
    emotion: surprised
    text: 社長になる前からなのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 監査の会計士も、3人が有罪になってるわ。
  - speaker: zundamon
    emotion: happy
    text: じゃあ、歴代の社長みんなの罪なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: それも言い過ぎ。前の社長たちが、罪に問われたことはないの。
    beat: true
  - speaker: zundamon
    emotion: thinking
    text: どっちでも、ないのか……。
  - speaker: tsumugi
    emotion: normal
    text: 裁かれたのは2年分。帳簿の嘘は、その前から始まってた。確かなのは、そこまでね。
# ---- 論争：労組のせい？ ----
- id: ronso2
  title: 労組のせい？
  background: kn_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: じゃあ、花王に売るのを潰したのは労組なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 労組だけのせいにしないの。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: たしかに調印の日、副社長は労組の反対を理由に挙げたわ。
  - speaker: zundamon
    emotion: angry
    text: ほら、やっぱり！
  - speaker: tsumugi
    emotion: normal
    text: でも検証記事の最後で、ある関係者はこう総括してるの。
  - speaker: tsumugi
    emotion: normal
    text: '花王以外の道を望んでいたのは、従業員だけじゃない。'
  - speaker: tsumugi
    emotion: normal
    text: 取引先もOBも一部の役員さえ、そうだったの。
  - speaker: zundamon
    emotion: surprised
    text: 役員まで！？
  - speaker: tsumugi
    emotion: thinking
    text: 合意できていなかったのはカネボウの内部で、経営陣の判断の誤りだったと。
  - speaker: zundamon
    emotion: thinking
    text: 取締役会も、1日でひっくり返ってた……。
  - speaker: tsumugi
    emotion: thinking
    text: しかも社長は入院中。誰も、最後に決められなかったのね。
  - speaker: zundamon
    emotion: sad
    text: 決める人が、いなかった……。
  - speaker: tsumugi
    emotion: normal
    text: 機構が問題にしたのも五角形に広げたことより、赤字を埋め合う甘えのほうだったわ。
# ---- 本当の注意点 ----
- id: chui
  title: 黒字の決算でも
  background: kn_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: zundamon
    emotion: thinking
    text: まだあるの？
  - speaker: tsumugi
    emotion: normal
    text: 黒字と書かれた決算でも、監査つきで間違っていることがある。
  - speaker: tsumugi
    emotion: thinking
    text: 5億円の黒字は、2年後に会社自身が219億円の赤字に直したわ。
  - speaker: zundamon
    emotion: surprised
    text: 監査の人が見てたのに！？
  - speaker: tsumugi
    emotion: normal
    text: その会計士も有罪よ。株主は、11万人を超えていた。
  - speaker: tsumugi
    emotion: thinking
    text: 上場廃止で、株をお[金|かね]に換える機会も狭まったの。
  - speaker: zundamon
    emotion: sad
    text: 黒字って書いてあれば、安心だと思ってた……。
  - speaker: tsumugi
    emotion: normal
    text: 黒字の数字だけで、安心しきらないことね。
  - speaker: zundamon
    emotion: sad
    text: ボクの財産も、数え直すのだ……。
  - speaker: tsumugi
    emotion: normal
    text: お菓子100個は、本当は20円ずつで2000円。8000円の見えない赤字ね。
    se: hammer
  - speaker: tsumugi
    emotion: normal
    text: それと、今月の数字を何とかしろと言われ続ける職場は危ない合図よ。
  - speaker: tsumugi
    emotion: thinking
    text: 売れない物を押し込み始めたら、その数字はもう本当のことを言ってないの。
  - speaker: zundamon
    emotion: thinking
    text: 働いてる人は、気づいてたのだ？
  - speaker: tsumugi
    emotion: normal
    text: 当時の社員は、もうこの会社はダメだなと思ったと振り返ってるわ。
  - speaker: zundamon
    emotion: sad
    text: なのに、大事なことは新聞で知ったんだ……。
  - speaker: tsumugi
    emotion: normal
    text: 最後に。名前が同じでも、作っている会社は変わるの。
  - speaker: tsumugi
    emotion: normal
    text: 困ったときは、箱に書いてあるいまの会社に問い合わせてね。
