# kanebo-funshoku 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 帆足隆 / label: 伊藤淳二・後藤卓也・新社長・東証社長 ほか）・テロップ・章タイトルは表示専用なのでタグを付けていない。
#
# 2026-11-08 見直しで VOICEVOX の audio_query にかけた結果（kb_review.md の4章）:
# - 花王 はタグなしで カ・オ・オ（カオー）と自然に読み、抑揚も同じ。[花王|カオウ] は母音が オ・ウ になったので、
#   セリフのタグを全部外し、この台帳からも消した（花王案 もタグなし）。
# - [帆足隆|ほあしたかし]は が ホ/アシタ/カシワ と読まれたので、カタカナの [帆足隆|ホアシタカシ]は にした（ホアシ/タカシワ）。
# - [帆足|ほあし]さん が ホ/アシサン と切れたので、[帆足|ホアシ]さん にした（ホアシサン）。
# - 興洋染織 はタグなしだと キョオヨオ と誤読、ひらがな・カタカナのタグだと コウ/ヨオ… と切れたので、
#   [興洋染織|コーヨーセンショク] にした（コオヨオセンショク と1語）。
# - 伊藤淳二 は [伊藤淳二|いとうじゅんじ] で正しく読む。
# - 「なんとかしろが」が ナント/カシロガ と切れたので、本文を「何とかしろと言われ続ける」にした（ナントカ/シロト）。
# - 嶋田賢三郎・宮原・後藤卓也・鐘淵紡績・東京地検特捜部・産業再生機構 はナレと名札にしか出ない（ナレは reading: で読ませた）。
# - 中嶋章義 は読みが未確認なので名前を声に出していない（名札は「新社長」）。
# - 「金」は お[金|かね] にした（2か所）。
