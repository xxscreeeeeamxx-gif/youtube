# senba-kitcho 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 湯木佐知子 / label: 湯木貞一）・テロップ・章タイトルは表示専用なのでタグを付けていない。
#
# 2026-11-02 audio_query で確かめたこと:
# - 船場 はタグなしだとフナバ。[船場|せんば]吉兆 で センバ/キッチョオ と読む
#   （「せんばきっちょう」と全部ひらがなにすると セン/バキッ/チョウ と区切りが割れる）。
# - 吉兆 はタグなしで キッチョオ と正しく読む。ひらがな・カタカナのタグを付けると
#   キッ/チョ/ウテ のように区切りが割れるので、セリフではタグを付けず、この台帳にも入れていない。
#   ナレは reading: で きっちょう と読ませている。
# - 北新地 もタグなしで キタシンチ と正しく読み、タグを付けると キタ/シンチ と割れるので台帳に入れていない。
# - 湯木佐知子 はタグなしだと ユキサ/トモコ、湯木貞一 は ユギ/サダイチ。どちらもセリフでは使わず、
#   ナレの reading: だけで読ませている。佐知子 だけなら サチコ と読むが、念のためセリフでは全部タグにした。
# - 但馬牛 は読みを たじまうし にそろえた。ひらがなのタグだと タジマ/ウシ と割れるので、
#   セリフはカタカナのタグ [但馬牛|タジマウシ] にした（1語で読む）。
# - 3分の1 は サンプンノイチ になるので [3分の1|さんぶんのいち] にした。
# - 日本料理 は ニッポンリョオリ になるので [日本料理|にほんりょうり] にした。
# - 見送り七歩 の 七歩 は ナナホ と読む（しちほ と読む例もあるが、資料で読みを確かめられなかった。数え方の読みのまま）。
#   2026-11-02 見直しの判断1で案A（タグを付けず ナナホ のまま）に決まった。
# - 何て は [何|なん]て、何なのだ は [何|なん]なのだ にした（タグなしだと ナニナノダ）。
# - 焼き菓子 はタグを付けても ヤ/キガシ と割れたので、その行ごと消した（見直しの直す13）。
