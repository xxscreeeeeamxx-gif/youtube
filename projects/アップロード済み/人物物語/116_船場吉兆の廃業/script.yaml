scenes:
# ---- 先出し（2008年5月28日、のれんを返す会見） ----
- id: co_noren
  title: ''
  background: sk_hotel
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 湯木佐知子, emotion: sad}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2008年5月、大阪のホテル。高級料亭・船場吉兆の社長、湯木佐知子の会見です。
    reading: にせんはちねん ごがつ、おおさかの ほてる。こうきゅう りょうてい せんば きっちょうの しゃちょう、ゆき さちこの かいけんです。
  - speaker: zundamon
    emotion: sad
    text: もはや吉兆というのれんを用いて営業することは、社会的にも許されない
  - speaker: kisha
    emotion: normal
    text: のれんは……
  - speaker: zundamon
    emotion: sad
    text: 自主的に返上させていただくことにした
  - speaker: reimu
    text: 父がつくった吉兆ののれんを、娘は自分の手で返しました。社長になって、4か月あまりのことです。
    reading: ちちが つくった きっちょうの のれんお、むすめわ じぶんの てで かえしました。しゃちょうに なって よんかげつ あまりの ことです。
# ---- 今の部屋（期限の過ぎたプリン） ----
- id: hook
  title: ''
  background: sk_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ このプリン、期限を2日過ぎてるけどまだいけるのだ！
    se: jaan
  - speaker: tsumugi
    emotion: thinking
    text: それ、賞味期限じゃなくて消費期限よ。
    beat: true
  - speaker: zundamon
    emotion: normal
    text: ……どっちも期限なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: お菓子の偽りが分かって7か月。父がつくった吉兆の名前を、自分から返した一家がいるの。
    telops:
    - {text: "偽りの発覚から7か月で のれん返上", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 継いだ名前を、なんで自分から返したの！？
# ---- 1991年・のれん分け ----
- id: card1991
  title: ''
  background: sk_card_1991
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1991年。日本を代表する料亭の一つ、吉兆の創業者、湯木貞一が、店を子どもたちの家に分けます。
    reading: せんきゅうひゃく きゅうじゅういちねん。にほんお だいひょう する りょうていの ひとつ、きっちょうの そうぎょうしゃ ゆき ていいちが みせお こどもたちの いえに わけます。
- id: ch1_bunke
  title: 名前は1つ、会社は5つ
  background: sk_zashiki
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 湯木佐知子, emotion: normal}
  - {who: teiichi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 本吉兆、東京吉兆、京都吉兆、神戸吉兆。そして三女、佐知子の夫が率いる船場吉兆です。
    reading: ほんきっちょう とうきょうきっちょう きょうときっちょう こうべきっちょう。そして さんじょ さちこの おっとが ひきいる せんば きっちょうです。
  - speaker: teiichi
    emotion: happy
    text: 出迎え三歩、見送り七歩。
  - speaker: reimu
    text: 創業者のこの教えを、孫がのちに書き残しています。
    reading: そうぎょうしゃの この おしえお、まごが のちに かきのこして います。
  - speaker: reimu
    text: 看板は同じ吉兆。でも会社は別々。これが、のちに効いてきます。
    reading: かんばんわ おなじ きっちょう。でも かいしゃわ べつべつ。これが のちに きいて きます。
    telops:
    - {text: "名前は1つ　会社は5つ", size: lg, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
- id: ch1_okami
  title: ''
  background: sk_ryotei
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 湯木佐知子, emotion: happy}
  - {who: kyaku, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 佐知子が女将になったのは、24歳のとき。料理人の夫と、店を継いできました。
    reading: さちこが おかみに なったのわ にじゅうよんさいの とき。りょうりにんの おっとと みせお ついで きました。
  - speaker: kyaku
    emotion: happy
    text: '[女将|おかみ]さん、また来たで。'
  - speaker: zundamon
    emotion: happy
    text: ようこそ、おいでくださいました。
  - speaker: kyaku
    emotion: happy
    text: 相変わらず、深いお辞儀やなあ。
  - speaker: kyaku
    emotion: normal
    text: 頭を上げるまで、こっちが待ってしまうわ。
  - speaker: reimu
    text: この女将が、吉兆ののれんを自分の手で返すのは、17年後のことです。
    reading: この おかみが きっちょうの のれんお じぶんの てで かえすのわ、じゅうななねんごの ことです。
# ---- 料亭の外へ（1995〜2006年） ----
- id: ch2_soto
  title: 料亭の外へ
  background: sk_uriba
  bgm: natsuyasumi
  stage:
  - {who: tenin, x: 0.28, flip: true, emotion: happy}
  - {who: kyaku, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1995年に心斎橋。1999年には福岡へ。船場吉兆は、料亭の外へ広がります。
    reading: せんきゅうひゃく きゅうじゅうごねんに しんさいばし。せんきゅうひゃく きゅうじゅうきゅうねんにわ ふくおかえ。せんば きっちょうわ、りょうていの そとえ ひろがります。
  - speaker: tenin
    emotion: happy
    text: いらっしゃいませ。吉兆の黒豆プリン、いかがですか。
  - speaker: kyaku
    emotion: surprised
    text: 吉兆って、あの料亭の？ 百貨店で買えるの！？
    se: bikkuri
  - speaker: kyaku
    emotion: happy
    text: 料亭に行かなくても、吉兆の味か。ありがたいねえ。
  - speaker: kyaku
    emotion: happy
    text: じゃあ、そのプリンを2つもらおうか。
  - speaker: reimu
    text: 福岡の百貨店には、菓子と総菜の売場。牛肉のみそ漬けは、大阪の百貨店や東京のギフト会社へ。
    reading: ふくおかの ひゃっかてんにわ かしと そうざいの うりば。ぎゅうにくの みそづけわ、おおさかの ひゃっかてんや とうきょうの ぎふとがいしゃえ。
- id: ch2_kazoku
  title: 家族だけの取締役会
  background: sk_kaigi
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 湯木佐知子, emotion: normal}
  - {who: choonan, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 社長は佐知子の夫。取締役は佐知子と2人の息子。取締役会は、家族だけでした。
    reading: しゃちょうわ さちこの おっと。とりしまりやくわ さちこと ふたりの むすこ。とりしまりやくかいわ、かぞく だけでした。
    telops:
    - {text: "取締役会は 家族だけ", size: lg, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: reimu
    text: 大阪の料亭から遠く離れた売場まで、家族の目は届いていたのでしょうか。
    reading: おおさかの りょうていから とおく はなれた うりばまで、かぞくの めわ とどいて いたの でしょうか。
  - speaker: reimu
    text: 料亭の外へ広げた売場の一つから、すべてが始まります。
    reading: りょうていの そとえ ひろげた うりばの ひとつから、すべてが はじまります。
# ---- 2007年秋・福岡の売場 ----
- id: card2007
  title: ''
  background: sk_card_2007
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 2007年9月。のれんを返す日まで、あと8か月あまり。
    reading: にせんななねん くがつ。のれんお かえす ひまで、あと はっかげつ あまり。
  - speaker: reimu
    text: 福岡市の保健所に、匿名の電話が入ります。売場で、期限のラベルを張り替えている、と。
    reading: ふくおかしの ほけんじょに とくめいの でんわが はいります。うりばで きげんの らべるお はりかえて いると。
- id: ch3_label
  title: ラベルの下のラベル
  background: sk_uriba
  stage:
  - {who: tenin, x: 0.28, flip: true, emotion: normal}
  - {who: kakari, x: 0.7, emotion: normal}
  cuts:
  - speaker: kakari
    emotion: normal
    text: 市の者です。このプリンの、ラベルを見せてください。
  - speaker: tenin
    emotion: thinking
    text: ……はい。
  - speaker: kakari
    emotion: thinking
    text: 賞味期限のシールの上に、日付のラベルを貼ってありますね。
  - speaker: kakari
    emotion: normal
    text: でも、このプリンは消費期限で書くものですよ。
  - speaker: tenin
    emotion: surprised
    text: 消費期限？ うちは全部、賞味期限で書いてます。
  - speaker: kakari
    emotion: thinking
    text: 賞味期限とは、別のものです。
  - speaker: tenin
    emotion: surprised
    text: ……違うんですか！？
    se: gaan
  - speaker: kakari
    emotion: thinking
    text: 消費期限が4日か5日のお菓子で、17日以上過ぎたものもありますね。
  - speaker: tenin
    emotion: sad
    text: 17日……。
  - speaker: kakari
    emotion: normal
    text: 張り替えたものは、販売を自粛してください。
  - speaker: tenin
    emotion: sad
    text: ……はい。
  - speaker: reimu
    text: 10月27日、会社は売場の全商品の販売をやめました。
    reading: じゅうがつ にじゅうななにち、かいしゃわ うりばの ぜんしょうひんの はんばいお やめました。
    background: sk_uriba_kara
- id: ch3_room
  title: ''
  background: sk_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 17日も過ぎてたの！？ ボクの2日なんて、かわいいもんなのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 比べるところじゃないわ。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 2006年1月からの21か月で、期限の切れたお菓子は約2700個売られたの。
  - speaker: zundamon
    emotion: surprised
    text: 2700個！？
  - speaker: tsumugi
    emotion: normal
    text: 21か月で割ると、1日に約4個。毎日4個ずつ、期限切れが売られていた計算ね。
    telops:
    - {text: "期限切れのお菓子 1日に約4個", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: zundamon
    emotion: sad
    text: 毎日、4個も……。
  - speaker: zundamon
    emotion: thinking
    text: でもお菓子のラベルで、料亭ののれんまで返すことになるの？
  - speaker: tsumugi
    emotion: thinking
    text: このときは、まだ福岡の売場の話。ここから話は、大阪の本店にまで広がるの。
  - speaker: zundamon
    emotion: surprised
    text: 本店にまで！？
  - speaker: tsumugi
    emotion: thinking
    text: そう。料亭そのものよ。
# ---- 「パートの独断」と、パート4人の会見 ----
- id: ch4_paat
  title: パートに全責任？
  background: sk_kaiken
  bgm: kinakusai
  stage:
  - {who: paat, x: 0.28, flip: true, emotion: thinking}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 会社は、パートの独断だったと説明しました。11月14日、売場のパートの女性たちが会見を開きます。
    reading: かいしゃわ ぱーとの どくだんだったと せつめい しました。じゅういちがつ じゅうよっか、うりばの ぱーとの じょせいたちが かいけんお ひらきます。
  - speaker: kisha
    emotion: normal
    text: 期限の張り替えは、誰の判断だったんですか。
  - speaker: paat
    emotion: thinking
    text: 店長の取締役から、1か月延ばして売るよう指示されました。
  - speaker: kisha
    emotion: surprised
    text: 取締役から！？
    se: bikkuri
  - speaker: paat
    emotion: sad
    text: 全責任はパート女性にある。そう書いた報告書に、署名を求められました。
  - speaker: kisha
    emotion: surprised
    text: 署名、したんですか。
  - speaker: paat
    emotion: angry
    text: いいえ。お断りしました。
  - speaker: kisha
    emotion: normal
    text: 会社は、パートの独断だと説明していますが。
  - speaker: paat
    emotion: angry
    text: わたしたちが勝手にやったんと、違います。
  - speaker: kisha
    emotion: thinking
    text: 4人とも、同じ証言ですか。
  - speaker: paat
    emotion: normal
    text: はい。
  - speaker: reimu
    text: 店長は、佐知子の次男でした。次男の取締役は、指示していないと否定しました。
    reading: てんちょうわ さちこの じなんでした。じなんの とりしまりやくわ、しじ して いないと ひてい しました。
  - speaker: reimu
    text: この食い違いに、会社は1か月後、まったく別の答えを出します。
    reading: この くいちがいに、かいしゃわ いっかげつご まったく べつの こたえお だします。
# ---- 但馬牛の納品書と、府警の捜索 ----
- id: ch5_tajima
  title: 但馬牛の納品書
  background: sk_jimusho
  bgm: serious
  stage:
  - {who: choonan, x: 0.28, flip: true, emotion: thinking}
  - {who: nosui, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 同じころ、大阪の本店には、農林水産省の調べが入っていました。
    reading: おなじ ころ、おおさかの ほんてんにわ のうりん すいさんしょうの しらべが はいって いました。
  - speaker: nosui
    emotion: normal
    text: '[但馬牛|タジマウシ]として売った牛肉の、納品書を見せてください。'
  - speaker: nosui
    emotion: thinking
    text: ……産地の欄は、鹿児島産と佐賀産。
  - speaker: nosui
    emotion: thinking
    text: 1回40キロを、月に2回。福岡の業者からですね。
  - speaker: nosui
    emotion: angry
    text: '[但馬牛|タジマウシ]の納品書は、1枚もありませんね。'
    se: don
  - speaker: reimu
    text: 長男は調べに、品質は劣ってないのでかまわないと思った、と話したと報じられました。
    reading: ちょうなんわ しらべに、ひんしつわ おとってないので かまわないと おもったと はなしたと ほうじられました。
  - speaker: nosui
    emotion: normal
    text: 本店の表示も、確かめさせてもらいます。
  - speaker: nosui
    emotion: thinking
    text: 佐賀県産の和牛が、[但馬牛|タジマウシ]。ブロイラーが、地鶏……。
  - speaker: reimu
    text: 11月9日、農水省は本店の偽装を発表しました。
    reading: じゅういちがつ ここのか、のうすいしょうわ ほんてんの ぎそうお はっぴょう しました。
- id: ch5_sosaku
  title: ''
  background: sk_ryotei
  stage:
  - {who: kyaku, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 11月16日、大阪府警が本店など12か所を捜索しました。
    reading: じゅういちがつ じゅうろくにち、おおさかふけいが ほんてんなど じゅうにかしょお そうさく しました。
  - speaker: kyaku
    emotion: surprised
    text: 牛肉のみそ漬けの産地を、偽った疑いやて。
  - speaker: kyaku
    emotion: sad
    text: 府警が料亭に来るとはなあ。
  - speaker: reimu
