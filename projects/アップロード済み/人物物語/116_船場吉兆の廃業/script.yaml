meta:
  title: 「叱られると思います」と泣いた船場吉兆の女将、5か月後に吉兆ののれんを自分から返した【ずんだもん解説】
  slug: senba-kitcho
  hook_line: 父がつくった「吉兆」の名前を継いだ一家は、なぜ自分からその名前を返したのか。
  summary: 2007年秋、福岡の百貨店の売場で、お菓子の期限ラベルの張り替えが見つかります。売っていたのは料亭の船場吉兆。創業者・湯木貞一の三女の一家が、のれん分けで継いだ会社でした。「パートの独断」という会社の説明、パートの女性たちの反論、そして12月10日の会見。社長になった女将・湯木佐知子は、なぜその5か月後に「吉兆」ののれんを自分から返したのか。会見の言葉と、会社・パート・取締役それぞれの言い分を主語つきで並べて、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 帝国データバンク 倒産速報「株式会社船場吉兆」（2008年1月16日） https://www.tdb.co.jp/report/bankruptcy/flash/2529/
  - 日本食糧新聞「船場吉兆、改善策まとめる　経営も責任を認める　コンプライアンスの構築へ」（2008年1月7日） https://news.nissyoku.co.jp/?p=127941
  - 農林水産省「株式会社船場吉兆が販売した食肉加工品、菓子類等における不適正表示に対する措置について」（2007年11月9日・国立国会図書館WARP） https://warp.ndl.go.jp/web/20080128000000/www.maff.go.jp/j/press/syouan/kansa/071109.html
  - J-CASTニュース「船場吉兆、再建を断念し廃業」（2008年5月28日） https://www.j-cast.com/2008/05/28020679.html?p=all
  - 消費者庁「メニュー・料理等の食品表示に係る景品表示法上の考え方について」 https://www.caa.go.jp/policies/policy/representation/fair_labeling/guideline/
