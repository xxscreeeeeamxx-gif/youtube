# ---- 本当の注意点 ----
- id: chui
  title: 消費期限と賞味期限
  background: sk_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: ところで、ボクのプリン。消費期限って、[何|なん]なのだ？
  - speaker: tsumugi
    emotion: normal
    text: その前に。2007年の今年の漢字は、偽りの一字だったの。
  - speaker: tsumugi
    emotion: thinking
    text: 食品の表示の偽りが、次々に見つかった年なのよ。
  - speaker: zundamon
    emotion: surprised
    text: 漢字1字に、なっちゃったのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 消費期限は、決められた方法で保存したとき安全に食べられる期限。
  - speaker: tsumugi
    emotion: normal
    text: 賞味期限は、おいしく食べられる目安の期限よ。
  - speaker: zundamon
    emotion: surprised
    text: 安全と、おいしさ！？ 全然ちがうのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 福岡の売場は、この違いを知らないまま全部を賞味期限と書いていたの。
  - speaker: zundamon
    emotion: thinking
    text: ボクと同じなのだ……。
  - speaker: tsumugi
    emotion: normal
    text: どちらも開けていない状態で、書かれた保存方法を守ったときの期限よ。
  - speaker: tsumugi
    emotion: normal
    text: お弁当や生菓子の消費期限は、過ぎたら食べない。
    telops:
    - {text: "消費期限＝安全　賞味期限＝おいしさ", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: スナック菓子や缶詰の賞味期限は、おいしさの目安ね。
  - speaker: tsumugi
    emotion: thinking
    text: 書いてあるのは、開ける前の期限。開けたら、早めに食べるのよ。
  - speaker: zundamon
    emotion: sad
    text: ……ボクのプリン、消費期限って書いてあるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: だから言ったでしょ。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: もう一つ。[船場|せんば]吉兆の牛肉は、売り物のみそ漬けの表示で疑いをかけられたの。
  - speaker: tsumugi
    emotion: normal
    text: お店の料理のメニューの表示も、景品表示法という法律で見られているわ。
  - speaker: tsumugi
    emotion: normal
    text: メニューの産地に疑問があったら、お店に聞いていいの。
  - speaker: zundamon
    emotion: thinking
    text: 聞いて、答えられないお店は？
  - speaker: tsumugi
    emotion: normal
    text: 少し気をつける、くらいでいいと思うわ。
