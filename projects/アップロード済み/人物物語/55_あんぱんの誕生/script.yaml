  - speaker: tsumugi
    emotion: normal
    text: パンのイーストと同じ仕組み。違うのは、麹の香りと、しっとりした食感ね。
  - speaker: zundamon
    emotion: thinking
    text: お酒の種なら、食べたら酔っぱらうのだ？
  - speaker: tsumugi
    emotion: normal
    text: 焼けば、アルコールはほとんど飛ぶわ。
  - speaker: zundamon
    emotion: happy
    text: 安心なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 木村屋は今も、10日あまりかけて、[酒種|さかだね]のパンを作ってるそうよ。
  - speaker: zundamon
    emotion: surprised
