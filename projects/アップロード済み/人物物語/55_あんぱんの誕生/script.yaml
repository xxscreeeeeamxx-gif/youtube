scenes:
- id: hook
  title: ''
  background: an_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、張り込みごっこなのだ。窓の外の、あやしい[鳩|はと]を見張るのだ。
  - speaker: tsumugi
    emotion: thinking
    text: '[鳩|はと]の何が、あやしいのよ。'
  - speaker: zundamon
    emotion: normal
    text: ずっと、こっちを見てるのだ。
  - speaker: zundamon
    emotion: normal
    text: 張り込みといえば、これだ。つぶあんぱんと、牛乳。
  - speaker: tsumugi
    emotion: thinking
    text: 昨日もあんぱんだったじゃない。
  - speaker: zundamon
    emotion: happy
    text: 昨日はこしあん、今日はつぶあん。別の食べ物なのだ。
  - speaker: tsumugi
    emotion: angry
    text: 同じあんぱんよ。
  - speaker: zundamon
    emotion: happy
    text: それに、中身はあんこ。つまり実質、和菓子。健康的な和食なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 外側は、どう見てもパンでしょ。
  - speaker: tsumugi
    emotion: normal
    text: ちなみに本物の刑事さんは、張り込みで牛乳はあまり飲まないらしいわよ。
  - speaker: zundamon
    emotion: surprised
    text: そうなのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 夏の車の中だと、傷んじゃうからだって。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、あんぱんも作り話か？
  - speaker: tsumugi
    emotion: normal
    text: あんぱんは、本当に食べるそうよ。においも、パンくずも少ないから。
  - speaker: zundamon
    emotion: happy
    text: よかった。……でも、毎日あんぱんは、さすがに反省するのだ。
  - speaker: zundamon
    emotion: happy
    text: 明日からは、酒まんじゅうにするぞ！
  - speaker: tsumugi
    emotion: happy
    text: 中身は、同じあんこよ。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: しかも酒まんじゅうは、あんぱんのご先祖様みたいなものなの。
  - speaker: zundamon
    emotion: surprised
    text: ご先祖様なのだ！？
  - speaker: reimu
    text: あんぱん。パンの生地であんこを包んで焼いた食べ物です。
    reading: あんぱん。ぱんの きじで あんこお つつんで やいた たべものです。
  - speaker: reimu
    text: 作ったのは、50歳を過ぎて勤め先を失った男と、その息子でした。
    reading: つくったのわ ごじゅっさいお すぎて つとめさきお うしなった おとこと そのむすこでした。
  - speaker: zundamon
    emotion: surprised
    text: 勤め先を失った男？
  - speaker: tsumugi
    emotion: normal
    text: 硬いパンは売れず、店は1年もたたずに火事。
  - speaker: tsumugi
    emotion: normal
    text: それを救ったのが、酒まんじゅうの種なの。
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、茨城の田んぼよ。
- id: ch0_mura
  title: ''
  background: an_mura
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 木村安兵衛, emotion: sad}
  - {who: bun, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 木村安兵衛は1817年、今の茨城県牛久市の農家に、次男として生まれました。
    reading: きむら やすべえわ せんはっぴゃく じゅうななねん、いまの いばらきけん うしくしの のうかに じなんと して うまれました。
  - speaker: reimu
    text: 22歳のころ、近くの村の木村家に婿に入り、妻の文と暮らします。
    reading: にじゅうにさいの ころ ちかくの むらの きむらけに むこに はいり、つまの ぶんと くらします。
  - speaker: bun
    emotion: thinking
    text: また、川があふれたわね。
  - speaker: zundamon
    emotion: sad
    text: 田んぼが、また水の底だ。
  - speaker: bun
    emotion: sad
    text: 今年の[お米|おこめ]も、だめかしら。
  - speaker: reimu
    text: 小貝川の水害が続き、安兵衛は、農業に見切りをつけたといいます。
    reading: こかいがわの すいがいが つづき、やすべえわ のうぎょうに みきりお つけたと いいます。
  - speaker: zundamon
    emotion: thinking
    text: ……文。江戸へ、出てみようと思う。
  - speaker: bun
    emotion: surprised
    text: 江戸へ？
  - speaker: zundamon
    emotion: normal
    text: 江戸には、親戚がいる。ここよりは、仕事があるはずだ。
  - speaker: reimu
    text: 幕末、一家は江戸に出ます。
    reading: ばくまつ いっかわ えどに でます。
  - speaker: reimu
    text: 安兵衛は、屋敷の米蔵の番をしていたとされます。仕えた藩は、資料によって分かれます。
    reading: やすべえわ やしきの こめぐらの ばんお していたと されます。つかえた はんわ しりょうに よって わかれます。
- id: card1868
  title: ''
  background: an_card_1868
  cuts:
  - speaker: reimu
    text: 1868年。戦に敗れた幕府が倒れ、明治が始まります。
    reading: せんはっぴゃく ろくじゅうはちねん。いくさに やぶれた ばくふが たおれ めいじが はじまります。
- id: ch1_shitsugyou
  title: 50過ぎの失業
  background: an_yashiki
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 木村安兵衛, emotion: sad}
  - {who: eizaburou, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 幕府が倒れ、50歳を過ぎた安兵衛は勤め先を失ったとされます。
    reading: ばくふが たおれ ごじゅっさいお すぎた やすべえわ つとめさきお うしなったと されます。
  - speaker: eizaburou
    emotion: thinking
    text: 父さん。お屋敷の[米蔵|こめぐら]、明日から閉めるそうです。
  - speaker: zundamon
    emotion: sad
    text: ……知ってる。ボクの勤めも、今日で終わりなのだ。
  - speaker: eizaburou
    emotion: thinking
    text: これから、どうするんですか。
  - speaker: zundamon
    emotion: sad
    text: 51にもなって、一からやり直しなのだ……。
  - speaker: eizaburou
    emotion: normal
    text: 父さん。刀の世の中は、もう終わりですよ。
  - speaker: zundamon
    emotion: surprised
    text: '[英三郎|えいざぶろう]は、あっさり言うな。'
  - speaker: eizaburou
    emotion: happy
    text: 横浜の、外国人の町を見てきました。あっちは、もう別の国みたいです。
  - speaker: reimu
    text: 息子の英三郎は、横浜の外国人居留地によく通っていたといいます。
    reading: むすこの えいざぶろうわ よこはまの がいこくじん きょりゅうちに よく かよっていたと いいます。
- id: ch1_ie
  title: ''
  background: an_ie
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 木村安兵衛, emotion: sad}
  - {who: bun, x: 0.7, emotion: thinking}
  cuts:
  - speaker: bun
    emotion: thinking
    text: お帰りなさい。……顔色が、悪いわね。
  - speaker: zundamon
    emotion: sad
    text: 文。勤めが、なくなった。
  - speaker: bun
    emotion: thinking
    text: ……そう。
  - speaker: zundamon
    emotion: sad
    text: また、一からだ。すまないのだ。
  - speaker: bun
    emotion: normal
    text: 謝らないで。田んぼを捨てたときも、一からだったじゃない。
  - speaker: bun
    emotion: happy
    text: それに、うちには少しだけ、蓄えがあるの。
  - speaker: zundamon
    emotion: surprised
    text: 蓄え？
  - speaker: bun
    emotion: happy
    text: いつか、使うときのためよ。
- id: ch2_jusanjo
  title: ''
  background: an_jusanjo
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 木村安兵衛, emotion: normal}
  - {who: umekichi, x: 0.52, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 安兵衛は親戚を頼り、東京の職業授産所で、事務の仕事に就きます。
    reading: やすべえわ しんせきお たより、とうきょうの しょくぎょう じゅさんじょで じむの しごとに つきます。
  - speaker: tsumugi
    emotion: normal
    text: '[授産所|じゅさんじょ]は、仕事をなくした人に、新しい仕事を教える所よ。'
  - speaker: reimu
    text: そこで出会ったのが、長崎出身のパン職人、梅吉でした。
    reading: そこで であったのが ながさき しゅっしんの ぱん しょくにん うめきちでした。
  - speaker: umekichi
    emotion: happy
    text: 安兵衛さん。これが、パンってもんです。
  - speaker: zundamon
    emotion: surprised
    text: ……かたいのだ。石みたいだぞ。
  - speaker: umekichi
    emotion: normal
    text: 西洋のパンは、こういうもんです。外国の人は、これを毎日食べてる。
  - speaker: zundamon
    emotion: thinking
    text: どうやって、ふくらませるのだ？
  - speaker: umekichi
    emotion: normal
    text: パン種ってのを生地に混ぜて、寝かせるんです。
  - speaker: tsumugi
    emotion: normal
    text: パン種は、パンをふくらませる酵母を育てた、種のことよ。
  - speaker: tsumugi
    emotion: normal
    text: このころのパンは、日本では珍しい外国の食べ物。
  - speaker: tsumugi
    emotion: normal
    text: 横浜には、1862年から外国人のパン屋があったの。
  - speaker: zundamon
    emotion: thinking
    text: 日本人は、食べないの？
  - speaker: tsumugi
    emotion: normal
    text: 食パンの白い中身だけ食べて、皮は捨てた人もいたそうよ。
  - speaker: zundamon
    emotion: surprised
    text: もったいないのだ。
  - speaker: tsumugi
    emotion: normal
    text: パン祖と呼ばれるのは、伊豆の代官、江川太郎左衛門よ。
  - speaker: tsumugi
    emotion: normal
    text: 1842年、戦のときの保存食として焼いたの。
  - speaker: tsumugi
    emotion: normal
    text: 4月12日のパンの日は、これにちなんでるわ。
  - speaker: zundamon
    emotion: thinking
    text: パンは、兵隊の食べ物なのか。
  - speaker: umekichi
    emotion: happy
    text: 長崎の生まれでしてね。パンは、向こうで覚えました。
  - speaker: zundamon
    emotion: happy
    text: 梅吉さんは、長崎仕込みなのだ。
- id: ch2_teian
  title: ''
  background: an_jusanjo
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 木村安兵衛, emotion: normal}
  - {who: shigeyoshi, x: 0.56, emotion: normal}
  - {who: eizaburou, x: 0.78, emotion: happy}
  cuts:
  - speaker: shigeyoshi
    emotion: normal
    text: 安兵衛。あの梅吉を使って、パン屋を開いてみてはどうだ。
  - speaker: zundamon
    emotion: surprised
    text: パン屋！？ 51のボクが？
  - speaker: eizaburou
    emotion: happy
    text: やりましょう、父さん。横浜じゃ、パンはもう珍しくありません。
  - speaker: zundamon
    emotion: thinking
    text: 刀の世が終わったなら、しがみついても仕方ない。
  - speaker: zundamon
    emotion: happy
    text: ……やるぞ。パン屋を開くのだ！
  - speaker: reimu
    text: 親戚の勧めに英三郎がすぐ乗り、安兵衛もうなずいたと伝えられています。
    reading: しんせきの すすめに えいざぶろうが すぐ のり、やすべえも うなずいたと つたえられています。
- id: card1869
  title: ''
  background: an_card_1869
  cuts:
  - speaker: reimu
    text: 1869年。東京の芝、今の新橋駅の近くに、小さなパン屋が開きます。
    reading: せんはっぴゃく ろくじゅうくねん。とうきょうの しば いまの しんばしえきの ちかくに ちいさな ぱんやが ひらきます。
- id: ch3_bunei
  title: 文英堂
  background: an_bunei
  bgm: pop
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 木村安兵衛, emotion: happy}
  - {who: bun, x: 0.64, emotion: happy}
  - {who: eizaburou, x: 0.84, emotion: happy}
  cuts:
  - speaker: eizaburou
    emotion: happy
    text: 窯に火が入りました。梅吉さんが、最初のパンを焼いてます。
  - speaker: bun
    emotion: thinking
    text: お客さん、来てくれるかしら。
  - speaker: bun
    emotion: happy
    text: お店の名前は、決めたの？
  - speaker: zundamon
    emotion: happy
    text: 店の名は文英堂。文の「文」と、[英三郎|えいざぶろう]の「英」だ。
  - speaker: bun
    emotion: happy
    text: あら。わたしの名前も、入ってるのね。
  - speaker: eizaburou
    emotion: happy
    text: 母さんのお金で、開いた店ですからね。
  - speaker: reimu
    text: 店の名は妻の文と英三郎から取り、開業の資金は文の蓄えだったといいます。
    reading: みせの なわ つまの ぶんと えいざぶろうから とり、かいぎょうの しきんわ ぶんの たくわえだったと いいます。
- id: ch3_kyaku
  title: ''
  background: an_bunei
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 木村安兵衛, emotion: happy}
  - {who: kyaku, x: 0.7, emotion: surprised}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: いらっしゃい。西洋のパンだ！
  - speaker: kyaku
    emotion: surprised
    text: これがパンかい。……かたい。
  - speaker: kyaku
    emotion: thinking
    text: それに、少しすっぱいな。
  - speaker: kyaku
    emotion: thinking
    text: 悪いが、お茶うけにはならんね。
  - speaker: zundamon
    emotion: sad
    text: ……売れないのだ。
  - speaker: reimu
    text: 西洋の硬いパンは日本人の口に合わず、なかなか売れませんでした。
    reading: せいようの かたい ぱんわ にほんじんの くちに あわず、なかなか うれませんでした。
  - speaker: zundamon
    emotion: thinking
    text: ……甘くしたら、どうなのだ？ 砂糖を入れてみるぞ。
  - speaker: reimu
    text: 砂糖を入れたらよかろう。家に伝わる話では、これが菓子パンの始まりとされます。
    reading: さとうお いれたら よかろう。いえに つたわる はなしでわ これが かしぱんの はじまりと されます。
  - speaker: kyaku
    emotion: happy
    text: 甘いと、ずいぶん食べやすいな。
  - speaker: zundamon
    emotion: happy
    text: 砂糖は、正義なのだ。
- id: ch3_umi
  title: ''
  background: an_umi
  bgm: 223am
  stage:
  - {who: eizaburou, x: 0.24, flip: true, emotion: thinking}
  - {who: umekichi, x: 0.52, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: thinking}
  cuts:
  - speaker: eizaburou
    emotion: thinking
    text: 梅吉さん。今日のパンも、店には出せません。
  - speaker: umekichi
    emotion: surprised
    text: また焼き直しですかい。
  - speaker: eizaburou
    emotion: thinking
    text: 横浜で食べたパンは、もっと軽かった。
  - speaker: umekichi
    emotion: sad
    text: 若旦那は、目が高すぎますよ。
  - speaker: reimu
    text: 英三郎は、気に入らないパンを店に出さず、芝浦の海に投げ込んだとも伝えられています。
    reading: えいざぶろうわ きに いらない ぱんお みせに ださず、しばうらの うみに なげこんだとも つたえられています。
  - speaker: tsumugi
    emotion: angry
    text: 売れない店が、パンを海に捨てる余裕あるの？
  - speaker: tsumugi
    emotion: thinking
    text: それだけ、本物の味にこだわってたのね。
- id: ch3_kaji
  title: ''
  background: an_kaji
  bgm: serious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 木村安兵衛, emotion: sad}
  - {who: eizaburou, x: 0.56, emotion: sad}
  - {who: bun, x: 0.78, emotion: sad}
  cuts:
  - speaker: reimu
    text: 開業から1年もたたずに、店は火事で焼けてしまいます。
    reading: かいぎょうから いちねんも たたずに みせわ かじで やけて しまいます。
  - speaker: reimu
    text: 焼け跡には、石の窯だけが残ったといいます。
    reading: やけあとにわ いしの かまだけが のこったと いいます。
  - speaker: zundamon
    emotion: sad
    text: ……窯だけ、残った。
  - speaker: eizaburou
    emotion: thinking
    text: 窯があれば、パンは焼けます。
  - speaker: bun
    emotion: thinking
    text: お店も、一から建て直しね。
  - speaker: zundamon
    emotion: thinking
    text: ……一からは、慣れてるのだ。
  - speaker: zundamon
    emotion: normal
    text: 窯が残ったなら、まだやれる。
  - speaker: reimu
    text: 1870年、一家は銀座に移り、店を木村屋と改めます。
    reading: せんはっぴゃく ななじゅうねん いっかわ ぎんざに うつり みせお きむらやと あらためます。
- id: ch4_kisha
  title: 汽車とパン
  background: an_eki
  bgm: pop
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 木村安兵衛, emotion: happy}
  - {who: kyaku, x: 0.62, emotion: happy}
  - {who: tsumugi, x: 0.84, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1872年、新橋と横浜の間に鉄道が開通します。木村屋は、駅の中に売店を出しました。
    reading: せんはっぴゃく ななじゅうにねん しんばしと よこはまの あいだに てつどうが かいつう します。きむらやわ えきの なかに ばいてんお だしました。
  - speaker: kyaku
    emotion: happy
    text: パンを1つくれ。汽車の中で食べるんだ。
  - speaker: zundamon
    emotion: happy
    text: 毎度あり！
  - speaker: kyaku
    emotion: normal
    text: パンは、かっけに効くって聞いたぞ。
  - speaker: zundamon
    emotion: thinking
    text: かっけ？
  - speaker: tsumugi
    emotion: normal
    text: 脚気は、白い[お米|おこめ]ばかりの食事で起こりやすい病気。
  - speaker: tsumugi
    emotion: thinking
    text: このころは、まだ原因が分かっていなかったの。
  - speaker: reimu
    text: パンは脚気に効くという評判でも、売れたといいます。
    reading: ぱんわ かっけに きくと いう ひょうばんでも うれたと いいます。
  - speaker: reimu
    text: 同じ1872年には、海軍を目指す生徒の学校、攻玉社にもパンを納めています。
    reading: おなじ せんはっぴゃく ななじゅうにねんにわ かいぐんお めざす せいとの がっこう、こうぎょくしゃにも ぱんお おさめています。
  - speaker: zundamon
    emotion: happy
    text: パンが、薬の代わりなのだ。
- id: ch5_tane
  title: 酒の種
  background: an_kobo
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 木村安兵衛, emotion: thinking}
  - {who: eizaburou, x: 0.56, emotion: thinking}
  - {who: tsumugi, x: 0.84, emotion: normal}
  cuts:
  - speaker: eizaburou
    emotion: thinking
    text: 父さん。パンをふくらませる種が、うまくいきません。
  - speaker: zundamon
    emotion: thinking
    text: 西洋のパンは、[何|なに]でふくらませてる？
  - speaker: eizaburou
    emotion: thinking
    text: ホップという草で起こした[種|たね]です。でも、日本人には、なかなか手に入らない。
  - speaker: reimu
    text: 当時の西洋のパンに使うホップは、手に入りにくかったとされます。
    reading: とうじの せいようの ぱんに つかう ほっぷわ てに はいりにくかったと されます。
  - speaker: tsumugi
    emotion: normal
    text: ホップの種は苦みがあって、日本人にはなじみのない味だったとも言われるわ。
  - speaker: zundamon
    emotion: thinking
    text: 日本にあるもので、ふくらませられないのか。
  - speaker: zundamon
    emotion: surprised
    text: ……酒まんじゅうなのだ！ あれは、[米|こめ]と麹の種で、ふっくらしてる。
  - speaker: eizaburou
    emotion: surprised
    text: 酒の種……。[米|こめ]と麹と水なら、どこにでもある。
  - speaker: reimu
    text: 米と麹と水で作る酒種。酒まんじゅうが、ヒントになったとされています。
    reading: こめと こうじと みずで つくる さかだね。さけまんじゅうが ひんとに なったと されています。
  - speaker: eizaburou
    emotion: sad
    text: ……だめだ。甘酒くらいの種じゃ、砂糖の多い生地はふくらまない。
  - speaker: eizaburou
    emotion: sad
    text: 何度焼いても、酸っぱくなるか、固くなるか……。
  - speaker: zundamon
    emotion: thinking
    text: 何年かかっても、いい。もっと強い種が、要るな。
  - speaker: eizaburou
    emotion: normal
    text: 酒蔵の、もろみを分けてもらいます。
  - speaker: reimu
    text: 英三郎は、酒造りのもろみを使って、強い酒種を作ったとも伝えられています。
    reading: えいざぶろうわ さけづくりの もろみお つかって、つよい さかだねお つくったとも つたえられています。
  - speaker: reimu
    text: 古い記録は、英三郎の多年の苦心の結果と伝えています。
    reading: ふるい きろくわ えいざぶろうの たねんの くしんの けっかと つたえています。
- id: ch5_shikumi
  title: ''
  background: an_zukai
  bgm: curious
