  - speaker: tsumugi
    emotion: normal
    text: まず、麹の力で、[お米|おこめ]のでんぷんが糖に変わるの。
  - speaker: tsumugi
    emotion: normal
    text: その糖を酵母が食べて、アルコールと炭酸ガスを出す。
  - speaker: zundamon
    emotion: happy
    text: ガスの泡で、生地がふくらむ！
  - speaker: zundamon
    emotion: happy
    text: パン生地の中で、酵母が宴会してるのだ。
  - speaker: tsumugi
    emotion: thinking
