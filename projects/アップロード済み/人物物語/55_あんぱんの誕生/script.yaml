meta:
  title: 【あんぱんの誕生】50過ぎで職を失った男が、酒まんじゅうの種でパンを焼いた【ずんだもん解説】
  slug: kimuraya-anpan
  summary: コンビニでも100円台で買えるあんぱん。明治のはじめ、パンは硬くて酸っぱい外国の食べ物でした。勤め先を失った50過ぎの男と、その息子は、なぜパン屋を開いたのか。売れない硬いパン、火事、手に入らないパンの種。二人がたどり着いたのは、酒まんじゅうの種でした。明治天皇への献上と、へその桜の由来まで。
  tags:
  - あんぱん
  - 木村屋
  - 木村安兵衛
  - 酒種
  - 菓子パン
  - 明治
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  thumbnail:
    top: まんじゅうの種で焼いた
    bottom: あんぱんの誕生
  mode: drama
  narrator: reimu
  mobs:
