  - speaker: zundamon
    emotion: normal
    text: '[鉄舟|てっしゅう]さんの字だけは、いつ見ても元気だ。'
  - speaker: bun
    emotion: thinking
    text: '[鉄舟|てっしゅう]さんも[英三郎|えいざぶろう]も、先に行ってしまったわね。'
  - speaker: zundamon
    emotion: normal
