meta:
  title: 【あんぱんの誕生】タダでも売れないパンが、天皇の茶菓子になるまで【ずんだもん解説】
  slug: kimuraya-anpan-v2
  summary: コンビニでも見かける、あんぱん。明治のはじめ、東京のパンは硬くて酸っぱい外国の食べ物でした。50歳を過ぎて勤めを失った木村安兵衛は、妻の蓄えで小さなパン屋を開きます。ところがパンは売れず、声をからして町を売り歩いても買い手はつきません。息子の英三郎とたどり着いた答えは、意外にも和菓子の中にありました。山岡鉄舟や明治天皇も登場する、あんぱん誕生までの物語を再現ドラマでたどります。
  tags:
  - あんぱん
  - 木村屋
  - 木村安兵衛
  - 酒種
  - 菓子パン
  - 明治
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  thumbnail:
    top: 天皇の茶菓子に
    bottom: あんぱんの誕生
  mode: drama
  narrator: reimu
