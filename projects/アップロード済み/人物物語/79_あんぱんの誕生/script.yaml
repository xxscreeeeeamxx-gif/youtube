  - speaker: tsumugi
    emotion: normal
    text: 種師という職人さんたちが、150年以上その種を受け継いでるの。
  - speaker: tsumugi
    emotion: normal
    text: 温度が1度違うだけで、香りもふくらみも変わるって職人さんは話してるわ。
  - speaker: zundamon
    emotion: thinking
