  - speaker: tsumugi
    emotion: normal
    text: 会社の公式の歴史では、親子で考えたことになってるわ。
  - speaker: tsumugi
    emotion: normal
    text: でも会社の歴史のページは、あんぱんの発明を[英三郎|えいざぶろう]さんの所に書いてるの。
  - speaker: zundamon
    emotion: surprised
    text: 息子のほうが、主役だったの！？
  - speaker: tsumugi
    emotion: normal
    text: '[酒種|さかだね]を何年もかけて仕上げたのは、[英三郎|えいざぶろう]さんだもの。'
  - speaker: zundamon
    emotion: sad
    text: せんべいだって、からかってごめんなのだ。
  - speaker: tsumugi
    emotion: thinking
    text: '[安兵衛|やすべえ]さんがせんべいって言ったかは、記録に無いのよ。'
    se: zukko
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、あんぱんの元祖は木村屋で決まり？
  - speaker: tsumugi
    emotion: normal
    text: あんこをパンで包んで焼いたのは、1874年の木村屋が最初よ。
  - speaker: tsumugi
    emotion: normal
    text: ただ[米|こめ]と麹の種でふくらませて、あんを包む技は酒まんじゅうにあったもの。
  - speaker: zundamon
    emotion: happy
    text: '[蒸す|むす]か焼くかの違い、なんだね。'
  - speaker: tsumugi
    emotion: normal
    text: それに、日本で最初のパン屋でもないの。
  - speaker: tsumugi
    emotion: normal
    text: 横浜には、1862年から外国人のパン屋があったから。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ木村屋は、何が最初なの？
  - speaker: tsumugi
    emotion: normal
    text: 日本人を相手にしたパン屋として、茨城県の資料は初めての店と書いてるわ。
  - speaker: zundamon
    emotion: thinking
    text: あんぱんの誕生日を、1875年って書いてるサイトも見たのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 献上の年と、混ざったのね。発売は1874年、献上が1875年よ。
  - speaker: zundamon
    emotion: happy
    text: じゃあ、へそパンの誕生日は1875年なのだ。
