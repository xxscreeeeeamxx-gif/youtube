- id: ch8_hesopan
  title: 銀座名物へそパン
  background: an_mise_kanban
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 木村安兵衛, emotion: happy}
  - {who: kyaku, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1877年。陸軍がパンを採り入れ、木村屋は西南戦争の兵のパンも焼きました。
    reading: せんはっぴゃく ななじゅうななねん。りくぐんが ぱんお とりいれ、きむらやわ せいなん せんそうの へいの ぱんも やきました。
  - speaker: kyaku
    emotion: happy
    text: おう、旦那。銀座名物の、へそパンを5つくれ！
  - speaker: zundamon
    emotion: thinking
    text: へそパン、ですか。
  - speaker: kyaku
    emotion: happy
    text: 真ん中に桜のへそがある、あれよ。みんな、そう呼んでるぜ。
  - speaker: zundamon
    emotion: sad
    text: 陛下にお出しした、桜のあんぱんなのですが……。
  - speaker: kyaku
    emotion: happy
    text: 陛下の食ったへそパンだろ？ ありがてえこった。
    se: manuke
  - speaker: zundamon
    emotion: thinking
    text: ……へその名前のほうが、よく売れるのだ。
  - speaker: kyaku
    emotion: normal
    text: 石の店のころから[通って|かよって]んだ。名前ぐらい、好きに呼ばせな。
  - speaker: zundamon
    emotion: thinking
    text: ……石のころは、薬のつもりで1つきりでしたけど。
    beat: true
  - speaker: reimu
    text: 桜のあんぱんは、へそパンと呼ばれて評判になりました。値段は1個1銭でした。
    reading: さくらの あんぱんわ、へそぱんと よばれて ひょうばんに なりました。ねだんわ いっこ いっせんでした。
    telops:
    - {text: 銀座名物へそパン, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
- id: ch8_hiromeya
  title: ''
  background: an_ginza
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 木村安兵衛, emotion: happy}
  - {who: senden, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1885年。木村屋は、楽隊を連れて町を練り歩く宣伝をいち早く使いました。
    reading: せんはっぴゃく はちじゅうごねん。きむらやわ、がくたいお つれて まちお ねりあるく せんでんお いちはやく つかいました。
  - speaker: senden
    emotion: happy
    text: 木村屋のパン、パンだよ！ 銀座名物、へそパンだよ！
  - speaker: zundamon
    emotion: surprised
    text: へそパンとは言わないでくれと、頼んだのに。
  - speaker: senden
    emotion: happy
    text: 旦那。へそと言ったほうが、客が振り向くんでさあ。
  - speaker: zundamon
    emotion: thinking
    text: ……振り向くなら、仕方ない。
  - speaker: senden
    emotion: happy
    text: それより旦那。今度は木村屋が、芝居になるってよ！
  - speaker: zundamon
    emotion: surprised
    text: パン屋が、歌舞伎になるのか！？
  - speaker: reimu
    text: 1887年の正月には、木村屋のパンが歌舞伎の舞台にまで登場しました。
    reading: せんはっぴゃく はちじゅうななねんの しょうがつにわ、きむらやの ぱんが かぶきの ぶたいにまで とうじょう しました。
  - speaker: reimu
    text: このころ儀四郎は家を出たきり、便りをよこさなくなります。
    reading: この ころ ぎしろうわ いえお でたきり、たよりお よこさなく なります。
- id: card1887
  title: ''
  background: an_card_1887
  cuts:
  - speaker: reimu
    text: 1887年5月。英三郎が、36歳の若さで亡くなります。
    reading: せんはっぴゃく はちじゅうななねん ごがつ。えいざぶろうが、さんじゅうろくさいの わかさで なくなります。
- id: ch9_wakare
