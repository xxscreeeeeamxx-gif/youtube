    reading: せんきゅうひゃく にじゅうさんねんの かんとう だいしんさいで ぎんざの みせわ やけ、てっしゅうの かんばんの ほんものも うしなわれました。
  - speaker: reimu
    text: 戦争中も酒種は職人たちの元に分けて預けられ、守り抜かれました。
    reading: せんそうちゅうも さかだねわ しょくにんたちの もとに わけて あずけられ、まもりぬかれました。
- id: ch12_shikumi
  title: 酒種でふくらむ仕組み
  background: an_zukai
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: つむぎ。[酒種|さかだね]って、結局どうやってパンをふくらませるの？
  - speaker: tsumugi
    emotion: normal
    text: まず麹が、[お米|おこめ]のでんぷんを糖に変えるの。
  - speaker: tsumugi
    emotion: normal
    text: その糖を酵母が食べて、アルコールと炭酸ガスを出すのよ。
  - speaker: zundamon
    emotion: happy
    text: ガスの泡で、生地がふくらむ！
  - speaker: zundamon
    emotion: thinking
    text: でも泡なんて、すぐ抜けちゃいそうなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 小麦粉をこねると、グルテンという網ができるの。
  - speaker: tsumugi
    emotion: normal
    text: その網が、風船のゴムみたいに泡を閉じ込めるのよ。
  - speaker: zundamon
    emotion: surprised
    text: パンの中に、小さな風船がいっぱいあるのか！
  - speaker: tsumugi
    emotion: normal
    text: 焼くと網が固まって、ふくらんだ形のまま残るの。
  - speaker: tsumugi
    emotion: normal
    text: パンのイーストと仕組みは同じ。違うのは、麹の香りとしっとりした食感ね。
  - speaker: zundamon
    emotion: thinking
    text: お酒の種なら、食べたら酔っぱらうの？
  - speaker: tsumugi
    emotion: normal
    text: 焼けば、アルコールはほとんど飛ぶわ。
  - speaker: zundamon
    emotion: happy
    text: 安心なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 今の木村屋では、種の仕込みからあんぱんになるまで10日あまりかかるの。
