  - speaker: tsumugi
    emotion: normal
    text: そう。今は神奈川県の八重桜を、まず梅酢に漬けてるの。
  - speaker: tsumugi
    emotion: normal
    text: 花びらは一つ一つ手作業で、塩に漬けて仕上げるの。
  - speaker: zundamon
    emotion: surprised
    text: 手で！？ 気が遠くなるのだ。
  - speaker: tsumugi
    emotion: normal
    text: 生地を寝かせる部屋は温度を0.1度、湿度を1%の細かさで合わせてるわ。
  - speaker: zundamon
    emotion: thinking
    text: ボクの部屋なんて、エアコンの温度もうろ覚えなのだ。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 2021年の取材では、工場で1日2万個。あんは手で包んでたの。
  - speaker: zundamon
    emotion: surprised
    text: 2万個を手で！？
  - speaker: tsumugi
    emotion: normal
    text: 1分に17個。入社20年の人でも、まだまだって言うのよ。
  - speaker: tsumugi
    emotion: normal
    text: 4月4日は、あんぱんの日。献上の日にちなんで、2001年に記念日になったの。
  - speaker: tsumugi
    emotion: normal
    text: そして2026年の4月4日、銀座のお店は名前が変わったわ。
  - speaker: zundamon
    emotion: surprised
    text: 名前が変わった！？
  - speaker: tsumugi
    emotion: normal
    text: 2つに分かれていたブランドを17年ぶりにまとめて、木村屋[總本店|そうほんてん]の銀座本店になったの。
  - speaker: zundamon
    emotion: thinking
    text: '[鉄舟|てっしゅう]さんの看板は、どうなったの？'
  - speaker: tsumugi
    emotion: normal
    text: 今もお店に掲げられてるわ。本物は震災で焼けたから、作り直したものだけどね。
  - speaker: zundamon
    emotion: happy
    text: 窯は焼け残って、看板は焼けても作り直された。この店、しぶといのだ。
  - speaker: tsumugi
    emotion: normal
    text: '[安兵衛|やすべえ]さんのお墓がある[東浅草|ひがしあさくさ]の[東禅寺|とうぜんじ]には、[文|ぶん]さんと並んだ像もあるの。'
  - speaker: zundamon
    emotion: happy
    text: 店の元手を出した[文|ぶん]さんも、ちゃんと[隣|となり]なんだね。
- id: ch13_ronsou
  title: あんぱんを考えたのは誰
  background: an_shiryo
  bgm: jitaku_nite
  stage:
