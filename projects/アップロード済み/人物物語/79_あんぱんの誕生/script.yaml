  - {who: bun, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 翌1888年、山岡鉄舟も亡くなります。
    reading: よくねん せんはっぴゃく はちじゅうはちねん、やまおか てっしゅうも なくなります。
  - speaker: bun
    emotion: thinking
