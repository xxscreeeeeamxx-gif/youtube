scenes:
- id: co_kataipan
  title: ''
  background: an_bunei
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 木村安兵衛, emotion: normal}
  - {who: kyaku, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 明治2年の東京。50歳を過ぎた男が、のちにあんぱんの木村屋となるパン屋を開いていました。
    reading: めいじ にねんの とうきょう。ごじゅっさいお すぎた おとこが、のちに あんぱんの きむらやと なる ぱんやお ひらいて いました。
  - speaker: kyaku
    emotion: thinking
    text: なんでえ、こりゃ。石ころかい？
  - speaker: zundamon
    emotion: normal
    text: パンです。西洋の人が、毎日食べているものです。
  - speaker: kyaku
    emotion: surprised
    text: ……かってえ！ 歯が、負けちまう。
  - speaker: kyaku
    emotion: angry
    text: 悪いが、タダでも要らねえよ。
    se: don
  - speaker: zundamon
    emotion: sad
    text: ……タダでも、なのだ。
  - speaker: reimu
    text: この男は、木村安兵衛。6年後、この店のあんぱんは明治天皇の花見に出されます。
    reading: この おとこわ きむら やすべえ。ろくねんご、この みせの あんぱんわ めいじ てんのうの はなみに だされます。
- id: hook
  title: ''
  background: an_ima_pan
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。フランスパンに、あんこを挟んだのだ！
  - speaker: zundamon
    emotion: surprised
    text: ……かたい。あごが外れそうなのだ。
    beat: true
  - speaker: tsumugi
    emotion: thinking
    text: 150年前の東京の人も、その顔をしてたのよ。
  - speaker: zundamon
    emotion: thinking
    text: そんなパンが、なんで天皇に出すあんぱんになったの？
    telops:
    - {text: 要らないパンが天皇の茶菓子に？, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 答えは、和菓子の中にあったの。始まりは、茨城の田んぼよ。
- id: ch0_mura
  title: 水につかる田んぼ
  background: an_mura
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 木村安兵衛, emotion: sad}
  - {who: bun, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 木村安兵衛は1817年、今の茨城県牛久市の農家に生まれました。
    reading: きむら やすべえわ せんはっぴゃく じゅうななねん、いまの いばらきけん うしくしの のうかに うまれました。
  - speaker: reimu
    text: 22歳のころ近くの村の木村家に婿に入り、妻の文と暮らします。
    reading: にじゅうにさいの ころ ちかくの むらの きむらけに むこに はいり、つまの ぶんと くらします。
  - speaker: bun
    emotion: thinking
    text: あなた。また川があふれたわよ。
  - speaker: zundamon
    emotion: sad
    text: 田んぼが、また水の底なのだ。
  - speaker: bun
    emotion: thinking
    text: 今年も、苗より先にカエルが住みついたわ。
  - speaker: zundamon
    emotion: thinking
    text: ……いっそ、ここでコイでも飼うか。
  - speaker: bun
    emotion: angry
    text: 次の大水で、コイも一緒に流されて終わりよ。
    se: hammer
  - speaker: reimu
    text: 小貝川の水害が続き、安兵衛は農業に見切りをつけます。
    reading: こかいがわの すいがいが つづき、やすべえわ のうぎょうに みきりお つけます。
  - speaker: zundamon
    emotion: thinking
    text: ……[文|ぶん]。江戸へ、出ようと思う。
  - speaker: bun
    emotion: surprised
    text: 江戸へ？ 江戸で、何をするの。
  - speaker: zundamon
    emotion: normal
    text: 何でもする。
  - speaker: bun
    emotion: thinking
    text: 何でもって、一番あてにならない返事ね。
    beat: true
  - speaker: zundamon
    emotion: normal
    text: 江戸には、本家の[重義|しげよし]さんがいる。まずは、頼ってみる。
  - speaker: reimu
    text: やがて一家は江戸に出ます。安兵衛は職を転々とし、武家屋敷の米蔵の番に就きました。
    reading: やがて いっかわ えどに でます。やすべえわ しょくお てんてんと し、ぶけやしきの こめぐらの ばんに つきました。
- id: card1868
  title: ''
  background: an_card_1868
  cuts:
  - speaker: reimu
    text: 1868年。戦に敗れた幕府が倒れ、明治の世が始まります。
    reading: せんはっぴゃく ろくじゅうはちねん。いくさに やぶれた ばくふが たおれ、めいじの よが はじまります。
- id: ch1_shitsugyou
  title: 50過ぎの失業
  background: an_yashiki
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 木村安兵衛, emotion: sad}
  - {who: eizaburou, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 明治の世になり、50歳を過ぎた安兵衛は勤めを失います。
    reading: めいじの よに なり、ごじゅっさいお すぎた やすべえわ つとめお うしないます。
  - speaker: eizaburou
    emotion: thinking
    text: 父さん。お屋敷の[米蔵|こめぐら]、明日で閉めるって門番が言ってました。
  - speaker: zundamon
    emotion: sad
    text: ……知ってる。ボクの勤めも、今日で終わりだ。
  - speaker: eizaburou
    emotion: thinking
    text: これから、どうするんですか。
  - speaker: zundamon
    emotion: sad
    text: 50を過ぎて、また一からやり直しなのだ……。
  - speaker: eizaburou
    emotion: normal
    text: 父さん。刀の世の中は、もう終わりですよ。
  - speaker: zundamon
    emotion: surprised
    text: '[英三郎|えいざぶろう]は、あっさり言うな。'
  - speaker: eizaburou
    emotion: happy
    text: 横浜には、外国人の焼くパン屋まであるんです。これからは、ああいう商売ですよ。
  - speaker: zundamon
    emotion: thinking
    text: パン？ あの、西洋のまんじゅうか。
  - speaker: eizaburou
    emotion: thinking
    text: まんじゅうとは、だいぶ違うと思いますけど。
    beat: true
- id: ch1_ie
  title: ''
  background: an_ie
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 木村安兵衛, emotion: sad}
  - {who: bun, x: 0.7, emotion: thinking}
  cuts:
  - speaker: bun
    emotion: thinking
    text: お帰りなさい。……顔色が、悪いわね。
  - speaker: zundamon
    emotion: sad
    text: '[文|ぶん]。勤めが、なくなった。'
  - speaker: bun
    emotion: thinking
    text: ……そう。
  - speaker: zundamon
    emotion: sad
    text: また一からだ。すまない。
  - speaker: bun
    emotion: normal
    text: 謝らないで。田んぼを捨てたときも、一からだったじゃない。
  - speaker: zundamon
    emotion: sad
    text: あのときは、まだ若かったのだ。
  - speaker: bun
    emotion: thinking
    text: 泣き言を言う元気は、まだあるみたいね。
  - speaker: bun
    emotion: happy
    text: それにね。うちには少しだけ、蓄えがあるの。
  - speaker: zundamon
    emotion: surprised
    text: 蓄え？ いつの間に。
  - speaker: bun
    emotion: happy
    text: あなたの知らないところで、こつこつとよ。
  - speaker: zundamon
    emotion: thinking
    text: ……ボクより、[文|ぶん]のほうがよっぽど頼りになるな。
  - speaker: bun
    emotion: normal
    text: 今ごろ気づいたの？
    beat: true
- id: ch2_jusanjo
  title: 石みたいなパン
  background: an_jusanjo
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 木村安兵衛, emotion: normal}
  - {who: umekichi, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 安兵衛は本家の重義を頼り、重義が所長を務める授産所で事務の職に就きます。
    reading: やすべえわ ほんけの しげよしお たより、しげよしが しょちょうお つとめる じゅさんじょで じむの しょくに つきます。
  - speaker: reimu
    text: 授産所は、勤め口を失った人に新しい仕事を覚えさせる所です。
    reading: じゅさんじょわ、つとめぐちお うしなった ひとに あたらしい しごとお おぼえさせる ところです。
  - speaker: reimu
    text: そこで出会ったのが、長崎でオランダ人の家のコックをしていた梅吉でした。
    reading: そこで であったのが、ながさきで おらんだじんの いえの こっくお して いた うめきちでした。
  - speaker: umekichi
    emotion: happy
    text: '[安兵衛|やすべえ]さん。これが、パンっちゅうもんですたい。'
  - speaker: zundamon
    emotion: surprised
    text: ……かたい！ 石みたいなのだ。
    se: bikkuri
  - speaker: umekichi
    emotion: normal
    text: 西洋のパンは、こがんもんです。オランダの旦那は、毎朝これば食べよったとです。
  - speaker: zundamon
    emotion: thinking
    text: 毎朝これを……。オランダの人は、歯が鉄でできてるんですか。
  - speaker: umekichi
    emotion: happy
    text: 歯は普通ですばい。スープに浸けて、やわらこうして食べよりました。
  - speaker: zundamon
    emotion: happy
    text: なんだ。浸けるなら、お茶でもいいな。
  - speaker: umekichi
    emotion: thinking
    text: パンのお茶漬けは、オランダの旦那も見たことなかでしょうな。
    beat: true
  - speaker: zundamon
    emotion: thinking
    text: これは、どうやってふくらませるんですか。
  - speaker: umekichi
    emotion: normal
    text: パン種っちゅうのを生地に混ぜて、寝かせるとです。
  - speaker: zundamon
    emotion: thinking
    text: 寝かせる？ 生地が、昼寝をするんですか。
  - speaker: umekichi
    emotion: happy
    text: 寝とる間に、種が働いてふくらませてくれるとです。
  - speaker: zundamon
    emotion: happy
    text: 寝てる間に働いてもらえるなんて、うらやましいのだ。
- id: ch2_jishoku
  title: ''
  background: an_jusanjo
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 木村安兵衛, emotion: normal}
  - {who: shigeyoshi, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: '[重義|しげよし]さん。[授産所|じゅさんじょ]を、辞めさせてください。'
  - speaker: shigeyoshi
    emotion: surprised
    text: 辞める？ ここを辞めて、どうする気だ。
  - speaker: zundamon
    emotion: happy
    text: パン屋を開きます。
  - speaker: shigeyoshi
    emotion: angry
    text: パンだと？ 50も過ぎて、あんな石ころを売るのか。
  - speaker: zundamon
    emotion: normal
    text: 世の中は変わりました。いつか、みんながパンを食べるようになります。
  - speaker: shigeyoshi
    emotion: thinking
    text: わしは食わんぞ。
  - speaker: zundamon
    emotion: happy
    text: なら最初のお客は、[重義|しげよし]さんで決まりですね。
  - speaker: shigeyoshi
    emotion: angry
    text: 食わんと言っとるだろうが！
    se: tsukkomi
  - speaker: shigeyoshi
    emotion: thinking
    text: ……まったく。勤めを捨ててまで、何がしたいんだ。
  - speaker: zundamon
    emotion: normal
    text: 田んぼも屋敷も、なくなりました。次は、自分で始めたいんです。
- id: card1869
  title: ''
  background: an_card_1869
  cuts:
  - speaker: reimu
    text: 1869年。東京の芝、今の新橋駅の近くに小さなパン屋が開きます。
    reading: せんはっぴゃく ろくじゅうくねん。とうきょうの しば、いまの しんばしえきの ちかくに ちいさな ぱんやが ひらきます。
- id: ch3_bunei
  title: 文英堂の開店
  background: an_bunei
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 木村安兵衛, emotion: happy}
  - {who: bun, x: 0.56, emotion: happy}
  - {who: eizaburou, x: 0.8, emotion: happy}
  cuts:
  - speaker: eizaburou
    emotion: happy
    text: 父さん、窯に火が入りました。[梅吉|うめきち]さんが、最初のパンを焼いてます。
  - speaker: bun
    emotion: thinking
    text: お客さん、来てくれるかしら。
  - speaker: bun
    emotion: normal
    text: それで、お店の名前は決めたの？
  - speaker: zundamon
    emotion: happy
    text: '[文英堂|ぶんえいどう]だ。[文|ぶん]の一字と、[英三郎|えいざぶろう]の一字をもらった。'
  - speaker: bun
    emotion: happy
    text: あら。わたしの名前が、先なのね。
  - speaker: eizaburou
    emotion: happy
    text: 母さんのお[金|かね]で、開いた店ですからね。
  - speaker: zundamon
    emotion: thinking
    text: ……そこは、言わなくていいのだ。
    beat: true
- id: ch3_kyaku
  title: ''
  background: an_bunei
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 木村安兵衛, emotion: happy}
  - {who: kyaku, x: 0.7, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: いらっしゃいまし。西洋のパンです！
  - speaker: kyaku
    emotion: thinking
    text: なんでえ、こりゃ。石ころかい？
  - speaker: zundamon
    emotion: normal
    text: パンです。西洋の人が、毎日食べているものです。
  - speaker: kyaku
    emotion: surprised
    text: ……かってえ！ 歯が、負けちまう。
  - speaker: kyaku
    emotion: angry
    text: おまけに、すっぺえ。こりゃ腐ってんじゃねえのか。
  - speaker: zundamon
    emotion: sad
    text: そういう味、なんです……。
  - speaker: kyaku
    emotion: angry
    text: 悪いが、タダでも要らねえよ。
    se: gaan
  - speaker: zundamon
    emotion: sad
    text: ……タダでも、なのだ。
  - speaker: kyaku
    emotion: normal
    text: 茶うけにもなりゃしねえ。まんじゅうでも並べときな。
  - speaker: reimu
    text: ヨーロッパ風の硬いパンは、日本人の口に合いませんでした。
    reading: よーろっぱふうの かたい ぱんわ、にほんじんの くちに あいませんでした。
- id: ch3_urenokori
  title: ''
  background: an_bunei
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 木村安兵衛, emotion: sad}
  - {who: bun, x: 0.7, emotion: thinking}
  cuts:
  - speaker: bun
    emotion: thinking
    text: あなた。今日も、ひとつも売れなかったわね。
  - speaker: zundamon
    emotion: sad
    text: 棚に、もう入りきらないのだ……。
    background: an_bunei_yama
  - speaker: bun
    emotion: thinking
    text: パン屋っていうより、パンの倉庫ね。
  - speaker: zundamon
    emotion: thinking
    text: ……うちの晩ごはんにすれば、少しは減る。
  - speaker: bun
    emotion: angry
    text: 毎晩これを食べたら、パンより先にあごがなくなるわよ。
    beat: true
- id: ch3_machi
