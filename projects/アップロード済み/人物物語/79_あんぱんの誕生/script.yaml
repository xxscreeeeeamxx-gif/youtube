    reading: せんはっぴゃく はちじゅうくねん しちがつ。やすべえわ やまいで なくなりました。ななじゅうさんさいでした。
- id: ch10_onna
  title: 女ふたりの店
  background: an_kobo
  bgm: hirusagari
  stage:
  - {who: bun, x: 0.3, flip: true, emotion: normal}
  - {who: shokunin, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 三男の儀四郎は、銀座の店を離れていました。店を守ったのは、文と儀四郎の妻のゆうです。
    reading: さんなんの ぎしろうわ、ぎんざの みせお はなれて いました。みせお まもったのわ、ぶんと ぎしろうの つまの ゆうです。
  - speaker: shokunin
