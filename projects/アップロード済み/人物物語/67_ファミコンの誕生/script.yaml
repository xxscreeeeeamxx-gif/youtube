scenes:
- id: hook
  title: ''
  background: fc_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、押し入れから、古いゲーム機が出てきたのだ！
  - speaker: tsumugi
    emotion: surprised
    text: 懐かしい。ちゃんと映るの？
  - speaker: zundamon
    emotion: thinking
    text: それが、テレビにつないでも映らない。
  - speaker: zundamon
    emotion: happy
    text: だから、カセットをフーフーするのだ！
  - speaker: tsumugi
    emotion: normal
    text: 昔は、みんなやってたわね。
  - speaker: zundamon
    emotion: thinking
    text: ……まだ映らない。今度は、本体の[差し込み口|さしこみぐち]もフーフーするのだ！
  - speaker: tsumugi
    emotion: surprised
    text: 本体まで吹くの？
  - speaker: zundamon
    emotion: happy
    text: 最後の手段。コントローラーもフーフーするのだ！
  - speaker: tsumugi
    emotion: thinking
    text: そこは、吹いても何も変わらないわよ。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: それに、フーフーは、端子がさびる原因になるの。
  - speaker: zundamon
    emotion: surprised
    text: えっ。ぼく、ずっと、さびさせてたのだ？
  - speaker: tsumugi
    emotion: normal
    text: 任天堂も、2010年に、やめてくださいって呼びかけてるわ。
  - speaker: reimu
    text: ファミリーコンピュータ。1983年の発売から、世界で6191万台が売れたゲーム機です。
    reading: ふぁみりー こんぴゅーた。せんきゅうひゃく はちじゅうさんねんの はつばいから せかいで ろくせん ひゃくきゅうじゅういちまんだいが うれた げーむきです。
  - speaker: zundamon
    emotion: surprised
    text: 6191万台！ 作ったのは、マリオを作った人なのだ？
  - speaker: tsumugi
    emotion: normal
    text: マリオを作ったのは、宮本茂さん。本体を作ったのは、別の人よ。
  - speaker: tsumugi
    emotion: thinking
    text: 発売した年の暮れに、出荷を止めて、回収することになった人。
  - speaker: zundamon
    emotion: surprised
    text: 売ったのに、回収なのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 作ったのは、任天堂の技術者、上村雅之さんよ。
- id: card1943
  title: ''
  background: fc_card_1943
  cuts:
  - speaker: reimu
    text: 1943年。東京で、上村雅之が生まれます。
    reading: せんきゅうひゃく よんじゅうさんねん。とうきょうで うえむら まさゆきが うまれます。
- id: ch1_kyoto
  title: テレビを作る人になりたい
  background: fc_denkiya
  bgm: warm
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上村雅之, scale: 0.85, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 雅之さんは、高校を出るまで京都で育ったの。
  - speaker: reimu
    text: 1953年、東京でテレビ放送が始まり、翌年には大阪でも始まります。
    reading: せんきゅうひゃく ごじゅうさんねん とうきょうで てれび ほうそうが はじまり、よくねんにわ おおさかでも はじまります。
  - speaker: zundamon
    emotion: happy
    text: 電器屋さんのテレビに、また人だかりだ。
  - speaker: zundamon
    emotion: thinking
    text: 箱の中で、どうやって絵が動いてるのだ？
  - speaker: tsumugi
    emotion: normal
    text: 当時のテレビは、とても高かったの。
  - speaker: tsumugi
    emotion: normal
    text: 家に無いから、お店の前で見る人も多かったのよ。
  - speaker: zundamon
    emotion: happy
    text: 箱の中の仕組みを、いつか知りたいのだ！
  - speaker: tsumugi
    emotion: happy
    text: 見るほうより、仕組みのほうが気になるのね。
  - speaker: reimu
    text: 雅之は千葉工業大学に進み、電子工学を学びます。
    reading: まさゆきわ ちば こうぎょう だいがくに すすみ でんし こうがくお まなびます。
  - speaker: reimu
    text: テレビの技術者になりたくて電子回路を学んだ、と本人は書いています。
    reading: てれびの ぎじゅつしゃに なりたくて でんし かいろお まなんだと ほんにんわ かいて います。
- id: card1967
  title: ''
  background: fc_card_1967
  cuts:
  - speaker: reimu
    text: 1967年。雅之は、大阪の早川電機に入ります。今のシャープです。
    reading: せんきゅうひゃく ろくじゅうななねん。まさゆきわ おおさかの はやかわ でんきに はいります。いまの しゃーぷです。
- id: ch1_sharp
  title: 光のセンサーを売る
  background: fc_sharp
  bgm: curious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 上村雅之, emotion: normal}
  - {who: douryo, x: 0.56, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 配属は、光に反応する部品、光センサーを扱う部署でした。
    reading: はいぞくわ ひかりに はんのうする ぶひん ひかり せんさーお あつかう ぶしょでした。
  - speaker: douryo
    emotion: normal
    text: 上村、今週も出張か。
  - speaker: zundamon
    emotion: happy
    text: 九州から静岡まで、工場回りだ！
  - speaker: douryo
    emotion: surprised
    text: 担当の地域、広すぎやろ。
  - speaker: zundamon
    emotion: normal
    text: 製鉄所でも、織機の工場でも、光のセンサーは使えるのだ。
  - speaker: douryo
    emotion: thinking
    text: 売るだけやなくて、部品の開発もやってるんやろ？
  - speaker: zundamon
    emotion: happy
    text: 売りに行くと、お客さんの欲しい物が分かる。それを作るのだ。
  - speaker: tsumugi
    emotion: normal
    text: 開発も営業も、やってたのね。
- id: card1968
  title: ''
  background: fc_card_1968
  cuts:
  - speaker: reimu
    text: 1968年5月。雅之は、京都のおもちゃ会社を訪ねます。
    reading: せんきゅうひゃく ろくじゅうはちねん ごがつ。まさゆきわ きょうとの おもちゃ がいしゃお たずねます。
- id: ch1_kousenju
  title: 光線銃のセンサー
  background: fc_nintendo68
  bgm: pop
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 上村雅之, emotion: normal}
  - {who: yamauchi, x: 0.56, emotion: normal}
  - {who: yokoi, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: シャープの、京都の販売会社の社長に勧められての訪問でした。
    reading: しゃーぷの きょうとの はんばい がいしゃの しゃちょうに すすめられての ほうもんでした。
  - speaker: yamauchi
    emotion: normal
    text: 任天堂の山内です。こっちは、開発の横井。
  - speaker: yokoi
    emotion: happy
    text: 光線銃を作ってるんです。光を当てたら、[的|まと]が反応するおもちゃです。
  - speaker: zundamon
    emotion: normal
    text: 今日は、うちの光の部品を、いろいろ持ってきたのだ。
  - speaker: yokoi
    emotion: thinking
    text: 今の[的|まと]の部品は、反応がちょっと遅いんです。
  - speaker: yokoi
    emotion: surprised
    text: ……この太陽電池、光線銃に使えるんちゃうか。
  - speaker: zundamon
    emotion: surprised
    text: 太陽電池を、センサーに？
  - speaker: zundamon
    emotion: happy
    text: たしかに、光が当たった瞬間に、電気が流れるのだ。
  - speaker: reimu
    text: 7月から横井との打ち合わせが始まり、12月には試作機ができます。
    reading: しちがつから よこいとの うちあわせが はじまり、じゅうにがつにわ しさくきが できます。
  - speaker: reimu
    text: 1969年に両社は契約し、翌年、光線銃SPシリーズが発売されます。
    reading: せんきゅうひゃく ろくじゅうきゅうねんに りょうしゃわ けいやくし、よくねん こうせんじゅう えすぴー しりーずが はつばいされます。
  - speaker: reimu
    text: シリーズは、およそ160万丁が売れました。
    reading: しりーずわ およそ ひゃくろくじゅうまんちょうが うれました。
- id: card1971
  title: ''
  background: fc_card_1971
  cuts:
  - speaker: reimu
    text: 1971年。雅之に、任天堂から声がかかります。
    reading: せんきゅうひゃく ななじゅういちねん。まさゆきに にんてんどうから こえが かかります。
- id: ch2_sasoi
  title: おもちゃの会社へ
  background: fc_ousetsu
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上村雅之, emotion: normal}
  - {who: sawai, x: 0.7, emotion: normal}
  cuts:
  - speaker: sawai
    emotion: normal
    text: 上村くん、うちに来てくれんか。
  - speaker: sawai
    emotion: thinking
    text: 任天堂も、これから変わらんといかん。
  - speaker: sawai
    emotion: happy
    text: 軍平くんも、君が来るのを望んどる。
  - speaker: zundamon
    emotion: thinking
    text: ……少し、考えさせてほしい。
  - speaker: reimu
    text: 声をかけたのは、専務の沢井末造でした。
    reading: こえお かけたのわ せんむの さわい すえぞうでした。
- id: ch2_douryo
  title: ''
  background: fc_sharp
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上村雅之, emotion: normal}
  - {who: douryo, x: 0.56, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: douryo
    emotion: surprised
    text: なんでお前、おもちゃを作ってるような会社に行くんや。
  - speaker: zundamon
    emotion: normal
    text: 自分の力を、試してみたいのだ。
  - speaker: douryo
    emotion: thinking
    text: 大きい会社におったほうが、安泰やで。
  - speaker: zundamon
    emotion: normal
    text: 分かってる。それでも、行ってみたいのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 周りから見たら、大手の電機メーカーから、花札とおもちゃの会社よ。
  - speaker: tsumugi
    emotion: normal
    text: 同僚が止めるのも、無理はないわね。
  - speaker: reimu
    text: 1971年、雅之は任天堂に移りました。
    reading: せんきゅうひゃく ななじゅういちねん まさゆきわ にんてんどうに うつりました。
- id: ch2_clay
  title: 空いたボウリング場
  background: fc_bowling
  bgm: curious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 上村雅之, emotion: happy}
  - {who: shain, x: 0.56, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1973年、京都の元ボウリング場に、光線銃で遊ぶ射撃場ができます。
    reading: せんきゅうひゃく ななじゅうさんねん、きょうとの もと ぼうりんぐじょうに こうせんじゅうで あそぶ しゃげきじょうが できます。
  - speaker: tsumugi
    emotion: normal
    text: 飛んでいく皿の映像を、光線銃で撃ち落とすの。レーザークレー射撃よ。
  - speaker: zundamon
    emotion: happy
    text: 空いたボウリング場を、射撃場に作り変えるのだ！
  - speaker: shain
    emotion: happy
    text: 上村さん、よその遊び場からも、注文が来てますよ！
  - speaker: zundamon
    emotion: happy
    text: どんどん作るぞ！
  - speaker: reimu
    text: ところが、この年の秋、石油ショックが起こります。
    reading: ところが この としの あき せきゆ しょっくが おこります。
  - speaker: shain
    emotion: sad
    text: 上村さん……。注文が、次々に取り消しです。
  - speaker: zundamon
    emotion: surprised
    text: 取り消し！？ 全部なのだ？
  - speaker: shain
    emotion: thinking
    text: 景気が悪くなって、遊びにお[金|かね]を出す余裕が無いそうです。
  - speaker: zundamon
    emotion: sad
    text: ……大量に頼んだ部品が、宙に浮いてしまうのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 遊びやおもちゃは、景気が悪くなると、真っ先に削られるのよ。
- id: card1977
  title: ''
  background: fc_card_1977
  cuts:
  - speaker: reimu
    text: 1977年。任天堂は、家のテレビにつなぐゲーム機を出します。
    reading: せんきゅうひゃく ななじゅうななねん。にんてんどうわ いえの てれびに つなぐ げーむきお だします。
- id: ch2_tv15
  title: テレビの雑音
  background: fc_kaihatsu77
  bgm: mystery
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 上村雅之, emotion: normal}
  - {who: shain, x: 0.56, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: カラーテレビゲーム15と6。三菱電機と組んで作った機械です。
    reading: からー てれび げーむ じゅうごと ろく。みつびし でんきと くんで つくった きかいです。
  - speaker: shain
    emotion: thinking
    text: 上村さん、また苦情です。テレビの映りが悪いって。
  - speaker: zundamon
    emotion: thinking
    text: アンテナの線につなぐから、雑音が入るのだ……。
  - speaker: shain
    emotion: sad
    text: お店で直してくれ、って言われても……。
  - speaker: zundamon
    emotion: thinking
    text: 家のテレビは、一軒ごとに違う。ここが一番難しい。
  - speaker: tsumugi
    emotion: normal
    text: アンテナの端子につないで、テレビの電波のふりをして映す方式だったの。
  - speaker: reimu
    text: この苦労から、雅之は家庭用のテレビゲームにかなり悲観的になった、と書いています。
    reading: この くろうから まさゆきわ かていようの てれびげーむに かなり ひかんてきに なったと かいて います。
  - speaker: zundamon
    emotion: sad
    text: ……家のテレビにつなぐゲームは、難しすぎるのだ。
- id: ch2_radar
  title: 5人の開発第二部
  background: fc_kaihatsu
  bgm: ambient
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 上村雅之, emotion: normal}
  - {who: buka, x: 0.56, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 70年代の終わり、雅之は開発第二部の部長になります。
    reading: ななじゅうねんだいの おわり まさゆきわ かいはつ だいにぶの ぶちょうに なります。
  - speaker: reimu
    text: 1980年、アメリカに送った業務用のゲーム機が売れ残ります。
    reading: せんきゅうひゃく はちじゅうねん あめりかに おくった ぎょうむようの げーむきが うれのこります。
  - speaker: buka
    emotion: sad
    text: 部長、アメリカの倉庫に、売れ残りの基板が山ほどです。
  - speaker: zundamon
    emotion: thinking
    text: 作り変えは、横井さんの開発一部に任されたのだ……。
  - speaker: tsumugi
    emotion: normal
    text: この作り変えで生まれたのが、宮本茂さんが考えた、ドンキーコングよ。
  - speaker: tsumugi
    emotion: happy
    text: 売れ残りから、あのゴリラが生まれたのね。
  - speaker: buka
    emotion: normal
    text: 部長、今日も、ゲーム&ウオッチの手伝いに行ってきます。
  - speaker: zundamon
    emotion: thinking
    text: ……残ったのは、ぼくを入れて5人くらいなのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 部長なのに、部下がほとんどいないのね。
- id: card1981
  title: ''
  background: fc_card_1981
  cuts:
  - speaker: reimu
    text: 1981年11月。ある日の夜。
    reading: せんきゅうひゃく はちじゅういちねん じゅういちがつ。ある ひの よる。
- id: ch3_denwa
  title: 夜の電話
  background: fc_denwa
  bgm: mystery
  motion: none
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 上村雅之, emotion: surprised}
  - {who: yamauchi, x: 0.56, emotion: normal}
  - {who: tsumugi, x: 0.84, emotion: normal}
  cuts:
  - speaker: reimu
    text: 雅之の家の電話が鳴りました。かけてきたのは、社長の山内溥です。
    reading: まさゆきの いえの でんわが なりました。かけて きたのわ しゃちょうの やまうち ひろしです。
  - speaker: zundamon
    emotion: surprised
    text: はい、上村です。……社長？
  - speaker: yamauchi
    emotion: normal
    text: 上村くん。ゲーム&ウオッチの次を、考えんとあかん。
  - speaker: yamauchi
    emotion: normal
    text: カセットで遊ぶ、家庭用のテレビゲームを作ろう。
  - speaker: zundamon
    emotion: thinking
    text: テレビゲーム、ですか……。
  - speaker: yamauchi
    emotion: happy
    text: 君しかおらん。頼んだで。
  - speaker: zundamon
    emotion: thinking
    text: ……切れた。
  - speaker: tsumugi
    emotion: thinking
    text: 内心こりごりだった人に、よりによってテレビゲームを頼むのね。
- id: ch3_yokuasa
  title: ''
  background: fc_shachoshitsu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 上村雅之, emotion: normal}
  - {who: yamauchi, x: 0.56, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
