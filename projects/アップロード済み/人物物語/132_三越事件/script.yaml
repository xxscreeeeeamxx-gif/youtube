  title: ''
  background: mt_card_2026
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 2026年。あの取締役会から、44年がたちました。
    reading: にせん にじゅうろくねん。あの とりしまりやくかいから、よんじゅうよねんが たちました。
- id: ima
  title: 三越のいま
  background: mt_gendai
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 三越は、いまどうなってるの？
  - speaker: tsumugi
    emotion: normal
    text: 2008年に伊勢丹と経営統合。2011年には三越が伊勢丹を合併したわ。
  - speaker: zundamon
    emotion: surprised
    text: 2つの百貨店が、1つの会社に！
  - speaker: tsumugi
    emotion: normal
    text: 日本橋本店と銀座店は、いまも三越の名前で開いているわ。
  - speaker: tsumugi
    emotion: normal
    text: 日本橋本店の本館は、国の重要文化財にもなっているの。
  - speaker: zundamon
    emotion: surprised
    text: 建物ごと、歴史なのだ！
  - speaker: tsumugi
    emotion: normal
    text: 報道によれば、グループは2026年3月期まで3年続けて営業利益が過去最高よ。
  - speaker: zundamon
    emotion: happy
    text: 事件のあとも、続いてるのだ！
  - speaker: tsumugi
    emotion: thinking
    text: そして、あのなぜだも忘れられていないの。
  - speaker: tsumugi
    emotion: normal
    text: 2018年、日産の元会長の逮捕でこのなぜだを思い出したと書いた解説者もいたわ。
  - speaker: tsumugi
    emotion: normal
    text: 法律家も[特別背任|とくべつハイニン]を考える例として、この高裁の判決を挙げているわ。
  - speaker: zundamon
    emotion: surprised
    text: 何十年たっても、なぜだが出てくるのだ……。
# ---- 締め（茶番の回収。高裁の言葉は留保ごと帯で出し、つむぎが受ける） ----
- id: shime
  title: ''
  background: mt_heya
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 決めたのだ！ プリンは1つにして、委員長に返り咲くのだ！
  - speaker: tsumugi
    emotion: happy
    text: 返り咲けるかは、また多数決よ。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: あの日、岡田はなぜだと叫んだ。
  - speaker: tsumugi
    emotion: normal
    text: 高裁は顧問弁護士の本の記載から判断する限りと断って、こう書いたの。
  - speaker: reimu
    text: なぜだという発言は、事前に周到な多数派工作を準備したにもかかわらず、これが完全に失敗し
    reading: なぜだと いう はつげんわ じぜんに しゅうとうな たすうは こうさくお じゅんび したにも かかわらず、これが かんぜんに しっぱいし
  - speaker: reimu
    text: 最も信頼していた専務らを含む全員が、社長解任の決議に賛成したことから発せられたものに過ぎず
    reading: もっとも しんらい して いた せんむらお ふくむ ぜんいんが、しゃちょう かいにんの けつぎに さんせい した ことから はっせられた ものに すぎず
    telops:
    - {text: "高裁「完全に失敗し…発せられたものに過ぎず」", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: thinking
    text: 裁判所は、こう読んだの。
  - speaker: zundamon
    emotion: thinking
    text: 用意した票が、1つも来なかったから……。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 社長を止めたのは判決より5年早い、取締役会の起立だったの。
  - speaker: tsumugi
    emotion: normal
    text: 間に1社と、付き合いの押し付け。お[金|かね]の流れに、少しだけ目を向けてね。
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
