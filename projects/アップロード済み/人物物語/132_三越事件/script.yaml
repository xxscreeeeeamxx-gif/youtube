scenes:
# ---- 先出し（1982年9月22日・日本橋本店の取締役会。筋は Wikipedia＋データ・マックスの1本。杉田は1言だけ。笑いの SE なし。議長の席は画面右なので x を左寄せ） ----
- id: co_torishimari
  title: ''
  background: mt_torishimari
  bgm: serious
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 岡田社長, emotion: normal}
  - {who: senmu, x: 0.6, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1982年9月22日、東京・日本橋。三越本店の取締役会で、社長の岡田茂が議長の席を譲ります。
    reading: せんきゅうひゃく はちじゅうにねん くがつ にじゅうににち、とうきょう にほんばし。みつこし ほんてんの とりしまりやくかいで、しゃちょうの おかだ しげるが ぎちょうの せきお ゆずります。
  - speaker: senmu
    emotion: normal
    text: 賛成の[方|カタ]はご起立してください
    pause_after: 0.6
  - speaker: reimu
    text: 椅子を引く音が、次々に続きます。
    reading: いすお ひく おとが、つぎつぎに つづきます。
    background: mt_torishimari_kiritsu
  - speaker: zundamon
    emotion: angry
    text: '[何|なん]だこれは！……議長は俺だ！'
  - speaker: reimu
    text: 16対0。社長の解任が決まります。
    reading: じゅうろく たい ぜろ。しゃちょうの かいにんが きまります。
  - speaker: zundamon
    emotion: surprised
    text: ……なぜだ！
  - speaker: reimu
    text: この『なぜだ』は11年後、裁判所の判決にもう一度書かれます。
    reading: この なぜだわ じゅういちねんご、さいばんしょの はんけつに もういちど かかれます。
# ---- 今の教室（多数決で降ろされた委員長） ----
- id: hook
  title: ''
  background: mt_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: 委員長を、多数決で降ろされたのだ……なぜだ！
  - speaker: tsumugi
    emotion: normal
    text: 給食のプリン、毎日2つ取ってたでしょう。
    se: hammer
  - speaker: zundamon
    emotion: happy
    text: 委員長だから、当然なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 創業300年を超える百貨店、三越の社長も1982年に同じ言葉を叫んだの。
  - speaker: tsumugi
    emotion: normal
    text: なぜだと叫んだ社長は、本当に理由が分からなかったのか。
    telops:
    - {text: "「なぜだ！」と叫んだ社長は 本当に分からなかった？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: プリンの話と、同じなのだ！？
# ---- 1962年ごろ・売り場（30秒以内。週刊誌の会話は使わない。出会いは判決の「昭和三二、三年ころ」） ----
- id: card1962
  title: ''
  background: mt_card_1962
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1962年ごろ。アクセサリーのデザイナー、竹久みちに三越との取引の口座が開かれます。
    reading: せんきゅうひゃく ろくじゅうにねん ごろ。あくせさりーの でざいなー たけひさ みちに、みつこしとの とりひきの こうざが ひらかれます。
- id: ch1_uriba
  title: 売り場のアクセサリー
  background: mt_uriba
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 岡田部長, emotion: normal}
  - {who: tenin, x: 0.84, emotion: happy}
  cuts:
  - speaker: tenin
    emotion: happy
    text: 宣伝部長！ 竹久さんのアクセサリー、今日から売り場に並びます！
  - speaker: zundamon
    emotion: happy
    text: どれどれ。
  - speaker: reimu
    text: 2人は1950年代の終わりに知り合っていました。竹久と三越の取引は、20年後に裁判で問われます。
    reading: ふたりわ せんきゅうひゃく ごじゅうねんだいの おわりに しりあって いました。たけひさと みつこしの とりひきわ、にじゅうねんごに さいばんで とわれます。
# ---- 1972年・13日差の椅子（銀座のハンバーガーの店は1行だけ） ----
- id: card1972
  title: ''
  background: mt_card_1972
  bgm: curious
  cuts:
  - speaker: reimu
    text: 1972年3月30日。竹久が実質的に経営する輸入の会社、オリエント交易ができます。
    reading: せんきゅうひゃく ななじゅうにねん さんがつ さんじゅうにち。たけひさが じっしつてきに けいえい する ゆにゅうの かいしゃ、おりえんと こうえきが できます。
- id: ch2_isu
  title: 13日差の椅子
  background: mt_shachoshitsu
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 岡田社長, emotion: happy}
  - {who: jomu, x: 0.8, emotion: happy}
  cuts:
  - speaker: reimu
    text: その13日後の4月12日。57歳の岡田が、三越の社長に就きます。
    reading: その じゅうさんにちごの しがつ じゅうににち。ごじゅうななさいの おかだが、みつこしの しゃちょうに つきます。
  - speaker: jomu
    emotion: happy
    text: 社長、ご就任おめでとうございます！
  - speaker: zundamon
    emotion: happy
    text: うむ。
  - speaker: jomu
    emotion: normal
    text: 銀座の店長のころは、ハンバーガーの店まで入れましたからね。
  - speaker: zundamon
    emotion: happy
    text: 次は海外の品だ。どんどん直に仕入れるぞ。
  - speaker: jomu
    emotion: happy
    text: 社長のお考えなら、誰も反対しません。
  - speaker: reimu
    text: 一審はのちに、この椅子をあたかもオーナー社長のごとくと書きます。13日の差は、まだ誰も気にしていません。
    reading: いっしんわ のちに、この いすお あたかも おーなー しゃちょうの ごとくと かきます。じゅうさんにちの さわ、まだ だれも きに して いません。
    telops:
    - {text: "一審「オーナー社長のごとく」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
# ---- 1973年12月・業界誌（岡田の言葉は一審が認めた社長室長の証言。回収は1000万円） ----
- id: ch3_zasshi
  title: 二割位あたり前
  background: mt_shachoshitsu
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 岡田社長, emotion: normal}
  - {who: shitsucho, x: 0.8, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 1973年12月。一審によれば、岡田はある業界誌を1000万円で回収します。
    reading: せんきゅうひゃく ななじゅうさんねん じゅうにがつ。いっしんに よれば、おかだわ ある ぎょうかいしお いっせんまんえんで かいしゅう します。
  - speaker: shitsucho
    emotion: surprised
    text: 社長！ この記事です。オリエント交易を間に通すと、
  - speaker: shitsucho
    emotion: surprised
    text: '竹久さんの側の取り分で、うちの仕入れ値が2割ほど高いと。'
  - speaker: zundamon
    emotion: normal
    text: 二割[位|ぐらい]あたり前じゃねえか
    telops:
    - {text: "岡田「二割位あたり前じゃねえか」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: shitsucho
    emotion: surprised
    text: あ、当たり前……。
    se: tenten
  - speaker: reimu
    text: 9年後、この社長が『なぜだ』と叫びます。
    reading: くねんご、この しゃちょうが なぜだと さけびます。
# ---- 1978年4月ごろ・竹久の言葉（相手はアクセサリーたけひさの社員＝オリエント交易の代表取締役に名前だけ就いていた人。名前は出さない。一審が認めた言葉だけ） ----
- id: ch4_juugo
  title: ''
  background: mt_denpyo
  bgm: kinakusai
  stage:
  - {who: tkshain, x: 0.12, flip: true, emotion: normal}
  - {who: takehisa, x: 0.88, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1978年4月ごろ。竹久は、自分の会社の社員に念を押します。
    reading: せんきゅうひゃく ななじゅうはちねん しがつ ごろ。たけひさわ、じぶんの かいしゃの しゃいんに ねんお おします。
  - speaker: takehisa
    emotion: normal
    text: アクセサリーたけひさの[方|ほう]のマージンは[15|ジュウゴ]パーセントは必ず取ってよ
  - speaker: tkshain
    emotion: surprised
    text: ……はい。
  - speaker: tkshain
    emotion: thinking
    text: たけひさもオリエント交易も、竹久さんの会社ですよね……。
# ---- 1978年夏・仕入れの部屋（先輩と新人は名前の無いモブ。1万円→1万1500円は台帳のたとえ） ----
- id: ch4_shiire
  title: 1万円が1万1500円
  background: mt_shiire
  stage:
  - {who: senpai, x: 0.14, flip: true, emotion: normal}
  - {who: shinjin, x: 0.86, emotion: thinking}
  cuts:
  - speaker: reimu
    text: その年の夏。三越の仕入れの部屋です。
    reading: その としの なつ。みつこしの しいれの へやです。
  - speaker: shinjin
    emotion: thinking
    text: 先輩、この伝票おかしくないですか。
  - speaker: senpai
    emotion: normal
    text: どこがだ。
  - speaker: shinjin
    emotion: thinking
    text: 海外で買い付けた品なのに、オリエント交易から直に来ないで
  - speaker: shinjin
    emotion: thinking
    text: 間にアクセサリーたけひさが入ってます。
  - speaker: senpai
    emotion: normal
    text: 社内じゃ、[準直方式|じゅんちょくほうしき]と呼んでる。
  - speaker: shinjin
    emotion: normal
    text: たけひさが入ると、何が変わるんです？
  - speaker: senpai
    emotion: normal
    text: 検品と値札[付け|つけ]をする場所。それだけだ。
  - speaker: shinjin
    emotion: surprised
    text: それだけ？
  - speaker: senpai
    emotion: normal
    text: オリエント交易から1万円で買った品を、たけひさが1万1500円で納める。
  - speaker: shinjin
    emotion: surprised
    text: 1500円も、どこへ行くんですか！？
    se: bikkuri
  - speaker: senpai
    emotion: normal
    text: たけひさの懐だ。
  - speaker: shinjin
    emotion: thinking
    text: 上に、言わないんですか。
  - speaker: senpai
    emotion: sad
    text: 言ったら、地方の店へ飛ばされる。
  - speaker: reimu
    text: 一審によれば、社員たちは不合理と思いながら社長の人事権の行使を恐れて受け入れてきました。
    reading: いっしんに よれば、しゃいんたちわ ふごうりと おもいながら しゃちょうの じんじけんの こうしお おそれて うけいれて きました。
  - speaker: shinjin
    emotion: thinking
    text: 社長は、このことご存じなんですか？
  - speaker: senpai
    emotion: sad
    text: ……それを聞きに行った者は、まだいない。
    beat: true
# ---- 今の部屋（間に1社で約15%。4年で15億7745万円＝準直方式の差益。1日あたりは台帳の割り算） ----
- id: heya1
  title: ''
  background: mt_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 間に1社はさむだけで、1500円も増えるのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 高裁は、まったく必要がないのに間にはさんだと書いているわ。
  - speaker: zundamon
    emotion: thinking
    text: 必要ないのに……。
  - speaker: tsumugi
    emotion: normal
    text: 差は仕入れ値の約[15%|ジュウゴパーセント]。4年で、15億7745万円よ。
    telops:
    - {text: "間に1社で約15%　4年で15億7745万円", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 15億！？
    se: gaan
  - speaker: tsumugi
    emotion: normal
    text: 1日にならすと、約108万円。
  - speaker: zundamon
    emotion: sad
    text: 毎日、100万円ちょっと……。
  - speaker: tsumugi
    emotion: thinking
    text: 1973年に2割高いと書かれたとき、社長は当たり前と言ったわね。
  - speaker: zundamon
    emotion: thinking
    text: 高いのは、知ってたのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 社長に誰も逆らえない会社で、いったい誰が社長を止めたのか。
  - speaker: zundamon
    emotion: thinking
    text: 社員は、言えないのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 止めたのは、社員じゃなかったの。
# ---- 1978年暮れ・取引先の応接室（押し付け販売。中身は「前売券などを買わせた」「改装や催しの費用」まで。取引先は名前の無いモブ） ----
- id: ch5_ken
  title: 断れない前売券
  background: mt_osetsu
  bgm: curious
  stage:
  - {who: torihiki, x: 0.14, flip: true, emotion: surprised}
  - {who: kacho, x: 0.86, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1978年の暮れ。三越がお金を出した映画、燃える秋の公開が迫っていました。
    reading: せんきゅうひゃく ななじゅうはちねんの くれ。みつこしが おかねお だした えいが、もえる あきの こうかいが せまって いました。
  - speaker: torihiki
    emotion: surprised
    text: 課長、三越さんからまた映画の前売券です。
  - speaker: kacho
    emotion: thinking
    text: 燃える秋か。三越さんが、お[金|かね]を出した映画だ。
  - speaker: kacho
    emotion: sad
    text: 断ったら、来年の取引はどうなる。
  - speaker: torihiki
    emotion: sad
    text: ……買うしか、ないですね。
  - speaker: torihiki
    emotion: surprised
    text: 課長、こっちの束も前売券です！
    background: mt_osetsu_ken
    se: zukko
  - speaker: kacho
    emotion: sad
    text: 売り場の改装の費用も、うち持ちだそうだ。
  - speaker: torihiki
    emotion: normal
    text: '[公正取引委員会|こうせいとりひきいいんかい]が、三越に立ち入り検査に入ったそうですよ。'
  - speaker: reimu
    text: 一審によれば公取委の件で取引先の協力を得られず、岡田は海外の品へ一層の関心を寄せます。
    reading: いっしんに よれば こうとりいの けんで とりひきさきの きょうりょくお えられず、おかだわ かいがいの しなえ いっそうの かんしんお よせます。
# ---- 1979〜1981年・人事の言葉（一審が認めた言葉。社員の名前は伏せる。言われる側が1人ずつ替わる） ----
- id: ch6_sendai
  title: 仙台へ出せ
  background: mt_shachoshitsu
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 岡田社長, emotion: angry}
  - {who: jomu, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1979年から1981年。一審が認めた、岡田の人事の言葉です。
    reading: せんきゅうひゃく ななじゅうくねんから せんきゅうひゃく はちじゅういちねん。いっしんが みとめた、おかだの じんじの ことばです。
  - speaker: jomu
    emotion: normal
