    text: 被告人岡田茂を[懲役3年6月|ちょうえきさんねんろっかげつ]に処する。
    se: don
  - speaker: reimu
    text: 竹久は、懲役3年と罰金7000万円。2人とも、執行猶予は付きません。
    reading: たけひさわ、ちょうえき さんねんと ばっきん ななせんまんえん。ふたりとも、しっこう ゆうよわ つきません。
  - speaker: saibancho
    emotion: normal
    text: まさに公私を混同し、企業を私物化してきた歴史であったといっても過言ではない。
    telops:
    - {text: "一審「私物化してきた歴史」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: saibancho
    emotion: normal
    text: 種々の外国フェアー、直輸入推進等を通じて国際文化の交流に寄与したことも指摘できる。
  - speaker: saibancho
    emotion: normal
    text: 被告人岡田のこれらに示された非凡な才能が社長在任中正しく発揮されなかったことは
  - speaker: saibancho
    emotion: normal
    text: 被告人のためまことに惜しむべきことと思われる。
# ---- 1993年11月29日・二審（香港の手数料の分は2人とも無罪。準直方式と自宅は有罪のまま） ----
- id: card1993
  title: ''
  background: mt_card_1993
  cuts:
  - speaker: reimu
    text: 1993年11月29日。東京高裁、二審の判決です。岡田は79歳。
    reading: せんきゅうひゃく きゅうじゅうさんねん じゅういちがつ にじゅうくにち。とうきょう こうさい、にしんの はんけつです。おかだわ ななじゅうきゅうさい。
- id: ch15_nishin
  title: 香港の分は無罪
  background: mt_houtei
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 岡田, emotion: sad}
  - {who: saibancho, x: 0.8, emotion: normal}
  cuts:
  - speaker: saibancho
    emotion: normal
    text: '[原判決|げんはんけつ]を破棄する。'
  - speaker: saibancho
    emotion: normal
    text: 被告人岡田茂を[懲役3年|ちょうえきさんねん]に処する。
  - speaker: reimu
    text: 竹久は懲役2年6月と罰金6000万円に。香港の業者を通した手数料の分は、2人とも無罪でした。
    reading: たけひさわ ちょうえき にねん ろっかげつと ばっきん ろくせんまんえんに。ほんこんの ぎょうしゃお とおした てすうりょうの ぶんわ、ふたりとも むざいでした。
- id: heya4
  title: ''
  background: mt_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 香港の分だけ、無罪なのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 高裁は、竹久らの働きに若干の有用性を認めたの。
  - speaker: tsumugi
    emotion: normal
    text: 香港の手数料は2から5%。無用な支出とまでは断定できない、という趣旨よ。
  - speaker: tsumugi
    emotion: thinking
    text: でも間にはさんだ会社の約[15%|ジュウゴパーセント]は、働きの対価を超えている。こっちは有罪のままよ。
  - speaker: zundamon
    emotion: thinking
    text: '[15%|ジュウゴパーセント]は、取りすぎ……。'
  - speaker: tsumugi
    emotion: normal
    text: '[一審|いっしん]は、海外のフェアや直輸入の功績も書いていたわね。'
  - speaker: tsumugi
    emotion: thinking
    text: 功績も罪も、舞台は同じ直輸入だったの。
  - speaker: zundamon
    emotion: thinking
    text: あのなぜだは、どうなったの？
  - speaker: tsumugi
    emotion: normal
    text: 弁護側は控訴審で、あのなぜだを持ち出したわ。
  - speaker: tsumugi
    emotion: normal
    text: 当時の心理状態をありのままに表したもの。任務に背く認識は無かった証拠だ、とね。
  - speaker: zundamon
    emotion: surprised
    text: 本当に、分からなかったってこと！？
  - speaker: tsumugi
    emotion: thinking
    text: 高裁は、この主張にも答えを書いているわ。
# ---- 1995年7月20日・上告中の死去と公訴棄却（有罪は確定していない） ----
- id: ch15_shikyo
  title: ''
  background: mt_shinbun
  bgm: 223am
  cuts:
  - speaker: reimu
    text: 岡田は上告します。そして1995年7月20日、上告中に80歳で亡くなりました。
    reading: おかだわ じょうこく します。そして せんきゅうひゃく きゅうじゅうごねん しちがつ はつか、じょうこくちゅうに はちじゅっさいで なくなりました。
  - speaker: reimu
    text: 被告人の死亡で、裁判は公訴棄却に。岡田の有罪は、確定しないままでした。
    reading: ひこくにんの しぼうで、さいばんわ こうそ ききゃくに。おかだの ゆうざいわ、かくてい しない ままでした。
# ---- 論争1：竹久が操った？（「女帝」は呼び名として1回。「愛人」は判決の言葉として1回） ----
- id: ronso1
  title: 操ったのは竹久？
  background: mt_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ 三越を本当に動かしてたのは竹久で、社長は言いなりだったって！
  - speaker: tsumugi
    emotion: normal
    text: '竹久は、三越の女帝と呼ばれたわね。'
  - speaker: tsumugi
    emotion: normal
    text: 岡田が、幹部でも逆らえないほどの力を竹久に持たせた。[一審|いっしん]もそう書いているわ。
  - speaker: zundamon
    emotion: happy
    text: やっぱりなのだ！
  - speaker: tsumugi
    emotion: normal
    text: でも、責任が重いのは岡田のほう。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: '[一審|いっしん]は竹久について、岡田と比べると刑事上の責任には自ら限度があるとしたの。'
  - speaker: tsumugi
    emotion: normal
    text: 判決の言葉では、2人は愛人関係。
  - speaker: zundamon
    emotion: surprised
    text: ……判決には、そう書いてあるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: でも罪になったのは、2人の関係じゃなくてお[金|かね]の流れよ。
  - speaker: tsumugi
    emotion: normal
    text: 仕事の価値より多いお[金|かね]を、社長が親しい女性の会社に流した。その差が罪なの。
  - speaker: tsumugi
    emotion: normal
    text: '竹久は1997年に刑が確定して、服役したわ。'
  - speaker: zundamon
    emotion: thinking
    text: 操られたんじゃなくて、流したのは社長……。
    beat: true
# ---- 論争2：解任は仕組まれた？（「クーデター」は俗説の言葉としてだけ。地の文で「黒幕」「謀略」と言わない） ----
- id: ronso2
  title: 解任は仕組まれた？
  background: mt_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: じゃあ、あの解任は銀行と反対派が仕組んだクーデターだったのだ！
  - speaker: tsumugi
    emotion: normal
    text: そう言われる理由はあるの。
  - speaker: tsumugi
    emotion: normal
    text: メインバンクの相談役が辞任を勧めて、役員への根回しもしたわ。
  - speaker: tsumugi
    emotion: normal
    text: 弁護側も控訴審で、事件は反対派の弁護士らの10年がかりの謀略に始まると訴えたの。
  - speaker: zundamon
    emotion: happy
    text: ほら、やっぱりなのだ！
  - speaker: tsumugi
    emotion: normal
    text: でも、誰が動いたかと罪があったかは別の話よ。
    se: zukko
  - speaker: tsumugi
    emotion: normal
    text: 高裁は、三越の役員や社員の証言を関係者だという一事で全部疑うべきではないとしたの。
  - speaker: tsumugi
    emotion: normal
    text: 社長を降ろしたのは、取締役会の手続き。罪を判断するのは、裁判所よ。
  - speaker: zundamon
    emotion: thinking
    text: 降ろした人と、罪を判断する所は別……。
    beat: true
# ---- 本当の注意点（相談の手順は書かない。「公取委が取り締まる対象」まで） ----
- id: chui
  title: 付き合いと上乗せ
  background: mt_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 1つめ。取引先に付き合いで品物や券を買わされるのは、優越的地位の濫用にあたりうるの。
  - speaker: tsumugi
    emotion: normal
    text: '[公正取引委員会|こうせいとりひきいいんかい]が、取り締まる対象よ。'
  - speaker: tsumugi
    emotion: normal
    text: 公取委の考え方には、協賛金や手伝いの人を出させることも挙がっているわ。
  - speaker: zundamon
    emotion: thinking
    text: 改装の費用を持たされたのも、それなのだ……。
  - speaker: zundamon
    emotion: thinking
    text: 断ったら来年の取引が……って、あの前売券なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 2つめ。間に1社はさむだけの上乗せは、伝票が正しく見えても損になる。
  - speaker: tsumugi
    emotion: normal
    text: 家計なら、紹介料や手数料という名前の上乗せに気づくこと。
  - speaker: zundamon
    emotion: thinking
    text: 伝票は、ちゃんとしてたのに……。
  - speaker: zundamon
    emotion: sad
    text: 1万円が、1万1500円……。
    se: shobon
  - speaker: tsumugi
    emotion: normal
    text: 3つめ。社長でも、取締役会の決議で降ろせるの。
  - speaker: tsumugi
    emotion: normal
    text: 当時も、本人は自分の解任の決議に加われなかったわ。
  - speaker: zundamon
    emotion: surprised
    text: 自分の一票は、無いのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 9月22日も、最後に発議したのは社外の取締役だったわね。
# ---- 現代（数字は報道の1つだけ。日産の元会長は名前を出さず1行） ----
