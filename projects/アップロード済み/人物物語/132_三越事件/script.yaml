meta:
  title: 解任の席で「なぜだ！」と叫んだ三越の社長、37日後に特別背任の疑いで逮捕された【ずんだもん解説】
  slug: mitsukoshi-okada
  hook_line: 「なぜだ！」と叫んだ三越の社長は、本当に理由が分からなかったのか。
  summary: 1982年9月22日、東京・日本橋の三越本店。取締役会で議長の席を譲った社長の岡田茂は、16対0で解任され「なぜだ！」と叫びました。57歳で社長に就いて10年。仕入れの間にはさまれた1つの会社、取引先に回る映画の前売券、そして2か月前の人事の打ち合わせ。叫んだ社長は、本当に理由が分からなかったのか。一審と二審の判決、公正取引委員会の審決、当時の報道を主語を分けて並べ、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 東京高等裁判所 平成5年11月29日判決（昭和63年(う)第266号）全文 https://www.courts.go.jp/assets/hanrei/hanrei-pdf-20224.pdf
  - 裁判所「裁判例結果詳細」（東京高裁 平成5年11月29日判決） https://www.courts.go.jp/hanrei/20224/detail4/index.html
  - 公正取引委員会「優越的地位の濫用に関する独占禁止法上の考え方」（2010年11月30日） https://www.jftc.go.jp/dk/guideline/unyoukijun/yuetsutekichii.html
  - 時事ドットコム「1982年9月22日 三越の岡田茂社長解任、「なぜだ」が流行語に」 https://www.jiji.com/jc/daily?d=0922
  - TIME "Sayonara"（1982年10月4日） https://time.com/archive/6859675/sayonara-2/
  tags:
