# mitsukoshi-okada 読み台帳（人名・地名・社名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある（辞書にある 岡田 を除く）。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 岡田社長・岡田部長・岡田 / label: 専務・社外取締役・竹久・店員・常務・室長・本部長・社員・先輩・新人・
# 取引先・課長・業者・記者・裁判長）・テロップ・章タイトルは表示専用なのでタグを付けていない。
#
# 2026-11-18 台本を書いたあと、セリフ全行を VOICEVOX の audio_query（話者3）にかけた結果:
# - 竹久 はタグなしだと、どの文でも タケヒサ（タケヒササンノ・タケヒサノ・タケヒサエノ・タケヒサニ・タケヒサデ）で1語に読む。
#   [竹久|タケヒサ] は タケ/ヒサ と切れ、[竹久|たけひさ] も「間に〜の会社」「力を〜に」で タケ/ヒサ と切れ、
#   「動かしてたのは〜で」では ノ/ハタケヒサデ と「は」を巻き込んだ。→ セリフはタグなしにし、台帳には入れていない
#   （ナレの「竹久」は reading で読ませる）。発注書はカタカナのタグだったが、実測で切れるので外した。
# - 岡田 は dictionary.yaml に登録済み（オカダ）。タグを重ねると「岡田天皇」が オカダ/テンノオ と切れたので外した。
#   岡田茂（記者・裁判長）はタグなしで オカダ/シゲル。
# - 杉田 は [杉田|スギタ] で スギタワ/カエナキャ/ダメダ（タグなしと同じ）。
# - 伊勢丹 はタグなしで イセタント・イセタンオ。[伊勢丹|いせたん] も [伊勢丹|イセタン] も イセタ/ント と切れた → タグなし。台帳に入れていない。
# - 三越 はタグなしで ミツコシ（ミツコシサンカラ・ミツコシノ ほか全行）。台帳に入れていない（ナレは reading）。
# - 日本橋 はタグなしで ニホンバシホンテン。[日本橋|にほんばし] は ニ/ホンバ/シ と崩れた → タグなし。台帳に入れていない。
# - 特別背任 はタグなしでも [特別背任|とくべつハイニン] でも トクベツ/ハイニン。ひらがなの [特別背任|とくべつはいにん] は
#   トクベツワ/イニン になった（「は」が助詞に化ける）→ 「は」をカタカナにしたタグにした。
# - 仙台へ出せ は シュッセ になった → 仙台へ[出|だ]せ で ダセ。
# - 二割位 はタグなしだと ニワリイ、[二割位|にわりぐらい] は ニ/ワリグライ と切れた → 二割[位|ぐらい] で ニワリグライ/アタリマエジャネエカ。
#   竹久の「15パーセント」の「〜の方の」は [方|ほう]、杉田の「賛成の方は」は [方|カタ]。
# - 買付 は カイズケ になった → [買付|かいつけ]。
# - 「は、はい。」は ワ/ハイ になった → 「……はい。」。
# - 「間に竹久の会社をはさんだ分と」の「分と」が ワカト になった → 「取引と」に言い換えた。
# - 「裁いた所」が タチイタショ になった → 「罪を決めた所」に言い換えた。
# - 優越的地位の濫用 はタグなしで ユウエツテキ/チイノ/ランヨオ。カタカナのタグは ラン/ヨオ と切れた → タグなし。台帳に入れていない。
# - 公正取引委員会 は [公正取引委員会|こうせいとりひきいいんかい] で コオセイ/トリヒキイインカイ（タグなしと同じ）。
# - 公取委（コオトリイ）・燃える秋（モエル/アキ）・オリエント交易（オリエントコオエキ）・女帝（ニョテエ）・誹謗（ヒボオ）・
#   方々（ホオボオ）・東雲（シノノメ）・店出し（ミセダシ）・正味・準直方式（ジュンチョクホオシキ）・原判決（ゲンハンケツ）・
