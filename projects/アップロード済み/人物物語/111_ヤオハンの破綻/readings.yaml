# yaohan-wada 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 和田一夫 / label: 和田カツ・和田光正・岡田元也 ほか）とテロップ・章タイトルは表示専用なのでタグを付けていない。
# 読みに「は」を含む語は、タグをカタカナで書いた（[八百半|ヤオハン]・[橋田壽賀子|ハシダスガコ]・[第一八佰伴|ダイイチヤオハン]）。
# 浦東・淮海路 もカタカナのタグにした（[浦東|プードン]・[淮海路|ワイカイロ]）。
# 2026-11-02 見直し: 無一物中無尽蔵 はタグを付けると ム/ジン/ゾオ に切れ、タグなしなら1語で読むので、タグと台帳の行を外した。
# 同じ見直しで、出せ・章・年（ねん）・16か国・和田（ワダ）は本文の該当箇所だけタグを付けた。
# 和田晃昌（一夫の弟）は読みが事実台帳で確かめられていないので、台本では名前を出さず「弟」「前の社長」と言っている。
# 和田良平（父）も読みが未確認なので、台本では「父」「お父さん」とだけ言っている。
# 何人・何（なん）・金（かね）・ストップ安・驕り・商い は文脈で読みが変わるか一般語なので台帳に入れず、本文の該当箇所だけタグを付けた。
