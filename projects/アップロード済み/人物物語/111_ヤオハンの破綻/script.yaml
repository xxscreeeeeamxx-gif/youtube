  - speaker: reimu
    text: 2日後、上海市と合弁の意向書を交わします。このとき、ヤオハンの借金はもう増え始めていました。
    reading: ふつかご、しゃんはいしと ごうべんの いこうしょお かわします。この とき やおはんの しゃっきんわ もう ふえ はじめて いました。
