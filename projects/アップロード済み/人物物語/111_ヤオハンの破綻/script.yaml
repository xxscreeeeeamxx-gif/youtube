    text: 社長になった和田は、社員の試験を始めます。こんな問題も出ました。
    reading: しゃちょうに なった わだわ、しゃいんの しけんお はじめます。こんな もんだいも でました。
  - speaker: jukensha
    emotion: thinking
    text: 一個五十円のかしわ餅を五千個売りたい。どうすれば良いか……。
  - speaker: jukensha
    emotion: surprised
    text: ……五千個！？
  - speaker: jukensha
