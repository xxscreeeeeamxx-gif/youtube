  background: ya_card_1969
  cuts:
  - speaker: reimu
    text: 1969年6月、ブラジルのサンパウロ。日系人が約70万人いる町に、日本の百貨店は一つもありませんでした。
    reading: せんきゅうひゃく ろくじゅうくねん ろくがつ、ぶらじるの さんぱうろ。にっけいじんが やく ななじゅうまんにん いる まちに、にほんの ひゃっかてんわ ひとつも ありませんでした。
- id: ch3_kutsushita
