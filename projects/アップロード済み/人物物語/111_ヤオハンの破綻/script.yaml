- id: ronso1
  title: おしんのモデル？
  background: ya_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、ネットで見たのだ！ ヤオハンのお母さんは、おしんのモデルだって！
  - speaker: tsumugi
    emotion: normal
    text: 2019年の日経や時事の記事も、カツさんはおしんのモデルとされると書いてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 行商から身を起こして、商売と子育てを両立した。そこが重なると言われたの。
  - speaker: zundamon
    emotion: happy
    text: やっぱり、本物のおしんなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: でも原作者の[橋田壽賀子|ハシダスガコ]さんは、こう言ってるの。
  - speaker: tsumugi
    emotion: thinking
    text: ヒントはいただいたが、モデルはいない。
  - speaker: zundamon
    emotion: surprised
    text: いない！？
  - speaker: tsumugi
    emotion: normal
    text: カツさん本人も、恐れ多い話と答えてたの。
  - speaker: tsumugi
    emotion: normal
    text: '[一夫|かずお]さんも週刊誌で、モデルではないと答えてるわ。'
  - speaker: zundamon
    emotion: surprised
    text: 本人たちが、違うって言ってるのだ！？
  - speaker: tsumugi
    emotion: normal
    text: モデルとされる人は、ほかにもいるの。
  - speaker: tsumugi
    emotion: normal
    text: 言えるのは、モデルの一人と言われたまでね。
  - speaker: zundamon
    emotion: happy
    text: じゃあボクのおばあちゃんも、モデルの一人と言えるのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 言えないわよ。
    se: tsukkomi
- id: ronso2
  title: 中国に広げすぎ？
  background: ya_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 結局、中国に手を広げすぎてつぶれたんでしょ？
  - speaker: tsumugi
    emotion: normal
    text: そう見る人は多いわ。中国に1000店の構想に、見物が8割の上海の店。
  - speaker: tsumugi
    emotion: normal
    text: 台湾の雑誌によると、上海の副市長は[和田|わだ]さんを最初の一羽のペンギンと呼んだの。
  - speaker: zundamon
    emotion: surprised
    text: ペンギン！？
  - speaker: tsumugi
    emotion: normal
    text: 群れの中で、最初に海へ飛び込む一羽のことね。
  - speaker: zundamon
    emotion: thinking
    text: 飛び込みすぎて、おぼれたのだ……。
  - speaker: tsumugi
    emotion: thinking
    text: でも1996年3月の時点で、国内への投融資は371億円。中国は32億円よ。
  - speaker: zundamon
    emotion: surprised
    text: 中国より、日本のほうがずっと多いのだ！？
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 香港と中国のほかの海外は、345億円よ。
  - speaker: tsumugi
    emotion: normal
    text: 市場から集めた623億円のうち、240億円は国内の大型店2つに使われたの。
  - speaker: zundamon
    emotion: surprised
    text: '[小づち|こづち]のお[金|かね]、日本にも使ってたんだ。'
  - speaker: tsumugi
    emotion: normal
    text: 粉飾があったのも、日本の会社の決算よ。
  - speaker: tsumugi
    emotion: normal
    text: 本人も、原因は国内の赤字と手当ての遅れだと言ってたわね。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、日本のせいなのだ？
  - speaker: tsumugi
    emotion: thinking
    text: どっちか一つとは、言い切れないの。
  - speaker: tsumugi
    emotion: normal
    text: 海外の夢と国内の赤字と、株に化ける借金。それが同時に来たのよ。
- id: ronso3
  title: 母が作って息子が潰した？
  background: ya_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: ネットでは、おしんが作って息子が潰したと言われることもあるわ。
  - speaker: zundamon
    emotion: sad
    text: ひどい言い方なのだ……。
  - speaker: tsumugi
    emotion: normal
    text: お母さんが亡くなって歯止めがなくなった、とは本人も書いてるの。
  - speaker: tsumugi
    emotion: normal
    text: でも八百屋をチェーンにして上場させ、世界に広げたのは[一夫|かずお]さんの代よ。
  - speaker: tsumugi
    emotion: normal
    text: 掛け売りをやめたのもブラジルも香港も、お母さんが生きてたころの話。
  - speaker: zundamon
    emotion: surprised
    text: お母さんがいたころから、攻めてたんだ。
  - speaker: tsumugi
    emotion: thinking
    text: 粉飾決算などで有罪になったのは、日本の社長だった弟。
  - speaker: tsumugi
    emotion: thinking
    text: '[一夫|かずお]さんは、起訴されていないわ。'
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、[一夫|かずお]さんは悪くないのだ？
  - speaker: tsumugi
    emotion: thinking
    text: 本人は報告を疑わなかった自分の責任は重い、と書いてたでしょ。
  - speaker: tsumugi
    emotion: normal
    text: 2001年の本の目次には、[驕り|おごり]という[章|しょう]もあるの。
  - speaker: tsumugi
    emotion: normal
    text: 企業は絶頂期が最大の危機、って。
  - speaker: tsumugi
    emotion: normal
    text: 77歳のときの取材で、仲間への不義理を聞かれた[和田|ワダ]さん。
  - speaker: tsumugi
    emotion: normal
    text: 涙を落としてこう答えたと、取材した人が書き残してるの。
  - speaker: tsumugi
    emotion: thinking
    text: いちばん大切な人たちをどうしても裏切れないと思う気持ちが、
  - speaker: tsumugi
    emotion: thinking
    text: 逆にいちばん大切な人たちをもっとも裏切るような結果を招いてしまった。
  - speaker: zundamon
    emotion: sad
    text: ……守りたかったものが、逆になったのだ。
    beat: true
# ---- 本当の注意点 ----
- id: chui
  title: 古い商品券は払い戻せる？
  background: ya_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: sad}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、さっきの商品券よ。
  - speaker: zundamon
    emotion: sad
    text: もう、ただの紙切れなんでしょ……。
  - speaker: tsumugi
    emotion: normal
    text: ヤオハン商品券は、2026年9月30日で使えなくなったの。
  - speaker: zundamon
    emotion: sad
    text: やっぱり……。
  - speaker: tsumugi
    emotion: happy
    text: でも電話で申し出れば、銀行振込で払い戻してもらえるわ。
  - speaker: zundamon
    emotion: surprised
    text: 紙切れが、お[金|かね]に戻るのだ！？
    se: jaan
  - speaker: tsumugi
    emotion: normal
    text: 受け付けるのは、いまのマックスバリュ東海よ。
  - speaker: tsumugi
    emotion: normal
    text: 電話すると封筒と[申出書|もうしでしょ]が届くから、券を書留で送り返すの。
  - speaker: tsumugi
    emotion: thinking
    text: 送り返す締め切りは、2027年2月26日の消印よ。
    telops:
    - {text: "払い戻しは2027年2月26日の消印まで", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: 切手代は、ボク持ち？
  - speaker: tsumugi
    emotion: normal
    text: 切手代も振込の手数料も、会社が持ってくれるわ。
  - speaker: tsumugi
    emotion: thinking
    text: お店のレジでは受け付けないから、気をつけてね。
  - speaker: zundamon
    emotion: surprised
    text: レジに出したら、恥ずかしいやつなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 対象はヤオハンジャパンと[八百半|ヤオハン]デパートの、1000円券と500円券よ。
  - speaker: zundamon
    emotion: happy
    text: 引き出しの奥、もう一回見てくるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 古い商品券が出てきたら、発行した会社の名前で調べてみてね。
# ---- 現代の章 ----
- id: gendai
  title: いまのヤオハン
  background: ya_gendai
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 上海の店は、いまも[第一八佰伴|ダイイチヤオハン]の名前で営業してるわ。
  - speaker: zundamon
    emotion: surprised
    text: 107万人の店が、まだあるの！？
  - speaker: tsumugi
    emotion: normal
    text: 上海の会社のものになって、2005年に赤字を埋めたの。
  - speaker: tsumugi
    emotion: normal
    text: 2015年には、上海の百貨店で売上1位になったわ。
  - speaker: zundamon
    emotion: happy
    text: '[浦東|プードン]の空き地の店が、勝ってたのだ！'
    se: levelup
  - speaker: tsumugi
    emotion: normal
    text: 去年の12月で、開業から30年。
  - speaker: zundamon
    emotion: surprised
    text: 30年……！
  - speaker: tsumugi
    emotion: normal
    text: 上海の店の元のトップは、1階を化粧品売り場にしたのは[和田|わだ]会長の功労だと語ってるの。
  - speaker: tsumugi
    emotion: normal
    text: アメリカの店は元の幹部が買い取って、いまはミツワという店になってるわ。
  - speaker: zundamon
    emotion: thinking
    text: 名前は変わっても、店は続いてるんだ。
  - speaker: zundamon
    emotion: thinking
    text: 日本の会社のほうは、どうなったの？
  - speaker: tsumugi
    emotion: normal
    text: 名前を変えて、いまも続いてるの。マックスバリュ東海よ。
  - speaker: zundamon
    emotion: surprised
    text: つぶれたのに、続いてるの！？
  - speaker: tsumugi
    emotion: normal
    text: 会社更生法で立て直されて、2002年にいまの名前になったの。
  - speaker: tsumugi
    emotion: normal
    text: 浜松が本社の、イオンの子会社よ。2026年2月期の営業収益は3849億円。
  - speaker: zundamon
    emotion: surprised
    text: つぶれたころの売上の、2倍以上なのだ！
  - speaker: tsumugi
    emotion: normal
    text: でもヤオハンって名前の店は、2011年2月に最後の店が看板を替えて姿を消したの。
  - speaker: tsumugi
    emotion: thinking
    text: そして2026年9月、商品券も使えなくなった。名前の最後のかけらね。
  - speaker: zundamon
    emotion: sad
    text: ボクの1000円券が、最後のかけらだったのだ……。
# ---- 締め ----
- id: shime
  title: ''
  background: ya_heya
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 決めたのだ！ この1000円券、払い戻してもらう！
  - speaker: tsumugi
    emotion: happy
    text: えらいじゃない。
  - speaker: zundamon
    emotion: happy
    text: そして戻った千円で、[熱海|あたみ]に八百屋を開くのだ！
  - speaker: tsumugi
    emotion: thinking
    text: いまの千円じゃ、店先にキャベツが数個並ぶだけよ。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: でも1930年の[熱海|あたみ]の八百屋も、元手は千円だったの。
  - speaker: tsumugi
    emotion: normal
    text: 掛け売りをやめるとき、お父さんはこう言って賛成したそうよ。
  - speaker: tsumugi
    emotion: thinking
    text: 1930年に千円で始めた[商い|あきない]だから、千円残れば元々だ。
  - speaker: zundamon
    emotion: thinking
    text: 千円から世界の[16か国|ジュウロッカコク]に広げて、一夜で無一文……。
  - speaker: tsumugi
    emotion: normal
    text: 最後にお詫びの会を開いたのも、始まりの[熱海|あたみ]だったわね。
  - speaker: tsumugi
    emotion: thinking
    text: 成功している時ほどおごりが出て、大事なものが見えない。
  - speaker: tsumugi
    emotion: normal
    text: '[和田|わだ]さんが、亡くなる年のメールに書いた言葉よ。'
  - speaker: zundamon
    emotion: thinking
    text: ……うまくいってる時ほど、足元か。
    beat: true
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
