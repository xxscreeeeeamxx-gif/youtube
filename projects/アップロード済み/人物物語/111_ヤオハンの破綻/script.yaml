    emotion: normal
    text: すみません。この靴下を、1足ください。
  - speaker: tenin
    emotion: thinking
    text: たったそれだけか。もっと買わないか。
  - speaker: zundamon
    emotion: surprised
    text: ……1足で、いいんです。
    beat: true
  - speaker: zundamon
    emotion: thinking
    text: 客に、もっと買えと言う店か……。
  - speaker: zundamon
    emotion: happy
    text: ……ここに、日本の店を出す。
    beat: true
  - speaker: reimu
    text: 店員の一言は和田の回想です。1971年9月、海外1号店が開きます。二度目の失敗の始まりでした。
    reading: てんいんの ひとことわ わだの かいそうです。せんきゅうひゃく ななじゅういちねん くがつ、かいがい いちごうてんが ひらきます。にどめの しっぱいの はじまりでした。
# ---- 1977年・ブラジルの撤退 ----
- id: card1977
  title: ''
  background: ya_card_1977
  bgm: 223am
  cuts:
  - speaker: reimu
    text: 1977年。2年前の金融の引き締めで、ブラジルの会社は行き詰まっていました。
    reading: せんきゅうひゃく ななじゅうななねん。にねんまえの きんゆうの ひきしめで、ぶらじるの かいしゃわ いきづまって いました。
- id: ch3_tettai
