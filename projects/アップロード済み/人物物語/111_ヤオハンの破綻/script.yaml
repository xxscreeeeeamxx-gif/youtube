    reading: きんゆう きかんわ、けいえいの ふとうめいさと つよき いっぺんとうの けいかくに きびしい ちゅうもん。しゃっきんわ うりあげの ろくわりお こえて いました。
# ---- 1993年4月・母の葬儀 ----
