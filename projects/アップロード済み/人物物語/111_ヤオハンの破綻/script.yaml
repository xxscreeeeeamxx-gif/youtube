    text: 1993年1月。和田は、中国でスーパーを1000店つくる構想を発表します。
    reading: せんきゅうひゃく きゅうじゅうさんねん いちがつ。わだわ、ちゅうごくで すーぱーお せんてん つくる こうそうお はっぴょう します。
