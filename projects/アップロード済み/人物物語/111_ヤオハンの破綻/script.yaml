  - speaker: zundamon
    emotion: happy
    text: ここに、とびきり大きな百貨店を建てる。
  - speaker: shanghai
    emotion: thinking
    text: 遠くのクレーンしか、見えませんけど……。
  - speaker: zundamon
    emotion: happy
