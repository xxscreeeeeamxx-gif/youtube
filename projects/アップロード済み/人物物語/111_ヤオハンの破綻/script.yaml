meta:
  title: 上海で107万人を集めたヤオハン会長、倒産で無一文に「生活費は年金だけです」【ずんだもん解説】
  slug: yaohan-wada
  hook_line: 上海で107万人を集めたヤオハンの会長は、なぜ2年後に無一文になったのか。
  summary: 1995年12月、上海。開業したばかりの巨大な百貨店に、その日だけで107万人が押し寄せました。率いていたのは、熱海の八百屋の長男、和田一夫。株価が高いうちは返さなくていい借金。日本の店は弟に任せ、自分は香港へ。そして、歯止めだった母。上り坂の裏で、何が積み上がっていたのか。本人がのちに残した言葉と、経済誌や判決の記録を主語つきで並べて、再現ドラマでたどります。（2026年11月時点）
  sources:
  - マックスバリュ東海「ヤオハン商品券の利用終了のお知らせ」（2026年7月） https://www.mv-tokai.co.jp/wp/wp-content/uploads/2026/07/9d94205e2361e93665fff2ce17277f6e.pdf
  - 日本経済新聞「9月18日 ヤオハンジャパン、会社更生法の適用申請」（2019年9月17日） https://www.nikkei.com/article/DGKKZO49869590X10C19A9EAC000/
  - 日本経済新聞「和田一夫氏が死去 元ヤオハングループ代表」（2019年8月29日） https://www.nikkei.com/article/DGXMZO49138980Z20C19A8CZ8000/
  - 日経ビジネス電子版「ヤオハンはなぜ、倒産してしまったのか」（2019年2月8日） https://business.nikkei.com/atcl/NBD/19/special/00025/
  - マックスバリュ東海「2026年2月期 決算短信」（2026年4月9日） https://www2.jpx.co.jp/disc/81980/081220260407599504_tse-acedjpsm-81980-20260409381980-ixbrl.htm
  - 第一财经「第一八佰伴：见证上海改革开放的商业地标」（2018年9月18日） https://www.yicai.com/news/100028794.html
