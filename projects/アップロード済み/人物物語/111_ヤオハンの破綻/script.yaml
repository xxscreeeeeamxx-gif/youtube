  - speaker: katsu
    emotion: sad
    text: お会いいただけるまで、ここで待たせていただきます。
  - speaker: saikensha
    emotion: angry
    text: ……雨だぞ。
  - speaker: katsu
    emotion: sad
    text: ……はい。
