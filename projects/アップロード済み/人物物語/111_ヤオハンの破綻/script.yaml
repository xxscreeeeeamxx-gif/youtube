  - speaker: zundamon
    emotion: happy
    text: 母さん。アメリカでは、スーパーが町ごとにチェーンになってました。
  - speaker: katsu
    emotion: thinking
    text: 去年の視察のツアーは、とっくに終わってたでしょうに。
  - speaker: zundamon
    emotion: happy
    text: 一人で3か月残って、向こうの店を見て回ったんです。
  - speaker: katsu
    emotion: surprised
    text: 3か月も！？
  - speaker: zundamon
    emotion: happy
    text: 日本一の八百屋は、もうやめます。
  - speaker: katsu
    emotion: surprised
    text: やめる！？
  - speaker: zundamon
    emotion: happy
    text: 日本一の、スーパーのチェーンを作ります。
  - speaker: katsu
    emotion: thinking
    text: ……夢だけは、昔から大きいのよね。
    beat: true
- id: ch3_shiken
