    text: 1962年7月。父が退き、33歳の和田一夫が社長に就きます。
    reading: せんきゅうひゃく ろくじゅうにねん しちがつ。ちちが しりぞき、さんじゅうさんさいの わだ かずおが しゃちょうに つきます。
