    emotion: normal
    text: '[和田|わだ]さん。こちらが、[浦東|プードン]の土地です。'
  - speaker: shanghai
    emotion: thinking
    text: ……ご覧のとおり、まだ何もありません。
  - speaker: shanghai
    emotion: normal
    text: お勧めは、川の向こうの[淮海路|ワイカイロ]です。もう街ができていますから。
  - speaker: zundamon
    emotion: thinking
    text: 向こうは、もう出来上がった街ですね。
  - speaker: zundamon
    emotion: happy
    text: 何も無いから、いいんです。
