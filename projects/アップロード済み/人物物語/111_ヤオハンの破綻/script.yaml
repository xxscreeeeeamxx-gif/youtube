  - speaker: reimu
    text: それでも和田は、1979年にアメリカ、1984年には香港に店を出します。
    reading: それでも わだわ せんきゅうひゃく ななじゅうくねんに あめりか、せんきゅうひゃく はちじゅうよねんにわ ほんこんに みせお だします。
# ---- 1990年・山の上の音楽会 ----
- id: card1990
  title: ''
  background: ya_card_1990
  bgm: you_and_me
  cuts:
  - speaker: reimu
    text: 1990年。本部とともに家族で香港へ移った和田は、このころ山の上の豪邸を手に入れます。
    reading: せんきゅうひゃく きゅうじゅうねん。ほんぶと ともに かぞくで ほんこんえ うつった わだわ、この ころ やまの うえの ごうていお てに いれます。
- id: ch4_peak
  title: 山の上の音楽会
  background: ya_peak
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 和田一夫, emotion: happy}
  - {who: shain, x: 0.7, emotion: surprised}
  cuts:
  - speaker: shain
    emotion: surprised
    text: 会長、この部屋……椅子が100もありますよ。
  - speaker: zundamon
    emotion: happy
    text: ここで、音楽会を開くんだ。オペラも呼ぶぞ。
  - speaker: shain
    emotion: thinking
    text: '[熱海|あたみ]の八百屋が、オペラ……。'
  - speaker: zundamon
    emotion: happy
    text: 八百屋だって、山の上で歌を聴いていいだろう。
  - speaker: shain
    emotion: thinking
    text: ……休憩のときに、キャベツの値段の話は抜きでお願いします。
    se: zukko
  - speaker: zundamon
    emotion: happy
    text: 元は、銀行の公邸だった家だぞ。窓の下は、香港の港だ。
  - speaker: zundamon
    emotion: happy
    text: 母には、そんな贅沢をしてはいけないと言われたがな。
  - speaker: shain
    emotion: normal
    text: 日本からは、ずいぶん遠くなりましたね。
  - speaker: zundamon
    emotion: happy
    text: 遠いほうがいい。ここは、自由だ。
  - speaker: reimu
    text: 香港では2年で12社を買い、600億円から700億円を使ったと経済誌は書いています。
