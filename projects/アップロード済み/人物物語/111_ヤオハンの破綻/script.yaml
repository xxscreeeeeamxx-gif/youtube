  - {who: katsu, x: 0.7, emotion: angry}
  cuts:
  - speaker: zundamon
    emotion: sad
    text: 母さん。ブラジルからは、引き揚げます。
  - speaker: katsu
    emotion: angry
    text: 撤退には、反対よ。
  - speaker: zundamon
    emotion: sad
    text: もう、お[金|かね]が回らないんです。
  - speaker: katsu
    emotion: angry
    text: それでも、反対。
  - speaker: zundamon
    emotion: sad
    text: ……6年かけた、海外の1号店なんです。私だって。
  - speaker: katsu
    emotion: thinking
    text: ……だったら、債権者の皆さんの所を一軒ずつ回るわよ。
  - speaker: reimu
    text: 反対もむなしく、会社は清算に。カツも、約1300件の債権者を回りました。
    reading: はんたいも むなしく、かいしゃわ せいさんに。かつも、やく せんさんびゃっけんの さいけんしゃお まわりました。
- id: ch3_ame
  title: ''
  background: ya_ame
