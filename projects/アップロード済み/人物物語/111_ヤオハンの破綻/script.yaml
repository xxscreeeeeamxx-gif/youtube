scenes:
# ---- 先出し（1995年12月20日・上海の開業の日） ----
- id: co_shanghai
  title: ''
  background: ya_shanghai
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 和田一夫, emotion: thinking}
  - {who: shain, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1995年12月20日、上海。巨大な百貨店が開業しました。
    reading: せんきゅうひゃく きゅうじゅうごねん じゅうにがつ はつか、しゃんはい。きょだいな ひゃっかてんが かいぎょう しました。
  - speaker: shain
    emotion: happy
    text: 会長！ 開業の日の来店客、数が出ました！
  - speaker: zundamon
    emotion: thinking
    text: ……[何人|なんにん]、入った。
  - speaker: shain
    emotion: surprised
    background: ya_shanghai_gunshu
    text: 107万人です！ 世界記録に、なるかもしれません！
  - speaker: zundamon
    emotion: surprised
    text: 107万……！
  - speaker: zundamon
    emotion: happy
    text: '[熱海|あたみ]の八百屋が、上海で107万人か。'
  - speaker: reimu
    text: この男は、和田一夫。ヤオハングループを率いる66歳です。
    reading: この おとこわ、わだ かずお。やおはん ぐるーぷお ひきいる ろくじゅうろくさいです。
  - speaker: reimu
    text: 1年9か月後、日本のヤオハンは会社更生法を申請。負債1613億円。68歳の和田は一夜にして無一文に。
    reading: いちねん きゅうかげつご、にほんの やおはんわ かいしゃ こうせいほうお しんせい。ふさい せんろっぴゃく じゅうさんおくえん。ろくじゅうはっさいの わだわ いちやに して むいちもんに。
    telops:
    - {text: "負債1613億円・68歳で無一文", size: lg, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
# ---- 今の部屋（引き出しの商品券） ----
- id: hook
  title: ''
  background: ya_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ 引き出しの奥から、商品券が出てきたのだ！
    se: jaan
  - speaker: tsumugi
    emotion: normal
    text: どこの？
  - speaker: zundamon
    emotion: happy
    text: ヤオハンの1000円券！ 今夜はごちそうだ！
  - speaker: tsumugi
    emotion: thinking
    text: ヤオハンって名前のお店、もう無いわよ。
  - speaker: tsumugi
    emotion: normal
    text: '[熱海|あたみ]の八百屋が、本人の話では世界の[16か国|ジュウロッカコク]まで広がった会社なの。'
  - speaker: tsumugi
    emotion: thinking
    text: でも上海で107万人を集めた2年後に、率いた[和田一夫|わだかずお]は無一文になったのよ。
    telops:
    - {text: "なぜ107万人の2年後に無一文？", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 2年後に無一文！？ なんでなのだ！？
# ---- 1986年・株に化ける借金 ----
- id: ch1_kabu
  title: 株に化ける借金
  background: ya_kaigi
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 和田一夫, emotion: normal}
  - {who: zaimu, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1986年。ヤオハンは、東証一部に上場します。社長は和田一夫、57歳です。
    reading: せんきゅうひゃく はちじゅうろくねん。やおはんわ、とうしょう いちぶに じょうじょう します。しゃちょうわ わだ かずお、ごじゅうななさいです。
  - speaker: zaimu
    emotion: normal
    text: 社長。上場したので、社債でお[金|かね]を集められます。
  - speaker: zundamon
    emotion: thinking
    text: 社債って、要は借金だろう。
  - speaker: zaimu
    emotion: normal
    text: はい。ただこの社債は、決まった値段でうちの株に替えられるんです。
  - speaker: zundamon
    emotion: surprised
    text: 株に？
  - speaker: zaimu
    emotion: normal
    text: 株価が高ければ、持ち主は株に替えます。そうなれば、現金で返さなくていい。
  - speaker: zundamon
    emotion: surprised
    text: 返さなくて、いい……！？
  - speaker: zaimu
    emotion: happy
    text: 株価が上がっているかぎり、借金が株に化けるんです。
  - speaker: zundamon
    emotion: happy
    text: 打ち出の[小づち|こづち]だな！
    se: hirameki
  - speaker: zundamon
    emotion: happy
    background: ya_kaigi_up
    text: よし、どんどん[出|だ]せ。そのお[金|かね]で、店を建てまくるぞ！
  - speaker: zaimu
    emotion: thinking
    text: ……株価が、下がらなければですけど。
    beat: true
  - speaker: zundamon
    emotion: happy
    text: 下がるもんか。ヤオハンは、これから伸びるんだ。
  - speaker: reimu
    text: この借金は、株価が下がると、現金の借金に戻ります。
    reading: この しゃっきんわ かぶかが さがると、げんきんの しゃっきんに もどります。
  - speaker: reimu
    text: 10年後、117億円を現金で返す日が来ます。1年の純利益の、約20年分です。
    reading: じゅうねんご、ひゃく じゅうななおくえんお げんきんで かえす ひが きます。いちねんの じゅんりえきの、やく にじゅうねんぶんです。
    telops:
    - {text: "117億円＝純利益の約20年分", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: 年収の20年分を、来月まとめて返せと言われた家です。上海で107万人を集めた、翌年のことでした。
    reading: ねんしゅうの にじゅうねんぶんお、らいげつ まとめて かえせと いわれた いえです。しゃんはいで ひゃくななまんにんお あつめた、よくねんの ことでした。
# ---- 1989年・役員会で突然 ----
- id: ch1_yakuin
  title: 役員会で突然
  background: ya_yakuin
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 和田一夫, emotion: normal}
  - {who: yakuin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1989年。日本の会社の役員会です。
    reading: せんきゅうひゃく はちじゅうくねん。にほんの かいしゃの やくいんかいです。
  - speaker: zundamon
    emotion: normal
    text: 今日は、一つ発表がある。
  - speaker: yakuin
    emotion: normal
    text: 新しいお店の件ですか。
  - speaker: zundamon
    emotion: normal
    text: 日本の会社の社長は、弟に任せる。
    se: don
  - speaker: yakuin
    emotion: surprised
    text: ……い、今この場でですか！？
  - speaker: zundamon
    emotion: happy
    text: 私は、香港へ行く。
  - speaker: yakuin
    emotion: surprised
    text: 香港！？
  - speaker: zundamon
    emotion: happy
    text: 向こうに会社を作って、そこから世界をやる。
  - speaker: yakuin
    emotion: thinking
    text: 世界を、やる……。
  - speaker: yakuin
    emotion: thinking
    text: 日本の店は、弟さんに丸投げですか。
    beat: true
  - speaker: reimu
    text: 社長の交代は役員会の席で突然発表された、と経済誌は書いています。
    reading: しゃちょうの こうたいわ やくいんかいの せきで とつぜん はっぴょう された、と けいざいしわ かいて います。
  - speaker: reimu
    text: 8月、和田は香港に持株会社を作ります。天安門事件の直後でしたが、本人はチャンスと見たと語っています。
    reading: はちがつ、わだわ ほんこんに もちかぶ がいしゃお つくります。てんあんもん じけんの ちょくごでしたが、ほんにんわ ちゃんすと みたと かたって います。
# ---- 1989〜1990年・銀行の反対 ----
- id: ch1_ginko
  title: 銀行の反対を押し切る
  background: ya_ginko
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 和田一夫, emotion: normal}
  - {who: ginko, x: 0.7, emotion: thinking}
  cuts:
  - speaker: ginko
    emotion: thinking
    text: '[和田|わだ]さん。グループの本部まで香港へ移すというのは、本気ですか。'
  - speaker: zundamon
    emotion: normal
    text: 本気です。香港は規制が無くて、自由です。
  - speaker: zundamon
    emotion: happy
    text: 税も有利で、[華僑|かきょう]の情報が集まる。
  - speaker: ginko
    emotion: thinking
    text: 当行としては、香港への進出には反対です。
  - speaker: zundamon
    emotion: surprised
    text: ……反対、ですか。
  - speaker: zundamon
    emotion: normal
    text: 日本の店は、弟に任せてあります。
  - speaker: ginko
    emotion: angry
    text: ……それでも、反対です。
  - speaker: zundamon
    emotion: happy
    text: もう、決めたことです。
  - speaker: ginko
    emotion: sad
    text: ……そうですか。
    beat: true
  - speaker: reimu
    text: 1990年5月、本部は香港へ。この移転を境に金融機関との関係は冷え込んだ、と経済誌は書いています。
    reading: せんきゅうひゃく きゅうじゅうねん ごがつ、ほんぶわ ほんこんえ。この いてんお さかいに きんゆう きかんとの かんけいわ ひえこんだ、と けいざいしわ かいて います。
  - speaker: reimu
    text: その冷えが、7年後に響きます。
    reading: その ひえが、ななねんごに ひびきます。
# ---- 母という歯止め ----
- id: ch1_haha
  title: ''
  background: ya_hk_office
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.4, flip: true, tag: 和田一夫, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 和田には、歯止めになる母がいました。1993年に亡くなるカツについて、本人はのちにこう書いています。
    reading: わだにわ、はどめに なる ははが いました。せんきゅうひゃく きゅうじゅうさんねんに なくなる かつに ついて、ほんにんわ のちに こう かいて います。
  - speaker: zundamon
    emotion: sad
    text: 特に、93年に母のカツが亡くなると、歯止めをかける人もいない。
    telops:
    - {text: "和田「歯止めをかける人もいない」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: reimu
    text: 歯止めの母を失った男は、2年後に上海で107万人を集め、その2年後に無一文になります。
    reading: はどめの ははお うしなった おとこわ にねんごに しゃんはいで ひゃくななまんにんお あつめ、その にねんごに むいちもんに なります。
# ---- 1930年・熱海の八百屋 ----
- id: card1930
  title: ''
  background: ya_card_1930
  cuts:
  - speaker: reimu
    text: 1930年12月、和田一夫の両親が熱海で八百屋を開きます。元手は千円。旅館相手の行商からでした。
    reading: せんきゅうひゃく さんじゅうねん じゅうにがつ、わだ かずおの りょうしんが あたみで やおやお ひらきます。もとでわ せんえん。りょかん あいての ぎょうしょうからでした。
# ---- 1950年・焼け跡の軒下 ----
- id: ch2_taika
  title: 焼け跡の軒下
  background: ya_yaoya
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 和田一夫, emotion: sad}
  - {who: katsu, x: 0.7, emotion: angry}
  cuts:
  - speaker: reimu
    text: 1950年4月13日、熱海の大火。和田の店と家は、すべて焼けました。
    reading: せんきゅうひゃく ごじゅうねん しがつ じゅうさんにち、あたみの たいか。わだの みせと いえわ、すべて やけました。
  - speaker: katsu
    emotion: angry
    background: ya_yakeato
    text: '[一夫|かずお]！ 火災保険を増やす話は、どうなってたの！'
  - speaker: zundamon
    emotion: sad
    text: ……間に合いませんでした。
  - speaker: katsu
    emotion: angry
    text: 間に合わなかったじゃ、済まないのよ！
    se: tsukkomi
  - speaker: zundamon
    emotion: sad
    text: ……すみません。
  - speaker: reimu
    text: 息子たちがかばい合う姿を見て、カツは考えを改めます。
    reading: むすこたちが かばいあう すがたお みて、かつわ かんがえお あらためます。
  - speaker: katsu
    emotion: thinking
    text: ……仕入れ先には、今月の分をきちんと払うわよ。
  - speaker: zundamon
    emotion: surprised
    text: でも向こうは、今月の勘定は棚上げでいいって……。
  - speaker: katsu
    emotion: normal
    text: いいと言われても、払うの。
  - speaker: zundamon
    emotion: surprised
    text: 40軒近く、あるんですよ！？
  - speaker: katsu
    emotion: normal
    text: 預金をおろせば、払えるわ。
  - speaker: zundamon
    emotion: thinking
    text: 店も家も、焼けたのに……？
  - speaker: katsu
    emotion: happy
    text: 無一物中無尽蔵よ。何も無くなっても、尽きないものはあるの。
    beat: true
  - speaker: reimu
    text: 和田はのちに、自分の人生をこう語っています。
    reading: わだわ のちに、じぶんの じんせいお こう かたって います。
  - speaker: zundamon
    emotion: thinking
    text: 私は人生において三度の失敗をした。
  - speaker: zundamon
    emotion: thinking
    text: 一度目は[熱海|あたみ]の大火、二度目はブラジルヤオハンの撤退、
  - speaker: zundamon
    emotion: sad
    text: そして三度目はヤオハンジャパンの倒産であった。
  - speaker: reimu
    text: 一度目の失敗は、母が支えました。三度目のとき、母はもういません。
    reading: いちどめの しっぱいわ、ははが ささえました。さんどめの とき、ははわ もう いません。
# ---- 1956年・掛け売りをやめる日 ----
- id: ch2_kakeuri
  title: 掛け売りをやめる日
  background: ya_yaoya
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 和田一夫, emotion: normal}
  - {who: ryokan, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1956年11月1日。和田の店は旅館への掛け売りをやめ、現金で値札どおりに売り始めます。
    reading: せんきゅうひゃく ごじゅうろくねん じゅういちがつ ついたち。わだの みせわ りょかんえの かけうりお やめ、げんきんで ねふだ どおりに うり はじめます。
  - speaker: ryokan
    emotion: normal
    text: '[八百半|ヤオハン]さん。いつもの野菜、今月も掛けで頼むよ。'
  - speaker: zundamon
    emotion: normal
    text: 申し訳ありません。今日から、現金でお願いします。
  - speaker: ryokan
    emotion: surprised
    text: 現金！？ うちはずっと、掛けでやってきたじゃないか。
  - speaker: zundamon
    emotion: normal
    text: 母に勧められて、商売の勉強会で講演を聞いてきたんです。
  - speaker: ryokan
    emotion: thinking
    text: それで、なんで現金になるんだい。
  - speaker: zundamon
    emotion: normal
    text: 値段も、値札どおりです。値引きの相談も、なしです。
  - speaker: ryokan
    emotion: angry
    text: 八百屋が、旅館に向かって値札どおり！？
  - speaker: zundamon
    emotion: normal
    text: どのお客さんにも、同じ値段で売ります。
  - speaker: ryokan
    emotion: angry
    text: ……じゃあ、よそで買うよ。
  - speaker: zundamon
    emotion: sad
    text: ……いちばんのお得意さんが。
    beat: true
  - speaker: reimu
    text: 一部の旅館には断られましたが、1日の売上は10万円から、4年で100万円に伸びます。
    reading: いちぶの りょかんにわ ことわられましたが、いちにちの うりあげわ じゅうまんえんから よねんで ひゃくまんえんに のびます。
# ---- 1962年・33歳の社長 ----
