meta:
  title: 「グローバルで100％」とEVに賭けたホンダ、その結果は初の営業赤字【ずんだもん解説】
  slug: honda-ev-sanbe
  hook_line: 2040年に新車をすべてEV・FCVに。ホンダはなぜ5年で取り下げたのか。
  summary: 2021年4月、社長に就いたばかりのホンダの三部敏宏は、2040年に世界で売る新車をすべてEVと燃料電池車にすると宣言しました。規制と補助金、そして将来世代への責務。その前提の上に、GM・LG・ソニーとの提携と、10年で約10兆円の計画が積み上がっていきます。5年後、ホンダはEV3車種の中止を発表しました。50年前、宣言して勝ったCVCCと何が違ったのか。会社の言葉と報道を並べて、再現ドラマでたどります。（2026年10月時点）
  sources:
  - ホンダ「社長就任会見 代表取締役社長 三部敏宏スピーチ概要」（2021年4月23日） https://global.honda/jp/news/2021/c210423.html
  - ホンダ「四輪電動化戦略の見直しに伴う損失の発生および通期連結業績予想の修正と今後の方向性について」（2026年3月12日） https://global.honda/jp/news/2026/c260312.html
  - ホンダ「2026年3月期 決算説明会」（2026年5月14日） https://global.honda/jp/investors/library/financialresult/main/00/teaserItems1/01117/linkList/03/link/FYE202603_4Q_financial_presentation_script_j_1.pdf
  - ホンダ「2026 ビジネスアップデート 説明概要」（2026年5月14日） https://global.honda/jp/news/2026/c260514b.html
  - Honda 75年史「CVCCエンジン」 https://global.honda/jp/guide/history-digest/75years-history/chapter3/section2_3/
  - 共同通信「ホンダ社長、脱ガソリン車目標を取り下げ」（2026年5月14日） https://www.saga-s.co.jp/articles/-/1708127
  tags:
  - ホンダ
  - 三部敏宏
  - EV
  - 電気自動車
  - 脱エンジン
  - ハイブリッド
  - 本田宗一郎
  - CVCC
  - マスキー法
  - 日産
  - ソニー・ホンダモビリティ
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
