scenes:
- id: co_kaiken
  title: ''
  background: hd_kaiken
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 三部敏宏, emotion: thinking}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2026年3月12日。ホンダの社長、三部敏宏が会見を開きます。
    reading: にせん にじゅうろくねん さんがつ じゅうににち。ほんだの しゃちょう みべ としひろが かいけんお ひらきます。
  - speaker: zundamon
    emotion: thinking
    text: この3モデルを事業成立が困難な状況のまま世に送り出すことは、
  - speaker: zundamon
    emotion: thinking
    text: 会社の将来にとっても最善ではないと、断腸の想いで決断を下しました。
    telops:
    - {text: "三部「断腸の想いで決断を下しました」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: kisha
    emotion: surprised
    text: 発売前のEVを、3車種も……！？
  - speaker: reimu
    text: 北米向けのEV3車種の、開発と発売の中止。損失は最大2兆5000億円と見込みました。
    reading: ほくべい むけの いーぶい さんしゃしゅの かいはつと はつばいの ちゅうし。そんしつわ さいだい にちょう ごせんおくえんと みこみました。
  - speaker: reimu
    text: 5年前。この会社は、2040年に売る新車をすべてEVと燃料電池車にすると宣言していました。
    reading: ごねんまえ。この かいしゃわ にせん よんじゅうねんに うる しんしゃお すべて いーぶいと ねんりょう でんちしゃに すると せんげん して いました。
  - speaker: reimu
    text: なぜ、5年でこうなったのでしょう。
    reading: なぜ ごねんで こう なったのでしょう。
- id: hook
  title: ''
  background: hd_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 次の車はEVなのだ！ ホンダのゼロのSUVなのだ！
  - speaker: tsumugi
    emotion: normal
    text: そのEV、ホンダは3車種やめたのよ。
  - speaker: zundamon
    emotion: surprised
    text: えっ！？ まだ免許も取ってないのに！
  - speaker: tsumugi
    emotion: thinking
    text: 心配する順番が逆よ。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: 2040年に全部EVって宣言してたのにね。
  - speaker: zundamon
    emotion: surprised
    text: 宣言したのに、なんでやめたのだ！？
- id: card2021
  title: ''
  background: hd_card_2021
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 2021年4月23日。社長に就いて3週間の三部敏宏が、就任会見に立ちます。
    reading: にせん にじゅういちねん しがつ にじゅうさんにち。しゃちょうに ついて さんしゅうかんの みべ としひろが、しゅうにん かいけんに たちます。
  - speaker: reimu
    text: 1987年入社。エンジン開発を中心に歩んできた技術者です。
    reading: せんきゅうひゃく はちじゅうななねん にゅうしゃ。えんじん かいはつお ちゅうしんに あゆんで きた ぎじゅつしゃです。
- id: sengen
  title: 2040年に100％
  background: hd_kaiken
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 三部敏宏, emotion: normal}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: '[Honda|ホンダ]は幅広い製品を提供するモビリティカンパニーであり、'
  - speaker: zundamon
    emotion: normal
    text: 世界一のパワーユニットメーカーでもあります。
  - speaker: zundamon
    emotion: normal
    text: 先進国全体でのEV・FCVの販売比率を、2030年に40％。
  - speaker: zundamon
    emotion: normal
    text: 2035年には80％。
  - speaker: zundamon
    emotion: normal
    text: 2040年には、グローバルで100％を目指します。
    telops:
    - {text: "三部「2040年には、グローバルで100％」", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: kisha
    emotion: surprised
    text: ひゃ、100％！？ ハイブリッドも入れずに？
    se: bikkuri
  - speaker: zundamon
    emotion: normal
    text: 今日時点では狙いがボケないように、あえてEV・FCVという言い方をしました。
  - speaker: kisha
    emotion: thinking
    text: 19年で100％……根拠は？
  - speaker: zundamon
    emotion: normal
    text: クルマは約10年間使用される。
  - speaker: zundamon
    emotion: normal
    text: 2050年のカーボンニュートラルを実現するためには、
  - speaker: zundamon
    emotion: normal
    text: その10年前の段階で新車のカーボンニュートラルを達成する必要がある。
  - speaker: kisha
    emotion: surprised
    text: 50年から逆算して、40年か……。
  - speaker: reimu
    text: 2040年に100％という目標を、三部は5年後に自分の口で取り下げます。
    reading: にせん よんじゅうねんに ひゃくぱーせんとと いう もくひょうお、みべわ ごねんごに じぶんの くちで とりさげます。
- id: hashira
  title: 規制と補助金という柱
  background: hd_denchi
  bgm: curious
  stage:
  - {who: yakuin, x: 0.28, flip: true, emotion: normal}
  - {who: kenkyu, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 翌2022年。アメリカで、EVの追い風になる決まりが2つ生まれます。
    reading: よく にせん にじゅうにねん。あめりかで いーぶいの おいかぜに なる きまりが ふたつ うまれます。
  - speaker: yakuin
    emotion: normal
    text: アメリカで、EVを買う人に1台最大7500ドルの税の控除が決まった。
  - speaker: kenkyu
    emotion: happy
    text: 7500ドル！ ボクにもください！
  - speaker: yakuin
    emotion: thinking
    text: 買う人がもらうんだ。お前は作る側だ。
    se: hammer
  - speaker: yakuin
    emotion: normal
    text: カリフォルニア州は、2035年に新車を全部ゼロエミッションにすると決めた。
  - speaker: kenkyu
    emotion: normal
    text: 守れなかったら？
  - speaker: yakuin
    emotion: normal
    text: '[未達|みたつ]なら、1台あたり最大2万ドルが科される。'
  - speaker: kenkyu
    emotion: surprised
    text: 1ドル150円なら、1台で300万円！？
    telops:
    - {text: "未達なら1台最大2万ドル", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: yakuin
    emotion: normal
    text: 補助金がアメで、罰金がムチだ。どっちもEVを売れと言っている。
  - speaker: kenkyu
    emotion: normal
    text: うちのEVの計画は、このアメとムチが前提なんですね。
  - speaker: yakuin
    emotion: normal
    text: そうだ。規制と補助金、この2本が柱だ。
  - speaker: yakuin
    emotion: normal
    text: GMも2035年までに、排出ゼロを目指すと言っている。
  - speaker: kenkyu
    emotion: thinking
    text: みんな、同じ方向を向いてますね。
  - speaker: yakuin
    emotion: normal
    text: だから会社は、この柱の上に積む。
  - speaker: yakuin
    emotion: normal
    text: GMとは、数百万台規模のEVの共同開発。LGとは、オハイオに約44億ドルの電池工場。
  - speaker: yakuin
    emotion: normal
    text: ソニーとは、折半で新しいモビリティの会社だ。
  - speaker: kenkyu
    emotion: thinking
    text: 全部、同じ1本の前提に乗ってますね。EVが売れる、っていう。
  - speaker: kenkyu
    emotion: thinking
    text: もし柱が倒れたら、どうなるんです？
  - speaker: yakuin
    emotion: happy
    text: どっちも、国と州が決めたことだ。そう簡単には倒れない。
    beat: true
  - speaker: reimu
    text: 規制と補助金の2本の柱は、のちに半年で両方なくなります。
    reading: きせいと ほじょきんの にほんの はしらわ、のちに はんとしで りょうほう なくなります。
  - speaker: reimu
    text: 3本目の柱は、将来世代への責務でした。三部がそれを語り直すのは、5年後にEV3車種を止める日です。
    reading: さんぼんめの はしらわ しょうらい せだいえの せきむでした。みべが それお かたりなおすのわ、ごねんごに いーぶい さんしゃしゅお とめる ひです。
- id: card1971
  title: ''
  background: hd_card_1971
  bgm: pop
  cuts:
  - speaker: reimu
    text: ホンダには、50年前にも大きな宣言をした日がありました。
    reading: ほんだにわ ごじゅうねん まえにも おおきな せんげんお した ひが ありました。
  - speaker: reimu
    text: 1971年。アメリカでは前の年の暮れ、排出ガスを10分の1にせよというマスキー法が発効していました。
    reading: せんきゅうひゃく ななじゅういちねん。あめりかでわ まえの としの くれ、はいしゅつ がすお じゅうぶんの いちに せよと いう ますきーほうが はっこう して いました。
- id: cvcc
  title: 50年前の宣言
  background: hd_kenkyujo
  stage:
  - {who: gishi, x: 0.28, flip: true, emotion: surprised}
  - {who: soichiro, x: 0.7, emotion: normal}
  cuts:
  - speaker: gishi
    emotion: surprised
    text: 社長、本当に発表するんですか！？
  - speaker: soichiro
    emotion: normal
    text: 1975年の規制値を満足させるエンジンの、めどが立った。
  - speaker: soichiro
    emotion: happy
    text: 1973年から商品化する。そう発表する。
  - speaker: gishi
    emotion: surprised
    text: めどは立ちましたけど、まだ研究の途中です！
  - speaker: gishi
    emotion: surprised
    text: 特許の申請も、途中ですよ！
  - speaker: gishi
    emotion: thinking
    text: アメリカの大手3社が、達成するのは不可能だと言ってる規制ですよ！
  - speaker: soichiro
    emotion: normal
    text: じゃあ、いつなら完成だ。
  - speaker: gishi
    emotion: thinking
    text: ……もう少し、です。
  - speaker: soichiro
    emotion: angry
    text: それだ。
    beat: true
  - speaker: soichiro
    emotion: normal
    text: '[君|きみ]たちに聞いても、もうこれで完成したとはいつまでたっても言うはずがない。'
  - speaker: soichiro
    emotion: angry
    text: それを待っていたのでは、会社がつぶれる。
    telops:
    - {text: "宗一郎「待っていたのでは会社がつぶれる」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#CC5500", anim: up}
  - speaker: gishi
    emotion: sad
    text: 2階に上げて、はしごを外す気だ……。
    beat: true
  - speaker: reimu
    text: 2月12日、経団連会館。宗一郎は、めどが立ったと発表します。
    reading: にがつ じゅうににち けいだんれん かいかん。そういちろうわ めどが たったと はっぴょう します。
  - speaker: reimu
    text: 1972年12月。CVCCエンジンは、アメリカの環境保護庁のテストに臨みます。
    reading: せんきゅうひゃく ななじゅうにねん じゅうにがつ。しーぶいしーしー えんじんわ、あめりかの かんきょう ほごちょうの てすとに のぞみます。
    background: hd_test
  - speaker: gishi
    emotion: happy
    text: 合格です！ [マスキー法|ますきーほう]の、合格第1号です！
    se: levelup
  - speaker: soichiro
    emotion: happy
    text: よし。
  - speaker: reimu
    text: 技術は、トヨタやフォードなどにも提供されました。翌年の12月には、シビックCVCCが発売されます。
    reading: ぎじゅつわ とよたや ふぉーど などにも ていきょう されました。よくねんの じゅうにがつにわ しびっく しーぶいしーしーが はつばい されます。
- id: cvcc_chigai
  title: ''
  background: hd_test
  cuts:
  - speaker: reimu
    text: このとき規制は、もう法律として発効していました。間に合わせたのは、手元のエンジンの改良です。
    reading: この とき きせいわ、もう ほうりつと して はっこう して いました。まに あわせたのわ、てもとの えんじんの かいりょうです。
  - speaker: reimu
    text: 2021年の宣言が賭けたのは、これから続くはずの規制と補助金。そして、まだない市場でした。
    reading: にせん にじゅういちねんの せんげんが かけたのわ、これから つづく はずの きせいと ほじょきん。そして まだ ない しじょうでした。
  - speaker: reimu
    text: 同じ宣言でも、立っている地面が違いました。その地面は、どう崩れたのでしょう。
    reading: おなじ せんげんでも たって いる じめんが ちがいました。その じめんわ どう くずれたのでしょう。
- id: gm2023
  title: GMとの安いEVをやめる
  background: hd_kaiken
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 三部敏宏, emotion: normal}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2023年10月。三部はブルームバーグの取材に、GMとの量販価格帯のEVの共同開発をやめたと明かします。
    reading: にせん にじゅうさんねん じゅうがつ。みべわ ぶるーむばーぐの しゅざいに、じーえむとの りょうはん かかくたいの いーぶいの きょうどう かいはつお やめたと あかします。
  - speaker: kisha
    emotion: normal
    text: 3万ドル前後の、安いEVの計画でしたよね。
  - speaker: zundamon
    emotion: thinking
    text: コストや商品性を考えて、この段階ではビジネス化は難しいと判断した。
  - speaker: kisha
    emotion: thinking
    text: では、2040年の100％は？
  - speaker: reimu
    text: 目標は、動かしませんでした。見直しの節目は3回あり、これが1回目です。
    reading: もくひょうわ うごかしませんでした。みなおしの ふしめわ さんかい あり、これが いっかいめです。
  - speaker: kisha
    emotion: thinking
    text: ……そのまま、ですか。
    beat: true
- id: card2024
  title: ''
  background: hd_card_2024
  bgm: honwaka_puppu
  cuts:
  - speaker: reimu
    text: 2024年1月。ラスベガスの展示会で、ホンダは新しいEVの名前を発表します。
    reading: にせん にじゅうよねん いちがつ。らすべがすの てんじかいで ほんだわ あたらしい いーぶいの なまえお はっぴょう します。
- id: zero
  title: ゼロから作るEV
  background: hd_test
  stage:
  - {who: kenkyu, x: 0.28, flip: true, emotion: happy}
  - {who: yakuin, x: 0.7, emotion: normal}
  cuts:
  - speaker: kenkyu
    emotion: happy
    text: '[Honda 0|ホンダゼロ]シリーズ！ ゼロから全く新しいEVを創造していく、ですって！'
  - speaker: yakuin
    emotion: normal
    text: 2026年から、北米を皮切りに出す計画だ。
  - speaker: kenkyu
    emotion: surprised
    text: '[H|えいち]のマークまで、新しくなってます！'
  - speaker: yakuin
    emotion: happy
    text: ゼロから、だからな。
  - speaker: kenkyu
    emotion: happy
    text: ボク、ゼロシリーズのために貯金を始めました！
  - speaker: yakuin
    emotion: thinking
    text: 研究員の給料でか。
  - speaker: kenkyu
    emotion: normal
    text: ……10年計画です。
    se: manuke
  - speaker: yakuin
    emotion: normal
    text: 目標も変わらない。2040年に、EVと燃料電池車で100％だ。
- id: canada
  title: カナダにも工場を
  background: hd_kojo
  stage:
  - {who: kenkyu, x: 0.28, flip: true, emotion: surprised}
  - {who: yakuin, x: 0.7, emotion: normal}
  cuts:
  - speaker: kenkyu
    emotion: surprised
    text: 4月の発表、見ました！ カナダにもEVと電池の工場を作るって！
  - speaker: yakuin
    emotion: normal
    text: 最大150億カナダドル。日本円で1兆7000億円ほどの計画だ。
  - speaker: kenkyu
    emotion: surprised
    text: ボクの貯金の、何倍ですか。
  - speaker: yakuin
    emotion: thinking
    text: 比べる相手を選べ。
    beat: true
  - speaker: kenkyu
    emotion: normal
    text: 柱の上に、どんどん積みますね。
  - speaker: yakuin
    emotion: happy
