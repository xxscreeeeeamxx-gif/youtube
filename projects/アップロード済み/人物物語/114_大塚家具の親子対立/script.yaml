scenes:
# ---- 先出し（2015年3月27日・株主総会。議長の娘と、株主席の父） ----
- id: co_soukai
  title: ''
  background: ok_soukai
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大塚久美子, emotion: sad}
  - {who: katsuhisa, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2015年3月27日、東京・有明。大塚家具の株主総会で、議長は社長の大塚久美子。株主席には創業者の父。
    reading: にせん じゅうごねん さんがつ にじゅうしちにち、とうきょう ありあけ。おおつか かぐの かぶぬし そうかいで ぎちょうわ しゃちょうの おおつか くみこ。かぶぬしせきにわ そうぎょうしゃの ちち。
  - speaker: zundamon
    emotion: sad
    text: 社員はつらい思いをし、お客様にも迷惑をかけた。
  - speaker: katsuhisa
    emotion: normal
    text: 会社の復活は私しかできない。
    se: don
  - speaker: reimu
    text: この日、娘は61%で勝ちます。5年後に娘も去り、7年後、会社としての大塚家具も消えました。
    reading: この ひ、むすめわ ろくじゅういち ぱーせんとで かちます。ごねんごに むすめも さり、ななねんご かいしゃと しての おおつか かぐも きえました。
# ---- 今の部屋（ソファを買いに行く） ----
- id: hook
  title: ''
  background: ok_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: ソファを買いに行くのだ！ ふらっと入って、全部座り比べてくる！
  - speaker: tsumugi
    emotion: normal
    text: 昔は、受付で名前を書かないと入れない家具屋さんがあったのよ。
  - speaker: zundamon
    emotion: surprised
    text: 家具屋で名前を書くのだ！？
    beat: true
  - speaker: tsumugi
    emotion: thinking
    text: そこで父と争って61%で[勝った|かった]娘が、5年で会社を去ったの。
    telops:
    - {text: "61%で勝った娘は なぜ会社を去ったのか", size: md, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: '[勝った|かった]のに、なんで手放したのだ！？'
# ---- 2009年・受付で名前を書く店 ----
- id: card2009
  title: ''
  background: ok_card_2009
  bgm: honwaka_puppu
  cuts:
  - speaker: reimu
    text: 2009年3月。大塚家具で、41歳の長女の久美子が社長になります。
    reading: にせん きゅうねん さんがつ。おおつか かぐで よんじゅういっさいの ちょうじょの くみこが しゃちょうに なります。
- id: ch1_uketsuke
  title: 受付で名前を書く店
  background: ok_showroom_uketsuke
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 大塚久美子, emotion: thinking}
  - {who: tenin, x: 0.56, emotion: happy}
  - {who: kyaku, x: 0.8, emotion: normal}
  cuts:
  - speaker: kyaku
    emotion: normal
    text: ソファを見たいだけなんですけど。
  - speaker: tenin
    emotion: happy
    text: いらっしゃいませ。まずこちらに、お名前とご住所を。
  - speaker: kyaku
    emotion: surprised
    text: 見るだけで、住所まで！？
    se: bikkuri
  - speaker: tenin
    emotion: happy
    text: 担当がご一緒すれば、寸法も配送も一度に決まりますよ。
  - speaker: reimu
    text: 1993年から続く会員制。始めたわけを父はビルの持ち主の求めと言い、娘はまとめ買いの客のためと言います。
    reading: せんきゅうひゃく きゅうじゅうさんねんから つづく かいいんせい。はじめた わけお ちちわ びるの もちぬしの もとめと いい、むすめわ まとめがいの きゃくの ためと いいます。
  - speaker: reimu
    text: 社長になった娘は、もっと入りやすい店を掲げます。2015年には、こう語っています。
    reading: しゃちょうに なった むすめわ、もっと はいりやすい みせお かかげます。にせん じゅうごねんにわ こう かたって います。
  - speaker: zundamon
    emotion: normal
    text: つまり、弊社の会員制システムは形骸化したのです。
  - speaker: reimu
    text: 勝った娘を苦しめたのは、本当にこの入口の違いだったのか。
    reading: かった むすめお くるしめたのわ、ほんとうに この いりぐちの ちがいだったのか。
# ---- 2014〜2015年・7人の取締役の手 ----
- id: card2014
  title: ''
  background: ok_card_2014
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 2014年7月23日。大塚家具の取締役会です。
    reading: にせん じゅうよねん しちがつ にじゅうさんにち。おおつか かぐの とりしまりやくかいです。
- id: ch1_kainin
  title: 7人の取締役の手
  background: ok_kaigi
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 大塚久美子, emotion: thinking}
  - {who: torishimari, x: 0.56, emotion: normal}
  - {who: katsuhisa, x: 0.8, emotion: normal}
  cuts:
  - speaker: torishimari
    emotion: normal
    text: 社長の解任について、採決します。賛成の方は挙手を。
  - speaker: torishimari
    emotion: normal
    text: 賛成5、反対1、棄権1。社長は、会長が兼ねます。
    se: don
    telops:
    - {text: "解任　賛成5・反対1・棄権1", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
- id: card2015
  title: ''
  background: ok_card_2015
  cuts:
  - speaker: reimu
    text: 2015年1月28日、半年後の取締役会。上場会社では、会社をつくった父も1票です。
    reading: にせん じゅうごねん いちがつ にじゅうはちにち、はんとしごの とりしまりやくかい。じょうじょう がいしゃでわ かいしゃお つくった ちちも いっぴょうです。
- id: ch1_4tai3
  title: ''
  background: ok_kaigi
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 大塚久美子, emotion: thinking}
  - {who: torishimari, x: 0.56, emotion: normal}
  - {who: katsuhisa, x: 0.8, emotion: thinking}
  cuts:
  - speaker: torishimari
    emotion: normal
    text: 社長の選任について、採決します。
  - speaker: torishimari
    emotion: surprised
    text: 賛成4、反対3。社長の復帰が決まりました。
    telops:
    - {text: "復帰　賛成4・反対3", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
- id: ch1_teian
  title: 翌日の株主提案
  background: ok_kaigi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大塚久美子, emotion: thinking}
  - {who: kanbu, x: 0.7, emotion: surprised}
  cuts:
  - speaker: kanbu
    emotion: surprised
    text: 社長、会長から株主提案が届きました。
  - speaker: kanbu
    emotion: thinking
    text: 候補は会長と専務ら10人。社長のお名前は、ありません。
  - speaker: reimu
    text: 娘は2022年に、この2日をこう語っています。
    reading: むすめわ にせん にじゅうにねんに、この ふつかお こう かたって います。
  - speaker: zundamon
    emotion: thinking
    text: そうしたら、翌29日に父から私を取締役候補から外す株主提案が出たのです。
  - speaker: kanbu
    emotion: normal
    text: 会長の持ち株は18%。お一人では、過半数に届きません。
  - speaker: kanbu
    emotion: normal
    text: ごきょうだいの資産管理会社、[ききょう企画|ききょうきかく]の9.75%は社長の側です。
  - speaker: kanbu
    emotion: thinking
    text: 2008年に会長が130万株を渡し、代わりに15億円の社債を受け取った会社です。
  - speaker: reimu
    text: 親が相続に備えて子どもの名義にした財布が、もめたとき子どもの側の財布に。
    reading: おやが そうぞくに そなえて こどもの めいぎに した さいふが、もめた とき こどもの がわの さいふに。
  - speaker: reimu
    text: この株も娘の側に入りました、と報じられています。
    reading: この かぶも むすめの がわに はいりましたと、ほうじられて います。
  - speaker: kanbu
    emotion: thinking
    text: その15億円の社債は、期限の2013年を過ぎても返されていません。
# ---- 創業者の店（短く） ----
- id: ch2_kobo
  title: 桐箪笥の工房の息子
  background: ok_kobo
  bgm: hirusagari
  stage:
  - {who: katsuhisa, x: 0.5, emotion: normal}
  cuts:
  - speaker: reimu
    text: 父の大塚勝久は、埼玉・春日部の桐箪笥の工房の息子です。2018年の寄稿に、こう書いています。
    reading: ちちの おおつか かつひさわ、さいたま かすかべの きりだんすの こうぼうの むすこです。にせん じゅうはちねんの きこうに こう かいて います。
  - speaker: katsuhisa
    emotion: happy
    text: 家具にまつわる知識は、すべて父を見ていて覚えたものである。
  - speaker: reimu
    text: 1969年に25歳で開いた店は、最盛期に売上約730億円の会社になります。
    reading: せんきゅうひゃく ろくじゅうくねんに にじゅうごさいで ひらいた みせわ、さいせいきに うりあげ やく ななひゃく さんじゅうおくえんの かいしゃに なります。
  - speaker: reimu
    text: その春日部で、のちに父と娘の店が向かい合います。残ったのは、どちらの店だったのか。
    reading: その かすかべで、のちに ちちと むすめの みせが むかいあいます。のこったのわ、どちらの みせだったのか。
# ---- 2015年2月・2つの会見 ----
- id: ch3_chichi
  title: 幹部がずらりと並ぶ会見
  background: ok_kaiken_kanbu
  bgm: serious
  stage:
  - {who: katsuhisa, x: 0.5, emotion: sad}
  cuts:
  - speaker: reimu
    text: 2月25日の夜、東京・大手町。父の会見では、役員と幹部社員の計14人が深く頭を下げました。
    reading: にがつ にじゅうごにちの よる、とうきょう おおてまち。ちちの かいけんでわ やくいんと かんぶ しゃいんの けい じゅうよにんが ふかく あたまお さげました。
  - speaker: katsuhisa
    emotion: sad
    text: 株主、取締役、多くのみなさまに多大なるご迷惑をかけました。深くお詫びします
  - speaker: katsuhisa
    emotion: sad
    text: 創業者である親として、娘を社長にしたのが間違いだった。
    se: gaan
    telops:
    - {text: "父「娘を社長にしたのが間違いだった」", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: katsuhisa
    emotion: sad
    text: なんとか仲良くやれないか努力したが、いくら言っても聞き入れてもらえなかった。
  - speaker: reimu
    text: 父の側の文書は、娘は5年以上の在任で結果を残せず、コンプライアンスの問題も起こした、としました。
    reading: ちちの がわの ぶんしょわ むすめわ ごねん いじょうの ざいにんで けっかお のこせず、こんぷらいあんすの もんだいも おこしたと しました。
- id: ch3_musume
  title: 翌日の娘の会見
  background: ok_kaiken
  stage:
  - {who: zundamon, x: 0.5, tag: 大塚久美子, emotion: sad}
  cuts:
  - speaker: reimu
    text: 翌日の午後、東京駅のそば。娘の会見には、150人を超える報道陣が集まりました。
    reading: よくじつの ごご、とうきょうえきの そば。むすめの かいけんにわ ひゃくごじゅうにんお こえる ほうどうじんが あつまりました。
  - speaker: zundamon
    emotion: sad
    text: お客様に対しお恥ずかしい限り
  - speaker: zundamon
    emotion: thinking
    text: 事実認識に誤りがある。
  - speaker: zundamon
    emotion: thinking
    text: 私的な問題を上場会社のコンプライアンスの問題とするのは無理があり、驚きを禁じえない
  - speaker: zundamon
    emotion: sad
    text: そうした演出で社員を巻き込んでしまい、申し訳ない。
  - speaker: zundamon
    emotion: normal
    text: 創業者のリーダーシップは非常に強く、カリスマ性もあるが、永遠に続くものではない。
    se: gaan
    telops:
    - {text: "娘「…永遠に続くものではない」", size: md, position: top-right, color: "#8AD0FF", stroke: "#0A1A2A", glow: "#2A6ACC", anim: up}
# ---- 2015年3月・票を数える ----
- id: ch4_hyo
  title: 票を数える3月
  background: ok_kaigi
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大塚久美子, emotion: thinking}
  - {who: kanbu, x: 0.7, emotion: normal}
  cuts:
  - speaker: kanbu
    emotion: normal
    text: 総会は今月27日です。会長の案は、3年間の配当を前の年の3倍の120円に。
  - speaker: kanbu
    emotion: normal
    text: こちらは前の年の倍、80円です。
  - speaker: kanbu
    emotion: thinking
    text: 100株の方なら、1年でこちらは8000円。会長の案なら1万2000円です。
  - speaker: reimu
    text: 61%は、何を約束して集めた票だったのか。その約束が、勝ったあとで重くなります。
    reading: ろくじゅういち ぱーせんとわ なにお やくそく して あつめた ひょうだったのか。その やくそくが、かった あとで おもく なります。
  - speaker: kanbu
    emotion: normal
    text: 票は会長の18%に、取引先のフランスベッドが3%。
  - speaker: kanbu
    emotion: thinking
    text: 店長の多くも、会長への賛同を表明しました。
  - speaker: kanbu
    emotion: normal
    text: こちらにはアメリカの投資会社の10%余り。助言会社の2社も、こちらの支持です。
  - speaker: reimu
    text: 娘は2022年に、この騒ぎの報道をこう振り返っています。
    reading: むすめわ にせん にじゅうにねんに、この さわぎの ほうどうお こう ふりかえって います。
  - speaker: zundamon
    emotion: normal
    text: 株主総会までの間の2か月間の露出をCM換算すると60億円って言われましたね。
  - speaker: zundamon
    emotion: sad
    text: 事実と異なる宣伝をされ続けたことはビジネス的には大きな痛手になりました。
- id: ch4_tegami
  title: ''
  background: ok_showroom_uketsuke
  stage:
  - {who: tenin, x: 0.3, flip: true, emotion: normal}
  - {who: kabunushi, x: 0.72, emotion: normal}
  cuts:
  - speaker: kabunushi
    emotion: normal
    text: 株主なんだがね。総会では会長と会社、どっちに入れたもんかね。
  - speaker: tenin
    emotion: surprised
    text: わ、わたくしどもからは何とも……。
  - speaker: kabunushi
    emotion: thinking
    text: 配当は会長が120円、会社が80円。そりゃ多いほうがいいけどなあ。
  - speaker: kabunushi
    emotion: normal
    text: とりあえず、ここに名前を書けばいいのかい。
  - speaker: tenin
    emotion: surprised
    text: こちらは、ご来店のお名前です！
    se: zukko
# ---- 2015年3月27日・株主総会 ----
- id: ch4_soukai
  title: 議長席と株主席
  background: ok_soukai
  bgm: serious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 大塚久美子, emotion: thinking}
  - {who: kabunushi, x: 0.52, emotion: normal}
  - {who: katsuhisa, x: 0.8, emotion: sad}
  cuts:
  - speaker: reimu
    text: 3月27日、有明の本社。出席した株主は約200人、例年の約10倍です。
    reading: さんがつ にじゅうしちにち、ありあけの ほんしゃ。しゅっせき した かぶぬしわ やく にひゃくにん、れいねんの やく じゅうばいです。
  - speaker: zundamon
    emotion: sad
