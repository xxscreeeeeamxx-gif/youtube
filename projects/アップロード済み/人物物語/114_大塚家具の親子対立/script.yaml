meta:
  title: 大塚家具の創業者「娘を社長にしたのが間違いだった」、株主総会で勝った娘も5年で会社を去る【ずんだもん解説】
  slug: otsuka-kagu
  hook_line: 61%の票で父に勝った娘は、なぜ5年で大塚家具を去ったのか。
  summary: 2015年3月、東京・有明。大塚家具の株主総会で、議長席の長女と、株主席にいる創業者の父が向き合いました。受付で名前を書く店と入りやすい店。相続に備えて一族の資産管理会社に渡した株。7人の取締役の手。父と娘は何を争い、株主の61%を集めて勝った娘は、そのあと何と向き合ったのか。会見・株主総会・インタビューに残る2人の言葉で、双方の言い分を並べて再現ドラマでたどります。（2026年11月時点）
  sources:
  - 日本経済新聞「大塚家具、久美子社長側に経営権　株主総会で決定」（2015年3月27日） https://www.nikkei.com/article/DGXLASGD27H0C_X20C15A3MM0000/
  - 日本経済新聞「大塚家具の大塚会長「娘を社長にしたのが間違いだった」」（2015年2月25日） https://www.nikkei.com/article/DGXMZO83671200V20C15A2000000/
  - 東洋経済オンライン「大塚家具､娘に勝訴した父は何を得たか」（2016年4月12日） https://toyokeizai.net/articles/-/113355
  - ヤマダホールディングス「子会社間の合併に関するお知らせ」（2022年2月14日） https://www.yamada-holdings.jp/ir/press/2022/220214_2.pdf
  - 匠大塚 会社概要 https://takumi-otsuka.jp/company/
  - 集英社新書プラス 対談「火中の栗を拾った二人」前編（2026年8月26日） https://shinsho-plus.shueisha.co.jp/interview/ootuka_fukuda/36438
