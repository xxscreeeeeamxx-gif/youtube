# otsuka-kagu 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 大塚久美子 / label: 大塚勝久・山田昇）・テロップ・章タイトルは表示専用なのでタグを付けていない。
# 大塚勝久・大塚久美子・久美子・桐箪笥・大手町・青山・西武 はナレと名札だけに出る（セリフでは「父」「娘」「社長」「会長」と呼ぶ）。
# 勝久 は VOICEVOX がタグなしでカツヒサと1語で読むが、タグを付けるとカツ/ヒサに割れたので、セリフでは名前を避けた（「父本人」）。
# 春日部 はひらがなのタグだとカス/カベに割れたので、カタカナのタグ [春日部|カスカベ] にした（カスカベホンテンと1語で読む）。
# 匠大塚・ききょう企画・有明 はひらがなのタグで1語に読む（audio_query で確かめた）。
# 年6分 はタグなしだとトシロップンになるので [年6分|ネンロクブ] にした。
# 勝った は文頭や「〜あとの」の前でマサッタと読まれたので、該当2か所に [勝った|かった] を付けた。
# if（仮定） はタグなしだとイフ・カテエと読まれるので [if（仮定）|イフ] にした。
# IDC OTSUKA はタグなしだとアイディイシイ・オオティイエスユウケエエエになるので [IDC OTSUKA|アイディーシーオオツカ] にした。
# 大塚家具 はタグなしでオオツカカグと正しく読むので台帳に入れていない（タグを重ねると抑揚が切れるため）。
