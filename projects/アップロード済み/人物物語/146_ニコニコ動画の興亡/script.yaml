  - KADOKAWA（PR TIMES）「ランサムウェア攻撃による情報漏洩に関するお知らせ」（2024年8月5日） https://prtimes.jp/main/html/rd/p/000015155.000007006.html
  - KADOKAWA「2027年3月期 第2四半期 決算説明資料」（2026年11月12日） https://ssl4.eir-parts.net/doc/9468/ir_material_for_fiscal_ym10/218061/00.pdf
