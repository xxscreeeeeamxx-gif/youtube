  - speaker: zundamon
    emotion: surprised
    text: 広めると、訴えられることもあるのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 2つめ。事件のあとに届くお詫びや確認のメールにも、気をつけてね。
  - speaker: tsumugi
    emotion: normal
    text: 3つめ。調査した会社は、社員のアカウントの情報が盗まれたのが原因と推測しているわ。
  - speaker: tsumugi
    emotion: normal
    text: あなたも、パスワードを使い回さない。二段階認証を使う。
  - speaker: zundamon
    emotion: sad
    text: ……全部、同じパスワードなのだ。
    se: shobon
  - speaker: tsumugi
    emotion: normal
    text: 今日、1つだけでも変えてね。
