    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 1つめ。漏れたとされる情報を、見に行かない。広めない。
  - speaker: tsumugi
    emotion: normal
    text: 流出させたと主張する側のサイトは、マルウェアの危険があると会社は呼びかけたわ。
  - speaker: zundamon
    emotion: surprised
    text: 見に行くだけで、パソコンが危ないのだ！？
