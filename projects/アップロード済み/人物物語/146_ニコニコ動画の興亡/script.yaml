meta:
  title: ニコニコ動画の会長「画質が悪いのは大変な問題」、有料会員は頂点の3分の1に【ずんだもん解説】
  slug: niconico-kawakami
  hook_line: コメントが流れるニコニコ動画の会長は、なぜ「画質」で頭を下げたのか。
  summary: 2017年11月28日、ニコニコ動画の新しい版の発表会。ドワンゴ会長の川上量生は「他のサービスと比べ、画質が悪いのは大変な問題」と頭を下げます。動画を1本も持たず、YouTubeの動画にコメントを重ねる「（仮）」の名前で始まったサイトは、なぜ画質でつまずいたのか。YouTubeの動画が使えなくなった日、自前の置き場、3年の赤字、有料会員の頂点、そして2024年のサイバー攻撃の朝。本人の講演・インタビューと会社の発表の言葉で、再現ドラマでたどります。（2026年11月時点）
  sources:
