scenes:
# ---- 先出し（2017年11月28日・新しい版の発表会。川上の台詞は ITmedia の引いた形のまま・語尾をいじらない。泣く・怒るなし。笑いの SE なし。客席の声は記事の地の文の言い換えで、実在の人の言葉ではない。「引責」と言わない） ----
- id: co_happyokai
  title: ''
  background: nc_happyokai
  bgm: serious
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 川上, emotion: sad}
  - {who: kyaku1, x: 0.56, emotion: normal}
  - {who: kyaku2, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2017年11月28日。コメントが流れる動画サイト、ニコニコ動画の新しい版の発表会。
    reading: にせん じゅうななねん じゅういちがつ にじゅうはちにち。こめんとが ながれる どうがさいと、にこにこどうがの あたらしい はんの はっぴょうかい。
  - speaker: kyaku1
    emotion: normal
    text: 有料の会員でも、動画が止まるんですよ。
  - speaker: kyaku2
    emotion: normal
    text: ほかのサイトより、画面も粗いですし。
  - speaker: zundamon
    emotion: sad
    text: '[他の|ホカノ]サービスと比べ、画質が悪いのは大変な問題。'
  - speaker: zundamon
    emotion: sad
    text: ……あと半年、お待ちください。
  - speaker: reimu
    text: この男は、川上量生。ニコニコ動画を作った会社、ドワンゴの会長です。3週間後、会長を退きます。
    reading: この おとこわ、かわかみ のぶお。にこにこどうがお つくった かいしゃ、どわんごの かいちょうです。さんしゅうかんご、かいちょうお しりぞきます。
# ---- 今の部屋（動画に1人でツッコむ → 流せたら → 11年前の（仮）の予告 → 問い。20秒ほど） ----
- id: hook
  title: ''
  background: nc_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: そこで転ぶのかーい！
  - speaker: zundamon
    emotion: sad
    text: ……動画に1人でツッコんでも、むなしいのだ。
  - speaker: tsumugi
    emotion: normal
    text: そのツッコミ、動画の上に流せたら？
  - speaker: zundamon
    emotion: thinking
    text: みんなのツッコミが流れたら、うるさいのだ。
  - speaker: tsumugi
    emotion: happy
    text: それが、日本で大流行したの。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 2006年に、[（仮）|カッコカリ]の名前で始まったニコニコ動画よ。
  - speaker: tsumugi
    emotion: normal
    text: コメントが流れる動画サイトを作った人は、なぜ画質で頭を下げたのか。
    telops:
    - {text: "コメントの動画サイトは なぜ画質で頭を下げた？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: コメントじゃなくて、画質で！？
# ---- 2001年・着メロ（30秒以内。年号カードで時を戻すのはここだけ。「大ポカン」は2012年の本人の言葉） ----
- id: card2001
  title: ''
  background: nc_card_2001
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 2001年。ネットワークゲームの仕組みの会社として始まった、ドワンゴ。
    reading: にせん いちねん。ねっとわーく げーむの しくみの かいしゃとして はじまった、どわんご。
- id: ch1_chakumero
  title: 大ポカンの着メロ
  background: nc_chakumero
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 川上, emotion: happy}
  - {who: shain, x: 0.8, emotion: surprised}
  cuts:
  - speaker: shain
    emotion: surprised
    text: 会長、うちが着メロをやるって本当ですか！？
  - speaker: zundamon
    emotion: happy
    text: ケータイの着メロだ。
  - speaker: shain
    emotion: thinking
    text: ゲームの会社が、着メロ……？
  - speaker: reimu
    text: 川上は2012年に、このときの周りの反応をこう振り返ります。
    reading: かわかみわ にせん じゅうにねんに、この ときの まわりの はんのうお こう ふりかえります。
  - speaker: zundamon
    emotion: happy
    text: ドワンゴが着メロサービスをやるなんていうから、もうみんな大ポカンだったわけで
  - speaker: shain
    emotion: happy
    text: 会長！ 着メロが、売れてます！
  - speaker: zundamon
    emotion: happy
    text: 大ポカンが、大当たりだ。
    beat: true
# ---- 2006年・会議室（2015年の言葉は「振り返る」と付け、同じ記事の2つの言葉を続けて置く。「とにかくプロトタイプを作ろう」は記事の地の文の中の言葉で話し手が書かれていないので、川上の台詞にせずナレで。背景差し替え①：ホワイトボード → 壁一面の紙） ----
- id: ch2_kaigi
  title: このままだと潰れる
  background: nc_kaigi
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 川上, emotion: thinking}
  - {who: shain, x: 0.8, emotion: sad}
  cuts:
  - speaker: reimu
    text: 2006年。着うたが広がって着メロの売れ行きが落ち、会社の決算は赤字になります。
    reading: にせん ろくねん。ちゃくうたが ひろがって ちゃくめろの うれゆきが おち、かいしゃの けっさんわ あかじに なります。
  - speaker: shain
    emotion: sad
    text: 会長。着うたに押されて、着メロの売上がまた下がってます……。
  - speaker: zundamon
    emotion: thinking
    text: ……次の柱が要るな。
  - speaker: reimu
    text: 川上は2015年に、このころをこう振り返ります。
    reading: かわかみわ にせん じゅうごねんに、この ころお こう ふりかえります。
  - speaker: zundamon
    emotion: normal
    text: このままだと会社が潰れるから、何か新しいことをやらなくちゃいけないと
  - speaker: zundamon
    emotion: normal
    text: 必要に迫られてやっただけですよ
  - speaker: zundamon
    emotion: normal
    text: ニコ動のときは動画生放送で勝負しようと思っていて、
  - speaker: zundamon
    emotion: happy
    text: その前にテストで動画サービスをつくったら当たってしまった。
  - speaker: shain
    emotion: surprised
    text: 会長！ 議論を始めて半年、案の紙で壁が埋まりました！
    background: nc_kaigi_kami
    beat: true
  - speaker: zundamon
    emotion: surprised
    text: ……壁が、見えないな。
  - speaker: reimu
    text: とにかくプロトタイプを作ろう、となります。その試作が、11年後に画質で頭を下げるサイトになります。
    reading: とにかく ぷろとたいぷお つくろうと なります。その しさくが、じゅういちねんごに がしつで あたまお さげる さいとに なります。
# ---- 2006年夏〜秋・3つの試作（「川上が考えた」と言わない。1つ目・2つ目の作り手の名前は出さない。首を左右に振る笑い。「これはいける」は記事では「確信したという」＝心の中なので、声に出さない一言にする。テロップ・題名に使わない） ----
- id: ch3_shisaku
  title: 3つの試作
  background: nc_kaihatsu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 川上, emotion: normal}
  - {who: shain, x: 0.6, emotion: normal}
  - {who: gishi, x: 0.84, emotion: normal}
  cuts:
  - speaker: shain
    emotion: normal
    text: 1つ目の試作です。YouTubeの動画の横に、コメントが並びます。
  - speaker: shain
    emotion: normal
    text: 動画を見て……コメントを見て……。
  - speaker: gishi
    emotion: normal
    text: 動画を見て……コメントを見て……。
  - speaker: shain
    emotion: sad
    text: ……首が、疲れます。
    se: manuke
  - speaker: zundamon
    emotion: thinking
    text: どっちも、ちゃんと見られないな。
- id: ch3_gamen
  title: ''
  background: nc_gamen
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 川上, emotion: normal}
  - {who: shain, x: 0.6, emotion: normal}
  - {who: gishi, x: 0.84, emotion: happy}
  cuts:
  - speaker: gishi
    emotion: happy
    text: 2つ目は、外の会社の人の試作です。コメントが、動画の上を流れます！
  - speaker: shain
    emotion: surprised
    text: 文字が、映像の上を流れていく！
  - speaker: zundamon
    emotion: happy
    text: （……これは、いけるのだ）
    beat: true
# ---- 3つ目（川上の指示で戀塚が作った。戀塚の台詞は2007年の本人の言葉だけ。日数は「数日」） ----
- id: ch3_koizuka
  title: ''
  background: nc_kaihatsu_3
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 川上, emotion: happy}
  - {who: shain, x: 0.56, emotion: surprised}
  - {who: koizuka, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 3つ目は、川上の指示で、技術者の戀塚昭彦が作ります。2ちゃんねるの実況を意識した試作です。
    reading: みっつめわ かわかみの しじで、ぎじゅつしゃの こいづか あきひこが つくります。にちゃんねるの じっきょうお いしきした しさくです。
  - speaker: shain
    emotion: surprised
    text: 画面を埋めるほどコメントが重なる、[弾幕|ダンマク]の仕組みも入ってます！
  - speaker: zundamon
    emotion: surprised
    text: もう、動いてるのだ！？
  - speaker: reimu
    text: 試作は、数日でできあがりました。戀塚は2007年に、こう話しています。
    reading: しさくわ、すうじつで できあがりました。こいづかわ にせん ななねんに、こう はなして います。
  - speaker: koizuka
    emotion: happy
    text: 実際に絵が動くシステムを一刻も早く組み上げてしまいたかったんです
  - speaker: zundamon
    emotion: thinking
    text: 仕組みはできた。……下の動画は、1本もうちの物じゃないけどな。
# ---- 2006年12月・正体を隠した開店（隠したのが誰の判断かは言わない。（仮）の札はテロップで） ----
- id: ch4_kari
  title: （仮）のまま開店
  background: nc_kaihatsu
  bgm: pop
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 川上, emotion: happy}
  - {who: shinjin, x: 0.56, emotion: normal}
  - {who: gishi, x: 0.8, emotion: normal}
  cuts:
  - speaker: gishi
    emotion: happy
    text: 名前は、ニコニコ動画に決まりました。
  - speaker: shinjin
    emotion: thinking
    text: 運営の会社の名前は、出さないんですか？
  - speaker: gishi
    emotion: normal
    text: 出さない。個人が趣味でやってるように見せるんだ。
  - speaker: shinjin
    emotion: surprised
    text: 名前のうしろの[（仮）|カッコカリ]は……？
  - speaker: gishi
    emotion: happy
    text: 仮のオープンだからな。
    beat: true
  - speaker: reimu
    text: 2006年12月12日。ニコニコ動画は（仮）のまま、ひっそりと始まります。
    reading: にせん ろくねん じゅうにがつ じゅうににち。にこにこどうがわ かっこかりの まま、ひっそりと はじまります。
    telops:
    - {text: "2006年12月12日 ニコニコ動画（仮）", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
# ---- 動画はよそ、コメントは自分（材料1を劇中の職場で。川上の台詞は2009年の「動画データ自体は、YouTubeでもなんでもいい」の趣旨から外れない。425万円は「のちの見込み」。1分に約3000円は台帳の割り算） ----
- id: ch4_karimono
  title: 動画は借り物
  background: nc_kaihatsu
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 川上, emotion: happy}
  - {who: shinjin, x: 0.84, emotion: thinking}
  cuts:
  - speaker: shinjin
    emotion: thinking
    text: 会長。動画は、どこに置くんですか？
  - speaker: zundamon
    emotion: happy
    text: 置かないのだ。YouTubeのを、借りるのだ。
  - speaker: shinjin
    emotion: surprised
    text: 借り物！？ じゃあ、うちの物は？
  - speaker: zundamon
    emotion: happy
    text: コメントだ。
  - speaker: shinjin
    emotion: happy
    text: 置き場がよそなら、回線の代金もかかりませんね。
  - speaker: zundamon
    emotion: normal
    text: ……今のところは、な。
  - speaker: reimu
    text: のちに自前で置いたとき、回線などの代金は1日 約425万円の見込み。1分に約3000円です。
    reading: のちに じまえで おいた とき、かいせんなどの だいきんわ いちにち やく よんひゃく にじゅうごまんえんの みこみ。いっぷんに やく さんぜんえんです。
  - speaker: reimu
    text: 見る人が増えるほど、代金もふくらむ。画質の問題は、この代金と隣り合わせでした。
    reading: みる ひとが ふえるほど だいきんも ふくらむ。がしつの もんだいわ、この だいきんと となりあわせでした。
# ---- 2006年12月〜2007年1月・押し寄せる人（ひろゆきは舞台に出さず、ナレで肩書きだけ。言葉は2013年の本人の話。背景差し替え③：緑のランプ → 全部赤） ----
- id: ch5_server
  title: 押し寄せる人
  background: nc_server
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 川上, emotion: happy}
  - {who: gishi, x: 0.84, emotion: normal}
  cuts:
  - speaker: reimu
    text: 運営の会社の取締役には、2ちゃんねるの管理人のひろゆきも。川上は2013年にこう話しています。
    reading: うんえいの かいしゃの とりしまりやくにわ、にちゃんねるの かんりにんの ひろゆきも。かわかみわ にせん じゅうさんねんに こう はなして います。
  - speaker: zundamon
    emotion: happy
    text: 1番初めにひろゆきが宣伝して
  - speaker: zundamon
    emotion: happy
    text: '[2ちゃんねらー|ニチャンネラー]やビッパーっていう人たちが大量にきたんですよね'
  - speaker: gishi
    emotion: surprised
    text: 会長！ 人が増えすぎて、サーバーが追いつきません！
    background: nc_server_aka
  - speaker: zundamon
    emotion: surprised
    text: ランプが、全部赤なのだ！
  - speaker: gishi
    emotion: thinking
    text: 見る人に登録してもらって、負荷を減らしましょう！
# ---- 2007年2月・切られた日（全体の2〜3割の所。YouTube を悪者にしない。「遮断」「使えなくなった」。賭けの中身は言わない） ----
- id: card2007
  title: ''
  background: nc_card_2007
  bgm: serious
  cuts:
  - speaker: reimu
    text: 2007年2月。画質で頭を下げる10年あまり前、サイトはまだ動画を1本も持っていません。
    reading: にせん ななねん にがつ。がしつで あたまお さげる じゅうねん あまり まえ、さいとわ まだ どうがお いっぽんも もって いません。
- id: ch6_kirareru
  title: 動画が出ない日
  background: nc_kaigi
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 川上, emotion: thinking}
  - {who: gishi, x: 0.56, emotion: surprised}
  - {who: shain, x: 0.8, emotion: surprised}
  cuts:
  - speaker: gishi
    emotion: surprised
    text: 会長、攻撃がもう3日目です！ 今夜、サイトを止めます！
  - speaker: shain
    emotion: surprised
    text: 会長！ YouTubeの動画も、出ません！
    se: gaan
  - speaker: reimu
    text: 同じころ、YouTubeがニコニコ動画からのアクセスの一部を遮断していました。
    reading: おなじ ころ、ゆーちゅーぶが にこにこどうがからの あくせすの いちぶお しゃだん して いました。
  - speaker: zundamon
    emotion: thinking
    text: ……来たか。
  - speaker: shain
    emotion: surprised
    text: 会長、やけに落ち着いてますね……。
  - speaker: reimu
