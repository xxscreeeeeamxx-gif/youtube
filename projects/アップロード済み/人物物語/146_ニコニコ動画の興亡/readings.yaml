# niconico-kawakami 読み台帳（人名・地名・社名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている（タグは付けていない）。
# 名札（tag: 川上 / label: 客席・社員・技術者・戀塚・新人・経理・利用者・来場者・夏野・開発者）・
# テロップ・章タイトル・meta は表示専用なのでタグを付けていない。
#
# 2026-11-19 台本を書いたあと、セリフ全行を話者ごとの VOICEVOX スタイル（ずんだもん3・つむぎ8・モブは meta.mobs の voice）で
# audio_query にかけた結果:
# - 他の はタグなしだと タノ（「他のサービスと比べ」が タノ/サアビスト）→ [他の|ホカノ] で ホカノ。本人の言葉の字面は「他の」のまま。
# - 十分 はタグなしだと ジュップン（「十分目を向けて」が ジュップンメオ）→ [十分|じゅうぶん] で ジュウブン/メオ。
# - 2ちゃんねらー はタグなしだと ニチャンネ/ラアヤ と切れた → [2ちゃんねらー|ニチャンネラー] で ニチャンネラアヤ（1語）。
#   ひらがなのタグ（にちゃんねらー）は ニ/チャン/ネラア と細切れ。
# - 約4〜5億円 はタグなしだと ヤクヨン、/ゴオクエン と間が入る → [約4〜5億円|ヤクヨンゴオクエン] で1句。
# - （仮） はタグなしだと カリ、（間）、（Re:仮） は レ、カリ → [（仮）|カッコカリ]・[（Re:仮）|カッコリカリ]。
#   ひらがなのタグは カッ/コリカリ と切れた。
# - 3分の1 は [3分の1|さんぶんのいち] で ヤクサンブンノ/イチヨ。
# - 川上・弾幕・KADOKAWA はタグなしでも カワカミ・ダンマク・カドカワ。タグ（カタカナ）を付けても抑揚は切れなかった。
# - 画面も粗いし が ガメンモ/ホボ/イシ になった → 「画面も粗いですし」に言い換えて アライデスシ。
# - 年に約9億円 が トシニ、14万4000人ぶん が ヨンセンジンブン になった → 「1年で約9億円」「14万4000人が525円ずつで」に言い換えた。
# - 2026-11-19 見直し（nc_fix.md）: 大赤字 がタグなしだと ダイアカジ → [大赤字|オオアカジ] で オオアカジ。
#   一般語なので dictionary.yaml・assets/readings_common.yaml にも入れるとほかの回でも効く（このたびは台本と台帳だけの直しなので入れていない）。
#   見直しで足した・変えたセリフも audio_query で確かめた: 心の中の一言（……これは、いけるのだ）は コレワ、/イケル/ノダ（カッコは読まない）、
