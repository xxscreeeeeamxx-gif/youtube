meta:
  title: 【カシオの誕生】発表会で動かなかった計算機から、1000万台の電卓へ【ずんだもん解説】
  slug: casio-kashio-v2
  summary: 手のひらの電卓が生まれる前、計算機は自動車ほどの値段で、歯車の音を立てて動く機械でした。東京・三鷹の小さな町工場で、たばこを指輪にはめる道具を作っていた四兄弟が、なぜ計算機に挑んだのか。電話の交換機のスイッチで組み直した試作機は、札幌の発表会の前の晩に思わぬ事態に見舞われます。兄弟が家まで賭けた転機と、電卓戦争と呼ばれた時代を、再現ドラマでたどります。
  tags:
  - カシオ
  - 電卓
  - 樫尾俊雄
  - 樫尾四兄弟
  - カシオミニ
  - 計算機
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  thumbnail:
    top: 動かない計算機
    bottom: カシオの誕生
  mode: drama
  narrator: reimu
