    reading: はつめいわ いっ ぱーせんとの ひらめきと よんじゅうきゅう ぱーせんとの どりょく。そして ごじゅっ ぱーせんとの てんうん。としおの ことばです。
- id: ch10_shi
  title: ''
  background: cs_kinenkan
  bgm: 223am
  cuts:
