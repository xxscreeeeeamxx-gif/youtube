- id: ch11_chiisaku
  title: 100キロが手のひらへ
  background: cs_zukai
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: つむぎ。100キロの計算機は、どうやって手のひらまで縮んだの？
  - speaker: tsumugi
    emotion: normal
    text: 部品を減らす。まとめる。電気を減らす。この3つよ。
  - speaker: tsumugi
    emotion: normal
    text: 1964年の国産の電子式は、トランジスタを500個以上使ってたの。
  - speaker: zundamon
    emotion: thinking
    text: それが、なんで急に小さく安くなったの？
  - speaker: tsumugi
    emotion: happy
    text: たくさんの部品を小さな板1枚に焼きつける、ICやLSIが出てきたの。
  - speaker: zundamon
    emotion: thinking
    text: 部品を、まとめて1個にしちゃうのか。
  - speaker: tsumugi
    emotion: normal
    text: 電卓の国内生産は、1965年でわずか4000台。それが1970年には、100万台よ。
  - speaker: zundamon
    emotion: surprised
    text: 5年で、250倍なのだ！
  - speaker: tsumugi
    emotion: normal
    text: 次は、電気。[14-A|じゅうよんエー]は、多いときで300ワットも使ってたの。
  - speaker: zundamon
    emotion: surprised
    text: 60ワットの電球、5個分なのだ。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 1973年の液晶の電卓は、単三の電池1本で100時間動いたわ。
  - speaker: zundamon
    emotion: surprised
    text: 電池1本で、100時間！？
  - speaker: tsumugi
    emotion: happy
    text: そこに太陽電池がついて、電池なしでも動くようになったの。
  - speaker: tsumugi
    emotion: normal
    text: 1983年には、厚さ0.8ミリのカードの形の電卓も出たわ。
  - speaker: zundamon
    emotion: surprised
    text: 100キロから、カード1枚！
  - speaker: tsumugi
    emotion: happy
    text: 2006年の暮れには、[001|ぜろぜろいち]から数えたカシオの電卓が10億台を超えたわ。
    telops:
    - {text: 2006年の暮れ 累計10億台, size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: happy
    text: 3台買ったボクも、ちょっとだけ貢献したのだ。
- id: ch12_ronsou
  title: 本当に世界初？
  background: cs_shiryo
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。ネットで見たのだ。[14-A|じゅうよんエー]は、世界初の計算機だって。
  - speaker: tsumugi
    emotion: thinking
    text: それは、言い方に気をつけたほうがいいわ。
  - speaker: tsumugi
    emotion: normal
    text: リレーで計算する機械なら、富士通が1954年に作った大型の計算機が先にあるの。
  - speaker: zundamon
    emotion: surprised
    text: 先があったのか！
  - speaker: tsumugi
    emotion: normal
    text: 部屋いっぱいの大きさで、リレーは4500個くらい。机に置く物じゃないわ。
  - speaker: tsumugi
    emotion: normal
    text: 電子式の卓上計算機なら、世界初は1961年のイギリスの機械よ。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、[14-A|じゅうよんエー]は[何|なん]の世界初なの？
  - speaker: tsumugi
    emotion: normal
    text: 会社の説明は、小型の純電気式計算機として世界初。条件つきの一番なの。
    telops:
    - {text: 小型の純電気式で世界初, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: 条件を足せば、ボクもクラスで一番になれるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: '[何|なん]の一番よ。'
  - speaker: zundamon
    emotion: happy
    text: 電卓を3台持ってる、ずんだもんの中で一番。
  - speaker: tsumugi
    emotion: thinking
    text: それ、1人しかいないじゃない。
    se: tenten
  - speaker: zundamon
    emotion: thinking
    text: ところで電卓と電話のボタンの並びが逆なのは、なんで？
  - speaker: tsumugi
    emotion: normal
    text: 電卓はレジの並びを受け継いで、よく使う0が手前にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 電話は、ダイヤルの1から順に並べた形を受け継いだのよ。決めた規格も、別々なの。
  - speaker: zundamon
    emotion: surprised
    text: 生まれた家が、違うわけか。
- id: ch13_waza
  title: 1たす2かける3は？
  background: cs_ima3
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 電卓の使い方も、少しだけ見ておきましょう。
  - speaker: zundamon
    emotion: happy
    text: 1たす2かける3は、9なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 本当は、かけ算が先で7よ。
  - speaker: zundamon
    emotion: surprised
    text: 電卓は、9って言ってるのに！？
  - speaker: tsumugi
    emotion: normal
    text: ふつうの電卓は、押した順に計算するの。1たす2で3、それに3をかけて9。
  - speaker: tsumugi
    emotion: normal
    text: かけ算を先にしたいなら、2かける3を先に押してから1を足すのよ。
  - speaker: zundamon
    emotion: sad
    text: 間違えてたのは、押したボクのほうだったのだ。
  - speaker: tsumugi
    emotion: happy
    text: 関数電卓なら、1たす2かける3でちゃんと7が出るのよ。
  - speaker: tsumugi
    emotion: normal
    text: カシオの関数電卓は、今も1年に2200万台ほどが100以上の国へ出ていくの。
  - speaker: zundamon
    emotion: happy
    text: '[三鷹|みたか]の町工場の計算機が、世界中の教室にあるのだ。'
- id: shime
  title: ''
  background: cs_ima3
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。間違えるのは押す人だって、よく分かったのだ。
  - speaker: tsumugi
    emotion: happy
    text: あら、えらいわね。
  - speaker: zundamon
    emotion: happy
    text: だから押す人も、3人そろえることにした。
