scenes:
- id: co_sapporo
  title: ''
  background: cs_hotel_haisen
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 樫尾俊雄, emotion: sad}
  - {who: kazuo, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
    text: 1956年の札幌。のちにカシオを作る兄弟が、宿で計算機の配線をつなぎ直していました。
    reading: せんきゅうひゃく ごじゅうろくねんの さっぽろ。のちに かしおお つくる きょうだいが、やどで けいさんきの はいせんお つなぎなおして いました。
  - speaker: kazuo
    emotion: sad
    text: 兄さん……もう、夜が明けます。
  - speaker: zundamon
    emotion: sad
    text: 足し算は動いた。でも、かけ算と割り算が戻らないのだ……。
  - speaker: kazuo
    emotion: thinking
    text: 発表会まで、あと数時間です。
  - speaker: zundamon
    emotion: sad
    text: ……動かない分は、スライドで説明するしかない。
    se: gaan
  - speaker: reimu
    text: この男は、樫尾俊雄。16年後、兄弟の会社は1万2800円の電卓を売り出します。
    reading: この おとこわ かしお としお。じゅうろくねんご、きょうだいの かいしゃわ いちまん にせん はっぴゃくえんの でんたくお うりだします。
  - speaker: reimu
    text: カシオミニ。シリーズで、1000万台が作られました。
    reading: かしおみに。しりーずで いっせんまんだいが つくられました。
- id: hook
  title: ''
  background: cs_ima3
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ見て！ 100円の電卓、3台も買ったのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 3台も、何に使うのよ。
  - speaker: zundamon
    emotion: happy
    text: 1台が間違えたときの、答え合わせ用。
  - speaker: tsumugi
    emotion: angry
    text: 間違えるのは、電卓じゃなくて押す人よ。
    beat: true
  - speaker: zundamon
    emotion: surprised
    text: 発表会で動かなかった計算機から、なんで1000万台も売れたの？
    telops:
    - {text: 動かなかった計算機が1000万台に？, size: md, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、東京の町工場の四兄弟よ。
- id: ch0_senban
  title: 旋盤工の長男
  background: cs_koba
  bgm: hirusagari
  stage:
  - {who: tadao, x: 0.5, emotion: happy}
  cuts:
  - speaker: reimu
    text: 樫尾家は高知の出身です。関東大震災のあと、一家で東京へ移りました。
    reading: かしおけわ こうちの しゅっしんです。かんとう だいしんさいの あと、いっかで とうきょうえ うつりました。
  - speaker: reimu
    text: 1931年。長男の忠雄は14歳で、旋盤工の見習いになります。
    reading: せんきゅうひゃく さんじゅういちねん。ちょうなんの ただおわ じゅうよんさいで、せんばんこうの みならいに なります。
  - speaker: tadao
    emotion: happy
    text: 鉄が、思ったとおりの形に削れていく……。
  - speaker: tadao
    emotion: happy
    text: よし。これは、おれの天職だ。
  - speaker: reimu
    text: 次男の俊雄は15歳で電機学校を出て、国の逓信省の技術者になります。
    reading: じなんの としおわ じゅうごさいで でんき がっこうお でて、くにの ていしんしょうの ぎじゅつしゃに なります。
- id: ch0_kyujitsu
  title: ''
  background: cs_koba
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 樫尾俊雄, emotion: happy}
  - {who: tadao, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1942年に忠雄は独立し、自分の旋盤で仕事を始めていました。
    reading: せんきゅうひゃく よんじゅうにねんに ただおわ どくりつし、じぶんの せんばんで しごとお はじめて いました。
  - speaker: zundamon
    emotion: happy
    text: 兄さん。今日は役所が休みだから、手伝いに来たよ。
  - speaker: tadao
    emotion: thinking
    text: 休みの日くらい、家で寝てろ。
  - speaker: zundamon
    emotion: happy
    text: 寝てるより、旋盤を見てるほうが面白いんだ。
  - speaker: tadao
    emotion: thinking
    text: ……変わったやつだな。じゃあ、床の掃除からだ。
  - speaker: zundamon
    emotion: surprised
    text: 手伝いって、掃除のほうなのだ？
    beat: true
  - speaker: reimu
    text: 俊雄は1945年に、モールス信号を速く送る装置で特許を出願しています。
    reading: としおわ せんきゅうひゃく よんじゅうごねんに、もーるす しんごうお はやく おくる そうちで とっきょお しゅつがん して います。
- id: card1946
  title: ''
  background: cs_card_1946
  cuts:
  - speaker: reimu
    text: 1946年。東京の三鷹で、長男の忠雄が樫尾製作所を開きます。
    reading: せんきゅうひゃく よんじゅうろくねん。とうきょうの みたかで、ちょうなんの ただおが かしお せいさくしょお ひらきます。
- id: ch1_koba
  title: 役所を辞めた次男
  background: cs_koba
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 樫尾俊雄, emotion: normal}
  - {who: tadao, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: 兄さん。ボク、役所を辞めてきました。
  - speaker: tadao
    emotion: surprised
    text: ……[は|はぁ]？
  - speaker: zundamon
    emotion: happy
    text: 明日から、兄さんの工場で働かせてください。
  - speaker: tadao
    emotion: angry
    text: ばか言え。役所の技術者なら、一生食うに困らんだろうが。
  - speaker: zundamon
    emotion: normal
    text: もう、辞表は出しちゃいました。
  - speaker: tadao
    emotion: angry
    text: 出してから相談するやつがあるか！
    se: tsukkomi
  - speaker: zundamon
    emotion: happy
    text: 兄さん。ボクが何か考えるから、兄さんがそれを作ればいい。
  - speaker: tadao
    emotion: thinking
    text: ……うちは、顕微鏡の部品と歯車の下請けだぞ。
  - speaker: zundamon
    emotion: happy
    text: 下請けの仕事も、ちゃんとやります。そのうち、もっと面白い物を作るのだ。
  - speaker: tadao
    emotion: normal
    text: ……しかたない。明日から来い。
    beat: true
  - speaker: reimu
    text: 工場では、顕微鏡の部品や歯車を作りました。鍋や釜、電熱器や自転車のランプもです。
    reading: こうじょうでわ、けんびきょうの ぶひんや はぐるまお つくりました。なべや かま、でんねつきや じてんしゃの らんぷもです。
- id: ch1_nesage
  title: 値下げを申し出る職人
  background: cs_koba
  stage:
  - {who: tadao, x: 0.3, flip: true, emotion: normal}
  - {who: hacchuu, x: 0.7, emotion: normal}
  cuts:
  - speaker: tadao
    emotion: normal
    text: 鉄の玉を削る仕事ですが、1日50個が200個できるようになりました。
  - speaker: hacchuu
    emotion: happy
    text: 4倍か。それは助かる。注文を増やそう。
  - speaker: tadao
    emotion: normal
    text: ですから、1個あたりの値段を下げてください。
  - speaker: hacchuu
    emotion: surprised
    text: ……値下げ？ こっちが頼むならともかく、あんたから？
  - speaker: tadao
    emotion: thinking
    text: このままじゃ、うちがもうけすぎますから。
  - speaker: hacchuu
    emotion: thinking
    text: 値段を下げに来る職人なんて、生まれて初めて見たよ。
  - speaker: hacchuu
    emotion: happy
    text: '[樫尾|かしお]さん。あんたは、正直の上にばかがつくね。'
    se: zukko
  - speaker: reimu
    text: 手間が減ったぶん、値段を下げる。忠雄は、そういう商売をする職人でした。
    reading: てまが へった ぶん、ねだんお さげる。ただおわ そういう しょうばいお する しょくにんでした。
- id: ch1_pipe
  title: 指輪パイプ
  background: cs_koba
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 樫尾俊雄, emotion: happy}
  - {who: chichi, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 父さん。たばこを差しこむ指輪を、考えたのだ。
  - speaker: chichi
    emotion: surprised
    text: 指輪に、たばこ？ なんじゃそりゃ。
  - speaker: zundamon
    emotion: happy
    text: 指にはめたまま吸えるから、両手で仕事ができるんだ。
  - speaker: chichi
    emotion: thinking
    text: ふむ……。仕事をしながら、一服できるがか。
  - speaker: zundamon
    emotion: normal
    text: 兄さんが、旋盤で削ってくれたんだ。
  - speaker: chichi
    emotion: happy
    text: よし。わしが、売り歩いてくるき。
  - speaker: reimu
    text: 指輪パイプは、よく売れました。売り歩いたのは、父の茂です。
    reading: ゆびわ ぱいぷわ よく うれました。うりあるいたのわ、ちちの しげるです。
  - speaker: chichi
    emotion: happy
    text: '[俊雄|としお]。持って出た分は、みんな売れたぜよ。'
  - speaker: zundamon
    emotion: surprised
    text: もう！？ 兄さんに、今夜も旋盤を回してもらうのだ！
  - speaker: chichi
    emotion: happy
    text: 明日は、倍持っていくき。まっこと、ええ指輪じゃ。
  - speaker: zundamon
    emotion: thinking
    text: ……父さん、売るたびに一服してないよね？
    beat: true
  - speaker: reimu
    text: このもうけが、のちの計算機づくりの元手になります。
    reading: この もうけが、のちの けいさんき づくりの もとでに なります。
- id: card1949
  title: ''
  background: cs_card_1949
  cuts:
  - speaker: reimu
    text: 1949年。俊雄と忠雄は、銀座のビジネスショウを見に行きます。
    reading: せんきゅうひゃく よんじゅうくねん。としおと ただおわ、ぎんざの びじねす しょうお みに いきます。
- id: ch2_ginza
  title: 歯車の計算機
  background: cs_tenji0
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 樫尾俊雄, emotion: surprised}
  - {who: tadao, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 兄さん。あの機械、ガチャガチャうるさいね。
  - speaker: tadao
    emotion: normal
    text: 外国の計算機だ。モーターで、歯車を回して計算してる。
  - speaker: zundamon
    emotion: thinking
    text: かけ算ひとつに、ずいぶん待たされるな。
  - speaker: tadao
    emotion: thinking
    text: 値段を聞いてきた。自動車が買えるぞ。
  - speaker: zundamon
    emotion: surprised
    text: 遅くてうるさいのに、自動車と同じ値段！？
    se: bikkuri
  - speaker: zundamon
    emotion: happy
    text: 兄さん、計算機をやってみよう。
  - speaker: tadao
    emotion: surprised
    text: ……うちで、計算機を？
  - speaker: zundamon
    emotion: happy
    text: 歯車をやめて、電気で動かす。速くて静かな計算機を作るのだ。
  - speaker: tadao
    emotion: thinking
    text: うちはその歯車を削って、食ってるんだぞ。
    beat: true
  - speaker: reimu
    text: 歯車の計算機は、かけ算や割り算に平均で10秒ほどかかりました。
    reading: はぐるまの けいさんきわ、かけざんや わりざんに へいきんで じゅうびょう ほど かかりました。
  - speaker: reimu
    text: 1950年に三男の和雄が、1952年に四男の幸雄が加わります。
    reading: せんきゅうひゃく ごじゅうねんに さんなんの かずおが、せんきゅうひゃく ごじゅうにねんに よなんの ゆきおが くわわります。
- id: card1954
  title: ''
  background: cs_card_1954
  cuts:
  - speaker: reimu
    text: 1954年。兄弟は、最初の試作機を完成させます。
    reading: せんきゅうひゃく ごじゅうよねん。きょうだいわ、さいしょの しさくきお かんせい させます。
- id: ch3_shisaku
  title: あと5年早ければ
  background: cs_shousha_shisaku
  bgm: curious
  stage:
  - {who: kazuo, x: 0.3, flip: true, emotion: happy}
  - {who: shousha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 三男の和雄がオートバイを運転し、後ろの幸雄が抱えて商社へ運びます。
    reading: さんなんの かずおが おーとばいお うんてんし、うしろの ゆきおが かかえて しょうしゃえ はこびます。
  - speaker: kazuo
    emotion: happy
    text: 兄が作った30キロの計算機です。ぜひ、見てください。
  - speaker: shousha
    emotion: surprised
    text: 30キロを、オートバイで？
  - speaker: kazuo
    emotion: normal
    text: 弟が後ろで、ずっと抱えてました。
  - speaker: shousha
    emotion: thinking
    text: 計算機より先に、弟さんの腕が壊れますよ。
    beat: true
  - speaker: shousha
    emotion: normal
    text: ほう……。モーターの音が、しませんね。
  - speaker: kazuo
    emotion: happy
    text: 電磁石の力で動かす仕掛けです。歯車の機械より、ずっと静かです。
  - speaker: shousha
    emotion: normal
    text: かけ算の答えにまたかける、[連乗|れんじょう]はできますか。
  - speaker: kazuo
    emotion: sad
    text: ……それは、まだできません。
  - speaker: shousha
    emotion: thinking
    text: 惜しいですね。あと5年早ければ、売れたでしょう。
    se: chin
  - speaker: kazuo
    emotion: sad
    text: 5年前のうちは、指輪パイプを削ってました……。
- id: ch3_relay
  title: 電話のスイッチで計算
  background: cs_koba
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 樫尾俊雄, emotion: thinking}
  - {who: tadao, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1956年。連乗もできるように直し、量産はもう目の前でした。
    reading: せんきゅうひゃく ごじゅうろくねん。れんじょうも できるように なおし、りょうさんわ もう めのまえでした。
  - speaker: zundamon
    emotion: thinking
    text: 兄さん。昨日のボクは、ばかだったのだ。
  - speaker: tadao
    emotion: surprised
    text: 朝から、[何|なん]の話だ。
  - speaker: zundamon
    emotion: normal
    text: この計算機、最初から作り直したいんです。
  - speaker: tadao
    emotion: angry
    text: 今からか！ 量産の準備は、もう始めてるんだぞ。
  - speaker: zundamon
    emotion: normal
    text: 準備は、昨日のボクがしたことなので。
  - speaker: tadao
    emotion: angry
    text: 都合のいいときだけ、昨日の自分のせいにするな！
    beat: true
  - speaker: zundamon
    emotion: normal
    text: 機械で動く部分が、複雑すぎるんです。これじゃ、たくさん作れません。
  - speaker: tadao
    emotion: thinking
    text: じゃあ、[何|なに]で作るんだ。
  - speaker: zundamon
    emotion: happy
    text: リレーです。電話の交換機に、山ほど入ってるスイッチです。
  - speaker: tadao
    emotion: surprised
    text: 電話のスイッチで、計算ができるのか。
  - speaker: zundamon
    emotion: normal
    text: 電気を流すと電磁石が板を引き寄せて、別の回路がつながるんです。
  - speaker: tadao
    emotion: surprised
    text: ……電気が、電気のスイッチを押すのか。
  - speaker: zundamon
    emotion: happy
    text: 動くのは小さな板だけ。歯車も、モーターも要らない。
  - speaker: tadao
    emotion: thinking
    text: スイッチだけで、どうやって数字を覚える。
  - speaker: zundamon
    emotion: normal
    text: 入ってるか、切れてるか。その組み合わせで、数字を表します。
  - speaker: zundamon
    emotion: normal
    text: 5の玉があるかないかと、残りの玉で1けたを表すんです。
  - speaker: tadao
    emotion: surprised
    text: ……そろばんか。それなら、おれにも分かる。
  - speaker: zundamon
    emotion: happy
