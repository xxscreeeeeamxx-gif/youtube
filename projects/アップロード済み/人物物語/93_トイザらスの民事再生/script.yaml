meta:
  title: 「石の上にも三年」と米大統領が称えたトイザらス、負債132億円で民事再生【ずんだもん解説】
  slug: toysrus-japan
  hook_line: おもちゃ市場は5年連続で過去最高。なのに、なぜトイザらスは倒れたのか。
  summary: 2026年10月1日、日本トイザらスが民事再生を申し立てました。おもちゃの市場は5年連続で過去最高なのに、なぜ。子どものころから通う「お客さん」の目で、35年を見ていきます。国会を揺らした上陸、大統領が来た開店の日、そしておもちゃのお金が流れる先の移り変わり。会社・PPIH・報道、それぞれの見方を並べて、再現ドラマでたどります。2026年10月時点の情報です。
  sources:
  - 日本トイザらス「民事再生手続開始の申立て及び事業譲渡契約締結についてのお知らせ」（2026年10月1日） https://www.toysrus.co.jp/on/demandware.static/-/Sites-ToysRUs_JP-Library/default/01-tru-jp/corporate/pressroom/pdf/news_261001_01.pdf
  - PPIH「日本トイザらス株式会社との事業譲渡契約の締結」質疑応答要旨（2026年10月1日） https://ppih.co.jp/ir/library/earnings/pdf/8815da4ed3daf477d7bef631b0cb1ee7.pdf
  - 日本玩具協会「2025年度 国内玩具市場規模」（2026年6月22日） https://www.toys.or.jp/toukei_siryou_data.html
  - 帝国データバンク「玩具店（おもちゃ店）」業界動向調査（2026年10月1日） https://news.yahoo.co.jp/articles/f058faefe5fc3c03614a42a38caf008b272b790d
  - 国会会議録 衆議院予算委員会（1990年4月21日） https://kokkai.ndl.go.jp/txt/111805261X01319900421/80
  - Public Papers of the Presidents, George H. W. Bush "Remarks at the Opening of Toys-R-Us in Kashihara, Japan"（1992年1月7日） https://www.govinfo.gov/content/pkg/PPP-1992-book1/html/PPP-1992-book1-doc-pg47.htm
