  - speaker: kisha
    emotion: surprised
    text: 大統領が、おもちゃ屋の開店に……。
  - speaker: kinjo
    emotion: happy
    text: 大統領さん、何かこうてくれはったんやろか。
  - speaker: kisha
    emotion: thinking
    text: おこづかいを、減らされたそうです。
  - speaker: kinjo
    emotion: surprised
    text: 大統領でも、こづかい制なんや……。
    beat: true
  - speaker: kisha
    emotion: normal
