  - speaker: tsumugi
    emotion: normal
    text: 公表されてないわ。PPIHは、譲渡の対価そのものは限定的と言ってる。
  - speaker: tsumugi
    emotion: normal
    text: 売り場の約1割は、体験できる遊び場にする計画。
  - speaker: zundamon
    emotion: surprised
    text: 遊び場！？
  - speaker: tsumugi
    emotion: normal
    text: PPIHの大型店約110店を候補に、中にも店を出すと日経は報じてる。
  - speaker: tsumugi
    emotion: normal
    text: 日経は、今の店を改装して大人向けの商品も増やす計画だと報じてる。
  - speaker: zundamon
    emotion: happy
    text: 大人向け！ ボクの出番なのだ！
  - speaker: tsumugi
    emotion: thinking
