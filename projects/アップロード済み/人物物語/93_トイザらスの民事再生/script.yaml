  title: ''
  background: tr_card_1992
  bgm: you_and_me
  cuts:
  - speaker: reimu
    text: 1992年1月7日。奈良県橿原市の2号店に、ヘリコプターで客がやって来ます。
    reading: せんきゅうひゃく きゅうじゅうにねん いちがつ なのか。ならけん かしはらしの にごうてんに、へりこぷたーで きゃくが やってきます。
