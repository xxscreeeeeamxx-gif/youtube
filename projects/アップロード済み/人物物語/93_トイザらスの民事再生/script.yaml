  - speaker: zundamon
    emotion: happy
    text: あの店長さんも、残れるかもしれないのだ！
  - speaker: zundamon
    emotion: thinking
    text: じゃあ負債の132億円は、ドンキが払うの？
  - speaker: tsumugi
    emotion: normal
    text: そこは、誤解しやすいの。
  - speaker: tsumugi
    emotion: normal
    text: PPIHは過去の借入金などを、そのまま引き継ぐわけじゃないと説明してる。
  - speaker: zundamon
    emotion: thinking
    text: 肩代わりじゃ、ないのか。
  - speaker: tsumugi
    emotion: normal
