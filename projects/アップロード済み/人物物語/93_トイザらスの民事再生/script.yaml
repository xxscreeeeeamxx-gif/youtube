  - speaker: kisha
    emotion: surprised
    text: 別の見出しは、予想通りの大渋滞。路線バス一時間遅れも。
  - speaker: kinjo
    emotion: thinking
    text: うちの前の道、ちっとも動かへん。
    beat: true
- id: ch3_daijin
  title: ''
  background: tr_kokkai
  stage:
  - {who: daijin, x: 0.5, emotion: normal}
  cuts:
  - speaker: reimu
    text: 開店の式には、通産大臣の渡部恒三も出ていました。
    reading: かいてんの しきにわ、つうさん だいじんの わたなべ こうぞうも でて いました。
  - speaker: reimu
    text: 3月の国会。議員は、周りのおもちゃ屋の嘆きを報じた記事を紹介します。
    reading: さんがつの こっかい。ぎいんわ、まわりの おもちゃやの なげきお ほうじた きじお しょうかい します。
  - speaker: reimu
    text: こちらにも、宮澤さんが来てくれたら。
    reading: こちらにも みやざわさんが きて くれたら。
  - speaker: reimu
    text: 宮澤さんは、当時の首相です。議員は、大臣が周りの店にも寄ったのかと尋ねました。
    reading: みやざわさんわ とうじの しゅしょうです。ぎいんわ だいじんが まわりの みせにも よったのかと たずねました。
  - speaker: daijin
    emotion: thinking
