# ---- 論争：少子化だから仕方ない？ ----
- id: ch8_ronso
  title: 少子化だから仕方ない？
  background: tr_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、ネットで見たのだ！
  - speaker: zundamon
    emotion: normal
    text: トイザらスは、少子化とアマゾンに負けた。仕方なかったって！
  - speaker: tsumugi
    emotion: normal
    text: 半分だけ、合ってるわね。
    beat: true
  - speaker: zundamon
    emotion: surprised
    text: 半分！？
  - speaker: tsumugi
    emotion: normal
    text: 生まれた子どもは、1991年に約122万人。2025年は約67万人よ。
  - speaker: zundamon
    emotion: surprised
    text: 子どもも、ほぼ半分！？
  - speaker: tsumugi
    emotion: normal
    text: でもおもちゃの市場は、5年連続で過去最高だったでしょ。
  - speaker: zundamon
    emotion: thinking
    text: 子どもが減ったのに、なんで？
  - speaker: tsumugi
    emotion: normal
    text: トレカだけで3384億円。市場の約3割なの。
  - speaker: tsumugi
    emotion: normal
    text: 10年前の、約3.5倍よ。
  - speaker: zundamon
    emotion: surprised
    text: 3.5倍！？
  - speaker: tsumugi
    emotion: normal
    text: PPIHの説明だと、市場は子どものための[玩具|がんぐ]から広がったの。
  - speaker: tsumugi
    emotion: normal
    text: 自分の好きに、お[金|かね]と時間を使う市場にね。
  - speaker: zundamon
    emotion: happy
    text: ボクの[推し活|おしかつ]のことなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: ずんだもんの12個くらいじゃ、市場は動かないわよ。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: それと会社自身も、少子化のせいとは書いてないの。
  - speaker: zundamon
    emotion: surprised
    text: 書いてないの！？
  - speaker: tsumugi
    emotion: normal
    text: 少子化を踏まえた事業転換の遅れ。そう書いたのよ。
  - speaker: zundamon
    emotion: thinking
    text: 子どもが減るのに合わせて、変わりきれなかった……。
  - speaker: tsumugi
    emotion: normal
    text: 会社も、都市型の小さな店への切り替えは進めてたのよ。
  - speaker: zundamon
    emotion: thinking
    text: 変わろうとは、してたんだ。
  - speaker: zundamon
    emotion: normal
    text: じゃあ、アマゾンは？
  - speaker: tsumugi
    emotion: normal
    text: ネット通販との価格競争は、会社も理由に挙げてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 帝国データバンクは、家電量販店との競争や流行への対応の遅れも挙げてる。
  - speaker: zundamon
    emotion: surprised
    text: 家電量販店まで！？
  - speaker: tsumugi
    emotion: thinking
    text: PPIHは十分な成長投資が行われていなかった、と見てるの。
  - speaker: zundamon
    emotion: surprised
    text: 原因が、いっぱいなのだ！
  - speaker: tsumugi
    emotion: normal
    text: どれか1つが本当の理由、とは言えないのよ。
  - speaker: zundamon
    emotion: thinking
    text: アメリカの本社が潰れたせいでも、ないの？
  - speaker: tsumugi
    emotion: normal
    text: 本国が破綻したとき、日本は影響を受けないと発表したの。
  - speaker: tsumugi
    emotion: normal
    text: 申し立ては、その9年後よ。
  - speaker: zundamon
    emotion: thinking
    text: でも昔は、トイザらスが街のおもちゃ屋を潰したって聞いたよ。
  - speaker: tsumugi
    emotion: normal
    text: それも、数字では言い切れないの。
  - speaker: tsumugi
    emotion: normal
    text: 通産省は1993年の国会で、当初は多少の影響があったとしたうえで
  - speaker: tsumugi
    emotion: normal
    text: 徐々に客足も戻ってきておると聞いている、と答えたわ。
  - speaker: zundamon
    emotion: thinking
    text: 戻ってきたのか。
  - speaker: tsumugi
    emotion: thinking
    text: 一方で[橿原|かしハら]の周りのおもちゃ屋は、1割以上の売上減と報じられたこともあるの。
  - speaker: zundamon
    emotion: thinking
    text: 心配した人がいたのは、本当なんだね。
  - speaker: tsumugi
    emotion: normal
    text: そう。そして今は、従来型のおもちゃ屋も売上を伸ばしてるの。
  - speaker: zundamon
    emotion: surprised
    text: 街の店も、伸びてるんだ。
  - speaker: tsumugi
    emotion: thinking
    text: 比べた2020年度は、コロナの年で低かった分も割り引いてね。
  - speaker: tsumugi
    emotion: normal
    text: 伸びたのは、ガチャとトレカの店。なんでもそろう大きな店じゃなかったのね。
  - speaker: zundamon
    emotion: thinking
    text: 財布は太ったのに、レジが痩せたのは……。
  - speaker: tsumugi
    emotion: normal
    text: 財布の中身が、別のレジへ流れたからね。
  - speaker: zundamon
    emotion: thinking
    text: おもちゃにお[金|かね]を使う場所が、変わったのか……。
  - speaker: tsumugi
    emotion: normal
    text: それと本当の注意点は、あなたの財布の中にあるかもしれないの。
