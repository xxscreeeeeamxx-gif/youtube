scenes:
# ---- 先出し（2026年10月1日の店先） ----
- id: co_misesaki
  title: ''
  background: tr_mise_soto
  bgm: serious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: お客さん, emotion: normal}
  - {who: kisha, x: 0.56, emotion: normal}
  - {who: tencho, x: 0.78, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2026年10月1日。全国に約150の店を持つ、日本トイザらスの店先です。
    reading: にせん にじゅうろくねん じゅうがつ ついたち。ぜんこくに やく ひゃくごじゅうの みせお もつ、にほん といざらすの みせさきです。
  - speaker: kisha
    emotion: normal
    text: 民事再生を申し立てたそうですね。お店は、どうなりますか。
  - speaker: tencho
    emotion: normal
    text: 平常どおり、営業しております。
  - speaker: zundamon
    emotion: surprised
    text: 倒産したのに、開いてるんですか！？
    se: bikkuri
  - speaker: tencho
    emotion: happy
    text: はい。……いらっしゃいませ。
  - speaker: zundamon
    emotion: thinking
    text: こ、この状況で接客を……。
    beat: true
  - speaker: reimu
    text: 負債は約132億円。事業は、ドン・キホーテを持つPPIHのグループが引き継ぐ予定です。
    reading: ふさいわ やく ひゃくさんじゅうにおくえん。じぎょうわ どんきほーてお もつ ぴーぴーあいえいちの ぐるーぷが ひきつぐ よていです。
    telops:
    - {text: "負債　約132億円", size: lg, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: おもちゃの市場は、過去最高なのに。なぜ、トイザらスは倒れたのでしょうか。
    reading: おもちゃの しじょうわ かこ さいこう なのに。なぜ といざらすわ たおれたのでしょうか。
# ---- 茶番（今の部屋） ----
- id: hook
  title: ''
  background: tr_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ ガチャのカプセル、今日だけで12個なのだ！
  - speaker: tsumugi
    emotion: surprised
    text: 12回も回したの！？
  - speaker: zundamon
    emotion: happy
    text: '[推し|おし]が出るまで回す。それが大人の財力なのだ。'
    beat: true
  - speaker: tsumugi
    emotion: thinking
    text: そのお[金|かね]、子どものころならどこで使ってた？
  - speaker: zundamon
    emotion: normal
    text: ……[トイザらス|トイザラス]。ボク、小学生のころから[通って|かよって]たよ。
  - speaker: tsumugi
    emotion: normal
    text: 今は、行ってないのね。
  - speaker: zundamon
    emotion: surprised
    text: ボクのお[金|かね]、どこへ行ったのだ！？
# ---- 仕組み1：鏡写しの数字（2026年10月1日の店内） ----
- id: ch1_kagami
  title: 市場は過去最高なのに
  background: tr_mise
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: お客さん, emotion: normal}
  - {who: kisha, x: 0.56, emotion: normal}
  - {who: tencho, x: 0.78, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: 子どものころは、この通路が人でぎっしりだったんです。
  - speaker: kisha
    emotion: normal
    text: おもちゃの市場は昨年度、1兆1664億円。5年連続で過去最高なんですよ。
  - speaker: zundamon
    emotion: surprised
    text: 過去最高！？
  - speaker: kisha
    emotion: normal
    text: '[日本玩具協会|にほんがんぐきょうかい]の数字です。2017年度の約8000億円から、約46％増えました。'
  - speaker: kisha
    emotion: thinking
    text: 一方でトイザらスの売上は、8年前の1394億円から752億円へ。
  - speaker: kisha
    emotion: thinking
    text: こちらは、約46％減です。
    telops:
    - {text: "市場＋46％　トイザらス−46％", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tencho
    emotion: thinking
    text: ……鏡に映したみたいですね。
  - speaker: zundamon
    emotion: thinking
    text: もうちょっと、分かりやすく言うと？
  - speaker: kisha
    emotion: normal
    text: おもちゃ全体の財布に、1000円入っていたとします。8年で約1460円に増えました。
  - speaker: kisha
    emotion: normal
    text: 同じ8年で、トイザらスのレジの1000円は約540円に。
  - speaker: zundamon
    emotion: surprised
    text: 財布は太ったのに、レジだけ痩せた！？
    se: gaan
  - speaker: tencho
    emotion: sad
    text: ……うちのレジ、ダイエット中なんです。
    beat: true
  - speaker: zundamon
    emotion: thinking
    text: じゃあ増えた分のお[金|かね]は、どこへ行ったんですか。
  - speaker: kisha
    emotion: normal
    text: 駅前に、行ってみましょう。
# ---- 仕組み2：駅前のガチャの行列 ----
- id: ch1_ekimae
  title: 伸びたのはガチャとトレカ
  background: led_machi_yoru
  bgm: pop
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: お客さん, emotion: surprised}
  - {who: kisha, x: 0.56, emotion: normal}
  - {who: narabi, x: 0.78, emotion: happy}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: ガチャの専門店に、行列が！
  - speaker: narabi
    emotion: happy
    text: 並ぶのは、慣れてるんで。
  - speaker: kisha
    emotion: normal
    text: 帝国データバンクだと、おもちゃ屋の売上の合計も7620億円。この10年で最高です。
  - speaker: kisha
    emotion: normal
    text: 引っぱったのが、ガチャの専門店とトレカの専門店。
  - speaker: kisha
    emotion: normal
    text: 2020年度を100とすると、ガチャの店は385。トレカの店は307です。
    telops:
    - {text: "ガチャ店385　トレカ店307", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 4倍近くと、3倍！？
  - speaker: kisha
    emotion: normal
    text: 従来型のおもちゃ屋も151。こちらも伸びてはいるんです。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、トイザらスは？
  - speaker: kisha
    emotion: thinking
    text: 伸びたのが、別の場所だったんです。
  - speaker: kisha
    emotion: normal
    text: 大人は欲しいキャラを狙う[指名買い|しめいがい]。ガチャは、引くこと自体が楽しみ。
  - speaker: narabi
    emotion: happy
    text: 欲しいのは決まってるんで。棚を見て回るとか、しないっす。
  - speaker: kisha
    emotion: normal
    text: 帝国データバンクは、こう分析しています。
  - speaker: kisha
    emotion: normal
    text: 棚を見て回りながら選ぶ従来型のおもちゃ店とは、相性が必ずしも良いとは言い切れない。
  - speaker: zundamon
    emotion: sad
    text: 棚を見て選ぶ店って、トイザらスそのものだ……。
  - speaker: kisha
    emotion: normal
    text: 会社は申し立ての理由に、ネット通販などとの激しい価格競争も挙げています。
  - speaker: zundamon
    emotion: thinking
    text: 子どものころはトイザらス。学生のころは家電量販店。
  - speaker: zundamon
    emotion: thinking
    text: 親になったらネットで、今は駅前のガチャ。
  - speaker: zundamon
    emotion: surprised
    text: ボクのお[金|かね]、何回も引っ越してたのだ！
    se: hirameki
  - speaker: narabi
    emotion: normal
    text: お兄さん、列が進みましたよ。
    beat: true
  - speaker: reimu
    text: おもちゃにお金を使う場所が、少しずつ変わっていきました。
    reading: おもちゃに おかねお つかう ばしょが すこしずつ かわって いきました。
  - speaker: reimu
    text: このお客さんの、最初の行き先。それが35年前に上陸した、トイザらスでした。
    reading: この おきゃくさんの さいしょの いきさき。それが さんじゅうごねんまえに じょうりく した といざらすでした。
# ---- 上り坂：1989年 ----
- id: card1989
  title: ''
  background: tr_card_1989
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 1989年11月。日本トイザらスが生まれます。アメリカのトイザらスと、日本マクドナルドの合弁でした。
    reading: せんきゅうひゃく はちじゅうくねん じゅういちがつ。にほん といざらすが うまれます。あめりかの といざらすと にほん まくどなるどの ごうべんでした。
  - speaker: reimu
    text: 日本側の責任者は、日本マクドナルドを始めた藤田田。店を出す土地選びも、日本マクドナルドが手伝いました。
    reading: にほんがわの せきにんしゃわ、にほん まくどなるどお はじめた ふじた でん。みせお だす とちえらびも にほん まくどなるどが てつだいました。
  - speaker: reimu
    text: 同じ年の3月。東京の府中では、ドン・キホーテの1号店が開いていました。
    reading: おなじ としの さんがつ。とうきょうの ふちゅうでわ、どんきほーての いちごうてんが ひらいて いました。
  - speaker: reimu
    text: このとき、まだ誰も、この2つの店がいつか1つになろうとは思っていません。
    reading: この とき まだ だれも、この ふたつの みせが いつか ひとつに なろうとわ おもって いません。
# ---- 新潟の商店街（1990年） ----
- id: ch2_niigata
  title: 新潟の商店街
  background: tr_kaigi
  stage:
  - {who: shoten, x: 0.28, flip: true, emotion: angry}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1990年1月。トイザらスは、新潟市に店を出すと表明します。
    reading: せんきゅうひゃく きゅうじゅうねん いちがつ。といざらすわ、にいがたしに みせお だすと ひょうめい します。
  - speaker: kisha
    emotion: normal
    text: トイザらスの出店に、反対なさってるそうですね。
  - speaker: shoten
    emotion: angry
    text: 当たり前だ。大きな店を出すには、地元と話し合う決まりがある。
  - speaker: shoten
    emotion: angry
    text: '[大店法|だいてんほう]だ。それをアメリカが、話し合いの期間を縮めろと言ってきた。'
  - speaker: kisha
    emotion: normal
    text: どのくらい、縮まるんですか。
  - speaker: shoten
    emotion: angry
    text: 2年の目安が、1年半。法律を変えたら、1年だそうだ。
  - speaker: kisha
    emotion: surprised
    text: 半分に……。
  - speaker: kisha
    emotion: normal
    text: 新潟では、出店を表明した11社の説明を一斉に進めると決まりました。
  - speaker: shoten
    emotion: angry
    text: トイザらスにジャスコに、イトーヨーカ堂。こっちには相談もなしだ。
  - speaker: shoten
    emotion: angry
    text: 日程を勝手に決めよって。まるで問答無用だ！
  - speaker: kisha
    emotion: surprised
    text: それで、抗議を。
  - speaker: shoten
    emotion: normal
    text: 商店街の連盟と、トイザラス対策協議会でな。
  - speaker: shoten
    emotion: thinking
    text: うちみたいな小さなおもちゃ屋は、どうなるんだ。
# ---- 国会（1990年4月） ----
- id: ch2_kokkai
  title: たった一社のために
  background: tr_kokkai
  stage:
  - {who: giin, x: 0.28, flip: true, emotion: angry}
  - {who: kanryo, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 4月の国会。共産党の小沢和秋議員が、通産省に迫ります。
    reading: しがつの こっかい。きょうさんとうの おざわ かずあき ぎいんが つうさんしょうに せまります。
  - speaker: kanryo
    emotion: thinking
    text: アメリカはトイザラスの件も頭にあることは事実だと思います。
  - speaker: reimu
    text: 通産省は、アメリカの主張はもっと大きな立場からのものだ、とも答えました。
    reading: つうさんしょうわ あめりかの しゅちょうわ もっと おおきな たちばからの ものだとも こたえました。
  - speaker: giin
    emotion: angry
    text: トイザラスたった一社のために我が国の[大店法|だいてんほう]の運用を変えろ。
  - speaker: giin
    emotion: angry
    text: 将来は法律を変えろ。これは余りにも日本をばかにした要求ではないか。
    se: don
    telops:
    - {text: "議員　トイザラスたった一社のために", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: giin
    emotion: angry
    text: 多くの[商店主|しょうてんしゅ]が生まれて初めて団結という鉢巻きを締めて立ち上がった。
  - speaker: kanryo
    emotion: thinking
    text: ……。
  - speaker: reimu
    text: 5月の国会では、日米の交渉そのものを、黒船来襲だと言った議員もいました。
    reading: ごがつの こっかいでわ、にちべいの こうしょう そのものお くろふね らいしゅうだと いった ぎいんも いました。
# ---- 国会（1991年4月）：藤田田の友人 ----
- id: ch2_takaoka
  title: マクドナルドの藤田君
  background: tr_kokkai
  stage:
  - {who: takaoka, x: 0.5, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1991年4月の国会。西友会長の高丘季昭が、アメリカの大使とのやり取りを明かします。
    reading: せんきゅうひゃく きゅうじゅういちねん しがつの こっかい。せいゆう かいちょうの たかおか すえあきが、あめりかの たいしとの やりとりお あかします。
  - speaker: takaoka
    emotion: happy
    text: トイザラスについては、日本側の責任者であるマクドナルドの[藤田君|ふじたくん]と私は
  - speaker: takaoka
    emotion: happy
    text: 実は大学時代からの友人でございます。それは応援しますよということは申し上げました。
  - speaker: reimu
    text: 外圧を利用したのでは、と問われると、こう答えました。
    reading: がいあつお りよう したのでわと とわれると、こう こたえました。
  - speaker: takaoka
    emotion: normal
    text: 外圧を利用して私どもに有利な展開をしてほしいというようなことは
  - speaker: takaoka
    emotion: normal
    text: 私は申しておりません。
    beat: true
  - speaker: reimu
    text: その年の5月、大店法を変える法律が成立します。
    reading: その としの ごがつ、だいてんほうお かえる ほうりつが せいりつ します。
  - speaker: reimu
    text: 12月。茨城県阿見町のショッピングセンターの中に、国内の1号店が開きました。
    reading: じゅうにがつ。いばらきけん あみまちの しょっぴんぐ せんたーの なかに、こくないの いちごうてんが ひらきました。
  - speaker: reimu
    text: トイザらスが開けたこの風穴は、のちに思わぬ相手も通していきます。
    reading: といざらすが あけた この かざあなわ、のちに おもわぬ あいても とおして いきます。
# ---- 1992年：大統領が来た店 ----
