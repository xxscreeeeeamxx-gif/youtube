- id: ch3_sagami_kiroku
  title: ''
  background: tr_mise
  cuts:
  - speaker: reimu
    text: この相模原の店は、のちに世界中のトイザらスで、1日と1年の売上の最高記録を作ります。
    reading: この さがみはらの みせわ、のちに せかいじゅうの といざらすで いちにちと いちねんの うりあげの さいこう きろくお つくります。
    telops:
    - {text: "全世界のトイザらスで最高の売上", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: 大きな店と、安い値段。この2つで、トイザらスは広がっていきます。
    reading: おおきな みせと やすい ねだん。この ふたつで といざらすわ ひろがって いきます。
  - speaker: reimu
    text: その安さの勝負で、のちに自分が追われる側に回るとは、まだ誰も思っていません。
    reading: その やすさの しょうぶで、のちに じぶんが おわれる がわに まわるとわ まだ だれも おもって いません。
- id: ch3_niigata1994
