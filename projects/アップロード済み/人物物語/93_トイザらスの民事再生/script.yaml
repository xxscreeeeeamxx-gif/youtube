  background: tr_mise_soto
  stage:
  - {who: bush, x: 0.5, emotion: happy}
  cuts:
  - speaker: reimu
    text: アメリカのブッシュ大統領です。トイザらスを始めたラザラス会長の紹介で、開店の式に立ちました。
    reading: あめりかの ぶっしゅ だいとうりょうです。といざらすお はじめた らざらす かいちょうの しょうかいで、かいてんの しきに たちました。
  - speaker: bush
    emotion: happy
    text: 孫たちは、この旅のハイライトはトイザらスだと思っていた。
  - speaker: bush
    emotion: sad
    text: でもバーバラに、おこづかいを減らされてね。何も買ってあげられない。
    se: manuke
  - speaker: reimu
    text: 会場の笑いを取ると、大統領は日本の大店法の改正をたたえ、ことわざを引きます。
    reading: かいじょうの わらいお とると だいとうりょうわ にほんの だいてんほうの かいせいお たたえ、ことわざお ひきます。
  - speaker: bush
    emotion: normal
    text: 石の上にも三年。トイザらスは、まさにそれを[地|じ]で行った。
    telops:
    - {text: "大統領　石の上にも三年", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: bush
    emotion: normal
    text: 60億ドルの日本のおもちゃ市場をこじ開けた、3年の戦いから学ぶことは多い。
  - speaker: reimu
    text: 日米の貿易については、こうも言いました。
    reading: にちべいの ぼうえきに ついてわ、こうも いいました。
  - speaker: bush
    emotion: thinking
    text: これまでの成果は喜んでいるが、個別の合意だけでは満足していない。
- id: ch3_kinjo
  title: ''
  background: tr_mise_soto
