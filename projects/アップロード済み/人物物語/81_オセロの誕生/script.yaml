scenes:
- id: co_tsukuda
  title: ''
  background: os_tsukuda
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, emotion: normal}
  - {who: wakui, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1972年10月。手作りのオセロを抱えた製薬会社の営業マンが、東京のおもちゃ会社を訪ねます。
    reading: せんきゅうひゃく ななじゅうにねん じゅうがつ。てづくりの おせろお かかえた せいやく がいしゃの えいぎょうまんが、とうきょうの おもちゃ がいしゃお たずねます。
  - speaker: zundamon
    emotion: normal
    text: 駒は、牛乳瓶のフタです。やってみてください。
  - speaker: wakui
    emotion: thinking
    text: 新しいゲームは、30秒で説明できないと売れませんよ。
  - speaker: zundamon
    emotion: normal
    text: 30秒も、いりません。挟んだら、全部返す。それだけです。
  - speaker: wakui
    emotion: normal
    text: ……お預かりしましょう。
  - speaker: zundamon
    emotion: surprised
    text: お、お預かり……ですか。
    se: gaan
  - speaker: reimu
    text: この男は、長谷川五郎。最初に作られたオセロは、たった3000個でした。
    reading: この おとこわ はせがわ ごろう。さいしょに つくられた おせろわ、たった さんぜんこでした。
  - speaker: reimu
    text: それが3年目には、1年で280万個も売れます。
    reading: それが さんねんめにわ、いちねんで にひゃく はちじゅうまんこも うれます。
- id: hook
  title: ''
  background: os_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: オセロは30秒で覚えたのだ。もう負けないぞ！
  - speaker: tsumugi
    emotion: normal
    text: じゃあ、ずんだもんの番ね。
  - speaker: zundamon
    emotion: surprised
    text: ……あれ？ 置ける所が、1つもないのだ。
    beat: true
  - speaker: tsumugi
    emotion: thinking
    text: 序盤に取りすぎよ。覚えるのと勝つのは、別の話。
  - speaker: zundamon
    emotion: thinking
    text: こんな意地悪なゲームが、3000個から280万個？
    telops:
    - {text: なぜ280万個も売れた？, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 作ったのは薬の営業マン。本人が語る始まりは、戦争が終わった年の焼け跡よ。
- id: card1932
  title: ''
  background: os_card_1932
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1932年、長谷川五郎は水戸で生まれます。父の四郎は、英文学者でした。
    reading: せんきゅうひゃく さんじゅうにねん、はせがわ ごろうわ みとで うまれます。ちちの しろうわ、えいぶんがくしゃでした。
- id: card1945
  title: ''
  background: os_card_1945
  bgm: 223am
  cuts:
  - speaker: reimu
    text: 1945年8月2日の未明。水戸は空襲を受け、五郎の家も中学校も焼けました。
    reading: せんきゅうひゃく よんじゅうごねん はちがつ ふつかの みめい。みとわ くうしゅうお うけ、ごろうの いえも ちゅうがっこうも やけました。
- id: ch1_yakeato
  title: ''
  background: os_mito
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, scale: 0.85, emotion: sad}
  - {who: haha, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
    text: 朝になって、五郎は家のあった場所へ戻りました。
    reading: あさに なって、ごろうわ いえの あった ばしょえ もどりました。
  - speaker: zundamon
    emotion: sad
    text: ……家も学校も、灰になってるのだ。
    background: os_mito_yake
  - speaker: haha
    emotion: surprised
    text: 五郎！ 無事だったのね。
  - speaker: zundamon
    emotion: surprised
    text: 母さん！ みんなは？
  - speaker: haha
    emotion: happy
    text: 全員、無事よ。それだけで[十分|じゅうぶん]。
  - speaker: zundamon
    emotion: sad
    text: 電気もラジオも、新聞も無いのだ……。
  - speaker: reimu
    text: 広島と長崎の新型爆弾もソ連の参戦も、人づてに聞きました。
    reading: ひろしまと ながさきの しんがた ばくだんも それんの さんせんも、ひとづてに ききました。
- id: ch1_aozora
  title: 焼け跡の10分休み
  background: os_aozora
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 長谷川五郎, scale: 0.85, emotion: sad}
  - {who: doukyu, x: 0.56, emotion: happy}
  - {who: kyuyu, x: 0.78, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 9月。土手の下に黒板を1枚置いて、青空授業が始まりました。
    reading: くがつ。どての したに こくばんお いちまい おいて、あおぞら じゅぎょうが はじまりました。
  - speaker: zundamon
    emotion: sad
    text: 配給は、カボチャばかり。みんなの顔が、黄色いのだ。
  - speaker: doukyu
    emotion: happy
    text: 長谷川、碁石があるぞ。10分休みに囲碁やろうぜ。
  - speaker: kyuyu
    emotion: thinking
    text: 囲碁って、相手の石を囲んだら取るんだっけ？
  - speaker: doukyu
    emotion: angry
    text: ほら囲んだ！ この石、もらうぞ！
  - speaker: kyuyu
    emotion: angry
    text: まだ囲めてない！ そこ、すき間あるだろ！
  - speaker: doukyu
    emotion: angry
    text: すき間なんか、ない！
  - speaker: kyuyu
    emotion: angry
    text: あるって！ ほら、ここ！
  - speaker: zundamon
    emotion: thinking
    text: ……ルールを説明してたら、10分休みが終わるな。
  - speaker: zundamon
    emotion: happy
    text: 面倒だ。挟んだら、取れることにしよう！
    se: hirameki
    telops:
    - {text: 挟んだら取る, size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: doukyu
    emotion: surprised
    text: 挟むだけ？ それなら、すぐ分かる！
  - speaker: kyuyu
    emotion: normal
    text: 取った所には、自分の石を置き直すんだな。
  - speaker: doukyu
    emotion: thinking
    text: 置き直し、置き直し……。休み時間が終わっちゃうぞ！
  - speaker: zundamon
    emotion: thinking
    text: いちいち置き直すのは、手間だな。
  - speaker: zundamon
    emotion: happy
    text: なら、[表|おもて]と裏を黒と白に塗った紙にする。ひっくり返すだけだ！
  - speaker: kyuyu
    emotion: surprised
    text: 返すだけなら、10分で1局終わる！
  - speaker: reimu
    text: 五郎は、石が黒と白なのは碁石から始まったからだと書いています。
    reading: ごろうわ、いしが くろと しろなのわ ごいしから はじまったからだと かいて います。
- id: ch1_m
  title: ''
  background: os_kyoushitsu
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, scale: 0.9, emotion: normal}
  - {who: doukyu, x: 0.7, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 1948年、高校1年。芸術家肌の友人のM君が、家で大きな駒を作ってきました。
    reading: せんきゅうひゃく よんじゅうはちねん、こうこう いちねん。げいじゅつか はだの ゆうじんの えむくんが、いえで おおきな こまお つくって きました。
  - speaker: doukyu
    emotion: surprised
    text: 長谷川、見ろよ。M君の駒、でかいぞ。
  - speaker: zundamon
    emotion: surprised
    text: 直径3.5センチ……。きれいなのだ！
  - speaker: zundamon
    emotion: happy
    text: この駒で打つと、一段と楽しいな！
  - speaker: doukyu
    emotion: happy
    text: 返すときの手ざわりが、ぜんぜん違う。
  - speaker: doukyu
    emotion: happy
    text: 長谷川の紙の駒より、ずっと立派だな。
  - speaker: zundamon
    emotion: thinking
    text: ……ひと言、多いのだ。
    beat: true
  - speaker: reimu
    text: この3.5センチが、のちのオセロの石の大きさになります。
    reading: この さんてんご せんちが、のちの おせろの いしの おおきさに なります。
- id: ch2_ryouyou
  title: 6年の療養
  background: os_byouin
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, emotion: sad}
  - {who: ishi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: そのあと五郎は、栄養失調で体を壊します。療養は、約6年におよびました。
    reading: その あと ごろうわ、えいよう しっちょうで からだお こわします。りょうようわ、やく ろくねんに およびました。
  - speaker: zundamon
    emotion: sad
    text: 先生。ボクは、いつ学校に戻れますか。
  - speaker: ishi
    emotion: normal
    text: 焦ってはいかん。
  - speaker: ishi
    emotion: happy
    text: 長い人生だ。3年や5年、なんでもない。ゆっくりやりなさい。
  - speaker: zundamon
    emotion: thinking
    text: ……同級生は、もう卒業してしまいました。
  - speaker: zundamon
    emotion: sad
    text: ……ゆっくり、ですか。
  - speaker: reimu
    text: 回復の決め手は、新しい薬でした。五郎は奇跡的に治り、学校に戻ります。
    reading: かいふくの きめてわ、あたらしい くすりでした。ごろうわ きせきてきに なおり、がっこうに もどります。
  - speaker: zundamon
    emotion: happy
    text: 先生、治りました！ 学校に戻れます！
  - speaker: ishi
    emotion: happy
    text: ほら。なんでもなかっただろう。
    beat: true
  - speaker: reimu
    text: 医師に支えられたこの経験から、五郎はのちに医師と話せる仕事を選びます。
    reading: いしに ささえられた この けいけんから、ごろうわ のちに いしと はなせる しごとお えらびます。
- id: ch2_daigaku
  title: 盤もルールも決まらない
  background: os_bushitsu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, emotion: happy}
  - {who: buin, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 茨城大学に進んだ五郎は、2年で囲碁部の主将になります。
    reading: いばらき だいがくに すすんだ ごろうわ、にねんで いごぶの しゅしょうに なります。
  - speaker: buin
    emotion: thinking
    text: 長谷川。囲碁部と将棋部の勝負って、[何|なに]で勝負するんだよ。
  - speaker: zundamon
    emotion: happy
    text: 挟んで返す遊びだ。これなら、どっちの部も初めてだろ？
  - speaker: buin
    emotion: surprised
    text: ……おい、本当に互角じゃないか。
  - speaker: zundamon
    emotion: happy
    text: じゃあ次は、こっちの盤でやろう。
  - speaker: buin
    emotion: surprised
    text: 縦が8で横が9？ 昨日は8マス四方だったろ。
    background: os_bushitsu_ban
  - speaker: zundamon
    emotion: happy
    text: 明日は9と10の盤。角が8つある盤もあるぞ。
  - speaker: buin
    emotion: angry
    text: 盤の形から変わるのかよ！
    se: zukko
  - speaker: zundamon
    emotion: normal
    text: ルールも日替わりだ。挟んでも、1個しか返せない日がある。
  - speaker: buin
    emotion: thinking
    text: ……で、今日はどのルールなんだ。
  - speaker: zundamon
    emotion: happy
    text: 打ちながら決める。
  - speaker: buin
    emotion: angry
    text: 決まってないのは、お前の頭のほうだ。
    beat: true
  - speaker: reimu
    text: 盤もルールも決まらないまま、この遊びは卒業とともに消えていきました。
    reading: ばんも るーるも きまらない まま、この あそびわ そつぎょうと ともに きえて いきました。
  - speaker: reimu
    text: 五郎は大学を首席で卒業し、製薬会社の営業マンになります。
    reading: ごろうわ だいがくお しゅせきで そつぎょうし、せいやく がいしゃの えいぎょうまんに なります。
- id: card1964
  title: ''
  background: os_card_1964
  cuts:
  - speaker: reimu
    text: 1964年。五郎は製薬会社で働きながら、弁護士を目指して勉強していました。
    reading: せんきゅうひゃく ろくじゅうよねん。ごろうわ せいやく がいしゃで はたらきながら、べんごしお めざして べんきょう して いました。
- id: ch3_kaisha
  title: 囲碁半年、将棋3か月
  background: os_kaisha_shogi
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 長谷川五郎, emotion: normal}
  - {who: shain_s, x: 0.56, emotion: happy}
  - {who: shain_y, x: 0.78, emotion: normal}
  cuts:
  - speaker: reimu
    text: 結婚した五郎は、まず妻に囲碁を教えます。1か月もたたずに、挫折しました。
    reading: けっこん した ごろうわ、まず つまに いごお おしえます。いっかげつも たたずに、ざせつ しました。
  - speaker: shain_s
    emotion: happy
    text: 長谷川さん。私たちも囲碁か将棋を、ぜひ覚えたいので教えてください！
  - speaker: zundamon
    emotion: thinking
    text: 囲碁は、うちで失敗したばかりで……。将棋にしましょう。
  - speaker: zundamon
    emotion: happy
    text: 歩は前に1つ。香車は前にどこまでも。桂馬は、斜め前に跳びます。
  - speaker: zundamon
    emotion: happy
    text: 銀は斜め後ろに下がれて、[金|きん]は真後ろに下がれます。
  - speaker: zundamon
    emotion: happy
    text: 飛車と角は、成ると動きが変わって……。
  - speaker: zundamon
    emotion: surprised
    text: ……二人とも、目が点なのだ。
    se: tenten
  - speaker: reimu
    text: 将棋も、1か月もたたずに挫折しました。
    reading: しょうぎも、いっかげつも たたずに ざせつ しました。
  - speaker: zundamon
    emotion: sad
    text: 囲碁は半年で将棋は3か月、麻雀でも2週間。覚えるまでが長すぎるのだ。
- id: ch3_futa
  title: 牛乳瓶のフタ
  background: os_yoru
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 5分で覚えられる遊びは、ないものか……。
  - speaker: zundamon
    emotion: surprised
    text: ……あった。焼け跡の10分休みの、あれだ！
  - speaker: reimu
    text: 当時は、瓶の牛乳が毎朝家に届いた時代。紙のフタは、どこの家にもありました。
    reading: とうじわ、びんの ぎゅうにゅうが まいあさ いえに とどいた じだい。かみの ふたわ、どこの いえにも ありました。
  - speaker: zundamon
    emotion: happy
    text: このフタ、M君の駒と同じくらいの大きさだ。
  - speaker: zundamon
    emotion: thinking
    text: 片面に[黒い紙|くろいかみ]を貼る。……1枚だと、ぺらぺらで返しにくい。
  - speaker: zundamon
    emotion: thinking
    text: 2枚。……まだ、薄い。
  - speaker: zundamon
    emotion: surprised
    text: 4枚！ ……これは、積み木なのだ。
  - speaker: zundamon
    emotion: happy
    text: 3枚！ 持ちやすくて、返しやすいぞ！
