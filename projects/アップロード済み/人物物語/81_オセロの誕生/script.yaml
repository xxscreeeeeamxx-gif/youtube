meta:
  title: 【オセロの誕生】製薬会社の営業マンが、牛乳瓶のフタで作ったゲーム【ずんだもん解説】
  slug: othello-hasegawa-v2
  summary: 挟んで裏返すだけのオセロ。考えた本人が語る始まりは、1945年、空襲で焼けた水戸の青空教室の10分休みでした。約6年の療養を越えて製薬会社の営業マンになった長谷川五郎は、牛乳瓶のフタで駒を作ります。弁護士の夢を断った事故のあと、持ち込んだおもちゃ会社で言われたのは、30秒で説明できないと売れないという一言。英文学者の父が付けた名前、家の頭金をつぎ込んだ大会まで、再現ドラマでたどります。
  tags:
  - オセロ
  - 長谷川五郎
  - リバーシ
  - ボードゲーム
  - ツクダ
  - 水戸
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 雑学
  thumbnail:
    top: 牛乳瓶のフタの駒
    bottom: オセロの誕生
  mode: drama
  narrator: reimu
