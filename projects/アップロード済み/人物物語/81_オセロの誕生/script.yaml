- id: ch6_yuu
  title: ''
  background: os_denwa
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: はい、長谷川……。はい、三越です……。はい、伊勢丹です……。
  - speaker: zundamon
    emotion: thinking
    text: ……はい。オセロ連盟の番号も、うちです……。
  - speaker: reimu
    text: ベルが止んだのは、午後4時。朝の8時から、8時間鳴り続けました。
    reading: べるが やんだのわ、ごご よじ。あさの はちじから、はちじかん なりつづけました。
    background: os_denwa_yuu
    telops:
    - {text: 電話は8時間, size: lg, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: sad
    text: ……やっと、静かになったのだ。
- id: ch6_denden
  title: ''
  background: os_denwa_yuu
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, emotion: sad}
  - {who: denden, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: ……また鳴った。はい、長谷川です。
  - speaker: denden
    emotion: surprised
    text: おや、通じるんですね。電電公社の者ですが。
  - speaker: denden
    emotion: normal
    text: 何度かけても通じないという、多数の問い合わせが来ているんですが。
  - speaker: denden
    emotion: happy
    text: なるほど、そういうわけだったんですね。
    beat: true
  - speaker: zundamon
    emotion: sad
    text: ……苦情まで、[話し中|はなしちゅう]だったのだ。
    se: oti
- id: ch6_depart
  title: 3000個が消えた
  background: os_depart
  bgm: pop
  stage:
  - {who: jitsuen, x: 0.28, flip: true, emotion: happy}
  - {who: kyaku, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: デパートの売り場では、アルバイトの女子大生が実演して見せました。
    reading: でぱーとの うりばでわ、あるばいとの じょしだいせいが じつえん して みせました。
  - speaker: jitsuen
    emotion: happy
    text: 挟んだら、裏返します。覚えるのは、これだけです。
  - speaker: kyaku
    emotion: thinking
    text: 囲碁は30年やっても勝てんが……どれ。
  - speaker: kyaku
    emotion: surprised
    text: ……お嬢さんに、全部ひっくり返されたわい。
  - speaker: jitsuen
    emotion: happy
    text: もう1局、いかがですか。
  - speaker: kyaku
    emotion: happy
    text: いや、1台もらおう。うちで孫と打つ。
  - speaker: reimu
    text: 最初の3000個は、ゴールデンウイークのうちに売り切れました。
    reading: さいしょの さんぜんこわ、ごーるでん ういーくの うちに うりきれました。
    background: os_depart_kara
  - speaker: jitsuen
    emotion: surprised
    text: ……あの、見本の1台しか残ってません。
    beat: true
- id: ch6_oil
  title: ''
  background: os_tsukuda
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, emotion: happy}
  - {who: wakui, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 10月にテレビCMを流すと、年末までの3か月で30万個を超えました。
    reading: じゅうがつに てれび しーえむお ながすと、ねんまつまでの さんかげつで さんじゅうまんこお こえました。
  - speaker: zundamon
    emotion: surprised
    text: 部長。オイルショックで、材料が足りないんですか。
  - speaker: wakui
    emotion: thinking
    text: 足らない、足らない……。
  - speaker: zundamon
    emotion: happy
    text: 部長。10年で50万台の目標は、どうなりました？
  - speaker: reimu
    text: 2年目は120万個。3年目は、280万個が売れました。
    reading: にねんめわ ひゃく にじゅうまんこ。さんねんめわ、にひゃく はちじゅうまんこが うれました。
    telops:
    - {text: 3年目は280万個, size: lg, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 10年分の目標を、2年目で追い越したのだ！
- id: ch6_london
  title: 床屋とチェス王者
  background: os_sekai
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, emotion: normal}
  - {who: riji, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1976年10月。ロンドンで、全英チェス王者と全日本オセロ王者の三番勝負が開かれます。
    reading: せんきゅうひゃく ななじゅうろくねん じゅうがつ。ろんどんで、ぜんえい ちぇす おうじゃと ぜんにほん おせろ おうじゃの さんばん しょうぶが ひらかれます。
  - speaker: riji
    emotion: thinking
    text: 長谷川さん。チェスの王者から、準備に2か月くれと言ってきました。
  - speaker: zundamon
    emotion: normal
    text: どうぞ、と伝えてください。
  - speaker: riji
    emotion: surprised
    text: こっちの王者は、静岡の床屋さんですよ。
  - speaker: zundamon
    emotion: thinking
    text: 2か月、お店で髪を切りながら待つのだ……。
  - speaker: reimu
    text: 結果は2勝1敗。床屋の藤田が勝ち、BBCが世界に放送しました。
    reading: けっかわ にしょう いっぱい。とこやの ふじたが かち、びーびーしーが せかいに ほうそう しました。
  - speaker: zundamon
    emotion: happy
    text: はさみを使う仕事だから、挟むのが得意なのだ！
  - speaker: riji
    emotion: thinking
    text: うまいこと言ったつもりですか。
    se: tsukkomi
  - speaker: reimu
    text: これがきっかけで、翌年から世界選手権が始まります。
    reading: これが きっかけで、よくねんから せかい せんしゅけんが はじまります。
- id: card1977
  title: ''
  background: os_card_1977
  cuts:
  - speaker: reimu
    text: 1977年10月。帝国ホテルで、第1回の世界オセロ選手権が開かれます。
    reading: せんきゅうひゃく ななじゅうななねん じゅうがつ。ていこく ほてるで、だいいっかいの せかい おせろ せんしゅけんが ひらかれます。
- id: ch7_sekai
  title: 4石差の決勝
  background: os_hotel
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 14か国の予選を勝ち抜いた5人。決勝は、日本の井上博とノルウェーのヘイバーグです。
    reading: じゅうよんかこくの よせんお かちぬいた ごにん。けっしょうわ、にほんの いのうえ ひろしと のるうぇーの へいばーぐです。
  - speaker: zundamon
    emotion: happy
    text: 井上くん、序盤はリードしてるぞ。
  - speaker: zundamon
    emotion: thinking
    text: 相手はノルウェーの、チェスの名人。読みが深いのだ……。
  - speaker: zundamon
    emotion: surprised
    text: ……じりじり、追い上げてくる！
  - speaker: zundamon
    emotion: thinking
    text: 残りの石を数えたいけど、怖くて数えられないのだ。
  - speaker: reimu
    text: 結果は34対30。わずか4つの差で、井上が初代の世界王者になりました。
    reading: けっかわ さんじゅうよん たい さんじゅう。わずか よっつの さで、いのうえが しょだいの せかい おうじゃに なりました。
    telops:
    - {text: 34対30, size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: happy
    text: 初代の世界王者は、日本だ！
    se: jaan
  - speaker: zundamon
    emotion: sad
    text: ……見てるだけで、寿命が縮んだぞ。
    beat: true
  - speaker: reimu
    text: 1979年の第3回はローマ。ローマ法王に、オセロが贈られました。
    reading: せんきゅうひゃく ななじゅうきゅうねんの だいさんかいわ ろーま。ろーま ほうおうに、おせろが おくられました。
  - speaker: zundamon
    emotion: surprised
    text: 焼け跡の10分休みが、ローマまで来たのだ。
- id: ch8_tegami
  title: 明けない夜はない
  background: os_shosai
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 晩年。家族がつらい時期を迎えたとき、五郎は直筆の言葉を贈りました。
    reading: ばんねん。かぞくが つらい じきお むかえた とき、ごろうわ じきひつの ことばお おくりました。
  - speaker: zundamon
    emotion: thinking
    text: 明けない夜はない。……シェイクスピアの言葉だ。
  - speaker: zundamon
    emotion: normal
    text: 待て、しかして希望せよ。……こっちは、デュマ。
  - speaker: zundamon
    emotion: happy
    text: 英文学の父さんなら、もっといい言葉を知ってたかな。
  - speaker: zundamon
    emotion: normal
    text: 父さんが付けたオセロも、シェイクスピアだったな。
  - speaker: reimu
    text: 息子の武は、その言葉に祖父の四郎の教えが重なっていたと書いています。
    reading: むすこの たけしわ、その ことばに そふの しろうの おしえが かさなって いたと かいて います。
- id: card2006
  title: ''
  background: os_card_2006
  bgm: jitaku_nite
  cuts:
  - speaker: reimu
    text: 2006年。生まれ故郷の水戸で、第30回の世界選手権が開かれます。
    reading: にせん ろくねん。うまれこきょうの みとで、だいさんじゅっかいの せかい せんしゅけんが ひらかれます。
  - speaker: reimu
    text: 大会では日本代表の6人が、父の四郎が文を書いた鐘を鳴らしました。
    reading: たいかいでわ にほん だいひょうの ろくにんが、ちちの しろうが ぶんお かいた かねお ならしました。
- id: ch8_kakumei
  title: ゲーム革命
  background: os_shosai
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, emotion: happy}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: その年の暮れ、五郎は新聞の取材を受けます。
    reading: その としの くれ、ごろうわ しんぶんの しゅざいお うけます。
  - speaker: kisha
    emotion: normal
    text: 第1回の全日本大会は、帝国ホテルでしたね。
  - speaker: zundamon
    emotion: happy
    text: 費用は、全部ボクの自腹です。
  - speaker: kisha
    emotion: surprised
    text: 全部、ですか。
  - speaker: zundamon
    emotion: thinking
    text: それで、取材に来た新聞社は2社だけ。
  - speaker: kisha
    emotion: thinking
    text: ……今日は、私1人ですけど。
    se: zukko
  - speaker: zundamon
    emotion: normal
    text: オセロは、これまでに2200万台売れました。
  - speaker: kisha
    emotion: normal
    text: 次は、[何|なに]をなさるんですか。
  - speaker: zundamon
    emotion: happy
    text: 来年、新しいボードゲームを発表します。
  - speaker: zundamon
    emotion: happy
    text: ゲーム革命、起こしますよ。
  - speaker: kisha
    emotion: surprised
    text: 74歳で、ですか。
  - speaker: zundamon
    emotion: happy
    text: オセロを売り出したのも、40歳でしたから。
  - speaker: reimu
    text: 五郎は100マスのグランドオセロなど、いくつもの盤のゲームを考えました。
    reading: ごろうわ ひゃくますの ぐらんど おせろなど、いくつもの ばんの げーむお かんがえました。
  - speaker: reimu
    text: 2009年には、水戸市から文化栄誉賞が贈られています。
    reading: にせん きゅうねんにわ、みとしから ぶんか えいよしょうが おくられて います。
- id: card2016
  title: ''
  background: os_card_2016
  bgm: 223am
  cuts:
  - speaker: reimu
    text: 2016年3月。囲碁のトップ棋士が、コンピューターに敗れます。
    reading: にせん じゅうろくねん さんがつ。いごの とっぷ きしが、こんぴゅーたーに やぶれます。
- id: ch8_saigo
  title: 最後の原稿
  background: os_shosai
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 長谷川五郎, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 囲碁まで、コンピューターに負けたか……。
  - speaker: reimu
    text: 83歳の五郎は、11月に水戸で開かれる第40回の世界選手権に向けて原稿を書いていました。
    reading: はちじゅうさんさいの ごろうわ、じゅういちがつに みとで ひらかれる だいよんじゅっかいの せかい せんしゅけんに むけて げんこうお かいて いました。
  - speaker: zundamon
    emotion: normal
    text: 誰もが分かるゲームを、人と人が打ってこそ面白い。
  - speaker: zundamon
    emotion: happy
    text: そんな時代が、きっとやってくる。
  - speaker: zundamon
    emotion: happy
    text: 小学生の福地くんも、大人に負けない腕前なのだ。
  - speaker: zundamon
    emotion: thinking
    text: 焼け跡の話も、書き残しておこう。どんなことも、時が風化させてしまう。
  - speaker: zundamon
    emotion: normal
    text: 一人でも多くの人に、オセロを末永く楽しんでほしい。
- id: ch8_saigo2
  title: ''
  background: os_shosai_kara
  bgm: 223am
  cuts:
  - speaker: reimu
    text: 2016年6月20日。長谷川五郎は、83歳で亡くなりました。
    reading: にせん じゅうろくねん ろくがつ はつか。はせがわ ごろうわ、はちじゅうさんさいで なくなりました。
  - speaker: reimu
    text: 亡くなる当日まで、オセロの原稿を書き続けていました。
    reading: なくなる とうじつまで、おせろの げんこうお かきつづけて いました。
    se: namida
  - speaker: reimu
    text: その年の11月、目指していた第40回の世界選手権が水戸で開かれました。
    reading: その としの じゅういちがつ、めざして いた だいよんじゅっかいの せかい せんしゅけんが みとで ひらかれました。
- id: ch9_gendai
  title: 11歳の世界王者
  background: os_senshu
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 五郎さんが原稿で名前を挙げた、小学生の福地くん。
  - speaker: tsumugi
    emotion: happy
    text: 2018年、11歳で世界チャンピオンになったの。
  - speaker: zundamon
    emotion: surprised
    text: 原稿の小学生が、世界一なのだ！？
  - speaker: tsumugi
    emotion: normal
    text: それまでの最年少は、1982年に15歳で優勝した谷田邦彦さん。
  - speaker: tsumugi
    emotion: happy
    text: 帰りの飛行機の機長が、その谷田さんだったの。
  - speaker: zundamon
    emotion: thinking
    text: ……え？
  - speaker: tsumugi
    emotion: normal
    text: 機内放送で、新しい最年少の王者にお祝いを送ったのよ。
  - speaker: zundamon
    emotion: surprised
    text: 記録を抜かれた人が、操縦してたのだ！？
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 世界選手権は2025年までに47回。そのうち36回は日本人の優勝よ。
  - speaker: zundamon
    emotion: surprised
    text: ほとんど日本なのだ。
  - speaker: tsumugi
    emotion: normal
    text: テレビのCMには、のちに王貞治選手も出たのよ。
  - speaker: zundamon
    emotion: happy
    text: ホームラン王も、挟んで返したのだ。
  - speaker: tsumugi
    emotion: normal
    text: オセロは2011年3月までに、累計で2370万個が売れたの。
  - speaker: tsumugi
    emotion: normal
    text: 世界オセロ連盟には、70を超える国と地域が入ってるわ。
  - speaker: zundamon
    emotion: surprised
    text: 地球が、盤みたいなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 販売元のメガハウスの見積もりでは、世界で約6億人が遊んでいるの。
  - speaker: zundamon
    emotion: surprised
    text: 部長が中央線で言った1000万人が、6億人なのだ！
- id: ch9_computer
  title: 神様どうしは引き分け
  background: os_computer
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 盤面の形は、多めに見積もると10の28乗通りあるの。
  - speaker: zundamon
    emotion: surprised
    text: 数えきれないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 打ち方の組み合わせで数えると、10の58乗。
  - speaker: zundamon
    emotion: thinking
    text: ……0が、58個？
  - speaker: tsumugi
    emotion: normal
    text: 囲碁の打ち方は、10の360乗ほど。桁がまるで違うの。
  - speaker: zundamon
    emotion: surprised
    text: 360！？
  - speaker: tsumugi
    emotion: normal
    text: だからオセロは、囲碁より先にコンピューターに追いつかれたの。
  - speaker: tsumugi
    emotion: normal
    text: 1997年には、コンピューターが人間の世界王者に6戦全勝したわ。
  - speaker: zundamon
    emotion: sad
    text: 6回やって、人間は1回も勝てないのだ……。
    se: shobon
  - speaker: tsumugi
    emotion: normal
    text: そして2023年、日本の研究者が計算で示したの。
  - speaker: tsumugi
    emotion: normal
    text: 両方が完璧に打ち続けると、引き分けになる。
    telops:
    - {text: 完璧なら引き分け, size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 神様どうしが打つと、引き分けなのだ！？
  - speaker: tsumugi
    emotion: thinking
    text: 発表の時点では、論文の審査の前だったけどね。
  - speaker: tsumugi
    emotion: normal
    text: でも人間に、その手順は覚えきれない。人と人の勝負は続くわ。
  - speaker: zundamon
    emotion: happy
    text: 五郎さんが原稿に書いたとおりだね。
- id: ch10_rule
  title: 取りすぎると負ける
  background: os_zukai
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: ところでボク、最初の勝負はなんで負けたの？
  - speaker: tsumugi
    emotion: normal
    text: 盤は8マス四方。真ん中に白と黒を2つずつ、斜めに置いて始めるの。
  - speaker: tsumugi
    emotion: normal
    text: 相手の石を挟める所にしか、打てない。打てる所がないなら、パスよ。
  - speaker: tsumugi
    emotion: normal
    text: 序盤に取りすぎると、相手の打てる所が増えて自分の打てる所が減るの。
  - speaker: zundamon
    emotion: surprised
    text: 取るほど、相手に場所をあげてたのだ！
  - speaker: tsumugi
    emotion: normal
    text: だから強い人ほど、序盤はわざと少なく返すの。
  - speaker: zundamon
    emotion: thinking
    text: わざと取らないの？
  - speaker: tsumugi
    emotion: normal
    text: そう。相手の打てる所を減らして、終盤に隅と石をまとめて取るのよ。
  - speaker: tsumugi
    emotion: normal
    text: 隅の石は、二度と裏返らない。だから隅は大事なの。
  - speaker: tsumugi
    emotion: thinking
    text: ただ隅を取れば勝ち、とまでは言えないのが奥深いところね。
  - speaker: zundamon
    emotion: normal
    text: 覚えるのは1分、極めるのは一生。
  - speaker: tsumugi
    emotion: happy
    text: その言葉は、アメリカで売り出すときに考えられたの。
  - speaker: tsumugi
    emotion: thinking
    text: 部長の30秒より、ちょっとだけ長いわね。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 部長は、親と子どもでも互角に戦えるのがオセロのいいところと話してるわ。
  - speaker: zundamon
    emotion: thinking
    text: 互角すぎて、もめそうなのだ。
  - speaker: tsumugi
    emotion: happy
    text: もめたの。87歳の女性が、こんな投書を新聞に寄せたの。
  - speaker: tsumugi
    emotion: normal
    text: 夫にオセロで[勝った|かった]ら、機嫌を損ねて待ったをされた。
  - speaker: zundamon
    emotion: surprised
    text: 待った！？
  - speaker: tsumugi
    emotion: happy
    text: それで結婚以来はじめて、口答えをした。
  - speaker: zundamon
    emotion: surprised
    text: 夫婦の形勢まで、ひっくり返ったのだ！
- id: ch11_ronsou
  title: 本当に日本生まれ？
  background: os_shiryo
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: ネットで見たのだ。オセロは、イギリスのゲームのまねだって。
  - speaker: tsumugi
    emotion: normal
    text: そこは、正面から見てみましょう。
  - speaker: tsumugi
    emotion: normal
    text: リバーシという挟んで裏返すゲームが、1883年のロンドンで売り出されてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 日本でも明治から、[源平碁|げんぺいご]という名前で遊ばれていたの。
  - speaker: zundamon
    emotion: surprised
    text: そっくりなのだ！
  - speaker: tsumugi
    emotion: normal
    text: 五郎さんも1971年に、[源平碁|げんぺいご]の改良として実用新案を出願してる。
  - speaker: tsumugi
    emotion: normal
    text: この出願は、認められなかったわ。
  - speaker: zundamon
    emotion: surprised
    text: 本人も、似てると分かってたのだ。
  - speaker: tsumugi
    emotion: normal
    text: 発売のころは、兄が遊んでいた[源平碁|げんぺいご]を改良したと書いていたの。
  - speaker: tsumugi
    emotion: thinking
    text: 焼け跡で生まれた、と強く語るようになったのは2000年ごろからよ。
  - speaker: zundamon
    emotion: surprised
    text: えっ、あとから！？
  - speaker: tsumugi
    emotion: normal
    text: 1年目の数も、本人は100万台で部長は30万個強。話が食い違うの。
  - speaker: zundamon
    emotion: sad
    text: 始まりの話が、どんどん増えるのだ……。
  - speaker: tsumugi
    emotion: normal
    text: ツクダの部長も、リバーシや[源平碁|げんぺいご]があるのは知っていたと話してるわ。
  - speaker: zundamon
    emotion: thinking
    text: じゃあオセロは、[何|なに]が新しかったの？
  - speaker: tsumugi
    emotion: normal
    text: 始まりの石の置き方を1つに決めて、緑の盤と黒と白の石をそろえたこと。
  - speaker: tsumugi
    emotion: normal
    text: 盤の緑は、将軍オセロが戦う緑の平原だと五郎さんは説明してるわ。
  - speaker: tsumugi
    emotion: thinking
    text: でもお芝居の舞台は、ヴェネツィアとキプロス。平原の戦いは出てこないの。
  - speaker: zundamon
    emotion: surprised
    text: 緑の平原は、五郎さんの想像だったのだ！
    se: tenten
  - speaker: tsumugi
    emotion: normal
    text: 一番大きいのは、大会を開いて遊ぶ人の輪を世界に広げたことね。
  - speaker: tsumugi
    emotion: normal
    text: 1973年の新聞も、オセロを新しいゲームとして大きく取り上げているわ。
  - speaker: zundamon
    emotion: thinking
    text: スマホのリバーシも、オセロと同じなの？
  - speaker: tsumugi
    emotion: normal
    text: オセロという名前は、商標なの。だから、ほかの会社はリバーシと呼ぶのよ。
  - speaker: zundamon
    emotion: happy
    text: 遊ぶ場所ごと作ったから、名前が残ったんだね。
