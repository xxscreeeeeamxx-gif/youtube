# iwata-ds 読み台帳（人名・地名・社名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている（タグは付けていない）。
# 名札（tag: 岩田 / label: 店員・友だち・社員・開発者・竹田・山内・宮本・小学生・川島・聴衆・客・年配の客・父・母・子ども・株主）・
# テロップ・章タイトルは表示専用なのでタグを付けていない。
#
# 2026-11-19 台本を書いたあと、セリフ全行を話者ごとの VOICEVOX スタイル（ずんだもん3・つむぎ8・モブは meta.mobs の voice）で
# audio_query にかけた結果:
# - 岩田 はカタカナのタグ [岩田|イワタ] で イワタ、・イワタデス・イワタガ・イワタオ（1語）。タグなしでも イワタ だった。
# - 川島 は [川島|カワシマ] で カワシマ/センセエ（1語）。
# - 山内 は dictionary.yaml に登録済み（ヤマウチ）。タグなしで ヤマウチサント・ヤマウチサンノ・ヤマウチノ。
# - 宮本茂 は dictionary.yaml に登録済み（ミヤモトシゲルヨ）。宮本 だけの行（宮本さん）もタグなしで ミヤモトサント・ミヤモトサンガ
#   だったので、宮本 は台帳に入れていない。
# - Wii はタグなしだと読みが決まらないので、全出現を [Wii|ウィー] にした（ウィイワ・ウィイノ・ウィイオ。1語）。
#   Wii U は [Wii U|ウィーユー] で ウィイユウノ・ウィイユウワ。NX は [NX|エヌエックス] で エヌエックスニ・エヌエックスト。
#   Switch は [Switch|スイッチ]、Nintendo みまもり Switch は [Nintendo みまもり Switch|ニンテンドーみまもりスイッチ] で
#   ニンテンドオ/ミマモリ/スイッチト。nintendogs は [nintendogs|ニンテンドッグス]。
# - 3DS はタグなしだと スリイディイ/エス/ノ と切れた → [3DS|スリーディーエス] で スリイディイエスノ（1語）。
# - 15億円 はタグなしで ソノ/ウチジュウ/ゴオクエンワ と崩れた → [15億円|ジュウゴオクエン] で ソノウチ/ジュウゴオクエンワ。
# - 日本 はタグなしで ニッポン になった → [日本|ニホン] で ニホンノ・ニホンデワ。
# - 4分の1・3分の1 はタグなしだと ヨンプンノ になる。ひらがなのタグは ヨン/ブンノ/イチ と切れた
#   → カタカナのタグ [4分の1|ヨンブンノイチ]・[3分の1|サンブンノイチ] で ヨンブンノ/イチカラ/サンブンノ/イチノ。
# - モラール（士気） はかっこの中まで読まれるので [モラール（士気）|モラール] にした（モラアルワ）。字幕は原文どおり。
# - 何の数か は [何|なん] で ナンノ/カズカオ。
# - 同じ物 が ドオジブツ になった → 「同じもの」（オナジ/モノオ）。
# - 「本当の年より上って出た」が ノボッテ/シュッタ になった → 「本当の年より上だった」（ウエダッタ）。
# - 「大人の方も、お年寄りの方も」の 方 が ホオ になった → 「大人のお客さんも、お年寄りも」。
# 2026-11-19 見直し（iw_fix.md）で直した・足したセリフも audio_query にかけた:
# - 「お一人様」は オ/ヒトリサマ と「オ」が浮いた → 「おひとり様」（オヒトリサマ）。
# - 「前の社長の後を継ぐ」が シャチョオノゴオ/ツグ になった → 「あとを継ぐ」（アトオ/ツグ）。
# - 仙台 はセリフに出たので [仙台|センダイ]（センダイエ）。
# - 正しく読んだ（タグなし）: おひとり様・嫌われない（キラワレナイ）・聞きました・ご自分で（ゴジブンデ）・2000人くらい（ニセンニンクライ）・
#   追い風（オイカゼ）・吹き続ける（フキツズケル）・感謝の意を表して（カンシャノ/イオ/アラワシテ）・挙げた（アゲタ）・谷の時期（ナレ）。
# - 正しく読んだ（タグなし）: 任天堂（ニンテンドオ）・ニンテンドーDS・DS Lite（ディイエス/ライト）・ゲームキューブ・据置型（スエオキガタ）・
#   携帯型・ファミコン・ゲームボーイアドバンス・脳トレ（ノオトレ）・脳年齢（ノオネンレエ）・音読・大人のドリル・花札・社長が（シャチョオガ）・
#   借金（シャッキン）・負債（フサイ）・何十億円（ナンジュウ/オクエン）・層（ソオ）・右肩下がり・臨界（リンカイ）・豪華（ゴオカ）・
#   衰退・格闘ゲーム（カクトオゲエム）・対象年齢・試作（シサク）・商品化・お邪魔（オジャマ）・片方（カタホオ）・方たち（カタタチ）・
#   名刺（メエシ）・置き去り・据置型・史上最短（シジョオサイタン）・固定報酬枠削減幅（コテエホオシュウワク/サクゲンハバ）・
#   代表取締役・取締役・業績（ギョオセキ）・怯え（オビエ）・下回った（シタマワッタ）・美談（ビダン）・年齢区分・お盆明け（オボンアケ）・
#   今日具体的な（キョオ/グタイテキナ）・申しあげた（モオシアゲタ）・お金（オカネ）・方法（ホオホオ）・方角（ホオガク）・夕方（ユウガタ）・
#   引っこ抜いちゃう（ヒッコヌイチャウ）・つけっぱなし・敵視（テキシ）・史上最短・2.2から2.8人（ニイテン/ニカラ/ニイテン/ハチニン）・3.0人・
#   1億163万台（イチオクヒャク/ロクジュウ/サンマンダイ）・1年8か月（イチネン/ハッカゲツ）。
