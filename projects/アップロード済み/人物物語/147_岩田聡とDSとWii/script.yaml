meta:
  title: 任天堂の社長「おそらく我々はゆっくり死ぬんだ」、DSとWiiで当時の過去最高益に【ずんだもん解説】
  slug: iwata-ds
  hook_line: 負けていた任天堂の社長は、なぜDSの発売日に大学の研究室にいたのか。
  summary: 2004年12月2日、ニンテンドーDSの発売日。行列のできた東京の店ではなく、仙台の大学の研究室に、任天堂の社長・岩田聡の姿がありました。ゲームキューブで負け、縮んでいくゲームの市場を前にした社長は、2つの画面とペン、テレビのリモコンの形のコントローラで、ゲームをしない人まで呼び込もうとします。プログラマー出身の社長が率いた逆転と、そのあとの値下げの壇上まで、本人の公の言葉をもとに再現ドラマでたどります。（2026年11月時点）
  sources:
  - 任天堂 社長が訊く『ものすごく脳を鍛える５分間の鬼トレーニング』川島隆太教授 篇 https://www.nintendo.co.jp/3ds/interview/asrj/vol1/index.html
