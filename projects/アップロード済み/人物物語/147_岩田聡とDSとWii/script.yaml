scenes:
# ---- 先出し①（2004年12月2日・東京の量販店。行列は後ろ姿。笑いの SE なし。「お一人様1点限り」は GAME Watch の店頭の様子） ----
- id: co_gyoretsu
  title: ''
  background: iw_gyoretsu
  bgm: curious
  stage:
  - {who: tenin, x: 0.8, emotion: happy}
  cuts:
  - speaker: reimu
    text: 2004年12月2日の朝。東京の量販店に、新しいゲーム機の行列ができていました。
    reading: にせんよねん じゅうにがつ ふつかの あさ。とうきょうの りょうはんてんに、あたらしい げーむきの ぎょうれつが できて いました。
  - speaker: tenin
    emotion: happy
    text: ニンテンドーDS、おひとり様1点限りです！
# ---- 先出し②（同じ日・仙台の大学の研究室。訪ねた時刻は資料に無いので「朝」と言わない。川島は出さない。「社内で勝手につくった試作ソフト」「30分だけ」は2012年の本人の言葉の組み方） ----
- id: co_kenkyushitsu
  title: ''
  background: iw_kenkyushitsu
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 岩田, emotion: normal}
  cuts:
  - speaker: reimu
    text: その会社、任天堂の社長は店にいませんでした。同じ日、仙台。大学の研究室です。
    reading: その かいしゃ、にんてんどうの しゃちょうわ みせに いませんでした。おなじ ひ、せんだい。だいがくの けんきゅうしつです。
  - speaker: zundamon
    emotion: normal
    text: ……30分だけ、という約束なのだ。
  - speaker: zundamon
    emotion: normal
    text: 社内で勝手に作った試作のソフト、見てもらうのだ。
  - speaker: reimu
    text: 話は、3時間に延びました。この男は、岩田聡。ゲームキューブで負けていた、任天堂の社長です。
    reading: はなしわ さんじかんに のびました。この おとこわ いわた さとる。げーむきゅーぶで まけて いた にんてんどうの しゃちょうです。
  - speaker: reimu
    text: 4年半後の決算で、任天堂の利益は当時の過去最高に。その2年あまりあと、彼は自分の報酬を50％減らします。
    reading: よねんはんごの けっさんで、にんてんどうの りえきわ とうじの かこ さいこうに。その にねん あまり あと、かれわ じぶんの ほうしゅうお ごじゅっぱーせんと へらします。
# ---- 今の部屋（ゲーム機が家で嫌われる。「お母さんが電源を抜く」は本編の Wii の開発室で回収。20秒以内） ----
- id: hook
  title: ''
  background: iw_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: 夜中までゲームしてたら、お母さんにコンセントを抜かれたのだ！
  - speaker: tsumugi
    emotion: normal
    text: セーブは？
  - speaker: zundamon
    emotion: sad
    text: ……してないのだ。
    se: chin
  - speaker: tsumugi
    emotion: normal
    text: それ、ゲーム機を作る側が本気で悩んだことなの。お母さんに嫌われないゲーム機。
  - speaker: tsumugi
    emotion: thinking
    text: 負けていた任天堂の社長は、なぜ発売日に大学の研究室にいたのか。
    telops:
    - {text: "負けていた任天堂の社長は なぜ発売日に大学にいた？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 店じゃなくて、大学！？
# ---- 1970年代後半・札幌の高校（20秒。親は出さない。電卓の機種名は言わない。「クラスで最初に買った」「最初は野球のゲーム」＝GDC 2005 の本人の言葉。後で効く：GDC の「頭の中ではゲーム開発者」） ----
- id: ch1_dentaku
  title: 札幌の電卓
  background: iw_kyoshitsu
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 岩田, emotion: happy}
  - {who: tomo, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1970年代の後半、札幌の高校。授業中の教室です。
    reading: せんきゅうひゃく ななじゅうねんだいの こうはん、さっぽろの こうこう。じゅぎょうちゅうの きょうしつです。
  - speaker: tomo
    emotion: normal
    text: '[岩田|イワタ]、授業中に何やってんだ。'
  - speaker: zundamon
    emotion: happy
    text: 電卓で、ゲームを作ったのだ。
  - speaker: tomo
    emotion: surprised
    text: 電卓で！？ 数字しか出ないだろ。
  - speaker: zundamon
    emotion: happy
    text: プログラムの組める電卓、クラスで最初に買ったのだ。
  - speaker: reimu
    text: 最初に作ったのは、野球のゲーム。この生徒が、のちに世界の開発者の前で自分をゲーム開発者と名乗ります。
    reading: さいしょに つくったのわ やきゅうの げーむ。この せいとが のちに せかいの かいはつしゃの まえで じぶんお げーむ かいはつしゃと なのります。
# ---- 1990年代のはじめ・HAL研究所の社長室（年は言わない。借金の書類 → 6年後は企画書だけの机。身近な数：1日あたり約68万円＝台帳の計算） ----
- id: ch2_hal
  title: マイナス15億円から
  background: iw_shachoshitsu_shorui
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 岩田, emotion: thinking}
  - {who: keiri, x: 0.8, emotion: sad}
  cuts:
  - speaker: reimu
    text: 1990年代のはじめ、東京のHAL研究所。岩田が学生のころから働いてきた会社が、経営危機に陥ります。
    reading: せんきゅうひゃく きゅうじゅうねんだいの はじめ、とうきょうの はるけんきゅうじょ。いわたが がくせいの ころから はたらいて きた かいしゃが けいえい ききに おちいります。
  - speaker: keiri
    emotion: sad
    text: 社長。負債は、何十億円にもなります。
  - speaker: keiri
    emotion: sad
    text: そのうち[15億円|ジュウゴオクエン]は、6年で返すことになりました。
  - speaker: zundamon
    emotion: surprised
    text: 1年に2億5000万円。1日あたり、約68万円なのだ……。
    telops:
    - {text: "15億円を6年で 1日あたり約68万円", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: keiri
    emotion: thinking
    text: 30代の前半で、よく社長を引き受けましたね。
  - speaker: zundamon
    emotion: normal
    text: 一緒に汗をかいた仲間がいるのに、逃げられないだろ。
  - speaker: zundamon
    emotion: normal
    text: まず全員と1人ずつ話す。それから、開発で立て直す。
  - speaker: keiri
    emotion: happy
    text: 社長！ 6年かかりましたけど、[15億円|ジュウゴオクエン]を返し終わりました！
    background: iw_shachoshitsu_kikaku
# ---- 1998年ごろ・開発室（ポケモンそのものは説明しない。森本は名前を出さずモブで原文の言葉。本人の返しは2009年の言葉と出どころを言う） ----
- id: ch3_programmer
  title: 社長か、プログラマーか
  background: iw_kaihatsu
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 岩田, emotion: normal}
  - {who: dev1, x: 0.8, emotion: surprised}
  cuts:
  - speaker: dev1
    emotion: surprised
    text: 聞きました？ 人気の携帯ゲームの対戦が、1週間くらいでもう据置型で動いてるって！
  - speaker: dev1
    emotion: surprised
    text: あの人はプログラマーなの？ それとも社長なの？
    se: hammer
  - speaker: reimu
    text: 社長になっても、岩田は自分でプログラムを書いていました。本人は2009年に、笑ってこう振り返ります。
    reading: しゃちょうに なっても、いわたわ じぶんで ぷろぐらむお かいて いました。ほんにんわ にせん きゅうねんに わらって こう ふりかえります。
  - speaker: zundamon
    emotion: happy
    text: 社長というよりは、プログラマーでしたね。
    beat: true
# ---- 2002年5月・京都（31本目と重ねない：交代の場面・山内の台詞・「53年ぶり」は使わない。山内への思い・現状否定をしないは2005年の本人の言葉の趣旨） ----
- id: card2002
  title: ''
  background: iw_card_2002
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 2002年5月、京都の任天堂。42歳の岩田が、社長になります。
    reading: にせん にねん ごがつ、きょうとの にんてんどう。よんじゅうにさいの いわたが しゃちょうに なります。
- id: ch4_shacho
  title: 42歳の社長
  background: iw_shachoshitsu_kyoto
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 岩田, emotion: thinking}
  - {who: nshain, x: 0.8, emotion: happy}
  cuts:
  - speaker: nshain
    emotion: happy
    text: 社長。前の社長のあとを継ぐのは、大変ですね。
  - speaker: zundamon
    emotion: thinking
    text: ……山内さんと同じことを、ボクがなしとげられるとは思えないのだ。
  - speaker: zundamon
    emotion: normal
    text: これまで誠実にやってきたことを、否定から入るのはなしだ。
  - speaker: reimu
    text: その任天堂は、据置型のゲーム機で大きく負けていました。2年半後の発売日、社長はなぜ店にいないのか。
    reading: その にんてんどうわ、すえおきがたの げーむきで おおきく まけて いました。にねんはんごの はつばいび、しゃちょうわ なぜ みせに いないのか。
# ---- 2003年・会議室（右肩下がりの折れ線・数字なし。ゲームキューブと PS2 の比較はこの1回。「ゆっくり死ぬ」は2009年の本人の言葉のまま、出どころを言う。竹田は存命扱い → 2006年の「社長が訊く」の原文だけ、出どころを言い、2003年の岩田に返事をさせない。TGS の講演の言葉は使わない（電撃の節の見出しは記者のまとめ）） ----
- id: ch5_yukkuri
  title: ゆっくり死ぬ
  background: iw_kaigi
  bgm: serious
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 岩田, emotion: thinking}
  - {who: takeda, x: 0.6, emotion: normal}
  - {who: shain, x: 0.84, emotion: sad}
  cuts:
  - speaker: shain
    emotion: sad
    text: 社長。ゲームキューブ、思ったほど伸びません。
  - speaker: reimu
    text: 最後まで数えると、ゲームキューブは世界で2174万台。プレイステーション2は1億6000万台を超えます。
    reading: さいごまで かぞえると、げーむきゅーぶわ せかいで にせん ひゃくななじゅうよんまんだい。ぷれいすてーしょん つーわ いちおく ろくせんまんだいお こえます。
  - speaker: shain
    emotion: sad
    text: それに、[日本|ニホン]のゲームの市場がずっと右肩下がりです。
  - speaker: reimu
    text: 秋の講演の準備で業界の調べを見たときの考えを、岩田は2009年にこう話しています。
    reading: あきの こうえんの じゅんびで ぎょうかいの しらべお みた ときの かんがえお、いわたわ にせん きゅうねんに こう はなして います。
  - speaker: zundamon
    emotion: sad
    text: ゲームをする層を広げなければいけない。
  - speaker: zundamon
    emotion: sad
    text: そうしないと、おそらく我々はゆっくり死ぬんだ
    se: gaan
    telops:
    - {text: "岩田「おそらく我々はゆっくり死ぬんだ」", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: shain
    emotion: surprised
    text: ゆっくり、死ぬ……。
  - speaker: zundamon
    emotion: thinking
    text: ゲームをしない人に、どうやってゲーム機を持ってもらうかなのだ。
  - speaker: zundamon
    emotion: thinking
    text: 昔はやってたけど、最近は忙しくて全然やってない。取材で会う人によく言われるんだ。
  - speaker: shain
    emotion: thinking
    text: 絵がきれいになるほど、操作も難しくなってますからね。
  - speaker: reimu
    text: のちに次の据置型の開発を率いる竹田玄洋は2006年に、それまでの道筋をこう振り返ります。
    reading: のちに つぎの すえおきがたの かいはつお ひきいる たけだ げんようわ にせん ろくねんに、それまでの みちすじお こう ふりかえります。
  - speaker: takeda
    emotion: normal
    text: 従来のロードマップをそのまま踏まえるなら、
  - speaker: takeda
    emotion: normal
    text: より速く、より豪華にというふうになったと思うんです。
  - speaker: takeda
    emotion: normal
    text: もっといいものを！というふうに求めていく人々の要望というのは、
  - speaker: takeda
    emotion: normal
    text: 臨界がないんですね。
  - speaker: reimu
    text: この分かれ道を、岩田は2005年にこう話しています。
    reading: この わかれみちお、いわたわ にせん ごねんに こう はなして います。
  - speaker: zundamon
    emotion: thinking
    text: ぼくらが変わらなかったらどうなる？ ゆっくり死ぬ道を選ぶ？
  - speaker: zundamon
    emotion: normal
    text: それとも、もっとたくさんの人が
  - speaker: zundamon
    emotion: normal
    text: 未来にぼくらの作ったものでよろこんでくれるようになる道を選ぶ？
  - speaker: zundamon
    emotion: normal
    text: 変わるほうを、選ぶのだ。
# ---- 2003年・「２画面にしてくれ」（山内は故人。舞台はこの1場面・台詞はこの1つだけ。声はモブ。2画面とタッチは山内の要望から逆算＝「社長が訊く」の本人の言葉） ----
- id: ch6_nigamen
  title: ２画面にしてくれ
  background: iw_kaigi
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 岩田, emotion: normal}
  - {who: yamauchi, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 同じころ、次の携帯型の研究が進んでいました。相談役に退いた山内が、強く求めます。
    reading: おなじ ころ、つぎの けいたいがたの けんきゅうが すすんで いました。そうだんやくに しりぞいた やまうちが つよく もとめます。
  - speaker: yamauchi
    emotion: normal
    text: ２画面にしてくれ。
    se: don
  - speaker: zundamon
    emotion: surprised
    text: ……画面を、2つですか。
  - speaker: zundamon
    emotion: thinking
    text: 2つの画面で、ゲームをしない人を呼べるのか……。
# ---- 開発の机（宮本は存命 → 舞台に立たせるが台詞なし。タッチの案を名前の無い開発者の手柄にしない。無線で最大16台・会話は共同の記事。試作機の真ん前にモブを立たせない） ----
- id: ch6_pen
  title: ''
  background: iw_kaihatsu_pen
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 岩田, emotion: thinking}
  - {who: miyamoto, x: 0.66, emotion: thinking}
  - {who: dev2, x: 0.86, emotion: thinking}
  cuts:
  - speaker: dev2
