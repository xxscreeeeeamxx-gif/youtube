# mtgox-karpeles 読み台帳（人名・地名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: カルプレス / label: 記者・社員・電話番・利用者・捜査員・検察官・裁判長・債権者）・テロップ・章タイトルは表示専用なのでタグを付けていない。
# 「Mt.Gox」「BTC」「TIBANNE」は text に書いていない（マウントゴックス・枚・社長の会社と書いた）。
#
# 2026-11-14 台本を書いたあと、セリフ全行を VOICEVOX の audio_query にかけた結果:
# - 米ドル はタグなしだと アメリカドル と読まれた（3か所）→ [米ドル|ベイドル] にした（ベイドル と1語）。
# - 取引所 はタグなしだと トリヒキショ。ひらがなの [取引所|とりひきじょ] は トリヒ/キジョ と切れたので、
#   カタカナの [取引所|トリヒキジョ] にした（トリヒキジョ と1語。5か所）。
# - 「表に出さずに」が ヒョオニ、「埋めよう」が ウズメヨオ と読まれた → [表|おもて]・[埋めよう|うめよう] にした
#   （どちらも文脈で読みが変わる一般語なので台帳には入れていない）。
# - A口座 は [A口座|エーこうざ] で エエコオザ と読む。
# - 乖離 は [乖離|かいり] で カイリ。
# - 懲役2年6月 は [懲役2年6月|ちょうえきにねんろっかげつ] で チョオエキニネン/ロッカゲツ（ロクガツ にならない）。
# - 渋谷・特別背任・民事再生・管財人・暗号資産・再生債務者・金融庁・虚偽・見込 はタグなしで正しく読んだ
#   （シブヤ・トクベツ/ハイニン・ミンジサイセエ・カンザイニン・アンゴオシサン・サイセエサイムシャ・キンユウチョオ・キョギ・ミコミ）。
#   タグを重ねると抑揚が切れるので、台帳には入れていない。
# - 「金」はカネと読ませる2か所を お[金|かね] にした。
# - 霞が関・万世橋警察署・東京拘置所・漢和辞典・業務上横領・保釈・麻生（名前は出していない）はナレだけに出る（reading: で読ませた）。
