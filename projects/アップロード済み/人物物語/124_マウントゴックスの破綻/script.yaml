meta:
  title: 「ビットコインがなくなってしまい」と謝ったマウントゴックス社長、古い財布から20万枚【ずんだもん解説】
  slug: mtgox-karpeles
  hook_line: 85万枚が消えたと発表した取引所。社長の罪は、なぜ盗みではなかったのか。
  summary: 2014年2月、ビットコインの取引所マウントゴックスの社長、28歳のマルク・カルプレスは、東京・霞が関の会見で頭を下げました。タダで譲り受けた取引所、画面に出る残高と金庫の本物のコイン、画面の上だけの30万枚。消えたビットコインはどこへ行ったのか。そして彼が罪に問われたのは、なぜ「盗み」ではなかったのか。判決と管財人の発表、本人の手記をもとに、会社・本人・米国の起訴それぞれの言い分を主語つきで並べて、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 株式会社ＭＴＧＯＸ「民事再生手続開始の申立てに関するお知らせ」（2014年2月28日・英訳） https://www.mtgox.com/img/pdf/20140228-announcement_eng.pdf
  - 株式会社ＭＴＧＯＸ「当社保有ビットコインの残高に関するお知らせ」（2014年3月20日） https://www.mtgox.com/img/pdf/20140320-btc-announce.pdf
  - 再生管財人「民事再生手続開始決定のお知らせ」（2018年6月22日） https://www.mtgox.com/img/pdf/20180622_announcement_jp.pdf
  - 再生管財人「弁済期限日の変更に関するお知らせ」（2026年10月16日） https://www.mtgox.com/img/pdf/20261016_b3a13e0f-55f6-4653-913b-be80762390e8_announcement_ja.pdf
  - 前田雅英「ＭＴＧＯＸ虚偽データ事件－ビットコインと私電磁的記録不正作出」WLJ判例コラム第222号（2021年1月8日） https://www.westlawjapan.com/pdf/column_law/20210108.pdf
  - 日本経済新聞「マウントゴックス破綻 顧客のビットコインは消失」（2014年2月28日） https://www.nikkei.com/article/DGXNASGC28020_Y4A220C1000000/
