  - speaker: zundamon
    emotion: thinking
    text: 罪になったのは、数字の埋め方だったのか……。
    beat: true
# ---- 論争2：ビットコインの仕組みに穴？ ----
- id: ronso2
  title: 仕組みに穴？
  background: mx_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: じゃあ、ビットコインの仕組みそのものに穴があったのだ！
  - speaker: tsumugi
    emotion: normal
    text: 会社は、仕組みの不具合のせいだと発表したわね。
  - speaker: tsumugi
    emotion: normal
    text: でもスイスの大学の研究では、その不具合で盗まれ得たのは多くて約386枚。
  - speaker: zundamon
    emotion: surprised
    text: 発表は85万枚なのに、386枚！？
    se: gaan
  - speaker: tsumugi
    emotion: thinking
    text: 米国の起訴と分析会社は、2011年ごろから[取引所|トリヒキジョ]の財布の鍵が盗まれていたと見てるの。
  - speaker: zundamon
    emotion: surprised
    text: 鍵ごと！？
  - speaker: zundamon
    emotion: thinking
    text: 守り方に、穴があったのだ……。
    beat: true
# ---- 論争3：預けた人は得をした？ ----
- id: ronso3
  title: 預けた人は得をした？
  background: mx_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
