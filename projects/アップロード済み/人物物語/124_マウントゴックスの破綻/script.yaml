scenes:
# ---- 先出し（2014年2月28日夕・霞が関の会見。記者の問いの原文は無いので問いは作らない） ----
- id: co_kaiken
  title: ''
  background: mx_kaiken
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: カルプレス, emotion: sad}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2014年2月28日の夕方、東京・霞が関。ビットコインの取引所、マウントゴックスの社長の会見です。
    reading: にせん じゅうよねん にがつ にじゅうはちにちの ゆうがた、とうきょう かすみがせき。びっとこいんの とりひきじょ まうんと ごっくすの しゃちょうの かいけんです。
  - speaker: zundamon
    emotion: sad
    text: ビットコインがなくなってしまい、本当に申し訳ない
  - speaker: reimu
    text: マルク・カルプレス、28歳。最初の発表で消えたのは85万枚。7日後、20万枚が古い財布から見つかります。
    reading: まるく かるぷれす にじゅうはっさい。さいしょの はっぴょうで きえたのわ はちじゅうごまんまい。なのかご、にじゅうまんまいが ふるい さいふから みつかります。
  - speaker: reimu
    text: 1年5か月後、彼は逮捕されます。罪は、消えたビットコインのことではありませんでした。
    reading: いちねん ごかげつご、かれわ たいほ されます。つみわ、きえた びっとこいんの ことでわ ありませんでした。
# ---- 今の部屋（ゲームセンターのメダルの預かりカード） ----
- id: hook
  title: ''
  background: mx_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: ゲーセンにメダル1000枚、預けてるのだ！
    se: jaan
  - speaker: tsumugi
    emotion: normal
    text: そのお店、閉店の貼り紙が出てたわ。
  - speaker: zundamon
    emotion: surprised
    text: えっ。ボクのメダルは？
  - speaker: tsumugi
    emotion: thinking
    text: カードの1000枚は、お店の帳簿の数字よ。
  - speaker: tsumugi
    emotion: thinking
    text: 金庫にあるかは、カードじゃ分からない。
  - speaker: tsumugi
    emotion: normal
    text: それが85万枚で起きた[取引所|トリヒキジョ]があるの。
    telops:
    - {text: "消えた85万枚はどこへ？　罪はなぜ盗みでない？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 85万枚はどこへ！？なんで盗みの罪じゃないの！？
# ---- 2011年・タダの取引所 ----
- id: card2011
  title: ''
  background: mx_card_2011
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 2011年の初め。フランスで生まれ、2009年に日本へ来て、小さなIT会社を作った25歳がいました。
    reading: にせん じゅういちねんの はじめ。ふらんすで うまれ にせん きゅうねんに にほんえ きて、ちいさな あいてぃー がいしゃお つくった にじゅうごさいが いました。
- id: ch1_yuzuri
  title: タダの取引所
  background: mx_jimusho_s
  stage:
  - {who: zundamon, x: 0.5, tag: カルプレス, emotion: normal}
  cuts:
  - speaker: reimu
    text: 本人の話では1月18日、引き継がないかとメールが来ます。彼は2019年の手記に、こう書いています。
    reading: ほんにんの はなしでわ いちがつ じゅうはちにち、ひきつがないかと めーるが きます。かれわ にせん じゅうくねんの しゅきに、こう かいて います。
  - speaker: zundamon
    emotion: normal
    text: 実は、マウントゴックスの事業は
  - speaker: zundamon
    emotion: normal
    text: ジェド・マカレブという創業者から無償で譲り受けたものでした。
  - speaker: reimu
    text: 2月に譲り受けます。本人によれば条件は、6か月分の稼ぎの半分を渡すだけ。口座は約2000でした。
    reading: にがつに ゆずりうけます。ほんにんに よれば じょうけんわ、ろっかげつぶんの かせぎの はんぶんお わたす だけ。こうざわ やく にせんでした。
# ---- 判決が書いた仕組み：画面の数字と、本当の財布 ----
- id: ch1_gamen
  title: 画面と金庫
  background: mx_gamen
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: カルプレス, emotion: normal}
  cuts:
  - speaker: reimu
    text: 判決によれば、利用者どうしの売り買いで動くのは画面の残高だけ。銀行の現金も、本物のコインも動きません。
    reading: はんけつに よれば、りようしゃ どうしの うりかいで うごくのわ がめんの ざんだか だけ。ぎんこうの げんきんも ほんものの こいんも うごきません。
  - speaker: reimu
    text: 本物が動くのは、利用者が引き出す時だけ。彼は手記に、こうも書いています。
    reading: ほんものが うごくのわ、りようしゃが ひきだす とき だけ。かれわ しゅきに こうも かいて います。
  - speaker: zundamon
    emotion: sad
    text: 譲り受けてまもなく、保有するビットコインと
  - speaker: zundamon
    emotion: sad
    text: システム上の残高に[乖離|かいり]があることが判明しています。
- id: ch1_medal
  title: ''
  background: mx_kinko
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: カードに1000枚あっても、金庫には足りなかったのだ！？
    se: hirameki
  - speaker: tsumugi
    emotion: normal
    text: そう。カードには1000枚。でも金庫に1000枚あるかは、カードを見ても分からない。
  - speaker: tsumugi
    emotion: normal
    text: 会社は、画面と同じだけ本物も持つ約束。判決は、それを会社の意思と呼んだわ。
  - speaker: zundamon
    emotion: thinking
    text: なのに、足りなかった……。
  - speaker: tsumugi
    emotion: thinking
    text: 本人の言い分では、ずれは譲り受ける前からあったの。
  - speaker: tsumugi
    emotion: thinking
    text: 知らずに手を出した、と書いてるわ。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ画面の残高は、本当にあったの？
  - speaker: reimu
    text: このあと穴や資金の不足が出ると、彼は画面の数字のほうを書き換えます。のちに裁判所は、そう認めました。
    reading: この あと あなや しきんの ふそくが でると、かれわ がめんの すうじの ほうお かきかえます。のちに さいばんしょわ そう みとめました。
# ---- 2011年3〜6月・3か月で6万人 ----
- id: ch2_30bai
  title: 3か月で6万人
  background: mx_jimusho_s_yama
  bgm: curious
  stage:
  - {who: zundamon, x: 0.5, tag: カルプレス, emotion: happy}
  cuts:
  - speaker: reimu
    text: 3月、運営が始まります。本人の話では、ビットコインは1ドルから30ドルくらいに。利用者は3か月で6万人。
    reading: さんがつ うんえいが はじまります。ほんにんの はなしでわ、びっとこいんわ いちどるから さんじゅうどる くらいに。りようしゃわ さんかげつで ろくまんにん。
  - speaker: reimu
    text: 6月のハッキングで、一時1セントの値に。システムの作り直しに約1週間。2019年に、彼はこう語ります。
    reading: ろくがつの はっきんぐで、いちじ いっせんとの ねに。しすてむの つくりなおしに やく いっしゅうかん。にせん じゅうくねんに、かれわ こう かたります。
  - speaker: zundamon
    emotion: sad
    text: あのときは2時間も睡眠が取れれば良いほうです。
  - speaker: zundamon
    emotion: sad
    text: プログラミングとマネジメントの能力は
  - speaker: zundamon
    emotion: sad
    text: 全くの別物だと気がついたときにはすでに遅すぎました。
# ---- 2011年8月〜2012年4月・判決が認めた経緯（罪に問われた行為ではない） ----
- id: ch2_ana
  title: 画面の上の30万枚
  background: mx_gamen
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 1ドルが30ドルなら、100円のお菓子が3000円なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: でも、ここからは判決が認めた経緯よ。
  - speaker: tsumugi
    emotion: normal
    text: 2011年8月、社長の会社が別の小さな[取引所|トリヒキジョ]を買ったの。
  - speaker: tsumugi
    emotion: thinking
    text: そこはもう、1万7000枚を失ってた。返す約束ごと、引き受けたのよ。
  - speaker: zundamon
    emotion: surprised
    text: 買ったら、穴までついてきた！？
  - speaker: tsumugi
    emotion: normal
    text: 社長は入金の無いまま、自分が使う[A口座|エーこうざ]に15万ドルを足したの。
  - speaker: tsumugi
    emotion: normal
    text: そのドルで利用者から約1万8000枚を買って、穴の分を消したの。
  - speaker: zundamon
    emotion: thinking
    text: 画面の上のドルで、穴をふさいだ……。
  - speaker: reimu
    text: その翌月、2011年9月。のちの米国の起訴によれば、この取引所の財布から盗みが始まります。
    reading: その よくげつ、にせん じゅういちねん くがつ。のちの べいこくの きそに よれば、この とりひきじょの さいふから ぬすみが はじまります。
  - speaker: zundamon
    emotion: surprised
    text: じゃあ、ある日いっぺんに消えたんじゃないのだ！？
  - speaker: tsumugi
    emotion: thinking
    text: 米国の起訴は、そう見てるの。疑いの段階だけどね。
  - speaker: tsumugi
    emotion: normal
    text: そして11月には、使っていたフランスの銀行口座が一時凍結。
  - speaker: tsumugi
    emotion: thinking
    text: 約1億円が、引き出せなくなるの。
  - speaker: zundamon
    emotion: sad
    text: 穴に、凍結……。
  - speaker: tsumugi
    emotion: thinking
    text: お[金|かね]が回らなくなるのを心配して、社長は[A口座|エーこうざ]のビットコインを増やした。
  - speaker: tsumugi
    emotion: normal
    text: 2012年4月までの8回で、計30万枚よ。
  - speaker: zundamon
    emotion: surprised
    text: 本物は無いのに、画面の上だけで30万枚！？
    background: mx_gamen_plus
    se: bikkuri
    telops:
    - {text: "判決の認定　画面の上だけの30万枚", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: それを利用者に売って、約130万ドルを得たわ。
  - speaker: tsumugi
    emotion: thinking
    text: 金庫にメダルが無いのに、カードの数字を増やして売ったのね。
  - speaker: tsumugi
    emotion: normal
    text: この[A口座|エーこうざ]を社長が使っていることは、利用者に知らされていなかったの。
  - speaker: zundamon
    emotion: thinking
    text: この30万枚が、社長の罪になったのだ？
  - speaker: tsumugi
    emotion: normal
    text: ううん。これは判決が認めた経緯。罪に問われたのは、このあとの話よ。
  - speaker: zundamon
    emotion: surprised
    text: じゃあ、何が罪になったの！？
    beat: true
# ---- 2013年・3350万ドルの入力（有罪の事実） ----
- id: card2013
  title: ''
  background: mx_card_2013
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 2013年。ビットコインは年の初めの約13ドルから、1200ドルを超えるまで上がります。
    reading: にせん じゅうさんねん。びっとこいんわ としの はじめの やく じゅうさんどるから、せんにひゃくどるお こえるまで あがります。
- id: ch3_input
  title: 3350万ドルの入力
  background: mx_gamen
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: カルプレス, emotion: normal}
  - {who: shain2, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: この年の2月から9月。社長はA口座のドルの残高を、入金の無いまま計3350万ドル増やします。
    reading: この としの にがつから くがつ。しゃちょうわ えーこうざの どるの ざんだかお、にゅうきんの ない まま けい さんぜん さんびゃく ごじゅうまんどる ふやします。
    telops:
    - {text: "有罪の事実　3350万ドル", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: shain2
    emotion: surprised
    text: 社長、この[A口座|エーこうざ]は……
- id: ch3_room
  title: ''
  background: mx_gamen_plus
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: thinking
    text: 判決によると、社長は2月か3月ごろ社員に口座を知られたの。
  - speaker: tsumugi
    emotion: thinking
    text: そして一連の入力を終えた直後に、その口座のデータを変えた。
  - speaker: zundamon
    emotion: surprised
    text: 変えたの！？
  - speaker: tsumugi
    emotion: normal
    text: 増やしたドルで利用者から約30万枚を買い戻して、[A口座|エーこうざ]の30万枚も消したわ。
  - speaker: zundamon
    emotion: thinking
    text: 画面の上だけの30万枚を、画面の上だけのドルで……。
  - speaker: tsumugi
    emotion: thinking
    text: そう。数字は消えても、金庫に本物が増えたわけじゃないの。
  - speaker: reimu
    text: のちに法廷で、彼は主張します。資金が尽きて、会社が破綻するのを避けるためだった、と。
    reading: のちに ほうていで かれわ しゅちょう します。しきんが つきて かいしゃが はたん するのお さける ためだったと。
  - speaker: tsumugi
    emotion: normal
    text: でも判決は、30万枚を隠すための入力だったと認めたわ。高裁も、言い分を退けたの。
  - speaker: tsumugi
    emotion: normal
    text: これが、有罪になった事実よ。
  - speaker: zundamon
    emotion: sad
    text: 隠すため……。
  - speaker: zundamon
    emotion: thinking
    text: 本物の金庫の鍵は、誰が持ってたの？
# ---- 2013年・世界の7割と、社長しか持たない鍵 ----
- id: ch3_jimusho
  title: 世界の7割
  background: mx_jimusho
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: カルプレス, emotion: normal}
  - {who: shain, x: 0.7, emotion: happy}
  cuts:
  - speaker: shain
    emotion: happy
    text: 社長、うちが世界の取引の7割を扱ってるそうですよ！
  - speaker: shain
    emotion: happy
    text: 渋谷の、この事務所がですよ。
  - speaker: shain
    emotion: normal
    text: 1階のビットコインカフェは、いつ開くんでしょうね。
  - speaker: shain
    emotion: thinking
    text: ……開く気配、ないですね。
    beat: true
  - speaker: shain
    emotion: sad
    text: 社長、[米ドル|ベイドル]の払い戻しをもう何か月も待たせています。
    background: mx_jimusho_kami
    se: gaan
  - speaker: shain
    emotion: sad
    text: 問い合わせが、壁一面に……。
  - speaker: shain
    emotion: thinking
    text: 社長、鍵を……。
  - speaker: reimu
    text: 鍵は、社長しか持っていなかった、と元社員たちは言います。
    reading: かぎわ しゃちょうしか もって いなかったと、もと しゃいんたちわ いいます。
# ---- 2014年2月・払い戻しを止める ----
- id: card2014
  title: ''
  background: mx_card_2014
  bgm: serious
  cuts:
  - speaker: reimu
    text: 2014年2月7日。マウントゴックスは、ビットコインの払い戻しを全部止めます。
    reading: にせん じゅうよねん にがつ なのか。まうんと ごっくすわ、びっとこいんの はらいもどしお ぜんぶ とめます。
