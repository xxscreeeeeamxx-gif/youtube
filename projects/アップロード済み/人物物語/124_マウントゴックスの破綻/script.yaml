  - speaker: tsumugi
    emotion: normal
    text: 民事再生に移ったから、ビットコインのまま受け取る道ができた。そこは本当よ。
  - speaker: tsumugi
    emotion: thinking
    text: でも戻ったのは、預けた枚数の一部。
    se: hammer
  - speaker: zundamon
    emotion: surprised
    text: 一部だけ！？
  - speaker: tsumugi
    emotion: normal
    text: 預けた枚数の一部が、10年分値上がりして戻った。それが正確ね。
# ---- 本当の注意点 ----
- id: chui
  title: 画面の残高は帳簿
  background: mx_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: '[取引所|トリヒキジョ]の画面の残高は、預け先の帳簿の数字。'
    telops:
    - {text: "画面の残高＝預け先の帳簿の数字", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: tsumugi
    emotion: thinking
    text: 本物が金庫にあるかは、画面だけでは分からないの。
  - speaker: zundamon
    emotion: thinking
    text: ゲーセンのカードと、同じなのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 日本では2017年4月から、交換業者は登録制。
  - speaker: tsumugi
    emotion: normal
    text: 預かった財産を、分けて管理する決まりもあるわ。
  - speaker: tsumugi
    emotion: normal
    text: 使う前に、金融庁に登録された業者かを確かめてね。
  - speaker: zundamon
    emotion: normal
    text: 登録を、確かめる。
  - speaker: tsumugi
    emotion: thinking
    text: 次に、払い戻しが遅れるのはいちばん大きな合図。
  - speaker: zundamon
    emotion: thinking
    text: 合図……。
  - speaker: tsumugi
    emotion: normal
    text: 2013年に[米ドル|ベイドル]の払い戻しが遅れて、翌年2月にはビットコインも止まったわ。
  - speaker: zundamon
    emotion: surprised
    text: 遅れ始めたら、もう危ないのだ！？
  - speaker: tsumugi
    emotion: normal
    text: それと返金しますと言ってくる連絡は、まず疑うこと。
  - speaker: tsumugi
    emotion: thinking
    text: マウントゴックスの管財人も、偽のサイトや偽のメールに何度も注意を出してるの。
  - speaker: zundamon
    emotion: sad
    text: 返してくれる話ほど、あやしいのだ……。
