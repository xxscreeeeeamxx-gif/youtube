scenes:
- id: hook
  title: ''
  background: mg_beranda
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、今夜は星を数えるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: ……東京の空で？
  - speaker: zundamon
    emotion: normal
    text: 1、2、3……。
  - speaker: zundamon
    emotion: thinking
    text: ……終わったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 3つね。
  - speaker: zundamon
    emotion: happy
    text: 都会の星は、少数精鋭なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 物は言いようね。
  - speaker: zundamon
    emotion: happy
    text: だったら、プラネタリウムに行くのだ。数えきれない星が見られるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 昔のプラネタリウムが映せた星は、数千個から3万個くらいだったのよ。
  - speaker: zundamon
    emotion: surprised
    text: 頑張れば、数えられるのだ！？
    se: oti
  - speaker: reimu
    text: プラネタリウム。ドームの天井に、夜空を映す機械です。
    reading: ぷらねたりうむ。どーむの てんじょうに よぞらお うつす きかいです。
  - speaker: reimu
    text: 肉眼で見える星は、全天でおよそ8600個とされます。
    reading: にくがんで みえる ほしわ ぜんてんで およそ はっせんろっぴゃっこと されます。
  - speaker: reimu
    text: 1998年、ロンドンの国際会議で、100万個を超える星を映す機械が発表されました。
    reading: せんきゅうひゃく きゅうじゅうはちねん、ろんどんの こくさい かいぎで ひゃくまんこお こえる ほしお うつす きかいが はっぴょう されました。
  - speaker: reimu
    text: 作ったのは、大平貴之。28歳の、ソニーの社員でした。
    reading: つくったのわ おおひら たかゆき。にじゅうはっさいの そにーの しゃいんでした。
  - speaker: tsumugi
    emotion: normal
    text: しかも作った場所は、実家の、7畳の自分の部屋なの。
  - speaker: zundamon
    emotion: surprised
    text: 会社じゃなくて、自分の部屋なのだ！？
- id: ch0_rekishi
  title: プラネタリウムの始まり
  background: mg_rekishi
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: プラネタリウムの始まりは、1923年のドイツなの。
  - speaker: tsumugi
    emotion: normal
    text: レンズの会社、ツァイスの技術者が作ったわ。
  - speaker: tsumugi
    emotion: normal
    text: 天井の星が、本物の空のように動いて見える。見た人は、イエナの驚異と呼んだそうよ。
  - speaker: zundamon
    emotion: surprised
    text: 100年も前から、あったのだ！
  - speaker: tsumugi
    emotion: normal
    text: '[日本|にほん]で最初のプラネタリウムは、1937年に大阪にできたの。'
  - speaker: tsumugi
    emotion: normal
    text: 52年間で、1100万人以上が見たわ。
  - speaker: tsumugi
    emotion: normal
    text: 漫画家の手塚治虫も、少年のころ、月に1回ほど[通って|かよって]いたそうよ。
  - speaker: zundamon
    emotion: happy
    text: 手塚治虫も、同じ星空を見上げてたのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 翌年には東京の有楽町にもできたけど、戦争の空襲で焼けてしまったの。
  - speaker: zundamon
    emotion: sad
    text: ……7年もたたずに、なくなったのだ。
  - speaker: tsumugi
    emotion: normal
    text: そのころの機械が映した星は、9000個ほど。
  - speaker: tsumugi
    emotion: normal
    text: 肉眼で見える星と、ほとんど同じ数ね。
  - speaker: zundamon
    emotion: thinking
    text: 見える星は、ちゃんと全部映してたのだ。
  - speaker: tsumugi
    emotion: normal
    text: そう。見える星を映せば十分、というのが、長い間の常識だったの。
- id: card1970
  title: ''
  background: mg_card_1970
  cuts:
  - speaker: reimu
    text: 1970年。神奈川県川崎市で、大平貴之が生まれます。
    reading: せんきゅうひゃく ななじゅうねん。かながわけん かわさきしで おおひら たかゆきが うまれます。
- id: ch1_yakou
  title: 天井の星座
  background: mg_heya70
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, scale: 0.8, emotion: happy}
  - {who: doukyu, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 実験や工作に夢中で、7畳の自室は実験室のようになっていました。
    reading: じっけんや こうさくに むちゅうで、ななじょうの じしつわ じっけんしつの ように なっていました。
  - speaker: reimu
    text: 小学4年のころ、文房具店で夜光塗料を見つけます。
    reading: しょうがく よねんの ころ ぶんぼうぐてんで やこう とりょうお みつけます。
  - speaker: zundamon
    emotion: happy
    text: 紙に塗って、丸く切って、天井に貼ったのだ。
  - speaker: doukyu
    emotion: thinking
    text: 天井に？ 何を貼ったの？
  - speaker: zundamon
    emotion: happy
    text: 電気を消してみるのだ。
- id: ch1_yakou2
  title: ''
  background: mg_heya70d
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, scale: 0.8, emotion: happy}
  - {who: doukyu, x: 0.7, emotion: surprised}
  cuts:
  - speaker: doukyu
    emotion: surprised
    text: わあ、天井に星がある！
  - speaker: zundamon
    emotion: happy
    text: あれがオリオン座で、こっちが冬の大三角なのだ。
  - speaker: doukyu
    emotion: happy
    text: 大平くん、すごいね！
  - speaker: reimu
    text: 家族や近所の人に見せて、星座を解説すると喜ばれた、と本人は話しています。
    reading: かぞくや きんじょの ひとに みせて せいざお かいせつ すると よろこばれたと、ほんにんわ はなしています。
  - speaker: zundamon
    emotion: normal
    text: 次は、紙のドームに穴をあけて、電球で映すのだ。
  - speaker: zundamon
    emotion: sad
    text: ぼやけて、星に見えないのだ！
  - speaker: doukyu
    emotion: thinking
    text: 光が、にじんじゃってるね。
  - speaker: zundamon
    emotion: happy
    text: 本の付録の型紙で作ったら、ぼんやりだけど映ったのだ！
  - speaker: doukyu
    emotion: surprised
    text: 小さな穴から、光がもれてるんだね。
  - speaker: zundamon
    emotion: happy
    text: 型紙を3倍に大きくしたら、もっとくっきりしたのだ。
  - speaker: reimu
    text: 小さな穴から光を漏らす、ピンホール式と呼ばれるプラネタリウムです。
    reading: ちいさな あなから ひかりお もらす ぴんほーるしきと よばれる ぷらねたりうむです。
- id: ch1_kagakukan
  title: 科学館の少年
  background: mg_kagakukan
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, scale: 0.8, emotion: normal}
  - {who: shokuin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 近くの川崎市青少年科学館では、プラネタリウムを見ることができました。
    reading: ちかくの かわさきし せいしょうねん かがくかんでわ、ぷらねたりうむお みる ことが できました。
  - speaker: shokuin
    emotion: happy
    text: 君が、プラネタリウムに夢中だっていう子かい？
  - speaker: zundamon
    emotion: happy
    text: そうなのだ。この機械のことが、知りたいのだ。
  - speaker: zundamon
    emotion: normal
    text: 中の電球は、何ワットなのだ？ モーターは、いくつ入ってるのだ？
  - speaker: shokuin
    emotion: surprised
    text: 星じゃなくて、機械の質問ばかりだね。
  - speaker: zundamon
    emotion: normal
    text: 夕焼けは、どうやって映してるのだ？
  - speaker: shokuin
    emotion: happy
    text: じゃあ、この解説台のダイヤルを、回してごらん。
  - speaker: zundamon
    emotion: surprised
    text: 星が、動いたのだ……！
  - speaker: reimu
    text: 科学館の職員は後に、少年はメカの質問ばかりしてきた、と振り返っています。
    reading: かがくかんの しょくいんわ のちに しょうねんわ めかの しつもんばかり してきたと、ふりかえっています。
- id: ch1_lens
  title: 電話帳のレンズ会社
  background: mg_heya70
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, scale: 0.85, emotion: normal}
  - {who: lens, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 小学6年では、レンズで映すプラネタリウムの設計図を描きます。
    reading: しょうがく ろくねんでわ れんずで うつす ぷらねたりうむの せっけいずお かきます。
  - speaker: zundamon
    emotion: normal
    text: レンズが要るのだ。電話帳で、レンズの会社を探すのだ。
  - speaker: lens
    emotion: normal
    text: はい、こちら営業部ですが……。
  - speaker: zundamon
    emotion: happy
    text: プラネタリウムを作りたいので、レンズを分けてほしいのだ！
  - speaker: lens
    emotion: surprised
    text: ……[君|きみ]、小学生かい？
  - speaker: lens
    emotion: thinking
    text: 悪いけど、うちでは無理だね。
  - speaker: zundamon
    emotion: normal
    text: ……分かったのだ。次の会社に電話するのだ。
  - speaker: reimu
    text: 断られても次の会社に電話をかけ、レンズを分けてくれる会社を見つけました。
    reading: ことわられても つぎの かいしゃに でんわお かけ、れんずお わけてくれる かいしゃお みつけました。
  - speaker: zundamon
    emotion: sad
    text: ……レンズはもらえたけど、うまく映らないのだ。
- id: ch1_renji
  title: 電子レンジの自由研究
  background: mg_heya70
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, scale: 0.85, emotion: happy}
  - {who: denki, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 夏休みの自由研究は、電子レンジを作るのだ。
  - speaker: zundamon
    emotion: normal
    text: 作り方は、メーカーに聞けばいいのだ。
  - speaker: denki
    emotion: normal
    text: はい、お客様相談室です。
  - speaker: zundamon
    emotion: happy
    text: 電子レンジを、自分で作りたいのだ。
  - speaker: zundamon
    emotion: normal
    text: 部品は、どこで買えるのだ？
  - speaker: denki
    emotion: surprised
    text: ……作る？ 電子レンジを、ですか？
  - speaker: denki
    emotion: angry
    text: 危険ですから、やめてください！
  - speaker: zundamon
    emotion: sad
    text: ……止められたのだ。
    se: oti
  - speaker: reimu
    text: 大手の電機メーカーに電話して、止められたという話も、本人が語っています。
    reading: おおての でんき めーかーに でんわして、とめられたと いう はなしも ほんにんが かたっています。
- id: ch1_rocket
  title: 夕焼けのロケット
  background: mg_kawara
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, scale: 0.85, emotion: normal}
  - {who: doukyu, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 手作りのロケットにも挑みました。火薬の調合に苦労し、何百回も失敗したといいます。
    reading: てづくりの ろけっとにも いどみました。かやくの ちょうごうに くろうし なんびゃっかいも しっぱい したと いいます。
  - speaker: doukyu
    emotion: thinking
    text: 大平くん、これで何回目？
  - speaker: zundamon
    emotion: normal
    text: 何百回か、もう数えてないのだ。
  - speaker: doukyu
    emotion: surprised
    text: 何百回！？
  - speaker: zundamon
    emotion: normal
    text: 火薬の混ぜ方を、また変えたのだ。3、2、1……！
- id: ch1_rocket2
  title: ''
  background: mg_kawara2
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, scale: 0.85, emotion: happy}
  - {who: doukyu, x: 0.7, emotion: surprised}
  cuts:
  - speaker: doukyu
    emotion: surprised
    text: 飛んだ！
  - speaker: zundamon
    emotion: happy
    text: 夕焼けの空に、消えたのだ……！
  - speaker: reimu
    text: 中学2年で、初めて打ち上げに成功します。その光景が忘れられない、と本人は話しています。
    reading: ちゅうがく にねんで はじめて うちあげに せいこう します。その こうけいが わすれられないと ほんにんわ はなしています。
- id: card1986
  title: ''
  background: mg_card_1986
  cuts:
  - speaker: reimu
    text: 1986年。物理部の天文班にいた高校生の大平は、ハレー彗星を見にオーストラリアへ向かいます。
    reading: せんきゅうひゃく はちじゅうろくねん。ぶつりぶの てんもんはんに いた こうこうせいの おおひらわ、はれー すいせいお みに おーすとらりあえ むかいます。
- id: ch2_amanogawa
  title: 南半球の天の川
  background: mg_australia
  bgm: amacha_hoshizora
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 大平貴之, scale: 0.9, emotion: surprised}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: ……空が、星で埋まってるのだ。
  - speaker: zundamon
    emotion: surprised
    text: 天の川が、ただの光の帯じゃないのだ。
  - speaker: reimu
    text: 南半球で見た天の川の迫力が、のちの開発の原動力になった、と本人は語っています。
    reading: みなみはんきゅうで みた あまのがわの はくりょくが、のちの かいはつの げんどうりょくに なったと ほんにんわ かたっています。
- id: ch2_bunkasai
  title: 1万6000個の星
  background: mg_bunkasai
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, scale: 0.9, emotion: normal}
  - {who: buin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 高校2年の秋、2台目を文化祭に出します。
    reading: こうこう にねんの あき にだいめお ぶんかさいに だします。
  - speaker: buin
    emotion: normal
    text: 大平、去年の文化祭は6300個だったよな。今年は何個なんだ？
  - speaker: zundamon
    emotion: happy
    text: 1万6000個なのだ。去年の、倍以上なのだ。
  - speaker: buin
    emotion: surprised
    text: そんなにか！？
  - speaker: zundamon
    emotion: normal
    text: 直径3メートルのドームの中を、真っ暗にするのだ。
  - speaker: zundamon
    emotion: happy
    text: 音楽を流して、ぼくが解説するのだ。
  - speaker: reimu
    text: 当時のプラネタリウムでも、多いもので3万個ほどだった、と本人は話しています。
    reading: とうじの ぷらねたりうむでも おおい もので さんまんこほど だったと、ほんにんわ はなしています。
  - speaker: zundamon
    emotion: normal
    text: 次は、レンズで映すのを作りたいのだ。
  - speaker: buin
    emotion: thinking
    text: レンズで映すやつって、個人で作れるのか？
  - speaker: zundamon
    emotion: angry
    text: 無理と言われるほど、作りたくなるのだ。
  - speaker: reimu
    text: 個人には無理だと言われたことが、かえってやる気に火をつけた、と本人は語っています。
    reading: こじんにわ むりだと いわれた ことが、かえって やるきに ひお つけたと ほんにんわ かたっています。
- id: ch2_sotsugyou
  title: 卒業式のロケット
  background: mg_kousha
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, scale: 0.9, emotion: happy}
  - {who: sensei, x: 0.7, emotion: angry}
  cuts:
  - speaker: reimu
    text: 1988年、高校の卒業式の日。
    reading: せんきゅうひゃく はちじゅうはちねん。こうこうの そつぎょうしきの ひ。
  - speaker: zundamon
    emotion: happy
    text: 3、2、1……発射なのだ！
- id: ch2_sotsugyou2
  title: ''
  background: mg_kousha2
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, scale: 0.9, emotion: surprised}
  - {who: sensei, x: 0.7, emotion: angry}
  cuts:
  - speaker: sensei
    emotion: angry
    text: 大平！ 卒業式の日に、校庭で何を飛ばしてるんだ！
  - speaker: zundamon
    emotion: surprised
    text: ロ、ロケットなのだ……。
  - speaker: sensei
    emotion: angry
    text: 卒業証書は、没収だ！
  - speaker: zundamon
    emotion: sad
    text: ご、ごめんなさいなのだ！
    se: oti
  - speaker: reimu
    text: 職員室で、必死に謝ったそうです。
    reading: しょくいんしつで ひっしに あやまったそうです。
