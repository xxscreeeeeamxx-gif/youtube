meta:
  title: 【メガスターの誕生】「個人には無理」と言われたプラネタリウムを、7畳の自室で作った会社員【ずんだもん解説】
  slug: ohira-megastar
  summary: 昔のプラネタリウムが映せた星は、数千個から3万個ほどでした。1998年、ロンドンの国際会議で100万個を超える星を映したのは、ソニーの若い社員が実家の7畳の自室で作った機械でした。電話帳でレンズ会社を探した小学生時代、卒業式のロケット、秋葉原の電源メーカーでのアルバイトと自作の露光装置。0.7ミクロンの穴で星を描いた大平貴之とメガスターの歩みを、再現ドラマでたどります。
  tags:
  - プラネタリウム
  - メガスター
  - 大平貴之
  - 星空
  - 天の川
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 雑学
  - ものづくり
  thumbnail:
    top: 7畳の自室で作った
    bottom: メガスターの誕生
  mode: drama
  narrator: reimu
