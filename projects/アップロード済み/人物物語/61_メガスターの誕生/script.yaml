    text: これでプレッシャーを感じないのは、よほど肝が据わってるか、のんきかのどちらか。
  - speaker: tsumugi
    emotion: happy
    text: 大平さんは、そう笑って話してるわ。
  - speaker: zundamon
    emotion: happy
    text: 大平さんは、感じるほうなのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 毛利さんには、あなたが事故に遭ったらどうなるのか、とも聞かれたそうよ。
  - speaker: zundamon
    emotion: thinking
    text: 作れる人が、一人しかいないからなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 映した星は、500万個を超えたの。
  - speaker: tsumugi
    emotion: normal
    text: 宇宙飛行士でもある毛利さんは、宇宙で見た星空そのものだ、と評したわ。
  - speaker: zundamon
    emotion: surprised
    text: 本物の宇宙を見た人の、お墨付きなのだ！
  - speaker: tsumugi
    emotion: normal
    text: この年、ギネス世界記録にも認定されたの。
  - speaker: tsumugi
    emotion: normal
    text: 世界で最も先進的なプラネタリウムの投影機、としてね。
  - speaker: tsumugi
    emotion: thinking
    text: このころの大平さんは、こう話していたの。
  - speaker: tsumugi
    emotion: thinking
    text: 高校生のとき以来、オーストラリアの天の川は見に行けていない、って。
  - speaker: zundamon
    emotion: surprised
    text: どうしてなのだ？
  - speaker: tsumugi
    emotion: normal
    text: 本物を見て、自分の星空と違っていたらショックだから、見ないほうが幸せかも、って。
  - speaker: zundamon
    emotion: thinking
    text: 作った人ならではの悩みなのだ。
- id: ch10_teian
  title: 家の中の星空
  background: mg_giken
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, emotion: normal}
  - {who: gangu, x: 0.7, emotion: normal}
  cuts:
  - speaker: gangu
    emotion: normal
    text: 大平さん、家で使えるプラネタリウムを、一緒に作りませんか。
  - speaker: zundamon
    emotion: surprised
    text: おもちゃの会社から、声がかかったのだ！
  - speaker: reimu
    text: 持ちかけたのは、玩具メーカーのセガトイズでした。
    reading: もちかけたのわ がんぐ めーかーの せがといずでした。
  - speaker: gangu
    emotion: thinking
    text: 仕事で疲れた帰り道、ふと星が見たいと思ったんです。
  - speaker: zundamon
    emotion: happy
    text: 家に帰れば星空がある、というのはいいのだ。
- id: ch10_homestar
  title: ''
  background: mg_homestar
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, emotion: normal}
  - {who: gangu, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: この試作機の大きさで、星を1万個映すのだ。
  - speaker: gangu
    emotion: normal
    text: 値段は、2万790円にします。
  - speaker: zundamon
    emotion: thinking
    text: おもちゃにしては、高い値段なのだ。売れるのだ？
  - speaker: reimu
    text: 2005年2月、大平は大平技研という会社を作ります。
    reading: にせんごねん にがつ おおひらわ おおひら ぎけんと いう かいしゃお つくります。
  - speaker: reimu
    text: 2005年、家庭用の光学式プラネタリウム、ホームスターが発売されます。
    reading: にせんごねん かていようの こうがくしき ぷらねたりうむ ほーむすたーが はつばい されます。
  - speaker: reimu
    text: 当初は、1000台売れれば上出来という見込みだったといいます。
    reading: とうしょわ せんだい うれれば じょうできと いう みこみだったと いいます。
  - speaker: reimu
    text: ところが、2015年に100万台、2021年には170万台を超えました。
    reading: ところが にせんじゅうごねんに ひゃくまんだい、にせんにじゅういちねんにわ ひゃくななじゅうまんだいお こえました。
  - speaker: reimu
    text: 同じ2005年には、大平の半生がテレビドラマにもなっています。
    reading: おなじ にせんごねんにわ おおひらの はんせいが てれび どらまにも なっています。
- id: ch12_shinka
  title: 10億の星
  background: mg_zukai3
  bgm: curious
  stage:
  - {who: zundamon, x: 0.14, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.86, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 星の数は、そのあとも増え続けたの。
  - speaker: tsumugi
    emotion: normal
    text: 2006年には、施設向けのプラネタリウムで初めて、光源にLEDを使ったの。
  - speaker: zundamon
    emotion: thinking
    text: 電球を取り替えなくて、よくなったのだ？
  - speaker: tsumugi
    emotion: normal
    text: そう。今のLEDは、3万時間ほど持つそうよ。
  - speaker: tsumugi
    emotion: normal
    text: 2008年には、2200万個を映す機械を発表したわ。
  - speaker: tsumugi
    emotion: normal
    text: 2012年には、子どものころに[通った|かよった]川崎の科学館に、新しいメガスターが入ったの。
  - speaker: zundamon
    emotion: happy
    text: ダイヤルを回させてもらった、あの科学館なのだ！
  - speaker: tsumugi
    emotion: normal
    text: レンズで映す星とデジタルの映像を重ねて、映像と重なる所だけ星を消せる機械よ。
  - speaker: tsumugi
    emotion: normal
    text: 2015年には、ソニーのグループ会社と、ブルーレイの技術で星の板を作ったの。
  - speaker: tsumugi
    emotion: normal
    text: 穴の大きさは、200ナノメートル。映せる星は、10億個を超えたわ。
  - speaker: zundamon
    emotion: surprised
    text: 10億個！？
- id: ch11_kyujo
  title: 球場いっぱいの星
  background: mg_giken
  bgm: pop
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 大平貴之, emotion: normal}
  - {who: kyujo, x: 0.56, emotion: normal}
  - {who: staff, x: 0.8, emotion: normal}
  cuts:
  - speaker: kyujo
    emotion: normal
    text: 今度、ドーム球場でコンサートがあるんです。
  - speaker: kyujo
    emotion: normal
    text: 天井いっぱいに、星を映せませんか？
  - speaker: zundamon
    emotion: thinking
    text: 天井いっぱい、なのだ……？
  - speaker: staff
    emotion: thinking
    text: さすがに、それは……。
  - speaker: zundamon
    emotion: happy
    text: ……できるのだ。ぜひ、やらせてほしいのだ！
  - speaker: staff
    emotion: surprised
    text: えっ！？
    se: oti
  - speaker: reimu
    text: 断るつもりの席で、思わずできますと言ってしまった、と本人は振り返っています。
    reading: ことわる つもりの せきで おもわず できますと いって しまったと、ほんにんわ ふりかえっています。
- id: ch11_giganium
  title: ''
  background: mg_stadium
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, emotion: normal}
  - {who: staff, x: 0.7, emotion: thinking}
  cuts:
  - speaker: staff
    emotion: thinking
    text: ……で、どう映すんですか？
  - speaker: zundamon
    emotion: normal
    text: 小さな鏡を、球にたくさん貼るのだ。鏡1枚が、星1つになるのだ。
  - speaker: zundamon
    emotion: normal
    text: 鏡は約6000枚。直径32センチの球に、貼っていくのだ。
  - speaker: staff
    emotion: surprised
    text: 球場の天井が、星でいっぱい……！
  - speaker: reimu
    text: 2019年8月、埼玉の球場で、約1万人が同じ星空を見上げました。
    reading: にせんじゅうきゅうねん はちがつ、さいたまの きゅうじょうで やく いちまんにんが おなじ ほしぞらお みあげました。
  - speaker: reimu
    text: 2022年には、横浜の科学館に、約12億個の星を映す機械が入ります。
    reading: にせんにじゅうにねんにわ よこはまの かがくかんに やく じゅうにおくこの ほしお うつす きかいが はいります。
  - speaker: reimu
    text: 2023年には、横浜の機械が星の数で、この球場の星空が投影の広さで、ギネス世界記録に認められました。
    reading: にせんにじゅうさんねんにわ よこはまの きかいが ほしの かずで、この きゅうじょうの ほしぞらが とうえいの ひろさで ぎねす せかい きろくに みとめられました。
- id: ch13_ronsou
  title: 見えない星は嘘？
  background: mg_zukai4
  bgm: curious
  stage:
  - {who: zundamon, x: 0.14, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.86, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: でも、目で見えない星まで映したら、嘘の星空にならないのだ？
  - speaker: tsumugi
    emotion: normal
    text: そう思う人も、いるかもね。
  - speaker: tsumugi
    emotion: normal
    text: 大平さんは、星を足してるわけじゃない、と説明してるわ。
  - speaker: tsumugi
    emotion: normal
    text: 本物どおりの暗さで、小さな点として映しているだけ、って。
  - speaker: tsumugi
    emotion: normal
    text: 実際、ドームの中で双眼鏡をのぞくと、本物の空と同じように暗い星が見えるの。
  - speaker: zundamon
    emotion: surprised
    text: 見えない星も、ちゃんとそこにあるのだ！
  - speaker: tsumugi
    emotion: normal
    text: それに、見えない星がたくさん集まるから、天の川はぼんやり光って見えるのよ。
  - speaker: zundamon
    emotion: thinking
    text: 肉眼だと、全部で何個なのだ？
  - speaker: tsumugi
    emotion: normal
    text: 全天でおよそ8600個。地平線の上に出ているのは、その半分ほどね。
  - speaker: tsumugi
    emotion: thinking
    text: '[日本|にほん]の人口の約7割は、天の川が見えない場所に住んでるの。'
  - speaker: tsumugi
    emotion: thinking
    text: 街の明かりのせいね。そういう研究があるの。
  - speaker: zundamon
    emotion: sad
    text: 東京で3つしか見えなかったのは、そのせいなのだ……。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、星の数の世界一は、ずっとメガスターなのだ？
  - speaker: tsumugi
    emotion: normal
    text: そこは、争いが続いてるの。
  - speaker: tsumugi
    emotion: normal
    text: 2012年には、[日本|にほん]の[五藤光学|ごとうこうがく]の機械が、ギネスの記録を塗り替えたわ。
  - speaker: tsumugi
    emotion: normal
    text: 今は、星の数を競う記録が、部門ごとに分かれてるのよ。
- id: ch14_gendai
  title: 14の国と地域へ
  background: mg_gendai
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: '[日本|にほん]で今動いているプラネタリウムは、298か所。'
  - speaker: tsumugi
    emotion: normal
    text: 数ではアメリカが1位で、[日本|にほん]は2位とみられてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 世界最大のドームも、名古屋の科学館にあるの。直径35メートルよ。
  - speaker: zundamon
    emotion: surprised
    text: プラネタリウム大国なのだ！
  - speaker: tsumugi
    emotion: normal
    text: メガスターは、14の国と地域で、47以上の施設に入ったわ。
  - speaker: tsumugi
    emotion: normal
    text: 今年の6月には、福岡でプラネタリウムの国際会議が開かれたの。
  - speaker: zundamon
    emotion: happy
    text: 大阪で発表した会議が、また[日本|にほん]に来たのだ。
  - speaker: tsumugi
    emotion: happy
    text: 星を見に行って彼女ができた、という声が嬉しい、と大平さんは話してるわ。
  - speaker: zundamon
    emotion: happy
    text: 7畳の部屋の星空が、世界中に広がったのだ。
- id: shime
  title: ''
  background: mg_beranda2
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、もう一回、星を数えるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: また3つでしょ？
  - speaker: zundamon
    emotion: happy
    text: 今日は、双眼鏡があるのだ。
  - speaker: zundamon
    emotion: surprised
    text: 1、2、3、4、5……増えたのだ！
  - speaker: tsumugi
    emotion: happy
    text: 見えなかった星も、ちゃんとそこにあったのね。
  - speaker: zundamon
    emotion: happy
    text: 都会の星は、少数精鋭じゃなかったのだ。
  - speaker: zundamon
    emotion: thinking
    text: ……数えきれないから、プラネタリウムに行くのだ。
    se: oti
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴ありがとうございました！
    duet_with: tsumugi
