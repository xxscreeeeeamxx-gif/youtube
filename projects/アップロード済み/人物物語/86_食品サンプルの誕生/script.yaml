scenes:
- id: co_kashi
  title: ''
  background: sp_shokudo2
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, emotion: normal}
  - {who: tenshu, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1932年の大阪で、ある男がロウの食品サンプルを抱えて食堂を回っていました。
    reading: せんきゅうひゃく さんじゅうにねんの おおさかで、ある おとこが ろうの しょくひん さんぷるお かかえて しょくどうお まわって いました。
  - speaker: tenshu
    emotion: thinking
    text: うまそうなオムレツやな。……え、これ食べられへんのか。
  - speaker: zundamon
    emotion: normal
    text: ロウでできた見本です。腐りませんし、夏でも[傷みません|いたみません]。
  - speaker: tenshu
    emotion: thinking
    text: ほう。で、なんぼや。
  - speaker: zundamon
    emotion: normal
    text: 売りません。月ぎめで、お貸しします。
  - speaker: zundamon
    emotion: normal
    text: 貸し賃は、ひと月で本物の料理の10倍です。
  - speaker: tenshu
    emotion: angry
    text: 10倍！？ 食べられへんもんに、本物の10倍払えっちゅうんか！
    se: don
  - speaker: zundamon
    emotion: normal
    text: ……はい。払ったほうが、得なんです。
  - speaker: reimu
    text: この男は、岩崎瀧三。いま国内の食品サンプルのおよそ7割を、この男が始めた会社が作っています。
    reading: この おとこわ いわさき たきぞう。いま こくないの しょくひん さんぷるの およそ ななわりお、この おとこが はじめた かいしゃが つくって います。
- id: hook
  title: ''
  background: sp_mise
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: このオムライスのサンプル、お店で売ってもらうのだ！
  - speaker: tsumugi
    emotion: normal
    text: それ、一品で1万円くらいするわよ。
  - speaker: zundamon
    emotion: surprised
    text: 1万円！？ 本物なら10皿は食べられるのに！
  - speaker: zundamon
    emotion: happy
    text: ……じゃあ、ひと口だけかじらせてもらうのだ。
  - speaker: tsumugi
    emotion: thinking
    text: それ、樹脂よ。歯のほうが欠けるわ。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 昔の店は、本物の10倍を毎月払ってたのよ。
  - speaker: zundamon
    emotion: surprised
    text: 食べられないのに！？ なんでなのだ！
    telops:
    - {text: なぜ本物の10倍を払った？, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: その値段で貸して回ったのが、さっきのロウの男よ。
- id: card1895
  title: ''
  background: sp_card_1895
  cuts:
  - speaker: reimu
    text: 1895年。岐阜県の郡上八幡で、岩崎瀧三が生まれます。
    reading: せんはっぴゃく きゅうじゅうごねん。ぎふけんの ぐじょうはちまんで、いわさき たきぞうが うまれます。
- id: ch1_rou
  title: 水に咲いたロウの花
  background: sp_jinja_mizu
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, scale: 0.8, emotion: normal}
  - {who: haha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 瀧三は3歳のとき、顔にやけどを負います。家で絵や字をかいて遊ぶ子どもでした。
    reading: たきぞうわ さんさいの とき、かおに やけどお おいます。いえで えや じお かいて あそぶ こどもでした。
  - speaker: haha
    emotion: happy
    text: '[瀧三|タキゾウ]、見てみ。ろうそくがようけ並んで、きれいやろ。'
  - speaker: zundamon
    emotion: thinking
    text: ……家で絵をかいてるほうが、楽しいのに。
  - speaker: haha
    emotion: normal
    text: 今日は筆供養や。筆で遊ぶ子は、お参りせなあかん。
  - speaker: zundamon
    emotion: thinking
    text: 筆供養？
  - speaker: haha
    emotion: normal
    text: 使い古した筆に、ありがとうを言う日や。
  - speaker: zundamon
    emotion: surprised
    text: あっ、ロウが水たまりに落ちたのだ。
  - speaker: zundamon
    emotion: surprised
    text: ……水の中で、白い花みたいに開いた！
  - speaker: haha
    emotion: surprised
    text: ほんとや。梅の花びらみたいやねえ。
  - speaker: zundamon
    emotion: happy
    text: もう一回見たい！ ろうそく、もうちょっと傾けてみるのだ。
  - speaker: haha
    emotion: angry
    text: 神様のろうそくで、遊ぶんやない！
    se: hammer
  - speaker: zundamon
    emotion: sad
    text: ……花を、もう一個見たかっただけなのだ。
  - speaker: haha
    emotion: normal
    text: ほんなら帰って、その花の絵でもかいとき。
  - speaker: zundamon
    emotion: happy
    text: うん！ 花も水たまりも、全部かくのだ。
  - speaker: reimu
    text: 梅の花びらのような、白いロウの花。この形が、瀧三の心に深く刻まれました。
    reading: うめの はなびらの ような しろい ろうの はな。この かたちが、たきぞうの こころに ふかく きざまれました。
- id: ch1_hoko
  title: 15歳の奉公
  background: sp_hoko
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, scale: 0.9, emotion: happy}
  - {who: shujin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 15歳のころ、瀧三は柳行李ひとつを担いで大阪へ奉公に出ます。
    reading: じゅうごさいの ころ、たきぞうわ やなぎごうり ひとつお かついで おおさかえ ほうこうに でます。
  - speaker: shujin
    emotion: normal
    text: '[郡上|ぐじょう]から来た子やな。今日から、しっかり働いてもらうで。'
  - speaker: zundamon
    emotion: happy
    text: はい、旦那さん！ 大阪で[一旗|ひとハタ]あげます！
  - speaker: shujin
    emotion: thinking
    text: '[一旗|ひとハタ]の前に、まず店先の掃除や。'
  - speaker: zundamon
    emotion: normal
    text: 掃除が済んだら、[一旗|ひとハタ]ですか。
  - speaker: shujin
    emotion: angry
    text: 済んだら水まき。次は使い走りや。[一旗|ひとハタ]は当分[来えへん|けえへん]で。
  - speaker: zundamon
    emotion: thinking
    text: ……旦那さん。[一旗|ひとハタ]って、何年くらい先ですか。
  - speaker: shujin
    emotion: thinking
    text: わしは、40年待っとる。
  - speaker: zundamon
    emotion: surprised
    text: 旦那さんも、まだなんですか！？
    beat: true
  - speaker: reimu
    text: ところが瀧三は体を壊し、新しい商売に挑んでは失敗する日々が続きます。
    reading: ところが たきぞうわ からだお こわし、あたらしい しょうばいに いどんでわ しっぱい する ひびが つづきます。
- id: ch1_shippai
  title: ''
  background: sp_hoko
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, emotion: sad}
  - {who: shujin, x: 0.7, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: sad
    text: ……旦那さん。今度の商売も、あきませんでした。
  - speaker: shujin
    emotion: thinking
    text: これで[何べん|なんべん]目や。
  - speaker: zundamon
    emotion: sad
    text: 指が足りなくなったので、数えてません。
  - speaker: shujin
    emotion: normal
    text: 体もまだ本調子やないやろ。……ほれ、飯や。
  - speaker: zundamon
    emotion: surprised
    text: 旦那さん……。
  - speaker: shujin
    emotion: normal
    text: 落ち込んでも、腹は減る。食うたら、また考え。
  - speaker: shujin
    emotion: happy
    text: 商売は、転んだ数だけうまなるもんや。
  - speaker: zundamon
    emotion: normal
    text: ……いつか、ボクにしかできない商売を見つけるのだ。
- id: card1931
  title: ''
  background: sp_card_1931
  cuts:
  - speaker: reimu
    text: 1931年。瀧三は大阪で、妻のすゞと暮らしていました。
    reading: せんきゅうひゃく さんじゅういちねん。たきぞうわ おおさかで、つまの すずと くらして いました。
- id: ch2_itoko
  title: いとこが持ってきた焼肉
  background: sp_ie2
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 岩崎瀧三, emotion: normal}
  - {who: itoko, x: 0.56, emotion: happy}
  - {who: tsumugi, x: 0.8, tag: 岩崎すゞ, emotion: normal}
  cuts:
  - speaker: reimu
    text: 仕事は弁当や仕出し。ある日、いとこが学校の教材を持って遊びに来ます。
    reading: しごとわ べんとうや しだし。あるひ、いとこが がっこうの きょうざいお もって あそびに きます。
  - speaker: itoko
    emotion: happy
    text: '[瀧三|タキゾウ]さん、これ見てください。本物そっくりの肉の模型です。'
  - speaker: zundamon
    emotion: surprised
    text: 肉の、模型？
  - speaker: itoko
    emotion: normal
    text: 学校の教材です。焼肉が、本物にしか見えへんのですよ。
  - speaker: zundamon
    emotion: surprised
    text: 焼肉が、教材に？
    se: bikkuri
  - speaker: itoko
    emotion: happy
    text: 授業で使うんです。生徒が、よだれ垂らしてましたわ。
  - speaker: zundamon
    emotion: thinking
    text: ……これ、ロウでできてるんちゃうか。
  - speaker: itoko
    emotion: surprised
    text: よう分かりましたね。見ただけで？
  - speaker: zundamon
    emotion: normal
    text: 子どものころ、水に咲いたロウの花を見たことがあるんや。
  - speaker: zundamon
    emotion: happy
    text: ……焼き色まで、ほんまもんや。
  - speaker: tsumugi
    emotion: thinking
    text: あなたまで、よだれが出てますよ。
    beat: true
  - speaker: zundamon
    emotion: surprised
    text: ……研究や。これは、研究のよだれや。
- id: ch2_hint
  title: 毎日捨てられる見本
  background: sp_shokudo
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, emotion: normal}
  - {who: tenshu, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: そのころの食堂は、毎日本物の料理を作って店先に並べていました。
    reading: その ころの しょくどうわ、まいにち ほんものの りょうりお つくって みせさきに ならべて いました。
  - speaker: zundamon
    emotion: thinking
    text: 毎朝作って、[並べて|ならべて]はるんですか。
  - speaker: tenshu
    emotion: normal
    text: 見本がないと、客は[何|なん]の料理か分からんからな。
  - speaker: tenshu
    emotion: sad
    text: けど夏場は、昼にはもう[傷んで|いたんで]くる。
    background: sp_shokudo_itami
  - speaker: tenshu
    emotion: angry
    text: ほれ見い。親子丼が汗かいて、天ぷらがしおれとる。
  - speaker: zundamon
    emotion: surprised
    text: ……ハエまで、見本を食べに来てます。
    se: tenten
  - speaker: tenshu
    emotion: angry
    text: 客より先に、ハエが来よるんや。
    beat: true
  - speaker: zundamon
    emotion: thinking
    text: ハエよけに、網でもかぶせたらどうです？
  - speaker: tenshu
    emotion: angry
    text: 網かぶった親子丼、誰が食べたなるねん。
    beat: true
  - speaker: tenshu
    emotion: sad
    text: 毎日作っては、捨てとる。もったいない話や。
  - speaker: zundamon
    emotion: normal
    text: ……腐らない見本があったら、ほしいですか。
  - speaker: tenshu
    emotion: surprised
    text: そんなもんがあったら、誰でもほしいわ。
  - speaker: reimu
    text: 料理の見本は、商売になる。瀧三は、そう確信します。
    reading: りょうりの みほんわ、しょうばいに なる。たきぞうわ、そう かくしん します。
- id: ch2_tatami
  title: 畳の目を写したロウ
  background: sp_ie_yoru
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, emotion: thinking}
  - {who: tsumugi, x: 0.7, tag: 岩崎すゞ, emotion: thinking}
  cuts:
  - speaker: tsumugi
    emotion: thinking
    text: あなた、まだ起きてるの？ ろうそくが[垂れてる|たれてる]わよ。
  - speaker: zundamon
    emotion: surprised
    text: しもた！ 畳にロウが落ちたのだ。
  - speaker: tsumugi
    emotion: angry
    text: 早くはがして。畳を[傷めたら|いためたら]、[大家|おおや]さんに叱られるわ。
  - speaker: zundamon
    emotion: thinking
    text: ……[すゞ|すず]、ちょっとこれ見てくれ。
  - speaker: zundamon
    emotion: surprised
    text: はがしたロウに、畳の目がそのまま写ってる。
  - speaker: zundamon
    emotion: happy
    text: ロウは、触れたものの形を写す。料理の形も、写せるんや！
    se: hirameki
    telops:
    - {text: ロウは形を写し取る, size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: thinking
    text: ……それより畳の跡、どう説明するのよ。
  - speaker: zundamon
    emotion: happy
    text: '[大家|おおや]さんには、畳の目の模型ができましたって言う。'
  - speaker: tsumugi
    emotion: angry
    text: それ、余計に叱られるやつです。
    beat: true
  - speaker: reimu
    text: 畳に落ちたロウの跡が、見本づくりの手がかりになりました。
    reading: たたみに おちた ろうの あとが、みほんづくりの てがかりに なりました。
- id: ch2_shisaku
  title: 夜中2時の試作
  background: sp_shisaku_yoru
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, emotion: normal}
  - {who: tsumugi, x: 0.7, tag: 岩崎すゞ, emotion: normal}
  cuts:
  - speaker: reimu
    text: 仕事から帰ると、瀧三は夜中の2時過ぎまで試作を続けました。
    reading: しごとから かえると、たきぞうわ よなかの にじすぎまで しさくお つづけました。
  - speaker: zundamon
    emotion: normal
    text: まずは、本物の料理から型を取るのだ。
  - speaker: zundamon
    emotion: thinking
    text: 型は、寒天で取るのが一番よう写る。
  - speaker: tsumugi
    emotion: normal
    text: その型に、溶かしたロウを流すのね。
  - speaker: zundamon
    emotion: happy
    text: 固まったら、そっと取り出して……
  - speaker: zundamon
    emotion: sad
    text: ……あっ、割れた。
  - speaker: tsumugi
    emotion: thinking
    text: あなた、もう2時よ。
  - speaker: zundamon
    emotion: normal
    text: あと一つだけや。
  - speaker: zundamon
    emotion: normal
    text: 今度は、熱いうちに一気に流すのだ。
  - speaker: zundamon
    emotion: surprised
    text: ……寒天の型ごと、溶けてもうた。
  - speaker: tsumugi
    emotion: thinking
    text: 型から作り直しね。
  - speaker: tsumugi
    emotion: angry
    text: 台所のお鍋も、ロウだらけなんですけど。
  - speaker: zundamon
    emotion: normal
    text: 明日洗う。……あと一つだけや。
  - speaker: zundamon
    emotion: sad
    text: ……また割れた。
    background: sp_shisaku_yoru_yama
  - speaker: tsumugi
    emotion: thinking
    text: あと一つが、もう山になってるわよ。
    se: zukko
  - speaker: zundamon
    emotion: sad
    text: ロウは本物らしく見えるけど、もろすぎるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 障子みたいに、裏から紙を貼って補強したらどう？
  - speaker: zundamon
    emotion: surprised
    text: ……裏打ちか！
    telops:
    - {text: 紙で裏打ちする, size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: happy
    text: 割れへん！ [すゞ|すず]、勲章もんやぞ！
  - speaker: tsumugi
    emotion: happy
    text: 勲章より、まず寝かせてください。
    beat: true
  - speaker: reimu
    text: 紙で裏打ちするやり方を思いついたのは、すゞでした。
    reading: かみで うらうち する やりかたお おもいついたのわ、すずでした。
- id: ch2_omu
  title: 記念オム
  background: sp_omu1
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 岩崎瀧三, emotion: happy}
  - {who: tsumugi, x: 0.7, tag: 岩崎すゞ, emotion: sad}
  cuts:
  - speaker: reimu
