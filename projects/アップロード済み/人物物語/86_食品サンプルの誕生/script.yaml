    text: 1963年。郡上八幡の工場が、岩崎模型製造として独立します。
    reading: せんきゅうひゃく ろくじゅうさんねん。ぐじょうはちまんの こうじょうが、いわさき もけい せいぞうと して どくりつ します。
- id: ch5_ryote
  title: 両手を使え
  background: sp_kojo
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 岩崎瀧三, emotion: happy}
  - {who: shokunin, x: 0.56, emotion: happy}
  - {who: shonen, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 瀧三は1961年に社長を岩崎英一に譲り、会長になっていました。
    reading: たきぞうわ せんきゅうひゃく ろくじゅういちねんに しゃちょうお いわさき えいいちに ゆずり、かいちょうに なって いました。
  - speaker: shokunin
    emotion: happy
    text: 会長。今年の新入りです。中学を出たばっかりの子ですわ。
  - speaker: zundamon
    emotion: happy
    text: よう来たな。
  - speaker: shokunin
    emotion: normal
    text: 会長からも、何か[一言|ひとこと]言うたってください。
  - speaker: zundamon
    emotion: normal
    text: 必ず両手を使え。とにかく工夫しろ。
    telops:
    - {text: 必ず両手を使え, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: shokunin
    emotion: thinking
    text: 会長は、ほんまにそればっかりですな。
  - speaker: zundamon
    emotion: happy
    text: 空いとる手は、工夫の元や。
  - speaker: shokunin
    emotion: happy
    text: ほな会長、ご自分の両手は？
  - speaker: zundamon
    emotion: normal
    text: ボクの両手は、もう[君|きみ]らに預けてある。
  - speaker: reimu
    text: 必ず両手を使え。とにかく工夫しろ。この少年がのちに語った、瀧三の口ぐせです。
    reading: かならず りょうてお つかえ。とにかく くふう しろ。この しょうねんが のちに かたった、たきぞうの くちぐせです。
- id: ch5_shi
  title: ''
  background: sp_kojo_mono
  bgm: 223am
  cuts:
  - speaker: reimu
    text: 少年が入社した2年後の1965年、岩崎瀧三は亡くなりました。
    reading: しょうねんが にゅうしゃ した にねんごの せんきゅうひゃく ろくじゅうごねん、いわさき たきぞうわ なくなりました。
    se: namida
  - speaker: reimu
    text: 郡上八幡の生家は今、サンプル王の生まれた家として観光客が訪れます。
    reading: ぐじょうはちまんの せいかわ いま、さんぷるおうの うまれた いえと して かんこうきゃくが おとずれます。
- id: ch6_kufu
  title: 職人たちの工夫
  background: sp_koubou
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 瀧三さんの晩年から、職人たちの新しい工夫が続くの。
  - speaker: tsumugi
    emotion: normal
    text: 1964年には、ご飯の新しい作り方で特許を取ったわ。ヒントは、[河原|かわら]の小石よ。
  - speaker: zundamon
    emotion: surprised
    text: 小石が、[お米|おこめ]になったの！？
  - speaker: tsumugi
    emotion: normal
    text: いわさきグループでは1966年から、社内の製作コンクールを毎年開いてるの。
  - speaker: zundamon
    emotion: happy
    text: 職人どうしで、腕くらべだね。
  - speaker: tsumugi
    emotion: normal
    text: 1972年には、愛知の職人がフォークが宙に浮くスパゲティを考え出したの。
  - speaker: zundamon
    emotion: happy
    text: あれ、手品みたいで目が止まるやつだ！
  - speaker: tsumugi
    emotion: normal
    text: 店の反応は最初は薄かったけど、お客さんに受けて売上が伸びたのよ。
  - speaker: zundamon
    emotion: happy
    text: 見本が、手品で客寄せしてるのだ。
  - speaker: tsumugi
    emotion: normal
    text: 1975年にはアメリカに会社を作って、シカゴの博物館の展示用にも納めたわ。
  - speaker: zundamon
    emotion: surprised
    text: 博物館にまで、行ったんだね。
- id: ch6_jushi
  title: ロウから樹脂へ
  background: sp_koubou
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 1970年代から少しずつ、材料はロウから塩化ビニルに変わったの。
  - speaker: zundamon
    emotion: thinking
    text: ロウじゃ、だめだったの？
  - speaker: tsumugi
    emotion: normal
    text: ロウは熱に弱くて、夏の店先で溶けたり色が変わったりしたのよ。
  - speaker: zundamon
    emotion: sad
    text: 夏の店先は、ロウにはサウナなのだ。
    se: shobon
  - speaker: tsumugi
    emotion: normal
    text: ただ、ロウは溶かせばやり直せる。樹脂は、一度固めたらやり直せないの。
  - speaker: zundamon
    emotion: thinking
    text: 樹脂のほうが、一発勝負なんだね。
  - speaker: tsumugi
    emotion: normal
    text: 今は本物の料理からシリコンで型を取って、[塩ビ|えんび]を流して熱で固めるの。
  - speaker: tsumugi
    emotion: normal
    text: 色はスプレーや筆で一つずつ付けて、最後につやを出すのよ。
  - speaker: zundamon
    emotion: thinking
    text: 棚に、部品がぎっしりなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 大阪の工場には、キャベツや麺やむきエビまで約1000種類の部品があるの。
  - speaker: zundamon
    emotion: surprised
    text: 1000種類！？ 八百屋より品ぞろえがいいのだ。
  - speaker: tsumugi
    emotion: normal
    text: '[一皿|ひとさら]は型取りから仕上げまで、原則一人の職人が作るの。'
  - speaker: tsumugi
    emotion: thinking
    text: 一番難しいのは色付けで、[一人前|いちにんまえ]まで何年もかかるわ。
  - speaker: zundamon
    emotion: happy
    text: 手作業なら、同じ料理でも一つずつ顔が違うね。
  - speaker: tsumugi
    emotion: happy
    text: そう。100個作れば、100個とも違うの。
  - speaker: zundamon
    emotion: thinking
    text: 一つ作るのに、どのくらいかかるの？
  - speaker: tsumugi
    emotion: normal
    text: 注文してから届くまで、3週間ほどが目安よ。値段は一品6000円から1万円くらい。
  - speaker: zundamon
    emotion: surprised
    text: オムライス一皿に、3週間！？
  - speaker: tsumugi
    emotion: normal
    text: のり巻きのかんぴょうは、関東と関西で色を変えてるのよ。
  - speaker: zundamon
    emotion: surprised
    text: 土地の味付けの色まで、写してるのだ！
- id: ch6_taiken
  title: お湯に咲くロウの花
  background: sp_zukai2
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: '[郡上八幡|グジョウハチマン]の体験工房では、昔ながらのロウで天ぷらとレタスを作れるの。'
  - speaker: tsumugi
    emotion: normal
    text: 天ぷらの衣は、溶かしたロウをぬるま湯に垂らして作るのよ。
  - speaker: zundamon
    emotion: surprised
    text: '[瀧三|タキゾウ]さんが子どものころに見た、ロウの花なのだ！'
    se: hirameki
  - speaker: tsumugi
    emotion: normal
    text: レタスは、白と緑のロウをお湯に流して沈めながら手でたぐり寄せるの。
  - speaker: tsumugi
    emotion: normal
    text: すると、本物みたいなシワと葉脈ができるわ。
  - speaker: zundamon
    emotion: happy
    text: お湯の中で、野菜が育っていくみたいだね。
  - speaker: zundamon
    emotion: happy
    text: ボクも行って、ロウの天ぷらを揚げてみたいのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 揚げるんじゃなくて、お湯に垂らすのよ。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 今のお店用の天ぷらは、樹脂を振りかけて熱い風を当てて作るの。
- id: ch7_ganso
  title: 元祖は誰か
  background: sp_zukai
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: ネットで見たのだ。食品サンプルを発明したのは、[瀧三|タキゾウ]さんだって。
  - speaker: tsumugi
    emotion: thinking
    text: よくそう書かれるけど、それより前から料理の模型はあったの。
  - speaker: tsumugi
    emotion: normal
    text: 記録で一番古いのは、1917年11月の京都。栄養の指導に使う料理の模型よ。
    telops:
    - {text: 最古の記録は1917年の京都, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 作ったのは、[島津製作所|しまづせいさくしょ]で標本を作っていた[西尾惣次郎|にしおそうじろう]たちなの。
  - speaker: zundamon
    emotion: surprised
    text: 京都が、先なの！？
  - speaker: tsumugi
    emotion: normal
    text: 1923年には、東京の[白木屋|しろきや]百貨店が食堂に見本を並べて食券を売り始めたわ。
  - speaker: tsumugi
    emotion: normal
    text: 見本を作ったのは、人体や生き物の模型を作っていた[須藤勉|すどうつとむ]という職人よ。
  - speaker: zundamon
    emotion: surprised
    text: 人体模型の人が！？
  - speaker: tsumugi
    emotion: normal
    text: 体の模型づくりの腕を、料理に使ったのよ。
  - speaker: tsumugi
    emotion: normal
    text: 見本を見て食券を買うから席が早く空いて、売上は4倍になったの。
  - speaker: zundamon
    emotion: sad
    text: '[瀧三|タキゾウ]さん、3番目だったのだ……。'
    se: chin
  - speaker: tsumugi
    emotion: normal
    text: 記者の[野瀬泰申|のせやすのぶ]さんは3か所で別々に生まれて、起源はおそらく京都だと見ているわ。
  - speaker: tsumugi
    emotion: normal
    text: 3つの始まりの中で、見本づくりを初めから商売にしたのが[瀧三|タキゾウ]さんよ。
  - speaker: zundamon
    emotion: happy
    text: 最初に作った人じゃなくて、商売にして広めた人なんだね。
  - speaker: tsumugi
    emotion: normal
    text: 野瀬さんによると、関西では早くから町の小さな店も見本を置いたの。
  - speaker: zundamon
    emotion: thinking
    text: あと、最初のサンプルはオムライスって聞いたこともあるのだ。
  - speaker: tsumugi
    emotion: normal
    text: そう書いた資料もあるけど、会社の説明ではオムレツよ。
  - speaker: zundamon
    emotion: thinking
    text: 昔の人は字が読めなかったから、サンプルが広まったの？
  - speaker: tsumugi
    emotion: normal
    text: そう言う人もいるけど、根拠は弱いの。
  - speaker: tsumugi
    emotion: normal
    text: 洋食みたいに初めて聞く料理は、名前だけじゃ想像できなかったのよ。
  - speaker: zundamon
    emotion: happy
    text: 字が読めても、オムレツの形は分からないね。
  - speaker: zundamon
    emotion: thinking
    text: ところで、サンプルって本物の料理に樹脂をかぶせてるの？
  - speaker: tsumugi
    emotion: normal
    text: そう思っていた外国の観光客もいるけど、違うわ。本物は型を取るのに使うだけ。
  - speaker: zundamon
    emotion: thinking
    text: サンプルって、日本にしかないの？
  - speaker: tsumugi
    emotion: normal
    text: 韓国では、1988年のソウルオリンピックをきっかけに広まったの。
  - speaker: tsumugi
    emotion: normal
    text: でも店先にメニューとして並べる文化は、日本生まれ。今も日本に一番根付いてるわ。
- id: ch7_ookii
  title: サンプルより小さい？
  background: sp_mise
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: でも来た料理がサンプルより小さかったら、だまされた気がするのだ。
  - speaker: tsumugi
    emotion: normal
    text: 本物よりおいしそうに作るのが、[作り手|つくりて]の目標なの。
  - speaker: tsumugi
    emotion: normal
    text: 店の照明が当たったときに、一番よく見えるように計算してるのよ。
  - speaker: tsumugi
    emotion: normal
    text: 具を少し大きくしたり盛りを高くしたり、大げさに作ることもあるわ。
  - speaker: zundamon
    emotion: surprised
    text: やっぱり、わざとなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 天丼屋さんが、[海老|えび]を1本足したくなる気持ちも分かるでしょ。
    beat: true
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、高いお店ほど豪華なサンプルを置くの？
  - speaker: tsumugi
    emotion: normal
    text: それが逆なの。
  - speaker: tsumugi
    emotion: normal
    text: 2002年の野瀬さんの調べでは、最低1000円以上の店にはサンプルがないの。
  - speaker: zundamon
    emotion: thinking
    text: 高いお店は、見本がなくても入ってもらえるのか。
  - speaker: tsumugi
    emotion: normal
    text: それと、サンプルにも寿命があるの。1年ほどで色があせてくるわ。
  - speaker: zundamon
    emotion: surprised
    text: サンプルにも、賞味期限があるのだ！？
    se: manuke
- id: ch8_gendai
  title: 海を渡ったサンプル
  background: sp_gendai
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: いま国内のシェアは、いわさきグループで7割ほどよ。
    telops:
    - {text: 国内シェア約7割, size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 日本の食品サンプルの約6割は、岐阜県で作られているの。
  - speaker: zundamon
    emotion: happy
    text: 岐阜が、日本のサンプルの里になったのだ！
  - speaker: tsumugi
    emotion: normal
    text: '[郡上|ぐじょう]のサンプル会社の多くは、岩崎模型製造で学んで独立した人たちよ。'
  - speaker: zundamon
    emotion: happy
    text: '[郡上|ぐじょう]じゅう、[瀧三|タキゾウ]さんの弟子だらけなのだ。'
  - speaker: tsumugi
    emotion: normal
    text: 仕事が減った1990年代からは、観光客が作る体験も増えたわ。
  - speaker: tsumugi
    emotion: normal
    text: 2007年ごろには、岩崎模型製造の体験だけで年間1万人以上が来ていたの。
  - speaker: zundamon
    emotion: surprised
    text: 1万人！？ ロウの天ぷらが、毎年1万個揚がるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: だから、揚げないってば。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 東京の合羽橋でも2010年から体験ができて、キーホルダーは外国の観光客に人気よ。
  - speaker: zundamon
    emotion: happy
    text: 食べられないおみやげが、売れてるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: ただ最近は、費用を抑えるためにサンプルを写真に替える店もあるの。
  - speaker: zundamon
    emotion: sad
    text: 写真に、負けたのだ……。
    se: gaan
  - speaker: tsumugi
    emotion: normal
    text: だから今は、医療用の模型や栄養指導の教材にも技術を広げてるの。
  - speaker: zundamon
    emotion: happy
    text: 両手を使って、工夫を続けてるんだね。
  - speaker: tsumugi
    emotion: happy
    text: 2016年9月12日、[瀧三|タキゾウ]さんの誕生日にはグーグルのトップの絵にもなったわ。
  - speaker: tsumugi
    emotion: normal
    text: 2020年には、記念オムを今の職人がロウで作り直したの。
  - speaker: zundamon
    emotion: happy
    text: '[すゞ|すず]さんのシワが、よみがえったのだ。'
  - speaker: tsumugi
    emotion: normal
    text: 2024年からは、ロンドンで食品サンプルの展覧会が開かれたの。
  - speaker: tsumugi
    emotion: normal
    text: 47都道府県の料理を、新しく作って並べたのよ。
  - speaker: zundamon
    emotion: surprised
    text: 宮城のずんだ餅も、ロンドンに行ったのだ！
  - speaker: tsumugi
    emotion: normal
    text: そのあと、ロサンゼルスでも展示されたわ。
  - speaker: tsumugi
    emotion: normal
    text: 2025年には、[瀧三|タキゾウ]さんの息子が作ったクジラの模型が30年ぶりに公開されたの。
  - speaker: zundamon
    emotion: surprised
    text: クジラまで！？
  - speaker: tsumugi
    emotion: normal
    text: 全長16メートルのザトウクジラで、作るのに10年かかったのよ。
  - speaker: tsumugi
    emotion: happy
    text: 3月26日は、さん・ぷ・るの語呂合わせで食品サンプルの日なの。
- id: shime
  title: ''
  background: sp_mise_tenpura
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ！ [郡上|ぐじょう]の体験で、ロウの天ぷらを作ってきたのだ。
  - speaker: tsumugi
    emotion: surprised
    text: あら、本物みたいじゃない。
  - speaker: zundamon
    emotion: happy
    text: これをお店に、本物の10倍で貸すのだ。毎月もうかるのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 天ぷら一個を、どこのお店が借りるのよ。
  - speaker: zundamon
    emotion: thinking
    text: ……じゃあ、毎月の手入れもつけるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 手入れより先に、借りてくれるお店を探しなさい。
  - speaker: zundamon
    emotion: sad
    text: ……じゃあボクが毎晩眺めて、おなかをすかせるのだ。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: お店の前でサンプルを見かけたら、シワや焼き色を近くで見てみてね。
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
