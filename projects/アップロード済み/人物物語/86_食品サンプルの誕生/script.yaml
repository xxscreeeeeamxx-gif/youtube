meta:
  title: 【食品サンプルの誕生】食べられない料理を、本物の10倍で貸した男【ずんだもん解説】
  slug: iwasaki-sample-v2
  summary: 店先に並ぶ、料理の見本。食品サンプルを初めて商売にしたのは、岐阜の郡上八幡に生まれた岩崎瀧三でした。子どものころ水に落ちて花のように開いたロウ、いとこが見せた教材の焼肉の模型、夜中の2時まで割れ続けた試作。そして妻のすゞが焼いた、シワの寄ったオムレツ。売らずに本物の10倍で貸すという売り方は、なぜ食堂に受け入れられたのか。再現ドラマでたどります。
  tags:
  - 食品サンプル
  - 岩崎瀧三
  - 郡上八幡
  - いわさき
  - 合羽橋
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 雑学
  thumbnail:
    top: 10倍で貸した
    bottom: 食品サンプル誕生
  mode: drama
  narrator: reimu
