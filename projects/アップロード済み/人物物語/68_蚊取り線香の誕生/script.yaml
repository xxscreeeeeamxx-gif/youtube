  title: 虫を落とす花
  background: kt_ie
  bgm: curious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 上山英一郎, emotion: normal}
  - {who: tenin, x: 0.56, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tenin
    emotion: happy
    text: 旦那さん。アメリカから、小包です。
  - speaker: zundamon
    emotion: happy
    text: 約束のお礼だ。律儀な人だぞ。
  - speaker: tenin
    emotion: normal
    text: 種の袋が、いくつも入ってます。
  - speaker: zundamon
    emotion: thinking
    text: この袋だけ、書き付けがついてる。
  - speaker: tenin
    emotion: thinking
    text: なんて書いてあるんです。
  - speaker: zundamon
    emotion: surprised
    text: アメリカでは、この花で大もうけした人が多いと。
  - speaker: tenin
    emotion: thinking
    text: 花で大もうけ。旦那さん、それうまい話の手紙じゃ……
  - speaker: zundamon
    emotion: normal
