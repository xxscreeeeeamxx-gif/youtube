scenes:
- id: co_yamashi
  title: ''
  background: kt_nouka
  bgm: mystery
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 上山英一郎, emotion: normal}
  - {who: nouka, x: 0.56, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: thinking}
  cuts:
  - speaker: nouka
    emotion: thinking
    text: タダで種をくれる？ うまい話には、裏があるもんだ。
  - speaker: zundamon
    emotion: normal
    text: 裏なんてありません。花が咲いたら、ボクが買い取ります。
  - speaker: nouka
    emotion: angry
    text: 虫を殺す花なんて、聞いたこともない。
  - speaker: nouka
    emotion: angry
    text: ……あんた、うまい話でだます山師だろう。
    se: don
  - speaker: zundamon
    emotion: sad
    text: ……山師じゃ、ないのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 種をタダで配って、山師呼ばわり。割に合わないわね。
    se: oti
- id: hook
  title: ''
  background: kt_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: その花から生まれたのが、渦巻きの蚊取り線香です。
    reading: その はなから うまれたのが うずまきの かとり せんこうです。
  - speaker: reimu
    text: インドネシアだけで、年40億巻ほど売れると言われます。
    reading: いんどねしあ だけで ねん よんじゅうおくかん ほど うれると いわれます。
  - speaker: zundamon
    emotion: surprised
    text: 40億！？ 山師どころか、大発明なのだ。
  - speaker: tsumugi
    emotion: normal
    text: でも最初は、まっすぐな棒。40分ほどで燃え尽きたの。
  - speaker: tsumugi
    emotion: thinking
    text: それがなんで、あのぐるぐるになったと思う？
  - speaker: zundamon
    emotion: thinking
    text: ……ぐるぐるといえば、ゆうべ蚊に5か所刺されたのだ。
  - speaker: tsumugi
    emotion: surprised
    text: 話の曲がり方がすごいわね。
  - speaker: zundamon
    emotion: happy
    text: 早く効くように、両はしから火をつけたのだ。
  - speaker: tsumugi
    emotion: normal
    text: 2倍速で燃え尽きるだけよ。
  - speaker: zundamon
    emotion: sad
    text: ……夜中の3時に燃え尽きて、そこから刺され放題。
  - speaker: tsumugi
    emotion: happy
    text: 自分で、刺され放題コースを選んだのね。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: 答えは和歌山のミカン農家の男と、その奥さんが持ってるわ。
- id: card1862
  title: ''
  background: kt_card_1862
  cuts:
  - speaker: reimu
    text: 1862年。紀州の有田で、上山英一郎が生まれます。
    reading: せんはっぴゃく ろくじゅうにねん。きしゅうの ありだで うえやま えいいちろうが うまれます。
- id: ch0_arida
  title: ミカンの山の家
  background: kt_mikan
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 和歌山の[有田|ありだ]は、昔からミカンの産地なの。
  - speaker: zundamon
    emotion: surprised
    text: 山が、上から下まで全部ミカンの木なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 急な斜面に石垣を積んで、段々の畑にしてるのよ。
  - speaker: zundamon
    emotion: happy
    text: 日当たりが良くて、ミカンも人もぽかぽかしてそうなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 上山さんの家は、その中でも大きなミカン農家だったの。
  - speaker: zundamon
    emotion: happy
    text: お坊ちゃんか。ボクと同じだ。
  - speaker: tsumugi
    emotion: thinking
    text: ずんだもんの家、畑なんてあったっけ？
  - speaker: zundamon
    emotion: thinking
    text: ……ベランダに、プランターが一つあるのだ。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: 上山さんは、ミカンの人のままでは終わらなかったの。
- id: ch1_juku
  title: 福沢諭吉のもとで
  background: kt_juku
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 上山英一郎, emotion: normal}
  - {who: fukuzawa, x: 0.56, emotion: normal}
