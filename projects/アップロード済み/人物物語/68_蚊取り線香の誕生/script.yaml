  - speaker: reimu
    text: 除虫菊の花には、虫の神経に働く成分が含まれています。
    reading: じょちゅうぎくの はなにわ むしの しんけいに はたらく せいぶんが ふくまれて います。
  - speaker: reimu
    text: 日本で最初に植えた人ではありませんが、栽培を広めたのは上山だと言われています。
    reading: にほんで さいしょに うえた ひとでわ ありませんが、さいばいお ひろめたのわ うえやまだと いわれて います。
