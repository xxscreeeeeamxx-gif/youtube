- id: ch4_nouka
  title: 山師と呼ばれて
  background: kt_nouka
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 上山英一郎, emotion: normal}
  - {who: nouka, x: 0.56, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
