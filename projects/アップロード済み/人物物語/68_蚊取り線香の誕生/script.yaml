  cuts:
  - speaker: tenin
    emotion: normal
    text: 旦那さん。東京から戻られて、体はもう大丈夫ですか。
  - speaker: zundamon
    emotion: happy
    text: だいぶ良くなった。寝てばかりもいられないぞ。
  - speaker: tenin
    emotion: thinking
    text: 寝てる間も、ずっと何か書いてましたよね。
  - speaker: zundamon
    emotion: happy
    text: 計画書だ。
  - speaker: tenin
    emotion: thinking
    text: また何か、始めるんですか。
  - speaker: zundamon
    emotion: happy
    text: ミカンを、船で外国へ売る。
  - speaker: tenin
    emotion: surprised
    text: 病み上がりで、いきなり外国！？
  - speaker: zundamon
    emotion: happy
    text: 外国の人も、食べたらきっと気に入るのだ。
  - speaker: tsumugi
    emotion: happy
    text: 寝てる間に、計画だけは元気になってたのね。
    se: oti
  - speaker: reimu
    text: 1885年、ミカンを外国へ売るための店を始めました。
    reading: せんはっぴゃく はちじゅうごねん みかんお がいこくえ うる ための みせお はじめました。
  - speaker: tenin
    emotion: surprised
    text: 旦那さん、東京から手紙です。福沢先生からですよ。
  - speaker: zundamon
    emotion: surprised
    text: 先生から？
  - speaker: zundamon
    emotion: normal
    text: ……アメリカから、ミカンの苗を探しに来る人がいる。面倒を見てほしい、と。
  - speaker: tenin
    emotion: surprised
    text: アメリカの人が、わざわざ。
  - speaker: zundamon
    emotion: happy
    text: 東京まで、迎えに行くぞ。
  - speaker: tenin
    emotion: thinking
    text: 和歌山から、東京まで迎えに？
  - speaker: zundamon
    emotion: happy
    text: 先生の頼みなら、どこへでも行くのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 和歌山から東京まで、大移動ね。
- id: ch2_amoa
  title: ミカンの苗のお返し
  background: kt_mikan
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 上山英一郎, emotion: happy}
  - {who: amoa, x: 0.56, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 手紙に書かれていた客は、アメリカで苗や種を扱う商人でした。
