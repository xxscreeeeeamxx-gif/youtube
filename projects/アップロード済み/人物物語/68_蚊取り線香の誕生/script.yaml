  - speaker: zundamon
    emotion: normal
    text: なら型はやめて、手で巻こう。
  - speaker: shokunin
    emotion: surprised
    text: 手で、一本ずつですか！？
  - speaker: zundamon
    emotion: normal
    text: 太めの線香を切って、木の芯のまわりに巻きつけるんだ。
  - speaker: shokunin
    emotion: thinking
    text: 腕が、つりそうです。
  - speaker: shokunin
    emotion: thinking
    text: 一本ずつだと、遅くて間に合いません。
  - speaker: zundamon
    emotion: thinking
    text: なら、二本を[並べて|ならべて]巻く。
  - speaker: shokunin
    emotion: surprised
    text: 二本いっぺんに！？
  - speaker: zundamon
    emotion: happy
    text: 二つの渦が組み合わさって、手間が半分になるぞ。
  - speaker: yuki
    emotion: normal
