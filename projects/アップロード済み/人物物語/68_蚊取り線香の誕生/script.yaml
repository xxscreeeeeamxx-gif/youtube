  - speaker: shokunin
    emotion: happy
    text: 下からも風が[通って|とおって]、早く乾きますね。
  - speaker: zundamon
    emotion: happy
    text: 台所の網が、工場の道具になったのだ。
  - speaker: yuki
    emotion: happy
