meta:
  title: 【蚊取り線香の誕生】「山師」と呼ばれた男が、金鳥の渦巻きを作るまで【ずんだもん解説】
  slug: mosquito-coil-v2
  summary: 夏の夜の、あの渦巻き。上山英一郎が最初に作った蚊取り線香は、まっすぐな棒でした。一晩使うには、夜中に何度も起きて火をつけ直すしかありません。始まりは、和歌山のミカン農家の男のもとに、アメリカから届いた小さな種の袋。種を配って歩けば山師と呼ばれ、線香にすれば折れる。答えは、意外にも家の中から出てきました。
  tags:
  - 蚊取り線香
  - 上山英一郎
  - 除虫菊
  - 渦巻き
  - 夏
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 和歌山
  thumbnail:
    top: 渦巻きの理由
    bottom: 蚊取り線香の誕生
  mode: drama
  narrator: reimu
  mobs:
  - id: fukuzawa
    label: 福沢諭吉
