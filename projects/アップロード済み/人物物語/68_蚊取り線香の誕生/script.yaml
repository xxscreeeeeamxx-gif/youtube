  - speaker: zundamon
    emotion: happy
    text: この種を、畑の隅に植えてもらえませんか。お代は要りません。
  - speaker: nouka
    emotion: thinking
    text: タダで、種をくれる？
  - speaker: zundamon
    emotion: normal
    text: 花が咲いたら、ボクが買い取ります。
  - speaker: nouka
    emotion: thinking
    text: うまい話には、裏があるもんだ。
  - speaker: zundamon
    emotion: surprised
    text: 裏なんて、ありません。
  - speaker: nouka
    emotion: angry
    text: 虫を殺す花なんて、聞いたこともない。
  - speaker: nouka
    emotion: angry
    text: ……あんた、うまい話でだます山師だろう。
    se: don
  - speaker: zundamon
    emotion: sad
    text: ……山師じゃ、ないのだ。
  - speaker: nouka
    emotion: angry
    text: 山師は、みんなそう言うんだ。
  - speaker: zundamon
    emotion: sad
    text: ……じゃあ、何と言えば。
  - speaker: tsumugi
    emotion: thinking
    text: 何を言っても怪しまれる、詰み状態ね。
  - speaker: zundamon
    emotion: normal
    text: 育て方を書いた本も、置いていきます。これもタダです。
  - speaker: nouka
    emotion: surprised
    text: ……本まで、タダか。
  - speaker: tsumugi
    emotion: thinking
    text: タダを重ねるほど、怪しさが増していくわ。
