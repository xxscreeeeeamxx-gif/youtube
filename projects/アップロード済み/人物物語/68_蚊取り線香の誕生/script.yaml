    text: 10代の終わりに上京し、慶應義塾で福沢諭吉に学びます。
    reading: じゅうだいの おわりに じょうきょうし けいおう ぎじゅくで ふくざわ ゆきちに まなびます。
  - speaker: fukuzawa
    emotion: normal
    text: 上山くん。君の家は、ミカンを作っているそうだね。
  - speaker: zundamon
    emotion: happy
    text: はい、先生。[有田|ありだ]のミカンは、甘さならどこにも負けません。
  - speaker: fukuzawa
    emotion: happy
    text: 自慢の仕方が、もう商売人だね。
  - speaker: zundamon
    emotion: happy
    text: 今度、[一箱|ひとハコ]お持ちします。
  - speaker: fukuzawa
    emotion: surprised
    text: 箱で来るのかね。
  - speaker: zundamon
    emotion: happy
    text: 一番甘いのを、選んでまいります。
  - speaker: tsumugi
    emotion: happy
    text: 元・一万円札の人に、ミカンを売り込んでるわ。
    se: oti
  - speaker: fukuzawa
    emotion: normal
    text: 学んだことは、家の仕事でこそ生かしたまえ。
  - speaker: zundamon
    emotion: normal
    text: ……はい。
  - speaker: reimu
    text: 1884年の暮れ、病気のため故郷へ戻ります。
    reading: せんはっぴゃく はちじゅうよねんの くれ びょうきの ため こきょうえ もどります。
- id: ch1_kikyo
  title: ''
  background: kt_ie
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 上山英一郎, emotion: normal}
  - {who: tenin, x: 0.56, emotion: normal}
