    telops:
    - {text: 虫を殺す花・除虫菊, size: lg, position: top-right, color: "#FFFFFF", stroke: "#1E3A1E", glow: "#6BD36B", anim: up}
  - speaker: tenin
    emotion: thinking
    text: 見た目は、ただの小さな[種|たね]ですけど。
  - speaker: zundamon
    emotion: happy
    text: 植えてみれば、分かる。
  - speaker: tenin
    emotion: happy
    text: 花で大もうけなら、ミカンより楽ですね。
  - speaker: zundamon
    emotion: normal
    text: 楽かどうかは、咲いてからだ。
  - speaker: tsumugi
    emotion: thinking
    text: 怪しいと言った本人が、一番乗り気ね。
