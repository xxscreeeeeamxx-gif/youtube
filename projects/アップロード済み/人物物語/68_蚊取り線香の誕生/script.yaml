  - speaker: tsumugi
    emotion: thinking
    text: 山師の汚名が、大損と引き換えに消えたわ。
- id: ch11_kura
  title: ''
  background: kt_ie
  bgm: serious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 上山英一郎, emotion: thinking}
  - {who: tenin, x: 0.56, emotion: sad}
  - {who: tsumugi, x: 0.8, emotion: thinking}
  cuts:
  - speaker: tenin
    emotion: sad
    text: 旦那さん。花の代金で、お[金|かね]が底をつきかけてます。
  - speaker: zundamon
    emotion: thinking
    text: ……分かってる。
  - speaker: tenin
    emotion: thinking
    text: 今年だけは、相場で買っても誰も文句は言いませんよ。
  - speaker: zundamon
    emotion: normal
    text: 一度破れば、二度と信じてもらえない。
  - speaker: tenin
    emotion: sad
    text: 店が先に倒れたら、来年もありません。
  - speaker: zundamon
    emotion: sad
    text: ……それでも、約束は約束だ。
  - speaker: tsumugi
    emotion: thinking
    text: 正しさとお[金|かね]の残りが、真っ向勝負してるわ。
  - speaker: reimu
    text: 上山はこのとき、契約どおりの値で買い続けて、店がつぶれかけたと伝えられています。
    reading: うえやまわ この とき けいやく どおりの ねで かいつづけて、みせが つぶれかけたと つたえられて います。
- id: ch11_senso
  title: ''
  background: kt_hatake
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 上山英一郎, emotion: normal}
  - {who: nouka, x: 0.56, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 翌年、日露戦争が始まると、戦地の兵士に除虫菊の粉を送ります。
    reading: よくねん にちろ せんそうが はじまると せんちの へいしに じょちゅうぎくの こなお おくります。
  - speaker: reimu
    text: それをきっかけに、軍から大量の注文が入ったとされます。
    reading: それお きっかけに ぐんから たいりょうの ちゅうもんが はいったと されます。
  - speaker: nouka
    emotion: surprised
    text: 上山さん。軍から、大きな注文が来たそうだな。
  - speaker: zundamon
    emotion: happy
    text: 約束を守っておいて、よかった。花は、全部買い取りますよ。
  - speaker: nouka
    emotion: happy
    text: 来年も、植えるよ。
  - speaker: tsumugi
    emotion: happy
    text: 損して[得|とく]取れ、を地で行ったわ。
- id: card1910
  title: ''
  background: kt_card_1910
  cuts:
  - speaker: reimu
    text: 1910年。金鳥の商標が登録されます。
    reading: せんきゅうひゃく じゅうねん。きんちょうの しょうひょうが とうろく されます。
- id: ch12_kincho
  title: 鶏の頭と牛のしっぽ
  background: kt_mise
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 上山英一郎, emotion: happy}
  - {who: tenin, x: 0.56, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 名前に、[金|きん]の鶏を入れるぞ。
  - speaker: tenin
    emotion: thinking
    text: 旦那さん。どうして、鶏なんです。
  - speaker: zundamon
    emotion: normal
    text: 昔の中国の言葉だ。鶏口となるも、牛後となるなかれ。
  - speaker: tenin
    emotion: thinking
    text: けいこう……。
  - speaker: zundamon
    emotion: normal
    text: 大きな牛のしっぽより、小さくても鶏の頭でいろという意味だ。
  - speaker: tenin
    emotion: thinking
    text: 牛のしっぽに、何か恨みでも？
  - speaker: zundamon
    emotion: normal
    text: 恨みはない。たとえ話だ。
  - speaker: tenin
    emotion: surprised
    text: うちは、小さな鶏の頭ですか。
  - speaker: zundamon
    emotion: happy
    text: 小さいけど、先頭を走るのだ。
  - speaker: zundamon
    emotion: happy
    text: いつか、鶏の頭が牛より大きくなるかもしれないぞ。
  - speaker: tenin
    emotion: thinking
    text: それはもう、鶏じゃないですね。
    se: oti
  - speaker: tsumugi
    emotion: happy
    text: 走り出しはタダ配り、ゴールは[金|きん]の鶏ね。
  - speaker: reimu
    text: 同じ1910年、除虫菊を広めた働きで、国から藍綬褒章を受けています。
    reading: おなじ せんきゅうひゃく じゅうねん、じょちゅうぎくお ひろめた はたらきで くにから らんじゅ ほうしょうお うけて います。
- id: ch12_bannen
  title: ''
  background: kt_ie
  bgm: amacha_milkyway
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上山英一郎, emotion: happy}
  - {who: tenin, x: 0.7, emotion: happy}
  cuts:
  - speaker: tenin
    emotion: happy
    text: 旦那さん、いよいよ会社ですね。
  - speaker: zundamon
    emotion: happy
    text: 除虫菊の粉を作る会社だ。
  - speaker: tenin
    emotion: happy
    text: 種を配って歩いたころが、うそみたいです。
  - speaker: zundamon
    emotion: happy
    text: 山師と言われたのが、懐かしいのだ。
  - speaker: zundamon
    emotion: happy
    text: 種を植えてくれた農家さんにも、見せたいな。
  - speaker: reimu
    text: 1919年に会社を作り、のちに大日本除虫菊とします。
    reading: せんきゅうひゃく じゅうきゅうねんに かいしゃお つくり のちに だいにほん じょちゅうぎくと します。
  - speaker: reimu
    text: 1930年、社長の座を長男に譲りました。
    reading: せんきゅうひゃく さんじゅうねん しゃちょうの ざお ちょうなんに ゆずりました。
  - speaker: reimu
    text: 1943年、上山英一郎は81歳で亡くなりました。
    reading: せんきゅうひゃく よんじゅうさんねん うえやま えいいちろうわ はちじゅういっさいで なくなりました。
- id: ch13_sanchi
  title: 日本中に咲いた花
  background: kt_hatake
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 上山さんが種を配った除虫菊は、[日本中|にほんじゅう]に広がったの。
  - speaker: tsumugi
    emotion: normal
    text: 1925年には北海道の石狩だけで、全国の畑の7割近くを占めたそうよ。
  - speaker: zundamon
    emotion: surprised
    text: 北海道が！？ 和歌山は！？
  - speaker: tsumugi
    emotion: thinking
    text: 7割よ。ほぼ北海道の花ね。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: 1935年ごろが、生産が一番多かったの。
  - speaker: tsumugi
    emotion: normal
    text: 戦後は瀬戸内の因島が、一面の白い花で有名になったわ。
  - speaker: zundamon
    emotion: happy
    text: 見てみたいのだ。
- id: ch13_shikumi
  title: 燃やさずに温める
  background: kt_uzu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: つむぎ。蚊取り線香って、燃えた煙で蚊を落とすのだ？
  - speaker: tsumugi
    emotion: normal
    text: 実は燃えているところからは、成分は出ないの。
  - speaker: zundamon
    emotion: surprised
    text: 燃えてないところから！？
  - speaker: tsumugi
    emotion: normal
    text: 火のついた先は、700度から800度もあるの。
  - speaker: zundamon
    emotion: surprised
    text: 800度！？
  - speaker: tsumugi
    emotion: normal
    text: その少し手前の250度くらいに温まったところから、成分が出て煙に乗るのよ。
  - speaker: zundamon
    emotion: thinking
    text: 燃える前に、温められて飛び出すのか。
  - speaker: tsumugi
    emotion: normal
    text: 火は、少しずつ前に進むヒーターみたいなものね。
  - speaker: tsumugi
    emotion: normal
    text: 燃やすんじゃなく、温めて追い出すの。
  - speaker: zundamon
    emotion: thinking
    text: 火の手前が、本番なのか。
  - speaker: zundamon
    emotion: happy
    text: じゃあ、ずっと温めるだけにすれば燃やさなくていいのだ！
  - speaker: tsumugi
    emotion: surprised
    text: ……それ、もう電気の蚊取りとして売ってるわ。
  - speaker: zundamon
    emotion: sad
    text: 先を越されてたのだ。
    se: oti
  - speaker: zundamon
    emotion: thinking
    text: ボクの両はし作戦は、火のつく場所を2つにしただけなのだ。
  - speaker: tsumugi
    emotion: normal
    text: そう。だから、半分の時間で燃え尽きたのよ。
  - speaker: reimu
    text: 今の標準の渦巻きは、伸ばすとおよそ75センチ。およそ7時間かけて燃えます。
    reading: いまの ひょうじゅんの うずまきわ のばすと およそ ななじゅうごせんち。およそ ななじかん かけて もえます。
    telops:
    - {text: 約75センチ・約7時間, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 1時間に、だいたい10センチずつ進む計算ね。
  - speaker: zundamon
    emotion: surprised
    text: ボクの歩く速さより、ずっと遅いのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 比べる相手が、おかしいのよ。
    se: oti
  - speaker: zundamon
    emotion: surprised
    text: 箱を開けると、2つの渦が組み合わさってる。
  - speaker: tsumugi
    emotion: normal
    text: 手で巻いていたころの、二本[並べて|ならべて]巻くやり方の名残よ。
  - speaker: zundamon
    emotion: happy
    text: それ、ボクが考えたやつだぞ。
  - speaker: tsumugi
    emotion: thinking
    text: 演じただけでしょ。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: 2つ[一組|ひとくみ]だと折れにくいし、かさも半分で運ぶのも安く済むの。
  - speaker: zundamon
    emotion: happy
    text: 最初から、よくできてたんだな。
  - speaker: tsumugi
    emotion: normal
    text: 中身も変わったわ。今は、除虫菊の成分に似せて人が作った成分が中心なの。
  - speaker: zundamon
    emotion: sad
    text: 花じゃなくなったのか。
  - speaker: tsumugi
    emotion: normal
    text: 1949年にアメリカで作られて、日本でも作られるようになったのよ。
  - speaker: zundamon
    emotion: thinking
    text: そっくりさんに、主役交代か。
  - speaker: tsumugi
    emotion: normal
    text: 花の成分は置き換わって、日本の畑はほとんど無くなったの。
  - speaker: zundamon
    emotion: sad
    text: さみしいのだ。
  - speaker: tsumugi
    emotion: normal
    text: いま除虫菊の花を作っている主な国は、ケニアやオーストラリアよ。
  - speaker: zundamon
    emotion: surprised
    text: 花だけ、海外に引っ越したのか。
  - speaker: tsumugi
    emotion: normal
    text: 形のほうも、変わったところがあるの。
  - speaker: tsumugi
    emotion: normal
    text: 1957年から、[KINCHO|きんちょう]の渦巻きは左巻きなの。
  - speaker: zundamon
    emotion: surprised
    text: 左巻き！？ 何か、わけがあるのか？
  - speaker: tsumugi
    emotion: normal
    text: 打ち抜く機械を新しくしたときに、左巻きに変わったと会社は説明してるわ。
  - speaker: tsumugi
    emotion: thinking
    text: なぜ左なのかまでは、はっきり書かれていないの。
  - speaker: zundamon
    emotion: happy
    text: 今夜、うちのも確かめるぞ。
- id: ch14_ronsou
  title: 煙は体に悪い？
  background: kt_shiryo
  bgm: mystery
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。ネットで見たのだ。蚊取り線香の煙は、体にすごく悪いって。
  - speaker: tsumugi
    emotion: normal
    text: よく言われるわね。
  - speaker: tsumugi
    emotion: normal
    text: 実は、研究によって結論が分かれてるの。
  - speaker: zundamon
    emotion: surprised
    text: 分かれてる？
  - speaker: tsumugi
    emotion: normal
    text: 外国の製品を調べて、細かい粒がたくさん出るとした研究があるわ。
  - speaker: tsumugi
    emotion: normal
    text: 一方で、健康への悪い影響とまでは言えないという研究もあるの。
  - speaker: zundamon
    emotion: thinking
    text: 白黒つかないのか。
  - speaker: zundamon
    emotion: thinking
    text: 日本の製品は、どうなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 業界の団体は、閉め切ると目やのどがしみることはあると説明してる。
  - speaker: tsumugi
    emotion: normal
    text: そのうえで、体には特に問題はないという立場よ。
  - speaker: zundamon
    emotion: surprised
    text: しみるのに、問題なし？
  - speaker: tsumugi
    emotion: normal
    text: 東京都の研究センターは、使う時間を短くして使ったあとはよく換気するよう勧めてるわ。
  - speaker: zundamon
    emotion: thinking
    text: 結局、どう使えばいい？
  - speaker: tsumugi
    emotion: normal
    text: メーカーの説明だと、窓を少し開けて風上に置くこと。
  - speaker: zundamon
    emotion: happy
    text: なら3つ同時につけて、窓は全開にするのだ！
  - speaker: tsumugi
    emotion: thinking
    text: それ、蚊を招き入れながら煙だけ出してるわ。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: 人のほかに、気をつけたいのが生き物のほう。
  - speaker: zundamon
    emotion: surprised
    text: 人じゃない？
  - speaker: tsumugi
    emotion: normal
    text: この成分は、昆虫や魚にはとても強く効くの。
  - speaker: zundamon
    emotion: surprised
    text: 蚊だけ狙い撃ちじゃないのか。
  - speaker: tsumugi
    emotion: normal
    text: カブトムシや金魚やトカゲを飼ってる部屋では、使わないこと。
  - speaker: tsumugi
    emotion: normal
    text: メーカーも、そう書いてるわ。
  - speaker: zundamon
    emotion: surprised
    text: ボクの部屋の金魚、危なかったのだ！
  - speaker: tsumugi
    emotion: normal
    text: 金魚は、今夜から別の部屋へ。
  - speaker: zundamon
    emotion: thinking
    text: ボクには平気なのに、金魚には効くのだ？
  - speaker: tsumugi
    emotion: normal
    text: 人の体は、この成分を早く分解できると言われてるの。
  - speaker: tsumugi
    emotion: normal
    text: 虫や魚は、それが苦手とされてるわ。
  - speaker: zundamon
    emotion: sad
    text: 金魚、ごめんなのだ。
- id: ch15_gendai
  title: 世界の夜を守る渦
  background: kt_ima
  bgm: amacha_milkyway
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 渦巻きは今、アジアやアフリカや南米でも使われてるの。
  - speaker: zundamon
    emotion: surprised
    text: 世界中か。
  - speaker: tsumugi
    emotion: normal
    text: インドネシアだけで、1年で40億巻ほどらしいわ。
  - speaker: zundamon
    emotion: happy
    text: ボクも作って売ったら、大金持ちなのだ。
  - speaker: tsumugi
    emotion: thinking
    text: まず金魚の引っ越しが先ね。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: 蚊が病気を運ぶ地域では、夜を守る道具なの。
  - speaker: zundamon
    emotion: thinking
    text: 日本では、電気の蚊取りも増えたのだ。
  - speaker: tsumugi
    emotion: normal
    text: 1963年に電気で温めるタイプ、そのあと液体のタイプやスプレーも出てきたわ。
  - speaker: zundamon
    emotion: sad
    text: ボクの思いつき、60年以上遅かったのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 60年前に生まれてから[言って|いって]。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: 渦巻きも、大きいのは12時間で小さいのは3時間ほどの種類があるの。
  - speaker: zundamon
    emotion: happy
    text: 寝る時間で、選べるのだ。
  - speaker: tsumugi
    emotion: normal
    text: 電気のが増えても、渦巻きは今もたくさん売れてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 2013年には、国の未来技術遺産にも選ばれたの。
  - speaker: zundamon
    emotion: surprised
    text: 山師の渦巻きが、遺産入り！
  - speaker: tsumugi
    emotion: normal
    text: 発売から120年以上、渦巻きは今も現役なの。
  - speaker: zundamon
    emotion: thinking
    text: ブタの入れ物も、昔から？
  - speaker: tsumugi
    emotion: normal
    text: 東京の新宿で、幕末から明治のはじめのものが見つかってるわ。
  - speaker: zundamon
    emotion: thinking
    text: ブタ、江戸っ子なのか？
  - speaker: tsumugi
    emotion: thinking
    text: ただ、どこで生まれたのかはいくつも説があるの。
  - speaker: zundamon
    emotion: thinking
    text: ブタの正体は、なぞのままか。
- id: shime
  title: ''
  background: kt_ima
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。今夜は、片はしだけに火をつけるのだ。
  - speaker: tsumugi
    emotion: happy
    text: えらいわね。
  - speaker: tsumugi
    emotion: normal
    text: 窓を少し開けて、風上にね。
  - speaker: zundamon
    emotion: happy
    text: 金魚は、別の部屋に引っ越したのだ。
  - speaker: tsumugi
    emotion: normal
    text: 渦の一周一周が、7年かけて見つけた答えなのよ。
  - speaker: zundamon
    emotion: thinking
    text: 棒のままだったら、今も夜中に起きて替えてたな。
  - speaker: tsumugi
    emotion: normal
    text: 長いまま、小さく。台所の網で、乾かして。
  - speaker: zundamon
    emotion: happy
    text: 答えは、家の中にあったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 今夜火をつけるときは、外側の端っこを見てみて。
  - speaker: zundamon
    emotion: happy
    text: 外の端は……2つあるのだ。両方つけるぞ。
  - speaker: tsumugi
    emotion: surprised
    text: 2つくっついたまま、つけないの！ まず外して、1つずつ使うのよ。
    se: oti
    pause_after: 0.45
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴ありがとうございました！
    duet_with: tsumugi
