  - speaker: zundamon
    emotion: happy
    text: ようこそ、[有田|ありだ]へ。
  - speaker: amoa
    emotion: thinking
    text: 東京から、ずいぶん遠かったです。
  - speaker: zundamon
    emotion: happy
    text: ミカンの山まで、あと少しです。
  - speaker: amoa
    emotion: surprised
    text: これは、すばらしい。山一面が、ミカンの木ですね。
  - speaker: zundamon
    emotion: happy
    text: 気に入った苗は、持っていってください。
  - speaker: amoa
    emotion: surprised
    text: いいのですか。お代は。
  - speaker: zundamon
    emotion: happy
    text: 先生のご紹介です。お代は要りません。
  - speaker: amoa
    emotion: happy
    text: では国に帰ったら、必ずお礼をします。
  - speaker: zundamon
    emotion: happy
    text: ついでに、竹とシュロと菊の苗もつけます。
  - speaker: amoa
    emotion: thinking
    text: 荷物が、増える一方ですね。
  - speaker: zundamon
    emotion: happy
    text: 船は大きいから、大丈夫です。
  - speaker: amoa
    emotion: thinking
    text: ……船より先に、私の腕が限界です。
    se: oti
  - speaker: tsumugi
    emotion: thinking
    text: お土産の量が、もう引っ越しね。
  - speaker: reimu
    text: 東京まで迎えに行き、有田のミカン山を案内して、いくつもの苗を贈ったと伝えられています。
    reading: とうきょうまで むかえに いき ありだの みかんやまお あんないして、いくつもの なえお おくったと つたえられて います。
- id: card1886
  title: ''
  background: kt_card_1886
  cuts:
  - speaker: reimu
    text: 1886年。アメリカから、お礼の種が届きます。
    reading: せんはっぴゃく はちじゅうろくねん。あめりかから おれいの たねが とどきます。
