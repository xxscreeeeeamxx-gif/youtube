scenes:
# ---- 先出し（2007年6月13日の会見。朝日の一問一答） ----
- id: co_kaiken
  title: ''
  background: nv_kaiken
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 猿橋望, emotion: sad}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2007年6月。業務の一部停止を命じられた英会話教室NOVAの社長、猿橋望の会見です。
    reading: にせん ななねん ろくがつ。ぎょうむの いちぶ ていしお めいじられた えいかいわ きょうしつ のばの しゃちょう、さはし のぞむの かいけんです。
  - speaker: zundamon
    emotion: sad
    text: 極めて厳粛に受け止めている。利用者に深くおわびしたい。
  - speaker: kisha
    emotion: normal
    text: 辞任する考えは。
  - speaker: zundamon
    emotion: thinking
    text: 現時点ではない。
  - speaker: kisha
    emotion: normal
    text: 業績への影響は。
  - speaker: zundamon
    emotion: normal
    text: 経営そのものに与える影響は軽微だ。
    telops:
    - {text: "猿橋「経営そのものに与える影響は軽微だ」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: reimu
    text: この4か月後、彼は自分の会社の取締役会で社長を外されます。
    reading: この よんかげつご、かれわ じぶんの かいしゃの とりしまりやくかいで しゃちょうお はずされます。
  - speaker: reimu
    text: 受講生約30万人が前払いした受講料は、ほとんど戻りませんでした。
    reading: じゅこうせい やく さんじゅうまんにんが まえばらい した じゅこうりょうわ、ほとんど もどりませんでした。
# ---- 今の部屋（回数券のまとめ買い） ----
- id: hook
  title: ''
  background: nv_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ 習い事の回数券、100回分まとめ買いしたのだ！
    se: jaan
  - speaker: zundamon
    emotion: happy
    text: 1回あたり、なんと半額！
  - speaker: tsumugi
    emotion: thinking
    text: 途中でやめたら、いくら戻るか知ってる？
  - speaker: zundamon
    emotion: surprised
    text: ……え？
  - speaker: tsumugi
    emotion: normal
    text: まとめ買いで安くして、ピークで48万人を集めた英会話学校があったの。
  - speaker: tsumugi
    emotion: thinking
    text: 駅前留学のNOVA。創業者は自分の会社を追われ、社員の積立金で実刑になったわ。
    telops:
    - {text: "受講生48万人 → 創業者は実刑", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 48万人も集めた社長が、なんで会社を追われたの！？
# ---- 2005年・1000教室 ----
- id: card2005
  title: ''
  background: nv_card_2005
  bgm: pop
  cuts:
  - speaker: reimu
    text: 2005年。NOVAは前の年の暮れからの1年半で、300を超える教室を開きます。
    reading: にせん ごねん。のばわ まえの としの くれからの いちねんはんで さんびゃくお こえる きょうしつお ひらきます。
- id: ch1_1000
  title: 1000教室
  background: nv_kaigi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 猿橋望, emotion: happy}
  - {who: shain, x: 0.7, emotion: happy}
  cuts:
  - speaker: shain
    emotion: happy
    text: 社長、来月の出店候補です。駅前のビルばかりですよ。
  - speaker: zundamon
    emotion: happy
    text: 出店を進めてくれ。
  - speaker: shain
    emotion: happy
    text: はい！ 受講生も48万人。1000教室まで、あと少しです！
    se: levelup
  - speaker: reimu
    text: スローガンは、1000教室達成。教室は4年で約500から994へ、ほぼ倍になります。
    reading: すろーがんわ、せん きょうしつ たっせい。きょうしつわ よねんで やく ごひゃくから きゅうひゃく きゅうじゅうよんえ ほぼ ばいに なります。
  - speaker: shain
    emotion: happy
    text: 前払いの受講料が入れば、新しい教室の家賃も払えますしね。
  - speaker: reimu
    text: ところが講師は2年で、約5900人から約5000人に減っていました。
    reading: ところが こうしわ にねんで、やく ごせん きゅうひゃくにんから やく ごせんにんに へって いました。
    telops:
    - {text: "教室は倍、講師は減る", size: lg, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: 猿橋が自分の会社を追われるのは、この2年後です。
    reading: さはしが じぶんの かいしゃお おわれるのわ、この にねんごです。
# ---- 受付（まとめ買いの値段） ----
- id: ch2_kanyu
  title: まとめ買いの値段
  background: nv_lobby
  stage:
  - {who: jukosei, x: 0.28, flip: true, emotion: normal}
  - {who: uketsuke, x: 0.7, emotion: happy}
  cuts:
  - speaker: uketsuke
    emotion: happy
    text: 600ポイントまとめてなら、40分のレッスンが1回1540円です。
  - speaker: uketsuke
    emotion: normal
    text: 100ポイントなら1回2640円。まとめ買いがお得なんです。
  - speaker: jukosei
    emotion: surprised
    text: 1回で、1000円以上も違うのか。
  - speaker: uketsuke
    emotion: happy
    text: 600ポイントで92万4000円。3年のうちに使ってください。
  - speaker: jukosei
    emotion: surprised
    text: きゅ、92万……！
    beat: true
  - speaker: uketsuke
    emotion: happy
    text: あなたが空いている時間に朝でも昼でも予約が取れます。
  - speaker: jukosei
    emotion: happy
    text: じゃあ、600ポイントで！
- id: ch2_yoyaku
  title: ''
  background: nv_lobby
  stage:
  - {who: jukosei, x: 0.28, flip: true, emotion: normal}
  - {who: uketsuke, x: 0.7, emotion: normal}
  cuts:
  - speaker: jukosei
    emotion: normal
    text: 来週の夜、予約をお願いします。
  - speaker: uketsuke
    emotion: normal
    text: その日は予約がいっぱいです。
    background: nv_lobby_ippai
  - speaker: jukosei
    emotion: surprised
    text: じゃあ、その次の週は。
  - speaker: uketsuke
    emotion: normal
    text: ちょっとの間は全然空いていません。
  - speaker: jukosei
    emotion: angry
    text: 朝でも昼でも取れるって、言いましたよね！？
    se: tsukkomi
  - speaker: jukosei
    emotion: angry
    text: もういいです。130回は使ったし、やめます。
# ---- 途中でやめると ----
- id: ch2_seisan
  title: 途中でやめると
  background: nv_lobby_ippai
  stage:
  - {who: jukosei, x: 0.28, flip: true, emotion: angry}
  - {who: uketsuke, x: 0.7, emotion: normal}
  cuts:
  - speaker: uketsuke
    emotion: thinking
    text: これから講師の人数を増やす予定だから、なんとか続けませんか。
  - speaker: jukosei
    emotion: angry
    text: 今さら！？
  - speaker: uketsuke
    emotion: normal
    text: では精算します。使った130回は、1回2640円で計算しますね。
  - speaker: jukosei
    emotion: surprised
    text: 1540円で買ったのに！？
  - speaker: uketsuke
    emotion: normal
    text: 使った回数以下で一番近い、100ポイントコースの単価です。
  - speaker: uketsuke
    emotion: normal
    text: ここに書いてあるでしょう。サインもしましたよね。
  - speaker: jukosei
    emotion: thinking
    text: ……字が小さすぎて、読んでないです。
    beat: true
  - speaker: reimu
    text: 買ったときの単価より、返金は14万3000円少なくなります。1回あたり1100円の上乗せです。
    reading: かった ときの たんかより、へんきんわ じゅうよんまん さんぜんえん すくなく なります。いっかい あたり せん ひゃくえんの うわのせです。
    telops:
    - {text: "やめると14万3000円少なく返る", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: jukosei
    emotion: angry
    text: 回数券を安く買ったのに、やめたら1回ずつの値段で引かれるの！？
  - speaker: jukosei
    emotion: sad
    text: ……やめるのにも、お[金|かね]がかかるのか。
    beat: true
  - speaker: reimu
    text: NOVAはこの決まりを最高裁まで争い、負けます。猿橋が社長を追われる、半年あまり前のことです。
    reading: のばわ この きまりお さいこうさいまで あらそい、まけます。さはしが しゃちょうお おわれる はんとし あまり まえの ことです。
# ---- 2006年・初めての赤字 ----
- id: ch3_akaji
  title: 初めての赤字
  background: nv_kaigi
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 猿橋望, emotion: thinking}
  - {who: shain, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
    text: 1981年、欧州留学から帰った30歳の猿橋が、大阪の心斎橋に開いた1号教室。
    reading: せんきゅうひゃく はちじゅういちねん。おうしゅう りゅうがくから かえった さんじゅっさいの さはしが おおさかの しんさいばしに ひらいた いちごう きょうしつ。
  - speaker: reimu
    text: 1993年からは駅前留学のテレビCMで名前が広まり、1996年に株式を公開します。
    reading: せんきゅうひゃく きゅうじゅうさんねんからわ えきまえ りゅうがくの てれび しーえむで なまえが ひろまり、せんきゅうひゃく きゅうじゅうろくねんに かぶしきお こうかい します。
  - speaker: shain
    emotion: sad
    text: 社長、決算です。上場してから初めての、最終赤字です。
    background: nv_kaigi_akaji
    se: gaan
  - speaker: shain
    emotion: sad
    text: 赤字は、約30億円。
  - speaker: shain
    emotion: thinking
    text: 次の年度は、80を超える教室を閉めることになりそうです。
  - speaker: reimu
    text: 48万人を集めた会社が、ここからつぶれるまで、1年半ほどでした。
    reading: よんじゅうはちまんにんお あつめた かいしゃが ここから つぶれるまで、いちねんはん ほどでした。
# ---- 2007年2月・立入検査 ----
- id: card2007
  title: ''
  background: nv_card_2007
  cuts:
  - speaker: reimu
    text: 2007年2月14日。経済産業省と東京都が、NOVAの本部と一部の教室に立入検査に入ります。
    reading: にせん ななねん にがつ じゅうよっか。けいざい さんぎょうしょうと とうきょうとが のばの ほんぶと いちぶの きょうしつに たちいり けんさに はいります。
- id: ch4_kensa
  title: 立入検査
  background: nv_kaigi
  stage:
  - {who: koho, x: 0.6, emotion: normal}
  cuts:
  - speaker: koho
    emotion: normal
    text: 過去にも経産省と話し合いをした上で特商法上、問題がないとの見解を得ている。
  - speaker: koho
    emotion: normal
    text: 予約は事前に入れてもらえばきちんと取れる。
    beat: true
  - speaker: reimu
    text: 精算をめぐる裁判では、判断が出た6件すべてでNOVAの計算が退けられていました。
    reading: せいさんお めぐる さいばんでわ、はんだんが でた ろっけん すべてで のばの けいさんが しりぞけられて いました。
  - speaker: reimu
    text: 東京都も2002年に、ほぼ同じ種類の違反でNOVAを指導していました。
    reading: とうきょうとも にせん にねんに、ほぼ おなじ しゅるいの いはんで のばお しどう して いました。
# ---- 2007年4月3日・最高裁 ----
- id: ch5_saikosai
  title: 最高裁
  background: nv_saikosai
  bgm: serious
  stage:
  - {who: saibancho, x: 0.6, emotion: normal}
  cuts:
  - speaker: reimu
    text: 4月3日の最高裁。600ポイントを約75万円で買い、386回使って解約した男性の裁判です。
    reading: しがつ みっかの さいこうさい。ろっぴゃく ぽいんとお やく ななじゅうごまんえんで かい、さんびゃく はちじゅうろっかい つかって かいやく した だんせいの さいばんです。
  - speaker: saibancho
    emotion: normal
    text: '[使用済み|しようずみ]ポイントの対価額は契約時単価で算定するのが自然。'
  - speaker: saibancho
    emotion: normal
    text: 契約解除があった場合にのみ適用される高額の対価額を定めており、
  - speaker: saibancho
    emotion: normal
    text: 受講者による自由な解除権の行使を制約するものといわざるを得ない。
    se: don
    telops:
    - {text: "最高裁「自由な解除権の行使を制約」", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: 精算の決まりは、特定商取引法に反して無効。約31万円の返還が確定します。
    reading: せいさんの きまりわ、とくてい しょうとりひきほうに はんして むこう。やく さんじゅういちまんえんの へんかんが かくてい します。
# ---- のちの取材で（3月と5月） ----
- id: ch6_250oku
  title: 250億円
  background: nv_jimusho
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 猿橋望, emotion: thinking}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: ここからは、猿橋がのちに雑誌の取材で語った話です。
    reading: ここからわ、さはしが のちに ざっしの しゅざいで かたった はなしです。
  - speaker: kisha
    emotion: normal
    text: 事業への影響はどれくらいありましたか。
  - speaker: zundamon
    emotion: thinking
    text: そもそも3月というのは、年間の売り上げ[3分の1|さんぶんのいち]を占めるんです。
  - speaker: zundamon
    emotion: sad
    text: ところが、報道のせいで入学者数がまったく伸びず、
  - speaker: zundamon
    emotion: sad
    text: '[2～5月|2から5月]のキャッシュフローのロスが例年に比べ約120億円にふくらみました。'
  - speaker: kisha
    emotion: normal
    text: 2月の立ち入り検査が、事業停止につながるということは予想していましたか。
  - speaker: zundamon
    emotion: thinking
    text: 入学者の落ち込みは5月には落ち着きつつあったのですが、
  - speaker: zundamon
    emotion: thinking
    text: 5月の上旬ごろから、経済産業省から変なことを言われ始めたんです。
  - speaker: reimu
    text: 自由に選べる予約制とあるが、選べないときもある。誇大広告では、と言われたそうです。
    reading: じゆうに えらべる よやくせいと あるが、えらべない ときも ある。こだい こうこくでわ、と いわれたそうです。
  - speaker: zundamon
    emotion: normal
    text: でも、いつでも自由に受けられるなら予約はいらない。予約制ってそういうことですよね。
  - speaker: reimu
    text: 6か月の業務停止になったらどうなるのか。そうも聞かれたといいます。
    reading: ろっかげつの ぎょうむ ていしに なったら どう なるのか。そうも きかれたと いいます。
  - speaker: zundamon
    emotion: surprised
    text: そんなことされたら、ウチは飛んじゃいます。
  - speaker: reimu
    text: 経産省の側は決算書の前受金を指し、ここに250億円もあるじゃないかと言ったそうです。
    reading: けいさんしょうの がわわ けっさんしょの まえうけきんお さし、ここに にひゃく ごじゅうおくえんも あるじゃないかと いったそうです。
  - speaker: reimu
    text: 前受金は、受け取った受講料のうち、帳簿でまだ売上にしていない分です。
    reading: まえうけきんわ、うけとった じゅこうりょうの うち ちょうぼで まだ うりあげに して いない ぶんです。
  - speaker: zundamon
    emotion: thinking
    text: あくまで会計上の金額であって、キャッシュがあるわけじゃありません。
  - speaker: zundamon
