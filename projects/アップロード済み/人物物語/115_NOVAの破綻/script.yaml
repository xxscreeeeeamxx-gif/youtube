meta:
  title: 「経営そのものに与える影響は軽微だ」駅前留学NOVAの社長、4か月後に自分の会社を追われる【ずんだもん解説】
  slug: nova-saruhashi
  hook_line: 駅前留学で48万人を集めたNOVAの社長は、なぜ会社を追われたのか。
  summary: 2007年6月、英会話教室NOVAの社長、猿橋望は記者会見で頭を下げました。「駅前留学」で受講生48万人を集め、1000教室を掲げた会社の受付では、何が起きていたのか。まとめ買いで安くなるポイントと、途中でやめたときの精算の決まり、最高裁の判決、国の処分、そして社員の積立金。裁判所の判断と本人の言い分、会社の説明を主語つきで並べて、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 消費者庁「特定商取引法ガイド 特定継続的役務提供」 https://www.no-trouble.caa.go.jp/what/continuousservices/
  - 帝国データバンク 倒産速報「株式会社ノヴァ」（2007年10月26日） https://www.tdb.co.jp/report/bankruptcy/flash/2465/
  - 日本経済新聞「NOVA元社長に2審も実刑　一審破棄し懲役2年」（2010年12月2日） https://www.nikkei.com/article/DGXNASDG0200X_S0A201C1CC0000/
  - 日本経済新聞「NOVA元社長の実刑確定へ　最高裁が上告棄却」（2012年11月21日） https://www.nikkei.com/article/DGXNASDG2103L_R21C12A1CC1000/
  - NOVAホールディングス News Release（2025年2月20日） https://www.nova.co.jp/pdf/media/20250227_nova_info_1.pdf
