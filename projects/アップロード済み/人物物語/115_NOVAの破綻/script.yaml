  - speaker: tsumugi
    emotion: normal
    text: '[保全管理人|ホゼンカンリニン]の弁護士は、こう言ったの。'
  - speaker: tsumugi
    emotion: normal
    text: 経産省も含めて数々の行政指導があり、経営悪化の原因になったが、
  - speaker: tsumugi
    emotion: thinking
    text: 根本はNOVAの経営体制が悪かった。
  - speaker: zundamon
    emotion: thinking
    text: 両方、なのか。
  - speaker: tsumugi
    emotion: normal
    text: 2014年には元受講生の裁判で、大阪高裁が[猿橋|サハシ]についてこう判断したわ。
  - speaker: tsumugi
    emotion: thinking
    text: 解約を急増させる事態を招き、旧NOVAを経営破綻させた責任がある。
  - speaker: tsumugi
    emotion: normal
    text: '[猿橋|サハシ]は弁護士を通じて、こんな談話を出したの。'
  - speaker: tsumugi
    emotion: normal
    text: 明らかに法律的に間違った判決なので、上告審でひっくり返ると思います。
  - speaker: zundamon
    emotion: thinking
    text: 国の処分か、会社のやり方か……。
  - speaker: tsumugi
    emotion: normal
    text: 引き金は国の処分。でも引き金を引かせたのは、何年も前から言われてたやり方なの。
    beat: true
# ---- 本当の注意点 ----
- id: chui
  title: 前払いの本当の注意点
  background: nv_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。ずんだもんの回数券、[何|なん]の習い事？
  - speaker: zundamon
    emotion: happy
    text: 英会話なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: ……よりによって。
    se: zukko
  - speaker: tsumugi
    emotion: normal
    text: 語学教室は、2か月を超えて5万円を超える契約なら、
  - speaker: tsumugi
    emotion: normal
    text: '[特定商取引法|トクテイショウトリヒキホウ]の決まりがあるの。'
  - speaker: tsumugi
    emotion: normal
    text: 途中でやめても、取られるのは使った[分|ぶん]と、
  - speaker: tsumugi
    emotion: normal
    text: 5万円か残りの2割の、安いほうまで。
  - speaker: zundamon
    emotion: surprised
    text: 上限があるのか！
  - speaker: tsumugi
    emotion: normal
    text: 使った分も、いまは買ったときの単価で数えるのが原則よ。
  - speaker: zundamon
    emotion: happy
    text: じゃあ、1回ずつの値段で引かれないのだ！
  - speaker: tsumugi
    emotion: normal
    text: クーリング・オフは、書面を受け取った日から8日以内。
  - speaker: tsumugi
    emotion: thinking
    text: NOVAは、名前と住所を書いただけの日から数えていたのを違反と認定されたわ。
  - speaker: tsumugi
    emotion: thinking
    text: それより大事なのは、前払いは会社がつぶれると後回しになること。
  - speaker: zundamon
    emotion: surprised
    text: 後回し！？
  - speaker: tsumugi
    emotion: normal
    text: 税金や給料が先で、NOVAの受講生にはほとんど戻らなかったの。
  - speaker: tsumugi
    emotion: thinking
    text: 約560億円。1人あたり、平均でおよそ19万円よ。
    telops:
    - {text: "戻らなかった前払い 約560億円", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 19万円……！
  - speaker: tsumugi
    emotion: normal
    text: まとめて払うほど、相手がつぶれたときに失う額も大きくなるの。
# ---- 今の駅前留学 ----
- id: ima
  title: いまの駅前留学
  background: nv_gendai
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: でもNOVAって、いまも駅前にあるよね？
  - speaker: tsumugi
    emotion: normal
    text: いまの駅前留学NOVAは、名前と教室を引き継いだ別の会社なの。
  - speaker: tsumugi
    emotion: normal
    text: 引き継いだのは、名古屋の学習塾から始まった会社。破綻の翌月のことよ。
  - speaker: zundamon
    emotion: surprised
    text: 塾の会社が！？
  - speaker: tsumugi
    emotion: normal
    text: 600の教室を、全部閉めた状態で引き継いだそうよ。
  - speaker: zundamon
    emotion: surprised
    text: ゼロからの、やり直しなのだ。
    se: hirameki
  - speaker: tsumugi
    emotion: normal
    text: 旧NOVAで受けられなかった分は、新しいレッスン料の半分に充てられるようにしたの。
  - speaker: tsumugi
    emotion: normal
    text: 2025年12月で、駅前留学NOVAは全国302校。
  - speaker: tsumugi
    emotion: normal
    text: 3年分などをまとめて預かる仕組みから、月謝制を中心に変えたと説明してるわ。
  - speaker: zundamon
    emotion: happy
    text: 回数券から、月謝に！
  - speaker: tsumugi
    emotion: thinking
    text: そして2025年にも、同じ受付をもう一度してたの。
  - speaker: zundamon
    emotion: surprised
    text: 18年たっても……！
  - speaker: tsumugi
    emotion: thinking
    text: 使い切れなかった前払いの話は、まだ続いてるのね。
