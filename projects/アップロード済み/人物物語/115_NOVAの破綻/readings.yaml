# nova-saruhashi 読み台帳（人名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている（猿橋＝さはし、心斎橋＝しんさいばし、前受金＝まえうけきん）。
# 名札（tag: 猿橋望 / label: 保全管理人ほか）・テロップ・章タイトルは表示専用なのでタグを付けていない。
# 猿橋 はタグなしだと VOICEVOX が サルハシ と読む。タグはカタカナで [猿橋|サハシ] にした（さはし の「は」を助詞にしないため）。
# 保全管理人 はタグなしだと ホゼンカンリジン になる。ひらがなのタグは ホゼンカンリニ/ンワ と割れたので、カタカナで [保全管理人|ホゼンカンリニン]。
# 特定商取引法 はタグなしでも正しく読むが、台帳に載せたのでカタカナのタグを付けた（ひらがなのタグは区切りが割れた）。
# 3分の1 はタグなしだと サンプンノイチ。一審 はタグなしだと イチシン。
# 前受金 はひらがなのタグだと マエエケ/キン と崩れたので、セリフでは使わずナレだけにした。
# 心斎橋・猿橋望・前受金・中途解約 はナレ（reading:）と名札・タグ（meta）にしか出ない。中途解約は台本の本文では使っていない。
# NOVA・社友会・経産省・特商法・店舗網・業務上横領 はタグなしで正しく読んだ（audio_query で確認）ので台帳に入れていない。
# 何の は [何|なん]、使った分と は [分|ぶん] を本文に付けた（文脈で読みが変わるため台帳には入れない）。
