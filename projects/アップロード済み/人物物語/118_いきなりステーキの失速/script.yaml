scenes:
# ---- 先出し（2019年12月・直筆の貼り紙）。嘲らない：笑いのSE・ツッコミ・「？」の表情を入れない ----
- id: co_harigami
  title: ''
  background: ik_mise_harigami
  bgm: serious
  cuts:
  - speaker: reimu
    text: 2019年12月。ステーキ店「いきなり!ステーキ」の店先に、社長が手で書いた紙が貼られました。
    reading: にせん じゅうくねん じゅうにがつ。すてーきてん いきなり すてーきの みせさきに、しゃちょうが てで かいた かみが はられました。
- id: co_yoru
  title: ''
  background: ik_shacho_yoru
  stage:
  - {who: zundamon, x: 0.5, tag: 一瀬邦夫, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: しかし、お客様のご来店が減少しております。
  - speaker: zundamon
    emotion: sad
    text: このままではお近くの店を閉めることになります。
- id: co_studio
  title: ''
  background: ik_jimusho
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 一瀬邦夫, emotion: normal}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: kisha
    emotion: normal
    text: 社長、貼り紙の反響の大きさについては。
  - speaker: zundamon
    emotion: normal
    text: 普通の社長ならしない。
  - speaker: zundamon
    emotion: normal
    text: 一瀬社長は非常識の塊だって、僕は[誉め言葉|ほめことば]だとずっと思ってきた。
  - speaker: reimu
    text: このとき店は国内に488。3年後には半分以下になり、この人は、自分の会社を去ります。
    reading: この とき みせわ こくないに よんひゃく はちじゅうはち。さんねんごにわ はんぶん いかに なり、この ひとわ じぶんの かいしゃお さります。
# ---- 今の部屋（量り売りのナッツ） ----
- id: hook
  title: ''
  background: ik_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 量り売りのナッツ、好きなだけすくってきたのだ！
  - speaker: zundamon
    emotion: surprised
    text: ……2400円！？
    se: gaan
  - speaker: tsumugi
    emotion: thinking
    text: 1グラムの値段、見なかったの？
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 1グラム5円で、行列を作ったステーキ屋があるの。
  - speaker: tsumugi
    emotion: thinking
    text: その店は6年で約490店になって、3年で半分以下になったのよ。
    telops:
    - {text: "1500円の行列店は なぜ3年で半分以下に", size: md, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 行列ができたのに、なんで半分以下に！？
# ---- 2013年12月5日・銀座の1号店 ----
- id: card2013
  title: ''
  background: ik_card_2013
  bgm: honwaka_puppu
  cuts:
  - speaker: reimu
    text: 2013年12月5日、東京・銀座。71歳の社長が、立ち食いのステーキ店を開きます。
    reading: にせん じゅうさんねん じゅうにがつ いつか、とうきょう ぎんざ。ななじゅう いっさいの しゃちょうが たちぐいの すてーきてんお ひらきます。
- id: ch1_ginza
  title: 1グラム5円の立ち食い
  background: ik_tenpo
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 一瀬邦夫, emotion: happy}
  - {who: senpai, x: 0.56, emotion: normal}
  - {who: shinjin, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: '[いきなり!ステーキ|いきなりステーキ]のロゴの中心には、ロケットを入れた。'
  - speaker: zundamon
    emotion: happy
    text: ロケットには、いままでのビジネスを突き破る意味を込めた。
  - speaker: zundamon
    emotion: normal
    text: この店は客席回転率の向上で、損益分岐点を下げていく。
  - speaker: reimu
    text: 3000円のステーキが、半額の1500円。椅子なし、前菜なし、20分で帰る。
    reading: さんぜんえんの すてーきが はんがくの せん ごひゃくえん。いすなし ぜんさいなし、にじゅっぷんで かえる。
    telops:
    - {text: "3000円のステーキが 半額の1500円", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: shinjin
    emotion: surprised
    text: 先輩、半額で儲かるんですか。
  - speaker: senpai
    emotion: normal
    text: 売上の7割が肉の値段だ。業界の常識を打ち破る数字だよ。
  - speaker: shinjin
    emotion: surprised
    text: 残りの3割で、家賃もお給料もですか！？
  - speaker: senpai
    emotion: normal
    text: だから回転で稼ぐ。椅子がないから、客は早く帰る。
  - speaker: senpai
    emotion: happy
    text: 45人ほど入る店に、1日300人。それが目標だ。
  - speaker: shinjin
    emotion: surprised
    text: 300人……。
    beat: true
- id: ch1_gyoretsu
  title: ''
  background: ik_mise
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 一瀬邦夫, emotion: happy}
  - {who: kyaku, x: 0.7, emotion: normal}
  cuts:
  - speaker: kyaku
    emotion: normal
    text: ステーキを、立って食べるの？
  - speaker: kyaku
    emotion: surprised
    text: ……なのに、この行列！？
    background: ik_mise_gyoretsu
  - speaker: kyaku
    emotion: normal
    text: 私、200グラムでいい。
  - speaker: zundamon
    emotion: happy
    text: ダメです。300グラムからです！
  - speaker: kyaku
    emotion: surprised
    text: ……300グラムから！？
    se: bikkuri
  - speaker: reimu
    text: 行列の店の社長は、なぜ6年後、店を閉めることになると書いたのか。
    reading: ぎょうれつの みせの しゃちょうわ、なぜ ろくねんご みせお しめる ことに なると かいたのか。
# ---- 出せば1日100万円 ----
- id: ch1_dasu
  title: 出せば1日100万円
  background: ik_shacho
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 一瀬邦夫, emotion: happy}
  - {who: fudosan, x: 0.56, emotion: happy}
  - {who: ginko, x: 0.8, emotion: happy}
  cuts:
  - speaker: fudosan
    emotion: happy
    text: 社長、駅前にいい物件が空きました！
  - speaker: ginko
    emotion: happy
    text: ご融資は、当行にお任せください。
  - speaker: reimu
    text: 店が増え続けた2018年ごろを、本人は2021年にこう振り返っています。
    reading: みせが ふえつづけた にせん じゅうはちねん ごろお、ほんにんわ にせん にじゅういちねんに こう ふりかえって います。
  - speaker: zundamon
    emotion: normal
    text: 当時は、[新店|しんてん]を出せば1日100万円の売り上げがあった。
  - speaker: zundamon
    emotion: normal
    text: だからこそ業者は物件をどんどん斡旋してくれたし、銀行融資も存分に受けられた。
  - speaker: reimu
    text: でもこの仕組みは、客が減ると一気に崩れます。肉の値段が、売上の7割だからです。
    reading: でも この しくみわ、きゃくが へると いっきに くずれます。にくの ねだんが うりあげの ななわり だからです。
# ---- 1961年ごろ・新人コック（年号カードで時を戻すのはここだけ） ----
- id: card1961
  title: ''
  background: ik_card_1961
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1961年ごろ、東京の洋食店。のちの社長は、高校を出たばかりの新人コックでした。
    reading: せんきゅうひゃく ろくじゅういちねん ごろ、とうきょうの ようしょくてん。のちの しゃちょうわ こうこうお でたばかりの しんじん こっくでした。
- id: ch2_chubo
  title: 1か月の給料のステーキ
  background: ik_chubo
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 一瀬邦夫, scale: 0.85, emotion: normal}
  - {who: senpai, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 初日、先輩にビーフステーキを頼みます。本人がのちに話した思い出です。
    reading: しょにち、せんぱいに びーふすてーきお たのみます。ほんにんが のちに はなした おもいでです。
  - speaker: senpai
    emotion: normal
    text: ……ポークソテーにしなよ。
  - speaker: zundamon
    emotion: sad
    text: ……はい。
    se: shobon
  - speaker: zundamon
    emotion: normal
    text: ビーフステーキは僕の1カ月の給料と同じ、3000円だったんですよ。
  - speaker: reimu
    text: そのあと赤坂の山王ホテルで9年。アメリカ人の客に、分厚いステーキを焼きました。
    reading: その あと あかさかの さんのう ほてるで きゅうねん。あめりかじんの きゃくに、ぶあつい すてーきお やきました。
- id: card1970
  title: ''
  background: ik_card_1970
  cuts:
  - speaker: reimu
    text: 1970年、東京・墨田区。27歳で、6坪の洋食店キッチンくにを開きます。
    reading: せんきゅうひゃく ななじゅうねん、とうきょう すみだく。にじゅうななさいで ろくつぼの ようしょくてん きっちん くにお ひらきます。
- id: ch2_yoshoku
  title: ''
  background: ik_yoshoku
  stage:
  - {who: zundamon, x: 0.5, tag: 一瀬邦夫, scale: 0.92, emotion: happy}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: いらっしゃいませ！
  - speaker: reimu
    text: 1994年、51歳でペッパーランチを始めます。1号店が当たると、1年で10の店を出しました。
    reading: せんきゅうひゃく きゅうじゅうよねん ごじゅういっさいで ぺっぱーらんちお はじめます。いちごうてんが あたると いちねんで じゅうの みせお だしました。
  - speaker: reimu
    text: 結果は全店が大赤字だった、と本人は話しています。会社は持ち直し、2006年に上場します。
    reading: けっかわ ぜんてんが おおあかじだったと ほんにんわ はなして います。かいしゃわ もちなおし にせん ろくねんに じょうじょう します。
  - speaker: reimu
    text: これが、あとで効きます。出しすぎた店が赤字になると知っていた人が、なぜ490店まで出したのか。
    reading: これが あとで ききます。だしすぎた みせが あかじに なると しって いた ひとが、なぜ よんひゃく きゅうじゅってんまで だしたのか。
# ---- 2017年2月・ニューヨーク ----
- id: card2017
  title: ''
  background: ik_card_2017
  bgm: curious
  cuts:
  - speaker: reimu
    text: 2017年2月、ニューヨーク。いきなり!ステーキが、海の向こうに1号店を出します。
    reading: にせん じゅうななねん にがつ、にゅーよーく。いきなり すてーきが うみの むこうに いちごうてんお だします。
- id: ch3_ny
  title: ステーキの本場へ
  background: ik_ny
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 一瀬邦夫, emotion: happy}
  - {who: kisha, x: 0.56, emotion: normal}
  - {who: beikoku, x: 0.8, emotion: normal}
  cuts:
  - speaker: kisha
    emotion: normal
    text: 社長、アメリカではどう売るんですか。
  - speaker: zundamon
    emotion: happy
    text: 高級牛肉を割安にスピード提供する。
  - speaker: zundamon
    emotion: happy
    text: フランチャイズチェーンも視野に入れ、全米で加速度的に展開していければ。
  - speaker: zundamon
    emotion: normal
    text: おいしいものを短時間で食べたいという欲求は、先進国で共通の現象。
  - speaker: beikoku
    emotion: normal
    text: ……やはり、座って食べたい。
    beat: true
  - speaker: reimu
    text: アメリカの店はこのあと11まで増えます。本人はのちに、マンハッタンは2店で十分だった、と振り返ります。
    reading: あめりかの みせわ この あと じゅういちまで ふえます。ほんにんわ のちに まんはったんわ にてんで じゅうぶんだったと ふりかえります。
# ---- 来年は200店舗 ----
- id: ch3_party
  title: 来年は200店舗
  background: ik_party
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 一瀬邦夫, emotion: happy}
  - {who: kyaku, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 会社が東証1部に上がった年。あるパーティーの壇上です。
    reading: かいしゃが とうしょう いちぶに あがった とし。ある ぱーてぃーの だんじょうです。
  - speaker: zundamon
    emotion: happy
    text: 来年は200店舗、出店します！
    se: don
    telops:
    - {text: "一瀬「来年は200店舗、出店します！」", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: kyaku
    emotion: surprised
    text: 200！？ 1年で！？
  - speaker: kyaku
    emotion: thinking
    text: ……大丈夫？
  - speaker: reimu
    text: この年の暮れ、本人は銀座の行列を振り返って、こう話しています。
    reading: この としの くれ、ほんにんわ ぎんざの ぎょうれつお ふりかえって こう はなして います。
  - speaker: zundamon
    emotion: happy
    text: 僕は母に、コックになるんだったら日本で5本の指に入るんだよと言われてた。
  - speaker: zundamon
    emotion: happy
    text: それに匹敵することは達成できたかな、と思うと格別にうれしいんですよね。
  - speaker: reimu
    text: のちの2024年には、店を増やすこと自体が目標になってしまった、と振り返ります。
    reading: のちの にせん にじゅうよねんにわ、みせお ふやす こと じたいが もくひょうに なって しまったと ふりかえります。
  - speaker: reimu
    text: 出せば売れる店を、なぜ誰も止めなかったのか。
    reading: だせば うれる みせお、なぜ だれも とめなかったのか。
# ---- 2018年・1日5店舗 ----
- id: ch3_pin
  title: 1日5店舗
  background: ik_shacho
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 一瀬邦夫, emotion: happy}
  - {who: shain, x: 0.7, emotion: happy}
  cuts:
  - speaker: shain
    emotion: happy
    text: 社長、2018年は宣言どおり200店のペースです！
  - speaker: shain
    emotion: happy
    text: 今日は1日で、5店舗が開店です！
  - speaker: shain
    emotion: happy
    text: 9月にはアメリカのナスダックに上場。日本の外食で初めてです！
  - speaker: shain
    emotion: happy
    text: 24時間で1734食。ギネス世界記録にもなりました！
  - speaker: shain
    emotion: happy
    text: そして11月、47都道府県のすべてに店ができました！
    background: ik_shacho_pin
    se: levelup
  - speaker: reimu
    text: でもこの年の4月から、前からある店の売上は、もう前の年を下回り始めていました。
    reading: でも この としの しがつから、まえから ある みせの うりあげわ もう まえの としお したまわり はじめて いました。
# ---- 2019年・同じ駅に4店 ----
- id: card2019
  title: ''
  background: ik_card_2019
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 2019年。会社はこの年も、210の店を出す計画を立てます。増えた店は、何を食い合っていたのか。
    reading: にせん じゅうくねん。かいしゃわ この としも にひゃく じゅうの みせお だす けいかくお たてます。ふえた みせわ、なにお くいあって いたのか。
- id: ch4_hoshin
  title: ''
