meta:
  title: いきなり!ステーキの社長「お近くの店を閉めることになります」、3年で店は半分以下に【ずんだもん解説】
  slug: ikinari-steak
  hook_line: 行列のできた1500円のステーキ屋は、なぜ3年で半分以下になったのか。
  summary: 2013年12月、71歳の社長が東京・銀座に開いた立ち食いのステーキ店に、行列ができました。1グラム5円、300グラムから。売上の7割が肉の値段という店は、客の回転で稼ぎ、出せば売れるまま全国へ広がります。その社長が2019年12月、店先に直筆の紙を貼りました。店はなぜ増えすぎ、なぜ誰も止めなかったのか。創業者・一瀬邦夫と長男の公の言葉を主語つきで並べ、再現ドラマでたどります。（2026年11月時点）
  sources:
  - ペッパーフードサービス「沿革」 https://www.pepper-fs.co.jp/corpinfo/history.php
  - ペッパーフードサービス「2019年12月期 決算短信〔日本基準〕（連結）」（2020年2月14日） https://www.pepper-fs.co.jp/_img/ir/lib/2020/PFS20200214A.pdf
  - ペッパーフードサービス「2020年12月期 第２四半期決算短信〔日本基準〕（連結）」（2020年7月31日） https://www.pepper-fs.co.jp/_img/ir/lib/2020/PFS20200731_6.pdf
  - J-CASTニュース「いきなり！ステーキ「お客様のご来店が減少しております」　社長直筆の「お願い」全店掲出へ」（2019年12月10日） https://www.j-cast.com/2019/12/10374778.html?p=all
  - 東洋経済オンライン「低迷の｢いきなり!ステーキ｣､社長が語った悔恨」（2021年5月12日） https://toyokeizai.net/articles/-/426978
  - デイリー新潮「「いきなり！ステーキ」を手放した一瀬邦夫氏（81）が両国に和牛ステーキ店を開店　本人が自ら厨房に立つ理由」（2024年1月30日） https://www.dailyshincho.jp/article/2024/01301101/
