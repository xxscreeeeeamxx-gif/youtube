    emotion: happy
    text: 日によってはインバウンドが9割を占めることもある。
  - speaker: kisha
    emotion: normal
    text: お店は、また増やすんですか。
  - speaker: zundamon
    emotion: normal
    text: 自分の店を持ちたいという従業員がいれば与えます。
  - speaker: zundamon
    emotion: normal
    text: でも、[いきなり!ステーキ|いきなりステーキ]の時のようなあんなバカなマネはできませんよ。
  - speaker: kisha
    emotion: normal
    text: '[いきなり!ステーキ|いきなりステーキ]は、まだ立ち直れていないと報じられていますが。'
  - speaker: zundamon
    emotion: normal
    text: まだ1年しか経っていないからね。
  - speaker: zundamon
    emotion: normal
    text: 息子たちも頑張っていますし、自分は会社を離れた身ですから
  - speaker: zundamon
    emotion: normal
    text: それについて言うことはありません。
- id: ch10_heiten
  title: ''
  background: ik_ryogoku
  bgm: 223am
  stage:
  - {who: kyaku, x: 0.7, emotion: normal}
  cuts:
  - speaker: kyaku
    emotion: normal
