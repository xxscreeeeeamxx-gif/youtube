# ---- 2019年11月・44店を閉める ----
- id: ch4_44
  title: 止まったら終わり
  background: ik_kaigi
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 一瀬邦夫, emotion: sad}
  - {who: shain, x: 0.7, emotion: sad}
  cuts:
  - speaker: shain
    emotion: sad
    text: 10月の既存店の売上は、前の年より41.4%減です。
  - speaker: shain
    emotion: sad
    text: 出店の計画は、210から115に減らします。
  - speaker: reimu
    text: 11月14日、44の店を閉めると発表。同じころの取材で、店を広げたい経営者に向けてこう話しています。
    reading: じゅういちがつ じゅうよっか、よんじゅうよんの みせお しめると はっぴょう。おなじ ころの しゅざいで、みせお ひろげたい けいえいしゃに むけて こう はなして います。
  - speaker: zundamon
    emotion: normal
    text: 企業はコマと同じで、止まったら終わりです。
  - speaker: zundamon
    emotion: sad
    text: いたずらに店を増やしても、お客様がリピートしてくれないと意味がありません。
