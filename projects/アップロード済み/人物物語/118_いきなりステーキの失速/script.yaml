  - speaker: kyaku
    emotion: sad
    text: あれ……閉まってる。
    background: ik_ryogoku_heiten
    se: shobon
  - speaker: reimu
    text: 2025年8月20日、この店も閉じました。告知は、2年に満たない営業への感謝で結ばれています。
    reading: にせん にじゅうごねん はちがつ はつか、この みせも とじました。こくちわ にねんに みたない えいぎょうえの かんしゃで むすばれて います。
# ---- 論争 ----
- id: ronso1
  title: 出しすぎたから？
  background: ik_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ 店を出しすぎたから、つぶれかけたって！
  - speaker: tsumugi
    emotion: normal
    text: まず、会社はいまも続いてるわ。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 本人もペッパーランチを85億円で売れて、会社はなんとか持ちこたえたと話してる。
  - speaker: tsumugi
    emotion: normal
    text: でも、出しすぎたのは本当よ。2018年は1年で約200店。
  - speaker: tsumugi
    emotion: normal
    text: 会社も店どうしの競合を理由に挙げてる。本人も、出し過ぎちゃったと話してるわ。
  - speaker: tsumugi
    emotion: normal
    text: 外食の調査をする人も2024年に、店舗を出し過ぎたことに尽きると話してるわ。
  - speaker: zundamon
    emotion: happy
    text: やっぱり出しすぎなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: ただ本人は2021年に、ペッパーランチを売った理由を聞かれてこうも言ってるの。
  - speaker: tsumugi
    emotion: normal
    text: 店を出し過ぎたことで駄目になったのではなくて、商売の仕方が間違っていたんだと思う。
  - speaker: zundamon
    emotion: surprised
    text: 商売の仕方？
  - speaker: tsumugi
    emotion: normal
    text: 客が減ると、採算のために値上げした。値上げすると、さらに客が遠のく。
  - speaker: tsumugi
    emotion: normal
    text: 5月の取材で本人はそれを悪循環と呼び、顧客優先から利益優先になったと話してるわ。
  - speaker: tsumugi
    emotion: normal
    text: 看板のワイルドステーキの硬い部分も、本人が原因の半分と言ったわね。
  - speaker: zundamon
    emotion: thinking
    text: 出しすぎた、だけじゃなかったのか……。
- id: ronso2
  title: 貼り紙で客が離れた？
  background: ik_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: じゃあ、あの貼り紙で客が離れたのだ！
  - speaker: tsumugi
    emotion: normal
    text: 本人も2枚目の紙で、厳しいご意見を多数頂いたと書いてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 2019年の東洋経済のコラムは、自画自賛や上から目線という見方を書いたわ。
  - speaker: tsumugi
    emotion: thinking
    text: でも前からある店の売上が、前の年を割り始めたのは2018年の4月。
  - speaker: tsumugi
    emotion: normal
    text: 貼り紙の1年8か月前よ。10月の41.4%減も、貼り紙の前なの。
  - speaker: zundamon
    emotion: surprised
    text: 貼り紙より、ずっと前から！？
    se: bikkuri
  - speaker: tsumugi
    emotion: normal
    text: 貼り紙は、落ち始めて1年半以上たってから打った手のひとつだったの。
  - speaker: tsumugi
    emotion: normal
    text: 会社は翌年の計画に、社長の筆書きのメッセージを正式に入れてるわ。
  - speaker: zundamon
    emotion: sad
    text: 先に落ちてたのか……。
# ---- 本当の注意点 ----
- id: chui
  title: 1グラムの値段を見る
  background: ik_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 量り売りは、1グラムの値段といちばん少ない量を見ること。
  - speaker: tsumugi
    emotion: normal
    text: 本人も話してる。1グラム1円の値上げでも、300グラムなら300円になる。
  - speaker: zundamon
    emotion: surprised
    text: ……ボクのナッツ、1グラム[何|なん]円だったっけ。
  - speaker: tsumugi
    emotion: thinking
    text: レシートに書いてあるわよ。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: もう一つ。ポイントや前払いの特典は、変わることも終わることもあるの。
  - speaker: tsumugi
    emotion: normal
    text: 食べた肉の量でランクが上がる肉マイレージは、特典が改められたことがあるの。
  - speaker: tsumugi
    emotion: normal
    text: 前払いの肉マイレージマネーも、2021年12月に終わったわ。
  - speaker: tsumugi
    emotion: thinking
    text: 長男も2023年に、常連様の気持ちを裏切ってしまったと話してる。
  - speaker: tsumugi
    emotion: normal
    text: 特典が変わるお知らせは、ちゃんと見ておいてね。
  - speaker: zundamon
    emotion: sad
    text: ボク、お知らせのメールは全部未読なのだ……。
  - speaker: tsumugi
    emotion: thinking
    text: ……今日から読みなさい。
    se: hammer
# ---- 現代 ----
- id: ima
  title: いまのいきなり!ステーキ
  background: ik_gendai
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: それで、[いきなり!ステーキ|いきなりステーキ]はいまどうなってるの？
  - speaker: tsumugi
    emotion: normal
    text: 2026年9月の時点で、国内に167店。最盛期の[3分の1|さんぶんのいち]ほどね。
  - speaker: tsumugi
    emotion: normal
    text: 前からある店の売上は、前の年を上回ってるの。
  - speaker: tsumugi
    emotion: normal
    text: ブームが去っただけなら、この数字は説明がつかないわね。
  - speaker: tsumugi
    emotion: normal
    text: 会社の営業利益は、2024年から2年続けて黒字。今年も8月の発表では黒字の予想よ。
  - speaker: tsumugi
    emotion: normal
    text: 1号店で税抜き1500円だったリブロース300グラムは、いまは税込みで4410円。
  - speaker: zundamon
    emotion: surprised
    text: ……4410円！？
  - speaker: tsumugi
    emotion: normal
    text: 長男は2024年に、父の強いリーダーシップを振り返ってこう話してる。
  - speaker: tsumugi
    emotion: normal
    text: すべてが悪いことではなかった、って。
  - speaker: tsumugi
    emotion: normal
    text: 一瀬は2025年の終わりの時点で、会社の2番目の大株主よ。
  - speaker: zundamon
    emotion: thinking
    text: 会社を離れても、株は持ってたのか……。
