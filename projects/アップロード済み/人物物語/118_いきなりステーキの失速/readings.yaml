# ikinari-steak 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 一瀬邦夫 / label: 一瀬健作）・テロップ・章タイトルは表示専用なのでタグを付けていない。
#
# 2026-11-08 audio_query で確かめたこと:
# - 一瀬 はタグなしで イチノセ、一瀬邦夫 はタグなしで イチノセ/クニオ と正しく読む。
#   [一瀬|いちのせ] や [一瀬|イチノセ] のタグを付けると イチノ/セ と割れ、
#   [一瀬邦夫|いちのせくにお] は イチノ/セクニ/オカラノ と崩れたので、セリフではタグを付けず、この台帳にも入れていない
#   （タグを重ねると抑揚が切れるため）。ナレは reading: で いちのせ と読ませている。
# - 新店 はタグなしだと シンミセ になるので [新店|しんてん] にした。
# - 誉め言葉 はタグなしだと ホメ/コトバ と割れるので [誉め言葉|ほめことば] にした（ホメコトバと1語で読む）。
# - 性に合わない はタグなしだと読みが揺れるおそれがあるので [性|しょう] にした（ショオニ/アワナイ と読む）。
# - 3分の1 は [3分の1|さんぶんのいち] にした（サンブンノ/イチ と読む）。
# - いきなり!ステーキ はタグなしだと「!」で イキナリ、/ステエキ と間が入るので、セリフでは
#   [いきなり!ステーキ|いきなりステーキ] にした（イキナリ/ステエキ と続けて読む。見直しの直す16）。
#   貼り紙の文の「いきなりステーキ」（!なし）は原文の表記のままで、タグは要らない。
# - 2、3月 は読点で ニ、/サンガツ と切れるので [2、3月|ニサンガツ] にした（ひらがなだと ニサンガ/ツ と割れる。直す15）。
# - 健作・一瀬健作・山王・赤坂・墨田・両国・銀座・渋谷 はナレ（reading:）と名札だけに出る。
#   セリフでは「長男」「本社」などと言う。和邦 は台本に出さなかった（「和牛ステーキの店」と言った）。
# 人名
- {surface: 一瀬健作, reading: いちのせけんさく}   # 名札だけに出る
- {surface: 健作, reading: けんさく}   # 名札だけに出る
# 地名・施設
- {surface: 山王, reading: さんのう}   # ナレだけに出る
- {surface: 赤坂, reading: あかさか}   # ナレだけに出る
- {surface: 墨田, reading: すみだ}     # ナレだけに出る
- {surface: 両国, reading: りょうごく} # ナレだけに出る
- {surface: 銀座, reading: ぎんざ}     # ナレだけに出る
- {surface: 渋谷, reading: しぶや}     # ナレだけに出る
# 語
- {surface: いきなり!ステーキ, reading: いきなりすてーき}
- {surface: 新店, reading: しんてん}
- {surface: 誉め言葉, reading: ほめことば}
- {surface: 3分の1, reading: さんぶんのいち}
