# shinko-bank 読み台帳（人名・地名・社名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている（タグは付けていない）。
# 名札（tag: 木村元会長・木村代表・木村社長・木村 / label: 記者・職員・経営者・行員・新人・客・執行役・検査官・社長・
# 預保職員・副大臣・江上社長・裁判長・預金者）・テロップ・章タイトルは表示専用なのでタグを付けていない。
#
# 2026-11-18 台本を書いたあと、セリフ全行を VOICEVOX の audio_query（各話者の style）にかけた結果:
# - 日本振興銀行 はタグなしだと ニッポンシンコオギンコオ になった。発注書どおりカタカナのタグ [日本振興銀行|ニホンシンコウギンコウ] にすると
#   ニホンシン/コオギンコオ と切れた → ひらがなのタグ [日本振興銀行|にほんしんこうぎんこう] で ニホンシンコオギンコオノ（1語）。
#   「日本で初めて」も ニッポンデ になったので [日本|にほん] で ニホンデ。
# - 木村剛 はタグなしだと キムラ/ツヨシ になった → [木村剛|キムラタケシ] で キムラ/タケシ。木村 だけなら キムラ（タグなし・台帳に入れない）。
# - 自見庄三郎 は [自見|ジミ] で ジミ/ショオザブロオワ。
# - 金月処理 は [金月処理|きんげつしょり] で キンゲツ/ショリト。
# - 年約2% は トシ/ヤク と読んだ → 「年利は約2%」「年利約2%」「年利に直すと45.7%」に言い換えた（ネンリ）。
# - 組織的に行っており は イッテ/オリ になった → [行|おこな]っており で オコナッテ/オリ。
# - 3分の2 は [3分の2|さんぶんのに] で サンブンノニニモ。
# 2026-11-18 見直し（nb_fix.md）で直した・足したセリフも audio_query にかけた:
# - 「すべからく『信頼』の問題です」は『』で スベカラク、/シンライ、/ノ と2回切れた → [『信頼』|シンライ] で スベカラク/シンライノ/モンダイデス（字幕は『信頼』のまま）。
# - 「痛感している、って」は ッテ が浮いた → 「痛感しているって、言ってたのだ」で …イルッテ/イッテタ/ノダ。
# - 「立て直しが鈍る」は ナマル になった → [鈍る|にぶる] で ニブルト。
# - 私の力不足で＝ワタシノ/チカラブソクデ、多くの株主に＝オオクノ/カブヌシニ、当初の目標＝トオショノ/モクヒョオ、理事長＝リジチョオ、
#   結論づけた＝ケツロンズケタ、帳簿＝チョオボ、預金保険料＝ヨキンホケンリョオ、和解＝ワカイ、有罪判決＝ユウザイハンケツ。どれも正しい。
# - 下の専門語はタグなしでも正しく読んだが、タグを付けても抑揚は切れなかったので、全出現にタグを付けて台帳で見張る:
#   預金保険機構＝ヨキンホケンキコオ、名寄せ＝ナヨセ、検査忌避＝ケンサキヒ、銀行法＝ギンコオホオ、商工ローン＝ショオコオロオン、
#   債権＝サイケン、額面＝ガクメン、定期預金＝テイキヨキン、迂回融資＝ウカイユウシ、執行猶予＝シッコオユウヨ、
#   中小企業保証機構＝チュウショオキギョオホショオキコオ、善管注意義務違反＝ゼンカンチュウイギムイハン。
# - タグなしで正しく読んだので台帳に入れていない語: SFCG（エスエフシイジイ）・債務超過・出資法違反・特別調査委員会・
#   大口融資・与信審査管理・拡大路線・抽出・事務担当者・承って・貸し倒れ・仕留め・すべからく・道義的・痛感・
#   保釈保証金・前会長（ゼンカイチョオ）・元会長（モトカイチョオ）・東京地裁・1000万円（センマンエン）・拠点・受け皿・イオン銀行。
#   一の矢＝イチノ/ヤデ、三の矢＝サンノ/ヤデ（2句に切れるが読みは正しい）。
