# ---- 本当の注意点（高い金利の理由・超えた分が戻るまでの年数・名寄せ。1500万円は台帳の計算。助言にしない） ----
- id: chui
  title: 高い金利の理由
  background: nb_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 1つめ。ほかより金利が高い預金には、集める側の理由がある。
  - speaker: zundamon
    emotion: thinking
    text: 理由って？
  - speaker: tsumugi
    emotion: normal
    text: 年利約2%で集めた預金は、[商工ローン|しょうこうローン]の[債権|さいけん]を買うお[金|かね]にもなったわ。
  - speaker: zundamon
    emotion: normal
    text: 毎年20万円の利息の、出どころ……。
  - speaker: tsumugi
    emotion: normal
    text: 高い金利を見たら、そのお[金|かね]の使い道を一度だけ調べてみて。
  - speaker: tsumugi
    emotion: normal
    text: 2つめ。1000万円を超えた分は、何年もかけて一部だけ戻るの。
  - speaker: tsumugi
    emotion: normal
    text: 1500万円を1人で預けていたら、超えた500万円は3か月後に125万円。
  - speaker: tsumugi
    emotion: normal
    text: 6年かけて、合わせて約305万円。約195万円は戻らない計算よ。
  - speaker: zundamon
    emotion: surprised
    text: すぐには、使えないってこと？
  - speaker: tsumugi
    emotion: thinking
    text: そう。戻る分も、何年も先なの。
  - speaker: zundamon
    emotion: sad
    text: 6年も、待つのだ……。
    se: shobon
  - speaker: tsumugi
    emotion: normal
    text: 3つめ。同じ銀行の口座は、足して数えられる。
  - speaker: tsumugi
    emotion: normal
    text: 本店と支店に分けても、同じ銀行なら1人分よ。
  - speaker: zundamon
    emotion: surprised
    text: 店を分けても、[名寄せ|なよせ]で見つかるんだ！
