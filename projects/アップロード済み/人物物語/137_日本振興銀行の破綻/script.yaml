scenes:
# ---- 先出し（2010年12月9日・司法記者クラブの会見。記者の問いは作らずナレで。笑いの SE なし） ----
- id: co_kaiken
  title: ''
  background: nb_kaiken
  bgm: serious
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 木村元会長, emotion: sad}
  - {who: kisha, x: 0.86, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2010年12月9日、東京・霞が関。日本振興銀行の元会長・木村剛が、保釈の翌日に会見を開きます。
    reading: にせん じゅうねん じゅうにがつ ここのか、とうきょう かすみがせき。にほん しんこう ぎんこうの もと かいちょう きむら たけしが、ほしゃくの よくじつに かいけんお ひらきます。
  - speaker: reimu
    text: 銀行の破綻を謝り、その原因についてこう述べます。
    reading: ぎんこうの はたんお あやまり、その げんいんに ついて こう のべます。
  - speaker: zundamon
    emotion: sad
    text: 私の力不足で、道義的な責任は痛感している
  - speaker: reimu
    text: 融資や決算への疑いには、こう答えました。
    reading: ゆうしや けっさんえの うたがいにわ、こう こたえました。
  - speaker: zundamon
    emotion: normal
    text: 融資や決算が不適切だったとは考えていない
  - speaker: reimu
    text: 3か月前。彼の銀行は日本で初めて、預金が1000万円で切られました。
    reading: さんかげつまえ。かれの ぎんこうわ にほんで はじめて、よきんが いっせんまんえんで きられました。
  - speaker: reimu
    text: 8年前、彼は銀行を検査する側にいました。
    reading: はちねんまえ、かれわ ぎんこうお けんさ する がわに いました。
# ---- 今の部屋（お年玉を金利の一番高い銀行に。仕組みは言い切らない） ----
- id: hook
  title: ''
  background: nb_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: お年玉を、金利が一番高い銀行に全部預けたのだ！
  - speaker: tsumugi
    emotion: normal
    text: いくら？
  - speaker: zundamon
    emotion: happy
    text: 1億円……のつもりなのだ。
  - speaker: tsumugi
    emotion: thinking
    text: つもり貯金ね。で、その銀行が潰れたら？
    se: hammer
  - speaker: zundamon
    emotion: surprised
    text: ……え。
  - speaker: tsumugi
    emotion: normal
    text: 2010年、本当に預金が切られた人たちがいたの。
  - speaker: tsumugi
    emotion: thinking
    text: 銀行を厳しく検査する側にいた男は、なぜ自分の銀行の検査で罪に問われたのか。
    telops:
    - {text: "検査する側にいた男が なぜ検査で罪に？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 検査する側が、検査で！？
# ---- 2002年10月・竹中チーム（30秒以内。著書の言葉はナレで出どころを言う。竹中平蔵の台詞・顔は出さない） ----
- id: card2002
  title: ''
  background: nb_card_2002
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 2002年10月、霞が関の金融庁。竹中平蔵金融相のプロジェクトチームが集まります。
    reading: にせん にねん じゅうがつ、かすみがせきの きんゆうちょう。たけなか へいぞう きんゆうしょうの ぷろじぇくと ちーむが あつまります。
- id: ch1_team
  title: 検査する側
  background: nb_kinyucho
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 木村代表, emotion: normal}
  - {who: shokuin, x: 0.82, emotion: normal}
  cuts:
  - speaker: reimu
    text: メンバーの1人は日銀出身の金融コンサルタント、木村剛。40歳です。
    reading: めんばーの ひとりわ にちぎん しゅっしんの きんゆう こんさるたんと、きむら たけし。よんじゅっさいです。
  - speaker: shokuin
    emotion: normal
    text: 大手銀行の貸し倒れへの備えを、厳しく調べます。
  - speaker: reimu
    text: 木村はのちに、翌年3月の著書でこう書きます。
    reading: きむらわ のちに、よくねん さんがつの ちょしょで こう かきます。
  - speaker: zundamon
    emotion: normal
    text: 一の矢で逃げられても、二の矢、三の矢で仕留められるようになっている
    telops:
    - {text: "木村の著書「二の矢、三の矢で仕留められる」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: zundamon
    emotion: normal
    text: 金融問題というものは、すべからく[『信頼』|シンライ]の問題です
  - speaker: reimu
    text: 8年後に初めてペイオフが使われる銀行を作るのがこの男だとは、まだ誰も思っていません。
    reading: はちねんごに はじめて ぺいおふが つかわれる ぎんこうお つくるのが この おとこだとわ、まだ だれも おもって いません。
# ---- 2003年2月・東京青年会議所の例会（B の言葉なので「とされます」） ----
- id: ch2_reikai
  title: 20億円集めれば
  background: nb_reikai
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 木村代表, emotion: happy}
  - {who: keieisha, x: 0.86, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2003年2月、東京青年会議所の例会。木村は、こう語ったとされます。
    reading: にせん さんねん にがつ、とうきょう せいねん かいぎしょの れいかい。きむらわ こう かたったと されます。
  - speaker: zundamon
    emotion: happy
    text: 20億円集めれば銀行をすぐに作れる。
  - speaker: keieisha
    emotion: surprised
    text: 20億円で、銀行が！？
# ---- 2004年4月・開業の窓口（名前の無い行員と客。定期だけ・決済なし・年約2%＝毎年約20万円。2:00 までに行き先へ） ----
- id: card2004
  title: ''
  background: nb_card_2004
  cuts:
  - speaker: reimu
    text: 2004年4月、東京・大手町。日本振興銀行が開業します。
    reading: にせん よねん しがつ、とうきょう おおてまち。にほん しんこう ぎんこうが かいぎょう します。
- id: ch3_madoguchi
  title: 定期預金だけの銀行
  background: nb_madoguchi
  stage:
  - {who: koin, x: 0.12, flip: true, emotion: normal}
  - {who: kyaku, x: 0.88, emotion: normal}
  cuts:
  - speaker: kyaku
    emotion: normal
    text: 普通預金の口座を、作りたいんですけど。
  - speaker: koin
    emotion: normal
    text: 普通預金は、ございません。
  - speaker: kyaku
    emotion: surprised
    text: え？ じゃあ、公共料金の引き落としは？
  - speaker: koin
    emotion: normal
    text: できません。振り込みも、承っておりません。
  - speaker: kyaku
    emotion: angry
    text: 銀行なのに、何ができるんですか！？
    se: zukko
  - speaker: koin
    emotion: happy
    text: '[定期預金|ていきよきん]だけです。そのかわり、金利は高めです。'
  - speaker: kyaku
    emotion: normal
    text: 1000万円、預けたら？
  - speaker: reimu
    text: この銀行の10年の定期は、一時は年約2%。1000万円なら、毎年約20万円の利息です。
    reading: この ぎんこうの じゅうねんの ていきわ、いちじわ ねん やく にぱーせんと。いっせんまんえん なら、まいとし やく にじゅうまんえんの りそくです。
    telops:
    - {text: "定期だけ・一時は年約2%", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: kyaku
    emotion: surprised
    text: そのお[金|かね]、どこに貸すんです？
  - speaker: koin
    emotion: normal
    text: 中小企業です。担保も保証人も、要りません。
  - speaker: reimu
    text: 定期預金だけの銀行は、集めたお金をどこへ回したのか。のちの行き先の1つは、商工ローンの債権でした。
    reading: ていき よきん だけの ぎんこうわ、あつめた おかねお どこえ まわしたのか。のちの いきさきの ひとつわ、しょうこう ろーんの さいけんでした。
# ---- 2004年11月〜2005年5月・内紛と社長（創業メンバーは名前も台詞も出さない。会見の言葉は数字の読み上げまで） ----
- id: ch4_naifun
  title: 1年余りで2度の交代
  background: nb_kaigi
  bgm: curious
  stage:
  - {who: koin, x: 0.14, flip: true, emotion: normal}
  - {who: shinjin, x: 0.86, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 2004年11月。内部の書類を持ち出したとして創業メンバーが解雇され、のちに木村を告訴します。
    reading: にせん よねん じゅういちがつ。ないぶの しょるいお もちだしたと して そうぎょう めんばーが かいこ され、のちに きむらお こくそ します。
  - speaker: shinjin
    emotion: surprised
    text: 開業から、まだ半年ですよ！？
  - speaker: koin
    emotion: normal
    text: その人が、経営陣の解任を求めてるんだ。
- id: ch4_shacho
  title: ''
  background: nb_kaiken
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 木村社長, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2005年の元日、木村が社長に就きます。4日の会見では、解任案の否決に自信を見せます。
    reading: にせん ごねんの がんじつ、きむらが しゃちょうに つきます。よっかの かいけんでわ、かいにんあんの ひけつに じしんお みせます。
  - speaker: zundamon
    emotion: happy
    text: 多くの株主に理解してもらっている
- id: ch4_kessan
  title: ''
  background: nb_kaigi
  stage:
  - {who: koin, x: 0.14, flip: true, emotion: normal}
  - {who: shinjin, x: 0.86, emotion: surprised}
  cuts:
  - speaker: shinjin
    emotion: surprised
    text: 先輩、3月期の決算です。赤字が19億円……。
  - speaker: koin
    emotion: sad
    text: 貸出は118億円。当初の目標は182億円だった。
  - speaker: shinjin
    emotion: sad
    text: 目標の、[3分の2|さんぶんのに]にも届かない……。
    beat: true
  - speaker: koin
    emotion: normal
    text: 社長は6月の総会のあと、会長に退くそうだ。
  - speaker: shinjin
    emotion: surprised
    text: 開業から1年余りで、トップが2度替わるんですか！？
  - speaker: koin
    emotion: normal
    text: 銀行を検査する側だった人が、今度は検査される銀行の会長か。
# ---- 2006年1月・1兆円の構想（ブログの原文は未見。日経の要約をナレで） ----
- id: ch5_icchoen
  title: 1兆円の構想
  background: nb_kaigi
  stage:
  - {who: koin, x: 0.14, flip: true, emotion: normal}
  - {who: shinjin, x: 0.86, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 2006年1月。会長の木村はブログに、2012年に1兆円規模の金融グループにする構想を書きます。
    reading: にせん ろくねん いちがつ。かいちょうの きむらわ ぶろぐに、にせん じゅうにねんに いっちょうえん きぼの きんゆう ぐるーぷに する こうそうお かきます。
  - speaker: shinjin
    emotion: surprised
    text: 1兆円！？ 去年の春の貸出は、118億円ですよ！
  - speaker: koin
    emotion: normal
    text: ゼロを、2つ足すだけだ。
  - speaker: shinjin
    emotion: angry
    text: 足し算みたいに、言わないでください！
    se: tsukkomi
  - speaker: koin
    emotion: happy
    text: 金利が高いから、預金は集まる。
  - speaker: shinjin
    emotion: normal
    text: 問題は、どこに貸すかですね……。
  - speaker: reimu
    text: 1兆円を目指した銀行に、やがて金融庁の検査が入ります。検査する側だった男は、そのとき何をしたのか。
    reading: いっちょうえんお めざした ぎんこうに、やがて きんゆうちょうの けんさが はいります。けんさ する がわだった おとこわ、その とき なにお したのか。
# ---- 2007年12月〜・商工ローンの債権を額面で（連帯保証人が SFCG、手数料は訴えと処分の事実の範囲） ----
- id: ch6_sfcg
  title: 額面で買う
  background: nb_kaigi
  stage:
  - {who: koin, x: 0.14, flip: true, emotion: normal}
  - {who: shinjin, x: 0.86, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 2007年12月。銀行は商工ローン大手のSFCGから、貸付の債権を買い始めます。
    reading: にせん ななねん じゅうにがつ。ぎんこうわ しょうこう ろーん おおての えすえふしーじーから、かしつけの さいけんお かいはじめます。
  - speaker: shinjin
    emotion: normal
    text: 先輩、これSFCGの貸付の束ですよね。いくらで買うんです？
  - speaker: koin
    emotion: normal
    text: '[額面|がくめん]で。'
  - speaker: shinjin
    emotion: surprised
    text: '[額面|がくめん]って、書いてある金額のままですか！？'
  - speaker: koin
    emotion: normal
    text: そうだ。
  - speaker: shinjin
    emotion: surprised
    text: 返ってこない貸付が、混じってたら……。
  - speaker: koin
    emotion: normal
    text: 保証が付いてる。SFCGのな。
  - speaker: shinjin
    emotion: angry
    text: 売った会社が、自分で保証するんですか！
    se: hammer
  - speaker: koin
    emotion: happy
    text: 手数料も入る。うちには、悪い話じゃない。
  - speaker: reimu
    text: 買い取りは17回、総額1705億円。売り手のSFCGは、2009年に破綻します。
    reading: かいとりわ じゅうななかい、そうがく せんななひゃくごおくえん。うりての えすえふしーじーわ、にせん きゅうねんに はたん します。
    telops:
    - {text: "額面で17回・1705億円", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: 預金保険機構はのちに、これをSFCGへの実質的な信用供与で破綻の大きな原因の一つとします。
    reading: よきん ほけん きこうわ のちに、これお えすえふしーじーえの じっしつてきな しんよう きょうよで はたんの おおきな げんいんの ひとつと します。
# ---- 2008年7月・中小企業振興ネットワーク（看板の社名は出さない。外れる看板＝のちの倒産、社数は言わない） ----
- id: ch7_rouka
  title: 仲間の会社の輪
  background: nb_rouka
  stage:
  - {who: koin, x: 0.12, flip: true, emotion: happy}
