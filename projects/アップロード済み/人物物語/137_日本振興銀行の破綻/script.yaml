meta:
  title: 「すべからく『信頼』の問題です」と書いた男の日本振興銀行、日本で初めてのペイオフに【ずんだもん解説】
  slug: shinko-bank
  hook_line: 検査する側にいた男は、なぜ自分の銀行の検査で罪に問われたのか。
  summary: 2010年12月9日、保釈の翌日の会見で破綻を謝罪し、「道義的な責任は痛感している」と述べた日本振興銀行の元会長、木村剛。8年前、彼は金融庁のプロジェクトチームで、大手銀行の資産査定を厳しくする側にいました。定期預金だけを集める銀行、額面で買った商工ローンの債権、仲間の会社の輪、そして消えたメール。検査する側にいた男は、なぜ自分の銀行の検査で罪に問われたのか。判決と預金保険機構・金融庁の資料をもとに、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 金融庁「金融担当大臣談話－日本振興銀行株式会社について－」（2010年9月10日） https://www.fsa.go.jp/common/conference/danwa/20100910-1.html
  - 金融庁「自見内閣府特命担当大臣閣議後記者会見の概要」（2010年9月10日） https://www.fsa.go.jp/common/conference/minister/2010b/20100910-1.html
  - 預金保険機構「日本振興銀行の預金等債権の買取り（概算払）について」（2010年12月7日） https://www.fsa.go.jp/common/diet/houkoku/2306/04.pdf
  - 預金保険機構「日本振興銀行の旧役員に対する責任追及訴訟の提起について」（2011年8月23日） https://www.fsa.go.jp/common/diet/houkoku/2312/06.pdf
  - 参議院『立法と調査』No.319「預金保険制度を概観してみると～初のペイオフ適用に関連して～」（2011年8月） https://www.sangiin.go.jp/japanese/annai/chousa/rippou_chousa/backnumber/2011pdf/20110801101.pdf
  - 日本経済新聞「木村振興銀元会長に有罪判決 メール削除指示認定」（2012年3月16日） https://www.nikkei.com/article/DGXNASDG1603F_W2A310C1CR8000/
