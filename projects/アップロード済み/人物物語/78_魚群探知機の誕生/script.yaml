  - speaker: shain
    emotion: surprised
    text: えっ。お客さんが、ですか！？
  - speaker: tobikomi
    emotion: normal
    text: 腰に縄ば巻け。しびれたら、すぐ引き上げろよ。
  - speaker: reimu
    text: 船主は体に縄をつけて、本当に海へ飛び込みました。
