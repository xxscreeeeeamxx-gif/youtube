  title: 本当に世界初？
  background: fr_shiryo
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: でも魚探って、本当に世界初なの？
  - speaker: tsumugi
    emotion: normal
    text: 魚の群れを音でとらえた記録は、ほかの国にもあるの。
  - speaker: tsumugi
    emotion: normal
    text: 1935年にはノルウェーで、タラの群れが記録されてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 1943年には、カナダでもニシンの群れが記録されてる。
  - speaker: zundamon
    emotion: surprised
    text: 古野兄弟より、先じゃないか！
  - speaker: tsumugi
    emotion: normal
    text: でも浅い海のぎっしり詰まった群れが、たまたま映った程度だったの。
  - speaker: zundamon
    emotion: thinking
    text: たまたまの1枚と、毎日使える道具は別物か。
  - speaker: tsumugi
    emotion: normal
    text: '[IEEE|あいとりぷるいー]も、ほかの国に似た開発があったことは認めてるの。'
  - speaker: tsumugi
    emotion: normal
    text: そのうえで、漁の道具として使える形にした点を評価したのよ。
  - speaker: zundamon
    emotion: thinking
    text: 年も、1948年と1949年の2つあるのだ。
  - speaker: tsumugi
    emotion: normal
    text: 会社は、[長生丸|ちょうせいまる]で獲れた1948年を実用化の年にしてるの。
  - speaker: tsumugi
    emotion: normal
    text: '[IEEE|あいとりぷるいー]は、商品として広まった1949年ね。'
  - speaker: zundamon
    emotion: happy
    text: どっちも、間違いじゃないわけか。
  - speaker: tsumugi
    emotion: normal
    text: 12月3日は、魚群探知機の日よ。2021年に決まったの。
  - speaker: zundamon
    emotion: happy
    text: じゃあ、海に投げ込まれた日も記念日にしてほしいのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 誰が祝うのよ、その日。
    se: zukko
- id: ch16_gendai
  title: 見えすぎる魚探
  background: fr_bridge
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 会社の試算では、漁業向けの機器で世界の49%を占めてるわ。
    telops:
    - {text: 漁業向けの機器で世界の49%, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 世界の漁船の、2隻に1隻なのだ！？
  - speaker: tsumugi
    emotion: thinking
    text: 売り上げから出した割合よ。船の数じゃないわ。
  - speaker: tsumugi
    emotion: normal
    text: 売り上げの7割以上は、海外なの。
  - speaker: zundamon
    emotion: surprised
    text: 7割が海外！？
  - speaker: tsumugi
    emotion: normal
    text: 今は、魚の大きさを測ったり種類を見分けたりできる機種もあるわ。
  - speaker: tsumugi
    emotion: normal
    text: 浮き袋があるかどうかまで、分かる機種もあるのよ。
  - speaker: zundamon
    emotion: happy
    text: '[清賢|きよかた]さんが聞いたら、泣いて喜ぶのだ。'
  - speaker: tsumugi
    emotion: normal
    text: 音の高さも使い分けるの。低い音は深く広く届いて、高い音は細かく見えるわ。
  - speaker: zundamon
    emotion: happy
    text: 遠くを見る目と、近くを見る目があるわけか。
  - speaker: tsumugi
    emotion: normal
    text: スマホにつなぐ魚探なら、軽いもので75グラムほどよ。
  - speaker: zundamon
    emotion: surprised
    text: 60万円の箱が、ポケットに入ったのだ！
  - speaker: zundamon
    emotion: thinking
    text: でも、そんなに見えたら獲りすぎちゃわない？
    background: fr_gyokou
  - speaker: tsumugi
    emotion: thinking
    text: そこは、本当に心配されてるの。
  - speaker: tsumugi
    emotion: thinking
    text: 魚探やGPSが広まって、漁船の[獲る|とる]力は35年で2倍になるという研究もあるわ。
  - speaker: zundamon
    emotion: sad
    text: 魚は2倍に増えないのに……。
  - speaker: tsumugi
    emotion: normal
    text: アメリカのバス[釣り|つり]のプロの大会では、前を映す最新のソナーを制限し始めたの。
  - speaker: tsumugi
    emotion: normal
    text: 2026年は、使えるのは9試合中5試合までよ。
  - speaker: zundamon
    emotion: thinking
    text: 見えすぎるのも、ずるいってことか。
  - speaker: zundamon
    emotion: happy
    text: 残りの4試合は、勘と運の勝負なのだ。
    se: manuke
  - speaker: tsumugi
    emotion: normal
    text: 日本の漁業と養殖の生産量は、1984年の1282万トンがピークなの。
  - speaker: tsumugi
    emotion: normal
    text: 2025年は約358万トン。ピークの3割ほどよ。
  - speaker: zundamon
    emotion: sad
    text: 減ってるのだ……。
  - speaker: tsumugi
    emotion: thinking
    text: 理由は獲りすぎだけじゃなく、海の変化も重なってるの。
  - speaker: tsumugi
    emotion: normal
    text: 今は獲っていい量を決めて守る仕組みを、国が広げてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 調査船は魚探の技術で、海にどれだけ魚がいるかも調べてるの。
  - speaker: zundamon
    emotion: happy
    text: 魚を[獲る|とる]機械が、魚を守るのにも使われてるんだね。
- id: shime
  title: ''
  background: fr_ima_shime
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。今度は、への字の影が出たのだ。
  - speaker: tsumugi
    emotion: normal
    text: への字は1匹の魚ね。魚が音の下を通り過ぎると、そう映るの。
  - speaker: zundamon
    emotion: happy
    text: 雲みたいなのは群れ。真っ赤なのは海底。もうクラゲとは間違えないぞ。
  - speaker: tsumugi
    emotion: happy
    text: ちゃんと読めるようになったじゃない。
  - speaker: zundamon
    emotion: happy
    text: への字の真ん中に、投げ込むぞ！
  - speaker: zundamon
    emotion: surprised
    text: ……来た！ 今度こそ魚だ！
    background: fr_ima_shime2
  - speaker: zundamon
    emotion: sad
    text: ……イワシ、1匹。
  - speaker: tsumugi
    emotion: happy
    text: への字は1匹って、言ったでしょ。
    se: oti
  - speaker: zundamon
    emotion: sad
    text: イワシの神様は、まだ遠いのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 釣り船や釣具店で魚探を見かけたら、画面をのぞいてみて。
  - speaker: tsumugi
    emotion: normal
    text: インチキと呼ばれた兄弟の機械が、今も海の中を見てるのよ。
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
