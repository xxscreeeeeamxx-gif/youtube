  - {who: zundamon, x: 0.28, flip: true, tag: 古野清賢, emotion: surprised}
  - {who: senchou, x: 0.7, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 記録紙に、濃い影が出ました。この下に群れがいます！
  - speaker: senchou
    emotion: thinking
    text: こげん所で明かりばつけても、無駄たい。いつもの[漁場|ぎょじょう]は、まだ先ぞ。
  - speaker: zundamon
    emotion: normal
    text: 一度だけ、ここで集魚灯をつけてください。
  - speaker: senchou
    emotion: angry
    text: 紙の上の染みで、魚の分かるもんか。
  - speaker: zundamon
    emotion: thinking
    text: 外れたら、網はボクが一晩じゅう引きます。
  - speaker: senchou
    emotion: thinking
    text: ……一度だけぞ。
  - speaker: senchou
    emotion: angry
    text: 外れたら、明日の朝飯はお前の分なしぞ。
  - speaker: zundamon
    emotion: sad
    text: ……それは、外せないのだ。
    beat: true
  - speaker: reimu
    text: 集魚灯をともして網を入れると、かかったのはイワシの大群でした。
    reading: しゅうぎょとうお ともして あみお いれると、かかったのわ いわしの たいぐんでした。
  - speaker: senchou
    emotion: surprised
    text: ……ほんなこつ、おった。
    se: bikkuri
  - speaker: zundamon
    emotion: happy
    text: 音で、魚が見えたのだ！
  - speaker: senchou
    emotion: happy
    text: 紙の染みが、イワシに化けたばい！
  - speaker: reimu
    text: 古野電気はこの1948年を、魚群探知機の世界初の実用化の年としています。
    reading: ふるの でんきわ この せんきゅうひゃく よんじゅうはちねんお、ぎょぐん たんちきの せかいはつの じつようかの としと して います。
