  - speaker: shain
    emotion: surprised
    text: もう、とっくに入ってます！
  - speaker: shain
    emotion: thinking
    text: 船主さん！？ 生きてますか！？
  - speaker: tobikomi
    emotion: thinking
    text: ……ビリビリせん。
  - speaker: tobikomi
    emotion: happy
    text: 買うた！
    se: oti
  - speaker: shain
    emotion: thinking
    text: ……説明より、飛び込むほうが早かったのか。
