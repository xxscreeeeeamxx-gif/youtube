meta:
  title: 【魚群探知機の誕生】インチキと呼ばれ海に落とされた男が、イワシの神様に【ずんだもん解説】
  slug: furuno-fishfinder-v2
  summary: 釣り船にもスマホにもつながる、魚群探知機。その始まりは、長崎の島原半島にある小さな電器屋の兄弟でした。船頭の「魚のおるところには泡が出る」という一言から、兄弟は海軍が手放した古い測深機を作り変えます。ところが試験は雑音だらけ、クラゲの群れを魚と取り違え、売れば返品の山。インチキと呼ばれた機械は、どうやって漁師に信じてもらえたのか。兄弟の晩年まで、再現ドラマでたどります。
  tags:
  - 魚群探知機
  - 古野電気
  - 古野清賢
  - 古野清孝
  - 魚探
  - 漁業
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 雑学
  thumbnail:
    top: 海に落とされた男
    bottom: 魚群探知機の誕生
  mode: drama
  narrator: reimu
