  - {who: kiyotaka, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1948年12月。兄弟は長崎駅の前に、合資会社古野電気工業所を作ります。
    reading: せんきゅうひゃく よんじゅうはちねん じゅうにがつ。きょうだいわ ながさきえきの まえに、ごうし がいしゃ ふるの でんき こうぎょうしょお つくります。
  - speaker: kiyotaka
