  - speaker: kiyotaka
    emotion: thinking
    text: 高いのは分かってる。獲れるようになれば、元は取れる。
  - speaker: zundamon
    emotion: thinking
    text: ……獲れるって、信じてもらえればですけど。
- id: ch6_henpin
