  - speaker: zundamon
    emotion: surprised
    text: 会社！？ [何人|なんにん]でやるんです？
  - speaker: kiyotaka
    emotion: normal
    text: 7人だ。魚探を作って売る。
  - speaker: zundamon
    emotion: happy
    text: 7人で、海の中を見る機械を売るのか。
  - speaker: zundamon
    emotion: thinking
    text: 兄さん、1台いくらにするんです？
  - speaker: kiyotaka
