scenes:
- id: co_kurage
  title: ''
  background: fr_kurage0
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 古野清賢, emotion: happy}
  - {who: kurage, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1948年ごろの長崎で、ある若者が自作の魚群探知機を漁船に積んで試していました。
    reading: せんきゅうひゃく よんじゅうはちねん ごろの ながさきで、ある わかものが じさくの ぎょぐん たんちきお ぎょせんに つんで ためして いました。
  - speaker: zundamon
    emotion: happy
    text: 大きな影が出ました！ この下に、イワシの大群がいます！
  - speaker: kurage
    emotion: surprised
    text: よし、[網|あみ]ば入れろ！
  - speaker: kurage
    emotion: happy
    text: ……[重たか|おもたか]。こりゃ大漁たい！
  - speaker: zundamon
    emotion: thinking
    text: ……なんだか、ぷよぷよしてるのだ。
    background: fr_kurage_ami
  - speaker: kurage
    emotion: angry
    text: クラゲやなかか！
  - speaker: kurage
    emotion: angry
    text: なにが探知機か！ こんなもんはインチキたい！
  - speaker: zundamon
    emotion: surprised
    text: ま、待ってください。影は本当に映って……
  - speaker: kurage
    emotion: angry
    text: お前も、海で頭ば冷やしてこい！
    background: fr_kurage_umi
    se: don
  - speaker: reimu
    text: 海へ放り込まれた若者は、古野清賢。1年後、港で一番獲れない船がこの機械で3か月続けて一番になります。
    reading: うみえ ほうりこまれた わかものわ、ふるの きよかた。いちねんご、みなとで いちばん とれない ふねが この きかいで さんかげつ つづけて いちばんに なります。
- id: hook
  title: ''
  background: fr_ima_hook
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ見て！ 魚探に雲みたいな影なのだ。イワシの大群だぞ！
  - speaker: tsumugi
    emotion: thinking
    text: 昔、それで海に投げ込まれた人がいるのよ。
  - speaker: zundamon
    emotion: surprised
    text: ……ボクのも、クラゲかもしれないのだ。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: その人が、のちにイワシの神様と呼ばれるの。
  - speaker: zundamon
    emotion: surprised
    text: インチキから神様に！？ [何|なに]があったの？
    telops:
    - {text: インチキから神様へ, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、島原半島の小さな電器屋さんよ。
- id: card1938
  title: ''
  background: fr_card_1938
  cuts:
  - speaker: reimu
    text: 1938年。長崎の島原半島の口之津で、17歳の古野清孝が電気の店を開きます。
    reading: せんきゅうひゃく さんじゅうはちねん。ながさきの しまばら はんとうの くちのつで、じゅうななさいの ふるの きよたかが でんきの みせお ひらきます。
- id: ch1_mise
  title: 口之津の電器屋
  background: fr_mise
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 古野清賢, scale: 0.85, emotion: happy}
  - {who: kiyotaka, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 兄さん！ このラジオ、また声が出たぞ！
  - speaker: kiyotaka
    emotion: happy
    text: 真空管を取り替えたからな。
  - speaker: zundamon
    emotion: thinking
    text: 遠くの放送が、なんでこの箱から聞こえるの？
  - speaker: kiyotaka
    emotion: normal
    text: 目に見えない電波を拾って、音に戻してるんだ。
  - speaker: zundamon
    emotion: surprised
    text: 見えない波を、拾うのか……。
  - speaker: kiyotaka
    emotion: normal
    text: うちは兄弟が多いけん、おれが稼がんとな。
  - speaker: kiyotaka
    emotion: normal
    text: 港の漁船の、集魚灯の修理も引き受けた。
  - speaker: zundamon
    emotion: thinking
    text: 集魚灯って、この笠のついた電球？
  - speaker: kiyotaka
    emotion: normal
    text: 夜の海を照らして、魚を集める明かりだ。イワシやアジは光に寄ってくる。
  - speaker: zundamon
    emotion: happy
    text: じゃあボクも明かりの下に立てば、魚にモテるのだ！
  - speaker: kiyotaka
    emotion: thinking
    text: 寄ってくるのは、蚊だけだ。
    se: hammer
  - speaker: kiyotaka
    emotion: happy
    text: '[口之津|くちのつ]は漁船が多い。電気の分かる者は少ないけん、仕事はいくらでもある。'
  - speaker: zundamon
    emotion: happy
    text: 兄さん、ボクにも直し方を教えて！
  - speaker: kiyotaka
    emotion: happy
    text: よし。直した集魚灯を、港の船に付けに行くぞ。
  - speaker: zundamon
    emotion: happy
    text: 船に乗れるのだ！
- id: ch1_shingaku
  title: ''
  background: fr_mise
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 古野清賢, scale: 0.9, emotion: normal}
  - {who: kiyotaka, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: やがて清賢も、学校を終える年ごろになります。
    reading: やがて きよかたも がっこうお おえる としごろに なります。
  - speaker: kiyotaka
    emotion: thinking
    text: '[清賢|きよかた]。お前、上の学校に行きたいか。'
  - speaker: zundamon
    emotion: happy
    text: 行きたい。電気の勉強を、もっとしたいのだ。
  - speaker: kiyotaka
    emotion: thinking
    text: ……おれは、いつ兵隊に取られるか分からん。
  - speaker: kiyotaka
    emotion: thinking
    text: そうなったら店を任せられるのは、お前しかおらん。
  - speaker: zundamon
    emotion: sad
    text: ……学校、あきらめろってこと？
  - speaker: kiyotaka
    emotion: thinking
    text: すまん。店を、継いでくれ。
  - speaker: zundamon
    emotion: thinking
    text: ……分かった。店は、ボクが守る。
  - speaker: reimu
    text: 兄に説得され、清賢は高等小学校で進学をあきらめました。
    reading: あにに せっとく され、きよかたわ こうとう しょうがっこうで しんがくお あきらめました。
  - speaker: reimu
    text: 1941年。15歳の清賢は、ラジオ技術士の検定に最年少で合格します。
    reading: せんきゅうひゃく よんじゅういちねん。じゅうごさいの きよかたわ、らじお ぎじゅつしの けんていに さいねんしょうで ごうかく します。
  - speaker: kiyotaka
    emotion: surprised
    text: 15で合格か。大人に混じって、よくやった。
  - speaker: zundamon
    emotion: happy
    text: これで、兄さんの代わりが務まるぞ。
  - speaker: reimu
    text: 翌年の1942年には、甲種電気工事士の資格も取ります。
    reading: よくねんの せんきゅうひゃく よんじゅうにねんにわ、こうしゅ でんき こうじしの しかくも とります。
- id: card1943
  title: ''
  background: fr_card_1943
  cuts:
  - speaker: reimu
    text: 1943年ごろ。兄の清孝は22歳。戦争のさなか、橘湾で集魚灯の工事をしていました。
    reading: せんきゅうひゃく よんじゅうさんねん ごろ。あにの きよたかわ にじゅうにさい。せんそうの さなか、たちばなわんで しゅうぎょとうの こうじお して いました。
- id: ch2_awa
  title: 魚のいる所には泡
  background: fr_tachibana
  bgm: jitaku_nite
  stage:
  - {who: kiyotaka, x: 0.3, flip: true, emotion: normal}
  - {who: sendou, x: 0.7, emotion: angry}
  cuts:
  - speaker: sendou
    emotion: angry
    text: こら電気屋。この前の明かりは、一晩でつかんごとなったぞ。
  - speaker: kiyotaka
    emotion: normal
    text: 潮で電線が傷んでました。今度は、しっかり巻いておきます。
  - speaker: sendou
    emotion: angry
    text: 明かりの[無かと|なかと]、商売にならんとよ。
  - speaker: sendou
    emotion: normal
    text: 急げ。今夜はイワシの来そうな気のするけん。
  - speaker: kiyotaka
    emotion: normal
    text: 船頭さん。魚が来るって、どうして分かるんです？
  - speaker: sendou
    emotion: happy
    text: 長年の勘たい。
  - speaker: kiyotaka
    emotion: thinking
    text: 勘、ですか。
  - speaker: sendou
    emotion: normal
    text: それにな。魚のおるところには、必ず泡が出るばい。
    telops:
    - {text: 魚のいる所には泡が出る, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: kiyotaka
    emotion: surprised
    text: 泡？
  - speaker: sendou
    emotion: normal
    text: 群れの上の海が、ぷつぷつ泡立つ。そこば狙って[網|あみ]ば入れるとさ。
  - speaker: kiyotaka
    emotion: thinking
    text: 泡の見えない夜は、どうするんです？
  - speaker: sendou
    emotion: happy
    text: だけん明かりで呼ぶとたい。それでもおらん[日|ひ]は、運の悪かったと思え。
  - speaker: kiyotaka
    emotion: thinking
    text: 勘と、運……。
  - speaker: sendou
    emotion: angry
    text: 考え事より先に、明かりば直さんか！
    se: tsukkomi
  - speaker: reimu
    text: 船頭のこの言葉を、兄の清孝は忘れませんでした。
    reading: せんどうの この ことばお、あにの きよたかわ わすれませんでした。
- id: card1945
  title: ''
  background: fr_card_1945
  cuts:
  - speaker: reimu
    text: 1945年12月。戦争が終わり、兄の清孝は旧海軍が手放した音響測深機を手に入れます。
    reading: せんきゅうひゃく よんじゅうごねん じゅうにがつ。せんそうが おわり、あにの きよたかわ きゅう かいぐんが てばなした おんきょう そくしんきお てに いれます。
- id: ch3_sokushin
  title: 音で深さを測る
  background: fr_kenkyu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 古野清賢, emotion: surprised}
  - {who: kiyotaka, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 兄さん、この鉄の箱は[何|なん]です？
  - speaker: kiyotaka
    emotion: normal
    text: 海軍の[音響測深機|おんきょうそくしんき]だ。海の深さを、音で測る。
  - speaker: zundamon
    emotion: thinking
    text: 音で、深さが分かるんですか。
  - speaker: kiyotaka
    emotion: normal
    text: 船の底から音を出して、海底で跳ね返って戻るまでの時間を計るんだ。
  - speaker: kiyotaka
    emotion: normal
    text: 水の中の音は、1秒に約1500メートル進む。
  - speaker: zundamon
    emotion: happy
    text: なら1秒で戻ったら、深さは1500メートルなのだ！
  - speaker: kiyotaka
    emotion: thinking
    text: 行って帰るから、半分の750メートルだ。
  - speaker: zundamon
    emotion: sad
    text: ……往復を、忘れてたのだ。
    beat: true
  - speaker: zundamon
    emotion: thinking
    text: でも、なんで音なんです？ 明かりで照らせば見えるのに。
  - speaker: kiyotaka
    emotion: normal
    text: '[光|ひかり]は[水|みず]の中じゃ、すぐ弱まる。遠くまで届くのは音だけだ。'
  - speaker: kiyotaka
    emotion: thinking
    text: 海底が映るなら、魚も映るかもしれん。
  - speaker: zundamon
    emotion: thinking
    text: でも魚の体は、ほとんど水です。音は素通りするはずです。
  - speaker: kiyotaka
    emotion: thinking
    text: ……[橘湾|たちばなわん]の船頭さんが言ってたんだ。魚のいる所には、泡が出るって。
  - speaker: zundamon
    emotion: surprised
    text: 泡の中は空気だ。空気なら、音が跳ね返るのだ！
    se: hirameki
  - speaker: kiyotaka
    emotion: happy
    text: やってみる価値は、あるな。
  - speaker: reimu
    text: 実際、浮き袋のある魚では跳ね返る音の9割以上が浮き袋のガスから来ます。
    reading: じっさい、うきぶくろの ある さかなでわ はねかえる おとの きゅうわり いじょうが うきぶくろの がすから きます。
    telops:
    - {text: 跳ね返る音の9割は浮き袋から, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 魚の中にも、泡が入ってたのだ！
- id: card1947
  title: ''
  background: fr_card_1947
  cuts:
  - speaker: reimu
    text: 1947年4月。兄弟は1年かけて作り変えた機械を船に積み、五島灘で初めて試します。
    reading: せんきゅうひゃく よんじゅうななねん しがつ。きょうだいわ いちねん かけて つくりかえた きかいお ふねに つみ、ごとうなだで はじめて ためします。
- id: ch4_goto
  title: 雑音の海
  background: fr_goto
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 古野清賢, emotion: happy}
  - {who: kiyotaka, x: 0.52, emotion: normal}
  - {who: ryoushi, x: 0.78, emotion: thinking}
  cuts:
  - speaker: ryoushi
    emotion: thinking
    text: で、その箱で魚の分かるとね？
  - speaker: zundamon
    emotion: happy
    text: 海の中が、この紙に写るんです。
  - speaker: kiyotaka
    emotion: normal
    text: スイッチを入れます。
  - speaker: zundamon
    emotion: surprised
    text: ……線が、ぐちゃぐちゃだ。
  - speaker: ryoushi
    emotion: angry
    text: なんね、この落書きは。うちの子の方がまだ上手か。
  - speaker: zundamon
    emotion: thinking
    text: エンジンとスクリューの音まで、拾ってるのだ。
  - speaker: kiyotaka
    emotion: thinking
    text: 船が立てる泡の音も入ってるな。
  - speaker: zundamon
    emotion: surprised
    text: 今、魚みたいな影が出ました！
  - speaker: ryoushi
    emotion: surprised
    text: どこね。[網|あみ]ば入れるか？
  - speaker: zundamon
    emotion: sad
    text: ……雑音に[埋もれて|うもれて]、消えました。
    se: chin
  - speaker: ryoushi
    emotion: angry
    text: 落書きと魚の見分けもつかんなら、網は入れられん。
  - speaker: ryoushi
    emotion: thinking
    text: その箱、[漬物石|つけものいし]にはちょうどよかね。
    beat: true
  - speaker: reimu
    text: この日の試験では、魚を獲るところまでは届きませんでした。
    reading: この ひの しけんでわ、さかなお とる ところまでわ とどきませんでした。
  - speaker: kiyotaka
    emotion: thinking
    text: でも、魚みたいな影は確かに出た。
  - speaker: zundamon
    emotion: thinking
    text: 雑音さえ消せれば、魚は見えるはずなのだ。
- id: ch4_kairyou
  title: ''
  background: fr_kenkyu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 古野清賢, emotion: thinking}
  - {who: kiyotaka, x: 0.7, emotion: thinking}
  cuts:
  - speaker: kiyotaka
    emotion: thinking
    text: 雑音を、どう減らすかだな。
  - speaker: zundamon
    emotion: thinking
    text: 音を出す所を、船の底から突き出して[付けたら|つけたら]どうです？
  - speaker: kiyotaka
    emotion: surprised
    text: 船の底に穴を開けるのか。漁師は嫌がるぞ。
  - speaker: zundamon
    emotion: normal
    text: それでも、やるしかないのだ。
  - speaker: kiyotaka
    emotion: normal
    text: 戻ってくる小さな音を、もっと大きくする仕掛けも要るな。
  - speaker: zundamon
    emotion: happy
    text: 記録紙は、電気が流れると青紫に染まる紙にします。
  - speaker: kiyotaka
    emotion: thinking
    text: 青紫……ヨウ素とでんぷんか。理科の実験だな。
  - speaker: zundamon
    emotion: happy
    text: 海の中の魚が、理科の実験の色で浮かび上がるんです。
  - speaker: reimu
    text: 使った音は14.5キロヘルツ。最初の試験より、雑音はぐっと減りました。
    reading: つかった おとわ じゅうよん てん ご きろへるつ。さいしょの しけんより、ざつおんわ ぐっと へりました。
- id: card1948
  title: ''
  background: fr_card_1948
  cuts:
  - speaker: reimu
