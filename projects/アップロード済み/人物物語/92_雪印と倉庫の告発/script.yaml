meta:
  title: 雪印食品の牛肉偽装を告発した倉庫は、荷物の9割を失った【ずんだもん解説】
  slug: snowbrand-mizutani
  summary: 2002年1月、兵庫県西宮市の冷蔵倉庫で、社長が新聞記者の前で箱を開けました。国産と書かれた箱の中身は、輸入の牛肉。取引先だった雪印食品の偽装を、倉庫の社長・水谷洋一が告発したのです。その1年半前には、親会社の雪印乳業が集団食中毒を起こしていました。情報が上に上がらない大きな組織と、取引先の小さな倉庫。告発のあと、倉庫に何が起きたのか。国と本人の言い分を並べて、再現ドラマでたどります。
  tags:
  - 雪印
  - 西宮冷蔵
  - 水谷洋一
  - 雪印食品
  - 雪印乳業
  - 牛肉偽装
