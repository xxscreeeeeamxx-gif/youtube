    emotion: normal
    text: 1つ目は、記録を残すこと。
  - speaker: tsumugi
    emotion: normal
    text: '[西宮冷蔵|にしのみやれいぞう]の担当の社員は、指示された日のことを[備忘録|びぼうろく]に書いてたの。'
  - speaker: tsumugi
    emotion: normal
