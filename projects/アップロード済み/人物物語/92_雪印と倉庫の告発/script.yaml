scenes:
# ---- 先出し（2002年1月23日の冷凍倉庫） ----
- id: co_kaiken
  title: ''
  background: sb_soko
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 水谷洋一, emotion: normal}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2002年1月。兵庫県西宮市の冷蔵倉庫に、新聞記者たちが集められます。
    reading: にせんにねん いちがつ。ひょうごけん にしのみやしの れいぞう そうこに、しんぶん きしゃたちが あつめられます。
  - speaker: zundamon
    emotion: normal
    text: この箱を、見てください。国産牛肉用の箱です。
  - speaker: kisha
    emotion: normal
    text: 国産、と書いてありますね。
  - speaker: zundamon
    emotion: normal
    text: 私どもの知るところ、これはオーストラリアの牛肉でございます。
    beat: true
  - speaker: kisha
    emotion: surprised
    text: 中身が、違う……。
  - speaker: reimu
    text: 告発したこの倉庫の社長は、このあと、荷物の9割を失います。なぜでしょうか。
    reading: こくはつした この そうこの しゃちょうわ このあと、にもつの きゅうわりお うしないます。なぜ でしょうか。
# ---- 茶番（今の部屋） ----
- id: hook
  title: ''
  background: sb_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 冷蔵庫の奥のずんだ餅、期限が先週なのだ……。
  - speaker: zundamon
    emotion: normal
    text: ……そっと戻しとこ。
  - speaker: tsumugi
    emotion: angry
    text: 今、黙って戻したよね。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: 見たのに黙る人と、言う人。言った人がどうなったか、知ってる？
  - speaker: zundamon
    emotion: happy
    text: 褒められる！
  - speaker: tsumugi
    emotion: thinking
    text: 牛肉の偽装を新聞に話した倉庫は、国から営業停止を受けたの。
  - speaker: zundamon
    emotion: surprised
    text: 話したのに、止められたのだ！？
# ---- 1995年 震災と雪印食品 ----
- id: card1995
  title: ''
  background: sb_card_1995
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1995年1月17日、阪神・淡路大震災。西宮市の[西宮浜|にしのみやはま]にある、1937年創業の冷蔵倉庫です。
    reading: せんきゅうひゃく きゅうじゅうごねん いちがつ じゅうしちにち、はんしん あわじ だいしんさい。にしのみやしの にしのみやはまに ある せんきゅうひゃく さんじゅうななねん そうぎょうの れいぞう そうこです。
  - speaker: reimu
    text: 西宮冷蔵。社長は3代目の、[水谷洋一|みずたによういち]です。
    reading: にしのみや れいぞう。しゃちょうわ さんだいめの みずたに よういちです。
- id: ch1_sanran
  title: 震災のあとの倉庫
  background: sb_soko_sanran
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 水谷洋一, emotion: surprised}
  - {who: ouen, x: 0.52, emotion: happy}
  - {who: leader, x: 0.80, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 荷物が、全部崩れとる……。
  - speaker: zundamon
    emotion: thinking
    text: どれが誰の荷物か、もう分からへん。
  - speaker: ouen
    emotion: happy
    text: '[西宮冷蔵|にしのみやれいぞう]さん！ 雪印食品です！'
  - speaker: zundamon
    emotion: surprised
    text: 雪印さん！？
  - speaker: ouen
    emotion: happy
    text: 東京の本社から、応援に来ました！
  - speaker: zundamon
    emotion: surprised
    text: 東京から！？ 遠いとこ、すんません。
  - speaker: ouen
    emotion: normal
    text: うちの荷物も、この中ですから。
  - speaker: leader
    emotion: normal
    text: '[水谷|みずたに]社長。片付けは、私らに任せてください。'
  - speaker: reimu
    text: 水谷の話では、応援部隊を率いたのは、のちの関西ミートセンター長です。
    reading: みずたにの はなしでわ おうえん ぶたいお ひきいたのわ、のちの かんさい みーと せんたーちょうです。
  - speaker: zundamon
    emotion: happy
    text: ほんまに、おおきに。
  - speaker: ouen
    emotion: sad
    text: 5000トン入る倉庫が、こんなことに……。
  - speaker: zundamon
    emotion: sad
    text: 92年に、建てたばっかりやのに。
  - speaker: leader
    emotion: normal
    text: 箱の印で、荷主ごとに分けましょう。
  - speaker: zundamon
    emotion: happy
    text: 助かります。ほな、こっちの山から。
  - speaker: ouen
    emotion: happy
    text: よいしょ。積み直しました！
  - speaker: zundamon
    emotion: surprised
    text: 高い高い！ そんなに積んだら、また崩れる！
  - speaker: ouen
    emotion: surprised
    text: ……崩れました。
    se: zukko
  - speaker: leader
    emotion: thinking
    text: 低う積むんが、基本や。
  - speaker: ouen
    emotion: sad
    text: ……はい。
  - speaker: zundamon
    emotion: normal
    text: 冷凍の部屋は寒いんで、上着を着てってください。
  - speaker: ouen
    emotion: surprised
    text: さ、さむっ！ 箱が、手にくっつく！
  - speaker: zundamon
    emotion: normal
    text: 手袋も、どうぞ。
  - speaker: ouen
    emotion: sad
    text: 雪印なのに、寒さに弱いんです。
  - speaker: zundamon
    emotion: happy
    text: 名前負けや。
    beat: true
# ---- 第1部 2000年 雪印乳業の集団食中毒 ----
- id: card2000
  title: ''
  background: sb_card_2000
  bgm: serious
  cuts:
  - speaker: reimu
    text: 2000年3月31日。雪印食品の親会社、雪印乳業の北海道の[大樹|たいき]工場です。
    reading: にせんねん さんがつ さんじゅういちにち。ゆきじるし しょくひんの おやがいしゃ、ゆきじるし にゅうぎょうの ほっかいどうの たいき こうじょうです。
- id: p1_teiden
  title: 大樹工場の停電
  background: sb_kojo
  stage:
  - {who: kacho, x: 0.5, emotion: normal}
  cuts:
  - speaker: kacho
    emotion: normal
    text: 温めた生乳を、分離機にかけます。
  - speaker: kacho
    emotion: surprised
    text: 停電だ！ 午前10時57分！
    background: sb_kojo_teiden
  - speaker: kacho
    emotion: surprised
    text: 氷の塊が落ちて、電気室の屋根に穴が！
  - speaker: kacho
    emotion: thinking
    text: 工場が、全部止まった……。
  - speaker: kacho
    emotion: thinking
    text: 温めた生乳が、機械とタンクの中で止まったままだ。
  - speaker: kacho
    emotion: normal
    text: ……やっと戻った。3時間か。
  - speaker: reimu
    text: タンクの乳の一部は約40℃のまま、9時間以上冷やされずに置かれました。
    reading: たんくの にゅうの いちぶわ やく よんじゅうどの まま、くじかん いじょう ひやされずに おかれました。
  - speaker: kacho
    emotion: normal
    text: 北海道支社ですか。[大樹|たいき]工場で、停電がありました。
  - speaker: kacho
    emotion: thinking
    text: ……はい。指示は、特に無しですね。
  - speaker: reimu
    text: 課長は当日、支社に電話で報告しました。ただ具体的な指示はなく、話は引き継がれませんでした。
    reading: かちょうわ とうじつ ししゃに でんわで ほうこく しました。ただ ぐたいてきな しじわ なく、はなしわ ひきつがれませんでした。
- id: p1_daijobu
  title: 殺菌すれば大丈夫
  background: sb_kojo
  cuts:
  - speaker: reimu
    text: 停電の翌日の脱脂粉乳は、細菌が国の基準を超えていました。4月10日、うち449袋が粉に作り直されます。
    reading: ていでんの よくじつの だっし ふんにゅうわ、さいきんが くにの きじゅんお こえて いました。しがつ とおか、うち よんひゃく よんじゅうきゅう ふくろが こなに つくりなおされます。
  - speaker: reimu
    text: 北海道の発表では、工場は殺菌すれば大丈夫と考えていました。停電の手順書も、ありませんでした。
    reading: ほっかいどうの はっぴょうでわ、こうじょうわ さっきん すれば だいじょうぶと かんがえて いました。ていでんの てじゅんしょも ありませんでした。
- id: p1_kaisetsu
  title: 菌は死んでも毒は残る
  background: sb_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 殺菌したなら、大丈夫じゃないの？
  - speaker: tsumugi
    emotion: thinking
    text: 菌は、熱で死ぬの。でも菌が出した毒素は、熱では消えないの。
  - speaker: zundamon
    emotion: surprised
    text: 死んだのに、毒だけ残る！？
  - speaker: tsumugi
    emotion: normal
    text: ペンで、ノートに字を書いたとするね。
  - speaker: tsumugi
    emotion: normal
    text: そのペンを壊しても、書いた字は消えないでしょ。
  - speaker: zundamon
    emotion: thinking
    text: 菌がペンで、毒素が字……。
  - speaker: tsumugi
    emotion: normal
    text: そう。粉を溶かして熱をかけ直しても、字は残ったままなの。
  - speaker: tsumugi
    emotion: thinking
    text: 当時の現場は、菌がなければ毒素はないと考えていたって。
  - speaker: tsumugi
    emotion: thinking
    text: 雪印の幹部が、あとでそう話してるわ。
  - speaker: zundamon
    emotion: thinking
    text: 菌を調べて、いなければ安心……。
  - speaker: tsumugi
    emotion: thinking
    text: 誰か一人の悪意じゃなくて、現場の思い込みだったのね。
  - speaker: tsumugi
    emotion: thinking
    text: 毒素がどこでできたかは、最終報告でも決まってないの。
  - speaker: zundamon
    emotion: thinking
    text: 停電の日の生乳が、粉になって……。
  - speaker: tsumugi
    emotion: thinking
    text: その粉が、6月20日に大阪工場へ届くの。
  - speaker: zundamon
    emotion: thinking
    text: 大阪で、何に使われたの？
  - speaker: tsumugi
    emotion: thinking
    text: '[低脂肪乳|ていしぼうにゅう]などの原料よ。'
- id: p1_todokede
  title: 6月27日の届け出
  background: sb_yakusho
  bgm: serious
  cuts:
  - speaker: reimu
    text: 6月27日の午前。低脂肪乳を飲んで嘔吐や下痢などの食中毒の症状が出ている、と大阪市に届け出が入ります。
    reading: ろくがつ にじゅうしちにちの ごぜん。ていしぼうにゅうお のんで おうとや げりなどの しょくちゅうどくの しょうじょうが でて いると、おおさかしに とどけでが はいります。
- id: p1_sapporo
  title: 札幌の株主総会の日
  background: sb_kaigi
  stage:
  - {who: torishimari, x: 0.28, flip: true, emotion: normal}
  - {who: kojocho, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 6月28日。役員の多くは、株主総会で札幌にいました。雪印の社内報告には、こんな電話が残っています。
    reading: ろくがつ にじゅうはちにち。やくいんの おおくわ、かぶぬし そうかいで さっぽろに いました。ゆきじるしの しゃない ほうこくにわ、こんな でんわが のこって います。
  - speaker: torishimari
    emotion: normal
    text: 大阪工場長か。[低脂肪乳|ていしぼうにゅう]の苦情の件は、どうなってる。
  - speaker: kojocho
    emotion: normal
    text: お客様からの苦情は入っていない。製品検査は全てＯＫである。
  - speaker: kojocho
    emotion: normal
    text: 微生物検査に異常は見られない。
  - speaker: reimu
    text: 工場長はこのとき別の会議中で、保健所の立ち入りしか知りませんでした。
    reading: こうじょうちょうわ このとき べつの かいぎちゅうで、ほけんじょの たちいりしか しりませんでした。
  - speaker: torishimari
    emotion: normal
    text: ……そうか。
  - speaker: torishimari
    emotion: thinking
    text: 夕方の時点で、苦情は7件か。
  - speaker: torishimari
    emotion: thinking
    text: 1日に約7万本を作る中の、7件……。
  - speaker: torishimari
    emotion: thinking
    text: 期限も場所も、ばらばら。出荷の検査も、異常なし。
  - speaker: reimu
    text: 役員たちは、製造の工程が原因とは判断しません。社長の[石川哲郎|いしかわてつろう]は、この日、何も知らされていませんでした。
    reading: やくいんたちわ、せいぞうの こうていが げんいんとわ はんだん しません。しゃちょうの いしかわ てつろうわ このひ、なにも しらされて いませんでした。
- id: p1_shinya
  title: 深夜の協議
  background: sb_yakusho
  stage:
  - {who: hokenjo, x: 0.28, flip: true, emotion: normal}
  - {who: kojocho, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 同じ日の夜10時45分。大阪市の保健所で、工場長との協議が始まります。
    reading: おなじ ひの よる じゅうじ よんじゅうごふん。おおさかしの ほけんじょで、こうじょうちょうとの きょうぎが はじまります。
  - speaker: hokenjo
    emotion: normal
    text: 製品の自主回収と、新聞の[社告|しゃこく]。両方をお願いします。
  - speaker: kojocho
    emotion: thinking
    text: 自主回収については了解するが、[社告|しゃこく]掲載については社内で検討させてほしい。
  - speaker: hokenjo
    emotion: surprised
    text: 社内で、検討……。
  - speaker: hokenjo
    emotion: thinking
    text: ……もう、夜中の1時を回りましたよ。
  - speaker: reimu
    text: 専務は勧告ならやむを得ないとしつつ、原因不明のうちのお詫び広告には納得できませんでした。
    reading: せんむわ かんこくなら やむお えないと しつつ、げんいん ふめいの うちの おわび こうこくにわ なっとく できませんでした。
- id: p1_kuko
  title: 千歳空港で知る社長
  background: sb_kuko
  stage:
  - {who: shacho, x: 0.28, flip: true, emotion: normal}
  - {who: hinsho, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 6月29日の午前10時半ごろ。帰京のため千歳空港にいた社長に、初めて報告が届きます。
    reading: ろくがつ にじゅうくにちの ごぜん じゅうじはん ごろ。ききょうの ため ちとせ くうこうに いた しゃちょうに、はじめて ほうこくが とどきます。
  - speaker: hinsho
    emotion: thinking
    text: 社長。大阪工場の[低脂肪乳|ていしぼうにゅう]で、食中毒の疑いが出ています。
  - speaker: hinsho
    emotion: thinking
    text: 保健所から、回収と[社告|しゃこく]を求められました。
  - speaker: reimu
    text: 会社が知ってから、約1日後のことでした。社長はのちに、会見でこう話しています。
    reading: かいしゃが しってから やく いちにちごの ことでした。しゃちょうわ のちに、かいけんで こう はなして います。
  - speaker: shacho
    emotion: thinking
    text: 私が知っていれば、素早く対応できたかも。
- id: p1_kimi
  title: 会見で初めて知った事実
  background: sb_kaiken
  stage:
  - {who: shacho, x: 0.28, flip: true, emotion: normal}
  - {who: kojocho, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 7月1日。雪印の記者会見で、質疑の途中に大阪工場長が話し始めます。
    reading: しちがつ ついたち。ゆきじるしの きしゃ かいけんで、しつぎの とちゅうに おおさか こうじょうちょうが はなしはじめます。
  - speaker: kojocho
    emotion: normal
    text: 29日のバルブに[乳固形物|にゅうこけいぶつ]が見つかり、大きさは[十円玉|じゅうえんだま]ぐらい。
