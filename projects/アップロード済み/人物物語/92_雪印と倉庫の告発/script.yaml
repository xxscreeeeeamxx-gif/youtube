  - speaker: tsumugi
    emotion: thinking
    text: 泥棒を突き出したら、突き出した本人が逮捕されてしまったというかのごとき事案。
  - speaker: zundamon
    emotion: surprised
    text: 泥棒を突き出した人が、止められる！？
  - speaker: tsumugi
    emotion: normal
