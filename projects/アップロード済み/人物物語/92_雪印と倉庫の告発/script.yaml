# ---- 現代の章 ----
- id: gendai
  title: 今の雪印メグミルク
  background: sb_gendai
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 今の[雪印メグミルク|ゆきじるしめぐみるく]は、事件を起こした雪印乳業や雪印食品とは別の会社よ。
  - speaker: tsumugi
    emotion: normal
    text: 2009年に、雪印乳業と[日本ミルクコミュニティ|にほんミルクコミュニティ]が作った会社なの。
  - speaker: zundamon
    emotion: thinking
    text: 別の会社なら、事件は関係ないの？
  - speaker: tsumugi
    emotion: normal
    text: 会社は、2つの事件を自分たちの歴史として説明してるわ。
  - speaker: tsumugi
    emotion: normal
    text: 毎年6月と1月に、食の責任を誓う日の活動を続けてるの。2025年度で46回よ。
  - speaker: zundamon
    emotion: thinking
    text: 6月と、1月……。
  - speaker: zundamon
    emotion: surprised
    text: 食中毒が6月で、偽装の記事が出たのが1月！
    se: hirameki
  - speaker: tsumugi
    emotion: normal
    text: 6月は、事件の映像を見て振り返るんだって。
  - speaker: zundamon
    emotion: thinking
    text: 毎年、見るの？
  - speaker: tsumugi
    emotion: normal
    text: 毎年よ。
  - speaker: tsumugi
    emotion: normal
    text: '[HACCP|ハサップ]に沿った衛生管理は、2021年から原則すべての食品事業者の決まりよ。'
  - speaker: zundamon
    emotion: thinking
    text: ハサップ？
  - speaker: tsumugi
    emotion: normal
    text: 食品の工場の、衛生管理のやり方よ。
  - speaker: tsumugi
    emotion: thinking
    text: 実は雪印乳業の大阪工場も、[HACCP|ハサップ]で国の承認を受けた工場だったの。
  - speaker: tsumugi
    emotion: thinking
    text: でも工程を無断で変えていたとして、事件のあと取り消されたわ。
  - speaker: zundamon
    emotion: surprised
    text: 承認があっても、守らなきゃ意味ないのか。
  - speaker: tsumugi
    emotion: happy
    text: '[雪印メグミルク|ゆきじるしめぐみるく]の売上は、2026年3月期で6157億円よ。'
  - speaker: zundamon
    emotion: surprised
    text: 6000億円超え！？
