  - speaker: tsumugi
    emotion: angry
    text: そこは、言い切れないの。
    se: hammer
  - speaker: tsumugi
    emotion: normal
    text: 政府が出した提案の理由には、雪印の名前は出てこないのよ。
  - speaker: zundamon
    emotion: thinking
    text: ふーん。でも、守られはするんでしょ？
  - speaker: tsumugi
    emotion: thinking
    text: 守られるのは、働く人。取引先の会社そのものは、対象外なの。
  - speaker: zundamon
    emotion: surprised
    text: '[西宮冷蔵|にしのみやれいぞう]って、取引先じゃん！'
  - speaker: tsumugi
    emotion: thinking
    text: 国会でも、[西宮冷蔵|にしのみやれいぞう]のような弱い立場の取引事業者は保護されないと言われてたわ。
  - speaker: zundamon
    emotion: thinking
    text: 今は？
  - speaker: tsumugi
    emotion: normal
    text: 2020年の改正で、やめて1年以内の人や役員が加わったわ。
  - speaker: tsumugi
    emotion: normal
    text: 2025年の改正では、仕事を請け負うフリーランスも加わるの。
  - speaker: tsumugi
    emotion: thinking
    text: でも取引先の会社そのものが加わったとは、読めないの。
- id: ronso_b
  title: ''
