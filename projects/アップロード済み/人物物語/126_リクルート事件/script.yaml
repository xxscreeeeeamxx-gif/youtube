# ---- 論争1：正反対の2つの俗説（どちらとも言わない） ----
- id: ronso1
  title: ネットの2つの説
  background: ez_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ 江副は株で国を動かそうとした黒幕だって！
  - speaker: tsumugi
    emotion: normal
    text: 判決は、大がかりな疑獄事件の首謀者と言ったわ。
  - speaker: tsumugi
    emotion: normal
    text: 4つのルートで起訴された12人は、全員の有罪が確定してる。
  - speaker: zundamon
    emotion: happy
    text: やっぱりなのだ！
  - speaker: zundamon
    emotion: surprised
    text: でも別のサイトには、検察が作った冤罪だって……。
  - speaker: tsumugi
    emotion: normal
    text: 本人は法廷で、ずっと無罪を訴えたの。
  - speaker: tsumugi
    emotion: thinking
    text: '初公判から、取り調べのやり方を問い続けたわ。'
  - speaker: tsumugi
    emotion: normal
    text: 判決の日には日弁連が、取り調べの録音と録画を求める声明を出したの。
  - speaker: zundamon
    emotion: angry
    text: どっちが本当なの！？ はっきりしてほしいのだ！
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 判決は、彼が中心だったと認めた。彼は、取り調べがゆがめたと言い続けた。
  - speaker: tsumugi
    emotion: normal
    text: そして取り調べはその後、録画する方向へ進んだの。
  - speaker: zundamon
    emotion: thinking
    text: 白か黒かより、記録が残るほうへ……。
    beat: true
# ---- 論争2：買った株が、なぜ賄賂？ ----
- id: ronso2
  title: 買った株がなぜ賄賂？
  background: ez_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: でも、株は3000円で買ってるのだ！ なんで賄賂なの？
  - speaker: tsumugi
    emotion: normal
    text: タダでもらったわけじゃない。そこは本当よ。
    se: hammer
  - speaker: tsumugi
    emotion: thinking
    text: でもお[金|かね]も貸してもらえて、1か月後に上がることがほぼ分かっていた。
  - speaker: tsumugi
    emotion: normal
    text: 判決は、公開のあとに見込まれる利益が賄賂の中身になるとしたの。
  - speaker: tsumugi
    emotion: normal
    text: 普通の人が手に入れるのは、極めて困難だったともね。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、1984年の1200円の株は？
  - speaker: tsumugi
    emotion: normal
    text: 公開の1年10か月前。検察は、罪の疑いを認めなかったわ。
  - speaker: tsumugi
    emotion: normal
    text: それに1986年に株を受けた国会議員も、多くは罪に問われていないの。
  - speaker: zundamon
    emotion: surprised
    text: 同じ株なのに！？
  - speaker: tsumugi
    emotion: normal
    text: 頼みごとに応えられる仕事についていたか。そこも分かれ目だったの。
  - speaker: tsumugi
    emotion: thinking
    text: 官房長官への頼みは、国の役所も就職協定に沿って採用してほしいというもの。
  - speaker: tsumugi
    emotion: normal
    text: 最高裁は、それが官房長官の仕事の範囲だと認めたの。
  - speaker: zundamon
    emotion: thinking
    text: いつ、誰に渡したかなのだ……。
    beat: true
# ---- 本当の注意点 ----
- id: chui
  title: 本当の注意点
  background: ez_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 上場間近。値上がり確実。あなただけに特別に。
  - speaker: tsumugi
    emotion: thinking
    text: そう誘ってくる未公開株は、まず疑うこと。
    telops:
    - {text: "未公開株の誘いは まず疑う", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: ボクのメールなのだ！
    se: gaan
  - speaker: tsumugi
    emotion: normal
    text: 金融庁によると、未公開株を売れるのは発行した会社か登録を受けた証券会社だけ。
  - speaker: tsumugi
    emotion: normal
    text: その証券会社も、原則として勧誘できないの。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、知らない人からのメールは……。
  - speaker: tsumugi
    emotion: normal
    text: 本当に上場するなら、金融庁の[EDINET|エディネット]に届け出が出るわ。
  - speaker: zundamon
    emotion: normal
    text: 届け出を、確かめる。
  - speaker: tsumugi
    emotion: normal
    text: 次に、お[金|かね]も貸しますという話。1986年も株券を見ずにサインした人がいたわ。
  - speaker: tsumugi
    emotion: thinking
    text: 借りて買った株が下がったら、借金だけが残るの。
  - speaker: zundamon
    emotion: sad
    text: 上がる話しか、聞いてなかったのだ……。
  - speaker: tsumugi
    emotion: normal
    text: それから、タダのものは誰かが払ってる。
  - speaker: tsumugi
    emotion: normal
    text: タダの求人の本も、載せる会社のお[金|かね]で作られてたでしょ。
