    emotion: normal
    text: ああ。だが借金は、うちが自分で返した。
  - speaker: shain
    emotion: happy
    text: 返したのは、情報誌の稼ぎですね。
  - speaker: bucho
    emotion: normal
    text: タダで配る本から始まった、うちの商売のな。
