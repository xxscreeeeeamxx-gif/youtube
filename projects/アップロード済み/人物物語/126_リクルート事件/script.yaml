meta:
  title: 「軽い気持ちで株式を持っていただいた」と国会で語ったリクルート創業者、69日後に逮捕【ずんだもん解説】
  slug: recruit-ezoe
  hook_line: 1株3000円で渡した未公開株は、なぜ内閣まで揺るがしたのか。
  summary: 1988年11月、リクルートの創業者・江副浩正は、入院先の病院から国会の証人席に立ちました。屋上の2坪半で始めた、学生にタダで配る求人の本の会社は、なぜ国の決まりに左右される会社になり、子会社の未公開株を、買うお金まで貸して渡したのか。国会の証言の原文、法務省の捜査の報告、最高裁の決定と判決の報道をもとに、起訴された人とされなかった人を分けて、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 衆議院 リクルート問題に関する調査特別委員会 第2号（1988年11月21日・証人喚問） https://kokkai.ndl.go.jp/txt/111303813X00219881121
  - 参議院 税制問題等に関する調査特別委員会 第5号（1988年12月6日・証人喚問） https://kokkai.ndl.go.jp/txt/111314585X00519881206
  - 衆議院 予算委員会 第17号（1989年6月12日・法務大臣による捜査終了の報告） https://kokkai.ndl.go.jp/txt/111405261X01719890612
  - 最高裁判所第一小法廷 決定（1999年10月20日・受託収賄被告事件） https://www.courts.go.jp/hanrei/50398/detail2/index.html
  - 金融庁「未公開株購入の勧誘にご注意！」 https://www.fsa.go.jp/ordinary/mikoukai/index.html
  - リクルートホールディングス「2027年3月期第2四半期（中間期）決算短信」（2026年11月11日） https://file.recruit-holdings.com/files/ja/Recruit_202703Q2_earnings_jp.pdf
