scenes:
# ---- 先出し（1988年11月21日・衆院リクルート特委の証人喚問。言葉はすべて会議録の原文。笑いの SE なし） ----
- id: co_kokkai
  title: ''
  background: ez_kokkai
  bgm: serious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 江副浩正, emotion: sad}
  - {who: iincho, x: 0.52, emotion: normal}
  - {who: giin, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1988年11月21日、国会。リクルートの創業者、江副浩正52歳。入院先の病院から証人席に来ました。
    reading: せんきゅうひゃく はちじゅうはちねん じゅういちがつ にじゅういちにち、こっかい。りくるーとの そうぎょうしゃ えぞえ ひろまさ ごじゅうにさい。にゅういんさきの びょういんから しょうにんせきに きました。
  - speaker: iincho
    emotion: normal
    text: これより江副浩正君の証言が終了するまで、撮影は中止してください。
  - speaker: zundamon
    emotion: sad
    text: 良心に[従つて|したがって]、真実を述べ、何事もかくさず、又、何事もつけ加えないことを誓います
  - speaker: giin
    emotion: normal
    text: 株を渡した民間の人の名前を、ここで言ってください。
  - speaker: zundamon
    emotion: sad
    text: これ以上私の口からお名前を申し上げることは、
  - speaker: zundamon
    emotion: sad
    text: どうかその点、その一点に関してはお許しいただきたい
  - speaker: reimu
    text: 何事もかくさず、と誓った3か月足らずのち、彼は贈賄で逮捕されます。裁判は、13年続きました。
    reading: なにごとも かくさずと ちかった さんかげつ たらずのち、かれわ ぞうわいで たいほ されます。さいばんわ じゅうさんねん つづきました。
# ---- 今の部屋（あなただけに特別に、のメール） ----
- id: hook
  title: ''
  background: ez_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: メールなのだ！ 上場間近の株を、あなただけに特別に！
    se: jaan
  - speaker: tsumugi
    emotion: thinking
    text: それ、詐欺でよく使う誘い文句よ。
    beat: true
  - speaker: zundamon
    emotion: normal
    text: でも、本当に上がったら？
  - speaker: tsumugi
    emotion: normal
    text: 昔、本当に上がった株をお[金|かね]まで貸して政治家や役人に渡した会社があるの。
  - speaker: tsumugi
    emotion: normal
    text: 求人の本の会社よ。内閣まで揺れたわ。
    telops:
    - {text: "求人の本の会社が なぜ内閣を揺るがした？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 求人の本の会社が、なんで内閣を揺るがしたのだ！？
# ---- 1960〜1962年・屋上の2坪半から、タダの本へ ----
- id: card1960
  title: ''
  background: ez_card_1960
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1960年の春。東大を出る23歳の江副は、自分の会社を始めます。
    reading: せんきゅうひゃく ろくじゅうねんの はる。とうだいお でる にじゅうさんさいの えぞえわ、じぶんの かいしゃお はじめます。
- id: ch1_okujo
  title: 屋上の2坪半
  background: ez_okujo
  stage:
  - {who: zundamon, x: 0.5, tag: 江副浩正, emotion: happy}
  cuts:
  - speaker: reimu
    text: 東京・西新橋のビルの屋上。2坪半の部屋で、大学新聞に載せる求人の広告を集めます。
    reading: とうきょう にししんばしの びるの おくじょう。につぼはんの へやで、だいがく しんぶんに のせる きゅうじんの こうこくお あつめます。
  - speaker: zundamon
    emotion: happy
    text: もしもし。大学新聞に、求人の広告を載せませんか。
  - speaker: zundamon
    emotion: sad
    text: ……切られた。
    beat: true
- id: ch1_hon
  title: ''
  background: ez_henshu
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.5, tag: 江副浩正, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1962年。求人の広告だけでできた本を作ります。学生には、タダで配る本です。
    reading: せんきゅうひゃく ろくじゅうにねん。きゅうじんの こうこく だけで できた ほんお つくります。がくせいにわ ただで くばる ほんです。
  - speaker: zundamon
    emotion: happy
    text: お[金|かね]は載せる会社からいただく。学生は、タダで読める。
  - speaker: zundamon
    emotion: surprised
    text: ……載せる会社が増えるほど、本が厚くなる。
    background: ez_henshu_yama
    se: zukko
  - speaker: reimu
    text: その厚さから、電話帳と呼ばれた本。この男がなぜ、26年後に国会の証人席に立つのか。
    reading: その あつさから、でんわちょうと よばれた ほん。この おとこが なぜ にじゅうろくねんごに こっかいの しょうにんせきに たつのか。
# ---- 国の決まりで商売が決まる会社（励ます会の末席） ----
- id: ch2_party
  title: 秘書の隣の席
  background: ez_party
  stage:
  - {who: zundamon, x: 0.5, flip: true, tag: 江副浩正, emotion: happy}
  - {who: hisho, x: 0.76, emotion: happy}
  cuts:
  - speaker: reimu
    text: 会社が大きくなると、政治家と知り合う場も増えます。たいていは、励ます会や囲む会でした。
    reading: かいしゃが おおきく なると、せいじかと しりあう ばも ふえます。たいていわ はげます かいや かこむ かいでした。
  - speaker: hisho
    emotion: happy
    text: '江副さん、今日もお隣ですね。'
  - speaker: zundamon
    emotion: happy
    text: いつも、お世話になっております。
  - speaker: hisho
    emotion: normal
    text: 先生は、今日もあちらの上座です。
  - speaker: reimu
    text: 彼はのちに国会で、こう話しています。
    reading: かれわ のちに こっかいで、こう はなして います。
  - speaker: zundamon
    emotion: normal
    text: 末席に座りますと秘書の隣に私が席を置くというケースが多うございまして、
  - speaker: zundamon
    emotion: normal
    text: 御本人よりも秘書の方が親しいというケースもございますし、
- id: heya1
  title: ''
  background: ez_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 秘書と仲良くするのが、そんなに大事なのだ？
  - speaker: tsumugi
    emotion: normal
    text: この会社の商売は、国の決まりで大きく変わるの。
  - speaker: tsumugi
    emotion: normal
    text: まず、学生の採用を何月から始めるかを決める就職協定。
  - speaker: tsumugi
    emotion: normal
    text: 求人の本を配る時期は、それで決まるわ。
  - speaker: zundamon
    emotion: surprised
    text: 本を配る日まで、決まりしだい！？
  - speaker: tsumugi
    emotion: normal
    text: 就職情報誌そのものへの規制。[NTT|エヌティーティー]の回線とスーパーコンピューター。[安比高原|アッピコウゲン]の開発。
  - speaker: tsumugi
    emotion: thinking
    text: 法務省は、どれも会社の懸案事項だったと報告してるわ。
  - speaker: zundamon
    emotion: thinking
    text: 決まりを作る側に、知り合いがほしくなるね。
  - speaker: tsumugi
    emotion: normal
    text: 八百屋さんが、[市場|いちば]の開く時間を決める人と仲良くしたくなるのと同じね。
    se: hirameki
  - speaker: zundamon
    emotion: normal
    text: 仲良くするだけなら、悪くないよね？
  - speaker: tsumugi
    emotion: thinking
    text: 問題は、仲良くするのに何を渡したかよ。
  - speaker: zundamon
    emotion: surprised
    text: 何を渡したのだ！？
# ---- 1984年12月・つじつまの76人（この分は罪にならなかった） ----
- id: ch3_tsujitsuma
  title: つじつまの76人
  background: ez_shachoshitsu
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 江副浩正, emotion: normal}
  - {who: bucho, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1984年の暮れ、社長室。48歳の江副は、決算の数字を見ていました。
    reading: せんきゅうひゃく はちじゅうよねんの くれ、しゃちょうしつ。よんじゅうはっさいの えぞえわ けっさんの すうじお みて いました。
  - speaker: bucho
    emotion: thinking
    text: 社長、ビルを買って営業外の収支が悪くなりました。
  - speaker: bucho
    emotion: sad
    text: このままだと、減益です。
  - speaker: zundamon
    emotion: normal
    text: 子会社の株を売ろう。
  - speaker: zundamon
    emotion: normal
    text: どうせ店頭に出すには、株主が200人以上いる。
  - speaker: bucho
    emotion: normal
    text: では不動産の子会社の株を、76人に。
    telops:
    - {text: "1984年　1株1200円で76人に", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: bucho
    emotion: happy
    text: 株主づくりにもなりますね。
  - speaker: reimu
    text: 彼はのちに国会で、こう話します。
    reading: かれわ のちに こっかいで、こう はなします。
  - speaker: zundamon
    emotion: normal
    text: 何か資産の売却益でもってつじつまを合わせなければ減益になる
  - speaker: reimu
    text: 値段は、のちの株の単位で1株1200円。国会議員3人もいましたが、検察はのちに罪に問いません。
    reading: ねだんわ、のちの かぶの たんいで ひとかぶ せんにひゃくえん。こっかい ぎいん さんにんも いましたが、けんさつわ のちに つみに といません。
- id: heya_kabu
  title: ''
  background: ez_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 76人に売った株は、罪にならなかったのだ？
  - speaker: tsumugi
    emotion: normal
    text: 株の公開の、1年10か月も前だったからよ。検察はそう判断したの。
  - speaker: tsumugi
    emotion: thinking
    text: でも1年9か月後、同じ会社の株を1株3000円で渡すの。
  - speaker: tsumugi
    emotion: normal
    text: 1万株なら3000万円。そのお[金|かね]も、貸してくれる。
  - speaker: zundamon
    emotion: surprised
    text: 3000万円も借りて、大丈夫なのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 1か月後の初値は5270円。売って3000万円を返しても、2270万円が残るわ。
    telops:
    - {text: "借りて買った1万株　2270万円が残る", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 自分のお[金|かね]を1円も出さずに、2270万円！？
    se: bikkuri
  - speaker: zundamon
    emotion: angry
    text: その3000円の株は、なんで罪になったのだ！？
# ---- 1986年8〜9月・「そのときの思いつき」と3000円 ----
- id: card1986
  title: ''
  background: ez_card_1986
  cuts:
  - speaker: reimu
    text: 1986年8月。子会社リクルートコスモスの株を、店頭に出すことが決まります。
    reading: せんきゅうひゃく はちじゅうろくねん はちがつ。こがいしゃ りくるーと こすもすの かぶお、てんとうに だす ことが きまります。
- id: ch4_omoitsuki
  title: そのときの思いつき
  background: ez_osetsu
  stage:
  - {who: zundamon, x: 0.26, flip: true, tag: 江副浩正, emotion: normal}
  cuts:
  - speaker: reimu
    text: 初めは、子会社に移った社員に株を持たせたい、という話でした。彼はのちに国会で、こう話します。
    reading: はじめわ、こがいしゃに うつった しゃいんに かぶお もたせたいと いう はなしでした。かれわ のちに こっかいで こう はなします。
  - speaker: zundamon
    emotion: normal
    text: ならば、ほかの信頼できる方々にも
  - speaker: zundamon
    emotion: normal
    text: 株式を持って[いただこう|イタダコウ]ではないかとそのときに思いつきまして、
  - speaker: zundamon
    emotion: sad
    text: その範囲を広げてしまった
  - speaker: reimu
    text: 9月。株を受けたNTTの事業部長は、彼からの電話を、のちに国会でこう証言します。
    reading: くがつ。かぶお うけた えぬてぃーてぃーの じぎょうぶちょうわ、かれからの でんわお のちに こっかいで こう しょうげん します。
  - speaker: zundamon
    emotion: normal
    text: 個人的に親しくて社会的に信用が置ける[方|かた]に
  - speaker: zundamon
    emotion: normal
    text: リクルートコスモス株を持っていただくことにしました、
  - speaker: zundamon
    emotion: normal
    text: ついてはあなたにも持っていただきたいと思います、
  - speaker: zundamon
    emotion: normal
    text: 詳細については後でうちの者をやるので
- id: ch4_kinyu
  title: ''
  background: ez_osetsu
  stage:
  - {who: kinyu, x: 0.22, flip: true, emotion: normal}
  cuts:
  - speaker: reimu
    text: 株と融資の話を持って回ったのは、系列の金融会社の社長。文部次官を務めた人は、のちに国会でこう証言します。
    reading: かぶと ゆうしの はなしお もって まわったのわ、けいれつの きんゆう がいしゃの しゃちょう。もんぶ じかんお つとめた ひとわ、のちに こっかいで こう しょうげん します。
  - speaker: kinyu
    emotion: normal
    text: 一株三千円で一万株の購入の御希望があればお世話ができます
  - speaker: kinyu
    emotion: normal
    text: もし御希望であればファーストファイナンス社の方から融資は可能でございます
    beat: true
  - speaker: reimu
    text: お金を借りた人の株券の多くは、担保として、この金融会社が預かりました。
    reading: おかねお かりた ひとの かぶけんの おおくわ、たんぽと して この きんゆう がいしゃが あずかりました。
    background: ez_osetsu_kinko
# ---- 1986年10月30日・初値5270円 ----
- id: ch5_hatsune
  title: 初値5270円
  background: ez_board
  bgm: curious
  stage:
  - {who: shoken1, x: 0.1, flip: true, emotion: normal}
  - {who: shoken2, x: 0.3, flip: true, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1986年10月30日。リクルートコスモスの株が、店頭に出る日です。
    reading: せんきゅうひゃく はちじゅうろくねん じゅうがつ さんじゅうにち。りくるーと こすもすの かぶが、てんとうに でる ひです。
  - speaker: shoken1
    emotion: normal
    text: コスモス株の値段の幅は、4060円から5270円までか。
  - speaker: shoken2
    emotion: normal
    text: 上まで行けば、5270円ですね。
  - speaker: shoken2
    emotion: surprised
