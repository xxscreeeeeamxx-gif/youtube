# recruit-ezoe 読み台帳（人名・地名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている（えぞえ ひろまさ・ふじなみ たかお・ならさき やのすけ など）。
# 名札（tag: 江副浩正 / label: 委員長・議員・秘書・経理部長・金融会社・証券係員・カメラマン・音声係・記者・竹下首相・裁判長・社員）・
# テロップ・章タイトル・meta は表示専用なのでタグを付けていない。
#
# 2026-11-14 台本を書いたあと、セリフ全行を VOICEVOX の audio_query（ずんだもん3・つむぎ8・モブはそれぞれの声）にかけた結果:
# - 江副浩正 / 江副 はタグなしで エゾエ/ヒロマサクンノ・エゾエサン・エゾエ/ショオニンニ・エゾエ/ゼンカイチョオ と正しく読む。
#   発注書どおりカタカナのタグ [江副浩正|エゾエヒロマサ] を付けると エゾエヒロ/マサクンノ と名前の途中で切れた
#   （[江副|エゾエ][浩正|ヒロマサ] でも同じ、ひらがなのタグは エゾ/エヒロマサクン）。
#   なのでセリフではタグを外し、この台帳にも入れていない（入れるとタグが必須になる）。ナレは reading: で えぞえ。
# - 初公判 はタグなしだと ハツコオハン と誤読 → [初公判|しょこうはん] で ショコオハン（2か所）。
# - 「という方」が ホオ と読まれた3か所（信用が置ける方に・という方も・という方が大勢）→ [方|かた] にした
#   （文脈で読みが変わるので台帳には入れていない。「御本人よりも秘書の方が親しい」は比べる意味なので ホオ のまま）。
# - 「目的は何だったんですか」が ナニダッタ → [何|なん]。
# - 「端を発する」が ハシオ/ハッスル → [端|たん] で タンオ/ハッスル。
# - 「バブルが弾けて」が ヒケテ → ひらがなで「はじけて」と書いた。
# - 「持っていただこうではないかと」が イタ/ダコオ と切れた → [いただこう|イタダコウ] で イタダコオデワナイカト。
# - 「従つて」（宣誓書の原文の表記）は [従つて|したがって] で シタガッテ。「又」は マタ、「何事」は ナニゴト とタグなしで読む。
# - 「市場の開く時間」（八百屋のたとえ）は [市場|いちば]。
# - 安比高原 は [安比高原|アッピコウゲン] で アッピコオゲン。NTT は [NTT|エヌティーティー]、EDINET は [EDINET|エディネット]、
#   Indeed は [Indeed|インディード]。
# - 懲役3年 は [懲役3年|ちょうえきさんねん] で チョオエキサンネン。
# - タグなしで正しく読んだので台帳に入れていない語（入れるとタグが要り、抑揚が切れるため）:
#   疑獄（ギゴク）・初値（ハツネ）・未公開株（ミコオカイカブ）・就職協定（シュウショクキョオテエ）・店頭（テントオ）・
#   公判（コオハン）・懸案事項（ケンアンジコオ）・首謀者（シュボオシャ）・癒着（ユチャク）・被疑者（ヒギシャ）・場当たり的（バアタリテキ）・
#   末席（マッセキ）・多うございまして（オオウゴザイマシテ）・毛頭（モオトオ）・見せしめ（ミセシメ）・寝耳に水（ネミミニミズ）・
#   日弁連（ニチベンレン）・二カ月（ニカゲツ）・議会制民主主義（ギカイセエ/ミンシュシュギ）・1兆4000億円（イッチョオ/ヨンセン/オクエン）。
# - 「金」はカネと読ませる所をすべて お[金|かね] にした。
# 2026-11-14 見直し（ez_fix.md）で直した・足したセリフも audio_query にかけた。誤読なし。
#   「これは“見せしめ”だ」は “ ” の前後で ミセシメ、/ダ と切れたので、表示はそのままで [“見せしめ”|みせしめ] にした（ミセシメダ）。
#   上座＝カミザ、率直に＝ソッチョクニ、株数＝カブスウ、手分けして＝テワケシテ、虚偽＝キョギ、強いられた＝シイラレタ。
# - 「宣誓」は台本で使っていない（センセイ＝先生と耳で区別しにくいので「誓いの言葉」と書いた）。
