# daio-igawa 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 井川意高 / label: 井川高雄・佐光社長 ほか）・テロップ・章タイトル・meta は表示専用なのでタグを付けていない。
#
# 書いたときのメモ（voice 前。voice 後に audio_query / moras で確かめること）:
# - 井川意高＝いかわもとたか（本人の公式サイト）。セリフでは「井川さん」「井川様」「井川家」「井川高雄」だけが出る。
#   ひらがなのタグだと イカ/ワサン・イカ/ワケノ と抑揚が切れたので、カタカナのタグにした（[井川|イカワ] / [井川家|イカワケ] / [井川高雄|イカワタカオ]）。
#   [井川|いかわ]様 は イカワ/ヨオ（様＝ヨウ）と誤読されたので [井川|イカワ]様 にした（イカワサマ）。
# - 見直しで見つかった誤読：「同じ人」＝ドオジジン → [同じ人|オナジヒト]（前後で読みが変わるので辞書でなくタグ）、「行った」＝イッタ → [行った|おこなった]（カタカナの [行った|オコナッタ] は オ/コナッタモノデアリ と切れたので、ここだけひらがな。ひらがなは オコナッタ/モノデアリ と1語で読む）。
# - 佐光正義＝さこうまさよし（大王製紙の2020年12月の適時開示のよみがな。検索の要約で確認）。声に出るのはナレだけ。
# - 特別背任 は読みに「は」を含むので、セリフでは [特別背任|とくべつハイニン] と「は」をカタカナにした。ナレは reading: で とくべつ はいにん。
# - 「至急×億円」の × は本人の著書の伏せ字。[×|マルマル] で「まるまるおくえん」と読ませる。
# - audio_query（2026-11-14）で確かめた：つけ得れば＝ツケエレバ、任務違背＝ニンムイハイ、敢行＝カンコオ、甚だしく＝ハナハダシク、紀州製紙＝キシュウセエシ、6月末・9月末・3月末＝ガツマツ、[×|マルマル]＝マルマル。どれもタグなしで正しい。
# - 「金」はカネと読ませる所を お[金|かね] にした（3か所）。父の台詞の「カネ」は著書どおりカタカナ。
