meta:
  title: 「まだ大丈夫だから、もう少し続けてみるよ」大王製紙の3代目は子会社から106億円を借りた【ずんだもん解説】
  slug: daio-igawa
  hook_line: ティッシュの会社の3代目は、なぜ自分の子会社から106億円も借りられたのか。
  summary: 2011年ごろ、シンガポールのカジノ。テーブルのチップが20億円になっても、大王製紙の創業家の3代目、井川意高は「まだ大丈夫だから」と賭けを続けました。お金を貸す7社の会長も、借りる人も、同じ1人。電話1本、担保なしで動いたお金を、なぜ誰も止めなかったのか。父に問われて答えた「FXです」、子会社からの1通の業務メール、そして法廷へ。特別調査委員会の報告書と判決の報道、本人の著書をもとに、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 大王製紙株式会社元会長への貸付金問題に関する特別調査委員会「調査報告書」（2011年10月27日） https://www.daio-paper.co.jp/wp-content/uploads/n231020a.pdf
  - 大王製紙「元会長への貸付金問題に対する再発防止策に関するお知らせ」（2011年12月14日） https://www.daio-paper.co.jp/wp-content/uploads/n231214c.pdf
  - 北越コーポレーション「大王製紙株式の追加取得について」（2019年12月26日） https://www.hokuetsucorp.com/pdf/OSIRASE/20191226_release01.pdf
  - カジノ管理委員会事務局「ＩＲ整備法におけるカジノ行為に対する依存防止対策の概要」（2026年7月17日） https://www.cas.go.jp/jp/seisakukaigi/gambletou_izonsho/kaigi/dai19/shiryo2.pdf
  - 日本経済新聞「『ほとんどカジノで使った』大王製紙前会長が謝罪文」（2011年11月22日） https://www.nikkei.com/article/DGXNASFK22010_S1A121C1000000/
  - 日本経済新聞「大王前会長、二審も実刑 東京高裁『公私を混同』」（2013年2月28日） https://www.nikkei.com/article/DGXNASDG28052_Y3A220C1CC1000/
