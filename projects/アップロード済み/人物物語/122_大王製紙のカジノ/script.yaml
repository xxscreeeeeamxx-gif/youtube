scenes:
# ---- 先出し（2011年ごろ・シンガポールのカジノ。本人の著書の場面） ----
- id: co_vip
  title: ''
  background: dz_vip_yama
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 井川意高, emotion: normal}
  - {who: staff, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 2011年ごろ、シンガポールのカジノ。エリエールの大王製紙、創業家の3代目、井川意高です。
    reading: にせんじゅういちねん ごろ しんがぽーるの かじの。えりえーるの だいおう せいし、そうぎょうけの さんだいめ いかわ もとたかです。
  - speaker: staff
    emotion: thinking
    text: '[井川|イカワ]さん、そろそろおやめになったらどうですか。'
  - speaker: staff
    emotion: thinking
    text: もうすでに、テーブル上のチップは20億円もあります。
  - speaker: zundamon
    emotion: happy
    text: うん、ありがとう。まだ大丈夫だから、もう少し続けてみるよ
  - speaker: reimu
    text: 本人がのちに著書に書いた場面です。このころの賭け金は、彼が会長を兼ねる子会社から借りたものでした。
    reading: ほんにんが のちに ちょしょに かいた ばめんです。この ころの かけきんわ、かれが かいちょうお かねる こがいしゃから かりた ものでした。
  - speaker: reimu
    text: この年の9月、子会社からの1通のメールで、すべてが明るみに出ます。
    reading: この としの くがつ、こがいしゃからの いっつうの めーるで すべてが あかるみに でます。
# ---- 今の部屋（スマホのくじ） ----
- id: hook
  title: ''
  background: dz_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: sad}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: sad
    text: くじ、また外れたのだ……。
  - speaker: zundamon
    emotion: angry
    text: 取り返すのだ！ もう1回だけ！
  - speaker: tsumugi
    emotion: thinking
    text: そのもう1回、さっきも聞いた。
    se: hammer
  - speaker: tsumugi
    emotion: normal
    text: 取り返そうとして、子会社から106億円を借りた会長がいるの。
  - speaker: tsumugi
    emotion: normal
    text: ティッシュのエリエール、[大王製紙|だいおうせいし]の3代目よ。
  - speaker: zundamon
    emotion: surprised
    text: 子会社から106億円も！？ なんで借りられたの！？ 誰も止めなかったの！？
    telops:
    - {text: "ティッシュの会社の3代目 なぜ子会社から106億円も借りられた？", size: md, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
# ---- 2010年5月12日・電話1本 ----
- id: ch1_denwa
  title: 電話1本
  background: dz_yakuin
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 井川意高, emotion: normal}
  - {who: yakuin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2010年5月、子会社からの借り入れが始まります。役員への頼み方を、本人はのちに著書にこう書いています。
    reading: にせんじゅうねん ごがつ、こがいしゃからの かりいれが はじまります。やくいんえの たのみかたお、ほんにんわ のちに ちょしょに こう かいて います。
  - speaker: zundamon
    emotion: normal
    text: 個人的に運用している事業がある。至急[×|マルマル]億円の貸付を頼む
  - speaker: yakuin
    emotion: normal
    text: わかりました
  - speaker: yakuin
    emotion: thinking
    text: ……経理を呼んでくれ。
- id: ch1_keiri
  title: ''
  background: dz_keiri
  stage:
  - {who: keiri, x: 0.28, flip: true, emotion: normal}
  - {who: shinjin, x: 0.7, emotion: normal}
  cuts:
  - speaker: keiri
    emotion: normal
    text: 役員から電話だ。言われた口座に、今日中に振り込んでくれ。
  - speaker: shinjin
    emotion: surprised
    text: 億単位ですよ！？ 担保は？
  - speaker: keiri
    emotion: normal
    text: ……取らない。
  - speaker: shinjin
    emotion: thinking
    text: 契約書は？
  - speaker: keiri
    emotion: normal
    text: あとで作る。
    beat: true
  - speaker: shinjin
    emotion: thinking
    text: 取締役会には、かけないんですか。
  - speaker: keiri
    emotion: thinking
    text: ……かけない。
  - speaker: shinjin
    emotion: thinking
    text: 借りるのは、どなたなんです？
  - speaker: keiri
    emotion: normal
    text: 親会社の社長だ。
  - speaker: shinjin
    emotion: thinking
    text: うちの会長って、誰でしたっけ。
  - speaker: keiri
    emotion: thinking
    text: ……[同じ人|オナジヒト]だ。
  - speaker: shinjin
    emotion: surprised
    text: 同じ人！？
    se: bikkuri
  - speaker: reimu
    text: このあとお金を貸す子会社7社は、7社とも会長が井川意高。大王製紙の持ち株は、10〜25%でした。
    reading: この あと おかねお かす こがいしゃ ななしゃわ、ななしゃとも かいちょうが いかわ もとたか。だいおう せいしの もちかぶわ じゅっぱーせんとから にじゅうごぱーせんとでした。
    telops:
    - {text: "貸す7社の会長も 借りる人も 井川意高", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: keiri
    emotion: normal
    text: 株の過半数は、[井川家|イカワケ]の側が持ってる。
  - speaker: keiri
    emotion: thinking
    text: ここは、[井川家|イカワケ]の会社なんだよ。
  - speaker: shinjin
    emotion: thinking
    text: 金庫の鍵を持つ店長と、借りに来た客が[同じ人|オナジヒト]……。
    beat: true
  - speaker: reimu
    text: 国内の子会社35社のうち、大王製紙だけで株の半分を超えるのは、3社だけでした。
    reading: こくないの こがいしゃ さんじゅうごしゃの うち、だいおう せいし だけで かぶの はんぶんお こえるのわ さんしゃ だけでした。
  - speaker: reimu
    text: 最後の貸付まで、26回で106億8000万円。電話1本あたり、約4億円です。
    reading: さいごの かしつけまで、にじゅうろっかいで ひゃくろくおく はっせんまんえん。でんわ いっぽん あたり やく よんおくえんです。
    telops:
    - {text: "26回で106億8000万円 電話1本あたり約4億円", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: 2か月後、本社の経理と監査法人が、この貸付に気づきます。なのに、なぜ止まらなかったのか。
    reading: にかげつご、ほんしゃの けいりと かんさ ほうじんが この かしつけに きづきます。なのに、なぜ とまらなかったのか。
# ---- 1943〜1986年・祖父の会社、父の会社 ----
- id: card1943
  title: ''
  background: dz_card_1943
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: なぜ貸す側も借りる側も同じ1人なのか。始まりは1943年、愛媛の伊予三島。祖父の井川伊勢吉の会社です。
    reading: なぜ かす がわも かりる がわも おなじ ひとりなのか。はじまりわ せんきゅうひゃく よんじゅうさんねん、えひめの いよみしま。そふの いかわ いせきちの かいしゃです。
- id: ch2_kojo
  title: 祖父の会社、父の会社
  background: dz_kojo_old
  stage:
  - {who: chichi_y, x: 0.28, flip: true, emotion: normal}
  - {who: koin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1962年、会社は会社更生法の手続きへ。支えたのは、入社したばかりの息子、井川高雄です。
    reading: せんきゅうひゃく ろくじゅうにねん、かいしゃわ かいしゃ こうせいほうの てつづきえ。ささえたのわ、にゅうしゃ したばかりの むすこ いかわ たかおです。
  - speaker: chichi_y
    emotion: angry
    text: 3年で立て直す。切り捨ててもらった借金も、全部返すぞ。
  - speaker: koin
    emotion: surprised
    text: 切り捨ててもらった分まで、返すんですか！？
  - speaker: koin
    emotion: happy
    text: うちも、ティッシュを始めましたね。名前は、エリエール。
  - speaker: chichi_y
    emotion: happy
    text: 1986年。ティッシュで、国内1位だ！
    background: dz_kojo
    se: levelup
  - speaker: chichi_y
    emotion: normal
    text: よその製紙会社を買うときは、株はうちの家で持つ。
  - speaker: chichi_y
    emotion: normal
    text: '[大王製紙|だいおうせいし]の持ち分は、15%ほどでいい。'
  - speaker: reimu
    text: 7社の形は、ここから来ています。倒れかけた会社を救った父は、社員にとって特別な人でした。
    reading: ななしゃの かたちわ ここから きて います。たおれかけた かいしゃお すくった ちちわ、しゃいんに とって とくべつな ひとでした。
# ---- 2007年・42歳の社長 ----
- id: card2007
  title: ''
  background: dz_card_2007
  bgm: honwaka_puppu
  cuts:
  - speaker: reimu
    text: 2007年6月、井川意高が42歳で社長に。前の年の夏ごろから、マカオなどのカジノに通っていました。
    reading: にせんななねん ろくがつ、いかわ もとたかが よんじゅうにさいで しゃちょうに。まえの としの なつごろから、まかおなどの かじのに かよって いました。
- id: ch2_shacho
  title: 42歳の社長
  background: dz_kaigi
  stage:
  - {who: tori, x: 0.28, flip: true, emotion: normal}
  - {who: keiritori, x: 0.7, emotion: happy}
  cuts:
  - speaker: tori
    emotion: normal
    text: 創業家の社長は、12年ぶりか。
  - speaker: keiritori
    emotion: happy
    text: 家庭紙で、値段の勝負を仕掛けてきた人ですからね。
  - speaker: tori
    emotion: happy
    text: エリエールを大きくしたのは、あの人だ。
# ---- 2007〜2009年・VIPルーム ----
- id: ch3_vip
  title: VIPルーム
  background: dz_vip
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 井川意高, emotion: normal}
  - {who: staff, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 本人によると、初めてのカジノは96年か97年ごろのオーストラリア。100万円が2000万円になりました。
    reading: ほんにんに よると、はじめての かじのわ きゅうじゅうろくねんか きゅうじゅうななねん ごろの おーすとらりあ。ひゃくまんえんが にせんまんえんに なりました。
  - speaker: staff
    emotion: happy
    text: いらっしゃいませ、[井川|イカワ]様。お部屋は、いつものスイートです。
  - speaker: staff
    emotion: happy
    text: もちろん、お代は頂きません。往復の飛行機も、こちらで。
  - speaker: staff
    emotion: normal
    text: 社長になられて、2年ですか。賭け方が変わりましたね。
  - speaker: staff
    emotion: normal
    text: 1回100万円が、当たり前に。
  - speaker: staff
    emotion: surprised
    text: ……1回で、1000万円！？
  - speaker: staff
    emotion: normal
    text: 本日のお迎えは、ベンツでございました。
  - speaker: staff
    emotion: happy
    text: 次のお迎えは、ロールスロイスをご用意します。
    se: jaan
  - speaker: reimu
    text: 迎えの車は、客がカジノで使う額で変わりました。本人はのちに、こう書いています。
    reading: むかえの くるまわ、きゃくが かじので つかう がくで かわりました。ほんにんわ のちに こう かいて います。
  - speaker: zundamon
    emotion: happy
    text: 黒塗りのロールスロイスがスタンバイしていてくれる気分は悪くない。
  - speaker: staff
    emotion: happy
    text: 勝っても負けても、動かした額の1%ほどはお戻しします。
  - speaker: staff
    emotion: happy
    text: またのお越しを、お待ちしております。
- id: ch3_chukai
  title: ''
  background: dz_vip
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 井川意高, emotion: normal}
  - {who: chukai, x: 0.7, emotion: happy}
  cuts:
  - speaker: chukai
    emotion: happy
    text: お手元が足りなければ、カジノからお借りできます。
  - speaker: chukai
    emotion: happy
    text: 数千万でも、数億でも。手配は、わたくしどもで。
  - speaker: reimu
    text: 2009年の秋、それまでの負けを一度すべて取り返します。なのに、なぜやめなかったのか。
    reading: にせんきゅうねんの あき、それまでの まけお いちど すべて とりかえします。なのに、なぜ やめなかったのか。
# ---- 2010年7月・載るか ----
- id: ch3_yuho
  title: 有価証券報告書に載るか
  background: dz_yakuin
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 井川意高, emotion: normal}
  - {who: keiritori, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2010年7月、本社の経理担当の取締役が貸付に気づきます。調査報告書によると、本人から尋ねたといいます。
    reading: にせんじゅうねん しちがつ、ほんしゃの けいり たんとうの とりしまりやくが かしつけに きづきます。ちょうさ ほうこくしょに よると、ほんにんから たずねたと いいます。
  - speaker: zundamon
    emotion: normal
    text: 翌年3月末までに返す予定だが、その場合も有価証券報告書に載るか
  - speaker: keiritori
    emotion: normal
    text: 開示されることになります。
  - speaker: keiritori
    emotion: thinking
    text: ……グループのための資金、だろう。
  - speaker: reimu
    text: 取締役は、ほかの役員にも監査役にも伝えません。29日には、監査法人も気づきます。
    reading: とりしまりやくわ、ほかの やくいんにも かんさやくにも つたえません。にじゅうくにちにわ、かんさ ほうじんも きづきます。
- id: ch3_kansa
  title: ''
  background: dz_jimusho
  stage:
  - {who: kansa, x: 0.28, flip: true, emotion: thinking}
  - {who: kansajr, x: 0.7, emotion: normal}
  cuts:
  - speaker: kansajr
    emotion: surprised
