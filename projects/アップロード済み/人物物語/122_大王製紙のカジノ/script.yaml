    reading: にせんじゅうさんねん にがつ にじゅうはちにち、とうきょう こうさいも こうそお しりぞけます。
  - speaker: saibancho2
    emotion: normal
    text: 公私混同が甚だしく、厳しい非難は免れない
  - speaker: saibancho2
    emotion: normal
    text: オーナーの地位を乱用しており悪質
  - speaker: reimu
    text: 井川は微動だにせず聞き、裁判長に深く一礼して、小さな声でつぶやきました。
    reading: いかわわ びどうだに せず きき、さいばんちょうに ふかく いちれい して ちいさな こえで つぶやきました。
  - speaker: zundamon
    emotion: sad
    text: ありがとうございました
  - speaker: reimu
    text: 6月、最高裁が上告を退け、懲役4年が確定します。
    reading: ろくがつ、さいこうさいが じょうこくお しりぞけ ちょうえき よねんが かくてい します。
    background: dz_saikosai
# ---- 論争 ----
- id: ronso1
  title: カジノで106億円負けた？
  background: dz_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ カジノで106億円負けた会長なのだ！
  - speaker: tsumugi
    emotion: normal
    text: そう書かれることは多いわね。本人も、カジノに使うために借りたと書いてる。
  - speaker: tsumugi
    emotion: thinking
    text: でも106億8000万円は、子会社7社から借りたお金の合計なの。
  - speaker: zundamon
    emotion: surprised
    text: 負けた額じゃないの！？
  - speaker: tsumugi
    emotion: normal
    text: 2011年10月までに、そのうち47億5000万円は返してるわ。
  - speaker: zundamon
    emotion: surprised
    text: 半分近くは、返してたの！？
  - speaker: tsumugi
    emotion: normal
    text: 委員会は使い道を、明らかにするに至っていないと書いた。
  - speaker: tsumugi
    emotion: normal
    text: 検察がカジノに使ったとしたのは、起訴の55億3000万円のうち約43億8000万円。
  - speaker: zundamon
    emotion: thinking
    text: 数字が、頭の中でぐるぐるする……。
    se: tenten
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、何が本当なの？
  - speaker: tsumugi
    emotion: normal
    text: 確かなのは、子会社から26回で106億8000万円を借りたこと。
  - speaker: tsumugi
    emotion: normal
    text: そして逮捕の日に、ほとんどをカジノで使ったと本人が認めたこと。そこまでね。
- id: ronso2
  title: 全部返したから、いい？
  background: dz_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: でも、お[金|かね]は全部返したんでしょ？ じゃあ、いいのだ！
  - speaker: tsumugi
    emotion: normal
    text: 返したのは本当よ。2012年8月には、全額が戻ってる。
  - speaker: tsumugi
    emotion: thinking
    text: でも、裁かれたのは返したかどうかじゃないの。
  - speaker: zundamon
    emotion: happy
    text: ボクも借りたゲーム、ちゃんと返したからセーフなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 店長が店の金庫から自分に貸したら、返してもアウトでしょ。
    se: tsukkomi
  - speaker: zundamon
    emotion: sad
    text: ……アウトなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 問われたのは、どうやって借りたか。
  - speaker: tsumugi
    emotion: normal
    text: トップの立場で、担保も取締役会もなしに自分へ貸させたこと。
  - speaker: tsumugi
    emotion: normal
    text: それが会社法違反の、[特別背任|とくべつハイニン]よ。
  - speaker: tsumugi
    emotion: thinking
    text: '[一審|いっしん]の判決は、子会社の資金繰りが[逼迫|ひっぱく]するなど深刻な影響が出たとも言ってる。'
  - speaker: zundamon
    emotion: thinking
    text: 返せば済む話じゃ、なかったのか……。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 本人はのちの著書で、[井川家|イカワケ]排除のクーデターがあったと主張してるわ。
# ---- 本当の注意点 ----
- id: chui
  title: 取り返そうと思ったら
  background: dz_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 取り返そうと思った時が、深みの入口よ。
  - speaker: tsumugi
    emotion: thinking
    text: 本人も、父に叱られたあと毎週のように通い続けたと書いてるわ。
  - speaker: tsumugi
    emotion: thinking
    text: 2009年の秋、彼は負けを一度ぜんぶ取り返してた。それでも、やめなかった。
  - speaker: zundamon
    emotion: sad
    text: ボクのもう1回と、同じなのだ……。
    se: shobon
  - speaker: tsumugi
    emotion: normal
    text: 負けても、部屋も飛行機もタダ。また来てねって、待っててくれるお店だったの。
  - speaker: zundamon
    emotion: thinking
    text: タダより高いものは、ないのだ……。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 日本でも大阪で、カジノのある施設が2030年秋ごろの開業に向けて準備中よ。
  - speaker: tsumugi
    emotion: normal
    text: カジノが日本人にお[金|かね]を貸すことには、規制がある。
  - speaker: tsumugi
    emotion: normal
    text: 日本人はクレジットカードで賭けられないし、中にATMも置けないの。
  - speaker: zundamon
    emotion: thinking
    text: その場で、お[金|かね]を足せないんだ。
  - speaker: tsumugi
    emotion: normal
    text: 本人や家族が申し出れば、利用を止めることもできるわ。
  - speaker: zundamon
    emotion: surprised
    text: 家族からも、止められるのだ！？
  - speaker: tsumugi
    emotion: normal
    text: そう。本人が止まれなくても、家族から申し出る道があるの。
  - speaker: tsumugi
    emotion: thinking
    text: もう1つ。偉い人の頼みだから、は確かめない理由にならないわ。
