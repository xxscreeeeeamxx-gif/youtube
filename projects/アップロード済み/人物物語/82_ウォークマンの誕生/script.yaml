scenes:
- id: co_kaigi
  title: ''
  background: wm_kaigi
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 盛田昭夫, emotion: normal}
  - {who: gishi2, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1979年2月の東京。ソニーの会長が、のちのウォークマンになる試作機を若手に見せていました。
    reading: せんきゅうひゃく ななじゅうくねん にがつの とうきょう。そにーの かいちょうが、のちの うぉーくまんに なる しさくきお わかてに みせて いました。
  - speaker: zundamon
    emotion: normal
    text: 録音機能は、いらない。音楽を外へ持って出られるんだ。
  - speaker: gishi2
    emotion: thinking
    text: 録音できないテレコなんて、聞いたことがありません。
  - speaker: gishi2
    emotion: sad
    text: 録音が付いてないと、絶対に売れませんよ。
  - speaker: zundamon
    emotion: angry
    text: ……ボクのクビをかけてでも、やる。
    se: don
  - speaker: gishi2
    emotion: surprised
    text: か、会長のクビを……！？
  - speaker: reimu
    text: この男は盛田昭夫。最初の月に約3000台だったウォークマンは、やがて約4億台売れます。
    reading: この おとこわ もりた あきお。さいしょの つきに やく さんぜんだいだった うぉーくまんわ、やがて やく よんおくだい うれます。
- id: hook
  title: ''
  background: wm_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: このイヤホン、周りの音が消えるのだ～。
  - speaker: tsumugi
    emotion: normal
    text: ずんだもん、宿題は？ ……ずんだもん！
  - speaker: zundamon
    emotion: happy
    text: ん？ [何|なに]か言った？
  - speaker: tsumugi
    emotion: thinking
    text: 都合の悪い音まで、消してるわね。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 47年前、聴くだけの機械を作って大反対された人がいるの。
  - speaker: zundamon
    emotion: surprised
    text: 録音もできないのに、どうして売れたの？
    telops:
    - {text: 録音できない機械が4億台？, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、名誉会長の出張の[お供|おとも]よ。
- id: card1978
  title: ''
  background: wm_card_1978
  cuts:
  - speaker: reimu
    text: 1978年。ソニーの名誉会長の井深大は、70歳でした。
    reading: せんきゅうひゃく ななじゅうはちねん。そにーの めいよ かいちょうの いぶか まさるわ、ななじゅっさいでした。
- id: ch0_kinai
  title: 出張のお供
  background: wm_kinai
  bgm: hirusagari
  stage:
  - {who: ibuka, x: 0.28, flip: true, emotion: happy}
  - {who: joumuin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 井深の楽しみは、出張の機内で音楽を聴くことでした。
    reading: いぶかの たのしみわ、しゅっちょうの きないで おんがくお きく ことでした。
  - speaker: joumuin
    emotion: surprised
    text: お客様。そちらの大きな機械は……？
  - speaker: ibuka
    emotion: happy
    text: 録音機だよ。今年出たばかりの、[TC-D5|ティーシーディーファイブ]というやつだ。
  - speaker: ibuka
    emotion: happy
    text: 10万円ほどするが、音はいい。好きな音楽を聴いてるんだ。
  - speaker: joumuin
    emotion: normal
    text: 上の棚に、お入れしましょうか。
  - speaker: ibuka
    emotion: normal
    text: いや、聴くからここに置いとく。
  - speaker: joumuin
    emotion: thinking
    text: ……その重さを、出張のたびに持ち歩いてらっしゃるんですか？
  - speaker: ibuka
    emotion: sad
    text: ……正直、重くてかなわん。
    se: shobon
  - speaker: ibuka
    emotion: thinking
    text: 聴くだけなら、録音の仕掛けなどいらんのだがなあ。
- id: ch0_ooga
  title: ''
  background: wm_yakuin0
  stage:
  - {who: ibuka, x: 0.28, flip: true, emotion: normal}
  - {who: ooga, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 次の出張の前、井深は副社長の大賀典雄に声をかけます。
    reading: つぎの しゅっちょうの まえ、いぶかわ ふくしゃちょうの おおが のりおに こえお かけます。
  - speaker: ibuka
    emotion: normal
    text: 大賀くん。また出張なんだが。
  - speaker: ooga
    emotion: normal
    text: 今度は、どちらまで？
  - speaker: ibuka
    emotion: happy
    text: それより、プレスマンにステレオの回路を入れてくれんかな。再生だけでいい。
  - speaker: ooga
    emotion: thinking
    text: あの手のひらほどの、モノラルの録音機にですか。
  - speaker: ibuka
    emotion: happy
    text: そう。あれで、機内でステレオを聴きたいんだ。
  - speaker: ooga
    emotion: happy
    text: 分かりました。テープレコーダーの事業部に頼みましょう。
  - speaker: reimu
    text: 電話を受けた事業部長の大曽根幸三は、二つ返事で引き受けました。
    reading: でんわお うけた じぎょうぶちょうの おおそね こうぞうわ、ふたつへんじで ひきうけました。
- id: ch1_kaizou
  title: 大きなヘッドホン
  background: wm_koba
  bgm: pop
  stage:
  - {who: gishi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1978年の秋。芝浦の職場で、プレスマンの作り替えが始まります。
    reading: せんきゅうひゃく ななじゅうはちねんの あき。しばうらの しょくばで、ぷれすまんの つくりかえが はじまります。
  - speaker: gishi
    emotion: thinking
    text: 録音の回路とスピーカーを外せば、ステレオの回路が入るぞ。
  - speaker: gishi
    emotion: normal
    text: ヘッドホンは、有り合わせのこれでいいか。
  - speaker: gishi
    emotion: surprised
    text: ……本体より、ヘッドホンのほうがでかいな。
    beat: true
- id: ch1_shibaura
  title: ''
  background: wm_koba
  stage:
  - {who: ibuka, x: 0.28, flip: true, emotion: happy}
  - {who: gishi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 10月ごろ。井深が、芝浦の職場にふらりと現れます。
    reading: じゅうがつごろ。いぶかが、しばうらの しょくばに ふらりと あらわれます。
  - speaker: ibuka
    emotion: happy
    text: おっ、これか。どれ、聴かせてもらおう。
  - speaker: gishi
    emotion: surprised
    text: い、井深さん！ まだ作りかけで……
  - speaker: ibuka
    emotion: surprised
    text: ほー。小さいくせに、良い音が出るじゃないか。
  - speaker: gishi
    emotion: happy
    text: 本当ですか！
  - speaker: ibuka
    emotion: happy
    text: 1952年にアメリカで、ヘッドホンで立体的な録音を聴いてね。
  - speaker: ibuka
    emotion: happy
    text: 本当に良い音を聴くには、ヘッドホンがいいんだよなあ。
  - speaker: gishi
    emotion: thinking
    text: ……その[分|ぶん]、頭が重いですけど。
    beat: true
- id: ch1_akiba
  title: ''
  background: wm_akiba
  bgm: curious
  stage:
  - {who: gishi, x: 0.28, flip: true, emotion: normal}
  - {who: buhinya, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 試作機を動かすには、特殊な電池が2個要りました。
    reading: しさくきお うごかすにわ、とくしゅな でんちが にこ いりました。
  - speaker: gishi
    emotion: surprised
    text: すみません！ この電池、ありますか！
  - speaker: buhinya
    emotion: thinking
    text: そんな電池、うちには無いね。三軒先で聞きな。
  - speaker: gishi
    emotion: sad
    text: 三軒先で、ここを教わったんですけど。
    beat: true
  - speaker: buhinya
    emotion: normal
    text: じゃあ、反対側の三軒先だな。
  - speaker: gishi
    emotion: angry
    text: そこは、さっき断られた店です！
    beat: true
  - speaker: gishi
    emotion: sad
    text: ……日が暮れた。[秋葉原中|あきはばらじゅう]、回ったのに。
    background: wm_akiba_yoru
  - speaker: buhinya
    emotion: surprised
    text: なんだ、まだ探してたのか。
  - speaker: gishi
    emotion: happy
    text: あった！ 最後の店の、最後の2個！
  - speaker: gishi
    emotion: happy
    text: これで井深さんの出張に、間に合う！
- id: ch1_denchi
  title: ''
  background: wm_koba
  stage:
  - {who: gishi, x: 0.28, flip: true, emotion: happy}
  - {who: ooga, x: 0.7, emotion: normal}
  cuts:
  - speaker: ooga
    emotion: normal
    text: 出張先の井深さんから、連絡があったよ。
  - speaker: gishi
    emotion: happy
    text: 聴いてくださいましたか！
  - speaker: ooga
    emotion: thinking
    text: 途中で電池が切れた。こっちで探したが、どこにも無いと。
  - speaker: gishi
    emotion: sad
    text: ……秋葉原でも、やっと見つけた電池ですから。
    se: chin
  - speaker: ooga
    emotion: thinking
    text: 向こうの店に、あるわけがないな。
- id: ch2_morita
  title: 歩きながら聴けたら
  background: wm_yakuin
  bgm: you_and_me
  stage:
  - {who: ibuka, x: 0.28, flip: true, emotion: happy}
  - {who: zundamon, x: 0.7, tag: 盛田昭夫, emotion: normal}
  cuts:
  - speaker: reimu
    text: 井深は試作機を、57歳の盛田昭夫に見せます。井深とソニーを興した、もう一人の創業者です。
    reading: いぶかわ しさくきお、ごじゅうななさいの もりた あきおに みせます。いぶかと そにーお おこした、もう ひとりの そうぎょうしゃです。
  - speaker: zundamon
    emotion: surprised
    text: 井深さん。その大きなヘッドホンは、[何|なん]ですか？
  - speaker: ibuka
    emotion: happy
    text: 盛田くん。これ、聴いてみてくれんかね。
  - speaker: zundamon
    emotion: surprised
    text: ……おっ。小さいのに、いい音ですね。
  - speaker: ibuka
    emotion: normal
    text: 歩きながら聴けるステレオがあったら、いいと思うんだが。
  - speaker: zundamon
    emotion: thinking
    text: 歩きながら……。週末に、家でじっくり試してみます。
- id: ch2_jitaku
  title: ''
  background: wm_jitaku0
  stage:
  - {who: zundamon, x: 0.3, flip: true, tag: 盛田昭夫, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: スピーカーで聴くのとは、違った良さがあるのだ。
  - speaker: reimu
    text: 盛田の家でも、子どもたちは帰るとまずステレオのスイッチを入れていました。
    reading: もりたの いえでも、こどもたちわ かえると まず すてれおの すいっちお いれて いました。
  - speaker: zundamon
    emotion: thinking
    text: '[一日中|いちにちじゅう]、音楽を聴いていたい若者は大勢いる。'
  - speaker: zundamon
    emotion: happy
    text: これは、ひょっとするとひょっとするのだ！
- id: card1979
  title: ''
  background: wm_card_1979
  cuts:
  - speaker: reimu
    text: 1979年2月。盛田は、若手の社員たちを本社の会議室に集めます。
    reading: せんきゅうひゃく ななじゅうくねん にがつ。もりたわ、わかての しゃいんたちお ほんしゃの かいぎしつに あつめます。
- id: ch3_kaigi
  title: 録音できないテレコ
  background: wm_kaigi
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 盛田昭夫, emotion: normal}
  - {who: gishi2, x: 0.7, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: この製品は、[一日中|いちにちじゅう]音楽を楽しみたい若者のためのものだ。
  - speaker: zundamon
    emotion: normal
    text: 録音機能は、いらない。音楽を外へ持って出られるんだ。
    telops:
    - {text: 録音機能はいらない, size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: gishi2
    emotion: thinking
    text: 録音できないテレコなんて、聞いたことがありません。
  - speaker: gishi2
    emotion: sad
    text: 録音が付いてないと、絶対に売れませんよ。
  - speaker: zundamon
    emotion: normal
    text: 録音できないカーステレオを、[何百万人|なんびゃくまんにん]も買ってるぞ。
  - speaker: gishi2
    emotion: thinking
    text: 車と一緒にしないでください。
    beat: true
  - speaker: zundamon
    emotion: angry
    text: ……ボクのクビをかけてでも、やる。
    se: don
  - speaker: gishi2
    emotion: surprised
    text: か、会長のクビを……！？
  - speaker: zundamon
    emotion: happy
    text: 相手は若者、つまり学生だ。夏休みの前に出すぞ。
  - speaker: gishi2
    emotion: surprised
    text: 夏休み前！？ あと[何か月|なんかげつ]だと思ってるんですか。
  - speaker: reimu
    text: 当時の慣例では、発売日は21日。6月21日なら、残りは正味4か月です。
    reading: とうじの かんれいでわ、はつばいびわ にじゅういちにち。ろくがつ にじゅういちにちなら、のこりわ しょうみ よんかげつです。
  - speaker: gishi2
    emotion: thinking
    text: ……困難ですが、不可能ではありません。
  - speaker: reimu
    text: 出席者は難色を示しながらも、心のどこかで使ってみたいと思っていました。
    reading: しゅっせきしゃわ なんしょくお しめしながらも、こころの どこかで つかって みたいと おもって いました。
- id: ch3_kakaku
  title: 33周年で3万3000円
  background: wm_kaigi
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 盛田昭夫, emotion: normal}
  - {who: eigyo, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: 値段は、プレスマンと同じくらい。4万円は切りたい。
  - speaker: eigyo
    emotion: normal
    text: 実売で3万円を切るなら、売れます。
  - speaker: reimu
    text: ところが、かかるお金から考えると4万8000円は必要でした。
    reading: ところが、かかる おかねから かんがえると よんまん はっせんえんわ ひつようでした。
  - speaker: eigyo
    emotion: thinking
    text: 無理を承知で、3万5000円でどうでしょう。
  - speaker: zundamon
    emotion: thinking
    text: 今年は、ソニーの創立33周年だな。
  - speaker: zundamon
    emotion: happy
    text: よし、3万3000円でいくのだ！
  - speaker: eigyo
    emotion: surprised
    text: 33周年だから、さらに2000円まけるんですか！？
    se: zukko
  - speaker: eigyo
    emotion: thinking
    text: ……それで、最初は[何台|なんだい]作りますか？
  - speaker: zundamon
    emotion: normal
    text: 3万台。
  - speaker: eigyo
    emotion: surprised
    text: 一番売れてるテレコでも、月に1万5000台ですよ！
    telops:
