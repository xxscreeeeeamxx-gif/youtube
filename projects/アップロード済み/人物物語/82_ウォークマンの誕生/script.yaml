  - speaker: tsumugi
    emotion: thinking
    text: それより、今のあなたに本当に関係がある話をするね。
  - speaker: tsumugi
    emotion: normal
    text: WHOは、世界の若者10億人が音楽の聴きすぎで難聴の危険にあると言ってるの。
  - speaker: zundamon
    emotion: surprised
    text: 10億人！？
  - speaker: tsumugi
    emotion: normal
    text: 目安は、80デシベルで週40時間。それより長く聴くと危ないの。
    telops:
    - {text: 80デシベルで週40時間まで, size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: thinking
    text: 耳の奥で音を感じる細胞は、一度壊れると元に戻らないのよ。
  - speaker: zundamon
    emotion: sad
    text: ……ボクの、周りの音が消えるイヤホン。危なかったのか。
  - speaker: tsumugi
    emotion: normal
    text: 逆よ。周りの音を消せば、小さな音でも聴こえるから耳には優しいの。
  - speaker: zundamon
    emotion: happy
    text: じゃあ宿題の声が聞こえなかったのは、イヤホンのせいじゃないのだ？
  - speaker: tsumugi
    emotion: thinking
    text: ただの、聞こえないふりね。
    se: tsukkomi
- id: ch16_gendai
  title: 今のウォークマン
  background: wm_gendai
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 1981年の2号機は、先に形を決めて中身を合わせて作ったの。
  - speaker: tsumugi
    emotion: normal
    text: 1983年には、カセットのケースとほとんど同じ大きさの型まで出たわ。
  - speaker: zundamon
    emotion: surprised
    text: テープの箱の大きさに、テープを回す機械が入ったのだ！
  - speaker: tsumugi
    emotion: normal
    text: 1984年には、CDを持ち歩けるプレーヤーも出たの。
  - speaker: tsumugi
    emotion: normal
    text: 目標は、CDのケース4枚分の大きさの木の模型だったの。
  - speaker: tsumugi
    emotion: normal
    text: 盛田が5万円を切れと言って、かかるお金の半分の値段で売り出したのよ。
  - speaker: zundamon
    emotion: surprised
    text: 売るたびに、赤字なのだ！
  - speaker: tsumugi
    emotion: happy
    text: それでも、1年半で黒字になったわ。
  - speaker: tsumugi
    emotion: normal
    text: 1992年には、録音もできるMDの型が出たの。
  - speaker: zundamon
    emotion: happy
    text: 録音できなかった機械が、録音できるようになったのか。
  - speaker: tsumugi
    emotion: normal
    text: 1999年には、ネットで買った曲を入れる型も出たわ。
  - speaker: tsumugi
    emotion: thinking
    text: 2001年からは、アップルの[iPod|アイポッド]との競争になったわ。
  - speaker: zundamon
    emotion: sad
    text: 強敵なのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 日本のお店の集計で、週ごとの首位を取り返した年もあるの。2009年と2010年よ。
  - speaker: tsumugi
    emotion: normal
    text: 2010年3月までに、全部の型を合わせて約4億台。
    telops:
    - {text: 全部の型で約4億台, size: xl, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: そのうちカセットの型だけで、約2億2000万台よ。
  - speaker: zundamon
    emotion: surprised
    text: 出だしは3000台。それが、4億台なのか！
  - speaker: tsumugi
    emotion: normal
    text: 同じ2010年、カセットのウォークマンは国内での販売を終えたの。
  - speaker: zundamon
    emotion: sad
    text: カセットの型は、引退なのか……。
  - speaker: tsumugi
    emotion: normal
    text: 名前は残って、今もソニーの音楽プレーヤーとして売られているわ。
  - speaker: tsumugi
    emotion: normal
    text: 40周年の2019年には、銀座に歴代の約230台が並んだの。
  - speaker: tsumugi
    emotion: normal
    text: 2023年の型は、32ギガで約4900曲入るの。1曲を4分として、ね。
  - speaker: zundamon
    emotion: thinking
    text: 60分のテープなら、[何本分|なんぼんぶん]なのだ？
  - speaker: tsumugi
    emotion: happy
    text: 1本に15曲で、約330本分よ。積み上げると、4メートルくらいね。
  - speaker: zundamon
    emotion: surprised
    text: 天井を突き抜けるのだ！
    beat: true
