meta:
  title: 【ウォークマンの誕生】録音できない再生専用機が、世界の言葉になった【ずんだもん解説】
  slug: sony-walkman-v2
  summary: 歩きながら音楽を聴く。今では当たり前のこの習慣は、1979年に発売された小さな機械から始まりました。きっかけは、出張の多いソニーの名誉会長、井深大のちょっとした頼みごと。録音もできず、スピーカーもない再生専用機を、会長の盛田昭夫は夏休みの前に出すと決めます。社内の反対、45グラムのヘッドホン、変な和製英語と言われた名前。その裏側を、再現ドラマでたどります。
  tags:
  - ウォークマン
  - ソニー
  - 盛田昭夫
