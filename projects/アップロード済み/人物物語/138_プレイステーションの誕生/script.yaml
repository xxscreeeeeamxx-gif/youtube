meta:
  title: ソニーの役員は反対、社長は「そこまで言うならやってみろ」プレイステーションは出荷1億台に【ずんだもん解説】
  slug: playstation-kutaragi
  hook_line: 「ソニーの事業ではない」と言われたゲーム機は、なぜ出荷1億台を超えたのか。
  summary: 1992年6月、ソニー本社の経営会議。技術者の久夛良木健は、反対する役員たちの前で社長の大賀典雄に迫ります。判まで押した任天堂との計画は、発表の翌日から白紙へ向かっていました。カセットではなくCD、平らな絵ではなく立体。本社を出て、音楽の会社の軒先で作ったゲーム機に、ゲーム会社は振り向いたのか。本人の講演と、丸山茂雄の新聞の連載に残る言葉で、双方の言い分を並べて再現ドラマでたどります。（2026年11月時点）
  sources:
  - Sony Interactive Entertainment「Business Data & Sales」 https://sonyinteractive.com/en/corporate/data.html
  - 公正取引委員会 平成13年度年次報告「株式会社ソニー・コンピュータエンタテインメントに対する件」 https://www.jftc.go.jp/info/nenpou/h13/13kakuron00002-4-2.html
  - 武田計測先端知財団「久夛良木健 「プレイステーション」市場の創出と次世代エンタテインメント機器開発への挑戦」（2006年12月26日） http://takeda-foundation.jp/reports/pdf/ant0303.pdf
  - 'Game Informer「The First 25 Years: A PlayStation Oral History」（2019年12月3日） https://gameinformer.com/feature/2019/12/03/the-first-25-years-a-playstation-oral-history'
  - 電撃オンライン「プレステの生みの親・久夛良木健氏が語るゲーム市場の未来とPS開発秘話とは？ TGS2024基調講演レポート」（2024年9月26日） https://dengekionline.com/article/202409/18945
  - 4Gamer「「黒川塾 六十二（62）」聴講レポート。久夛良木 健氏が自身の育てたPlayStationのこれまでと，デジタルエンターテイメントの可能性を語った」（2018年7月19日） https://www.4gamer.net/games/999/G999905/20180719035/
