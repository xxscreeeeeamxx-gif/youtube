scenes:
# ---- 先出し（1992年6月・ソニー本社の経営会議。台詞は丸山の連載の形と財団の言葉だけ。笑いの SE なし。机をたたく音は間とナレで） ----
- id: co_kaigi
  title: ''
  background: pl_kaigi
  bgm: serious
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 久夛良木, emotion: angry}
  - {who: yakuin, x: 0.56, emotion: normal}
  - {who: oga, x: 0.78, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1992年6月、ソニー本社の経営会議。技術者の久夛良木健が、ゲーム機を作らせてほしいと迫ります。
    reading: せんきゅうひゃく きゅうじゅうにねん ろくがつ、そにー ほんしゃの けいえい かいぎ。ぎじゅつしゃの くたらぎ けんが げーむきお つくらせて ほしいと せまります。
  - speaker: yakuin
    emotion: normal
    text: ゲーム市場は、ソニーの事業ではない。
  - speaker: zundamon
    emotion: angry
    text: 任天堂に話をひっくり返されたままでいいんですか
  - speaker: reimu
    text: 社長の大賀典雄が、机をたたきます。
    reading: しゃちょうの おおが のりおが、つくえお たたきます。
  - speaker: oga
    emotion: angry
    text: そこまで言うならやってみろ
    pause_after: 0.6
  - speaker: reimu
    text: 丸山茂雄の新聞の連載などに残る場面です。2年半後に出たプレイステーションは、出荷1億台を超えます。
    reading: まるやま しげおの しんぶんの れんさいなどに のこる ばめんです。にねんはんごに でた ぷれいすてーしょんわ、しゅっか いちおくだいお こえます。
# ---- 今の部屋（約束した相手に、別の相手と組まれる。任天堂をたとえに使わない。20秒以内） ----
- id: hook
  title: ''
  background: pl_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: 文化祭の出し物、2人で作る約束だったのに！ 別のクラスと組まれたのだ！
  - speaker: tsumugi
    emotion: normal
    text: じゃあ、どうするの？
  - speaker: zundamon
    emotion: angry
    text: ……1人で、もっとすごいのを作るのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 1991年、組んでいた相手に別の会社と組まれた技術者がいたの。
  - speaker: tsumugi
    emotion: normal
    text: ゲームはソニーの事業ではないと言われた機械が、なぜ出荷1億台になったのか。
    telops:
    - {text: "「ソニーの事業ではない」機械は なぜ出荷1億台に？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 反対されたのに、1億台！？
# ---- 1980年代半ば・厚木の研究所（3Dは短く。子供時代は出さない。カセットの話は2017年の本人の言葉で） ----
- id: ch1_kenkyujo
  title: 立体の映像とカセット
  background: pl_kenkyujo
  bgm: curious
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 久夛良木, emotion: normal}
  - {who: gishi, x: 0.84, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1980年代の半ば、神奈川・厚木。ソニーの研究所です。
    reading: せんきゅうひゃく はちじゅうねんだいの なかば、かながわ あつぎ。そにーの けんきゅうじょです。
  - speaker: gishi
    emotion: happy
    text: '[久夛良木|クタラギ]さん。業務用の機械で、立体がその場で動いてます。'
  - speaker: zundamon
    emotion: surprised
    text: これ、家のゲーム機で動かせないかな。
  - speaker: gishi
    emotion: thinking
    text: それより、人気のカセットはどこも品切れですよ。
  - speaker: reimu
    text: 久夛良木は2017年に、カセットの弱点をこう話しています。
    reading: くたらぎわ にせん じゅうななねんに、かせっとの じゃくてんお こう はなして います。
  - speaker: zundamon
    emotion: normal
    text: 半導体のROMカセットだと当時は作るのに2カ月かかるので、
  - speaker: zundamon
    emotion: normal
    text: ゲームを欲しい子が待っている間に中古ソフトが店頭に並ぶ。
  - speaker: gishi
    emotion: surprised
    text: 待ってる間に、中古が先に！？
    se: bikkuri
  - speaker: gishi
    emotion: thinking
    text: 夏休みの初めに売り切れたら、次は夏休みのあとですね。
  - speaker: zundamon
    emotion: happy
    text: CDにすればいいんだ。作るのが早い。
  - speaker: gishi
    emotion: thinking
    text: でもカセットは、読み込みが速くてコピーに強いですよ。
  - speaker: reimu
    text: のちにCDの追加は、最長6日で店へ。なぜCDなのか、答えは売り方に出てきます。
    reading: のちに しーでぃーの ついかわ、さいちょう むいかで みせえ。なぜ しーでぃーなのか、こたえわ うりかたに でて きます。
  - speaker: reimu
    text: ただこのCDが、任天堂との話をこじらせます。
    reading: ただ この しーでぃーが、にんてんどうとの はなしお こじらせます。
# ---- 1987年・京都通い（音源チップは1行。フロッピーと音の悪口は使わない） ----
- id: card1987
  title: ''
  background: pl_card_1987
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1987年。久夛良木は、京都の任天堂に通い始めます。
    reading: せんきゅうひゃく はちじゅうななねん。くたらぎわ、きょうとの にんてんどうに かよい はじめます。
# ---- 京都の応接室 → 1990年1月の調印のあと、ソニーの担当の部屋（判を押したのは大賀と山内。権利の線は東洋経済・Wikipedia の形まで） ----
- id: ch1_keiyaku
  title: CDは開放してやる
  background: pl_osetsu
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 久夛良木, emotion: happy}
  - {who: shain, x: 0.9, emotion: normal}
  cuts:
  - speaker: shain
    emotion: happy
    text: '[久夛良木|クタラギ]さん、もう任天堂の社員みたいですね。'
  - speaker: zundamon
    emotion: happy
    text: 音の部品の注文も、もらったからな。
  - speaker: reimu
    text: 1990年1月。両社の社長が、CDの読める次のゲーム機を一緒に作る約束に判を押します。
    reading: せんきゅうひゃく きゅうじゅうねん いちがつ。りょうしゃの しゃちょうが、しーでぃーの よめる つぎの げーむきお いっしょに つくる やくそくに はんお おします。
    background: pl_keiyaku
  - speaker: shain
    emotion: normal
    text: 室長。CDのソフトを出す許しは、うちが持つんですよね。
  - speaker: zundamon
    emotion: happy
    text: そうだ。CDは、うちに任せるという話だ。
  - speaker: shain
    emotion: thinking
    text: CDのゲームまでうちが許すなら、あとで揉めませんか。
  - speaker: zundamon
    emotion: normal
    text: 社長どうしが判を押した約束だ。
  - speaker: shain
    emotion: happy
    text: 部屋の名前も、PS事業室ですしね。
  - speaker: zundamon
    emotion: happy
    text: プレイステーションの、PSだ。
  - speaker: reimu
    text: 丸山は2016年に、この約束をこう言います。マスクROMは触らせないけど、CD-ROMは開放してやる。
    reading: まるやまわ にせん じゅうろくねんに、この やくそくお こう いいます。ますくろむわ さわらせない けど、しーでぃーろむわ かいほう してやる。
    telops:
    - {text: "丸山「CD-ROMは開放してやる」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: shain
    emotion: thinking
    text: ……任天堂さんは、それで本当にいいんでしょうか。
  - speaker: reimu
    text: その点をはっきりさせないまま、計画は進みます。判を押した約束が揺らぐのは、翌年の6月です。
    reading: その てんお はっきり させない まま、けいかくわ すすみます。はんお おした やくそくが ゆらぐのわ、よくねんの ろくがつです。
# ---- 1991年6月・シカゴの家電見本市（日にちは言わない。「ソニーの発表の翌日」まで。本人の驚きは短く） ----
- id: card1991
  title: ''
  background: pl_card_1991
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 1991年6月、アメリカ・シカゴの家電見本市。
    reading: せんきゅうひゃく きゅうじゅういちねん ろくがつ、あめりか しかごの かでん みほんいち。
- id: ch2_ces
  title: 発表の翌日
  background: pl_tenjikai
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 久夛良木, emotion: happy}
  - {who: shain, x: 0.8, emotion: happy}
  cuts:
  - speaker: reimu
    text: ソニーは、スーパーファミコンのソフトもCDも動く機械を発表します。仮の名前は、プレイステーション。
    reading: そにーわ、すーぱーふぁみこんの そふとも しーでぃーも うごく きかいお はっぴょう します。かりの なまえわ、ぷれいすてーしょん。
  - speaker: shain
    emotion: happy
    text: 室長、ブースに人だかりです！
  - speaker: zundamon
    emotion: happy
    text: 目標は秋に4万9800円。最初の年に300万台だ。
  - speaker: shain
    emotion: surprised
    text: 300万台！ 秋が待ち遠しいですね！
  - speaker: shain
    emotion: surprised
    text: 室長！ 一夜明けたら、任天堂がフィリップスと組むと発表しました！
    se: gaan
    telops:
    - {text: "発表の翌日 任天堂はフィリップスと", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: ……ボクらの発表は、きのうなのだ。
  - speaker: shain
    emotion: thinking
    text: スーパーファミコンで遊べるCDの機械を、フィリップスと作るそうです。
  - speaker: shain
    emotion: thinking
    text: フィリップスは、テレビにつなぐ自分のCDの機械も出すところですし。
  - speaker: shain
    emotion: surprised
    text: 会場は、ソニーとフィリップスのどっちが本命かで大騒ぎです。
  - speaker: zundamon
    emotion: thinking
    text: 任天堂は、なんと言ってる。
  - speaker: shain
    emotion: thinking
    text: 米国の幹部が、記者に話しています。
  - speaker: shain
    emotion: thinking
    text: 技術の面からはフィリップスと組むほうがよい、と技術者が結論を出したと。
  - speaker: zundamon
    emotion: sad
    text: ……技術の面、か。
  - speaker: reimu
    text: その夜、久夛良木はアメリカから東京の社員に電話をかけ、火消しを相談します。
    reading: その よる、くたらぎわ あめりかから とうきょうの しゃいんに でんわお かけて ひけしお そうだん します。
# ---- 今の部屋（任天堂の筋。悪者にしない。主語を付ける。1万円のうち3000円は「とも言われる」） ----
- id: ch2_heya
  title: 任天堂の筋
  background: pl_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: 判まで押したのに、なんで別の会社と組むのだ！
  - speaker: zundamon
    emotion: angry
    text: これじゃ1億台どころか、1台も出ないのだ！
  - speaker: tsumugi
    emotion: normal
    text: 任天堂の側にも、心配があったの。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: CDのソフトを出す許しの権利を、ソニーが持つ契約。そこを危ぶんだ、とされているわ。
  - speaker: zundamon
    emotion: thinking
    text: 許しを持つと、何が変わるのだ？
  - speaker: tsumugi
    emotion: normal
    text: カセットのソフトなら、1万円のうち3000円ほどが任天堂の取り分とも言われるの。
  - speaker: tsumugi
    emotion: normal
    text: CDのソフトの許しがソニーにあれば、その取り分の一部がソニーへ行くわ。
  - speaker: tsumugi
    emotion: thinking
    text: 任天堂から見れば、家の鍵を半分渡すような契約だったの。
  - speaker: zundamon
    emotion: thinking
    text: 鍵を半分……それは、こわい。
  - speaker: tsumugi
    emotion: normal
    text: 任天堂の社長の山内溥は、のちにこう語っているわ。
  - speaker: tsumugi
    emotion: normal
    text: 可能性が広がってもだめなのです。高性能と面白さは別物です
  - speaker: zundamon
    emotion: thinking
    text: 性能より、面白さ……。
  - speaker: zundamon
    emotion: thinking
    text: で、別れたあとはどうなるのだ……。
  - speaker: tsumugi
    emotion: normal
    text: まずは、よりを戻す話し合いが1年続くの。
    beat: true
# ---- 1991年6月〜1992年・1年の話し合いと15億円（出井は台詞なし。大賀の電話は中身を書かない） ----
- id: ch2_kosho
  title: 1年の話し合い
  background: pl_keiyaku
  bgm: serious
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 久夛良木, emotion: thinking}
  - {who: shain, x: 0.9, emotion: normal}
  cuts:
  - speaker: reimu
    text: 取締役の出井伸之を中心に、ソニーは1年にわたって任天堂と話し合います。
    reading: とりしまりやくの いでい のぶゆきお ちゅうしんに、そにーわ いちねんに わたって にんてんどうと はなしあいます。
  - speaker: shain
    emotion: normal
    text: 社長も、任天堂とフィリップスのトップに電話をかけたそうです。
  - speaker: zundamon
    emotion: thinking
    text: ……それで、どうなった。
  - speaker: shain
    emotion: normal
    text: 年明けに、任天堂さんと互換の機械で話がまとまりました。
  - speaker: zundamon
    emotion: surprised
    text: まとまった？ CDのソフトの許しは？
  - speaker: shain
    emotion: sad
    text: ……任天堂さんに、移すそうです。
  - speaker: zundamon
    emotion: thinking
    text: 許しまで、渡すのか……。
  - speaker: reimu
    text: 1992年の初めのことです。それでもその年の夏までに、ソニーは任天堂向けの機械をやめます。
    reading: せんきゅうひゃく きゅうじゅうにねんの はじめの ことです。それでも その としの なつまでに そにーわ、にんてんどうむけの きかいお やめます。
  - speaker: zundamon
    emotion: sad
    text: ……任天堂さんとの機械は、ここまでか。
  - speaker: shain
    emotion: sad
    text: '[ソニー・ミュージック|ソニーミュージック]のゲームの企画も中止です。損は、約[15億円|ジュウゴオクエン]だと。'
  - speaker: zundamon
    emotion: sad
    text: ……[15億円|ジュウゴオクエン]が、消えたのだ。
    se: shobon
