  - speaker: zundamon
    emotion: surprised
    text: 作った！？
    telops:
    - {text: "本人「メディアが勝手に作った」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 家のゲーム機で立体の映像を、という考えは任天堂と組む前の研究所からあったの。
  - speaker: tsumugi
    emotion: thinking
    text: 丸山は2016年に、ソニーの中で話が大きくなった面も語っているわ。
  - speaker: tsumugi
    emotion: normal
    text: 丸山のたとえでは、テナントのひと部屋を断られただけ。
  - speaker: tsumugi
    emotion: normal
    text: それを[久夛良木|クタラギ]は、社内でこんな話にしていったと。
  - speaker: tsumugi
    emotion: normal
    text: 悔しいから歌舞伎座ビルの隣に、歌舞伎座ビルより巨大なビルを建てるべきだ
  - speaker: zundamon
    emotion: surprised
    text: ひと部屋で、隣に巨大なビル！？
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 2019年には、両社の思いが合わなかったと英語で振り返っているわ。
  - speaker: tsumugi
    emotion: thinking
    text: 業界を先へ進めたいソニーと、ある程度の管理を保ちたい任天堂。
  - speaker: zundamon
    emotion: thinking
    text: 仕返しじゃなくて、考えが合わなかった……。
    beat: true
# ---- 論争2：社長のひと言ですべて決まった？（言葉は資料で違う。Do it は会議の呼び名） ----
- id: ronso2
  title: 社長のひと言で？
  background: pl_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: じゃあ社長のやってみろのひと言で、全部決まったのだ！
  - speaker: tsumugi
    emotion: normal
    text: まず、その言葉が資料で違うの。
  - speaker: tsumugi
    emotion: normal
    text: 丸山の連載では、そこまで言うならやってみろ。
  - speaker: tsumugi
    emotion: normal
    text: 本人の英語の回想だと、できると信じるならやりなさいだったの。
  - speaker: tsumugi
    emotion: normal
    text: '[Do it|ドゥーイット]は、会議の呼び名なのよ。'
  - speaker: zundamon
    emotion: surprised
    text: 言葉まで、ちがうの！？
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: それに会議の前には1年の話し合いがあって、試作機もほぼできていた。
  - speaker: tsumugi
    emotion: normal
    text: 会議のあとは軒先と80人ほどの部隊、100社まわりとナムコが必要だったの。
  - speaker: tsumugi
    emotion: normal
    text: 本人も2017年に、音楽の会社と組んだのが大きかったと話しているわ。
  - speaker: tsumugi
    emotion: thinking
    text: 社長のひと言は、扉を開けただけ。中に机を並べたのは、音楽の会社だったの。
  - speaker: zundamon
    emotion: thinking
    text: 扉の向こうは、借りた机……。
# ---- 本当の注意点（出荷の数・値引きの禁止。罰金と言わない。買い物の助言にしない） ----
- id: chui
  title: 出荷の数と値引き
  background: pl_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 1つめ。ゲーム機の累計の台数は、多くがお店に出した出荷の数よ。
  - speaker: zundamon
    emotion: surprised
    text: 遊んでいる人の数じゃないのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 2つめ。プレイステーションは安く売ったから[勝った|カッタ]、とも言われるわね。
  - speaker: tsumugi
    emotion: thinking
    text: 値段は安かった。でも店が勝手に値引きすることは、許さなかったの。
  - speaker: zundamon
    emotion: surprised
    text: 安いのに、値引きはだめ！？
  - speaker: tsumugi
    emotion: normal
    text: '[公正取引委員会|コウセイトリヒキイインカイ]が2001年の審決で、'
  - speaker: tsumugi
    emotion: normal
    text: 新品のソフトの値引きを禁じたことなどを、独占禁止法の違反と認めたの。
  - speaker: tsumugi
    emotion: normal
    text: 中古を扱わせない決まりも、その値引き禁止を支えるものとされたわ。
  - speaker: tsumugi
    emotion: normal
    text: 値引き禁止の決まりは、審決の前にもう無くなっていたとも認められているわ。
  - speaker: zundamon
    emotion: thinking
    text: 店の売る値段を、メーカーが縛っちゃだめなのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 買う側から見れば、同じ新品でも店によって値段が違っていいの。
