# ---- 論争1：任天堂への仕返し？（「裏切り」「復讐」は俗説の言葉としてだけ。本人の打ち消しと任天堂側の言い分） ----
- id: ronso1
  title: 任天堂への仕返し？
  background: pl_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ プレステは、任天堂に裏切られたソニーの復讐だって！
  - speaker: tsumugi
    emotion: normal
    text: そう語られることは多いわ。任天堂の発表は、ソニーの発表の翌日だったし。
  - speaker: zundamon
    emotion: happy
    text: ほら、やっぱりなのだ！
  - speaker: tsumugi
    emotion: normal
    text: でも本人は2018年に、両社の対立はメディアが勝手に作ったと話しているの。
