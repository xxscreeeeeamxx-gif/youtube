# playstation-kutaragi 読み台帳（人名・地名・社名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 久夛良木・大賀 / label: 社長・役員・丸山・社員・技術者・ゲーム会社・ナムコの人・問屋・客・店員）・
# テロップ・章タイトルは表示専用なのでタグを付けていない。
#
# 2026-11-18 台本を書いたあと、セリフ全行を VOICEVOX の audio_query（話者3）にかけた結果:
# - 久夛良木 は [久夛良木|クタラギ] で クタラギサン・クタラギノ・クタラギワ（1語）。タグなしでも クタラギ だった。
# - 大賀 はタグなしだと タイガノ になった（いまのセリフには 大賀 は出てこない。ナレは reading）。
# - 丸山 は dictionary.yaml に登録済み（マルヤマ）。タグを付けていない。台帳にも入れていない（ナレは reading）。
# - 任天堂 はタグなしで ニンテンドオ（1語）。[任天堂|にんてんどう] は ニン/テンドオ と切れた → タグなし。台帳に入れていない。
# - フィリップス はタグなしで フィリップス。[フィリップス|ふぃりっぷす] は フィリッ/プス と切れた → タグなし。台帳に入れていない。
# - 山内溥 はタグなしで ヤマウチヒロシ（1語）。[山内溥|やまうちひろし] は ヤマウチ/ヒロシ と切れた → タグなし。台帳に入れていない。
#   「のちにこうも語っている」の こうも が コウモ になった → 「のちにこう語っている」。
# - ナムコ・シカゴ・ソニー・セガ はカタカナのまま正しく読む（シカゴはナレだけ）。台帳に入れていない。
# - 公正取引委員会 はひらがなのタグだと コオセイ/トリヒキイインカイ と切れ、直後の「は」が ハ になった
#   → カタカナのタグ [公正取引委員会|コウセイトリヒキイインカイ] にし、助詞を「が」にした（コオセイトリヒキイインカイガ。1語）。
# - PS5 はタグなしで ピイエスゴ → [PS5|ピイエスファイブ] で ピイエスファイブ（1語）。[PS5|ピーエスファイブ] は ピイ/エスファイブ と切れた。
#   PS2・PS4 はタグなしで ピイエスツウ・ピイエスフォオ。
# - 15億円 はタグなしで ジュウ/ゴオクエン と2句 → [15億円|ジュウゴオクエン] で1句。
# - 中黒と「-」で間が入る語（マライア・キャリー、ソニー・ミュージック、CD-ROM）は、セリフでは
#   [マライア・キャリー|マライアキャリー]・[ソニー・ミュージック|ソニーミュージック]・[CD-ROM|シーディーロム] にした（間なしで1句）。
# - 勝った は readings_common（マサッタ対策）にある → [勝った|カッタ]。ひらがなのタグは ヤスクウッタ/カラカッタ と切れた。
# - 遊んでる人 が アソンデ/ルニン になった → 「遊んでいる人」（アソンデ/イル/ヒトノ）。
# - 本日の分 が ホンジツノ/ワケ になった（本日分も ホンジツ/ワケ）→ 「今日の分は」（キョオノ/ブンワ）。
# - 一部屋 が イチヘヤ になった → 「ひと部屋」（ヒトヘヤ）。
# - 角の向こう が カクノ になった → [角|かど]。
# - 「いくぜ100万台！です」は「！」で間が入った → 「いくぜ100万台です！」（ヒャク/マンダイデス）。
# - 出荷（シュッカ）・立体（リッタイ）・許し（ユルシ）・塩対応（シオタイオオ）・軒先（ノキサキ）・演算（エンザン）・
#   アーケード基板（アアケエドキバン）・審決（シンケツ）・独占禁止法・互換（ゴカン）・年明け（トシアケ）・一夜明けたら（イチヤ/アケタラ）・
#   歌舞伎座（カブキザ）・テナント・資源（シゲン）・抵抗（テエコオ）・おもちゃ扱い（オモチャアツカイ）・縛っちゃ（シバッチャ）・
#   電気通信大学・特別客員教授・母校（ボコオ）・名刺（メエシ）・新プロジェクトX（シンプロジェクト/エックス）・
#   PS事業室（ピイエスジギョオシツ）・ROMカセット（ロムカセット）・Do it（[Do it|ドゥーイット] で ドゥウイット）・
#   最初の年に（トシニ）・経営会議（ケエエエカイギ）は正しく読んだ。台帳には入れていない。
