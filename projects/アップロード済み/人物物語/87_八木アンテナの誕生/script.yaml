scenes:
- id: co_yagi
  title: ''
  background: yg_singapore_note
  bgm: serious
  stage:
  - {who: shoukou, x: 0.28, emotion: thinking}
  - {who: gishi, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1942年のシンガポールで、日本軍の将校が八木アンテナのことを書いた敵のノートをごみ焼き場で拾います。
    reading: せんきゅうひゃく よんじゅうにねんの しんがぽーるで、にほんぐんの しょうこうが やぎ あんてなの ことお かいた てきの のーとお ごみやきばで ひろいます。
  - speaker: shoukou
    emotion: thinking
    text: イギリス兵のノートだ。送信のアンテナは、[YAGI|ワイエージーアイ]アレイ……。
  - speaker: gishi
    emotion: thinking
    text: 受信には、その[YAGI|ワイエージーアイ]を4つ使うとあります。
  - speaker: shoukou
    emotion: angry
    text: この[YAGI|ワイエージーアイ]とは[何|なん]だ。敵の新しい兵器か。
  - speaker: gishi
    emotion: surprised
    text: 分かりません。ヤギと読むのか、ヤジと読むのかも……。
  - speaker: shoukou
    emotion: surprised
    text: 読み方も分からんのか！
    se: don
  - speaker: reimu
    text: YAGIは日本人の名前でした。仙台で生まれて18年、日本の軍はこのアンテナの名前すら読めなかったのです。
    reading: やぎわ にほんじんの なまえでした。せんだいで うまれて じゅうはちねん、にほんの ぐんわ この あんてなの なまえすら よめなかったのです。
- id: hook
  title: ''
  background: yg_yane
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ見て！ 屋根に[八木|やぎ]式のアンテナを付けたのだ。
  - speaker: zundamon
    emotion: happy
    text: ヤギの[角|つの]みたいな骨なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: '[八木|やぎ]は、人の名前よ。'
  - speaker: zundamon
    emotion: surprised
    text: ……メェって鳴かないのか。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 戦争中の日本の軍も、読めなかった名前よ。
  - speaker: zundamon
    emotion: surprised
    text: 日本の発明なのに！？ なんで？
    telops:
    - {text: なぜ日本は知らなかった？, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 形にしたのは、[八木|やぎ]さんの弟子の宇田新太郎さん。
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、先生をやめて大学に入り直した日よ。
- id: card1896
  title: ''
  background: yg_card_1896
  cuts:
  - speaker: reimu
    text: 1896年。富山県で、宇田新太郎が生まれます。
    reading: せんはっぴゃく きゅうじゅうろくねん。とやまけんで、うだ しんたろうが うまれます。
  - speaker: reimu
    text: 両親は学校の先生で、宇田は小学3年から魚津の町で育ちました。
    reading: りょうしんわ がっこうの せんせいで、うだわ しょうがく さんねんから うおづの まちで そだちました。
- id: ch1_kyoshi
  title: 先生をやめる
  background: yg_gakkou
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 宇田新太郎, emotion: normal}
  - {who: douryou, x: 0.7, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 広島の高等師範学校を出た宇田は、長野の大町中学で教えていました。
    reading: ひろしまの こうとう しはん がっこうお でた うだわ、ながのの おおまち ちゅうがくで おしえて いました。
  - speaker: douryou
    emotion: surprised
    text: 宇田先生。辞表を出したって、本当ですか。
  - speaker: zundamon
    emotion: normal
    text: はい。大学に入り直して、電気を学びたいんです。
  - speaker: douryou
    emotion: thinking
    text: 先生が、学生に戻る？ 給料も出なくなりますよ。
  - speaker: zundamon
    emotion: happy
    text: 仙台の東北帝国大学に、電気の学科があるんです。
  - speaker: douryou
    emotion: angry
    text: 生徒にどう言うんです。先生は来月から学生です、とでも？
  - speaker: zundamon
    emotion: happy
    text: 宿題を出す側から、出される側になるのだ。
  - speaker: douryou
    emotion: surprised
    text: ……大学に入ったら、同級生はみんな年下ですよ！
  - speaker: zundamon
    emotion: happy
    text: じゃあ、クラスで一番えらそうにできるのだ。
  - speaker: douryou
    emotion: angry
    text: 学生が、えらそうにしてどうするんです。
    se: hammer
  - speaker: reimu
    text: 1921年、宇田は東北帝国大学の電気工学科に入学します。
    reading: せんきゅうひゃく にじゅういちねん、うだわ とうほく ていこく だいがくの でんき こうがっかに にゅうがく します。
- id: ch1_yagi
  title: 弱い電気の時代
  background: yg_lab
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 宇田新太郎, emotion: normal}
  - {who: yagi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 大学で待っていたのは、教授の八木秀次でした。大阪の生まれです。
    reading: だいがくで まって いたのわ、きょうじゅの やぎ ひでつぐでした。おおさかの うまれです。
  - speaker: yagi
    emotion: normal
    text: '[君|きみ]が宇田くんか。先生をやめて来たんやてな。'
  - speaker: zundamon
    emotion: normal
    text: はい。電気の勉強を、一からやり直したくて。
  - speaker: yagi
    emotion: happy
    text: ええ心がけや。これからは、弱い電気の時代やで。
  - speaker: zundamon
    emotion: thinking
    text: 弱い電気……ですか？ 強いほうが、かっこいい気がしますけど。
  - speaker: yagi
    emotion: normal
    text: 発電所やモーターだけが、電気やない。遠くと話す通信こそ、これからや。
  - speaker: zundamon
    emotion: thinking
    text: 先生は、どこでそう思ったんですか。
  - speaker: yagi
    emotion: normal
    text: ドイツに留学しとったら、戦争が始まってな。イギリスへ移ったんや。
  - speaker: yagi
    emotion: happy
    text: そこで無線の大先生に学んで、確信したんや。
  - speaker: zundamon
    emotion: surprised
    text: 戦争から逃げた先で、勉強してたんですか！
  - speaker: yagi
    emotion: normal
    text: 帰りにはアメリカにも寄った。3つの国を回ったわけや。
  - speaker: zundamon
    emotion: happy
    text: ……留学というより、世界一周ですね。
  - speaker: yagi
    emotion: thinking
    text: 遊んどったんやないで。
    beat: true
  - speaker: reimu
    text: 八木は雑誌に文章を書き、弱い電気の研究も大事だと訴えていました。
    reading: やぎわ ざっしに ぶんしょうお かき、よわい でんきの けんきゅうも だいじだと うったえて いました。
- id: card1924
  title: ''
  background: yg_card_1924
  cuts:
  - speaker: reimu
    text: 1924年。八木の研究室で、卒業を控えた学生が実験をしていました。
    reading: せんきゅうひゃく にじゅうよねん。やぎの けんきゅうしつで、そつぎょうお ひかえた がくせいが じっけんお して いました。
- id: ch2_kizuki
  title: 電流計のおかしな振れ
  background: yg_lab
  bgm: curious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 宇田新太郎, emotion: normal}
  - {who: nishimura, x: 0.56, emotion: thinking}
  - {who: yagi, x: 0.78, emotion: normal}
  cuts:
  - speaker: nishimura
    emotion: thinking
    text: 宇田さん、ちょっと見てください。電流計の振れ方が、変なんです。
  - speaker: zundamon
    emotion: normal
    text: また配線が、外れてるんじゃないか。
  - speaker: nishimura
    emotion: sad
    text: 3回つなぎ直しました。[何|なに]も置かない時より、大きく振れるんです。
  - speaker: zundamon
    emotion: surprised
    text: '[何|なに]も置かない時より、大きく？'
    se: bikkuri
  - speaker: nishimura
    emotion: normal
    text: そばに置くコイルの形を変えると、振れ方も変わるんです。
  - speaker: yagi
    emotion: normal
    text: 西村くん。[何|なに]を騒いどるんや。
  - speaker: nishimura
    emotion: thinking
    text: 先生、測り間違いかもしれません。卒業研究、やり直しでしょうか。
  - speaker: yagi
    emotion: thinking
    text: どれ。……ほう、これは面白い。
  - speaker: yagi
    emotion: happy
    text: 間違いかどうかも、測って確かめるんや。おかしな数字ほど、大事にせえ。
  - speaker: zundamon
    emotion: thinking
    text: おかしな数字ほど……。
  - speaker: reimu
    text: 西村は3月に卒業します。八木は助手に、コイルを1本の金属の棒に替えて調べさせました。
    reading: にしむらわ さんがつに そつぎょう します。やぎわ じょしゅに、こいるお いっぽんの きんぞくの ぼうに かえて しらべさせました。
  - speaker: reimu
    text: すると棒の長さによって、電流は大きく増えたり減ったりしました。
    reading: すると ぼうの ながさに よって、でんりゅうわ おおきく ふえたり へったり しました。
- id: ch2_koushi
  title: 電波を導く棒
  background: yg_lab
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 宇田新太郎, emotion: normal}
  - {who: yagi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 同じ春に卒業した宇田は、秋に講師になってアンテナの研究を始めます。
    reading: おなじ はるに そつぎょう した うだわ、あきに こうしに なって あんてなの けんきゅうお はじめます。
  - speaker: yagi
    emotion: normal
    text: 宇田くん。アンテナの後ろに長い棒を置くと、電波は前へ跳ね返されるな。
  - speaker: zundamon
    emotion: normal
    text: はい。反射器ですね。
  - speaker: yagi
    emotion: thinking
    text: ほな、前に少し短い棒を置いたらどうなる。
  - speaker: zundamon
    emotion: thinking
    text: 前の棒は……邪魔になるだけでは？
  - speaker: yagi
    emotion: happy
    text: それがな。電波を前へ導くんやないかと、わしはにらんどる。
  - speaker: zundamon
    emotion: surprised
    text: 棒が、電波の道案内をするんですか？
  - speaker: yagi
    emotion: normal
    text: 理屈はわしが考える。[君|きみ]は、それを実験で確かめてくれ。
  - speaker: zundamon
    emotion: happy
    text: はい！ やってみます。
  - speaker: yagi
    emotion: happy
    text: お[金|かね]は心配いらん。仙台の財団から研究費が出とる。
  - speaker: zundamon
    emotion: surprised
    text: 研究費が！？
  - speaker: zundamon
    emotion: happy
    text: じゃあ、真鍮の棒を山ほど買えますね！
  - speaker: yagi
    emotion: thinking
    text: ……山ほどは、[要らん|いらん]やろ。
    beat: true
  - speaker: reimu
    text: 八木はのちに、半波長より短い棒が電波を導くと話して研究を勧めたと書いています。
    reading: やぎわ のちに、はんはちょうより みじかい ぼうが でんぱお みちびくと はなして けんきゅうお すすめたと かいて います。
- id: ch2_jikken
  title: 真鍮の棒を並べて
  background: yg_jikken
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 宇田新太郎, emotion: normal}
  - {who: gakusei, x: 0.7, emotion: thinking}
  cuts:
  - speaker: gakusei
    emotion: thinking
    text: 宇田先生。電波を出す装置も、波長を測る計器も売ってませんよ。
  - speaker: gakusei
    emotion: thinking
    text: 機械も無いのに、どうやって実験するんです？
  - speaker: zundamon
    emotion: normal
    text: 無いなら作る。真空管で、電波を出す装置からだ。
  - speaker: gakusei
    emotion: surprised
    text: 装置から手作りですか！？
  - speaker: zundamon
    emotion: normal
    text: 波長は、2本の電線に電波を流して測る。強い所と弱い所の間を測るんだ。
  - speaker: gakusei
    emotion: normal
    text: ……出ました。波長は4.4メートルです。
  - speaker: zundamon
    emotion: happy
    text: よし。前に、短い棒を1本ずつ並べていくぞ。
  - speaker: gakusei
    emotion: surprised
    text: 1本足すたびに、検流計の針が上がっていきます！
  - speaker: zundamon
    emotion: happy
    text: もう1本だ。
  - speaker: gakusei
    emotion: thinking
    text: ……先生、これで[何本目|なんぼんめ]ですか。
  - speaker: zundamon
    emotion: happy
    text: 数えるのは、あとでいいのだ。もう1本！
  - speaker: gakusei
    emotion: sad
    text: 先生。部屋の端まで、棒で埋まりました。
    background: yg_jikken_bou
  - speaker: zundamon
    emotion: happy
    text: なら、廊下まで並べればいいのだ。
  - speaker: gakusei
    emotion: angry
    text: 運ぶのは、ボクなんですけど！
    se: tsukkomi
  - speaker: reimu
    text: 180センチの真鍮の棒を、150センチおきに最大25本まで並べて測りました。
    reading: ひゃくはちじっせんちの しんちゅうの ぼうお、ひゃくごじっせんち おきに さいだい にじゅうごほんまで ならべて はかりました。
  - speaker: zundamon
    emotion: thinking
    text: 後ろの反射器と、前の導波器。両方を組み合わせたら……。
  - speaker: gakusei
    emotion: surprised
    text: 針が、振り切れそうです！
  - speaker: zundamon
    emotion: happy
    text: 電波が、一つの方向にぎゅっと集まってる。電波のビームなのだ！
    telops:
    - {text: 電波のビーム, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: 反射器と導波器を組み合わせることを思いついた、と宇田は振り返っています。
    reading: はんしゃきと どうはきお くみあわせる ことお おもいついたと、うだわ ふりかえって います。
  - speaker: reimu
    text: この学生は、卒業の日まで毎日この実験を手伝いました。
    reading: この がくせいわ、そつぎょうの ひまで まいにち この じっけんお てつだいました。
- id: card1925
  title: ''
  background: yg_card_1925
  cuts:
  - speaker: reimu
    text: 1925年12月。宇田は、わずか6行の報告を学会の雑誌に載せます。
    reading: せんきゅうひゃく にじゅうごねん じゅうにがつ。うだわ、わずか ろくぎょうの ほうこくお がっかいの ざっしに のせます。
- id: ch2_6gyou
  title: 6行の報告
  background: yg_lab
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 宇田新太郎, emotion: normal}
  - {who: yagi, x: 0.7, emotion: surprised}
  cuts:
  - speaker: yagi
    emotion: surprised
    text: 宇田くん、雑誌の報告を読んだで。……6行やないか。
  - speaker: zundamon
    emotion: normal
    text: はい。6行です。
  - speaker: yagi
    emotion: thinking
    text: 1年がかりの実験が、6行か。電報より、ちょっと長いくらいやな。
    beat: true
  - speaker: zundamon
    emotion: sad
    text: 書けることが、まだ少ないので……。
  - speaker: yagi
    emotion: thinking
    text: ほんで、前の棒が電波を導く話はどこに書いたんや。
  - speaker: zundamon
    emotion: normal
    text: ……書いてません。
  - speaker: yagi
    emotion: surprised
    text: 肝心のとこが、入ってへんがな！
    se: zukko
  - speaker: zundamon
    emotion: sad
    text: もっと確かめてから、書こうと思いまして……。
  - speaker: yagi
    emotion: normal
    text: まあええ。続きは、[何回|なんかい]かに分けて書いたらええ。
  - speaker: reimu
    text: 同じ12月の28日、八木は電波指向方式という特許を出願します。
    reading: おなじ じゅうにがつの にじゅうはちにち、やぎわ でんぱ しこう ほうしきと いう とっきょお しゅつがん します。
  - speaker: reimu
    text: 出願人は、八木ひとりの名前でした。
