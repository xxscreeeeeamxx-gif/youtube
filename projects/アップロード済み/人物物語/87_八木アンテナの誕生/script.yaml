meta:
  title: 【八木アンテナの誕生】日本軍が読めなかったYAGIは日本人の名前だった【ずんだもん解説】
  slug: yagi-uda-antenna-v2
  summary: 屋根の上の魚の骨のようなテレビアンテナ。正式には八木・宇田アンテナと呼ばれます。1920年代の仙台。学校の先生をやめて大学に入り直した宇田新太郎は、八木秀次のもとで、電流計のおかしな振れから真鍮の棒を並べる実験を始めます。ところが生まれたアンテナを、日本はほとんど使いませんでした。その価値を日本が知るきっかけは、戦争中に見つかった一冊の敵のノートでした。二人の歩みを、再現ドラマでたどります。
  tags:
  - 八木アンテナ
  - 八木・宇田アンテナ
  - 宇田新太郎
  - 八木秀次
  - 東北大学
  - テレビアンテナ
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 雑学
