# ロータリーエンジン・再現ドラマ（[山本健一|やまもとけんいち]・1922→2017）。投稿前に必ず目視レビュー。
# ★企業の一代記シリーズ5本目。技術の壁を1つずつ潰していく型で、図解が映える題材。
# ★配役: ずんだもん=山本健一 / つむぎ=現代から見ている解説役 / ナレ=ゆっくり
# ★ミーム禁止の章: なし（技術と競争の話で、死や逮捕の場面が無い）。
#   ただしオイルショックの章は生活が苦しい話なので軽口を減らす
# 裏取り: 山本健一(マツダ)Wikipedia / Webモーターマガジン「山本健一とロータリーエンジン」/
#   clicccar「最大の難関チャターマークとの戦いと克服」/ マツダ公式ルマン優勝メモリアル
# 確定事実:
#   1922-9-16 生 / 2017-12-20 没。熊本県出身
#   東京帝国大学 第一工学部 機械工学科を1944年9月に繰り上げ卒業
#   1946-2 東洋工業（現マツダ）入社。変速機の組立工場に配属
#   1962-12 西ドイツのNSUを訪問 / 1963-3 ロータリーエンジン開発に専念せよと指示される
#   1963-4 ロータリエンジン研究部を設立。47人が集結し「ロータリー47士」。山本は部長
#   最大の難関「チャターマーク（悪魔の爪痕）」:
#     ローター先端のアペックスシールとハウジングの摺動部に出る波状摩耗。
#     そこから圧縮ガスと燃焼ガスが漏れ、熱効率が落ちて出力と燃費が急激に悪化する
#     解決①アペックスシールの固有振動数を変えるため、縦と横に穴を開ける「クロスホロー」
#     解決②日本カーボンが特殊なカーボンパウダーを開発。マツダがそこへアルミを含浸させる
#        技術を完成させた。このカーボンシールでチャターマークが出なくなった
#   1967-5 コスモスポーツ発売（世界初の量産ロータリーエンジン車）
#   1970年代後半 オイルショックで販売不振。「フェニックス計画」燃費40%改善が目標
#   1984-11 代表取締役社長 / 1987-12 会長
#   1991年 第59回ル・マン24時間で787Bが日本車初の総合優勝。ロータリー唯一の優勝
#   本人の言葉:「自分の子供みたいなもの」（愛車について）
#   ※「元海軍将校」という記述はWikipediaに無いので使わない
meta:
  title: "【ロータリーエンジンの誕生】47人が挑んだ「悪魔の爪痕」【ずんだもん解説】"
  slug: "yamamoto-rotary"
  summary: "世界中の自動車メーカーが匙を投げたエンジンがありました。動きはするのに、数十時間で内側が波打って壊れる。原因も分からないその傷を、技術者たちは「悪魔の爪痕」と呼びます。広島の会社が集めたのは47人。ずんだもんが山本健一を演じる再現ドラマです。"
  tags: ["ロータリーエンジン", "マツダ", "山本健一", "ルマン", "自動車", "技術", "再現ドラマ", "ゆっくり", "ずんだもん", "企業史", "ミーム"]
  thumbnail:
    top: "悪魔の爪痕"
    bottom: "ロータリーエンジン"
  mode: drama
  narrator: reimu
  mobs:
    - {id: buchou, label: "上司", voice: 13, pitch: -0.08, item: hat}
    - {id: gishi, label: "研究部の技師", voice: 12, pitch: 0.02}
    - {id: gishif, label: "研究部の技師", voice: 8, pitch: 0.06}
    - {id: nsu, label: "NSUの技術者", voice: 13, pitch: -0.04, item: hat}
    - {id: carbon, label: "カーボン会社の人", voice: 42, pitch: 0.0}
    - {id: hanbai, label: "販売の人", voice: 13, pitch: -0.02, item: hat}
    - {id: driver, label: "レースの人", voice: 12, pitch: 0.04}
scenes:
  - id: hook
    title: ""
    background: il_rot_ima
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: zundamon
        emotion: happy
        text: "つむぎ、エンジンって何回転してると思う？"
      - speaker: tsumugi
        emotion: normal
        text: "急にどうしたの。"
      - speaker: zundamon
        emotion: happy
        text: "ボクは知ってるのだ。ピストンが上下してるんだろ。"
      - speaker: tsumugi
        emotion: happy
        text: "うん。上がって、下がって。"
      - speaker: zundamon
        emotion: normal
        text: "上下運動を、回転に変えてるのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "よく知ってるじゃん。"
      - speaker: zundamon
        emotion: thinking
        text: "……いま自分で言って、気づいたのだ。"
      - speaker: zundamon
        emotion: surprised
        text: "回したいのに、なんで一回上下させるのだ？"
      - speaker: tsumugi
        emotion: surprised
        text: "……お。いい引っかかり方したね。"
      - speaker: zundamon
        emotion: angry
        text: "無駄だろ。最初から回せばいいのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。実はね、それを本当にやったエンジンがあるの。"
      - speaker: zundamon
        emotion: surprised
        text: "あるのか！"
      - speaker: tsumugi
        emotion: normal
        text: "ロータリーエンジン。おにぎりみたいな形のが、中で回ってる。"
      - speaker: zundamon
        emotion: happy
        text: "おにぎり。かわいいのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "上下運動が無いから、振動が少なくて、小さくて、よく回る。"
      - speaker: zundamon
        emotion: happy
        text: "完全上位互換じゃないか。"
      - speaker: tsumugi
        emotion: normal
        text: "……なのに、いま道を走ってる車のほとんどはピストンだよね。"
      - speaker: zundamon
        emotion: thinking
        text: "……あれ。"
      - speaker: tsumugi
        emotion: normal
        text: "世界中のメーカーが挑んで、ほぼ全部が撤退したの。"
      - speaker: zundamon
        emotion: surprised
        text: "なんでなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "動くには動く。でも数十時間で、内側が波打って壊れる。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "波打つ！？ 金属がか。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。しかも、なぜ起きるのか誰にも分からなかった。"
      - speaker: zundamon
        emotion: sad
        text: "……原因不明で壊れるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "現場は、その傷をこう呼んだの。"
      - speaker: tsumugi
        emotion: normal
        text: "「悪魔の爪痕」。"
        telops:
          - {text: "悪魔の爪痕", size: xl, position: middle-center, color: "#FFF15A", stroke: "#2A0A0A", glow: "#E85A4A", anim: up}
      - speaker: zundamon
        emotion: surprised
        text: "名前が怖すぎるだろ。"
      - speaker: tsumugi
        emotion: normal
        text: "それを消したのが、広島の会社。集めた人数は四十七人。"
      - speaker: zundamon
        emotion: surprised
        text: "四十七！ 討ち入りの人数なのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "うん。実際、そう呼ばれてる。「ロータリー四十七士」。"
      - speaker: zundamon
        emotion: normal
        text: "率いたのは誰なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "[山本健一|やまもとけんいち]。もとは、[変速機|へんそくき]の組立工場にいた人。"
      - speaker: zundamon
        emotion: surprised
        text: "エンジン屋ですらないのか。"
      - speaker: tsumugi
        emotion: happy
        text: "そう。そこから始まってる。"
      - speaker: zundamon
        emotion: normal
        text: "……よし。ボク、その人をやるのだ。"

  - id: nyusha
    title: "1946・変速機の工場"
    background: il_rot_kojo
    bgm: 10do
    stage:
      - {who: zundamon, x: 0.3, tag: "山本", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: buchou, x: 0.52}
    cuts:
      - speaker: reimu
        text: "[山本健一|やまもとけんいち]は1922年9月16日、熊本県に生まれました。"
        reading: "やまもとけんいちわせんきゅうひゃくにじゅうにねんくがつじゅうろくにち、くまもとけんにうまれました。"
      - speaker: reimu
        text: "東京帝国大学の機械工学科を、1944年9月に繰り上げで卒業します。"
        reading: "とうきょうていこくだいがくのきかいこうがっかを、せんきゅうひゃくよんじゅうよねんくがつにくりあげでそつぎょうします。"
      - speaker: zundamon
        emotion: normal
        text: "繰り上げ卒業。戦争中だからか。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。学業の期間が短くされてた時代。"
      - speaker: reimu
        text: "1946年2月、広島の[東洋工業|とうようこうぎょう]に入社します。"
        reading: "せんきゅうひゃくよんじゅうろくねんにがつ、ひろしまのとうようこうぎょうににゅうしゃします。"
      - speaker: buchou
        emotion: normal
        text: "山本くん。配属は、[変速機|へんそくき]の組立だ。"
      - speaker: zundamon
        emotion: surprised
        text: "……エンジンでは、ないんですね。"
      - speaker: buchou
        emotion: normal
        text: "組立だ。手を動かせ。"
      - speaker: zundamon
        emotion: normal
        text: "……はい。"
      - speaker: tsumugi
        emotion: normal
        text: "ここ、あとで効いてくるの。"
      - speaker: zundamon
        emotion: normal
        text: "どこがなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "組立の現場にいた人って、「作れるかどうか」で物を見る癖がつくから。"
      - speaker: zundamon
        emotion: thinking
        text: "……設計だけしてる人と、違うのか。"
      - speaker: tsumugi
        emotion: normal
        text: "図面で成立しても、量産できなきゃ商品にならないでしょ。"
      - speaker: zundamon
        emotion: normal
        text: "……そこを知ってる人が、あとで責任者になるのだな。"

  - id: shikumi
    title: "おにぎりが、回る"
    background: il_rot_kenkyu
    bgm: hirusagari
    stage:
      - {who: zundamon, x: 0.3, tag: "山本", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
    cuts:
      - speaker: zundamon
        emotion: normal
        text: "そもそも、おにぎりが回ると、なぜエンジンになるのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "お、いい質問。"
      - speaker: tsumugi
        emotion: normal
        text: "エンジンって、四つのことをやってるの。"
      - speaker: zundamon
        emotion: normal
        text: "四つ。"
      - speaker: tsumugi
        emotion: normal
        text: "吸って、縮めて、燃やして、吐く。"
      - speaker: zundamon
        emotion: normal
        text: "……ピストンだと、上下四回ぶんなのだな。"
      - speaker: tsumugi
        emotion: happy
        text: "そう。一往復で二回だから、二往復。"
      - speaker: zundamon
        emotion: thinking
        text: "……上がったり下がったりで、そのたびに止まってるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。向きが変わる瞬間は、速さがゼロになる。"
      - speaker: zundamon
        emotion: angry
        text: "止まっては動き、止まっては動き。だから震えるのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "そこが振動の正体。じゃあ、おにぎりだと？"
      - speaker: zundamon
        emotion: normal
        text: "……ずっと同じ向きに、回り続けるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "そう。止まる瞬間が無い。"
      - speaker: reimu
        text: "おにぎり型の部品が回ると、周りの空間が三つに分かれます。"
        reading: "おにぎりがたのぶひんがまわると、まわりのくうかんがみっつにわかれます。"
      - speaker: reimu
        text: "その一つ一つが、広がったり狭まったりを繰り返します。"
        reading: "そのひとつひとつが、ひろがったりせばまったりをくりかえします。"
      - speaker: zundamon
        emotion: surprised
        text: "……広がったら吸って、狭まったら縮めるのか。"
      - speaker: tsumugi
        emotion: happy
        text: "そういうこと。回るだけで、四つの仕事が順番に起きるの。"
      - speaker: zundamon
        emotion: happy
        text: "美しいのだ。無駄が無い。"
      - speaker: tsumugi
        emotion: normal
        text: "しかもね、三つの部屋が同時に別の仕事をしてる。"
      - speaker: zundamon
        emotion: surprised
        text: "……三人が同時に働いてるようなものか。"
      - speaker: tsumugi
        emotion: normal
        text: "だから小さいのに力が出る。ここまでは、いいことしかない。"
      - speaker: zundamon
        emotion: thinking
        text: "……ここまでは、な。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。問題は、おにぎりの角。"
      - speaker: zundamon
        emotion: normal
        text: "角。"
      - speaker: tsumugi
        emotion: normal
        text: "部屋を仕切ってるのは、角の一点だけなの。"
      - speaker: zundamon
        emotion: surprised
        text: "……線じゃなくて、点で[密閉|みっぺい]してるのか。"
      - speaker: tsumugi
        emotion: normal
        text: "そう。しかもその点が、内側の壁をこすりながら猛烈に動く。"
      - speaker: zundamon
        emotion: sad
        text: "……そこが壊れたら、全部おしまいなのだ。"

