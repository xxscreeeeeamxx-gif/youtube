        text: "1962年12月、彼は西ドイツのNSUという会社を訪ねます。"
        reading: "せんきゅうひゃくろくじゅうにねんじゅうにがつ、かれわにしどいつのえぬえすゆうというかいしゃをたずねます。"
      - speaker: tsumugi
        emotion: normal
        text: "ロータリーエンジンを発明した人が、いた会社ね。"
      - speaker: nsu
        emotion: happy
        text: "見てください。これが、回るエンジンです。"
      - speaker: zundamon
        emotion: surprised
        text: "……本当に、回っている。"
      - speaker: zundamon
        emotion: happy
        text: "静かだ。振動が、ほとんど無い。"
      - speaker: nsu
        emotion: happy
        text: "そうです。未来のエンジンです。"
      - speaker: zundamon
        emotion: normal
        text: "……ひとつ伺っても。"
      - speaker: zundamon
        emotion: normal
        text: "何時間、回りますか。"
      - speaker: nsu
        emotion: sad
        text: "……。"
      - speaker: zundamon
        emotion: thinking
        text: "……そうですか。"
      - speaker: tsumugi
        emotion: normal
        text: "動くのは動く。でも、長くはもたなかったの。"
      - speaker: zundamon
        emotion: normal
        text: "……止まる理由は、分かっているんですか。"
      - speaker: nsu
        emotion: sad
        text: "……内側に、傷が出ます。"
      - speaker: nsu
        emotion: sad
        text: "波のような形の。理由は、まだ分かりません。"
      - speaker: zundamon
        emotion: surprised
        text: "……。"
      - speaker: reimu
        text: "1963年3月、彼はロータリーエンジンの開発に専念するよう指示されます。"
        reading: "せんきゅうひゃくろくじゅうさんねんさんがつ、かれわろおたりいえんじんのかいはつにせんねんするようしじされます。"
      - speaker: zundamon
        emotion: surprised
        text: "……世界中が困っているものを、うちがやるのか。"
      - speaker: tsumugi
        emotion: normal
        text: "当時の[東洋工業|とうようこうぎょう]、大きい会社じゃないんだよね。"
      - speaker: zundamon
        emotion: normal
        text: "……だからこそ、なのだ。"
      - speaker: zundamon
        emotion: normal
        text: "[他|ほか]と同じものを作っていたら、うちは選ばれない。"

  - id: shijushichishi
    title: "1963・四十七人"
    background: il_rot_kenkyu
    bgm: you_and_me
    stage:
      - {who: zundamon, x: 0.3, tag: "山本", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: gishi, x: 0.5}
      - {who: gishif, x: 0.62}
    cuts:
      - speaker: reimu
        text: "1963年4月、ロータリエンジン研究部が作られます。"
        reading: "せんきゅうひゃくろくじゅうさんねんしがつ、ろおたりえんじんけんきゅうぶがつくられます。"
      - speaker: reimu
        text: "集まったのは47人。彼は部長になりました。"
        reading: "あつまったのわよんじゅうななにん。かれわぶちょうになりました。"
        telops:
          - {text: "ロータリー47士", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
      - speaker: gishi
        emotion: surprised
        text: "……部長。四十七人、というのは。"
      - speaker: zundamon
        emotion: normal
        text: "たまたまだ。"
      - speaker: gishif
        emotion: happy
        text: "討ち入りみたいですね。"
      - speaker: zundamon
        emotion: thinking
        text: "……縁起でもない。あれは全員死ぬぞ。"
      - speaker: tsumugi
        emotion: happy
        text: "そこ気にするんだ。"
      - speaker: zundamon
        emotion: normal
        text: "まず、敵の名前をはっきりさせる。"
      - speaker: gishi
        emotion: normal
        text: "内側に出る、あの傷ですね。"
      - speaker: zundamon
        emotion: normal
        text: "そうだ。"
