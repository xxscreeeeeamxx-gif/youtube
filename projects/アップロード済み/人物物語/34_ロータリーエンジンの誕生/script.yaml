      - speaker: reimu
        text: "その面に、波のような[摩耗|まもう]が現れました。"
        reading: "そのめんに、なみのようなまもうがあらわれました。"
      - speaker: zundamon
        emotion: surprised
        text: "……洗濯板みたいだな。"
      - speaker: gishif
        emotion: sad
        text: "はい。等間隔で、きれいに並んでいます。"
      - speaker: zundamon
        emotion: thinking
        text: "……きれいに、並ぶ。"
      - speaker: tsumugi
        emotion: normal
        text: "ここ、大事なところ。傷ってふつう、でたらめに付くよね。"
      - speaker: zundamon
        emotion: normal
        text: "……規則正しいなら、原因も規則正しいのだ。"
      - speaker: gishi
        emotion: normal
        text: "しかし、なぜ出るのかが分かりません。"
      - speaker: zundamon
        emotion: normal
        text: "分からないなら、出るまで回す。"
      - speaker: gishi
        emotion: surprised
        text: "……回し続けるんですか。"
      - speaker: zundamon
        emotion: normal
        text: "壊れる瞬間を、こちらが見ていないと話にならん。"

  - id: shiken
    title: "回して、壊す"
    background: il_rot_kenkyu
    bgm: kinakusai
    stage:
