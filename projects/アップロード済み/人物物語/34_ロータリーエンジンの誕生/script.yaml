      - speaker: gishi
        emotion: sad
        text: "……四十時間ほどです。"
      - speaker: zundamon
        emotion: normal
        text: "分解してくれ。"
      - speaker: gishif
        emotion: sad
        text: "……また、出ています。"
      - speaker: zundamon
        emotion: normal
        text: "記録しろ。何番目の山が、どれだけ深いか。"
      - speaker: gishi
        emotion: surprised
