    reading: けりー もと だいひょう とりしまりやくの ゆうざいわ、にせん じゅうななねんどの いちねんぶん だけ。ほかの ななねんぶんわ、むざいでした。
  - speaker: reimu
    text: ケリー元代表取締役と日産の裁判で、裁判所は、報告書に書くべき未払いの報酬があったと認めました。
    reading: けりー もと だいひょう とりしまりやくと にっさんの さいばんで、さいばんしょわ ほうこくしょに かくべき みばらいの ほうしゅうが あったと みとめました。
    telops:
    - {text: "未払い報酬はあった＝ケリーと日産の判決", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: reimu
    text: けれど、報酬は決まっていなかったと言う本人は、この法廷にいません。
    reading: けれど ほうしゅうわ きまって いなかったと いう ほんにんわ、この ほうていに いません。
    background: gs_houtei_kara
