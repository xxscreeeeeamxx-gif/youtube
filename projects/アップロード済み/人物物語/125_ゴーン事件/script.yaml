# ---- 論争1：盗んだ有罪の人？ ----
- id: ronso1
  title: ネットの「有罪」説
  background: gs_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ ゴーンさんは日産のお[金|かね]を盗んだ、有罪の人だって！
  - speaker: tsumugi
    emotion: normal
    text: そう見られた理由はあるの。起訴は4回。日産も、重大な不正があったと発表したわ。
  - speaker: tsumugi
    emotion: normal
    text: 日産は昔の報告書を訂正して、国から課徴金も受けたの。
  - speaker: tsumugi
    emotion: normal
    text: ケリー元代表取締役と日産の判決も、未払いの報酬はあったと認めてる。
  - speaker: tsumugi
    emotion: normal
    text: 2025年2月には高裁も同じ判断で、双方が最高裁に上告したわ。
  - speaker: zundamon
    emotion: angry
    text: ほら、やっぱりなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: でも、本人の裁判は一度も開かれていないの。
    se: tsukkomi
  - speaker: zundamon
    emotion: surprised
    text: 起訴は4回なのに！？
  - speaker: tsumugi
    emotion: normal
    text: '[日本|ニホン]で、本人に有罪の判決は出ていないわ。'
  - speaker: tsumugi
    emotion: normal
    text: 本人は、開示されていない報酬は受け取っていないと言ってる。
  - speaker: tsumugi
    emotion: normal
    text: 日産に損害も与えていない、ともね。
  - speaker: zundamon
    emotion: happy
    text: じゃあ、無実なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: それも、決まっていないの。
  - speaker: tsumugi
    emotion: normal
    text: 検察は起訴して、日産は不正と言う。本人は無実と言う。
  - speaker: tsumugi
    emotion: thinking
    text: その答えを出すはずの裁判が、[日本|ニホン]では開かれていないの。
  - speaker: zundamon
    emotion: thinking
    text: 答えの出る場所が、ないのか……。
    beat: true
# ---- 論争2：逃げても仕方ない？ ----
- id: ronso2
  title: 逃げても仕方ない？
  background: gs_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: '[日本|ニホン]は人質司法だから、逃げても仕方なかったのだ！'
  - speaker: tsumugi
    emotion: normal
    text: そう言う人もいるわ。勾留は、2回で合わせて130日になったの。
  - speaker: tsumugi
    emotion: normal
    text: 国連の作業部会は4度の逮捕と勾留を、根本的に不当だとしたわ。
  - speaker: zundamon
    emotion: surprised
    text: 国連が！？
    se: bikkuri
  - speaker: tsumugi
    emotion: normal
    text: でも[日本|ニホン]政府は、受け入れられないと異議を出したの。
  - speaker: tsumugi
    emotion: normal
    text: 法務省は自白しないと保釈が認められないということはありません、とも説明してる。
  - speaker: tsumugi
    emotion: thinking
    text: 勾留のやり方は作業部会と[日本|ニホン]政府で、言い分がぶつかったの。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、どっちが正しいのだ？
  - speaker: tsumugi
    emotion: normal
    text: そこは、まだぶつかったまま。
  - speaker: tsumugi
    emotion: normal
    text: けれど保釈の約束を破って国を出たことは、本人も認めているわ。
  - speaker: tsumugi
    emotion: thinking
    text: 手助けした親子は、[日本|ニホン]の裁判で罪を認めて実刑になった。
  - speaker: tsumugi
    emotion: normal
    text: トルコでも、パイロットたちが有罪になってるわ。
  - speaker: zundamon
    emotion: thinking
    text: 言い分がどうでも、約束は約束なのだ……。
    beat: true
# ---- 本当の注意点 ----
- id: chui
  title: 本当の注意点
  background: gs_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 1つめ。起訴された人と、有罪の人は違うの。
  - speaker: zundamon
    emotion: thinking
    text: ニュースの被告って、もう犯人のことじゃないのだ？
    telops:
    - {text: "起訴された人 ≠ 有罪の人", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: まだ裁かれている途中の人よ。ネットに犯人って書かないこと。
  - speaker: tsumugi
    emotion: thinking
    text: ゴーンさんも起訴は4回。でも[日本|ニホン]で、有罪の判決は出ていないわ。
  - speaker: tsumugi
    emotion: normal
    text: 2つめ。会社のトップの報酬は、だれでも読めるの。
  - speaker: tsumugi
    emotion: normal
    text: 1億円以上の役員の報酬は、有価証券報告書に名前つきで載ってるわ。
  - speaker: tsumugi
    emotion: normal
    text: 報告書は、金融庁の開示のサイトで見られるの。
  - speaker: zundamon
    emotion: happy
    text: 社長のお給料、のぞき放題なのだ！
    se: hirameki
  - speaker: tsumugi
    emotion: thinking
    text: のぞくんじゃなくて、株を持つ会社の役員の報酬の欄を読むの。
  - speaker: tsumugi
    emotion: normal
    text: ただし、同じ年の報酬でも数字が変わることがあるわ。
  - speaker: tsumugi
    emotion: normal
    text: 日産の2018年3月期のゴーンさんの報酬は、最初の報告書で7億3500万円。
  - speaker: tsumugi
    emotion: normal
    text: 日産が2019年に出した訂正の報告書では、28億6900万円よ。
  - speaker: zundamon
    emotion: surprised
    text: 4倍近くに！？
  - speaker: tsumugi
    emotion: normal
    text: 3つめ。保釈の約束は重いの。
  - speaker: tsumugi
    emotion: normal
    text: 約束を破れば、保釈金は戻らない。15億円も、全額が[没取|ぼっしゅ]されたわ。
  - speaker: zundamon
    emotion: sad
    text: 約束を破ると、お[金|かね]も信用も戻らないのだ……。
# ---- 現代 ----
- id: ima
  title: 事件のあと
  background: gs_gendai
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 日産は、いまどうなってるの？
  - speaker: tsumugi
    emotion: normal
    text: 11月の発表では、上期は営業黒字。でも最終の損益は、397億円の赤字よ。
  - speaker: zundamon
    emotion: thinking
    text: ゴーンさんの[日本|ニホン]の裁判は？
  - speaker: tsumugi
    emotion: thinking
    text: 4つの起訴は、公判が開かれないまま。
  - speaker: tsumugi
    emotion: normal
    text: 2020年には出国の手続きをせずに国を出た疑いでも、逮捕状が出たわ。
  - speaker: zundamon
    emotion: thinking
    text: 日産とゴーンさんは、いまはどういう関係なの？
  - speaker: tsumugi
    emotion: normal
    text: お互いを、裁判に訴えたの。
  - speaker: zundamon
    emotion: surprised
    text: お互いに！？
    se: bikkuri
  - speaker: tsumugi
    emotion: normal
    text: 日産は2020年、横浜地裁で100億円の賠償を求めたわ。
  - speaker: tsumugi
    emotion: normal
    text: 彼は2023年、レバノンで日産などに10億ドル超を求めたの。
  - speaker: zundamon
    emotion: thinking
    text: 円とドルで、訴え合いなのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 訴えたことと、認められたことは別よ。どちらも、相手への言い分なの。
  - speaker: zundamon
    emotion: thinking
    text: 決まりは、何か変わったの？
  - speaker: tsumugi
    emotion: normal
    text: 2020年1月には法務大臣が、出国の手続きをもっと厳しくするよう指示したわ。
  - speaker: tsumugi
    emotion: normal
    text: この事件のあと、2023年に刑事訴訟法が変わったわ。
  - speaker: tsumugi
    emotion: normal
    text: 保釈中に決められた住まいを離れることにも、罰則ができたの。
  - speaker: tsumugi
    emotion: normal
    text: 海外へ逃げるおそれのある人には、居場所を知らせる端末を付けさせられるようになるわ。
  - speaker: zundamon
    emotion: surprised
    text: 居場所を知らせる端末！？
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: その仕組みは、2023年から5年以内に始まるの。
