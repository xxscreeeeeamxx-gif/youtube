scenes:
# ---- 先出し（2019年1月8日・東京地裁の勾留理由開示。手続きの順に、裁判官が理由を告げてから本人が英語の紙を読む） ----
- id: co_houtei
  title: ''
  background: gs_houtei
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: ゴーン, emotion: normal}
  - {who: saibankan, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2019年1月8日、東京地裁。日産の元会長、カルロス・ゴーン、64歳。
    reading: にせん じゅうくねん いちがつ ようか、とうきょう ちさい。にっさんの もと かいちょう かるろす ごーん ろくじゅうよんさい。
  - speaker: reimu
    text: 逮捕から50日。勾留の理由を明かす法廷に、手錠と腰縄で初めて姿を見せます。
    reading: たいほから ごじゅうにち。こうりゅうの りゆうお あかす ほうていに、てじょうと こしなわで はじめて すがたお みせます。
  - speaker: saibankan
    emotion: normal
    text: 逃亡や証拠隠滅のおそれがあります。
  - speaker: zundamon
    emotion: normal
    text: '[裁判長殿|サイバンチョウドノ]、私にかけられている容疑は無実です。'
# ---- 先出し（2019年1月30日・東京拘置所。逮捕後初のインタビュー。問いは原文「日本の刑事司法についてどう思いますか」） ----
- id: co_menkai
  title: ''
  background: gs_menkai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: ゴーン, emotion: normal}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 3週間後、東京拘置所。
    reading: さんしゅうかんご、とうきょう こうちしょ。
  - speaker: kisha
    emotion: normal
    text: 日本の刑事司法について、どう思いますか。
  - speaker: zundamon
    emotion: normal
    text: なぜ勾留が続いているのか理解できない。
  - speaker: zundamon
    emotion: normal
    text: 私は逃げもしないし、しっかりと自分を弁護する。
  - speaker: reimu
    text: その11か月後、彼は関西空港で箱の中にいました。日本の法廷で、彼の裁判は一度も開かれていません。
    reading: その じゅういっかげつご、かれわ かんさい くうこうで はこの なかに いました。にほんの ほうていで、かれの さいばんわ いちども ひらかれて いません。
# ---- 今の部屋（宿題と段ボール箱。箱が見えるよう、つむぎを左・ずんだもんを箱の前に置く） ----
- id: hook
  title: ''
  background: gs_heya
  bgm: shuffle_shuffle
  stage:
  - {who: tsumugi, x: 0.25, flip: true, emotion: normal}
  - {who: zundamon, x: 0.72, emotion: happy}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 今日は絶対に、宿題から逃げないのだ！
  - speaker: tsumugi
    emotion: thinking
    text: ……で、なんで箱に入ろうとしてるの。
  - speaker: zundamon
    emotion: normal
    text: 箱の中は、逃げたうちに入らないのだ。
    se: manuke
  - speaker: tsumugi
    emotion: thinking
    text: 屁理屈ね。
  - speaker: tsumugi
    emotion: normal
    text: 逃げもしないと言って、本当に箱に入って国を出た人がいるの。
    telops:
    - {text: "逃げもしないと言った人は なぜ箱の中に？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 逃げないって言った人が、なんで箱に入ったのだ！？
# ---- 1999年6月25日・株主総会 ----
- id: card1999
  title: ''
  background: gs_card_1999
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1999年6月、日産の株主総会。ルノーから来た45歳が、壇に立ちます。
    reading: せんきゅうひゃく きゅうじゅうくねん ろくがつ、にっさんの かぶぬし そうかい。るのーから きた よんじゅうごさいが だんに たちます。
- id: ch1_sokai
  title: 日産のために来た
  background: gs_sokai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: ゴーン, emotion: normal}
  - {who: kabunushi, x: 0.7, emotion: thinking}
  cuts:
  - speaker: kabunushi
    emotion: thinking
    text: ルノーで経費を削って、コストカッターと呼ばれた人でしょう。
  - speaker: kabunushi
    emotion: thinking
    text: うちの会社も、削られて終わりじゃないのか。
  - speaker: zundamon
    emotion: normal
    text: 私はルノーのためではなく、日産のために来た。
  - speaker: zundamon
    emotion: happy
    text: 再建のために全力をつくす
  - speaker: kabunushi
    emotion: surprised
    text: ……言い切ったな。
# ---- 2001年5月17日・決算の会見 ----
- id: ch1_kaifuku
  title: ''
  background: gs_kaigi_up
  stage:
  - {who: zundamon, x: 0.5, tag: ゴーン, emotion: normal}
  cuts:
  - speaker: reimu
    text: 10月の再建計画で、5つの工場を閉じると発表。2001年5月、黒字に戻った決算の会見です。
    reading: じゅうがつの さいけん けいかくで、いつつの こうじょうお とじると はっぴょう。にせん いちねん ごがつ、くろじに もどった けっさんの かいけんです。
  - speaker: zundamon
    emotion: happy
    text: 日産はまだ救急救命室から一般病棟に移る前の回復室に移ったところにすぎない
  - speaker: reimu
    text: 日産のために来た人は、20年後、なぜ箱の中にいたのか。
    reading: にっさんの ために きた ひとわ にじゅうねんご、なぜ はこの なかに いたのか。
# ---- 2010年・2枚の紙（検察の冒頭陳述の構図に沿った脚色。名前の無い秘書室の社員） ----
- id: card2010
  title: ''
  background: gs_card_2010
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 2010年。1億円以上の役員の報酬は、有価証券報告書に名前つきで書く決まりになります。
    reading: にせん じゅうねん。いちおくえん いじょうの やくいんの ほうしゅうわ、ゆうか しょうけん ほうこくしょに なまえつきで かく きまりに なります。
- id: ch2_nimai
  title: 2枚の紙
  background: gs_nimai
  stage:
  - {who: senpai, x: 0.1, flip: true, emotion: normal}
  - {who: shinjin, x: 0.9, emotion: normal}
  cuts:
  - speaker: reimu
    text: のちの検察の主張では、この年から報酬の数字が2つに分かれます。
    reading: のちの けんさつの しゅちょうでわ、この としから ほうしゅうの すうじが ふたつに わかれます。
  - speaker: shinjin
    emotion: normal
    text: 先輩。会長の報酬って、今年から報告書に名前が載るんですよね。
  - speaker: senpai
    emotion: normal
    text: ああ。報告書には、この数字。
  - speaker: senpai
    emotion: normal
    text: こっちは、別の紙だ。
  - speaker: shinjin
    emotion: surprised
    text: 別の紙？
  - speaker: senpai
    emotion: normal
    text: 報酬の総額の記録さ。報告書との差は、辞めたあとで受け取る。
  - speaker: shinjin
    emotion: thinking
    text: 給料明細とは別に、辞めたら払うってメモが引き出しにある感じですか。
    se: hirameki
  - speaker: senpai
    emotion: normal
    text: ……まあ、そんなところだ。
  - speaker: shinjin
    emotion: thinking
    text: でも、なんで紙を分けるんです？
  - speaker: senpai
    emotion: normal
    text: 名前つきで載る決まりができた。それが、きっかけさ。
  - speaker: shinjin
    emotion: thinking
    text: 払い方まで、考えてあるんですか。
  - speaker: senpai
    emotion: normal
    text: ドバイの関連会社を通す案まで、出たらしい。
  - speaker: shinjin
    emotion: surprised
    text: ドバイ……。
  - speaker: reimu
    text: 差は検察の主張で、8年で91億円余り。1日に直すと、約310万円です。
    reading: さわ けんさつの しゅちょうで、はちねんで きゅうじゅういちおくえん あまり。いちにちに なおすと、やく さんびゃく じゅうまんえんです。
    telops:
    - {text: "1日約310万円＝検察の主張", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
# ---- 本人の言い分（2019年1月8日の法廷の陳述を、出どころを言って先に置く。原文の並び＝市場価値→開示されていない報酬） ----
- id: ch2_kiroku
  title: ''
  background: gs_nimai
  stage:
  - {who: zundamon, x: 0.18, flip: true, tag: ゴーン, emotion: normal}
  cuts:
  - speaker: reimu
    text: この紙について、本人はのちに法廷でこう述べます。
    reading: この かみに ついて、ほんにんわ のちに ほうていで こう のべます。
  - speaker: zundamon
    emotion: normal
    text: 私の市場価値、すなわち報酬金額について記録をつけていくことにしました。
  - speaker: zundamon
    emotion: normal
    text: これは将来の参考のために私が残していた個人的なベンチマークであり、
  - speaker: zundamon
    emotion: normal
    text: 法的な効力のあるものではありませんでした。
  - speaker: zundamon
    emotion: normal
    text: 私は、開示されていない報酬を日産から受け取ったことはありません
  - speaker: reimu
    text: 報告書に載らなかった91億円は、報酬だったのか。ただの記録だったのか。
    reading: ほうこくしょに のらなかった きゅうじゅういちおくえんわ、ほうしゅう だったのか。ただの きろく だったのか。
# ---- 2015年6月23日・株主総会（株主の問いは脚色の振り） ----
- id: ch3_hoshu
  title: 報酬は高すぎる？
  background: gs_sokai
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: ゴーン会長, emotion: normal}
  - {who: kabunushi2, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 2015年6月、日産の株主総会。
    reading: にせん じゅうごねん ろくがつ、にっさんの かぶぬし そうかい。
  - speaker: kabunushi2
    emotion: thinking
    text: 社長の報酬、高すぎませんか。
  - speaker: zundamon
    emotion: normal
    text: 日産の経営陣はグローバル競合他社からの採用のターゲットになっている。
  - speaker: zundamon
    emotion: normal
    text: 競争力のある水準の報酬を提供しないといけない
  - speaker: zundamon
    emotion: normal
    text: 世界の自動車メーカーの最高経営責任者の平均報酬は2870万ドル
  - speaker: kabunushi2
    emotion: surprised
    text: ……引き抜かれないための、値段ですか。
  - speaker: kabunushi2
    emotion: thinking
    text: 3年前の講演でも、高額報酬を恥だと思う必要はないと言ってましたね。
  - speaker: reimu
    text: 報告書の彼の報酬は、年に10億円前後。もう1枚の紙の額は入っていない、と検察はのちに言います。
    reading: ほうこくしょの かれの ほうしゅうわ、ねんに じゅうおくえん ぜんご。もう いちまいの かみの がくわ はいって いない、と けんさつわ のちに いいます。
# ---- 2016〜2018年・3社の名札 ----
- id: ch3_nafuda
  title: 3社の名札
  background: gs_door
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: ゴーン会長, emotion: normal}
  - {who: shain, x: 0.5, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2016年、日産は三菱自動車の株の34%を持ち、彼は三菱自動車の会長も兼ねます。
    reading: にせん じゅうろくねん にっさんわ みつびし じどうしゃの かぶの さんじゅうよん ぱーせんとお もち、かれわ みつびし じどうしゃの かいちょうも かねます。
  - speaker: shain
    emotion: happy
    text: 会長、会長室の名札が3枚になりました。
    background: gs_door3
    se: jaan
  - speaker: shain
    emotion: happy
    text: ルノーに日産に三菱。3枚とも、同じお名前です。
  - speaker: reimu
    text: 2018年1月、3社は前の年の世界販売を発表。その発表文で、彼はこう述べます。
    reading: にせん じゅうはちねん いちがつ、さんしゃわ まえの としの せかい はんばいお はっぴょう。その はっぴょうぶんで、かれわ こう のべます。
  - speaker: zundamon
    emotion: happy
    text: 世界一の自動車グループとなりました
# ---- 2018年6月26日・日産の定時株主総会（日経 vdata［K4］：検査不正問題の責任を追及する株主への回答。前の年に社長兼CEOを譲り、会長に残っていた） ----
- id: ch3_sokai2018
  title: ''
  background: gs_sokai
  stage:
  - {who: zundamon, x: 0.5, tag: ゴーン会長, emotion: normal}
  cuts:
  - speaker: reimu
    text: 6月の株主総会。検査の不正の責任を問われ、前の年に社長を譲った彼はこう答えます。
    reading: ろくがつの かぶぬし そうかい。けんさの ふせいの せきにんお とわれ、まえの としに しゃちょうお ゆずった かれわ こう こたえます。
  - speaker: zundamon
    emotion: normal
    text: '[CEO|シーイーオー]だけが会社のボス。今の日産のトップは[西川|サイカワ]氏だけだ'
- id: heya1
  title: ''
  background: gs_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 1人で3社の会長で、世界一……。そんな人が、なんで箱に入ることになるのだ？
  - speaker: tsumugi
    emotion: normal
    text: 世界一は、3社の発表の言い方よ。
  - speaker: tsumugi
    emotion: thinking
    text: 数え方によっては、フォルクスワーゲンのほうが上なの。
  - speaker: zundamon
    emotion: surprised
    text: 数え方で、1位が変わるのだ！？
  - speaker: tsumugi
    emotion: normal
    text: まずは、3社のつながり方を見てみて。
  - speaker: tsumugi
    emotion: normal
    text: ルノーが日産の株を43.4%持ってるの。日産のルノー株には、議決権がないのよ。
    telops:
    - {text: "ルノー→日産株43.4%　日産→ルノー株は議決権なし", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: 日産は、口を出せないのか……。
  - speaker: tsumugi
    emotion: normal
    text: しかもルノーの大株主は、フランス政府。
  - speaker: zundamon
    emotion: surprised
    text: 国まで出てくるの！？
  - speaker: tsumugi
    emotion: normal
    text: 2015年には、日産の経営の自主性を守る約束も結んだの。
  - speaker: tsumugi
    emotion: normal
    text: 本人の話では2018年9月、日産の社長と資本の関係の見直しを話していたわ。
  - speaker: zundamon
    emotion: thinking
    text: 3つの会社を、1つにまとめる話なのだ？
  - speaker: tsumugi
    emotion: normal
