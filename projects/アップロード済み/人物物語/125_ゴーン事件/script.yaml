meta:
  title: 「私は逃げもしない」と拘置所で語った日産のゴーン元会長、11か月後に箱に隠れて国外へ【ずんだもん解説】
  slug: ghosn-nissan
  hook_line: 「逃げもしない」と言った日産の元会長は、なぜ11か月後に箱の中にいたのか。
  summary: 2019年1月、手錠と腰縄で東京地裁に入った日産の元会長カルロス・ゴーンは「容疑は無実です」と述べ、3週間後には拘置所で「私は逃げもしない」と語りました。報告書に書いた報酬と、別に記録されていた数字。ルノー・日産・三菱の3社を1人で率いた経営者は、なぜ11か月後、関西空港で箱の中にいたのか。検察・日産・本人・日本政府の言い分を主語つきで並べ、日本では一度も開かれていない裁判の行方を、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 日本経済新聞「ゴーン元会長意見陳述全文「日産に一切損害与えず」」（2019年1月8日） https://www.nikkei.com/article/DGXMZO39747090Y9A100C1I00000/
  - 日本経済新聞「「これは策略、反逆だ」 ゴーン元会長会見全文」（2019年1月30日） https://www.nikkei.com/article/DGXMZO40665080Q9A130C1I00000/
  - 日産自動車「当社代表取締役会長らによる重大な不正行為について」（2018年11月19日） https://global.nissannews.com/ja-JP/releases/release-860852d7040eed420ffbaebb223b6973-181119-01-j
  - 法務省「森法務大臣コメント（カルロス・ゴーン被告人関係）」（2020年1月5日） https://www.moj.go.jp/kokusai/kokusai03_00010.html
  - 日産自動車「日産、元会長カルロス・ゴーンに対して、不正行為による100億円の損害賠償を請求」（2020年2月12日） https://global.nissannews.com/ja-JP/releases/200212-02-j
  - 日本経済新聞「ゴーン元会長逃亡、隠避の元米兵に実刑判決 東京地裁」（2021年7月19日） https://www.nikkei.com/article/DGXZQOUE161WF0W1A710C2000000/
