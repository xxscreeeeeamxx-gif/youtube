scenes:
# ---- 先出し（2026年4月21日の会見） ----
- id: co_kaiken
  title: ''
  background: hk_kaiken
  bgm: serious
  stage:
  - {who: nojima, x: 0.28, flip: true, emotion: normal}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2026年4月21日。家電量販店ノジマの社長、野島廣司が会見に立ちます。
    reading: にせん にじゅうろくねん しがつ にじゅういちにち。かでん りょうはんてん のじまの しゃちょう のじま ひろしが かいけんに たちます。
  - speaker: nojima
    emotion: normal
    text: 日立はすばらしい技術を持ち、すばらしい商品を作っている。
  - speaker: nojima
    emotion: normal
    text: だが、社会に対する伝え方がうまくない。
  - speaker: reimu
    text: ノジマは、日立の家電を受け継ぐ新会社の80.1％を、約1100億円で買う予定です。
    reading: のじまわ ひたちの かでんお うけつぐ しんがいしゃの はちじゅってんいち ぱーせんとお、やく せんひゃくおくえんで かう よていです。
    telops:
    - {text: "新会社の80.1％を約1100億円で", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
# ---- 先出し（同じ日の、町の日立のお店） ----
- id: co_omise
  title: ''
  background: hk_omise
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 店主, emotion: normal}
  - {who: kyaku, x: 0.7, emotion: surprised}
  cuts:
  - speaker: kyaku
    emotion: surprised
    text: 店主さん！ ノジマが日立の家電を買うって！
  - speaker: zundamon
    emotion: surprised
    text: うちの看板、日立なんだけど！？
    se: gaan
  - speaker: reimu
    text: ここは町の日立のお店。そしてノジマも、創業のころは日立の系列の店だったと報じられています。
    reading: ここわ まちの ひたちの おみせ。そして のじまも そうぎょうの ころわ、ひたちの けいれつの みせだったと ほうじられて います。
  - speaker: reimu
    text: 家電を作る会社が、売る店に買われる。なぜでしょうか。
    reading: かでんお つくる かいしゃが うる みせに かわれる。なぜでしょうか。
# ---- 茶番（今の部屋） ----
- id: hook
  title: ''
  background: hk_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 洗濯機は、1年待ってから買うのだ。
  - speaker: tsumugi
    emotion: normal
    text: なんで1年？
  - speaker: zundamon
    emotion: happy
    text: 3割安くなるから。待てる男なのだ。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: その値下がりを止めて、自分で値段を決めようとしたのが日立よ。
  - speaker: zundamon
    emotion: surprised
    text: 値段って、お店が決めるんじゃないの？
  - speaker: tsumugi
    emotion: thinking
    text: そう、決めてたのは店。その店に、日立の家電は買われることになったの。
  - speaker: zundamon
    emotion: surprised
    text: なんでそうなるのだ！？
# ---- 仕組み1：量販店の売り場（2023年11月） ----
- id: ch1_ryohan
  title: 1年たてば3割引き
  background: hk_ryohan
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 店主, emotion: thinking}
  - {who: wakai, x: 0.56, emotion: normal}
  - {who: tenin, x: 0.78, emotion: happy}
  cuts:
  - speaker: reimu
    text: 2023年11月。郊外の家電量販店です。
    reading: にせん にじゅうさんねん じゅういちがつ。こうがいの かでん りょうはんてんです。
  - speaker: zundamon
    emotion: thinking
    text: 敵情視察なのだ。日立のお店の店主だってことは、内緒。
  - speaker: tenin
    emotion: happy
    text: こちら去年の型なら、3割引きです。
  - speaker: wakai
    emotion: surprised
    text: 3割も！？
  - speaker: tenin
    emotion: normal
    text: '[白物|しろもの]は発売から1年ほどで、3割から4割下がることもありますので。'
  - speaker: zundamon
    emotion: thinking
    text: 見渡すかぎり、値下げの[札|ふだ]なのだ……。
    background: hk_ryohan_nesage
  - speaker: wakai
    emotion: normal
    text: じゃあ、この新しいビッグドラムも……。
  - speaker: tenin
    emotion: normal
    text: こちらの商品は、メーカーとの関係でお値引きができないんです。
  - speaker: wakai
    emotion: surprised
    text: ……え？
  - speaker: zundamon
    emotion: surprised
    text: 量販店でも、ほんとに値引きなし！？
    se: bikkuri
  - speaker: tenin
    emotion: normal
    text: 値段は、メーカーが決めておりますので。
  - speaker: wakai
    emotion: thinking
    text: 37万円なら、今までは1年で22万円から26万円になってたのに……。
    telops:
    - {text: "今までなら　37万円→1年で22万〜26万円", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: 1年待てば、11万円から15万円も安かったのに……。
    beat: true
# ---- 仕組み2：系列店の店頭（同じ週） ----
- id: ch1_omise
  title: どこで買っても同じ値段
  background: hk_omise
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 店主, emotion: happy}
  - {who: wakai, x: 0.7, emotion: normal}
  cuts:
  - speaker: wakai
    emotion: normal
    text: このビッグドラム、ここだといくらですか。
  - speaker: zundamon
    emotion: happy
    text: 量販店さんと、同じ値段です。
  - speaker: wakai
    emotion: surprised
    text: 値段って、お店が決めるんじゃないんですか？
  - speaker: zundamon
    emotion: normal
    text: この商品は、日立が決めてます。
  - speaker: wakai
    emotion: thinking
    text: メーカーが決めて、いいんですか。
  - speaker: zundamon
    emotion: normal
    text: 売れ残ったら、日立が引き取る約束なんです。
  - speaker: zundamon
    emotion: normal
    text: 在庫の損は日立がかぶるので、店は売るのを取り次ぐだけ。
  - speaker: zundamon
    emotion: normal
    text: この形なら問題ないと、公正取引委員会も答えてます。
  - speaker: wakai
    emotion: thinking
    text: 返品を全部引き受けるから、値段は決めさせて……ってことか。
  - speaker: zundamon
    emotion: happy
    text: それが、指定価格です。
  - speaker: wakai
    emotion: normal
    text: 指定価格……。初めて聞きました。
  - speaker: zundamon
    emotion: sad
    text: ……やっぱり、知られてないのだ。
    se: shobon
  - speaker: reimu
    text: 1年半後、日経MJの調査では、1000人の84％がこの制度を知りませんでした。
    reading: いちねんはんご、にっけい えむじぇいの ちょうさでわ せんにんの はちじゅうよん ぱーせんとが この せいどお しりませんでした。
  - speaker: reimu
    text: 大手量販7社のうち5社は改善すべき点があると答え、対象の拡大を望む会社はゼロでした。
    reading: おおて りょうはん ななしゃの うち ごしゃわ かいぜん すべき てんが あると こたえ、たいしょうの かくだいお のぞむ かいしゃわ ぜろでした。
  - speaker: reimu
    text: 日経MJが伝えた量販側の声です。本音でいうと、非常に厳しい制度。
    reading: にっけい えむじぇいが つたえた りょうはんがわの こえです。ほんねで いうと ひじょうに きびしい せいど。
    telops:
    - {text: "量販の声（日経MJ）　非常に厳しい制度", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: wakai
    emotion: normal
    text: じゃあ、ここで買う理由って？
  - speaker: zundamon
    emotion: happy
    text: 設置に伺って、壊れたら直しに伺います。
  - speaker: zundamon
    emotion: happy
    text: 値段で負けても、足で負けるな。父の口ぐせです。
  - speaker: wakai
    emotion: thinking
    text: ……足？
    beat: true
# ---- 対立：量販店は嫌い、客は知らない ----
- id: ch1_tairitsu
  title: ''
  background: hk_ryohan
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 値段を決めるのは、作った会社か、売る店か。日立は、その綱引きに出たのです。
    reading: ねだんお きめるのわ つくった かいしゃか うる みせか。ひたちわ その つなひきに でたのです。
  - speaker: reimu
    text: このとき、まだ誰も、2年半後に日立の家電が量販店に買われることになるとは思っていません。
    reading: この とき まだ だれも、にねんはんごに ひたちの かでんが りょうはんてんに かわれる ことに なるとわ おもって いません。
# ---- 父の代：1959年 ----
- id: card1959
  title: ''
  background: hk_card_1959
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 1959年。神奈川県の相模原で、のちのノジマが生まれます。
    reading: せんきゅうひゃく ごじゅうくねん。かながわけんの さがみはらで、のちの のじまが うまれます。
  - speaker: reimu
    text: カタログを持って家々を回る、訪問販売からの出発でした。
    reading: かたろぐお もって いえいえお まわる、ほうもん はんばいからの しゅっぱつでした。
  - speaker: reimu
    text: 日立は1910年、5馬力のモーターから始まった会社。1950年代に洗濯機、掃除機、テレビを出します。
    reading: ひたちわ せんきゅうひゃく じゅうねん、ごばりきの もーたーから はじまった かいしゃ。せんきゅうひゃく ごじゅうねんだいに せんたくき そうじき てれびお だします。
  - speaker: reimu
    text: その品を町で売る系列の電器屋が、日立のお店。この店も1960年代に、日立のお店として開きました。
    reading: その しなお まちで うる けいれつの でんきやが ひたちの おみせ。この みせも せんきゅうひゃく ろくじゅうねんだいに、ひたちの おみせと して ひらきました。
# ---- 父の代：茶の間の据え付け ----
- id: ch2_chanoma
  title: 日立のお店の仕事
  background: hk_chanoma
  bgm: you_and_me
  stage:
  - {who: chichi, x: 0.28, flip: true, emotion: happy}
  - {who: okusan, x: 0.7, emotion: normal}
  cuts:
  - speaker: chichi
    emotion: happy
    text: 毎度！ 日立のお店です。テレビの据え付けに伺いました。
  - speaker: okusan
    emotion: happy
    text: まあ！ うちにも、とうとうテレビが！
    se: jaan
  - speaker: chichi
    emotion: normal
    text: アンテナは屋根に立てます。映らなきゃ、何度でも来ますんで。
  - speaker: okusan
    emotion: normal
    text: ついでに洗濯機も見てくれる？ ガタガタいうのよ。
  - speaker: chichi
    emotion: happy
    text: 見ときます。使い方も、もう一回お教えしますね。
  - speaker: okusan
    emotion: happy
    text: 電器屋さんっていうより、うちの家電の係の人ね。
  - speaker: chichi
    emotion: happy
    text: 選ぶのも据え付けも点検も、うちの仕事です。
  - speaker: chichi
    emotion: happy
    text: 壊れたら、夜中でも呼んでください。
  - speaker: okusan
    emotion: thinking
    text: 夜中は、寝かせてちょうだい。
    beat: true
  - speaker: reimu
    text: 日立の説明でも、日立のお店はお得意さんの家を定期的に訪ね、家電の調子を聞いて回ります。
    reading: ひたちの せつめいでも ひたちの おみせわ おとくいさんの いえお ていきてきに たずね、かでんの ちょうしお きいて まわります。
  - speaker: reimu
    text: 値段だけではない、この売り方。60年後、思わぬ人の口から語られることになります。
    reading: ねだんだけでわ ない この うりかた。ろくじゅうねんご、おもわぬ ひとの くちから かたられる ことに なります。
# ---- 1971年：希望小売価格 ----
- id: ch2_kakaku
  title: ''
  background: hk_omise_soto
  cuts:
  - speaker: reimu
    text: 1971年。値引きが当たり前になった希望小売価格に、公正取引委員会が線を引きます。
    reading: せんきゅうひゃく ななじゅういちねん。ねびきが あたりまえに なった きぼう こうり かかくに、こうせい とりひき いいんかいが せんお ひきます。
  - speaker: reimu
    text: メーカーは希望の値段を下げるか、やめるかを迫られました。値段を決める力は、少しずつ店へ移っていきます。
    reading: めーかーわ きぼうの ねだんお さげるか やめるかお せまられました。ねだんお きめる ちからわ、すこしずつ みせえ うつって いきます。
# ---- 量販店の時代：1982年 ----
- id: card1982
  title: ''
  background: hk_card_1982
  bgm: pop
  cuts:
  - speaker: reimu
    text: 1982年。全国の電気店は7万1283店で、いちばん多くなります。
    reading: せんきゅうひゃく はちじゅうにねん。ぜんこくの でんきてんわ ななまん せん にひゃく はちじゅうさんてんで、いちばん おおく なります。
  - speaker: reimu
    text: 同じ年、ノジマは郊外型の、オーディオとビデオとコンピュータの専門店を開きました。
    reading: おなじ とし のじまわ こうがいがたの、おーでぃおと びでおと こんぴゅーたの せんもんてんお ひらきました。
- id: ch3_kougai
  title: 国道ぞいの量販店
  background: hk_omise
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 息子, emotion: normal}
  - {who: chichi, x: 0.56, emotion: normal}
  - {who: kyaku, x: 0.78, emotion: happy}
  cuts:
  - speaker: kyaku
    emotion: happy
    text: 店主さん。国道ぞいに、大きな量販店がいくつもできたのよ。安いのなんのって。
  - speaker: chichi
    emotion: thinking
    text: ……そうですか。
  - speaker: kyaku
    emotion: happy
    text: ビデオ、向こうで買っちゃった。
  - speaker: chichi
    emotion: sad
    text: ……そうですか。
  - speaker: kyaku
    emotion: normal
    text: それでね、つなぎ方がわからないの。来てくれる？
  - speaker: chichi
    emotion: surprised
    text: 買うのは向こうで、つなぐのはうちですか！？
    se: zukko
  - speaker: kyaku
    emotion: happy
    text: だって、呼んだらすぐ来てくれるじゃない。
  - speaker: zundamon
    emotion: angry
    text: 父ちゃん、そんなの断るのだ！
  - speaker: chichi
    emotion: normal
    text: ……すぐ、伺います。
  - speaker: zundamon
    emotion: surprised
    text: 行くの！？
    beat: true
# ---- 父の口ぐせ ----
- id: ch3_ashi
  title: 値段で負けても
  background: hk_omise
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 息子, emotion: angry}
