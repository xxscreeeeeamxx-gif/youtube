meta:
  title: 値段を取り戻そうとした日立、2年半後に「メーカーに忖度しない」ノジマへ家電事業を売る【ずんだもん解説】
  slug: hitachi-kaden
  hook_line: 値段を取り戻そうとした日立の家電は、なぜ“売る店”に買われることになったのか。
  summary: 2026年4月、家電量販店のノジマが、日立の家電事業を受け継ぐ新会社の80.1％を約1100億円で買うと発表しました。その2年半前、日立は高い家電の値段を自分で決める「指定価格」を始めていました。値段を決めるのは、作った会社か、売る店か。町の「日立のお店」の2代目店主（架空）の目で、60年の売り場の移り変わりを追います。日立・ノジマ・報道、それぞれの言い分を並べた再現ドラマです。（2026年10月23日時点）
  sources:
  - 日立製作所・日立グローバルライフソリューションズ「日立の家電事業のさらなる成長に向け、ノジマと戦略的パートナーシップに基づく新会社を設立」（2026年4月21日） https://www.hitachi.com/ja-jp/press/articles/2026/04/0421b/
  - 日立グローバルライフソリューションズ「日立ブランドの家電事業を担う新会社の商号を『KADENOVA(カデノヴァ)株式会社』に内定」（2026年10月22日） https://www.hitachi.com/ja-jp/press/articles/2026/10/1022/
  - ノジマ「日立グローバルライフソリューションズ株式会社が設立する新会社（名称未定）の株式取得（子会社化）に関するお知らせ」（2026年4月21日） https://www.nojima.co.jp/wp-content/uploads/2026/04/adc9564a3c7e08ed4988c2e5661fc5f6.pdf
  - 日立グローバルライフソリューションズ「『日立家電品正規取扱店』制度を開始」（2023年9月26日） https://www.hitachi.com/ja-jp/press/articles/2023/09/0926/
  - 公正取引委員会「独占禁止法に関する相談事例集（令和元年度）」事例5 https://www.jftc.go.jp/dk/soudanjirei/r2/r1nendomokuji/r1nendo05.html
  - 家電Watch「日立の家電、ノジマ傘下で新たなスタート『製造業の手本に』」（2026年4月23日） https://kaden.watch.impress.co.jp/docs/news/2103772.html
