# hitachi-kaden 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 店主・息子 / label: 野島廣司・網谷憲晴・山田三紀夫・津坂明宏・川村隆 など）とテロップは表示専用なのでタグを付けていない。
# 網谷憲晴・津坂明宏・豊島久則・長谷川雅彦・鈴木智子は読みが未確認のため、声に出す行では名前を言わない（名札だけ。鈴木は姓だけ）。
# 一橋大学はタグなしで ヒトツバシダイガク と読める（タグを付けると ヒトツバシダイ/ガク と切れたので付けない）。
# 鴻海はタグなしだと オオトリウミ と読まれるのでタグ必須。勝った は単独だと マサッタ（readings_common に既出）。
