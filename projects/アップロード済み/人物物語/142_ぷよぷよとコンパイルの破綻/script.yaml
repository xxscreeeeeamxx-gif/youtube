scenes:
# ---- 先出し（1997年12月〜1998年2月・社長室の電話。台詞は読売の連載の形だけ。条件は電話の「その後」。泣かない。笑いの SE なし。出どころは本編の ch11_denwa の頭で1回だけ言う） ----
- id: co_denwa
  title: ''
  background: pu_shachoshitsu_yoru
  bgm: serious
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 仁井谷, emotion: sad}
  - {who: sega, x: 0.88, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1997年12月、広島。ぷよぷよを世に出したゲーム会社、コンパイル。
    reading: せんきゅうひゃく きゅうじゅうななねん じゅうにがつ、ひろしま。ぷよぷよお よに だした げーむがいしゃ、こんぱいる。
  - speaker: reimu
    text: 社員のボーナスが払えなくなった社長の仁井谷正充が、取引先のセガに電話をかけます。
    reading: しゃいんの ぼーなすが はらえなく なった しゃちょうの にいたに まさみつが、とりひきさきの せがに でんわお かけます。
  - speaker: zundamon
    emotion: sad
    text: ……[何とか|なんとか]運転資金を、貸してほしい。
  - speaker: sega
    emotion: normal
    text: 仲間なので、支えます。
  - speaker: reimu
    text: その後、セガから条件が出されます。
    reading: そのご、せがから じょうけんが だされます。
  - speaker: sega
    emotion: normal
    text: ぷよぷよの権利と引き換えなら、[10億円|ジュウオクエン]出します。権利は、買い戻せます。
  - speaker: reimu
    text: 1998年2月。仁井谷は『急場をしのげればいい』と、権利を手放すと決めます。
    reading: せんきゅうひゃく きゅうじゅうはちねん にがつ。にいたにわ きゅうばお しのげれば いいと、けんりお てばなすと きめます。
  - speaker: reimu
    text: 1か月後。コンパイルは負債約75億円で和議を申し立てます。事実上の倒産でした。
    reading: いっかげつご。こんぱいるわ ふさい やく ななじゅうごおくえんで わぎお もうしたてます。じじつじょうの とうさんでした。
# ---- 今の部屋（大事な物を預けて借り、あとで買い戻すつもり。セガを友だちにたとえない。20秒以内） ----
- id: hook
  title: ''
  background: pu_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: いちばん大事なカードを友だちに預けて、500円借りたのだ！
  - speaker: tsumugi
    emotion: normal
    text: 返すあては？
  - speaker: zundamon
    emotion: happy
    text: 来月のお小遣いで、買い戻すのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 来月の[分|ぶん]、もう前借りしてたわよね。
    se: hammer
  - speaker: zundamon
    emotion: surprised
    text: ……あ。
  - speaker: tsumugi
    emotion: normal
    text: 1998年、それを会社でやった社長がいたの。
  - speaker: tsumugi
    emotion: thinking
    text: 最高の売上の翌年に、なぜ看板のゲームの権利を手放したのか。
    telops:
    - {text: "最高の売上の翌年に なぜ看板の権利を手放した？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: いちばん売れた、次の年に！？
# ---- 1997年・社長室（M計画・上場・130人・30の銀行。2:00 までに転落の原因の仕組みへ。銀行の名前はメインバンクだけ。壁の絵の前に立たせない） ----
- id: ch1_mkeikaku
  title: M計画と30の銀行
  background: pu_shachoshitsu_e
  bgm: pop
  stage:
  - {who: zundamon, x: 0.46, flip: true, tag: 仁井谷, emotion: happy}
  - {who: yakuin, x: 0.88, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1997年、広島のコンパイル。社内で、M計画と呼ばれた計画がありました。
    reading: せんきゅうひゃく きゅうじゅうななねん、ひろしまの こんぱいる。しゃないで えむけいかくと よばれた けいかくが ありました。
  - speaker: yakuin
    emotion: normal
    text: 社長、ぷよぷよランドの見積もりが出ました。
  - speaker: zundamon
    emotion: happy
    text: どうだった。
  - speaker: yakuin
    emotion: normal
    text: ……事業費は、500億円から1000億円。
  - speaker: yakuin
    emotion: surprised
    text: うちの売上の、7年分から14年分ですよ！
  - speaker: zundamon
    emotion: happy
    text: '[上場|じょうじょう]すれば、出るのだ。'
  - speaker: yakuin
    emotion: normal
    text: ……まだ、[上場|じょうじょう]してませんが。
    se: zukko
  - speaker: reimu
    text: 1997年3月までの1年の売上は、約70億円。最高の数字でした。
    reading: せんきゅうひゃく きゅうじゅうななねん さんがつまでの いちねんの うりあげわ、やく ななじゅうおくえん。さいこうの すうじでした。
    telops:
    - {text: "計画は売上の7〜14年分", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: yakuin
    emotion: surprised
    text: 年収700万円の人が、5000万から1億円の家を建てる話ですよ！
  - speaker: zundamon
    emotion: happy
    text: 外には、まだ内緒なのだ。
- id: ch1_jinji
  title: ''
  background: pu_shachoshitsu_e
  stage:
  - {who: zundamon, x: 0.46, flip: true, tag: 仁井谷, emotion: happy}
  - {who: jinji, x: 0.88, emotion: happy}
  cuts:
  - speaker: jinji
    emotion: happy
    text: 社長、今年は130人採りました！
  - speaker: zundamon
    emotion: happy
    text: ランドには、1000人いるのだ。
  - speaker: jinji
    emotion: surprised
    text: 1000人！？ もう机が、足りません！
    beat: true
  - speaker: jinji
    emotion: normal
    text: 1年で130人。社員は、420人になります。
- id: ch1_ginko1
  title: ''
  background: pu_shachoshitsu_e
  stage:
  - {who: zundamon, x: 0.46, flip: true, tag: 仁井谷, emotion: happy}
  - {who: ginko1, x: 0.88, emotion: happy}
  cuts:
  - speaker: ginko1
    emotion: happy
    text: 社長、ご融資の件で参りました。
  - speaker: zundamon
    emotion: happy
    text: 助かります。
  - speaker: ginko1
    emotion: happy
    text: メインバンクさんが貸すなら、うちも。
- id: ch1_ginko3
  title: ''
  background: pu_shachoshitsu_e
  stage:
  - {who: zundamon, x: 0.44, flip: true, tag: 仁井谷, emotion: happy}
  - {who: ginko1, x: 0.66, scale: 0.8, emotion: happy}
  - {who: ginko2, x: 0.78, scale: 0.8, emotion: happy}
  - {who: ginko3, x: 0.9, scale: 0.8, emotion: happy}
  cuts:
  - speaker: ginko2
    emotion: happy
    text: うちも、ぜひ。
  - speaker: ginko3
    emotion: happy
    text: うちも、うちもです！
  - speaker: zundamon
    emotion: surprised
    text: ……順番に、並んでほしいのだ。
    se: manuke
- id: ch1_hiki
  title: ''
  background: pu_shachoshitsu_e
  stage:
  - {who: zundamon, x: 0.46, flip: true, tag: 仁井谷, emotion: happy}
  cuts:
  - speaker: reimu
    text: このとき、30ほどの銀行が競うように貸していました。その年の11月、銀行は一度に引きます。
    reading: このとき、さんじゅう ほどの ぎんこうが きそうように かして いました。その としの じゅういちがつ、ぎんこうわ いちどに ひきます。
  - speaker: reimu
    text: 最高の売上の会社が、なぜ1年足らずで看板を手放すのか。
    reading: さいこうの うりあげの かいしゃが、なぜ いちねん たらずで かんばんお てばなすのか。
# ---- 1982年・1人の会社（30秒以内。2016年の本人の言葉は出どころを言う。セガとの縁は1行） ----
- id: card1982
  title: ''
  background: pu_card_1982
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1982年4月、広島。32歳の仁井谷正充は、1人で会社を作ります。
    reading: せんきゅうひゃく はちじゅうにねん しがつ、ひろしま。さんじゅうにさいの にいたに まさみつわ、ひとりで かいしゃお つくります。
- id: ch2_jimusho
  title: 1人の会社
  background: pu_jimusho
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 仁井谷, emotion: normal}
  cuts:
  - speaker: reimu
    text: 前の仕事は、マイコンを売る会社でした。本人は2016年に、こう振り返ります。
    reading: まえの しごとわ、まいこんお うる かいしゃでした。ほんにんわ にせん じゅうろくねんに、こう ふりかえります。
  - speaker: zundamon
    emotion: normal
    text: 商品を仕入れて売るだけという仕事が肌に合わなかったんです。
  - speaker: zundamon
    emotion: happy
    text: それなら、もう自分で会社をやるしかないという状態だったんです。
  - speaker: reimu
    text: 翌年からゲームの仕事へ。最初は、のちに電話をかけるセガの下請けでした。
    reading: よくねんから げーむの しごとえ。さいしょわ、のちに でんわお かける せがの したうけでした。
- id: ch2_ds
  title: ''
  background: pu_kaihatsu
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 仁井谷, emotion: normal}
  - {who: shain, x: 0.86, emotion: normal}
  cuts:
  - speaker: shain
    emotion: normal
    text: 社長、フロッピーの容量が余ってます。
  - speaker: zundamon
    emotion: happy
    text: うちやほかの会社の体験版を、入れればいいのだ。
    se: hirameki
  - speaker: shain
    emotion: happy
    text: 新人が作ったゲームも、載せていいんですか？
  - speaker: zundamon
    emotion: happy
    text: 載せて、受けたら製品にする。
  - speaker: reimu
    text: 1988年、フロッピーで出す雑誌ディスクステーションが始まります。魔導物語も、ここから生まれました。
    reading: せんきゅうひゃく はちじゅうはちねん、ふろっぴーで だす ざっし でぃすくすてーしょんが はじまります。まどうものがたりも、ここから うまれました。
# ---- 1990年夏・東京の飲食店（幹部は名前の無いモブ。テトリスは1行） ----
- id: ch3_ochige
  title: 落ちゲーを狙う
  background: pu_inshokuten
  bgm: curious
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 仁井谷, emotion: normal}
  - {who: kanbu, x: 0.86, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1990年の夏、東京の飲食店。仁井谷は、ゲームメーカーの幹部と会います。
    reading: せんきゅうひゃく きゅうじゅうねんの なつ、とうきょうの いんしょくてん。にいたにわ、げーむ めーかーの かんぶと あいます。
  - speaker: kanbu
    emotion: normal
    text: コンパイルさんは、次は何を？
  - speaker: zundamon
    emotion: happy
    text: '[落ちゲー|おちゲー]を狙います。'
  - speaker: kanbu
    emotion: surprised
    text: ……[落ちゲー|おちゲー]？ 携帯ゲーム機で売れてる、テトリスみたいな？
  - speaker: zundamon
    emotion: normal
    text: はい。
  - speaker: kanbu
    emotion: normal
    text: 上から落ちてくる物を、消すだけの？
  - speaker: zundamon
    emotion: happy
    text: それを、うちらしく作ります。
  - speaker: kanbu
    emotion: normal
    text: ……お手並み拝見ですな。
  - speaker: reimu
    text: 作りは単純で、開発費も安い。この落ちゲーの権利を、なぜ7年半後に手放すのか。
    reading: つくりわ たんじゅんで、かいはつひも やすい。この おちげーの けんりお、なぜ ななねんはんごに てばなすのか。
# ---- 1990〜1991年・喫茶店の会議（仁井谷は出さない。結論は米光の話どおり「丸めて出す」。「うまいことやれ」は上層部のモブ。米光はすぐに引き受けた。コーヒーの話は米光の2026年の言葉） ----
- id: ch4_kissaten
  title: 喫茶店の会議
  background: pu_kissaten
  stage:
  - {who: joso1, x: 0.12, flip: true, emotion: normal}
  - {who: joso2, x: 0.34, flip: true, emotion: normal}
  - {who: yonemitsu, x: 0.86, emotion: normal}
  cuts:
  - speaker: reimu
    text: 社内で作り始めた落ちものは、どうにも面白くなりません。上層部が、喫茶店に集まります。
    reading: しゃないで つくりはじめた おちものわ、どうにも おもしろく なりません。じょうそうぶが、きっさてんに あつまります。
  - speaker: reimu
    text: 別のチームの米光一成は、コーヒー目当てでついてきていたとのちに話しています。
    reading: べつの ちーむの よねみつ かずなりわ、こーひー めあてで ついてきて いたと のちに はなして います。
  - speaker: joso2
    emotion: normal
    text: ドミノの数字を合わせて、消すゲームだったな。
  - speaker: joso1
    emotion: normal
    text: 議題は、開発をやめるかどうかだ。
  - speaker: joso2
    emotion: normal
    text: ほぼできてるんだから、どうにか丸めて出そう。
  - speaker: joso1
    emotion: normal
    text: ……で、誰がまとめる。
  - speaker: joso1
    emotion: normal
    text: じゃあ米光、うまいことやれ。
    se: don
  - speaker: yonemitsu
    emotion: happy
    text: やります！
  - speaker: joso2
    emotion: normal
    text: 即答か。
    beat: true
  - speaker: reimu
    text: その場でいちばん若かった米光が、初代ぷよぷよの企画監督になります。
    reading: その ばで いちばん わかかった よねみつが、しょだい ぷよぷよの きかく かんとくに なります。
  - speaker: reimu
    text: プログラマーの広野隆行は2023年に、社長をこう振り返ります。現場の創造力を信頼し、任せてくれた。
