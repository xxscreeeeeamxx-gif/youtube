meta:
  title: 「急場をしのげればいい」とぷよぷよの権利を手放した社長、会社は負債75億円で和議へ【ずんだもん解説】
  slug: compile-niitani
  hook_line: 最高の売上の翌年に、ぷよぷよの会社はなぜ看板の権利を手放したのか。
  summary: 1997年12月、広島。ぷよぷよを世に出したゲーム会社コンパイルの社長・仁井谷正充は、社員のボーナスが払えず、取引先のセガに電話をかけます。落ちゲーを狙った小さな会社は、まんじゅうの行列と1万8000人の大会を経て、年商約70億円に。テーマパークの夢、1年で130人の採用、競うように貸した30ほどの銀行。最高の売上の翌年に、なぜ看板の権利を手放したのか。本人のインタビューと当時の報道をもとに、再現ドラマでたどります。（2026年11月時点）
  sources:
  - ASCII.jp「コンパイルが広島地裁に和議申請、今後はイベントを縮小しゲーム制作を柱に」（1998年3月19日） https://ascii.jp/elem/000/000/302/302818/
  - 4Gamer.net「コンパイルという十字架，蟄居の気持ちから再起して「にょきにょき」へ。コンパイル○社長・仁井谷正充氏インタビュー」（2016年9月20日） https://www.4gamer.net/games/343/G034312/20160905028/
  - 読売新聞オンライン 連載「あれから」（2023年12月10日） https://www.yomiuri.co.jp/national/20231209-OYT1T50198/
  - GameBusiness.jp「【対談】『にょきにょき』コンパイル○仁井谷正充の人生―成功と失敗から再起」（2016年11月27日） https://www.gamebusiness.jp/article/2016/11/27/12764.html
  - 4Gamer.net「ぷよぷよ」35周年記念対談（2026年3月） https://www.4gamer.net/games/434/G043433/20260303064/
  - セガ（PR TIMES）「「ぷよぷよ」35周年 “だいれんさ！” プロジェクト続報発表！」（2026年10月13日） https://prtimes.jp/main/html/rd/p/000007750.000005397.html
