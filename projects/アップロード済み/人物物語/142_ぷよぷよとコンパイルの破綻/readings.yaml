# compile-niitani 読み台帳（人名・地名・社名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている（タグは付けていない）。
# 名札（tag: 仁井谷 / label: セガの人・役員・人事・銀行員・経理・社員・幹部・上層部・米光・和菓子屋・客・新人・記者・広報）・
# テロップ・章タイトルは表示専用なのでタグを付けていない。
#
# 2026-11-18 台本を書いたあと、セリフ全行を話者ごとの VOICEVOX スタイル（ずんだもん3・つむぎ8・モブは meta.mobs の voice）で
# audio_query にかけた結果:
# - 仁井谷 はタグなしだと ニイ/タニ と切れた → カタカナのタグ [仁井谷|ニイタニ] で ニイタニノ・ニイタニワ・ニイタニサンワ（1語）。
# - 米光 は文脈で読みが割れた。「じゃあ米光、うまいことやれ」はタグなしで ヨネミツ（1語）、
#   [米光|ヨネミツ]・[米光|よねみつ] だと ヨネ/ミツ と切れた → この行はタグなし。
#   ただし「企画監督は米光なの」はタグなしで ベエコオ になった → 米光 だけで言う行は作らず、米光 は台帳に入れていない。
#   米光一成 はタグなしで ヨネミツ/イッセエ、[米光一成|ヨネミツカズナリ]・ひらがなのタグは ヨネ/ミツカズナリ と切れた
#   → 名前の所だけ 米光[一成|カズナリ] で ヨネミツ/カズナリヨ（姓と名で切れるだけ）。ナレは reading。
# - 来月の分 が ライゲツノ/ワケ になった → [分|ぶん] で ブン。（「来月の分を前借り」は タグなしで ブンオ だった）
# - 1行2億円 が イチギョオ になった → [1行|いっこう] で イッコオ（銀行の数え方）。
# - 『返せ、返せ』 はタグなしだと カエセ/カエセ/ノ と細切れ、[『返せ、返せ』|カエセカエセ] は カエセ/カエ/セノ と崩れた
#   → [『返せ、返せ』|かえせかえせ] で カエセカエセノ（1語）。字幕は本人の言葉どおり『返せ、返せ』。
# - 10億円 はタグなしで ジュウ/オクエン と2句 → [10億円|ジュウオクエン] で1句。
# - 下請け・上場・和議・手形・急場・先行投資・蟄居・連鎖・落ちゲー は、タグを付けても抑揚は切れなかった
#   （シタウケノ・ジョオジョオ・ワギガ・テガタノ・キュウバオ・センコオトオシオ・チッキョノ・レンサワ・オチゲエオ）。
# - e-Sports は [e-Sports|イースポーツ] で イイスポオツニ（タグなしだと イイ/スポオツ と切れる）。TV は [TV|テレビ] で テレビシュツエンガ。
# 2026-11-18 見直し（pu_fix.md）で直した・足したセリフも audio_query にかけた:
# - 「何とか運転資金を」はタグなしだと ナニトカ → [何とか|なんとか] で ナントカ/ウンテンシキンオ（冒頭と ch11_denwa の2か所）。
# - 「まだ1小節も」は イチショオセツ → [1小節|イッショウセツ] で イッショオセツモ（ひらがなのタグは イッ/ショオセツ と切れる）。
# - 「いつの何の額か」は ナニノ → [何|なん]の で ナンノ。
# - 正しく読んだ（タグなし）: 丸めて出そう（マルメテ/ダソオ）・即答か（ソクトオカ）・攻撃の予告（コオゲキノ/ヨコクオ）・
#   機種ごとの順位（キシュゴトノ/ジュンイデ）・夜中まで（ヨナカマデ）・歌い切りました（ウタイキリマシタ）・足元（アシモト）・
#   性急な（セエキュウナ）・ITバブル（アイティイバブル）・崩壊（ホオカイ）・建てる前に（タテル/マエニ）・長い付き合い（ツキアイ）・
#   悪いのは（ワルイ/ノワ）・時点（ジテン）・額（ガク）。
# - タグなしで正しく読んだので台帳に入れていない語: コンパイル・セガ・ぷよぷよ・ぷよぷよランド・メインバンク・事業費（ジギョオヒ）・
#   融資（ユウシ）・期日（キジツ）・年商（ネンショオ）・一斉（イッセエ）・大合唱（ダイガッショオ）・資金ショート・引き換え・買い戻せ・
#   企画監督・直営（チョクエエ）・自前（ジマエ）・壇上（ダンジョオ）・入場の上限・選曲（センキョク）・1小節（イチショオセツ）・
#   同期（ドオキ）・何人（ナンニン）・何本（ナンボン）・何億円（ナンオクエン）・何を（ナニオ）・人員拡大・年率・10%（ジュッパアセント）・
#   幽閉（ユウヘエ）・世間・単なる・初心者・上級者・生みの親（ウミノ/オヤ）・見出し・121通（イッツウ）・債権者・もみじ饅頭・
#   お手並み拝見・首を振る（クビ）・けえ（ケエ）・1000年先（センネンサキ）・1万8000人・テトリス・ドミノ・にょきにょき。
