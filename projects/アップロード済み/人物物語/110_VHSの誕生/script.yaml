meta:
  title: 幸之助「ほう、こっちの方が軽うおますなあ」赤字の事業部が作ったVHS、世界で9億台に【ずんだもん解説】
  slug: vhs-takano
  hook_line: 先に出て画もきれいと言われたベータに、赤字の事業部のVHSはなぜ勝てたのか。
  summary: 1976年の春、ビクターの一室。松下幸之助が、机に並んだ3台のビデオを1台ずつ持ち上げました。そのうちの1台を作ったのは、人を減らせと言われ続ける赤字のビデオ事業部と、事業部長の高野鎮雄です。ソニーのベータに1年半遅れた機械は、2時間と仲間づくりで何を変えたのか。そして勝ったはずのビクターは、なぜそのあと苦しんだのか。部下の回想と会社の発表、当事者の著書を主語つきで並べて、晩年までを再現ドラマでたどります。（2026年11月時点）
  sources:
  - 日本ビクター（JVC）「JVC Awarded Prestigious IEEE Milestone for Development of VHS Video」（2006年10月11日） https://www3.jvckenwood.com/english/press/2006/ieee.pdf
  - 国立科学博物館 産業技術史資料データベース「VHS方式家庭用ビデオ（初号機モデル） HR-3300」 https://sts.kahaku.go.jp/sts/detail.php?no=900190011024
  - 白石勇磨「VHS方式家庭用VTR」『テレビジョン学会誌』32巻10号（1978年） https://www.jstage.jst.go.jp/article/itej1978/32/10/32_10_876/_pdf
  - 日本経済新聞「成功体験の逆襲 ビクターの遠い夜明け」（2011年1月4日） https://www.nikkei.com/article/DGXNASDD280BM_Y0A221C1000000/
  - 盛田正明・神仁司『人の力を活かすリーダーシップ』抜粋（PRESIDENT Online） https://president.jp/articles/-/74949
  - 国立映画アーカイブ「マグネティック・テープ・アラート：磁気テープ映像の保存に向けてできること」 https://www.nfaj.go.jp/event/unesco2024/
