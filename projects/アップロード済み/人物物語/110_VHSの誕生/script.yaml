  - speaker: zundamon
    emotion: normal
    text: 構わんよ。
  - speaker: kenkyu
    emotion: surprised
    text: 2時間、録れるんですか……。
  - speaker: kenkyu
    emotion: thinking
    text: ……持ち帰って、報告します。
- id: ch2_saikai
  title: おう、アンタか
  background: vh_jigyobu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 高野鎮雄, emotion: happy}
  - {who: eigyo, x: 0.7, emotion: thinking}
  cuts:
  - speaker: eigyo
    emotion: thinking
    text: ……2年ぶりです。今日から、ビデオ事業部です。
  - speaker: zundamon
    emotion: happy
    text: おう、アンタか！
  - speaker: eigyo
    emotion: thinking
    text: ……顔は、もう見たくないのでは。
  - speaker: zundamon
    emotion: normal
    text: 世界のVHSにしたい。やってくれるか。
  - speaker: zundamon
    emotion: normal
    text: 新しい文化と産業を育てたい。[一企業|いちきぎょう]の損得でVHSをやるのではない。
  - speaker: zundamon
    emotion: normal
    text: 今度は、命がけでやってくれ。
  - speaker: eigyo
    emotion: sad
    text: ……また、命だ。
    se: manuke
  - speaker: reimu
    text: 一企業の損得ではない。この考えが、VHSの勝ち方を決めます。そして、勝ったあとの悩みも。
    reading: いちきぎょうの そんとくでわ ない。この かんがえが ぶいえいちえすの かちかたお きめます。そして、かった あとの なやみも。
# ---- 1976年の春：3台の機械 ----
- id: card1976
  title: ''
  background: vh_card_1976
  bgm: serious
  cuts:
  - speaker: reimu
    text: 1976年の春。ビクターの一室に、3社の首脳が集まります。
    reading: せんきゅうひゃく ななじゅうろくねんの はる。びくたーの いっしつに、さんしゃの しゅのうが あつまります。
- id: ch3_sandai
  title: 3台の機械
  background: vh_osetsu
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 高野鎮雄, emotion: normal}
  - {who: konosuke, x: 0.52, emotion: normal}
  - {who: morita, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 松下は相談役の松下幸之助。ソニーは会長の盛田昭夫たち。ビクターからは、事業部長の高野も加わります。
    reading: まつしたわ そうだんやくの まつした こうのすけ。そにーわ かいちょうの もりた あきおたち。びくたーからわ じぎょうぶちょうの たかのも くわわります。
  - speaker: zundamon
    emotion: normal
    text: こちらがVHSです。録画は、2時間です。
  - speaker: reimu
    text: 机にはベータとVHS、それに松下の子会社のVX。最後に幸之助が、各社の機械を持ち上げます。
    reading: つくえにわ べーたと ぶいえいちえす、それに まつしたの こがいしゃの ぶいえっくす。さいごに こうのすけが かくしゃの きかいお もちあげます。
  - speaker: konosuke
    emotion: happy
    text: ほう、こっちの[方|ほう]が軽うおますなあ。
  - speaker: zundamon
    emotion: surprised
    text: ……軽い、か。
  - speaker: reimu
    text: その場にいたソニーの大賀典雄の回想では、幸之助はほほ笑み、ビクター製の採用が決まったといいます。
    reading: その ばに いた そにーの おおが のりおの かいそうでわ こうのすけわ ほほえみ、びくたーせいの さいようが きまったと いいます。
  - speaker: reimu
    text: VHSは、ベータより5キロほど軽かったといいます。お米の5キロ袋、1つ分です。
    reading: ぶいえいちえすわ べーたより ごきろ ほど かるかったと いいます。おこめの ごきろ ぶくろ、ひとつぶんです。
# ---- 1976年5月：百五十点 ----
- id: ch3_hyakugoju
  title: 百五十点？
  background: vh_soudanyaku
  stage:
  - {who: konosuke, x: 0.3, flip: true, emotion: normal}
  - {who: morita, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 5月7日。幸之助は、ソニーの盛田昭夫にこう言ったとされます。
    reading: ごがつ なのか。こうのすけわ、そにーの もりた あきおに こう いったと されます。
  - speaker: konosuke
    emotion: normal
    text: 規格統一は、何としてもせなあかん。
  - speaker: konosuke
    emotion: thinking
    text: わしの見るところ、ベータマックスは百点や。
  - speaker: konosuke
    emotion: normal
    text: わしの見るところ、VHSは百五十点や。
  - speaker: konosuke
    emotion: thinking
    text: これだけ差がある以上、どうにもならん。
  - speaker: konosuke
    emotion: normal
    text: '[盛田|もりた]はん、率直に言います。'
  - speaker: konosuke
    emotion: normal
    text: VHSの規格を採用してもらうという訳には、いかんやろうか。
  - speaker: morita
    emotion: thinking
    text: ……ご迷惑を、おかけしました。
    beat: true
  - speaker: reimu
    text: ただ、幸之助の言葉は資料で割れます。200点とする回想も、安く作れる方を採るとする本もあります。
    reading: ただ こうのすけの ことばわ しりょうで われます。にひゃくてんと する かいそうも、やすく つくれる ほうお とると する ほんも あります。
# ---- 1976年9月と10月：発表と発売 ----
- id: ch3_hatsubai
  title: 25万6000円
  background: vh_denkiten
  bgm: honwaka_puppu
  stage:
  - {who: kyaku, x: 0.28, flip: true, emotion: normal}
  - {who: hanbai, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 9月9日、ビクターはVHSの1号機HR-3300を発表。売り出しは、10月31日です。
    reading: くがつ ここのか、びくたーわ ぶいえいちえすの いちごうき えいちあーる さんぜん さんびゃくお はっぴょう。うりだしわ じゅうがつ さんじゅういちにちです。
  - speaker: kyaku
    emotion: normal
    text: これが、2時間録れるビデオか。
  - speaker: hanbai
    emotion: happy
    text: はい。120分のテープ1本で、映画が丸ごと入ります。
  - speaker: kyaku
    emotion: happy
    text: 夜中の映画も[録って|とって]おけば、朝に見られるのか。
  - speaker: hanbai
    emotion: happy
    text: 見たい時に、見たいだけ見られます。
  - speaker: kyaku
    emotion: happy
    text: テープは、いくら？
  - speaker: hanbai
    emotion: happy
    text: 6000円です。
  - speaker: kyaku
    emotion: thinking
    text: で、本体は？
  - speaker: hanbai
    emotion: happy
    text: 25万6000円です！
  - speaker: kyaku
    emotion: surprised
    text: 給料の、3か月分近いじゃないか！
    se: gaan
  - speaker: hanbai
    emotion: normal
    text: チューナー入りで、重さは13.5キロ。小さくて[軽い|かるい]ですよ。
  - speaker: kyaku
    emotion: thinking
    text: 本体は軽くても、値段は重いな。
    beat: true
# ---- 1976年秋：他社のマーク ----
- id: ch4_line
  title: 他社のマーク
  background: vh_line
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 高野鎮雄, emotion: normal}
  - {who: eigyo, x: 0.7, tag: 営業課長, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 売り出しの秋。生産が追いつかず、店に出す機械がまるで足りません。
    reading: うりだしの あき。せいさんが おいつかず、みせに だす きかいが まるで たりません。
  - speaker: eigyo
    emotion: surprised
    text: 事業部長！ うちのマークが、1台も流れていません！
  - speaker: eigyo
    emotion: angry
    background: vh_line_yoso
    text: シャープに三菱電機……流れてくるのは、よその会社のマークばかりです！
  - speaker: zundamon
    emotion: normal
    text: ああ。先に、仲間の会社へ回している。
  - speaker: eigyo
    emotion: angry
    text: 敵に塩を送るとは、どういう神経ですか！
  - speaker: zundamon
    emotion: normal
    text: まだ生産ラインが出来てないから、アンタ方はただ配給しているだけだ。
  - speaker: zundamon
    emotion: normal
    text: しかし生産体制が整ったら、数量が急増する。
  - speaker: zundamon
    emotion: normal
    text: その時どうやって普及させるか考えるのが、アンタの仕事だ。
  - speaker: eigyo
    emotion: thinking
    text: ……でも、よそのマークですよ。
  - speaker: zundamon
    emotion: normal
    text: 世界のVHSになったら、テレビと同じくらいの台数が必要になる。
  - speaker: eigyo
    emotion: surprised
    text: テ、テレビと同じくらい！？
  - speaker: zundamon
    emotion: normal
    text: 年間数千万台という量を、我が社だけで供給できるはずもない。
  - speaker: zundamon
    emotion: thinking
    text: 供給できる仲間をもっともっと増やさないと、責任が果たせない。
  - speaker: zundamon
    emotion: normal
    text: その仲間とは、開発期の利益も分かち合って協力していかなければ……
  - speaker: zundamon
    emotion: normal
    text: 世界のVHSには、育てられない。
  - speaker: zundamon
    emotion: normal
    text: 了見の狭いことを考えるな！
    beat: true
    telops:
    - {text: "高野「了見の狭いことを考えるな！」", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: eigyo
    emotion: sad
    text: ……はい。
