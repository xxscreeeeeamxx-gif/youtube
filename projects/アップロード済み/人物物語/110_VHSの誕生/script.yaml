scenes:
# ---- 先出し（1976年の春・ビクターの一室） ----
- id: co_osetsu
  title: ''
  background: vh_osetsu
  bgm: serious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 高野鎮雄, emotion: thinking}
  - {who: konosuke, x: 0.52, emotion: normal}
  - {who: morita, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1976年の春。ビクターの一室に、親会社の松下と、ライバルのソニーの首脳が集まりました。
    reading: せんきゅうひゃく ななじゅうろくねんの はる。びくたーの いっしつに おやがいしゃの まつしたと、らいばるの そにーの しゅのうが あつまりました。
  - speaker: reimu
    text: 机には、大きさの違うビデオが3台。松下幸之助が、1台ずつ持ち上げます。
    reading: つくえにわ おおきさの ちがう びでおが さんだい。まつした こうのすけが、いちだいずつ もちあげます。
  - speaker: konosuke
    emotion: happy
    text: ほう、こっちの[方|ほう]が軽うおますなあ。
    telops:
    - {text: "幸之助「ほう、こっちの方が軽うおますなあ」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: ……軽い、か。
  - speaker: reimu
    text: 軽いほうを作ったのは、赤字続きの事業部。事業部長は高野鎮雄、52歳です。
    reading: かるい ほうお つくったのわ、あかじ つづきの じぎょうぶ。じぎょうぶちょうわ たかの しずお、ごじゅうにさいです。
  - speaker: reimu
    text: 先に出たベータを抜き、VHSは30年で世界9億台以上。ビクターの2006年の発表です。
    reading: さきに でた べーたお ぬき、ぶいえいちえすわ さんじゅうねんで せかい きゅうおくだい いじょう。びくたーの にせんろくねんの はっぴょうです。
    telops:
    - {text: "30年で9億台以上（ビクター 2006年発表）", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
# ---- 今の部屋（茶番と問い） ----
- id: hook
  title: ''
  background: vh_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ 押し入れから、運動会のビデオテープが出てきたのだ！
    se: jaan
  - speaker: tsumugi
    emotion: normal
    text: VHSね。見るためのデッキは、あるの？
  - speaker: zundamon
    emotion: thinking
    text: ……無いのだ。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: そのVHS、ソニーのベータより1年半ほど後に出たのよ。
  - speaker: tsumugi
    emotion: thinking
    text: 画質もベータのほうが上、と言われてたの。
    telops:
    - {text: "先に出て画もきれいなベータに、なぜ勝てた？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 後から出て、なんで勝てたのだ！？
  - speaker: tsumugi
    emotion: normal
    text: しかも[勝った|かった]ビクターは、そのあと苦しむの。
  - speaker: zundamon
    emotion: surprised
    text: '[勝った|かった]のに、なんで！？'
# ---- 1970年：赤字の事業部 ----
- id: card1970
  title: ''
  background: vh_card_1970
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1970年。高野鎮雄が、ビクターのビデオ事業部長になります。
    reading: せんきゅうひゃく ななじゅうねん。たかの しずおが、びくたーの びでお じぎょうぶちょうに なります。
- id: ch1_akaji
  title: 赤字の事業部
  background: vh_jigyobu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 高野鎮雄, emotion: normal}
  - {who: keiri, x: 0.7, emotion: normal}
  cuts:
  - speaker: keiri
    emotion: normal
    text: 事業部長。事業部の数字です。
  - speaker: zundamon
    emotion: normal
    text: 聞こう。
  - speaker: keiri
    emotion: thinking
    text: 業務用のビデオを[細々と|ほそぼそと]作っていますが、精密加工に弱くて。
  - speaker: keiri
    emotion: thinking
    text: 製品は、不良品の山です。
  - speaker: keiri
    emotion: thinking
    text: 販売も伸びず、大赤字と膨大な借金を抱えています。
  - speaker: reimu
    text: ビデオの売上は一位のソニーに遠く及ばず、松下の数分の一。人を減らす話も、たびたび出ていました。
    reading: びでおの うりあげわ いちいの そにーに とおく およばず、まつしたの すうぶんのいち。ひとお へらす はなしも、たびたび でて いました。
  - speaker: zundamon
    emotion: sad
    text: ……で、その責任は。
  - speaker: keiri
    emotion: normal
    text: 事業部長です。損益も資金も、重い責任を負っていただきます。
  - speaker: zundamon
    emotion: thinking
    text: ずいぶん、重い椅子だな。
  - speaker: zundamon
    emotion: normal
    text: よし。家庭用をやろう。家で録れるビデオだ。
  - speaker: keiri
    emotion: surprised
    text: この赤字で、ですか！？
    se: bikkuri
  - speaker: reimu
    text: 高野は浜松の学校で精密機械を学んだ技術者。家庭用のビデオには、大きな需要が来ると見ていました。
    reading: たかのわ はままつの がっこうで せいみつ きかいお まなんだ ぎじゅつしゃ。かていようの びでおにわ おおきな じゅようが くると みて いました。
# ---- 1971年：12の目標 ----
- id: ch1_hyo
  title: 12の目標
  background: vh_kaihatsu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 高野鎮雄, emotion: normal}
  - {who: gishi, x: 0.7, emotion: happy}
  cuts:
  - speaker: gishi
    emotion: happy
    text: 事業部長、家庭用の機械は何を目指しますか。
  - speaker: zundamon
    emotion: normal
    text: まず、録画の時間だ。
  - speaker: gishi
    emotion: normal
    text: 1時間なら、テープも機械も小さくできます。
  - speaker: zundamon
    emotion: thinking
    text: 1時間じゃ、映画が途中で切れるな。
  - speaker: zundamon
    emotion: normal
    text: 映画もスポーツも最後まで見られる、2時間だ。
  - speaker: gishi
    emotion: surprised
    text: に、2時間！？
  - speaker: zundamon
    emotion: normal
    text: それから、家のテレビにそのままつなげること。
  - speaker: zundamon
    emotion: normal
    text: よその会社の機械とも、テープが使えること。
  - speaker: gishi
    emotion: surprised
    text: よその会社とも！？
  - speaker: zundamon
    emotion: normal
    text: 安くて使いやすくて、作りやすいこと。
  - speaker: gishi
    emotion: sad
    text: ……全部、ですか。
    se: zukko
  - speaker: gishi
    emotion: thinking
    text: ……表にしたら、目標は12になります。
  - speaker: reimu
    text: それでも5年後の1号機は25万6000円。当時の大卒の初任給の約2.7か月分、今なら約72万円です。
    reading: それでも ごねんごの いちごうきわ にじゅうごまん ろくせんえん。とうじの だいそつの しょにんきゅうの やく にーてんななかげつぶん、いまなら やく ななじゅうにまんえんです。
    telops:
    - {text: "25万6000円＝初任給の約2.7か月分", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: ソニーの開発の責任者は、のちに著書でこう語っています。
    reading: そにーの かいはつの せきにんしゃわ、のちに ちょしょで こう かたって います。
  - speaker: reimu
    text: 大河ドラマは45分の番組でした。1時間以上の番組はあまりありませんでした。
    reading: たいが どらまわ よんじゅうごふんの ばんぐみでした。いちじかん いじょうの ばんぐみわ あまり ありませんでした。
  - speaker: reimu
    text: それで、ソニーは1時間録画できれば十分だという考えでスタートしました。
    reading: それで そにーわ いちじかん ろくが できれば じゅうぶんだと いう かんがえで すたーと しました。
  - speaker: reimu
    text: 1時間か、2時間か。この差が、のちに勝負を分けます。
    reading: いちじかんか にじかんか。この さが、のちに しょうぶお わけます。
    telops:
    - {text: "1時間か、2時間か", size: lg, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
# ---- 1973年：親会社の方式で出せ ----
- id: card1973
  title: ''
  background: vh_card_1973
  bgm: serious
  cuts:
  - speaker: reimu
    text: 1973年。親会社の松下が、自分の方式の家庭用ビデオ、オートビジョンを出します。
    reading: せんきゅうひゃく ななじゅうさんねん。おやがいしゃの まつしたが じぶんの ほうしきの かていよう びでお、おーとびじょんお だします。
- id: ch1_fukusha
  title: 親会社の方式で出せ
  background: vh_yakuin
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 高野鎮雄, emotion: normal}
  - {who: fukusha, x: 0.7, emotion: normal}
  cuts:
  - speaker: fukusha
    emotion: normal
    text: '[高野|たかの]くん。松下さんが、オートビジョンを出した。'
  - speaker: fukusha
    emotion: normal
    text: うちも、この方式で出しなさい。
  - speaker: zundamon
    emotion: thinking
    text: ……お断りします。
    se: don
  - speaker: fukusha
    emotion: surprised
    text: なに？ 親会社の方式だぞ。
  - speaker: zundamon
    emotion: normal
    text: あれは、本命ではありません。
  - speaker: fukusha
    emotion: angry
    text: 赤字の事業部が、親会社に逆らうのか。
  - speaker: zundamon
    emotion: normal
    text: 本命は、うちで作ります。
  - speaker: fukusha
    emotion: thinking
    text: 松下さんに、何と言えばいいんだ……。
  - speaker: fukusha
    emotion: angry
    text: ……知らんぞ。
    beat: true
  - speaker: reimu
    text: オートビジョンは、まもなく市場から消えました。親会社がどの方式を選ぶかが、勝負の分かれ目になります。
    reading: おーとびじょんわ まもなく しじょうから きえました。おやがいしゃが どの ほうしきお えらぶかが、しょうぶの わかれめに なります。
# ---- 1973年：命を懸けてやってくれ ----
- id: ch2_inochi
  title: 命を懸けてやってくれ
  background: vh_jigyobu
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 高野鎮雄, emotion: normal}
  - {who: eigyo, x: 0.7, emotion: happy}
  cuts:
  - speaker: eigyo
    emotion: happy
    text: 本社で、事業部の機械を家庭向けに売る担当になりました。
  - speaker: zundamon
    emotion: normal
    text: アンタか。
  - speaker: zundamon
    emotion: normal
    text: 命を懸けてやってくれ。
  - speaker: eigyo
    emotion: surprised
    text: い、命……ですか。
  - speaker: eigyo
    emotion: thinking
    text: ……時代劇みたいな言い方だな。
    beat: true
- id: ch2_seki
  title: ''
  background: vh_jigyobu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 高野鎮雄, emotion: normal}
  - {who: eigyo, x: 0.7, emotion: normal}
  cuts:
  - speaker: eigyo
    emotion: normal
    text: 事業部長。うちの部署がなくなるので、別の職場へ移ることになりました。
  - speaker: eigyo
    emotion: sad
    text: 事業部長に誘っていただいたのに、すみません。
  - speaker: eigyo
    emotion: normal
    text: ご挨拶に、まいりました。
  - speaker: zundamon
    emotion: thinking
    text: そんなところへ転勤しろと言われて、アンタは黙って承知したのか？
  - speaker: eigyo
    emotion: normal
    text: はい。上司にお任せしました。
  - speaker: zundamon
    emotion: angry
    text: なに！ なぜビデオに移りたい、ダメなら会社を辞めると言わなかった！
  - speaker: zundamon
    emotion: angry
    text: アンタの顔なんか、もう見たくない！
  - speaker: eigyo
    emotion: sad
    text: ……挨拶に、来ただけなのに。
    se: shobon
# ---- 1975年：ベータの発売 ----
- id: ch2_beta
  title: 文庫本と映画1本
  background: vh_kaihatsu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 高野鎮雄, emotion: normal}
  - {who: gishi, x: 0.7, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 1975年5月10日。ソニーが、家庭用ビデオのベータマックスを売り出します。
    reading: せんきゅうひゃく ななじゅうごねん ごがつ とおか。そにーが、かていよう びでおの べーたまっくすお うりだします。
  - speaker: gishi
    emotion: surprised
    text: 事業部長！ ソニーのベータマックスが出ました！
  - speaker: gishi
    emotion: thinking
    text: 去年うちと松下さんに試作機を見せて、方式をそろえようと言ってきた機械です。
  - speaker: zundamon
    emotion: normal
    text: 録画は、何時間だ。
  - speaker: gishi
    emotion: normal
    text: 1時間です。カセットは、文庫本くらいの大きさです。
  - speaker: zundamon
    emotion: thinking
    text: 文庫本、か。
  - speaker: zundamon
    emotion: thinking
    text: それじゃ、映画1本は入らないな。
  - speaker: gishi
    emotion: sad
    text: でも、よく売れてるそうです。
  - speaker: zundamon
    emotion: thinking
    text: ……だろうな。
  - speaker: gishi
    emotion: thinking
    text: 先を越されて、うちに勝ち目はあるんでしょうか。
  - speaker: zundamon
    emotion: normal
    text: ……2時間だ。
    beat: true
  - speaker: reimu
    text: ベータは、家庭用ビデオの決定版と言われました。VHSの試作機は、まだ出来上がっていません。
    reading: べーたわ かていよう びでおの けっていばんと いわれました。ぶいえいちえすの しさくきわ まだ できあがって いません。
# ---- 1975年：試作機と、松下の研究者 ----
- id: ch2_shisaku
  title: 試作機
  background: vh_kaihatsu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 高野鎮雄, emotion: normal}
  - {who: gishi, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1975年の夏から秋。VHSの試作機が出来上がります。
    reading: せんきゅうひゃく ななじゅうごねんの なつから あき。ぶいえいちえすの しさくきが できあがります。
  - speaker: gishi
    emotion: happy
    text: 事業部長、できました！ 2時間、録れます！
    se: levelup
  - speaker: zundamon
    emotion: happy
    text: よくやった。
- id: ch2_kenkyu
  title: ''
  background: vh_kaihatsu
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 高野鎮雄, emotion: happy}
  - {who: gishi, x: 0.52, emotion: normal}
  - {who: kenkyu, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 話は、親会社の松下にも届きます。松下の研究所の人たちが、横浜工場に見に来ました。
    reading: はなしわ おやがいしゃの まつしたにも とどきます。まつしたの けんきゅうじょの ひとたちが、よこはま こうじょうに みに きました。
  - speaker: kenkyu
    emotion: normal
    text: これが、ビクターさんの試作機ですか。
  - speaker: zundamon
    emotion: happy
    text: どうぞ。中まで、よく見てください。
  - speaker: gishi
    emotion: surprised
