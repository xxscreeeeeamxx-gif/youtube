  - speaker: zundamon
    emotion: surprised
    text: 点数まで、ばらばらなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 松下のビデオ事業部長だった人は、普及の最大の山場はRCAとの提携だったって。
  - speaker: tsumugi
    emotion: normal
    text: それにビクターは日立やシャープ、三菱や欧米の会社にも仲間を広げたわ。
  - speaker: tsumugi
    emotion: normal
    text: レンタルのお店のソフトも、だんだんVHSに寄っていったの。
  - speaker: zundamon
    emotion: thinking
    text: 一言じゃなくて、仲間の数なのか。
  - speaker: tsumugi
    emotion: normal
    text: '[幸之助|コーノスケ]さんの判断は大きかった。でも決めたのは、仲間の数と2時間よ。'
- id: ronso3
  title: 窓際族が作った？
  background: vh_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: VHSって、窓際族が本社に隠れて作ったんでしょ？
  - speaker: tsumugi
    emotion: normal
    text: 窓際族っていうのは、のちにテレビ番組でそう呼ばれたのよ。
  - speaker: tsumugi
    emotion: normal
    text: 赤字の事業部の小さなチームが、本社の後押しが薄いまま作ったのは本当。
  - speaker: tsumugi
    emotion: normal
    text: 経理の責任者も、限られた人材と資金のなかでひそかに開発に挑んだと話してる。
  - speaker: tsumugi
    emotion: thinking
    text: でも[高野|たかの]さんは事業部長。開発も生産も販売も、幅広い権限を持ってたの。
  - speaker: tsumugi
    emotion: normal
    text: 1976年には、取締役にもなってるわ。
  - speaker: zundamon
    emotion: surprised
    text: 窓際どころか、ど真ん中なのだ。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 映画にもなったけど、主人公は[高野|たかの]さんをもとにした別の名前の人物よ。
- id: chui
  title: 本当の注意点
  background: vh_heya
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、さっきの運動会のテープよ。
  - speaker: zundamon
    emotion: surprised
    text: ボクのテープ？
  - speaker: tsumugi
    emotion: normal
    text: 国立映画アーカイブは、ユネスコのこんな警告を紹介してるの。
  - speaker: tsumugi
    emotion: thinking
    text: 2025年までにデジタルファイル化しなければ、永遠にアクセスできなくなりかねない。
  - speaker: zundamon
    emotion: surprised
    text: 2025年って、もう過ぎてるのだ！
    se: bikkuri
  - speaker: tsumugi
    emotion: normal
    text: 理由は、再生機の生産と保守の完全終了。
  - speaker: tsumugi
    emotion: normal
    text: それに技術者の減少と、テープの経年劣化よ。
  - speaker: zundamon
    emotion: thinking
    text: 見る機械も直す人も、いなくなるんだ。
  - speaker: tsumugi
    emotion: normal
    text: 国内で最後まで新しいVHSのデッキを作っていたメーカーも、2016年にやめたわ。
  - speaker: tsumugi
    emotion: normal
    text: だから家にあるVHSやベータや8ミリのテープは、早めにデジタルに移してね。
  - speaker: zundamon
    emotion: thinking
    text: まだ、間に合うのだ？
  - speaker: tsumugi
    emotion: normal
    text: テープが傷みきる前なら、望みはあるわ。
  - speaker: tsumugi
    emotion: normal
    text: デッキが動くうちに、業者に頼むか機械でダビングするの。
  - speaker: tsumugi
    emotion: thinking
    text: カビの生えたテープは、無理に再生しないこと。
  - speaker: zundamon
    emotion: happy
    text: 運動会、急いで救出するのだ！
# ---- 現代の章 ----
- id: gendai
  title: 発売から50年
  background: vh_hakubutsukan
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: VHSの1号機の発売から、2026年10月31日でちょうど50年になったの。
  - speaker: zundamon
    emotion: happy
    text: 半世紀なんだ！
  - speaker: tsumugi
    emotion: normal
    text: ビクターの2006年の発表では、30年で世界で9億台以上のデッキが作られたわ。
  - speaker: zundamon
    emotion: surprised
    text: 9億台……！
  - speaker: tsumugi
    emotion: normal
    text: 同じ年、VHSはアメリカの電気電子学会から歴史に残る技術として認められたの。
  - speaker: tsumugi
    emotion: normal
    text: 日本からは6件目で、映像と音響の分野では初めてよ。
  - speaker: tsumugi
    emotion: normal
    text: 記念の銘板には、[高野鎮雄|タカノシズオ]と[白石勇磨|シライシユウマ]が率いる技術者のチームが開発したと刻まれてるわ。
  - speaker: zundamon
    emotion: happy
    text: 名前が、ちゃんと残ってるんだね。
  - speaker: tsumugi
    emotion: normal
    text: 1号機は、国立科学博物館の産業技術史資料にもなってるの。
- id: gendai2
  title: ''
  background: vh_gendai
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 会社は2008年にケンウッドと経営を統合して、2011年に[JVCケンウッド|ジェイブイシーケンウッド]に。
  - speaker: tsumugi
    emotion: thinking
    text: 横浜工場は、売却が進んだの。
  - speaker: tsumugi
    emotion: thinking
    text: 1930年にできた正面の壁も壊されると、2011年の新聞が伝えたわ。
  - speaker: zundamon
    emotion: sad
    text: VHSの生まれた場所が……。
  - speaker: zundamon
    emotion: sad
    text: ビクターの名前も、消えちゃったの？
  - speaker: tsumugi
    emotion: normal
    text: ビクターのブランドは一度途絶えたけど、2017年に復活したの。
  - speaker: tsumugi
    emotion: normal
    text: 公式の年表には、1976年の1号機のこともちゃんと載ってるわ。
  - speaker: zundamon
    emotion: thinking
    text: ベータは、どうなったの？
  - speaker: tsumugi
    emotion: normal
    text: ソニーは2002年にデッキを、2016年にテープを作り終えたわ。
  - speaker: tsumugi
    emotion: normal
    text: ソニーの発表では、ベータのデッキは世界で約1800万台。
  - speaker: tsumugi
    emotion: normal
    text: 国内だけで、約400万台よ。
  - speaker: zundamon
    emotion: thinking
    text: ベータも、たくさんの家で動いてたんだね。
