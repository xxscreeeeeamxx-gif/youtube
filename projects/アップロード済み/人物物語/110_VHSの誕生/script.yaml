  - speaker: eigyo
    emotion: thinking
    text: 店では、ベータの悪いところを言って回っているんですが……。
  - speaker: zundamon
    emotion: angry
    text: こんなに素晴らしい商品を売り込む事が出来ない営業には、プロが居ないということか。
  - speaker: eigyo
    emotion: sad
    text: ……プロが、居ない。
  - speaker: zundamon
    emotion: thinking
    text: ライバルをいくら批判しても、それでお客様が買う気になってくれるわけじゃないだろう。
  - speaker: zundamon
    emotion: normal
    text: 自分に知恵が無かったら、もっといろんな人達から知恵を借りてきたらいいじゃないか。
  - speaker: zundamon
