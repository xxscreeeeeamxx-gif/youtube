  - speaker: zundamon
    emotion: thinking
    text: アンタは今何歳だ、ン？
  - speaker: eigyo
    emotion: surprised
    text: え？
  - speaker: zundamon
    emotion: thinking
    text: 定年までに、まだ25年もあるのか。
  - speaker: zundamon
    emotion: normal
    text: で、その[金|かね]はアンタの定年の時に役立つ[金|かね]か？
  - speaker: zundamon
    emotion: normal
    text: 無駄になる[金|かね]か？ どっちですか。
  - speaker: eigyo
    emotion: surprised
    text: ……な、なんで急に敬語。
    se: tsukkomi
  - speaker: zundamon
    emotion: angry
    text: アンタ方営業は、値引きすることしか知恵が無いのか。
  - speaker: zundamon
    emotion: normal
    text: いいか。今度は、技術屋に代わってアンタ方が大発明をする番だ。
  - speaker: eigyo
    emotion: surprised
    text: だ、大発明！？ 営業がですか！？
  - speaker: eigyo
    emotion: sad
    text: ……もらえたのは、お[金|かね]じゃなくて宿題か。
    beat: true
  - speaker: reimu
    text: 規格の争いが激しくなっても、在庫はさらに膨らんでいきます。
