# vhs-takano 読み台帳（人名・社名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けた。
# ナレ（ゆっくり）は reading: のひらがなで読ませている（VHS = ぶいえいちえす、HR-3300 = えいちあーる さんぜんさんびゃく）。
# 名札（tag: 高野鎮雄 / label: 松下幸之助・盛田昭夫・経理の部長 ほか）とテロップは表示専用なのでタグを付けていない。
# 文脈で読みが変わる語は本文だけでタグを付けた（[方|ほう]・[何|なん]・[君|きみ]・[金|かね]・[等|など]・[今|いま]・[録って|とって]・[軽い|かるい]）。
# 見直しで、1語で読ませるためにカタカナのタグにした（[幸之助|コーノスケ]・[高野鎮雄|タカノシズオ]・[白石勇磨|シライシユウマ]・[日一日|ヒイチニチ]・[拡販費|カクハンヒ]）。
