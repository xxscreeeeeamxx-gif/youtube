meta:
  title: 「刑事訴追のおそれがありますので」と証言を控えたヒューザー社長、4か月後に詐欺で逮捕【ずんだもん解説】
  slug: taishin-ojima
  hook_line: 偽装の対策会議の翌日に、なぜ17戸の売買は進んだのか。
  summary: 2006年1月17日、阪神・淡路大震災の日の国会。耐震偽装が見つかったマンションの売り主、ヒューザーの社長・小嶋進は、証人として証言を控え続けました。下請けの下請けが計算した構造計算書、最短2週間で下りることもあったという民間の審査、そして偽装の対策会議の翌日に進んだ17戸の売買。食い違う言い分を国会の会議録の言葉のまま並べ、国土交通省の資料と判決の報道をもとに、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 国土交通省「姉歯（あねは）建築設計事務所による構造計算書の偽造とその対応について」（2005年11月17日） https://www.mlit.go.jp/kisha/kisha05/07/071117_.html
  - 国土交通省「マンションの耐震性等についてのＱ＆Ａについて」（2005年12月8日） https://www.mlit.go.jp/kisha/kisha05/07/071208_2_.html
  - 国土交通省「構造計算書偽装問題に関する緊急調査委員会の最終報告について」（2006年4月6日） https://www.mlit.go.jp/kisha/kisha06/15/150406_.html
  - 衆議院 国土交通委員会 第163回国会 第7号（2005年11月29日・参考人） https://kokkai.ndl.go.jp/txt/116304319X00720051129
  - 衆議院 国土交通委員会 第163回国会 第14号（2006年1月17日・証人喚問） https://kokkai.ndl.go.jp/txt/116304319X01420060117
  - 日本経済新聞「ヒューザー小嶋元社長、有罪確定へ 耐震強度偽装」（2011年12月13日） https://www.nikkei.com/article/DGXNASDG1302V_T11C11A2000000/
