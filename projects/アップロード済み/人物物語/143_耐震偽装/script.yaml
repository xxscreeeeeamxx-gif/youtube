scenes:
# ---- 先出し（2006年1月17日・衆院国交委の証人喚問。佐藤議員の1問目 K3-133→134。黙祷と、佐藤議員の2・3問目 K3-135〜138 は ch13 へ。言葉はすべて会議録の原文。笑いの SE なし） ----
- id: co_shitsumon
  title: ''
  background: ah_iinkai
  bgm: serious
  stage:
  - {who: zundamon, x: 0.14, flip: true, tag: 小嶋, emotion: sad}
  - {who: sato, x: 0.86, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2006年1月17日、阪神・淡路大震災の日の国会。
    reading: にせん ろくねん いちがつ じゅうしちにち、はんしん あわじ だいしんさいの ひの こっかい。
  - speaker: reimu
    text: 耐震偽装が見つかったマンションの売り主、ヒューザーの社長・小嶋進が証人に立ちます。
    reading: たいしん ぎそうが みつかった まんしょんの うりぬし ひゅーざーの しゃちょう おじま すすむが、しょうにんに たちます。
  - speaker: sato
    emotion: normal
    text: あす、[藤沢|ふじさわ]の方に引き渡しがあるんですけれどもどうしますか、
  - speaker: sato
    emotion: normal
    text: そういうふうに聞かれたと言っておられます。
  - speaker: sato
    emotion: normal
    text: これは、二十七日のいつ、そのようなやりとりがありましたか。
  - speaker: zundamon
    emotion: sad
    text: これに関しましても証言は控えさせていただきたいと思います。
  - speaker: reimu
    text: その3か月ほど前、偽装の対策会議の翌日に、彼の会社は藤沢の17戸の売買を実行していました。
    reading: その さんかげつ ほど まえ、ぎそうの たいさく かいぎの よくじつに かれの かいしゃわ ふじさわの じゅうななこの ばいばいお じっこう して いました。
  - speaker: reimu
    text: 4か月後、彼は詐欺の疑いで逮捕されます。
    reading: よんかげつご、かれわ さぎの うたがいで たいほ されます。
# ---- 今の部屋（フリマの自転車。「裁判所に認められた」の範囲。20秒以内） ----
- id: hook
  title: ''
  background: ah_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: フリマの自転車、ブレーキが怪しいって言われたけど送ったのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 買った人に、伝えた？
  - speaker: zundamon
    emotion: normal
    text: ……届いてから言うつもりだったのだ。
  - speaker: tsumugi
    emotion: angry
    text: それ、いちばんだめなやつ。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: それをマンションでやったと、裁判所に認められた社長がいるの。
  - speaker: tsumugi
    emotion: thinking
    text: 偽装の対策会議の翌日に、なぜ17戸の売買は進んだのか。
    telops:
    - {text: "対策会議の翌日 なぜ17戸の売買は進んだ？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 翌日に！？
# ---- 1982〜2004年・広い部屋を安く（ナレ2行・台詞なし。売上は2004年3月期、社員数は事件のころ） ----
- id: card1982
  title: ''
  background: ah_card_1982
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1982年に不動産の会社を起こした小嶋進。広い部屋を安く売るマンションで伸びます。
    reading: せんきゅうひゃく はちじゅうにねんに ふどうさんの かいしゃお おこした おじま すすむ。ひろい へやお やすく うる まんしょんで のびます。
- id: ch1_hiroi
  title: 広い部屋を安く
  background: ah_model
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 小嶋, emotion: happy}
  cuts:
  - speaker: reimu
    text: 社名は2001年からヒューザー。2004年3月期の売上は約124億円、事件のころの社員は15人ほど。
    reading: しゃめいわ にせん いちねんから ひゅーざー。にせん よねん さんがつきの うりあげわ やく ひゃくにじゅうよんおくえん、じけんの ころの しゃいんわ じゅうごにん ほど。
# ---- 1998〜2004年・下請けの下請けと坪の値段（ヒューザーの社員のモブ。坪は姉歯の証言だと字幕で。2:00 までに着く） ----
- id: ch2_shitauke
  title: 下請けの下請け
  background: ah_honsha
  stage:
  - {who: senpai, x: 0.14, flip: true, emotion: normal}
  - {who: shinjin, x: 0.86, emotion: normal}
  cuts:
  - speaker: shinjin
    emotion: normal
    text: この[構造計算|こうぞうけいさん]、どこがやったんですか。
  - speaker: senpai
    emotion: normal
    text: 元請けの設計事務所が、さらに外に出してる。
  - speaker: shinjin
    emotion: surprised
    text: 外の、外……。
    beat: true
  - speaker: shinjin
    emotion: normal
    text: 計算の前に、何が決まるんです？
  - speaker: senpai
    emotion: normal
    text: '[坪|ツボ]いくらで建てるか、だ。'
  - speaker: shinjin
    emotion: normal
    text: '[坪|ツボ]って、畳2枚分ですよね。'
  - speaker: senpai
    emotion: normal
    text: その2枚分の値段が、先に決まる。
  - speaker: reimu
    text: 計算した姉歯秀次はのちに国会で、ヒューザーから直接ではないが、打ち合わせで坪の値段が決まると述べます。
    reading: けいさん した あねは ひでつぐわ のちに こっかいで ひゅーざーから ちょくせつでわ ないが、うちあわせで つぼの ねだんが きまると のべます。
    telops:
    - {text: "姉歯「坪四十五万でやる」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: shinjin
    emotion: thinking
    text: 中身は、誰が見るんです？
# ---- 1998〜2004年・民間の審査の窓口（名前の無い検査員。委員会の「形式的にチェック」の範囲。イーホームズの社員にしない） ----
- id: ch2_madoguchi
  title: 民間の審査
  background: ah_madoguchi
  stage:
  - {who: kensain, x: 0.14, flip: true, emotion: normal}
  cuts:
  - speaker: kensain
    emotion: normal
    text: 1998年の法改正で、民間でも審査ができる。
  - speaker: kensain
    emotion: normal
    text: 計算のプログラムは、大臣の認定……あり。
  - speaker: kensain
    emotion: happy
    text: はい、確認済み。
    se: zukko
  - speaker: reimu
    text: 姉歯はのちに国会で、審査は最短2週間で下りる場合もあったと言います。
    reading: あねはわ のちに こっかいで、しんさわ さいたん にしゅうかんで おりる ばあいも あったと いいます。
  - speaker: reimu
    text: イーホームズの社長は、チェックはされていたことになっている、と述べます。
    reading: いーほーむずの しゃちょうわ ちぇっくわ されて いた ことに なって いると のべます。
  - speaker: kensain
    emotion: normal
    text: 次の申請、どうぞ。
  - speaker: reimu
    text: 売り主、元請け、下請け、施工、審査。5つの会社の誰が、地震の力の欄を見ていたのか。
    reading: うりぬし もとうけ したうけ しこう しんさ。いつつの かいしゃの だれが、じしんの ちからの らんお みて いたのか。
# ---- 2004年3月8日・1年8か月前の指摘（主人公は不在。別の構造設計者は名前の無いモブ。姉歯は台詞なし） ----
- id: ch3_shiteki
  title: 1年8か月前の指摘
  background: ah_sekkei
  bgm: curious
  stage:
  - {who: sekkeisha, x: 0.14, flip: true, emotion: normal}
  - {who: aneha, x: 0.86, emotion: normal}
  cuts:
  - speaker: sekkeisha
    emotion: surprised
    text: '[姉歯|アネハ]さん。この計算、地震の力を[低減|ていげん]してますね。'
  - speaker: sekkeisha
    emotion: normal
    text: 目盛りをずらした体重計に、乗るようなもんですよ。
  - speaker: reimu
    text: 2004年3月の横浜での打ち合わせ。姉歯はのちに国会で、その場で認めて物件から降りたと述べます。
    reading: にせん よねん さんがつの よこはまでの うちあわせ。あねはわ のちに こっかいで、その ばで みとめて ぶっけんから おりたと のべます。
# ---- 2004年4月ごろ・別の民間の機関に届いた情報（名前の無い検査員のモブ。委員会の認定の範囲） ----
- id: ch3_joho
  title: ''
  background: ah_madoguchi
  stage:
  - {who: kensain, x: 0.14, flip: true, emotion: normal}
  - {who: kensain2, x: 0.86, emotion: normal}
  cuts:
  - speaker: kensain2
    emotion: surprised
    text: この[構造計算|こうぞうけいさん]書、おかしいという情報が来てます。
  - speaker: kensain
    emotion: normal
    text: ……個別の申請の誤り、だな。
  - speaker: kensain2
    emotion: thinking
    text: 誤り、ですか。
  - speaker: reimu
    text: 翌月ごろ、別の民間の機関に届いた疑いの情報は、国などに伝えられませんでした。
    reading: よくげつ ごろ、べつの みんかんの きかんに とどいた うたがいの じょうほうわ くになどに つたえられませんでした。
  - speaker: reimu
    text: 公表の1年8か月前に、偽装は一度見つかっていた。なぜ、止まらなかったのか。
    reading: こうひょうの いちねん はちかげつ まえに、ぎそうわ いちど みつかって いた。なぜ、とまらなかったのか。
# ---- 2005年10月・82キロと117キロ（施工会社の職人と構造設計者のモブ。117キロは前の川崎の建物の量、81キロは北千住の図面＝渡辺議員の説明 K2-58 の範囲。再計算の数字にしない） ----
- id: card2005
  title: ''
  background: ah_card_2005
  cuts:
  - speaker: reimu
    text: 2005年10月、東京・北千住のマンションの工事現場。
    reading: にせん ごねん じゅうがつ、とうきょう きたせんじゅの まんしょんの こうじ げんば。
- id: ch4_genba
  title: 82キロと117キロ
  background: ah_genba
  stage:
  - {who: shokunin, x: 0.14, flip: true, emotion: normal}
  - {who: sekkeisha, x: 0.86, emotion: normal}
  cuts:
  - speaker: shokunin
    emotion: surprised
    text: この柱、[鉄筋|てっきん]これだけか？ 前の現場は、もっと入ってたぞ。
  - speaker: sekkeisha
    emotion: normal
    text: 前の川崎の現場は、1平方メートルあたり117キロでした。
  - speaker: shokunin
    emotion: normal
    text: この図面は？
  - speaker: sekkeisha
    emotion: sad
    text: 81キロです。
  - speaker: shokunin
    emotion: surprised
    text: 36キロも足りねえのか！？
  - speaker: sekkeisha
    emotion: normal
    text: 地震で横から押されたとき、それを受け止めるのが柱の[鉄筋|てっきん]です。
  - speaker: shokunin
    emotion: angry
    text: '[鉄筋|てっきん]、ダイエットしすぎだろ。'
    se: hammer
  - speaker: sekkeisha
    emotion: thinking
    text: しかも、審査は[通|とお]ってるんです。
  - speaker: reimu
    text: 国会で示された数字では、偽造された建物は82キロほど。正しく計算すれば117キロだったと説明されました。
    reading: こっかいで しめされた すうじでわ、ぎぞう された たてものわ はちじゅうにきろ ほど。ただしく けいさん すれば ひゃくじゅうななきろ だったと せつめい されました。
    telops:
    - {text: "鉄筋 約3割少ない", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: 審査を通った建物に、なぜ鉄筋が3割足りなかったのか。見つかったきっかけは、施工会社が気づいたことでした。
    reading: しんさお とおった たてものに なぜ てっきんが さんわり たりなかったのか。みつかった きっかけわ、しこう がいしゃが きづいた ことでした。
# ---- 2005年10月25日・報告（小嶋は報告を受ける画だけ。役員は名前を出さない） ----
- id: ch5_hokoku
  title: 10月25日の報告
  background: ah_honsha
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.14, flip: true, tag: 小嶋, emotion: normal}
  - {who: yakuin, x: 0.86, emotion: normal}
  cuts:
  - speaker: yakuin
    emotion: normal
    text: 社長。イーホームズで、[姉歯|アネハ]さんが数値が低いと認めました。
  - speaker: yakuin
    emotion: normal
    text: 私も、その場にいました。
# ---- 2005年10月26日・国交省に届いたメール（職員は名前の無いモブ。委員会の「1週間を要した」の範囲） ----
- id: ch5_mail
  title: ''
  background: ah_kokkosho
  stage:
  - {who: shokuin, x: 0.14, flip: true, emotion: normal}
  - {who: shokuin2, x: 0.86, emotion: normal}
  cuts:
  - speaker: shokuin2
    emotion: surprised
    text: 10月26日。イーホームズの社長から、メールです。
  - speaker: shokuin2
    emotion: surprised
    text: '[構造計算|こうぞうけいさん]書の偽造が、4件あると。'
  - speaker: shokuin2
    emotion: normal
    text: 大臣には、上げますか？
  - speaker: shokuin
    emotion: thinking
    text: ……まず、確かめてからだ。
  - speaker: reimu
    text: 偽装を知らされた売り主は、このあと何をしたのか。
    reading: ぎそうお しらされた うりぬしわ、この あと なにお したのか。
# ---- 2005年10月27日・11人、3時間（会議の中の台詞は作らない。言い分は場面10の国会の言葉へ橋渡し。昼の同じ机に予定表の背景へ差し替え。やりとりの時刻は決めない） ----
- id: ch6_kaigi
  title: 11人、3時間
  background: ah_kaigi
