# ナレ（ゆっくり）は reading: のひらがなで読ませている（タグは付けていない）。
# 名札（tag: 小嶋 / label: 委員長・委員長代理・佐藤議員・長妻議員・三日月議員・穀田議員・早川議員・渡辺議員・藤田・姉歯・
