#
# 2026-11-18 台本を書いたあと、セリフ全行を VOICEVOX の audio_query（各話者の style）にかけた結果:
# - 小嶋 は [小嶋|オジマ] で オジマ（コジマにしない）。小嶋社長＝オジマ/シャチョオ。
# - 姉歯 は [姉歯|アネハ] で アネハ。篠塚 は [篠塚|シノヅカ] で シノズカ（ヅ＝ズ。正しい）。木村建設 は [木村建設|キムラケンセツ]。
# - 藤沢 は [藤沢|ふじさわ] で フジサワ。グランドステージ[藤沢|ふじさわ]十七戸 も ジュウナナコ で正しい。
# - 「審査は通ってる」は カヨッテル になった → [通|とお]ってる で トオッテル。
# - 「確認済みの紙より」は コヨリ（紙縒り）になった → [紙|かみ]より で カミヨリ。
# - 「二十万棟」は ニジュウマンムネ、「6棟」は ロクムネ になった → [二十万棟|ニジュウマントウ]・[6棟|ろくとう] で トオ。
#   [二十万棟|にじゅうまんとう]（ひらがな）だと ソシテニ/ジュウマン/トウ と切れたのでカタカナにした。
# - 「坪いくら」は [坪|つぼ] だと ツボイ/クラデ と切れた → [坪|ツボ] で ツボイクラデ。坪って＝ツボッテ。
# - 「『耐震偽装』に」は 『』 のせいで タイシンギソオ/ニ と切れた → [『耐震偽装』|たいしんぎそう] で タイシンギソオニ（字幕は『』のまま）。
# - 行ったのか・行わざる・行いましたか は [行|おこな] で オコナッタ/オコナワザル/オコナイマシタカ。
# - 〇・五／〇・四 は タグなしで レエテン/ゴ・レエテン/ヨン。一九九八年 は セン/キュウヒャク/キュウジュウ/ハチネン。どちらも正しい。
# - 参考人 は dictionary.yaml（サンコウニン）でタグなしのまま サンコウニン（第7弾の サンコウジン は出ない）。
# - タグなしで正しく読んだので台帳に入れていない語: ヒューザー（ヒュウザア）・イーホームズ（イイホオムズ）・
#   設計事務所・元請け・確認済み・大臣の認定・数値・第一通報者・徹底的・相当程度・大胆不敵・地震時・
#   違法性・認識・宅建業法等・身勝手（ナレ）・家屋・世帯・公営住宅・空き家・使用禁止・補強・原則・
#   36キロ（サンジュウロッキロ）・1平方メートル（イチヘエホオメエトル）・月10万円（ツキジュウマンエン）・20日（ハツカ）・4日（ヨッカ）。
