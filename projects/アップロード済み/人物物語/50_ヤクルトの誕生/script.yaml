  - speaker: tsumugi
    emotion: normal
    text: ガラス瓶より、大きく見せたいという注文もあったそうよ。
  - speaker: zundamon
    emotion: thinking
    text: 小さいのに、大きく見える形なのだ。
  - speaker: tsumugi
    emotion: happy
    text: この形は、2011年に立体商標にも登録されてるの。
  - speaker: zundamon
    emotion: surprised
    text: 形だけで、ヤクルトだと分かるのだ。
- id: ch10_bannen
  title: 研究に戻る
  background: sr_enkai
  bgm: amacha_hoshizora
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 代田稔, emotion: happy}
  - {who: lady, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1970年に社長を退くと、代田は経営より研究に力を注いだと言われています。
    reading: せんきゅうひゃく ななじゅうねんに しゃちょうお しりぞくと、しろたわ けいえいより けんきゅうに ちからお そそいだと いわれています。
  - speaker: reimu
    text: 販売の女性たちの慰労会には、欠かさず顔を出したと伝えられています。
    reading: はんばいの じょせいたちの いろうかいにわ、かかさず かおお だしたと つたえられています。
  - speaker: lady
    emotion: happy
    text: '[代田|しろた]先生。今年も、来てくださったんですね。'
  - speaker: zundamon
    emotion: happy
    text: みんなが届けてくれるから、菌が家まで行けるのだ。
  - speaker: lady
    emotion: normal
    text: 私たちは、ただ配っているだけですよ。
  - speaker: zundamon
    emotion: normal
    text: 一度きりじゃなく、毎日届くのが一番大事なのだ。
  - speaker: lady
    emotion: happy
    text: では、明日も配ります。
- id: ch10_houmon
  title: 愛の訪問
  background: sr_genkan
  bgm: amacha_hoshizora
  stage:
  - {who: lady, x: 0.3, flip: true, emotion: normal}
  - {who: obaa, x: 0.7, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 1972年、福島県の郡山。販売の女性が、一人暮らしのお年寄りの孤独死の話に心を痛めます。
    reading: せんきゅうひゃく ななじゅうにねん ふくしまけんの こおりやま。はんばいの じょせいが ひとりぐらしの おとしよりの こどくしの はなしに こころお いためます。
  - speaker: lady
    emotion: normal
    text: おばあちゃん、ヤクルトです。
  - speaker: obaa
    emotion: surprised
    text: あら。うちは、頼んでないよ。
  - speaker: lady
    emotion: happy
    text: 私からです。お代は、いりません。
  - speaker: obaa
    emotion: thinking
    text: どうして、そこまでしてくれるんだい。
  - speaker: lady
    emotion: normal
    text: 毎日、顔を見に来たいんです。
  - speaker: obaa
    emotion: happy
    text: ……じゃあ、明日も待ってるよ。
  - speaker: reimu
    text: 一人暮らしのお年寄りの様子を確かめる、愛の訪問活動の始まりです。
    reading: ひとりぐらしの おとしよりの ようすお たしかめる、あいの ほうもん かつどうの はじまりです。
  - speaker: reimu
    text: 自分のお金で届け始めたこの訪問は、今では100を超える自治体に広がっています。
    reading: じぶんの おかねで とどけはじめた この ほうもんわ、いまでわ ひゃくお こえる じちたいに ひろがっています。
    telops:
    - {text: "100を超える自治体へ", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
- id: ch10_shi
  title: ''
  background: sr_baichi
  cuts:
  - speaker: reimu
    text: 1982年3月、代田稔は82歳で亡くなりました。
    reading: せんきゅうひゃく はちじゅうにねん さんがつ しろた みのるわ はちじゅうにさいで なくなりました。
- id: ch11_shikumi
  title: 腸の中の菌
  background: sr_chou
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: つむぎ。代田さんの菌は、今のヤクルトにも入ってるのだ？
  - speaker: tsumugi
    emotion: normal
    text: 入ってるわ。乳酸菌シロタ株。代田さんの名前がついてるの。
  - speaker: zundamon
    emotion: surprised
    text: 名前入りなのだ！
  - speaker: tsumugi
    emotion: normal
    text: 菌の分類の名前は何度か変わったけど、シロタの名前はずっと残ってるの。
  - speaker: tsumugi
    emotion: normal
    text: ふつうのヤクルト1本に、菌がおよそ200億個いるのよ。
  - speaker: zundamon
    emotion: thinking
    text: 飲んだら、どれくらい生き残るのだ？
  - speaker: tsumugi
    emotion: normal
    text: 100億個を、3日続けて飲んでもらった実験があるの。
  - speaker: tsumugi
    emotion: normal
    text: うんちを調べると、1グラムあたり、生きた菌が1000万くらい見つかったのよ。
  - speaker: zundamon
    emotion: surprised
    text: 生きたまま、出口まで来てるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 腸に着いた菌は、乳酸を作って、腸の中を酸っぱくするの。
  - speaker: zundamon
    emotion: thinking
    text: 酸っぱいと、どうなるのだ？
  - speaker: tsumugi
    emotion: normal
    text: 酸っぱいのが苦手な悪い菌は、増えにくくなるわ。
  - speaker: tsumugi
    emotion: happy
    text: ビフィズス菌みたいな良い菌は、逆に増えやすくなるの。
  - speaker: zundamon
    emotion: happy
    text: 腸の中で、味方を増やしてくれるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: ただ、ずっと住み着くわけじゃないの。[数日|すうじつ]で、外に出ていっちゃう。
  - speaker: zundamon
    emotion: surprised
    text: 出ていくのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 飲むのをやめて2週間たつと、ほとんどの人で元どおりになった研究もあるわ。
  - speaker: tsumugi
    emotion: thinking
    text: どっちも、会社の研究者が加わった研究だけどね。
  - speaker: zundamon
    emotion: thinking
    text: だから、毎日なのだ。
  - speaker: tsumugi
    emotion: happy
    text: 毎日届けるやり方と、ちょうど噛み合ってるのよ。
  - speaker: zundamon
    emotion: happy
    text: ところで、ヤクルトのあの色は、[何|なん]の色なのだ？ 色をつけてるのか？
  - speaker: tsumugi
    emotion: normal
    text: 色は足してないの。牛乳の成分と糖を温めたときに、自然につく色なのよ。
  - speaker: zundamon
    emotion: surprised
    text: パンの焼き色と、同じなのだ？
  - speaker: tsumugi
    emotion: happy
    text: そう。どっちも、糖とたんぱく質の仲間が反応してできる色ね。
- id: ch12_ronsou
  title: 飲んでも意味ない？
  background: sr_shiryo
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。ネットで見たのだ。乳酸菌は胃酸で死ぬから、飲んでも意味ないって。
  - speaker: tsumugi
    emotion: normal
    text: 多くの乳酸菌は、たしかに胃でかなり死ぬわ。
  - speaker: tsumugi
    emotion: happy
    text: でもシロタ株は、まさにそこを生き残るように選ばれた菌なの。
  - speaker: zundamon
    emotion: surprised
    text: 代田さんが、酸の中で選んだ菌なのだ！
  - speaker: tsumugi
    emotion: normal
    text: それに、死んだ菌やその成分にも働きがある、という考え方もあるの。
  - speaker: tsumugi
    emotion: normal
    text: 2021年には、専門家の学会がポストバイオティクスとして定義をまとめたわ。
  - speaker: zundamon
    emotion: surprised
    text: 死んでも、働いてるのか。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、ヤクルト1000を飲めば、ぐっすり眠れるのだ？
  - speaker: tsumugi
    emotion: normal
    text: ストレスがかかるときの、睡眠の質を高める。そういう表示が届け出されてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 大事な試験を控えた、医学部の4年生が対象よ。
  - speaker: tsumugi
    emotion: normal
    text: 飲んだ48人と、よく似た偽の飲み物を飲んだ46人を比べたの。
  - speaker: zundamon
    emotion: thinking
    text: 合わせて94人で、決まったのだ？
  - speaker: tsumugi
    emotion: thinking
    text: 人数が少ないし、対象が医学生に偏ってる、という指摘もあるわ。
  - speaker: tsumugi
    emotion: normal
    text: それに機能性表示食品は、国が一つずつ審査したものじゃないの。薬でもないわ。
  - speaker: zundamon
    emotion: sad
    text: 飲めば必ず眠れる薬じゃ、ないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 本当に気をつけたいのは、糖分のほうよ。
  - speaker: tsumugi
    emotion: normal
    text: ふつうのヤクルト1本で、炭水化物が11.5グラム。
  - speaker: tsumugi
    emotion: normal
    text: 原材料の一番はじめに書いてあるのは、ぶどう糖果糖液糖なの。
  - speaker: zundamon
    emotion: surprised
    text: 砂糖の仲間が、一番はじめなのだ！
  - speaker: tsumugi
    emotion: normal
    text: WHOは、食べ物に足す糖を1日25グラム未満にするのが望ましいとしてるわ。
  - speaker: tsumugi
    emotion: thinking
    text: 炭水化物には牛乳の糖も入ってるから、全部が足した糖じゃないけどね。
  - speaker: zundamon
    emotion: sad
    text: 10本飲んだら、炭水化物だけで115グラムなのだ……。
  - speaker: tsumugi
    emotion: angry
    text: だから目安は、1日1本。たくさん飲んでも、そのぶん効くわけじゃないの。
  - speaker: zundamon
    emotion: normal
    text: 1本を、毎日。
  - speaker: tsumugi
    emotion: happy
    text: 少しを、毎日。最初から、そういう飲み物なのよ。
- id: ch13_gendai
  title: 世界の1日
  background: sr_sekai
  bgm: amacha_milkyway
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: ヤクルトは今、40の国と地域で売られてるの。[日本|にほん]も含めてね。
  - speaker: zundamon
    emotion: surprised
    text: 40も！
  - speaker: tsumugi
    emotion: normal
    text: 海外で一番多く飲まれてるのは、インドネシアよ。
  - speaker: zundamon
    emotion: thinking
    text: インドネシアでは、1日に何本なのだ？
  - speaker: tsumugi
    emotion: normal
    text: 乳製品を合わせて、1日におよそ580万本。
  - speaker: zundamon
    emotion: surprised
    text: '[日本|にほん]の外で、そんなに飲まれてるのだ！'
  - speaker: tsumugi
    emotion: normal
    text: 届ける女性たちも、国内におよそ3万1000人、海外に5万人近くいるわ。
  - speaker: zundamon
    emotion: happy
    text: 海外のほうが、多いじゃないか。
  - speaker: tsumugi
    emotion: happy
    text: ヤクルト1000は、2022年に品薄になるほど売れたの。
  - speaker: tsumugi
    emotion: normal
    text: 流行語のトップテンにも入ったわ。
  - speaker: zundamon
    emotion: happy
    text: ボクの冷蔵庫にも、今あるのだ。
  - speaker: tsumugi
    emotion: normal
    text: 2025年には、世界最大の乳酸菌飲料ブランドとして、ギネス世界記録にも認められたの。
  - speaker: zundamon
    emotion: surprised
    text: ギネスなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 始まりは、京都の研究室で、酸の中を生き残った菌だったのよ。
  - speaker: zundamon
    emotion: thinking
    text: 村の子どもを、助けたかったのだ。
- id: shime
  title: ''
  background: sr_ima
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: つむぎ。残りの10本は、明日から1本ずつ飲むのだ。
  - speaker: tsumugi
    emotion: happy
    text: えらいわね。
  - speaker: zundamon
    emotion: happy
    text: 10日で、ちょうど飲み切るのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 賞味期限、見た？
  - speaker: zundamon
    emotion: surprised
    text: ……あさってまでなのだ。
  - speaker: tsumugi
    emotion: angry
    text: 買いすぎよ。家族で1本ずつ分けなさい。
    se: oti
  - speaker: zundamon
    emotion: happy
    text: みんなで、1本ずつなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 胃液をくぐり抜ける菌を、毎日買える値段で。それが、代田さんの答えだったのね。
  - speaker: tsumugi
    emotion: happy
    text: あなたが今日飲む1本にも、その菌が入ってるのよ。
  - speaker: zundamon
    emotion: normal
    text: 甘いのは、ほどほどにする。
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
