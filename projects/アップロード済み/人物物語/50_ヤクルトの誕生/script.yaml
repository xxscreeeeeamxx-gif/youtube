  - speaker: nagamatsu
    emotion: surprised
    text: 毎日、誰でも……。
  - speaker: nagamatsu
    emotion: happy
    text: ……先生。その考えに、私は乗ります。
  - speaker: zundamon
    emotion: surprised
    text: 乗る？
  - speaker: nagamatsu
    emotion: happy
    text: 作るのと売るのは、私にやらせてください。先生は、菌を守ってください。
  - speaker: zundamon
    emotion: happy
    text: ……頼む。
  - speaker: reimu
    text: 実業家の永松昇は、代田の考えに感動して、事業を引き受けたと伝えられています。
    reading: じつぎょうかの ながまつ のぼるわ しろたの かんがえに かんどうして、じぎょうお ひきうけたと つたえられています。
