  - id: lady
    label: 販売の女性
    voice: 8
    pitch: 0.06
  - id: okyaku
    label: お客さん
    voice: 8
    pitch: -0.07
  - id: obaa
    label: おばあさん
    voice: 8
    pitch: -0.08
scenes:
- id: hook
  title: ''
  background: sr_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、見るのだ。冷蔵庫に、ヤクルトを10本並べたぞ。
  - speaker: tsumugi
    emotion: surprised
    text: それ、全部今日飲むつもり？
  - speaker: zundamon
    emotion: happy
    text: 1本に、菌が200億個も入ってるのだ。
  - speaker: zundamon
    emotion: happy
    text: 10本なら2000億。ボクのおなかは、無敵なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 飲む量の目安は、1日1本よ。
  - speaker: zundamon
    emotion: normal
    text: 健康のためなら、甘いものも飲み放題なのだ。
  - speaker: tsumugi
    emotion: angry
    text: 健康のために、糖分を10倍とるの？
  - speaker: zundamon
    emotion: surprised
    text: ……甘いのは、糖分なのだ？
  - speaker: tsumugi
    emotion: normal
    text: 1本で、50キロカロリーくらい。10本なら500よ。
  - speaker: zundamon
    emotion: sad
    text: ご飯2杯分くらいなのだ……。
  - speaker: tsumugi
    emotion: normal
    text: だいたい、そのくらいね。
  - speaker: zundamon
    emotion: thinking
    text: なら、今日は1本だけにする。
  - speaker: zundamon
    emotion: happy
    text: そのかわり、この1000って書いてあるやつにするのだ。
  - speaker: zundamon
    emotion: happy
    text: 1000本分なのだ。
  - speaker: tsumugi
    emotion: angry
    text: 違うわ。菌が1000億個入ってるって意味よ。
  - speaker: zundamon
    emotion: surprised
    text: 1000億！？ 2000億には、ちょっと足りないのだ。
  - speaker: tsumugi
    emotion: angry
    text: 数で勝負しないの。
    se: oti
  - speaker: tsumugi
    emotion: thinking
    text: ずんだもん。その菌って、飲んだあと、どこへ行くと思う？
  - speaker: zundamon
    emotion: normal
    text: そりゃ、おなかだ。
  - speaker: tsumugi
    emotion: normal
    text: その前に、胃を通るの。胃の中は、強い酸でいっぱいなのよ。
  - speaker: zundamon
    emotion: surprised
    text: 菌が、溶けちゃうのだ！？
  - speaker: tsumugi
    emotion: normal
    text: ふつうの菌なら、ほとんど生き残れないわ。
  - speaker: tsumugi
    emotion: happy
    text: でもヤクルトの菌は、生きたまま腸まで届くように、選び抜かれた菌なの。
  - speaker: reimu
    text: ヤクルトの乳製品は、世界で1日に3800万本以上飲まれています。
    reading: やくるとの にゅうせいひんわ、せかいで いちにちに さんぜん はっぴゃくまんぼん いじょう のまれています。
    telops:
    - {text: "世界で1日3800万本以上", size: lg, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: 胃液に負けない菌を選び出したのは、長野生まれの代田稔という医学者でした。
    reading: いえきに まけない きんお えらびだしたのわ、ながの うまれの しろた みのるという いがくしゃでした。
  - speaker: zundamon
    emotion: surprised
    text: 医学者？ 会社の社長さんじゃないのだ？
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、子どものころに見た、村の病気なの。
- id: card1899
  title: ''
  background: sr_card_1899
  cuts:
  - speaker: reimu
    text: 1899年。長野県の、今の飯田市で生まれます。
    reading: せんはっぴゃく きゅうじゅうくねん。ながのけんの いまの いいだしで うまれます。
- id: ch1_mura
  title: 村の子どもたち
  background: sr_ie
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 代田稔, scale: 0.8, emotion: normal}
  - {who: chichi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 家は、紙を扱う問屋と、蚕を育てる仕事をしていたと伝えられています。
    reading: いえわ かみお あつかう とんやと、かいこお そだてる しごとお していたと つたえられています。
  - speaker: chichi
    emotion: normal
    text: '[稔|みのる]。桑の葉を、蚕のところへ運んでくれ。'
  - speaker: zundamon
    emotion: happy
    text: 分かった。蚕は、よく食べるのだ。
  - speaker: chichi
    emotion: happy
    text: 食べた分だけ、いい糸を吐く。
  - speaker: zundamon
    emotion: thinking
    text: ……父さん。となりの家の子が、今日も寝込んでるのだ。
  - speaker: chichi
    emotion: thinking
    text: 腹を下して、もう何日もたつそうだな。
  - speaker: zundamon
    emotion: sad
    text: お医者さんには、診てもらわないのだ？
  - speaker: chichi
    emotion: thinking
    text: 医者を呼ぶ[金|かね]も、滋養のある物を食べさせる余裕も、ない家なんだ。
  - speaker: zundamon
    emotion: sad
    text: 食べる物があれば、治るのだ？
  - speaker: chichi
    emotion: normal
    text: 体に力があれば、持ちこたえる子も多い。
  - speaker: zundamon
    emotion: thinking
    text: ……うちの蚕のほうが、よく食べてる。
- id: ch1_mura2
  title: ''
  background: sr_mura
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 代田稔, scale: 0.8, emotion: sad}
  - {who: chichi, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 村では、赤痢や疫痢で、幼い子どもが命を落とすことが珍しくありませんでした。
    reading: むらでわ せきりや えきりで、おさない こどもが いのちお おとすことが めずらしく ありませんでした。
  - speaker: zundamon
    emotion: sad
    text: ……あの子、助からなかった。
  - speaker: chichi
    emotion: thinking
    text: ……そうか。
  - speaker: zundamon
    emotion: sad
    text: 栄養があれば、治ったかもしれないのに。
  - speaker: chichi
    emotion: thinking
    text: 貧しい家ほど、子どもが先に弱る。
  - speaker: zundamon
    emotion: normal
    text: 父さん。ボクは、医者になるのだ。
  - speaker: chichi
    emotion: surprised
    text: 医者に？
  - speaker: zundamon
    emotion: normal
    text: 死ぬ子を、一人でも減らしたい。
  - speaker: chichi
    emotion: normal
    text: ……勉強は、きついぞ。
  - speaker: zundamon
    emotion: happy
    text: やってみせる。
  - speaker: reimu
    text: 周りの子どもたちの死が、医学を志すきっかけになったと伝えられています。
    reading: まわりの こどもたちの しが いがくお こころざす きっかけに なったと つたえられています。
- id: ch1_gakkou
  title: ''
  background: sr_michi
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 代田稔, scale: 0.88, emotion: happy}
  - {who: doukyu, x: 0.7, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 1913年、飯田の中学に入り、片道8キロの道を毎日歩いて通ったと伝えられています。
    reading: せんきゅうひゃく じゅうさんねん いいだの ちゅうがくに はいり、かたみち はちきろの みちお まいにち あるいて かよったと つたえられています。
  - speaker: doukyu
    emotion: surprised
    text: '[稔|みのる]。毎日、こんな遠くから歩いてるのか。'
  - speaker: zundamon
    emotion: happy
    text: 行って帰って、16キロなのだ。足なら、誰にも負けないぞ。
  - speaker: doukyu
    emotion: thinking
    text: 雨の日もか。
  - speaker: zundamon
    emotion: normal
    text: 雨の日も、雪の日もだ。
  - speaker: doukyu
    emotion: thinking
    text: '[何|なん]のために、そこまでするんだ。'
  - speaker: zundamon
    emotion: normal
    text: 医者になるには、勉強がいるのだ。
  - speaker: doukyu
    emotion: happy
    text: なら、歩きながら単語でも覚えろよ。
  - speaker: zundamon
    emotion: surprised
    text: ……その手があったのだ。
  - speaker: reimu
    text: 1918年には、仙台の第二高等学校に進みます。
    reading: せんきゅうひゃく じゅうはちねんにわ せんだいの だいに こうとう がっこうに すすみます。
- id: card1921
  title: ''
  background: sr_card_1921
  cuts:
  - speaker: reimu
    text: 1921年。京都帝国大学の医学部に入ります。
    reading: せんきゅうひゃく にじゅういちねん。きょうと ていこく だいがくの いがくぶに はいります。
- id: ch2_kyoto
  title: 胃で死ぬ菌
  background: sr_kyoshitsu
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 代田稔, emotion: normal}
  - {who: senpai, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1925年に卒業すると、微生物を研究する教室に残り、助手になります。
    reading: せんきゅうひゃく にじゅうごねんに そつぎょうすると、びせいぶつお けんきゅうする きょうしつに のこり じょしゅに なります。
  - speaker: senpai
    emotion: normal
    text: '[代田|しろた]くん。患者を診る医者にならずに、菌の研究か。'
  - speaker: zundamon
    emotion: normal
    text: 病気を治すより、病気にならない方法を探したいのだ。
  - speaker: senpai
    emotion: thinking
    text: 予防か。ワクチンでも作るつもりかい。
  - speaker: zundamon
    emotion: thinking
    text: 腸なのだ。ボクの村では、腹の病気で死ぬ子どもが多かった。
  - speaker: senpai
    emotion: normal
    text: 腸の中には、菌が山ほど住んでいるからな。
  - speaker: zundamon
    emotion: normal
    text: 体にいい菌も、悪い菌もいる。
  - speaker: zundamon
    emotion: happy
    text: いい菌を増やして悪い菌を抑えれば、病気になりにくい腸になるはずなのだ。
  - speaker: senpai
    emotion: thinking
    text: いい菌を、どうやって増やす。
  - speaker: zundamon
    emotion: happy
    text: 外から、口で飲めばいいのだ。
  - speaker: senpai
    emotion: normal
    text: 飲んだ菌は、胃で死ぬぞ。
  - speaker: zundamon
    emotion: surprised
    text: ……胃で？
  - speaker: senpai
    emotion: normal
    text: 胃液は、強い酸だ。ほとんどの菌は、あそこで死ぬ。
  - speaker: senpai
    emotion: thinking
    text: 運よく抜けても、次は胆汁が待っている。
  - speaker: zundamon
    emotion: sad
    text: ……飲ませた菌が、腸に着く前に全滅する。
  - speaker: senpai
    emotion: happy
    text: 菌を飲ませて病気を防ぐなんて、夢物語だよ。
  - speaker: zundamon
    emotion: thinking
    text: ……なら、胃液にも胆汁にも負けない菌を、探せばいいのだ。
  - speaker: senpai
    emotion: surprised
    text: 簡単に言うね。
- id: ch2_ikan
  title: ''
  background: sr_chou
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: つむぎ。胃液って、そんなに強い酸なのだ？
  - speaker: tsumugi
    emotion: normal
    text: 空腹のときの胃液は、pH1から2くらい。レモン汁より強い酸と言われてるわ。
  - speaker: zundamon
    emotion: surprised
    text: レモン汁より！？
  - speaker: tsumugi
    emotion: normal
    text: 食べ物についてきた菌を、ここでまとめて殺すのが、胃の仕事の一つなの。
  - speaker: zundamon
    emotion: thinking
    text: 悪い菌から、体を守ってるのだ。
  - speaker: tsumugi
    emotion: happy
    text: そう。でも、いい菌まで一緒に殺されちゃう。
  - speaker: zundamon
    emotion: sad
    text: 胃には、菌の見分けがつかないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 胃を抜けると、今度は胆汁がかかるわ。
  - speaker: zundamon
    emotion: thinking
    text: 胆汁って、何をする液なのだ？
  - speaker: tsumugi
    emotion: normal
    text: 脂を溶かす液よ。菌の体を包む膜も、脂でできてるの。
  - speaker: zundamon
    emotion: surprised
    text: 膜が、溶かされるのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 酸で弱らせて、そのあと膜を壊す。体の入り口は、[二段構え|にだんがまえ]なのよ。
  - speaker: zundamon
    emotion: thinking
    text: 菌にとっては、命がけの通り道なのだ。
  - speaker: tsumugi
    emotion: happy
    text: 代田さんは、その二つに勝つ菌を探し始めたの。
- id: ch3_baiyou
  title: 酸の中の選抜
  background: sr_baichi
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 代田稔, emotion: thinking}
  - {who: senpai, x: 0.7, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 代田は、自然の中から集めた多くの菌を強い酸の中で育て、生き残るものを選んでいきました。
    reading: しろたわ しぜんの なかから あつめた おおくの きんお つよい さんの なかで そだて、いきのこる ものお えらんで いきました。
  - speaker: senpai
    emotion: surprised
    text: '[代田|しろた]くん、まだいたのか。もう夜中だぞ。'
  - speaker: zundamon
    emotion: sad
    text: この皿も、全滅だ。
  - speaker: senpai
    emotion: thinking
    text: 酸を、また強くしたのか。
  - speaker: zundamon
    emotion: normal
    text: 弱い酸で生き残っても、胃の中では役に立たないのだ。
  - speaker: senpai
    emotion: normal
    text: これまで、何種類試したんだ。
  - speaker: zundamon
    emotion: thinking
    text: ……数えるのを、やめたのだ。
  - speaker: senpai
    emotion: happy
    text: 研究者の答えじゃないな。
  - speaker: zundamon
    emotion: normal
    text: 生き残ったのがいたら、それを育てて、また酸に入れるのだ。
  - speaker: senpai
    emotion: thinking
    text: 気の長い話だ。
  - speaker: zundamon
    emotion: normal
    text: 急いでも、菌は育たないのだ。
  - speaker: senpai
    emotion: normal
    text: 博士の論文は、どうした。
  - speaker: zundamon
    emotion: happy
    text: そっちも、ちゃんと書いてるぞ。
  - speaker: reimu
    text: 1930年に医学博士となりますが、その論文は乳酸菌ではなく、血清を使った検査の研究でした。
    reading: せんきゅうひゃく さんじゅうねんに いがく はかせと なりますが、その ろんぶんわ にゅうさんきんでわ なく けっせいお つかった けんさの けんきゅうでした。
- id: card1930
  title: ''
  background: sr_card_1930
  cuts:
  - speaker: reimu
    text: 1930年。胃液にも胆汁にも負けない乳酸菌の、強化培養に成功します。
    reading: せんきゅうひゃく さんじゅうねん。いえきにも たんじゅうにも まけない にゅうさんきんの きょうか ばいように せいこう します。
- id: ch3_seikou
  title: ''
  background: sr_baichi
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 代田稔, emotion: surprised}
  - {who: senpai, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: ……生きてる。
  - speaker: senpai
    emotion: thinking
    text: 何がだ。
  - speaker: zundamon
    emotion: surprised
    text: 胃液と同じくらいの酸に入れたのに、この菌だけ生きてるのだ！
    se: don
  - speaker: senpai
    emotion: surprised
    text: 本当か。胆汁のほうは。
  - speaker: zundamon
    emotion: happy
    text: そっちでも、残った！
  - speaker: senpai
    emotion: happy
    text: やったな、[代田|しろた]くん。
  - speaker: zundamon
    emotion: happy
    text: 乳酸菌だから、腸に着いたら、そこで乳酸を作るのだ。
  - speaker: senpai
    emotion: normal
    text: 夢物語と言ったのは、取り消すよ。
  - speaker: reimu
    text: 生きて腸まで届く乳酸菌の強化培養は、世界で初めてだったと言われています。
    reading: いきて ちょうまで とどく にゅうさんきんの きょうか ばいようわ、せかいで はじめてだったと いわれています。
    telops:
    - {text: "胃液にも胆汁にも負けない乳酸菌", size: lg, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: この年の暮れ、代田は講師になっています。
    reading: この としの くれ しろたわ こうしに なっています。
- id: ch4_nedan
  title: ''
  background: sr_kyoshitsu
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 代田稔, emotion: thinking}
  - {who: senpai, x: 0.7, emotion: happy}
  cuts:
  - speaker: senpai
    emotion: happy
    text: これで論文を書けば、君の名前は学界に残るぞ。
  - speaker: zundamon
    emotion: thinking
    text: 論文だけでは、村の子どもには届かないのだ。
  - speaker: senpai
    emotion: thinking
    text: なら、薬にして売るか。薬なら、高く売れる。
  - speaker: zundamon
    emotion: normal
    text: 高いと、[金|かね]のない家の子は買えないのだ。
  - speaker: senpai
    emotion: surprised
    text: じゃあ、どうするんだ。
  - speaker: zundamon
    emotion: happy
    text: 毎日飲める、安い飲み物にするのだ。
  - speaker: senpai
    emotion: thinking
    text: 大学の先生が、飲み物屋を始めるのか。
  - speaker: zundamon
    emotion: sad
    text: ……作り方も、売り方も、分からないのだ。
