meta:
  title: 【ヤクルトの誕生】胃液で死ぬ菌を、生きたまま腸に届けた医学者【ずんだもん解説】
  slug: yakult-shirota
  summary: 毎日飲む、あの小さな容器。中にいる乳酸菌は、どこにでもいる乳酸菌ではありません。口から飲んだ菌の多くは、胃液で死んでしまいます。それでも菌を届けたかったのが、長野の山あいで、腹の病気で死んでいく子どもたちを見て育った京都の医学者でした。大学の研究室から始まった菌は、どうやって毎日の1本になったのか。
  tags:
  - ヤクルト
  - 代田稔
  - 乳酸菌
  - シロタ株
  - ヤクルトレディ
  - 予防医学
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  thumbnail:
    top: 胃液に勝つ菌
    bottom: ヤクルトの誕生
  mode: drama
  narrator: reimu
  mobs:
  - id: chichi
    label: 父
    voice: 42
    pitch: 0.0
  - id: doukyu
    label: 同級生
