# funai-collapse 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 船井哲良 / label: 原田義昭・前田社長・管財人 ほか）とテロップ・章タイトルは表示専用なのでタグを付けていない。
# 2026-11-02 audio_query で確かめたこと:
# - 管財人 はひらがなのタグだと カンザイニ/ンガ に切れたので、カタカナのタグ [管財人|カンザイニン] にした。
# - 準自己破産 は語全体にタグを付けると ジュンジ/コハサン に切れた。[準|じゅん]自己破産 と頭だけタグにすると1語で読む。
# - 船井哲良記念講堂 は [船井哲良|…] だと フ/ナイテ/ツロオ に崩れたので、[船井|フナイ]哲良 と姓だけタグにした。
# - 今里 はタグなしだと イマサト と読まれる。カタカナのタグ [今里|イマザト] にした（ひらがなだと イ/マ/ザト に切れた）。
# - 津山 はセリフに入れると ツ/ヤマ に切れたので、セリフでは使わずナレだけに出している。
# - 簿外 は「[簿外|ぼがい]の手形」なら ボガイノ と1語で読むが、「また、[簿外|ぼがい]なのだ」は ボガ/イナ に切れたので、そこだけカタカナのタグ [簿外|ボガイ] にした。
# - 「この辺で」は コノアタリデ と読まれたので、本文で [辺|へん] を付けた（台帳には入れない）。
# - 「儲けられない」「儲からない」はタグなしで モウケ と読むので、台帳に入れていない。
# - 「未払い」はタグなしだと ミバライ と読まれたので、セリフでは「払われなかった給料」と言い換えた。
# - 何（なん）・金（かね）・何とか（なんとか）は文脈で読みが変わるので台帳に入れず、本文の該当箇所だけタグを付けた。
