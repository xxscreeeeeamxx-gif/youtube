scenes:
# ---- 先出し（1951年12月31日・大晦日の不渡手形） ----
- id: co_tegata
  title: ''
  background: fn_maker
  bgm: serious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 船井哲良, emotion: angry}
  - {who: shiire, x: 0.56, emotion: angry}
  - {who: maker, x: 0.8, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1951年の大晦日、大阪。24歳のミシン問屋が、月の売上の6倍の不渡手形をつかまされました。
    reading: せんきゅうひゃく ごじゅういちねんの おおみそか、おおさか。にじゅうよんさいの みしん どんやが、つきの うりあげの ろくばいの ふわたり てがたお つかまされました。
  - speaker: zundamon
    emotion: angry
    text: この手形、どうしてくれるんですか！
  - speaker: maker
    emotion: sad
    text: ……払えるお[金|かね]は、うちにはありません。
  - speaker: zundamon
    emotion: angry
    text: ほな倉庫の輸出前のミシンを、手形と同じ額だけもらいます！
  - speaker: maker
    emotion: sad
    text: ……持っていって、ください。
- id: co_soko
  title: ''
  background: fn_soko
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 船井哲良, emotion: angry}
  - {who: shiire, x: 0.7, emotion: surprised}
  cuts:
  - speaker: shiire
    emotion: surprised
    text: 船井さん、もう夜です。トラック屋は閉まってます！
  - speaker: zundamon
    emotion: angry
    text: 小さいトラックで、[何|なん]べんでも往復や！
  - speaker: zundamon
    emotion: sad
    background: fn_soko_kara
    text: ……元旦や。
    beat: true
  - speaker: reimu
    text: この男は、船井哲良。のちに船井電機をつくります。
    reading: この おとこわ、ふない てつろう。のちに ふないでんきお つくります。
# ---- 先出し（2024年10月24日・破産の日） ----
- id: co_hasan
  title: ''
  background: fn_setsumeikai
  stage:
  - {who: setsumei, x: 0.56, emotion: thinking}
  cuts:
  - speaker: reimu
    text: それから73年後の、2024年10月24日。
    reading: それから ななじゅうさんねんごの、にせん にじゅうよねん じゅうがつ にじゅうよっか。
  - speaker: setsumei
    emotion: thinking
    text: 破産です。給料は払えません。即時解雇です。
    se: don
  - speaker: reimu
    text: 社員約530人は、その日のうちに職を失いました。
    reading: しゃいん やく ごひゃく さんじゅうにんわ、その ひの うちに しょくお うしないました。
    telops:
    - {text: "社員 約530人、その日のうちに解雇", size: lg, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
# ---- 今の部屋（茶番と問い） ----
- id: hook
  title: ''
  background: fn_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ 中古屋でいちばん安いテレビを買ったのだ！
  - speaker: zundamon
    emotion: surprised
    text: ……あれ？ ソフト更新終了って出てる。
  - speaker: tsumugi
    emotion: thinking
    text: 作った会社が、2年前に破産してるのよ。
  - speaker: zundamon
    emotion: surprised
    text: 会社が、もう無いのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 人に騙されても人を騙す人間になるな。そう書き残した創業者よ。
  - speaker: tsumugi
    emotion: thinking
    text: その会社が死後7年で1円で人手に渡り、1日で消えたの。
    telops:
    - {text: "なぜ死後7年で、1円で渡り1日で消えた？", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: なんで、そうなったのだ！？
# ---- 1952年1月・三が日のパチンコ屋 ----
- id: ch1_pachinko
  title: 三が日のパチンコ屋
  background: fn_pachinko
  bgm: serious
  stage:
  - {who: zundamon, x: 0.4, flip: true, tag: 船井哲良, emotion: sad}
  cuts:
  - speaker: reimu
    text: 1952年の元日から3日間、船井はパチンコ屋で過ごします。
    reading: せんきゅうひゃく ごじゅうにねんの がんじつから みっかかん、ふないわ ぱちんこやで すごします。
  - speaker: reimu
    text: 手形は帳簿に載らない簿外のもので、120万円。
    reading: てがたわ ちょうぼに のらない ぼがいの もので、ひゃく にじゅうまんえん。
  - speaker: reimu
    text: 月の売上の6か月分、弁護士の初任給が1万円ほどの時代でした。
    reading: つきの うりあげの ろっかげつぶん、べんごしの しょにんきゅうが いちまんえんほどの じだいでした。
    telops:
    - {text: "不渡手形120万円＝月の売上の6か月分", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: sad
    text: 40歳で5つの会社の社長になるはずの自分が、わずか半年で倒産寸前に陥った。
  - speaker: zundamon
    emotion: angry
    text: ……なぜだ。
    beat: true
  - speaker: reimu
    text: 18歳の終戦の日に、40歳で5つの会社の社長になると決めた男でした。
    reading: じゅうはっさいの しゅうせんの ひに、よんじっさいで いつつの かいしゃの しゃちょうに なると きめた おとこでした。
# ---- 1952年・銀行が払う約束の紙 ----
- id: ch1_shokai
  title: 銀行が払う約束の紙
  background: fn_shokai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 船井哲良, emotion: thinking}
  - {who: tenin, x: 0.7, emotion: thinking}
  cuts:
  - speaker: tenin
    emotion: thinking
    text: 社長、正月からずっと黙ってはりますね。
  - speaker: zundamon
    emotion: thinking
    text: 失敗の原因を、ずっと考えとったんや。
  - speaker: zundamon
    emotion: normal
    text: 国内の問屋に売ったら、代金は手形でもらう。
  - speaker: zundamon
    emotion: angry
    text: 相手がつぶれたら、その手形は紙切れや。
  - speaker: zundamon
    emotion: happy
    text: せやから、輸出や！
    se: hirameki
  - speaker: tenin
    emotion: surprised
    text: ゆ、輸出！？ うちは4人しかおらんのに！？
  - speaker: zundamon
    emotion: normal
    text: 輸出には、[信用状|しんようじょう]いうもんがある。
  - speaker: tenin
    emotion: thinking
    text: しんよう、じょう？
  - speaker: zundamon
    emotion: normal
    text: 買う側の銀行が、代金を払うと約束してくれる紙や。
  - speaker: zundamon
    emotion: happy
    text: 店がつぶれても、銀行が代わりに払ってくれる約束の紙やな。
  - speaker: tenin
    emotion: surprised
    text: ほな、取りっぱぐれがない……！
  - speaker: zundamon
    emotion: happy
    text: 代金は、100パーセント回収できる。
  - speaker: zundamon
    emotion: angry
    text: これからは、輸出が中心や！
    beat: true
  - speaker: reimu
    text: 1952年、店は輸出を始めます。逃げずに払った誠意は口コミで広がり、信用はむしろ高まりました。
    reading: せんきゅうひゃく ごじゅうにねん、みせわ ゆしゅつお はじめます。にげずに はらった せいいわ くちこみで ひろがり、しんようわ むしろ たかまりました。
  - speaker: reimu
    text: 本人はのちに、この経験からこう書いています。人に騙されても人を騙す人間になるな。
    reading: ほんにんわ のちに、この けいけんから こう かいて います。ひとに だまされても ひとお だます にんげんに なるな。
    telops:
    - {text: "船井「人に騙されても人を騙す人間になるな」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: reimu
    text: 海外の大口の客に作って納める。この形が60年後、たった1社に売上の半分を買ってもらう会社になります。
    reading: かいがいの おおぐちの きゃくに つくって おさめる。この かたちが ろくじゅうねんご、たった いっしゃに うりあげの はんぶんお かって もらう かいしゃに なります。
# ---- 1955〜1959年・何もせずに入る毎月100万円 ----
- id: card1955
  title: ''
  background: fn_card_1955
  cuts:
  - speaker: reimu
    text: 1955年。アメリカへのミシンの輸出には、数の枠が設けられていました。
    reading: せんきゅうひゃく ごじゅうごねん。あめりかえの みしんの ゆしゅつにわ、かずの わくが もうけられて いました。
- id: ch2_premium
  title: 毎月100万円を捨てる
  background: fn_shokai
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 船井哲良, emotion: happy}
  - {who: tenin, x: 0.7, emotion: happy}
  cuts:
  - speaker: tenin
    emotion: happy
    text: 社長！ 今月も、枠を譲ったお[金|かね]が100万円近く入りました！
  - speaker: zundamon
    emotion: happy
    text: 何もせんでも、毎月100万円か。
  - speaker: zundamon
    emotion: thinking
    text: ……これでいいのか。何かがおかしい。
  - speaker: tenin
    emotion: surprised
    text: お[金|かね]が入って、おかしいんですか！？
  - speaker: zundamon
    emotion: thinking
    text: 何もせずにお[金|かね]だけ入るが、ほんとうにこれでいいのか。
  - speaker: zundamon
    emotion: happy
    text: ミシンに代わって、何か新しいことをやろう。
  - speaker: tenin
    emotion: thinking
    text: 新しいことって、[何|なん]です？
  - speaker: zundamon
    emotion: happy
    text: ラジオや。ラジオは落としたら壊れる。壊れたら、また買う。
  - speaker: tenin
    emotion: surprised
    text: 壊れる前提で、売るんですか！？
  - speaker: zundamon
    emotion: happy
    text: まずは、社名からミシンを外すで。
  - speaker: tenin
    emotion: surprised
    text: まだラジオ、1台も作ってないのに！？
    se: tsukkomi
  - speaker: zundamon
    emotion: happy
    text: 名前が先や。[船井軽機工業|ふないけいきこうぎょう]や！
  - speaker: tenin
    emotion: thinking
    text: ……看板だけ、先に未来へ行ってしもた。
    beat: true
  - speaker: reimu
    text: 1959年、店は船井軽機工業に。毎月100万円を捨てた男の会社は、65年後に1円で人手に渡ります。
    reading: せんきゅうひゃく ごじゅうくねん、みせわ ふない けいき こうぎょうに。まいつき ひゃくまんえんお すてた おとこの かいしゃわ、ろくじゅうごねんごに いちえんで ひとでに わたります。
# ---- 1959年・5時間の座り込み ----
- id: ch2_suwarikomi
  title: 5時間の座り込み
  background: fn_buhin
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 船井哲良, emotion: normal}
  - {who: kacho, x: 0.7, emotion: normal}
  cuts:
  - speaker: kacho
    emotion: normal
    text: 船井軽機さん、でしたか。うちのバリコンが欲しいと。
  - speaker: zundamon
    emotion: normal
    text: ラジオを作るには、どうしても要る部品なんです。
  - speaker: kacho
    emotion: normal
    text: 今日は、お引き取りください。
  - speaker: zundamon
    emotion: normal
    text: 前金を持ってきました。売ってもらえるまで、ここで待たせてもらいます。
  - speaker: kacho
    emotion: surprised
    text: 待つ！？ ……ご自由に。
  - speaker: zundamon
    emotion: happy
    text: 課長は野球、どこを応援してはります？
  - speaker: kacho
    emotion: thinking
    text: ……仕事中です。
  - speaker: zundamon
    emotion: happy
    text: ほな、相撲は？ 今場所は、誰が勝つと思います？
  - speaker: kacho
    emotion: angry
    text: ……仕事中です！
  - speaker: zundamon
    emotion: happy
    text: ほな、もう一回野球の話に戻りますけど。
  - speaker: kacho
    emotion: angry
    text: 戻らなくていいです！
    se: zukko
  - speaker: kacho
    emotion: sad
    background: fn_buhin_osoi
    text: ……まだ、いらしたんですか。もう6時ですよ。
  - speaker: zundamon
    emotion: normal
    text: 1時から、5時間ですね。
  - speaker: kacho
    emotion: sad
    text: 私も、そろそろ帰りたいんですが。
  - speaker: zundamon
    emotion: normal
    text: 私も、売ってもらえたら帰ります。
  - speaker: zundamon
    emotion: angry
    text: 我々は将来、月産10万台のラジオを作る会社になる。
  - speaker: zundamon
    emotion: angry
    text: バリコンも大量に仕入れるようになるから、[何とか|なんとか]売ってほしい。
  - speaker: kacho
    emotion: surprised
    text: 月産10万台！？ まだ1台も作っていない会社が！？
  - speaker: kacho
    emotion: sad
    text: ……[梃子|てこ]でも動かない人ですね。負けました。
  - speaker: kacho
    emotion: sad
    text: 500個分の前金、お預かりします。
  - speaker: reimu
    text: 船井電機で社長が初めて代わるのは、この49年後のことです。
    reading: ふないでんきで しゃちょうが はじめて かわるのわ、この よんじゅうきゅうねんごの ことです。
# ---- 1959年5月・ラジオ第1号 ----
- id: ch2_radio
  title: ラジオ第1号
  background: fn_radio
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 船井哲良, emotion: happy}
  - {who: shain, x: 0.7, emotion: happy}
  cuts:
  - speaker: shain
    emotion: happy
    text: 社長、[今里|イマザト]の工場で鳴りました！ ラジオの第1号です！
    se: jaan
  - speaker: zundamon
    emotion: happy
    text: よし。次は、月産10万台や。
  - speaker: shain
    emotion: surprised
    text: いきなり10万台！？ 今日、1台できたとこですよ！？
    beat: true
  - speaker: reimu
    text: 1959年5月、ラジオ第1号。それから65年後、船井電機はたった1日で消えます。
    reading: せんきゅうひゃく ごじゅうくねん ごがつ、らじお だいいちごう。それから ろくじゅうごねんご、ふないでんきわ たった いちにちで きえます。
# ---- 1960〜1961年・沖縄の奇策と船井電機の誕生 ----
- id: card1960
  title: ''
  background: fn_card_1960
  cuts:
  - speaker: reimu
    text: 1960年4月。今度は、アメリカ向けのラジオの輸出にも枠ができます。
    reading: せんきゅうひゃく ろくじゅうねん しがつ。こんどわ、あめりかむけの らじおの ゆしゅつにも わくが できます。
- id: ch2_okinawa
  title: 沖縄の奇策
  background: fn_okinawa
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 船井哲良, emotion: thinking}
  - {who: shain, x: 0.7, emotion: sad}
  cuts:
  - speaker: shain
    emotion: sad
