# ---- 論争1 ----
- id: ronso1
  title: 300億円はどこへ？
  background: fn_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ 300億円が消えて潰れた、って！
  - speaker: tsumugi
    emotion: normal
    text: そこは、誰が言ってるかを分けて聞いてね。
  - speaker: tsumugi
    emotion: normal
    text: テレビの報道では、破産の申立書に約300億円が流れ出たとあるそうよ。
  - speaker: tsumugi
    emotion: normal
    text: '[管財人|カンザイニン]も、300億円規模の資金流出があった可能性を指摘してるわ。'
  - speaker: zundamon
    emotion: surprised
    text: やっぱり、300億円が消えたのだ！？
  - speaker: tsumugi
    emotion: thinking
    text: 消えた、とはまだ言えないの。
    se: hammer
  - speaker: tsumugi
    emotion: normal
    text: '[管財人|カンザイニン]の話も、外に出た可能性があるというところまでよ。'
  - speaker: tsumugi
    emotion: normal
    text: その多くは、関係会社への貸し付けだと書く記事もあるわ。
  - speaker: zundamon
    emotion: surprised
    text: 貸し付け？
  - speaker: tsumugi
    emotion: normal
    text: 船井電機は、破産した親会社に約260億円の債権を届け出ているの。
  - speaker: zundamon
    emotion: thinking
    text: 消えたのと、貸して戻らないのは違うの？
  - speaker: tsumugi
    emotion: normal
    text: 違うわ。それに、裁判所の判断はまだ出ていないの。
  - speaker: tsumugi
    emotion: normal
    text: '[管財人|カンザイニン]が訴えたのは、2億460万円の報酬の件。'
  - speaker: zundamon
    emotion: surprised
    text: 300億円じゃなくて、2億円！？
  - speaker: tsumugi
    emotion: normal
    text: 元社長側は、不正な支出ではないと反論してるわ。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、潰れたのは誰のせいなのだ？
  - speaker: tsumugi
    emotion: thinking
    text: 本業のテレビは、創業者が生きてたころから赤字が続いてたの。
  - speaker: tsumugi
    emotion: normal
    text: 経済誌の集計では2008年3月期からの16年で、最終赤字は合わせて約1100億円。
  - speaker: zundamon
    emotion: surprised
    text: 300億円の話より、ずっと前から……。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: '[管財人|カンザイニン]はこう主張して、元社長はこう反論してる。判決は、まだ出ていないの。'
