meta:
  title: 「人を騙す人間になるな」と書き残した船井電機の創業者、死後に会社は1円で人手に渡り即日破産【ずんだもん解説】
  slug: funai-collapse
  hook_line: 「騙す人間になるな」と書いた創業者の会社は、なぜ死後7年で1日で消えたのか。
  summary: 1951年の大晦日、大阪。24歳のミシン問屋、船井哲良は、月の売上の6倍の不渡手形をつかまされます。そこから選んだのは、国内で売らず、海外の大口の客に作って納める道でした。自分の名前を出さない「黒子」として、アメリカの大きな店にテレビやビデオを送り出した会社は、なぜ創業者の死から7年で消えたのか。会社の記録と本人の言葉、裁判所の判断と当事者の言い分を主語つきで並べて、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 船井電機 有価証券報告書 第63期（2015年3月期） https://disclosure2dl.edinet-fsa.go.jp/searchdocument/pdf/S1005213.pdf
  - 日本経済新聞「『偉大なる黒子』船井電機築く　船井哲良氏死去」（2017年7月5日） https://www.nikkei.com/article/DGXLASDZ05HF5_V00C17A7000000/
  - 日本経済新聞「船井電機、出版会社からTOB　経営立て直し目指す」（2021年3月23日） https://www.nikkei.com/article/DGXZQOHD230O70T20C21A3000000/
  - 東京商工リサーチ「特報・船井電機にふたつの『代表印』、臨時株主総会の開催に疑義」（2025年1月17日） https://www.tsr-net.co.jp/data/detail/1200865_1527.html
  - 東京商工リサーチ「船井電機の債権者集会、異例の会社側「出席者ゼロ」、原田義昭氏は入場拒否」（2025年7月2日） https://www.tsr-net.co.jp/data/detail/1201524_1527.html
  - 東京商工リサーチ「【債権者集会詳細】船井電機の管財人、元代表への損害賠償請求を公表」（2026年6月11日） https://www.tsr-net.co.jp/data/detail/1202945_1527.html
