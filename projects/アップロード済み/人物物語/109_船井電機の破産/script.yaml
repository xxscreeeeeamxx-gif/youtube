  - speaker: tsumugi
    emotion: normal
    text: 2025年7月には、制度が濫用されなかったかを調べる有識者会議も作ったの。
  - speaker: zundamon
    emotion: normal
    text: じゃあ、[原田|はらだ]さんが正しいのだ？
  - speaker: tsumugi
    emotion: thinking
    text: 裁判所は、そう判断しなかったの。
  - speaker: tsumugi
    emotion: normal
    text: 高裁は臨時株主総会が開かれたと認めがたいとして、訴えを退けた。
  - speaker: zundamon
    emotion: surprised
    text: 総会が、開かれてない……？
  - speaker: tsumugi
    emotion: normal
    text: '[原田|はらだ]氏が取締役に選ばれたとされる総会よ。'
  - speaker: tsumugi
    emotion: normal
    text: 解任の書類も、日付を遡らせて作られた疑いがあるとされたの。
  - speaker: tsumugi
    emotion: normal
    text: '[管財人|カンザイニン]の意見では、申し立ての日の現預金は約5億4000万円。'
  - speaker: tsumugi
    emotion: thinking
    text: 払うべきお[金|かね]は、約44億円あったの。
  - speaker: zundamon
    emotion: surprised
    text: 財布の8倍の請求書なのだ……。
    se: shobon
  - speaker: tsumugi
    emotion: normal
    text: 裁判所は破産を認めて、異議は退けられた。
  - speaker: tsumugi
    emotion: normal
    text: '[原田|はらだ]氏は、その後も手続きに疑問を唱えてきたわ。'
# ---- 論争3 ----
- id: ronso3
  title: 創業者のワンマンのせい？
  background: fn_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 結局、創業者が後継ぎを育てなかったのが悪いのだ？
  - speaker: tsumugi
    emotion: normal
    text: そう言われる面はあるわ。
  - speaker: tsumugi
    emotion: normal
    text: 外から招いた後継ぎの話は、2年ほどで消えたとされる。
  - speaker: tsumugi
    emotion: normal
    text: 87歳で代表権を取り戻して、16年で社長の交代は7回。
  - speaker: zundamon
    emotion: sad
    text: やっぱり、ワンマンなのだ……。
  - speaker: tsumugi
    emotion: thinking
    text: でも液晶テレビは、パナソニックやシャープでさえ撤退や縮小に追い込まれた市場よ。
  - speaker: tsumugi
    emotion: normal
    text: ウォルマートで売上の半分というのも、もうけの源だったの。
  - speaker: zundamon
    emotion: thinking
    text: 半分は、強みでもあったんだ。
    se: hirameki
  - speaker: tsumugi
    emotion: normal
    text: それに創業者は2016年に相談役に退いて、2017年に亡くなってる。
  - speaker: tsumugi
    emotion: thinking
    text: TOBもサロンも1円も破産も、全部亡くなったあとの話よ。
  - speaker: zundamon
    emotion: surprised
    text: 全部、亡くなったあと！？
  - speaker: tsumugi
    emotion: normal
    text: 語録には、こうあるの。社員の知恵を集め、最後は経営者が判断する。
  - speaker: tsumugi
    emotion: normal
    text: その最後の判断を、47年も続けてきたのが創業者だったの。
  - speaker: tsumugi
    emotion: thinking
    text: 創業者のつくった仕組みが強すぎて、創業者のあとに舵を切れる[人|ひと]がいなかった。
  - speaker: tsumugi
    emotion: normal
    text: そう見るのが、近いと思うわ。
  - speaker: zundamon
    emotion: thinking
    text: 強すぎる仕組み、なのだ……。
# ---- 本当の注意点 ----
- id: chui
  title: メーカーが消えたら
  background: fn_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: sad}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、ずんだもんのテレビよ。
  - speaker: zundamon
    emotion: sad
    text: ソフト更新、終わってたのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 2024年12月6日に、スマホとの連携とソフトの更新が終わったの。
  - speaker: zundamon
    emotion: surprised
    text: 破産から、1か月半で！？
  - speaker: zundamon
    emotion: thinking
    text: 修理は、どうなるの？
  - speaker: tsumugi
    emotion: normal
    text: 破産のあとのお知らせでは、修理は部品の在庫が続く限り続けるとされたわ。
  - speaker: zundamon
    emotion: thinking
    text: 部品があるうちは、直せるんだ。
  - speaker: tsumugi
    emotion: thinking
    text: でもメーカーがつぶれると、修理や更新が止まることはあるの。
  - speaker: tsumugi
    emotion: normal
    text: 家電を買うときは、どこが修理するかも見ておいてね。
  - speaker: zundamon
    emotion: normal
    text: 店の延長保証に入っておけば、安心なのだ？
  - speaker: tsumugi
    emotion: normal
    text: 店ごとに中身が違うから、メーカーがなくなったときの扱いを確かめてね。
  - speaker: tsumugi
    emotion: normal
    text: もう1つ。給料日の前の日に、会社がなくなることもあるの。
  - speaker: zundamon
    emotion: surprised
    text: 船井電機の人たちは、給料をもらえたのだ？
  - speaker: tsumugi
    emotion: normal
    text: 払われなかった給料が全額届いたのは、約8か月後よ。
  - speaker: zundamon
    emotion: surprised
    text: 8か月も……！
  - speaker: tsumugi
    emotion: normal
    text: 国には、払われなかった給料を立て替えて払う制度があるの。
  - speaker: tsumugi
    emotion: normal
    text: 会社が倒産して、給料が払われないまま辞めた人が対象よ。
  - speaker: tsumugi
    emotion: normal
    text: 払われなかった給料と退職金の8割を、年齢ごとの上限まで立て替えてくれるわ。
  - speaker: tsumugi
    emotion: normal
    text: 相談の窓口は、近くの労働基準監督署よ。
  - speaker: zundamon
    emotion: normal
    text: 覚えておく！
  - speaker: tsumugi
    emotion: normal
    text: 最後に、1社に売上の半分。これは家計でも同じよ。
  - speaker: zundamon
    emotion: surprised
    text: 家計でも？
  - speaker: tsumugi
    emotion: normal
    text: 収入の柱が1本だけだと、それが止まった日に全部止まるの。
  - speaker: zundamon
    emotion: happy
    text: ボクの収入の柱は、お小遣い1本なのだ！
    se: manuke
  - speaker: tsumugi
    emotion: thinking
    text: それは柱じゃなくて、つまようじね。
    beat: true
# ---- 現代の章 ----
- id: gendai
  title: いまのFUNAI
  background: fn_gendai
  bgm: haru_kitchen
