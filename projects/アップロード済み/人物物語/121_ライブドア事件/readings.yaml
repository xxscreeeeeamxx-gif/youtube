# livedoor-horie 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けた。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 堀江貴文 / label: 宮内亮治・亀渕昭信・日枝久・平松社長 ほか）・テロップ・章タイトル・meta は表示専用なのでタグを付けていない。
#
# 2026-11-14 執筆時に VOICEVOX の audio_query（ずんだもん 3）にかけた結果:
# - 想定の範囲内 はタグなしで ソオテエノ/ハンイナイノ と正しく読む。カタカナのタグ [想定の範囲内|ソウテイノハンイナイ] は
#   ソオ/テイ/ノ と切れたので、セリフのタグを外し、この台帳からも外した（ナレは reading: で そうていの はんいない）。
#   「良い方」もタグなしで ヨイ/ホオデ と読むのでタグを付けていない。
# - 新株予約権（シンカブヨヤクケン）・証券取引等監視委員会（ショオケントリヒキトオ/カンシイインカイ）・太洋物産（タイヨオブッサン）も
#   タグなしで正しく読み、ひらがなのタグを付けると抑揚が途中で切れた（シンカ/ブヨヤ/クケン、…トオカン/シイイ/ンカイ、タイヨウ）。
#   どれもタグを外し、この台帳から外した。
# - 1切れ はタグなしで ヒトキレ と読む（タグなし）。
# - 一審 はタグなしだと イチシン と誤読する。共通台帳どおり [一審|いっしん] にした。
# - 懲役2年6月 はタグなしだと ロクガツ。セリフは [懲役2年6月|ちょうえきにねんろっかげつ]、ナレは reading で ろっかげつ。
# - 10－30億円 はタグなしだと イチゼロ/サンゼロ。[10－30億円|じゅうからさんじゅうおくえん] にした。
# - 株式交換比率（１対１） はタグなしだと イチ/タイイチ と切れる。[株式交換|かぶしきこうかん]比率[（１対１）|（いちたいいち）] にした。
# - 市場 は文脈で イチバ に化けやすいので [市場|しじょう] にした（文脈で読みが変わるので台帳には入れていない）。
# - 「主導はしてないけど、真ん中にはいた」が マンナカニ/ハイタ（は が動詞に化けた）、「いちばん上が」が イチバンジョオガ と読まれたので、
#   本文を「真ん中にいた」「上に立つ人が」に直した。
# - 英字（LDM・TOB・GO TO JAIL・livedoor）は text に書いていない（ライブドアマーケティング・公開買い付け・ゴー・トゥー・ジェイル・ライブドア）。
