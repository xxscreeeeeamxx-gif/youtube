# ---- 論争：目立ったから捕まった？ ----
- id: ronso1
  title: 目立ったから捕まった？
  background: ld_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 28キロ以上やせて、出てきたのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 裁判では一貫して、無罪を訴えていたわ。
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ 目立ちすぎたから、出る杭は打たれたって！
  - speaker: tsumugi
    emotion: normal
    text: そう言われる理由はあるの。
  - speaker: tsumugi
    emotion: normal
    text: '[証券取引法|しょうけんとりひきほう]の違反だけで実刑になったのは、極めて異例と報じられたわ。'
  - speaker: tsumugi
    emotion: thinking
    text: 本人も2011年に、検察が来て捜査をして初めて事件になったと言ってるの。
  - speaker: zundamon
    emotion: happy
    text: やっぱりなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: でも[一審|いっしん]も二審も最高裁も、同じ結論を出したの。
  - speaker: tsumugi
    emotion: normal
    text: 最高裁は、5人の裁判官の全員一致よ。
  - speaker: zundamon
    emotion: thinking
    text: 3回とも、同じ答え……。
  - speaker: tsumugi
    emotion: normal
    text: 元幹部たちも公判で、起訴された事実を大筋で認めてるわ。
  - speaker: zundamon
    emotion: sad
    text: 目立ったから、だけじゃないのか……。
# ---- 論争：全部、社長の指示？ ----
- id: ronso2
  title: 全部、社長の指示？
  background: ld_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: じゃあ、[堀江|ほりえ]が全部仕組んだ黒幕なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: それも違うの。
    se: hammer
  - speaker: tsumugi
    emotion: normal
    text: 判決の要旨は、ほとんどの罪で主導したとまでは認められないとしてるわ。
  - speaker: zundamon
    emotion: surprised
    text: なら、部下が勝手にやったのだ！
  - speaker: tsumugi
    emotion: thinking
    text: それも言い過ぎ。社長として了承して、中心的な役割を担ったと認めてるの。
  - speaker: tsumugi
    emotion: normal
    text: 主導はしていないと、判決は認めた。それでも、了承した社長がいちばん重い刑になったの。
  - speaker: zundamon
    emotion: thinking
    text: 上に立つ人が、いちばん重い……。
    beat: true
  - speaker: tsumugi
    emotion: thinking
    text: 二審は、こうも言ったわ。
  - speaker: tsumugi
    emotion: normal
    text: 結果的に本件犯行による利益を受けており、量刑上無視できない。
  - speaker: tsumugi
    emotion: thinking
    text: 社長は、持っていた自分の会社の株を売って利益を得ていたの。
# ---- 論争：お金で買えないもの？ ----
- id: ronso3
  title: お金で買えないもの？
  background: ld_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: お[金|かね]で買えないものはないって、言った人でしょ！
  - speaker: tsumugi
    emotion: thinking
    text: この言葉を本人が言ったという記録は、実ははっきりしないの。
  - speaker: zundamon
    emotion: sad
    text: 出どころが、はっきりしないのか……。
    se: tenten
# ---- 本当の注意点 ----
- id: chui
  title: 利益の中身を見る
  background: ld_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 1つめは、利益の中身を見ること。
  - speaker: tsumugi
    emotion: thinking
    text: 黒字50億円は、自分の会社の株を売ったお[金|かね]と架空の売上でできてたわ。
  - speaker: zundamon
    emotion: thinking
    text: ゲーム機を売って、バイト代と書いたのと同じなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 黒字なら、本業で稼いだお[金|かね]かどうかを分けて見るの。
  - speaker: tsumugi
    emotion: normal
    text: 2つめ。株を細かく切っても、会社の値打ちは増えない。
  - speaker: zundamon
    emotion: sad
    text: ピザは、1枚のままなのだ……。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 安く買えることと得をすることは、別の話よ。
  - speaker: tsumugi
    emotion: normal
    text: 3つめ。株主の多い有名な会社でも、止まるときは早いの。
  - speaker: tsumugi
    emotion: thinking
    text: 22万人の株主がいた会社でも、捜索の2日後には取引所ごと止まったわ。
  - speaker: zundamon
    emotion: surprised
    text: 取引所ごと……。
  - speaker: tsumugi
    emotion: normal
    text: 売った人と持ち続けた人と訴えた人で、結末も分かれたの。
  - speaker: zundamon
    emotion: thinking
    text: 訴えた人は？
  - speaker: tsumugi
    emotion: normal
    text: 裁判で、1株あたり200円から585円の損害が認められたわ。
  - speaker: tsumugi
    emotion: normal
    text: 本人も、[仮釈放|かりしゃくほう]の日にこう言ってたわ。
  - speaker: tsumugi
    emotion: normal
    text: 株に対しては、のめり込まないようにしてくださいって。
  - speaker: zundamon
    emotion: normal
    text: '[仮釈放|かりしゃくほう]の日の、言葉なんだね……。'
# ---- 現代 ----
- id: card2026
  title: ''
  background: ld_card_2026
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 2026年。夜明けの会見から、20年がたちました。
    reading: にせん にじゅうろくねん。よあけの かいけんから、にじゅうねんが たちました。
- id: ima
  title: 20年後
  background: ld_gendai
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: あの社長は、いま何をしてるの？
  - speaker: tsumugi
    emotion: normal
    text: 2026年6月、食料品の輸入などをする上場会社の取締役に選ばれたわ。
  - speaker: tsumugi
    emotion: normal
    text: 太洋物産という会社よ。
  - speaker: tsumugi
    emotion: normal
    text: 上場企業の取締役は2006年1月以来、20年ぶりと報じられたの。
  - speaker: zundamon
    emotion: surprised
    text: 20年ぶりに、戻ってきたのだ！？
    se: bikkuri
  - speaker: tsumugi
    emotion: normal
    text: 9月には、業務を受け持つ取締役になったと報じられたわ。
  - speaker: tsumugi
    emotion: thinking
    text: その会社は7月に宅配ピザの会社を買って、9月に売っているの。
  - speaker: zundamon
    emotion: surprised
    text: 本物のピザの話なの！？
  - speaker: tsumugi
    emotion: normal
    text: 創業にかかわったロケットの会社は、初号機の打ち上げを目標にしてるわ。
  - speaker: zundamon
    emotion: happy
    text: ロケットまで！
  - speaker: zundamon
    emotion: thinking
    text: 事件のライブドアは？
  - speaker: tsumugi
    emotion: thinking
    text: 2012年に清算が終わって、もう無いの。
  - speaker: tsumugi
    emotion: normal
    text: でもライブドアの名前は、別の会社のニュースとブログにいまも残ってる。
  - speaker: zundamon
    emotion: normal
    text: 名前は、残ったんだ。
  - speaker: tsumugi
    emotion: normal
    text: 当時のニッポン放送の社長も、2026年4月にあの攻防の本を出したわ。
  - speaker: tsumugi
    emotion: normal
    text: 決まりも変わったの。時間外の取引の一部も、公開買い付けの決まりの対象になった。
  - speaker: tsumugi
    emotion: normal
    text: 取引所も、大きな[株式分割|かぶしきぶんかつ]は控えるよう求めたわ。
  - speaker: zundamon
    emotion: thinking
    text: ピザの切りすぎも、禁止なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 禁止じゃなくて、控えてねというお願いよ。
# ---- 締め ----
