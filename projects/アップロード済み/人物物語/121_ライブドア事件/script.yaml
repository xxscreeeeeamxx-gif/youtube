meta:
  title: 「想定の範囲内の良い方でおさまった」と言ったライブドアの社長、9か月後に逮捕された【ずんだもん解説】
  slug: livedoor-horie
  hook_line: 時価総額7300億円の会社は、なぜ3か月で上場廃止になったのか。
  summary: 2005年4月、フジテレビとの和解の会見で、ライブドアの社長・堀江貴文は「想定の範囲内の良い方でおさまった」と語りました。1株を100株に切って増えた株主、すでに買ってあった出版社を株式交換で子会社にするという発表、そして自分の会社の株を売ったお金を入れた「売上」。時価総額7300億円の会社は、なぜ強制捜査から3か月で上場廃止になったのか。証券取引等監視委員会と金融庁の資料、判決、本人の会見の言葉をもとに、判決が認めた範囲と本人の主張を並べて、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 証券取引等監視委員会「証券取引等監視委員会の活動状況」（2006年8月） https://www.fsa.go.jp/sesc/reports/n_17/n_17b.pdf
  - 金融庁「ライブドアに関して報道されている問題点と証券会社に期待される役割」（2006年3月27日の審議会資料） https://www.fsa.go.jp/singi/mdth_kon/siryou/20060327/03-2.pdf
  - INTERNET Watch「本誌記事で振り返る「ライブドア事件」」（2006年12月19日） https://internet.watch.impress.co.jp/static/index/2006/12/19/
  - ITmedia NEWS「堀江社長、提携は「想定の範囲内の良い方」」（2005年4月18日） https://www.itmedia.co.jp/news/articles/0504/18/news071.html
  - ITmedia NEWS「堀江被告に懲役2年6カ月の実刑判決」（2007年3月16日） https://www.itmedia.co.jp/news/articles/0703/16/news040.html
  - 日本経済新聞「堀江被告の実刑確定へ ライブドア事件」（2011年4月26日） https://www.nikkei.com/article/DGXNASDG2601U_W1A420C1000000/
