    text: 東証の説明は、こうでした。「約定件数が400万件を超える場合には、システム処理の継続に支障が生じる」
    reading: とうしょうの せつめいわ こうでした。やくじょう けんすうが よんひゃくまんけんお こえる ばあいにわ、しすてむ しょりの けいぞくに ししょうが しょうじる。
  - speaker: shokuin
