scenes:
# ---- 先出し（2006年1月17日、午前7時前。捜索が明けた朝、約5分の会見） ----
- id: co_yoake
  title: ''
  background: ld_tower_yoake
  bgm: serious
  cuts:
  - speaker: reimu
    text: 2006年1月17日、午前7時前。東京・六本木のライブドア本社。
    reading: にせん ろくねん いちがつ じゅうしちにち ごぜん しちじまえ。とうきょう ろっぽんぎの らいぶどあ ほんしゃ。
  - speaker: reimu
    text: 社長の堀江貴文、33歳。夜通しの家宅捜索が終わった朝の会見です。
    reading: しゃちょうの ほりえ たかふみ さんじゅうさんさい。よどおしの かたく そうさくが おわった あさの かいけんです。
- id: co_kaiken
  title: ''
  background: ld_kaiken
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 堀江貴文, emotion: normal}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: 全容把握に向けて社内で調査中。解明次第、報告したい
  - speaker: kisha
    emotion: normal
    text: 進退は？
  - speaker: zundamon
    emotion: normal
    text: 状況が把握できていない状態で述べるのは無責任になる
  - speaker: reimu
    text: 翌日、東京証券取引所は、すべての株の売買を止めます。6日後、彼は逮捕されます。
    reading: よくじつ とうきょう しょうけん とりひきじょわ すべての かぶの ばいばいお とめます。むいかご、かれわ たいほ されます。
# ---- 今の部屋（100切れのピザ） ----
- id: hook
  title: ''
  background: ld_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: ピザを100切れに切ったのだ！ 1切れ10円なら、みんな買うのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 全部売っても1000円。ピザは1枚のままよ。
    se: hammer
  - speaker: zundamon
    emotion: normal
    text: でも安く見えるから、行列ができるのだ。
  - speaker: tsumugi
    emotion: normal
    text: それを本当にやった会社があるの。株を細かく切って、株主は22万人。
  - speaker: tsumugi
    emotion: thinking
    text: 時価総額7300億円の会社が、3か月で上場廃止。
    telops:
    - {text: "7300億円の会社が なぜ3か月で上場廃止？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 7300億円が、なんで3か月で！？
# ---- 1996〜2000年（ナレ1行） ----
- id: card1996
  title: ''
  background: ld_card_1996
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1996年、東大生の堀江は、23歳でホームページを作る会社を起こします。2000年、27歳で上場。
    reading: せんきゅうひゃく きゅうじゅうろくねん、とうだいせいの ほりえわ にじゅうさんさいで ほーむぺーじお つくる かいしゃお おこします。にせんねん にじゅうななさいで じょうじょう。
# ---- 2004年1〜2月・株を100に切る ----
- id: card2004
  title: ''
  background: ld_card_2004
  cuts:
  - speaker: reimu
    text: 2004年。2月にライブドアと名前を変えた会社は、1株を100株に分けます。
    reading: にせん よねん。にがつに らいぶどあと なまえお かえた かいしゃわ、ひとかぶお ひゃっかぶに わけます。
- id: ch1_kabu
  title: 株を100に切る
  background: ld_gamen
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 堀江貴文, emotion: happy}
  - {who: shain, x: 0.7, emotion: happy}
  cuts:
  - speaker: shain
    emotion: happy
    text: 社長！ うちの株、今日もストップ高です！
  - speaker: shain
    emotion: surprised
    text: 1月から数えて、これで15日続けてです！
    background: ld_gamen_aka
    se: bikkuri
    telops:
    - {text: "15日連続ストップ高", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: shain
    emotion: normal
    text: 新しい株が出回るまで、50日ほどかかるそうで。
  - speaker: shain
    emotion: happy
    text: それまでは品薄で、値段が乱高下するんです。
  - speaker: shain
    emotion: happy
    text: 1株が安くなって、買いやすいって評判ですよ。
  - speaker: reimu
    text: 上場の直前から5回、合わせて36万分割。市場からは、株式市場をおもちゃにしている、と批判も出ます。
    reading: じょうじょうの ちょくぜんから ごかい、あわせて さんじゅうろくまん ぶんかつ。しじょうからわ かぶしき しじょうお おもちゃに して いると ひはんも でます。
- id: heya1
  title: ''
  background: ld_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 切っただけで、15日も上がり続けたのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 1枚を100切れにしても、ピザは1枚のまま。安く見えるだけよ。
  - speaker: zundamon
    emotion: thinking
    text: でも、みんな欲しがってるよ？
  - speaker: tsumugi
    emotion: normal
    text: 切った新しい株が出回るまで、品薄になるからね。
  - speaker: tsumugi
    emotion: normal
    text: 株主は2003年9月の約9000人から、1年で15万4000人に増えたわ。
  - speaker: zundamon
    emotion: surprised
    text: 1年で、そんなに！？
  - speaker: reimu
    text: この年の決算で、会社は3億円の赤字を、50億円の黒字と書くことになります。
    reading: この としの けっさんで、かいしゃわ さんおくえんの あかじお ごじゅうおくえんの くろじと かく ことに なります。
  - speaker: zundamon
    emotion: surprised
    text: 赤字の会社が、どうやって黒字の決算を作ったのだ！？
# ---- 2004年6月30日・球団を買いたい ----
- id: ch2_kyudan
  title: 球団を買いたい
  background: ld_kaiken
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 堀江貴文, emotion: happy}
  - {who: miyauchi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2004年6月30日。31歳の堀江は、近鉄球団を買いたいと会見を開きます。隣は財務担当の宮内亮治。
    reading: にせん よねん ろくがつ さんじゅうにち。さんじゅういっさいの ほりえわ、きんてつ きゅうだんお かいたいと かいけんお ひらきます。となりわ ざいむ たんとうの みやうち りょうじ。
  - speaker: zundamon
    emotion: happy
    text: 売名なら広告宣伝費を使って堂々とやる。
  - speaker: miyauchi
    emotion: normal
    text: 2月の交渉時には[10－30億円|じゅうからさんじゅうおくえん]を提示した
  - speaker: zundamon
    emotion: normal
    text: '[近鉄|きんてつ]だけでなく、球界全体を相手に戦う覚悟はできている'
- id: ch2_kintetsu
  title: ''
  background: ld_kaigi
  stage:
  - {who: kintetsu, x: 0.56, emotion: normal}
  cuts:
  - speaker: kintetsu
    emotion: normal
    text: 明確にお断りしている。
    se: chin
  - speaker: reimu
    text: 11月。新しく球界に入ると決まったのは、楽天でした。
    reading: じゅういちがつ。あたらしく きゅうかいに はいると きまったのわ、らくてんでした。
  - speaker: reimu
    text: 7300億円の会社を止めたのは、何だったのか。その種になる『買い物』が、帳簿の上でもう始まっていました。
    reading: ななせん さんびゃく おくえんの かいしゃお とめたのわ、なんだったのか。その たねに なる かいものが、ちょうぼの うえで もう はじまって いました。
# ---- 2004年6〜12月・買い終わった会社を、これから買う ----
- id: ch3_kumiai
  title: 買い終わった会社を買う
  background: ld_kumiai
  bgm: kinakusai
  stage:
  - {who: senpai, x: 0.28, flip: true, emotion: normal}
  - {who: shinjin, x: 0.7, emotion: normal}
  cuts:
  - speaker: shinjin
    emotion: normal
    text: 先輩、ここが組合の事務所ですか？ 郵便受けと表札だけですね。
  - speaker: senpai
    emotion: normal
    text: 名前だけの事務所さ。うちが出資してる[投資事業組合|とうしじぎょうくみあい]だ。
  - speaker: shinjin
    emotion: normal
    text: 名前だけ……。
  - speaker: senpai
    emotion: normal
    text: この組合が6月ごろ、出版社を1つ現金で買った。
  - speaker: senpai
    emotion: normal
    text: マネーライフって会社だ。約4000万円。
  - speaker: shinjin
    emotion: normal
    text: 出版社を、ですか。
  - speaker: senpai
    emotion: thinking
    text: なのに10月、子会社のライブドアマーケティングがこう発表した。
  - speaker: shinjin
    emotion: normal
    text: '[株式交換|かぶしきこうかん]比率[（１対１）|いちたいいち]については、'
  - speaker: shinjin
    emotion: normal
    text: 第三者機関が算出した結果を踏まえ、両者間で協議の上で決定した。
  - speaker: shinjin
    emotion: thinking
    text: ……これから買う相手みたいな書き方ですね。
  - speaker: senpai
    emotion: normal
    text: この会社、もう買ってあるんだ。
  - speaker: shinjin
    emotion: surprised
    text: じゃあ、なんで発表を？
  - speaker: senpai
    emotion: normal
    text: 株を作るためさ。
    se: don
  - speaker: senpai
    emotion: normal
    text: 交換すれば、組合の手にライブドアマーケティングの新しい株が入る。
  - speaker: shinjin
    emotion: thinking
    text: それを、売るんですか。
  - speaker: senpai
    emotion: normal
    text: 高く売れれば、な。
  - speaker: senpai
    emotion: normal
    text: 11月には、その株を100に分けると発表した。
  - speaker: shinjin
    emotion: surprised
    text: 本体と、同じ手ですね。
  - speaker: senpai
    emotion: normal
    text: 11月の業績の発表は、こうだ。
  - speaker: shinjin
    emotion: normal
    text: ……完全黒字化への転換を果たしている。
  - speaker: reimu
    text: この黒字は、架空の売上で作ったものでした。株価は跳ね上がり、組合は高値で売り抜けます。
    reading: この くろじわ、かくうの うりあげで つくった ものでした。かぶかわ はねあがり くみあいわ たかねで うりぬけます。
  - speaker: shinjin
    emotion: sad
    text: 買ってある会社を、これから買うと言って……。
  - speaker: reimu
    text: 約8億円の大半は、ライブドアに戻りました。1年3か月後、上場廃止へ向かう捜査は、この件から始まります。
    reading: やく はちおくえんの たいはんわ、らいぶどあに もどりました。いちねん さんかげつご じょうじょう はいしえ むかう そうさわ、この けんから はじまります。
# ---- 2004年9月期・赤字3億円が、黒字50億円になる ----
- id: ch4_zaimu
  title: 赤字3億円が黒字50億円に
  background: ld_zaimu
  stage:
  - {who: senpai, x: 0.28, flip: true, emotion: normal}
  - {who: shinjin, x: 0.7, emotion: thinking}
  cuts:
  - speaker: shinjin
    emotion: thinking
    text: 先輩、9月期の決算です。この大きな売上、どこの取引ですか？
  - speaker: senpai
    emotion: normal
    text: この売上、どこから来たと思う？
  - speaker: shinjin
    emotion: normal
    text: 新しい広告の仕事、とか……。
  - speaker: senpai
    emotion: sad
    text: ……うちの株だよ。
    beat: true
  - speaker: shinjin
    emotion: surprised
    text: 株！？
  - speaker: senpai
    emotion: normal
    text: '[株式交換|かぶしきこうかん]で出したうちの株を、組合を通して売った。'
  - speaker: senpai
    emotion: normal
    text: そのお[金|かね]が、37億6699万円。売上に入れてある。
  - speaker: shinjin
    emotion: surprised
    text: 自分の株を売ったお[金|かね]が、売上に！？
  - speaker: senpai
    emotion: normal
    text: それと、この2社への売上が15億8000万円。
  - speaker: shinjin
    emotion: thinking
    text: この2社、取引の中身が見当たりませんけど……。
  - speaker: senpai
    emotion: sad
    text: ……そういうことだ。
  - speaker: reimu
    text: 本当は3億1278万円の赤字。それが、50億3421万円の黒字になりました。
    reading: ほんとうわ さんおく せん にひゃく ななじゅうはちまんえんの あかじ。それが ごじゅうおく さんぜん よんひゃく にじゅういちまんえんの くろじに なりました。
- id: heya2
  title: ''
  background: ld_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 赤字が黒字に！？ どういう計算なのだ！？
  - speaker: tsumugi
    emotion: normal
    text: お小遣い帳で言うね。今月は3128円の赤字。
  - speaker: zundamon
    emotion: normal
    text: ふむふむ。
  - speaker: tsumugi
    emotion: normal
    text: そこで自分のゲーム機を売った3万7670円を、バイト代と書く。
  - speaker: zundamon
    emotion: thinking
    text: ゲーム機を売ったお[金|かね]は、バイト代じゃないよ？
  - speaker: tsumugi
    emotion: thinking
    text: さらに、来るはずのない1万5800円も書き足すの。
  - speaker: zundamon
    emotion: surprised
    text: 来ないのに！？
  - speaker: tsumugi
    emotion: normal
    text: そして、今月は5万342円の黒字ですと言ったの。
    telops:
    - {text: "赤字3億円 → 黒字50億円", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: zundamon
    emotion: angry
    text: ボクの家計簿より、ひどいのだ！
    se: zukko
  - speaker: zundamon
    emotion: thinking
    text: これ、社長が全部やらせたの？
  - speaker: tsumugi
    emotion: normal
    text: 判決の要旨によれば、ほとんどの罪で社長は
  - speaker: tsumugi
    emotion: normal
    text: '[宮内|みやうち]被告らの提案などを了承したにとどまり'
  - speaker: tsumugi
    emotion: normal
    text: 各犯行を主導したとまでは認められない。
  - speaker: zundamon
    emotion: thinking
    text: 了承した、だけ？
  - speaker: tsumugi
    emotion: thinking
    text: でも同じ判決は、中心的な役割を担ったとも認めてるの。
  - speaker: zundamon
    emotion: sad
    text: 主導はしてないけど、真ん中にいた……。
- id: ch4_shacho
  title: ''
  background: ld_shacho
  bgm: serious
  stage:
  - {who: zundamon, x: 0.5, tag: 堀江貴文, emotion: normal}
  cuts:
  - speaker: reimu
    text: 12月27日、この数字の有価証券報告書が国に出されます。彼を刑務所へ連れていく書類です。
    reading: じゅうにがつ にじゅうしちにち、この すうじの ゆうか しょうけん ほうこくしょが くにに だされます。かれお けいむしょえ つれて いく しょるいです。
  - speaker: reimu
    text: のちに2009年の会見で、彼はこう語ります。「私は『違法でない』と考えております。」
    reading: のちに にせん きゅうねんの かいけんで、かれわ こう かたります。わたしわ いほうで ないと かんがえて おります。
# ---- 2005年2月8日・28分で、ラジオ局の筆頭株主に ----
- id: card2005
  title: ''
  background: ld_card_2005
  bgm: curious
  cuts:
  - speaker: reimu
    text: 2005年2月8日の朝。東京のラジオ局、ニッポン放送です。
    reading: にせん ごねん にがつ ようかの あさ。とうきょうの らじおきょく、にっぽん ほうそうです。
- id: ch5_radio
  title: 28分で筆頭株主に
  background: ld_radio
  stage:
  - {who: kyokuin, x: 0.28, flip: true, emotion: normal}
  - {who: kyokuin2, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 社長の亀渕昭信は、のちに本にこう書いています。その日、社に戻る車の中で常務から電話。イヤな予感。
    reading: しゃちょうの かめぶち あきのぶわ、のちに ほんに こう かいて います。その ひ しゃに もどる くるまの なかで じょうむから でんわ。いやな よかん。
  - speaker: kyokuin
    emotion: normal
    text: 株主の円グラフ、今朝も変わりなしだな。
  - speaker: kyokuin2
    emotion: surprised
    text: 大変です！ 朝の時間外の取引で、うちの株が3割近く買われました！
    background: ld_radio_nuri
    se: gaan
    telops:
    - {text: "28分で35%の筆頭株主に", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: kyokuin
    emotion: surprised
    text: 誰に！？
  - speaker: kyokuin2
    emotion: surprised
    text: ライブドアです！ 前から持ってた分と合わせて、35%です！
  - speaker: kyokuin
    emotion: sad
    text: 筆頭株主が、朝のうちに替わった……。
  - speaker: reimu
    text: 亀渕の本によれば、買い付けは午前8時22分からの28分間でした。
    reading: かめぶちの ほんに よれば、かいつけわ ごぜん はちじ にじゅうにふんからの にじゅうはっぷんかんでした。
  - speaker: kyokuin2
    emotion: thinking
    text: うちはフジテレビの株を約22.5%持つ、筆頭株主ですよ。
  - speaker: kyokuin
    emotion: thinking
    text: 会社の大きさは、フジテレビのほうがずっと上なのに。
  - speaker: kyokuin2
    emotion: normal
    text: 親のほうが小さい家です。親の財布を握れば、子の家の金庫にも手が届く。
  - speaker: kyokuin
    emotion: sad
    text: うちを取られたら、フジテレビまで……。
  - speaker: kyokuin2
    emotion: surprised
    text: ニュースでは、約700億円の買い物だそうです。
  - speaker: kyokuin2
    emotion: surprised
    text: 32歳の社長が、会見を開いてます！
- id: ch5_kaiken
  title: ''
  background: ld_kaiken
  stage:
  - {who: zundamon, x: 0.5, tag: 堀江貴文, emotion: happy}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 単なる協業ではスピード感が足りない
  - speaker: zundamon
    emotion: normal
    text: 現時点での転売は損。長期保有する計画
# ---- 2005年3月・裁判所の判断 ----
- id: heya3
  title: ''
  background: ld_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: ニッポン放送は、やられっぱなし？
  - speaker: tsumugi
    emotion: normal
    text: フジテレビに新株予約権を出して、対抗しようとしたの。
  - speaker: tsumugi
    emotion: normal
    text: でも3月、東京地裁がそれを差し止めたわ。
  - speaker: zundamon
    emotion: surprised
    text: 止められたの！？
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、時間外の買い方はセーフなのだ？
  - speaker: tsumugi
    emotion: normal
    text: 地裁は、[証券取引法|しょうけんとりひきほう]の違反とはいえないとしたの。
  - speaker: tsumugi
    emotion: thinking
    text: でも2月の買い付けから4か月後、法律のほうが変わったわ。
  - speaker: zundamon
    emotion: thinking
    text: あとから、決まりが変わった……。
# ---- 2005年4月18日・想定の範囲内 ----
- id: ch6_wakai
  title: 想定の範囲内
  background: ld_wakai
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 堀江貴文, emotion: happy}
  - {who: hieda, x: 0.52, emotion: normal}
  - {who: kamebuchi, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 4月18日、和解の会見。ニッポン放送株を持つライブドアの子会社を、フジテレビが670億円で買い取ります。
    reading: しがつ じゅうはちにち わかいの かいけん。にっぽん ほうそう かぶお もつ らいぶどあの こがいしゃお、ふじてれびが ろっぴゃく ななじゅうおくえんで かいとります。
  - speaker: zundamon
    emotion: happy
    text: 想定の範囲内の良い方でおさまった
    telops:
    - {text: "堀江「想定の範囲内の良い方でおさまった」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: hieda
    emotion: happy
    text: 提携に満足している
  - speaker: hieda
    emotion: normal
    text: 21世紀の勝ち組メディアとして勝ち残りたい
  - speaker: kamebuchi
    emotion: normal
    text: 友好的によく話し合って今回の合意に達し、たいへん嬉しい
  - speaker: reimu
    text: 2か月前、長期保有すると言った株でした。この年の流行語大賞には、想定内（外）が選ばれます。
    reading: にかげつまえ、ちょうき ほゆう すると いった かぶでした。この としの りゅうこうご たいしょうにわ そうていない そうていがいが えらばれます。
  - speaker: reimu
    text: 想定の範囲内と言った社長に、想定できなかったものは何だったのか。
    reading: そうていの はんいないと いった しゃちょうに、そうてい できなかった ものわ なんだったのか。
# ---- 2005年8〜9月・選挙 ----
- id: ch6_senkyo
  title: ''
  background: ld_kaiken
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.5, tag: 堀江貴文, emotion: normal}
  cuts:
  - speaker: reimu
    text: 8月、社長のまま衆院選に無所属で立った堀江は、広島6区で8万4433票。亀井静香に届かず、落選しました。
    reading: はちがつ しゃちょうの まま しゅういんせんに むしょぞくで たった ほりえわ、ひろしま ろっくで はちまん よんせん よんひゃく さんじゅうさんぴょう。かめい しずかに とどかず らくせん しました。
# ---- 2006年1月16〜17日・捜索の夜と、夜明けの会見 ----
- id: card2006
  title: ''
  background: ld_card_2006
  bgm: serious
  cuts:
  - speaker: reimu
    text: 2006年1月16日、月曜の夕方6時半ごろ。東京地検特捜部などが、本社と自宅を捜索します。
    reading: にせん ろくねん いちがつ じゅうろくにち げつようの ゆうがた ろくじはん ごろ。とうきょう ちけん とくそうぶなどが ほんしゃと じたくお そうさく します。
- id: ch7_sosaku
  title: 捜索の夜
  background: ld_tower_sosaku
  stage:
  - {who: kisha, x: 0.56, emotion: normal}
  cuts:
  - speaker: kisha
    emotion: normal
    text: 特捜部と、証券取引等監視委員会の合同の捜索です。
  - speaker: kisha
    emotion: normal
    text: 段ボール箱が、次々に運び出されています。
  - speaker: kisha
    emotion: normal
    text: 社長の自宅にも、捜索が入ったそうです。
  - speaker: kisha
    emotion: normal
    text: 容疑は、[証券取引法|しょうけんとりひきほう]違反です。
  - speaker: kisha
    emotion: normal
    text: ……夜が明けました。間もなく、社長が会見に出てきます。
    background: ld_tower_yoake
- id: ch7_kaiken
  title: ''
  background: ld_kaiken
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 堀江貴文, emotion: normal}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: 全容把握に向けて社内で調査中。解明次第、報告したい
  - speaker: kisha
    emotion: normal
    text: 進退は？
  - speaker: zundamon
    emotion: normal
    text: 状況が把握できていない状態で述べるのは無責任になる
  - speaker: reimu
    text: のちに彼は、2009年の会見でこう主張しています。
    reading: のちに かれわ、にせん きゅうねんの かいけんで こう しゅちょう して います。
  - speaker: reimu
    text: 「通常こういった経済事件は市場への影響を最小限にとどめるために、金曜日に行うことが通例です。」
    reading: つうじょう こういった けいざい じけんわ しじょうえの えいきょうお さいしょうげんに とどめる ために、きんようびに おこなう ことが つうれいです。
# ---- 2006年1月18日・取引所が止まる ----
