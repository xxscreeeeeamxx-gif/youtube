    text: 売りの注文が、止まりません！
  - speaker: shokuin2
    emotion: sad
    text: 朝、ライブドア株を一時止めたのに……。
  - speaker: shokuin
    emotion: surprised
    text: '[約定|やくじょう]、380万……390万……。'
  - speaker: shokuin2
    emotion: sad
    text: ……止めます。
    background: ld_torihikijo_kie
    se: don
  - speaker: reimu
    text: 1月18日の午後2時40分。東証は、すべての株の売買を止めました。
    reading: いちがつ じゅうはちにちの ごご にじ よんじゅっぷん。とうしょうわ、すべての かぶの ばいばいお とめました。
    telops:
    - {text: "東証が全銘柄の売買を停止", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
