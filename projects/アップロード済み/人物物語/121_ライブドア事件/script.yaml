    reading: ろくがつ はつか しゅうかんの ひ。かすみがせきに あらわれた さんじゅうはっさいの ほりえわ、もひかん あたまに ごー とぅー じぇいると かいた てぃーしゃつ。
  - speaker: zundamon
    emotion: normal
    text: 人生を生き急ぎすぎたかなというのもあり、
  - speaker: zundamon
    emotion: normal
    text: 2年半で見つめ直し、健康になって帰ってきたいと思います
- id: ch11_hei
  title: ''
  background: ld_hei
  cuts:
  - speaker: reimu
    text: 移された先は、長野刑務所でした。
    reading: うつされた さきわ、ながの けいむしょでした。
  - speaker: reimu
    text: 塀の前の木に、雪が積もります。
    reading: へいの まえの きに、ゆきが つもります。
    background: ld_hei_yuki
  - speaker: reimu
    text: 2013年3月27日。1年9か月がたち、仮釈放の日が来ました。
    reading: にせん じゅうさんねん さんがつ にじゅうしちにち。いちねん きゅうかげつが たち、かりしゃくほうの ひが きました。
    background: ld_hei_sakura
- id: ch11_karishaku
  title: 仮釈放
  background: ld_kaiken
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.5, tag: 堀江貴文, emotion: happy}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: '[収監時|しゅうかんじ]は95.7キロ。先ほど控室で計ったときは着衣状態で67.3キロです。'
  - speaker: reimu
    text: 投資について問われると、彼はこう答えます。
    reading: とうしに ついて とわれると、かれわ こう こたえます。
  - speaker: zundamon
    emotion: normal
