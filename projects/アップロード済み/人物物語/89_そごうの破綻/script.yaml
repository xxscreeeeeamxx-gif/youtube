    emotion: happy
    text: どこの百貨店も、今は別の会社でやっていますよ。
  - speaker: kisha
    emotion: thinking
    text: でも、大きな店ほど赤字も大きいのでは。
  - speaker: zundamon
    emotion: normal
    text: 累積赤字は、土地の[評価替え|ひょうかがえ]で消せます。
