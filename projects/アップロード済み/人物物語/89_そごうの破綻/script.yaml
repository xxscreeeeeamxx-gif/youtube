    reading: ぎょそんの なりうに うまれた みずしまが、みせの だしかたお かたるのに えらんだのわ さかなの はなしでした。
  - speaker: kisha
    emotion: normal
    text: 店ごとに別の会社を作るやり方は、どうですか。
  - speaker: zundamon
    emotion: normal
