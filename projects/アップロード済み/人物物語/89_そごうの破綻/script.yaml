  - speaker: zundamon
    emotion: thinking
    text: 時勢がこうですから。建築費も上がりました。
  - speaker: zundamon
    emotion: thinking
    text: 新しい店が黒字になるまで、7年から8年かかります。
  - speaker: kisha
    emotion: thinking
