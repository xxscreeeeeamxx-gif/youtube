  - speaker: zundamon
    emotion: thinking
    text: まだ、[空いて|あいて]いる所があるのだ。
  - speaker: shain
    emotion: thinking
    text: もう、海くらいしか[空いて|あいて]ません！
  - speaker: zundamon
    emotion: happy
    text: 海の向こうにも、タイやシンガポールに出してるぞ。
  - speaker: shain
    emotion: thinking
    text: ……[画鋲|がびょう]が、地図からはみ出してます。
