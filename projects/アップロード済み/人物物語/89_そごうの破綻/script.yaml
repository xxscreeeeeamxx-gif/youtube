    emotion: happy
    text: 社長。1979年に10店で、1987年には20店でした。
  - speaker: shain
    emotion: happy
    text: そして1991年の秋、[川口|かわぐち]の店で30店目です！
  - speaker: zundamon
    emotion: happy
    text: よし。30本目の[画鋲|がびょう]だ。
  - speaker: shain
    emotion: surprised
