  - speaker: reimu
    text: 10年前の1981年度は、3500億円に届いていませんでした。
    reading: じゅうねんまえの せんきゅうひゃく はちじゅういちねんどわ、さんぜん ごひゃくおくえんに とどいて いませんでした。
- id: card1992
  title: ''
  background: so_card_1992
