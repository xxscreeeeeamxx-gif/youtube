  - speaker: zundamon
    emotion: happy
    text: 返品できる福袋みたいなのだ！
    se: hammer
  - speaker: tsumugi
    emotion: thinking
    text: その債権は1999年に、国の委員会が健全と判定してたものなの。
  - speaker: zundamon
    emotion: surprised
    text: 健全なのに、棒引き！？
  - speaker: tsumugi
    emotion: normal
    text: 国が引き取ったのは、額面で約2000億円。実際の価値は約1000億円と見られてた。
  - speaker: tsumugi
    emotion: normal
    text: 法的整理にすると、国の損は200億円以上増える。
  - speaker: tsumugi
    emotion: normal
    text: 金融再生委員会は、そう試算してたの。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、放棄したほうが国は得だったの？
  - speaker: tsumugi
    emotion: thinking
    text: 試算だけ見れば、そうね。でも、税金で私企業を救うのかという声のほうが強かった。
  - speaker: tsumugi
    emotion: normal
    text: 不買まで広がって、そごうは要請を取り下げたの。
  - speaker: tsumugi
    emotion: normal
    text: 首相は国会で、政調会長の助言もあったと答えてる。
  - speaker: zundamon
    emotion: thinking
    text: 救われる前に、自分で降りたのか。
  - speaker: tsumugi
    emotion: thinking
    text: 降りたけど、民事再生だと国の負担はかえって増えると見られてたの。
  - speaker: zundamon
    emotion: surprised
    text: 降りたほうが、国の損は大きいのか！
  - speaker: tsumugi
    emotion: normal
    text: そう。でも本当の問題は、別のところにあるの。
- id: ch13_honto
  title: 本当の問題
  background: so_heya_tv
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: thinking}
  cuts:
  - speaker: tsumugi
    emotion: thinking
    text: 借入は、売上のおよそ1.6倍。利子を払うだけで赤字になってた。
    telops:
    - {text: "借入は売上の約1.6倍", size: lg, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: zundamon
    emotion: sad
    text: 稼ぐより、利子のほうが重い……。
  - speaker: tsumugi
    emotion: normal
    text: 給料の大半が、ローンの利子で消えていく家みたいなものね。
  - speaker: tsumugi
    emotion: normal
    text: しかも本社以外の店は[連結決算|れんけつけっさん]の外で、[興銀|こうぎん]は3分の2の店と取引がなかった。
  - speaker: zundamon
    emotion: surprised
    text: 貸してる銀行にも、全体が見えてなかったのか！
  - speaker: tsumugi
    emotion: normal
    text: それに会長に退いたあとも、株を通じて[水島|みずしま]さんに力が集まってた。
  - speaker: tsumugi
    emotion: thinking
    text: そして、あのトランプのタワー。
  - speaker: tsumugi
    emotion: thinking
    text: 土地の値段が下がると、赤字を消す仕組みが働かなくなったの。
  - speaker: zundamon
    emotion: surprised
    text: 店を増やした仕組みと、潰れた仕組みが……同じなのだ！
    se: hirameki
  - speaker: tsumugi
    emotion: normal
    text: 上がってるあいだは日本一の仕組み。下がったら、借金だけが残る仕組み。
  - speaker: tsumugi
    emotion: thinking
    text: そこへ建築費の高騰に震災、[長銀|ちょうぎん]の破綻まで重なったわ。
  - speaker: zundamon
    emotion: thinking
    text: '[水島|みずしま]さんは、やっぱり悪い人だったの？'
  - speaker: tsumugi
    emotion: normal
    text: 本人は、破綻の責任はあるが決して[放漫|ほうまん]経営ではなかったと言ってたわ。
  - speaker: zundamon
    emotion: surprised
    text: 言い分は、正反対なのだ。
  - speaker: tsumugi
    emotion: normal
    text: '[興銀|こうぎん]は、担保のない債権の99パーセントを放棄するつもりだったの。'
  - speaker: zundamon
    emotion: surprised
    text: 貸した側も、ほとんど返ってこないのか。
  - speaker: tsumugi
    emotion: thinking
    text: 誰が悪いかを決める前に、何が起きたかを見ておきたいわね。
  - speaker: zundamon
    emotion: normal
    text: 人より先に、仕組みを見るのだ。
- id: ch14_gendai
  title: そごう・西武のその後
  background: so_gendai
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 民事再生の手続きは、2003年の1月に終わったの。
  - speaker: tsumugi
    emotion: normal
    text: その年の6月には、西武百貨店と経営を統合したわ。
  - speaker: tsumugi
    emotion: normal
    text: 社長は、[有楽町|ゆうらくちょう]店が閉まる前に招かれた[和田繁明|わだしげあき]さんよ。
  - speaker: zundamon
    emotion: surprised
    text: 西武と、一緒になったのか。
  - speaker: tsumugi
    emotion: normal
    text: 2006年には、[セブン&アイ|せぶんあんどあい]の子会社になったの。
  - speaker: tsumugi
    emotion: normal
    text: そして2009年に合併して、そごう・西武という会社になったわ。
  - speaker: zundamon
    emotion: surprised
    text: 名前が、二つ並んだのか。
  - speaker: tsumugi
    emotion: normal
    text: '[有楽町|ゆうらくちょう]で[逢いましょう|あいましょう]の開店から、半世紀あまりね。'
  - speaker: zundamon
    emotion: thinking
    text: 店は減っても、名前は残ったのだ。
- id: ch14_strike
  title: ''
  background: so_heya_tv
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 2023年の8月31日には、西武[池袋|いけぶくろ]本店で労働組合がストライキをしたの。
  - speaker: tsumugi
    emotion: thinking
    text: 百貨店のストライキは、61年ぶりだったわ。
  - speaker: zundamon
    emotion: surprised
    text: 61年ぶり！？
    se: bikkuri
  - speaker: tsumugi
    emotion: normal
    text: 働く人たちが、仕事を止めて声を上げたのよ。
  - speaker: tsumugi
    emotion: normal
    text: 次の日、そごう・西武はアメリカのフォートレスに売られたの。
  - speaker: tsumugi
    emotion: normal
    text: 売るときに[セブン&アイ|せぶんあんどあい]は、約916億円の債権を放棄したわ。
  - speaker: zundamon
    emotion: surprised
    text: また、債権放棄なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 23年たって、また放棄で次の持ち主へ渡ったのね。
- id: shime
  title: ''
  background: so_heya
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 紙袋を見せびらかす前に、中身もちゃんと見てね。
  - speaker: zundamon
    emotion: thinking
    text: 袋より、中身なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 会社も同じ。大きさより、中身が見えるかどうかよ。
  - speaker: zundamon
    emotion: happy
    text: 紙袋の値上がりを当てにして、靴下を借りて買い足すのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 値上がりを当てに、借りて増やす。……それ、そごうと同じよ。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: 大きな[漁礁|ぎょしょう]ほど、魚は集まる。
  - speaker: tsumugi
    emotion: thinking
    text: でもその[漁礁|ぎょしょう]は、上がり続ける土地の値段の上に建ってたのね。
  - speaker: zundamon
    emotion: thinking
    text: 海の底が下がったら、[漁礁|ぎょしょう]ごと沈むのだ。
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
