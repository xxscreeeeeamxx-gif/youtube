meta:
  title: そごう、日本一から負債1兆8700億円へ　店を増やし続けた男の漁礁理論【ずんだもん解説】
  slug: sogo-mizushima
  summary: 1992年、売上で日本一になった百貨店、そごう。率いていたのは、銀行員と法学博士の顔を持つ水島廣雄でした。社長になったとき、店は大阪・神戸・東京の3つだけ。それがなぜ、社長室の地図が画鋲で埋まるほどに増えたのか。大きな漁礁ほど魚が集まる、と語った男の店の増やし方と、その仕組みに隠れていたものを、再現ドラマでたどります。
  tags:
  - そごう
  - 水島廣雄
  - 百貨店
  - 日本興業銀行
  - 長銀
  - 債権放棄
  - 民事再生法
  - そごう・西武
  - バブル
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 平成史
  thumbnail:
    top: 負債1兆8700億円
    bottom: そごう破綻
  mode: drama
  narrator: reimu
