  - speaker: zundamon
    emotion: happy
    text: 大きな店を建てれば、客は集まるんです。
  - speaker: kisha
    emotion: thinking
    text: '[漁礁|ぎょしょう]というと、海に沈める廃船ですか。'
  - speaker: zundamon
    emotion: happy
    text: ええ。小さな[漁礁|ぎょしょう]には、魚は来やしません。
  - speaker: reimu
