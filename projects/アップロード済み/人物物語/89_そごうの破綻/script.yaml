scenes:
- id: co_shuzai
  title: ''
  background: so_shachoshitsu_pins
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 水島廣雄, emotion: happy}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1992年。売上日本一の百貨店、そごうの社長が取材を受けていました。
    reading: せんきゅうひゃく きゅうじゅうにねん。うりあげ にほんいちの ひゃっかてん、そごうの しゃちょうが しゅざいお うけて いました。
  - speaker: kisha
    emotion: normal
    text: 店を30以上に増やした秘訣は、[何|なん]ですか。
  - speaker: zundamon
    emotion: happy
    text: '[漁礁|ぎょしょう]です。大きな[漁礁|ぎょしょう]ほど、魚は集まるでしょう。'
  - speaker: zundamon
    emotion: happy
    text: 大きな店を建てれば、客は集まるんです。
  - speaker: zundamon
    emotion: normal
    text: 累積赤字は、土地の[評価替え|ひょうかがえ]で消せます。
  - speaker: reimu
    text: この男は、水島廣雄。8年後、そごうは負債1兆8700億円で倒れます。
    reading: この おとこわ、みずしま ひろお。はちねんご、そごうわ ふさい いっちょう はっせん ななひゃくおくえんで たおれます。
- id: hook
  title: ''
  background: so_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ デパートの紙袋。持ってるだけで、お[金|かね]持ちに見えるのだ！
    se: jaan
  - speaker: tsumugi
    emotion: normal
    text: 中身は？
  - speaker: zundamon
    emotion: normal
    text: ……靴下1足。
  - speaker: tsumugi
    emotion: thinking
    text: 袋のほうが、本体なのね。
    beat: true
  - speaker: tsumugi
    emotion: thinking
    text: 売上で日本一だった百貨店のそごうも、中身が外から見えなかったの。
    telops:
    - {text: "売上日本一 → 負債1兆8700億円", size: lg, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 日本一の百貨店が、なんで潰れたの！？
- id: card1912
  title: ''
  background: so_card_1912
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1912年。京都府の成生という漁村で、水島廣雄が生まれます。今の舞鶴市です。
    reading: せんきゅうひゃく じゅうにねん。きょうとふの なりうと いう ぎょそんで、みずしま ひろおが うまれます。いまの まいづるしです。
- id: card1936
  title: ''
  background: so_card_1936
  cuts:
  - speaker: reimu
    text: 1936年。中央大学の法学部を出た水島は、日本興業銀行に入ります。
    reading: せんきゅうひゃく さんじゅうろくねん。ちゅうおう だいがくの ほうがくぶお でた みずしまわ、にっぽん こうぎょう ぎんこうに はいります。
- id: ch1_kogin
  title: 興銀の新人
  background: so_ginkou
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 水島廣雄, emotion: happy}
  - {who: ginko, x: 0.7, emotion: normal}
  cuts:
  - speaker: ginko
    emotion: normal
    text: 新人の[水島|みずしま]くんか。[興銀|こうぎん]へようこそ。
  - speaker: zundamon
    emotion: happy
    text: '[水島|みずしま]です。よろしくお願いします！'
  - speaker: ginko
    emotion: thinking
    text: 法学部の出だってね。法律屋が、銀行で何をするんだい。
  - speaker: zundamon
    emotion: normal
    text: お[金|かね]を貸すにも、法律が要ります。
  - speaker: zundamon
    emotion: normal
    text: 返してもらえなかったら、何を押さえるか。担保の決まりです。
  - speaker: ginko
    emotion: surprised
    text: 担保ねえ。
  - speaker: ginko
    emotion: thinking
    text: 若いのに、ずいぶん地味な所が好きなんだな。
  - speaker: zundamon
    emotion: happy
    text: 地味な所ほど、大きなお[金|かね]が動くんです。
  - speaker: ginko
    emotion: happy
    text: ……新人のくせに、言うねえ。
    beat: true
- id: card1953
  title: ''
  background: so_card_1953
  cuts:
  - speaker: reimu
    text: 1953年。水島は、中央大学から法学博士を受けます。
    reading: せんきゅうひゃく ごじゅうさんねん。みずしまわ、ちゅうおう だいがくから ほうがく はくしお うけます。
  - speaker: reimu
    text: 銀行に勤めながら書いた論文の題は、浮動担保ノ研究でした。
    reading: ぎんこうに つとめながら かいた ろんぶんの だいわ、ふどう たんぽの けんきゅうでした。
- id: ch1_ronbun
  title: 昼は銀行員、夜は学者
  background: so_kenkyushitsu_yoru
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 水島廣雄, emotion: happy}
  - {who: ginko, x: 0.7, emotion: happy}
  cuts:
  - speaker: ginko
    emotion: happy
    text: '[水島|みずしま]くん、博士になったんだってね。おめでとう。'
  - speaker: zundamon
    emotion: happy
    text: ありがとうございます。夜に書きためた論文です。
  - speaker: ginko
    emotion: normal
    text: 題は、ふどう担保だっけ。土地や建物の担保か。
  - speaker: zundamon
    emotion: normal
    text: いえ。動かない不動ではなく、浮いて動くほうの[浮動|ふどう]です。
  - speaker: ginko
    emotion: surprised
    text: 浮いて動く担保？ ……ずいぶん、ふわふわしてるな。
    se: manuke
  - speaker: zundamon
    emotion: thinking
    text: 会社の財産を、中身が入れ替わってもまとめて担保にする考えです。
  - speaker: ginko
    emotion: thinking
    text: 在庫も機械も、まとめて一つの担保か。
  - speaker: zundamon
    emotion: happy
    text: はい。会社をまるごと、ひとかたまりで見るんです。
  - speaker: ginko
    emotion: happy
    text: 昼は銀行員で、夜は学者。二足のわらじだな。
  - speaker: zundamon
    emotion: happy
    text: わらじは、2足とも履きつぶすつもりです。
    beat: true
  - speaker: reimu
    text: 水島は銀行に勤めながら、東洋大学で法律も教えました。
    reading: みずしまわ ぎんこうに つとめながら、とうよう だいがくで ほうりつも おしえました。
- id: card1957
  title: ''
  background: so_card_1957
  cuts:
  - speaker: reimu
    text: 1957年5月。大阪と神戸に店を持つそごうが、東京の有楽町に店を開きます。
    reading: せんきゅうひゃく ごじゅうななねん ごがつ。おおさかと こうべに みせお もつ そごうが、とうきょうの ゆうらくちょうに みせお ひらきます。
- id: ch2_yurakucho
  title: 有楽町で逢いましょう
  background: so_kaitenshiki
  bgm: natsuyasumi
  stage:
  - {who: tenin, x: 0.28, flip: true, emotion: happy}
  - {who: kyaku, x: 0.7, emotion: normal}
  cuts:
  - speaker: tenin
    emotion: happy
    text: '[有楽町|ゆうらくちょう]で、[逢いましょう|あいましょう]！ そごう東京店、開店です！'
  - speaker: kyaku
    emotion: surprised
    text: '[逢いましょう|あいましょう]って、誰とだい。'
  - speaker: tenin
    emotion: happy
    text: どなたとでも！ 待ち合わせは、ぜひそごうで！
  - speaker: kyaku
    emotion: happy
    text: デパートで待ち合わせか。しゃれてるねえ。
  - speaker: tenin
    emotion: happy
    text: お待ちのあいだに、お買い物もどうぞ！
  - speaker: kyaku
    emotion: thinking
    text: ……そっちが本音だな。
    beat: true
  - speaker: reimu
    text: 有楽町で逢いましょうという標語は、のちに同じ題の歌になり、映画にもなりました。
    reading: ゆうらくちょうで あいましょうと いう ひょうごわ、のちに おなじ だいの うたに なり えいがにも なりました。
- id: card1958
  title: ''
  background: so_card_1958
  cuts:
  - speaker: reimu
    text: 1958年4月。会社の財産をまとめて社債の担保にする、企業担保法ができます。
    reading: せんきゅうひゃく ごじゅうはちねん しがつ。かいしゃの ざいさんお まとめて しゃさいの たんぽに する、きぎょう たんぽほうが できます。
  - speaker: reimu
    text: 水島の研究は、この法律の土台になったとされます。
    reading: みずしまの けんきゅうわ、この ほうりつの どだいに なったと されます。
  - speaker: reimu
    text: 同じ年。水島は興銀を辞め、そごうの副社長になります。
    reading: おなじ とし。みずしまわ こうぎんお やめ、そごうの ふくしゃちょうに なります。
- id: ch2_jishoku
  title: 興銀を辞める
  background: so_ginkou
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 水島廣雄, emotion: normal}
  - {who: ginko, x: 0.7, emotion: surprised}
  cuts:
  - speaker: ginko
    emotion: surprised
    text: '[水島|みずしま]くん、[興銀|こうぎん]を辞めるって本当か。'
  - speaker: zundamon
    emotion: normal
    text: はい。そごうの副社長になります。
  - speaker: ginko
    emotion: surprised
    text: デパートの？ 法学博士が、なんでまた。
  - speaker: zundamon
    emotion: normal
    text: そごうの一族から、頼まれまして。
  - speaker: zundamon
    emotion: normal
    text: 妻の実家が、大株主の一族と[縁続き|えんつづき]なんです。
  - speaker: ginko
    emotion: thinking
    text: '[縁続き|えんつづき]……。ずいぶん遠回しな親戚だな。'
    beat: true
  - speaker: ginko
    emotion: normal
    text: じゃあ[興銀|こうぎん]から、送り込まれるわけじゃないんだな。
  - speaker: zundamon
    emotion: normal
    text: ええ。辞めて、行くんです。
  - speaker: ginko
    emotion: thinking
    text: 担保の学者が、デパートで何を売るんだ。
  - speaker: zundamon
    emotion: happy
    text: さあ。売り場に立てば、分かるでしょう。
- id: ch2_sakin
  title: あなた方は砂金だ
  background: so_uriba
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 水島廣雄, emotion: normal}
  - {who: shain, x: 0.7, emotion: sad}
  cuts:
  - speaker: shain
    emotion: sad
    text: 副社長。わたしたち、何をやっても駄目なんです。
  - speaker: zundamon
    emotion: normal
    text: 駄目かどうかは、まだ分かりません。
  - speaker: zundamon
    emotion: happy
    text: '[あなた方|あなたがた]は、[砂金|さきん]です。'
  - speaker: shain
    emotion: surprised
    text: さきん？ ……砂のほうですか。
  - speaker: zundamon
    emotion: normal
    text: 砂の中に混じって光る、金の粒です。
  - speaker: zundamon
    emotion: happy
    text: 洗えば、ちゃんと光るんです。
  - speaker: shain
    emotion: thinking
    text: 洗われるのは、ちょっと痛そうですね。
  - speaker: zundamon
    emotion: thinking
    text: ……そこは、たとえです。
    se: hammer
  - speaker: reimu
    text: 水島はこう語って、落ち込んだ社員を立て直しました。
    reading: みずしまわ こう かたって、おちこんだ しゃいんお たてなおしました。
- id: ch2_yachin
  title: 家賃を下げてほしい
  background: so_shachoshitsu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 水島廣雄, emotion: thinking}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: '[有楽町|ゆうらくちょう]店の家賃、下げてもらえないか頼みに行く。'
  - speaker: shain
    emotion: surprised
    text: 家賃を、ですか。
  - speaker: zundamon
    emotion: normal
    text: うちは、あの建物を借りている身だからな。
  - speaker: shain
    emotion: surprised
    text: 家主は読売新聞社ですよ。社主は、あの[正力松太郎|しょうりきまつたろう]さんです！
  - speaker: zundamon
    emotion: normal
    text: 相手が大物でも、家賃は家賃だ。
  - speaker: shain
    emotion: thinking
    text: 副社長。交渉に、法学博士の肩書きは効くんですか。
  - speaker: zundamon
    emotion: happy
    text: 効かなかったら、論文を置いてくる。
  - speaker: shain
    emotion: angry
    text: 論文なんて、置いてきても重しにしかなりません！
    se: zukko
  - speaker: reimu
    text: 水島は、家主の読売新聞社と家賃の引き下げを交渉しました。
    reading: みずしまわ、やぬしの よみうり しんぶんしゃと やちんの ひきさげお こうしょう しました。
- id: card1962
  title: ''
  background: so_card_1962
  cuts:
  - speaker: reimu
    text: 1962年。水島は、そごうの社長になります。
    reading: せんきゅうひゃく ろくじゅうにねん。みずしまわ、そごうの しゃちょうに なります。
- id: ch3_shacho
  title: 店は3つだけ
  background: so_shachoshitsu_pin3
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 水島廣雄, emotion: thinking}
  - {who: shain, x: 0.7, emotion: happy}
  cuts:
  - speaker: shain
    emotion: happy
    text: 社長、ご就任おめでとうございます！
  - speaker: zundamon
    emotion: thinking
    text: 店は大阪と神戸と東京。地図の[画鋲|がびょう]は、3本だけか。
    telops:
    - {text: "社長になったとき 店は3つ", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: shain
    emotion: happy
    text: 3店もあれば、十分じゃないですか。
  - speaker: zundamon
    emotion: normal
    text: 日本は、こんなに広いんだぞ。
  - speaker: shain
    emotion: thinking
    text: 社長。[画鋲|がびょう]を見る目が、ちょっと怖いです。
  - speaker: zundamon
    emotion: happy
    text: ……もっと、刺したいのだ。
    beat: true
- id: card1967
  title: ''
  background: so_card_1967
  cuts:
  - speaker: reimu
    text: 1967年。そごうは、千葉に新しい店を開きます。
    reading: せんきゅうひゃく ろくじゅうななねん。そごうわ、ちばに あたらしい みせお ひらきます。
- id: ch3_chiba
  title: 店ごとに別の会社
  background: so_shachoshitsu_pin3
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 水島廣雄, emotion: normal}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: shain
    emotion: happy
    text: '[千葉|ちば]の店で、そごうも4店目ですね。'
  - speaker: zundamon
    emotion: normal
    text: いや。[千葉|ちば]そごうという、別の会社にする。
  - speaker: shain
    emotion: surprised
    text: 同じそごうなのに、わざわざ別の会社に？
  - speaker: zundamon
    emotion: happy
    text: 失敗しても、本体に響かないようにだ。
    se: hirameki
  - speaker: shain
    emotion: thinking
    text: 開く前から、失敗の話ですか。
  - speaker: zundamon
    emotion: normal
    text: 法律屋は、悪いほうから考えるんだ。
  - speaker: shain
    emotion: thinking
    text: ……博士の考えることは、よく分かりません。
  - speaker: zundamon
    emotion: happy
    text: 今は分からなくても、いいんです。[画鋲|がびょう]が増えれば分かります。
- id: ch3_kaisha
  title: 保証人のバトン
  background: so_ginkou_kaigi
  bgm: curious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 水島廣雄, emotion: normal}
  - {who: ginko2, x: 0.56, emotion: normal}
  - {who: shain, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1969年。そごうは、横浜そごうの会社を作ります。店が開くのは、16年後です。
    reading: せんきゅうひゃく ろくじゅうきゅうねん。そごうわ、よこはま そごうの かいしゃお つくります。みせが ひらくのわ、じゅうろくねんごです。
  - speaker: shain
    emotion: surprised
    text: 16年後！？ 今生まれた子が、高校生になってますよ！
    beat: true
  - speaker: zundamon
    emotion: normal
    text: 店を出す何年も前に、別の会社の名前で土地を安く買っておくんだ。
  - speaker: shain
    emotion: thinking
    text: そごうの名前を出したら、値段が上がりますもんね。
  - speaker: ginko2
    emotion: normal
    text: それで、新しい会社の資本金は？
  - speaker: zundamon
    emotion: normal
    text: 1億円ほどです。
  - speaker: ginko2
    emotion: surprised
    text: 1億円の会社に、何十億円も貸せと？
  - speaker: zundamon
    emotion: happy
    text: 保証人は、そごう本社が引き受けます。
  - speaker: ginko2
    emotion: thinking
    text: ……それなら、低い金利でお貸しできます。
  - speaker: shain
    emotion: surprised
    text: 本社の信用で、新しい会社が借りられるんですね。
  - speaker: reimu
    text: 1970年、店はまだ4つ。翌年、古巣の興銀と初めて取引を始めます。
    reading: せんきゅうひゃく ななじゅうねん、みせわ まだ よっつ。よくねん、ふるすの こうぎんと はじめて とりひきお はじめます。
- id: ch3_kaisetsu
  title: 店が増える仕組み
  background: so_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 店ごとに、資本金1億円ほどの会社を作るの。いわば別の財布ね。
  - speaker: zundamon
    emotion: surprised
    text: 財布が、店の数だけあるのだ。
  - speaker: tsumugi
    emotion: normal
    text: でも小さな財布だけじゃ、銀行は大金を貸してくれない。
  - speaker: tsumugi
    emotion: normal
    text: そこで本社やグループの会社が、保証人になるの。
  - speaker: zundamon
    emotion: happy
    text: 兄ちゃんが判子を押すから、弟が借りられるのか。
  - speaker: tsumugi
    emotion: happy
    text: そう。しかも低い金利でね。
  - speaker: tsumugi
    emotion: normal
    text: 店ができると、周りの土地の値段が上がる。
  - speaker: tsumugi
    emotion: normal
    text: たとえば10億円で買った土地が30億円になれば、20億円の[含み益|ふくみえき]。
  - speaker: tsumugi
    emotion: normal
    text: その[含み益|ふくみえき]を帳簿に載せて、開店してからの赤字を消せたの。
  - speaker: zundamon
    emotion: surprised
    text: 赤字が消える！？ 魔法の消しゴムなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 帳簿を消しても、借りたお[金|かね]は消えてないからね。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: 黒字になった会社は、今度は次の店の保証人になる。
  - speaker: zundamon
    emotion: thinking
    text: 弟が兄ちゃんになって、また弟を作るのか。
  - speaker: tsumugi
    emotion: normal
    text: トランプのタワーみたいに、上へ上へと積んでいくの。
  - speaker: zundamon
    emotion: thinking
    text: いちばん下で、全部を支えてるのは何？
  - speaker: tsumugi
    emotion: normal
    text: 土地の値上がりよ。
  - speaker: zundamon
    emotion: surprised
    text: ……下の段が、もし抜けたら？
  - speaker: tsumugi
    emotion: thinking
    text: 値上がりが続くうちは、誰も困らなかったの。
  - speaker: tsumugi
    emotion: normal
    text: それと、株を上場してたのは本社の3店だけ。
  - speaker: tsumugi
    emotion: normal
    text: ほかの店の会社は、グループの[連結決算|れんけつけっさん]に入ってなかったの。
  - speaker: zundamon
    emotion: thinking
    text: れんけつ……？
  - speaker: tsumugi
    emotion: normal
    text: グループ全体の成績表のことよ。そこに載らないから、外からは全体が見えにくい。
  - speaker: zundamon
    emotion: surprised
    text: 財布はいっぱいあるのに、中身が見えないのだ。
  - speaker: tsumugi
    emotion: thinking
    text: まとめ役は[千葉|ちば]そごう。その株の約5割を、[水島|みずしま]さんが持ってたの。
- id: card1985
