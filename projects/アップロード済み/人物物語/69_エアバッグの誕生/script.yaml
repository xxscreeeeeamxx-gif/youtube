  - speaker: reimu
    text: 1970年、日本の交通事故の死者は1万6765人になりました。
    reading: せんきゅうひゃく ななじゅうねん、にほんの こうつう じこの ししゃわ いちまん ろくせん ななひゃく ろくじゅうごにんに なりました。
  - speaker: tsumugi
    emotion: thinking
    text: 交通戦争なんて、新聞に書かれてますよ。
  - speaker: zundamon
    emotion: sad
