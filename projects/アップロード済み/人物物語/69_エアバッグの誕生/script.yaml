  cuts:
  - speaker: tsumugi
    emotion: normal
    text: あなた。オランダからも、特許が届きましたよ。
  - speaker: zundamon
    emotion: normal
    text: これで、14の国だ。
  - speaker: reimu
    text: 特許は日本を含む14の国で認められました。アメリカや西ドイツ、イギリスなどです。
