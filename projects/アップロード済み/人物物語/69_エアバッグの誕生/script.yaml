  - speaker: zundamon
    emotion: happy
    text: これで、10か国を超えたのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 特許を取るたびに、お[金|かね]も出ていきますね。
  - speaker: zundamon
    emotion: thinking
    text: ……取るにも守るにも、お[金|かね]がかかる。
  - speaker: tsumugi
    emotion: thinking
