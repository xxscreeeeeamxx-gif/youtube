  - speaker: reimu
    text: 1973年には、アメリカのGMがエアバッグ付きの車1000台を試しに走らせます。
    reading: せんきゅうひゃく ななじゅうさんねんにわ、あめりかの じーえむが えあばっぐつきの くるま せんだいお ためしに はしらせます。
  - speaker: reimu
    text: 1974年からは、客にも売り始めます。
    reading: せんきゅうひゃく ななじゅうよねんからわ、きゃくにも うりはじめます。
