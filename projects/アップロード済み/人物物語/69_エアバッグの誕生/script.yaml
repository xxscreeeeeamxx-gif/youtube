- id: ch10_shikumi
  title: まばたきの間に
  background: kb_shikumi
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 今のエアバッグの仕組みを、見てみましょう。
  - speaker: tsumugi
    emotion: normal
    text: まずセンサーが強い衝撃を感じて、本当にふくらませるかを判断するの。
  - speaker: tsumugi
    emotion: normal
    text: 決まったら、ガスを作る装置に火をつけるのよ。
  - speaker: zundamon
    emotion: happy
    text: 保三郎さんの特許と、流れは同じだ。
  - speaker: tsumugi
    emotion: normal
    text: 火がつくまで約0.03秒、ふくらむのに約0.03秒。
  - speaker: tsumugi
    emotion: normal
    text: 最後は、袋の裏の穴からガスが抜けてしぼむの。
  - speaker: zundamon
    emotion: surprised
    text: せっかくふくらんだのに、しぼんじゃうの？
  - speaker: tsumugi
    emotion: normal
    text: しぼまないと前が見えないし、体を跳ね返してしまうでしょ。
  - speaker: tsumugi
    emotion: normal
    text: 全部で約0.11秒。まばたきのあいだに、終わってしまうの。
    telops:
    - {text: 全部で約0.11秒, size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: そんなに一瞬で、どうして助かるの？
  - speaker: tsumugi
    emotion: normal
    text: 硬い物にぶつかると、体は一瞬で止まるわ。
  - speaker: tsumugi
    emotion: normal
    text: 袋に当たると、ほんの少しだけ時間をかけて止まるの。
  - speaker: tsumugi
    emotion: normal
    text: 止まるまでの時間が長いほど、体にかかる力は小さくなるのよ。
  - speaker: zundamon
    emotion: happy
    text: ゆっくり止まるほど、痛くないのか。
  - speaker: zundamon
    emotion: thinking
    text: ふくらむ勢いは、どれくらい？
  - speaker: tsumugi
    emotion: normal
    text: 時速100キロから300キロにもなるの。
  - speaker: zundamon
    emotion: surprised
    text: そんな勢いで、顔に当たるのだ！？
  - speaker: tsumugi
    emotion: normal
    text: だから、正しい姿勢で座るのが大事なの。ハンドルからは25センチ以上離れてね。
  - speaker: zundamon
    emotion: normal
    text: 運転席を、前に出しすぎない。
  - speaker: tsumugi
    emotion: normal
    text: ふくらんだ直後の袋は熱くなってるから、すぐに触っちゃだめよ。
  - speaker: zundamon
    emotion: surprised
    text: 熱い袋……さわらないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 子どもは、後ろの席に乗せてね。
  - speaker: tsumugi
    emotion: normal
    text: 後ろ向きのチャイルドシートは、助手席に付けてはいけないの。
  - speaker: zundamon
    emotion: sad
    text: 赤ちゃんにあの勢いで袋が当たったら、大変だ。
  - speaker: tsumugi
    emotion: thinking
    text: アメリカでは、助手席のエアバッグで子どもが亡くなる事故が続いたの。
  - speaker: tsumugi
    emotion: normal
    text: それで1997年から、弱めにふくらむエアバッグが認められたのよ。
