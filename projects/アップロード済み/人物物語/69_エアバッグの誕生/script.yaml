meta:
  title: 【エアバッグの誕生】14か国で特許を取ったのに、1台も使われなかった発明家【ずんだもん解説】
  slug: kobori-airbag-v2
  summary: ハンドルの真ん中に入っている、エアバッグ。1960年代、東京の寺の境内にある小さな仕事場で、この仕組みに取り組んだ発明家がいました。クレーン会社の経営を譲ったあとの小堀保三郎です。大学や防衛庁の実験隊の協力を得て、ぶつかった瞬間に袋をふくらませる装置を形にしていきます。その発明は、世界の自動車会社や国にどう受け止められたのか。仕組みの解説とあわせて、再現ドラマでたどります。
  tags:
  - エアバッグ
  - 小堀保三郎
  - 自動車
  - 交通安全
  - 発明
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 技術史
  - 雑学
  thumbnail:
    top: 14か国で特許
    bottom: エアバッグの誕生
  mode: drama
  narrator: reimu
