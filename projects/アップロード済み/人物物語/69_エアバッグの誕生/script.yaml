scenes:
- id: co_zenrei
  title: ''
  background: kb_unyusho
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: yakunin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1960年代の東京。60代の発明家が、事故のときにふくらむ袋を国の役所へ持ち込みます。
    reading: せんきゅうひゃく ろくじゅうねんだいの とうきょう。ろくじゅうだいの はつめいかが、じこの ときに ふくらむ ふくろお くにの やくしょえ もちこみます。
  - speaker: zundamon
    emotion: normal
    text: この袋があれば、事故のけがを減らせるはずです。
  - speaker: yakunin
    emotion: thinking
    text: なるほど。で、これはアメリカやヨーロッパでやってるの？
  - speaker: zundamon
    emotion: surprised
    text: ……え？
  - speaker: yakunin
    emotion: normal
    text: 前例がないんじゃ、ねえ。
    se: don
  - speaker: zundamon
    emotion: sad
    text: ……前例がないから、特許なんです。
  - speaker: reimu
    text: この男は、小堀保三郎。14の国で特許を取ったエアバッグは、1台の車にも積まれませんでした。
    reading: この おとこわ こぼり やすざぶろう。じゅうよんの くにで とっきょお とった えあばっぐわ、いちだいの くるまにも つまれませんでした。
- id: hook
  title: ''
  background: kb_kuruma
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: エアバッグって、ハンドルの真ん中に入ってるあれ？
  - speaker: tsumugi
    emotion: normal
    text: そう。今は、ほとんどの車に付いてるわ。
  - speaker: zundamon
    emotion: happy
    text: ふかふかなら、昼寝の枕にちょうどいいのだ。ここを押せば出てくる？
  - speaker: tsumugi
    emotion: surprised
    text: 待って、そこは……
  - speaker: zundamon
    emotion: surprised
    text: ……プーって鳴ったのだ。
    se: manuke
  - speaker: tsumugi
    emotion: thinking
    text: それはクラクション。袋は、ぶつかったときしか出ないの。
  - speaker: tsumugi
    emotion: normal
    text: 今は当たり前のこの袋を、60年前に考えた[日本人|にほんじん]がいたのよ。
  - speaker: zundamon
    emotion: thinking
    text: なのに、1台も使われなかったのか。
    telops:
    - {text: なぜ使われなかった？, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: どうしてそうなったのか。始まりは、栃木の農村よ。
- id: card1899
  title: ''
  background: kb_card_1899
  cuts:
  - speaker: reimu
    text: 1899年。栃木県の農村で、小堀保三郎が生まれます。
    reading: せんはっぴゃく きゅうじゅうきゅうねん。とちぎけんの のうそんで こぼり やすざぶろうが うまれます。
- id: ch1_mura
  title: 三男の奉公
  background: kb_mura
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, scale: 0.85, emotion: normal}
  - {who: chichi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 今の上三川町のあたりです。保三郎は、小堀家の三男でした。
    reading: いまの かみのかわまちの あたりです。やすざぶろうわ こぼりけの さんなんでした。
  - speaker: chichi
    emotion: normal
    text: 保三郎。小学校を出たら、奉公に行くことになったぞ。
  - speaker: zundamon
    emotion: surprised
    text: 家を、出るのだ？
  - speaker: chichi
    emotion: thinking
    text: お前は三男だ。外へ出て、自分の力で身を立てなさい。
  - speaker: zundamon
    emotion: thinking
    text: 奉公って、何をするの？
  - speaker: chichi
    emotion: normal
    text: よその家に住み込んで、働きながら仕事を覚えるんだ。
  - speaker: zundamon
    emotion: thinking
    text: 住み込み……ごはんは、出る？
  - speaker: chichi
    emotion: surprised
    text: ……まず、そこか。
    se: hammer
  - speaker: zundamon
    emotion: happy
    text: 大事なことなのだ。おかわりできるかも、聞いておいて。
  - speaker: chichi
    emotion: thinking
    text: 奉公先に、おかわりの交渉をする親がいるか。
    beat: true
  - speaker: reimu
    text: 1912年。小学校を終えた保三郎は、奉公に出ます。
    reading: せんきゅうひゃく じゅうにねん。しょうがっこうお おえた やすざぶろうわ ほうこうに でます。
- id: card1924
  title: ''
  background: kb_card_1924
  cuts:
  - speaker: reimu
    text: 1924年。保三郎は大阪の通信社で、記者になっていました。
    reading: せんきゅうひゃく にじゅうよねん。やすざぶろうわ おおさかの つうしんしゃで きしゃに なって いました。
- id: ch1_kisha
  title: 通信社の記者
  background: kb_tsushin
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: senpai, x: 0.7, emotion: normal}
  cuts:
  - speaker: senpai
    emotion: angry
    text: 小堀くん、原稿はまだか。
  - speaker: zundamon
    emotion: surprised
    text: 今、[書き上がりました|かきあがりました]！
  - speaker: senpai
    emotion: normal
    text: どれどれ……また工場の記事か。
  - speaker: zundamon
    emotion: happy
    text: 大きな機械が、重い鉄をひょいと持ち上げてたんです。
  - speaker: senpai
    emotion: thinking
    text: 君の記事は、いつも人より機械のほうが詳しいな。
  - speaker: zundamon
    emotion: happy
    text: 社長の名前は忘れましたけど、モーターの馬力は覚えてます。
  - speaker: senpai
    emotion: angry
    text: 逆だ。記者なら、名前を先に覚えろ。
    se: tsukkomi
  - speaker: senpai
    emotion: happy
    text: ……[君|きみ]は、記者より作る側のほうが向いてるんじゃないか。
  - speaker: zundamon
    emotion: thinking
    text: 作る側……。
  - speaker: reimu
    text: 1934年には、大阪電気鉄道の嘱託として働きます。
    reading: せんきゅうひゃく さんじゅうよねんにわ おおさか でんき てつどうの しょくたくとして はたらきます。
- id: card1937
  title: ''
  background: kb_card_1937
  cuts:
  - speaker: reimu
    text: 1937年。保三郎は尼崎で、自分の工場を始めます。
    reading: せんきゅうひゃく さんじゅうななねん。やすざぶろうわ あまがさきで じぶんの こうじょうお はじめます。
- id: ch2_kojo
  title: クレーンの工場
  background: kb_kojo
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: kouin, x: 0.7, emotion: normal}
  cuts:
  - speaker: kouin
    emotion: happy
    text: 社長。大阪工機製作所の看板、掛け終わりました！
  - speaker: zundamon
    emotion: happy
    text: 今日から、ここでクレーンを作るぞ！
    beat: true
  - speaker: kouin
    emotion: normal
    text: 天井のクレーン、試しに動かしてみますか。
  - speaker: zundamon
    emotion: happy
    text: 動かせ！ 人が持てない物を、上から吊って運ぶんだ。
  - speaker: kouin
    emotion: normal
    text: 鉄の塊を[担いだら|かついだら]、腰を痛めますからね。
  - speaker: zundamon
    emotion: normal
    text: 機械に任せれば、けがをする人も減る。
  - speaker: kouin
    emotion: happy
    text: 社長、記者だったのに機械に詳しいですね。
  - speaker: zundamon
    emotion: happy
    text: 記者のころから、工場ばかり見て回ってたからな。
  - speaker: kouin
    emotion: thinking
    text: ……それ、記者の仕事はしてたんですか。
    beat: true
- id: ch2_munakata
  title: 民芸の仲間
  background: kb_mingei
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: munakata, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1939年ごろから、保三郎は民芸の人たちと付き合うようになります。
    reading: せんきゅうひゃく さんじゅうきゅうねんごろから、やすざぶろうわ みんげいの ひとたちと つきあう ように なります。
  - speaker: reimu
    text: 名もない職人が作る、毎日の道具の美しさを大事にする考え方です。
    reading: なも ない しょくにんが つくる、まいにちの どうぐの うつくしさお だいじに する かんがえかたです。
  - speaker: munakata
    emotion: surprised
    text: 小堀さん、また器が増えましたね。
  - speaker: zundamon
    emotion: happy
    text: 毎日使う器こそ、きれいなんだ。
  - speaker: munakata
    emotion: happy
    text: 分かります。使う人の手に、なじんだ形ですから。
  - speaker: zundamon
    emotion: happy
    text: ……ただ、棚にもう入りきらない。
    background: kb_mingei_afure
  - speaker: munakata
    emotion: thinking
    text: 使う前に、置く場所が要りますね。
    beat: true
  - speaker: reimu
    text: 保三郎は版画家の棟方志功を、まだ売れないころから支えました。
    reading: やすざぶろうわ はんがかの むなかた しこうお、まだ うれない ころから ささえました。
  - speaker: reimu
    text: 民芸運動を始めた柳宗悦や、陶芸家の浜田庄司とも親しくしました。
    reading: みんげい うんどうお はじめた やなぎ むねよしや、とうげいかの はまだ しょうじとも したしく しました。
- id: ch2_kojo2
  title: 飛行機のエンジン
  background: kb_kojo2
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: kouin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1941年、工場を大阪の城東区へ移します。
    reading: せんきゅうひゃく よんじゅういちねん、こうじょうお おおさかの じょうとうくえ うつします。
  - speaker: reimu
    text: 作ったのは、軍用機のエンジンを取り付けるための小さなクレーンでした。
    reading: つくったのわ、ぐんようきの えんじんお とりつける ための ちいさな くれーんでした。
  - speaker: kouin
    emotion: surprised
    text: 社長！ 飛行機の工場から、また注文です！
  - speaker: zundamon
    emotion: thinking
    text: エンジンは重いのに、ぴったりの位置に下ろさなきゃいけない。
  - speaker: kouin
    emotion: thinking
    text: 少しでもずれたら、ボルトの穴が合いませんからね。
  - speaker: zundamon
    emotion: happy
    text: だから、ゆっくり細かく動くクレーンを作る。
- id: ch2_sengo
  title: 炭鉱の機械
  background: kb_jimusho
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: kouin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 戦争が終わると、保三郎は炭鉱の機械の研究会を作ります。
    reading: せんそうが おわると やすざぶろうわ たんこうの きかいの けんきゅうかいお つくります。
  - speaker: kouin
    emotion: surprised
    text: 社長、今度は炭鉱ですか。
  - speaker: zundamon
    emotion: normal
    text: 石炭を掘らなきゃ、工場も汽車も動かないからな。
- id: ch2_tako
  title: 歓喜木
  background: kb_fudo
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: happy}
  - {who: munakata, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 昭和20年代。保三郎は棟方志功を、栃木の実家に招きます。
    reading: しょうわ にじゅうねんだい。やすざぶろうわ むなかた しこうお とちぎの じっかに まねきます。
  - speaker: reimu
    text: 多功の不動尊は、保三郎が昭和10年代に私財で直したお堂です。
    reading: たこうの ふどうそんわ、やすざぶろうが しょうわ じゅうねんだいに しざいで なおした おどうです。
  - speaker: zundamon
    emotion: happy
    text: 棟方さん。ここなら静かで、版画に打ち込めるだろう。
  - speaker: munakata
    emotion: happy
    text: ありがとうございます。……あの大きな木は、何の木です？
  - speaker: zundamon
    emotion: normal
    text: 榎だ。子どものころから、ずっとここに立ってる。
  - speaker: munakata
    emotion: surprised
    text: 枝が、両手を上げて喜んでるみたいだ。
  - speaker: munakata
    emotion: happy
    text: この木は、歓喜木です。今日から、そう呼びましょう。
  - speaker: zundamon
    emotion: surprised
    text: 人の家の木に、もう名前を付けたのだ。
    beat: true
  - speaker: reimu
    text: 棟方は長く逗留し、この榎を歓喜木と名付けました。
    reading: むなかたわ ながく とうりゅうし、この えのきお かんきぼくと なづけました。
- id: ch2_kiyomoto
  title: 清元の声
  background: kb_hotel
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: tsumugi, x: 0.7, tag: 小堀艶子, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1959年11月。保三郎は、帝国ホテルで清元を披露します。
    reading: せんきゅうひゃく ごじゅうきゅうねん じゅういちがつ。やすざぶろうわ ていこく ほてるで きよもとお ひろう します。
  - speaker: tsumugi
    emotion: normal
    text: あなた、そろそろ出番ですよ。
  - speaker: zundamon
    emotion: happy
    text: '[艶子|つやこ]、今日の声はばっちりだ。'
  - speaker: tsumugi
    emotion: thinking
    text: 三味線に合わせて語る清元は、あなたの一番の楽しみですものね。
  - speaker: zundamon
    emotion: happy
    text: 機械の次に……いや、機械と同じくらい好きだ。
  - speaker: tsumugi
    emotion: happy
    text: 工場の機械の音より、ずっといい声ですよ。
  - speaker: zundamon
    emotion: surprised
    text: ……それは、比べるものじゃないのだ。
    se: zukko
  - speaker: reimu
    text: 短歌も詠み、自作の歌集を2冊残しています。
    reading: たんかも よみ じさくの かしゅうお にさつ のこして います。
- id: ch2_yuzuru
  title: 会社を譲る
  background: kb_jimusho
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: kouin, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
    text: 1957年と1960年、ほかの会社の資本を受け入れるたびに社名が変わります。
    reading: せんきゅうひゃく ごじゅうななねんと せんきゅうひゃく ろくじゅうねん、ほかの かいしゃの しほんお うけいれる たびに しゃめいが かわります。
  - speaker: kouin
    emotion: thinking
    text: 社長。また、看板を掛け替えるんですか。
  - speaker: zundamon
    emotion: normal
    text: 大同輸送機工業の次は、関西輸送機だ。
  - speaker: kouin
    emotion: sad
    text: 名前を覚えたころに、変わりますね。
    beat: true
  - speaker: reimu
    text: 1962年。保三郎は経営権のすべてを、石川島播磨重工業に譲ります。
    reading: せんきゅうひゃく ろくじゅうにねん。やすざぶろうわ けいえいけんの すべてお、いしかわじま はりま じゅうこうぎょうに ゆずります。
  - speaker: kouin
    emotion: sad
    text: 社長、本当に会社を譲ってしまうんですか。
  - speaker: zundamon
    emotion: normal
    text: ああ。クレーンは、もう任せられる人がいる。
  - speaker: kouin
    emotion: thinking
    text: じゃあ社長は、これから何をするんです？
  - speaker: zundamon
    emotion: happy
    text: 思いついたアイデアを、形にする仕事だ。
  - speaker: kouin
    emotion: surprised
    text: 62歳で、一から始めるんですか。
  - speaker: zundamon
    emotion: happy
    text: アイデアに、歳は関係ないのだ。
  - speaker: kouin
    emotion: thinking
    text: ……その元気、少し分けてほしいです。
    beat: true
- id: card1962
  title: ''
  background: kb_card_1962
  cuts:
  - speaker: reimu
    text: 1962年。保三郎は東京の伊皿子で、新しい仕事場を開きます。
    reading: せんきゅうひゃく ろくじゅうにねん。やすざぶろうわ とうきょうの いさらごで あたらしい しごとばお ひらきます。
- id: ch3_gic
  title: グッドアイデアセンター
  background: kb_gic
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: tsumugi, x: 0.7, tag: 小堀艶子, emotion: normal}
  cuts:
  - speaker: reimu
    text: 住まいの近く、玉鳳寺の境内にある木造の一軒家を借りました。
    reading: すまいの ちかく、ぎょくほうじの けいだいに ある もくぞうの いっけんやお かりました。
