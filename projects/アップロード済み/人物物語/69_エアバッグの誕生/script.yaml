  - speaker: zundamon
    emotion: happy
    text: 発明は、台所でも始まるのだ。
  - speaker: tsumugi
    emotion: normal
    text: ただ、どちらも圧縮空気でふくらませる仕組みで実用にはならなかったの。
  - speaker: tsumugi
    emotion: normal
