# comsn-origuchi 読み台帳（人名・地名・社名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|ヨミ] タグ（カタカナ）を付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 折口会長・折口雅博 / label: 樋口社長・県の課長・都の担当 ほか）・テロップ・章タイトルは表示専用なのでタグを付けていない。
#
# 2026-11-14 台本を書いたあと、セリフ全行（約180行）を VOICEVOX の audio_query にかけた結果:
# - 折口・樋口・姫路・豊岡 はタグなしでも オリグチ・ヒグチ・ヒメジ・トヨオカ と読むが、発注書どおりカタカナのタグにした
#   （タグありでも区切りは変わらない：オリグチニ/ツヨクススメタ、ヒグチノ/ホオカラ、ヒメジノ/ジギョオショノ、トヨオカノ/ジギョオショガ）。
# - 「重い十字架」の 重い は タグなしで オモイ/ジュウジカダ（オモイと読む。タグは付けていない）。
# - 連座制＝レンザセエ、廃止届＝ハイシトドケ、廃業届＝ハイギョオトドケ、聴聞＝チョオモン、経団連＝ケエダンレン、
#   邪心＝ジャシン、利得行為＝リトクコオイ、地域包括支援センター＝チイキホオカツシエンセンタア、指定＝シテエ、
#   欠格＝ケッカク、介護予防＝カイゴヨボオ、ケアマネジャー＝ケアマネジャア は タグなしで正しく読むので台帳に入れていない
#   （入れるとセリフの全出現にタグが要り、タグを重ねると抑揚が切れる。[連座制|レンザセイ] は レンザセイ になった）。
# - 「休止・廃止予定日の１月前」の １月前 は タグなしだと イチガツ/マエ。gendai の行は [１月前|ひとつきまえ] で ヒトツキマエマデニ と1語。
#   締めの行は原文の引用ではないので「1か月前」と書いた（イッカゲツ/マエマデニ）。どちらも文脈で読みが変わるので台帳には入れていない。
# - 本文で直したもの（台帳には入れない）:
#   ・「この先どうなるんだ」が コノ/センド/ウナル → 「これからどうなるんだ」
#   ・「何の日付」が ナニノ → [何|なん]の
# - 日本シルバーサービス は タグなしで ニッポンシルバアサアビス。会社の読み（にほん／にっぽん）を確かめられなかったので、
#   セリフにもナレにも名前を出していない（「同じグループの老人ホームの会社」と言った）。
# - 祖業（ソギョオ）もタグなしで正しく読むので台帳に入れていない（ナレは reading: で読む）。
# - 「金」はカネと読ませる1か所（ronso2「お[金|かね]」）にタグを付けた。
# 2026-11-14 見直し（og_fix.md）で直した・足したセリフ約20行も audio_query にかけた。誤読なし
#   （4日後＝ヨッカゴ、2つの申請書＝フタツノ/シンセエショ、適切＝テキセツ、一律に＝イチリツニ、組織的＝ソシキテキ、
#    書き直された＝カキナオサレタ、グループ内＝グルウプナイ、実質的に＝ジッシツテキニ、回避＝カイヒ、2024年＝ニセン/ニジュウ/ヨネン、
#    次の法律＝ツギノ/ホオリツ）。新しく台帳に入れる語は無い。
#   ナレの直し（3月23日・4月12日の説明会・5月の廃止届・会社に言い添えた・6月12日の午後・辞めない考え・役員報酬の1年間の辞退・
#   子会社の所属を移す準備）は reading: のひらがなで書き、助詞は わ・お・え、読点は1文に1個まで。
