scenes:
# ---- 先出し（2007年6月8日15時〜・六本木ヒルズ34階の会見。J-CAST 2007-06-08 の抜き出し） ----
# 「結果的に」は記者の「それは、処分逃れを指示した、と思われて仕方ないでしょ」（記事の「」）への答え。
# 「それは」が指すのは、樋口が明かした「処分に備え、子会社の所属を移すなど事前に準備していたこと（会長も知っていた）」。
# 「チャンスを」は報酬辞退について問われた別の答え（記事では先に出る）。ナレで場面を分け、同じ問いの答えに見せない。
- id: co_kaiken
  title: ''
  background: og_kaiken
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 折口会長, emotion: sad}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2007年6月8日、六本木ヒルズ。訪問介護の最大手コムスンの親会社の会長、折口雅博、45歳の会見です。
    reading: にせん ななねん ろくがつ ようか、ろっぽんぎ ひるず。ほうもん かいごの さいおおて こむすんの おやがいしゃの かいちょう おりぐち まさひろ、よんじゅうごさいの かいけんです。
  - speaker: reimu
    text: 処分に備えた準備を、会長も知っていた。記者が詰め寄ります。
    reading: しょぶんに そなえた じゅんびお、かいちょうも しって いた。きしゃが つめよります。
  - speaker: kisha
    emotion: normal
    text: それは処分逃れを指示した、と思われて仕方ないでしょ
  - speaker: zundamon
    emotion: sad
    text: ……結果的にそう見られるかもしれない
  - speaker: reimu
    text: 報酬の辞退を問われた場面では、こう頼んでいます。
    reading: ほうしゅうの じたいお とわれた ばめんでわ、こう たのんで います。
  - speaker: zundamon
    emotion: sad
    text: チャンスをお与えください
  - speaker: reimu
    text: 5月末、コムスンの介護の事業所は全国に2,081。12月までに、その事業はすべて別の会社へ移ります。
    reading: ごがつまつ、こむすんの かいごの じぎょうしょわ ぜんこくに にせん はちじゅういち。じゅうにがつ までに、その じぎょうわ すべて べつの かいしゃえ うつります。
# ---- 今の部屋（部の名簿） ----
- id: hook
  title: ''
  background: og_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 部員が足りないから、名簿にお兄ちゃんの名前も書いたのだ！
    se: jaan
  - speaker: tsumugi
    emotion: thinking
    text: お兄ちゃん、その部に来たことある？
  - speaker: zundamon
    emotion: sad
    text: ……一度もないのだ。
    beat: true
  - speaker: tsumugi
    emotion: thinking
    text: それと同じことが、介護の事業所の申請書で見つかったの。
  - speaker: tsumugi
    emotion: normal
    text: 見つかったのは8つの事業所。でも手放したのは、2,000か所あまりよ。
    telops:
    - {text: "偽りの申請で　なぜ2,081か所を手放した？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 8つで2,000！？ なんで！？
# ---- 1991年・湾岸の倉庫（本人の当時の台詞は無いので喋らせない。店の意匠は描かない） ----
- id: card1991
  title: ''
  background: og_card_1991
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1991年5月、東京・芝浦。湾岸の倉庫が、ディスコに変わります。
    reading: せん きゅうひゃく きゅうじゅういちねん ごがつ、とうきょう しばうら。わんがんの そうこが でぃすこに かわります。
- id: ch1_disco
  title: ディスコから介護へ
  background: og_soko
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 折口雅博, emotion: happy}
  cuts:
  - speaker: reimu
    text: 企画したのは、商社の日商岩井の社員、折口雅博。29歳でした。
    reading: きかく したのわ、しょうしゃの にっしょう いわいの しゃいん おりぐち まさひろ。にじゅうきゅうさい でした。
  - speaker: reimu
    text: 店の名前はジュリアナ東京。彼は、その仕掛け人と呼ばれます。
    reading: みせの なまえわ じゅりあな とうきょう。かれわ その しかけにんと よばれます。
    background: og_disco
  - speaker: reimu
    text: 4年後、彼は人を送る会社、グッドウィルを始め、介護のコムスンを傘下に入れていきます。
    reading: よねんご かれわ ひとお おくる かいしゃ ぐっどうぃるお はじめ、かいごの こむすんお さんかに いれて いきます。
# ---- 2000年4月1日・同じ日に1,200あまり（1,208と1,217の2説なので「あまり」） ----
- id: card2000
  title: ''
  background: og_card_2000
  cuts:
  - speaker: reimu
    text: 2000年4月1日。介護保険が始まった日です。
    reading: にせんねん しがつ ついたち。かいご ほけんが はじまった ひです。
- id: ch2_care
  title: 1,200あまりの朝
  background: og_care
  stage:
  - {who: kanrisha, x: 0.28, flip: true, emotion: happy}
  - {who: helper, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: この日コムスンは、全国で1,200あまりの事業所を一斉に開きます。会長兼社長は、折口でした。
    reading: この ひ こむすんわ、ぜんこくで せん にひゃく あまりの じぎょうしょお いっせいに ひらきます。かいちょう けん しゃちょうわ おりぐち でした。
    telops:
    - {text: "同じ日に1,200あまり", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: helper
    emotion: happy
    text: 全国で一斉に、ですか。広告もすごかったですね！
  - speaker: kanrisha
    emotion: happy
    text: うちもその1つよ。最初に、覚えてほしいことがあるの。
  - speaker: kanrisha
    emotion: normal
    text: 事業所は1か所ずつ、県の指定を受ける。ヘルパーの数にも決まりがある。
  - speaker: helper
    emotion: normal
    text: 申請書に書いた人が、ちゃんとここで働く。そういう決まりですね。
  - speaker: kanrisha
    emotion: normal
    text: そう。それと、お客さんが払うのは1割。残りは保険から出るの。
  - speaker: helper
    emotion: surprised
    text: 1万円のお世話なら、お客さんは1,000円！？
  - speaker: kanrisha
    emotion: normal
    text: そう。9,000円は、みんなの保険料と税金よ。
  - speaker: helper
    emotion: thinking
    text: でも、そのお客さんがまだ1人も……
    se: tenten
  - speaker: reimu
    text: 7年後、ある事業所の申請書のヘルパーが、そこで働いていなかったと分かります。
    reading: ななねんご、ある じぎょうしょの しんせいしょの へるぱーが そこで はたらいて いなかったと わかります。
# ---- 2000年6月・4割を閉じる（ヘルパーの側から。2007年の不正の原因とは言わない） ----
- id: ch2_oshirase
  title: 2か月半で4割を閉じる
  background: og_care
  stage:
  - {who: kanrisha, x: 0.28, flip: true, emotion: sad}
  - {who: helper, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 6月、利用者が2人以下の事業所を、統合して閉じると決まります。全体のおよそ4割です。
    reading: ろくがつ、りようしゃが ふたり いかの じぎょうしょお とうごう して とじると きまります。ぜんたいの およそ よんわりです。
  - speaker: kanrisha
    emotion: sad
    text: このセンターも、統合されることになったわ。
    background: og_care_oshirase
  - speaker: helper
    emotion: surprised
    text: 開いて、まだ2か月半ですよ！？
  - speaker: kanrisha
    emotion: sad
    text: 社員には退職か都市部への異動かを選んでもらう、と……
  - speaker: helper
    emotion: sad
    text: 毎週うかがってるおばあちゃんに、なんて言えば……。
  - speaker: kanrisha
    emotion: sad
    text: 近くの事業所に、引き継ぐことになると思う。
  - speaker: helper
    emotion: sad
    text: ……わたしは、どこへ行けば。
    beat: true
  - speaker: reimu
    text: 開くのも閉じるのも、速い会社でした。
    reading: ひらくのも とじるのも、はやい かいしゃでした。
# ---- 2004〜2005年・最大手へ（豪邸・車・ジェットは出さない） ----
- id: ch3_tower
  title: 訪問介護の最大手へ
  background: og_tower
  stage:
  - {who: zundamon, x: 0.25, flip: true, tag: 折口会長, emotion: happy}
  cuts:
  - speaker: reimu
    text: 2004年、グループは東証一部へ。折口は経団連の理事になり、コムスンはやがて訪問介護の最大手に。
    reading: にせん よねん ぐるーぷわ とうしょう いちぶえ。おりぐちわ けいだんれんの りじに なり、こむすんわ やがて ほうもん かいごの さいおおてに。
  - speaker: reimu
    text: 2006年4月、法律が変わります。1か所の不正で、同じ会社の全部の事業所の更新が止まる。
    reading: にせん ろくねん しがつ、ほうりつが かわります。いっかしょの ふせいで おなじ かいしゃの ぜんぶの じぎょうしょの こうしんが とまる。
# ---- 2006年4月・1つの不正で、全部（役所の会議室のモブで見せる。つむぎの解説で済ませない） ----
- id: ch4_law
  title: 1か所の不正で、全部
  background: og_kaigi
  bgm: kinakusai
  stage:
  - {who: kacho, x: 0.28, flip: true, emotion: normal}
  - {who: kansa2, x: 0.7, emotion: normal}
  cuts:
  - speaker: kacho
    emotion: normal
    text: 事業所の指定に、6年の期限ができた。更新がいる。
  - speaker: kansa2
    emotion: normal
    text: 運転免許みたいですね。
  - speaker: kacho
    emotion: normal
    text: 免許と違うのは、ここからだ。
  - speaker: kacho
    emotion: normal
    text: 1か所の不正で、同じ会社の全部が更新できない。今年からそうなった。
  - speaker: kansa2
    emotion: surprised
    text: 全国に事業所がある会社でも、ですか！？
  - speaker: kacho
    emotion: normal
    text: 1か所でも、だ。新しい指定も受けられない。
    se: don
    telops:
    - {text: "全事業所の更新が止まる", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: kansa2
    emotion: thinking
    text: じゃあ、不正の見つかった事業所を先に閉じてしまったら……
  - speaker: kacho
    emotion: thinking
    text: 閉じた事業所は、取り消しようがないな。
  - speaker: reimu
    text: このころ、事業所を閉じる届けは、閉じたあと10日以内に出せばよい決まりでした。
    reading: この ころ じぎょうしょお とじる とどけわ、とじた あと とおか いないに だせば よい きまりでした。
# ---- 2007年2〜3月・重い十字架（J-CAST 4/11：3月23日の朝の廃業届の提出のときのやりとり。相手は都側＝都の担当とだけ） ----
- id: ch5_jujika
  title: 重い十字架
  background: og_kencho
  stage:
  - {who: higuchi, x: 0.28, flip: true, emotion: normal}
  - {who: tonin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2007年2月。東京都は、銀座など3つの事業所に、不正を前提とした監査に入ります。
    reading: にせん ななねん にがつ。とうきょうとわ ぎんざなど みっつの じぎょうしょに、ふせいお ぜんてい とした かんさに はいります。
  - speaker: reimu
    text: 3月23日、監査の結果を伝えるため、都が社長らを呼んだ日。その朝、3つの事業所の廃止届が出されます。
    reading: さんがつ にじゅうさんにち、かんさの けっかお つたえる ため とが しゃちょうらお よんだ ひ。その あさ、みっつの じぎょうしょの はいしとどけが だされます。
  - speaker: tonin
    emotion: normal
    text: 廃業届の提出は、社会から処分逃れと見られますよ。
  - speaker: higuchi
    emotion: normal
    text: 指定取り消しはあまりに重い十字架だ。どうしても出させてほしい
    telops:
    - {text: "樋口社長「あまりに重い十字架だ」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: tonin
    emotion: sad
    text: ……閉じられたら、取り消しはできない。
  - speaker: reimu
    text: 都はのちに、3か所が偽りの申請で受け取った報酬を、4,320万円あまりとします。
    reading: とわ のちに、さんかしょが いつわりの しんせいで うけとった ほうしゅうお よんせん さんびゃく にじゅうまんえん あまりと します。
# ---- 2007年4月・業界そのものの体質（コムスンだけにしない場面。主人公は出さない） ----
- id: ch6_taishitsu
  title: 業界そのものの体質
  background: og_kaigi
  stage:
  - {who: bucho, x: 0.5, emotion: normal}
  cuts:
  - speaker: reimu
    text: 4月12日の都の説明会。コムスンと同じく、ニチイ学館とジャパンケアサービスも改善勧告を受けていました。
    reading: しがつ じゅうににちの とのせつめいかい。こむすんと おなじく、にちい がっかんと じゃぱん けあ さーびすも かいぜん かんこくお うけて いました。
  - speaker: bucho
    emotion: normal
    text: 大手３社がそろって改善勧告を受けた。業界そのものの体質が問われている。
  - speaker: reimu
    text: 国も、全国に事業所を持つ会社の監査を、都道府県に求めました。
    reading: くにも ぜんこくに じぎょうしょお もつ かいしゃの かんさお、とどうふけんに もとめました。
# ---- 2007年4〜5月・弘前と豊岡（県の監査のモブ。ヘルパーを不正の主語にしない） ----
- id: ch7_aomori
  title: 弘前と豊岡
  background: og_kencho
  bgm: serious
  cuts:
  - speaker: reimu
    text: 4月、青森県の弘前。申請書のヘルパーは雇用の実態が確かめられず、5月、聴聞の準備中に廃止届が出ます。
    reading: しがつ、あおもりけんの ひろさき。しんせいしょの へるぱーわ こようの じったいが たしかめられず、ごがつ ちょうもんの じゅんびちゅうに はいしとどけが でます。
- id: ch7_toyooka
  title: ''
  background: og_jigyosho
  stage:
  - {who: kansa1, x: 0.22, flip: true, emotion: normal}
  - {who: kansa2, x: 0.46, emotion: normal}
  cuts:
  - speaker: reimu
    text: 5月21日、兵庫県の豊岡。県の監査が、コムスンの事業所に入ります。
    reading: ごがつ にじゅういちにち、ひょうごけんの とよおか。けんの かんさが こむすんの じぎょうしょに はいります。
  - speaker: kansa1
    emotion: normal
    text: 申請は去年の12月7日。指定は、1月1日か。
  - speaker: kansa2
    emotion: normal
    text: 申請書では、ヘルパーは3人。でも……
