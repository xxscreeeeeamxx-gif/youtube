meta:
  title: コムスン親会社の会長「結果的にそう見られるかもしれない」、介護の事業はすべて他社へ【ずんだもん解説】
  slug: comsn-origuchi
  hook_line: 申請書の偽りで、なぜ2,081の事業所が手放されることになったのか。
  summary: 2007年6月8日、訪問介護の最大手コムスンの親会社の会長・折口雅博は、六本木ヒルズの会見で「チャンスをお与えください」と語りました。介護保険が始まった日に、全国1,200あまりの事業所を一斉に開いた会社。申請書に名前のあったヘルパーは、どこで働いていたのか。処分の前に閉じた事業所は、何を守ろうとしたのか。国の資料と会見の言葉をもとに、行政・会社・本人の言い分を主語つきで並べ、再現ドラマでたどります。（2026年11月時点）
