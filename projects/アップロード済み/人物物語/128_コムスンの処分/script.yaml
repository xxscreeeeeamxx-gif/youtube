    reading: おりぐち ほんにんわ、けいじの つみに とわれて いません。しちがつ さんじゅういちにち、ぐっどうぃるわ じぎょうお やめました。
  - speaker: haken
    emotion: sad
    text: 毎日7,000人も、この会社から仕事に出てたのに……。
  - speaker: haken
    emotion: sad
    text: ……会社ごと、なくなった。
    se: gaan
  - speaker: haken
    emotion: thinking
    text: ハローワークで、相談に乗ってくれるらしい。行ってみるか。
