# ---- 論争1：ヘルパーのせい？ ----
- id: ronso1
  title: ヘルパーのせい？
  background: og_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: なくなったことが残念、か……。
  - speaker: tsumugi
    emotion: normal
    text: コムスンの会社は、2009年の暮れに解散したの。いまはもう無いわ。
  - speaker: zundamon
    emotion: thinking
    text: 看板が変わっても、事業所は続いたのに……。
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ 現場のヘルパーがズルをして、会社が潰れたって！
  - speaker: tsumugi
    emotion: normal
    text: そう見える事実はあるの。不正は、各地の事業所の申請で見つかったわ。
  - speaker: zundamon
    emotion: angry
    text: ほら、やっぱり！
  - speaker: tsumugi
    emotion: thinking
    text: でも処分の根拠は、申請書に書いた人の数。ヘルパーの仕事ぶりじゃないの。
    se: tsukkomi
  - speaker: zundamon
    emotion: surprised
    text: 人の数！？
  - speaker: tsumugi
    emotion: normal
    text: 都の勧告にあったのも、管理者や責任者が足りないという配置の話よ。
  - speaker: tsumugi
    emotion: normal
    text: 廃止届は、社長が自分で指示したと会見で言ったわね。
  - speaker: tsumugi
    emotion: normal
    text: 国の会議も、偽りの申請は組織的に行われていたとみられると書いたの。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、ヘルパーさんたちは……
  - speaker: tsumugi
    emotion: normal
    text: 多くの事業所とヘルパーが、別の会社の名前で利用者の家に通い続けたの。
  - speaker: tsumugi
    emotion: thinking
    text: 問われたのは、ヘルパーの手の中ではなく申請書と廃止届の上のことだったの。
  - speaker: zundamon
    emotion: sad
    text: 書類の上のこと、だったのか……。
    beat: true
# ---- 論争2：8か所で全部は重すぎた？ ----
- id: ronso2
  title: 8か所で全部は重すぎた？
  background: og_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: でも8か所の不正で2,000か所なんて、重すぎるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 国の会議は、コムスンへの処分を法の趣旨に沿った適切な対応だったと評価したの。
    se: hammer
  - speaker: zundamon
    emotion: surprised
    text: 適切！？
  - speaker: tsumugi
    emotion: thinking
    text: 偽りの申請が、組織的に行われていたとみられたからよ。
  - speaker: tsumugi
    emotion: normal
    text: 報酬を返す先は、保険を運営する市町村。全国で12億円あまりよ。
  - speaker: zundamon
    emotion: thinking
    text: 1万円のお世話の、9,000円の側のお[金|かね]……。
  - speaker: tsumugi
    emotion: normal
    text: ただ同じ会議は、問題点の1つにこんなことも書いたの。
  - speaker: tsumugi
    emotion: normal
    text: 組織的に不正をしていない会社まで、1か所の取り消しで一律に止めていいのか。
  - speaker: tsumugi
    emotion: normal
    text: 行為と制裁の均衡という観点から妥当なものか
  - speaker: zundamon
    emotion: thinking
    text: 組織的じゃない会社の話なのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 重いか軽いかは、国の会議でも議論になった。そして、ルールの方が書き直されたの。
  - speaker: zundamon
    emotion: surprised
    text: ルールの方が！？
