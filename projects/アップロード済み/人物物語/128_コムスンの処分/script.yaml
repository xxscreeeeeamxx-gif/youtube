  - 衆議院「コムスン問題に関する質問に対する答弁書」（内閣衆質一六八第二二七号・2007年11月22日） https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b168227.htm
  - 厚生労働省「平成２１年５月1日から介護保険法が変わります」（リーフレット） https://www.city.awaji.lg.jp/uploaded/attachment/12205.pdf
