  - speaker: tsumugi
    emotion: normal
    text: 本人の振り返りだから、本人の見方として聞いてね。
  - speaker: tsumugi
    emotion: normal
    text: 液晶で勝って、同じやり方を大きくしたところでつまずいたの。
  - speaker: tsumugi
    emotion: thinking
    text: パネルにはお[金|かね]が足りず、家電などで稼いだ[分|ぶん]もパネルに回る。
  - speaker: tsumugi
    emotion: thinking
    text: どっちも育たない。会社はそれを、[負|フ]のサイクルと書いてるの。
  - speaker: zundamon
    emotion: thinking
    text: いちばん成功した工場が、重い荷物になったわけだ。
