    emotion: normal
    text: シャープ自身も2025年に、市場の変化への対応が遅れたと書いてる。
  - speaker: tsumugi
    emotion: normal
    text: '[町田|まちだ]元社長は2024年の取材で、社長だった2000年ごろの口癖を振り返ってるわ。'
  - speaker: tsumugi
    emotion: normal
    text: 液晶が続くのは2010年ぐらいまで、ってね。
