  - speaker: tsumugi
    emotion: normal
    text: 作り方も、一緒に渡してね。
  - speaker: zundamon
    emotion: thinking
    text: 盗まれたんじゃなくて、流れていった……。
  - speaker: tsumugi
    emotion: normal
    text: どこの国が悪い、って話じゃないの。
- id: chui
  title: テレビを買う人へ
  background: sh_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: テレビは同じ大きさなら、毎年のように安くなる。
  - speaker: zundamon
    emotion: happy
    text: 安くなるのは、うれしいのだ。
  - speaker: tsumugi
    emotion: normal
    text: 買う側には、うれしい話よ。
  - speaker: tsumugi
    emotion: thinking
    text: でも作る側は値段が下がっても、大きな工場をなかなか止められないの。
  - speaker: tsumugi
    emotion: normal
    text: パネルそのものが、半年で5割ほど安くなったこともあるわ。
  - speaker: zundamon
    emotion: surprised
    text: じゃあ、買ったばかりのボクのテレビは……。
  - speaker: tsumugi
    emotion: normal
    text: 急がないなら、少し待つのも手ね。
  - speaker: zundamon
    emotion: sad
    text: もう買っちゃったのだ。
    se: shobon
  - speaker: tsumugi
    emotion: normal
    text: それと国内でテレビ向けのパネルを作る拠点は、2024年8月からゼロよ。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、ボクのテレビのパネルは……。
  - speaker: tsumugi
    emotion: normal
    text: 国内では作られていないの。
  - speaker: tsumugi
    emotion: normal
    text: 修理の部品は、液晶テレビの製造打ち切りから8年保有するとシャープは書いてるわ。
  - speaker: zundamon
    emotion: thinking
    text: 親会社が変わっても？
  - speaker: tsumugi
    emotion: normal
    text: 買ったテレビの修理の窓口は、シャープよ。無料の保証は1年ね。
  - speaker: tsumugi
    emotion: thinking
    text: もうひとつ。大きな工場が来る町は、補助金と税と仕事がまとめて動くの。
  - speaker: tsumugi
    emotion: normal
    text: 亀山市は2011年度まで、国の交付税がいらない町だったわ。
  - speaker: zundamon
    emotion: thinking
    text: 工場ひとつで、町の財布まで変わるのか。
