  - speaker: tsumugi
    emotion: thinking
    text: そうは言えないわ。
  - speaker: tsumugi
    emotion: normal
    text: 当時の[沖津|おきつ]社長は、[鴻海|ほんハイ]側にメリットが出ないとの判断に至ったと説明したの。
  - speaker: zundamon
    emotion: thinking
    text: 乗っ取りでも、見捨てたでもない。親会社との取引が多い会社なんだ。
- id: ronso2
