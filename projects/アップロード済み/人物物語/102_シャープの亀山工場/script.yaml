meta:
  title: 「亀山のテレビをください」と指名買いされたシャープの工場、22年後に売り先が決まらない【ずんだもん解説】
  slug: sharp-kameyama
  hook_line: 世界の亀山は、なぜ自分の工場を売れなくなったのか。
  summary: 2004年、店頭で「亀山のテレビをください」と名指しで買われたシャープの亀山工場。畳ほどのガラスからテレビまで同じ敷地で作る仕組みは、どこで重い荷物に変わったのか。2003年入社の液晶技術者（架空の人物）の目で、堺の巨大工場、初めての赤字、鴻海の出資、そして第2工場の行方を、会社の発表と経営者の公の発言をもとに再現ドラマでたどります。（2026年10月時点）
  sources:
  - シャープ 社史「第10章 2004〜2006 大型液晶テレビ“アクオス”亀山モデルの誕生」 https://corporate.jp.sharp/info/history/h_company/pdf_jp/chapter10.pdf
  - シャープ 社史「第11章 2007〜2011」 https://corporate.jp.sharp/info/history/h_company/pdf_jp/chapter11.pdf
  - シャープ「FY2024決算及びFY2025-2027中期経営計画」（2025年5月12日） https://corporate.jp.sharp/ir/event/policy_meeting/pdf/25meeting_j_nt.pdf
  - シャープ「2026年3月期 第3四半期 決算説明資料」（2026年2月10日） https://corporate.jp.sharp/ir/library/financial/pdf/2026/3/2603_3pre_nt.pdf
  - シャープ「2025年度決算及び中期経営計画の進捗状況」（2026年5月12日） https://corporate.jp.sharp/ir/event/policy_meeting/pdf/26meeting_j_nt.pdf
  - 日本経済新聞「シャープ、亀山工場の生産終了を12月に延期」（2026年5月12日） https://www.nikkei.com/article/DGXZQOUF126G50S6A510C2000000/
  tags:
  - シャープ
  - 亀山工場
  - 液晶
  - アクオス
  - 鴻海
  - 堺
  - 垂直統合
  - 液晶テレビ
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 平成史
