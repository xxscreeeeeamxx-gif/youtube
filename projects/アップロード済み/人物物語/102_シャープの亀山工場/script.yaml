scenes:
# ---- 先出し（2026年2月10日・売却の不成立） ----
- id: co_fuseiritsu
  title: ''
  background: sh_kojo
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 技術者, emotion: thinking}
  - {who: doki, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 2026年2月10日。三重県亀山市、シャープの液晶工場です。
    reading: にせん にじゅうろくねん にがつ とおか。みえけん かめやまし、しゃーぷの えきしょう こうじょうです。
  - speaker: doki
    emotion: thinking
    text: '[鴻海|ほんハイ]に第2工場を売る話、まとまらなかったってさ。'
  - speaker: zundamon
    emotion: surprised
    text: え？ 買いたいって言ってきたのは、[鴻海|ほんハイ]なのに？
  - speaker: doki
    emotion: thinking
    text: 第2工場は8月をめどに止める。希望退職も約1170人募るって。
  - speaker: zundamon
    emotion: sad
    text: ……ボク、2003年からここにいるんだけど。
  - speaker: reimu
    text: 2004年には、亀山のテレビをくださいと名指しで買われた工場です。
    reading: にせん よねんにわ、かめやまの てれびお くださいと なざしで かわれた こうじょうです。
  - speaker: reimu
    text: 世界の亀山は、なぜ自分の工場を売れなくなったのでしょう。
    reading: せかいの かめやまわ、なぜ じぶんの こうじょうお うれなく なったのでしょう。
    telops:
    - {text: "世界の亀山は、なぜ売れなくなった？", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
# ---- 今の部屋（大きなテレビ） ----
- id: hook
  title: ''
  background: sh_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ シャープの大きいテレビを買ったのだ！
  - speaker: tsumugi
    emotion: normal
    text: 2004年、亀山製の32型は53万円だったのよ。
  - speaker: zundamon
    emotion: surprised
    text: 53万円！？
    se: bikkuri
  - speaker: tsumugi
    emotion: normal
    text: 2021年の店頭だと、シャープは1インチ1600円前後。32型なら5万円ほどね。
  - speaker: zundamon
    emotion: thinking
    text: '[10分の1|じゅうぶんのいち]……。'
  - speaker: tsumugi
    emotion: thinking
    text: 値下がりの中で、いちばん成功した工場がいちばん重い荷物になったの。
# ---- 2003年・パネルの建物 ----
- id: card2003
  title: ''
  background: sh_card_2003
  bgm: curious
  cuts:
  - speaker: reimu
    text: 2003年春。稼働を前にした亀山工場に、新人の技術者が配属されます。
    reading: にせん さんねん はる。かどうお まえに した かめやま こうじょうに、しんじんの ぎじゅつしゃが はいぞく されます。
- id: ch1_glass
  title: 畳ほどのガラス
  background: sh_kojo
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 技術者, emotion: normal}
  - {who: senpai, x: 0.7, emotion: normal}
  cuts:
  - speaker: senpai
    emotion: normal
    text: 新人、これがマザーガラスだ。畳ほどある。
  - speaker: senpai
    emotion: normal
    text: この1枚から、32型のパネルが一度に8枚取れる。
    telops:
    - {text: "32型が一度に8枚", size: lg, position: top-right, color: "#9AD8FF", stroke: "#0A1A2A", glow: "#2A6AFF", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 8枚！？ 1枚ずつ作るんじゃないんですね。
  - speaker: senpai
    emotion: normal
    text: ガラスが大きいほど、パネル1枚あたりは安くなるんだ。
  - speaker: zundamon
    emotion: happy
    text: 大きいピザのほうが、ひと切れ安いのと同じですね！
  - speaker: senpai
    emotion: normal
    text: だから液晶の会社は、もっと大きなガラスの工場を先に建てる競争をしてる。
  - speaker: zundamon
    emotion: thinking
    text: ピザより先に、窯を買う競争……。
  - speaker: senpai
    emotion: thinking
    text: その窯が、とんでもなく高いんだよ。
  - speaker: senpai
    emotion: normal
    text: 装置は買ってきて、うちで手を入れてある。どう直したかは外に見せない。
  - speaker: senpai
    emotion: normal
    text: 会社は、老舗のうなぎ屋の門外不出の秘伝のたれと同じだと考えてる。
  - speaker: zundamon
    emotion: happy
    text: 秘伝のたれ！ ボクにも、門外不出のずんだあんが……。
  - speaker: senpai
    emotion: angry
    text: 持ち込むな。ここはクリーンルームだ。
    se: hammer
  - speaker: senpai
    emotion: normal
    text: この建物は、ここで働く人間しか入れない。事業部長でも簡単じゃない。
  - speaker: senpai
    emotion: normal
    text: できたパネルは、同じ敷地でテレビに組み立てる。
  - speaker: zundamon
    emotion: surprised
    text: パネルからテレビまで、全部ここで？
  - speaker: senpai
    emotion: thinking
    text: 誰も経験したことのない一貫生産だ。立ち上げは苦労の連続だよ。
  - speaker: zundamon
    emotion: happy
    text: うちのパネルで、うちのテレビ。最強なのだ！
  - speaker: reimu
    text: 自分のテレビが売れるあいだは強い仕組み。この仕組みが、のちに亀山を重くします。
    reading: じぶんの てれびが うれる あいだわ つよい しくみ。この しくみが、のちに かめやまお おもく します。
# ---- 2004年1月・発表会と出荷式 ----
- id: card2004
  title: ''
  background: sh_card_2004
  cuts:
  - speaker: reimu
    text: 2004年1月8日。亀山第1工場が本格稼働します。投資は約1000億円でした。
    reading: にせん よねん いちがつ ようか。かめやま だいいち こうじょうが ほんかく かどう します。とうしわ やく せんおくえんでした。
- id: ch1_happyo
  title: 売価は10%下がる
  background: sh_kaiken
  bgm: hirusagari
  stage:
  - {who: okuda04, x: 0.28, flip: true, emotion: normal}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1月26日。亀山で作ったテレビの発表会に、事業本部長の奥田隆司が立ちます。
    reading: いちがつ にじゅうろくにち。かめやまで つくった てれびの はっぴょうかいに、じぎょう ほんぶちょうの おくだ たかしが たちます。
  - speaker: kisha
    emotion: normal
    text: 亀山で一貫生産すると、売り値はどうなりますか。
  - speaker: okuda04
    emotion: normal
    text: '[37V型|サンジュウナナブイガタ]の場合……売価は10%ほど下がる見込み。'
    telops:
    - {text: "奥田本部長「売価は10%ほど下がる見込み」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: kisha
    emotion: thinking
    text: 出す前から、もう値下がりの話……。
    beat: true
- id: ch1_shukka
  title: ''
  background: sh_kojo_soto
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 技術者, emotion: happy}
  - {who: doki, x: 0.56, emotion: normal}
  - {who: senpai, x: 0.78, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1月28日、初出荷。出荷式には、異例なほど多くの報道陣が詰めかけました。
    reading: いちがつ にじゅうはちにち、はつ しゅっか。しゅっかしきにわ いれいな ほど おおくの ほうどうじんが つめかけました。
  - speaker: zundamon
    emotion: happy
    text: テレビ局まで来てる！ ボクのパネルが、全国ニュースなのだ！
  - speaker: doki
    emotion: normal
    text: お前が作ったのは、どのパネルだよ。
  - speaker: zundamon
    emotion: thinking
    text: ……数えたこと、ない。
    se: manuke
  - speaker: zundamon
    emotion: normal
    text: それより先輩。発表会で、売価は1割ほど下がる見込みだそうです。
  - speaker: senpai
    emotion: normal
    text: 液晶テレビの値段は、下がり続けるもんだ。
  - speaker: senpai
    emotion: thinking
    text: 下がった[分|ぶん]は、もっと大きなガラスで取り返す。
  - speaker: zundamon
    emotion: thinking
    text: もっと大きなガラスに、もっと大きな窯……。
  - speaker: reimu
    text: 下がり続ける値段を、もっと大きな工場で追いかける。この追いかけっこは、どこで終わるのでしょう。
    reading: さがりつづける ねだんお もっと おおきな こうじょうで おいかける。この おいかけっこわ どこで おわるのでしょう。
# ---- 亀山が生まれる（1998〜2002年） ----
- id: card1998
  title: ''
  background: sh_card_1998
  bgm: curious
  cuts:
  - speaker: reimu
    text: 出荷式の6年前、1998年8月。社長になったばかりの町田勝彦が、全国11か所の事業所を回ります。
    reading: しゅっかしきの ろくねん まえ、せんきゅうひゃく きゅうじゅうはちねん はちがつ。しゃちょうに なった ばかりの まちだ かつひこが、ぜんこく じゅういっかしょの じぎょうしょお まわります。
- id: ch2_sengen
  title: 夢物語だ
  background: sh_kaigi
  stage:
  - {who: machida, x: 0.28, flip: true, emotion: normal}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: machida
    emotion: normal
    text: 国内で販売するテレビを2005年までに液晶に置き換える。
  - speaker: shain
    emotion: surprised
    text: ……ブラウン管を、全部ですか。
  - speaker: shain
    emotion: thinking
    text: 液晶の事業は、まだ小さくて赤字ですよ。
  - speaker: reimu
    text: 世間の大半は、できるわけがない、夢物語だと否定的でした。社内の技術者たちも、とまどいます。
    reading: せけんの たいはんわ できるわけが ない、ゆめものがたりだと ひていてき でした。しゃないの ぎじゅつしゃたちも とまどいます。
  - speaker: reimu
    text: 半導体と液晶の両方に、投資を続けることはできない。町田は、液晶を選びました。
    reading: はんどうたいと えきしょうの りょうほうに、とうしお つづける ことわ できない。まちだわ えきしょうお えらびました。
  - speaker: reimu
    text: 2001年1月にアクオスを発売。秋には、畳ほどのガラスで32型を8枚取る工場の構想が動き出します。
    reading: にせん いちねん いちがつに あくおすお はつばい。あきにわ たたみ ほどの がらすで、さんじゅうにがたお はちまい とる こうじょうの こうそうが うごきだします。
  - speaker: reimu
    text: 2002年2月。場所は、液晶の三重工場や天理工場に近い亀山に決まりました。
    reading: にせん にねん にがつ。ばしょわ、えきしょうの みえ こうじょうや てんり こうじょうに ちかい かめやまに きまりました。
  - speaker: reimu
    text: テレビを液晶ひとつに絞る一本道。この選び方が、のちの亀山を決めていきます。
    reading: てれびお えきしょう ひとつに しぼる いっぽんみち。この えらびかたが、のちの かめやまお きめて いきます。
# ---- 世界の亀山（2005〜2006年） ----
- id: card2005
  title: ''
  background: sh_card_2005
  bgm: pop
  cuts:
  - speaker: reimu
    text: 2005年3月。亀山で作ったアクオスは、累計100万台に届きます。
    reading: にせん ごねん さんがつ。かめやまで つくった あくおすわ、るいけい ひゃくまんだいに とどきます。
- id: ch3_ryohan
  title: 亀山のテレビをください
  background: sh_ryohan
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 技術者, emotion: happy}
  - {who: kyaku, x: 0.56, emotion: normal}
  - {who: tenin, x: 0.78, emotion: happy}
  cuts:
  - speaker: kyaku
    emotion: normal
    text: すみません。亀山のテレビをください。
  - speaker: tenin
    emotion: happy
    text: はい！ 世界の亀山モデルですね。
  - speaker: tenin
    emotion: normal
    text: 亀山で作ったテレビには、全部その名前が付いてるんです。
  - speaker: zundamon
    emotion: surprised
    text: いま、亀山のテレビって言いました！？
  - speaker: kyaku
    emotion: surprised
    text: 言いましたけど……どちらさま？
  - speaker: zundamon
    emotion: happy
    text: そのパネル、ボクが作ったんです！
  - speaker: kyaku
    emotion: normal
    text: あら。作った人なら、どこがいいのか教えて。
  - speaker: zundamon
    emotion: happy
    text: 畳ほどのガラスから、一度に8枚取れるんです！
  - speaker: kyaku
    emotion: thinking
    text: それ、わたしに関係ある？
  - speaker: zundamon
    emotion: thinking
    text: ……安くなる、かも。
  - speaker: kyaku
    emotion: happy
    text: じゃあ、まけてくださる？
  - speaker: zundamon
    emotion: thinking
    text: それは……店員さんに。
  - speaker: tenin
    emotion: normal
    text: 値札どおりです。
    se: oti
- id: ch3_1pun
  title: 1分に1台
  background: sh_kojo
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 技術者, emotion: normal}
  - {who: senpai, x: 0.7, emotion: happy}
  cuts:
  - speaker: senpai
    emotion: happy
    text: '[1日|いちにち]に約1500枚のガラスを流して、1分に1台テレビが組み上がる。'
  - speaker: zundamon
    emotion: surprised
    text: 1分に1台！？ カップ麺ができるまでに、3台なのだ！
  - speaker: senpai
    emotion: normal
    text: '[歩留まり|ぶどまり]も、動き出して半年あまりで約90%だ。'
  - speaker: zundamon
    emotion: thinking
    text: ぶどまり？
  - speaker: senpai
    emotion: normal
    text: 作ったパネルのうち、ちゃんと使える物の割合だ。
  - speaker: zundamon
    emotion: happy
    text: 10枚焼いたら、9枚おいしいクッキーですね。
  - speaker: senpai
    emotion: thinking
    text: ……お前のたとえは、いつも食べ物だな。
    beat: true
- id: ch3_ooya
  title: 交付税のいらない町
  background: sh_ooya
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 技術者, emotion: happy}
  - {who: ooya, x: 0.7, emotion: happy}
  cuts:
  - speaker: ooya
    emotion: happy
    text: 今月の家賃、たしかに。あんたもシャープさんの人やったな。
  - speaker: zundamon
    emotion: happy
    text: はい！ 世界の亀山です。
  - speaker: ooya
    emotion: normal
    text: 工場に来てもらうのに、県と市で百数十億円の補助金を出したそうや。
  - speaker: zundamon
    emotion: surprised
    text: ひゃくすうじゅうおくえん！？
    se: bikkuri
  - speaker: ooya
    emotion: happy
    text: 工場が来てから、亀山市は国の交付税をもらわんでええ町になった。
  - speaker: zundamon
    emotion: thinking
    text: 交付税？
  - speaker: ooya
    emotion: normal
    text: 国からの仕送りみたいなもんや。いらんほど、市の財布が潤っとる。
  - speaker: zundamon
    emotion: happy
    text: 工場ひとつで、町の財布まで！
  - speaker: ooya
    emotion: thinking
    text: その工場が、ずっと元気ならええけどな。
# ---- 2006年・第2工場 ----
- id: card2006
  title: ''
  background: sh_card_2006
  bgm: pop
  cuts:
  - speaker: reimu
    text: 2006年5月、アクオスは累計1000万台。国内の液晶テレビのシェアは、4割を超えます。
    reading: にせん ろくねん ごがつ、あくおすわ るいけい せんまんだい。こくないの えきしょう てれびの しぇあわ、よんわりお こえます。
  - speaker: reimu
    text: 2006年8月。同じ敷地で、亀山第2工場が動き出します。
    reading: にせん ろくねん はちがつ。おなじ しきちで、かめやま だいに こうじょうが うごきだします。
- id: ch3_dai2
  title: もっと大きなガラス
  background: sh_kojo
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 技術者, emotion: happy}
  - {who: senpai, x: 0.7, emotion: normal}
  cuts:
  - speaker: senpai
    emotion: normal
    text: 第2工場のガラスは、第8世代だ。32型なら15枚取れる。
  - speaker: zundamon
    emotion: surprised
    text: 8枚から15枚！ 窯がまた大きくなったのだ！
  - speaker: senpai
    emotion: normal
    text: 会社は、投資の効率が第1工場の約2倍だと言ってる。
  - speaker: senpai
    emotion: happy
    text: 10月には、第2工場のモデルを日本とアメリカと中国で同時に売り出す。
  - speaker: zundamon
    emotion: happy
    text: 世界の亀山なのだ！
    beat: true
  - speaker: reimu
    text: 研究者の試算では、第2工場を8割動かすのに、2007年の50型台の世界需要の167.8%が要ります。
    reading: けんきゅうしゃの しさんでわ だいに こうじょうお はちわり うごかすのに、にせん ななねんの ごじゅうがただいの せかい じゅようの ひゃく ろくじゅうなな てん はち ぱーせんとが いります。
    telops:
    - {text: "研究者の試算　50型台の世界需要の167.8%", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: このとき、まだ誰も、自分たちの工場が大きすぎるとは思っていません。
    reading: この とき まだ だれも、じぶんたちの こうじょうが おおきすぎるとわ おもって いません。
# ---- 2007年・堺の発表 ----
- id: card2007
  title: ''
  background: sh_card_2007
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 2007年4月、液晶の技術者だった片山幹雄が49歳で社長に。7月31日、堺の新しい工場を発表します。
    reading: にせん ななねん しがつ、えきしょうの ぎじゅつしゃ だった かたやま みきおが よんじゅうきゅうさいで しゃちょうに。しちがつ さんじゅういちにち、さかいの あたらしい こうじょうお はっぴょう します。
- id: ch4_sakai
  title: 亀山工場の約4倍
  background: sh_kaiken
  stage:
  - {who: katayama, x: 0.28, flip: true, emotion: happy}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: kisha
    emotion: normal
    text: '[堺|さかい]の新しい工場は、どれくらいの大きさですか。'
  - speaker: katayama
    emotion: happy
    text: 亀山工場の約4倍、甲子園球場が32個入る規模。
    se: don
    telops:
    - {text: "片山社長「亀山工場の約4倍」", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: kisha
    emotion: normal
    text: パネルは、ほかのテレビの会社にも売るんですか。
  - speaker: katayama
    emotion: normal
    text: 生産能力自体が追いつかなかった。
  - speaker: katayama
    emotion: normal
    text: メーカーの要望にあわせて[外販比率|がいはんひりつ]を高める。
  - speaker: reimu
    text: 液晶の工場だけで約3800億円。部材の会社なども集まる一帯の全体で、約1兆円の計画です。
    reading: えきしょうの こうじょう だけで やく さんぜん はっぴゃくおくえん。ぶざいの かいしゃ なども あつまる いったいの ぜんたいで、やく いっちょうえんの けいかくです。
- id: ch4_kameyama
  title: ''
  background: sh_kojo
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 技術者, emotion: surprised}
  - {who: doki, x: 0.7, emotion: normal}
  cuts:
  - speaker: doki
    emotion: normal
    text: 亀山の4倍だってよ。甲子園32個。
  - speaker: zundamon
    emotion: happy
    text: 甲子園32個……昼休みに野球し放題なのだ！
  - speaker: doki
    emotion: angry
    text: 野球場を建てるんじゃないって。
    beat: true
  - speaker: doki
    emotion: normal
    text: '[堺|さかい]は第10世代。42型なら15枚取れるガラスだ。'
  - speaker: zundamon
    emotion: happy
    text: 世界の亀山の4倍なら、世界の4倍なのだ。
  - speaker: doki
    emotion: thinking
    text: 計算が雑すぎる。
    beat: true
  - speaker: zundamon
    emotion: thinking
    text: もっと大きなガラスに、もっと大きな窯……。
- id: ch4_kessan
  title: 5年連続の過去最高
  background: sh_kaigi
  cuts:
  - speaker: reimu
    text: 2008年春の決算は、純利益1019億円。5年続けての過去最高。ここが、頂上でした。
    reading: にせん はちねん はるの けっさんわ、じゅんりえき せん じゅうきゅうおくえん。ごねん つづけての かこ さいこう。ここが ちょうじょうでした。
    background: sh_kaigi_up
