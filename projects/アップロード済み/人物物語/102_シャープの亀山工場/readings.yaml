# sharp-kameyama 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 技術者 / label: 先輩・同期・大家・町田社長・奥田本部長・奥田・片山社長・郭台銘・戴社長・呉社長・河村社長 ほか）とテロップは表示専用なのでタグを付けていない。
# 三重 は共通台帳と dictionary.yaml に さんじゅう（三重釜）で入っているので、セリフでは使わず、ナレの reading で みえ と読ませている。
# 鴻海 はタグなしだと オオトリウミ と読まれる（97本目の記録）ので、セリフは全出現にタグ。
# タグの読みを ほんはい にすると「は」が助詞として ワ になるので、[鴻海|ほんハイ] と書く（「のは」の直後だけ [鴻海|ホンハイ]）。
# 37V型 のタグもカタカナ（[37V型|サンジュウナナブイガタ]）。負のサイクル の 負 は [負|フ]（マケノ と読まれる）。
# 亀山・シャープ はタグなしで読める前提で台帳に入れていない（voice 後のモーラ照合で確かめる）。
