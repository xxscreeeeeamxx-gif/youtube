# mcdonalds-fujita 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 藤田田 / label: 三越の社員・米国本部・銀座の店主 ほか）とテロップは表示専用なのでタグを付けていない。
# 読みに「は」を含む語は、タグをカタカナで書いた（[初値|ハツネ]・[77円80銭|ナナジュウナナエンハチジッセン]・[1箱|ひとハコ]）。
# 見直しで、抑揚が切れやすい所をカタカナのタグにした（[三越|ミツコシ] 3か所・[第一屋製パン|ダイイチヤセイパン]・[年|トシ]・[思た|オモタ]・[どないした|ドナイシタ]）。
# 「1日」は いちにち と読ませる所だけ本文でタグを付けた（「10月1日」= ついたち にも掛かるので台帳には入れない）。
# 「年」は「当たる年」の2か所だけ本文で [年|とし] を付けた。
