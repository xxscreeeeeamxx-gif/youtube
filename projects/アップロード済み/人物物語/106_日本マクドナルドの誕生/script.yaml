    text: 円高で下がって、2022年からは円安と材料高で上がってるの。
  - speaker: zundamon
    emotion: thinking
    text: 安い高いの裏に、1ドルが[何円|なんえん]かがあるのだ。
  - speaker: tsumugi
    emotion: normal
    text: それと、同じマクドナルドでも店で値段が違うことがあるの。
  - speaker: tsumugi
    emotion: normal
    text: 2023年から、都心の店などは別の値段なのよ。
  - speaker: zundamon
    emotion: surprised
    text: 同じハンバーガーなのに！？
  - speaker: tsumugi
    emotion: normal
    text: 旅先や駅前の店では、アプリかレシートで確かめてね。
  - speaker: tsumugi
    emotion: thinking
    text: あと、期間限定の値下げとふだんの値段は分けて見ること。
  - speaker: zundamon
    emotion: happy
    text: でっかく半額って書いてあっても、いつまでかを見るんだね。
    beat: true
# ---- 現代の章 ----
- id: ch19_gendai
  title: 55年目のマクドナルド
  background: md_gendai
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 今の[日本|にほん]マクドナルドは、2026年9月末で3047店。
  - speaker: zundamon
    emotion: surprised
    text: 22坪の1号店から、3047店……！
  - speaker: tsumugi
    emotion: normal
    text: 2025年の全店の売上は8886億円。[1日|いちにち]にならすと、約24億円よ。
  - speaker: zundamon
    emotion: surprised
    text: 初日の40万円の、約6000倍なのだ！
  - speaker: tsumugi
    emotion: normal
    text: 既存店の売上は、6月までで43四半期続けて前の年を上回ったの。
  - speaker: tsumugi
    emotion: normal
    text: 9月も、前の年より10%増えてるわ。
  - speaker: tsumugi
    emotion: normal
    text: ハンバーガーは、2月の値上げでも190円のまま。
  - speaker: zundamon
    emotion: thinking
    text: 80円のころの、2.4倍か。
  - speaker: tsumugi
    emotion: normal
    text: アメリカへのロイヤリティは、売上の3%。創業のころは1%だったの。
  - speaker: zundamon
    emotion: surprised
    text: 100円売って1円が、今は3円なんだ。
  - speaker: tsumugi
    emotion: normal
    text: '[藤田|ふじた]さんのころは直営の店が中心。今はフランチャイズが7割を超えてるわ。'
  - speaker: tsumugi
    emotion: normal
    text: そして2026年10月1日、キャラクターの名前がドナルドからロナルドに変わったの。
    telops:
    - {text: "ドナルド → ロナルド　2026年10月1日", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: ドナルドが、ロナルドに！？
  - speaker: tsumugi
    emotion: happy
    text: 公式の[X|エックス]はドナルド、どーなるの？って投稿してたわ。
  - speaker: zundamon
    emotion: happy
    text: ダジャレで、お知らせなのだ。
    se: manuke
  - speaker: tsumugi
    emotion: normal
    text: 財団も同じ日に、ロナルド・マクドナルド・ハウス・ジャパンになったの。
  - speaker: tsumugi
    emotion: thinking
    text: 1999年にできたとき、その財団の名前にはデン・フジタが入ってたのよ。
  - speaker: zundamon
    emotion: surprised
    text: '[藤田|ふじた]さんの名前が、入ってたんだ。'
  - speaker: tsumugi
    emotion: normal
    text: キャラクターは、世界と同じ呼び名になったのね。
  - speaker: zundamon
    emotion: thinking
    text: でも店の名前は、マクドナルドのままなのだ。
