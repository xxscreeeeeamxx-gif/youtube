meta:
  title: 「“マクダーナルズ”では、日本人には受けない」と押し切った藤田田、日本で3000店に【ずんだもん解説】
  slug: mcdonalds-fujita
  hook_line: 初日は目標の半分以下だった銀座の1号店は、なぜ3000店に広がったのか。
  summary: 1971年7月、日曜の夜の銀座三越。ハンバーガーの店を建てるのに与えられた時間は、39時間でした。日本マクドナルドを始めた藤田田は、アメリカの本部と百貨店、そして人前で立って食べるのは下品という日本人の作法を相手に、場所と値段と店の名前で勝負に出ます。けれど初日の売上は、目標に遠く届きませんでした。空振りの店を変えたものは何だったのか。会社の記録と本人の著書、関係者の回想を主語つきで並べて、晩年までを再現ドラマでたどります。（2026年11月時点）
  sources:
  - 日本マクドナルドホールディングス「沿革・歴史」 https://www.mcd-holdings.co.jp/company/history/
  - 日本マクドナルド「マクドナルドの歩み」 https://www.mcdonalds.co.jp/company/outline/history/
  - 日本マクドナルド 50周年サイト「銀座から生まれたハッピー」 https://www.mcdonalds.co.jp/campaign/thankyou50th/history/happy/02/
  - 藤田田『起業家のモノサシ』抜粋（PRESIDENT Online） https://president.jp/articles/-/109741
  - 日本食糧新聞「トップインタビュー 日本マクドナルド代表取締役社長・藤田田氏」（1996年3月18日） https://news.nissyoku.co.jp/restaurant/grs-97-0003
  - 日本マクドナルド 50周年サイト「マクドナルドの窓からのぞいた日本」 https://www.mcdonalds.co.jp/campaign/thankyou50th/history/social/
  tags:
  - マクドナルド
  - 藤田田
  - 日本マクドナルド
  - 銀座三越
