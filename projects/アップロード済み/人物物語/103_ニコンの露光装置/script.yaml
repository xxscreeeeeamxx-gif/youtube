meta:
  title: 「オセロゲームのようにシェアを奪った」ASMLに抜かれたニコン、最上位機が1年で0台【ずんだもん解説】
  slug: nikon-stepper
  hook_line: 金額で世界の約半分を握ったニコンの露光装置は、なぜ後発に抜かれたのか。
  summary: 2001年、ニコンの工場のクリーンルーム。回路を縮めて焼き付ける露光装置で、ニコンは金額で世界の約半分を握った時期がありました。レンズを自前で磨くニコンと、外の一流を束ねるオランダのASML。水を入れる液浸、次の光のEUV、客が株主になって出した開発費。1985年入社の技術者（架空の人物）の目で、会社の発表と研究者・記者の見方を並べて再現ドラマでたどります。過去最大の赤字の正体も。（2026年10月時点）
  sources:
  - ニコン「2026年3月期 決算説明会資料（ノート付き）」（2026年5月8日） https://www.jp.nikon.com/content/dam/web-assets/nikoncom/company/local/jp/ja/ir/ir_library/result/pdf/2026/26_all_script_j.pdf
  - ニコン「連結財務諸表におけるのれん等の非金融資産の減損損失の計上に関するお知らせ」（2026年2月5日） https://www.jp.nikon.com/content/dam/web-assets/nikoncom/company/local/jp/ja/news/2026/20260205_02_j.pdf
  - ニコン「2026-2030年度 中期経営計画（ノート付き）」（2026年5月8日） https://www.jp.nikon.com/content/dam/web-assets/nikoncom/company/local/jp/ja/ir/management/midtermbusiness/pdf/2026/0508j_script.pdf
  - ニコン「構造改革の実施に関するお知らせ」（2016年11月8日） https://www.jp.nikon.com/content/dam/web-assets/nikoncom/company/local/jp/ja/news/2016/20161108_1_j.pdf
  - ニコン「ニコン、ASML、Carl Zeiss間における全ての訴訟手続の和解合意について」（2019年1月23日） https://www.jp.nikon.com/company/news/2019/0123_01.html
  - ASML「Samsung joins ASML's Customer Co-Investment Program for Innovation, completing the program」（2012年8月27日） https://www.sec.gov/Archives/edgar/data/0000937966/000119312512370598/d402810dex991.htm
