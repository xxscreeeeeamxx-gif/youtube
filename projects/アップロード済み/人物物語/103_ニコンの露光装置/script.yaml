scenes:
# ---- 先出し（2026年5月8日・決算の日） ----
- id: co_kessan
  title: ''
  background: nk_roko
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 技術者, emotion: thinking}
  - {who: doki, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 2026年5月8日。ニコンが、3月までの1年の決算を発表した日です。
    reading: にせん にじゅうろくねん ごがつ ようか。にこんが、さんがつまでの いちねんの けっさんお はっぴょう した ひです。
  - speaker: doki
    emotion: thinking
    text: 最終赤字、860億円。過去最大だってさ。
  - speaker: zundamon
    emotion: surprised
    text: 860億円……！？
  - speaker: doki
    emotion: thinking
    text: それに、うちのいちばん[上|ウエ]の機械。この1年で、売れたのは0台だ。
  - speaker: zundamon
    emotion: sad
    text: ……0台。この部屋も、奥が空いたもんな。
    background: nk_roko_kara
  - speaker: reimu
    text: ニコン自身が史上最も精密な機械と書く、露光装置。その最上位の機種が、1年で1台も売れませんでした。
    reading: にこん じしんが しじょう もっとも せいみつな きかいと かく、ろこう そうち。その さいじょういの きしゅが いちねんで いちだいも うれませんでした。
    telops:
    - {text: "最終赤字860億円　最上位機は1年で0台", size: lg, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: ただし、この860億円の赤字の正体は、少し意外なものです。
    reading: ただし この はっぴゃく ろくじゅうおくえんの あかじの しょうたいわ、すこし いがいな ものです。
# ---- 今の部屋（スマホ） ----
- id: hook
  title: ''
  background: nk_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 新しいスマホなのだ！
  - speaker: tsumugi
    emotion: normal
    text: その回路は、露光装置って機械が光で焼いたのよ。
  - speaker: zundamon
    emotion: surprised
    text: スマホを焼くのだ！？
    se: bikkuri
  - speaker: tsumugi
    emotion: normal
    text: 最先端の機械は1台約300億円。30万円のカメラ10万台分ね。
  - speaker: zundamon
    emotion: surprised
    text: カメラ10万台……！
  - speaker: tsumugi
    emotion: normal
    text: その露光装置でニコンは一時、金額で世界の約半分を握ってたの。
  - speaker: tsumugi
    emotion: thinking
    text: それがなぜ、外から部品を集める後発に抜かれたのか。
# ---- 2001年・組み立てのクリーンルーム ----
- id: card2001
  title: ''
  background: nk_card_2001
  bgm: curious
  cuts:
  - speaker: reimu
    text: 2001年。ニコンの工場の、露光装置を組み立てるクリーンルームです。
    reading: にせん いちねん。にこんの こうじょうの、ろこう そうちお くみたてる くりーんるーむです。
  - speaker: reimu
    text: 組み立てと調整を受け持つのは、1985年に入社した技術者です。
    reading: くみたてと ちょうせいお うけもつのわ、せんきゅうひゃく はちじゅうごねんに にゅうしゃ した ぎじゅつしゃです。
- id: ch1_jimae
  title: 自前で磨くレンズ
  background: nk_roko
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 技術者, emotion: happy}
  - {who: senpai, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 今日もレンズがピカピカです。さすが世界一のレンズ。
  - speaker: senpai
    emotion: normal
    text: 露光装置とは何か。新人に聞かれたら、一言で言えるか。
  - speaker: zundamon
    emotion: happy
    text: すごく高い、回路用のカメラです！
  - speaker: senpai
    emotion: thinking
    text: 半分だけ正解だ。
    se: hammer
  - speaker: senpai
    emotion: normal
    text: 回路の[原版|げんばん]に光を当てて、レンズで縮めてウエハーに焼き付ける。
  - speaker: zundamon
    emotion: normal
    text: 縮めて、焼く。
  - speaker: senpai
    emotion: normal
    text: 1964年に、東大の先生がうちのレンズで実験をした。
  - speaker: senpai
    emotion: normal
    text: 英語の小説1冊ぶんを、10円切手くらいの大きさに縮めて写したんだ。
  - speaker: zundamon
    emotion: surprised
    text: 小説1冊が、切手1枚！？
  - speaker: senpai
    emotion: normal
    text: その血筋のレンズが、この機械の目だ。
  - speaker: senpai
    emotion: happy
    text: うちはそのレンズを、全部自前で磨いてる。
  - speaker: zundamon
    emotion: happy
    text: ボクらの自慢です！
  - speaker: zundamon
    emotion: thinking
    text: オランダのASMLは、レンズはどうしてるんです？
  - speaker: senpai
    emotion: normal
    text: ドイツのツァイスに任せてる。研究も、よその研究所と組んでる。
  - speaker: zundamon
    emotion: surprised
    text: 自分で磨かないんですか！？
  - speaker: senpai
    emotion: normal
    text: 外の一流を束ねて、自分たちは設計と最後の組み立てに絞ってるんだ。
  - speaker: zundamon
    emotion: angry
    text: それ、ずるくないですか。
  - speaker: senpai
    emotion: thinking
    text: ずるくない。速いんだ。
    beat: true
  - speaker: reimu
    text: 研究者の中馬宏之は、ニコンを垂直統合型、ASMLを外に頼る量産特化型と呼びました。
    reading: けんきゅうしゃの ちゅうま ひろゆきわ にこんお すいちょく とうごうがた、えーえすえむえるお そとに たよる りょうさん とっかがたと よびました。
    telops:
    - {text: "ニコン＝自前で磨く　ASML＝外を束ねる", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: zundamon
    emotion: normal
    text: 向こうは、雨漏りする小屋から始まった会社って聞きましたよ。
  - speaker: senpai
    emotion: thinking
    text: 1984年にな。それが今は、すぐ後ろまで来てる。
- id: ch1_twin
  title: ''
  background: nk_roko
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 技術者, emotion: normal}
  - {who: senpai, x: 0.7, emotion: thinking}
  cuts:
  - speaker: senpai
    emotion: thinking
    text: しかも向こうは今年、ウエハーを載せる台を2つ持つ機械を出した。
  - speaker: zundamon
    emotion: thinking
    text: 台が2つ？ 何に使うんです？
  - speaker: senpai
    emotion: normal
    text: 片方で位置を測ってる間に、もう片方で焼く。
  - speaker: zundamon
    emotion: surprised
    text: 待ち時間が、なくなる……！
    se: hirameki
  - speaker: senpai
    emotion: normal
    text: うちは1枚を、いちばんきれいに焼く。
  - speaker: senpai
    emotion: thinking
    text: 向こうは、1時間に何枚焼けるかで勝負してきた。
  - speaker: zundamon
    emotion: thinking
    text: コンロが[2口|ふたくち]ある台所、みたいなもんですか。
  - speaker: senpai
    emotion: normal
    text: そうだ。[1口|ひとくち]で丁寧に焼くか、[2口|ふたくち]で回すかだ。
  - speaker: zundamon
    emotion: angry
    text: きれいさなら、うちが負けるわけないのだ！
  - speaker: reimu
    text: この違いがのちに効いてくると、研究者や記者は見ています。
    reading: この ちがいが のちに きいて くると、けんきゅうしゃや きしゃわ みて います。
  - speaker: reimu
    text: では、ニコンは技術で負けたのでしょうか。
    reading: でわ にこんわ ぎじゅつで まけたのでしょうか。
# ---- 1972年ごろ・量産に適さない ----
- id: card1972
  title: ''
  background: nk_card_1972
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 1972年ごろ。ニコンがまだ、日本光学工業という名前だった時代です。
    reading: せんきゅうひゃく ななじゅうにねん ごろ。にこんが まだ、にっぽん こうがく こうぎょうと いう なまえだった じだいです。
- id: ch2_willer
  title: 量産に適さない
  background: nk_jikken
  stage:
  - {who: willer, x: 0.62, emotion: thinking}
  cuts:
  - speaker: reimu
    text: のちに世界で初めてステッパーを売る、アメリカのGCAの社長が訪ねてきます。
    reading: のちに せかいで はじめて すてっぱーお うる、あめりかの じーしーえーの しゃちょうが たずねて きます。
  - speaker: reimu
    text: 脇本善司や吉田庄一郎らが、レンズで回路を縮めて焼く機械の構想を見せます。
    reading: わきもと ぜんじや よしだ しょういちろうらが、れんずで かいろお ちぢめて やく きかいの こうそうお みせます。
  - speaker: willer
    emotion: thinking
    text: そんな精密な[位置決め|いちぎめ]の精度を求められる機械は、
  - speaker: willer
    emotion: normal
    text: 生産性が低く、量産に適さないだろう。
    se: don
    telops:
    - {text: "GCA社長「量産に適さないだろう」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: reimu
    text: 4、5年後、GCAは自らステッパーを発表。精密だが量産に向かないという見方は、のちに形を変えて現れます。
    reading: よん ごねんご、じーしーえーわ みずから すてっぱーお はっぴょう。せいみつだが りょうさんに むかないと いう みかたわ、のちに かたちお かえて あらわれます。
- id: ch2_kenkyujo
  title: ''
  background: nk_wafer
  cuts:
  - speaker: reimu
    text: 1976年、国の共同研究所が発足。本命は、電子ビームでした。
    reading: せんきゅうひゃく ななじゅうろくねん、くにの きょうどう けんきゅうじょが ほっそく。ほんめいわ、でんし びーむでした。
  - speaker: reimu
    text: 研究所の中では、マスクを検証する装置と名前をごまかして認めてもらい、ニコンに試作を頼みます。
    reading: けんきゅうじょの なかでわ ますくお けんしょう する そうちと なまえお ごまかして みとめて もらい、にこんに しさくお たのみます。
  - speaker: reimu
    text: 1980年、国産初のステッパーが完成。当時、世界の台数の約9割はGCAでした。
    reading: せんきゅうひゃく はちじゅうねん、こくさん はつの すてっぱーが かんせい。とうじ せかいの だいすうの やく きゅうわりわ じーしーえーでした。
# ---- 1985年・新人 ----
- id: ch2_nyusha
  title: 1985年の新人
  background: nk_roko
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 技術者, emotion: happy}
  - {who: senpai, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1985年。日本光学工業の工場に、新人の技術者が入ります。
    reading: せんきゅうひゃく はちじゅうごねん。にっぽん こうがく こうぎょうの こうじょうに、しんじんの ぎじゅつしゃが はいります。
  - speaker: senpai
    emotion: normal
    text: ここが、ステッパーの組み立てだ。
  - speaker: zundamon
    emotion: happy
    text: ステッパー！ 踊る機械ですか？
  - speaker: senpai
    emotion: angry
    text: 踊らない。
    beat: true
  - speaker: senpai
    emotion: normal
    text: 1回焼くたびに、ウエハーを少しずつずらす。だからステッパーだ。
  - speaker: senpai
    emotion: normal
    text: 同じ回路を縮めて、何十個も並べて焼いていく。
  - speaker: senpai
    emotion: normal
    text: たとえるなら、東京から富士山の山頂のテニスボールに矢を当てる精度だ。
  - speaker: zundamon
    emotion: surprised
    text: ボク、弓道は未経験です！
  - speaker: senpai
    emotion: angry
    text: 誰が弓を引けと言った。
    se: tsukkomi
  - speaker: zundamon
    emotion: happy
    text: 世界一の機械を、ボクが組み立てますよ！
  - speaker: senpai
    emotion: thinking
    text: 口より、手を動かせ。
  - speaker: reimu
    text: 入社から2年後の1987年、ニコンの露光装置は、累計1,000台に届きます。
    reading: にゅうしゃから にねんごの せんきゅうひゃく はちじゅうななねん、にこんの ろこう そうちわ るいけい せんだいに とどきます。
# ---- 1988〜1990年・社名と世界一 ----
- id: ch2_nikon
  title: ''
  background: nk_roko
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 技術者, emotion: happy}
  - {who: doki, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1988年4月。
    reading: せんきゅうひゃく はちじゅうはちねん しがつ。
  - speaker: doki
    emotion: happy
    text: 今日から、うちの社名がニコンだってさ。
  - speaker: zundamon
    emotion: happy
    text: カメラの名前が、会社の名前か！ 名刺、刷り直しだな。
  - speaker: reimu
    text: 1990年4月。アメリカの官民の研究団体の会長が、議会でニコンを名指しします。
    reading: せんきゅうひゃく きゅうじゅうねん しがつ。あめりかの かんみんの けんきゅう だんたいの かいちょうが、ぎかいで にこんお なざし します。
  - speaker: doki
    emotion: thinking
    text: うちが新しい機械を、日本の客に先に渡してるって証言だってさ。
  - speaker: zundamon
    emotion: angry
    text: そんなひいきしたら、商売にならないだろ。
  - speaker: doki
    emotion: normal
    text: 会社も否定してる。試作機は、日本とアメリカに半分ずつ置いてるって。
  - speaker: reimu
    text: 1990年までに、ニコンの露光装置は世界一になっていました。
    reading: せんきゅうひゃく きゅうじゅうねん までに、にこんの ろこう そうちわ せかいいちに なって いました。
  - speaker: zundamon
    emotion: happy
    text: 世界一なのだ！ ボクが組んだ機械が、世界一！
    se: levelup
  - speaker: doki
    emotion: normal
    text: お前が組んだのは、そのうちの何台だよ。
    beat: true
  - speaker: reimu
    text: このとき、まだ誰も、この首位を明け渡す日が来るとは思っていません。
    reading: この とき まだ だれも、この しゅいお あけわたす ひが くるとわ おもって いません。
- id: ch2_sekai
  title: 世界の約半分
  background: nk_tenji
  cuts:
  - speaker: reimu
    text: 1995年、ニコンの露光装置は台数で世界の45％、金額では約49％。世界の約半分です。
    reading: せんきゅうひゃく きゅうじゅうごねん、にこんの ろこう そうちわ だいすうで せかいの よんじゅうご ぱーせんと きんがくでわ やく よんじゅうきゅう ぱーせんと。せかいの やく はんぶんです。
    telops:
    - {text: "1995年　台数45％・金額約49％", size: md, position: top-right, color: "#9AD8FF", stroke: "#0A1A2A", glow: "#2A6AFF", anim: up}
  - speaker: reimu
    text: その会社が、なぜ抜かれるのか。次の光を選び間違えたのか。過去最大の赤字は、露光装置のせいなのか。
    reading: その かいしゃが、なぜ ぬかれるのか。つぎの ひかりお えらび まちがえたのか。かこ さいだいの あかじわ、ろこう そうちの せい なのか。
# ---- 2002年・シェアNo.1は使命 ----
- id: card2002
  title: ''
  background: nk_card_2002
  bgm: serious
  cuts:
  - speaker: reimu
