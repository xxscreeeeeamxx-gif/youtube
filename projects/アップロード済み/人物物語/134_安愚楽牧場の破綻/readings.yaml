# agura-farm 読み台帳（人名・地名・社名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 三ケ尻社長・三ケ尻 / label: 先輩・新人・専務・経理の幹部・取締役・検査官・牧場の人・県の職員・記者・
# 債権者・弁護士・管財人・裁判長）・テロップ・章タイトルは表示専用なのでタグを付けていない。
#
# 三ケ尻（みかじり）の読み：台帳では一次資料で確かめられなかった（要確認）。2026-11-18 の検索で、
# Japan Times（2013-06-18、元社長ら逮捕の記事）が「Kumiko Mikajiri」と書いていると検索結果の要約で確認した
# （記事本文は有料で開けず）。VOICEVOX はタグなしで「三ケ尻久美子」を ミカジリ/クミコ と読む。
# 三ケ尻はナレにしか出していない（セリフには出さない）ので、セリフ側のタグは不要。
#
# 2026-11-18 台本を書いたあと、セリフ全行を VOICEVOX の audio_query にかけた結果:
# - 安愚楽牧場 はタグなしだと ヤスグ/ラク/ボクジョオ → [安愚楽牧場|アグラボクジョウ] で アグラボクジョオ。
# - 繁殖牛 はタグなしだと ハンショクウシ → [繁殖牛|はんしょくぎゅう]（ひらがな）で1語。カタカナのタグだと ハンショク/ギュウ と切れた。
# - 肥育牛 はタグなしだと ヒイクウシ → [肥育牛|ヒイクギュウ] で ヒイクギュウバイバイコオス と1語。
# - 原判決 はタグなしだと ハラ/ハンケツ → [原判決|げんはんけつ]。
# - 石垣島 は「石垣島なんですか」で イシガキトオナ（島=トウ）になった（[石垣島|イシガキジマ] なら正しい）。この行は削ったので、石垣島 はナレだけ。
# - 懲役2年6月 はタグなしだと ロクガツ → [懲役2年6月|ちょうえきにねんろっかげつ]（カゲツのタグで固定）。
# - 一審 はタグなしだと イチシン → [一審|いっしん]。
# - 「耳の札」が ミミノサツ → [札|ふだ]。「契約の分です」が ワケデス → [分|ぶん]（文脈で変わる語なので台帳には入れていない）。
# - 「答え、短っ！」が タンッ → 表記を「みじかっ」にした。
# - 「4万0517頭」が ヨンマン/ゼロゴオイチナナ → 「4万517頭」にした。
# - 口蹄疫 はタグなしで コオテエエキ と1語で読んだ。ひらがなのタグ [口蹄疫|こうていえき] だと コウテ/イエキ と切れたので、
#   セリフはタグなしにした（台帳に入れるとセリフにタグか辞書が要るため、台帳には入れていない。ナレは reading: で こうていえき）。
# - 預託法（ヨタクホオ）・民事再生（ミンジサイセエ）・国技館（コクギカン）・管財人・消費者庁・農林水産省・立入検査・
#   不実の告知（タグ [不実の告知|ふじつのこくち] で フジツノ/コクチ）・空売り（カラウリ）・税務署・頭数（トオスウ）・
#   餓死（ガシ）・示談（ジダン）・BSE（ビイエスイイ）・資金繰り（シキングリ）・一挙に（イッキョニ）・私ども（ワタシドモ）は
#   タグなしで正しく読んだ。預託法 はタグを付けると ヨ/タクホウ と切れたので、タグを付けず台帳にも入れていない。
# - 那須 はタグなしでも ナス と読むが、発注書の指定どおり [那須|ナス] を付けた（ナスノ と1語で読む）。
# - 「金」はカネと読ませる所を全部 お[金|かね] にした。
# - 「方」（人を指す）は [方|カタ]（「100万円を出した方に」）。
# 2026-11-18 見直し（ag_fix.md）で直した・足したセリフも audio_query にかけた:
# - 「年5%」は トシ と読んだ → 「1年に5%」（イチネンニ）にした。
# - 経営に問題はないって（ケエエエニ）・民事の判決（ミンジノ）・刑事の判決（ケエジノ）・うかがえる・無効（ムコオ）・
#   還付（カンプ）・経営陣と社員の6人・最後の1年ほどの192人との契約だけ・自己中心的・52万円に届かない分（トドカナイブン）・
#   「います」（イマス/ト。かぎかっこは読みを変えない）はタグなしで正しく読んだ。
