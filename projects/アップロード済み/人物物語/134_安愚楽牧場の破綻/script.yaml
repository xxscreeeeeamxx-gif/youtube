# ---- 論争1：口蹄疫と原発のせい？（会社の説明と判決を主語つきで） ----
- id: ronso1
  title: 口蹄疫と原発のせい？
  background: ag_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ 口蹄疫と原発でつぶれた、会社も被害者だって！
  - speaker: tsumugi
    emotion: normal
    text: そう見える事実はあるの。口蹄疫で約1万5000頭を処分したと、会社は説明したわ。
  - speaker: tsumugi
    emotion: normal
    text: 原発の事故のあとは、解約が相次いだとも。社長も国技館でそう話したわね。
  - speaker: zundamon
    emotion: happy
    text: ほら、運が悪かっただけなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: でも民事の判決は、遅くとも1996年ごろには新しいお[金|かね]で払う状態だったとみたの。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: 1999年3月期の末には、契約の3割から4割が空売りだったとも。
  - speaker: tsumugi
    emotion: thinking
    text: 日経は破綻の直後、経験不足で子牛が死ぬことが多かったとも報じていたわ。
  - speaker: zundamon
    emotion: thinking
    text: 子牛まで、足りなかったのか……。
  - speaker: zundamon
    emotion: surprised
    text: 口蹄疫より、ずっと前から……！？
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、口蹄疫は関係ないの？
  - speaker: tsumugi
    emotion: normal
    text: 関係はあるわ。刑事の判決も、牛の不足を強めた要因になったことはうかがえるとしたの。
  - speaker: tsumugi
    emotion: normal
    text: 口蹄疫と原発は、とどめになった。牛が足りなくなったのは、その15年ほど前からよ。
  - speaker: zundamon
    emotion: thinking
    text: とどめで、つぶれたんじゃなかったのか……。
    beat: true
# ---- 論争2：出資者の自己責任？（「出資者が悪い」と言わない） ----
- id: ronso2
  title: 出資者の自己責任？
  background: ag_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: じゃあ、高い利回りに飛びついたお客さんの自己責任なのだ！
  - speaker: tsumugi
    emotion: normal
    text: 配当は1年に5%前後。満期には同じ値段で買い戻す。条件がよく見えたのは確かよ。
  - speaker: tsumugi
    emotion: thinking
    text: でもパンフレットは、牛は「います」と言い切っていたの。
    se: hammer
  - speaker: zundamon
    emotion: thinking
    text: パンフレットを信じたら、いけないの？
  - speaker: tsumugi
    emotion: normal
    text: 刑事の判決は、パンフレットの改訂を最後に決める権限は社長にあったと認めているわ。
  - speaker: tsumugi
    emotion: normal
    text: 帳簿の上の借金は620億円。牛の不足を知っていたのは、経営陣と社員の6人だけ。
  - speaker: tsumugi
    emotion: thinking
    text: 国の立入検査でさえ、見抜けなかったわ。
  - speaker: zundamon
    emotion: thinking
    text: 牛を見に行っても、分からない？
  - speaker: tsumugi
    emotion: thinking
    text: 見に行っても、その牛が自分の牛かは分からない。1頭の牛に、番号が2つ付いていたのよ。
  - speaker: zundamon
    emotion: sad
    text: 1頭なのに、番号が2つ……。
    beat: true
  - speaker: zundamon
    emotion: sad
    text: 6人しか知らないのに、お客さんが見抜けるわけないのだ。
# ---- 本当の注意点（1と2を中心に。3・4は1行ずつ。会社名・商品名の例は出さない） ----
- id: chui
  title: 売って、預かって、配当
  background: ag_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 1つめ。物を売って預かって、毎年配当。この形はいま、法律で原則禁止よ。
  - speaker: tsumugi
    emotion: normal
    text: 国の確認を受けずに結んだ契約は、効力を生じない。2022年6月からの決まりなの。
  - speaker: zundamon
    emotion: surprised
    text: 契約そのものが、無効になるんだ。
  - speaker: tsumugi
    emotion: normal
    text: 牛でもほかの品物でも、そんな話が来たら立ち止まって。
  - speaker: tsumugi
    emotion: normal
    text: 迷ったら、お住まいの消費生活センターに相談してね。
  - speaker: zundamon
    emotion: sad
    text: ボクのレアカード、毎月おまけ付きで預けてるのだ……。
    se: shobon
  - speaker: tsumugi
    emotion: normal
    text: 2つめ。見に行けることは、あることの証明にならない。
  - speaker: tsumugi
    emotion: thinking
    text: パンフレットには、いつでも自分の牛を見ていただけますとあったわ。
  - speaker: tsumugi
    emotion: thinking
    text: でも、同じ牛に番号が重なっていたの。
  - speaker: zundamon
    emotion: thinking
    text: カードも、見せてもらうだけじゃだめか……。
  - speaker: tsumugi
    emotion: normal
    text: 手元に戻せるか。そこを確かめてね。
  - speaker: tsumugi
    emotion: normal
    text: 3つめ。帳簿の借金が少なくても、安心の材料にはならない。
  - speaker: zundamon
    emotion: thinking
    text: 帳簿に載らない借金……。
  - speaker: tsumugi
    emotion: normal
    text: 4つめ。毎年必ず同じ配当が届くこと自体が、合図になることもあるの。
  - speaker: zundamon
    emotion: surprised
    text: 毎月のおまけも、合図なのだ！？
# ---- 現代（台帳8章。国の裁判は時点を付けて。社長の確定のあとの服役・近況は言わない） ----
- id: card2026
  title: ''
  background: ag_card_2026
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 2026年。国技館の説明会から、15年がたちました。
    reading: にせん にじゅうろくねん。こくぎかんの せつめいかいから、じゅうごねんが たちました。
- id: ima
  title: 15年後の裁判
  background: ag_gendai
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: '[安愚楽牧場|アグラボクジョウ]は、いまどうなってるの？'
  - speaker: tsumugi
    emotion: normal
    text: 2014年3月に破産の手続きが終わって、会社はもう無いわ。
  - speaker: zundamon
    emotion: thinking
    text: 社長は？
  - speaker: tsumugi
    emotion: normal
    text: 2016年には民事の裁判で、元社長ら3人に約1億円の賠償が命じられたの。
  - speaker: zundamon
    emotion: thinking
    text: 国は、止められなかったの？
  - speaker: tsumugi
    emotion: normal
    text: 2014年5月、出資者たちが国を訴えたの。判決が出たのは12年後よ。
  - speaker: tsumugi
    emotion: normal
    text: 2026年5月、東京地裁は請求を棄却。頭数の不足をつかむのは容易ではなかった、と。
  - speaker: tsumugi
    emotion: normal
    text: 7月、大阪地裁は国に約3億7900万円の賠償を命じたわ。
  - speaker: tsumugi
    emotion: thinking
    text: 遅くとも2009年3月末には業務の停止を命じるべきだった、という判断よ。
  - speaker: zundamon
    emotion: surprised
    text: 同じ話で、答えが逆なのだ！？
  - speaker: zundamon
    emotion: thinking
    text: どっちが正しいの？
  - speaker: tsumugi
    emotion: normal
    text: まだ決まっていないの。国は控訴したわ。
  - speaker: tsumugi
    emotion: thinking
    text: 国の責任をめぐる裁判は、2026年のいまも続いているの。
  - speaker: zundamon
    emotion: sad
    text: 15年たっても、まだ終わってないのだ……。
  - speaker: zundamon
    emotion: thinking
    text: 決まりのほうは、変わったの？
  - speaker: tsumugi
    emotion: thinking
    text: 預託法は1986年にできた法律。それが牛の会社のあとで、原則禁止まで変わったの。
# ---- 締め（茶番のカードと、冒頭の「います」「だますつもりは」を回収） ----
- id: shime
  title: ''
  background: ag_heya
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 決めたのだ！ 友だちに預けたレアカード、今日返してもらうのだ！
  - speaker: tsumugi
    emotion: happy
    text: 見せてもらうんじゃなくて、手元に戻すのね。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: いいえ、だますつもりはまったくございません。国技館で、社長はそう話したわ。
  - speaker: tsumugi
    emotion: normal
    text: パンフレットには、「います」。実際にいた[繁殖牛|はんしょくぎゅう]は、契約の6割前後だった。
  - speaker: tsumugi
    emotion: normal
    text: 裁かれたのは、いない牛をいると告げたこと。
  - speaker: tsumugi
    emotion: normal
    text: それも、最後の1年ほどの192人との契約だけ。
  - speaker: tsumugi
    emotion: normal
    text: 判決は、その動機を会社本位の自己中心的なものと書いたわ。
  - speaker: tsumugi
    emotion: normal
    text: 戻ったのは、5%よ。
  - speaker: zundamon
    emotion: thinking
    text: 見に行けるは、あるの証明じゃない……。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 物を売って預かって、毎年配当。そんな話が来たら、払う前に立ち止まってね。
  - speaker: tsumugi
    emotion: happy
    text: 参考になったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
