meta:
  title: 安愚楽牧場の社長「だますつもりはまったくございません」、繁殖牛は契約の6割前後だった【ずんだもん解説】
  slug: agura-farm
  hook_line: 牛がいないのに、なぜ会社は「います」と言い続けたのか。
  summary: 2011年8月19日、雨の両国国技館。安愚楽牧場の社長・三ケ尻久美子は、出資した人たちの前で「いいえ、だますつもりはまったくございません」と答えました。牛を売って預かり、毎年子牛の分を払い、満期に同じ値段で買い戻す「和牛オーナー制度」。パンフレットには「『私の牛』は本当にいるのですか？」「います」。なぜ会社は「います」と言い続けたのか。判決と報道を主語を分けて並べ、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 東京高等裁判所第12刑事部 判決（2014年10月16日、平成26年(う)第223号） https://agurahigai.a.la9.jp/aguracriminaljudege20141016.pdf
  - 帝国データバンク 倒産速報「株式会社安愚楽牧場」（2011年8月9日） https://www.tdb.co.jp/report/bankruptcy/flash/3497/
  - 帝国データバンク 倒産速報「株式会社安愚楽牧場」続報（2011年8月15日） https://www.tdb.co.jp/report/bankruptcy/flash/3499/
  - 日本経済新聞「『口蹄疫や原発事故が原因』安愚楽牧場社長が債権者に謝罪」（2011年8月19日） https://www.nikkei.com/article/DGXNASDG1903V_Z10C11A8000000/
  - 時事通信「『安愚楽』破綻、国の賠償認めず」（2026年5月26日） https://www.jiji.com/jc/article?k=2026052600077&g=soc
  - 日本経済新聞「安愚楽牧場の出資被害巡り国に賠償命令 大阪地裁」（2026年7月30日） https://www.nikkei.com/article/DGXZQOUF3071X0Q6A730C2000000/
