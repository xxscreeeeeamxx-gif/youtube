  - {who: zundamon, x: 0.16, flip: true, tag: 三ケ尻, emotion: sad}
  - {who: saibancho, x: 0.84, emotion: normal}
  cuts:
  - speaker: saibancho
    emotion: normal
    text: '[原判決|げんはんけつ]を破棄する。'
    se: don
  - speaker: reimu
    text: 一審の判決は、2人が牛の不足を知りながら、経営を保つためにさらに客を集めた、と認めました。
    reading: いっしんの はんけつわ ふたりが うしの ふそくお しりながら、けいえいお たもつ ために さらに きゃくお あつめたと みとめました。
  - speaker: reimu
    text: その動機は会社本位の自己中心的なものというべきで、その犯意も強固である。
    reading: その どうきわ かいしゃ ほんいの じこ ちゅうしんてきな ものと いうべきで、その はんいも きょうこで ある。
    telops:
    - {text: "判決「会社本位の自己中心的」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
- id: ch14_mae
  title: ''
  background: ag_saibansho_mae
  stage:
  - {who: kisha, x: 0.86, emotion: normal}
  cuts:
  - speaker: kisha
    emotion: normal
    text: 高裁は[一審|いっしん]を破棄し、[懲役2年6月|ちょうえきにねんろっかげつ]の実刑としました。
  - speaker: kisha
    emotion: normal
    text: 192人のうち162人と示談し、3285万円を払っています。
  - speaker: kisha
    emotion: normal
    text: 高裁は、それを考えて4か月短くしました。
  - speaker: kisha
    emotion: normal
    text: 弁護側はBSEや牛肉の偽装事件、口蹄疫と原発の事故を挙げていました。
  - speaker: kisha
    emotion: normal
    text: 高裁は、牛がいないのにいると告げる理由にはならないと退けています。
  - speaker: reimu
    text: 10月31日、懲役2年6月の実刑が確定しました。
    reading: じゅうがつ さんじゅういちにち、ちょうえき にねん ろっかげつの じっけいが かくてい しました。
    telops:
