scenes:
# ---- 先出し（2011年8月19日・両国国技館の債権者説明会。非公開。社長の言葉は日経1つ・経済サイト1つ。笑いのSEなし。債権者は趣旨の脚色） ----
- id: co_kokugikan
  title: ''
  background: ag_kokugikan
  bgm: serious
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 三ケ尻社長, emotion: sad}
  - {who: saikensha, x: 0.86, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2011年8月19日、両国国技館。破綻した安愚楽牧場の社長、三ケ尻久美子が、出資者の前に座っています。
    reading: にせん じゅういちねん はちがつ じゅうくにち、りょうごく こくぎかん。はたん した あぐら ぼくじょうの しゃちょう みかじり くみこが しゅっししゃの まえに すわって います。
  - speaker: reimu
    text: 民事再生の申し立てから10日後の、債権者説明会です。
    reading: みんじ さいせいの もうしたてから とおかごの、さいけんしゃ せつめいかいです。
  - speaker: zundamon
    emotion: sad
    text: 口蹄疫の発生や福島第1原発の事故でオーナーの解約が相次ぎ、
  - speaker: zundamon
    emotion: sad
    text: 資金繰りが急激に悪化した。おわびする
  - speaker: saikensha
    emotion: angry
    text: 経営に問題はないって、言ってたじゃないか！
  - speaker: zundamon
    emotion: sad
    text: ……えー……
  - speaker: saikensha
    emotion: angry
    text: だますつもりだったのか！
  - speaker: zundamon
    emotion: sad
    text: いいえ、だますつもりはまったくございません。
  - speaker: reimu
    text: その4年前から、パンフレットには問いと答えがありました。『私の牛』は本当にいるのですか？　います。
    reading: その よねんまえから ぱんふれっとにわ といと こたえが ありました。わたしの うしわ ほんとうに いるのですか。います。
  - speaker: reimu
    text: 実際にいた繁殖牛は、契約の6割前後でした。
    reading: じっさいに いた はんしょくぎゅうわ、けいやくの ろくわり ぜんごでした。
# ---- 今の部屋（見たことのない物を「ある」と言われて預ける。20秒以内） ----
- id: hook
  title: ''
  background: ag_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 友だちのレアカードを買って、そのまま預けたのだ！ 毎月おまけ付き！
  - speaker: tsumugi
    emotion: thinking
    text: そのカード、見た？
    se: hammer
  - speaker: zundamon
    emotion: normal
    text: ……あるって、言ってた。
  - speaker: tsumugi
    emotion: normal
    text: あると言われて、信じて預ける。2011年、7万あまりの契約がそうだったの。
  - speaker: tsumugi
    emotion: thinking
    text: 牛がいないのに、なぜ「います」と言い続けたのか。
    telops:
    - {text: "牛がいないのに なぜ「います」と言い続けた？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 牛が、いなかったのだ！？
# ---- 1981〜1990年・那須の共済牧場（30秒以内。社長の経歴は言わない。実弟は出さない） ----
- id: card1981
  title: ''
  background: ag_card_1981
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1981年12月、栃木県の那須町。安愚楽共済牧場ができます。
    reading: せんきゅうひゃく はちじゅういちねん じゅうにがつ、とちぎけんの なすまち。あぐら きょうさい ぼくじょうが できます。
- id: ch1_nasu
  title: 牛を預かる牧場
  background: ag_bokujo
  stage:
  - {who: bokujo, x: 0.84, emotion: normal}
  cuts:
  - speaker: bokujo
    emotion: normal
    text: 銀行は、牛や牧場だけじゃ大きなお[金|かね]を貸してくれない。
  - speaker: bokujo
    emotion: happy
    text: だから牛を買ってもらって、うちで預かるんだ。
  - speaker: reimu
    text: 1990年3月、三ケ尻久美子が社長になります。
    reading: せんきゅうひゃく きゅうじゅうねん さんがつ、みかじり くみこが しゃちょうに なります。
  - speaker: reimu
    text: この牧場が2011年につぶれるとは、まだ誰も思っていません。
    reading: この ぼくじょうが にせん じゅういちねんに つぶれるとわ、まだ だれも おもって いません。
# ---- 日本橋のオーナー営業部・300万円の牛（先輩と新人のモブ。約定と会計は判決の認定。300万円は台帳の逆算） ----
- id: ch2_eigyo
  title: 300万円の牛
  background: ag_eigyo
  stage:
  - {who: senpai, x: 0.16, flip: true, emotion: normal}
  - {who: shinjin, x: 0.84, emotion: surprised}
  cuts:
  - speaker: shinjin
    emotion: surprised
    text: 先輩！ お客さんが牛を1頭、300万円で買ってくれました！
  - speaker: senpai
    emotion: normal
    text: 牛は、うちの牧場で預かる。
  - speaker: senpai
    emotion: normal
    text: 生まれる子牛をうちが買って、エサ代を引いた13万5000円を毎年払う。
  - speaker: shinjin
    emotion: happy
    text: 満期になったら？
  - speaker: senpai
    emotion: happy
    text: うちが同じ300万円で買い戻す。
  - speaker: shinjin
    emotion: thinking
    text: 牛が、子どもを産まなかった年は？
  - speaker: senpai
    emotion: normal
    text: 払う。
  - speaker: shinjin
    emotion: surprised
    text: 産まなくても払うんですか！？
    se: zukko
  - speaker: shinjin
    emotion: thinking
    text: 満期に、牛を連れて帰ったお客さんは？
  - speaker: senpai
    emotion: normal
    text: ……まだ、1人もいない。
    beat: true
  - speaker: shinjin
    emotion: thinking
    text: 帳簿では、どうなってるんですか？
  - speaker: senpai
    emotion: normal
    text: 牛を売った。売上だ。買い戻す約束は、借金に載らない。
  - speaker: shinjin
    emotion: surprised
    text: 300万円返す約束なのに、借金じゃない……？
  - speaker: reimu
    text: この書き方のまま、2011年3月の決算の借金は620億円。4か月後の申立てのときは、4330億円でした。
    reading: この かきかたの まま にせん じゅういちねん さんがつの けっさんの しゃっきんわ ろっぴゃく にじゅうおくえん。よんかげつごの もうしたての ときわ、よんせん さんびゃく さんじゅうおくえんでした。
    telops:
    - {text: "帳簿620億円　本当は4330億円", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: 新しいお金で古いお金を払えば回る。止めた日に、穴が全部見える仕組みでした。
    reading: あたらしい おかねで ふるい おかねお はらえば まわる。とめた ひに、あなが ぜんぶ みえる しくみでした。
# ---- 1996年ごろ・那須の本部（判決の推認。社長室の3人は台詞なし。専務・経理の幹部は名前の無いモブ） ----
- id: card1996
  title: ''
  background: ag_card_1996
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 1996年ごろ、那須の本部。ここからの社内の話は、のちの民事裁判の判決によります。
    reading: せんきゅうひゃく きゅうじゅうろくねん ごろ、なすの ほんぶ。ここからの しゃないの はなしわ のちの みんじ さいばんの はんけつに よります。
- id: ch3_karauri
  title: 足りない牛
  background: ag_shachoshitsu
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 三ケ尻社長, emotion: normal}
  - {who: senmu, x: 0.62, emotion: normal}
  - {who: keiri, x: 0.86, emotion: normal}
  cuts:
  - speaker: reimu
    text: 判決によれば、このころには売る繁殖牛が足りず、繁殖牛ではない牛の耳の番号を契約に割り当てていました。
    reading: はんけつに よれば この ころにわ うる はんしょくぎゅうが たりず、はんしょくぎゅうでわ ない うしの みみの ばんごうお けいやくに わりあてて いました。
  - speaker: reimu
    text: 判決は、社長ら経営陣3人が、倒産を避けるため売り続けると決めた、と見ています。
    reading: はんけつわ しゃちょうら けいえいじん さんにんが、とうさんお さける ため うりつづけると きめたと みて います。
  - speaker: reimu
    text: 牛の不足は、社内でも秘密。知っていた社員は3人だけ。なぜ、契約を止めなかったのか。
    reading: うしの ふそくわ、しゃないでも ひみつ。しって いた しゃいんわ さんにん だけ。なぜ けいやくお とめなかったのか。
# ---- 1997年5月・口出しした取締役（判決の認定。取締役は名前の無いモブ。社長の台詞は判決の言葉の命令形1行だけ） ----
- id: ch4_torishimari
  title: 口出しした取締役
  background: ag_shachoshitsu
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 三ケ尻社長, emotion: normal}
  - {who: torishimari, x: 0.84, emotion: normal}
  cuts:
  - speaker: torishimari
    emotion: normal
    text: 社長。オーナー制度の損得を、計算してみました。
  - speaker: torishimari
    emotion: thinking
    text: 1頭85万円でオーナーに売ったとしても
  - speaker: torishimari
    emotion: thinking
    text: 契約が10年より短ければ、会社の借金が増えるだけです。
  - speaker: torishimari
    emotion: surprised
    text: 売れば売るほど、借金が増えます。
  - speaker: zundamon
    emotion: normal
    text: オーナー制度には、口出ししないこと。
    se: don
  - speaker: torishimari
    emotion: sad
    text: ……計算を、見せただけなのに。
- id: ch4_ishigaki
  title: ''
  background: ag_ishigaki
  stage:
  - {who: torishimari, x: 0.84, emotion: sad}
  cuts:
  - speaker: reimu
    text: 1997年5月、社長は口出しを禁じ、石垣島の牧場への転勤を命じました。民事の判決の認定です。
    reading: せんきゅうひゃく きゅうじゅうななねん ごがつ、しゃちょうわ くちだしお きんじ いしがきじまの ぼくじょうえの てんきんお めいじました。みんじの はんけつの にんていです。
  - speaker: reimu
    text: なぜ石垣島へ行かされたのか。民事の判決は、経営陣3人が誰の口出しも許さない方針を固めた、と見ています。
    reading: なぜ いしがきじまえ いかされたのか。みんじの はんけつわ けいえいじん さんにんが だれの くちだしも ゆるさない ほうしんお かためたと みて います。
  - speaker: reimu
    text: 同じ年、家畜が預託法の対象に。同じ商売の10数社は多くが摘発され、安愚楽は残りました。
    reading: おなじ とし、かちくが よたくほうの たいしょうに。おなじ しょうばいの じゅうすうしゃわ おおくが てきはつ され、あぐらわ のこりました。
# ---- 2007年4月〜・パンフレットの問いと答え（文言は判決の認定。電話の言葉は文言の範囲の脚色） ----
- id: ch5_pamph
  title: います
  background: ag_pamph
  bgm: curious
  stage:
  - {who: senpai, x: 0.09, flip: true, emotion: normal}
  - {who: shinjin, x: 0.91, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2007年4月。会社の新しいパンフレットに、問いと答えが載ります。
    reading: にせん ななねん しがつ。かいしゃの あたらしい ぱんふれっとに、といと こたえが のります。
  - speaker: shinjin
    emotion: normal
    text: 私の牛は、本当にいるのですか。
    telops:
    - {text: "パンフレット「『私の牛』は本当にいるのですか？」「います」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: senpai
    emotion: happy
    text: います。
  - speaker: shinjin
    emotion: surprised
    text: ……答え、みじかっ！
    se: manuke
  - speaker: senpai
    emotion: normal
    text: 長く書くと、かえって心配になるからな。
  - speaker: shinjin
    emotion: normal
    text: 10年前のパンフレットには、いつでも自分の牛を見ていただけますってあります。
  - speaker: senpai
    emotion: happy
    text: 見に行けるなら、安心だろ。
- id: ch5_denwa
  title: ''
  background: ag_eigyo
  stage:
  - {who: senpai, x: 0.14, flip: true, emotion: normal}
  - {who: shinjin, x: 0.86, emotion: normal}
  cuts:
  - speaker: senpai
    emotion: normal
    text: はい、[安愚楽牧場|アグラボクジョウ]です。
  - speaker: senpai
    emotion: happy
    text: お客様、ご安心ください。パンフレットのとおり、牛はいます。
  - speaker: shinjin
    emotion: thinking
    text: 1頭の牛に、お客さんが2人ついたりしないんですか？
  - speaker: senpai
    emotion: normal
    text: 牛1頭に番号1つ。耳の[札|ふだ]で決まってる。
  - speaker: shinjin
    emotion: happy
    text: なら、安心ですね！
- id: ch5_kara
  title: ''
  background: ag_gyusha_kara
  cuts:
  - speaker: reimu
    text: その直前の2007年3月期、実際にいた繁殖牛は契約の55.9%。なのに、なぜ「います」と書いたのか。
    reading: その ちょくぜんの にせん ななねん さんがつき、じっさいに いた はんしょくぎゅうわ けいやくの ごじゅうご てん きゅう ぱーせんと。なのに なぜ いますと かいたのか。
    beat: true
    telops:
    - {text: "実際にいた繁殖牛　契約の55.9%", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
# ---- 2009年1月・農水省の立入検査（応対は経理の幹部。台詞なし、虚偽の説明はナレで。検査官は名前の無いモブ） ----
- id: ch6_kensa
  title: 国の立入検査
  background: ag_kaigi
  bgm: kinakusai
  stage:
  - {who: keiri, x: 0.1, flip: true, emotion: normal}
  - {who: kensakan2, x: 0.73, emotion: normal}
  - {who: kensakan, x: 0.9, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2009年1月。農林水産省が、預託法に基づく立入検査に入ります。応対したのは経理の幹部でした。
    reading: にせん きゅうねん いちがつ。のうりん すいさんしょうが、よたくほうに もとづく たちいり けんさに はいります。おうたい したのわ けいりの かんぶでした。
  - speaker: kensakan
    emotion: normal
    text: 契約している牛は何頭で、残高はいくらですか。
  - speaker: reimu
    text: 6万7501頭、残高は約2315億円。彼はそう説明しました。実際は9万頭超、3000億円超です。
