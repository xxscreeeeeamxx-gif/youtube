  - speaker: tenin
    emotion: surprised
    text: けいこう……。
  - speaker: zundamon
    emotion: normal
    text: 大きな牛のしっぽでいるより、小さくても鶏の頭でいろ、という意味なのだ。
  - speaker: tenin
    emotion: happy
    text: うちは、小さな鶏の頭ですか。
  - speaker: zundamon
    emotion: happy
    text: 小さいけど、先頭を走るのだ。
  - speaker: reimu
    text: 同じ1910年、除虫菊を広めた働きで、国から藍綬褒章を受けています。
    reading: おなじ せんきゅうひゃく じゅうねん、じょちゅうぎくお ひろめた はたらきで くにから らんじゅほうしょうお うけています。
- id: ch12_bannen
  title: ''
  background: kt_ie
  bgm: amacha_hoshizora
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上山英一郎, emotion: normal}
  - {who: tenin, x: 0.7, emotion: happy}
  cuts:
