  - speaker: reimu
    text: 1943年、上山英一郎は81歳で亡くなりました。
    reading: せんきゅうひゃく よんじゅうさんねん、うえやま えいいちろうわ はちじゅういっさいで なくなりました。
- id: ch13_sanchi
  title: 日本中に咲いた花
  background: kt_hatake
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 上山さんが種を配った除虫菊は、[日本中|にほんじゅう]に広がったの。
  - speaker: tsumugi
    emotion: normal
    text: 1925年には、北海道の石狩だけで、全国の畑の7割近くを占めたそうよ。
  - speaker: zundamon
    emotion: surprised
    text: 北海道が、そんなに！
  - speaker: tsumugi
    emotion: normal
    text: 1935年ごろが、生産が一番多かったの。
  - speaker: tsumugi
    emotion: thinking
