- id: ch13_shikumi
  title: 燃やさずに温める
  background: kt_uzu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: つむぎ。蚊取り線香って、燃えた煙で蚊を落とすのだ？
  - speaker: tsumugi
    emotion: normal
    text: 実は、燃えているところからは、成分は出ないの。
  - speaker: zundamon
    emotion: surprised
    text: 燃えてないところから、出るのか！？
  - speaker: tsumugi
    emotion: normal
    text: 火のついた先は、700度から800度もあるの。
  - speaker: tsumugi
    emotion: normal
    text: その少し手前、250度くらいに温まったところから、成分が出て煙に乗るのよ。
  - speaker: zundamon
    emotion: thinking
    text: 燃える前に、温められて飛び出すのだ。
  - speaker: tsumugi
    emotion: happy
    text: 火は、少しずつ前に進むヒーターみたいなものね。
  - speaker: zundamon
    emotion: surprised
    text: そのヒーターが、ひと晩かけて進むのだ。
  - speaker: zundamon
    emotion: sad
    text: ボクの両はし作戦は、火のつく場所を2つにしただけなのだ。
  - speaker: tsumugi
    emotion: happy
    text: そう。だから、半分の時間で燃え尽きたのよ。
  - speaker: reimu
    text: 今の標準の渦巻きは、伸ばすとおよそ75センチ。およそ7時間かけて燃えます。
    reading: いまの ひょうじゅんの うずまきわ のばすと およそ ななじゅうご せんち。およそ しちじかん かけて もえます。
    telops:
    - {text: "伸ばすと75センチ、およそ7時間", size: lg, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: 箱を開けると、2つの渦が組み合わさってるのだ。
  - speaker: tsumugi
    emotion: normal
    text: 手で巻いていたころの、二本[並べて|ならべて]巻くやり方の名残よ。
  - speaker: tsumugi
    emotion: normal
    text: 2つ[一組|ひとくみ]だと折れにくいし、かさも半分で、運ぶのも安く済むの。
  - speaker: zundamon
    emotion: happy
    text: 最初から、よくできてたのだ。
  - speaker: tsumugi
    emotion: normal
    text: 中身も変わったわ。今は、除虫菊の成分に似せて人が作った成分が中心なの。
  - speaker: zundamon
    emotion: surprised
    text: 花じゃなくなったのか。
  - speaker: tsumugi
    emotion: normal
    text: 1949年にアメリカで作られて、日本でも作られるようになったのよ。
  - speaker: tsumugi
    emotion: thinking
    text: 花の成分は、似せて作った成分に置き換わって、日本の畑はほとんど無くなったの。
  - speaker: zundamon
    emotion: sad
    text: さみしいな。
  - speaker: tsumugi
    emotion: normal
    text: 今、除虫菊の花を作っている主な国は、ケニアやオーストラリアよ。
  - speaker: zundamon
    emotion: thinking
    text: 作る場所も、ずいぶん変わったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 形のほうも、変わったところがあるの。
  - speaker: tsumugi
    emotion: normal
    text: 1957年から、[KINCHO|きんちょう]の渦巻きは左巻きなの。
  - speaker: zundamon
    emotion: surprised
    text: 左巻き！？ 何か、わけがあるのだ？
  - speaker: tsumugi
    emotion: normal
    text: 打ち抜く機械を新しくしたときに、左巻きに変わったと会社は説明してるわ。
  - speaker: tsumugi
    emotion: thinking
    text: なぜ左なのかまでは、はっきり書かれていないの。
  - speaker: zundamon
    emotion: thinking
    text: 今夜、ボクの家のも確かめるのだ。
- id: ch14_ronsou
  title: 煙は体に悪い？
  background: kt_shiryo
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。ネットで見たのだ。蚊取り線香の煙は、体にすごく悪いって。
  - speaker: tsumugi
    emotion: thinking
    text: よく言われるわね。これは、研究によって結論が分かれてるの。
  - speaker: zundamon
    emotion: surprised
    text: 分かれてる？
  - speaker: tsumugi
    emotion: normal
    text: 外国の製品を調べて、細かい粒がたくさん出るとした研究があるわ。
  - speaker: tsumugi
    emotion: normal
    text: 一方で、健康への悪い影響とまでは言えない、という研究もあるの。
  - speaker: zundamon
    emotion: thinking
    text: 日本の製品は、どうなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 業界の団体は、閉め切ると目やのどがしみることはある、と説明してる。
  - speaker: tsumugi
    emotion: normal
    text: そのうえで、体には特に問題はない、という立場よ。
  - speaker: tsumugi
    emotion: normal
    text: 東京都の研究センターは、使う時間を短くして、使ったあとはよく換気するよう勧めてるわ。
  - speaker: zundamon
    emotion: normal
    text: 結局、どう使えばいいのだ。
  - speaker: tsumugi
    emotion: normal
    text: メーカーの説明だと、窓を少し開けて、風上に置くこと。
  - speaker: tsumugi
    emotion: thinking
    text: 人のほかに、気をつけたいのが、生き物のほう。
  - speaker: zundamon
    emotion: surprised
    text: 人じゃない？
  - speaker: tsumugi
    emotion: normal
    text: この成分は、昆虫や魚にはとても強く効くの。
  - speaker: tsumugi
    emotion: normal
    text: カブトムシや金魚、トカゲなんかを飼ってる部屋では、使わないこと。
  - speaker: tsumugi
    emotion: normal
    text: メーカーも、そう書いてるわ。
  - speaker: zundamon
    emotion: surprised
    text: ボクの部屋の金魚、危なかったのだ。
  - speaker: tsumugi
    emotion: happy
    text: 今夜から、別の部屋にしてあげて。
- id: ch15_gendai
  title: 世界の夜を守る渦
  background: kt_ima
  bgm: amacha_milkyway
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 蚊取り線香は、今ではアジアやアフリカ、南米でも使われてるの。
  - speaker: zundamon
    emotion: surprised
    text: 世界中か。
  - speaker: tsumugi
    emotion: normal
    text: インドネシアだけで、1年に、40億巻ほど売れるそうよ。
  - speaker: zundamon
    emotion: surprised
    text: 40億！
  - speaker: tsumugi
    emotion: thinking
    text: 蚊が病気を運ぶ地域では、夜を守る道具なの。
  - speaker: zundamon
    emotion: thinking
    text: 日本では、電気の蚊取りも増えたのだ。
  - speaker: tsumugi
    emotion: normal
    text: 1963年に電気で温めるタイプ、そのあと液体のタイプやスプレーも出てきたわ。
  - speaker: zundamon
    emotion: surprised
    text: 火を使わないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 渦巻きも、大きいのは12時間、小さいのは3時間ほどの種類があるの。
  - speaker: zundamon
    emotion: happy
    text: 寝る時間に合わせて、選べるのだ。
  - speaker: tsumugi
    emotion: normal
    text: それでも、渦巻きは今もたくさん売れてるわ。
  - speaker: tsumugi
    emotion: happy
    text: 2013年には、国の未来技術遺産にも選ばれたの。
  - speaker: zundamon
    emotion: happy
    text: ブタの入れ物も、昔からあるのだ？
  - speaker: tsumugi
    emotion: normal
    text: 東京の新宿で、幕末から明治のはじめのものが見つかってるわ。
  - speaker: tsumugi
    emotion: thinking
    text: ただ、どこで生まれたのかは、いくつも説があるの。
  - speaker: zundamon
    emotion: normal
    text: ブタの正体は、なぞのままなのだ。
- id: shime
  title: ''
  background: kt_ima
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: つむぎ。今夜は、片はしだけに火をつけるのだ。
  - speaker: tsumugi
    emotion: happy
    text: えらいわね。
  - speaker: tsumugi
    emotion: normal
    text: 窓を少し開けて、風上に置いてね。
  - speaker: zundamon
    emotion: normal
    text: 金魚は、別の部屋に引っ越したのだ。
  - speaker: tsumugi
    emotion: normal
    text: 渦の一周一周が、7年かけて見つけた答えなのよ。
  - speaker: zundamon
    emotion: thinking
    text: 棒のままだったら、今も夜中に起きて替えてたのだ。
  - speaker: tsumugi
    emotion: happy
    text: 長いまま、小さく。台所の網で、乾かして。
  - speaker: zundamon
    emotion: happy
    text: 答えは、家の中にあったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 今夜、火をつけるときは、外側の端っこを見てみて。
  - speaker: zundamon
    emotion: happy
    text: 外の端は……2つあるのだ。両方つけるぞ。
  - speaker: tsumugi
    emotion: angry
    text: 2つくっついたまま、つけないの！ まず外して、1つずつ使うのよ。
    se: oti
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
