    reading: はじめの ころの うずまきわ ながさ ろくじゅっせんち ほどで、ろくじかん ほど もえたと されています。
- id: ch11_boraku
  title: 約束の値段
  background: kt_hatake
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 上山英一郎, emotion: thinking}
  - {who: nouka, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
    text: 1903年、除虫菊が大豊作になり、値段が大きく下がったと伝えられています。
    reading: せんきゅうひゃく さんねん じょちゅうぎくが だいほうさくに なり、ねだんが おおきく さがったと つたえられています。
  - speaker: nouka
    emotion: sad
    text: 上山さん。今年は、どこも花が取れすぎて、値がつかんそうだ。
  - speaker: zundamon
    emotion: normal
    text: 約束の値段で、買い取るのだ。
  - speaker: nouka
    emotion: surprised
    text: 約束の？ 相場より、ずっと高いぞ。
  - speaker: zundamon
    emotion: normal
    text: 種を配ったときに、買い取ると言ったのだ。
  - speaker: nouka
    emotion: thinking
    text: それじゃあ、あんたが損をかぶることになる。
  - speaker: zundamon
    emotion: sad
    text: 約束を破ったら、来年は誰も植えてくれないのだ。
  - speaker: nouka
    emotion: happy
    text: ……山師と言ったのは、取り消すよ。
  - speaker: reimu
    text: 上山はこのとき、契約どおりの値で買い続けて、店がつぶれかけたと伝えられています。
    reading: うえやまわ この とき けいやく どおりの ねで かいつづけて、みせが つぶれかけたと つたえられています。
  - speaker: reimu
    text: 翌年、日露戦争が始まると、戦地の兵士に除虫菊の粉を送ります。
    reading: よくねん にちろ せんそうが はじまると、せんちの へいしに じょちゅうぎくの こなお おくります。
  - speaker: reimu
    text: それをきっかけに、軍から大量の注文が入ったとされています。
    reading: それお きっかけに、ぐんから たいりょうの ちゅうもんが はいったと されています。
  - speaker: nouka
    emotion: happy
    text: 上山さん。軍から、大きな注文が来たそうだな。
  - speaker: zundamon
    emotion: happy
    text: 約束を守っておいて、よかったのだ。花は、全部買い取るぞ。
  - speaker: nouka
    emotion: happy
    text: 来年も、植えるよ。
- id: card1910
  title: ''
  background: kt_card_1910
  cuts:
  - speaker: reimu
    text: 1910年。金鳥の商標が登録されます。
    reading: せんきゅうひゃく じゅうねん。きんちょうの しょうひょうが とうろく されます。
