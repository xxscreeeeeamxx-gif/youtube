    emotion: happy
    text: 旦那さん。いよいよ、会社ですね。
  - speaker: zundamon
    emotion: normal
    text: 除虫菊の粉を作る会社なのだ。
  - speaker: tenin
    emotion: normal
    text: 種を配って歩いたころが、うそみたいです。
  - speaker: zundamon
    emotion: happy
    text: 山師と言われたのが、懐かしいのだ。
  - speaker: reimu
    text: 1919年に会社を作り、のちに社名を大日本除虫菊とします。
