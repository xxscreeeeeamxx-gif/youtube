meta:
  title: 【蚊取り線香の誕生】40分で燃え尽きた線香を、一晩もたせた渦巻き【ずんだもん解説】
  slug: mosquito-coil
  summary: 夏の夜の、あの渦巻き。上山が最初に作った蚊取り線香は、まっすぐな棒でした。一晩使うには、夜中に何度も起きて火をつけ直すしかありません。始まりは、和歌山のミカン農家の男のもとに、アメリカから届いた小さな種の袋。種を配って歩けば詐欺師と呼ばれ、線香にすれば折れる。答えは、家の中から出てきました。
  tags:
  - 蚊取り線香
  - 上山英一郎
  - 除虫菊
  - 渦巻き
  - 夏
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 和歌山
  thumbnail:
    top: 渦巻きの理由
    bottom: 蚊取り線香の誕生
  mode: drama
  narrator: reimu
  mobs:
  - id: fukuzawa
    label: 福沢諭吉
    voice: 13
    pitch: -0.06
  - id: amoa
    label: 米国の種苗商
