  - speaker: tsumugi
    emotion: normal
    text: 会社には客の振袖や仮縫いが、約1200着残ってたの。
  - speaker: tsumugi
    emotion: normal
    text: 判決も、だまし取ったお[金|かね]は会社の経費に使われて着服はなかったとしてるわ。
  - speaker: tsumugi
    emotion: thinking
    text: 会見で詐欺に当たらないかと問われて、本人はそういうつもりではなかったと答えてる。
  - speaker: tsumugi
    emotion: thinking
    text: 法廷で問われたのも、客のお[金|かね]じゃなく銀行から借りたお[金|かね]のほうよ。
  - speaker: zundamon
    emotion: thinking
    text: 消えるつもりだったかは、決められないのか……。
    beat: true
