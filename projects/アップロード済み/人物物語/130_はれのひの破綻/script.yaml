scenes:
# ---- 先出し（2018年1月26日 19時5分〜・横浜市内の会見。問いと答えは会見の書き起こしの並びと言い回し） ----
- id: co_kaiken
  title: ''
  background: hn_kaiken
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 篠崎社長, emotion: sad}
  - {who: kisha2, x: 0.72, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2018年1月26日、横浜。振袖の会社、はれのひの社長、篠崎洋一郎。
    reading: にせん じゅうはちねん いちがつ にじゅうろくにち、よこはま。ふりそでの かいしゃ はれのひの しゃちょう、しのざき よういちろう。
  - speaker: reimu
    text: 成人の日から18日ぶりに、人前に姿を見せます。
    reading: せいじんのひから じゅうはちにちぶりに、ひとまえに すがたお みせます。
  - speaker: zundamon
    emotion: sad
    text: 代表取締役である私にすべての責任がございます。本当に申し訳ございませんでした。
  - speaker: kisha2
    emotion: normal
    text: なぜ成人式当日になって逃げてしまったんでしょうか。
  - speaker: zundamon
    emotion: sad
    text: できなくなるということの危険性はあったんですけども、
  - speaker: zundamon
    emotion: sad
    text: 一切考えず最後まで交渉しておりました。
  - speaker: kisha2
    emotion: normal
    text: 逃げていたのではありませんか？
  - speaker: zundamon
    emotion: sad
    text: 逃げてはないです。
  - speaker: reimu
    text: 18日前の朝、着付けの会場に、会社の人は来ませんでした。
    reading: じゅうはちにちまえの あさ きつけの かいじょうに、かいしゃの ひとわ きませんでした。
  - speaker: reimu
    text: 横浜のある会場では、約100人の多くが晴れ着を着られなかったとみられます。
    reading: よこはまの ある かいじょうでわ、やく ひゃくにんの おおくが はれぎお きられなかったと みられます。
  - speaker: reimu
    text: 5か月後、彼は成田空港で逮捕されます。
    reading: ごかげつご、かれわ なりた くうこうで たいほ されます。
# ---- 今の部屋（遠足の朝のお弁当） ----
- id: hook
  title: ''
  background: hn_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 明日は遠足！ お弁当は、お店に頼んであるのだ！
    se: jaan
  - speaker: tsumugi
    emotion: normal
    text: 受け取りは何時？
  - speaker: zundamon
    emotion: happy
    text: 朝6時に、お店が開けて待っててくれるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: その朝、お店に誰もいなかったら？
  - speaker: zundamon
    emotion: surprised
    text: 手ぶらで遠足なのだ！？
    beat: true
  - speaker: tsumugi
    emotion: thinking
    text: 一生に一度の朝に、本当に起きたの。2018年の成人の日よ。
    telops:
    - {text: "成人式の朝 なぜ会社の人は来なかった？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 成人式の朝に、なんで会社の人が来なかったのだ！？
# ---- 2011年・会社をつくる（短く。生い立ちは言わない） ----
- id: card2011
  title: ''
  background: hn_card_2011
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 2011年3月。篠崎洋一郎、48歳。のちのはれのひ株式会社を立ち上げます。
    reading: にせん じゅういちねん さんがつ。しのざき よういちろう よんじゅうはっさい。のちの はれのひ かぶしきがいしゃお たちあげます。
# ---- 一生に1回（会見の言葉。問いをナレで先に置く） ----
- id: ch1_shigoto
  title: 一生に一度の仕事
  background: hn_mise
  stage:
  - {who: zundamon, x: 0.72, tag: 篠崎社長, emotion: normal}
  cuts:
  - speaker: reimu
    text: のちの会見で、当日泣いていた女性たちに心は痛まなかったかと問われ、彼は仕事のきっかけをこう話します。
    reading: のちの かいけんで とうじつ ないて いた じょせいたちに こころわ いたまなかったかと とわれ、かれわ しごとの きっかけお こう はなします。
  - speaker: zundamon
    emotion: sad
    text: 一生に1回のことに携われるというのがすごくいい仕事だなと思って。
  - speaker: zundamon
    emotion: sad
    text: それがきっかけでした。
# ---- 2年先の晴れ着（店のカウンター。モブの脚色。数字は会見どおり） ----
- id: ch1_mise
  title: 2年先の晴れ着
  background: hn_mise
  stage:
  - {who: tenin, x: 0.64, flip: true, emotion: happy}
  - {who: hogosha, x: 0.88, emotion: normal}
  cuts:
  - speaker: hogosha
    emotion: normal
    text: 成人式は、2年後の1月ですよね。もう決めるんですか？
  - speaker: tenin
    emotion: happy
    text: はい。前撮りもありますし、お体に合わせてお仕立てしますので。
  - speaker: hogosha
    emotion: thinking
    text: それで、お代は？
  - speaker: tenin
    emotion: normal
    text: 30万円です。お支払いは、先にお願いしております。
  - speaker: hogosha
    emotion: surprised
    text: 着るのは2年後なのに、お[金|かね]は今！？
    se: bikkuri
  - speaker: hogosha
    emotion: thinking
    text: 30万円って、時給1000円のバイトなら300時間[分|ぶん]よ……。
  - speaker: tenin
    emotion: happy
    text: 成人式の朝は、着付けもヘアメイクもうちにお任せください！
  - speaker: reimu
    text: 2年先の朝のためのお金。それは、成人式の朝まで残っているのでしょうか。
    reading: にねんさきの あさの ための おかね。それわ、せいじんしきの あさまで のこって いるの でしょうか。
# ---- 店を増やす（2012〜2016年。経理はモブの脚色。検察の「店が増えるほど損失も膨らんだ」に沿う） ----
- id: ch1_kaigi
  title: 増える店
  background: hn_kaigi
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 篠崎社長, emotion: normal}
  - {who: keiri, x: 0.84, emotion: happy}
  cuts:
  - speaker: keiri
    emotion: happy
    text: 社長！ [八王子|ハチオウジ]につくば、[福岡天神|ふくおかてんじん]。店がどんどん増えますね！
  - speaker: keiri
    emotion: thinking
    text: ただ店が増えるたびに、毎月の赤字も増えています。
    background: hn_kaigi_akaji
  - speaker: keiri
    emotion: thinking
    text: 新しい店の家賃に、人の給料。開けた月から出ていきます。
  - speaker: keiri
    emotion: sad
    text: 晴れ着のお[金|かね]は先に入りますけど、出ていくほうが速いんです。
  - speaker: reimu
    text: のちに会見で、彼はこう説明しています。
    reading: のちに かいけんで、かれわ こう せつめい して います。
  - speaker: zundamon
    emotion: sad
    text: 急激な出店により、人件費コストなどが拡大し、
  - speaker: zundamon
    emotion: sad
    text: 平成28年9月期には大幅な赤字となりました。
    telops:
    - {text: "店が増えるほど 赤字も増える", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: keiri
    emotion: normal
    text: それでも目標は、2020年までに100店でしたよね。
  - speaker: keiri
    emotion: surprised
    text: ……今の何十倍ですか、それ。
    beat: true
  - speaker: reimu
    text: 店を増やすほど苦しくなる会社が、なぜ店を増やし続けたのか。
    reading: みせお ふやすほど くるしく なる かいしゃが、なぜ みせお ふやし つづけたのか。
# ---- 2015年・借りて返す（検察の冒頭陳述） ----
- id: ch2_jitensha
  title: 借りて返す
  background: hn_jimusho
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 篠崎社長, emotion: thinking}
  - {who: keiri, x: 0.84, emotion: normal}
  cuts:
  - speaker: keiri
    emotion: normal
    text: 社長、来週は銀行の返済日です。
  - speaker: keiri
    emotion: thinking
    text: ……別の銀行から借りたお[金|かね]で、返しておきます。
  - speaker: keiri
    emotion: sad
    text: 借りて返して、また借りて。こぐのをやめたら倒れる自転車ですね。
  - speaker: reimu
    text: 検察によれば、2015年8月までに、融資を別の借金の返済に回す自転車操業に陥っていました。
    reading: けんさつに よれば にせん じゅうごねん はちがつまでに、ゆうしお べつの しゃっきんの へんさいに まわす じてんしゃ そうぎょうに おちいって いました。
  - speaker: keiri
    emotion: thinking
    text: 新しく借りるには、決算書を見せないといけません。
# ---- 黒く塗った決算書（検察の主張と、判決が認めた事実。社長の台詞は作らない） ----
- id: ch2_kessan
  title: 黒く塗った決算書
  background: hn_kessan
  stage:
  - {who: shain, x: 0.1, flip: true, emotion: thinking}
  - {who: keiri, x: 0.9, emotion: sad}
  cuts:
  - speaker: shain
    emotion: thinking
    text: 9月期の決算書、銀行に出したんですよね？
  - speaker: keiri
    emotion: sad
    text: 出した。……融資は、難しいそうだ。
    se: chin
  - speaker: reimu
    text: 検察によれば、社長は融資を受け続けるため、部下や税理士に売上の水増しを指示しました。
    reading: けんさつに よれば しゃちょうわ ゆうしお うけ つづける ため、ぶかや ぜいりしに うりあげの みずましお しじ しました。
  - speaker: keiri
    emotion: normal
    text: 売上に、無い数字を足す。仕入れは、少なく書く。
  - speaker: keiri
    emotion: normal
    text: 架空の売上は、約5000万円。
    background: hn_kessan_kuro
  - speaker: shain
    emotion: surprised
    text: 赤字の会社が、紙の上だけ黒字に……！
  - speaker: shain
    emotion: thinking
    text: 赤点の答案を書き直して、合格ですって見せるようなもんですよ。
  - speaker: keiri
    emotion: sad
    text: ……分かってる。
    beat: true
# ---- 2016年9月30日・柏の新しい店の融資（判決が認めた詐欺。社長の台詞は調べの言葉だけ） ----
- id: ch2_osetsu
  title: 柏の店の融資
  background: hn_osetsu
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 篠崎社長, emotion: normal}
  - {who: ginko, x: 0.76, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2016年9月30日。横浜市内の銀行の支店です。
    reading: にせん じゅうろくねん くがつ さんじゅうにち。よこはま しないの ぎんこうの してんです。
  - speaker: ginko
    emotion: normal
    text: 千葉の[柏|かしわ]に、新しいお店を。ご融資は、3500万円ですね。
  - speaker: ginko
    emotion: happy
    text: 決算書も拝見しました。売上は、順調ですね。
  - speaker: ginko
    emotion: happy
    text: '[柏|かしわ]のお店、オープンが楽しみですね。'
  - speaker: reimu
    text: 判決によれば、偽りの決算書で経営を良く見せ、横浜銀行と東日本銀行から約6500万円をだまし取りました。
    reading: はんけつに よれば いつわりの けっさんしょで けいえいお よく みせ、よこはま ぎんこうと ひがし にほん ぎんこうから やく ろくせん ごひゃくまんえんお だましとりました。
    telops:
    - {text: "判決　2つの銀行から約6500万円", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: reimu
    text: のちの調べに、彼はこう話したと報じられています。
    reading: のちの しらべに、かれわ こう はなしたと ほうじられて います。
  - speaker: zundamon
    emotion: thinking
    text: 他の金融機関に借りた[金|かね]を返すためのものだった
  - speaker: reimu
    text: このとき、成人式の朝に会場が空になるとは、まだ誰も思っていません。
    reading: この とき、せいじんしきの あさに かいじょうが からに なるとわ まだ だれも おもって いません。
# ---- 2017年・届かない給料、止まる振袖 ----
- id: card2017
  title: ''
  background: hn_card_2017
  bgm: serious
  cuts:
  - speaker: reimu
    text: 2017年。店は一時、6つにまで増えていました。
    reading: にせん じゅうななねん。みせわ いちじ、むっつにまで ふえて いました。
- id: ch3_kiki
  title: 春からの危機
  background: hn_jimusho
  stage:
  - {who: zundamon, x: 0.18, flip: true, tag: 篠崎社長, emotion: sad}
  - {who: shain, x: 0.52, flip: true, emotion: sad}
  - {who: shain2, x: 0.84, emotion: thinking}
  cuts:
  - speaker: shain
    emotion: sad
    text: 今月のお給料、また遅れるって……
  - speaker: shain2
    emotion: sad
    text: 店のほうでも、また1人辞めたそうです。
  - speaker: shain2
    emotion: normal
    text: はい、はれのひです。……京都の取引先さん。先月分のお支払いですね。
  - speaker: shain2
    emotion: sad
    text: ……はい。申し訳ありません。
  - speaker: shain2
    emotion: sad
    text: 次の振袖は、お支払いが済んでからだそうです。
  - speaker: shain
    emotion: sad
    text: お客様に見せる[柄|がら]が、減っていく一方ね……。
    se: shobon
  - speaker: reimu
    text: 社長はのちの会見で、春の大型連休の前から商品が足りず、社員の士気が落ち始めたと話しています。
    reading: しゃちょうわ のちの かいけんで はるの おおがた れんきゅうの まえから しょうひんが たりず、しゃいんの しきが おち はじめたと はなして います。
  - speaker: zundamon
    emotion: sad
