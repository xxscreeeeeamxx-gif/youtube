  - speaker: tsumugi
    emotion: normal
    text: そう疑われたのには、理由があるの。
  - speaker: tsumugi
    emotion: normal
    text: 春から危機を感じていたのに、12月中旬まで注文を受けてた。
  - speaker: tsumugi
    emotion: thinking
    text: 成人の日から18日、姿を見せなかった。6月の集会にも来なかった。
  - speaker: zundamon
    emotion: angry
