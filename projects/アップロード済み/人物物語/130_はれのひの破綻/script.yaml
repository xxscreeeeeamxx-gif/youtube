meta:
  title: 成人式の朝に会社の人が来なかったはれのひ、18日後の会見で社長は「逃げてはないです」【ずんだもん解説】
  slug: harenohi
  hook_line: 2年先の晴れ着の代金を受け取った会社は、なぜ成人式の朝に来なかったのか。
  summary: 2018年1月8日、成人の日の朝。横浜の着付け会場で、新成人たちが振袖の会社「はれのひ」の人を待っていました。社長の篠崎洋一郎が姿を見せたのは、その18日後の会見です。2年先の成人式の晴れ着の契約、増え続けた店、銀行に出した決算書、断られ続けた12月。会社の人は、なぜあの朝に来なかったのか。会見と法廷に残る本人の言葉と、判決・検察・管財人の説明を主語を分けて並べ、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 東京商工リサーチ「はれのひ、取材ドキュメント」（2018年1月9日） https://www.tsr-net.co.jp/data/detail/1188958_1527.html
  - 神奈川新聞「『晴れの日』台無し 成人の日、着付け業者連絡途絶」（2018年1月9日） https://www.kanaloco.jp/news/social/entry-24235.html
  - 東京商工リサーチ「『はれのひ』債権者集会、篠﨑社長が不在のまま開催」（2018年6月21日） https://www.tsr-net.co.jp/data/detail/1189143_1527.html
  - 神奈川新聞「はれのひ融資詐取、元社長起訴内容認める 横浜地裁初公判」（2018年10月5日） https://www.kanaloco.jp/news/social/entry-37146.html
  - 神奈川新聞「はれのひ元社長に実刑 融資詐欺に地裁判決『一線越えた』」（2018年12月19日） https://www.kanaloco.jp/news/social/entry-146637.html
  - 国民生活センター 見守り新鮮情報「成人式の晴れ着レンタル　早期契約や強引な勧誘に注意！」（2026年2月5日） https://www.kokusen.go.jp/mimamori/kmj_mailmag/kmj-support229.html
