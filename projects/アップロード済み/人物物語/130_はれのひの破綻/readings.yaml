# harenohi 読み台帳（人名・地名・社名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 篠崎社長・篠崎元社長 / label: 記者・店員・保護者・経理・社員・銀行員・従業員・新成人・着付け・客・職員・
# 管財人・捜査員・検察官・裁判長）・テロップ・章タイトルは表示専用なのでタグを付けていない。
#
# 2026-11-15 台本を書いたあと、セリフ全行を VOICEVOX の audio_query にかけた結果:
# - 篠崎洋一郎 はタグなしでも シノザキ/ヨオイチロオ と読む。発注書どおりカタカナのタグにしたが、
#   [篠崎洋一郎|シノザキヨウイチロウ] だと シノザキ/ヨウ/イチロオ と3つに切れたので、
#   [篠崎洋一郎|シノザキヨーイチロー] にした（シノザキ/ヨオイチロオサンデスネ。読みは同じで切れない）。
# - 篠崎 は [篠崎|シノザキ] で シノザキ。
# - はれのひ はかなのままで ハレノヒ と読む（ハレノ/ヒサン と2つの句に分かれるが、読みは正しい）。
#   カタカナの ハレノヒ にすると ハレノ(1)/ヒサン(1) と平らになって悪くなったので、かなのまま。台帳には入れていない。
#   「はれのひと社長は」は ハレノ/ヒトシャチョオワ と「人」に聞こえたので「会社と社長は」に言い換えた。
# - 八王子 は読みに「は」があるので、タグはカタカナ [八王子|ハチオウジ]・[八王子市|ハチオウジシ]。
# - 二十歳 も同じ理由で [二十歳|ハタチ]。
# - 柄 はタグなしだと エ と読んだ（エガ・エカラ）→ 全部 [柄|がら] にした。文脈で読みが変わる語なので台帳には入れていない。
# - 「300時間分」が サンビャクジカン/ワケ になった → 300時間[分|ぶん]。
# - 調書の「何とか」が ナニトカ になった → [何とか|なんとか]（カタカナの ナントカ は ナント/カ と切れた）。
# - 「今日開いている」が キョオ/ヒライテ になった → 「今日営業している」に言い換えた。
# - 188 はタグなしだと ヒャクハチジュウハチ → [188|イチハチハチ]。
# - 人を指す「方」は ホオ と読まれやすいので、着付けの方・業者の方・社員の方・お持ちの方 は [方|カタ]。
# - 懲役2年6月 は [懲役2年6月|ちょうえきにねんろっかげつ] で チョオエキニネン/ロッカゲツ（カゲツで固定）。
# - 初公判 はナレだけ（辞書に登録済み。セリフには出していない）。
# - タグなしで正しく読んだ語（台帳に入れていない）: 振袖（フリソデ）・着付け（キツケ）・晴れ着（ハレギ）・前撮り（マエドリ）・
#   仮縫い（カリヌイ）・成人式（セエジンシキ）・再来年（サライネン）・問屋（トンヤ）・雲隠れ（クモガクレ）・知人（チジン）・
#   技術者（ギジュツシャ）・宿泊先（シュクハクサキ）・着服（チャクフク）・横浜アリーナ（ヨコハマアリイナ）・
#   国民生活センター（コクミンセエカツセンタア）・神奈川県警（カナガワケンケエ）・一線（イッセン）・見え（ミエ）・
#   平成28年9月期（ヘエセエニジュウハチネンクガツキ）・約1200着（ヤクセンニヒャクチャク）・福岡天神（フクオカテンジン）。
# 2026-11-15 見直し（hn_fix.md）で直した・足したセリフも audio_query にかけた:
# - 会見の「何と言いますか」はタグなしだと ナニト → [何と|なんと] で ナント/イイマスカ。
# - 「迎えられなかった方に対しては」は ホオニ になる → [方|カタ] で カタニ。
# - 知人宅（チジンタク）・待機（タイキ）・取引先さん（トリヒキサキサン）・年内（ネンナイ）・見合わせます・
#   2回に分けて（ニカイニ）・技術者さん・支度（シタク）・着服（チャクフク）・処理権（ショリケン）・
#   約820枚（ヤクハッピャクニジュウマイ）は、タグなしで正しく読んだ。台帳には入れていない。
# - [柏|かしわ]のお店（カシワノ/オミセ/オオプンガ）は行頭が「[」なので引用符で囲んだ。
