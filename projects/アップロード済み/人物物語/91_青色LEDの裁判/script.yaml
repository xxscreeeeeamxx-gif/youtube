meta:
  title: 青色LED、褒賞2万円の特許に地裁が認めた対価は604億円　中村修二と日亜【ずんだもん解説】
  slug: blue-led-nakamura
  summary: 1990年の秋、徳島の化学の会社で、ひとりの技術者が特許の書類に鉛筆でサインしました。社内の褒賞は、出願と登録で合わせて2万円。のちにその技術者と会社は、発明の対価をめぐって東京地裁で争います。研究を始めたのは誰か。その特許は本当に大事な技術だったのか。会社は正面から反論しました。裁判所は何を認め、最後に何が払われたのか。双方の言い分を並べて、再現ドラマでたどります。
  tags:
  - 青色LED
  - 中村修二
  - 日亜化学工業
  - 職務発明
  - 特許
  - 裁判
  - ノーベル賞
  - 赤﨑勇
  - 天野浩
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 平成史
