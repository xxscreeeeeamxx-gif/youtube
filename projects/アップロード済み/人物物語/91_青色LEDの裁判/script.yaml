scenes:
- id: co_shomei
  title: ''
  background: led_jimusho
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中村修二, emotion: normal}
  - {who: tokkyo, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1990年の秋。徳島の会社で、技術者が特許の書類にサインを求められます。
    reading: せんきゅうひゃく きゅうじゅうねんの あき。とくしまの かいしゃで、ぎじゅつしゃが とっきょの しょるいに さいんお もとめられます。
  - speaker: tokkyo
    emotion: normal
    text: 裏の[譲渡証書|じょうとしょうしょ]にも、サインを。
  - speaker: zundamon
    emotion: angry
    text: なんで1万円くれるだけで、特許を会社に譲り渡さなあかんのじゃ！
    beat: true
  - speaker: tokkyo
    emotion: sad
    text: そ、そんな……。
  - speaker: zundamon
    emotion: thinking
    text: 鉛筆で、ええですか。
  - speaker: tokkyo
    emotion: surprised
    text: え、鉛筆！？
  - speaker: reimu
    text: 本人がのちに、裁判所に書いた場面です。
    reading: ほんにんが のちに、さいばんしょに かいた ばめんです。
  - speaker: reimu
    text: この特許の対価を、東京地裁は604億円と認めます。
    reading: この とっきょの たいかお、とうきょう ちさいわ ろっぴゃくよんおくえんと みとめます。
  - speaker: reimu
    text: でも最後に払われたのは、ほかの発明も含めて約8億4000万円。なぜでしょう。
    reading: でも さいごに はらわれたのわ、ほかの はつめいも ふくめて やく はちおく よんせんまんえん。なぜでしょう。
- id: hook
  title: ''
  background: led_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
