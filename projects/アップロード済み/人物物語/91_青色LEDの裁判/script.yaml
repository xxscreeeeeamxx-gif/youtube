  - speaker: zundamon
    emotion: happy
    text: '[裏紙|うらがみ]を、メモ帳にする案！'
    se: jaan
  - speaker: tsumugi
    emotion: normal
    text: 青色LEDの研究で出た特許1件の、社内の褒賞は2万円だったのよ。
    telops:
    - {text: "特許1件の社内の褒賞　2万円", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: ボクの20倍！？
  - speaker: tsumugi
    emotion: thinking
    text: そこじゃないの。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: その特許の対価を、東京地裁は604億円と認めたの。
  - speaker: zundamon
    emotion: surprised
    text: どっちが正しいのだ！？
- id: card1979
  title: ''
  background: led_card_1979
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1979年4月。中村修二が、徳島県阿南市の日亜化学工業に入社します。
    reading: せんきゅうひゃく ななじゅうくねん しがつ。なかむら しゅうじが とくしまけん あなんしの にちあ かがく こうぎょうに にゅうしゃ します。
  - speaker: reimu
    text: 創業者は小川信雄。蛍光体の原料を作る会社で、社員は約180人でした。
    reading: そうぎょうしゃわ おがわ のぶお。けいこうたいの げんりょうお つくる かいしゃで、しゃいんわ やく ひゃくはちじゅうにんでした。
- id: ch1_nyusha
  title: 社員180人の会社
  background: led_kojo_soto
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中村修二, emotion: normal}
  - {who: douryo, x: 0.7, emotion: happy}
  cuts:
  - speaker: douryo
    emotion: happy
    text: 新人さんか。開発課へ、ようこそ。
  - speaker: zundamon
    emotion: happy
    text: よろしくお願いします。開発課は、何人ですか。
  - speaker: douryo
    emotion: normal
    text: 2人や。
  - speaker: zundamon
    emotion: surprised
    text: ふ、2人。
  - speaker: douryo
    emotion: happy
    text: 小さい会社やからな。売上も、数十億円や。
  - speaker: zundamon
    emotion: normal
    text: 最初は、何を作るんですか。
  - speaker: douryo
    emotion: normal
    text: '[リン化ガリウム|りんかがりうむ]や。'
- id: ch1_bakuhatsu
  title: 石英管が爆発する
  background: led_jikken
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中村修二, emotion: normal}
  - {who: douryo, x: 0.7, emotion: normal}
  cuts:
  - speaker: douryo
    emotion: normal
    text: 中村、それ何しよるんや。
  - speaker: zundamon
    emotion: normal
    text: '[石英管|せきえいかん]に原料を入れて、口を溶接して封じとるんじゃ。'
  - speaker: douryo
    emotion: normal
    text: 封じて、どうするんや？
  - speaker: zundamon
    emotion: normal
    text: 熱する。
  - speaker: douryo
    emotion: thinking
    text: 熱して、大丈夫なんか。
  - speaker: zundamon
    emotion: normal
    text: 毎日、やっとる。
  - speaker: douryo
    emotion: happy
    text: そろそろ、定時やな。
  - speaker: zundamon
    emotion: surprised
    text: 管が、破裂した！
    background: led_jikken_kemuri
  - speaker: douryo
    emotion: surprised
    text: 部屋が真っ白や！ 何も見えん！
  - speaker: douryo
    emotion: surprised
    text: 中村！ どこや！
  - speaker: zundamon
    emotion: thinking
    text: ……ここじゃ。
  - speaker: douryo
    emotion: thinking
    text: 声しか、聞こえへんけど。
    beat: true
- id: ch1_mata
  title: ''
  background: led_jimusho
  stage:
  - {who: douryo, x: 0.5, emotion: surprised}
  cuts:
  - speaker: douryo
    emotion: surprised
    text: また中村んとこや！ 見てくる！
  - speaker: douryo
    emotion: thinking
    text: ……3回目か。また、中村んとこやな。
  - speaker: douryo
    emotion: normal
    text: 6回目や。……お、ちょうど定時や。
  - speaker: douryo
    emotion: happy
    text: ほな、お先に〜。
    se: manuke
- id: ch1_shokunin
  title: ''
  background: led_jikken_kemuri
  stage:
  - {who: zundamon, x: 0.5, tag: 中村修二, emotion: thinking}
  cuts:
  - speaker: reimu
    text: この爆発の話を、中村はのちに寄稿に書いています。このころ、自分にこう言い聞かせていた、と。
    reading: この ばくはつの はなしお なかむらわ のちに きこうに かいて います。この ころ じぶんに こう いいきかせて いた、と。
  - speaker: zundamon
    emotion: thinking
    text: ワシは、職人じゃ。
- id: ch2_nokogiri
  title: 鉄板用のノコギリ
  background: led_jimusho
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中村修二, emotion: normal}
  - {who: joushi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 中村の寄稿によれば、こんなこともありました。
    reading: なかむらの きこうに よれば、こんな ことも ありました。
  - speaker: zundamon
    emotion: normal
    text: '[ヒ化ガリウム|ひかがりうむ]の結晶を切る機械を、買ってください。'
  - speaker: joushi
    emotion: normal
    text: なんぼするんや。
  - speaker: zundamon
    emotion: normal
    text: 約1500万円です。
  - speaker: joushi
    emotion: surprised
    text: 高い！
  - speaker: joushi
    emotion: normal
    text: '[工務課|こうむか]に、鉄板を切るノコギリがあるやろ。あれ使え。'
  - speaker: zundamon
    emotion: surprised
    text: て、鉄板用ですか。
  - speaker: joushi
    emotion: normal
    text: 切れたら、一緒や。
  - speaker: zundamon
    emotion: thinking
    text: ……では、切ってみせます。
  - speaker: zundamon
    emotion: thinking
    text: ……ほら。これでは、使えません。
  - speaker: joushi
    emotion: thinking
    text: ……あかんな。
    beat: true
  - speaker: joushi
    emotion: thinking
    text: ……買うたるわ。
  - speaker: zundamon
    emotion: normal
    text: それと青色のLEDも、やらせてください。
  - speaker: joushi
    emotion: surprised
    text: 何考えてんねん。
    beat: true
  - speaker: joushi
    emotion: angry
    text: こんな田舎の[金|かね]もない人もいないところで、そんなことできるか。
  - speaker: zundamon
    emotion: thinking
    text: ……はい、そうですね。
    beat: true
- id: ch2_shataku
  title: わしらが稼いだカネ
  background: led_shataku
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中村修二, emotion: normal}
  - {who: joushi2, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 入社7〜8年目。出張先で、蛍光体の部門の上司と同じ部屋に泊まった夜です。
    reading: にゅうしゃ ななはちねんめ。しゅっちょうさきで けいこうたいの ぶもんの じょうしと おなじ へやに とまった よるです。
  - speaker: joushi2
    emotion: normal
    text: 中村、ビール買うてきてくれ。
  - speaker: zundamon
    emotion: normal
    text: ……はい。
  - speaker: zundamon
    emotion: normal
    text: 買うてきました。
  - speaker: joushi2
    emotion: angry
    text: お前の部署は、どうなっているんだ。
  - speaker: joushi2
    emotion: angry
    text: わしらが稼いだ[金|かね]は、全部パーになる。
    se: gaan
  - speaker: zundamon
    emotion: sad
    text: ……ビール、ここに置いときます。
  - speaker: reimu
    text: 中村が10年ほどで製品にしたのは、リン化ガリウムなど3つ。どれも後発で、大きくは売れませんでした。
    reading: なかむらが じゅうねん ほどで せいひんに したのわ、りんか がりうむなど みっつ。どれも こうはつで おおきくわ うれませんでした。
    background: led_soko
- id: card1988
  title: ''
  background: led_card_1988
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 1988年。中村は、創業者の社長室を訪ねます。ここからは、中村がのちに寄稿に書いた回想です。
    reading: せんきゅうひゃく はちじゅうはちねん。なかむらわ そうぎょうしゃの しゃちょうしつお たずねます。ここからわ なかむらが のちに きこうに かいた かいそうです。
- id: ch3_shacho
  title: 青色LEDをやらせてください
  background: led_shachoshitsu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中村修二, emotion: normal}
  - {who: ogawa, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: 社長。青色LEDの開発を、やらせてください。
  - speaker: ogawa
    emotion: normal
    text: いいよ。
  - speaker: zundamon
    emotion: surprised
    text: ……え？
  - speaker: zundamon
    emotion: normal
    text: 予算も、数億円掛かりますよ。
  - speaker: ogawa
    emotion: happy
    text: それもいいよ。
    se: tenten
- id: ch3_kaisha
  title: 会社の説明は違う
  background: led_kojo_soto
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: ここまでは、中村の回想です。会社の説明は違います。
    reading: ここまでわ なかむらの かいそうです。かいしゃの せつめいわ ちがいます。
  - speaker: reimu
    text: 徳島大学の教授が共同研究を提案し、中村が窓口として、当時専務の小川英治に提案した、と。
    reading: とくしま だいがくの きょうじゅが きょうどう けんきゅうお ていあんし、なかむらが まどぐちと して とうじ せんむの おがわ えいじに ていあん した と。
  - speaker: reimu
    text: 地裁は、中村が一貫して自分から動き、会社がそれを認めてきた、と判断しました。
    reading: ちさいわ なかむらが いっかんして じぶんから うごき、かいしゃが それお みとめて きたと はんだん しました。
- id: ch4_florida
  title: フロリダの10か月
  background: led_daigaku_us
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中村修二, emotion: normal}
  - {who: gakusei, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1988年3月から約1年、中村はフロリダ大学に留学します。勧めたのはその教授で、費用は会社持ちでした。
    reading: せんきゅうひゃく はちじゅうはちねん さんがつから やく いちねん、なかむらわ ふろりだ だいがくに りゅうがく します。すすめたのわ その きょうじゅで ひようわ かいしゃもちでした。
  - speaker: gakusei
    emotion: happy
    text: ようこそ。[君|きみ]も、[博士課程|はくしかてい]の人？
  - speaker: zundamon
    emotion: normal
    text: いえ。会社から来た技術者です。
  - speaker: gakusei
    emotion: normal
    text: 論文は、何本？
  - speaker: zundamon
    emotion: thinking
    text: ……ありません。
  - speaker: gakusei
    emotion: thinking
    text: '[博士号|はくしごう]は？'
  - speaker: zundamon
    emotion: thinking
    text: ……持ってません。
  - speaker: gakusei
    emotion: happy
    text: なんだ。じゃあ、ただの技術の人だね。
  - speaker: zundamon
    emotion: sad
    text: ……技術の人。
    se: shobon
  - speaker: reimu
    text: 装置はまだ組み上がっておらず、中村は1年のうち約10か月を、配管と石英の溶接に使いました。
    reading: そうちわ まだ くみあがって おらず、なかむらわ いちねんの うち やく じゅっかげつお はいかんと せきえいの ようせつに つかいました。
  - speaker: reimu
    text: 中村は34歳。ノーベル財団の経歴は、見下されて腹が立ったという本人の言葉を引いています。
    reading: なかむらわ さんじゅうよんさい。のーべる ざいだんの けいれきわ、みくだされて はらが たったと いう ほんにんの ことばお ひいて います。
- id: ch5_kaizo
  title: 朝改造、午後実験
  background: led_jikken
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中村修二, emotion: normal}
  - {who: douryo, x: 0.7, emotion: surprised}
  cuts:
  - speaker: douryo
    emotion: surprised
    text: 中村！ 買うたばっかりの装置、もうバラしとるんか！
  - speaker: zundamon
    emotion: normal
    text: このままじゃ、ええ膜ができんのじゃ。
  - speaker: douryo
    emotion: surprised
    text: 1億3900万円もしたんやで！？
  - speaker: zundamon
    emotion: normal
    text: 配管とヒーターを、作り替える。
  - speaker: zundamon
    emotion: normal
    text: 朝に改造して、午後に実験じゃ。
  - speaker: douryo
    emotion: thinking
    text: 毎日か。
  - speaker: zundamon
    emotion: normal
    text: 毎日じゃ。
  - speaker: douryo
    emotion: sad
    text: 装置の形が、毎朝ちがう……。
    beat: true
- id: ch5_meirei
  title: 研究中止の命令はあったか
  background: led_jimusho
  cuts:
  - speaker: reimu
    text: 1990年3月末のことは、中村と会社で言い分が分かれます。
    reading: せんきゅうひゃく きゅうじゅうねん さんがつまつの ことわ、なかむらと かいしゃで いいぶんが わかれます。
  - speaker: reimu
    text: 中村は、社長から文書で、青色をやめてヒ化ガリウムをやれと命じられ、無視したと主張しています。
    reading: なかむらわ しゃちょうから ぶんしょで あおいろお やめて ひか がりうむお やれと めいじられ、むし したと しゅちょう して います。
  - speaker: reimu
    text: 2004年の地裁判決も、経営陣がヒ化ガリウムの開発を命じ、中村が指示に反して研究を続けたと認めました。
    reading: にせんよねんの ちさい はんけつも けいえいじんが ひか がりうむの かいはつお めいじ、なかむらが しじに はんして けんきゅうお つづけたと みとめました。
  - speaker: reimu
    text: 会社は否定しています。社長に身に覚えはなく、命令を無視したのなら処分があったはずだ、と。
    reading: かいしゃわ ひてい して います。しゃちょうに みに おぼえわ なく、めいれいお むし したのなら しょぶんが あった はずだ と。
- id: card1990
  title: ''
  background: led_card_1990
  bgm: curious
  cuts:
