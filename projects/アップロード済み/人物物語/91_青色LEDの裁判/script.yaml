    - {text: "中村　怒り以外に何もない", size: lg, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: kisha
    emotion: surprised
    text: い、[怒り|いかり]……。
- id: ch20_nichia
  title: ''
  background: led_kojo_soto
  stage:
  - {who: kouhou, x: 0.28, flip: true, emotion: happy}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: kisha
    emotion: normal
    text: '[日亜|にちあ]として、受賞へのコメントを。'
  - speaker: kouhou
    emotion: happy
    text: 日本人がノーベル賞を受賞したことは、大変喜ばしいことです。
  - speaker: kouhou
    emotion: normal
    text: とりわけ受賞理由が、中村氏を含む多くの[日亜|にちあ]化学社員と企業努力によって実現した
  - speaker: kouhou
    emotion: happy
    text: 青色LEDであることは、光関連技術の[日亜|にちあ]化学にとっても誇らしいことです。
  - speaker: kouhou
    emotion: normal
    text: 今後とも関係者各位のご活躍を、お祈り申し上げます。
- id: ch20_nakanaori
  title: けんかしたまま死にたくない
  background: led_kaiken
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中村修二, emotion: normal}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 11月3日。文化勲章を受けた中村は、会見で日亜に呼びかけます。
    reading: じゅういちがつ みっか。ぶんか くんしょうお うけた なかむらわ、かいけんで にちあに よびかけます。
  - speaker: zundamon
    emotion: normal
    text: われわれのノーベル賞には、[日亜|にちあ]化学の貢献が大きい。
  - speaker: zundamon
    emotion: normal
    text: '[小川英治|おがわえいじ]社長と、一緒に開発した6人の部下と全社員に感謝している。'
  - speaker: zundamon
    emotion: thinking
    text: 人生は短い。私も60歳だ。
  - speaker: zundamon
    emotion: sad
    text: けんかしたまま死にたくない。
  - speaker: zundamon
    emotion: normal
    text: できれば[小川英治|おがわえいじ]社長と直接会って、ざっくばらんに話したい。
  - speaker: kisha
    emotion: surprised
    text: ……仲直りの、呼びかけですか。
- id: ch20_kotowari
  title: ''
  background: led_kojo_soto
  stage:
  - {who: kouhou, x: 0.28, flip: true, emotion: normal}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 翌日、日亜はコメントを出します。感謝の言葉で十分だ、として。
    reading: よくじつ、にちあわ こめんとお だします。かんしゃの ことばで じゅうぶんだ と して。
  - speaker: kouhou
    emotion: normal
    text: 貴重な時間を、弊社への挨拶などに費やすことなく……。
  - speaker: reimu
    text: 研究に打ち込まれるよう祈る、と面会を断りました。
    reading: けんきゅうに うちこまれる よう いのる、と めんかいお ことわりました。
  - speaker: kisha
    emotion: thinking
    text: ……会わない、ということですね。
    beat: true
  - speaker: reimu
    text: その後の関係について、公の発表はありません。
    reading: その ごの かんけいに ついて、おおやけの はっぴょうわ ありません。
- id: ch21_ronso
  title: 青色LEDはひとりで作ったのか
  background: led_heya
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、ネットで見たのだ！
  - speaker: zundamon
    emotion: angry
    text: 青色LEDは中村さんがひとりで発明して、会社は2万円しか払わなかったって！
  - speaker: tsumugi
    emotion: normal
    text: そのまま信じると、3つ間違えるわよ。
    se: tsukkomi
  - speaker: zundamon
    emotion: surprised
    text: 3つも！？
  - speaker: tsumugi
    emotion: normal
    text: 1つ目。ノーベル賞は、[赤﨑|あかさき]さんと[天野|あまの]さんと中村さんの3人よ。
  - speaker: tsumugi
    emotion: normal
    text: 質のいい結晶も[p型|ぴーがた]も、名古屋大学の2人が先に作ってたの。
  - speaker: tsumugi
    emotion: normal
    text: '[日亜|にちあ]は、多くの社員の技術が積み重なってできたと言ってるわ。'
  - speaker: tsumugi
    emotion: normal
    text: 中村さんも、一緒に開発した6人の部下に感謝してたでしょ。
  - speaker: zundamon
    emotion: thinking
    text: ひとりじゃ、なかったのか。
  - speaker: tsumugi
    emotion: normal
    text: 2つ目。2万円は、特許1件の社内の褒賞。給料は別よ。
  - speaker: tsumugi
    emotion: normal
    text: '[日亜|にちあ]は40代半ばで、役員の平均を上回る給料だったと説明してる。'
  - speaker: tsumugi
    emotion: thinking
    text: 研究成果を2万円で取り上げたかのような言い方は、適切ではないともね。
  - speaker: tsumugi
    emotion: normal
    text: ただ地裁の判決も高裁の考えも、対価は褒賞よりずっと大きいと見たの。
  - speaker: zundamon
    emotion: thinking
    text: 給料は、別でもらってたのか。
  - speaker: tsumugi
    emotion: normal
    text: 3つ目。8億円は、[404特許|よんまるよんとっきょ]だけの値段じゃないの。
  - speaker: tsumugi
    emotion: normal
    text: 在職中の、300件を超える発明をまとめた額よ。
  - speaker: zundamon
    emotion: surprised
    text: 1件あたりだと、ずっと小さい！
  - speaker: tsumugi
    emotion: thinking
    text: しかも、どっちも満足してない。中村さんは完全な敗訴、[日亜|にちあ]は過大だって。
  - speaker: zundamon
    emotion: thinking
    text: 両方とも、負けた顔をしてるのか……。
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
- id: ch21_chui
  title: 発明は誰のものか
  background: led_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 職務発明の法律は、この裁判と同じ時期に見直しが進んだの。
  - speaker: tsumugi
    emotion: normal
    text: 2005年4月からは手続きが合理的なら、会社の決めた対価が原則として尊重されるの。
  - speaker: zundamon
    emotion: thinking
    text: あの裁判で、変わったのだ？
  - speaker: tsumugi
    emotion: normal
    text: 2003年のオリンパスの最高裁の判決とか、同じような訴えが増えてたの。
  - speaker: tsumugi
    emotion: normal
    text: この裁判だけで変わった、とは言えないわ。
  - speaker: zundamon
    emotion: thinking
    text: じゃあボクが仕事で発明したら、会社のものなのだ？
  - speaker: tsumugi
    emotion: normal
    text: 2016年からは、会社が決まりを作れば仕事でした発明を最初から会社のものにできるの。
  - speaker: zundamon
    emotion: surprised
    text: 最初から！？
    se: gaan
  - speaker: tsumugi
    emotion: normal
    text: そのかわり会社は、相当の利益を渡すの。お[金|かね]じゃなくてもいいのよ。
  - speaker: tsumugi
    emotion: thinking
    text: 中村さんはこの改正に、[怒り|いかり]を感じると反対してたわ。
  - speaker: tsumugi
    emotion: normal
    text: ずんだもんの場合は、会社の決まりしだいね。
  - speaker: tsumugi
    emotion: normal
    text: 会社によっては、職務発明の規程っていう決まりがあるの。
  - speaker: tsumugi
    emotion: normal
    text: 発明が誰のものになって、何がもらえるか。そこに書いてあるわ。
  - speaker: zundamon
    emotion: happy
    text: 裁判の前に、まず規程なのだ。
- id: ch22_gendai
  title: 青い光の今
  background: led_machi_yoru
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: happy}
  cuts:
  - speaker: tsumugi
    emotion: happy
    text: 今、全国の信号の明かりの約83.1％がLEDよ。2026年3月末の数字ね。
    telops:
    - {text: "信号の明かりの約83.1％がLED", size: md, position: top-right, color: "#9AD8FF", stroke: "#0A1A2A", glow: "#2A6AFF", anim: up}
  - speaker: zundamon
    emotion: normal
    text: 20年ちょっと前は？
  - speaker: tsumugi
    emotion: normal
    text: 2003年3月末は、1.3％。
  - speaker: zundamon
    emotion: surprised
    text: ほぼゼロから！？
  - speaker: tsumugi
    emotion: normal
    text: 電気は電球の約[6分の1|ろくぶんのいち]で、寿命は6年から8年もあるの。
  - speaker: tsumugi
    emotion: normal
    text: 電球のほうは、半年から1年だったのよ。
  - speaker: tsumugi
    emotion: normal
    text: 蛍光灯も、作るのと輸出入が順に禁止されていくの。
  - speaker: tsumugi
    emotion: normal
    text: 電球の形のものは2026年1月から。まっすぐな管も2028年までに。
  - speaker: zundamon
    emotion: sad
    text: うちの台所の蛍光灯、どうするのだ！？
    se: shobon
  - speaker: tsumugi
    emotion: happy
    text: 今ある分は、売るのも使うのも大丈夫よ。
  - speaker: zundamon
    emotion: happy
    text: ……セーフなのだ。
- id: ch22_hito
  title: ''
  background: led_machi_yoru
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: '[日亜|にちあ]は、2025年12月期の売上が3640億円。社員は9509人よ。'
  - speaker: zundamon
    emotion: surprised
    text: 180人の会社が！？
  - speaker: tsumugi
    emotion: normal
    text: 中村さんは今も、カリフォルニア大学サンタバーバラ校の教授。
  - speaker: tsumugi
    emotion: happy
    text: 2026年6月には、オックスフォード大学から名誉学位を受けたわ。
  - speaker: tsumugi
    emotion: normal
    text: 2022年には核融合の会社を仲間と立ち上げて、トップを務めてるの。
  - speaker: zundamon
    emotion: surprised
    text: 青い光の次は、太陽を作るのか！
  - speaker: tsumugi
    emotion: thinking
    text: '[赤﨑|あかさき]さんは2021年に、92歳で亡くなったわ。'
  - speaker: tsumugi
    emotion: normal
    text: '[天野|あまの]さんは2026年4月に、[名城大学|めいじょうだいがく]の学術アドバイザーになったの。'
- id: shime
  title: ''
  background: led_heya
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: ボクも、会社の規程を読んでみたのだ！
  - speaker: tsumugi
    emotion: normal
    text: どうだった？
  - speaker: zundamon
    emotion: thinking
    text: 改善提案の賞金は、1件1000円って書いてあったのだ。
  - speaker: tsumugi
    emotion: happy
    text: 規程どおりね。
    beat: true
  - speaker: zundamon
    emotion: angry
    text: でも[裏紙|うらがみ]のおかげで、会社は紙代が浮いてるのだ。貢献度を計算し直すのだ！
  - speaker: tsumugi
    emotion: thinking
    text: '[裏紙|うらがみ]の、使用料の見積もりから始める気？'
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: あなたも一度、自分の会社の規程を読んでおいてね。
  - speaker: tsumugi
    emotion: normal
    text: 2万円と604億円と、8億円。
  - speaker: tsumugi
    emotion: thinking
    text: どの数字に納得するかは、どこに立って見るかで変わるのね。
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
