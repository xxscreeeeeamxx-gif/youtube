scenes:
# ---- 先出し（2012年2月27日 朝10時・社長室。相手の会社の名前は台帳に無いので出さない。相手の声も出さない。「金額で」は本人ののちの話としてナレで） ----
- id: co_denwa
  title: ''
  background: ep_yakuin
  bgm: serious
  stage:
  - {who: zundamon, x: 0.18, flip: true, tag: 坂本社長, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2012年2月27日、朝10時。半導体メモリの会社、エルピーダの社長、坂本幸雄。
    reading: にせん じゅうにねん にがつ にじゅうしちにち、あさ じゅうじ。はんどうたい めもりの かいしゃ えるぴーだの しゃちょう、さかもと ゆきお。
  - speaker: reimu
    text: 工場の半分を買う相手の返事を待っています。
    reading: こうじょうの はんぶんお かう あいての へんじお まって います。
  - speaker: zundamon
    emotion: normal
    text: ……10時半。こちらから、かけよう。
  - speaker: zundamon
    emotion: sad
    text: ……そうですか。分かりました。
  - speaker: reimu
    text: 工場を半分買うはずだった相手とは金額で折り合わなかった、とのちに坂本は語っています。
    reading: こうじょうお はんぶん かう はずだった あいてとわ きんがくで おりあわなかったと、のちに さかもとわ かたって います。
# ---- 先出し（同じ日の夜・東京証券取引所の会見。記者の問いの原文は無いので、ナレで「経営責任を問われ」とする。言葉は PC Watch の並びどおり） ----
- id: co_kaiken
  title: ''
  background: ep_kaiken
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 坂本社長, emotion: sad}
  - {who: kisha, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: その夜、東京証券取引所で会見。更生法を申請した坂本は、経営責任や日本のDRAMの限界を問われます。
    reading: その よる、とうきょう しょうけん とりひきじょで かいけん。こうせいほうお しんせいした さかもとわ、けいえい せきにんや にほんの でぃーらむの げんかいお とわれます。
  - speaker: zundamon
    emotion: sad
    text: '[DRAM|ディーラム]の火を消したくない'
  - speaker: zundamon
    emotion: sad
    text: 私自身、会社の行く末を見届けなくてはいけない
  - speaker: reimu
    text: 負債4480億円。当時、製造業で最大の倒産です。2年半前、国はこの会社に300億円を入れていました。
    reading: ふさい よんせん よんひゃく はちじゅうおくえん。とうじ せいぞうぎょうで さいだいの とうさんです。にねんはん まえ、くにわ この かいしゃに さんびゃくおくえんお いれて いました。
# ---- 今の部屋（メモリの増設。回収は本当の注意点と締め） ----
- id: hook
  title: ''
  background: ep_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: このメモリ、増設しても数千円だったのだ。安いのだ！
    se: jaan
  - speaker: tsumugi
    emotion: thinking
    text: その安さの陰で、[日本|ニホン]でただ1社の[DRAM|ディーラム]の会社がつぶれたの。
  - speaker: tsumugi
    emotion: thinking
    text: チップ1個が、コンビニのおにぎり1つより安くなったのよ。
    telops:
    - {text: "国が300億円を入れた会社は なぜ2年半でつぶれた？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 国が300億円入れた会社が、なんで2年半でつぶれたのだ！？
# ---- 1970年・倉庫係から（30秒以内。子どもの時代・家族は描かない。先輩は名前の無いモブ） ----
- id: ch1_soko
  title: 倉庫係から
  background: ep_soko
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 坂本, emotion: normal}
  - {who: senpai, x: 0.72, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1970年。坂本は、アメリカの半導体会社の日本法人に入ります。配属は、倉庫でした。
    reading: せんきゅうひゃく ななじゅうねん。さかもとわ あめりかの はんどうたい がいしゃの にほん ほうじんに はいります。はいぞくわ そうこでした。
  - speaker: senpai
    emotion: normal
    text: 新人、この箱を棚へ運んでくれ。
  - speaker: zundamon
    emotion: surprised
    text: 半導体の会社で、倉庫番ですか！？
  - speaker: senpai
    emotion: normal
    text: 半導体も、箱で届くんだよ。
    beat: true
  - speaker: zundamon
    emotion: normal
    text: ……運びます。
# ---- 2002年11月・電話帳の稟議（東京・八重洲。幹部は名前の無いモブ。本人の2022年の回想に沿った脚色） ----
- id: card2002
  title: ''
  background: ep_card_2002
  cuts:
  - speaker: reimu
    text: 2002年11月、東京・八重洲。外資の副社長などを経た坂本が、55歳でエルピーダの社長になります。
    reading: にせん にねん じゅういちがつ、とうきょう やえす。がいしの ふくしゃちょうなどお へた さかもとが、ごじゅうごさいで えるぴーだの しゃちょうに なります。
- id: ch1_ringi
  title: 電話帳の稟議
  background: ep_ringi
  stage:
  - {who: zundamon, x: 0.13, flip: true, tag: 坂本社長, emotion: normal}
  - {who: kanbu, x: 0.9, emotion: normal}
  cuts:
  - speaker: kanbu
    emotion: normal
    text: 社長。[NEC|エヌイーシー]と日立から来た者で、新製品の開発計画をまとめました。
  - speaker: kanbu
    emotion: normal
    text: これから[稟議|りんぎ]に回します。
  - speaker: zundamon
    emotion: surprised
    text: ……電話帳ですか、これ。
  - speaker: kanbu
    emotion: normal
    text: 判子をもらう上の役職は、10段を超えます。
  - speaker: zundamon
    emotion: angry
    text: 全部通るころには、[DRAM|ディーラム]の値段が変わってますよ！
    se: tsukkomi
  - speaker: kanbu
    emotion: thinking
    text: 値段、ですか？
  - speaker: zundamon
    emotion: normal
    text: '[DRAM|ディーラム]は、毎日値段が変わる品物なんです。'
  - speaker: zundamon
    emotion: normal
    text: 装置も[毎年|まいねん]買い足さないと、負けるんです。
  - speaker: reimu
    text: のちに坂本は、DRAM1個の値段がコンビニのおにぎり1つより安い、と嘆くことになります。
    reading: のちに さかもとわ でぃーらむ いっこの ねだんが こんびにの おにぎり ひとつより やすいと なげく ことに なります。
    telops:
    - {text: "DRAM1個 ＜ おにぎり1つ", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
# ---- 2003〜2004年・広島の工場（30億円の即決。本人の2022年の回想に沿った脚色。技術者は名前の無いモブ） ----
- id: ch1_hiroshima
  title: 30億円の即決
  background: ep_cleanroom_kara
  bgm: honwaka_puppu
  stage:
  - {who: gishi, x: 0.1, flip: true, emotion: normal}
  - {who: zundamon, x: 0.5, tag: 坂本社長, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2003年、広島県東広島市。生産を任せてきたNECの工場を、エルピーダが引き取ります。
    reading: にせん さんねん ひろしまけん ひがし ひろしまし。せいさんお まかせて きた えぬいーしーの こうじょうお、えるぴーだが ひきとります。
  - speaker: gishi
    emotion: normal
    text: 社長、新しい装置が要ります。30億円ほどです。
  - speaker: zundamon
    emotion: normal
    text: 分かった。買おう。
  - speaker: gishi
    emotion: surprised
    text: えっ。[稟議|りんぎ]は……？
  - speaker: zundamon
    emotion: happy
    text: 今、ここで決める。
    background: ep_cleanroom
    beat: true
  - speaker: reimu
    text: 30億円ほどの装置なら、その場で即断即決した、と坂本はのちに語っています。
    reading: さんじゅうおくえん ほどの そうちなら そのばで そくだん そっけつ したと さかもとわ のちに かたって います。
  - speaker: gishi
    emotion: happy
    text: 社長！ 2004年の1月から3月の決算、黒字です！
  - speaker: zundamon
    emotion: happy
    text: 来てから、1年ちょっとか。次は上場だ。
# ---- 2007年・世界3位 → 2009年・過去最悪（大会議室のスクリーンが赤に。財務担当は名前の無いモブ） ----
- id: ch2_getsurei
  title: 世界3位
  background: ep_getsurei
  stage:
  - {who: zundamon, x: 0.13, flip: true, tag: 坂本社長, emotion: happy}
  - {who: zaimu, x: 0.87, emotion: happy}
  cuts:
  - speaker: zaimu
    emotion: happy
    text: 社長、2007年3月期の決算です。売上は5000億円近く、利益は過去最高です！
  - speaker: zaimu
    emotion: happy
    text: '[DRAM|ディーラム]の世界シェアは、3位です。'
  - speaker: zundamon
    emotion: happy
    text: 来たときは、5%もなかったのにな。
  - speaker: zundamon
    emotion: thinking
    text: でも3位で、どこまで投資を続けられるか……。
  - speaker: zaimu
    emotion: sad
    text: 社長……リーマン・ショックで、2009年3月期は1800億円近い赤字です。
    background: ep_getsurei_akaji
    se: gaan
  - speaker: zundamon
    emotion: sad
    text: 2年前は、過去最高だったのに……。
    telops:
    - {text: "1800億円近い赤字", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: zaimu
    emotion: sad
    text: 売れば売るほど、どうして苦しくなるんでしょう……。
  - speaker: zundamon
    emotion: normal
    text: うちだけじゃ、もたない。組む相手が要る。
# ---- 2008年11月〜・隔週の台湾（台湾の会社の人に台詞は作らない） ----
- id: ch2_taiwan
  title: 隔週の台湾
  background: ep_kaigai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 坂本社長, emotion: normal}
  - {who: zaimu, x: 0.84, emotion: normal}
  cuts:
  - speaker: zaimu
    emotion: surprised
    text: 社長、また台湾ですね。去年の11月から、2週間に1度ですよ。
  - speaker: zundamon
    emotion: normal
    text: 組む相手がいなければ、生き残れない。
  - speaker: zaimu
    emotion: thinking
    text: 台湾の会社は、どこも小さいですよ。
  - speaker: zundamon
    emotion: normal
    text: 小さくても、まとまれば大きくなる。
  - speaker: reimu
    text: なぜ組む相手が要るのか。2010年、坂本はインタビューでこう話しています。
    reading: なぜ くむ あいてが いるのか。にせん じゅうねん、さかもとわ いんたびゅーで こう はなして います。
  - speaker: zundamon
    emotion: normal
    text: 将来、[DRAM|ディーラム]産業では、2社しか生き残れないという仮説を立てました。
  - speaker: zundamon
    emotion: normal
    text: そうするとエルピーダ単独では無理。
  - speaker: reimu
    text: けれど坂本の話では、台湾との連合は幻に終わります。生き残れるのは2社。では、どこと組むのか。
    reading: けれど さかもとの はなしでわ たいわんとの れんごうわ まぼろしに おわります。いきのこれるのわ にしゃ。でわ どこと くむのか。
# ---- 2009年6月30日・産活法の第1号（財務担当は名前の無いモブ。「主役の銀行」の台詞は、のちの坂本の言葉に沿った脚色） ----
- id: card2009
  title: ''
  background: ep_card_2009
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 2009年6月30日。エルピーダは、国の支援の制度、改正産業活力再生法の認定を受けます。第1号でした。
    reading: にせん きゅうねん ろくがつ さんじゅうにち。えるぴーだわ くにの しえんの せいど かいせい さんぎょう かつりょく さいせいほうの にんていお うけます。だい いちごうでした。
- id: ch2_kuni
  title: 国の銀行が300億円
  background: ep_shingikai
  stage:
  - {who: zundamon, x: 0.14, flip: true, tag: 坂本社長, emotion: normal}
  - {who: zaimu, x: 0.86, emotion: happy}
  cuts:
  - speaker: zaimu
    emotion: happy
    text: 社長！ 国の日本政策投資銀行、略して政投銀が優先株で300億円です！
    se: levelup
  - speaker: zaimu
    emotion: happy
    text: ほかの銀行からも、約1000億円借りられます。
  - speaker: zundamon
    emotion: normal
    text: これで、次の投資ができる。
  - speaker: zaimu
    emotion: thinking
    text: ただ、うちの主役の銀行は国の銀行になったってことですよね。
  - speaker: zundamon
    emotion: thinking
    text: 主役？
  - speaker: zaimu
    emotion: normal
    text: ほかの銀行も、政投銀の動きを見ますよ。
  - speaker: zundamon
    emotion: normal
    text: 生き残るためだ。迷っている[暇|ひま]はない。
  - speaker: reimu
    text: 公的資金を受けることについて、坂本は翌年、こう話しています。
    reading: こうてき しきんお うける ことに ついて、さかもとわ よくねん こう はなして います。
  - speaker: zundamon
    emotion: normal
    text: プライドのためにそれをやらないという選択肢はない。
  - speaker: reimu
    text: 国が300億円を入れたこの会社は、なぜ2年半で行き詰まるのか。
    reading: くにが さんびゃくおくえんお いれた この かいしゃわ、なぜ にねんはんで いきづまるのか。
# ---- 2011年10月27日・半年の決算の会見（言葉は会見の記事の並びどおり） ----
- id: ch3_kessan
  title: 75円の秋
  background: ep_kaiken
  bgm: serious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 坂本社長, emotion: normal}
  - {who: kisha, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2011年10月27日、半年の決算の会見。パソコン向けDRAMの取引の値段は、前の日に0.90ドル。
    reading: にせん じゅういちねん じゅうがつ にじゅうしちにち、はんとしの けっさんの かいけん。ぱそこん むけ でぃーらむの とりひきの ねだんわ、まえの ひに れいてん きゅう ぜろ どる。
  - speaker: zundamon
    emotion: normal
    text: 1ドル76円換算だと
  - speaker: zundamon
    emotion: sad
    text: コンビニで売っているおにぎり1つよりも安い価格で売っている計算になる。
  - speaker: zundamon
    emotion: sad
    text: 為替の問題は1企業がどうこうやってもどうにもできない。
  - speaker: zundamon
    emotion: sad
    text: こうなってくると、エルピーダが生き残る道は生産ラインを台湾へ移設するしかない。
# ---- 2011年10月31日・1ドル75円32銭（会議室のグラフが赤に） ----
- id: ch3_endaka
  title: ''
  background: ep_kaigi
  stage:
  - {who: zundamon, x: 0.13, flip: true, tag: 坂本社長, emotion: thinking}
  - {who: zaimu, x: 0.87, emotion: normal}
  cuts:
  - speaker: reimu
    text: 4日後の10月31日。1ドルは75円32銭、戦後の最高値をつけます。
    reading: よっかごの じゅうがつ さんじゅういちにち。いちどるわ ななじゅうごえん さんじゅうにせん、せんごの さいたかねお つけます。
    telops:
    - {text: "1ドル＝75円32銭", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: zaimu
    emotion: normal
    text: 社長、うちの売上は9割近くが海外です。
  - speaker: zaimu
    emotion: thinking
    text: 1ドル80円なら、100ドルで8000円。75円だと、7500円です。
  - speaker: zundamon
    emotion: surprised
    text: 同じ物を同じ値段で売って、手取りだけ減るのか！？
    se: bikkuri
  - speaker: zaimu
    emotion: sad
    text: 値段も、7月から9月の3か月で4割近く下がりました。
    background: ep_kaigi_akaji
