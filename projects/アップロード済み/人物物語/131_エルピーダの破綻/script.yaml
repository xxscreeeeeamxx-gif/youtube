# ---- 論争1：国に見捨てられた？（坂本の話と、国・銀行の側の事実を主語つきで並べる） ----
- id: ronso1
  title: 国に見捨てられた？
  background: ep_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ エルピーダは、国に見捨てられたって！
  - speaker: tsumugi
    emotion: normal
    text: そういう話はあるの。坂本は2022年、政投銀の方針転換が今でも不可解だと語ったわ。
  - speaker: tsumugi
    emotion: thinking
    text: 坂本の話では、政投銀はこう言ったそうよ。
  - speaker: tsumugi
    emotion: thinking
    text: '[日本|ニホン]に[DRAM|ディーラム]は必要ない。韓国から買える。'
  - speaker: tsumugi
    emotion: normal
    text: アップルの担当者が来日して政投銀に支援を頼んだ、とも坂本は語ってるわ。
  - speaker: zundamon
    emotion: angry
    text: ほら、やっぱり見捨てたのだ！
  - speaker: tsumugi
    emotion: thinking
    text: でも、それは坂本の側の話。政投銀がそう話した記録は、確かめられなかったの。
    se: hammer
  - speaker: tsumugi
    emotion: normal
    text: それに2009年に支援を決めたのは、その国よ。
  - speaker: tsumugi
    emotion: normal
    text: 坂本も翌年には、経済産業省が信じられないぐらいに協力的だったと話してたわ。
  - speaker: tsumugi
    emotion: normal
    text: 銀行と政投銀が求めたのは、業界再編を軸にした再建計画と3月末までの提携の合意。
  - speaker: zundamon
    emotion: thinking
    text: 条件は出ていて、それが間に合わなかったのか……。
    beat: true
  - speaker: tsumugi
    emotion: thinking
    text: 円高を、坂本は1企業ではどうにもできないと言ったわ。
  - speaker: tsumugi
    emotion: normal
    text: 1ドル75円[32銭|サンジューニセン]をつけた日、政府と日銀は円売りの介入もしていたの。
  - speaker: zundamon
    emotion: thinking
    text: 国が見捨てた、とは言い切れないのだ……。
# ---- 論争2：経営が下手だった？（専門家の見方と本人の言い分を並べる） ----
- id: ronso2
  title: 経営が下手だった？
  background: ep_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 分かったのだ！ 社長の経営が下手だったのだ！
    se: hirameki
  - speaker: tsumugi
    emotion: normal
    text: 専門家の[湯之上隆|ユノガミタカシ]さんは、破綻の原因は低収益体質だったことにあると書いたわ。
  - speaker: tsumugi
    emotion: thinking
    text: チップ1個を作る費用が韓国の最大手のおよそ2倍だった、という見方よ。
  - speaker: zundamon
    emotion: surprised
    text: 2倍！？
  - speaker: tsumugi
    emotion: thinking
    text: 台湾の合弁にお[金|かね]が流れて新しい露光装置が遅れた、と見る評伝もあるわ。
  - speaker: zundamon
    emotion: thinking
    text: 投資の順番も、難しいのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 坂本は、戦略が間違っていなかったと確かめるために本を書いたと言ってるの。
  - speaker: tsumugi
    emotion: normal
    text: 本で挙げた358億円は、2011年3月期の営業利益。
  - speaker: tsumugi
    emotion: thinking
    text: でも破綻した2012年3月期は、1000億円を超える赤字の見通しだったわ。
  - speaker: tsumugi
    emotion: thinking
    text: 会見では、韓国の会社以上の開発力を持っていると考えているとも話してたわね。
  - speaker: zundamon
    emotion: thinking
    text: 下手とも、うまかったとも言い切れないのか……。
    beat: true
# ---- 本当の注意点 ----
- id: chui
  title: 本当の注意点
  background: ep_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 1つめ。国がお[金|かね]を入れた[日本|ニホン]でただ1社の会社でも、株が安全とは限らないわ。
  - speaker: tsumugi
    emotion: thinking
    text: エルピーダの株は、更生計画ですべて価値を失ったの。上場廃止は、申請の1か月後よ。
  - speaker: zundamon
    emotion: surprised
    text: 国がついてても、ゼロになるのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 2つめ。為替のニュースは、給料のニュースでもあるの。
  - speaker: tsumugi
    emotion: normal
    text: 売上の9割近くが海外なら、円高の分だけ同じ物を売っても手取りが減るわ。
  - speaker: zundamon
    emotion: thinking
    text: 円高のニュースって、ボクの給料にも関係あるの？
  - speaker: tsumugi
    emotion: normal
    text: 勤め先が海外で売っているなら、関係するかもしれないわ。
  - speaker: zundamon
    emotion: thinking
    text: 自分の会社が、どこの国で売ってるかも見るのだ。
  - speaker: tsumugi
    emotion: normal
    text: 3つめ。メモリの値段には、波があるの。
  - speaker: tsumugi
    emotion: thinking
    text: 2012年はチップ1個が1ドル前後。
  - speaker: tsumugi
    emotion: thinking
    text: いまはAIの需要でメモリが足りない、というニュースが続いてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 2025年の終わりからは、パソコンやスマホの値上がりの見通しも報じられたの。
  - speaker: zundamon
    emotion: sad
    text: ボクの数千円のメモリ、次はもっと高くなるの……？
    se: shobon
  - speaker: tsumugi
    emotion: normal
    text: 増設するなら、その時の相場を見てからね。
  - speaker: zundamon
    emotion: sad
    text: ボク、値札の安さしか見てなかったのだ……。
# ---- 現代（広島の工場の隣に新しい棟） ----
- id: card2026
  title: ''
  background: ep_card_2026
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 2026年。東京証券取引所の会見から、14年あまりがたちました。
    reading: にせん にじゅうろくねん。とうきょう しょうけん とりひきじょの かいけんから、じゅうよねん あまりが たちました。
- id: ima
  title: 広島の工場のいま
  background: ep_kojo
  stage:
  - {who: zundamon, x: 0.12, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.42, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: エルピーダは、いまどうなってるの？
  - speaker: tsumugi
    emotion: normal
    text: 2014年に、マイクロンメモリジャパンと名前を変えたわ。
  - speaker: zundamon
    emotion: sad
    text: 名前も、消えたのか……。
  - speaker: tsumugi
    emotion: normal
    text: でも広島の工場はいま、マイクロンの最先端の[DRAM|ディーラム]の拠点よ。
  - speaker: tsumugi
    emotion: normal
    text: 2025年9月、経済産業省はこの工場に最大5360億円の助成を決めたの。
    telops:
    - {text: "同じ工場に 国が最大5360億円", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: つぶれた会社の工場に、5360億円！？
  - speaker: tsumugi
    emotion: thinking
    text: 2012年、国の穴埋めは最大280億円と大臣は述べたわ。
  - speaker: tsumugi
    emotion: thinking
    text: その[13年後|ジューサンネンゴ]に、同じ工場へ最大5360億円よ。
  - speaker: tsumugi
    emotion: normal
    text: マイクロンで[DRAM|ディーラム]の開発を率いる幹部の1人も、エルピーダの元幹部なの。
  - speaker: zundamon
    emotion: normal
    text: 人も、残ったのか。
  - speaker: tsumugi
    emotion: normal
    text: 2026年7月には、新しいクリーンルームの起工式。総額1兆5000億円の計画なの。
    background: ep_kojo_koji
  - speaker: tsumugi
    emotion: normal
    text: 2028年の後半に装置を入れる予定で、AI向けのメモリを作る見通しよ。
  - speaker: reimu
    text: 起工式で岸田元首相は、高性能半導体の需要は今後ますます拡大するだろう、と述べました。
    reading: きこうしきで きしだ もと しゅしょうわ、こうせいのう はんどうたいの じゅようわ こんご ますます かくだい するだろうと のべました。
  - speaker: zundamon
    emotion: thinking
    text: 工場は、止まらなかったのか。
# ---- 締め（「DRAMの火を消したくない」を広島の工場のいまで回収。茶番のメモリを回収） ----
- id: shime
  title: ''
  background: ep_heya
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 決めたのだ！ メモリは、値段がいちばん下がった時に買うのだ！
  - speaker: tsumugi
    emotion: happy
    text: その底値のころに、[日本|ニホン]のメモリの会社がひとつ倒れたのよ。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: '[DRAM|ディーラム]の火を消したくない。破綻の日、坂本はそう言ったわ。'
  - speaker: tsumugi
    emotion: thinking
    text: 会社はアメリカの会社に渡り、名前も変わった。けれど広島の工場の火は、残ったの。
  - speaker: tsumugi
    emotion: normal
    text: そして国は今度、その工場に最大5360億円を出すと決めた。
  - speaker: tsumugi
    emotion: thinking
    text: その広島の工場で、いまAI向けのメモリを作る準備が進んでるの。
  - speaker: zundamon
    emotion: thinking
    text: おにぎりより安かったチップが、いまは足りないのか……。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: あなたのスマホの中のメモリも、その波の上にあるのよ。
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
