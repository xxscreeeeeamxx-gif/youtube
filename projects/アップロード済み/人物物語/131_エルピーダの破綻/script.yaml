meta:
  title: 「DRAMの火を消したくない」と語ったエルピーダの社長、その工場にいま国が最大5360億円【ずんだもん解説】
  slug: elpida-sakamoto
  hook_line: 国が300億円を入れた国内ただ1社のDRAMの会社は、なぜ2年半でつぶれたのか。
  summary: 2012年2月27日、日本でただ1社残ったDRAMの会社、エルピーダメモリが会社更生法の適用を申請しました。社長の坂本幸雄は、2年半前に国の銀行から300億円を受けた会社を率いていました。電話帳のような稟議、おにぎり1つより安いチップ、1ドル75円の円高、借り換えの条件、そして最後の1か月。国が支えた会社は、なぜ行き詰まったのか。本人の言葉と、国・銀行・専門家の見方を並べて、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 帝国データバンク 倒産速報「エルピーダメモリ株式会社」（2012年2月27日） https://www.tdb.co.jp/report/bankruptcy/flash/3574/
  - 日本政策投資銀行「エルピーダメモリ株式会社の会社更生手続開始の申立てについて」（2012年2月28日） https://www.dbj.jp/news/20120228_0000009399.html
  - PC Watch「エルピーダメモリ、坂本社長が事業継続と社長続投に意欲を表明」（2012年2月28日） https://pc.watch.impress.co.jp/docs/news/515056.html
  - 日本経済新聞「エルピーダ更生法申請、公的負担最大280億円」（2012年2月27日） https://www.nikkei.com/article/DGXNASFL270G5_X20C12A2000001/
  - Micron Technology プレスリリース（2012年7月2日・SEC Form 8-K） https://www.sec.gov/Archives/edgar/data/0000723125/000072312512000079/exh99-1pr.htm
  - 中国新聞「東広島のマイクロン工場、経産省が5360億円助成」（2025年9月12日） https://www.chugoku-np.co.jp/articles/-/711286
  tags:
