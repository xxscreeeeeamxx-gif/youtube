# elpida-sakamoto 読み台帳（人名・地名・社名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある（坂本は dictionary.yaml に登録済み）。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 坂本・坂本社長 / label: 記者・先輩・幹部・技術者・財務担当・枝野大臣）・テロップ・章タイトルは
# 表示専用なのでタグを付けていない。
#
# 2026-11-15 台本を書いたあと、セリフ全行を VOICEVOX の audio_query にかけた結果:
# - 坂本 は dictionary.yaml の登録（サカモト）どおりに読む。辞書の語にタグを重ねると抑揚が切れるので、
#   セリフの「坂本」にはタグを付けていない（発注書はカタカナのタグを指定していたが、辞書を優先した）。
#   坂本幸雄（フルネーム）はナレにだけ出す（reading: さかもと ゆきお）。
# - DRAM はタグなしでも ディイラム と読んだが、発注書どおり全出現を [DRAM|ディーラム] にした。
# - 日本政策投資銀行 はタグなしで ニッポンセエサクトオシギンコオ と読む。発注書は「にほん」だったが、
#   Wikipedia の冒頭の読みが「にっぽんせいさくとうしぎんこう」なので、タグを付けずに ニッポン のままにした（台帳にも入れていない）。
# - 日本 は「日本でただ1社」「日本にDRAMは」が ニッポン になる → [日本|ニホン]（文脈で読む語なので台帳には入れていない）。
#   日本政策金融公庫 はタグなしで ニッポンセエサクキンユウコオコ（公庫の正式な読みどおり）なので、そのまま。
# - 湯之上隆 はタグなしだと ユノウエ になる → [湯之上隆|ユノガミタカシ]。
# - 20nm は [20nm|ニジュウナノメートル] だと ニ/ジュウナノ… と切れた → [20nm|ニジューナノメートル]。
# - 「毎年」が マイトシ → [毎年|まいねん]。「暇はない」が イトマワナイ → [暇|ひま]。
#   「7年間心に」が シンニ → [心|こころ]。いずれも文脈で読みが変わる語なので台帳には入れていない。
# - 「金」はカネと読ませる所を全部 お[金|かね] にした。
# 2026-11-15 見直し（ep_review.md）で直した・足したセリフも audio_query にかけた:
# - 「アップルトンさん」が アップル/トンサン と割れる（カタカナのタグでも割れた）→ [アップルトンさん|アップルトンサン]。
# - 「75円32銭」の 32銭 が サンジュウ/ニセン と割れる →「1ドル75円[32銭|サンジューニセン]」。
# - 「12時半」が ジュウ/ニジハン → [12時半|ジューニジハン]。「13年後」が ジュウ/サンネンゴ → [13年後|ジューサンネンゴ]。
# - 「このまま負け犬では」が コノ/マママケイヌデワ（ママ が負け犬に付く）。[このまま|コノママ] では直らない →
#   画面の字は原文のまま、読みにだけ読点を入れる [このまま|このまま、] にした（コノ/ママ、/マケイヌデワ）。
#   テロップは原文の「このまま負け犬では終われない」のまま。
# - 「12年の苦渋」は ジュウ/ニネンノ と割れるが原文の言葉なのでそのまま。前のナレで「破綻の年から7年」と年を先に言った。
# - そのほか直した行（どの銀行も…／坂本の話では、政投銀が断ると…／相手は、アメリカのマイクロンよ／申請を、決めますか／
#   国の穴埋めは…／考えているとも…ほか）はタグなしで正しく読んだ。
# - ナレの 0.90ドル の reading を「れいてん きゅう ぜろ どる」に直した（以前は きゅうじゅう）。
# - エルピーダ（エルピイダ）・マイクロン・政投銀（セエトオギン）・会社更生法・更生法・管財人・優先株・円高・半導体・
#   稟議（タグなしでも リンギ）・損害担保・経済産業省・ハイニックス・アップルトン・苦渋・行く末・経営統合・
#   性急・露光装置・合弁・低収益体質・資本金・75円32銭（ナナジュウゴエン/サンジュウニセン）・底値（ソコネ）
#   はタグなしで正しく読んだ。タグを重ねると抑揚が切れるので、
#   稟議 以外は台帳に入れていない（稟議 は発注書の指定なのでタグを付けて台帳に入れた）。
