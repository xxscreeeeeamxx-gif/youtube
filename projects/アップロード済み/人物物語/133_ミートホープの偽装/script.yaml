meta:
  title: 「指示したことがある」と認めたミートホープの社長、報道から27日で会社は破産した【ずんだもん解説】
  slug: meathope-tanaka
  hook_line: ミートホープの社長の説明は「2、3回」から1日で「7、8年前から」に変わった。
  summary: 2007年6月、北海道苫小牧のひき肉の会社ミートホープ。牛肉と書いた箱の中身に、豚や鶏が混ざっていたと報じられます。社長の田中稔の説明は「間違った製品」「2、3回」と日ごとに変わり、3日目の会見で「指示したことがある」と認めました。挽いてしまえば見えない肉と、会社どうしの取引に表示の義務が無かった時代。札幌地裁の判決、農林水産省の発表、会見の言葉を、主語と日付を分けて並べ、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 札幌地方裁判所 平成20年3月19日判決（平成19(わ)1454 不正競争防止法違反，詐欺被告事件）全文 https://www.courts.go.jp/assets/hanrei/hanrei-pdf-36276.pdf
  - 農林水産省「「牛ミンチ」事案について（経緯と今後の対応）」（食品の業者間取引の表示のあり方検討会 資料3、2007年7月10日） https://www.maff.go.jp/j/jas/kaigi/pdf/070710_siryou3.pdf
  - 衆議院 答弁書（内閣衆質166第458号、2007年7月10日） https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b166458.htm
  - 農林水産省 パンフレット「これまで表示義務がなかった業者間取引にも表示が義務付けられました!!」 https://www.maff.go.jp/j/jas/hyoji/pdf/pamph_k.pdf
  - 帝国データバンク 倒産速報「ミートホープ株式会社」 https://www.tdb.co.jp/report/bankruptcy/flash/2397/
  - 中日新聞「ミートホープ事件告発、赤羽喜六さん死去」（2023年4月20日） https://www.chunichi.co.jp/article/675900
