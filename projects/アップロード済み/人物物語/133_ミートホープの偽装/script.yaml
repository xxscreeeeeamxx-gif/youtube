  - {who: jomu, x: 0.84, emotion: sad}
  cuts:
  - speaker: reimu
    text: 判決の日、傍聴した元常務はこう話しています。
    reading: はんけつの ひ、ぼうちょう した もと じょうむわ こう はなして います。
  - speaker: jomu
    emotion: sad
    text: 程度の差こそあれ、私も不正に加担したと言える。
  - speaker: jomu
    emotion: sad
    text: 正しいことをしたという思いが半分、そして後悔が半分。
