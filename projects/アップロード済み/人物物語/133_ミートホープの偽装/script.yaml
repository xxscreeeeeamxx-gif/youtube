# ---- 論争1：安く求めた側も悪い？（社長の言い分 → 判決の答え。消費者を地の文で責めない） ----
- id: ronso1
  title: 安く求めた側も悪い？
  background: mh_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ 安い肉を求めた取引先も、半額で喜ぶ客も悪いって！
  - speaker: tsumugi
    emotion: normal
    text: 社長も法廷で、取引先業者にも原因があったと言っていたわね。
  - speaker: tsumugi
    emotion: normal
    text: 取引先が求める安い単価に応えるには混ぜるほかなかった、とも述べたの。
  - speaker: zundamon
    emotion: happy
    text: ほら、やっぱりなのだ！
  - speaker: tsumugi
    emotion: normal
    text: でも判決は、こう答えているの。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: 価格交渉を尽くすなど他の適法な手段を採り得たのはいうまでもなく、
  - speaker: tsumugi
    emotion: normal
    text: この点は特に酌量すべき事情とはいえない。
  - speaker: zundamon
    emotion: thinking
    text: 値段の交渉を、すればよかったのか……。
  - speaker: tsumugi
    emotion: thinking
    text: 安さを求めることと、だますことは別なの。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、半額で買ったボクも悪いの？
  - speaker: tsumugi
    emotion: normal
    text: 買う人は、表示を信じて買っただけよ。判決は、こう書いているの。
  - speaker: tsumugi
    emotion: normal
    text: 表示を信頼した多数の関係者や一般消費者を裏切る著しく背信的な犯罪
  - speaker: tsumugi
    emotion: normal
    text: 取引先も被害者として、ブランドへの信頼が一瞬で崩れたと訴えていたわ。
  - speaker: tsumugi
    emotion: normal
    text: 判決の日の新聞によれば、検察は全国の消費者を真の被害者と考えていたの。
  - speaker: tsumugi
    emotion: normal
    text: 検察幹部の1人は、こう話しているわ。
  - speaker: tsumugi
    emotion: normal
    text: 司直の判断は時代に応じて変化する。今の社会では、絶対に許されない犯罪だった。
# ---- 論争2：法律の穴だった？（穴は JAS 法。罪は不正競争防止法と詐欺。368トンと約138トンを混ぜない） ----
- id: ronso2
  title: 法律の穴だった？
  background: mh_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: でも会社どうしなら、表示しなくてよかったのだ！ 法律の穴なのだ！
  - speaker: tsumugi
    emotion: normal
    text: 穴があったのは、JAS法。会社どうしの取引に、表示の義務が無かったの。
  - speaker: tsumugi
    emotion: thinking
    text: でも罪になったのは、別の2つの法律よ。
    telops:
    - {text: "罪は 不正競争防止法違反と詐欺", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 牛肉だけのように見せるシールを貼って送った。これが、不正競争防止法違反。
  - speaker: tsumugi
    emotion: normal
    text: その中身で、代金をだまし取った。これが、詐欺。
  - speaker: zundamon
    emotion: surprised
    text: 表示の義務が無くても、うそのシールはだめなんだ！？
  - speaker: tsumugi
    emotion: normal
    text: そう。罪と認められたのは、約138トンを送ったこと。
  - speaker: tsumugi
    emotion: normal
    text: それと、3社から3926万円あまりをだまし取ったことよ。
  - speaker: tsumugi
    emotion: thinking
    text: 農水省の調べの368トンとは、数え方が違うの。
  - speaker: zundamon
    emotion: thinking
    text: 穴をくぐったつもりで、別の法律に引っかかったのだ……。
    beat: true
# ---- 本当の注意点（原材料名は重い順／食品表示110番／生協の10回の検査は1行。92本目の「記録を残す」にしない） ----
- id: chui
  title: 原材料名は重い順
  background: mh_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 1つめ。加工食品の原材料名は、重い順に書いてあるわ。
  - speaker: tsumugi
    emotion: normal
    text: 牛肉・豚肉・玉ねぎと並んでいたら、いちばん多いのは牛肉。
  - speaker: tsumugi
    emotion: normal
    text: ハンバーグなら、最初に[何|なん]の肉が書いてあるかを見るの。
  - speaker: zundamon
    emotion: happy
    text: 牛肉って最初に書いてあれば、安心なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: ただこの事件は、お店の表示を見ても見抜けなかったの。
  - speaker: zundamon
    emotion: surprised
    text: えっ、なんで！？
  - speaker: tsumugi
    emotion: normal
    text: うそは、会社どうしの取引の中にあったから。
  - speaker: tsumugi
    emotion: normal
    text: だから2008年4月から、会社どうしの取引にも表示の義務ができたの。
  - speaker: tsumugi
    emotion: normal
    text: 2つめ。おかしいと思った表示は、食品表示110番へ。
  - speaker: tsumugi
    emotion: normal
    text: 農林水産省が、電話とメールで受け付けているわ。
  - speaker: tsumugi
    emotion: thinking
    text: 2006年の2月に[苫小牧|トマコマイ]へ届いた情報も、この110番だったの。
  - speaker: zundamon
    emotion: thinking
    text: 届いては、いたんだ……。
  - speaker: tsumugi
    emotion: normal
    text: 3つめ。安すぎる理由は、お店にもお客にも分からないことがある。
  - speaker: tsumugi
    emotion: thinking
    text: コロッケが受けていた10回の品質検査でも、見つからなかったのよ。
  - speaker: zundamon
    emotion: sad
    text: 10回でも……。
    se: shobon
# ---- 現代（2026年11月時点。改正公益通報者保護法は1行。社長のその後は言わない） ----
- id: card2026
  title: ''
