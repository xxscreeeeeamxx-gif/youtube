scenes:
# ---- 先出し（2007年6月21日 夕〜夜・本社2階の広間の会見。記者の問いは原文が無いので趣旨まで。長男は名前・年齢・呼びかけを作らない。会見を嘲らない・SEなし） ----
- id: co_kaiken
  title: ''
  background: mh_hiroma
  bgm: serious
  stage:
  - {who: zundamon, x: 0.12, flip: true, tag: 田中社長, emotion: sad}
  - {who: kisha, x: 0.88, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2007年6月21日、北海道苫小牧。牛ひき肉の偽装を問われたミートホープの社長、田中稔の会見です。
    reading: にせん ななねん ろくがつ にじゅういちにち、ほっかいどう とまこまい。ぎゅうひきにくの ぎそうお とわれた みーとほーぷの しゃちょう、たなか みのるの かいけんです。
  - speaker: kisha
    emotion: normal
    text: 指示していたという証言がありますが
    pause_after: 0.5
- id: co_kaiken2
  title: ''
  background: mh_hiroma
  stage:
  - {who: zundamon, x: 0.12, flip: true, tag: 田中社長, emotion: sad}
  - {who: torishimari, x: 0.88, emotion: sad}
  cuts:
  - speaker: torishimari
    emotion: sad
    text: やったなら、やったと認めてください。
  - speaker: torishimari
    emotion: sad
    text: あいまいな表現はやめて、本当のことを言ってください
  - speaker: zundamon
    emotion: sad
    text: ……指示したことがある
  - speaker: reimu
    text: 前の日には、やったのは2、3回と言っていました。報道から27日で、会社は自己破産を申請します。
    reading: まえの ひにわ やったのわ にさんかいと いって いました。ほうどうから にじゅうしちにちで、かいしゃわ じこはさんお しんせい します。
# ---- 今の部屋（挽いたら分からないハンバーグ。20秒以内） ----
- id: hook
  title: ''
  background: mh_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 今日のハンバーグ、[牛100%|ぎゅうひゃくパーセント]なのだ！
    se: jaan
  - speaker: tsumugi
    emotion: thinking
    text: ……このひき肉、半分お豆腐じゃない？
  - speaker: zundamon
    emotion: normal
    text: 挽いたら分からないのだ。
    beat: true
  - speaker: tsumugi
    emotion: thinking
    text: それを何年も、会社で続けた社長がいたの。
  - speaker: tsumugi
    emotion: thinking
    text: '[牛100%|ぎゅうひゃくパーセント]のはずのひき肉に、なぜ豚や鶏が混ざっていたのか。'
    telops:
    - {text: "牛100%のはずが なぜ豚や鶏が？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 牛肉のはずが、豚や鶏！？
# ---- 1976年・焼肉にならない切れ端（30秒以内。子供時代は描かない。社長は台詞なし・判決の地の文をナレで） ----
- id: card1976
  title: ''
  background: mh_card_1976
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1976年6月、苫小牧。中学を出て食肉の業者で働いた田中稔が、ミートホープを興します。
    reading: せんきゅうひゃく ななじゅうろくねん ろくがつ、とまこまい。ちゅうがくお でて しょくにくの ぎょうしゃで はたらいた たなか みのるが みーとほーぷお おこします。
- id: ch1_hazai
  title: 焼肉にならない切れ端
  background: mh_kojo
  stage:
  - {who: zundamon, x: 0.5, flip: true, tag: 田中社長, emotion: normal}
  cuts:
  - speaker: reimu
    text: 最初の得意先は、焼肉店など。焼肉にできない切れ端が、たくさん出ました。
    reading: さいしょの とくいさきわ やきにくてんなど。やきにくに できない きれはしが たくさん でました。
  - speaker: reimu
    text: 判決によれば、彼は見た目だけでは何の挽肉かわからないなどと考えました。
    reading: はんけつに よれば、かれわ みためだけでわ なんの ひきにくか わからないなどと かんがえました。
  - speaker: reimu
    text: 会社を作って数年後には、牛挽肉に豚や羊のくず肉を混ぜ始めます。この考えが30年後、彼を法廷に立たせます。
    reading: かいしゃお つくって すうねんごにわ ぎゅうひきにくに ぶたや ひつじの くずにくお まぜはじめます。この かんがえが さんじゅうねんご、かれお ほうていに たたせます。
# ---- 2006年ごろ・工場（先輩と新人は名前の無いモブ。手口は判決と農水省の範囲。社長は台詞なし） ----
- id: ch3_kojo
  title: 二度挽き
  background: mh_kojo
  bgm: kinakusai
  stage:
  - {who: senpai, x: 0.36, flip: true, emotion: normal}
  - {who: shinjin, x: 0.52, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2006年ごろ。苫小牧の工場です。
    reading: にせん ろくねん ごろ。とまこまいの こうじょうです。
  - speaker: shinjin
    emotion: surprised
    text: 先輩、この切れ端の山はどうするんですか。
  - speaker: senpai
    emotion: normal
    text: 焼肉にならない切れ端は、どこへ行くと思う？
  - speaker: shinjin
    emotion: thinking
    text: ……ゴミ箱？
  - speaker: senpai
    emotion: happy
    text: 挽肉機さ。
    background: mh_hikiniku
  - speaker: shinjin
    emotion: surprised
    text: 牛肉の箱に、豚の切れ端も入ってますけど！？
  - speaker: senpai
    emotion: normal
    text: 挽いてしまえば、見た目じゃ分からない。
  - speaker: shinjin
    emotion: thinking
    text: 箱のシールは、[十勝|トカチ]産[牛|ギュウ]バラ挽肉……。
  - speaker: senpai
    emotion: normal
    text: 会社どうしの取引に、表示の決まりは無いからな。
  - speaker: senpai
    emotion: normal
    text: 取引先は大きくなる一方だ。量も増える。
  - speaker: reimu
    text: 社長はのちの会見で、混ぜると1、2割安くなったと話します。1000円の牛ひき肉なら800円か900円。
    reading: しゃちょうわ のちの かいけんで まぜると いちにわり やすく なったと はなします。せんえんの ぎゅうひきにくなら はっぴゃくえんか きゅうひゃくえん。
  - speaker: shinjin
    emotion: thinking
    text: でも、色が白っぽいです。
  - speaker: senpai
    emotion: normal
    text: 豚の血液製剤で、赤みを付ける。
  - speaker: shinjin
    emotion: surprised
    text: 血で！？ でもよく見ると、粒が違いますよ。
  - speaker: senpai
    emotion: normal
    text: もう1回、機械に通す。二度[挽き|ビキ]だ。
  - speaker: shinjin
    emotion: thinking
    text: ……もう、[何|なん]の肉か分からないです。
  - speaker: senpai
    emotion: happy
    text: それでいいんだ。
    beat: true
  - speaker: shinjin
    emotion: thinking
    text: じゃあ、豚挽肉の色が悪いときは？
  - speaker: senpai
    emotion: normal
    text: 牛の心臓を入れる。
  - speaker: shinjin
    emotion: surprised
    text: 今度は逆！？
    se: zukko
- id: ch3_shacho
  title: ''
  background: mh_hikiniku
  stage:
  - {who: zundamon, x: 0.12, flip: true, tag: 田中社長, emotion: normal}
  cuts:
  - speaker: reimu
    text: 判決によれば、手口を考えて従業員に指示したのは社長でした。
    reading: はんけつに よれば、てぐちお かんがえて じゅうぎょういんに しじ したのわ しゃちょうでした。
# ---- 今の部屋（表示の義務の穴と、問いの言い換え2つ） ----
- id: heya1
  title: ''
  background: mh_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: シールは牛肉なのに、表示の決まりが無いの！？
  - speaker: tsumugi
    emotion: normal
    text: 当時は、消費者向けの品を作る会社にだけ表示の義務があったの。
  - speaker: tsumugi
    emotion: normal
    text: 会社どうしは、規格書のやりとりで正しく伝わっている。そういう前提だったのよ。
  - speaker: zundamon
    emotion: thinking
    text: 規格書って？
  - speaker: tsumugi
    emotion: normal
    text: 中身はこうです、と書いた紙。買う会社は、その紙を信じるの。
  - speaker: zundamon
    emotion: happy
    text: 紙を信じるだけ！？ じゃあ、罪にもならないのだ！
  - speaker: tsumugi
    emotion: thinking
    text: それが、罪になるの。
    beat: true
  - speaker: tsumugi
    emotion: thinking
    text: 表示の義務が無いのに、なぜ罪になったのか。
  - speaker: tsumugi
    emotion: normal
    text: しかもこの社長は2、3回と言った次の日に7、8年前からと言い直すの。
  - speaker: zundamon
    emotion: surprised
    text: 1日で、何があったの！？
# ---- 2006年4月・国の表彰（業績と判決の言葉を並べるだけ。地の文で茶化さない） ----
- id: card2006
  title: ''
  background: mh_card_2006
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 2006年4月。苫小牧の社長が、国の表彰を受けます。
    reading: にせん ろくねん しがつ。とまこまいの しゃちょうが、くにの ひょうしょうお うけます。
- id: ch2_hyosho
  title: 国の表彰
  background: mh_hyosho
  stage:
  - {who: zundamon, x: 0.18, flip: true, tag: 田中社長, emotion: happy}
  - {who: jugyoin, x: 0.84, emotion: happy}
  cuts:
  - speaker: jugyoin
    emotion: happy
    text: 社長、文部科学大臣の表彰ですよ！
    se: levelup
  - speaker: jugyoin
    emotion: normal
    text: 攪拌機付きひき肉製造器の考案、だそうです。
  - speaker: jugyoin
    emotion: happy
    text: これで、うちの機械も有名ですね！
  - speaker: reimu
    text: 推薦したのは北海道庁。のちの判決は、長年の経験で培った専門的知識を彼が悪用したと書きます。
    reading: すいせん したのわ ほっかいどうちょう。のちの はんけつわ、ながねんの けいけんで つちかった せんもんてき ちしきお かれが あくよう したと かきます。
  - speaker: reimu
    text: 国にたたえられたひき肉の機械。その工場で何が挽かれていたかは、まだ表に出ていません。
    reading: くにに たたえられた ひきにくの きかい。その こうじょうで なにが ひかれて いたかわ、まだ おもてに でて いません。
# ---- 2006〜2007年・抜き打ち検査（「片づけろ」は先輩のモブ。社長の台詞にしない。判決は「従業員に隠蔽を指示」まで） ----
- id: ch4_kensa
  title: 抜き打ち検査
  background: mh_kojo
  bgm: curious
  stage:
  - {who: senpai, x: 0.41, flip: true, emotion: normal}
  - {who: shinjin, x: 0.59, emotion: surprised}
  cuts:
  - speaker: shinjin
    emotion: surprised
    text: 先輩！ 取引先の検査の人が、いきなり来ました！
  - speaker: senpai
    emotion: normal
    text: 片づけろ。豚の箱は奥だ。
  - speaker: shinjin
    emotion: surprised
    text: ……作業台の上、見たことないくらいきれいです。
    background: mh_kojo_katazuke
  - speaker: reimu
    text: 判決によれば抜き打ち検査のときは、社長が従業員に隠すよう指示していました。
    reading: はんけつに よれば ぬきうち けんさの ときわ、しゃちょうが じゅうぎょういんに かくすよう しじ して いました。
- id: ch4_kensa2
  title: ''
  background: mh_kojo_katazuke
  stage:
  - {who: kensain, x: 0.41, flip: true, emotion: normal}
  - {who: shinjin, x: 0.59, emotion: thinking}
  cuts:
  - speaker: kensain
    emotion: normal
    text: '[牛挽肉|ギュウヒキニク]の工程を、見せてもらいます。'
  - speaker: shinjin
    emotion: thinking
    text: ど、どうぞ……。
  - speaker: kensain
    emotion: normal
    text: 冷凍庫も、見せてください。
  - speaker: shinjin
    emotion: surprised
    text: れ、冷凍庫は……。
  - speaker: kensain
    emotion: normal
    text: 肉の色も、きれいですね。
  - speaker: kensain
    emotion: normal
    text: ……問題ありませんね。
    beat: true
- id: ch4_kensa3
  title: ''
  background: mh_kojo
  stage:
  - {who: senpai, x: 0.41, flip: true, emotion: normal}
  - {who: shinjin, x: 0.59, emotion: thinking}
  cuts:
  - speaker: shinjin
    emotion: thinking
    text: 先輩、昨日あれだけ片づけたのに……。
  - speaker: senpai
    emotion: normal
    text: 検査は、昨日で終わりだ。
  - speaker: shinjin
    emotion: normal
    text: ……もう、元どおり。
    se: tenten
  - speaker: reimu
    text: 生協のコロッケも発覚までに10回の品質検査を受けていましたが、見抜けませんでした。
    reading: せいきょうの ころっけも はっかくまでに じゅっかいの ひんしつ けんさお うけて いましたが、みぬけませんでした。
# ---- 最後のごみ箱（13項目は画面の一覧で1回、読むのは2つまで。取引先の工場長は名前を出さない・取引先ぐるみと言わない） ----
- id: ch5_gomi
  title: 何でも引き取る
  background: mh_reito
  bgm: kinakusai
  stage:
  - {who: senpai, x: 0.18, flip: true, emotion: normal}
  - {who: shinjin, x: 0.84, emotion: surprised}
  cuts:
  - speaker: shinjin
    emotion: surprised
    text: 冷凍庫の奥の箱、よその会社の処分品ですか！？
  - speaker: senpai
    emotion: normal
    text: うちは、[何|なん]でも引き取る。
  - speaker: reimu
    text: 十勝の業者は新聞に、全部引き取るので最後のごみ箱と言われていたと話しています。
    reading: とかちの ぎょうしゃわ しんぶんに、ぜんぶ ひきとるので さいごの ごみばこと いわれて いたと はなして います。
  - speaker: reimu
    text: 農水省によれば2002年ごろ、取引先の工場長から捨てるはずのコロッケを1個5〜10円で買っていました。
    reading: のうすいしょうに よれば にせん にねん ごろ、とりひきさきの こうじょうちょうから すてる はずの ころっけお いっこ ごえんから じゅうえんで かって いました。
  - speaker: shinjin
    emotion: surprised
    text: 1個5円！？
  - speaker: reimu
    text: 農水省の調べで分かった不正は、牛挽肉のほかにもあって全部で13項目にのぼります。
    reading: のうすいしょうの しらべで わかった ふせいわ、ぎゅうひきにくの ほかにも あって ぜんぶで じゅうさん こうもくに のぼります。
    slide:
      title: 農水省の調べ　不正は13項目
      bullets:
      - 牛挽肉に豚・鶏・鴨など
      - 牛脂に豚脂
      - 冷凍食品の賞味期限の改ざん
# ---- 2006年4月・名刺とひき肉（元常務は故人。台詞は本人の公の言葉だけ。2月の情報と同じ人の話にしない） ----
- id: ch6_madoguchi
  title: 名刺とひき肉
  background: mh_madoguchi
  bgm: kinakusai
  stage:
  - {who: jomu, x: 0.18, flip: true, emotion: normal}
  - {who: madoguchi, x: 0.84, emotion: normal}
  cuts:
  - speaker: reimu
    text: 表彰と同じ月。1995年から常務を務めた赤羽喜六が辞職願を出し、農林水産省の農政事務所へ向かいます。
