# meathope-tanaka 読み台帳（人名・地名・社名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある（人名・地名のタグはカタカナ）。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 田中社長 / 田中、label: 取締役・記者・工場長・先輩・新人・検査員・窓口の人・元常務・従業員・裁判長）・
# テロップ・スライド・章タイトルは表示専用なのでタグを付けていない。
#
# 2026-11-18 台本を書いたあと、セリフ全行を VOICEVOX の audio_query（話者3）にかけた結果:
# - 苫小牧 はタグなしだと トマコマキ になる → [苫小牧|トマコマイ] で トマコマイ。
# - 牛挽肉 はタグなしだと ウシヒキニク → [牛挽肉|ギュウヒキニク]（カタカナのタグ）で ギュウヒキニク（1語）。
#   ひらがなのタグ [牛挽肉|ぎゅうひきにく] だと ギュウ/ヒキニク と切れた。
# - 牛ミンチ はタグなしだと ウシミンチ → [牛ミンチ|ギュウミンチ] で ギュウミンチ（ひらがなのタグは ギュウ/ミンチ と切れた）。
# - 牛100% はタグなしだと ウシ/ヒャクパアセント → [牛100%|ぎゅうひゃくパーセント] で ギュウ/ヒャクパアセント。
# - 「牛」だけの所は ウシ になるので、セリフは「牛肉」と書いた（シールは牛肉なのに・牛肉のはずが・牛肉の箱に）。
#   シールの文字「十勝産牛バラ挽肉」はタグなしだと トカチサン/ウシバラヒキニク → [十勝|トカチ]産[牛|ギュウ]バラ挽肉 で
#   トカチサン/ギュウバラヒキニク。[十勝産牛バラ挽肉|…] と丸ごとタグにすると ト/カ/チサン… と切れた。
# - 二度挽き はタグなしだと ニド/ヒキ（濁らない）、[二度挽き|ニドビキ] は ニ/ドビキ、[二度挽き|にどびき] は ニ/ド/ビキ と切れた。
#   2026-11-18 見直しで 二度[挽き|ビキ] に替えた（ニド/ビキダ でいちばん自然）。ナレに出ないので台帳からは外した。
# - 見直しで足した「あの時はね、」はタグなしだと アノ/トキ/ハネ（羽根）になる → あの時[はね|ワね] で アノ/トキワネ。
# - 見直しで足した記者の問い（いつから偽装していたのか・違法行為とは考えなかったか・理由は・どれくらい安くなるのか）、
#   挽肉に牛の血小板やとり皮（ヒキニクニ/ウシノ/ケッショオバンヤ/トリカワ）、田中社長は、不正と認識していた（タナカ/シャチョオワ）、
#   BSEが問題になって以降（ビイエスイイガ）、食品表示110番（ショクヒンヒョオジヒャクトオバン）はタグなしで正しく読んだ。
# - 何の肉 はタグなしだと ナニノ → [何|なん]の で ナンノ。「何でも」も ナニデモ → [何|なん]でも。
# - 道（北海道庁のこと）は「道は」「道への」が ミチワ・ミチエノ になる → [道|どう] で ドオ。道庁・道警 はタグなしで ドオチョオ・ドオケエ。
#   「道」は北海道・道庁の字にも当たるので台帳には入れていない（タグで直した）。
# - 10－20％ はタグなしだと イチゼロ/ニジュッパアセント → [10－20％|ジッカラニジッパーセント] で ジッカラニジッパアセント（1語）。
# - 05年11月〜06年7月 は「〜」が読まれず ゼロゴオネン ジュウイチガツ ゼロロクネン … になる → [〜|から] で ジュウイチガツカラ。
# - 食品Gメン はタグなしだと ショクヒン/ジイ/メン → 食品[Gメン|ジーメン] で ショクヒンジイメン。
# - 懲役4年 は [懲役4年|ちょうえきよねん] で チョオエキヨネン（1語）。
# - タグを付けると崩れるので、タグなしで台帳に入れていない語（タグなしで正しく読む）:
#   不正競争防止法（フセエ/キョオソオボオシホオ。カタカナのタグは フセイキョオ/ソオ/ボウ… と切れた）、
#   罪障感（ザイショオカン。ひらがなのタグは ザイショ/ウカン と切れた）、110番（ヒャクトオバン。タグは ヒャクト/オ/バン と切れた）、
#   血液製剤（ケツエキセエザイ）、挽肉機（ヒキニクキ）、攪拌機付きひき肉製造器（カクハンキツキ/ヒキニクセエゾオキ）、
#   JAS法（ジャスホオ）、詐欺（サギ）、利欲的（リヨクテキ）、一線を画す（イッセンオ/カクス）、悔悟（カイゴ）、
#   酌量（シャクリョオ）、採り得た（トリエタ）、加担（カタン）、司直（シチョク）、道庁（ドオチョオ）、道警（ドオケエ）、
#   挽いて・挽いたら（ヒイテ・ヒイタラ）、豚挽肉（ブタヒキニク）、冷凍庫（レエトオコ）、作業台（サギョオダイ。「台の上」だけだと タイ になるので作業台にした）、
#   社内の人かどうか（「社内の人かは」だと ジンカ になったので言い換えた）、ミートホープ（ミイトホオプ）。
