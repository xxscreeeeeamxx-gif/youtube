# ---- 論争1：最初からつぶすつもり？ ----
- id: ronso1
  title: 最初からつぶすつもり？
  background: tm_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ 最初からつぶすつもりで、客のお[金|かね]を集めてたって！
  - speaker: tsumugi
    emotion: normal
    text: そう見られた事実はあるの。払えない日の新聞にも、広告が出てた。
  - speaker: tsumugi
    emotion: normal
    text: 破産の直前まで、前払いを促す広告を出してたわ。
  - speaker: zundamon
    emotion: angry
    text: ほら、やっぱりなのだ！
  - speaker: tsumugi
    emotion: normal
