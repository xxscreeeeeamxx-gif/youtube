    emotion: angry
    text: じゃあ、安すぎるツアーに飛びついた客も悪いのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 安さには理由があった。けれど、その理由は帳簿の上では見えないようにされていたの。
  - speaker: tsumugi
    emotion: normal
    text: 帳簿は資産超過。客が会社の決算を調べる手段も、ほとんど無かったわ。
  - speaker: tsumugi
    emotion: normal
    text: それに協会の正会員で、それまでの破綻では全額戻ることが多かったの。
  - speaker: zundamon
    emotion: sad
    text: 見ても、分からなかったのか……。
    beat: true
  - speaker: tsumugi
    emotion: thinking
    text: 国もこのあと、つぶれたときに返せる額を増やす方向で決まりを変えたわ。
  - speaker: zundamon
    emotion: thinking
    text: 客だけのせいには、できないか……。
# ---- 本当の注意点 ----
- id: chui
  title: 払う前に立ち止まる
  background: tm_heya
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 本当の注意点は、別にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 1つめ。出発のずっと前に全額を現金で、とせかす広告は立ち止まる合図よ。
  - speaker: zundamon
    emotion: sad
    text: ボクのハワイ、全額現金で払っちゃったのだ……。
    se: shobon
  - speaker: tsumugi
    emotion: normal
    text: 2017年12月の業界の指針では、海外のパッケージツアーの申込金は原則2割まで。
  - speaker: zundamon
    emotion: surprised
    text: 2割！？ ボク、10割払ったのだ！
  - speaker: tsumugi
    emotion: normal
    text: 2つめ。旅行会社がつぶれたら、すぐ協会か役所の窓口へ。
  - speaker: zundamon
    emotion: thinking
    text: どっちに行けばいいの？
  - speaker: tsumugi
    emotion: normal
    text: 会社が入っている協会か、会社が登録した役所よ。申し出は早いほどいいわ。
  - speaker: tsumugi
    emotion: thinking
    text: 協会が返せるのは、その会社が積んだ額の5倍まで。全額とは限らないの。
  - speaker: zundamon
    emotion: thinking
    text: 協会が、全部返してくれるわけじゃない……。
  - speaker: tsumugi
    emotion: normal
    text: 申し込む前に、上限を超えた分を補う保証に入っている会社かも見てね。
  - speaker: tsumugi
    emotion: thinking
    text: てるみくらぶは、その保証に入っていなかったの。
  - speaker: tsumugi
    emotion: normal
    text: 3つめ。カードで払ったなら、まずカード会社に聞いてみて。
  - speaker: tsumugi
    emotion: normal
    text: 払い方によっては、支払いを止められる場合があるの。
  - speaker: zundamon
    emotion: normal
    text: 協会と、カード会社。窓口は2つ。
