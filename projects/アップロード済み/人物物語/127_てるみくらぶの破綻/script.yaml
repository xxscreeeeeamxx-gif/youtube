scenes:
# ---- 先出し（2017年3月27日 午前11時30分・国土交通省の会見。問いは台帳の「趣旨」の形まで。答えは同じ答えの中の2文） ----
- id: co_kaiken
  title: ''
  background: tm_kaiken
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 山田社長, emotion: sad}
  - {who: kisha, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2017年3月27日、午前11時半。東京・霞が関の国土交通省です。
    reading: にせん じゅうななねん さんがつ にじゅうしちにち、ごぜん じゅういちじはん。とうきょう かすみがせきの こくど こうつうしょうです。
  - speaker: reimu
    text: 格安の海外旅行を売ってきた、てるみくらぶの社長、山田千賀子が会見に立ちます。
    reading: かくやすの かいがい りょこうお うって きた てるみくらぶの しゃちょう、やまだ ちかこが かいけんに たちます。
  - speaker: zundamon
    emotion: sad
    text: 私の不徳のいたすところです。誠に申し訳ありませんでした
  - speaker: kisha
    emotion: normal
    text: 経営状態が悪いにも関わらず、キャッシュを集めていたのではないか
  - speaker: zundamon
    emotion: sad
    text: 全くそんなことはなくて
  - speaker: zundamon
    emotion: sad
    text: とにかく生きることしか考えてなかった。
  - speaker: reimu
    text: 4日前の新聞にも、この会社の広告は載っていました。およそ9万人の旅行代金を抱えたまま、破産しました。
    reading: よっかまえの しんぶんにも この かいしゃの こうこくわ のって いました。およそ きゅうまんにんの りょこう だいきんお かかえた まま、はさん しました。
# ---- 今の部屋（来年のハワイを全額前払い） ----
- id: hook
  title: ''
  background: tm_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 来年のハワイ旅行、もう全額払ったのだ！ 今だけ現金一括で安くなるのだ！
    se: jaan
  - speaker: tsumugi
    emotion: normal
    text: 出発は来年よね。そのお[金|かね]、会社は今どこに置いてるの？
  - speaker: zundamon
    emotion: thinking
    text: ……金庫？
  - speaker: tsumugi
    emotion: thinking
    text: それを今日の支払いに回して、赤字なのにつぶれる4日前まで客を集めた会社があるの。
    telops:
    - {text: "赤字の会社は なぜ4日前まで客を集められた？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 赤字なのに、なんで4日前まで客が集まるのだ！？
# ---- 1998年・余った席を安く ----
- id: card1998
  title: ''
  background: tm_card_1998
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1998年。ネットで売る格安の海外ツアーの会社として、てるみくらぶが生まれます。
    reading: せんきゅうひゃく きゅうじゅうはちねん。ねっとで うる かくやすの かいがい つあーの かいしゃと して、てるみくらぶが うまれます。
- id: ch1_seki
  title: 余った席を安く
  background: tm_jimusho
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 山田社長, emotion: normal}
  - {who: shiire, x: 0.84, emotion: happy}
  cuts:
  - speaker: shiire
    emotion: happy
    text: 社長！ 新しい路線で余った席を、まとめて安く仕入れられました！
  - speaker: shiire
    emotion: happy
    text: ハワイもソウルも台北も、よその会社より安く出せます！
    background: tm_jimusho_poster
    se: levelup
  - speaker: reimu
    text: 会社の説明では、新しい路線や急な需要の変化で余った席を、航空会社から安く買っていました。
    reading: かいしゃの せつめいでわ あたらしい ろせんや きゅうな じゅようの へんかで あまった せきお、こうくう がいしゃから やすく かって いました。
  - speaker: shiire
    emotion: happy
    text: 安く仕入れて、安く売る。お客さんが、どんどん来ます！
# ---- 経理の机・前払いの財布（同僚どうしの脚色） ----
- id: ch1_saifu
  title: 前払いの財布
  background: tm_jimusho
  stage:
  - {who: senpai, x: 0.28, flip: true, emotion: normal}
  - {who: shinjin, x: 0.7, emotion: normal}
  cuts:
  - speaker: shinjin
    emotion: surprised
    text: 先輩！ 半年先のハワイの申し込みなのに、もう代金が入ってます。
  - speaker: senpai
    emotion: normal
    text: 旅行代金は、出発の前にもらう。それがこの商売だ。
  - speaker: shinjin
    emotion: thinking
    text: ホテルや航空会社に払うのは、まだ先ですよね。
  - speaker: senpai
    emotion: normal
    text: 払うまでは、うちの手元にある。
  - speaker: shinjin
    emotion: normal
    text: じゃあ、お客さんが来続ける限り……
  - speaker: senpai
    emotion: happy
    text: 財布は、いつも重い。
  - speaker: shinjin
    emotion: thinking
    text: 来月の旅行のお[金|かね]を今月もらって、今月の家賃も払えちゃう？
  - speaker: senpai
    emotion: normal
    text: ……払えちゃう。お客さんが来続ける限りはな。
    beat: true
  - speaker: reimu
    text: この財布の中身は、のちに100億円。会社がつぶれた日、手元にあったのは約1億円でした。
    reading: この さいふの なかみわ のちに ひゃくおくえん。かいしゃが つぶれた ひ、てもとに あったのわ やく いちおくえんでした。
    telops:
    - {text: "客の前払い100億円　手元に1億円", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
- id: heya1
  title: ''
  background: tm_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 100億円を預かって、なんで手元に1億円なのだ！？
    se: bikkuri
  - speaker: tsumugi
    emotion: normal
    text: 前払いのお[金|かね]は、本当なら出発までにその旅のホテルや飛行機に払うものよ。
  - speaker: zundamon
    emotion: normal
    text: それまでは、どこかにしまってあるはず。
  - speaker: tsumugi
    emotion: thinking
    text: ずんだもん、さっき金庫って言ったわね。
  - speaker: zundamon
    emotion: normal
    text: ……言った。
  - speaker: zundamon
    emotion: surprised
    text: じゃあ客が払ったお[金|かね]は、どこへ行ったのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 金庫じゃなかったの。今日の支払いに、出ていってたのよ。
  - speaker: zundamon
    emotion: thinking
    text: 客が払ったお[金|かね]で、今日の支払い……。
  - speaker: tsumugi
    emotion: normal
    text: それでも客が来続ければ回る。崩れ始めたのは、席の値段からよ。
  - speaker: zundamon
    emotion: thinking
    text: 席の、値段？
  - speaker: tsumugi
    emotion: thinking
    text: 安く仕入れられた席が、だんだん消えていくの。
# ---- 2012〜2013年・安い席が消える ----
- id: ch2_kieru
  title: 安い席が消える
  background: tm_jimusho
  bgm: kinakusai
  stage:
  - {who: shiire, x: 0.28, flip: true, emotion: sad}
  - {who: senpai, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2012年ごろ。会社の説明では、ここから安い席が減っていきます。
    reading: にせん じゅうにねん ごろ。かいしゃの せつめいでわ、ここから やすい せきが へって いきます。
  - speaker: shiire
    emotion: sad
    text: 先輩、航空会社にまた断られました。安い席は自分のサイトで売るそうです。
  - speaker: senpai
    emotion: sad
    text: またか。
  - speaker: shiire
    emotion: sad
    text: 機体も小さくなって、余る席そのものが減ってます。
  - speaker: shiire
    emotion: thinking
    text: おまけに円安で、海外のホテル代まで上がってます。
  - speaker: shiire
    emotion: sad
    text: 航空会社からの販売の奨励金も、減らされました。
  - speaker: senpai
    emotion: sad
    text: 踏んだり蹴ったりだな。
  - speaker: senpai
    emotion: thinking
    text: なら、大手と同じ値段で仕入れるしかないか。
  - speaker: shiire
    emotion: surprised
    text: でも先輩、うちの売値は大手より安いんですよ。
  - speaker: shiire
    emotion: thinking
    text: この席だと、売値より仕入れのほうが高いです。
  - speaker: senpai
    emotion: normal
    text: それでも売る。売らないと、来月払うお[金|かね]が入ってこない。
  - speaker: shiire
    emotion: surprised
    text: 100円で仕入れたおにぎりを、80円で売るんですか！？
    se: zukko
  - speaker: shiire
    emotion: surprised
    text: 1個売るたびに、20円の損ですよ！
  - speaker: senpai
    emotion: normal
    text: 売れるほど損だ。でもレジには、毎日お[金|かね]が入る。
  - speaker: shiire
    emotion: thinking
    text: ……それ、止めたらどうなるんです？
  - speaker: senpai
    emotion: sad
    text: 止めたその日に、足りない分が全部見える。
    beat: true
  - speaker: reimu
    text: 破産管財人の調べでは、売上を増やすため、赤字販売と認識しながら販売を継続しました。
    reading: はさん かんざいにんの しらべでわ うりあげお ふやす ため、あかじ はんばいと にんしき しながら はんばいお けいぞく しました。
  - speaker: shiire
    emotion: thinking
    text: 赤字でも、売れば客は集まり続ける……。決算は、どうするんでしょう。
# ---- 2013〜2014年・黒字に見せる ----
- id: card2013
  title: ''
  background: tm_card_2013
  cuts:
  - speaker: reimu
    text: 2013年。管財人の調べでは、4月に月ごとの粗利益がマイナスになります。
    reading: にせん じゅうさんねん。かんざいにんの しらべでわ、しがつに つきごとの あらりえきが まいなすに なります。
- id: ch3_kessan
  title: 赤い帯が黒に
  background: tm_kessan
  stage:
  - {who: senpai, x: 0.18, flip: true, emotion: normal}
  - {who: shinjin, x: 0.82, emotion: thinking}
  cuts:
  - speaker: shinjin
    emotion: thinking
    text: 先輩、9月期の決算書です。赤い数字が並んでますね。
  - speaker: senpai
    emotion: sad
    text: 売るほど損をしてるからな。
  - speaker: reimu
    text: 管財人によれば、決算を閉める段階でマイナスを資産に振り替えて、利益を出していました。
    reading: かんざいにんに よれば、けっさんお しめる だんかいで まいなすお しさんに ふりかえて りえきお だして いました。
    background: tm_kessan_kuro
  - speaker: shinjin
    emotion: surprised
    text: 赤が、黒になってる……！
    se: bikkuri
    telops:
    - {text: "管財人の調べ　赤字を資産に振り替え", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: shinjin
    emotion: thinking
    text: なんで、そこまで黒字に？
  - speaker: senpai
    emotion: normal
    text: うちは航空券を自分で出せる。国際航空運送協会の資格があるからだ。
  - speaker: shinjin
    emotion: normal
    text: 自分で出せると、何がいいんですか？
  - speaker: senpai
    emotion: normal
    text: 航空券の代金は、あとでまとめて払えばいい。
  - speaker: shinjin
    emotion: normal
    text: その資格の条件って？
  - speaker: senpai
    emotion: normal
    text: 銀行に、約5億円の保証を付けてもらうことだ。
  - speaker: shinjin
    emotion: thinking
    text: 資格をなくしたら？
  - speaker: senpai
    emotion: sad
    text: よそに頼んで出す。仕入れが、もっと高くなる。
  - speaker: shinjin
    emotion: sad
    text: それじゃ、ますます赤字になりますね……。
- id: ch3_shacho
  title: ''
  background: tm_kessan_kuro
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 山田社長, emotion: sad}
  cuts:
  - speaker: reimu
    text: のちに債権者集会で、粉飾や前払いの商売に、犯罪性はあるのかと問われ、山田はこう答えます。
    reading: のちに さいけんしゃ しゅうかいで ふんしょくや まえばらいの しょうばいに はんざいせいわ あるのかと とわれ、やまだわ こう こたえます。
  - speaker: zundamon
    emotion: sad
    text: 粉飾は[IATA|イアタ]の資格を守るためにした。
  - speaker: zundamon
    emotion: sad
    text: なんとか会社の形をキープしたかった。
  - speaker: reimu
    text: 2014年9月期には、払うべきお金が財産を上回る債務超過に。それでも帳簿の上は、黒字でした。
    reading: にせん じゅうよねん くがつきにわ はらうべき おかねが ざいさんお うわまわる さいむ ちょうかに。それでも ちょうぼの うえわ くろじでした。
- id: heya_kuro
  title: ''
  background: tm_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 赤字を資産に振り替えるって、どういうことなのだ？
  - speaker: tsumugi
    emotion: normal
    text: 家計簿で言うね。今月は2万円の赤字。
  - speaker: zundamon
    emotion: normal
    text: ボクの家計簿も、だいたい赤字だよ。
  - speaker: tsumugi
    emotion: normal
    text: それを、貯金が2万円増えましたと書き換えるの。
  - speaker: zundamon
    emotion: angry
    text: 貯金なんて、どこにも無いのだ！
    se: tsukkomi
  - speaker: tsumugi
    emotion: thinking
    text: でも家計簿の上では、黒字の家に見える。
  - speaker: tsumugi
    emotion: normal
    text: 東京商工リサーチによれば、親会社への配当も出ていたの。
  - speaker: tsumugi
    emotion: thinking
    text: 2011年からの6年で、3億1000万円。
  - speaker: tsumugi
    emotion: thinking
    text: 粉飾が始まったあとの2014年9月期にも、5000万円。
  - speaker: zundamon
    emotion: surprised
    text: 会社の外にも、お[金|かね]が出ていたの！？
  - speaker: zundamon
    emotion: thinking
    text: 赤字なのに黒字の顔で、客を集め続けたのか……。
  - speaker: tsumugi
    emotion: thinking
    text: 本当の赤字がどれほどだったかは、のちに管財人が数字にするわ。
  - speaker: tsumugi
    emotion: normal
    text: しかも会社は、ここから広告を増やしていくの。
  - speaker: zundamon
    emotion: surprised
    text: 赤字なのに、もっとお[金|かね]を使うの！？
# ---- 2015〜2016年・新聞のシニア ----
- id: card2015
  title: ''
  background: tm_card_2015
  bgm: curious
  cuts:
  - speaker: reimu
    text: 2015年の春。
    reading: にせん じゅうごねんの はる。
- id: ch4_kokoku
