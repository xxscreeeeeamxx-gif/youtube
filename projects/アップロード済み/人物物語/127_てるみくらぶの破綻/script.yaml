meta:
  title: 「嘘に嘘を重ねた」と認めたてるみくらぶの社長、2日後に逮捕された【ずんだもん解説】
  slug: terumi-club
  hook_line: 赤字の会社は、なぜつぶれる4日前まで客を集め続けられたのか。
  summary: 2017年3月27日、格安の海外ツアーを売ってきた旅行会社てるみくらぶが破産し、社長の山田千賀子は国土交通省の会見で頭を下げました。安い席が消えたあとも売り続けた会社、客が先に払った旅行代金、黒字に見せた帳簿。払えない日の新聞にも、広告は載っていました。赤字の会社は、なぜつぶれる4日前まで客を集め続けられたのか。破産管財人の調べ、判決、本人の言葉を主語を分けて並べ、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 帝国データバンク 倒産速報「株式会社てるみくらぶ」（2017年3月27日） https://www.tdb.co.jp/report/bankruptcy/flash/4280/
  - 東京商工リサーチ「てるみくらぶの『決算書』を読み解く」（2017年5月19日） https://www.tsr-net.co.jp/data/detail/1188772_1527.html
  - 東京商工リサーチ「てるみくらぶ山田社長、『嘘に嘘を重ねた』が『詐欺ではない』」（2017年11月6日） https://www.tsr-net.co.jp/data/detail/1188904_1527.html
  - トラベルボイス「てるみくらぶ被害者への弁済率は3.5％に、最高額は約13万円程度」（2017年11月16日） https://www.travelvoice.jp/20171116-100741
  - 日本経済新聞「てるみ社長に懲役6年　東京地裁判決　融資金詐取事件で」（2018年7月20日） https://www.nikkei.com/article/DGKKZO33194590Q8A720C1CC0000/
  - 東京商工リサーチ「破産した『てるみくらぶ』の配当率 1.9％に」（2019年3月13日） https://www.tsr-net.co.jp/data/detail/1189391_1527.html
