# terumi-club 読み台帳（人名・地名・社名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 山田社長・山田元社長 / label: 記者・弁護士・仕入れ担当・先輩・新人・受付・銀行員・客・フロント・協会職員・裁判長）・
# テロップ・章タイトルは表示専用なのでタグを付けていない。
# 英字の IATA はセリフ1か所だけ（粉飾は[IATA|イアタ]の…）。JATA・LCC は text に書いていない
# （日本旅行業協会・格安の航空会社と書いた）。
#
# 2026-11-14 台本を書いたあと、セリフ全行を VOICEVOX の audio_query にかけた結果:
# - 「36,000件」は サンマン/ロクセンゲン と濁った → [36,000件|サンマンロクセンケン] にした（1語で読む）。
# - 「その間は」が ソノカンワ になった → 「払うまでは」に言い換えた。
# - 国際航空運送協会 はひらがなのタグだと コクサイコオクウウン/ソオ/キョオカイ と切れた。
#   タグなしだと コクサイコオクウウンソオキョオカイ と1語で読むので、タグを外した（台帳にも入れていない。
#   入れるとセリフにタグか辞書が要るため。ナレには出していない）。
# - 催行 はタグなしでも サイコオ と同じ抑揚で読んだので、タグを外した（台帳に入れていない）。
# - IATA は [IATA|イアタ] で イアタ。
# - 懲役6年 は [懲役6年|ちょうえきろくねん] で チョオエキ/ロクネンニ。
# - てるみくらぶ（テルミクラブ）・不徳（フトク）・毛頭（モオトオ）・粉飾（フンショク）・渋谷（シブヤ）・台北（タイペエ）・
#   売上至上主義（ウリアゲシジョオシュギ）・一昨年（イッサクネン）・資産超過（シサンチョオカ）・奨励金（ショオレエキン）・
#   分担金（ブンタンキン）・発券済み（ハッケンズミ）はタグなしで正しく読んだ。タグを重ねると抑揚が切れるので台帳には入れていない。
# - 「金」はカネと読ませる所を全部 お[金|かね] にした（「お金」の表記で書いたセリフも VOICEVOX は オカネ と読んだ）。
# - 「前の年に」は マエノ/トシニ（まえのとし）で、意味どおり。
# 2026-11-14 見直し（tm_fix.md）で直した・足したセリフも audio_query にかけた:
# - 人を指す「方」は ホオ と読まれる（「364万円払った方で」）→ [方|カタ] にした（記者の問い「行けないという方が」も同じ）。
#   ひらがなの [方|かた] は イウカタガ（言い方）になるのでカタカナ。文脈で読みが変わる語なので台帳には入れていない。
# - [36,000件|サンマンロクセンケン] は弁護士の台詞を2つに分けたあと サンマンロクセン/ケン と読む（読みは正しい）。
# - キャッシュ（キャッシュオ）・経営状態（ケエエエジョオタイ）・打ち出しまして・一言でいう（ヒトコトデ/イウト）・
#   何十年も（ナンジュウネンモ）・弁済保証金（ベンサイホショオキン）・引っかかる可能性・原則・分担金 はタグなしで正しく読んだ。
