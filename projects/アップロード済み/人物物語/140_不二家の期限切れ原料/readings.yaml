# fujiya-fujii 読み台帳（人名・地名・社名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている（タグは付けていない）。
# 名札（tag: 藤井 / label: 幹部・取締役・コンサル・パート・新人・係長・広報・生産部長・記者・店員・工場長・厚労省・櫻井・技術者・郷原）・
# テロップ・章タイトル・meta は表示専用なのでタグを付けていない。
#
# 2026-11-18 台本を書いたあと、セリフ全行を VOICEVOX の audio_query（各話者の style）にかけた結果:
# - 不二家 は発注書どおりカタカナのタグ [不二家|フジヤ] にすると フジ/ヤノ・フジ/ヤワ と切れた
#   → ひらがなのタグ [不二家|ふじや] で フジヤノ・フジヤワ・フジヤ/ガワガ（1語）。
#   櫻井の言葉の「不二家ブランド」だけは、ひらがなだと フジヤ/ブランド と切れ、カタカナ [不二家|フジヤ]ブランド で
#   フジヤブランド と1語になったので、そこだけカタカナにした。
# - 山崎製パン はタグなしだと ヤマサキセエパン になった → カタカナのタグ [山崎製パン|ヤマザキセイパン] で ヤマザキセイパン（1語）。
#   ひらがなのタグだと ヤマザキ/セイパン と切れた。
# - 藤井 は [藤井|フジイ]前社長 で フジイ/ゼンシャチョオオ。
# - 外秘 はタグなしだと ソトヒ になった → [外秘|がいひ] で ガイヒ。
# - チョコ生 はタグなしだと チョコセエ になった → [チョコ生|チョコなま] で チョコナマ。
# - 「法律の基準か国の目安か」の 国 は キジュンカコクノ になった → [国|くに] で クニノ。
# - 消費期限 は [消費期限|しょうひきげん]切れ だと ショオヒキゲンキレ（ギレにならない）→ [消費期限切れ|しょうひきげんぎれ] で
#   ショオヒキゲンギレ。報告書の『消費期限』『隠蔽』『消費期限切れ』は『』で切れるので、
#   [『消費期限』|ショウヒキゲン] [『隠蔽』|インペイ] [『消費期限切れ』|しょうひきげんぎれ] にした（字幕は『』のまま）。
# - 雪印乳業 はタグなしで ユキジルシニュウギョオ と1語で読む。ひらがな・カタカナのタグを付けると
#   ユキジルシ/ニュウ/ギョウ・ユキジル/シニュウギョウ と切れたので、セリフではタグを付けず、この台帳にも入れていない。
#   ナレは reading: で ゆきじるし と読ませている。
# - 洋生菓子 もタグなしで ヨオナマガシ と読み、タグを付けると ヨオナ/マガシ・ヨウ/ナマガシ と切れたので台帳に入れていない。
# - 下の専門語はタグなしでも正しく読んだが、タグを付けても抑揚は切れなかったので、全出現にタグを付けて台帳で見張る:
#   推進委員会＝スイシンイインカイ、二の舞＝ニノマイ、遵法絶対＝ジュンポオ/ゼッタイ、隠蔽＝インペイ、賞味期限＝ショオミキゲン、
#   厳重注意＝ゲンジュウチュウイ、捏造＝ネツゾオ、BPO＝ビイピイオオ、衛生規範＝エイセイキハン、自主回収＝ジシュカイシュウ。
# - タグなしで正しく読んだので台帳に入れていない語: 当該資料・内部文書・発覚・頻発・倫理観・無為無策・経営陣（ケエエエジン）・
#   前社長（ゼンシャチョオ）・元日（ガンジツ）・身内・嗅いで（カイデ）・日付（ヒズケ）・1グラムに640万個・300個未満・
#   一般的・生産性・食中毒・センセーショナル・伝聞・1行（イチギョオ）・7日（ナノカ）・4日（ヨッカ）・1日（イチニチ）・6日（ムイカ）。
# 2026-11-18 見直し（fj_fix.md）で直した・足したセリフも audio_query にかけた:
#   本社の品質保証部＝ホンシャノ/ヒンシツホショオブカラ、11月27日＝ジュウイチガツ/ニジュウ/シチニチ、出荷＝シュッカ、
#   お店ごと＝オミセゴト、ミルキー＝ミルキイ、告発の中身の真偽＝コクハツノ/ナカミノ/シンギワ、3月20日＝サンガツ/ハツカ、
#   危機的事態＝キキテキ/ジタイ、県の決まりに反する＝ケンノ/キマリニ/ハンスル、64倍＝ロクジュウ/ヨンバイ、
#   ベテランの甘さ＝ベテランノ/アマサ、期限が4日＝キゲンガ/ヨッカ。どれも正しく、台帳に足す語は無かった。
