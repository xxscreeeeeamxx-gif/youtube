# ---- 論争1：腐った牛乳？（期限の問題は3つ。混ぜない。健康被害は保健所を主語に） ----
- id: ronso1
  title: 期限の問題は3つ
  background: fj_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ [不二家|ふじや]は、腐った牛乳でシュークリームを作ってたって！
  - speaker: tsumugi
    emotion: normal
    text: 使ったのは、[消費期限|しょうひきげん]が1日過ぎた牛乳よ。
  - speaker: tsumugi
    emotion: normal
    text: ポリ容器なら[賞味期限|しょうみきげん]で7日。缶で運ぶから、[消費期限|しょうひきげん]で4日だったの。
  - speaker: tsumugi
    emotion: normal
    text: その日のシュークリームは、菌が1グラムに300個未満。出荷の基準に合っていたわ。
  - speaker: tsumugi
    emotion: normal
    text: 保健所は健康被害も無いとして、処分は見送って[厳重注意|げんじゅうちゅうい]にしたの。
  - speaker: zundamon
    emotion: happy
    text: じゃあ、問題なかったのだ！
  - speaker: tsumugi
    emotion: thinking
    text: そうじゃないの。保健所も、県の決まりに反すると指摘してるわ。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: それに期限の問題は、3つあったのよ。
  - speaker: tsumugi
    emotion: normal
    text: 1つめは、期限の切れた原料を使ったこと。聞き取りでは、過去7年に18件よ。
  - speaker: tsumugi
    emotion: normal
    text: 2つめは、プリンなどの期限を社内の決まりより1日か2日長く書いたこと。
  - speaker: tsumugi
    emotion: normal
    text: 3つめは、細菌の検査で社内の回収の基準を超えたシューロールを出したこと。
  - speaker: zundamon
    emotion: surprised
    text: 期限だけで、3つも！？
  - speaker: tsumugi
    emotion: thinking
    text: シュークリームは、検査の基準に合っていた。でも、自分たちの決まりを守らなかったの。
  - speaker: zundamon
    emotion: sad
    text: 決めた人が、守らなかったのか……。
    beat: true
# ---- 論争2：隠すと決めた？（「二の舞」は外のコンサルの報告書。「センセーショナル」は第三者会議の見方。報告書の評価は両方） ----
