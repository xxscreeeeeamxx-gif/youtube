meta:
  title: 不二家の社長が雇ったコンサルの報告書「雪印乳業の二の舞となる」、2か月後に創業家社長は辞意【ずんだもん解説】
  slug: fujiya-fujii
  hook_line: 1日過ぎた牛乳60キロで、なぜ97年続いた創業家の経営は終わったのか。
  summary: 2007年1月15日、不二家の社長・藤井林太郎は、銀座の本社の社員食堂で辞意を表明しました。始まりは、埼玉工場で消費期限が1日過ぎた牛乳60キロ。そして2か月前、社長が雇った外部のコンサルタントが会議で配った1枚の紙でした。「雪印乳業の二の舞」と書いたのは誰で、会社はなぜ公表しなかったのか。第三者の会議の報告書とBPOの見解、新聞が伝えた会見の言葉をもとに、会社と報告書とテレビ、それぞれの言い分を主語つきで並べて再現ドラマでたどります。（2026年11月時点）
  sources:
  - 不二家 信頼回復対策会議「信頼回復対策会議最終報告書」（2007年3月30日） https://www.fujiya-peko.co.jp/company/ir/pdf/assembly_20070419_01.pdf
  - 不二家 信頼回復対策会議「業務レベルにおける最終報告『品質管理関連の実態調査』」（2007年3月30日） https://www.fujiya-peko.co.jp/company/ir/pdf/assembly_20070419_02.pdf
  - BPO 放送倫理検証委員会「不二家関連の２番組に関する見解」（決定第1号・2007年8月6日） https://www.bpo.gr.jp/wordpress/wp-content/themes/codex/pdf/kensyo/determination/2007/01/dec/0.pdf
  - 日本食糧新聞「不二家、新社長に櫻井康文取締役が就任 外部識者で改革委員会設置」（2007年1月24日） https://news.nissyoku.co.jp/news/nss-9769-0006
  - 不二家「株式情報」（大株主・2026年6月30日現在） https://www.fujiya-peko.co.jp/company/ir/stock/stock.html
  - 不二家「2026年12月期 第３四半期決算短信」（2026年10月26日） https://www.fujiya-peko.co.jp/assets/pdf/financial_20261026_01.pdf
