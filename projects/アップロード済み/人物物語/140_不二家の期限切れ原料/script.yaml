  - speaker: tsumugi
    emotion: normal
    text: でも期限切れの牛乳を使ったこと自体は、事実だったの。
  - speaker: tsumugi
    emotion: normal
    text: 社内の会議で公表を話題にした人はいたけど、公表すべきだという声は出なかったの。
  - speaker: tsumugi
    emotion: normal
