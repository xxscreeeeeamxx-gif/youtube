  - speaker: tsumugi
    emotion: normal
    text: 1つめ。ニュースの基準違反は、どの基準の話かを見て。
  - speaker: tsumugi
    emotion: normal
    text: 法律の基準か[国|くに]の目安か、それとも会社のルールか。
  - speaker: zundamon
    emotion: surprised
    text: 基準にも、種類があるの！？
  - speaker: tsumugi
    emotion: normal
    text: あのシューロールは、国の基準の64倍と報じられたの。
  - speaker: tsumugi
    emotion: normal
    text: でもそれは、洋生菓子の[衛生規範|えいせいきはん]という国の目安。法律の違反とは、されなかったわ。
  - speaker: zundamon
    emotion: happy
    text: じゃあ、大丈夫だったのだ！
  - speaker: tsumugi
    emotion: thinking
    text: そうじゃないわ。会社が決めた回収の基準は、超えていたの。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: 自分で決めたルールを守らなかったこと、それ自体が問題なのよ。
  - speaker: tsumugi
    emotion: normal
    text: 見出しの基準が法律か目安かルールか、一度だけ確かめてみて。
  - speaker: tsumugi
    emotion: normal
    text: 2つめ。家の食べ物が回収の対象かは、国のシステムで商品名から調べられるの。
  - speaker: tsumugi
    emotion: normal
    text: 2021年6月から、食品を[自主回収|じしゅかいしゅう]する会社は届け出が義務になったからよ。
  - speaker: zundamon
    emotion: thinking
    text: 回収のお知らせ、探したことなかったのだ。
  - speaker: zundamon
    emotion: thinking
    text: 見出しだけで、怖がってた……。
  - speaker: tsumugi
    emotion: normal
    text: 気になる商品があったら、名前で調べてみてね。
