scenes:
# ---- 先出し（2007年1月15日・本社7階の社員食堂。言葉は朝日・毎日の会見の言葉だけ。笑いの SE なし。フラッシュは間とナレで） ----
- id: co_shokudo
  title: ''
  background: fj_shokudo
  bgm: serious
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 藤井, emotion: sad}
  - {who: kanbu, x: 0.62, emotion: sad}
  - {who: kanbu2, x: 0.84, emotion: sad}
  cuts:
  - speaker: reimu
    text: 2007年1月15日、東京・銀座。不二家の本社の社員食堂で、
    reading: にせんななねん いちがつ じゅうごにち、とうきょう ぎんざ。ふじやの ほんしゃの しゃいん しょくどうで、
  - speaker: reimu
    text: 期限切れ原料の問題で、社長の藤井林太郎が100人を超す記者の前に立ちます。
    reading: きげんぎれ げんりょうの もんだいで、しゃちょうの ふじい りんたろうが ひゃくにんお こす きしゃの まえに たちます。
  - speaker: zundamon
    emotion: sad
    text: 国民の皆様にご迷惑をかけ、誠に申し訳ございません
  - speaker: zundamon
    emotion: sad
    text: 組織ぐるみと言われても仕方がない。上司の指示もあった。
  - speaker: zundamon
    emotion: sad
    text: 私は責任を取り、辞任したい
    pause_after: 1.2
  - speaker: reimu
    text: フラッシュが、一斉にたかれました。新聞が伝えた、会見の言葉です。
    reading: ふらっしゅが、いっせいに たかれました。しんぶんが つたえた かいけんの ことばです。
  - speaker: reimu
    text: 最初の報道から、5日。1910年の創業から97年、社長は代々、藤井家から出ていました。
    reading: さいしょの ほうどうから いつか。せんきゅうひゃく じゅうねんの そうぎょうから きゅうじゅうななねん、しゃちょうわ だいだい ふじいけから でて いました。
  - speaker: reimu
    text: 始まりは、消費期限が1日過ぎた牛乳60キロ。そして2か月前、社長の前で配られた、1枚の紙でした。
    reading: はじまりわ、しょうひきげんが いちにち すぎた ぎゅうにゅう ろくじゅっきろ。そして にかげつまえ、しゃちょうの まえで くばられた いちまいの かみでした。
# ---- 今の部屋（ソファにこぼしたジュース。食べ物の期限のボケにしない。20秒以内） ----
- id: hook
  title: ''
  background: fj_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: ソファにジュースこぼしたの、まだ言ってないのだ。
  - speaker: tsumugi
    emotion: normal
    text: いつ？
  - speaker: zundamon
    emotion: normal
    text: 2か月前なのだ。
  - speaker: tsumugi
    emotion: angry
    text: ……その2か月のほうが、ジュースより大きいわよ。
    se: hammer
  - speaker: tsumugi
    emotion: thinking
    text: '[不二家|ふじや]も、牛乳のことを2か月言わなかったの。'
  - speaker: tsumugi
    emotion: thinking
    text: 1日過ぎた牛乳60キロで、なぜ97年続いた創業家の経営が終わったのか。
    telops:
    - {text: "1日過ぎた牛乳60キロで なぜ創業家の経営が終わった？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 牛乳60キロで、97年が！？
# ---- 1910年の元町から6代目へ（ナレ2行だけ。年号カードなし。藤井の台詞なし） ----
- id: ch1_rokudaime
  title: 6代目の社長
  background: fj_honsha
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.16, flip: true, tag: 藤井, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1910年、横浜・元町の洋菓子店から始まった不二家。1995年、創業家から6代目の社長が出ます。
    reading: せんきゅうひゃく じゅうねん、よこはま もとまちの ようがしてんから はじまった ふじや。せんきゅうひゃく きゅうじゅうごねん、そうぎょうけから ろくだいめの しゃちょうが でます。
  - speaker: reimu
    text: 藤井林太郎、52歳。12年後、1日過ぎた牛乳のことで頭を下げます。
    reading: ふじい りんたろう、ごじゅうにさい。じゅうにねんご、いちにち すぎた ぎゅうにゅうの ことで あたまお さげます。
# ---- 2006年9月・2億円のコンサル（取締役のモブの掛け合い。報告書の「消極的意見」「戦略コンサルタント」の範囲。藤井は出さない） ----
- id: card2006
  title: ''
  background: fj_card_2006
  cuts:
  - speaker: reimu
    text: 2006年9月。社長が選んだ外のコンサルが、赤字の洋菓子を本格的に調べ始めます。
    reading: にせんろくねん くがつ。しゃちょうが えらんだ そとの こんさるが、あかじの ようがしお ほんかくてきに しらべ はじめます。
- id: ch2_konsaru
  title: 2億円のコンサル
  background: fj_kaigi
  stage:
  - {who: torishimari, x: 0.16, emotion: surprised}
  - {who: torishimari2, x: 0.84, emotion: normal}
  cuts:
  - speaker: torishimari
    emotion: surprised
    text: 外のコンサルに、2億円？
  - speaker: torishimari2
    emotion: normal
    text: 40週で約2億円。社長が決めた。
  - speaker: torishimari
    emotion: thinking
    text: 洋菓子のこと、分かってるんですか。
  - speaker: torishimari2
    emotion: normal
    text: 戦略の専門家だそうだ。
  - speaker: torishimari
    emotion: thinking
    text: 1週あたり、約500万円……。
  - speaker: torishimari2
    emotion: normal
    text: 工場の品質管理の担当は、3人なのにな。
    beat: true
    telops:
    - {text: "コンサルに週約500万円　工場の品質管理は3人", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
# ---- 埼玉工場の仕込み場（缶で4日・チョコ生のトラブル・捨て方の決まりが無い。「捨てたら怒られるし。」は文書が書き留めた言葉のまま。健康被害の話にしない） ----
- id: ch3_kojo
  title: 缶で届く牛乳
  background: fj_kojo
  bgm: curious
  stage:
  - {who: paat, x: 0.42, emotion: normal}
  - {who: shinjin, x: 0.88, emotion: normal}
  cuts:
  - speaker: reimu
    text: 埼玉県新座市の埼玉工場。牛乳は、使い回しの缶で届きます。
    reading: さいたまけん にいざしの さいたま こうじょう。ぎゅうにゅうわ、つかいまわしの かんで とどきます。
  - speaker: shinjin
    emotion: normal
    text: 缶の牛乳は、期限が4日なんですか。
  - speaker: paat
    emotion: normal
    text: ポリの容器なら、7日だがな。
  - speaker: shinjin
    emotion: surprised
    text: 同じ牛乳なのに！？
  - speaker: paat
    emotion: normal
    text: 缶は使い回しだ。4日までしか保証されん。
  - speaker: shinjin
    emotion: surprised
    text: '[チョコ生|チョコなま]のラインが、止まりました！'
  - speaker: shinjin
    emotion: surprised
    text: 牛乳の缶が、1つ……2つ……。
    background: fj_kojo_kan
  - speaker: shinjin
    emotion: surprised
    text: 3つ……この缶、全部ですか！？
    se: gaan
  - speaker: shinjin
    emotion: thinking
    text: 期限、昨日までですよ。
  - speaker: paat
    emotion: normal
    text: 使い切れなかったらニオイを嗅いで品質的に問題ないと判断したら使ってる。
  - speaker: paat
    emotion: normal
    text: 捨てたら怒られるし。
  - speaker: shinjin
    emotion: thinking
    text: 捨てる場所は？
  - speaker: paat
    emotion: normal
    text: 決まってない。
    beat: true
  - speaker: shinjin
    emotion: surprised
    text: 流しに捨てるのは？
  - speaker: paat
    emotion: normal
    text: 禁止だ。捨てた量が増えると、報告も書かされる。
  - speaker: shinjin
    emotion: thinking
    text: 工場長は、知ってるんですか。
  - speaker: paat
    emotion: normal
    text: 工場長までは、な。本社には上がってない。
  - speaker: paat
    emotion: normal
    text: 偉い人は、ラインを見て帰るだけだ。
  - speaker: reimu
    text: 11月8日。消費期限が1日過ぎた牛乳60キロで、シュークリーム2,000個が作られます。
    reading: じゅういちがつ ようか。しょうひきげんが いちにち すぎた ぎゅうにゅう ろくじゅっきろで、しゅーくりーむ にせんこが つくられます。
  - speaker: shinjin
    emotion: thinking
    text: 60キロで2,000個。1個に大さじ2杯ほどか……。
  - speaker: reimu
    text: この牛乳は、危なかったのか。答えは翌年の3月、第三者の会議の報告書が出します。
    reading: この ぎゅうにゅうわ、あぶなかったのか。こたえわ よくねんの さんがつ、だいさんしゃの かいぎの ほうこくしょが だします。
# ---- 2006年11月13日・第8回推進委員会（コンサルは文書の言葉を読み上げるだけ。藤井は台詞なし・字幕で。鼠の写真は描かない） ----
- id: ch4_gaihi
  title: 外秘の1枚
  background: fj_kaigi_gaihi
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.1, flip: true, tag: 藤井, emotion: normal}
  - {who: konsaru, x: 0.9, emotion: normal}
  cuts:
  - speaker: reimu
    text: 11月13日、本社の会議室。週1回の推進委員会で、コンサルが28ページの報告書を配ります。
    reading: じゅういちがつ じゅうさんにち、ほんしゃの かいぎしつ。しゅう いっかいの すいしん いいんかいで、こんさるが にじゅうはっぺーじの ほうこくしょお くばります。
  - speaker: konsaru
    emotion: normal
    text: 24ページ目をご覧ください。[推進委員会|すいしんいいんかい]の[外秘|がいひ]です。
  - speaker: konsaru
    emotion: normal
    text: '[消費期限切れ|しょうひきげんぎれ]原料の使用がマスコミに発覚すれば，'
  - speaker: konsaru
    emotion: normal
    text: '雪印乳業の[二の舞|にのまい]となることは避けられない。'
    se: don
    telops:
    - {text: "外のコンサルの報告書「雪印乳業の二の舞」", size: sm, position: middle-center, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: konsaru
    emotion: normal
    text: 工場の仕込みの担当の言葉も、書き留めました。
  - speaker: konsaru
    emotion: normal
    text: 捨てたら怒られるし。
- id: ch4_kaigi
  title: ''
  background: fj_kaigi_gaihi
  stage:
  - {who: zundamon, x: 0.1, flip: true, tag: 藤井, emotion: normal}
  - {who: torishimari2, x: 0.75, emotion: normal}
  - {who: torishimari, x: 0.92, emotion: normal}
  cuts:
  - speaker: torishimari
    emotion: surprised
    text: これまでの7回は、生産性の話ばかりだったのに。
  - speaker: torishimari
    emotion: angry
    text: 2000年の雪印乳業の食中毒と、同じにするのか。
  - speaker: torishimari
    emotion: normal
    text: また外のコンサルが、大げさに……
  - speaker: torishimari2
    emotion: normal
    text: ……公表は。
    pause_after: 1.2
  - speaker: reimu
    text: 公表すべきだ、という声は出ませんでした。藤井社長は、事実の確認と改善を指示します。
    reading: こうひょう すべきだと いう こえわ でませんでした。ふじい しゃちょうわ、じじつの かくにんと かいぜんお しじ します。
  - speaker: reimu
    text: 紙は、翌日までに回収されました。外のコンサルのこの1行が、なぜ会社の言葉になっていくのか。
    reading: かみわ、よくじつまでに かいしゅう されました。そとの こんさるの この いちぎょうが、なぜ かいしゃの ことばに なって いくのか。
    background: fj_kaigi_kara
    telops:
    - {text: "社長は、事実の確認と改善を指示した（第三者会議の報告書）", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
# ---- 2006年11月15日〜・「遵法絶対」（係長と新人。報告書「遵守指示だけ」の範囲） ----
- id: ch5_junpo
  title: 遵法絶対
  background: fj_keiji
  stage:
  - {who: kakaricho, x: 0.16, emotion: normal}
  - {who: shinjin, x: 0.84, emotion: normal}
  cuts:
  - speaker: kakaricho
    emotion: normal
    text: 本社の品質保証部から、指示の紙だ。[遵法絶対|じゅんぽうぜったい]。
  - speaker: kakaricho
    emotion: normal
    text: 期限切れの原料は、絶対に使うなと。
  - speaker: shinjin
    emotion: normal
    text: はい。
  - speaker: shinjin
    emotion: thinking
    text: で、余った牛乳はどこに捨てるんですか。
  - speaker: kakaricho
    emotion: normal
    text: ……それは書いてない。
    se: tenten
  - speaker: shinjin
    emotion: thinking
    text: 上に、聞いてもらえませんか。
  - speaker: kakaricho
    emotion: sad
    text: 何を言っても、何も変わらんよ。
# ---- 2006年11月20日・27日の推進委員会（コンサルの報告。藤井は台詞なし） ----
- id: ch5_hokoku
  title: ''
  background: fj_kaigi
  stage:
  - {who: zundamon, x: 0.14, flip: true, tag: 藤井, emotion: normal}
  - {who: konsaru, x: 0.86, emotion: normal}
  cuts:
  - speaker: konsaru
    emotion: normal
    text: 11月20日の報告です。この1か月で、期限切れの牛乳を7回使っています。
  - speaker: konsaru
    emotion: normal
    text: アップルフィリングも、4回です。
  - speaker: konsaru
    emotion: normal
    text: 11月27日は、6月に作ったシューロールを出荷していた件です。
  - speaker: konsaru
    emotion: normal
    text: 菌は1グラムに640万個。社内の回収の基準は、100万個です。
  - speaker: reimu
    text: なぜ2か月、公表しなかったのか。第三者の会議は、全く誤ったものであったと言わざるを得ないと書きます。
