scenes:
- id: co_suit
  title: ''
  background: gz_stage
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 円谷英二, emotion: thinking}
  - {who: nakajima, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1954年の夏。東京の撮影所で、ある男が怪獣の着ぐるみを試していました。
    reading: せんきゅうひゃく ごじゅうよねんの なつ。とうきょうの さつえいじょで、ある おとこが かいじゅうの きぐるみお ためして いました。
  - speaker: zundamon
    emotion: normal
    text: よし、中島くん。歩いてみろ。
  - speaker: nakajima
    emotion: thinking
    text: ……足が、上がりません。
  - speaker: zundamon
    emotion: surprised
    text: 角材1本だぞ。またぐだけだ。
  - speaker: nakajima
    emotion: sad
    text: 重すぎて、無理です！ 倒れたら、自分じゃ起きられません。
  - speaker: zundamon
    emotion: sad
    text: ……公開は11月3日。あと3か月しかないのだ。
    se: gaan
  - speaker: reimu
    text: 重さはおよそ150キロ。この最初の着ぐるみは、試しの日に壊れました。
    reading: おもさわ およそ ひゃくごじゅっきろ。この さいしょの きぐるみわ、ためしの ひに こわれました。
  - speaker: reimu
    text: この男は円谷英二。作り直した怪獣ゴジラは、およそ961万人を映画館に呼びます。
    reading: この おとこわ つぶらや えいじ。つくりなおした かいじゅう ごじらわ、およそ きゅうひゃくろくじゅういちまんにんお えいがかんに よびます。
- id: hook
  title: ''
  background: gz_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ見て！ 段ボールで町を作ったのだ。今から怪獣になって全部壊すぞ！
  - speaker: zundamon
    emotion: surprised
    text: ガオー！ ……あれ、箱が硬くてぜんぜんつぶれないのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 自分で作った町に、負けてるじゃない。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 70年前、それを本気でやった人がいるの。最初は、角材もまたげない着ぐるみからね。
  - speaker: zundamon
    emotion: thinking
    text: またげない着ぐるみから、どうやって怪獣映画にしたの？
    telops:
    - {text: 動けない着ぐるみから961万人, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 作ったのは、[円谷|つぶらや]英二さん。始まりは、空にあこがれた少年よ。
- id: card1901
  title: ''
  background: gz_card_1901
  cuts:
  - speaker: reimu
    text: 1901年。福島県の須賀川で、英一という男の子が生まれます。のちの円谷英二です。
    reading: せんきゅうひゃくいちねん。ふくしまけんの すかがわで、えいいちと いう おとこのこが うまれます。のちの つぶらや えいじです。
  - speaker: reimu
    text: 1904年に母が亡くなり、英一は祖母のナツに育てられました。
    reading: せんきゅうひゃくよねんに ははが なくなり、えいいちわ そぼの なつに そだてられました。
- id: ch1_kura
  title: 蔵の二階の飛行機少年
  background: gz_kura
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 円谷英二, scale: 0.85, emotion: happy}
  - {who: natsu, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1910年、東京で日本初の動力飛行が成功します。英一は、その記事に夢中になりました。
    reading: せんきゅうひゃくじゅうねん、とうきょうで にほん はつの どうりょく ひこうが せいこうします。えいいちわ、その きじに むちゅうに なりました。
  - speaker: natsu
    emotion: normal
    text: '[英一|えいいち]。また蔵の二階にこもって、何をしてるんだい。'
  - speaker: zundamon
    emotion: happy
    text: おっかさん、飛行機だよ！ 新聞の写真1枚で、作ってみせる！
  - speaker: natsu
    emotion: surprised
    text: 写真1枚で、こんなもんを作ったのかい。
  - speaker: zundamon
    emotion: happy
    text: 大きくなったら、飛行機で世界を回るのだ！
  - speaker: natsu
    emotion: normal
    text: 世界の前に、まずこの散らかった机を片付けなさい。
    se: hammer
  - speaker: zundamon
    emotion: happy
    text: それと見て！ 貯金で、子ども用の映写機を買ったんだ！
  - speaker: natsu
    emotion: thinking
    text: 飛行機の次は、活動写真の機械かい。[英一|えいいち]の頭の中は、忙しいねえ。
  - speaker: zundamon
    emotion: happy
    text: 映る絵より、映る仕組みが面白いんだよ。
  - speaker: reimu
    text: 1912年。写真1枚から作った英一の模型飛行機は、地元の新聞に取り上げられました。
    reading: せんきゅうひゃくじゅうにねん。しゃしん いちまいから つくった えいいちの もけい ひこうきわ、じもとの しんぶんに とりあげられました。
- id: card1916
  title: ''
  background: gz_card_1916
  cuts:
  - speaker: reimu
    text: 1916年。15歳の英一は、東京の羽田にできたばかりの飛行学校へ行きたいと言い出します。
    reading: せんきゅうひゃくじゅうろくねん。じゅうごさいの えいいちわ、とうきょうの はねだに できたばかりの ひこう がっこうえ いきたいと いいだします。
- id: ch1_oji
  title: 600円の飛行学校
  background: gz_ie
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 円谷英二, scale: 0.9, emotion: sad}
  - {who: ichiro, x: 0.7, emotion: thinking}
  cuts:
  - speaker: ichiro
    emotion: thinking
    text: '[英一|えいいち]。飛行学校の費用は、600円だぞ。家が2軒建つ。'
  - speaker: zundamon
    emotion: sad
    text: ……みんな、危ないから行くなって言うんです。
  - speaker: ichiro
    emotion: normal
    text: 危ないのは、本当だ。
  - speaker: zundamon
    emotion: sad
    text: 叔父さんも、反対ですか。
  - speaker: ichiro
    emotion: happy
    text: ……おれが出す。そのかわり、途中で投げ出すなよ。
  - speaker: zundamon
    emotion: surprised
    text: 叔父さん……！
  - speaker: reimu
    text: 費用を工面したのは、英一より5歳年上の叔父の一郎でした。
    reading: ひようお くめんしたのわ、えいいちより ごさい としうえの おじの いちろうでした。
- id: ch1_haneda
  title: 海岸の飛行学校
  background: gz_haneda
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 円谷英二, scale: 0.9, emotion: happy}
  - {who: tamai, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 学校といっても、羽田の海岸に建つヨシズ張りの小屋でした。
    reading: がっこうと いっても、はねだの かいがんに たつ よしずばりの こやでした。
  - speaker: tamai
    emotion: normal
    text: '[円谷|つぶらや]くん。今日も、エンジンの修理からだ。'
  - speaker: zundamon
    emotion: surprised
    text: また修理ですか。昨日も、半日かかったのに。
  - speaker: tamai
    emotion: happy
    text: 飛ぶ日より、直す日のほうが多い。それが飛行機だ。
  - speaker: tamai
    emotion: normal
    text: 縁日で飛ばしてみせて、学校の稼ぎにする。
  - speaker: zundamon
    emotion: thinking
    text: 縁日で、飛ばなかったら？
  - speaker: tamai
    emotion: thinking
    text: ……お客さんに、袋叩きだ。
    se: tenten
  - speaker: zundamon
    emotion: surprised
    text: 命がけなのは、空の上だけじゃないのだ。
  - speaker: tamai
    emotion: happy
    text: それでも、空はいいぞ。[円谷|つぶらや]くんも、いつか自分の手で飛ばせ。
  - speaker: zundamon
    emotion: happy
    text: はい！ いつか自分の飛行機で、[須賀川|すかがわ]の空を飛ぶのだ！
- id: ch1_tsuiraku
  title: ''
  background: gz_haneda
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 円谷英二, scale: 0.9, emotion: sad}
  cuts:
  - speaker: reimu
    text: 1917年5月20日。教官の玉井清太郎が、東京の芝浦で墜落して亡くなります。
    reading: せんきゅうひゃくじゅうななねん ごがつ はつか。きょうかんの たまい せいたろうが、とうきょうの しばうらで ついらくして なくなります。
  - speaker: zundamon
    emotion: sad
    text: ……先生が、落ちた？
  - speaker: reimu
    text: 教官は、玉井ひとりだけでした。残る1機も、秋の高潮で格納庫ごと流されます。
    reading: きょうかんわ、たまい ひとり だけでした。のこる いっきも、あきの たかしおで かくのうこごと ながされます。
    background: gz_haneda_kara
  - speaker: zundamon
    emotion: sad
    text: ……飛行機も先生も、なくなってしまった。
  - speaker: reimu
    text: 学校は、それきり消えました。英一は東京に残り、おもちゃ会社で働き始めます。
    reading: がっこうわ、それきり きえました。えいいちわ とうきょうに のこり、おもちゃ がいしゃで はたらき はじめます。
- id: card1919
  title: ''
  background: gz_card_1919
  cuts:
  - speaker: reimu
    text: 1919年。英一はおもちゃの発明で、特許料500円を手にします。
    reading: せんきゅうひゃくじゅうきゅうねん。えいいちわ おもちゃの はつめいで、とっきょりょう ごひゃくえんお てに します。
- id: ch2_hanami
  title: 花見の喧嘩
  background: gz_hanami
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 円谷英二, emotion: happy}
  - {who: edamasa, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: みんな、今日はボクのおごりだ！ [飛鳥山|あすかやま]で花見だぞ！
  - speaker: reimu
    text: ところが連れてきた職人たちが、隣の席と喧嘩を始めます。
    reading: ところが つれてきた しょくにんたちが、となりの せきと けんかお はじめます。
  - speaker: zundamon
    emotion: surprised
    text: ちょ、ちょっと待った！ 桜の下で殴り合いはなしなのだ！
  - speaker: zundamon
    emotion: normal
    text: こちらの者が、失礼しました。どうか、ここは収めてください。
  - speaker: edamasa
    emotion: surprised
    text: ……[君|きみ]、いくつだ。
  - speaker: zundamon
    emotion: normal
    text: まだ、駆け出しの若造です。
  - speaker: edamasa
    emotion: happy
    text: その若さで、大人の喧嘩を収めたか。……うちで、活動写真を撮ってみないか。
  - speaker: reimu
    text: 隣の席にいたのは、映画会社の天活の枝正義郎でした。
    reading: となりの せきに いたのわ、えいがかいしゃ てんかつの えだまさ よしろうでした。
  - speaker: zundamon
    emotion: surprised
    text: 喧嘩を止めたら、仕事が決まったのだ。
- id: ch2_kuusatsu
  title: 誰もやらない空撮
  background: gz_satsueijo
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 円谷英二, emotion: normal}
  - {who: kokabu, x: 0.7, emotion: thinking}
  cuts:
  - speaker: kokabu
    emotion: thinking
    text: 飛行機に乗って、上から撮れだと？ 落ちたら死ぬぞ。誰も行かねえよ。
  - speaker: zundamon
    emotion: happy
    text: ボクが行きます！ 飛行機なら、任せてください。
  - speaker: kokabu
    emotion: angry
    text: 新入りが、何を言ってやがる。
  - speaker: zundamon
    emotion: happy
    text: 飛行学校にいました。半分は修理でしたけど。
  - speaker: kokabu
    emotion: surprised
    text: 半分修理じゃ、余計に心配だろうが。
    se: tsukkomi
  - speaker: reimu
    text: 英一は飛行機からの撮影に成功し、撮影技師に引き上げられます。
    reading: えいいちわ ひこうきからの さつえいに せいこうし、さつえい ぎしに ひきあげられます。
  - speaker: zundamon
    emotion: happy
    text: 空の上から、カメラを回したぞ！
    beat: true
- id: card1930
  title: ''
  background: gz_card_1930
  cuts:
  - speaker: reimu
    text: 1930年。京都の撮影所で働く英一は、やがて円谷英二と名乗るようになります。
    reading: せんきゅうひゃくさんじゅうねん。きょうとの さつえいじょで はたらく えいいちわ、やがて つぶらや えいじと なのるように なります。
- id: ch3_crane
  title: 手作りのクレーン
  background: gz_kyoto_set
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 円谷英二, emotion: happy}
  - {who: masano, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 英二は自分のお金で、木の撮影用クレーンを作りました。
    reading: えいじわ じぶんの おかねで、きの さつえいよう くれーんお つくりました。
  - speaker: zundamon
    emotion: happy
    text: 上から撮れば、立ち回りが全部見える。もう少し高く……。
  - speaker: reimu
    text: 撮影の最中に、英二はクレーンから落ちてけがをします。
    reading: さつえいの さいちゅうに、えいじわ くれーんから おちて けがお します。
    background: gz_byoshitsu
  - speaker: masano
    emotion: thinking
    text: '[円谷|つぶらや]さん。クレーンから落ちたんですって？'
  - speaker: zundamon
    emotion: sad
    text: 落ちたんじゃない。……高さを確かめただけなのだ。
  - speaker: masano
    emotion: angry
    text: 確かめ方が、命がけです。
    se: hammer
  - speaker: reimu
    text: 看病してくれた19歳の荒木マサノと、英二は結婚します。
    reading: かんびょうして くれた じゅうきゅうさいの あらき まさのと、えいじわ けっこん します。
- id: ch3_kekkon
  title: ''
  background: gz_ie_kyoto
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 円谷英二, emotion: happy}
  - {who: masano, x: 0.7, emotion: sad}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: じゃあ、ロケに行ってくる！
  - speaker: masano
    emotion: surprised
    text: 式の次の日に、もうお仕事ですか。
  - speaker: masano
    emotion: sad
    text: '[須賀川|すかがわ]から、お祝いのお餅が届いたのに。……ひとりで食べるんですね。'
  - speaker: reimu
    text: その日マサノは、祝いの餅を泣きながらひとりで食べました。
    reading: その ひ まさのわ、いわいの もちお なきながら ひとりで たべました。
  - speaker: masano
    emotion: angry
    text: 給料日は、会社の前で待ってますからね。寄り道させませんよ。
  - speaker: zundamon
    emotion: sad
    text: ……帰り道に、楽しみが無くなったのだ。
    beat: true
- id: ch3_kong
  title: 大きな猿の衝撃
  background: gz_shishitsu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 円谷英二, emotion: surprised}
  - {who: nikkatsu, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1933年。英二は、アメリカ映画のキング・コングを見ます。
