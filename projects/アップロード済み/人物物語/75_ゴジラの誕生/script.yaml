meta:
  title: 【ゴジラの誕生】150キロの着ぐるみは、角材1本もまたげなかった【ずんだもん解説】
  slug: godzilla-tsuburaya
  summary: 福島の須賀川で、空にあこがれた少年がいました。のちの特撮の神様、円谷英二です。飛行学校は教官の墜落で消え、映画の世界では部下のいない課長から始まり、戦後は仕事を追われます。1954年、水爆実験の年。公開まで3か月しかない怪獣映画の撮影所で、最初の着ぐるみは角材1本もまたげませんでした。ゴジラが生まれるまでを、再現ドラマでたどります。
  tags:
  - ゴジラ
  - 円谷英二
  - 特撮
  - 東宝
  - 中島春雄
  - 怪獣映画
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 雑学
  thumbnail:
    top: 動けない怪獣
    bottom: ゴジラの誕生
  mode: drama
  narrator: reimu
