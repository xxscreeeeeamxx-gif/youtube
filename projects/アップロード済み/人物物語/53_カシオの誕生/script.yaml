- id: ch8_tokei2
  title: ''
  background: cs_kaigi
  bgm: hirusagari
  stage:
  - {who: kazuo, x: 0.3, flip: true, emotion: normal}
  - {who: tokei, x: 0.7, emotion: thinking}
  cuts:
  - speaker: tokei
    emotion: thinking
    text: 樫尾さん。時計は、時計の会社に任せたほうがいいですよ。
  - speaker: kazuo
    emotion: normal
    text: ご忠告、ありがとうございます。
  - speaker: kazuo
    emotion: thinking
    text: ただ、10年先も、時計は今のままでしょうか。
  - speaker: tokei
    emotion: surprised
    text: 今のまま、とは。
  - speaker: kazuo
    emotion: happy
    text: 歯車の時計が、電子の計算で動く時代が来ると思うんです。
  - speaker: reimu
    text: 時計の会社の関係者から忠告を受けたと伝えられています。それでもカシオは、時計を続けました。
    reading: とけいの かいしゃの かんけいしゃから ちゅうこくお うけたと つたえられています。それでも かしおわ とけいお つづけました。
  - speaker: reimu
    text: 1980年には電子楽器のカシオトーンが生まれます。
    reading: せんきゅうひゃく はちじゅうねんにわ でんし がっきの かしおとーんが うまれます。
  - speaker: reimu
    text: カシオトーンは、55歳の俊雄が自ら開発に取り組んだ楽器でした。音色は29種類です。
    reading: かしおとーんわ ごじゅうごさいの としおが みずから かいはつに とりくんだ がっきでした。ねいろわ にじゅうきゅうしゅるいです。
  - speaker: reimu
    text: 1983年には、G-SHOCKが続きます。落としても壊れない腕時計です。
    reading: せんきゅうひゃく はちじゅうさんねんにわ じーしょっくが つづきます。おとしても こわれない うでどけいです。
  - speaker: reimu
    text: 発明は必要の母。必要なものを待つのではなく、発明が必要を生む。俊雄は、そう語っていたとされます。
    reading: はつめいわ ひつようの はは。ひつような ものお まつのでわ なく はつめいが ひつようお うむ。としおわ そう かたっていたと されます。
    telops:
    - {text: "発明は必要の母", size: lg, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
- id: ch8_later
  title: ''
  background: cs_zukai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: '[G-SHOCK|じーしょっく]って、どうやって生まれたのだ？'
  - speaker: tsumugi
    emotion: normal
    text: 開発した社員は、父親からもらった時計を落として壊したのがきっかけ、と話してるわ。
  - speaker: tsumugi
    emotion: normal
    text: 企画書は、落としても壊れない丈夫な時計、の1行だけ。
  - speaker: tsumugi
    emotion: normal
    text: 試作品を建物の3階から何度も落として、壊れては作り直したそうよ。
  - speaker: zundamon
    emotion: thinking
    text: どうやって、壊れなくしたのだ？
  - speaker: tsumugi
    emotion: happy
    text: 公園で弾むゴムまりを見て、心臓部を点で支えて浮かせる形を思いついたんですって。
  - speaker: tsumugi
    emotion: normal
    text: 厚さ0.8ミリの、カード型の電卓も、1983年に出たわ。
  - speaker: zundamon
    emotion: surprised
    text: 100キロから、カード1枚か。
  - speaker: tsumugi
    emotion: normal
    text: 電卓の国内生産は、1985年に8600万台まで増えたの。
  - speaker: zundamon
    emotion: surprised
    text: 1年で、8600万台なのだ！
- id: ch8_shi
  title: ''
  background: cs_kinenkan
  bgm: amacha_hoshizora
  cuts:
  - speaker: reimu
    text: 父の茂は1986年に、87歳で亡くなりました。
    reading: ちちの しげるわ せんきゅうひゃく はちじゅうろくねんに はちじゅうななさいで なくなりました。
  - speaker: reimu
    text: 1993年には、長男の忠雄が亡くなります。
    reading: せんきゅうひゃく きゅうじゅうさんねんにわ ちょうなんの ただおが なくなります。
  - speaker: reimu
    text: 1995年には、画面のついたデジタルカメラの草分け、QV-10を出しました。
    reading: せんきゅうひゃく きゅうじゅうごねんにわ がめんの ついた でじたる かめらの くさわけ、きゅーぶいてんお だしました。
  - speaker: reimu
    text: 2012年に俊雄が、2018年に和雄が亡くなりました。
    reading: にせん じゅうにねんに としおが にせん じゅうはちねんに かずおが なくなりました。
  - speaker: reimu
    text: 14-Aの実機は、東京の樫尾俊雄発明記念館で、予約をすれば動く姿を見られます。
    reading: じゅうよん えーの じっきわ とうきょうの かしお としお はつめい きねんかんで、よやくお すれば うごく すがたお みられます。
- id: ch9_ronsou
  title: 本当に世界初？
  background: cs_shiryo
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。ネットで見たのだ。カシオの[14-A|じゅうよんえー]は、世界初の計算機だって。
  - speaker: tsumugi
    emotion: thinking
    text: それは、言い方に気をつけたほうがいいわ。
  - speaker: tsumugi
    emotion: normal
    text: リレーで計算する機械なら、富士通が1954年に作った大型の計算機が先にあるの。
  - speaker: zundamon
    emotion: surprised
    text: 先があったのか！
  - speaker: tsumugi
    emotion: normal
    text: 部屋いっぱいの大きさで、リレーは4500個くらい。机に置くものじゃないわ。
  - speaker: tsumugi
    emotion: normal
    text: 電子式の卓上計算機なら、世界初は1961年のイギリスの機械よ。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、[14-A|じゅうよんえー]は[何|なん]の世界初なのだ？
  - speaker: tsumugi
    emotion: normal
    text: 会社は、小型の純電気式計算機として世界初、と説明してるの。条件つきの一番なのよ。
  - speaker: zundamon
    emotion: thinking
    text: ところで、電卓と電話のボタンが逆なのは、なんでなのだ？
  - speaker: tsumugi
    emotion: normal
    text: 電卓は、レジの並びを受け継いで、よく使う0が手前にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 電話は、ダイヤルの1から順に並べた形を受け継いだのよ。決めた規格も、別々なの。
  - speaker: zundamon
    emotion: surprised
    text: 生まれた家が、違うわけか。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、1たす2かける3で7を出すには、どう押すのだ？
  - speaker: tsumugi
    emotion: normal
    text: かけ算を先にしたいなら、2かける3を先に押して、あとから1を足すのよ。
  - speaker: zundamon
    emotion: happy
    text: 押す順番を、人間が考えるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 0を0で割ると、画面にEが出るわ。答えが出せない、という合図よ。
  - speaker: zundamon
    emotion: surprised
    text: 電卓にも、できないことがあるのか。
  - speaker: tsumugi
    emotion: happy
    text: 逆に、便利な使い方もあるの。カシオの電卓なら、かけ算のキーを2回押すの。
  - speaker: tsumugi
    emotion: normal
    text: 画面にKが出たら、あとは数字とイコールだけで、同じ数を何度でもかけられるのよ。
  - speaker: zundamon
    emotion: surprised
    text: 電卓に、そんな技があったのだ。
  - speaker: tsumugi
    emotion: normal
    text: '[√|るーと]のキーも使えるわ。2年で売り上げが2倍になったら、2を押して[√|るーと]。'
  - speaker: tsumugi
    emotion: normal
    text: 1.41と出るから、1年あたり、およそ41パーセント伸びた計算になるの。
  - speaker: zundamon
    emotion: happy
    text: '[√|るーと]に、ちゃんと出番があった。'
- id: ch10_gendai
  title: 今の電卓
  background: cs_sekai
  bgm: amacha_milkyway
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 電卓の日は3月20日。決められたのは1974年よ。
  - speaker: tsumugi
    emotion: normal
    text: カシオの関数電卓は、今も1年に2000万台以上売れてるそうよ。
  - speaker: tsumugi
    emotion: normal
    text: 出荷された[G-SHOCK|じーしょっく]は、1億5000万を超えるわ。
  - speaker: zundamon
    emotion: happy
    text: 落としても壊れない時計が、世界中にあるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 始まりは、歯車の音がうるさい計算機を見て、電気でやれないかと考えたこと。
  - speaker: zundamon
    emotion: thinking
    text: 電話のスイッチで、計算させた兄弟なのだ。
- id: shime
  title: ''
  background: cs_ima
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: つむぎ。2かける3を先に押したら、ちゃんと7になったのだ。
  - speaker: tsumugi
    emotion: happy
    text: えらいわね。
  - speaker: zundamon
    emotion: happy
    text: 押す順番を考えるのが、ボクの新しい健康法なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: それ、もう暗算したほうが早くない？
  - speaker: zundamon
    emotion: surprised
    text: ……2かける3は、6なのだ。1を足して、7なのだ。
  - speaker: tsumugi
    emotion: happy
    text: できたじゃない。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: 今度電卓を使うときは、キーの並びを見てみて。
  - speaker: tsumugi
    emotion: normal
    text: 10個の数字キーで打つやり方は、[14-A|じゅうよんえー]でも取り入れられていたのよ。
  - speaker: zundamon
    emotion: normal
    text: 手のひらの電卓に、100キロの計算機がいるのだ。
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴ありがとうございました！
    duet_with: tsumugi
