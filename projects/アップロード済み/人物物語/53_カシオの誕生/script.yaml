meta:
  title: 【カシオの誕生】歯車をやめて、電話のスイッチで計算させた四兄弟【ずんだもん解説】
  slug: casio-kashio
  summary: 今では100円でも買える電卓。その前の時代、計算機は車と同じくらい高く、歯車の音を立てて動いていました。東京の町工場で、たばこを指輪にはめる道具を作っていた四兄弟が、なぜ計算機に挑んだのか。札幌の発表会で動かなかった試作機、電話のスイッチをおよそ340個並べた一台、そしてカシオミニへ。
  tags:
  - カシオ
  - 樫尾俊雄
  - 樫尾四兄弟
  - 電卓
  - 計算機
  - リレー
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  thumbnail:
    top: 電話のスイッチで計算
    bottom: カシオの誕生
  mode: drama
  narrator: reimu
