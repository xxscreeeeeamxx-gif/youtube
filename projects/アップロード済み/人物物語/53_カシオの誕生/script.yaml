scenes:
- id: hook
  title: ''
  background: cs_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、見るのだ。宿題は、全部電卓で片付けるぞ。
  - speaker: tsumugi
    emotion: thinking
    text: 自分で計算しなさいよ。
  - speaker: zundamon
    emotion: happy
    text: 暗算しないのが、ボクの健康法なのだ。頭を休ませる。
  - speaker: zundamon
    emotion: normal
    text: 1たす2かける3……。答えは、9なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 答えは7よ。かけ算が先。
  - speaker: zundamon
    emotion: surprised
    text: 電卓が、間違えたのだ！？
  - speaker: tsumugi
    emotion: normal
    text: ふつうの電卓は、押した順に計算するの。1たす2で3、それに3をかけて9。
  - speaker: zundamon
    emotion: thinking
    text: なら、もう1回打ち直す。
  - speaker: zundamon
    emotion: surprised
    text: ……あれ？ 1を押したつもりが、7なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 電話のボタンと、並びが逆だからね。電卓は7が上、電話は1が上なの。
  - speaker: zundamon
    emotion: sad
    text: 打ち直すたびに、答えが変わるのだ。
  - speaker: tsumugi
    emotion: angry
    text: 暗算したほうが、早かったわね。
    se: oti
  - speaker: tsumugi
    emotion: thinking
    text: そもそも、昔の計算機はいくらしたと思う？
  - speaker: zundamon
    emotion: normal
    text: 100円くらいだろ。
  - speaker: tsumugi
    emotion: normal
    text: 小型の純電気式として、世界初とされる1台。
  - speaker: tsumugi
    emotion: normal
    text: 値段は、48万5000円。
  - speaker: tsumugi
    emotion: normal
    text: 重さは100キロを超えてたの。
  - speaker: zundamon
    emotion: surprised
    text: 100キロ！？ 机が、つぶれるのだ！
    se: don
  - speaker: reimu
    text: 電卓。100円ショップでも買える、計算の道具です。
    reading: でんたく。ひゃくえん しょっぷでも かえる けいさんの どうぐです。
  - speaker: reimu
    text: その前の時代に、電話のスイッチで計算機を作ったのは、東京の町工場の四兄弟でした。
    reading: その まえの じだいに でんわの すいっちで けいさんきお つくったのわ、とうきょうの まちこうばの よんきょうだいでした。
  - speaker: zundamon
    emotion: surprised
    text: 四兄弟なのだ？
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、たばこを指輪にはめる、小さな道具よ。
- id: ch0_joukyou
  title: ''
  background: cs_machi
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 樫尾家は高知の出身。関東大震災のあと、東京で働く親戚に誘われて一家で上京しました。
    reading: かしおけわ こうちの しゅっしん。かんとう だいしんさいの あと、とうきょうで はたらく しんせきに さそわれて いっかで じょうきょうしました。
- id: ch0_senban
  title: ''
  background: cs_koba
  bgm: natsuyasumi
  stage:
  - {who: tadao, x: 0.5, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1931年、長男の忠雄は14歳で、旋盤工の見習いになります。
    reading: せんきゅうひゃく さんじゅういちねん ちょうなんの ただおわ じゅうよんさいで せんばんこうの みならいに なります。
  - speaker: tadao
    emotion: happy
    text: 鉄が、思ったとおりの形に削れていく……。
  - speaker: tadao
    emotion: happy
    text: これは、おれの天職だ。
  - speaker: reimu
    text: 働きながら学校にも通い、腕を磨いたといいます。
    reading: はたらきながら がっこうにも かよい うでお みがいたと いいます。
  - speaker: reimu
    text: 次男の俊雄は電機学校を出て、国の通信の役所、逓信省の技術者になりました。
    reading: じなんの としおわ でんき がっこうお でて、くにの つうしんの やくしょ ていしんしょうの ぎじゅつしゃに なりました。
  - speaker: reimu
    text: 忠雄は戦争中に独立しましたが、空襲で旋盤を焼かれたとされています。
    reading: ただおわ せんそうちゅうに どくりつしましたが、くうしゅうで せんばんお やかれたと されています。
  - speaker: reimu
    text: 俊雄も1945年に、モールス信号を速く送る装置で、特許を出願しています。
    reading: としおも せんきゅうひゃく よんじゅうごねんに もーるす しんごうお はやく おくる そうちで とっきょお しゅつがん しています。
- id: card1946
  title: ''
  background: cs_card_1946
  cuts:
  - speaker: reimu
    text: 1946年。東京の三鷹で、長男の忠雄が小さな工場を開きます。
    reading: せんきゅうひゃく よんじゅうろくねん。とうきょうの みたかで ちょうなんの ただおが ちいさな こうじょうお ひらきます。
- id: ch1_koba
  title: 兄の町工場
  background: cs_koba
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 樫尾俊雄, emotion: normal}
  - {who: tadao, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 工場では、鍋や釜、電熱器、自転車のランプ、顕微鏡の部品まで作りました。
    reading: こうじょうでわ なべや かま、でんねつき じてんしゃの らんぷ けんびきょうの ぶひんまで つくりました。
  - speaker: zundamon
    emotion: normal
    text: 兄さん。ボクも、この工場で働きたいのだ。
  - speaker: tadao
    emotion: thinking
    text: だめだ。お前は、役所の技術者だろう。役所にいれば、出世もできる。
  - speaker: zundamon
    emotion: happy
    text: もう、辞めてきた。
  - speaker: tadao
    emotion: surprised
    text: 辞めた？
  - speaker: zundamon
    emotion: normal
    text: ボクは、作りたいものを作りたいのだ。
  - speaker: tadao
    emotion: thinking
    text: うちは鍋と釜を作る町工場だぞ。
  - speaker: zundamon
    emotion: happy
    text: 鍋も釜も、ちゃんと作るぞ。そのうち、もっと面白いものも作るのだ。
  - speaker: tadao
    emotion: happy
    text: ……しかたない。明日から来い。
  - speaker: reimu
    text: 忠雄は弟の将来を案じて、一度は断ったとされています。
    reading: ただおわ おとうとの しょうらいお あんじて いちどわ ことわったと されています。
- id: ch1_kokyu
  title: ''
  background: cs_koba
  bgm: hirusagari
  stage:
  - {who: tadao, x: 0.3, flip: true, emotion: normal}
  - {who: hacchuu, x: 0.7, emotion: surprised}
  cuts:
  - speaker: tadao
    emotion: normal
    text: 鉄の玉を真ん丸に削る仕事ですが、1日50個が、200個できるようになりました。
  - speaker: hacchuu
    emotion: surprised
    text: それは助かる。
  - speaker: tadao
    emotion: normal
    text: ですから、1個あたりの値段を下げてください。
  - speaker: hacchuu
    emotion: surprised
    text: 自分から、値下げを言い出す職人は初めてだ。
  - speaker: hacchuu
    emotion: happy
    text: 樫尾さん。あんたは、正直の上にばかがつくね。
  - speaker: reimu
    text: 手間が減ったぶん値段を下げる。忠雄のこのやり方は、取引先の信用につながったといいます。
    reading: てまが へった ぶん ねだんお さげる。ただおの この やりかたわ とりひきさきの しんように つながったと いいます。
- id: ch1_pipe
  title: ''
  background: cs_koba
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 樫尾俊雄, emotion: happy}
  - {who: chichi, x: 0.7, emotion: surprised}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 父さん、見てくれ。たばこを差しこむ、指輪なのだ。
  - speaker: chichi
    emotion: surprised
    text: 指輪に、たばこ？
  - speaker: zundamon
    emotion: happy
    text: 指にはめたまま吸えるから、手がふさがらないのだ。根元まで、残さず吸えるぞ。
  - speaker: chichi
    emotion: thinking
    text: 仕事をしながら、吸えるわけか。
  - speaker: zundamon
    emotion: normal
    text: 兄さんが、旋盤で削ってくれた。
  - speaker: chichi
    emotion: happy
    text: よし。わしが売り歩いてこよう。
  - speaker: reimu
    text: 指輪パイプと呼ばれたこの道具は、作るそばから売れたといいます。売り歩いたのは、父の茂でした。
    reading: ゆびわ ぱいぷと よばれた この どうぐわ、つくる そばから うれたと いいます。うりあるいたのわ ちちの しげるでした。
  - speaker: reimu
    text: そのもうけが、のちの計算機づくりの元手の一部になったとされています。
    reading: その もうけが、のちの けいさんき づくりの もとでの いちぶに なったと されています。
- id: card1949
  title: ''
  background: cs_card_1949
  cuts:
  - speaker: reimu
    text: 1949年。銀座で開かれた展示会で、俊雄は外国製の計算機を見ます。
    reading: せんきゅうひゃく よんじゅうくねん。ぎんざで ひらかれた てんじかいで としおわ がいこくせいの けいさんきお みます。
- id: ch2_ginza
  title: 歯車の計算機
  background: cs_tenji0
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 樫尾俊雄, emotion: surprised}
  - {who: tadao, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 兄さん。この機械、ガチャガチャうるさいのだ。
  - speaker: tadao
    emotion: normal
    text: モーターで、歯車を回して計算してるんだ。
  - speaker: zundamon
    emotion: thinking
    text: かけ算ひとつに、ずいぶん待たされるな。
  - speaker: tadao
    emotion: thinking
    text: 値段を見てみろ。自動車が買えるぞ。
  - speaker: zundamon
    emotion: surprised
    text: 自動車と同じ値段なのだ！？
  - speaker: zundamon
    emotion: thinking
    text: 歯車だから、遅くて、うるさい。
  - speaker: zundamon
    emotion: happy
    text: 兄さん。計算機を、やってみるのだ。
  - speaker: tadao
    emotion: surprised
    text: うちで、計算機を？
  - speaker: zundamon
    emotion: normal
    text: もっと速くて静かな計算機を、ボクらで作るのだ。
  - speaker: reimu
    text: 当時の電動計算機は、かけ算や割り算に10秒から20秒ほどかかったとされています。
    reading: とうじの でんどう けいさんきわ、かけざんや わりざんに じゅうびょうから にじゅうびょう ほど かかったと されています。
  - speaker: reimu
    text: 重さは30キロを超え、値段は自動車並みでした。
    reading: おもさわ さんじゅっきろお こえ ねだんわ じどうしゃなみでした。
- id: card1954
  title: ''
  background: cs_card_1954
  cuts:
  - speaker: reimu
    text: 1954年。最初の試作機が完成します。
    reading: せんきゅうひゃく ごじゅうよねん。さいしょの しさくきが かんせいします。
- id: ch3_shisaku
  title: あと5年早ければ
  background: cs_shousha
  bgm: kinakusai
  stage:
  - {who: kazuo, x: 0.3, flip: true, emotion: happy}
  - {who: shousha, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: ランドセルほどの大きさで、重さは30キロほど。
    reading: らんどせるほどの おおきさで おもさわ さんじゅっきろほど。
  - speaker: reimu
    text: 三男の和雄がオートバイを運転し、後ろの幸雄が抱えて商社へ運んだといいます。
    reading: さんなんの かずおが おーとばいお うんてんし、うしろの ゆきおが かかえて しょうしゃえ はこんだと いいます。
  - speaker: kazuo
    emotion: happy
    text: うちの兄が作った計算機です。見てください。
  - speaker: shousha
    emotion: thinking
    text: ほう。モーターの音が、しませんね。
  - speaker: kazuo
    emotion: happy
    text: 電磁石の力で動かす仕掛けです。
  - speaker: shousha
    emotion: normal
    text: かけ算の答えに、続けてまたかけることは、できますか。
  - speaker: kazuo
    emotion: surprised
    text: ……それは、まだです。
  - speaker: shousha
    emotion: thinking
    text: 惜しいですね。あと5年早ければ、売れたでしょう。
  - speaker: reimu
    text: 答えにさらにかけ算を重ねる機能がなく、商社の評価は厳しいものでした。
    reading: こたえに さらに かけざんお かさねる きのうが なく、しょうしゃの ひょうかわ きびしい ものでした。
- id: ch3_relay
  title: ''
  background: cs_koba
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 樫尾俊雄, emotion: thinking}
  - {who: tadao, x: 0.7, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 改良を重ね、1956年には量産の目前までこぎつけます。
    reading: かいりょうお かさね せんきゅうひゃく ごじゅうろくねんにわ りょうさんの もくぜんまで こぎつけます。
  - speaker: zundamon
    emotion: thinking
    text: 兄さん。昨日のボクは、ばかだ。
  - speaker: tadao
    emotion: surprised
    text: どうした、急に。
  - speaker: zundamon
    emotion: thinking
    text: この計算機、最初から作り直したい。
  - speaker: tadao
    emotion: surprised
    text: 今からか！ もう、量産の準備を始めてるんだぞ。
  - speaker: zundamon
    emotion: normal
    text: 機械の部分が複雑すぎる。これでは、たくさん作れないのだ。
  - speaker: tadao
    emotion: thinking
    text: じゃあ、[何|なに]で作るんだ。
  - speaker: zundamon
    emotion: happy
    text: リレーだ。電話の交換機に、たくさん使われてるスイッチだ。
  - speaker: tadao
    emotion: thinking
    text: 電話のスイッチで、計算ができるのか。
  - speaker: zundamon
    emotion: normal
    text: 交換機は、電気の流れだけで、つなぐ先を切り替えてる。数だって、数えられるはずなのだ。
  - speaker: tadao
    emotion: normal
    text: ……分かった。やり直そう。
  - speaker: reimu
    text: 動く部品の多い機械をやめ、電話の交換機のリレーだけで計算させる。一からの作り直しでした。
    reading: うごく ぶひんの おおい きかいお やめ、でんわの こうかんきの りれーだけで けいさん させる。いちからの つくりなおしでした。
    telops:
    - {text: "電話のリレーで、一から作り直す", size: lg, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: 昨日のおれはばかだった。前の考えをすぐ捨てるこの言葉は、俊雄の口ぐせだったと伝えられています。
    reading: きのうの おれわ ばかだった。まえの かんがえお すぐ すてる この ことばわ、としおの くちぐせだったと つたえられています。
- id: ch3_shikumi
  title: ''
  background: cs_zukai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: つむぎ。リレーって、結局どういうスイッチなのだ？
  - speaker: tsumugi
    emotion: normal
    text: 電気を流すと電磁石になって、金属の板を引き寄せるの。
  - speaker: tsumugi
    emotion: normal
    text: それで、別の回路がつながったり、切れたりするのよ。
  - speaker: zundamon
    emotion: thinking
    text: 電気で、別の電気のスイッチを入れるわけか。
  - speaker: tsumugi
    emotion: happy
    text: そう。人の手を使わずに、電気が電気を動かすのよ。
  - speaker: zundamon
    emotion: thinking
    text: スイッチだけで、どうやって数を覚えるのだ？
  - speaker: tsumugi
    emotion: normal
    text: 入ってるか、切れてるか。2つの状態を組み合わせて、数を表すの。
  - speaker: tsumugi
    emotion: normal
    text: このとき使ったのは、1けたを、5があるかないかと、0から4の組み合わせで表す方法よ。
  - speaker: zundamon
    emotion: surprised
    text: 5と、残り……そろばんと同じなのだ！
  - speaker: tsumugi
    emotion: happy
    text: そう。上の5の玉と、下の1の玉と同じ考え方ね。
  - speaker: tsumugi
    emotion: normal
    text: リレーの数は、およそ340個。表示は、14けたの数字が並ぶ窓が1つだけ。
  - speaker: zundamon
    emotion: thinking
    text: 歯車の計算機より、速いのか？
  - speaker: tsumugi
    emotion: normal
    text: かけ算や割り算が5秒から6秒。歯車の機械より速くて、音も静かだったと言われるわ。
  - speaker: tsumugi
    emotion: normal
    text: 数字のキーを10個並べる、今の電卓と同じ打ち方も、この機械で取り入れたの。
  - speaker: zundamon
    emotion: happy
    text: 今の電卓の、ご先祖さまなのだ。
- id: card1956
  title: ''
  background: cs_card_1956
  cuts:
  - speaker: reimu
    text: 1956年。札幌で、試作機の発表会が開かれます。
    reading: せんきゅうひゃく ごじゅうろくねん。さっぽろで しさくきの はっぴょうかいが ひらかれます。
- id: ch4_sapporo
  title: 札幌で動かない
  background: cs_haneda
  bgm: kinakusai
  stage:
