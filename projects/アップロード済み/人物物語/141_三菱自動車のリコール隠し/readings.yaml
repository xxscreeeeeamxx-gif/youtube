# mitsubishi-masuko 読み台帳（人名・地名・社名・専門語）
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている（タグは付けていない）。
# 名札（tag: 益子 / label: 役員・先輩・新人・検査官・記者・河添・社員・店長・部下・会長・裁判長・相川・ゴーン）・
# テロップ・スライド・章タイトルは表示専用なのでタグを付けていない。
#
# 2026-11-18 台本を書いたあと、セリフ全行を VOICEVOX の audio_query（各話者の style）にかけた結果:
# - 益子 はタグなしだと マシコ になった → [益子|マスコ] で マスコワ / マスコサンガ（1語）。
# - 河添 は [河添|カワソエ] で カワソエシャチョオ（1語）。
# - 日本向け はタグなしだと ニッポンムケ → [日本|にほん]向け で ニホンムケ。
# - 指示改修 は、ひらがなのタグで シジカ/イシュウ、カタカナのタグで シジカイ/シュウ と切れた。
#   タグなしだと シジカイシュウダ（1語）で正しいので、セリフはタグなし・この台帳に入れない（ナレは reading で しじ かいしゅう）。
# - 走行抵抗 も、タグを付けると ソオ/コウテ/イコオ・ソオ/コオテイコオ と切れた。タグなしで ソオコオテエコオ（1語）で正しいので
#   タグなし・台帳に入れない。
# - 三菱の側が＝ソク、その同じ年に＝オナジネン になった → 「三菱の会長が！？」「その年に」に言い換えた。
# - 下の専門語は、ひらがなのタグで1語のまま正しく読んだので、全出現にタグを付けて台帳で見張る:
#   一生もの＝イッショオモノ、摩耗＝マモオ、筆頭株主＝ヒットオカブヌシ、覚書＝オボエガキ。
# - タグなしで正しく読んだので台帳に入れていない語: 三菱ふそう（ミツビシフソオ）・運輸省（ウンユショオ）・燃費（ネンピ）・
#   国交省（コッコオショオ）・日刊工業（ニッカンコオギョオ）・一手（イッテ）・四輪（ヨンリン）・相互補完（ソオゴホカン）・
#   作業着（サギョオギ）・更衣室（コオイシツ）・何十回（ナンジュッカイ）・何分（ナンプン）・1km（イチキロメエトル）・
#   26.67%（ニジュウロクテンロクナナパアセント）・29.2（ニジュウキュウテンニ）・30.4（サンジュッテンヨン）・
#   透明度（トオメエド）・次期中期計画・意図的・携わって・重圧・総意・損害賠償・重工（ジュウコオ）・17日（ジュウシチニチ）。
