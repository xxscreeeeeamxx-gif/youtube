  - 三菱自動車工業「アニュアルレポート2005」 https://www.mitsubishi-motors.com/content/dam/com/ir_jp/pdf/anual/annual2005.pdf
  - 日産自動車「日産自動車と三菱自動車、戦略的アライアンスを締結」（2016年5月12日） https://global.nissannews.com/ja-JP/releases/160512-02-j
  - 消費者庁 表示対策課「景品表示法の課徴金制度の運用状況について」（2017年6月27日） https://www.cao.go.jp/consumer/iinkai/2017/250/doc/20170627_shiryou1_1.pdf
  - Car Watch「三菱自動車、燃費試験の不正問題で益子会長が会見」（2016年5月12日） https://car.watch.impress.co.jp/docs/news/20160512_756957.html
