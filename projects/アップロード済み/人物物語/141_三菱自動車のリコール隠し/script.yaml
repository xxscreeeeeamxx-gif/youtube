meta:
  title: 「知らなかったと責任を逃れることはできない」三菱自動車の会長、翌日に日産が34%出資を発表【ずんだもん解説】
  slug: mitsubishi-masuko
  hook_line: 隠しで潰れかけた三菱自動車を立て直した男の下で、なぜまた数字が分けられたのか。
  summary: 2016年5月11日、燃費の不正で初めて会見に出た三菱自動車の会長、益子修は「経営責任は、知らなかったと責任を逃れることはできないと考えている。」と述べました。12年前、欠陥を隠して潰れかけたこの会社を立て直すため、三菱商事から来た人です。国に見せる分と見せない分に分けた苦情の紙、「整備のせい」とされた部品、5回引き上げられた燃費の目標。国の発表、判決を伝える報道、会社の資料をもとに、事故と裁判は人ごとに分けて、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 国土交通省「三菱ふそう製大型車のハブ破損に関するリコールについて」（2004年3月11日） https://www.mlit.go.jp/kisha/kisha04/09/090311_.html
