scenes:
# ---- 先出し（2016年5月11日・国交省の会見室。記者の問いは作らない。並びの分からない言葉を一問一答にしない。笑いの SE なし） ----
- id: co_kaiken
  title: ''
  background: mm_kaiken
  bgm: serious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 益子, emotion: sad}
  - {who: yakuin, x: 0.56, emotion: sad}
  - {who: yakuin2, x: 0.8, emotion: sad}
  cuts:
  - speaker: reimu
    text: 2016年5月11日、東京・霞が関。三菱自動車の会長の益子修が、燃費の不正で初めて会見に出ます。
    reading: にせん じゅうろくねん ごがつ じゅういちにち、とうきょう かすみがせき。みつびし じどうしゃの かいちょうの ますこ おさむが ねんぴの ふせいで はじめて かいけんに でます。
  - speaker: zundamon
    emotion: sad
    text: 経営責任は、知らなかったと責任を逃れることはできないと考えている。
  - speaker: zundamon
    emotion: sad
    text: なぜ[日本|にほん]向けで起きたのか。私も同じ疑問を持っているが……
  - speaker: reimu
    text: 記者に今回の説明で納得してもらえるのかと問われ、益子はこう答えます。
    reading: きしゃに こんかいの せつめいで なっとく して もらえるのかと とわれ、ますこわ こう こたえます。
  - speaker: zundamon
    emotion: sad
    text: 歯切れがわるいですね。これでは納得していただけると思いません
  - speaker: reimu
    text: 彼は12年前、欠陥を隠して潰れかけたこの会社を立て直すため三菱商事から来ました。
    reading: かれわ じゅうにねん まえ、けっかんお かくして つぶれかけた この かいしゃお たてなおす ため みつびし しょうじから きました。
  - speaker: reimu
    text: 国に見せる数字と本当の数字。この会社がそれを分けたのは、これが3度目です。
    reading: くにに みせる すうじと ほんとうの すうじ。この かいしゃが それお わけたのわ、これが さんどめです。
  - speaker: reimu
    text: 翌日、株の34%を日産が取ると発表されます。
    reading: よくじつ、かぶの さんじゅうよん ぱーせんとお にっさんが とると はっぴょう されます。
    telops:
    - {text: "翌日　日産が34%出資を発表", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
# ---- 今の部屋（都合のいい条件の5分。燃費の中身は本編で） ----
- id: hook
  title: ''
  background: mm_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 家から駅まで、自転車で5分なのだ！
  - speaker: tsumugi
    emotion: normal
    text: 本当に？
  - speaker: zundamon
    emotion: happy
    text: 下り坂で追い風で、信号が全部青なら5分なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: それを、ふだんの5分とは言わないの。
    se: hammer
  - speaker: tsumugi
    emotion: normal
    text: 2016年、車の燃費でそれに近いことが分かった会社があるの。
  - speaker: tsumugi
    emotion: thinking
    text: 隠しで潰れかけた会社を立て直した男の[下|もと]で、なぜまた数字が分けられたのか。
    telops:
    - {text: "立て直した男の下で なぜまた数字が？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 立て直した人の[下|もと]で、また！？
# ---- 2000年・品質保証部の書類棚（P と H が何の略かは言わない。量の比べも言わない。2:00 までに「分けていた」へ） ----
- id: card2000
  title: ''
  background: mm_card_2000
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 2000年。三菱自動車の品質保証部には、お客さんの苦情の紙が集まっていました。
    reading: にせん ねん。みつびし じどうしゃの ひんしつ ほしょうぶにわ、おきゃくさんの くじょうの かみが あつまって いました。
- id: ch1_tana
  title: 見せる箱、見せない箱
  background: mm_tana
  bgm: kinakusai
  stage:
  - {who: senpai, x: 0.56, flip: true, emotion: normal}
  - {who: shinjin, x: 0.88, emotion: normal}
  cuts:
  - speaker: shinjin
    emotion: normal
    text: 先輩、この苦情の紙はPの箱とHの箱のどっちですか。
  - speaker: senpai
    emotion: normal
    text: Pは、運輸省の監査が来たら見せる箱だ。
  - speaker: shinjin
    emotion: normal
    text: Hは？
  - speaker: senpai
    emotion: normal
    text: 見せない箱。
  - speaker: shinjin
    emotion: surprised
    text: 見せない！？
    beat: true
  - speaker: shinjin
    emotion: thinking
    text: じゃあHの欠陥は、どうやって直すんです？
  - speaker: senpai
    emotion: normal
    text: 販売店に頼んで、点検のついでに直してもらう。
  - speaker: shinjin
    emotion: sad
    text: 国に届けずに、こっそり……。
  - speaker: shinjin
    emotion: thinking
    text: それ、なんて呼ぶんです？
  - speaker: senpai
    emotion: normal
    text: 社内じゃ、指示改修だ。
  - speaker: reimu
    text: この会社は苦情の紙を、国に見せる分と見せない分に分けていました。
    reading: この かいしゃわ くじょうの かみお、くにに みせる ぶんと みせない ぶんに わけて いました。
  - speaker: shinjin
    emotion: normal
    text: Hの箱は、監査の日はどこに置くんです？
  - speaker: senpai
    emotion: normal
    text: ……更衣室。
  - speaker: shinjin
    emotion: surprised
    text: 更衣室！？
  - speaker: senpai
    emotion: normal
    text: ロッカーの中だ。
  - speaker: shinjin
    emotion: surprised
    text: ロッカーに、書類を入れるんですか！？
    se: zukko
  - speaker: senpai
    emotion: normal
    text: ……扉は、閉めておけ。
    beat: true
# ---- 2000年7月5日・抜き打ちの立入検査（ロッカー室は社内の調べ ※A の範囲。内部告発の人は描かない） ----
- id: ch1_kensa
  title: ''
  background: mm_tana
  stage:
  - {who: kensakan, x: 0.12, flip: true, emotion: normal}
  - {who: senpai, x: 0.56, emotion: normal}
  cuts:
  - speaker: reimu
    text: 7月5日。運輸省の検査官が、抜き打ちで本社と岡崎の技術センターに入ります。
    reading: しちがつ いつか。うんゆしょうの けんさかんが、ぬきうちで ほんしゃと おかざきの ぎじゅつ せんたーに はいります。
  - speaker: kensakan
    emotion: normal
    text: 運輸省です。苦情の記録を、見せてください。
  - speaker: senpai
    emotion: normal
    text: ……こちらの棚です。
  - speaker: kensakan
    emotion: normal
    text: この棚の苦情で、全部ですか。
  - speaker: senpai
    emotion: sad
    text: ……はい。全部です。
  - speaker: reimu
    text: 会社がのちに調べると、苦情の一部はロッカー室に隠されていました。
    reading: かいしゃが のちに しらべると、くじょうの いちぶわ ろっかーしつに かくされて いました。
    background: mm_tana_kara
  - speaker: reimu
    text: 国に見せる箱と、見せない箱。4年後にこの会社の再建を任される男は、まだ三菱商事にいます。
    reading: くにに みせる はこと みせない はこ。よねんごに この かいしゃの さいけんお まかされる おとこわ まだ みつびし しょうじに います。
  - speaker: reimu
    text: 16年後、同じ会社の軽自動車のカタログには燃費30.4。国の物差しで名乗れたのは、26.1でした。
    reading: じゅうろくねんご、おなじ かいしゃの けいじどうしゃの かたろぐにわ ねんぴ さんじゅってん よん。くにの ものさしで なのれたのわ、にじゅうろくてん いちでした。
  - speaker: reimu
    text: 1年に1万km走ると、ガソリンは18リットルのポリタンク3本分ちがいます。
    reading: いちねんに いちまん きろ はしると、がそりんわ じゅうはち りっとるの ぽりたんく さんぼんぶん ちがいます。
    telops:
    - {text: "カタログ30.4　国の物差しでは26.1", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
# ---- 2000年7月18日〜9月8日・連絡ミスから辞任（連絡ミスは会社の説明としてナレ。河添の台詞は会見の2つだけ） ----
- id: ch2_mis
  title: 連絡ミスから辞任へ
  background: mm_honsha_kaiken
  stage:
  - {who: kisha2, x: 0.14, flip: true, emotion: normal}
  - {who: kisha, x: 0.86, emotion: normal}
  cuts:
  - speaker: reimu
    text: 7月18日。運輸省の厳重注意を受けた会社は、会見で組織的な隠蔽ではなく業務上の連絡ミスと説明します。
    reading: しちがつ じゅうはちにち。うんゆしょうの げんじゅう ちゅういお うけた かいしゃわ、かいけんで そしきてきな いんぺいでわ なく ぎょうむじょうの れんらく みすと せつめい します。
  - speaker: kisha
    emotion: thinking
    text: 連絡ミス、ねえ……。
  - speaker: kisha2
    emotion: normal
    text: 届け出が要る案件が、14件も見つかったのにな。
  - speaker: kisha
    emotion: surprised
    text: 8日後には、50万台を超えるリコールなどを届け出た。
  - speaker: kisha2
    emotion: surprised
    text: 組織的な隠蔽も、認めたぞ。
  - speaker: kisha
    emotion: thinking
    text: 8日で、ミスが隠蔽に……。
    beat: true
- id: ch2_jinin
  title: ''
  background: mm_honsha_kaiken
  stage:
  - {who: kawasoe, x: 0.3, flip: true, emotion: normal}
  - {who: kisha, x: 0.86, emotion: normal}
  cuts:
  - speaker: kisha
    emotion: normal
    text: 8月22日、[河添|カワソエ]社長の会見だ。辞任は否定するらしい。
  - speaker: kawasoe
    emotion: normal
    text: 再び信頼される会社にするのが私の務め
- id: ch2_rouka
  title: ''
  background: mm_rouka
  stage:
  - {who: kawasoe, x: 0.2, flip: true, emotion: sad}
  - {who: kisha, x: 0.62, emotion: normal}
  cuts:
  - speaker: kisha
    emotion: surprised
    text: 17日後の9月8日。運輸省に、[河添|カワソエ]社長が来た。
  - speaker: kawasoe
    emotion: sad
    text: 一連の事件の責任をとって社長を辞任する
  - speaker: kisha
    emotion: normal
    text: 務めると言ってから、17日か……。
  - speaker: reimu
    text: このとき会社が調べたのは、1998年4月以降の苦情だけ。残りは、4年後に出てきます。
    reading: この とき かいしゃが しらべたのわ、せんきゅうひゃく きゅうじゅうはちねん しがつ いこうの くじょう だけ。のこりわ、よねんごに でて きます。
# ---- 2002年1月10日・瀬谷（人のいない道路の遠景とナレだけ。SE・ボケなし。被害者の名前・年齢は出さない） ----
- id: ch3_seya
  title: 1月10日、瀬谷
  background: mm_doro
  bgm: 223am
  cuts:
  - speaker: reimu
    text: 2002年1月10日、午後3時50分。横浜市瀬谷区の県道で、三菱製の大型車の左の前輪が外れます。
    reading: にせん にねん いちがつ とおか、ごご さんじ ごじゅっぷん。よこはまし せやくの けんどうで、みつびしせいの おおがたしゃの ひだりの ぜんりんが はずれます。
  - speaker: reimu
    text: 歩いていた母子3人に当たります。母親が亡くなり、子ども2人がけがをしました。
    reading: あるいて いた ぼし さんにんに あたります。ははおやが なくなり、こども ふたりが けがお しました。
  - speaker: reimu
    text: 車輪を取り付ける部品のハブが、輪切りに割れていました。1992年から数えて40件目です。
    reading: しゃりんお とりつける ぶひんの はぶが、わぎりに われて いました。せんきゅうひゃく きゅうじゅうにねんから かぞえて よんじゅっけんめです。
# ---- 1月〜2月・一生もの（品質保証部の先輩と新人。有罪になった元部長・元グループ長は出さない。笑いなし） ----
- id: ch4_kaigi
  title: 一生もの
  background: mm_kaigi
  bgm: kinakusai
  stage:
  - {who: senpai, x: 0.12, flip: true, emotion: normal}
  - {who: shinjin, x: 0.88, emotion: sad}
  cuts:
  - speaker: shinjin
    emotion: sad
    text: 横浜の事故も、ハブが割れたそうです。
  - speaker: shinjin
    emotion: sad
    text: ハブって、壊れるんですか。
  - speaker: senpai
    emotion: normal
    text: 壊れない。廃車まで持つ。だから、[一生もの|いっしょうもの]。
  - speaker: shinjin
    emotion: normal
    text: 車検では、見るんですか。
  - speaker: senpai
    emotion: normal
    text: 見ない。[一生もの|いっしょうもの]だからな。
  - speaker: shinjin
    emotion: sad
    text: でも、また割れたって……。
  - speaker: senpai
    emotion: normal
    text: '[摩耗|まもう]だ。使う側の整備が悪い。'
  - speaker: shinjin
    emotion: normal
    text: 最初に割れたのは、いつなんです？
  - speaker: senpai
    emotion: normal
    text: 1992年だ。それからずっと、[摩耗|まもう]で通してきた。
  - speaker: shinjin
    emotion: normal
    text: 外には、知らせてないんですか。
  - speaker: senpai
    emotion: normal
    text: 事故の情報は、社内だけの扱いだ。
  - speaker: senpai
    emotion: normal
    text: 会社は、今回もリコールはしないそうだ。
  - speaker: senpai
    emotion: normal
    text: 自主的に点検して、ハブを替える。
  - speaker: shinjin
    emotion: sad
    text: ……届けないんですね。
  - speaker: shinjin
    emotion: sad
    text: 同じ部品が何十回も割れて、それでも整備のせいなんですか……。
  - speaker: reimu
    text: 2月1日。会社は脱輪が相次ぐ原因について、国にうその報告をします。当時の罰は、20万円以下の罰金でした。
    reading: にがつ ついたち。かいしゃわ だつりんが あいつぐ げんいんに ついて、くにに うその ほうこくお します。とうじの ばつわ、にじゅうまんえん いかの ばっきんでした。
  - speaker: reimu
    text: 10月には山口でも、三菱のトラックの運転手が亡くなります。会社は、これも整備のせいだとしました。
    reading: じゅうがつにわ やまぐちでも、みつびしの とらっくの うんてんしゅが なくなります。かいしゃわ、これも せいびの せいだと しました。
