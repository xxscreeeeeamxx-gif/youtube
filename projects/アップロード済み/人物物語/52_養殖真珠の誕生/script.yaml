  - speaker: tsumugi
    emotion: happy
    text: その袋を、真珠袋っていうの。
  - speaker: tsumugi
    emotion: normal
    text: だから養殖では、核と一緒に、別の貝の外套膜を2ミリ角くらい切って入れるの。
  - speaker: zundamon
    emotion: thinking
    text: 核だけじゃ、だめなのだ？
  - speaker: tsumugi
    emotion: normal
    text: 核は、ただの芯。巻いてくれるのは、その細胞のほうよ。袋は、1か月ほどでできるわ。
  - speaker: zundamon
    emotion: thinking
    text: 核は、[何|なに]でできてるのだ？
  - speaker: tsumugi
    emotion: normal
    text: アメリカの川でとれる貝の殻を、丸く削ったもの。削るのは、淡路島の職人さんたちよ。
  - speaker: zundamon
    emotion: surprised
    text: 貝の中に、別の貝の殻を入れるのか。
  - speaker: tsumugi
    emotion: normal
    text: 巻きが0.4ミリなら、7ミリの真珠は、体積の7割くらいが核なの。
  - speaker: zundamon
    emotion: surprised
    text: ほとんど、中身は殻なのだ！
  - speaker: tsumugi
    emotion: normal
    text: それと、真珠は袋の中で、ゆっくり回りながら巻かれていくの。
  - speaker: tsumugi
    emotion: thinking
    text: 黒い真珠を作る貝の実験では、平均4時間43分で[1回転|いっかいてん]していたそうよ。
  - speaker: zundamon
    emotion: happy
    text: 袋の中で、真珠が回ってるのだ！
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、あの光り方は、どこから来るのだ？
  - speaker: tsumugi
    emotion: normal
    text: 真珠の層は、とても薄い結晶の板が重なってできてるの。
  - speaker: tsumugi
    emotion: normal
    text: 板1枚の厚さは、0.5マイクロメートルくらい。
  - speaker: tsumugi
    emotion: normal
    text: 1ミリで、およそ2000枚も重なってるの。
  - speaker: zundamon
    emotion: surprised
    text: 2000枚！ まるでミルフィーユだ。
  - speaker: tsumugi
    emotion: normal
    text: 板の厚さが、光の波の長さとほぼ同じなの。
  - speaker: tsumugi
    emotion: normal
    text: だから光が重なり合って、虹のような色とつやが出るのよ。
  - speaker: zundamon
    emotion: thinking
    text: 色を塗ってるんじゃなくて、薄さで光ってるのだ。
  - speaker: tsumugi
    emotion: happy
    text: そう。シャボン玉が虹色に見えるのと、同じ仲間の仕組みよ。
  - speaker: tsumugi
    emotion: normal
    text: 冬の冷たい海だと、きめの細かい層ができるの。だから、取り出すのは12月から1月ごろ。
  - speaker: zundamon
    emotion: happy
    text: 最後に、冬の海でお化粧か。
  - speaker: tsumugi
    emotion: happy
    text: 本当に、化粧巻きって呼ぶのよ。
  - speaker: tsumugi
    emotion: normal
    text: 手術から浜に揚げるまでは、半年から1年半くらいね。
  - speaker: tsumugi
    emotion: normal
    text: 今の養殖では、毎年8400万個くらいの[稚貝|ちがい]から始めるの。
  - speaker: tsumugi
    emotion: normal
    text: '[母貝|ぼがい]まで育つのが5600万個。手術をして、最後に浜に揚がるのは2800万個ほどよ。'
  - speaker: zundamon
    emotion: surprised
    text: 3分の1になってるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 手術した貝のうち、4割から5割は、育てている間に死んでしまうの。
  - speaker: zundamon
    emotion: sad
    text: 半分近くも……。
  - speaker: tsumugi
    emotion: normal
    text: 質のいい真珠のうち、最上級の[花珠|はなだま]と呼ばれるのは、1割くらいと言われてるわ。
- id: ch13_ronsou
  title: 養殖は偽物？
  background: mk_shiryo
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。ネットで見たのだ。養殖の真珠は、人が作った偽物だって。
  - speaker: tsumugi
    emotion: normal
    text: 100年前のヨーロッパと、同じことを言ってるわね。
  - speaker: zundamon
    emotion: surprised
    text: 同じなのだ？
  - speaker: tsumugi
    emotion: normal
    text: 人がしたのは、きっかけを作ることだけ。真珠の層を巻いたのは、貝自身よ。
  - speaker: tsumugi
    emotion: normal
    text: 偽物と呼ぶべきなのは、模造真珠のほうよ。
  - speaker: tsumugi
    emotion: normal
    text: ガラスなどの玉に、魚のうろこから作った塗料を塗ったものなの。
  - speaker: zundamon
    emotion: thinking
    text: 貝が一度も関わってないのが、模造なのだ。
  - speaker: zundamon
    emotion: thinking
    text: パリの裁判で、天然と同じだと認められたのだ？
  - speaker: tsumugi
    emotion: thinking
    text: よくそう言われるけど、判決は、科学的に同じかどうかは研究を待つ、としてるの。
  - speaker: tsumugi
    emotion: normal
    text: そのうえで、偽物と呼んで回るのは許されない、と読める判決だったと言われてるわ。
  - speaker: zundamon
    emotion: normal
    text: 同じとは言ってないけど、偽物とも言わせなかったのだ。
  - speaker: tsumugi
    emotion: normal
    text: そういうこと。アコヤの養殖真珠は、中に核が入ってるのが、天然との違いね。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、真珠は酢で溶けるって話は？ クレオパトラが、酢に溶かして飲んだって。
  - speaker: tsumugi
    emotion: thinking
    text: 酸に弱いのは本当。でも、酢に入れてすぐ溶けるわけじゃないの。
  - speaker: tsumugi
    emotion: normal
    text: 酢につけて、溶けるまで丸1日以上かかった実験があるわ。
  - speaker: tsumugi
    emotion: thinking
    text: その場で溶かして飲んだ、というのは話を盛りすぎね。
  - speaker: zundamon
    emotion: happy
    text: なら、真珠は丈夫なのだ。
  - speaker: tsumugi
    emotion: angry
    text: そこが油断よ。本当に気をつけたいのは、毎日の汗や化粧品なの。
  - speaker: tsumugi
    emotion: normal
    text: 使ったら、柔らかい乾いた布で拭く。香水や整髪料は、つけてから真珠を着ける。
  - speaker: tsumugi
    emotion: normal
    text: 酢やレモンの汁、除光液もだめ。家の超音波の洗浄機にも入れないで。
  - speaker: zundamon
    emotion: sad
    text: 貝が1年ほどかけて巻いた層が、毎日少しずつ傷むのだ。
  - speaker: tsumugi
    emotion: normal
    text: 真珠の層は、1ミリもない薄さ。削れたら、戻らないのよ。
- id: ch14_gendai
  title: 今の真珠の海
  background: mk_hama
  bgm: amacha_milkyway
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 日本のアコヤ真珠は、2024年でおよそ12.5トン。
  - speaker: tsumugi
    emotion: normal
    text: 一番多いのは長崎県、次が愛媛県、そして[三重県|みえけん]よ。
  - speaker: zundamon
    emotion: surprised
    text: 御木本さんの[三重県|みえけん]が、3番目なのだ？
  - speaker: tsumugi
    emotion: normal
    text: 一番多かったのは1967年で、125トン。今の10倍よ。
  - speaker: zundamon
    emotion: surprised
    text: 10分の1になったのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 1990年代には、[アコヤ貝|あこやがい]が大量に死ぬ病気が広がったの。
  - speaker: tsumugi
    emotion: normal
    text: 1995年に63トンあった生産が、1999年には25トンまで落ちたわ。
  - speaker: zundamon
    emotion: sad
    text: 4年で、半分以下なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 真珠を育てる家も、30年で4分の1ほどに減ったの。
  - speaker: tsumugi
    emotion: thinking
    text: 2019年からも、また貝が大量に死んでいるの。
  - speaker: tsumugi
    emotion: normal
    text: 2022年に、新しいウイルスが原因だと分かったわ。
  - speaker: zundamon
    emotion: sad
    text: 赤潮のあとも、貝の戦いは続いてるのだ。
  - speaker: tsumugi
    emotion: normal
    text: 輸出は2025年で、412億円ほど。
  - speaker: tsumugi
    emotion: normal
    text: 多くが香港に渡って、そこから世界の市場に出ていくの。
  - speaker: zundamon
    emotion: thinking
    text: 世界の真珠は、今も日本が一番なのだ？
  - speaker: tsumugi
    emotion: normal
    text: 今は、タヒチの黒い真珠や、南の海の大きな白い真珠、中国の川の真珠もあるわ。
  - speaker: tsumugi
    emotion: normal
    text: それでも、アコヤの真珠は、大半が日本で作られてるの。
  - speaker: zundamon
    emotion: thinking
    text: 真珠の重さって、グラムで量るのだ？
  - speaker: tsumugi
    emotion: happy
    text: 世界の取り引きでは、今も匁が使われてるの。1匁は3.75グラムよ。
  - speaker: zundamon
    emotion: surprised
    text: 日本の昔の単位が、世界の単位なのだ！
  - speaker: tsumugi
    emotion: normal
    text: 日本の真珠は、1800年ほど前の中国の歴史書にも出てくるの。
  - speaker: tsumugi
    emotion: normal
    text: 倭の国から、真珠を5000個贈った、という記録よ。
  - speaker: zundamon
    emotion: happy
    text: 昔から、真珠の国だったのだ。
  - speaker: zundamon
    emotion: happy
    text: 鳥羽の[真珠島|しんじゅしま]では、今も海女さんが潜ってるのだ。
  - speaker: tsumugi
    emotion: happy
    text: そう。貝を採り、貝を運んで守ったと伝わる人たちの仕事を、見せてくれるのよ。
- id: shime
  title: ''
  background: mk_ima
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: つむぎ。アサリを買い直してきたのだ。今度は、お味噌汁にするのだ。
  - speaker: tsumugi
    emotion: happy
    text: それが一番よ。
  - speaker: zundamon
    emotion: happy
    text: 真珠は、[アコヤ貝|あこやがい]に任せるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: で、ハマグリ計画は？
  - speaker: zundamon
    emotion: surprised
    text: ……ベランダで、砂利と一緒に待機中なのだ。
  - speaker: tsumugi
    emotion: angry
    text: 今すぐ片付けなさい。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: 今度、真珠を見かけたら、あの光を近くで見てみて。
  - speaker: tsumugi
    emotion: normal
    text: 1ミリに2000枚もの層が、光を重ねてるのよ。
  - speaker: zundamon
    emotion: normal
    text: 貝が何か月もかけて、1枚ずつ巻いた光なのだ。
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
