meta:
  title: 【養殖真珠の誕生】うどん屋の息子が、貝に真珠を作らせるまで【ずんだもん解説】
  slug: mikimoto-pearl
  summary: 真珠は昔、海に潜って開けた貝の中から、たまたま見つかる宝石でした。それを、貝に作らせる仕事に変えた男がいます。鳥羽のうどん屋に生まれ、野菜の行商から身を起こした男が、なぜ真珠に賭けたのか。赤潮で貝が全滅しても、海外で偽物と呼ばれても、やめなかった理由。真珠が光る仕組みと、今の真珠の海も。
  tags:
  - 真珠
  - 御木本幸吉
  - 養殖真珠
  - アコヤ貝
  - ミキモト
  - 鳥羽
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  thumbnail:
    top: 貝に作らせた
    bottom: 養殖真珠の誕生
  mode: drama
  narrator: reimu
  mobs:
