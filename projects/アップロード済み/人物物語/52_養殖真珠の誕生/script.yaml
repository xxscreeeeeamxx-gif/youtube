  - speaker: reimu
    text: 1954年9月、御木本幸吉は、多徳島の自宅で96歳の生涯を閉じました。
    reading: せんきゅうひゃく ごじゅうよねん くがつ、みきもと こうきちわ たとくじまの じたくで きゅうじゅうろくさいの しょうがいお とじました。
