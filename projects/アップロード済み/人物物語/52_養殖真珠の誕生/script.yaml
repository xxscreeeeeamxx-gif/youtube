scenes:
- id: hook
  title: ''
  background: mk_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、見るのだ。アサリを、10個も買ってきたぞ。
  - speaker: tsumugi
    emotion: normal
    text: 今夜はお味噌汁ね。
  - speaker: zundamon
    emotion: happy
    text: 違うぞ。この中に、砂を1粒ずつ入れていくのだ。
  - speaker: tsumugi
    emotion: surprised
    text: 砂抜きしたアサリに、わざわざ砂を？
  - speaker: zundamon
    emotion: happy
    text: 貝は、中に入った砂を包んで、真珠にするのだ。1か月後には、真珠が10個なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: その話、どこで聞いたの？
  - speaker: zundamon
    emotion: normal
    text: みんな言ってるぞ。アサリで作る、家庭の真珠工場なのだ。
  - speaker: zundamon
    emotion: sad
    text: ……1か月後。全部、口を開けて動かない。
  - speaker: tsumugi
    emotion: normal
    text: アサリは、水から出したら長くはもたないわ。
  - speaker: zundamon
    emotion: thinking
    text: 次は、もっと大きいハマグリに、砂利を入れる。
  - speaker: tsumugi
    emotion: angry
    text: 大きくすれば解決、じゃないのよ。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: 真珠を作るのは、貝の中の、ある細胞なの。
  - speaker: tsumugi
    emotion: normal
    text: 今のお店に並ぶ真珠は、ほとんどが人の手で貝に手術をして作らせたものよ。
  - speaker: zundamon
    emotion: surprised
    text: 貝に、手術なのだ！？
    se: don
  - speaker: reimu
    text: 真珠。昔は、海に潜って貝を開け、たまたま見つかるのを待つしかない宝石でした。
    reading: しんじゅ。むかしわ うみに もぐって かいお あけ、たまたま みつかるのお まつしか ない ほうせきでした。
  - speaker: reimu
    text: それを、貝に作らせる仕事に変えたのは、鳥羽のうどん屋に生まれた、御木本幸吉という男でした。
    reading: それお かいに つくらせる しごとに かえたのわ、とばの うどんやに うまれた みきもと こうきちという おとこでした。
  - speaker: zundamon
    emotion: surprised
    text: うどん屋さんが、真珠なのだ？
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、野菜の行商と、港に来た外国の船よ。
- id: card1858
  title: ''
  background: mk_card_1858
  cuts:
  - speaker: reimu
    text: 1858年。志摩の鳥羽で、うどん屋の長男に生まれます。
    reading: せんはっぴゃく ごじゅうはちねん。しまの とばで うどんやの ちょうなんに うまれます。
- id: ch1_udon
  title: 足で回す傘
  background: mk_udonya
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 御木本幸吉, scale: 0.8, emotion: normal}
  - {who: chichi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 家は、阿波幸という名のうどん屋でした。
    reading: いえわ あわこうという なの うどんやでした。
  - speaker: reimu
    text: 幼い名は、吉松といいました。
    reading: おさない なわ きちまつと いいました。
  - speaker: reimu
    text: 学校には、ほとんど通わなかったといいます。
    reading: がっこうにわ ほとんど かよわなかったと いいます。
  - speaker: chichi
    emotion: normal
    text: '[吉松|きちまつ]。店の手伝いが済んだら、今日は何をする。'
  - speaker: zundamon
    emotion: happy
    text: 野菜を、売り歩いてくる。
  - speaker: chichi
    emotion: surprised
    text: うどん屋の息子が、青物の行商か。
  - speaker: zundamon
    emotion: normal
    text: うどんは、店に来た人にしか売れないのだ。野菜なら、こっちから売りに行ける。
  - speaker: chichi
    emotion: happy
    text: 商いの才は、じいさんに似たな。
  - speaker: reimu
    text: 1871年ごろから、家業のかたわら、青物の行商を始めたとされています。
    reading: せんはっぴゃく ななじゅういちねん ごろから、かぎょうの かたわら あおものの ぎょうしょうお はじめたと されています。
- id: ch1_fune
  title: ''
  background: mk_minato
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 御木本幸吉, scale: 0.85, emotion: happy}
  - {who: suihei, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1875年、鳥羽の港にイギリスの船が入ります。
    reading: せんはっぴゃく ななじゅうごねん とばの みなとに いぎりすの ふねが はいります。
  - speaker: zundamon
    emotion: happy
    text: 卵と野菜なのだ。取れたてだぞ。
  - speaker: suihei
    emotion: normal
    text: ノー、サンキュー。
  - speaker: zundamon
    emotion: thinking
    text: 断られたのだ……。
  - speaker: zundamon
    emotion: happy
    text: なら、見せるのだ。
  - speaker: reimu
    text: 吉松は水兵たちの前で仰向けに寝ころび、足で蛇の目傘をくるくると回してみせました。
    reading: きちまつわ すいへいたちの まえで あおむけに ねころび、あしで じゃのめがさお くるくると まわして みせました。
  - speaker: suihei
    emotion: surprised
    text: ワオ！ ワンダフル！
  - speaker: zundamon
    emotion: happy
    text: 人が集まってきた。今のうちに、卵なのだ。
  - speaker: suihei
    emotion: happy
    text: ハウマッチ？
  - speaker: zundamon
    emotion: happy
    text: 全部、買ってくれたのだ！
  - speaker: reimu
    text: 足の芸で人を集め、船に卵や野菜を売り込んだと伝えられています。
    reading: あしの げいで ひとお あつめ、ふねに たまごや やさいお うりこんだと つたえられています。
- id: card1878
  title: ''
  background: mk_card_1878
  cuts:
  - speaker: reimu
    text: 1878年。家を継ぎ、名を幸吉と改めます。
    reading: せんはっぴゃく ななじゅうはちねん。いえお つぎ なお こうきちと あらためます。
- id: ch2_yokohama
  title: 志摩の海は宝の山
  background: mk_yokohama
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 御木本幸吉, emotion: normal}
  - {who: shounin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 家を継いだその年、幸吉は東京と横浜を見て回ります。
    reading: いえお ついだ その とし こうきちわ とうきょうと よこはまお みて まわります。
  - speaker: shounin
    emotion: normal
    text: お前さん、志摩から来たのか。あそこの海の物は、よく売れるよ。
  - speaker: zundamon
    emotion: surprised
    text: 志摩の海の物が、売れるのだ？
  - speaker: shounin
    emotion: happy
    text: 干しアワビに、ナマコ。[清国|しんこく]へ持っていけば、いい値がつく。
  - speaker: zundamon
    emotion: thinking
    text: 志摩には、真珠もあるのだ。
  - speaker: shounin
    emotion: happy
    text: なら、志摩の海は宝の山だな。
  - speaker: zundamon
    emotion: thinking
    text: 取れば、減る。当たり前なのだ。
  - speaker: reimu
    text: 天然の真珠は高値で取り引きされ、真珠を生むアコヤ貝は取り尽くされかけていました。
    reading: てんねんの しんじゅわ たかねで とりひき され、しんじゅお うむ あこやがいわ とりつくされかけていました。
  - speaker: reimu
    text: 翌年には大阪や神戸も見て回り、真珠など志摩の海の物が外国へ売れると確信したとされています。
    reading: よくねんにわ おおさかや こうべも みて まわり、しんじゅなど しまの うみの ものが がいこくえ うれると かくしんしたと されています。
- id: ch2_ume
  title: ''
  background: mk_ie
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 御木本幸吉, emotion: normal}
  - {who: ume, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1881年、元鳥羽藩士の娘、17歳のうめと結婚します。
    reading: せんはっぴゃく はちじゅういちねん もと とばはんしの むすめ じゅうななさいの うめと けっこんします。
  - speaker: ume
    emotion: normal
    text: 旦那さま。また、海の物の帳面をつけてらっしゃるの。
  - speaker: zundamon
    emotion: normal
    text: 横浜で聞いてきたのだ。海の物は、海の外で売れる。
  - speaker: ume
    emotion: thinking
    text: うどん屋は、どうなさるの。
  - speaker: zundamon
    emotion: happy
    text: うどんも続ける。でも、海のほうが大きいぞ。
  - speaker: ume
    emotion: happy
    text: 大きな話ほど、楽しそうになさるのね。
- id: card1888
  title: ''
  background: mk_card_1888
  cuts:
  - speaker: reimu
    text: 1888年。東京の水産品評会に志摩の海産物を出します。
    reading: せんはっぴゃく はちじゅうはちねん。とうきょうの すいさん ひんぴょうかいに しまの かいさんぶつお だします。
- id: ch3_yanagi
  title: 貝を育てる
  background: mk_hinpyoukai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 御木本幸吉, emotion: normal}
  - {who: yanagi, x: 0.7, emotion: normal}
  cuts:
  - speaker: yanagi
    emotion: normal
    text: 御木本くん。2等とは、立派なものだ。
  - speaker: zundamon
    emotion: normal
    text: 先生。真珠の貝が、年々減っているのだ。このままでは、志摩の海から消えてしまう。
  - speaker: yanagi
    emotion: thinking
    text: 取るばかりでは、いずれそうなる。
  - speaker: zundamon
    emotion: thinking
    text: どうすればいいのだ。
  - speaker: yanagi
    emotion: normal
    text: 増やせばいい。貝を、育てるのだよ。
  - speaker: zundamon
    emotion: surprised
    text: 貝を、育てる……？
  - speaker: yanagi
    emotion: happy
    text: 畑で作物を育てるように、海で貝を育てる。これからは、そういう時代だ。
  - speaker: zundamon
    emotion: thinking
    text: 海の中に、畑を作るのだ。
  - speaker: yanagi
    emotion: normal
    text: 貝が増えれば、海女も困らん。真珠も、また取れるようになる。
  - speaker: zundamon
    emotion: happy
    text: なら、まず育ててみるぞ。
  - speaker: reimu
    text: 大日本水産会の柳楢悦に勧められ、幸吉はこの年、アコヤ貝を海で育て始めます。
    reading: だいにほん すいさんかいの やなぎ ならよしに すすめられ、こうきちわ この とし あこやがいお うみで そだてはじめます。
- id: ch3_mitsukuri
  title: ''
  background: mk_rinkai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 御木本幸吉, emotion: thinking}
  - {who: mitsukuri, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1890年には、東京帝国大学の箕作佳吉を、海辺の実験所に訪ねます。
    reading: せんはっぴゃく きゅうじゅうねんにわ、とうきょう ていこく だいがくの みつくり かきちお うみべの じっけんじょに たずねます。
  - speaker: zundamon
    emotion: thinking
    text: 先生。貝を育てるだけじゃなく、真珠も作らせたいのだ。
  - speaker: mitsukuri
    emotion: thinking
    text: 真珠を、人の手で作らせる、ですか。
  - speaker: zundamon
    emotion: normal
    text: できるのか、できないのか、教えてほしい。
  - speaker: mitsukuri
    emotion: normal
    text: 学問の理屈の上では、できるはずです。
  - speaker: zundamon
    emotion: happy
    text: できるのだ！
  - speaker: mitsukuri
    emotion: thinking
    text: ただ、理屈どおりにいくかは、やってみないと分かりません。
  - speaker: zundamon
    emotion: normal
    text: なら、やってみるのだ。
- id: ch4_ama
  title: 海女と貝
  background: mk_ikada
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 御木本幸吉, emotion: happy}
  - {who: ama, x: 0.7, emotion: surprised}
  cuts:
  - speaker: ama
    emotion: surprised
    text: 旦那、また貝を買うのかい。真珠の入ってない貝だよ。
  - speaker: zundamon
    emotion: happy
    text: 入ってない貝がいいんだ。こっちで、入れるのだ。
  - speaker: ama
    emotion: thinking
    text: 入れるって、何を。
  - speaker: zundamon
    emotion: normal
    text: 貝の中に、小さな玉を入れるのだ。貝が、それを包んでくれるはずなのだ。
  - speaker: ama
    emotion: happy
    text: はずって、やってみないと分からんのかい。
  - speaker: zundamon
    emotion: normal
    text: だから、やってみる。入れたら、海に戻してほしいのだ。
  - speaker: reimu
    text: 海女から貝を買い、囲いの中で育て、幸吉自身も海に入って貝の世話をしたといいます。
    reading: あまから かいお かい かこいの なかで そだて、こうきち じしんも うみに はいって かいの せわお したと いいます。
  - speaker: reimu
    text: 実験は、英虞湾の神明浦と、鳥羽の相島の2か所で進められました。
    reading: じっけんわ あごわんの しんめいうらと、とばの おじまの にかしょで すすめられました。
- id: ch4_shippai
  title: ''
  background: mk_ie
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 御木本幸吉, emotion: sad}
  - {who: ume, x: 0.7, emotion: thinking}
  cuts:
  - speaker: ume
    emotion: thinking
    text: 旦那さま。今日開けた貝は、どうでした。
  - speaker: zundamon
    emotion: sad
    text: ……今日も、1粒も入ってないのだ。
  - speaker: ume
    emotion: normal
    text: 入れた玉は、どうなっていたの。
  - speaker: zundamon
    emotion: thinking
    text: 貝が吐き出したり、玉を入れた貝が弱って死んだりするのだ。
  - speaker: ume
    emotion: thinking
    text: 今日は、もう休んで。貝は、明日また開ければいいわ。
  - speaker: zundamon
    emotion: normal
    text: 全部、帳面につけて、少しずつ変えていくしかない。
  - speaker: reimu
    text: 核にする小さな玉は、四日市の焼き物の職人の力も借りて作ったとされています。
    reading: かくに する ちいさな たまわ、よっかいちの やきものの しょくにんの ちからも かりて つくったと されています。
- id: card1892
  title: ''
  background: mk_card_1892
  cuts:
  - speaker: reimu
    text: 1892年。英虞湾に、赤潮が広がります。
    reading: せんはっぴゃく きゅうじゅうにねん。あごわんに あかしおが ひろがります。
- id: ch5_akashio
  title: 赤い海
  background: mk_akashio
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 御木本幸吉, emotion: sad}
  - {who: ama, x: 0.7, emotion: sad}
  cuts:
  - speaker: ama
    emotion: sad
    text: 旦那……。海が、赤い。
  - speaker: zundamon
    emotion: surprised
    text: 貝は、どうなってるのだ！
  - speaker: ama
    emotion: sad
    text: '[囲い|かこい]の貝、みんな[口|くち]を開けて死んでるよ。'
  - speaker: zundamon
    emotion: sad
    text: ……何年もかけて育てた貝が、一晩で。
  - speaker: ama
    emotion: thinking
    text: 赤潮が来たら、どうにもならん。
  - speaker: zundamon
    emotion: thinking
    text: '[相島|おじま]の貝は、どうなんだ。'
  - speaker: ama
    emotion: normal
    text: あっちの海は、赤くなってないって聞いたよ。
  - speaker: zundamon
    emotion: normal
    text: ……まだ、全部は終わってないのだ。
  - speaker: reimu
    text: 英虞湾の貝はほぼ全滅しましたが、相島の貝は赤潮を免れていました。
    reading: あごわんの かいわ ほぼ ぜんめつしましたが、おじまの かいわ あかしおお まぬがれていました。
- id: card1893
  title: ''
  background: mk_card_1893
  cuts:
  - speaker: reimu
    text: 1893年7月。相島の貝の中から、半円の真珠が見つかります。
    reading: せんはっぴゃく きゅうじゅうさんねん しちがつ。おじまの かいの なかから はんえんの しんじゅが みつかります。
- id: ch6_hanen
  title: 半分の真珠
  background: mk_ikada
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 見つかった真珠は5個。どれも貝殻にくっついた、半分だけ丸い形でした。
    reading: みつかった しんじゅわ ごこ。どれも かいがらに くっついた はんぶんだけ まるい かたちでした。
    telops:
    - {text: "実験で初めて取れた5個", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: つむぎ。半分だけ丸いって、どういう真珠なのだ？
  - speaker: tsumugi
    emotion: normal
    text: 入れた玉が、貝殻の内側に当たったまま包まれたの。半円真珠っていうのよ。
  - speaker: zundamon
    emotion: thinking
    text: 貝殻にくっついてるから、丸くならなかったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 片側は貝殻、片側は真珠。削り取って、裏を加工して使うの。
  - speaker: zundamon
    emotion: happy
    text: 半分でも、貝が作った真珠なのだ。
  - speaker: reimu
    text: 1896年、この半円真珠の作り方で特許が認められます。
    reading: せんはっぴゃく きゅうじゅうろくねん この はんえん しんじゅの つくりかたで とっきょが みとめられます。
  - speaker: zundamon
    emotion: happy
    text: 次は、どこにもくっつかない、まん丸の真珠が目標なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: ここから、まん丸になるまでが、また長いのよ。
