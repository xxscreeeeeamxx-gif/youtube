- id: ch11_bannen
  title: ''
  background: mk_ikada
  bgm: amacha_hoshizora
  cuts:
  - speaker: reimu
    text: 1940年、ぜいたく品を禁じる決まりで、養殖場は閉鎖や縮小に追い込まれます。
