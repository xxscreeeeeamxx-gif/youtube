  - speaker: ama
    emotion: surprised
    text: 旦那、この寒さでかい。1月の海だよ。
  - speaker: zundamon
    emotion: normal
    text: 分かってる。だから、[日当|にっとう]は5割増しにするのだ。
  - speaker: ama
    emotion: thinking
