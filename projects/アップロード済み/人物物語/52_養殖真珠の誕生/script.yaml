    reading: えいごの できない こうきちと みみの とおい えじそん。ことばわ つうやくお とおしての やりとりでした。
  - speaker: reimu
    text: エジソンの言葉は、ミキモトの記録にも残っています。
    reading: えじそんの ことばわ みきもとの きろくにも のこっています。
