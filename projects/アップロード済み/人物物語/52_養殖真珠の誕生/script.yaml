    text: 1906年には、店を銀座4丁目の表通りへ移します。
    reading: せんきゅうひゃく ろくねんにわ みせお ぎんざ よんちょうめの おもてどおりえ うつします。
  - speaker: reimu
    text: 1907年には、真珠を宝飾品に仕立てる金細工の工場も作りました。
    reading: せんきゅうひゃく ななねんにわ、しんじゅお ほうしょくひんに したてる きんざいくの こうじょうも つくりました。
- id: ch9_hatsumei
  title: 誰が作ったのか
  background: mk_shiryo
  bgm: curious
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: つむぎ。まん丸の真珠は、御木本さんが作り方を見つけたのだ？
  - speaker: tsumugi
    emotion: thinking
    text: そこは、今も意見が分かれてるの。
  - speaker: zundamon
    emotion: surprised
    text: 分かれてるのだ？
  - speaker: tsumugi
    emotion: normal
    text: 1907年ごろ、まん丸の真珠を作る方法で、3人がそれぞれ特許を出してるの。
  - speaker: tsumugi
    emotion: normal
    text: 御木本さんと、娘の夫で水産の技師だった西川藤吉、それに[見瀬|みせ][辰平|たつへい]という人よ。
  - speaker: zundamon
    emotion: thinking
    text: 3人で、同じものを目指してたのだ。
  - speaker: tsumugi
    emotion: normal
    text: 西川は、貝の体の一部を核と一緒に入れるやり方。[見瀬|みせ]は、核を入れる細い針を工夫したの。
  - speaker: tsumugi
    emotion: thinking
    text: 西川と[見瀬|みせ]の間では、特許をめぐる争いもあって、1908年に和解したとされるわ。
  - speaker: tsumugi
    emotion: normal
    text: 御木本さんも、1908年に自分のやり方で特許を取ってるわ。
  - speaker: tsumugi
    emotion: thinking
    text: 西川は、1909年に35歳で亡くなってる。
  - speaker: zundamon
    emotion: sad
    text: 若いのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 御木本さんは、1919年にも別の方法で特許を取ってるの。
  - speaker: tsumugi
    emotion: normal
    text: 今の業界は、1907年を、まん丸の真珠が生まれた年としてるの。
  - speaker: tsumugi
    emotion: normal
    text: 英虞湾の賢島には、3人の名前を刻んだ記念碑もあるわ。
  - speaker: zundamon
    emotion: normal
    text: 1人の手柄じゃなくて、3人の名前なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 御木本さんが大きかったのは、それを産業にして、世界で売ったことね。
- id: ch10_london
  title: 偽物と呼ばれて
  background: mk_mise
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 御木本幸吉, emotion: normal}
  - {who: tenin, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
    text: 1913年にはロンドンに店を出し、1919年には、まん丸の真珠を天然より安く売り出したとされます。
    reading: せんきゅうひゃく じゅうさんねんにわ ろんどんに みせお だし、せんきゅうひゃく じゅうくねんにわ まんまるの しんじゅお てんねんより やすく うりだしたと されます。
  - speaker: reimu
    text: 1921年、ロンドンで騒ぎが起きます。
    reading: せんきゅうひゃく にじゅういちねん ろんどんで さわぎが おきます。
  - speaker: tenin
    emotion: sad
    text: 社長。ロンドンの新聞が、うちの真珠を詐欺の真珠だと書いたそうです。
  - speaker: zundamon
    emotion: surprised
    text: 詐欺……？
  - speaker: tenin
    emotion: sad
    text: パリの宝石商たちも、日本の真珠は偽物だと言い出しました。
  - speaker: zundamon
    emotion: angry
    text: 偽物じゃない。貝が、自分の体で巻いた真珠なのだ。
  - speaker: tenin
    emotion: thinking
    text: 天然の真珠が売れなくなるのを、恐れているんでしょう。
  - speaker: zundamon
    emotion: normal
    text: なら、学者に調べてもらうのだ。中身を見れば、分かる。
  - speaker: reimu
    text: 学者たちは、天然と養殖の真珠層に本質的な違いはないと証言します。
    reading: がくしゃたちわ、てんねんと ようしょくの しんじゅそうに ほんしつてきな ちがいわ ないと しょうげんします。
  - speaker: reimu
    text: パリの代理店が、偽物と言いふらした宝石商の組合を訴え、裁判になりました。
    reading: ぱりの だいりてんが、にせものと いいふらした ほうせきしょうの くみあいお うったえ さいばんに なりました。
  - speaker: reimu
    text: 1924年、裁判は組合側の負けで終わり、組合は判決を新聞に載せる費用まで払わされました。
    reading: せんきゅうひゃく にじゅうよねん さいばんわ くみあいがわの まけで おわり、くみあいわ はんけつお しんぶんに のせる ひようまで はらわされました。
    telops:
    - {text: "宝石商の組合が敗訴", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
- id: ch10_banpaku
  title: ''
  background: mk_mise
  bgm: pop
