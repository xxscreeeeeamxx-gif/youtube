  - {who: edison, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1927年、アメリカで発明王エジソンに会います。渋沢栄一の紹介状を持っていました。
    reading: せんきゅうひゃく にじゅうななねん あめりかで はつめいおう えじそんに あいます。しぶさわ えいいちの しょうかいじょうお もっていました。
