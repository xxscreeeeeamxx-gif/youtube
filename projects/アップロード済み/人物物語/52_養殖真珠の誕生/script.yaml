- id: ch8_haietsu
  title: ''
  background: mk_mise
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 同じ1905年、伊勢神宮を訪れた明治天皇に拝謁した幸吉は、こう言ったと伝えられています。
    reading: おなじ せんきゅうひゃく ごねん いせじんぐうお おとずれた めいじ てんのうに はいえつした こうきちわ、こう いったと つたえられています。
  - speaker: reimu
    text: 世界中の女性の首を、真珠でしめてごらんにいれます。
