scenes:
- id: co_isawa
  title: ''
  background: yh_torishirabe
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 山葉寅楠, emotion: thinking}
  - {who: isawa, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1887年。東京・上野の音楽取調所に、浜松の男が手作りのオルガンを持ち込みます。
    reading: せんはっぴゃく はちじゅうななねん。とうきょう うえのの おんがく とりしらべじょに、はままつの おとこが てづくりの おるがんお もちこみます。
  - speaker: isawa
    emotion: normal
    text: どれ、弾いてみよう。
  - speaker: isawa
    emotion: thinking
    text: ……形は、いい。
  - speaker: zundamon
    emotion: happy
    text: ありがとうございます！
  - speaker: isawa
    emotion: normal
    text: だが、調律が不正確で使用にはたえない。
    se: don
  - speaker: zundamon
    emotion: sad
    text: ……使用には、たえない。
  - speaker: reimu
    text: この男は、山葉寅楠。ヤマハという名前は、この人の名字です。
    reading: この おとこわ やまは とらくす。やまはと いう なまえわ、この ひとの みょうじです。
  - speaker: reimu
    text: 使えないと言われたオルガンの会社は今、1年に4653億円を売り上げます。
    reading: つかえないと いわれた おるがんの かいしゃわ いま、いちねんに よんせん ろっぴゃく ごじゅうさんおくえんお うりあげます。
- id: hook
  title: ''
  background: yh_ongakushitsu
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。音楽室のピアノ、耳だけで調律したのだ！
  - speaker: tsumugi
    emotion: thinking
    text: ドがレになってるわ。調律が不正確で、使用にはたえないわね。
    beat: true
  - speaker: zundamon
    emotion: sad
    text: さっきの人と、同じことを言われたのだ。
  - speaker: tsumugi
    emotion: normal
    text: あっちは、そこから学び直したけどね。
  - speaker: zundamon
    emotion: surprised
    text: ダメ出しされた人が、どうして今のヤマハに？
    telops:
    - {text: 酷評のオルガンから年4653億円, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、機械いじりが好きな少年よ。
- id: card1851
  title: ''
  background: yh_card_1851
  cuts:
  - speaker: reimu
    text: 1851年。紀州藩の天文係の家に、山葉寅楠が生まれます。
    reading: せんはっぴゃく ごじゅういちねん。きしゅうはんの てんもんがかりの いえに、やまは とらくすが うまれます。
- id: ch1_kishu
  title: 天文係の家の少年
  background: yh_kishu
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 山葉寅楠, scale: 0.85, emotion: happy}
  - {who: chichi, x: 0.7, emotion: normal}
  cuts:
  - speaker: chichi
    emotion: normal
    text: '[寅楠|とらくす]。わしの測量の道具を、また広げておるな。'
  - speaker: zundamon
    emotion: happy
    text: 父上。この目盛りは、どうやって刻んだのですか！
  - speaker: chichi
    emotion: thinking
    text: それより、そこのからくり人形の首はどうした。
  - speaker: zundamon
    emotion: happy
    text: 中が見たくて、外しました。
  - speaker: chichi
    emotion: angry
    text: 外したのなら、元に戻せ。
  - speaker: zundamon
    emotion: thinking
    text: ……戻したら、首が後ろを向きました。
  - speaker: chichi
    emotion: surprised
    text: 人形が、振り返っておるではないか！
    se: zukko
  - speaker: chichi
    emotion: normal
    text: 仕組みが分かるまで、二度と外すでないぞ。
  - speaker: zundamon
    emotion: happy
    text: 分かるためなら、外してもいいのですね！
  - speaker: chichi
    emotion: thinking
    text: ……そうは、言っておらん。
    beat: true
  - speaker: reimu
    text: 父は天文係のほかに、地図作りや橋の工事も手がけた技師でした。
    reading: ちちわ てんもんがかりの ほかに、ちずづくりや はしの こうじも てがけた ぎしでした。
  - speaker: reimu
    text: 家には天体観測や測量の本と器具があふれ、寅楠は機械いじりを遊び代わりに育ちます。
    reading: いえにわ てんたいかんそくや そくりょうの ほんと きぐが あふれ、とらくすわ きかいいじりお あそびがわりに そだちます。
- id: ch1_nagasaki
  title: 長崎で時計を学ぶ
  background: yh_nagasaki
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 山葉寅楠, emotion: normal}
  - {who: tokeishi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 明治の初め。寅楠は長崎で、イギリス人から時計の直し方と作り方を学びます。
    reading: めいじの はじめ。とらくすわ ながさきで、いぎりすじんから とけいの なおしかたと つくりかたお まなびます。
  - speaker: tokeishi
    emotion: normal
    text: '[山葉|やまハ]さん。このネジは、米粒より小さいです。息を止めて。'
  - speaker: zundamon
    emotion: thinking
    text: 息を、止めて……。
  - speaker: tokeishi
    emotion: normal
    text: まだです。まだ止めて。
  - speaker: zundamon
    emotion: surprised
    text: ぷはっ！ ……ネジが、どこかへ飛んでいった。
  - speaker: tokeishi
    emotion: thinking
    text: 時計より先に、肺をきたえましょう。
    beat: true
  - speaker: zundamon
    emotion: happy
    text: でも先生。歯車が噛み合って回るのは、何度見ても飽きません。
  - speaker: tokeishi
    emotion: happy
    text: その顔なら、きっといい時計屋になります。
- id: ch1_osaka
  title: 医療器械の修理工
  background: yh_osaka
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 山葉寅楠, emotion: normal}
  - {who: kawachiya, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: その後寅楠は、大阪の医療器械の店に住み込んで修理工になります。
    reading: そのご とらくすわ、おおさかの いりょうきかいの みせに すみこんで しゅうりこうに なります。
  - speaker: kawachiya
    emotion: normal
    text: '[山葉|やまハ]はん。浜松の病院の器械、見てきてくれへんか。'
  - speaker: zundamon
    emotion: surprised
    text: 浜松ですか。東海道を、どのくらい歩くんです？
  - speaker: kawachiya
    emotion: happy
    text: 時計の直せる男や。歩き方も、正確やろ。
  - speaker: zundamon
    emotion: thinking
    text: 歩き方と時計は、関係ないのです……。
    se: zukko
- id: ch2_byoin
  title: 浜松病院の院長
  background: yh_byoin
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 山葉寅楠, emotion: normal}
  - {who: fukushima, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 寅楠は浜松に住み、医療器械を直して回ります。浜松病院の院長は、福島豊策でした。
    reading: とらくすわ はままつに すみ、いりょうきかいお なおして まわります。はままつ びょういんの いんちょうわ、ふくしま ほうさくでした。
  - speaker: fukushima
    emotion: happy
    text: '[山葉|やまハ]くん。この器械は、もう動かんと思っておったよ。'
  - speaker: zundamon
    emotion: happy
    text: バネを一つ、替えただけです。院長先生。
  - speaker: fukushima
    emotion: normal
    text: ところで、宿はどこだね。
  - speaker: zundamon
    emotion: normal
    text: '[板屋町|いたやまち]の清水屋です。[六畳間|ろくじょうま]で、時計の修理もしてます。'
  - speaker: fukushima
    emotion: surprised
    text: 病院の器械に、時計の修理まで？
  - speaker: zundamon
    emotion: sad
    text: 器械の修理だけでは、食べていけないのです。
  - speaker: fukushima
    emotion: thinking
    text: 腕のいい男が、[六畳間|ろくじょうま]で時計を直しておるのか……。
  - speaker: fukushima
    emotion: happy
    text: 困ったことがあったら、いつでも来なさい。
- id: card1887
  title: ''
  background: yh_card_1887
  cuts:
  - speaker: reimu
    text: 1887年。浜松の小学校で、アメリカ製のオルガンが鳴らなくなります。
    reading: せんはっぴゃく はちじゅうななねん。はままつの しょうがっこうで、あめりかせいの おるがんが ならなく なります。
- id: ch3_gakko
  title: 鳴らないオルガン
  background: yh_gakko
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 山葉寅楠, emotion: normal}
  - {who: kocho, x: 0.7, emotion: normal}
  cuts:
  - speaker: kocho
    emotion: normal
    text: 福島院長のご紹介の、[山葉|やまハ]さんですな。こちらへ。
  - speaker: zundamon
    emotion: surprised
    text: 教室に、鍵がかかってるんですか。
  - speaker: kocho
    emotion: happy
    text: アメリカから来たオルガンです。見るのにも、許可証が要ります。
  - speaker: zundamon
    emotion: surprised
    text: 見るだけで、許可証……！
  - speaker: kocho
    emotion: thinking
    text: なにしろ45円。新米の先生の給料の、9か月分です。
    telops:
    - {text: 45円＝新米の先生の給料9か月分, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: それが、鳴らなくなったと。
  - speaker: kocho
    emotion: sad
    text: 唱歌の時間が、ずっとお休みでして。
  - speaker: zundamon
    emotion: normal
    text: 開けて、中を見てもいいですか。
  - speaker: kocho
    emotion: surprised
    text: 45円を、開けるんですか！？
  - speaker: zundamon
    emotion: happy
    text: 開けてみないと、どこが悪いか分かりません。
  - speaker: kocho
    emotion: surprised
    text: 部品が……机いっぱいに！
    background: yh_gakko_bunkai
  - speaker: zundamon
    emotion: surprised
    text: ……悪いのは、折れたバネが2本だけです。
  - speaker: kocho
    emotion: surprised
    text: 2本！？ 45円のオルガンが、バネ2本で黙ってたんですか。
  - speaker: zundamon
    emotion: happy
    text: バネを替えれば、また鳴ります。
- id: ch3_zumen
  title: ''
  background: yh_gakko_bunkai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 山葉寅楠, emotion: normal}
  - {who: kocho, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 寅楠は直しながら、部品を一つずつ図面に写していきます。
    reading: とらくすわ なおしながら、ぶひんお ひとつずつ ずめんに うつして いきます。
  - speaker: kocho
    emotion: thinking
    text: '[山葉|やまハ]さん。直すだけなら、写さなくてもいいでしょう。'
  - speaker: zundamon
    emotion: happy
    text: 写しておけば、同じものが作れます。
  - speaker: kocho
    emotion: surprised
    text: 作る！？ これを、浜松で？
  - speaker: zundamon
    emotion: happy
    text: これくらいなら、3円で作れる気がするのだ。
    telops:
    - {text: 45円のオルガンを3円で？, size: lg, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#6BA3E0", anim: up}
  - speaker: kocho
    emotion: thinking
    text: ……45円を、3円で。
  - speaker: kocho
    emotion: normal
    text: '[山葉|やまハ]さん。値段の桁が、一つ減っておりますぞ。'
    se: tenten
  - speaker: zundamon
    emotion: normal
    text: 外国から買わずに日本で作れば、全国の学校に置けるのだ。
  - speaker: kocho
    emotion: thinking
    text: ……修理の人が、急に大きな話を始めましたな。
    beat: true
- id: ch4_kawai
  title: 錺職・河合喜三郎
  background: yh_kawai
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 山葉寅楠, emotion: normal}
  - {who: kisaburo, x: 0.7, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 寅楠が頼ったのは、池町の錺職の河合喜三郎でした。
    reading: とらくすが たよったのわ、いけまちの かざりしょくの かわい きさぶろうでした。
  - speaker: kisaburo
    emotion: surprised
    text: オルガンを作る！？ わしは、かんざしや金具を作る職人だに。
  - speaker: zundamon
    emotion: normal
    text: 細かい金物を作れる人が、どうしても要るんです。
  - speaker: kisaburo
    emotion: thinking
    text: 図面は、あるだか。
  - speaker: zundamon
    emotion: happy
    text: 学校のオルガンを、全部写してきました。
  - speaker: kisaburo
    emotion: surprised
    text: この紙の束、全部かね！
  - speaker: zundamon
    emotion: sad
    text: ただ、ボクには[一文|いちもん]もありません。
  - speaker: kisaburo
    emotion: thinking
    text: ……図面はあって、[金|かね]は無い。
  - speaker: kisaburo
    emotion: happy
    text: 面白いじゃん。やらまいか。
  - speaker: zundamon
    emotion: happy
    text: やらまいか、なのだ！
  - speaker: reimu
    text: 道具と材料のお金は、喜三郎が借金をして用意しました。
    reading: どうぐと ざいりょうの おかねわ、きさぶろうが しゃっきんお して よういしました。
- id: ch4_shisaku
  title: 39鍵の1台目
  background: yh_kawai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 山葉寅楠, emotion: happy}
  - {who: kisaburo, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 二人は河合の家を仕事場にして、2か月ほどで1台目を組み上げます。
    reading: ふたりわ かわいの いえお しごとばに して、にかげつ ほどで いちだいめお くみあげます。
  - speaker: kisaburo
    emotion: happy
    text: 鍵盤は39。音も、ちゃんと出るだに。
  - speaker: zundamon
    emotion: happy
    text: 音の良し悪しは、三味線の名人に聞いてもらおう。
- id: ch4_sakanaya
  title: ''
  background: yh_kawai
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 山葉寅楠, emotion: happy}
  - {who: kisaburo, x: 0.56, emotion: happy}
  - {who: sakanaya, x: 0.78, emotion: happy}
  cuts:
  - speaker: sakanaya
    emotion: happy
    text: '[肴町|さかなまち]の魚屋だよ。三味線なら、毎晩弾いてらあ。'
  - speaker: kisaburo
    emotion: thinking
    text: 名人っていうか、魚屋さんだら。
  - speaker: sakanaya
    emotion: thinking
    text: どれ。下の音から、順に鳴らしてみな。
  - speaker: sakanaya
    emotion: thinking
    text: ……この音、ちょいと低いな。三味線なら、糸を締めるとこだ。
  - speaker: zundamon
    emotion: surprised
    text: 糸を締める……。オルガンには、糸が無いのだ。
  - speaker: sakanaya
    emotion: happy
    text: じゃあ、魚屋に聞くこっちゃねえや。
    se: manuke
- id: ch4_fuhyo
  title: オルガンの形をした箱
  background: yh_shihan
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 山葉寅楠, emotion: thinking}
  - {who: kyoshi, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1台目は、浜松の小学校と静岡の師範学校で弾いてもらいます。
    reading: いちだいめわ、はままつの しょうがっこうと しずおかの しはんがっこうで ひいて もらいます。
  - speaker: kyoshi
    emotion: thinking
    text: '[山葉|やまハ]さん。これは、オルガンの形をした箱ですね。'
  - speaker: zundamon
    emotion: surprised
    text: ハ、箱……！？
  - speaker: kyoshi
