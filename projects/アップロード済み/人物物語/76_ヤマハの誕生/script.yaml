    emotion: thinking
    text: '[寅楠|とらくす]さん。起きとって、平気だか。'
  - speaker: zundamon
    emotion: normal
    text: '[喜三郎|きさぶろう]さんの顔を見たら、少し楽になった。'
  - speaker: kisaburo
    emotion: happy
    text: わしの顔が薬になるなら、毎日来るだに。
  - speaker: reimu
    text: 寅楠の長男の正雄は、河合喜三郎の養子になっていました。
    reading: とらくすの ちょうなんの まさおわ、かわい きさぶろうの ようしに なって いました。
  - speaker: zundamon
    emotion: normal
    text: '[正雄|まさお]は、ちゃんとやってますか。'
  - speaker: kisaburo
    emotion: happy
    text: うちの自慢の息子だに。心配いらん。
  - speaker: zundamon
    emotion: happy
    text: ……[喜三郎|きさぶろう]さんが相棒で、よかったのだ。
    se: namida
  - speaker: kisaburo
    emotion: sad
    text: ……それは、こっちの台詞だら。
  - speaker: reimu
    text: 1916年8月。新しい工場の完成を見ることなく、山葉寅楠は亡くなりました。
    reading: せんきゅうひゃく じゅうろくねん はちがつ。あたらしい こうじょうの かんせいお みる ことなく、やまは とらくすわ なくなりました。
  - speaker: reimu
    text: その2か月後、河合喜三郎も亡くなります。
    reading: その にかげつご、かわい きさぶろうも なくなります。
- id: ch12_ronsou
  title: 箱根越えは本当か
  background: yh_ronsou
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、ネットで見たのだ。日本で最初にオルガンを作ったのは、[山葉|やまハ]さん！
  - speaker: tsumugi
    emotion: normal
    text: 実は横浜の[西川虎吉|にしかわとらきち]さんが、1884年に作ってるの。
  - speaker: zundamon
    emotion: surprised
    text: 先輩がいたのだ！？
  - speaker: tsumugi
    emotion: normal
    text: '[松阪|まつさか]にも、同じころから作ってた人がいたわ。'
  - speaker: tsumugi
    emotion: normal
    text: '[山葉|やまハ]さんは、オルガン作りを日本の産業に育てた人ね。'
  - speaker: zundamon
    emotion: happy
    text: じゃあ、これは本当だ。オルガンを担いで、箱根を越えた！
  - speaker: tsumugi
    emotion: thinking
    text: それは、ヤマハに伝わる話よ。1929年に、銅像の台座のレリーフになったの。
  - speaker: zundamon
    emotion: surprised
    text: 出来事から、40年以上もあとだ。
  - speaker: tsumugi
    emotion: normal
    text: 地元の研究者は、担いだ証拠は見つかっていないと書いてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 当時の東海道には乗合馬車があって、それを使った見込みが高いって。
  - speaker: zundamon
    emotion: thinking
    text: 箱根の坂は？
  - speaker: tsumugi
    emotion: normal
    text: 箱根は、[人足|にんそく]か馬で越えたんじゃないかって。
  - speaker: tsumugi
    emotion: normal
    text: 近くの港から、船で運んだのではという疑問も出てるわ。
  - speaker: zundamon
    emotion: surprised
    text: '[担いだり|かついだり]馬車に乗ったり、船に乗ったり……。'
  - speaker: zundamon
    emotion: thinking
    text: そのオルガン、ボクより旅慣れてるのだ。
    se: manuke
  - speaker: tsumugi
    emotion: normal
    text: それに1887年の7月には、[国府津|こうづ]から新橋まで汽車が[通って|とおって]たの。
  - speaker: zundamon
    emotion: surprised
    text: 汽車があったのに、担いだのか……？
  - speaker: tsumugi
    emotion: normal
    text: 本当に担いだかは、今も確かめようがないの。
  - speaker: tsumugi
    emotion: normal
    text: 創業の年も、資料によって1885年から1887年まで分かれてるわ。
  - speaker: zundamon
    emotion: thinking
    text: 伝説も年号も、バラバラなのだ……。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: 当時の新聞にも、最初は伊沢さんに音の狂いを言われたと書いてあるの。
  - speaker: tsumugi
    emotion: normal
    text: 作り直した2度目は、[精巧無比|せいこうむひ]とほめられてるわ。
  - speaker: zundamon
    emotion: happy
    text: 担いだオルガンより、そっちのほうが重いのだ。
- id: ch12_sonogo
  title: 弟子の独立とオートバイ
  background: yh_sonogo
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: '[寅楠|とらくす]さんが亡くなって11年後、[小市|こいち]さんは会社を離れたの。'
  - speaker: zundamon
    emotion: surprised
    text: 弟子が、出ていったのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 1927年に7人の弟子と、河合楽器研究所を作ったの。今のカワイよ。
  - speaker: zundamon
    emotion: surprised
    text: ピアノのカワイは、ヤマハの弟子が作ったのか！
  - speaker: tsumugi
    emotion: normal
    text: '[小市|こいち]さんの信条は、楽器を売る前にまず技術を売れ。'
  - speaker: zundamon
    emotion: happy
    text: 説明書が読めなくても、機械を動かした人の言葉なのだ。
  - speaker: tsumugi
    emotion: normal
    text: ヤマハは1921年から、軍に頼まれて木のプロペラも作ってたの。
  - speaker: tsumugi
    emotion: normal
    text: 1955年には、そのプロペラを作る機械を活かしてオートバイを出したわ。
  - speaker: zundamon
    emotion: surprised
    text: ピアノの会社が、バイク！？
  - speaker: tsumugi
    emotion: normal
    text: そのオートバイの部門が同じ年に独立して、ヤマハ発動機になったの。
- id: ch13_gendai
  title: 今のヤマハと浜松
  background: yh_gendai
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 今のヤマハの売上は、1年で4653億円。
  - speaker: tsumugi
    emotion: normal
    text: そのうちピアノは400億円で、電子楽器は1054億円よ。
  - speaker: zundamon
    emotion: surprised
    text: ピアノより、電子楽器のほうが多いのだ！
  - speaker: tsumugi
    emotion: normal
    text: 楽器の売上では世界一だと、ヤマハ自身が発表してるわ。
  - speaker: zundamon
    emotion: happy
    text: 使用にはたえないから、世界一……！
  - speaker: tsumugi
    emotion: normal
    text: 音楽教室に通う人は、国内で約30万人と海外で約16万人。
  - speaker: tsumugi
    emotion: normal
    text: ちなみにヤマハ発動機の売上は、2兆5342億円。
    telops:
    - {text: 発動機の売上は2兆5342億円, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 弟のバイクのほうが、5倍以上大きいのだ！？
    se: gaan
  - speaker: tsumugi
    emotion: normal
    text: どちらも、3本の音叉のマークを使ってるわ。
  - speaker: zundamon
    emotion: thinking
    text: 3本あるのは、なんでなの？
  - speaker: tsumugi
    emotion: normal
    text: 技術と製造と販売の3つが、手を組むという意味もあるの。
  - speaker: zundamon
    emotion: happy
    text: 考える人と作る人と、売る人なのだ。
  - speaker: tsumugi
    emotion: normal
    text: あの廃寺の工場があった坂は、今もオルガン坂と呼ばれてるの。
  - speaker: tsumugi
    emotion: normal
    text: 浜松は2014年に、ユネスコの創造都市に音楽の分野で加わったわ。
  - speaker: zundamon
    emotion: happy
    text: バネ2本の修理から、楽器の町が始まったのだ。
- id: shime
  title: ''
  background: yh_ongakushitsu
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。今度は音叉を借りて、ラの音を合わせたのだ！
  - speaker: tsumugi
    emotion: happy
    text: えらいわね。ほかの音は？
  - speaker: zundamon
    emotion: happy
    text: ラだけは、完ぺきなのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 残りの[87鍵|はちじゅうななけん]は、調律師さんにお願いしましょう。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: ピアノを見かけたら、鍵盤のふたに書いてある名前を見てみて。
  - speaker: zundamon
    emotion: happy
    text: 使えないと言われた人の名字が、書いてあるかもしれないのだ。
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
