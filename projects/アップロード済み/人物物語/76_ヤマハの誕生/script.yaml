meta:
  title: 【ヤマハの誕生】「調律が不正確で使用にはたえない」酷評の手作りオルガン【ずんだもん解説】
  slug: yamaha-torakusu
  summary: ピアノのふたに書かれた、ヤマハの文字。それは、紀州藩の天文係の家に生まれた男、山葉寅楠の名字です。明治の浜松で、鳴らなくなった45円のアメリカ製オルガンを直した寅楠は、錺職の河合喜三郎と二人で、オルガンを一から作り始めます。ところが、お金も評判も無い二人を東京で待っていたのは、厳しいひと言でした。そこから何が始まったのか。再現ドラマでたどります。
  tags:
  - ヤマハ
  - 山葉寅楠
  - 河合喜三郎
  - オルガン
  - ピアノ
  - 浜松
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
