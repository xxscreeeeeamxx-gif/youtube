meta:
  title: 【カルピスの誕生】全財産を失った男と、置き忘れられた一本【ずんだもん解説】
  slug: calpis
  summary: 大阪の寺に生まれた、ほとんどしゃべれない子。やがて大陸へ渡り、十三年かけて築いたものを革命で全部失います。無一文で帰国した男が作った商品は、売れたのに次々と消えていきました。四度目にたどり着いた答えは、誰も狙っていなかった場所にありました。
  tags:
  - カルピス
  - 三島海雲
  - 乳酸菌
  - 内モンゴル
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 明治
  - 大正
  thumbnail:
    top: 置き忘れた一本
    bottom: カルピスの誕生
  mode: drama
  narrator: reimu
