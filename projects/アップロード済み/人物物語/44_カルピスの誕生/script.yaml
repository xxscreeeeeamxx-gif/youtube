scenes:
- id: hook
  title: ''
  background: cp_ima
  bgm: shuffle_shuffle
  stage:
  - who: zundamon
    x: 0.3
    flip: true
    emotion: happy
  - who: tsumugi
    x: 0.74
    emotion: normal
  cuts:
  - speaker: tsumugi
    text: ずんだもん、それ、原液よね。
    emotion: surprised
  - speaker: zundamon
    text: 原液なのだ。
    emotion: happy
  - speaker: tsumugi
    text: コップに注ぐ気は無いのね。
    emotion: normal
  - speaker: zundamon
    text: 瓶が、コップなのだ。
    emotion: happy
  - speaker: tsumugi
    text: 昨日も原液だったでしょ。
    emotion: angry
  - speaker: zundamon
    text: 昨日は牛乳で割ったのだ。
    emotion: normal
  - speaker: tsumugi
    text: ……それ、薄めたことにならないわよ。
    emotion: thinking
  - speaker: zundamon
    text: カルピスは[乳酸菌|にゅうさんきん]なのだ。
    emotion: happy
  - speaker: zundamon
    text: 濃いほど、体にいいに決まってるぞ。
    emotion: happy
  - speaker: tsumugi
    text: 濃いほど、砂糖もそのぶん濃いのよ。
    emotion: angry
  - speaker: zundamon
    text: ボクは毎日カルピス健康生活なのだ。
    emotion: happy
  - speaker: tsumugi
    text: 健康って言葉を付ければ健康になると思ってるでしょ。
    emotion: thinking
  - speaker: tsumugi
    text: 今日からは、ちゃんと水で薄めましょうね。
    emotion: normal
  - speaker: zundamon
    text: わかったのだ。今日から体に優しく生きるぞ。
    emotion: happy
  - speaker: zundamon
    text: だから、冷蔵庫からこれを出してきたのだ。
    emotion: happy
  - speaker: tsumugi
    text: 缶のカルピスウォーターじゃない。
    emotion: surprised
  - speaker: zundamon
    text: これは、もう水で薄めてあるのだ。
    emotion: happy
  - speaker: zundamon
    text: つまり中身はほとんど水で、カロリーもゼロなのだ。
    emotion: happy
  - speaker: tsumugi
    text: ゼロなのは、カルピスから離れる気のほうよ。
    emotion: angry
    se: oti
  - speaker: zundamon
    text: ……バレた。
    emotion: surprised
  - speaker: tsumugi
    text: でもね、ずんだもん。
    emotion: normal
  - speaker: tsumugi
    text: その、薄めなくていい一本が出てくるまでに、
    emotion: normal
  - speaker: tsumugi
    text: 七十年以上かかってるのよ。
    emotion: normal
  - speaker: zundamon
    text: 七十年。水で薄めるだけなのに。
    emotion: surprised
  - speaker: tsumugi
    text: その薄める前のやつを、ゼロから作った人がいるの。
    emotion: happy
  - speaker: zundamon
    text: 牛乳に砂糖を入れれば、できそうなのだ。
    emotion: thinking
  - speaker: tsumugi
    text: それができなくて、商品をいくつも潰してるの。
    emotion: thinking
  - speaker: zundamon
    text: 潰した。よく会社が残ったのだ。
    emotion: surprised
  - speaker: reimu
    text: カルピス。日本で最初の乳酸菌飲料です。
    reading: かるぴす。にほんで さいしょの にゅうさんきん いんりょうです。
  - speaker: reimu
    text: 作ったのは、大陸で全財産を失って帰ってきた男でした。
    reading: つくったのわ、たいりくで ぜんざいさんお うしなって かえってきた おとこでした。
  - speaker: zundamon
    text: 全財産。急に重いのだ。
    emotion: thinking
  - speaker: tsumugi
    text: 名前は、[三島海雲|みしまかいうん]。大阪の寺の子よ。
    emotion: normal
- id: card1878
  title: ''
  background: cp_card_1878
  cuts:
  - speaker: reimu
    text: 物語は、1878年の大阪から始まります。
    reading: ものがたりわ、せんはっぴゃくななじゅうはちねんの おおさかから はじまります。
- id: ch1_hondo
  title: 寺に生まれた、しゃべれない子
  background: cp_hondo
  bgm: 223am
  stage:
  - who: zundamon
    x: 0.3
    flip: true
    tag: 海雲
    scale: 0.85
    emotion: sad
  - who: hojo
    x: 0.64
    emotion: normal
  cuts:
  - speaker: reimu
    text: 1878年7月2日。大阪の萱野。
    reading: せんはっぴゃくななじゅうはちねんしちがつふつか。おおさかのかやの。
  - speaker: reimu
    text: 水稲山教学寺の十三世住職、三島法城の長男として生まれました。
    reading: すいとうざんきょうがくじのじゅうさんせいじゅうしょく、みしまほうじょうのちょうなんとしてうまれました。
  - speaker: hojo
    text: '[海雲|かいうん]。次の行だ。'
    emotion: normal
  - speaker: zundamon
    text: ……に、に、に。
    emotion: sad
  - speaker: zundamon
    text: 出ないのだ。最初の[一音|いちおん]が、出ない。
    emotion: sad
  - speaker: hojo
    text: そこで止まってよい。父が待つ。
    emotion: normal
  - speaker: zundamon
    text: 父上は、いつもそう言って待つのだ。
    emotion: sad
  - speaker: reimu
    text: 五歳ごろまでほとんどしゃべれなかったと、本人が書き残しています。
    reading: ごさいごろまでほとんどしゃべれなかったとほんにんがかきのこしています。
- id: ch1_kawara
  title: ''
  background: cp_kawara
  stage:
  - who: zundamon
    x: 0.3
    flip: true
    tag: 海雲
    scale: 0.85
    emotion: sad
  - who: tsumugi
    x: 0.7
    tag: 母
    emotion: normal
  cuts:
  - speaker: tsumugi
    text: ここなら、だれも聞いていないわ。
    emotion: normal
  - speaker: zundamon
    text: ……寺でやると、父上に聞こえるのだ。
    emotion: sad
  - speaker: tsumugi
    text: だから[河原|かわら]に来たの。水の音が消してくれるわ。
    emotion: normal
  - speaker: tsumugi
    text: ゆっくりでいい。息を先に出して。
    emotion: normal
  - speaker: zundamon
    text: か……か……
    emotion: sad
  - speaker: tsumugi
    text: もう一回。急がなくていいのよ。
    emotion: normal
  - speaker: zundamon
    text: か……か……かあ……
    emotion: sad
  - speaker: zundamon
    text: ……出た。伸ばしたら、出た。
    emotion: surprised
  - speaker: tsumugi
    text: いまの。最初の音を、長く持ったわね。
    emotion: happy
  - speaker: zundamon
    text: かあ……わ。かわ。
    emotion: normal
  - speaker: zundamon
    text: かわ！ 言えたのだ！
    emotion: happy
  - speaker: tsumugi
    text: '[上手|じょうず]よ、[海雲|かいうん]。'
    emotion: happy
- id: ch1_kusuri
  title: ''
  background: cp_hondo
  bgm: 10do
  stage:
  - who: zundamon
    x: 0.3
    flip: true
    tag: 海雲
    scale: 0.85
    emotion: normal
  - who: tsumugi
    x: 0.7
    tag: 母
    emotion: happy
  cuts:
  - speaker: tsumugi
    text: '[海雲|かいうん]。いいものを聞いてきたわ。'
    emotion: happy
  - speaker: zundamon
    text: いいもの？
    emotion: normal
  - speaker: tsumugi
    text: '[吃音|きつおん]に効く、妙薬ですって。'
    emotion: happy
  - speaker: zundamon
    text: 薬なのだ！ 飲めば読めるのだ！
    emotion: happy
  - speaker: tsumugi
    text: 飲むんじゃなくて、食べるの。
    emotion: normal
  - speaker: zundamon
    text: ……食べる。
    emotion: normal
  - speaker: tsumugi
    text: カタツムリの照り焼き。
    emotion: happy
  - speaker: zundamon
    text: カタツムリ！？
    emotion: surprised
  - speaker: zundamon
    text: ……言葉より先に、食べたものが出そうなのだ。
    emotion: thinking
    se: oti
- id: ch1_card1891
  title: ''
  background: cp_card_1891
  bgm: 223am
  cuts:
  - speaker: reimu
    text: 1891年ごろ。十三歳で得度します。
    reading: せんはっぴゃくきゅうじゅういちねんごろ。じゅうさんさいでとくどします。
- id: ch1_tokudo
  title: ''
  background: cp_hondo
  stage:
  - who: zundamon
    x: 0.32
    flip: true
    tag: 海雲
    scale: 0.9
    emotion: normal
  - who: hojo
    x: 0.66
    emotion: normal
  cuts:
  - speaker: hojo
    text: 頭が寒いか。
    emotion: normal
  - speaker: zundamon
    text: ……寒いのだ。
    emotion: normal
  - speaker: hojo
    text: 今日から、おまえも坊主だ。
    emotion: normal
  - speaker: zundamon
    text: 父上。寺の外には、何があるのですか。
    emotion: normal
  - speaker: hojo
    text: ……知らん。わしは出たことがない。
    emotion: thinking
  - speaker: zundamon
    text: ボクは、出てみたいのだ。
    emotion: normal
  - speaker: hojo
    text: そったばかりの頭で言うことか。
    emotion: normal
  - speaker: zundamon
    text: いま、つっかえずに言えたのだ。
    emotion: happy
  - speaker: hojo
    text: ……そうだな。
    emotion: happy
- id: ch2_ryo_class
  title: はいとだけ答えた男
  background: cp_kyoshitsu
  bgm: hirusagari
  stage:
  - who: zundamon
    x: 0.3
    flip: true
    tag: 三島海雲
    emotion: normal
  - who: dosei_a
    x: 0.7
    tag: 同級生
    emotion: normal
  cuts:
  - speaker: reimu
    text: 1893年。十四の年に、京都の西本願寺文学寮へ入ります。
    reading: せんはっぴゃくきゅうじゅうさんねん。じゅうよんのとしに、きょうとのにしほんがんじぶんがくりょうえはいります。
  - speaker: dosei_a
    text: '[三島|みしま]。また英語の本か。'
    emotion: normal
  - speaker: zundamon
    text: 読めると、外の話が入ってくるのだ。
    emotion: normal
  - speaker: dosei_a
    text: 寺を継ぐのに、横文字が要るのか。
    emotion: thinking
  - speaker: zundamon
    text: 西洋の学問も知る坊主を作る学校だぞ。
    emotion: happy
  - speaker: zundamon
    text: ボクは[経|きょう]より先に、単語を覚えてしまったのだ。
    emotion: happy
- id: ch2_rouka
  title: ''
  background: cp_rouka
  bgm: serious
  stage:
  - who: zundamon
    x: 0.18
    flip: true
    tag: 三島海雲
    emotion: normal
  - who: dosei_a
    x: 0.42
    tag: 同級生
    scale: 0.8
    emotion: thinking
  - who: dosei_b
    x: 0.56
    tag: 同級生
    scale: 0.8
    emotion: thinking
  - who: sojinkan
    x: 0.82
    tag: 杉村楚人冠
    scale: 0.8
    emotion: normal
  cuts:
  - speaker: sojinkan
    text: 門限を破った三名。今月は外出を禁じる。
    emotion: angry
  - speaker: dosei_a
    text: 道に迷いまして、戻るのが遅れました。
    emotion: thinking
  - speaker: dosei_b
    text: 私は腹を下して、医者に行っておりました。
    emotion: thinking
  - speaker: sojinkan
    text: ……[三島|みしま]。お前はどうだ。
    emotion: normal
  - speaker: zundamon
    text: はい。
    emotion: normal
  - speaker: sojinkan
    text: はい、それだけか。
    emotion: surprised
  - speaker: zundamon
    text: はい。
    emotion: normal
  - speaker: dosei_a
    text: おい[三島|みしま]、何か言えよ。
    emotion: surprised
  - speaker: zundamon
    text: 遅れたのだから、言うことは無い。
    emotion: normal
  - speaker: sojinkan
    text: ……下がってよし。
    emotion: normal
- id: ch2_rouka_ato
  title: ''
  background: cp_rouka
  bgm: 223am
  stage:
  - who: sojinkan
    x: 0.62
    tag: 杉村楚人冠
    emotion: thinking
  cuts:
  - speaker: sojinkan
    text: ……言い訳をせん男を、はじめて見た。
    emotion: thinking
  - speaker: sojinkan
    text: あの男は、覚えておく。
    emotion: normal
- id: ch2_maeda
  title: ''
  background: cp_kyoshitsu
  bgm: 223am
  stage:
  - who: zundamon
    x: 0.32
    flip: true
    tag: 三島海雲
    emotion: normal
  - who: maeda
    x: 0.68
    tag: 前田慧雲
    emotion: normal
  cuts:
  - speaker: maeda
    text: '[三島|みしま]。学校を出たら、どうする。'
    emotion: normal
  - speaker: zundamon
    text: 寺に戻れと、父上は言っているのだ。
    emotion: thinking
  - speaker: zundamon
    text: ……外がどうなっているか、見てみたいのだ。
    emotion: normal
  - speaker: maeda
    text: 外へ出れば、[金|かね]が要るぞ。
    emotion: normal
  - speaker: zundamon
    text: そこなのだ。ボクには何も無い。
    emotion: sad
  - speaker: maeda
    text: 世の中では、[金|かね]を得るのは難しいという。
    emotion: normal
  - speaker: maeda
    text: だが、案外たやすいものだ。
    emotion: happy
  - speaker: zundamon
    text: たやすい……？
    emotion: surprised
  - speaker: maeda
    text: 必要な[金|かね]は、どこからか湧いてくる。
    emotion: normal
  - speaker: zundamon
    text: ……覚えておくのだ。
    emotion: thinking
- id: ch2_yamaguchi
  title: ''
  background: cp_kyoshitsu
  bgm: hirusagari
  stage:
  - who: zundamon
    x: 0.3
    flip: true
    tag: 三島海雲
    emotion: happy
  - who: kurita
    x: 0.7
    tag: 栗田淳一
    emotion: thinking
  cuts:
  - speaker: reimu
    text: 文学寮を出た海雲は、山口の開導中学で英語を教えます。
    reading: ぶんがくりょうおでたかいうんわ、やまぐちのかいどうちゅうがくでえいごおおしえます。
  - speaker: kurita
    text: 先生。この一語が、どうしても読めません。
    emotion: thinking
  - speaker: zundamon
    text: '[栗田|くりた]。辞書より先に、声に出してみるのだ。'
    emotion: normal
  - speaker: zundamon
    text: ボクも昔、その[一音|いちおん]が出なくて苦労したのだ。
    emotion: normal
  - speaker: kurita
    text: ウォ……ウォーター。読めました、先生。
    emotion: happy
  - speaker: zundamon
    text: それでいい。あとは千回やるだけなのだ。
    emotion: happy
  - speaker: reimu
    text: この一年生が、のちに日本石油の社長となる栗田淳一です。
    reading: このいちねんせいが、のちににほんせきゆのしゃちょうとなるくりたじゅんいちです。
- id: ch2_ketsui
  title: ''
  background: cp_kyoshitsu
  bgm: 223am
  stage:
  - who: zundamon
    x: 0.3
    flip: true
    tag: 三島海雲
    emotion: thinking
  - who: kurita
    x: 0.7
    tag: 栗田淳一
    emotion: normal
  cuts:
  - speaker: kurita
    text: 先生。新聞は、大陸の話ばかりですね。
    emotion: normal
  - speaker: zundamon
    text: 海の向こうで、学校を作る日本人がいるらしいぞ。
    emotion: normal
  - speaker: kurita
    text: 先生は、行きたそうな顔をしています。
    emotion: thinking
  - speaker: zundamon
    text: '[金|かね]は無いし、行く当ても無いのだ。'
    emotion: thinking
  - speaker: zundamon
    text: ……だが、湧いてくると言われたのだ。
    emotion: normal
  - speaker: zundamon
    text: ……ボクは、ここを出る。
    emotion: normal
