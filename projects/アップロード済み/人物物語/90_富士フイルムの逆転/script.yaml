meta:
  title: 富士フイルム、需要10分の1から過去最高益へ　コダックとの分かれ道【ずんだもん解説】
  slug: fujifilm-komori
  summary: 2000年、写真フィルムの需要が頂点に達したその年に、富士写真フイルムの社長になった古森重隆。写真は売上の半分以上、利益の3分の2を稼ぐ本業でした。同じ嵐の中にいたのは、最初のデジタルカメラを作ったアメリカのコダック。2つの会社は、どこで道が分かれたのか。社内の賛成が2〜3％だった化粧品、600ページの反論書、そして会見で読み上げた数字。再現ドラマでたどります。
  tags:
  - 富士フイルム
  - 古森重隆
  - コダック
  - 写真フィルム
  - 写ルンです
  - チェキ
  - アスタリフト
  - 富士ゼロックス
  - 戸田雄三
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 平成史
  thumbnail:
    top: 需要は10分の1以下
    bottom: 富士フイルム逆転
  mode: drama
  narrator: reimu
