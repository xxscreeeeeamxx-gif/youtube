scenes:
- id: co_baka1
  title: ''
  background: ff_kenkyujo
  bgm: curious
  stage:
  - {who: toda, x: 0.28, flip: true, emotion: happy}
  - {who: buchou, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2000年代の半ば。写真フィルムの会社で、化粧品を作る話が持ち上がります。
    reading: にせんねんだいの なかば。しゃしん ふぃるむの かいしゃで、けしょうひんお つくる はなしが もちあがります。
  - speaker: toda
    emotion: happy
    text: 部長。悪いけど、[バカ1|ばかいち]になってくれないか。
  - speaker: buchou
    emotion: surprised
    text: ばか、いち？
  - speaker: toda
    emotion: happy
    text: 化粧品をやるんだ。最初に乗ってくれる、バカの1号さ。
  - speaker: buchou
    emotion: normal
    text: お断りします。
    beat: true
  - speaker: toda
    emotion: sad
    text: ……せめて、考えるふりくらいしてくれよ。
  - speaker: reimu
    text: この会社は、富士フイルム。写真フィルムの需要は、10年で10分の1以下になります。
    reading: この かいしゃわ、ふじ ふぃるむ。しゃしん ふぃるむの じゅようわ じゅうねんで じゅうぶんの いち いかに なります。
  - speaker: reimu
    text: それでも、のちに過去最高益を出すまでに。なぜ、そんなことができたのか。
    reading: それでも のちに かこ さいこうえきお だすまでに。なぜ そんな ことが できたのか。
- id: hook
  title: ''
  background: ff_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ チェキで撮った写真なのだ！
  - speaker: tsumugi
    emotion: normal
    text: 1枚だけ？
  - speaker: zundamon
    emotion: happy
    text: 壁を見るのだ！
    background: ff_heya_photo
    se: jaan
  - speaker: tsumugi
    emotion: thinking
    text: ……全部、ずんだもんの自撮りじゃない。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: その会社、今は医療や化粧品もやってるの。
  - speaker: tsumugi
    emotion: thinking
    text: 写真フィルムなんて、売上の1％もないわ。
    telops:
    - {text: "写真フィルムは売上の1％未満", size: lg, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: フィルムの会社なのに！？
  - speaker: tsumugi
    emotion: thinking
    text: アメリカのコダックは、破綻したのにね。
  - speaker: zundamon
    emotion: surprised
    text: なんで富士は、潰れなかったの！？
- id: card1934
  title: ''
  background: ff_card_1934
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1934年1月。大日本セルロイドの写真フィルム部を引き継いで、富士写真フイルムが生まれます。
    reading: せんきゅうひゃく さんじゅうよねん いちがつ。だいにっぽん せるろいどの しゃしん ふぃるむぶお ひきついで、ふじ しゃしん ふぃるむが うまれます。
  - speaker: reimu
    text: 目的は、写真フィルムの国産化。2月には、神奈川の足柄工場で製造が始まります。
    reading: もくてきわ、しゃしん ふぃるむの こくさんか。にがつにわ かながわの あしがら こうじょうで せいぞうが はじまります。
- id: ch1_kojo
  title: 国産の写真フィルム
  background: ff_kojo
  bgm: honwaka_puppu
  stage:
  - {who: kenkyu, x: 0.28, flip: true, emotion: normal}
  - {who: shain, x: 0.7, emotion: surprised}
  cuts:
  - speaker: shain
    emotion: surprised
    text: 暗い！ 工場なのに、真っ暗じゃないですか。
  - speaker: kenkyu
    emotion: normal
    text: フィルムは光に当たると、そこで写ってしまうからな。
  - speaker: shain
    emotion: thinking
    text: じゃあ、どうやって作るんです？
  - speaker: kenkyu
    emotion: happy
    text: 目をつぶっても動けるように、体で覚えるんだ。
  - speaker: shain
    emotion: happy
    text: 外国製に頼らない、国産の写真フィルムですもんね。
  - speaker: kenkyu
    emotion: happy
    text: ああ。日本の写真を、日本のフィルムで撮るんだ。
  - speaker: shain
    emotion: thinking
    text: ……ところで、僕のメガネはどこでしょう。
    se: manuke
  - speaker: kenkyu
    emotion: thinking
    text: 暗いから、誰にも見えん。
    beat: true
- id: card1963
  title: ''
  background: ff_card_1963
  cuts:
  - speaker: reimu
    text: 1963年4月。東京大学の経済学部を出た古森重隆が、入社します。
    reading: せんきゅうひゃく ろくじゅうさんねん しがつ。とうきょう だいがくの けいざい がくぶお でた こもり しげたかが、にゅうしゃ します。
  - speaker: reimu
    text: 長崎県の出身。最初の配属は、経営企画部でした。
    reading: ながさきけんの しゅっしん。さいしょの はいぞくわ、けいえい きかくぶでした。
- id: ch2_nyusha
  title: 営業に行かせてください
  background: ff_kaigi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 古森重隆, emotion: normal}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: shain
    emotion: normal
    text: '[古森|こもり]くん、話があるって？'
  - speaker: zundamon
    emotion: normal
    text: はい。営業に、移らせてください。
  - speaker: shain
    emotion: surprised
    text: 経営企画部から、営業へ？
  - speaker: zundamon
    emotion: normal
    text: 希望を出しました。
  - speaker: shain
    emotion: thinking
    text: 企画の机を離れて、外回りか。物好きだな。
  - speaker: zundamon
    emotion: normal
    text: はい。物好きで、すみません。
  - speaker: shain
    emotion: thinking
    text: 外回りは、靴がすぐ減るぞ。
  - speaker: zundamon
    emotion: happy
    text: 靴代くらいは、売ってきます。
  - speaker: shain
    emotion: happy
    text: ……大きく出たな。
    beat: true
  - speaker: reimu
    text: 古森は、本人の希望で営業に移りました。
    reading: こもりわ、ほんにんの きぼうで えいぎょうに うつりました。
- id: card1975
  title: ''
  background: ff_card_1975
  bgm: curious
  cuts:
  - speaker: reimu
    text: 1975年。アメリカのコダックで、最初のデジタルカメラが生まれます。
    reading: せんきゅうひゃく ななじゅうごねん。あめりかの こだっくで、さいしょの でじたる かめらが うまれます。
- id: ch2_kodak
  title: コダックの試作機
  background: ff_kaigai_office
  cuts:
  - speaker: reimu
    text: 作ったのは、コダックの技術者スティーブ・サッソンです。
    reading: つくったのわ、こだっくの ぎじゅつしゃ すてぃーぶ さっそんです。
  - speaker: reimu
    text: 重さは3.6キロ。白黒で1万画素、1枚をカセットテープに記録するのに23秒かかりました。
    reading: おもさわ さんてんろく きろ。しろくろで いちまん がそ、いちまいお かせっと てーぷに きろく するのに にじゅうさんびょう かかりました。
- id: card1986
  title: ''
  background: ff_card_1986
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 1986年7月。世界初のレンズ付きフィルム、写ルンですが発売されます。
    reading: せんきゅうひゃく はちじゅうろくねん しちがつ。せかいはつの れんずつき ふぃるむ、うつるんですが はつばい されます。
- id: ch3_utsurun
  title: フィルムにレンズが付いた
  background: ff_genzosho
  stage:
  - {who: tenin, x: 0.28, flip: true, emotion: happy}
  - {who: kyaku, x: 0.7, emotion: surprised}
  cuts:
  - speaker: kyaku
    emotion: surprised
    text: 店主さん！ このフィルム、レンズが付いてるよ。
  - speaker: tenin
    emotion: happy
    text: '[写ルンです|うつるんです]。カメラを持ってなくても、それで撮れますよ。'
  - speaker: kyaku
    emotion: surprised
    text: カメラを買わずに、写真が撮れるのか。
  - speaker: tenin
    emotion: happy
    text: 撮り終わったら、そのまま店に持ってきてください。
  - speaker: tenin
    emotion: happy
    text: 現像は、うちでやりますから。
  - speaker: kyaku
    emotion: happy
    text: じゃあ3個ちょうだい。旅行と運動会と、孫の分。
  - speaker: tenin
    emotion: thinking
    text: お孫さん、まだ撮る側じゃないでしょう。
  - speaker: kyaku
    emotion: happy
    text: 撮られる側の分だよ。
    beat: true
  - speaker: reimu
    text: 写ルンですは、最初の1年で300万本。世界では、累計17億本を超えています。
    reading: うつるんですわ、さいしょの いちねんで さんびゃくまんぼん。せかいでわ るいけい じゅうななおくほんお こえて います。
- id: card1995
  title: ''
  background: ff_card_1995
  bgm: kinakusai
  cuts:
  - speaker: reimu
    text: 1995年5月18日。コダックが、アメリカの通商法301条にもとづく申し立てをします。
    reading: せんきゅうひゃく きゅうじゅうごねん ごがつ じゅうはちにち。こだっくが あめりかの つうしょうほう さんびゃく いちじょうに もとづく もうしたてお します。
- id: ch4_301
  title: コダックの申し立て
  background: ff_shachoshitsu
  stage:
  - {who: onishi, x: 0.28, flip: true, emotion: thinking}
  - {who: shain, x: 0.7, emotion: surprised}
  cuts:
  - speaker: shain
    emotion: surprised
    text: 社長！ コダックが、アメリカの通商代表部に申し立てました！
  - speaker: onishi
    emotion: thinking
    text: 中身は。
  - speaker: shain
    emotion: normal
    text: 日本のフィルム[市場|しじょう]は、閉ざされていると。
  - speaker: onishi
    emotion: thinking
    text: 申立書の厚さは、どれくらいだ。
  - speaker: shain
    emotion: normal
    text: 約300ページです。
  - speaker: onishi
    emotion: angry
    text: 1ページ残らず、全部答えてやれ。
  - speaker: shain
    emotion: surprised
    text: ぜ、全部ですか。
    beat: true
- id: ch4_hanron
  title: 600ページの反論書
  background: ff_shachoshitsu
  stage:
  - {who: onishi, x: 0.28, flip: true, emotion: normal}
  - {who: shain, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 7月31日。富士は、通商代表部に反論書を出します。題は、歴史の改ざん。
    reading: しちがつ さんじゅういちにち。ふじわ、つうしょう だいひょうぶに はんろんしょお だします。だいわ、れきしの かいざん。
  - speaker: shain
    emotion: thinking
    text: 社長、できました。600ページです。
    telops:
    - {text: "反論書 600ページ", size: lg, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: shain
    emotion: surprised
    text: コダックの申立書の、倍の厚さです。
  - speaker: onishi
    emotion: normal
    text: 前書きは、わたしの名前で出す。
  - speaker: onishi
    emotion: angry
    text: コダックの主張は、全くのでたらめだ。
    se: don
  - speaker: onishi
    emotion: angry
    text: 制裁を求めて、政治の圧力を不当に使う。
  - speaker: onishi
    emotion: angry
    text: ビジネスの倫理として、到底許されるものではない。
  - speaker: shain
    emotion: surprised
    text: 前書きから、全力ですね……。
  - speaker: onishi
    emotion: thinking
    text: 600ページ、向こうにも全部読んでもらう。
  - speaker: shain
    emotion: thinking
    text: 読むほうも、大変ですね。
    beat: true
- id: card1996
  title: ''
  background: ff_card_1996
  bgm: honwaka_puppu
  cuts:
  - speaker: reimu
    text: 1996年。古森は、富士フイルムヨーロッパの社長になります。
    reading: せんきゅうひゃく きゅうじゅうろくねん。こもりわ、ふじ ふぃるむ よーろっぱの しゃちょうに なります。
- id: ch5_europe
  title: ナンバーツーで満足するな
  background: ff_hotel_yoru
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 古森重隆, emotion: normal}
  - {who: shain, x: 0.7, emotion: happy}
  cuts:
  - speaker: shain
    emotion: happy
    text: 社長、ようこそヨーロッパへ！ 長旅、お疲れさまでした。
  - speaker: zundamon
    emotion: normal
    text: よろしく。さっそくだが、こちらでのうちの順位は。
  - speaker: shain
    emotion: happy
    text: 2番手です。なかなかのものでしょう。
  - speaker: zundamon
    emotion: angry
    text: ナンバーツーで、満足するな。
    se: tsukkomi
  - speaker: shain
    emotion: surprised
    text: ……ほめてもらえると、思ったのに。
  - speaker: zundamon
    emotion: normal
    text: 2番手のままでいい理由は、どこにもない。
  - speaker: shain
    emotion: thinking
    text: ……拍手の準備、しまっておきます。
    beat: true
- id: ch6_wto
  title: WTOの判断
  background: ff_kaiken
  bgm: kinakusai
  stage:
  - {who: kisha, x: 0.28, flip: true, emotion: normal}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1996年10月。アメリカ政府の訴えで、WTOに小委員会ができます。
    reading: せんきゅうひゃく きゅうじゅうろくねん じゅうがつ。あめりか せいふの うったえで、だぶりゅー てぃー おーに しょういいんかいが できます。
  - speaker: reimu
    text: 1997年12月。小委員会が、中間の報告を出します。
    reading: せんきゅうひゃく きゅうじゅうななねん じゅうにがつ。しょういいんかいが、ちゅうかんの ほうこくお だします。
  - speaker: kisha
    emotion: normal
    text: 富士として、中間報告をどう受け止めますか。
  - speaker: shain
    emotion: happy
    text: 今回の[WTO|ダブリューティーオー]パネルの裁定は、日本に有利なものであります。
  - speaker: shain
    emotion: normal
    text: この理不尽な紛争の終結に、一歩近づきました。
  - speaker: kisha
    emotion: surprised
    text: 理不尽、とまで言いますか。
  - speaker: shain
    emotion: thinking
    text: 反論書は、600ページ書きましたので。
  - speaker: kisha
    emotion: thinking
    text: ページの数で、気持ちを測らないでください。
    beat: true
  - speaker: reimu
    text: 1998年3月31日。小委員会が、最終の報告を出します。
    reading: せんきゅうひゃく きゅうじゅうはちねん さんがつ さんじゅういちにち。しょういいんかいが、さいしゅうの ほうこくお だします。
  - speaker: reimu
    text: 日本の16の措置すべてで、アメリカは立証できなかった。報告は、そのまま採択されました。
    reading: にほんの じゅうろくの そち すべてで、あめりかわ りっしょう できなかった。ほうこくわ そのまま さいたく されました。
  - speaker: kisha
    emotion: surprised
    text: 16の、全部で……。
  - speaker: shain
    emotion: happy
    text: こちらの言い分が、通りました。
    se: levelup
  - speaker: reimu
    text: 同じ1998年、富士は国内でインスタントカメラのチェキを売り出しています。
    reading: おなじ せんきゅうひゃく きゅうじゅうはちねん、ふじわ こくないで いんすたんと かめらの ちぇきお うりだして います。
- id: card2000
  title: ''
  background: ff_card_2000
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 2000年6月。ヨーロッパの社長だった古森が、富士写真フイルムの社長になります。
    reading: にせんねん ろくがつ。よーろっぱの しゃちょうだった こもりが、ふじ しゃしん ふぃるむの しゃちょうに なります。
  - speaker: reimu
    text: 写真フィルムの世界の需要は、この年が頂点でした。
    reading: しゃしん ふぃるむの せかいの じゅようわ、この としが ちょうてんでした。
- id: ch7_shacho
  title: 売上の半分以上、利益の3分の2
  background: ff_shachoshitsu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 古森重隆, emotion: normal}
  - {who: shain, x: 0.7, emotion: happy}
  cuts:
  - speaker: shain
    emotion: happy
    text: 社長、ご就任おめでとうございます！
  - speaker: zundamon
    emotion: normal
    text: ありがとう。まず、数字を見せてくれ。
  - speaker: shain
    emotion: happy
    text: フィルムは今年も、よく売れています！
  - speaker: zundamon
    emotion: thinking
    text: 写真で、売上の半分以上。利益の[3分の2|さんぶんのに]か。
    telops:
    - {text: "写真で売上の半分以上・利益の3分の2", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: shain
    emotion: happy
    text: はい。うちの[稼ぎ頭|かせぎがしら]です！
  - speaker: zundamon
    emotion: normal
    text: デジタルカメラのほうは。
  - speaker: shain
    emotion: happy
    text: そちらも伸びてます。うちは両方で稼げますよ。
    beat: true
  - speaker: reimu
    text: 写真フィルムの需要は、この年を境に減り始めます。
