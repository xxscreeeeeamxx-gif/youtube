meta:
  title: 「今年も出しとこ、年賀状。」と呼びかけた日本郵便、発行はピークの約8分の1に【ずんだもん解説】
  slug: nengajo-otoshidama
  hook_line: 郵便の赤字を埋める呼び水の役目もあった年賀はがきは、なぜ8分の1まで減ったのか。
  summary: 2026年の元日に配られた年賀状は3億6300万通。2008年の元日は20億通でした。なぜ、ここまで減ったのか。1993年に入った郵便局員の目で、局の休憩室の会話から「減るほど値上げが要り、値上げするほど減る」仕組みを見ていきます。1949年、赤字の郵便の呼び水の役目も担って生まれた年賀はがき。その75年後に何が起きたのかを、日本郵便・総務省・内閣府の資料と会見の言葉を並べて、再現ドラマでたどります。2026年10月時点の情報です。
  sources:
  - 日本郵便「2027（令和9）年用年賀はがき等の発行概要」（2026年8月31日） https://files.japanpost.jp/assets/34d9d11432734cfaa759e78fe395b688/159168aef19d465baf3350d358e46fa9/20260831_02_06.pdf
  - 日本郵便「2026（令和8）年年賀郵便物元日配達物数」（2026年1月1日） https://www.post.japanpost.jp/notification/pressrelease/2026/00_honsha/0101_01_01.pdf
  - 日本郵便「郵便料金の改定および新料額の普通切手の発行などについて」（2024年6月13日） https://www.post.japanpost.jp/notification/pressrelease/2024/00_honsha/0613_01_01.pdf
  - 総務省「25g以下の定形郵便物等の上限料金の改定について」（2024年） https://www.soumu.go.jp/main_content/000951527.pdf
  - 日本郵政 社長会見（2026年5月15日） https://www.japanpost.jp/news/publication/20260515/
  - 郵政博物館 研究紀要 第8号「新たに発見された『お年玉付き年賀はがきの見本』」（2017年3月） https://www.postalmuseum.jp/publication/research/research_08_09.pdf
  tags:
  - 年賀状
  - 年賀はがき
  - お年玉付き年賀はがき
