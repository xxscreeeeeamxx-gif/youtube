scenes:
# ---- 先出し（2026年元日の出発式） ----
- id: co_shuppatsu
  title: ''
  background: ng_shuppatsu_sukunai
  bgm: serious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 局員, emotion: normal}
  - {who: kyokucho, x: 0.56, emotion: happy}
  - {who: kohai, x: 0.78, emotion: normal}
  cuts:
  - speaker: reimu
    text: 2026年1月1日の朝。郵便局の前で、年賀状を配りに出る出発式です。
    reading: にせん にじゅうろくねん いちがつ ついたちの あさ。ゆうびんきょくの まえで、ねんがじょうお くばりに でる しゅっぱつしきです。
  - speaker: kyokucho
    emotion: happy
    text: 年賀状の配達、出発！
  - speaker: kohai
    emotion: surprised
    text: 先輩、かばんが軽いです！
  - speaker: zundamon
    emotion: thinking
    text: ……30年前は、肩に食い込む重さだったんだけどな。
  - speaker: reimu
    text: この朝、全国で配った年賀状は3億6300万通。
    reading: この あさ、ぜんこくで くばった ねんがじょうわ さんおく ろくせん さんびゃくまんつう。
    telops:
    - {text: "元日の年賀状　3億6300万通", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: 18年前、2008年の元日は、20億通でした。
    reading: じゅうはちねんまえ、にせん はちねんの がんじつわ にじゅうおくつうでした。
  - speaker: reimu
    text: 年賀状は、なぜここまで減ったのでしょうか。
    reading: ねんがじょうわ、なぜ ここまで へったのでしょうか。
# ---- 茶番（今の部屋） ----
- id: hook
  title: ''
  background: ng_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見て！ 来年の年賀状は、LINEのスタンプで全員に送るのだ！
    se: jaan
  - speaker: tsumugi
    emotion: normal
    text: 机のはがきの束は？
  - speaker: zundamon
    emotion: normal
    text: 今年の余り。だって1枚85円もするんだよ。
  - speaker: tsumugi
    emotion: thinking
    text: 郵便局は、それでもまた値上げを考えてるのよ。
  - speaker: zundamon
    emotion: surprised
    text: 減ってるのに値上げ！？ 年賀状、なんでこんなに減ったのだ！？
# ---- 仕組み（2026年5月の休憩室） ----
- id: ch1_kyukei
  title: 減ったのに、なぜ値上げ
  background: ng_kyukei
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 局員, emotion: normal}
  - {who: senpai, x: 0.56, emotion: normal}
  - {who: kohai, x: 0.78, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 2026年5月。同じ郵便局の休憩室です。
    reading: にせん にじゅうろくねん ごがつ。おなじ ゆうびんきょくの きゅうけいしつです。
  - speaker: kohai
    emotion: surprised
    text: 先輩！ [日本郵政|にっぽんゆうせい]の社長が、また郵便料金を上げたいって。
  - speaker: kohai
    emotion: normal
    text: 早ければ来年度中にも何かできないか、ですって。
  - speaker: zundamon
    emotion: surprised
    text: また！？ おととしの秋に、上げたばっかりだぞ。
  - speaker: kohai
    emotion: thinking
    text: 去年の元日なんて、年賀状が[3分の1|さんぶんのいち]も減ったのに。
  - speaker: zundamon
    emotion: angry
    text: 減ってるのに、なんで上げるんだ？
  - speaker: kohai
    emotion: normal
    text: 先輩の先輩に、聞いてみましょうよ。
  - speaker: senpai
    emotion: normal
    text: 逆だよ。減ったから、上げるんだ。
  - speaker: zundamon
    emotion: surprised
    text: 逆！？
  - speaker: senpai
    emotion: normal
    text: 国の資料だと、郵便の費用の約[4分の3|よんぶんのさん]は人にかかるお[金|かね]だ。
  - speaker: kohai
    emotion: surprised
    text: 人？
  - speaker: senpai
    emotion: normal
    text: 配る人と仕分ける人、それに窓口の人だ。
  - speaker: senpai
    emotion: normal
    text: 年賀状が10通の家も1通の家も、配達は同じ道を回るだろ。
  - speaker: zundamon
    emotion: thinking
    text: 回ります。坂の上の1軒にも、1通のために。
  - speaker: senpai
    emotion: normal
    text: 通数が減っても、道と人の費用はすぐには減らない。
  - speaker: senpai
    emotion: normal
    text: だから1通あたりの費用が、どんどん高くなる。
  - speaker: kohai
    emotion: thinking
    text: それで、値上げ……。
  - speaker: senpai
    emotion: thinking
    text: ところがな。年賀は、値上げにいちばん弱い郵便なんだ。
  - speaker: zundamon
    emotion: surprised
    text: 弱い？
  - speaker: senpai
    emotion: normal
    text: 国は、値上げでどれだけ減るかを郵便の種類ごとに見積もってる。
  - speaker: senpai
    emotion: normal
    text: 年賀は、値上げで減る割合がふつうのはがきの約3倍って数字だ。
  - speaker: senpai
    emotion: normal
    text: 2024年の値上げのとき、国は年賀が4.9％余計に減ると見てた。
  - speaker: senpai
    emotion: normal
    text: いつもの減りと合わせて、17％ほどの見込みだ。
  - speaker: senpai
    emotion: thinking
    text: ところが値上げのあとの元日、年賀状は前の年より34％減った。
  - speaker: zundamon
    emotion: surprised
    text: 17％の見込みが、34％！？
  - speaker: senpai
    emotion: normal
    text: 全部が値上げのせいとは言えないぞ。前から毎年1割か2割は減ってた。
  - speaker: senpai
    emotion: thinking
    text: それでも、減り方が倍になったんだ。
  - speaker: zundamon
    emotion: thinking
    text: 減ると、値上げ。値上げすると、いちばん弱い年賀が減る。
  - speaker: zundamon
    emotion: surprised
    text: で、減ったらまた値上げ……。ぐるぐる回ってるのだ！
    se: gaan
    telops:
    - {text: "減る→値上げ→また減る", size: lg, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: kohai
    emotion: sad
    text: 年賀状50枚で、3150円が4250円。うちの親は、それもあってやめました。
  - speaker: zundamon
    emotion: thinking
    text: ……1000円以上か。
  - speaker: senpai
    emotion: thinking
    text: 皮肉なもんだよ。年賀はがきは、もともと郵便の赤字を埋める呼び水だったのにな。
  - speaker: zundamon
    emotion: surprised
    text: 呼び水？
  - speaker: senpai
    emotion: normal
    text: 井戸のポンプは、上から水を少し注ぐと下から水が上がってくるだろ。
  - speaker: senpai
    emotion: normal
    text: 年賀状で郵便を使ってもらって、郵便全体を増やそうとしたんだ。
  - speaker: kohai
    emotion: surprised
    text: 赤字を埋めるための年賀状が、今は赤字のせいで値上げ……。
  - speaker: zundamon
    emotion: thinking
    text: それ、誰が考えたんですか。
  - speaker: senpai
    emotion: normal
    text: 始まりは、ひとりの洋服屋さんの思いつきだ。
# ---- 1949年：思いつき ----
- id: card1949
  title: ''
  background: ng_card_1949
  bgm: honwaka_puppu
  cuts:
  - speaker: reimu
    text: 1949年6月。京都に住み、大阪の心斎橋で洋服の店を営む林正治、42歳。
    reading: せんきゅうひゃく よんじゅうくねん ろくがつ。きょうとに すみ おおさかの しんさいばしで ようふくの みせお いとなむ、はやし まさじ よんじゅうにさい。
- id: ch2_hayashi
  title: 洋服屋の思いつき
  background: ng_mise_1949
  stage:
  - {who: hayashi, x: 0.5, emotion: thinking}
  cuts:
  - speaker: hayashi
    emotion: thinking
    text: 終戦後、打ちひしがれた中で通信が途絶えた。
  - speaker: hayashi
    emotion: normal
    text: 年賀状が復活すれば、お互いの消息が分かるのに。
  - speaker: hayashi
    emotion: happy
    text: それに、くじのお年玉をつける。
  - speaker: hayashi
    emotion: happy
    text: さらに寄付金を加えれば夢もあり、社会福祉のためにもなる！
    se: hirameki
  - speaker: reimu
    text: 林は、見本のはがきに宣伝のポスター、賞品の案まで自分で作りました。
    reading: はやしわ みほんの はがきに せんでんの ぽすたー、しょうひんの あんまで じぶんで つくりました。
  - speaker: hayashi
    emotion: happy
    text: ポスターの案には、特賞50万円。1等は、ミシン！
  - speaker: reimu
    text: 林は大阪の郵政局で紹介状をもらい、7月に上京して郵政省へ向かいます。
    reading: はやしわ おおさかの ゆうせいきょくで しょうかいじょうお もらい、しちがつに じょうきょう して ゆうせいしょうえ むかいます。
# ---- 1949年：郵政審議会 ----
- id: ch2_shingikai
  title: 郵政審議会の反対
  background: ng_shingikai
  bgm: kinakusai
  stage:
  - {who: shingikai, x: 0.5, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1949年の夏。郵政審議会で、林の案が話し合われます。
    reading: せんきゅうひゃく よんじゅうくねんの なつ。ゆうせい しんぎかいで、はやしの あんが はなしあわれます。
  - speaker: shingikai
    emotion: thinking
    text: 面白い案だが日本は今、疲弊して食べるものも食べられない時代。
  - speaker: shingikai
    emotion: angry
    text: 送った相手にクジが当たるなんて……。
  - speaker: shingikai
    emotion: angry
    text: そんなのんびりしたことができる状態ではないでしょう。
    beat: true
  - speaker: reimu
    text: それでも曲折の末、くじ付きの年賀はがきが決まります。8月には、大阪で申込書ができていました。
    reading: それでも きょくせつの すえ、くじつきの ねんがはがきが きまります。はちがつにわ おおさかで もうしこみしょが できて いました。
  - speaker: reimu
    text: 郵政省の事情もありました。郵便は、戦争の痛手と利用の少なさで赤字に苦しんでいたのです。
    reading: ゆうせいしょうの じじょうも ありました。ゆうびんわ、せんそうの いたでと りようの すくなさで あかじに くるしんで いたのです。
  - speaker: reimu
    text: 郵便の量を増やす呼び水として、年賀状を勧めることにした。郵政博物館の紀要は、そう書いています。
    reading: ゆうびんの りょうお ふやす よびみずと して、ねんがじょうお すすめる ことに した。ゆうせい はくぶつかんの きようわ、そう かいて います。
    telops:
    - {text: "郵便の赤字を埋める呼び水", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
# ---- 1949年12月：発売と最初の抽せん会 ----
- id: ch2_chusen
  title: 最初の抽せん会
  background: ng_chusen
  bgm: you_and_me
  cuts:
  - speaker: reimu
    text: 1949年12月1日に発売。2円のはがき3000万枚と、寄付金1円付きの1億5000万枚でした。
    reading: せんきゅうひゃく よんじゅうくねん じゅうにがつ ついたちに はつばい。にえんの はがき さんぜんまんまいと、きふきん いちえんつきの いちおく ごせんまんまいでした。
  - speaker: reimu
    text: 郵政博物館の紀要によれば、世界で初めての、くじ付きの郵便物でした。
    reading: ゆうせい はくぶつかんの きように よれば、せかいで はじめての くじつきの ゆうびんぶつでした。
  - speaker: reimu
    text: 翌年1月20日、日比谷公会堂で最初の抽せん会。特等はミシン、1等は純毛の洋服地でした。
    reading: よくねん いちがつ はつか、ひびや こうかいどうで さいしょの ちゅうせんかい。とくとうわ みしん いっとうわ じゅんもうの ようふくじでした。
  - speaker: reimu
    text: 初年度の売れ行きは微々たるもので、林は売れ残りを買い取ったという話も残っています。
    reading: しょねんどの うれゆきわ びびたる もので、はやしわ うれのこりお かいとったと いう はなしも のこって います。
  - speaker: reimu
    text: 年賀状には、郵便の赤字を埋める呼び水の役目もありました。それが、75年後に裏返ります。
    reading: ねんがじょうにわ、ゆうびんの あかじお うめる よびみずの やくめも ありました。それが ななじゅうごねんごに うらがえります。
# ---- 全盛：1990年代の窓口 ----
- id: card1993
  title: ''
  background: ng_card_1993
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 1993年の春。ひとりの新人が、郵便局に入ります。
    reading: せんきゅうひゃく きゅうじゅうさんねんの はる。ひとりの しんじんが、ゆうびんきょくに はいります。
- id: ch3_madoguchi
  title: 年末の窓口
  background: ng_madoguchi
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 局員, emotion: happy}
  - {who: senpai, x: 0.56, emotion: normal}
  - {who: kyaku, x: 0.78, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1990年代の半ば、12月の窓口です。はがきは1994年から、1枚50円になっていました。
    reading: せんきゅうひゃく きゅうじゅうねんだいの なかば、じゅうにがつの まどぐちです。はがきわ せんきゅうひゃく きゅうじゅうよねんから いちまい ごじゅうえんに なって いました。
  - speaker: kyaku
    emotion: happy
    text: 年賀はがき、50枚ちょうだい。
  - speaker: zundamon
    emotion: happy
    text: はい！ 50枚で、2500円です！
  - speaker: kyaku
    emotion: happy
    text: 来年もよろしくね、新人さん。
  - speaker: zundamon
    emotion: happy
    text: 先輩、ボク窓口の才能があるかもしれません。さっきから売れて売れて！
  - speaker: senpai
    emotion: thinking
    text: お前が売ってるんじゃない。お客さんが、買いに来てるんだ。
    se: hammer
  - speaker: zundamon
    emotion: thinking
    text: ……同じじゃないんですか？
  - speaker: senpai
    emotion: normal
    text: そのうち分かる。
    beat: true
- id: ch3_kubun
  title: 元日に届ける仕組み
  background: ng_kubun
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 局員, emotion: surprised}
  - {who: senpai, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 12月の半ば。年賀状の受け付けが始まると、区分の作業場は箱で埋まります。
    reading: じゅうにがつの なかば。ねんがじょうの うけつけが はじまると、くぶんの さぎょうばわ はこで うまります。
  - speaker: zundamon
    emotion: surprised
    text: 先輩、箱が減りません！
  - speaker: senpai
    emotion: normal
    text: 年賀は12月のうちに預かって、元日の朝にまとめて届ける。
  - speaker: senpai
    emotion: normal
    text: 明治のころからの仕組みだ。
  - speaker: zundamon
    emotion: thinking
    text: 元日に届くのって、当たり前だと思ってました。
  - speaker: senpai
    emotion: happy
    text: 年が明けた朝に届くから、ありがたいんだよ。
  - speaker: zundamon
    emotion: happy
    text: 先輩！ この箱、全部入れ終わりました！
  - speaker: senpai
    emotion: thinking
    text: ……それ、隣の町の棚だ。
    beat: true
  - speaker: zundamon
    emotion: sad
    text: やり直しなのだ……。
  - speaker: reimu
    text: この作業場の箱が数えるほどになるのは、30年ほどあとのことです。
    reading: この さぎょうばの はこが かぞえるほどに なるのわ、さんじゅうねん ほど あとの ことです。
# ---- 全盛：過去最多の年 ----
