scenes:
- id: co_kaiken
  title: ''
  background: sg_kaiken
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 佐藤秀樹, emotion: thinking}
  - {who: kayama, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 2001年1月31日。東京で、セガがゲーム機の製造中止を発表します。
    reading: にせんいちねん いちがつ さんじゅういちにち。とうきょうで、せがが げーむきの せいぞう ちゅうしお はっぴょう します。
  - speaker: zundamon
    emotion: thinking
    text: 3月31日をもって、ドリームキャストの製造を打ち切ります。
  - speaker: zundamon
    emotion: sad
    text: ……尋常な状態では、ありません。
  - speaker: kayama
    emotion: sad
    text: 申し訳ないの[一言|ひとこと]しかない。
  - speaker: reimu
    text: この技術者は、佐藤秀樹。在庫は203万台。
    reading: この ぎじゅつしゃわ、さとう ひでき。ざいこわ にひゃくさんまんだい。
  - speaker: reimu
    text: 発売から2年あまりで、自分の作ったゲーム機を終わらせることになります。
    reading: はつばいから にねん あまりで、じぶんの つくった げーむきお おわらせる ことに なります。
- id: hook
  title: ''
  background: sg_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: ソニックの映画、3作とも見たのだ！
  - speaker: tsumugi
    emotion: normal
    text: あれ、もとはセガのゲームよ。
  - speaker: zundamon
    emotion: surprised
    text: セガって、ゲーム機も作ってたの？
  - speaker: tsumugi
    emotion: happy
    text: 押し入れの奥、見てごらん。
  - speaker: zundamon
    emotion: surprised
    text: 白いゲーム機が出てきた！
    background: sg_heya_dc
    se: jaan
  - speaker: tsumugi
    emotion: normal
    text: ドリームキャスト。セガ最後のゲーム機よ。
  - speaker: tsumugi
    emotion: thinking
    text: やめると報じられたら、株価が4日連続ストップ高。
    telops:
    - {text: "撤退報道で株価4日連続ストップ高", size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: やめるのに、なんで上がるの！？
- id: card1950
  title: ''
  background: sg_card_1950
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1950年。北海道の炭鉱町、芦別で、佐藤秀樹が生まれます。
    reading: せんきゅうひゃく ごじゅうねん。ほっかいどうの たんこうまち あしべつで、さとう ひできが うまれます。
  - speaker: reimu
    text: 父は製材所ののこぎりを研ぐ職人で、腕を買われては1、2年で引っ越します。
    reading: ちちわ せいざいじょの のこぎりお とぐ しょくにんで、うでお かわれてわ いちにねんで ひっこします。
  - speaker: reimu
    text: 転校をくり返したすえ、中学1年で一家は東京の八王子へ移りました。
    reading: てんこうお くりかえした すえ、ちゅうがく いちねんで いっかわ とうきょうの はちおうじえ うつりました。
  - speaker: reimu
    text: 高校では物理部でうそ発見器を作り、やがて都立工業短大の電気科へ進みます。
    reading: こうこうでわ ぶつりぶで うそ はっけんきお つくり、やがて とりつ こうぎょう たんだいの でんきかえ すすみます。
- id: card1971
  title: ''
  background: sg_card_1971
  cuts:
  - speaker: reimu
    text: 1971年3月の末。短大を出た佐藤には、まだ就職先がありません。
    reading: せんきゅうひゃく ななじゅういちねん さんがつの すえ。たんだいお でた さとうにわ、まだ しゅうしょくさきが ありません。
  - speaker: reimu
    text: アメリカで農業を学ぶ研修に応募し、面接で試験問題がなっとらんと言って落ちていたのです。
    reading: あめりかで のうぎょうお まなぶ けんしゅうに おうぼ し、めんせつで しけん もんだいが なっとらんと いって おちて いたのです。
- id: ch1_jinji
  title: 飛び込みの就職
  background: sg_kaisha70
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 佐藤秀樹, emotion: happy}
  - {who: jinji, x: 0.7, emotion: surprised}
  cuts:
  - speaker: jinji
    emotion: surprised
    text: 約束もなしに来て、就職したい？ もう3月の末だよ。
  - speaker: jinji
    emotion: normal
    text: 募集はとっくに終わって、こっちは入社式の準備だけだ。
  - speaker: zundamon
    emotion: normal
    text: 学校の先生にも、今ごろ来て何を言ってやがんだって怒られました。
  - speaker: jinji
    emotion: thinking
    text: だろうね。
  - speaker: zundamon
    emotion: normal
    text: スイッチを作る会社を紹介されたんですけど、つまんないって言っちゃって。
  - speaker: jinji
    emotion: surprised
    text: 紹介を、断ったの？
  - speaker: zundamon
    emotion: sad
    text: 先生は、もう知らんって。自分で探せって。
  - speaker: zundamon
    emotion: normal
    text: おもちゃの会社にも電話したら、もう締め切りでした。
  - speaker: jinji
    emotion: thinking
    text: それで、うちに来たと。
  - speaker: zundamon
    emotion: happy
    text: セガは、金曜が半ドンで土日が休み。給料も3万2000円。
  - speaker: zundamon
    emotion: happy
    text: しかも学校のある[鮫洲|さめず]から、電車ですぐなんです。
  - speaker: jinji
    emotion: thinking
    text: ……選んだ理由が、全部ゆるいな。
    beat: true
  - speaker: jinji
    emotion: normal
    text: 学校は？
  - speaker: zundamon
    emotion: normal
    text: 都立の短大です。
  - speaker: jinji
    emotion: happy
    text: 都立か。ぼくも都立大の出なんだ。
  - speaker: zundamon
    emotion: happy
    text: じゃあ、会社の中を案内してもらえますか。
  - speaker: jinji
    emotion: surprised
    text: 入る前から、見学するのかい。
  - speaker: jinji
    emotion: happy
    text: ……まあいいか。ちょうど暇だしな。
  - speaker: jinji
    emotion: normal
    text: 工場から開発まで、ひと通り見せたけど。どうだった？
  - speaker: zundamon
    emotion: happy
    text: 開発か生産技術部だったら、入ってもいいです。
  - speaker: jinji
    emotion: surprised
    text: 入っても、いい？
    se: zukko
  - speaker: jinji
    emotion: thinking
    text: ……開発は3人募集して、2人しか来なかったんだ。部長と話してきて。
- id: ch1_mensetsu
  title: ''
  background: sg_kaisha70
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 佐藤秀樹, emotion: normal}
  - {who: buchou, x: 0.7, emotion: normal}
  cuts:
  - speaker: buchou
    emotion: normal
    text: 佐藤君。入っても、すぐには開発の仕事はできないよ。
  - speaker: buchou
    emotion: normal
    text: 最初は鉄板を曲げたり穴を開けたり、木を切ったりだ。
  - speaker: zundamon
    emotion: happy
    text: 嫌いじゃないです。昔から、プラモデルが好きなんです。
  - speaker: buchou
    emotion: happy
    text: そうか。じゃあ、人事に戻ってくれ。
- id: ch1_saiyo
  title: ''
  background: sg_kaisha70
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 佐藤秀樹, emotion: happy}
  - {who: jinji, x: 0.7, emotion: happy}
  cuts:
  - speaker: jinji
    emotion: happy
    text: 部長から電話があったよ。採用だ。
  - speaker: zundamon
    emotion: happy
    text: やったのだ！
  - speaker: jinji
    emotion: normal
    text: じゃあ、成績証明書を出して。
  - speaker: zundamon
    emotion: thinking
    text: 持ってきてません。
  - speaker: jinji
    emotion: thinking
    text: 健康診断書は？
  - speaker: zundamon
    emotion: thinking
    text: 受けてません。
  - speaker: zundamon
    emotion: surprised
    text: ……書類も試験も無しで、入れちゃったのだ。
    beat: true
  - speaker: reimu
    text: 1971年4月。佐藤はセガの開発部に入ります。当時のセガは、アメリカ資本の会社でした。
    reading: せんきゅうひゃく ななじゅういちねん しがつ。さとうわ せがの かいはつぶに はいります。とうじの せがわ、あめりか しほんの かいしゃでした。
- id: ch1_kousaku
  title: 最初の仕事は金具
  background: sg_kaihatsu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 佐藤秀樹, emotion: normal}
  - {who: kenkyu, x: 0.56, emotion: normal}
  - {who: kanri, x: 0.8, emotion: normal}
  cuts:
  - speaker: kenkyu
    emotion: normal
    text: 佐藤くん、ちょうどいい。ドライブゲームの金具だ、図面どおりに作ってくれ。
  - speaker: zundamon
    emotion: normal
    text: はい。これ、どこが一番大事なんですか？
  - speaker: kenkyu
    emotion: normal
    text: チェーンに留める穴の間隔。そこがずれると、はまらない。
  - speaker: zundamon
    emotion: normal
    text: 幅のほうは？
  - speaker: kenkyu
    emotion: happy
    text: 模型の車を乗せるだけだ。2、3ミリずれても構わん。
  - speaker: kanri
    emotion: surprised
    text: おい佐藤。もうできたのか。
  - speaker: kanri
    emotion: angry
    text: ……10センチのはずが、10.5センチあるぞ。やり直しだ。
  - speaker: zundamon
    emotion: happy
    text: いいんです、そこは。大事なのは穴の間隔だけです。
  - speaker: kanri
    emotion: angry
    text: んなわけあるか！ 聞いてくる！
  - speaker: kanri
    emotion: thinking
    text: ……いいって言ってたわ。
    se: hammer
  - speaker: kanri
    emotion: happy
    text: おまえ、手の抜きどころが分かってるな。
  - speaker: zundamon
    emotion: happy
    text: 決めるところだけ、決めるのだ。
  - speaker: reimu
    text: やがて佐藤は、リレーで動くピンボールの電気回路を任されます。
    reading: やがて さとうわ、りれーで うごく ぴんぼーるの でんき かいろお まかされます。
- id: card1973
  title: ''
  background: sg_card_1973
  cuts:
  - speaker: reimu
    text: 1973年ごろ。セガの開発に、テレビの画面で遊ぶピンポンのゲームがやってきます。
    reading: せんきゅうひゃく ななじゅうさんねん ごろ。せがの かいはつに、てれびの がめんで あそぶ ぴんぽんの げーむが やって きます。
- id: ch1_pong
  title: テレビで遊ぶ
  background: sg_kaihatsu
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 佐藤秀樹, emotion: thinking}
  - {who: douryo, x: 0.7, emotion: happy}
  cuts:
  - speaker: douryo
    emotion: happy
    text: 佐藤、これやってみろよ。テレビの中で、球を打ち返すんだ。
  - speaker: zundamon
    emotion: thinking
    text: テレビって、番組を見るものだろ。
  - speaker: douryo
    emotion: normal
    text: いいから、つまみを回してみろって。
  - speaker: zundamon
    emotion: surprised
    text: ……あ、返した。また来た。だんだん速くなる！
  - speaker: zundamon
    emotion: happy
    text: たかがピンポンなのに、めちゃくちゃ面白い！
  - speaker: douryo
    emotion: normal
    text: 中の基板、見たか？ 見たことない部品がびっしりだ。
  - speaker: zundamon
    emotion: thinking
    text: IC……。番号しか書いてないぞ。
  - speaker: reimu
    text: 佐藤は、アメリカの半導体会社が出した、黄色いデータブックを読み込みます。
    reading: さとうわ あめりかの はんどうたい がいしゃが だした、きいろい でーたぶっくお よみこみます。
  - speaker: zundamon
    emotion: thinking
    text: リレーを直列につなげば[AND|アンド]、並列なら[OR|オア]……。
  - speaker: zundamon
    emotion: surprised
    text: ICも同じだ。しかも、ずっと使いやすいのだ！
    se: hirameki
  - speaker: douryo
    emotion: surprised
    text: もう分かったのか。
  - speaker: zundamon
    emotion: happy
    text: リレーの回路なら、毎日[組んでた|くんでた]からな。
  - speaker: reimu
    text: テレビのゲームが開発の中心になり、1976年には佐藤が回路を工夫したレースゲームも出ます。
    reading: てれびの げーむが かいはつの ちゅうしんに なり、せんきゅうひゃく ななじゅうろくねんにわ さとうが かいろお くふうした れーすげーむも でます。
- id: ch2_sc3000
  title: 3万円のパソコン
  background: sg_kaihatsu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 佐藤秀樹, emotion: normal}
  - {who: kyoryoku, x: 0.56, emotion: happy}
  - {who: douryo, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1980年代のはじめ。セガはフォスター電機と組み、家で使う安いパソコンを作ります。
    reading: せんきゅうひゃく はちじゅうねんだいの はじめ。せがわ ふぉすたー でんきと くみ、いえで つかう やすい ぱそこんお つくります。
  - speaker: kyoryoku
    emotion: happy
    text: 佐藤さん、試作の基板です。
  - speaker: zundamon
    emotion: surprised
    text: '[何|なん]だこれは。ホッチキスだらけじゃないか！'
  - speaker: kyoryoku
    emotion: normal
    text: 片面だけの、紙の基板です。線がぶつかる所だけ、ホッチキスで飛ばします。
  - speaker: zundamon
    emotion: thinking
    text: うちはずっと、ガラスエポキシの両面基板なんだけど……。
  - speaker: kyoryoku
    emotion: happy
    text: 両面より、ずっと安くできますよ。
  - speaker: zundamon
    emotion: thinking
    text: ……安い。悔しいけど、安い。
    beat: true
  - speaker: reimu
    text: 2万9800円のパソコン、SC-3000の誕生です。
    reading: にまん きゅうせん はっぴゃくえんの ぱそこん、えすしー さんぜんの たんじょうです。
  - speaker: douryo
    emotion: thinking
    text: 3000って、[何|なん]の数字だ？
  - speaker: zundamon
    emotion: happy
    text: 値段が3万円くらいだから、3000。
  - speaker: douryo
    emotion: thinking
    text: 決め方が、ざっくりすぎるだろ。
    beat: true
  - speaker: zundamon
    emotion: surprised
    text: 任天堂の人に、[ゲーム&ウオッチ|ゲームアンドウオッチ]の数を聞いてきた。10万個くらいかと思ったら……
  - speaker: douryo
    emotion: thinking
    text: 何個だって？
  - speaker: zundamon
    emotion: surprised
    text: 500万個だって。
  - speaker: douryo
    emotion: surprised
    text: 500万！？ 家で遊ぶ物は、桁が違うな。
  - speaker: douryo
    emotion: surprised
    text: 佐藤、任天堂がテレビにつなぐゲーム機を出すらしいぞ。
  - speaker: zundamon
    emotion: thinking
    text: ゲームだけなら……[SC-3000|エスシーさんぜん]から、キーボードを取ってしまえばいい。
  - speaker: zundamon
    emotion: happy
    text: カートリッジを挿せば、ゲームは動くんだから。
  - speaker: douryo
    emotion: surprised
    text: 引き算で、ゲーム機を作るのか。
  - speaker: reimu
    text: アメリカの経営陣はアタリショックの後で反対しましたが、中山隼雄が説き伏せます。
    reading: あめりかの けいえいじんわ あたり しょっくの あとで はんたい しましたが、なかやま はやおが ときふせます。
  - speaker: reimu
    text: 名前のGは、ゲーム。こうしてSG-1000が生まれました。
    reading: なまえの じーわ、げーむ。こうして えすじー せんが うまれました。
- id: card1983
