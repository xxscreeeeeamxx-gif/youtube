  - speaker: reimu
    text: チップはサミーのパチスロ北斗の拳に使われ、売った数はおよそ150万個でした。
    reading: ちっぷわ さみーの ぱちすろ ほくとの けんに つかわれ、うった かずわ およそ ひゃくごじゅうまんこでした。
- id: ch16_sushi
  title: ''
  background: sg_sushi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 佐藤秀樹, emotion: normal}
  - {who: sushiten, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
    text: ドリームキャストの基板は、回転寿司の注文用の画面にも使われました。
    reading: どりーむきゃすとの きばんわ、かいてんずしの ちゅうもんようの がめんにも つかわれました。
  - speaker: sushiten
    emotion: sad
    text: セガさん。注文の画面が、また動かないんです。
  - speaker: zundamon
    emotion: thinking
    text: おかしいな。中のディスクのドライブが、やられてる……。
  - speaker: sushiten
    emotion: thinking
    text: 原因、分かりました？
  - speaker: zundamon
    emotion: surprised
    text: '[酢|す]です。お寿司の[酢|す]の成分で、[GD-ROM|ジーディーロム]が壊れてます。'
    background: sg_sushi_kowareta
  - speaker: sushiten
    emotion: surprised
    text: ……寿司屋で、[酢|す]を使うなと言われても。
    se: oti
- id: ch16_sonic
  title: 他社のゲーム機へ
  background: sg_kaihatsu_mega
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 佐藤秀樹, emotion: happy}
  - {who: eigyo, x: 0.7, emotion: happy}
  cuts:
  - speaker: eigyo
    emotion: happy
    text: 社長。ソニックの新作は、任天堂のゲームキューブに出ます。
  - speaker: zundamon
    emotion: happy
    text: ずっと戦ってきた相手なのにな。
  - speaker: eigyo
    emotion: happy
    text: ソニックが、よその家へ遊びに行くみたいですね。
  - speaker: zundamon
    emotion: happy
    text: 速いハリネズミは、どの家でも走れるのだ。
  - speaker: reimu
    text: 2001年12月20日に出たソニックアドベンチャー2バトルは、250万本以上売れました。
    reading: にせんいちねん じゅうにがつ はつかに でた そにっく あどべんちゃー つー ばとるわ、にひゃく ごじゅうまんぼん いじょう うれました。
  - speaker: reimu
    text: 2002年3月期、営業利益は142億円の黒字に。ドリームキャストの在庫も売り切りました。
    reading: にせんにねん さんがつき、えいぎょう りえきわ ひゃく よんじゅうにおくえんの くろじに。どりーむきゃすとの ざいこも うりきりました。
  - speaker: zundamon
    emotion: happy
    text: 203万台、全部いなくなったか。
  - speaker: eigyo
    emotion: happy
    text: 社長。黒字の数字を見て、泣いてます？
  - speaker: zundamon
    emotion: surprised
    text: 泣いてない。目にほこりが入っただけだ。
    beat: true
  - speaker: reimu
    text: 2003年に佐藤は会長へ移り、2004年にはセガサミーホールディングスが生まれます。
    reading: にせんさんねんに さとうわ かいちょうえ うつり、にせんよねんにわ せがさみー ほーるでぃんぐすが うまれます。
- id: ch17_ronso
  title: 本当の敗因
  background: sg_heya_dc
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、ネットで見たのだ。会長が、ビル・ゲイツに[直談判|じかだんぱん]したって！
  - speaker: tsumugi
    emotion: normal
    text: その場面を確かめられる資料は、見つからないの。
  - speaker: tsumugi
    emotion: normal
    text: 確かなのは、喧嘩したり手を握ったりという大川さん本人の言葉。
  - speaker: tsumugi
    emotion: thinking
    text: それと、マイクロソフトが[Xbox|エックスボックス]の前にセガの買収を考えてたという証言ね。
  - speaker: zundamon
    emotion: surprised
    text: 買収！？ セガが、買われそうだったの！？
  - speaker: tsumugi
    emotion: normal
    text: 考えた、という元幹部の話よ。[直談判|じかだんぱん]とは別の話。
  - speaker: tsumugi
    emotion: normal
    text: ドリームキャストがウィンドウズCEを載せられたのは、本当だけどね。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、負けた本当の理由は[何|なん]なの？
  - speaker: tsumugi
    emotion: normal
    text: 一つじゃないわ。まず、サターンで信用をなくしたこと。
  - speaker: tsumugi
    emotion: normal
    text: 1台売るごとに損が出るから、出荷を絞った。
  - speaker: tsumugi
    emotion: thinking
    text: それを見て、お店もソフト会社も離れていったの。
  - speaker: zundamon
    emotion: sad
    text: '[貧すれば鈍する|ひんすればどんする]、だったのだ。'
  - speaker: tsumugi
    emotion: normal
    text: 次に、品切れ。ウエハー1枚から、チップが5個から10個。
  - speaker: tsumugi
    emotion: normal
    text: 数がそろったときには、お客さんの関心が薄れていたとセガの人も振り返ってる。
  - speaker: zundamon
    emotion: thinking
    text: 年末に、並べられなかったから……。
  - speaker: tsumugi
    emotion: normal
    text: 最初のソフトは4本だけ。大作のシェンムーは、延期を重ねて1999年の暮れ。
  - speaker: tsumugi
    emotion: thinking
    text: そこへDVDも見られて昔のソフトも遊べる[PS2|ピーエスツー]が、3万9800円。
  - speaker: zundamon
    emotion: sad
    text: ドリームキャストは、DVDが見られない。
  - speaker: tsumugi
    emotion: normal
    text: 独自の[GD-ROM|ジーディーロム]っていう、1ギガバイトのディスクだったの。
  - speaker: tsumugi
    emotion: normal
    text: それに当時の日本は、つないだ時間だけお[金|かね]がかかるネットだった。
  - speaker: zundamon
    emotion: surprised
    text: 自慢のネットが、高くついたのか。
  - speaker: tsumugi
    emotion: thinking
    text: 根っこにあったのは、売るほど赤字になる形とお[金|かね]の体力。
  - speaker: tsumugi
    emotion: normal
    text: 赤字は4期続いて、手元の現預金は約200億円だったわ。
  - speaker: zundamon
    emotion: thinking
    text: 値下げすればするほど、苦しくなる……。
  - speaker: tsumugi
    emotion: normal
    text: ハードとソフトの釣り合いを保つのが難しいと、セガ自身も説明してるわ。
  - speaker: zundamon
    emotion: surprised
    text: だからソフトに絞るって聞いて、株が上がったのか！
  - speaker: tsumugi
    emotion: happy
    text: そういうこと。[直談判|じかだんぱん]の噂より、数字のほうがずっと多くを語ってるのよ。
  - speaker: zundamon
    emotion: thinking
    text: ネットの噂より、決算書のほうが面白いなんて……。
  - speaker: tsumugi
    emotion: thinking
    text: 決算書は、話を盛ると捕まるからね。
    se: tsukkomi
- id: ch18_gendai
  title: 今も走るハリネズミ
  background: sg_eigakan
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: ゲーム機をやめたセガは、ソフトの会社として続いたの。
  - speaker: tsumugi
    emotion: happy
    text: ソニックの映画は3作で、世界の興行収入が10億ドルを超えたわ。
  - speaker: zundamon
    emotion: happy
    text: ボクが見た3作なのだ！
  - speaker: tsumugi
    emotion: normal
    text: 4作目は、2027年3月にアメリカで公開の予定よ。
  - speaker: tsumugi
    emotion: normal
    text: それに、[龍が如く|りゅうがごとく]のシリーズは累計2770万本。2024年にはドラマにもなったわ。
  - speaker: zundamon
    emotion: surprised
    text: 2770万本！ ドリームキャストの台数より、ずっと多い。
  - speaker: tsumugi
    emotion: normal
    text: ゲーム機のほうは、世界でおよそ913万台だったわね。
- id: ch18_net
  title: ''
  background: sg_gendai
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: ドリームキャストには、最初から電話線につなぐモデムが入ってた。
  - speaker: tsumugi
    emotion: normal
    text: ネットのぐるぐる温泉には、2000年8月までにのべ220万人が集まったの。
  - speaker: zundamon
    emotion: surprised
    text: 今なら当たり前のネットの遊びを、1998年に箱に入れてたのか。
  - speaker: tsumugi
    emotion: thinking
    text: 少し、早すぎたのかもしれないわね。
  - speaker: zundamon
    emotion: thinking
    text: 会長がいなかったら、セガはどうなってたのかな。
  - speaker: tsumugi
    emotion: normal
    text: セガのクリエイターだった[小玉理恵子|こだまりえこ]さんは、2019年にこう[話してる|はなしてる]。
  - speaker: tsumugi
    emotion: normal
    text: 大川さんがいなかったら、たぶんセガという会社はないはずです。
  - speaker: reimu
    text: 佐藤秀樹は、2026年2月13日に亡くなりました。75歳でした。
    reading: さとう ひできわ、にせん にじゅうろくねん にがつ じゅうさんにちに なくなりました。ななじゅうごさいでした。
- id: shime
  title: ''
  background: sg_heya_dc
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 押し入れのゲーム機、捨てる前に一度だけ電源を入れてみて。
  - speaker: zundamon
    emotion: happy
    text: 入れてみる！ ……あ、起動の音が鳴った！
  - speaker: tsumugi
    emotion: happy
    text: その音を作ったのは、[坂本龍一|さかもとりゅういち]さんよ。
  - speaker: zundamon
    emotion: surprised
    text: こんなに短い音に、そんなすごい人が……。
  - speaker: zundamon
    emotion: happy
    text: よし。映画の4作目まで、このゲーム機で遊んで待つのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 2027年まで、ずっと押し入れの前にいる気？
    se: oti
  - speaker: tsumugi
    emotion: thinking
    text: 佐藤さんは、自分で育てたゲーム機を自分で弔うと言ったけど。
  - speaker: tsumugi
    emotion: normal
    text: ネットで遊ぶこともソニックも、今は当たり前になったわね。
  - speaker: zundamon
    emotion: happy
    text: 弔ったあとも、ちゃんと走ってるのだ。
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
