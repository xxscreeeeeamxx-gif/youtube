meta:
  title: ドリームキャスト、在庫203万台で撤退　作った本人が幕を引いた日【ずんだもん解説】
  slug: sega-dreamcast
  summary: 押し入れから出てきた白いゲーム機、ドリームキャスト。作ったのは、就職先が決まらないまま、飛び込みでセガに入った技術者、佐藤秀樹でした。テレビで遊ぶピンポンに衝撃を受け、ファミコンと同じ日にゲーム機を出し、やがて世界を相手にします。しかし1998年、セガは新聞の一面で自らに問いかけるほど追い込まれていました。ゲーム機をやめると報じられた日、なぜ株価は上がったのか。再現ドラマでたどります。
  tags:
