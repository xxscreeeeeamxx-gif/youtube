scenes:
- id: hook
  title: ''
  background: wm_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、見るのだ。歩きながら、好きな音楽を聴いてるのだ。
  - speaker: tsumugi
    emotion: normal
    text: イヤホンね。今は、当たり前の光景よ。
  - speaker: zundamon
    emotion: thinking
    text: 当たり前じゃなかった時代が、あるのだ？
  - speaker: tsumugi
    emotion: normal
    text: 昔は、いい音はスピーカーで聴くもの。
  - speaker: tsumugi
    emotion: normal
    text: 外なら、ラジオやラジカセくらいだったの。
  - speaker: zundamon
    emotion: surprised
    text: 歩きながらステレオは、無理だったのだ？
  - speaker: tsumugi
    emotion: normal
    text: 1979年に、それを変えた機械が出たの。
  - speaker: reimu
    text: ウォークマン。カセットテープを聴くためだけの、小さな機械です。
    reading: うぉーくまん。かせっとてーぷお きく ためだけの ちいさな きかいです。
  - speaker: reimu
    text: 録音はできません。スピーカーも付いていません。
    reading: ろくおんわ できません。すぴーかーも ついていません。
  - speaker: zundamon
    emotion: surprised
    text: 録音もできないテレコなんて、売れるのだ？
  - speaker: tsumugi
    emotion: thinking
    text: 社内でも、そう言われたわ。売れるはずがない、って。
  - speaker: reimu
    text: 発売した月に売れたのは、約3000台でした。
    reading: はつばい した つきに うれたのわ やく さんぜんだいでした。
  - speaker: reimu
    text: ここから、全部の型を合わせて、およそ4億台が売れていきます。
    reading: ここから ぜんぶの かたお あわせて およそ よんおくだいが うれて いきます。
  - speaker: zundamon
    emotion: surprised
    text: 3000台から、4億台なのだ！？
  - speaker: tsumugi
    emotion: normal
    text: きっかけは、ある名誉会長の、ちょっとした頼みごとだったの。
- id: card1978
  title: ''
  background: wm_card_1978
  cuts:
  - speaker: reimu
    text: 1978年。ソニーの名誉会長、井深大は70歳でした。
    reading: せんきゅうひゃく ななじゅうはちねん。そにーの めいよ かいちょう いぶか まさるわ ななじゅっさいでした。
- id: ch0_kinai
  title: 出張のお供
  background: wm_kinai
  bgm: hirusagari
  stage:
  - {who: ibuka, x: 0.3, flip: true, emotion: normal}
  cuts:
  - speaker: reimu
    text: 井深の楽しみは、海外への出張の機内で、ヘッドホンで音楽を聴くことでした。
    reading: いぶかの たのしみわ かいがいえの しゅっちょうの きないで、へっどほんで おんがくお きく ことでした。
  - speaker: reimu
    text: 愛用していたのは、その年に出たばかりの、TC-D5という録音機。10万円前後する、本格的な機械です。
    reading: あいよう していたのわ その としに でたばかりの てぃーしー でぃーふぁいぶと いう ろくおんき。じゅうまんえん ぜんご する ほんかくてきな きかいです。
  - speaker: ibuka
    emotion: happy
    text: うん、いい音だ。
  - speaker: ibuka
    emotion: sad
    text: ……だが、重くてかなわない。
  - speaker: ibuka
    emotion: thinking
    text: 音楽を聴くだけなら、録音の仕掛けなど、いらんのだがなあ。
- id: ch0_ooga
  title: ''
  background: wm_yakuin0
  bgm: hirusagari
  stage:
  - {who: ibuka, x: 0.28, flip: true, emotion: normal}
  - {who: ooga, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 次の出張の前、井深は副社長の大賀典雄に声をかけます。
    reading: つぎの しゅっちょうの まえ いぶかわ ふくしゃちょうの おおが のりおに こえお かけます。
  - speaker: ibuka
    emotion: normal
    text: 大賀くん。また出張なんだが。
  - speaker: ibuka
    emotion: happy
    text: プレスマンに、再生だけでいいから、ステレオ回路を入れたのを作ってくれんかな。
  - speaker: reimu
    text: プレスマンは、同じ年に出た、手のひらほどのモノラルの小型録音機です。
    reading: ぷれすまんわ おなじ としに でた てのひらほどの ものらるの こがた ろくおんきです。
  - speaker: ooga
    emotion: happy
    text: 分かりました。テープレコーダーの事業部に、頼んでみましょう。
  - speaker: reimu
    text: 大賀が電話をかけると、事業部長の大曽根幸三は、二つ返事で引き受けました。
    reading: おおがが でんわお かけると、じぎょうぶちょうの おおそね こうぞうわ ふたつへんじで ひきうけました。
- id: ch1_kaizou
  title: 大きなヘッドホン
  background: wm_koba
  bgm: pop
  stage:
  - {who: gishi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: プレスマンから録音の機能を外し、ステレオで再生できるように作り替えます。
    reading: ぷれすまんから ろくおんの きのうお はずし、すてれおで さいせい できるように つくりかえます。
  - speaker: gishi
    emotion: thinking
    text: 録音の回路とスピーカーを外せば、ステレオの回路が入るぞ。
  - speaker: reimu
    text: ヘッドホンは、有り合わせの大きなものを付けました。
    reading: へっどほんわ ありあわせの おおきな ものお つけました。
  - speaker: gishi
    emotion: happy
    text: 大きなヘッドホンを付けた、小さなプレスマンの出来上がりだ。
- id: ch1_shibaura
  title: ''
  background: wm_koba
  bgm: pop
  stage:
  - {who: ibuka, x: 0.28, flip: true, emotion: normal}
  - {who: gishi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1978年10月ごろ。井深が、芝浦の職場にふらりと現れます。
    reading: せんきゅうひゃく ななじゅうはちねん じゅうがつごろ。いぶかが しばうらの しょくばに ふらりと あらわれます。
  - speaker: ibuka
    emotion: normal
    text: 大賀くんに頼んでおいたけれど、連中、やってくれているかな。
  - speaker: ibuka
    emotion: happy
    text: おっ、これか。どれ、聴かせてもらおう。
  - speaker: ibuka
    emotion: surprised
    text: ほー。小さいくせに、良い音が出るじゃないか。
  - speaker: ibuka
    emotion: happy
    text: 本当に良い音を聴くには、無駄なく音を再現するヘッドホンがいいんだよなあ。
  - speaker: reimu
    text: 井深は、1952年にアメリカで、ヘッドホンで立体的な録音を聴いたときの感動を、思い出していました。
    reading: いぶかわ せんきゅうひゃく ごじゅうにねんに あめりかで へっどほんで りったいてきな ろくおんお きいた ときの かんどうお、おもいだしていました。
- id: ch1_denchi
  title: ''
  background: wm_akiba
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: この試作機には、こんな[話|はなし]も残ってるの。
  - speaker: tsumugi
    emotion: normal
    text: 動かすのに、特殊な電池が2個必要だったのね。
  - speaker: tsumugi
    emotion: normal
    text: 部員が[秋葉原中|あきはばらじゅう]を走り回って、やっと手に入れたそうよ。
  - speaker: zundamon
    emotion: happy
    text: 井深さんの出張に、間に合ったのだ。
  - speaker: tsumugi
    emotion: thinking
    text: ところが出張先の井深から、連絡が届いたの。
  - speaker: tsumugi
    emotion: normal
    text: 聴いている途中で電池が切れて、こちらで探したけど見つからなかったよ、って。
  - speaker: zundamon
    emotion: sad
    text: 秋葉原での苦労が……。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: みんな、がっかりしたそうよ。
- id: ch2_morita
  title: 歩きながら聴けたら
  background: wm_yakuin
  bgm: you_and_me
  stage:
  - {who: ibuka, x: 0.28, flip: true, emotion: happy}
  - {who: zundamon, x: 0.7, tag: 盛田昭夫, emotion: normal}
  cuts:
  - speaker: reimu
    text: 井深は、大きなヘッドホンを付けた試作機を、盛田昭夫の部屋へ持って行きます。
    reading: いぶかわ おおきな へっどほんお つけた しさくきお、もりた あきおの へやえ もっていきます。
  - speaker: zundamon
    emotion: surprised
    text: 井深さん。そのヘッドホンは、[何|なん]なのだ？
  - speaker: ibuka
    emotion: happy
    text: 盛田くん。これ、聴いてみてくれんかね。
  - speaker: ibuka
    emotion: normal
    text: 歩きながら聴ける、ステレオのカセットプレーヤーがあったら、いいと思うんだが。
  - speaker: zundamon
    emotion: thinking
    text: ……週末に、家でじっくり試してみるのだ。
  - speaker: reimu
    text: 盛田は当時57歳。井深とソニーを興した、もう一人の創業者です。
    reading: もりたわ とうじ ごじゅうななさい。いぶかと そにーお おこした もう ひとりの そうぎょうしゃです。
- id: ch2_jitaku
  title: ''
  background: wm_jitaku0
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.3, flip: true, tag: 盛田昭夫, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 確かに、スピーカーで聴くのとは、違った良さがあるのだ。
  - speaker: reimu
    text: 盛田の家でも、子どもたちは帰るとまず、ステレオのスイッチを入れていました。
    reading: もりたの いえでも こどもたちわ かえると まず、すてれおの すいっちお いれていました。
  - speaker: zundamon
    emotion: thinking
    text: '[1日中|いちにちじゅう]、音楽を楽しんでいたい若者が、たくさんいるのだ。'
  - speaker: zundamon
    emotion: happy
    text: これは、ひょっとすると、ひょっとするのだ！
- id: card1979
  title: ''
  background: wm_card_1979
  cuts:
  - speaker: reimu
    text: 1979年2月。盛田は、若手の社員たちを本社の会議室に集めます。
    reading: せんきゅうひゃく ななじゅうくねん にがつ。もりたわ わかての しゃいんたちお ほんしゃの かいぎしつに あつめます。
- id: ch3_kaigi
  title: 録音できないテレコ
  background: wm_kaigi
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 盛田昭夫, emotion: normal}
  - {who: gishi2, x: 0.7, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: この製品は、[1日中|いちにちじゅう]音楽を楽しんでいたい、若者の願いを満たすものなのだ。
  - speaker: zundamon
    emotion: happy
    text: 音楽を、外へ持って出られるのだ。録音機能は、いらないのだ。
  - speaker: gishi2
    emotion: thinking
    text: 再生専用機なんて、聞いたことがありません。
  - speaker: gishi2
    emotion: sad
    text: 録音機能が付いていないと、絶対に売れませんよ。
  - speaker: zundamon
    emotion: normal
    text: 録音できないカーステレオを、何百万人もが買っているのだ。
  - speaker: zundamon
    emotion: thinking
    text: 自分のクビをかけてでも、やる決意なのだ。
  - speaker: zundamon
    emotion: happy
    text: 若者、つまり学生が相手だから、夏休みの前に発売するのだ。
  - speaker: reimu
    text: 当時の慣例では、発売日は21日。6月21日なら、残りは正味4か月です。
    reading: とうじの かんれいでわ はつばいびわ にじゅういちにち。ろくがつ にじゅういちにちなら のこりわ しょうみ よんかげつです。
  - speaker: gishi2
    emotion: thinking
    text: ……困難ですが、不可能ではありません。
  - speaker: gishi2
    emotion: happy
    text: やってみましょう。
  - speaker: reimu
    text: 出席者は難色を示しながらも、心のどこかで、使ってみたいと思っていたといいます。
    reading: しゅっせきしゃわ なんしょくお しめしながらも、こころの どこかで つかってみたいと おもっていたと いいます。
- id: ch3_kakaku
  title: 33周年で3万3000円
  background: wm_kaigi
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 盛田昭夫, emotion: normal}
  - {who: eigyo, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: 値段は、プレスマンと同じくらい。4万円を切るつもりでいくのだ。
  - speaker: eigyo
    emotion: normal
    text: 実売で3万円を切るなら、売れます。
  - speaker: reimu
    text: ところが、かかるお金から考えると、4万8000円は必要でした。
    reading: ところが かかる おかねから かんがえると よんまん はっせんえんわ ひつようでした。
  - speaker: eigyo
    emotion: thinking
    text: 無理を承知で、3万5000円でどうでしょう。
  - speaker: zundamon
    emotion: thinking
    text: 今年は、ソニーの創立33周年なのだ。
  - speaker: zundamon
    emotion: happy
    text: 価格も、3万3000円でいくのだ！
  - speaker: eigyo
    emotion: thinking
    text: ……それで、最初は何台作りますか？
  - speaker: zundamon
    emotion: normal
    text: 3万台なのだ。
  - speaker: eigyo
    emotion: surprised
    text: 一番売れているテレコでも、月に1万5000台ですよ！
- id: ch3_nedan
  title: ''
  background: wm_zukai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 3万3000円は、当時の大学卒の初任給の、3割くらいよ。
  - speaker: tsumugi
    emotion: thinking
    text: 今の初任給で考えると、8万円前後の感覚ね。
  - speaker: zundamon
    emotion: thinking
    text: 高いけど、手が届かないほどじゃないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 井深の録音機は、10万円前後だったから、その3分の1ね。
  - speaker: zundamon
    emotion: happy
    text: 学生でも、がんばれば買える値段なのだ。
- id: ch4_headphone
  title: 50グラムのヘッドホン
  background: wm_yakuin
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 盛田昭夫, emotion: thinking}
  - {who: ibuka, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 本体より大きいヘッドホンが付いていては、スマートじゃないのだ。
  - speaker: ibuka
    emotion: thinking
    text: そういえば、2、3か月前に聞いたぞ。
  - speaker: ibuka
    emotion: thinking
    text: 研究所で、軽いヘッドホンを作っているそうだ。
  - speaker: zundamon
    emotion: happy
    text: すぐ、一緒にやらせるのだ！
  - speaker: reimu
    text: 1979年3月。研究所で別に作られていたヘッドホンが、合流します。
    reading: せんきゅうひゃく ななじゅうくねん さんがつ。けんきゅうじょで べつに つくられていた へっどほんが ごうりゅう します。
- id: ch4_zukai
  title: ''
  background: wm_zukai2
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: それまでのヘッドホンは、重さが300から400グラム。
  - speaker: tsumugi
    emotion: normal
    text: 新しいヘッドホンは、たったの50グラムだったの。
  - speaker: zundamon
    emotion: surprised
    text: 6分の1から、8分の1なのだ！
  - speaker: tsumugi
    emotion: normal
    text: 音を出す部品も、直径56ミリくらいから、23ミリに小さくしたの。
  - speaker: tsumugi
    emotion: normal
    text: 名前は、[H・AIR|ヘアー]。髪のように、空気のように軽い、という意味よ。
  - speaker: tsumugi
    emotion: happy
    text: 開発の合言葉は、ゼロフィット、だったんですって。
  - speaker: zundamon
    emotion: happy
    text: これなら、頭に乗せて歩いても疲れないのだ。
- id: ch5_eiyatsu
  title: えいやっ
  background: wm_koba
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 盛田昭夫, emotion: normal}
  - {who: osone, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 作るのは、大曽根の事業部です。発売まで、3か月ほどしかありません。
    reading: つくるのわ おおそねの じぎょうぶです。はつばいまで さんかげつほどしか ありません。
  - speaker: zundamon
    emotion: normal
