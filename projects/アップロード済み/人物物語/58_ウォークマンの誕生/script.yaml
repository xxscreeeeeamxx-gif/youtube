  - speaker: reimu
    text: 日本に来た外国の人や客室乗務員が、お土産に買って帰り、その名前が先に広まっていたのです。
    reading: にほんに きた がいこくの ひとや きゃくしつ じょうむいんが おみやげに かって かえり、その なまえが さきに ひろまっていたのです。
- id: ch9_denwa
  title: ''
  background: wm_europe_denwa
  bgm: pop
  stage:
  - {who: zundamon, x: 0.3, flip: true, tag: 盛田昭夫, emotion: happy}
  cuts:
  - speaker: reimu
    text: 盛田は、日本の大曽根に電話をかけます。
    reading: もりたわ にほんの おおそねに でんわお かけます。
  - speaker: zundamon
    emotion: happy
    text: 海外でも、ウォークマンという名前で[通って|とおって]いるのだ。
  - speaker: zundamon
    emotion: happy
    text: 世界中全部、ウォークマンに統一するのだ！
- id: ch9_jisho
  title: ''
  background: wm_sekai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: ウォークマンという言葉は、辞書にも載ったの。
  - speaker: tsumugi
    emotion: normal
    text: まず1981年、フランスの辞書に載ったの。
  - speaker: tsumugi
    emotion: normal
    text: オックスフォード英語辞典にも、1986年に載ったわ。
  - speaker: zundamon
    emotion: happy
    text: 変な和製英語が、辞書に載る英語になったのだ！
  - speaker: tsumugi
    emotion: normal
    text: 盛田は、英語として認められたことを、何より喜んだそうよ。
- id: ch10_shikumi
  title: 小さくできた理由
  background: wm_zukai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 結局、ウォークマンの何が新しかったのだ？
  - speaker: tsumugi
    emotion: normal
    text: 録音の回路とスピーカーをなくして、空いた場所をステレオの再生に回したの。
  - speaker: tsumugi
    emotion: normal
    text: ヘッドホンで聴くから、大きな音を出す力もいらないの。
  - speaker: zundamon
    emotion: happy
    text: いらないものを、捨てたのだ。
  - speaker: tsumugi
    emotion: normal
    text: 重さは390グラム。単3電池2本で、アルカリなら約8時間聴けたそうよ。
  - speaker: tsumugi
    emotion: thinking
    text: 実は、持ち歩けるステレオの録音機なら、ソニーにはもうあったの。
  - speaker: zundamon
    emotion: surprised
    text: 井深さんが、重いと言ってたやつなのだ！
  - speaker: tsumugi
    emotion: normal
    text: 新しかったのは、組み合わせよ。
  - speaker: tsumugi
    emotion: normal
    text: 再生だけ、ヘッドホンだけ、手のひらの大きさで、3万円台。
  - speaker: tsumugi
    emotion: normal
    text: 新しい発明というより、引き算の発想だったのね。
- id: ch10_bunka
  title: ''
  background: wm_zukai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: みんな、自分専用を欲しがったのよ。
  - speaker: tsumugi
    emotion: normal
    text: だからホットラインは無くなり、[差し込み口|さしこみぐち]も1つになったわ。
  - speaker: zundamon
    emotion: thinking
    text: 2人で聴くより、1人で聴きたかったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 若者が殻にこもる、という批判もあったわ。
  - speaker: tsumugi
    emotion: normal
    text: でも、音楽学者の細川周平は、それは孤立じゃない、と反論したの。
  - speaker: tsumugi
    emotion: normal
    text: 歩きながら、街を自分だけの舞台に変える装置だ、って。
  - speaker: tsumugi
    emotion: normal
    text: 何を聴いているかは、周りには分からない。秘密の劇場、と呼んだの。
  - speaker: zundamon
    emotion: happy
    text: 通学路が、ミュージックビデオになるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 1982年のアメリカには、道を渡るときなどのヘッドホンを、禁じた町まで現れたの。
  - speaker: zundamon
    emotion: surprised
    text: 町の決まりまで、変えたのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 罰金は、最大50ドルだったんですって。
  - speaker: tsumugi
    emotion: normal
    text: そのころのアメリカでは、こうした機械が、約650万台も使われていたそうよ。
  - speaker: zundamon
    emotion: surprised
    text: たった3年で、そんなに広がったのだ！
  - speaker: tsumugi
    emotion: normal
    text: オーストリアの最高裁判所が、2002年に判断したの。
  - speaker: tsumugi
    emotion: normal
    text: ウォークマンは、もう一般的な言葉だ、って。
  - speaker: zundamon
    emotion: surprised
    text: 名前が、有名になりすぎたのだ。
  - speaker: tsumugi
    emotion: happy
    text: 宇宙を舞台にしたアメリカ映画でも、主人公が、この初代の型を持ってるの。
  - speaker: zundamon
    emotion: happy
    text: 宇宙にまで、[行った|いった]のだ！
- id: ch10_pavel
  title: ''
  background: wm_shiryo
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: thinking
    text: 実は、似たアイデアを先に考えていた人もいるの。
  - speaker: tsumugi
    emotion: normal
    text: アンドレアス・パヴェルという、ドイツ出身の人よ。
  - speaker: tsumugi
    emotion: normal
    text: 本人の話では、1972年に、スイスで試したそうよ。
  - speaker: tsumugi
    emotion: normal
    text: ベルトに付けてヘッドホンで聴く機械を考えて、1977年に特許を出していたの。
  - speaker: zundamon
    emotion: surprised
    text: 先に、考えていたのだ？
  - speaker: tsumugi
    emotion: normal
    text: 製品にはならなかったの。でも、ソニーとは長く争ったわ。
  - speaker: tsumugi
    emotion: normal
    text: イギリスの裁判では、彼の特許が取り消されたこともあったわ。
  - speaker: tsumugi
    emotion: normal
    text: それでも2004年に、ソニーとの和解の契約が結ばれたの。
  - speaker: tsumugi
    emotion: normal
    text: 金額は、公表されていないの。
- id: ch11_gendai
  title: 今のウォークマン
  background: wm_gendai
  bgm: amacha_milkyway
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 発売から10年で5000万台。13年で1億台を超えたわ。
  - speaker: tsumugi
    emotion: normal
    text: 1981年の2号機は、先に形を決めて、それに合わせて中身を作ったの。
  - speaker: tsumugi
    emotion: normal
    text: 1983年には、カセットのケースと、ほとんど同じ大きさの型まで出たわ。
  - speaker: tsumugi
    emotion: normal
    text: 1984年には、CDを持ち歩けるプレーヤーも出たの。
  - speaker: tsumugi
    emotion: normal
    text: 盛田が、5万円を切れと言って、かかるお金の半分の値段で売り出したんですって。
  - speaker: zundamon
    emotion: surprised
    text: 売るたびに、赤字なのだ！
  - speaker: tsumugi
    emotion: normal
    text: 目標にしたのは、CDのケース4枚分の大きさの、木の模型だったの。
  - speaker: zundamon
    emotion: happy
    text: 木の模型から、始まったのだ。
  - speaker: tsumugi
    emotion: normal
    text: それでも、1年半で黒字になったそうよ。
  - speaker: tsumugi
    emotion: normal
    text: 1992年には、録音もできる、MDの型も出たわ。
  - speaker: zundamon
    emotion: happy
    text: 今度は、録音できるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 1999年には、ネットで買った曲を入れられる型も出たの。
  - speaker: tsumugi
    emotion: thinking
    text: 2001年からは、アップルの[iPod|アイポッド]との競争になったわ。
  - speaker: tsumugi
    emotion: normal
    text: 日本のお店の集計では、週ごとの首位を取り返した年もあるの。
  - speaker: tsumugi
    emotion: normal
    text: 2009年と、2010年よ。
  - speaker: tsumugi
    emotion: normal
    text: 2010年3月までに、全部の型を合わせて約4億台。
  - speaker: tsumugi
    emotion: normal
    text: そのうちカセットの型だけで、約2億2000万台よ。
  - speaker: zundamon
    emotion: surprised
    text: 出だしは3000台。それが、4億台なのだ！
  - speaker: tsumugi
    emotion: normal
    text: 同じ2010年、カセット型のウォークマンは、国内での販売を終えたの。
  - speaker: tsumugi
    emotion: normal
    text: 名前は残って、今も売られているの。
  - speaker: tsumugi
    emotion: normal
    text: ソニーの音楽プレーヤーの名前として、ね。
  - speaker: tsumugi
    emotion: normal
    text: 40周年の2019年、銀座に歴代の約230台が並んだわ。
  - speaker: tsumugi
    emotion: normal
    text: 記念の型には、初代の見た目のケース付き。
  - speaker: tsumugi
    emotion: normal
    text: 画面の中では、カセットの絵が回ったの。
  - speaker: zundamon
    emotion: happy
    text: 中身は新しくても、見た目は初代なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: イギリスでは、カセットテープの売り上げが、また伸びた年もあるの。
  - speaker: zundamon
    emotion: happy
    text: カセットが、もう一度はやるかもしれないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 2023年の型は、32ギガで約4900曲入るの。
  - speaker: tsumugi
    emotion: normal
    text: 1曲を4分として、ね。
  - speaker: zundamon
    emotion: thinking
    text: 60分のテープなら、何本分なのだ？
  - speaker: tsumugi
    emotion: happy
    text: 1本に15曲で、約330本分よ。積み上げると、4メートルくらいね。
  - speaker: zundamon
    emotion: surprised
    text: 天井を突き抜けるのだ！
    se: oti
- id: shime
  title: ''
  background: wm_ima2
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、一緒に音楽を聴くのだ！
  - speaker: zundamon
    emotion: happy
    text: 2つのヘッドホンで聴くのだ。
  - speaker: tsumugi
    emotion: happy
    text: ガイズ・アンド・ドールズね。
  - speaker: zundamon
    emotion: thinking
    text: ……あれ？ つむぎが[何|なに]か言ってるけど、聞こえないのだ。
  - speaker: tsumugi
    emotion: normal
    text: ホットラインが要るわね。
    se: oti
  - speaker: zundamon
    emotion: normal
    text: 録音もできない。スピーカーもない。
  - speaker: zundamon
    emotion: happy
    text: いらないものを捨てたら、歩きながら聴くのが、当たり前になったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 最初は、出張の機内で音楽を聴きたい、という一人の頼みごとだったのよね。
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴ありがとうございました！
    duet_with: tsumugi
