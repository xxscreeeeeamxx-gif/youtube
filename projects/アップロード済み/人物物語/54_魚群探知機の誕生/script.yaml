meta:
  title: 【魚群探知機の誕生】「インチキ」と返された機械で、最下位の漁船が港で一番になった【ずんだもん解説】
  slug: furuno-fishfinder
  summary: スマホで海の中がのぞける魚群探知機。その始まりは、長崎の小さな電器屋の兄弟でした。船頭の「魚のいる所には泡が出る」という一言、雑音だらけの試験、クラゲの大群との取り違え、そして返品の山。港で一番獲れない船に賭けた1949年までを描きます。
  tags:
  - 魚群探知機
  - 魚探
  - 古野電気
  - フルノ
  - 古野清孝
  - 古野清賢
  - 漁業
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  thumbnail:
    top: 魚を音で見つけた兄弟
    bottom: 魚群探知機の誕生
  mode: drama
  narrator: reimu
  mobs:
  - id: kiyotaka
    label: 兄・清孝
    voice: 13
    pitch: -0.03
  - id: sendou
    label: 船頭
    voice: 42
    pitch: -0.02
  - id: ryoushi
    label: 漁師
    voice: 12
    pitch: -0.02
  - id: masuda
    label: 船主・桝田
    voice: 42
    pitch: 0.05
  - id: senshu
    label: 船主
    voice: 12
    pitch: -0.1
  - id: tanin
    label: 別の漁師
    voice: 42
    pitch: 0.1
  - id: yoso
    label: よその船主
    voice: 42
    pitch: -0.06
scenes:
- id: hook
  title: ''
  background: fr_ima_hook
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、見るのだ。スマホの画面に、海の中が映ってるぞ。
  - speaker: tsumugi
    emotion: normal
    text: 投げ込み式の魚探ね。糸の先に付けて、海に浮かべるやつ。
  - speaker: zundamon
    emotion: happy
    text: 赤くて、でっかい影がいる。巨大魚なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: それ、海底よ。
  - speaker: zundamon
    emotion: surprised
    text: 海底なのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 赤は、音が強く跳ね返った所。海底や岩、ぎっしり詰まった群れね。
  - speaker: zundamon
    emotion: thinking
    text: なら、この上の雲みたいなのは？
  - speaker: tsumugi
    emotion: normal
    text: それは、群れかもね。
  - speaker: zundamon
    emotion: happy
    text: 見てるだけで楽しい。釣れなくても、ボクは満足なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: じゃあ、なんで[竿|さお]まで用意してるのよ。
  - speaker: zundamon
    emotion: happy
    text: 雲の真ん中に、投げ込むぞ！
- id: hook_b
  title: ''
  background: fr_ima_hook2
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: ……来た！ 重い！
  - speaker: zundamon
    emotion: sad
    text: ……クラゲなのだ。
  - speaker: tsumugi
    emotion: happy
    text: 群れは群れでも、クラゲの群れだったわね。
    se: oti
  - speaker: tsumugi
    emotion: thinking
    text: でも、昔の漁師には、この画面すら無かったのよ。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、どうやって魚を探してたのだ？
  - speaker: tsumugi
    emotion: normal
    text: 海鳥が群れる所や、海の泡立つ所を探したの。あとは、勘と経験ね。
  - speaker: zundamon
    emotion: surprised
    text: 勘！？
  - speaker: tsumugi
    emotion: normal
    text: 勘だけじゃないわ。
  - speaker: tsumugi
    emotion: normal
    text: 海鳥が群れてる下には、たいてい魚の群れがいるの。鳥山っていうのよ。
  - speaker: zundamon
    emotion: happy
    text: 鳥に、魚の居場所を教えてもらうのか。
  - speaker: reimu
    text: 魚群探知機。音を使って海の中の魚の群れを見る機械です。
    reading: ぎょぐん たんちき。おとお つかって うみの なかの さかなの むれお みる きかいです。
  - speaker: reimu
    text: 漁船のための魚群探知機を、世界で初めて実用化したとされるのは、長崎の電器屋の兄弟でした。
    reading: ぎょせんの ための ぎょぐん たんちきお せかいで はじめて じつようか したと されるのわ、ながさきの でんきやの きょうだいでした。
  - speaker: zundamon
    emotion: surprised
    text: 電器屋の兄弟なのだ？
  - speaker: tsumugi
    emotion: normal
    text: 最初の機械は、インチキと呼ばれて、返品の山だったのよ。
  - speaker: tsumugi
    emotion: normal
    text: それを救ったのが、港で一番獲れない船なの。
  - speaker: zundamon
    emotion: surprised
    text: 一番獲れない船なのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、ラジオの修理よ。
- id: ch0_joukyou
  title: ''
  background: fr_machi
  bgm: natsuyasumi
  cuts:
  - speaker: reimu
    text: 古野家は、長崎の島原半島、南有馬の出身です。
    reading: ふるのけわ ながさきの しまばら はんとうの みなみありまの しゅっしんです。
  - speaker: reimu
    text: 兄の清孝は1920年に、弟の清賢は1926年に生まれました。
    reading: あにの きよたかわ せんきゅうひゃく にじゅうねんに おとうとの きよかたわ せんきゅうひゃく にじゅうろくねんに うまれました。
  - speaker: reimu
    text: 兄弟の多い、大家族だったといいます。
    reading: きょうだいの おおい だいかぞくだったと いいます。
- id: card1938
  title: ''
  background: fr_card_1938
  cuts:
  - speaker: reimu
    text: 1938年。17歳の古野清孝が、口之津の町で電気の店を開きます。
    reading: せんきゅうひゃく さんじゅうはちねん。じゅうななさいの ふるの きよたかが くちのつの まちで でんきの みせお ひらきます。
- id: ch1_mise
  title: 口之津の電器屋
  background: fr_mise
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 古野清賢, scale: 0.85, emotion: happy}
  - {who: kiyotaka, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 兄さん、このラジオ、また声が出るようになったぞ！
  - speaker: kiyotaka
    emotion: happy
    text: 真空管を、取り替えたからな。
  - speaker: zundamon
    emotion: thinking
    text: 遠くの放送が、なんでこの箱から聞こえるのだ？
  - speaker: kiyotaka
    emotion: normal
    text: 目に見えない電波を、この箱が拾って、音に戻してるんだ。
  - speaker: zundamon
    emotion: surprised
    text: 見えない波を拾うのか。すごいのだ。
  - speaker: reimu
    text: 店の仕事は、ラジオの修理と、漁船の集魚灯の修理でした。
    reading: みせの しごとわ らじおの しゅうりと ぎょせんの しゅうぎょとうの しゅうりでした。
  - speaker: zundamon
    emotion: thinking
    text: 兄さん、この笠のついた電球は、何に使うのだ？
  - speaker: kiyotaka
    emotion: normal
    text: 集魚灯だ。夜の海を照らして、魚を集める明かりだ。
  - speaker: kiyotaka
    emotion: normal
    text: イワシやアジは、光に寄ってくるからな。
  - speaker: zundamon
    emotion: happy
    text: 魚を、明かりで呼ぶのか。
  - speaker: kiyotaka
    emotion: happy
    text: 口之津は漁船が多い。電気の分かる者は少ないから、仕事はいくらでもある。
  - speaker: kiyotaka
    emotion: normal
    text: よし。直した集魚灯を、港の船に付けに行くぞ。
  - speaker: zundamon
    emotion: happy
    text: 船に乗れるのだ！
- id: ch1_shingaku
  title: ''
  background: fr_mise
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 古野清賢, scale: 0.9, emotion: normal}
  - {who: kiyotaka, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: やがて清賢も、学校を終える年ごろになります。
    reading: やがて きよかたも がっこうお おえる としごろに なります。
  - speaker: kiyotaka
    emotion: thinking
    text: '[清賢|きよかた]。お前、上の学校に行きたいか。'
  - speaker: zundamon
    emotion: happy
    text: 行きたい。電気の勉強を、もっとしたいのだ。
  - speaker: kiyotaka
    emotion: thinking
    text: ……おれは、いつ兵隊に取られるか分からん。
  - speaker: kiyotaka
    emotion: thinking
    text: そうなったら、店を任せられるのは、お前しかいない。
  - speaker: zundamon
    emotion: sad
    text: ……学校、あきらめろってこと？
  - speaker: kiyotaka
    emotion: thinking
    text: すまん。店を、継いでくれ。
  - speaker: zundamon
    emotion: thinking
    text: ……分かった。店はボクが守る。
  - speaker: reimu
    text: 兄に頼まれ、清賢は進学をあきらめて店に入ったと伝えられています。
    reading: あにに たのまれ、きよかたわ しんがくお あきらめて みせに はいったと つたえられています。
  - speaker: reimu
    text: 1941年、清賢は15歳で、ラジオ技術士の検定に合格します。最年少だったといいます。
    reading: せんきゅうひゃく よんじゅういちねん きよかたわ じゅうごさいで らじお ぎじゅつしの けんていに ごうかく します。さいねんしょう だったと いいます。
  - speaker: kiyotaka
    emotion: surprised
    text: 15歳で合格か。大人に混じって、よくやった。
  - speaker: zundamon
    emotion: happy
    text: これで、兄さんの代わりが務まるのだ。
- id: card1943
  title: ''
  background: fr_card_1943
  cuts:
  - speaker: reimu
    text: 1943年ごろ。戦争のさなか、22歳の清孝は、橘湾で漁船の集魚灯の工事をしていました。
    reading: せんきゅうひゃく よんじゅうさんねん ごろ。せんそうの さなか にじゅうにさいの きよたかわ、たちばなわんで ぎょせんの しゅうぎょとうの こうじお していました。
- id: ch2_awa
  title: 魚のいる所には泡
  background: fr_tachibana
  bgm: 223am
  stage:
  - {who: kiyotaka, x: 0.3, flip: true, emotion: normal}
  - {who: sendou, x: 0.7, emotion: normal}
  cuts:
  - speaker: sendou
    emotion: thinking
    text: この前の明かりは、一晩でつかなくなったぞ。
  - speaker: kiyotaka
    emotion: normal
    text: 潮で、電線が傷んでました。今度は、しっかり巻いておきます。
  - speaker: sendou
    emotion: normal
    text: 頼むよ。明かりがなきゃ、商売にならん。
  - speaker: sendou
    emotion: normal
    text: で、明かりはまだか。今夜は、イワシが来そうなんだ。
  - speaker: kiyotaka
    emotion: normal
    text: もうすぐです。……船頭さん、魚が来るって、どうして分かるんですか。
  - speaker: sendou
    emotion: happy
    text: 長年の勘だな。
  - speaker: sendou
    emotion: normal
    text: それにな、魚のいる所には、泡が出るんだ。
  - speaker: kiyotaka
    emotion: surprised
    text: 泡、ですか。
  - speaker: sendou
    emotion: normal
    text: 群れの上の海が、ぷつぷつ泡立つ。そこを狙って、網を入れるのさ。
  - speaker: kiyotaka
    emotion: thinking
    text: 泡が見えない夜は、どうするんです。
  - speaker: sendou
    emotion: happy
    text: だから、明かりで呼ぶんだよ。あとは、運だな。
  - speaker: kiyotaka
    emotion: thinking
    text: 勘と、運か……。
  - speaker: reimu
    text: この船頭の言葉を、清孝は覚えていました。
    reading: この せんどうの ことばお きよたかわ おぼえていました。
- id: card1945
  title: ''
  background: fr_card_1945
  cuts:
  - speaker: reimu
    text: 1945年。戦争が終わった年の暮れ、兄弟は旧海軍が手放した音響測深機を手に入れます。
    reading: せんきゅうひゃく よんじゅうごねん。せんそうが おわった としの くれ、きょうだいわ きゅう かいぐんが てばなした おんきょう そくしんきお てに いれます。
- id: ch3_sokushin
  title: 音で深さを測る
  background: fr_kenkyu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 古野清賢, emotion: surprised}
  - {who: kiyotaka, x: 0.62, emotion: normal}
  - {who: tsumugi, x: 0.84, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 兄さん、この箱は[何|なん]なのだ？
  - speaker: kiyotaka
    emotion: normal
    text: 海軍の船が使ってた、音響測深機だ。海の深さを、音で測る。
  - speaker: zundamon
    emotion: thinking
    text: 音で、深さが分かるのだ？
  - speaker: tsumugi
    emotion: normal
    text: 船の底から音を出して、海底で跳ね返って戻るまでの時間を計るの。
  - speaker: tsumugi
    emotion: normal
    text: 水の中の音は、とても速いの。
  - speaker: tsumugi
    emotion: normal
    text: 1秒に、約1500メートル進むわ。
  - speaker: zundamon
    emotion: happy
    text: なら、1秒で戻ってきたら、深さは1500メートルなのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 往復だから、750メートルよ。
  - speaker: zundamon
    emotion: surprised
    text: ……往復を、忘れてたのだ。
  - speaker: zundamon
    emotion: thinking
    text: でも、なんで音なのだ？ 光で照らせば、見えるだろ。
  - speaker: tsumugi
    emotion: normal
    text: 光も電波も、水の中ではすぐ弱まっちゃうの。遠くまで届くのは、音なのよ。
  - speaker: tsumugi
    emotion: normal
    text: 深さ200メートルでは、光は海面の0.1%しか残らないわ。
  - speaker: zundamon
    emotion: sad
    text: 真っ暗なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 音で海を探る研究は、タイタニック号の事故のあと、氷山を見つけるために進んだの。
  - speaker: zundamon
    emotion: surprised
    text: 氷山を、音で見つけるのか！
  - speaker: tsumugi
    emotion: normal
    text: そのあとフランスでは、潜水艦を超音波で探す研究も進んだわ。
  - speaker: tsumugi
    emotion: normal
    text: 日本では、1928年に国が輸入した測深機が、最初と言われてるわ。
  - speaker: zundamon
    emotion: thinking
    text: 日本にも、もう入ってたのか。
  - speaker: kiyotaka
    emotion: thinking
    text: 海底が映るなら、魚も映るか。
  - speaker: zundamon
    emotion: thinking
    text: 魚の体は、ほとんど水だぞ。音は、素通りするって言われてる。
  - speaker: kiyotaka
    emotion: thinking
    text: ……橘湾の船頭さんが、言ってたんだ。魚のいる所には、泡が出るって。
  - speaker: zundamon
    emotion: surprised
    text: 泡なら、中は空気だ。空気なら、音が跳ね返るかもしれないのだ！
  - speaker: kiyotaka
    emotion: happy
    text: やってみる価値は、あるな。
  - speaker: tsumugi
    emotion: happy
    text: この読み、いい線いってたの。
  - speaker: tsumugi
    emotion: normal
    text: 浮き袋のある魚では、跳ね返る音の9割以上が、浮き袋のガスから来てるの。
  - speaker: zundamon
    emotion: surprised
    text: 魚の中に、泡が入ってたのだ！
- id: card1947
  title: ''
  background: fr_card_1947
  cuts:
  - speaker: reimu
    text: 1947年4月。兄弟は、作り変えた機械を船に積み、五島灘で初めての試験に出ます。
    reading: せんきゅうひゃく よんじゅうななねん しがつ。きょうだいわ つくりかえた きかいお ふねに つみ、ごとうなだで はじめての しけんに でます。
- id: ch4_goto
  title: 雑音の海
  background: fr_goto
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 古野清賢, emotion: happy}
  - {who: kiyotaka, x: 0.56, emotion: normal}
  - {who: ryoushi, x: 0.78, emotion: thinking}
  cuts:
  - speaker: ryoushi
    emotion: thinking
    text: で、その機械で、魚が分かるってのかい。
  - speaker: zundamon
    emotion: happy
    text: 海の中が、この紙に写るのだ。
  - speaker: kiyotaka
    emotion: normal
    text: スイッチを入れます。
  - speaker: zundamon
    emotion: surprised
    text: ……線が、ぐちゃぐちゃだ。
  - speaker: ryoushi
    emotion: thinking
    text: なんだい、この落書きは。
  - speaker: zundamon
    emotion: thinking
    text: エンジンとスクリューの音まで、拾ってるのだ。
  - speaker: kiyotaka
    emotion: thinking
    text: 船の泡の音も、入ってるな。
  - speaker: zundamon
    emotion: surprised
    text: 今、魚みたいな影が出たのだ！
  - speaker: ryoushi
    emotion: surprised
    text: どこだい。網を入れるか。
  - speaker: zundamon
    emotion: sad
    text: ……雑音に[埋もれて|うもれて]、分からなくなったのだ。
  - speaker: ryoushi
    emotion: angry
    text: 雑音と魚の区別もつかねえんじゃ、網は入れられねえよ。
  - speaker: reimu
    text: 魚らしい反応は出ましたが、雑音に埋もれ、魚を獲るまでには至りませんでした。
    reading: さかな らしい はんのうわ でましたが、ざつおんに うもれ さかなお とるまでにわ いたりませんでした。
  - speaker: kiyotaka
    emotion: thinking
    text: でも、魚らしい影は確かに出た。
  - speaker: zundamon
    emotion: thinking
    text: 雑音さえ消せれば、魚は見えるはずなのだ。
- id: ch4_kairyou
  title: ''
  background: fr_kenkyu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 古野清賢, emotion: thinking}
  - {who: kiyotaka, x: 0.62, emotion: thinking}
  - {who: tsumugi, x: 0.84, emotion: normal}
  cuts:
  - speaker: kiyotaka
    emotion: thinking
    text: 雑音を、どう減らすかだな。
  - speaker: zundamon
    emotion: thinking
    text: 音を出す所と聞く所を、船の横じゃなくて、底から突き出して付けるのだ。
  - speaker: kiyotaka
    emotion: surprised
    text: 船の底に、穴を開けるのか。漁師は嫌がるぞ。
  - speaker: zundamon
    emotion: thinking
    text: それでも、やるしかない。
  - speaker: kiyotaka
    emotion: normal
    text: 聞き取る力も、上げないとな。小さな音を、もっと大きくする。
  - speaker: tsumugi
    emotion: normal
    text: 使った音は14.5キロヘルツ。
  - speaker: tsumugi
    emotion: normal
    text: 船の横に付けたときより、雑音はぐっと減ったそうよ。
  - speaker: tsumugi
    emotion: normal
    text: 記録紙は、電気が流れると青紫に染まる紙。ヨウ素とでんぷんの反応よ。
  - speaker: zundamon
    emotion: happy
    text: 理科の実験で、やったやつだ！
  - speaker: tsumugi
    emotion: happy
