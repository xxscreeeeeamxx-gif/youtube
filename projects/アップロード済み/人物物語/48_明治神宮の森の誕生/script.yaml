    reading: この しょうがくきんわ、いまも さいたまけんの がくせいお ささえています。
  - speaker: zundamon
    emotion: thinking
    text: 貯めたのは、配るためだったのか。
  - speaker: tsumugi
    emotion: normal
    text: 考え方が分かる言葉なら、残ってるわ。人生即努力、努力即幸福。
  - speaker: zundamon
    emotion: surprised
    text: 頑張ること自体が、幸せなのだ？
  - speaker: tsumugi
    emotion: normal
    text: もう一つ、職業の道楽化、という言葉もあるの。
  - speaker: zundamon
    emotion: thinking
    text: 仕事を、遊びにするのだ？
  - speaker: tsumugi
    emotion: happy
    text: 夢中になれるまで打ち込めば、仕事が楽しみに変わる、って考え方よ。
  - speaker: zundamon
    emotion: happy
    text: 学校で、勉強が遊びになるまでやった話と同じなのだ。
  - speaker: tsumugi
    emotion: happy
    text: そう考えた人だったの。貯めるのも、植えるのも、その先を楽しんでたのね。
  - speaker: zundamon
    emotion: thinking
    text: 森も貯金も、すぐには結果が出ないのだ。
  - speaker: tsumugi
    emotion: normal
    text: だから、先に始めた人が勝つのよ。
- id: card1945
  title: ''
  background: hs_card_1945
  cuts:
  - speaker: reimu
    text: 1945年4月。空襲で、明治神宮の本殿と拝殿が焼けました。
    reading: せんきゅうひゃく よんじゅうごねん しがつ。くうしゅうで、めいじ じんぐうの ほんでんと はいでんが やけました。
- id: ch13_kuushu
  title: ''
  background: hs_kuushu
  bgm: serious
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: sad}
  - {who: tsumugi, x: 0.74, emotion: thinking}
  cuts:
  - speaker: tsumugi
    emotion: thinking
    text: でも、森は大きな被害を受けずに残ったの。
  - speaker: tsumugi
    emotion: normal
    text: 近くの人たちが、森に逃げ込んだとも言われてるわ。
  - speaker: zundamon
    emotion: surprised
    text: 森が、燃えなかったのか。
  - speaker: tsumugi
    emotion: thinking
    text: 葉に水気の多い木が多かったから、とも言われてる。でも、はっきりとは分かってないの。
  - speaker: zundamon
    emotion: thinking
    text: 植え始めてから、30年くらいなのだ。
  - speaker: tsumugi
    emotion: normal
    text: まだ若い森が、人を守ったのかもしれないわね。
  - speaker: reimu
    text: 戦後の1952年、本多静六は85歳で亡くなりました。
    reading: せんごの せんきゅうひゃく ごじゅうにねん、ほんだ せいろくわ はちじゅうごさいで なくなりました。
- id: ch14_ronsou
  title: 天然の森じゃないの？
  background: hs_shiryo
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。ネットで見たのだ。明治神宮の森は、ほったらかしだから深いって。
  - speaker: tsumugi
    emotion: normal
    text: ほったらかしに見えるのは、そう計画したからよ。
  - speaker: zundamon
    emotion: surprised
    text: わざと、なのか。
  - speaker: tsumugi
    emotion: happy
    text: 人が手をかけなくても続く森。それが、最初からのゴールだったの。
  - speaker: zundamon
    emotion: thinking
    text: もう一つ見たのだ。神宮の木が、再開発で切られてるって。
  - speaker: tsumugi
    emotion: normal
    text: それは、神宮外苑のほうの話ね。
  - speaker: tsumugi
    emotion: normal
    text: 外苑は、この森とは別の場所に、別に造られた区域なの。
  - speaker: zundamon
    emotion: surprised
    text: 同じ明治神宮なのに、別なのか。
  - speaker: tsumugi
    emotion: normal
    text: 森があるのは渋谷区の内苑。イチョウ並木があるのは、新宿区や港区の外苑よ。
  - speaker: tsumugi
    emotion: thinking
    text: 外苑の再開発は、木を切ることの是非をめぐって、議論が続いてるわ。
  - speaker: zundamon
    emotion: normal
    text: ごちゃ混ぜにしちゃ、いけないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 内苑の森には、昔から続く決まりがあるの。
  - speaker: zundamon
    emotion: thinking
    text: 決まり？
  - speaker: tsumugi
    emotion: normal
    text: 落ち葉も枝も、森の外へ持ち出さない。それが、この森を育てる決まりなの。
  - speaker: zundamon
    emotion: surprised
    text: 拾って帰ったら、ダメなのか。
  - speaker: tsumugi
    emotion: normal
    text: 森の栄養を、持って帰ることになるわ。
  - speaker: zundamon
    emotion: normal
    text: 見るだけにするぞ。
- id: ch14_chokin
  title: ''
  background: hs_shiryo
  bgm: curious
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: もう一つ見たのだ。給料の4分の1を貯金なんて、今は無理だって。
  - speaker: tsumugi
    emotion: normal
    text: 本多さんの時代も、楽ではなかったのよ。
  - speaker: tsumugi
    emotion: normal
    text: 月給58円のうち、14円50銭を先に取って、残りで一家9人が暮らしたの。
  - speaker: zundamon
    emotion: surprised
    text: 9人で、4分の3なのだ……。
  - speaker: tsumugi
    emotion: thinking
    text: 4分の1という割合は、本多さんが自分で決めたルールよ。
  - speaker: tsumugi
    emotion: normal
    text: 大事なところは、割合より、先に取るという順番のほう。
  - speaker: zundamon
    emotion: normal
    text: 大事なのは、順番なのだ。
  - speaker: tsumugi
    emotion: normal
    text: それと、臨時の収入は全部貯金。無かったものと思う、ってやり方ね。
  - speaker: zundamon
    emotion: thinking
    text: ボクのお年玉は、いつも全部使ってたのだ。
  - speaker: tsumugi
    emotion: happy
    text: そこが、森ができるかどうかの分かれ目ね。
- id: ch15_gendai
  title: 計画より早い森
  background: hs_mori
  bgm: amacha_milkyway
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 森の広さは、70ヘクタールほど。
  - speaker: zundamon
    emotion: thinking
    text: 東京ドーム、何個分なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 15個分くらいね。
  - speaker: reimu
    text: 2011年からの調査では、2800種あまりの生き物が見つかりました。
    reading: にせん じゅういちねんからの ちょうさでわ、にせん はっぴゃくしゅ あまりの いきものが みつかりました。
    telops:
    - {text: "見つかった生き物、2800種あまり", size: lg, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 畑だった場所に！？
  - speaker: tsumugi
    emotion: happy
    text: 森の移り変わりも、予想より早く進んでいるとも言われてるわ。
  - speaker: zundamon
    emotion: happy
    text: 計画より、森のほうが急いでるのだ。
  - speaker: tsumugi
    emotion: normal
    text: 初詣に来る人の数も、全国で一番と言われてきたの。
  - speaker: tsumugi
    emotion: normal
    text: 警察が数を出していた最後の年、2009年でも一番よ。
  - speaker: zundamon
    emotion: happy
    text: お参りのついでに、森も歩けるのだ。
- id: ch15_koen
  title: ''
  background: hs_ichou
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 日比谷公園の首かけイチョウも、今も毎年、黄色く色づくわ。
  - speaker: zundamon
    emotion: happy
    text: 首は、飛ばずにすんだのだ。
  - speaker: tsumugi
    emotion: normal
    text: 本多さんは、ほかにもいろんな公園の計画に関わってるの。
  - speaker: tsumugi
    emotion: normal
    text: 埼玉の大宮公園、秩父の羊山公園、長野の[臥竜|がりゅう]公園。
  - speaker: zundamon
    emotion: surprised
    text: あちこちにあるな。
  - speaker: tsumugi
    emotion: happy
    text: あなたの近所の公園も、調べてみると面白いわよ。
  - speaker: zundamon
    emotion: normal
    text: 今度、入口の看板を読んでみるのだ。
- id: shime
  title: ''
  background: hs_ima
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: つむぎ。ボクのドングリ、まだ芽が出ないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 森は、そんなにすぐには育たないわ。
  - speaker: tsumugi
    emotion: normal
    text: 本多さんのやり方って、森も貯金も同じだったのよ。
  - speaker: zundamon
    emotion: normal
    text: 先に植えて、先に取っておくのだ。
  - speaker: tsumugi
    emotion: happy
    text: そう。残ったら、じゃなくて、先に。
  - speaker: tsumugi
    emotion: normal
    text: 明治神宮を歩くときは、一度、上を見上げてみて。
  - speaker: tsumugi
    emotion: normal
    text: 高い木の下で、次の世代の若い木が育ってるから。
  - speaker: zundamon
    emotion: normal
    text: 足元の落ち葉は、持って帰らないのだ。
  - speaker: tsumugi
    emotion: happy
