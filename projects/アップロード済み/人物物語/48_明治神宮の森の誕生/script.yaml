meta:
  title: 【明治神宮の森の誕生】畑の上に、150年後の森を設計した男【ずんだもん解説】
  slug: honda-seiroku
  summary: 東京の真ん中にある、あの深い森。実は100年ちょっと前に、人が植えた森です。計画を立てたのは、学校で最下位を取ったこともある林学者でした。杉の森にしろという声に、彼は何と答えたのか。月給の4分の1を必ず先に取っておいた男が、自分では見られない先の森の姿まで描いていた話です。
  tags:
  - 明治神宮
  - 本多静六
  - 日比谷公園
  - 首かけイチョウ
  - 森づくり
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 林学
  - 貯金
  thumbnail:
    top: 人が植えた森
    bottom: 明治神宮の森の誕生
  mode: drama
  narrator: reimu
