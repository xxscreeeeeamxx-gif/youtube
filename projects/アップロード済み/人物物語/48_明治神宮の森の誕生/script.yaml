scenes:
- id: hook
  title: ''
  background: hs_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、見るのだ。公園でドングリを拾って、植えたのだ。
  - speaker: tsumugi
    emotion: normal
    text: 鉢植えね。何を育てるの？
  - speaker: zundamon
    emotion: happy
    text: 森なのだ。
  - speaker: tsumugi
    emotion: surprised
    text: 森。
  - speaker: zundamon
    emotion: happy
    text: 明日には、森になってるぞ。
  - speaker: tsumugi
    emotion: angry
    text: ならないわよ。
  - speaker: zundamon
    emotion: normal
    text: 水をたっぷりあげたら、早く伸びるのだ。
  - speaker: tsumugi
    emotion: surprised
    text: 鉢から、水があふれてる。
  - speaker: zundamon
    emotion: happy
    text: 肥料も、袋ごと入れるのだ。
  - speaker: tsumugi
    emotion: angry
    text: やりすぎよ！
  - speaker: zundamon
    emotion: thinking
    text: ……一晩たったけど、芽が出ない。
  - speaker: tsumugi
    emotion: normal
    text: 当たり前よ。
  - speaker: zundamon
    emotion: angry
    text: なら今度は、大きな木を買ってきて、並べるぞ。
  - speaker: tsumugi
    emotion: thinking
    text: それは森じゃなくて、植木屋さんよ。
  - speaker: zundamon
    emotion: sad
    text: ……森って、どうやったらできるのだ。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: 何十年も、何百年もかかるわ。
  - speaker: zundamon
    emotion: sad
    text: そんなに、待てないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 待てないのを分かっていて、森を作った人がいるの。
  - speaker: zundamon
    emotion: surprised
    text: 誰だ。
  - speaker: tsumugi
    emotion: normal
    text: 東京の真ん中にある、明治神宮の森。あれは、人が植えた森なのよ。
  - speaker: zundamon
    emotion: surprised
    text: あれ、大昔からある森じゃないのか！？
    se: don
  - speaker: tsumugi
    emotion: thinking
    text: 100年ちょっと前は、ほとんどが畑と野原だったの。
  - speaker: zundamon
    emotion: surprised
    text: 畑！？
  - speaker: reimu
    text: 明治神宮の森、およそ70ヘクタール。
    reading: めいじ じんぐうの もり、およそ ななじゅう へくたある。
  - speaker: reimu
    text: この森づくりの中心にいたのは、本多静六という林学者でした。
    reading: この もりづくりの ちゅうしんに いたのわ、ほんだ せいろくという りんがくしゃでした。
  - speaker: tsumugi
    emotion: happy
    text: しかもその人、月給の4分の1を、必ず先に貯金してた人でもあるの。
  - speaker: zundamon
    emotion: thinking
    text: 森と貯金が、どうつながるのだ。
  - speaker: tsumugi
    emotion: normal
    text: それが、ちゃんとつながるのよ。始まりは、埼玉の小さな村。
- id: card1866
  title: ''
  background: hs_card_1866
  cuts:
  - speaker: reimu
    text: 1866年。埼玉県の村に生まれました。
    reading: せんはっぴゃく ろくじゅうろくねん。さいたまけんの むらに うまれました。
  - speaker: reimu
    text: 地元の資料によると、名主を務める農家の六男で、もとの名字は折原でした。
    reading: じもとの しりょうに よると なぬしお つとめる のうかの ろくなんで、もとの みょうじわ おりはらでした。
- id: ch1_mura
  title: 借金を背負った家
  background: hs_nouka
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.3, flip: true, tag: 静六, scale: 0.8, emotion: normal}
  - {who: haha, x: 0.68, emotion: sad}
  cuts:
  - speaker: reimu
    text: 9歳のころ、父が急に亡くなり、家は借金を抱えます。
    reading: きゅうさいの ころ ちちが きゅうに なくなり、いえわ しゃっきんお かかえます。
  - speaker: haha
    emotion: sad
    text: '[静六|せいろく]。父さんの残した借金が、まだたくさんあるの。'
  - speaker: zundamon
    emotion: normal
    text: ボクも、働く。
  - speaker: haha
    emotion: thinking
    text: お前は、まだ小さいでしょう。
  - speaker: zundamon
    emotion: happy
    text: 田んぼなら、手伝えるぞ。
  - speaker: haha
    emotion: thinking
    text: 勉強は、どうするの。
  - speaker: zundamon
    emotion: thinking
    text: ……働きながら、するのだ。
  - speaker: haha
    emotion: surprised
    text: 欲張りな子だね。
  - speaker: zundamon
    emotion: happy
    text: 両方、ほしいのだ。
- id: ch1_jokyo
  title: ''
  background: hs_nouka
  stage:
  - {who: zundamon, x: 0.3, flip: true, tag: 静六, scale: 0.85, emotion: normal}
  - {who: haha, x: 0.68, emotion: thinking}
  cuts:
  - speaker: haha
    emotion: thinking
    text: 東京の家に、住み込みで行くんだって？
  - speaker: zundamon
    emotion: normal
    text: 書生になるのだ。家の用事をしながら、勉強させてもらうのだ。
  - speaker: haha
    emotion: sad
    text: 田植えと稲刈りは、どうするの。
  - speaker: zundamon
    emotion: happy
    text: その時期は、帰ってくるのだ。半分ずつなのだ。
  - speaker: haha
    emotion: surprised
    text: 東京と村を、行ったり来たり？
  - speaker: zundamon
    emotion: normal
    text: 借金は、村で返す。勉強は、東京でするのだ。
  - speaker: haha
    emotion: happy
    text: ……本当に、両方取るつもりなんだね。
  - speaker: zundamon
    emotion: happy
    text: 欲張りだから、なのだ。
- id: ch1_shosei
  title: ''
  background: hs_shosei
  stage:
  - {who: zundamon, x: 0.3, flip: true, tag: 静六, scale: 0.9, emotion: normal}
  - {who: shujin, x: 0.68, emotion: normal}
  cuts:
  - speaker: reimu
    text: 14歳で、東京の家に書生として住み込みます。
    reading: じゅうよんさいで、とうきょうの いえに しょせいとして すみこみます。
  - speaker: shujin
    emotion: normal
    text: '[静六|せいろく]。田植えの時期だろう。村に帰っていいぞ。'
  - speaker: zundamon
    emotion: normal
    text: また半年、村で働いてくるのだ。
  - speaker: shujin
    emotion: thinking
    text: 戻ったら、また勉強か。
  - speaker: zundamon
    emotion: happy
    text: 帰ったら、まず田植えなのだ。
  - speaker: shujin
    emotion: happy
    text: 忙しい若者だな。
  - speaker: zundamon
    emotion: normal
    text: 本は、村に持って帰るぞ。
  - speaker: shujin
    emotion: surprised
    text: 田んぼで読むのか。
  - speaker: zundamon
    emotion: happy
    text: 休みの時間に、読むのだ。
  - speaker: reimu
    text: 半年は東京で学び、半年は村で働く。この暮らしを3年続けました。
    reading: はんとしわ とうきょうで まなび、はんとしわ むらで はたらく。この くらしお さんねん つづけました。
- id: ch1_erabu
  title: ''
  background: hs_shosei
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 静六, emotion: normal}
  - {who: shujin, x: 0.7, emotion: thinking}
  cuts:
  - speaker: shujin
    emotion: thinking
    text: どの学校を受けるか、決めたのか。
  - speaker: zundamon
    emotion: normal
    text: 山林学校にするのだ。
  - speaker: shujin
    emotion: surprised
    text: 山林？ 木の学校か。
  - speaker: zundamon
    emotion: thinking
    text: 正直に言うと、学費が安いのだ。
  - speaker: shujin
    emotion: happy
    text: 正直でいい。
  - speaker: zundamon
    emotion: normal
    text: それに、村の山なら、ずっと見てきたのだ。
  - speaker: shujin
    emotion: normal
    text: 好きなものと、払えるものが同じなら、迷うことはない。
  - speaker: zundamon
    emotion: happy
    text: 迷わないぞ。
  - speaker: reimu
    text: 学費の安さで選んだと、本人がのちに語ったとも伝えられています。
    reading: がくひの やすさで えらんだと、ほんにんが のちに かたったとも つたえられています。
- id: card1884
  title: ''
  background: hs_card_1884
  cuts:
  - speaker: reimu
    text: 1884年。東京山林学校に入学します。
    reading: せんはっぴゃく はちじゅうよねん。とうきょう さんりん がっこうに にゅうがくします。
- id: ch2_rakudai
  title: 最下位からの逆転
  background: hs_gakko
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 静六, emotion: sad}
  - {who: doukyu, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: ところが成績は最下位。落第も経験します。
    reading: ところが せいせきわ さいかい。らくだいも けいけんします。
  - speaker: doukyu
    emotion: normal
    text: '[折原|おりはら]。また、一番下だったな。'
  - speaker: zundamon
    emotion: sad
    text: ……一番下なのだ。
  - speaker: doukyu
    emotion: thinking
    text: どうする。やめるか。
  - speaker: zundamon
    emotion: angry
    text: やめない。
  - speaker: doukyu
    emotion: surprised
    text: 何か、手はあるのか。
  - speaker: zundamon
    emotion: thinking
    text: 人より遅いなら、人より長くやるのだ。
  - speaker: doukyu
    emotion: surprised
    text: 寝ないつもりか。
  - speaker: zundamon
    emotion: normal
    text: 寝るけど、ほかの時間は全部、勉強にするぞ。
  - speaker: doukyu
    emotion: thinking
    text: 遊ぶ時間は。
  - speaker: zundamon
    emotion: happy
    text: 勉強が、遊びになるまでやるのだ。
- id: ch3_muko
  title: ''
  background: hs_honke
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 本多静六, emotion: normal}
  - {who: senko, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 在学中の1889年、静六は本多家の娘と結婚し、婿養子に入りました。
    reading: ざいがくちゅうの せんはっぴゃく はちじゅうくねん、せいろくわ ほんだけの むすめと けっこんし むこようしに はいりました。
  - speaker: reimu
    text: 妻は、日本で4人目の、公認の女性の医師でした。
    reading: つまわ、にほんで よにんめの こうにんの じょせいの いしでした。
  - speaker: senko
    emotion: happy
    text: 医者の家に、山の学問をするお婿さんね。
  - speaker: zundamon
    emotion: normal
    text: 人のお医者さんと、木のお医者さんなのだ。
  - speaker: senko
    emotion: surprised
    text: 木にも、お医者さんが要るの？
  - speaker: zundamon
    emotion: normal
    text: 木も病気になるし、けがもするのだ。
  - speaker: senko
    emotion: happy
    text: なら、同業ね。
  - speaker: zundamon
    emotion: happy
    text: 同業だぞ。
- id: card1890
  title: ''
  background: hs_card_1890
  cuts:
  - speaker: reimu
    text: 1890年。静六は、帝国大学の農科大学を首席で卒業します。
    reading: せんはっぴゃく きゅうじゅうねん。せいろくわ、ていこく だいがくの のうか だいがくお しゅせきで そつぎょうします。
    telops:
    - {text: "最下位から、首席で卒業", size: lg, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: そしてその年、ドイツへ留学します。
    reading: そして その とし、どいつえ りゅうがくします。
- id: ch3_shuppatsu
  title: ''
  background: hs_honke
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 本多静六, emotion: normal}
  - {who: senko, x: 0.7, emotion: normal}
  cuts:
  - speaker: senko
    emotion: normal
    text: ドイツへは、どれくらい行くの。
  - speaker: zundamon
    emotion: thinking
    text: 博士になるまでなのだ。何年かかるかは、分からないぞ。
  - speaker: senko
    emotion: thinking
    text: その[間|あいだ]、家は私が守るわね。
  - speaker: zundamon
    emotion: surprised
    text: 診察も、あるのに。
  - speaker: senko
    emotion: happy
    text: 家で患者さんを診るわ。医者は、どこでも医者だもの。
  - speaker: zundamon
    emotion: sad
    text: ……頼むのだ。
  - speaker: senko
    emotion: normal
    text: その代わり、木のお医者さんとして、ちゃんと帰ってきて。
  - speaker: zundamon
    emotion: happy
    text: 一番いい薬を、覚えて帰るのだ。
- id: ch4_doitsu
  title: 孫が見る森
  background: hs_doitsu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 本多静六, emotion: normal}
  - {who: kyoju, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: ターラントの山林学校で学んだあと、ミュンヘン大学へ移ります。
    reading: たあらんとの さんりん がっこうで まなんだ あと、みゅんへん だいがくえ うつります。
  - speaker: kyoju
    emotion: normal
    text: 君は、日本から来たのか。
  - speaker: zundamon
    emotion: normal
    text: 森の育て方を、学びに来たのだ。
  - speaker: kyoju
    emotion: normal
    text: この国では、森は何十年、何百年も先を考えて計画する。
  - speaker: zundamon
    emotion: surprised
    text: 自分が生きてるうちに、終わらないのだ。
  - speaker: kyoju
    emotion: happy
    text: 植えた者は、見られない。孫が見る。
  - speaker: zundamon
    emotion: thinking
    text: ……それでも、植えるのか。
  - speaker: kyoju
    emotion: normal
    text: それでも植える。それが、森の仕事だ。
  - speaker: zundamon
    emotion: normal
    text: 孫のために、今日の計画を立てるのだ。
  - speaker: reimu
    text: 静六は、およそ2年で博士の学位を取りました。
    reading: せいろくわ、およそ にねんで はかせの がくいお とりました。
  - speaker: reimu
    text: 途中で家からの仕送りが途絶え、学位を急いだとも伝えられています。
    reading: とちゅうで いえからの しおくりが とだえ、がくいお いそいだとも つたえられています。
- id: ch5_chokin
  title: 4分の1の天引き
  background: hs_honke
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 本多静六, emotion: normal}
  - {who: senko, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1892年ごろ帰国した静六は、母校で教え始めます。
    reading: せんはっぴゃく きゅうじゅうにねん ごろ きこくした せいろくわ、ぼこうで おしえはじめます。
  - speaker: senko
    emotion: normal
    text: 今月のお給料は、58円ね。
  - speaker: zundamon
    emotion: normal
    text: まず、4分の1を貯金に回すのだ。
  - speaker: senko
    emotion: surprised
    text: 先に？ 残ったら、じゃなくて？
  - speaker: zundamon
    emotion: normal
    text: 残ったらでは、いつまでも残らないのだ。
  - speaker: senko
    emotion: thinking
    text: 家族はこれから増えるのよ。残りで、やっていける？
  - speaker: zundamon
    emotion: normal
    text: やっていけるように、やりくりするのだ。
  - speaker: senko
    emotion: angry
    text: やりくりするのは、主に私よ。
  - speaker: zundamon
    emotion: sad
    text: ……いつも、ありがとうなのだ。
  - speaker: zundamon
    emotion: normal
    text: 原稿料みたいな、臨時の収入は、全部貯金するぞ。
  - speaker: senko
    emotion: surprised
    text: 全部！？
  - speaker: zundamon
    emotion: happy
    text: 無かったものと思えば、痛くないのだ。
  - speaker: reimu
    text: 月給の4分の1を、先に天引きして貯金する。
    reading: げっきゅうの よんぶんの いちお、さきに てんびきして ちょきんする。
    telops:
    - {text: "月給の4分の1を、先に天引き", size: lg, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: 貯まったお金は、山林や株に回しました。
    reading: たまった おかねわ、さんりんや かぶに まわしました。
  - speaker: reimu
    text: 1899年には、日本で最初の林学博士にもなっています。
    reading: せんはっぴゃく きゅうじゅうくねんにわ、にほんで さいしょの りんがく はかせにも なっています。
- id: card1901
  title: ''
  background: hs_card_1901
  cuts:
  - speaker: reimu
    text: 1901年。
    reading: せんきゅうひゃく いちねん。
- id: ch6_hibiya
  title: 決まらない公園
  background: hs_akichi
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 本多静六, emotion: normal}
  - {who: tatsuno, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 東京の日比谷に公園を作る計画は、いくつも設計案が出されては、通らずにいました。
    reading: とうきょうの ひびやに こうえんお つくる けいかくわ いくつも せっけいあんが だされてわ、とおらずに いました。
  - speaker: tatsuno
    emotion: normal
    text: 本多くん。日比谷の公園、君に頼みたい。
  - speaker: zundamon
    emotion: surprised
    text: ボクは、林学の人間なのだ。
  - speaker: tatsuno
    emotion: thinking
    text: 西洋の町の公園を、君はその目で見てきただろう。
