# ---- 今の部屋・あのころのポケモン（25〜34歳が子どもの頃に見たもの。年は台帳どおり。パンは見出しだけの資料なので「出た」まで。サトシは TIME 1999 の問いと答えのまま） ----
- id: atta
  title: あのころのポケモン
  background: pk_heya
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
