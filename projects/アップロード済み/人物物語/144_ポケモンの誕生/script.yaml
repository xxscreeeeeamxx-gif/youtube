scenes:
# ---- 先出し（1995年の秋・任天堂の会議室〔架空〕。台詞は TIME 1999 の訳だけ。任天堂の人は悪意なく、田尻の「期待されていなかった」はナレで。笑いの SE なし。「ところが、セーフだった」は ch5_ichii に取っておく） ----
- id: co_kaigi
  title: ''
  background: pk_kaigi
  bgm: serious
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 田尻, emotion: thinking}
  - {who: nin, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1995年の秋。携帯ゲーム機のソフトを6年かけて仕上げた男が、任天堂へ向かいます。
    reading: せんきゅうひゃく きゅうじゅうごねんの あき。けいたい げーむきの そふとお ろくねん かけて しあげた おとこが、にんてんどうえ むかいます。
  - speaker: zundamon
    emotion: normal
    text: 仕上がった、カセットです。
  - speaker: nin
    emotion: normal
    text: ……ゲームボーイの人気、いま落ちてますからね。
  - speaker: zundamon
    emotion: thinking
    text: ……6年、かかったのだ。
  - speaker: reimu
    text: 1999年のアメリカの雑誌の取材に、田尻はこう話しています。あまり期待されていなかった。
    reading: せんきゅうひゃく きゅうじゅうきゅうねんの あめりかの ざっしの しゅざいに、たじりわ こう はなして います。あまり きたい されて いなかった。
  - speaker: zundamon
    emotion: sad
    text: アウトだと分かっていて、二塁に滑り込む野球選手の気分でした。
    pause_after: 0.6
  - speaker: reimu
    text: この男は、田尻智。ゲームはポケットモンスター。30年後、シリーズは5億本を超えます。
    reading: この おとこわ、たじり さとし。げーむわ ぽけっと もんすたー。さんじゅうねんご、しりーずわ ごおくほんお こえます。
# ---- 今の部屋（交換しないとそろわない。20秒以内。問いは「世界一」でなく台帳で確かめられる「5億本」） ----
- id: hook
  title: ''
  background: pk_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: シールが全部そろうまで、1人で買い続けるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 友だちと交換すれば、早いのに。
  - speaker: zundamon
    emotion: angry
    text: 交換なんて、損した気分になるし。
  - speaker: tsumugi
    emotion: thinking
    text: その交換を遊びにして、6年かけたゲームがあるの。
  - speaker: tsumugi
    emotion: normal
    text: 考えた本人はアウトだと思ったのに、なぜ5億本を超えるシリーズになったのか。
    telops:
    - {text: "アウトだと思ったゲームは なぜ5億本のシリーズに？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: アウトなのに、5億本！？
# ---- 1970年代・町田の雑木林（30秒以内。子供時代は演じない。言葉は TIME 1999 の訳。あだ名は1回。背景差し替え：雑木林 → 造成地） ----
- id: ch1_mushi
  title: 虫がいなくなった町
  background: pk_zokibayashi
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 田尻, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1970年代の東京・町田。ほかの子に虫博士と呼ばれた田尻は、同じ取材で子どものころをこう話しています。
    reading: せんきゅうひゃく ななじゅうねんだいの とうきょう まちだ。ほかの こに むしはかせと よばれた たじりわ、おなじ しゅざいで こどもの ころお こう はなして います。
  - speaker: zundamon
    emotion: happy
    text: 虫を集めることに、すごく興味があったんです。
  - speaker: zundamon
    emotion: sad
    text: やがて開発が進むにつれて、虫はみんな追い払われていきました。
    background: pk_zokibayashi_zosei
  - speaker: reimu
    text: 町から消えた虫が、なぜ5億本のシリーズにつながるのか。
    reading: まちから きえた むしが、なぜ ごおくほんの しりーずに つながるのか。
# ---- 1980年代のはじめ・手書きの雑誌（1万部の別冊は言わない。杉森の手紙は2016年の鼎談の言葉のまま。杉森は台詞なし） ----
- id: ch1_doujin
  title: ''
  background: pk_doujin
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 田尻, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1980年代のはじめ。高専の田尻は、手書きのゲーム雑誌ゲームフリークを作ります。
    reading: せんきゅうひゃく はちじゅうねんだいの はじめ。こうせんの たじりわ、てがきの げーむざっし げーむふりーくお つくります。
  - speaker: reimu
    text: 雑誌に手紙を送ってきたのが、のちにキャラクターをまとめる杉森建。田尻は2016年にこう話しています。
    reading: ざっしに てがみお おくって きたのが、のちに きゃらくたーお まとめる すぎもり けん。たじりわ にせん じゅうろくねんに こう はなして います。
  - speaker: zundamon
    emotion: happy
    text: 僕もかなりゲームをやったと思っていたのに、
  - speaker: zundamon
    emotion: surprised
    text: タイトーのナナハンライダーみたいな自分が知らないゲームばかりを、
  - speaker: zundamon
    emotion: happy
    text: '[杉森|スギモリ]くんは書いてくるんです。'
    beat: true
# ---- 1989年4月・株式会社ゲームフリーク（年号カード1枚目。社員は名前の無いモブ） ----
- id: card1989
  title: ''
  background: pk_card_1989
  bgm: pop
  cuts:
  - speaker: reimu
    text: 1989年4月。23歳の田尻は、雑誌と同じ名前の会社を作ります。株式会社ゲームフリーク。
    reading: せんきゅうひゃく はちじゅうきゅうねん しがつ。にじゅうさんさいの たじりわ、ざっしと おなじ なまえの かいしゃお つくります。かぶしきがいしゃ げーむ ふりーく。
- id: ch2_kaisha
  title: ''
  background: pk_mansion
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 田尻, emotion: normal}
  - {who: shain, x: 0.8, emotion: happy}
  cuts:
  - speaker: shain
    emotion: happy
    text: 社長、名刺ができました。
  - speaker: zundamon
    emotion: surprised
    text: ……社長って、ボクのことなのだ？
  - speaker: shain
    emotion: normal
    text: はい。[下北沢|シモキタザワ]のマンションの、社長です。
    beat: true
# ---- 1989〜1990年・ケーブルを見た日（2:00 までに着く。ゲームボーイの説明は1行。テトリスの名前は出さない。「虫」は脚色で、本人の言葉は「生き物」とナレで言う。背景差し替え：机のゲーム機 → 雑木林の上を伸びるコード） ----
- id: ch2_cable
  title: 勝ち負けじゃない
  background: pk_cable
  bgm: curious
  stage:
  - {who: zundamon, x: 0.14, flip: true, tag: 田尻, emotion: normal}
  - {who: shain, x: 0.86, emotion: normal}
  cuts:
  - speaker: reimu
    text: 同じ年、任天堂が携帯ゲーム機のゲームボーイを出します。2台をケーブルでつなげる機械です。
    reading: おなじ とし、にんてんどうが けいたい げーむきの げーむぼーいお だします。にだいお けーぶるで つなげる きかいです。
  - speaker: shain
    emotion: normal
    text: そのケーブル、落ちものパズルの対戦に使うやつですよね。
  - speaker: zundamon
    emotion: thinking
    text: 勝ち負けだけに使うのは、もったいない。
  - speaker: shain
    emotion: surprised
    text: じゃあ、何を送るんです？
  - speaker: zundamon
    emotion: happy
    text: ……虫なのだ。
  - speaker: shain
    emotion: surprised
    text: 虫！？
    se: bikkuri
  - speaker: reimu
    text: 本人の言葉では、生き物。田尻は1999年に、こう話しています。
    reading: ほんにんの ことばでわ、いきもの。たじりわ せんきゅうひゃく きゅうじゅうきゅうねんに、こう はなして います。
  - speaker: zundamon
    emotion: normal
    text: ゲームボーイの、通信のところ。心に強く残るイメージでした。
  - speaker: zundamon
    emotion: happy
    text: あのケーブルに、すごく興味をひかれました。
  - speaker: zundamon
    emotion: happy
    text: 本物の生き物が、ケーブルの上を行ったり来たりするのを思い浮かべたんです。
    background: pk_atama
  - speaker: zundamon
    emotion: normal
    text: みんな、対戦に使っていました。
  - speaker: zundamon
    emotion: happy
    text: 考えたのは、情報が行ったり来たりすること。勝ち負けの話じゃなかった。
    telops:
    - {text: "田尻「勝ち負けの話じゃなかった」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: shain
    emotion: surprised
    text: 相手と、取り替えっこするんですか？
  - speaker: zundamon
    emotion: happy
    text: そう。交換だ。
  - speaker: shain
    emotion: thinking
    text: 生き物を、どうやって持ち歩くんです？
  - speaker: zundamon
    emotion: happy
    text: カプセルに、入れる。
  - speaker: reimu
    text: 企画の名前は、カプセルモンスター。この交換のゲームが、なぜ発売まで6年もかかるのか。
    reading: きかくの なまえわ、かぷせる もんすたー。この こうかんの げーむが、なぜ はつばいまで ろくねんも かかるのか。
# ---- 1990年・任天堂へ（年号カード2枚目。「断られた」と言わない。担当は名前の無いモブで冷たくしない。宮本は台詞なし、師の話は TIME の地の文と田尻の言葉） ----
- id: card1990
  title: ''
  background: pk_card_1990
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1990年。田尻は、この企画を任天堂に持ち込みます。
    reading: せんきゅうひゃく きゅうじゅうねん。たじりわ、この きかくお にんてんどうに もちこみます。
- id: ch2_nintendo
  title: 分かってもらえない企画
  background: pk_kaigi
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 田尻, emotion: happy}
  - {who: nin, x: 0.8, emotion: normal}
  cuts:
  - speaker: nin
    emotion: normal
    text: ……交換、ですか。
  - speaker: zundamon
    emotion: happy
    text: はい。集めた生き物を、友だちと交換するんです。
  - speaker: nin
    emotion: thinking
    text: それで、どこが面白いんでしょう。
  - speaker: zundamon
    emotion: normal
    text: ケーブルの上を、生き物が行ったり来たりするんです。
  - speaker: nin
    emotion: thinking
    text: ……対戦では、ないんですね。
  - speaker: zundamon
    emotion: thinking
    text: ……うまく、言えません。
  - speaker: reimu
    text: ゲームのコンセプトが、よく分からなかったと聞かされた。田尻は1999年に、そう話しています。
    reading: げーむの こんせぷとが、よく わからなかったと きかされた。たじりわ せんきゅうひゃく きゅうじゅうきゅうねんに、そう はなして います。
  - speaker: reimu
    text: 任天堂の宮本茂は田尻の師匠になり、助言を続けます。田尻は同じ取材で、こう話しています。
    reading: にんてんどうの みやもと しげるわ たじりの ししょうに なり、じょげんお つづけます。たじりわ おなじ しゅざいで、こう はなして います。
  - speaker: zundamon
    emotion: normal
    text: もらった助言は、ひとつ残らず覚えました。
  - speaker: zundamon
    emotion: happy
    text: 心の師匠です。
  - speaker: reimu
    text: それでも任天堂は、田尻のゲーム作りを買って契約します。交換のゲームは、なぜ5億本に届くのか。
    reading: それでも にんてんどうわ、たじりの げーむづくりお かって けいやく します。こうかんの げーむわ、なぜ ごおくほんに とどくのか。
# ---- 1991〜1994年・ほかのゲームで食いつなぐ（止まった年・再開した年は言わない。横井は1行。ゲームの画は出さず名前の紙だけ。背景はシーンごとに紙が1枚ずつ増え、うちのゲームの字があせる） ----
- id: ch3_board
  title: ほかの仕事で食いつなぐ
  background: pk_board
  bgm: pop
  stage:
  - {who: zundamon, x: 0.14, flip: true, tag: 田尻, emotion: normal}
  - {who: shain, x: 0.86, emotion: normal}
  cuts:
  - speaker: reimu
    text: 発売まで、ここから6年。小学1年生が、卒業するまでの長さです。
    reading: はつばいまで、ここから ろくねん。しょうがく いちねんせいが、そつぎょう するまでの ながさです。
  - speaker: shain
    emotion: normal
    text: 社長、ホワイトボードに次の仕事を貼りますね。
  - speaker: zundamon
    emotion: surprised
    text: うちのゲームの横に！？
  - speaker: reimu
    text: 1991年の暮れ。任天堂の横井軍平に頼まれた、ヨッシーのたまごが出ます。
    reading: せんきゅうひゃく きゅうじゅういちねんの くれ。にんてんどうの よこい ぐんぺいに たのまれた よっしーの たまごが でます。
  - speaker: shain
    emotion: happy
    text: 社長、ヨッシーが当たりました！
  - speaker: zundamon
    emotion: happy
    text: ……これで、もう少し続けられる。
  - speaker: shain
    emotion: thinking
    text: うちのゲームは、いつ作るんです？
  - speaker: zundamon
    emotion: thinking
    text: ……次の仕事の、あとだ。
    beat: true
- id: ch3_board_masuda
  title: ''
  background: pk_board
  stage:
  - {who: zundamon, x: 0.14, flip: true, tag: 田尻, emotion: normal}
  - {who: masuda, x: 0.86, emotion: happy}
  cuts:
  - speaker: reimu
    text: 設立のときからの社員、増田順一は2019年にこう話しています。
    reading: せつりつの ときからの しゃいん、ますだ じゅんいちわ にせん じゅうきゅうねんに こう はなして います。
  - speaker: masuda
    emotion: happy
    text: 当たってくれて、本当にありがたかった。おかげで、助かったんです。
- id: ch3_board2
  title: ''
  background: pk_board_2
  stage:
  - {who: zundamon, x: 0.14, flip: true, tag: 田尻, emotion: normal}
  - {who: ishihara, x: 0.86, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1993年には、マリオとワリオ。エイプという会社の、石原恒和たちと作ります。
    reading: せんきゅうひゃく きゅうじゅうさんねんにわ、まりおと わりお。えいぷと いう かいしゃの いしはら つねかずたちと つくります。
  - speaker: reimu
    text: 石原は2016年に、エイプにいたころ初めて企画書を見た印象をこう話しています。
    reading: いしはらわ にせん じゅうろくねんに、えいぷに いた ころ はじめて きかくしょお みた いんしょうお こう はなして います。
  - speaker: ishihara
    emotion: thinking
    text: 企画として荒削りな所もあって、技術的な検証もできていないものでしたが、
  - speaker: ishihara
    emotion: happy
    text: これが実現できれば今までとは全く違う遊びが
  - speaker: ishihara
    emotion: happy
    text: できるんじゃないかという印象はありましたね。
- id: ch3_board2b
  title: ''
  background: pk_board_2
  stage:
  - {who: zundamon, x: 0.14, flip: true, tag: 田尻, emotion: normal}
  - {who: shain, x: 0.86, emotion: normal}
  cuts:
  - speaker: shain
    emotion: normal
    text: 社長、2枚目を貼ります。
  - speaker: zundamon
    emotion: thinking
    text: うちのゲームは……？
  - speaker: shain
