  - speaker: tsumugi
    emotion: thinking
    text: 石原は最初、アニメにも反対だったと2010年に話しているの。
  - speaker: tsumugi
    emotion: normal
    text: テレビのアニメは、長く続かないことが多いからって。
  - speaker: zundamon
    emotion: surprised
    text: 反対されてたのに、ボクは毎週見てたのだ！
  - speaker: zundamon
    emotion: happy
    text: パンのシールも、カードも集めたなあ。
  - speaker: tsumugi
    emotion: normal
    text: ポケモンパンは1998年。映画の1作目も、同じ年の夏よ。
  - speaker: zundamon
    emotion: happy
    text: 金・銀は、ゲームボーイカラーで遊んだ！
  - speaker: tsumugi
    emotion: normal
