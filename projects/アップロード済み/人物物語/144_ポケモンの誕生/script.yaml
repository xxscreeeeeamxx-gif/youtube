# ---- 論争1：すぐ大ヒットした？（7-1。13万本は「とされる」。石原の2016年の問いと答えは原文の組み合わせのまま） ----
- id: ronso1
  title: すぐ大ヒットした？
  background: pk_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: angry
    text: ネットで見たのだ！ ポケモンは、出してすぐ大ヒットしたって！
  - speaker: tsumugi
    emotion: normal
    text: 赤・緑あわせた初日の出荷は、[13万本|ジュウサンマンボン]ほどとされるわ。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: 石原は、ベストテンのぎりぎりの所だったと振り返っているの。
  - speaker: zundamon
    emotion: surprised
    text: ぎりぎり！？
  - speaker: tsumugi
    emotion: normal
    text: 週間の1位は、1年半を過ぎてから。
  - speaker: tsumugi
    emotion: normal
    text: コロコロの[久保|クボ]も2021年に、こう話しているわ。
  - speaker: tsumugi
    emotion: normal
    text: ただ、初見でここまでのビッグヒットを見通せたかというと、
  - speaker: tsumugi
    emotion: normal
    text: まったく、そんなことはなかったですね。
  - speaker: zundamon
    emotion: surprised
    text: 雑誌の人も、見通せなかったのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 交換がユーザーにとって一番楽しいポイントになるはずだ、という確信はあったのか。
  - speaker: tsumugi
    emotion: normal
    text: 2016年にそう聞かれた石原は、こう答えているわ。
  - speaker: tsumugi
    emotion: thinking
    text: いや、確信はもてませんでした。
  - speaker: tsumugi
    emotion: normal
    text: それでも信じて、それを楽しんで貰う仕掛けは導入していました。
  - speaker: zundamon
    emotion: thinking
    text: 確信は無いのに、仕掛けは入れてた……。
  - speaker: tsumugi
    emotion: normal
    text: 火をつけたのは、口コミとミュウとコロコロ。そこに、青とカードとアニメが続いたの。
  - speaker: zundamon
    emotion: thinking
    text: 1年半かけて、子どもの口から口へ……。
    beat: true
# ---- 論争2：ミュウは仕組まれた？（7-2。森本の2010年の言葉の訳。バグの中身・手順は言わない） ----
- id: ronso2
  title: ミュウは仕組まれた？
  background: pk_heya
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: angry}
  - {who: tsumugi, x: 0.8, emotion: normal}
