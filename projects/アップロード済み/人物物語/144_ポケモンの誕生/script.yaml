  - speaker: tsumugi
    emotion: normal
    text: そう見えるわね。ゲームの中では手に入らず、雑誌の企画で配ったから。
  - speaker: tsumugi
    emotion: normal
    text: 田尻は1999年に、隠しキャラかと聞かれてこう答えているの。
  - speaker: tsumugi
    emotion: normal
    text: ええ。これは、わざとです。
  - speaker: tsumugi
    emotion: normal
    text: ミュウは、交換でしか手に入りません。
  - speaker: zundamon
    emotion: surprised
    text: やっぱり、仕組んでたのだ！
  - speaker: tsumugi
    emotion: normal
    text: でも入れた森本は2010年に、こう話しているの。
    se: hammer
  - speaker: tsumugi
    emotion: normal
    text: 発売のあとの企画に使えればと、残しておいたものでした。
  - speaker: tsumugi
    emotion: normal
    text: それが思わぬバグで、一部の人のゲームに出てきてしまいました。
  - speaker: tsumugi
    emotion: normal
    text: まるで全部計画したように見えた。でも、そうではなかった。
  - speaker: zundamon
    emotion: thinking
    text: 隠したのは、わざと。出てきたのは、バグ……。
    beat: true
# ---- 本当の注意点（7章の1と2。株主総会の言葉は原文のまま。店・サイトを名指ししない。3の光の点滅は入れない） ----
