  - speaker: tsumugi
    emotion: normal
    text: 初日の[13万本|ジュウサンマンボン]ほどとされる数も、出荷の数よ。
  - speaker: tsumugi
    emotion: normal
    text: ニュースの売れたは、出荷か販売かを見てね。
