meta:
  title: 「アウトだと分かっていて」任天堂へ持ち込んだポケモン、5億本のシリーズに【ずんだもん解説】
  slug: pokemon-tajiri
  hook_line: 考えた本人がアウトだと思ったゲームは、なぜ5億本のシリーズになったのか。
  summary: 1995年の秋、ゲームフリークの田尻智は仕上がったカセットを任天堂へ持っていきます。2台のゲーム機をつなぐケーブルで、勝ち負けではなく生き物を行き来させる。それまで対戦に使われていたケーブルの、新しい遊び方でした。小さな会社はほかの仕事で食いつなぎながら、6年かけて形にします。売れない2月に出たゲームは、週間1位まで1年半。何が火をつけたのか。本人と作り手たちの公の言葉をもとに、再現ドラマでたどります。（2026年11月時点）
  sources:
