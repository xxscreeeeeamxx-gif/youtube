# pokemon-tajiri 読み台帳（人名・地名・社名・専門語）
# ナレ（ゆっくり）は全行 reading: のひらがなで読ませている。
# セリフ（VOICEVOX）に出る台帳の語は、台本の全出現に [表示|よみ] タグを付けてある。
# 名札（tag: 田尻 / label: 任天堂の人・社員・増田・石原・森本・編集部員・久保・店員・子ども）・
# テロップ・章タイトル・meta は表示専用なのでタグを付けていない。
#
# 2026-11-19 台本を書いたあと、セリフ全行を VOICEVOX の audio_query（話者3）にかけた結果:
# - 田尻 はタグなしで タジリ（タジリサンワ・タジリワ・タジリ）。[田尻|タジリ] にすると抑揚の山が変わる
#   （タジリサンワ 6→2）→ セリフはタグなし。台帳には ナレだけの「田尻智」を入れ、「田尻」単独は入れていない。
# - 石原 はタグなしで イシハラ（イシハラサンノ・イシハラワ）。台帳には ナレだけの「石原恒和」を入れた。
# - 森本 はタグなしで モリモトワ（1語）。[森本|モリモト] は モリ/モトワ と切れた → タグなし。台帳には「森本茂樹」だけ。
# - 久保 はタグありでも クボモ（1語）→ セリフは [久保|クボ]。下北沢 は [下北沢|シモキタザワ] で シモキタザワノ（1語）。
#   古川 は [古川|フルカワ] で フルカワシャチョオワ（1語）。杉森 は [杉森|スギモリ] で スギモリクンワ（1語）。
# - 「年にこう話している」が コオワ/シテ と崩れた（久保・森本の行）→「〇年に、こう話している」と読点を置いて コオ/ハナシテ。
# - 先々月 が サキザキ/ツキ になった →「その前の月」。表に出ない が ヒョオニ になった →「人前に出ない」。
# - 13万本・30万本・60万本・5億1500万本 はタグなしだと ジュウ/サンマンボン のように2句に割れた
#   → [13万本|ジュウサンマンボン]・[30万本|サンジュウマンボン]・[60万本|ロクジュウマンボン]・
#     [5億1500万本|ゴオクセンゴヒャクマンボン] で1句。「約13万本」は ヤクジュウ/サンマンボン になるので「13万本ほど」にした。
# - 任天堂（ニンテンドオ）・ゲームボーイ・ゲームフリーク・ポケモン・ミュウ・コロコロ・ナナハンライダー・タイトー・
#   ウインド・ウェーブ・ANA（エイエヌエイ）・JR東日本（ジェイアアルヒガシニホン）・株式会社ポケモン・株主総会（カブヌシソオカイ）・
#   二塁（ニルイ）・名刺（メエシ）・図鑑（ズカン）・品切れ（シナギレ）・満杯（マンパイ）・荒削り（アラケズリ）・
#   全角（ゼンカク）・原稿用紙・お年玉・廊下（ロオカ）・10校（ジュッコオ）・兄ちゃん（ニイチャン）・投機的・受注販売・
#   締結（テエケツ）・分身（ブンシン）・ゼロサム（ゼロ/サム）・金・銀（キン/ギン）・赤・緑（アカ/ミドリ）は正しく読んだ。台帳には入れていない。
# 2026-11-19 見直しの直しのあと、変えたセリフ（考えた本人・書いてから4年・冷やす・あおぎます・社長の顔・全員一斉に・
#   通信ケーブル・ベストテンのぎりぎりだった・田尻と同じサトシ・分身かと・ユーザーにとって・口コミとミュウとコロコロ・
#   隠しキャラかと・わざとです・交換でしか・残しておいた・新作のウインド・ウェーブ・座談会）を audio_query で確かめた。崩れは無い。
#   ナレの「師になって」は「しに」と聞こえるので「師匠になり（ししょうに なり）」にした。
