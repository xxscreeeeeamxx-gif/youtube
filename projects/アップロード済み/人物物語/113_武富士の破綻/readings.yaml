# takefuji-takei 読み台帳（人名・社名・地名・専門語）
# セリフ（VOICEVOX）に出る語は、台本の全出現に [表示|よみ] タグを付けてある。
# ナレ（ゆっくり）は reading: のひらがなで読ませている。
# 名札（tag: 武井保雄 / label: 国税庁次長・裁判長・社長 ほか）とテロップ・章タイトルは表示専用なのでタグを付けていない。
# 2026-11-02 VOICEVOX の audio_query で確かめたこと:
# - 武井保雄 はタグなしでも タケイ/ヤスオ と読むが、[武井保雄|たけいやすお] と語全体にタグを付けると
#   タケイヤス/オシデ に切れた。国税庁次長の答弁では [武井|たけい]保雄氏 と姓だけタグにした（タケイ/ヤスオシデ）。
#   セリフで名前が出るのは、この答弁と判決の主文「被告人[武井|たけい]保雄を」（ヒコクニン/タケイ/ヤスオオ）の2か所だけ（ほかはナレと名札）。
# - 武富士 はタグありでもなしでも タケフジ。セリフの全出現に [武富士|たけふじ] を付けた。
#   ただし茶番の「…生んだ、[武富士|たけふじ]よ。」は タケ/フジヨ に切れたので、そこだけカタカナのタグ [武富士|タケフジ] にした（タケフジヨ）。
# - 利息制限法・出資法・貸金業規制法・過払い金 はタグなしで リソクセエゲンホオ・シュッシホオ・
#   カシキンギョオキセエホオ・カバライキン と正しく1語で読む。ひらがなのタグを付けると
#   出資法＝シュッ/シホオ、貸金業規制法＝カシキン/ギョオキセイホオ に切れたので、台帳には入れずタグも付けていない
#   （台帳に入れるとセリフの全出現にタグが要るため）。ナレは reading: で りそくせいげんほう・しゅっしほう・かばらいきん。
# - 「年18%」は タグなしだと トシジュウハチ になったので、本文で [年|ねん] を付けた（台帳には入れない）。
# - 「何だ」は ナニダ になったので、本文で [何|なん] を付けた。金（かね）も本文の該当箇所だけタグを付けた。
# - 金貸し はタグなしで カネカシ と読む（[金貸し|かねかし] にすると カネカ/シサン に切れた）ので、タグを付けていない。
# - アコム・盗聴・伸長（全店二〇％伸長せよ＝ゼンテン/ニジュッパアセント/シンチョオ/セヨ）・総量規制・4坪 は
#   タグなしで正しく読む。
# - 蓮根（はすね）・深谷（ふかや）・日歩（ひぶ）は台本に出さなかった。
