scenes:
# ---- 先出し（1994年6月13日の国会 → 2004年2月24日の初公判） ----
- id: co_kokkai
  title: ''
  background: bf_kokkai
  bgm: serious
  stage:
  - {who: jicho, x: 0.56, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1994年6月、国会。日本一の納税者の名前が、読み上げられました。
    reading: せんきゅうひゃく きゅうじゅうよねん ろくがつ、こっかい。にほんいちの のうぜいしゃの なまえが、よみあげられました。
  - speaker: jicho
    emotion: normal
    text: 最も高額であった者は[武井|たけい]保雄氏で、
  - speaker: jicho
    emotion: normal
    text: その所得税の額は四十三億一千八百四十七万円でございます。
- id: co_houtei
  title: ''
  background: bf_houtei
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 武井保雄, emotion: thinking}
  - {who: saibancho, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 10年後。その男は、被告人席にいました。
    reading: じゅうねんご。その おとこわ、ひこくにんせきに いました。
  - speaker: saibancho
    emotion: normal
    text: 起訴状の内容に、間違いはありますか。
  - speaker: zundamon
    emotion: sad
    text: ……間違いありません。
    se: don
  - speaker: reimu
    text: 武井保雄。団地の主婦への小口の貸し付けから、武富士を育てた男です。
    reading: たけい やすお。だんちの しゅふえの こぐちの かしつけから、たけふじお そだてた おとこです。
  - speaker: reimu
    text: この6年後、彼の会社は、払いすぎた利息を返してと言える200万人以上の前で倒れます。
    reading: この ろくねんご、かれの かいしゃわ はらいすぎた りそくお かえしてと いえる にひゃくまんにん いじょうの まえで たおれます。
# ---- 今の部屋（テレビの広告） ----
- id: hook
  title: ''
  background: bf_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: テレビで、払いすぎた利息は取り戻せるって！ ボクにも戻ってくるのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 借りたこと、ないでしょ。
    beat: true
  - speaker: zundamon
    emotion: sad
    text: ……ない。
  - speaker: tsumugi
    emotion: normal
    text: その利息で倒れた会社があるの。
  - speaker: tsumugi
    emotion: normal
    text: 日本一の納税者を生んだ、[武富士|タケフジ]よ。
    telops:
    - {text: "日本一の納税者の会社が なぜ倒れた？", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 日本一の納税者の会社が、なんで払いすぎた利息で倒れたの！？
# ---- 1966年・板橋の4坪と団地 ----
- id: card1966
  title: ''
  background: bf_card_1966
  bgm: hirusagari
  cuts:
  - speaker: reimu
    text: 1966年、東京・板橋。36歳の武井は、4坪の事務所でお金を貸し始めます。
    reading: せんきゅうひゃく ろくじゅうろくねん、とうきょう いたばし。さんじゅうろくさいの たけいわ、よんつぼの じむしょで おかねお かしはじめます。
- id: ch1_4tsubo
  title: 現金の出前
  background: bf_4tsubo
  stage:
  - {who: zundamon, x: 0.4, flip: true, tag: 武井保雄, emotion: happy}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: はい！ 団地の奥様ですね。
  - speaker: zundamon
    emotion: normal
    text: 担保も保証人も、要りません。
  - speaker: zundamon
    emotion: happy
    text: 今から、お届けにあがります！
    background: bf_danchi
- id: ch1_danchi
  title: ''
  background: bf_danchi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 武井保雄, emotion: happy}
  - {who: kyaku, x: 0.7, emotion: thinking}
  cuts:
  - speaker: kyaku
    emotion: thinking
    text: ……主人には、内緒でお願いしますね。
  - speaker: zundamon
    emotion: happy
    text: もちろんです。
  - speaker: kyaku
    emotion: surprised
    text: 本当に、審査はないんですか？
  - speaker: zundamon
    emotion: normal
    text: この団地の入居の審査を、通った[方|かた]ですから。
  - speaker: kyaku
    emotion: surprised
    text: 団地の審査が、そのまま金貸しの審査に！？
    se: bikkuri
  - speaker: zundamon
    emotion: happy
    text: 団地に住めるのが、何よりの信用です。
  - speaker: reimu
    text: 武井はのちに、経済誌でこう語っています。
    reading: たけいわ のちに、けいざいしで こう かたって います。
  - speaker: zundamon
    emotion: normal
    text: この商売は信用が第一。
    telops:
    - {text: "武井「この商売は信用が第一」", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: reimu
    text: この一言が、あとで効いてきます。
    reading: この ひとことが、あとで きいて きます。
# ---- 1983年・2本の線 ----
- id: card1983
  title: ''
  background: bf_card_1983
  bgm: curious
  cuts:
  - speaker: reimu
    text: 1983年。武富士は、消費者金融の大手になっていました。
    reading: せんきゅうひゃく はちじゅうさんねん。たけふじわ、しょうひしゃ きんゆうの おおてに なって いました。
- id: ch2_kaigi
  title: 2本の線
  background: bf_kaigi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 武井保雄, emotion: normal}
  - {who: kanbu, x: 0.7, emotion: normal}
  cuts:
  - speaker: kanbu
    emotion: normal
    text: 11月から、出資法の上限が73%に下がります。超えたら刑事罰です。
  - speaker: zundamon
    emotion: thinking
    text: 刑事罰の線か。
  - speaker: kanbu
    emotion: normal
    text: もう1本、利息制限法の線があります。50万円なら、[年|ねん]18%まで。
  - speaker: kanbu
    emotion: normal
    text: 超えた分は、無効です。
  - speaker: zundamon
    emotion: angry
    text: 無効なら、18%より上は取れんだろう。
  - speaker: kanbu
    emotion: thinking
    text: そこで新しい貸金業規制法です。お客様が利息として任意に払えば、有効とみなされます。
  - speaker: zundamon
    emotion: thinking
    text: ……任意に、か。
  - speaker: zundamon
    emotion: happy
    text: 2本の線の、すき間だな。
    se: hirameki
  - speaker: reimu
    text: 刑事罰の線より下で、無効の線より上。この間の金利は、グレーゾーン金利と呼ばれます。
    reading: けいじばつの せんより したで むこうの せんより うえ。この あいだの きんりわ、ぐれーぞーん きんりと よばれます。
    telops:
    - {text: "2本の線のすき間＝グレーゾーン金利", size: md, position: top-right, color: "#FFFFFF", stroke: "#1E222E", glow: "#3A6AFF", anim: up}
  - speaker: reimu
    text: このすき間の利息を、会社はのちに返すことになります。
    reading: この すきまの りそくお、かいしゃわ のちに かえす ことに なります。
# ---- 2000年・明細書の裏の一文 ----
- id: card2000
  title: ''
  background: bf_card_2000
  cuts:
  - speaker: reimu
    text: 2000年6月。刑事罰の線は、29.2%まで下がります。
    reading: にせんねん ろくがつ。けいじばつの せんわ、にじゅうきゅうてん にぱーせんとまで さがります。
- id: ch2_meisai
  title: 明細書の裏の一文
  background: bf_kaicho
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 武井保雄, emotion: normal}
  - {who: kanbu, x: 0.7, emotion: normal}
  cuts:
  - speaker: kanbu
    emotion: normal
    text: 会長、お客様にお渡しする明細書です。
  - speaker: zundamon
    emotion: thinking
    text: ……裏の、この一文は[何|なん]だ。
  - speaker: kanbu
    emotion: normal
    text: 1回でも返済が遅れたら、残り全部を一括で返していただく特約です。
  - speaker: zundamon
    emotion: happy
    text: 遅れなければ、関係ないな。
  - speaker: kanbu
    emotion: normal
    text: はい。約束の利息を、きちんと払っていただければ。
  - speaker: reimu
    text: 2006年の判決の前、武富士の上限金利は27.375%でした。
    reading: にせん ろくねんの はんけつの まえ、たけふじの じょうげん きんりわ にじゅうなな てん さんななご ぱーせんとでした。
  - speaker: kanbu
    emotion: normal
    text: 50万円を1年なら、利息は13万6875円。利息制限法の18%なら、9万円です。
    telops:
    - {text: "50万円を1年　13万6875円 対 9万円", size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: normal
    text: 差は、4万6875円か。
  - speaker: kanbu
    emotion: normal
    text: お客様が、任意に払ってくださる分です。
  - speaker: zundamon
    emotion: happy
    text: うちのお客様は、きちんとしてる。団地の奥様のころからな。
  - speaker: reimu
    text: 裏のあの一文と同じ形の特約を、2006年、最高裁が突きます。武富士とは別の業者の裁判でした。
    reading: うらの あの いちぶんと おなじ かたちの とくやくお、にせん ろくねん さいこうさいが つきます。たけふじとわ べつの ぎょうしゃの さいばんでした。
# ---- 2000年11月・株価の急落と疑い ----
- id: ch3_kabuka
  title: 株価の急落
  background: bf_shoken
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 武井保雄, emotion: normal}
  - {who: kanbu, x: 0.7, emotion: surprised}
  cuts:
  - speaker: kanbu
    emotion: surprised
    text: 会長！ 株価が、今日もストップ安です！
    se: gaan
  - speaker: zundamon
    emotion: surprised
    text: 昨日もだぞ！
  - speaker: zundamon
    emotion: angry
    text: うちの数字は、どこも悪くないはずだ。
  - speaker: kanbu
    emotion: thinking
    text: はい。貸付も利益も、伸びています。
  - speaker: zundamon
    emotion: angry
    text: なら、なぜ売られる。
  - speaker: kanbu
    emotion: thinking
    text: うちを批判する記事が、続いていまして……。
  - speaker: zundamon
    emotion: angry
    text: 記事で、ここまで下がるものか。
  - speaker: zundamon
    emotion: thinking
    text: ……あの記事の裏に、誰かがいる。
  - speaker: reimu
    text: 判決はのちに、武井が批判的な記者2人の背後に黒幕的な人物がいると疑い、
    reading: はんけつわ のちに たけいが ひはんてきな きしゃ ふたりの はいごに くろまくてきな じんぶつが いると うたがい、
  - speaker: reimu
    text: 放っておけば株価が下がると恐れた、と認めています。
    reading: ほうって おけば かぶかが さがると おそれたと みとめて います。
  - speaker: reimu
    text: 2000年12月から翌年2月。記者2人の電話に盗聴器が仕掛けられ、会話が録音されました。
    reading: にせんねん じゅうにがつから よくねん にがつ。きしゃ ふたりの でんわに とうちょうきが しかけられ、かいわが ろくおん されました。
  - speaker: reimu
    text: 裁判所は、武井が法務の担当者らと共謀した、と認めています。
    reading: さいばんしょわ たけいが ほうむの たんとうしゃらと きょうぼう したと みとめて います。
# ---- 2002年・業界のトップ ----
- id: ch3_top
  title: 業界のトップ
  background: bf_kaicho
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 武井保雄, emotion: happy}
  - {who: kanbu, x: 0.7, emotion: happy}
  cuts:
  - speaker: kanbu
    emotion: happy
    text: 会長！ 2002年3月期の貸付残高、約1兆7667億円。業界のトップです！
  - speaker: zundamon
    emotion: happy
    text: ……4坪から、ここまで来たか。
    se: levelup
  - speaker: kanbu
    emotion: happy
    text: 前の期の純利益も、1272億円でしたからね。
  - speaker: kanbu
    emotion: happy
    text: 上場のときの理念は、お客様第一主義です。
  - speaker: zundamon
    emotion: happy
    text: 信用が第一で、お客様も第一か。
  - speaker: kanbu
    emotion: normal
    text: 第一が、2つありますね。
  - speaker: zundamon
    emotion: angry
    text: ……細かいことを言うな。
    beat: true
  - speaker: kanbu
    emotion: happy
    text: 会長の名前も、国会で日本一の納税者と読み上げられましたし。
  - speaker: zundamon
    emotion: normal
    text: 8年も前の話を、まだ言うか。
  - speaker: reimu
    text: 業界のトップに立った会社は、8年後に倒れます。答えは、あの2つの線の間にありました。
    reading: ぎょうかいの とっぷに たった かいしゃわ はちねんごに たおれます。こたえわ、あの ふたつの せんの あいだに ありました。
# ---- 2003年4月・国会 ----
- id: card2003
  title: ''
  background: bf_card_2003
  bgm: serious
  cuts:
  - speaker: reimu
    text: 2003年4月、国会。野党の議員が、武富士の本部が支店に送った文書だというものを示します。
    reading: にせん さんねん しがつ、こっかい。やとうの ぎいんが、たけふじの ほんぶが してんに おくった ぶんしょだと いう ものお しめします。
- id: ch4_kokkai
  title: 国会で示された指示
  background: bf_kokkai
  stage:
  - {who: giin, x: 0.56, emotion: angry}
  cuts:
  - speaker: giin
    emotion: angry
    text: 一月のノルマは三千三十六万円、約三千万円ですね。
  - speaker: giin
    emotion: angry
    text: 毎月毎月、これだけ純増にしなければならない。
  - speaker: reimu
    text: パソコンの画面に出る指示として、議員はこの言葉を示しました。
    reading: ぱそこんの がめんに でる しじと して、ぎいんわ この ことばお しめしました。
  - speaker: giin
    emotion: thinking
    text: 全店二〇％伸長せよ。
    telops:
    - {text: "国会で示された指示「全店二〇％伸長せよ」", size: md, position: top-right, color: "#FF8A8A", stroke: "#2A0A0A", glow: "#CC0000", anim: up}
  - speaker: reimu
    text: 議員は、借り手44人が行政処分を求めて財務局に申し立てた、とも述べています。
    reading: ぎいんわ、かりて よんじゅうよにんが ぎょうせい しょぶんお もとめて ざいむきょくに もうしたてたとも のべて います。
  - speaker: reimu
    text: 金融庁は、武富士への検査の具体的な内容は、答えを差し控えました。
    reading: きんゆうちょうわ たけふじえの けんさの ぐたいてきな ないようわ、こたえお さしひかえました。
# ---- 2003年12月・逮捕 ----
- id: ch4_taiho
  title: 逮捕
  background: bf_kaicho
  stage:
  - {who: kanbu, x: 0.28, flip: true, emotion: sad}
  - {who: shain, x: 0.7, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 2003年12月2日。武井は、電気通信事業法違反の疑いで逮捕されます。73歳でした。
    reading: にせん さんねん じゅうにがつ ふつか。たけいわ でんき つうしん じぎょうほう いはんの うたがいで たいほ されます。ななじゅうさんさいでした。
  - speaker: shain
    emotion: surprised
    text: 会長が、逮捕……！？
  - speaker: kanbu
    emotion: sad
    text: 記者の電話の盗聴を、指示した疑いだそうだ。
