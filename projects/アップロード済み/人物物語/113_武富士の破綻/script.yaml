    text: 年収300万円なら、貸金業者から借りられるのは合わせて100万円までよ。
  - speaker: zundamon
    emotion: thinking
    text: ボクの年収だと……。
  - speaker: tsumugi
    emotion: thinking
    text: まず、年収を作ってね。
    beat: true
  - speaker: zundamon
    emotion: surprised
    text: 銀行のカードローンは？
  - speaker: tsumugi
    emotion: normal
    text: 総量規制の対象外。だから、自分で線を引くことね。
  - speaker: tsumugi
    emotion: normal
    text: それと返済が遅れると、残りを一括で求められて遅延損害金がつくこともあるわ。
  - speaker: zundamon
    emotion: thinking
    text: 明細書の裏の、あの一文……。
  - speaker: tsumugi
    emotion: normal
    text: '[武富士|たけふじ]も2007年12月からは、制限を超える利息は払う義務がないと裏に書いたわ。'
  - speaker: tsumugi
    emotion: normal
    text: そして借りた相手がつぶれると、払いすぎたお[金|かね]もほとんど戻らないことがあるの。
  - speaker: tsumugi
    emotion: thinking
    text: '[武富士|たけふじ]の手続きは2017年に終わって、いまは請求もできないわ。'
  - speaker: zundamon
    emotion: sad
    text: テレビの広告、ボクには関係なかったのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 返済に困ったら、財務局や自治体の多重債務の相談窓口へ。金融庁が一覧を出してるわ。
