meta:
  title: 「間違いありません」と法廷で認めた武富士の創業者、会社は払いすぎた利息200万人分で倒れた【ずんだもん解説】
  slug: takefuji-takei
  hook_line: 日本一の納税者を生んだ武富士は、なぜ「払いすぎた利息」で倒れたのか。
  summary: 1994年、国会で日本一の納税者として名前を読み上げられた男、武井保雄。東京・板橋の4坪の事務所から、団地の主婦への小口の貸し付けで消費者金融の武富士を育てた創業者です。10年後、記者の電話の盗聴事件で被告人席に立ち、起訴事実を認めます。刑事罰の線と無効の線、2つの法律のすき間の金利と、明細書の裏の一文。業界トップの会社は、なぜ「払いすぎた利息」に倒れたのか。判決と国会の会議録をもとに、再現ドラマでたどります。（2026年11月時点）
  sources:
  - 最高裁判所第二小法廷 平成18年1月13日判決（平成16年(受)第1518号） https://www.courts.go.jp/assets/hanrei/hanrei-pdf-52404.pdf
  - 横浜地方裁判所 平成24年7月17日判決（平成22年(ワ)第6906号） https://www.courts.go.jp/assets/hanrei/hanrei-pdf-82481.pdf
  - 参議院 予算委員会 第129回国会 第13号 会議録（1994年6月13日、国税庁次長の答弁） https://kokkai.ndl.go.jp/txt/112915261X01319940613/242
  - 金融庁「貸金業法について」 https://www.fsa.go.jp/policy/kashikin/index.html
  - 金融庁 貸金業制度等に関する懇談会 資料（2006年4月21日） https://www.fsa.go.jp/singi/singi_kasikin/20060421/02.pdf
  - 帝国データバンク 倒産速報「株式会社武富士」 https://www.tdb.co.jp/report/bankruptcy/flash/3351/
  tags:
  - 武富士
  - 武井保雄
  - 消費者金融
  - 過払い金
  - グレーゾーン金利
  - 利息制限法
  - 出資法
  - 会社更生法
  - 盗聴事件
  - 最高裁
  - 高額納税者
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 平成史
