  - speaker: tsumugi
    emotion: normal
    text: ばねで吊るして、揺れても汁がこぼれにくいようにしてるの。
  - speaker: tsumugi
    emotion: normal
    text: 1964年の東京オリンピックでは、その台が聖火の予備のランプを運んだのよ。
  - speaker: zundamon
    emotion: surprised
    text: そばの台が、オリンピックに出たのだ！
  - speaker: tsumugi
    emotion: normal
    text: ベトナムでは、どこの会社のバイクでもホンダと呼ばれるほど広まったわ。
  - speaker: tsumugi
    emotion: normal
    text: 2014年には、形そのものが立体商標になったの。二輪車では初めてよ。
  - speaker: tsumugi
    emotion: normal
    text: 2017年10月、世界の累計生産が1億台を超えたわ。
  - speaker: tsumugi
    emotion: normal
    text: 藤沢さんは2001年に日本の、2023年にはアメリカの自動車殿堂に入ったの。
  - speaker: zundamon
    emotion: happy
    text: 作った人だけじゃなく、売った人もちゃんと残ったのだ。
  - speaker: tsumugi
    emotion: thinking
    text: ただ、50ccのカブは2025年に生産を終えたの。
  - speaker: tsumugi
    emotion: thinking
    text: 新しい排ガスの決まりに、合わせるのが難しかったのよ。
  - speaker: zundamon
    emotion: sad
    text: えっ。ボクの原付の免許で乗れるカブは、もう無いの？
  - speaker: tsumugi
    emotion: happy
    text: 大丈夫。2025年から、125cc以下でも力を抑えたバイクなら原付の免許で乗れるの。
  - speaker: tsumugi
    emotion: normal
    text: ホンダは、スーパーカブ110ライトを出してるわ。
  - speaker: zundamon
    emotion: happy
    text: よかった！ 出前のアルバイト、続けられるのだ！
