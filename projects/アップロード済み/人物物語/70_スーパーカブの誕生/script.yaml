  background: sc_soba
  stage:
  - {who: sobaya, x: 0.28, emotion: surprised}
  - {who: tsumugi, x: 0.7, tag: おかみさん, emotion: normal}
  cuts:
  - speaker: sobaya
    emotion: surprised
    text: ソバも元気だ おっかさん……？ こりゃ、バイクの広告だな。
  - speaker: tsumugi
    emotion: thinking
    text: そば屋に、バイクの広告？
  - speaker: sobaya
    emotion: normal
    text: 左の手で、クラッチを握らなくていいんだとさ。
  - speaker: tsumugi
    emotion: happy
    text: じゃあ、せいろを持ったままでも走れるわね。
  - speaker: sobaya
    emotion: thinking
    text: 自転車の出前だと、坂道でそばが伸びちまうからなあ。
  - speaker: tsumugi
    emotion: happy
    text: あんた。うちも1台、頼んでみようよ。
  - speaker: sobaya
    emotion: happy
    text: よし、注文だ。
  - speaker: reimu
    text: この広告のあと、そば屋などから約4000軒の注文が来ました。藤沢は上機嫌でした。
    reading: この こうこくの あと、そばやなどから やく よんせんけんの ちゅうもんが きました。ふじさわわ じょうきげんでした。
- id: card1960
  title: ''
  background: sc_card_1960
  cuts:
  - speaker: reimu
    text: 1960年。三重県の鈴鹿に、カブを作るための工場が建てられます。
    reading: せんきゅうひゃく ろくじゅうねん。みえけんの すずかに、かぶお つくる ための こうじょうが たてられます。
- id: ch6_suzuka
  title: 資本金の何倍もの工場
  background: sc_suzuka
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: keiri, x: 0.7, emotion: surprised}
  cuts:
  - speaker: keiri
    emotion: surprised
    text: 専務、会社の資本金は14億4000万円ですよ。
  - speaker: keiri
    emotion: surprised
    text: 工場の見積もりは、70億から100億円です！
  - speaker: zundamon
    emotion: normal
    text: 分かってる。
  - speaker: keiri
    emotion: sad
    text: もし売れなかったら、会社がつぶれます。
  - speaker: zundamon
    emotion: normal
    text: 投資の額に、上限は決めない。その代わり、2年で回収する。
  - speaker: keiri
    emotion: surprised
    text: 2年で！？
  - speaker: zundamon
    emotion: happy
    text: 月に何万台も売れるバイクなら、できるのだ。
  - speaker: reimu
    text: 工場は1960年4月に発足し、その年の11月には月に6万台を作れるようになりました。
    background: sc_suzuka_full
    reading: こうじょうわ せんきゅうひゃく ろくじゅうねん しがつに ほっそくし、その としの じゅういちがつにわ つきに ろくまんだいお つくれる ように なりました。
  - speaker: reimu
    text: 1960年の生産は約56万4000台。月にならすと、約4万7000台でした。
    reading: せんきゅうひゃく ろくじゅうねんの せいさんわ やく ごじゅうろくまん よんせんだい。つきに ならすと やく よんまん ななせんだいでした。
  - speaker: keiri
    emotion: surprised
    text: ……月に3万台を、超えてる。
    se: levelup
- id: ch6_sakko
  title: 名前を出さない奨学金
  background: sc_honsha2
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: honda, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1961年。本田と藤沢は、お金に困る学生を支える会を作ります。名前は、作行会です。
    reading: せんきゅうひゃく ろくじゅういちねん。ほんだと ふじさわわ、おかねに こまる がくせいお ささえる かいお つくります。なまえわ さっこうかいです。
  - speaker: honda
    emotion: normal
    text: 学生にお[金|かね]を出したい。どんな会にする？
  - speaker: zundamon
    emotion: normal
    text: 使い道は自由で、返さなくていい。ただし、誰が出しているかは知らせない。
  - speaker: honda
    emotion: surprised
    text: 名前も、出さないのか。
  - speaker: honda
    emotion: happy
    text: ……あんたらしいな。
  - speaker: reimu
    text: 1983年に会を閉じるまでに、延べ1735人を支えました。
    reading: せんきゅうひゃく はちじゅうさんねんに かいお とじるまでに、のべ せんななひゃく さんじゅうごにんお ささえました。
  - speaker: reimu
    text: 二人が出資者だと明かしたのは、会を閉じるときの謝恩会が初めてでした。
    reading: ふたりが しゅっししゃだと あかしたのわ、かいお とじる ときの しゃおんかいが はじめてでした。
- id: ch7_america
  title: アメリカで売れたのは
  background: sc_la
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 最初は、アメリカで苦戦したの。
  - speaker: tsumugi
    emotion: thinking
    text: 大きなバイクは、広い国で速く走り続けて故障が続いたのよ。
  - speaker: zundamon
    emotion: sad
    text: いきなり、つまずいたのだ。
  - speaker: tsumugi
    emotion: happy
    text: そこでホンダは、カブを売る方針に切り替えたの。
  - speaker: tsumugi
    emotion: happy
    text: 釣りやキャンプ、学生の足として人気が出たわ。
  - speaker: tsumugi
    emotion: normal
    text: スポーツ用品店でも、売られるようになったのよ。
  - speaker: zundamon
    emotion: happy
    text: バイク屋にこだわらないのが、日本の自転車屋や材木屋と同じだ。
  - speaker: tsumugi
    emotion: normal
    text: 1963年には、ホンダに乗ると素敵な人に出会えるという広告が始まるの。
  - speaker: zundamon
    emotion: happy
    text: バイクは怖い人の乗り物、という見方を変えたのか。
  - speaker: tsumugi
    emotion: normal
    text: 1964年にはアカデミー賞の中継で、外国の会社として初めてCMを流したわ。
  - speaker: tsumugi
    emotion: normal
    text: ビーチ・ボーイズも、リトル・ホンダを歌ってるの。
- id: ch8_suirei
  title: 社長として残るか
  background: sc_honsha2
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: thinking}
  - {who: kenkyuin, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
    text: 1969年ごろ。車のエンジンを空気で冷やすか水で冷やすかで、社内の意見が割れます。
    reading: せんきゅうひゃく ろくじゅうきゅうねんごろ。くるまの えんじんお くうきで ひやすか みずで ひやすかで、しゃないの いけんが われます。
  - speaker: kenkyuin
    emotion: sad
    text: 副社長。排ガスの規制には、水冷でないと間に合いません。
  - speaker: kenkyuin
    emotion: sad
    text: でも社長は、空冷だと言って聞かないんです。
  - speaker: zundamon
    emotion: thinking
    text: ……分かった。私が、社長と話す。
- id: ch8_ronsou1
  title: ''
  background: sc_honsha2
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: honda, x: 0.7, emotion: angry}
  cuts:
  - speaker: honda
    emotion: angry
    text: 水で冷やしても、その水を空気で冷やすんだ。最初から空冷でいい。
  - speaker: zundamon
    emotion: thinking
    text: 本田さん。社長として残りますか。それとも、技術屋として残りますか。
  - speaker: honda
    emotion: surprised
    text: ……。
  - speaker: honda
    emotion: sad
    text: ……やっぱり、おれは社長として残るよ。
  - speaker: reimu
    text: 本田は社長として残る道を選び、水冷の開発を若い技術者に任せました。
    reading: ほんだわ しゃちょうとして のこる みちお えらび、すいれいの かいはつお わかい ぎじゅつしゃに まかせました。
- id: ch8_soba
  title: ''
  background: sc_kenkyujo
  bgm: 223am
  stage:
  - {who: nishida, x: 0.28, emotion: thinking}
  - {who: honda, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1971年の春。研究所の昼食に、西田通弘は本田とそばを食べながら切り出します。
    reading: せんきゅうひゃく ななじゅういちねんの はる。けんきゅうじょの ちゅうしょくに、にしだ みちひろわ ほんだと そばお たべながら きりだします。
  - speaker: nishida
    emotion: thinking
    text: 社長。そろそろ、バトンタッチを考えていただけないでしょうか。
  - speaker: honda
    emotion: surprised
    text: ……。
  - speaker: honda
    emotion: sad
    text: ……良く言ってくれた。
    se: namida
  - speaker: reimu
    text: 本田は涙をふいて、そう答えました。それでも朝になると、つい研究所へ足が向いたと語っています。
    reading: ほんだわ なみだお ふいて そう こたえました。それでも あさに なると、つい けんきゅうじょえ あしが むいたと かたって います。
- id: card1973
  title: ''
  background: sc_card_1973
  cuts:
  - speaker: reimu
    text: 1973年3月。藤沢は、ひとつの決心をします。
    reading: せんきゅうひゃく ななじゅうさんねん さんがつ。ふじさわわ ひとつの けっしんお します。
- id: ch8_intai
  title: 二人の退任
  background: sc_honsha2
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: nishida, x: 0.7, emotion: surprised}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: 西田くん。おれは今期限りで辞めるよ。本田社長に、そう伝えてくれ。
  - speaker: nishida
    emotion: surprised
    text: お辞めになるんですか。社長は今、中国ですよ。
  - speaker: zundamon
    emotion: normal
    text: 帰ってきたら、伝えてくれ。社長には、ゆっくり考えてもらいたい。
  - speaker: nishida
    emotion: sad
    text: ……分かりました。
- id: ch8_intai2
  title: ''
  background: sc_kuko
  stage:
  - {who: nishida, x: 0.28, emotion: sad}
  - {who: honda, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 羽田空港。中国から戻った本田を、西田が迎えます。
    reading: はねだ くうこう。ちゅうごくから もどった ほんだお、にしだが むかえます。
  - speaker: nishida
    emotion: sad
    text: 社長。藤沢副社長が、今期限りで辞めると。
  - speaker: honda
    emotion: thinking
    text: ……そうか。
  - speaker: honda
    emotion: normal
    text: おれは藤沢武夫あっての社長だ。副社長が辞めるなら、おれも一緒に辞めるよ。
  - speaker: reimu
    text: 報告を聞いた藤沢は、本田に直接言わなかったのは初めての大きな誤りだと感じました。
    reading: ほうこくお きいた ふじさわわ、ほんだに ちょくせつ いわなかったのわ はじめての おおきな あやまりだと かんじました。
  - speaker: reimu
    text: 1973年10月。66歳の本田と62歳の藤沢は、そろって退任しました。
    reading: せんきゅうひゃく ななじゅうさんねん じゅうがつ。ろくじゅうろくさいの ほんだと ろくじゅうにさいの ふじさわわ そろって たいにん しました。
- id: ch8_saigo
  title: まあまあだな
  background: sc_kaigou
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: honda, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 退任が決まったあとの、ある集まり。本田は目で合図をして、藤沢と席を外しました。
    reading: たいにんが きまった あとの ある あつまり。ほんだわ めで あいずお して、ふじさわと せきお はずしました。
  - speaker: honda
    emotion: normal
    text: まあまあだな。
  - speaker: zundamon
    emotion: normal
    text: そう、まあまあさ。
  - speaker: honda
    emotion: happy
    text: 幸せだったな。
  - speaker: zundamon
    emotion: happy
    text: 本当に幸せでした。心からお礼を言います。
  - speaker: honda
    emotion: happy
    text: 俺も礼を言うよ。良い人生だったな。
  - speaker: reimu
    text: このやりとりは、藤沢自身が書き残したものです。
    reading: この やりとりわ、ふじさわ じしんが かきのこした ものです。
- id: ch9_bannen
  title: 六本木の店
  background: sc_kotto
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: mago, x: 0.7, scale: 0.8, emotion: happy}
  cuts:
  - speaker: reimu
    text: 退任のあと藤沢は六本木の自宅を改装し、呉服や骨董を扱う店・高會堂を開きます。
    reading: たいにんの あと ふじさわわ ろっぽんぎの じたくお かいそうし、ごふくや こっとうお あつかう みせ こうかいどうお ひらきます。
  - speaker: reimu
    text: 店に立ったのは、夫人と息子。藤沢はいつも和服で、夜は常磐津の稽古をしました。
    reading: みせに たったのわ ふじんと むすこ。ふじさわわ いつも わふくで、よるわ ときわずの けいこお しました。
  - speaker: reimu
    text: ある日藤沢がお手伝いさんにお茶を頼むと、孫も横から頼みました。
    reading: ある ひ ふじさわが おてつだいさんに おちゃお たのむと、まごも よこから たのみました。
  - speaker: mago
    emotion: happy
    text: 僕も。
  - speaker: zundamon
    emotion: angry
    text: ちょっと待て。おれは脚が悪いから、お願いしたんだ。
  - speaker: zundamon
    emotion: normal
    text: お手伝いさんも、家に帰れば[一城の主|いちじょうのあるじ]だ。
    beat: true
  - speaker: reimu
    text: 孫が描いた絵を、祖母の帯に仕立てて励ましたこともありました。
    reading: まごが かいた えお、そぼの おびに したてて はげました ことも ありました。
  - speaker: reimu
    text: 乗り物の会社の副社長でしたが、車は自分で運転しませんでした。
    reading: のりものの かいしゃの ふくしゃちょうでしたが、くるまわ じぶんで うんてん しませんでした。
- id: card1988
  title: ''
  background: sc_card_1988
  bgm: 223am
  cuts:
  - speaker: reimu
    text: 1988年12月30日。藤沢武夫は、78歳で亡くなりました。
    reading: せんきゅうひゃく はちじゅうはちねん じゅうにがつ さんじゅうにち。ふじさわ たけおわ ななじゅうはっさいで なくなりました。
  - speaker: reimu
    text: 社葬では、本田宗一郎が葬儀委員長を務めました。
    reading: しゃそうでわ、ほんだ そういちろうが そうぎ いいんちょうお つとめました。
- id: ch9_medal
  title: ''
  background: sc_butsudan
  stage:
  - {who: honda, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
    text: 1989年。本田は、アメリカの自動車殿堂に入ります。
    reading: せんきゅうひゃく はちじゅうきゅうねん。ほんだわ あめりかの じどうしゃ でんどうに はいります。
  - speaker: honda
    emotion: sad
    text: 藤沢くん。……このメダルは、お前さんと二人でもらったんだ。
  - speaker: reimu
    text: 本田は、殿堂のメダルを藤沢の位牌に掛けました。本田が亡くなるのは、1991年のことです。
    reading: ほんだわ、でんどうの めだるお ふじさわの いはいに かけました。ほんだが なくなるのわ、せんきゅうひゃく きゅうじゅういちねんの ことです。
- id: ch10_kotoba
  title: そば屋の言葉は誰のもの
  background: sc_ronsou
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: そば屋の出前持ちが片手で乗れる、って言ったのは本田さん？ 藤沢さん？
  - speaker: tsumugi
    emotion: normal
    text: 本田さんよ。開発の責任者だった原田さんが、最初からそう言ってたと話してるの。
  - speaker: tsumugi
    emotion: normal
    text: 藤沢さんの注文は、奥さんが買ってもいいと言うバイク。それと、どうしても50cc。
  - speaker: zundamon
    emotion: happy
    text: 作る人は出前のお兄さんを、売る人は奥さんを見てたのか。
  - speaker: tsumugi
    emotion: happy
    text: 二人とも、バイクに乗ったことのない人を見てたのよ。
  - speaker: tsumugi
    emotion: normal
    text: それと1億台という数には、ウェーブなど形の近い兄弟車も入ってるの。
  - speaker: zundamon
    emotion: happy
    text: 家族みんなで、1億台なのだ。
- id: ch10_nenpi
  title: 1リットルで何キロ
  background: sc_nenpi
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.14, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.86, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: カブって、ガソリンはどれくらいで走るの？
  - speaker: tsumugi
    emotion: normal
    text: 発売当時の広告では、1リットルで90キロとうたっていたの。
  - speaker: zundamon
    emotion: surprised
    text: 東京から、小田原くらいまで行けるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 1983年のカブは、決まった速さで走る測り方で1リットル180キロよ。
  - speaker: zundamon
    emotion: surprised
    text: 静岡まで、行けちゃうのだ！？
  - speaker: tsumugi
    emotion: thinking
    text: ただ、測り方が今と違うの。今の測り方だと、110のカブは1リットル約68キロね。
  - speaker: zundamon
    emotion: happy
    text: それでも、車よりずっと少ないガソリンで走れるのだ。
  - speaker: tsumugi
    emotion: normal
    text: だから毎日何十キロも走る、郵便や新聞の配達にぴったりなのよ。
- id: ch11_gendai
  title: 働くバイクの今
  background: sc_gendai
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.86, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 1971年には、郵便のための赤いカブが登場したわ。
  - speaker: tsumugi
    emotion: normal
    text: 2019年からは、電動のバイクに替わり始めてるの。
  - speaker: tsumugi
    emotion: normal
    text: 出前のそばを吊るす台は、東京のそば屋さんが考えたものなの。
  - speaker: zundamon
    emotion: surprised
    text: そば屋さんが、自分で発明したのだ！？
  - speaker: tsumugi
    emotion: normal
