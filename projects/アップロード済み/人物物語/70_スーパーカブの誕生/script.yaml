scenes:
- id: co_sanman
  title: ''
  background: sc_mockup
  bgm: pop
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: honda, x: 0.56, emotion: happy}
  - {who: designer, x: 0.78, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1957年の暮れ。ホンダの専務・藤沢武夫が、社長の本田宗一郎に呼ばれます。
    reading: せんきゅうひゃく ごじゅうななねんの くれ。ほんだの せんむ ふじさわ たけおが、しゃちょうの ほんだ そういちろうに よばれます。
  - speaker: honda
    emotion: happy
    text: 来たか。これが、新しいバイクの模型だ。
  - speaker: zundamon
    emotion: surprised
    text: ……これは、いいな。
  - speaker: honda
    emotion: happy
    text: どうだい、専務。これなら、どれくらい売れる？
  - speaker: zundamon
    emotion: normal
    text: まあ、3万台だな。
  - speaker: designer
    emotion: surprised
    text: 年間3万台、ですか？
  - speaker: zundamon
    emotion: happy
    text: バカ言え。月に3万台だよ！
    se: don
  - speaker: reimu
    text: 当時の日本の二輪車の生産は、業界全体でも月に約4万2000台でした。
    reading: とうじの にほんの にりんしゃの せいさんわ、ぎょうかい ぜんたいでも つきに やく よんまん にせんだいでした。
  - speaker: reimu
    text: このバイクが、スーパーカブ。シリーズの累計は、1億台を超えています。
    reading: この ばいくが すーぱーかぶ。しりーずの るいけいわ いちおくだいお こえて います。
- id: hook
  title: ''
  background: sc_machi
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。ボク、そば屋さんで出前のアルバイトを始めるのだ！
  - speaker: tsumugi
    emotion: normal
    text: どうやって運ぶの？
  - speaker: zundamon
    emotion: happy
    text: 片手でそばを持って、もう片手で運転するのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 片手運転は、危ないわよ。
  - speaker: zundamon
    emotion: happy
    text: じゃあ、そばは頭の上にのせる！
  - speaker: tsumugi
    emotion: surprised
    text: もっと危ないわよ。
    se: zukko
  - speaker: tsumugi
    emotion: normal
    text: 出前のバイクには、そばを吊るす台があるの。そのバイクが、スーパーカブよ。
  - speaker: zundamon
    emotion: thinking
    text: 売る前から月に3万台って、どうして言い切れたの？
    telops:
    - {text: なぜ月3万台と言えた？, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 言ったのは、作る人じゃなくて売る人。始まりは、東京の小石川よ。
- id: card1910
  title: ''
  background: sc_card_1910
  cuts:
  - speaker: reimu
    text: 1910年。東京の小石川で、藤沢武夫が生まれます。
    reading: せんきゅうひゃく じゅうねん。とうきょうの こいしかわで ふじさわ たけおが うまれます。
- id: ch1_shinsai
  title: 焼けた家業
  background: sc_ie
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, scale: 0.85, emotion: normal}
  - {who: chichi, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
    text: 父の秀四郎は、映画館で流す広告のスライドを作る会社を営んでいました。
    reading: ちちの ひでしろうわ、えいがかんで ながす こうこくの すらいどお つくる かいしゃお いとなんで いました。
  - speaker: reimu
    text: 1923年。関東大震災で、その会社が焼けてしまいます。
    reading: せんきゅうひゃく にじゅうさんねん。かんとう だいしんさいで、その かいしゃが やけて しまいます。
  - speaker: chichi
    emotion: sad
    text: 武夫、すまん。会社が、全部焼けた。
  - speaker: zundamon
    emotion: surprised
    text: 全部！？ スライドも、機械も？
  - speaker: chichi
    emotion: sad
    text: ……しばらくは、ぜいたくはできん。
  - speaker: zundamon
    emotion: sad
    text: ボクのおこづかいも、焼けたのだ。
    beat: true
  - speaker: chichi
    emotion: normal
    text: 武夫。男は、どんな逆境にあっても、自分の心を卑しくしてはならない。
  - speaker: zundamon
    emotion: thinking
    text: ……心を、卑しくしない。
- id: ch1_hikkou
  title: 宛名書きの夜
  background: sc_ie
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: chichi, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
    text: 1928年。中学を出た武夫は、東京高等師範学校の受験に失敗します。
    reading: せんきゅうひゃく にじゅうはちねん。ちゅうがくお でた たけおわ、とうきょう こうとう しはん がっこうの じゅけんに しっぱい します。
  - speaker: reimu
    text: やがて父が病気で寝込み、武夫が一家の暮らしを支えることになります。
    reading: やがて ちちが びょうきで ねこみ、たけおが いっかの くらしお ささえる ことに なります。
  - speaker: chichi
    emotion: sad
    text: 武夫……今夜も、書いてるのか。
  - speaker: zundamon
    emotion: normal
    text: 宛名書きの仕事なのだ。1枚書けば、いくらかになる。
    background: sc_ie_hikkou
  - speaker: chichi
    emotion: sad
    text: 先生になるはずが、すまんな。
  - speaker: zundamon
    emotion: happy
    text: おかげで字がうまくなった。先生より、達筆かもしれないのだ。
  - speaker: chichi
    emotion: thinking
    text: ……自分で言うな。
    se: hammer
  - speaker: reimu
    text: 日雇いや宛名書きで、武夫は家計を支えました。1931年には兵役に就き、伍長で除隊します。
    reading: ひやといや あてながきで、たけおわ かけいお ささえました。せんきゅうひゃく さんじゅういちねんにわ へいえきに つき、ごちょうで じょたい します。
  - speaker: zundamon
    emotion: normal
    text: 父さん。日本橋の鋼材の店で、働くことにした。
  - speaker: chichi
    emotion: surprised
    text: 給料は、いくらだ。
  - speaker: zundamon
    emotion: normal
    text: 月に15円。
  - speaker: chichi
    emotion: angry
    text: 15円！？ 宛名書きなら、40円は稼いでたじゃないか。
  - speaker: zundamon
    emotion: happy
    text: 給料より、商売を覚えたいのだ。
  - speaker: chichi
    emotion: thinking
    text: ……3分の1になると、分かって言ってるのか。
    beat: true
- id: card1934
  title: ''
  background: sc_card_1934
  cuts:
  - speaker: reimu
    text: 1934年。父の反対を押し切り、23歳の武夫は日本橋の鋼材店に入ります。
    reading: せんきゅうひゃく さんじゅうよねん。ちちの はんたいお おしきり、にじゅうさんさいの たけおわ にほんばしの こうざいてんに はいります。
- id: ch1_kouzai
  title: 鋼材のセールスマン
  background: sc_kouzai
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: tenshu, x: 0.7, emotion: normal}
  cuts:
  - speaker: tenshu
    emotion: normal
    text: 藤沢くん、今日も工場回りかね。
  - speaker: zundamon
    emotion: happy
    text: 鉄の棒や板を使う工場に、売り込みに行ってきます。
  - speaker: tenshu
    emotion: thinking
    text: 月給は15円だ。売れなくても、同じだぞ。
  - speaker: zundamon
    emotion: normal
    text: 売れたら、店が大きくなります。それでいいんです。
  - speaker: tenshu
    emotion: surprised
    text: ……店のことまで考えとるのか。
  - speaker: zundamon
    emotion: thinking
    text: まず工場の人が、どんな鉄で困ってるかを聞くんです。
  - speaker: tenshu
    emotion: happy
    text: 商売の筋がいいな、君は。
  - speaker: reimu
    text: やがて店主が出征し、武夫は店を任されます。
    reading: やがて てんしゅが しゅっせいし、たけおわ みせお まかされます。
- id: ch1_wabi
  title: ''
  background: sc_kouzai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: sad}
  - {who: kojonushi, x: 0.7, emotion: angry}
  cuts:
  - speaker: kojonushi
    emotion: angry
    text: 藤沢さん！ 頼んだ鋼材が、まだ届いとらんぞ！
  - speaker: zundamon
    emotion: sad
    text: 申し訳ありません。遅れたのは、うちの段取りの間違いです。
  - speaker: kojonushi
    emotion: surprised
    text: ……言い訳を、しないのか。
  - speaker: zundamon
    emotion: normal
    text: 明日の朝一番に、必ずお届けします。
  - speaker: kojonushi
    emotion: thinking
    text: ……正直なやつだ。次も、あんたの店から買うよ。
    se: levelup
  - speaker: reimu
    text: 納品が遅れたときも武夫は言い訳をせず、正直に理由を述べてわびました。
    reading: のうひんが おくれた ときも たけおわ いいわけお せず、しょうじきに りゆうお のべて わびました。
- id: card1939
  title: ''
  background: sc_card_1939
  cuts:
  - speaker: reimu
    text: 1939年。武夫は、自分の会社を立ち上げます。
    reading: せんきゅうひゃく さんじゅうきゅうねん。たけおわ じぶんの かいしゃお たちあげます。
- id: ch1_kiko
  title: 終戦の日の工場
  background: sc_kiko
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 名前は日本機工研究所。金属を削る刃物を作る会社で、工員は30人ほどでした。
    reading: なまえわ にほん きこう けんきゅうじょ。きんぞくお けずる はものお つくる かいしゃで、こういんわ さんじゅうにんほどでした。
  - speaker: reimu
    text: 戦争の終わりが近づくと、空襲を避けて工場を福島へ移すことにします。
    reading: せんそうの おわりが ちかづくと、くうしゅうお さけて こうじょうお ふくしまえ うつす ことに します。
  - speaker: shain
    emotion: normal
    text: 社長。最後の機械、福島に運び込みました！
  - speaker: zundamon
    emotion: happy
    text: よし。これでまた、刃物が作れるのだ。
  - speaker: shain
    emotion: surprised
    text: 社長、ラジオを……。戦争が、終わったそうです。
  - speaker: zundamon
    emotion: surprised
    text: ……今日、運び終えたばかりなのに。
    se: chin
  - speaker: reimu
    text: 機械を運び込んだその日に、戦争は終わりました。
    reading: きかいお はこびこんだ その ひに、せんそうわ おわりました。
  - speaker: zundamon
    emotion: thinking
    text: 刃物は、もう売れないのだ。
  - speaker: zundamon
    emotion: normal
    text: でも、焼けた町には家が要る。家には、材木が要るのだ。
  - speaker: reimu
    text: 戦後、武夫は福島の二本松で材木を扱う製材業を始めました。
    reading: せんご たけおわ ふくしまの にほんまつで、ざいもくお あつかう せいざいぎょうお はじめました。
- id: card1949
  title: ''
  background: sc_card_1949
  cuts:
  - speaker: reimu
    text: 1949年8月。東京・阿佐ヶ谷の、ある家の座敷。
    reading: せんきゅうひゃく よんじゅうきゅうねん はちがつ。とうきょう あさがやの ある いえの ざしき。
- id: ch2_deai
  title: 二人の出会い
  background: sc_zashiki
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: takeshima, x: 0.56, emotion: normal}
  - {who: honda, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 前の年に武夫は旧知の竹島弘と再会し、東京で材木店を開いていました。
    reading: まえの とし、たけおわ きゅうちの たけしま ひろしと さいかいし、とうきょうで ざいもくてんお ひらいて いました。
  - speaker: takeshima
    emotion: normal
    text: 藤沢くん、紹介するよ。浜松でオートバイを作っている、本田宗一郎さんだ。
  - speaker: honda
    emotion: happy
    text: 本田です。エンジンの話なら、いくらでもしますよ。
  - speaker: zundamon
    emotion: normal
    text: 藤沢です。機械のことは、まるで分かりません。
  - speaker: honda
    emotion: thinking
    text: じゃあ、あんたは何ができる？
  - speaker: zundamon
    emotion: happy
    text: お[金|かね]を集めて、作った物を売ることなら。
  - speaker: honda
    emotion: surprised
    text: ……それは、おれの一番苦手なことだ。
  - speaker: zundamon
    emotion: normal
    text: だったら、お[金|かね]と売ることは私が引き受けます。本田さんは、技術に集中してください。
  - speaker: honda
    emotion: happy
    text: そいつは、助かる。
  - speaker: reimu
    text: 本田は42歳、藤沢は38歳。この年の10月、武夫は本田技研工業の常務になりました。
    reading: ほんだわ よんじゅうにさい、ふじさわわ さんじゅうはっさい。この としの じゅうがつ、たけおわ ほんだ ぎけん こうぎょうの じょうむに なりました。
- id: ch2_tegami
  title: 5万通の手紙
  background: sc_honsha
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1952年、ホンダは自転車に取り付ける小さなエンジンのカブF型を出します。
    reading: せんきゅうひゃく ごじゅうにねん、ほんだわ じてんしゃに とりつける ちいさな えんじんの かぶ えふがたお だします。
  - speaker: shain
    emotion: thinking
    text: 専務、これを売るにはオートバイ屋が足りませんよ。
  - speaker: zundamon
    emotion: normal
    text: オートバイ屋じゃない。自転車屋さんに頼む。
  - speaker: shain
    emotion: surprised
    text: 自転車屋さん、ですか。
  - speaker: zundamon
    emotion: happy
    text: 自転車屋さんなら、全国に何万軒もある。そこに手紙を出すんだ。
  - speaker: shain
    emotion: surprised
    text: 全部に、ですか！？
    se: bikkuri
  - speaker: zundamon
    emotion: normal
    text: 文面は、こうだ。
  - speaker: zundamon
    emotion: normal
    text: あなた[方|がた]のご先祖は、日露戦争の後、勇気をもって輸入自転車を売る決心をされた。
  - speaker: zundamon
    emotion: normal
    text: 今、お客さまは、エンジンの付いたものを求めている。
  - speaker: zundamon
    emotion: happy
    text: そのエンジンを、ホンダがつくりました。
  - speaker: reimu
    text: 手紙は、全国の自転車店5万軒以上に送られました。
    reading: てがみわ、ぜんこくの じてんしゃてん ごまんけん いじょうに おくられました。
  - speaker: shain
    emotion: surprised
    text: 専務、3万軒以上から返事が来ました！
    background: sc_honsha_henji
  - speaker: zundamon
    emotion: normal
    text: 1軒に1台ずつ、申し込み順に送る。代金は、先に振り込んでもらう。
  - speaker: shain
    emotion: surprised
    text: 先にお[金|かね]をもらうんですか！？
  - speaker: reimu
    text: すぐに約5000軒から送金があり、最終的に約1万5000店の販売網ができました。
    reading: すぐに やく ごせんけんから そうきんが あり、さいしゅうてきに やく いちまん ごせんてんの はんばいもうが できました。
  - speaker: zundamon
    emotion: happy
    text: 良い品も、置く場所が無ければ売れないのだ。
- id: ch2_kiki
  title: 1954年の危機
  background: sc_honsha
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: thinking}
  - {who: keiri, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
