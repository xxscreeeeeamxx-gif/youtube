meta:
  title: 【スーパーカブの誕生】「月に3万台売れる」と言い切った男。本田宗一郎に50ccを頼んだ経営者【ずんだもん解説】
  slug: fujisawa-supercub-v2
  summary: 郵便、新聞、そば屋の出前。働く人を乗せて走るスーパーカブを「作ってくれ」と頼んだのは、技術者ではなく、ホンダの経営を任された藤沢武夫でした。震災で家業を失い、宛名書きで家族を支えた青年は、鋼材のセールスマンを経て本田宗一郎と組みます。できあがった模型を前に、周りが耳を疑う数字を口にした男。売る仕組みを作り続けた藤沢武夫の生涯と、スーパーカブの誕生を、再現ドラマでたどります。
  tags:
  - スーパーカブ
  - 藤沢武夫
  - 本田宗一郎
  - ホンダ
  - バイク
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 雑学
  thumbnail:
    top: 月に3万台
    bottom: スーパーカブの誕生
  mode: drama
  narrator: reimu
