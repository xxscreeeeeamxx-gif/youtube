  - speaker: reimu
    text: 処分した在庫は、およそ250万個だったといいます。
    reading: しょぶんした ざいこわ およそ にひゃくごじゅうまんこだったと いいます。
  - speaker: reimu
    text: 新しいたまごっちの出荷は、2004年まで途絶えます。
    reading: あたらしい たまごっちの しゅっかわ にせんよねんまで とだえます。
