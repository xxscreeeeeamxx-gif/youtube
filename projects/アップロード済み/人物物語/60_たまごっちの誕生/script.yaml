  - speaker: zundamon
    emotion: surprised
    text: イグ・ノーベル賞なのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 横井さんと真板さんが、たまごっちの父と母として選ばれたわ。
  - speaker: tsumugi
    emotion: normal
    text: 理由は、何百万時間もの仕事の時間を、仮想のペットの世話に使わせたこと。
  - speaker: zundamon
    emotion: happy
