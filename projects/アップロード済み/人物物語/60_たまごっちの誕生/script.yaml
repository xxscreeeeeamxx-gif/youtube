meta:
  title: 【たまごっちの誕生】「ペットがかわいいのは2割」と言った男が、死ぬおもちゃを作るまで【ずんだもん解説】
  slug: tamagotchi-yokoi
  summary: 1996年に発売されたたまごっちは、30年で1億個以上が出荷されました。企画を持ち込んだのは、バンダイを飛び出して小さな会社を開いた横井昭裕。パソコンの中の熱帯魚から「人間と同じ時間で生きる生き物」を思いつき、社内の反対を押し切って「世話をしないと死ぬ」おもちゃにしました。行列、品切れ、偽物、そして60億円の特別損失。止めるボタンを付けなかったたまごっちの30年を、再現ドラマでたどります。
  tags:
  - たまごっち
  - バンダイ
  - 横井昭裕
  - ウィズ
  - おもちゃ
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 雑学
  thumbnail:
    top: 死ぬおもちゃ
    bottom: たまごっちの誕生
  mode: drama
  narrator: reimu
  mobs:
  - id: joushi
    label: 上司
    voice: 42
    pitch: 0.06
  - id: shain
    label: ウィズ社員
    voice: 12
    pitch: 0.12
