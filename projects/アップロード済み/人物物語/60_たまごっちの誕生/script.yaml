scenes:
- id: hook
  title: ''
  background: tg_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、静かにするのだ。今、うんちを流してるところなのだ。
  - speaker: tsumugi
    emotion: thinking
    text: ……朝から、なんの話？
  - speaker: zundamon
    emotion: happy
    text: たまごっちなのだ。30周年の、復刻版を買ったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 昨日の夜も、寝るまでずっと画面を見張ってたわよね。
  - speaker: zundamon
    emotion: normal
    text: お世話は、愛情なのだ。寝不足は、愛の証なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 目の下、真っ黒よ。
  - speaker: zundamon
    emotion: happy
    text: 心配いらないのだ。今日は出かけるから、つむぎに預けていくのだ。
  - speaker: tsumugi
    emotion: thinking
    text: ……結局、お世話するのは私なのね。
  - speaker: zundamon
    emotion: thinking
    text: 一時停止のボタンがあれば、いいのに……。
  - speaker: tsumugi
    emotion: normal
    text: 時計合わせの裏ワザはあるけど、止めるボタンは、わざと付けなかったの。
  - speaker: zundamon
    emotion: surprised
    text: わざとなのだ！？
  - speaker: reimu
    text: たまごっち。1996年に発売された、手のひらの中の電子のペットです。
    reading: たまごっち。せんきゅうひゃく きゅうじゅうろくねんに はつばいされた てのひらの なかの でんしの ぺっとです。
  - speaker: reimu
    text: 30年で、1億個以上が出荷されました。
    reading: さんじゅうねんで いちおくこ いじょうが しゅっか されました。
  - speaker: reimu
    text: 企画を持ち込んだのは、横井昭裕。小さなおもちゃの企画会社の、社長でした。
    reading: きかくお もちこんだのわ よこい あきひろ。ちいさな おもちゃの きかく がいしゃの しゃちょうでした。
  - speaker: tsumugi
    emotion: normal
    text: しかもバンダイの中では、売れると思った人のほうが、少なかったのよ。
  - speaker: zundamon
    emotion: surprised
    text: 1億個も売れたのに、なのだ！？
- id: card1977
  title: ''
  background: tg_card_1977
  cuts:
  - speaker: reimu
    text: 1977年。東京のおもちゃ会社、バンダイ。
    reading: せんきゅうひゃく ななじゅうななねん。とうきょうの おもちゃ がいしゃ ばんだい。
- id: ch1_bandai
  title: 千本ノック
  background: tg_bandai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 横井昭裕, emotion: normal}
  - {who: joushi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 22歳の横井昭裕が、バンダイに入社します。
    reading: にじゅうにさいの よこい あきひろが ばんだいに にゅうしゃ します。
  - speaker: reimu
    text: 東京生まれ。幼いころから、生き物を飼うのが好きでした。
    reading: とうきょう うまれ。おさない ころから いきものお かうのが すきでした。
  - speaker: joushi
    emotion: normal
    text: 横井くん、次の企画は、何本出せる？
  - speaker: zundamon
    emotion: happy
    text: 今週も、ノートにびっしり書いてきたのだ。
  - speaker: joushi
    emotion: surprised
    text: こんなにか！？
  - speaker: joushi
    emotion: thinking
    text: ……でも、ほとんどボツだな。
  - speaker: zundamon
    emotion: normal
    text: 企画は、千本ノックなのだ。とにかく数を出すのだ。
  - speaker: reimu
    text: 自分に、企画の千本ノックを課していたといいます。
    reading: じぶんに きかくの せんぼん のっくお かしていたと いいます。
  - speaker: joushi
    emotion: normal
    text: 今度は、手のひらに乗る、液晶のゲームを頼みたい。
  - speaker: zundamon
    emotion: happy
    text: 小さな画面でも、キャラクターが動くと楽しいのだ。
  - speaker: zundamon
    emotion: normal
    text: それと、女の子向けの、電子の占いを作りたいのだ。
  - speaker: joushi
    emotion: thinking
    text: 占い？ 前に出した占いの機械は、売れなかったじゃないか。
  - speaker: joushi
    emotion: normal
    text: 占いなんて、売れないぞ。
  - speaker: zundamon
    emotion: normal
    text: あれは、男っぽく作ったから、売れなかったのだ。
  - speaker: zundamon
    emotion: normal
    text: 占いは、女の子に人気なのだ。
  - speaker: zundamon
    emotion: happy
    text: 女の子向けなら、売れるのだ。
  - speaker: joushi
    emotion: thinking
    text: ……そこまで言うなら、やってみろ。
  - speaker: reimu
    text: 横井は、女の子向けにした占いのゲームが売れた、と話しています。
    reading: よこいわ おんなのこむけに した うらないの げーむが うれたと はなしています。
- id: ch1_mayoi
  title: 看板の力
  background: tg_bandai
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 横井昭裕, emotion: thinking}
  - {who: joushi, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 入社から、およそ10年がたちました。
    reading: にゅうしゃから およそ じゅうねんが たちました。
  - speaker: joushi
    emotion: happy
    text: 横井くん、この前の商品、よく売れてるそうじゃないか。
  - speaker: zundamon
    emotion: thinking
    text: 売れたのは、ぼくの力なのだ？
  - speaker: zundamon
    emotion: thinking
    text: それとも、バンダイの看板の力なのだ？
  - speaker: joushi
    emotion: thinking
    text: どっちでもいいじゃないか。売れたんだから。
  - speaker: zundamon
    emotion: thinking
    text: ぼくには、それが分からなくなったのだ。
  - speaker: zundamon
    emotion: normal
    text: 自分の会社でやって、確かめてみたいのだ。
  - speaker: joushi
    emotion: surprised
    text: バンダイを、辞めるのか。
  - speaker: reimu
    text: 横井は、独立を決めた理由を、そう話しています。
    reading: よこいわ どくりつお きめた りゆうお そう はなしています。
  - speaker: reimu
    text: 1986年、31歳でウィズという会社を作ります。
    reading: せんきゅうひゃく はちじゅうろくねん さんじゅういっさいで うぃずと いう かいしゃお つくります。
  - speaker: reimu
    text: 翌年バンダイを辞めて、社長になりました。
    reading: よくねん ばんだいお やめて しゃちょうに なりました。
- id: ch2_wiz
  title: 7割と3割
  background: tg_wiz
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 横井昭裕, emotion: normal}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 独立しても、おもちゃの仕事はすぐには来ません。
    reading: どくりつしても おもちゃの しごとわ すぐにわ きません。
  - speaker: shain
    emotion: normal
    text: 社長、今月の仕事が決まりました。スーパーのチラシです。
  - speaker: zundamon
    emotion: normal
    text: 引き受けるのだ。家賃と給料が要るのだ。
  - speaker: shain
    emotion: normal
    text: 次は、商品の箱のデザインと、会議で使うパネルです。
  - speaker: zundamon
    emotion: normal
    text: それも、やるのだ。
  - speaker: shain
    emotion: thinking
    text: ……うちって、おもちゃを考える会社じゃなかったんですか？
  - speaker: shain
    emotion: sad
    text: 話が違う、ってみんなが……。
  - speaker: zundamon
    emotion: thinking
    text: ……分かったのだ。決まりを作るのだ。
  - speaker: zundamon
    emotion: normal
    text: 仕事は、生活のためが7割。夢のためが3割なのだ。
  - speaker: shain
    emotion: surprised
    text: 3割は、おもちゃの企画をやれるんですね！
  - speaker: zundamon
    emotion: happy
    text: そうなのだ。その3割で、勝負するのだ。
  - speaker: reimu
    text: それでも、大きなヒットには、なかなか届きませんでした。
    reading: それでも おおきな ひっとにわ なかなか とどきませんでした。
- id: card1995
  title: ''
  background: tg_card_1995
  cuts:
  - speaker: reimu
    text: 1995年。バンダイから、ウィズに依頼が届きます。
    reading: せんきゅうひゃく きゅうじゅうごねん。ばんだいから うぃずに いらいが とどきます。
- id: ch3_irai
  title: 来年の企画
  background: tg_wiz
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 横井昭裕, emotion: normal}
  - {who: bandai, x: 0.7, emotion: normal}
  cuts:
  - speaker: bandai
    emotion: normal
    text: 横井さん、来年に出す企画を、何か持ってきてもらえませんか。
  - speaker: zundamon
    emotion: thinking
    text: 来年の企画、なのだ？
  - speaker: bandai
    emotion: thinking
    text: 正直、会社の調子が良くないんです。新しいものが欲しくて。
  - speaker: zundamon
    emotion: thinking
    text: どんなものが、いいのだ？
  - speaker: bandai
    emotion: normal
    text: 当たるものなら、なんでも。
  - speaker: zundamon
    emotion: normal
    text: ……分かったのだ。考えてみるのだ。
  - speaker: reimu
    text: 業績の落ちていたバンダイから、次の年の企画を頼まれた、と横井は話しています。
    reading: ぎょうせきの おちていた ばんだいから つぎの としの きかくお たのまれたと、よこいわ はなしています。
- id: ch3_kaigi
  title: 情報会議
  background: tg_pc
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 横井昭裕, emotion: normal}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: ウィズでは、週に1回、情報会議を開いていました。
    reading: うぃずでわ しゅうに いっかい じょうほう かいぎお ひらいていました。
  - speaker: reimu
    text: 決まりは一つ。おもちゃやゲームの業界の外から、話を持ってくることです。
    reading: きまりわ ひとつ。おもちゃや げーむの ぎょうかいの そとから はなしお もってくる ことです。
  - speaker: zundamon
    emotion: normal
    text: 今週は、面白い話はあるのだ？
  - speaker: shain
    emotion: happy
    text: 社長、最近みんな、パソコンで熱帯魚を飼ってるんです。
  - speaker: zundamon
    emotion: surprised
    text: パソコンで、魚を飼うのだ？
  - speaker: shain
    emotion: normal
    text: この画面の水槽で、24時間、魚が泳いでるんです。
  - speaker: shain
    emotion: happy
    text: 夜も泳いでるから、気になって、つい見ちゃうんです。
  - speaker: zundamon
    emotion: thinking
    text: ……画面の中の魚に、みんな夢中なのだ。
  - speaker: zundamon
    emotion: thinking
    text: ゲームの中は、ふつうゲームの時間で動くのだ。
  - speaker: zundamon
    emotion: thinking
    text: 何年もの時間が、あっという間に過ぎたりするのだ。
  - speaker: zundamon
    emotion: surprised
    text: でもこの魚は、人間と同じ時間で生きてるのだ。
  - speaker: zundamon
    emotion: happy
    text: 作り物でも、同じ時間で生きていると、本当に生きてるように感じるのだ！
  - speaker: reimu
    text: 横井は、この気づきが、たまごっちの出発点になったと話しています。
    reading: よこいわ この きづきが たまごっちの しゅっぱつてんに なったと はなしています。
- id: ch3_katachi
  title: 卵とウォッチ
  background: tg_wiz
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 横井昭裕, emotion: thinking}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: でも、パソコンでは大きすぎるのだ。持ち歩けないのだ。
  - speaker: shain
    emotion: thinking
    text: 24時間一緒にいるなら、持ち歩けないとダメですね。
  - speaker: zundamon
    emotion: normal
    text: 前に作った液晶ゲームくらいの、手のひらサイズにするのだ。
  - speaker: zundamon
    emotion: happy
    text: 時計にすれば、時間を見るついでに、世話もできるのだ。
  - speaker: shain
    emotion: normal
    text: 形は、どうします？
  - speaker: zundamon
    emotion: normal
    text: 動物は、卵から生まれるのだ。
  - speaker: zundamon
    emotion: happy
    text: それに、卵の形のおもちゃは、外れないのだ。
  - speaker: shain
    emotion: normal
    text: 卵の形の、時計……。
  - speaker: zundamon
    emotion: thinking
    text: たまごと、ウォッチで……。
  - speaker: zundamon
    emotion: happy
    text: たまごっち、なのだ！
  - speaker: shain
    emotion: happy
    text: それ、いいですね！
  - speaker: reimu
    text: 名前は、たまごとウォッチを合わせたものです。
    reading: なまえわ たまごと うぉっちお あわせた ものです。
- id: ch3_chara
  title: 変わっていく生き物
  background: tg_sketch
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 横井昭裕, emotion: normal}
  - {who: designer, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: 中に住む生き物は、犬や猫じゃないほうがいいのだ。
  - speaker: designer
    emotion: thinking
    text: この小さな画面だと、本物の動物は、嘘っぽくなりますね。
  - speaker: zundamon
    emotion: happy
    text: 見たことのない、架空の生き物にするのだ。
  - speaker: zundamon
    emotion: thinking
    text: それに、だんだん大きくなるだけじゃ、つまらないのだ。
  - speaker: designer
    emotion: thinking
    text: じゃあ、どう育てます？
  - speaker: zundamon
    emotion: normal
    text: クワガタは、幼虫からさなぎ、そして成虫と、姿が変わるのだ。
  - speaker: zundamon
    emotion: happy
    text: 育つたびに、形ががらっと変わる生き物にするのだ。
  - speaker: designer
    emotion: happy
    text: 次に何になるか、楽しみになりますね！
  - speaker: reimu
    text: 絵は、当時の女子高生に流行っていた、ヘタウマな絵柄を取り入れました。
    reading: えわ とうじの じょしこうせいに はやっていた へたうまな えがらお とりいれました。
  - speaker: zundamon
    emotion: normal
    text: きれいな絵より、誰でも[描け|かけ]そうな絵のほうが、親しみがわくのだ。
  - speaker: designer
    emotion: happy
    text: この、卵の殻に入った、ちょっと不格好なやつはどうです？
  - speaker: zundamon
    emotion: happy
    text: いいのだ。この壁の絵で、いってみるのだ。
  - speaker: reimu
    text: デザイナーが15分で描いた、殻に入った不格好な生き物が、始まりだったといいます。
    reading: でざいなーが じゅうごふんで かいた からに はいった ぶかっこうな いきものが、はじまりだったと いいます。
- id: ch4_shi
  title: 死ぬおもちゃ
  background: tg_wiz
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 横井昭裕, emotion: normal}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: もう一つ、どうしても入れたいことがあるのだ。
  - speaker: shain
    emotion: surprised
    text: まだ、あるんですか？
  - speaker: zundamon
    emotion: normal
    text: ぼくは、熱帯魚からフクロウまで、いろんな生き物を飼ってきたのだ。
  - speaker: zundamon
    emotion: thinking
    text: ペットがかわいいのは、2割か3割なのだ。
  - speaker: zundamon
    emotion: thinking
    text: 残りは、面倒な世話なのだ。
  - speaker: shain
    emotion: thinking
    text: 水替えとか、えさやりとか、掃除とか……。
  - speaker: zundamon
    emotion: sad
    text: 海の魚は、どんなに工夫しても、2週間ほどで死なせてしまったのだ。
  - speaker: zundamon
    emotion: normal
    text: だから、死なせないように、必死で世話をしたのだ。
  - speaker: zundamon
    emotion: normal
    text: その面倒な世話の中で、愛情が生まれるのだ。
  - speaker: shain
    emotion: thinking
    text: でも、おもちゃは、面倒なことをなくしてきましたよね。
  - speaker: zundamon
    emotion: normal
    text: だから、あえて入れるのだ。
  - speaker: zundamon
    emotion: angry
    text: 世話をしないと、死んでしまうペットにするのだ。
  - speaker: shain
    emotion: surprised
    text: 死ぬ……おもちゃ、ですか。
  - speaker: reimu
    text: 面倒と、死。どちらも、それまでのおもちゃが避けてきたものでした。
    reading: めんどうと し。どちらも それまでの おもちゃが さけてきた ものでした。
- id: ch4_bandai
  title: 見送りの危機
  background: tg_kaigi
  bgm: 223am
  stage:
  - {who: bucho, x: 0.28, emotion: thinking}
  - {who: bandai, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1995年6月、横井はバンダイに企画書を出します。
    reading: せんきゅうひゃく きゅうじゅうごねん ろくがつ よこいわ ばんだいに きかくしょお だします。
  - speaker: reimu
    text: 受け取ったのは、男の子向けのおもちゃを作る部署でした。
    reading: うけとったのわ おとこのこむけの おもちゃお つくる ぶしょでした。
  - speaker: bandai
    emotion: normal
    text: 卵の形の腕時計で、中で生き物を育てる、という企画です。
  - speaker: bucho
    emotion: thinking
    text: 生き物を、育てる。
  - speaker: bandai
    emotion: normal
