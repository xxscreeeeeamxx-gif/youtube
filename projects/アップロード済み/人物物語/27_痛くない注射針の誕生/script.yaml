# 痛くない注射針の再現ドラマ・ミーム版（[岡野雅行|おかのまさゆき]・1933→2018）。投稿前に必ず目視レビュー。
# 配役: ずんだもん=岡野雅行（岡野工業）/ つむぎ=テルモの技術者 / ナレ=ゆっくり
# ★ミーム禁止の章: kodomo（糖尿病の子ども）/ kodomo2（発売後の反応）
# ★扱わないと決めたこと: 岡野氏は存命（1933年生まれ）。2012年に報じられた税の件は、
#   注射針の開発の話に必要がなく、存命の個人の法的な事柄なので範囲に入れない。
#   この動画は「一本の針ができるまで」であって、生涯の伝記ではない（胃カメラ回と同じ形）。
#   テルモ側の担当者は実名が公表されているが、姓の読みを確認できなかったので
#   誤読を避けて「テルモの技術者」として描く（誤読ゼロを優先）。
# 裏取り: 岡野雅行(会社社長)Wikipedia / CBCマガジン「日本で生まれた痛くない注射針」/
#   日経「痛くない注射針の岡野工業、家族に引き継がない理由」2018-03 / ナノパスWikipedia /
#   SBBIT「痛みの少ない注射針の意外な開発裏話」
# 確定事実:
#   1933-2-14 東京府東京市向島区（現・墨田区）生まれ。父は金型工場を創業
#   1945 向島更正国民学校初等科卒。旧制中学中退。父の工場を手伝い始める
#   20代、夕方5時から翌朝8時まで工場を借り、昼は勤めて夜に自分の受注をこなした
#   「安すぎて誰もやらない仕事」「難しすぎて他の誰にもできない仕事」しか受けない
#   1972 二代目に就任し、岡野金型製作所から岡野工業へ改称。従業員6人
#   リチウムイオン電池ケース（ウォークマン用→携帯電話へ）。ジッポーのケースで培った深絞り
#   テルモは100社以上に相談して全部断られた。きっかけは子どもの患者の「針が痛い」
#   糖尿病で毎日インスリンを自分で打つ患者がいる
#   針は細いほど液が出にくいので、根元を太く先端を細いメガホン状にした
#   プレス加工。溶接は一切使わない。作り直した金型は数百個。開発に5年
#   先端の外径0.2ミリ、内径0.08ミリ。蚊の口とほぼ同じ太さ
#   2005-7 テルモが「ナノパス33」として発売。2005年度グッドデザイン大賞
#   のちに0.18ミリの「ナノパスニードル2」。2012年 日経優秀製品・サービス賞 最優秀賞を共同受賞
#   生産累計5億本以上。2018-3 後継者がなく「あと2年で会社を閉じる」と表明
meta:
  title: "【痛くない注射針の誕生】100社が断った仕事を、6人の町工場が【ずんだもん解説】"
  slug: "okano-needle"
  summary: "注射が痛いのは仕方ない。その常識を壊したのは、東京都墨田区の従業員6人の町工場でした。100社以上に断られた依頼が最後に行き着いた先で、職人は「よし、やろう」と答えます。先端0.2ミリ、蚊の口と同じ太さの針をどうやって作ったのか。ずんだもんが岡野雅行を演じる再現ドラマです。"
  tags: ["注射針", "岡野雅行", "岡野工業", "ナノパス", "テルモ", "町工場", "ものづくり", "再現ドラマ", "ゆっくり", "ずんだもん", "発明", "ミーム"]
  thumbnail:
    top: "100社が断った"
    bottom: "6人の町工場がやった"
  mode: drama
  narrator: reimu
  mobs:
    - {id: chichi, label: "父", voice: 13, pitch: -0.07, item: mustache}
    - {id: shokunin, label: "職人", voice: 12}
    - {id: kotowaru, label: "断った会社", voice: 13, pitch: 0.06, item: hat}
    - {id: kodomo, label: "患者の子", voice: 8, pitch: 0.14, hair: twintail}
    - {id: isha, label: "医師", voice: 13, pitch: -0.02}
    - {id: kisha, label: "記者", voice: 12, pitch: 0.07}
scenes:
  - id: hook
    title: ""
    background: il_nd_ima
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "注射が痛いのは、仕方ないことだと思ってる？"
      - speaker: zundamon
        emotion: normal
        text: "思ってるのだ。針を刺すんだから、痛いに決まってる。"
      - speaker: tsumugi
        emotion: normal
        text: "その仕方ないを、従業員6人の町工場が壊したの。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "6人！？ 大企業じゃないのか。ファッ！？"
      - speaker: tsumugi
        emotion: normal
        text: "100社以上に断られた話が、最後にそこへ行き着いたんだよ。"
        telops:
          - {text: "100社が断った仕事", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#0A2A2A", glow: "#2AC8B0", anim: up}
      - speaker: zundamon
        emotion: thinking
        text: "……100社。ガチャを100回引いて、最後に出たのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "その話をする前に。ずんだもん、明日なんだっけ。"
      - speaker: zundamon
        emotion: sad
        text: "……健康診断なのだ。採血があるんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "顔が死んでるよ。"
      - speaker: zundamon
        emotion: angry
        text: "死んでないのだ。ボクはメンタル[鋼|はがね]なんだぞ。"
      - speaker: tsumugi
        emotion: thinking
        text: "去年どうだったっけ。"
      - speaker: zundamon
        emotion: happy
        text: "泣いてないのだ。一滴も。ノーダメだったぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "腕は出してた？"
      - speaker: zundamon
        emotion: sad
        text: "……看護師さんに、3回呼ばれた。"
      - speaker: tsumugi
        emotion: happy
        text: "泣いてないのは、そこまで行ってないからだよ。"
      - speaker: zundamon
        emotion: normal
        text: "……分かった。今年は対策を考えたのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "お、どんな。"
      - speaker: zundamon
        emotion: happy
        text: "見ないのだ。目をつぶれば、実質ないのと同じだぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "それ、去年もやってなかった？"
      - speaker: zundamon
        emotion: sad
        text: "……やった。見えないと、いつ来るか分からなくて余計こわい。"
      - speaker: tsumugi
        emotion: happy
        text: "対策が、去年と同じところに落ちてるね。"
      - speaker: zundamon
        emotion: normal
        text: "……で、その6人の町工場は何をしたんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "刺しても痛みが少ない針を作ったの。先っぽが0.2ミリ。"
      - speaker: zundamon
        emotion: surprised
        text: "0.2ミリ。……それ、どのくらいなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "蚊の口と、だいたい同じ太さ。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "蚊！ 言われてみたら、蚊に刺されても気づかないのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "そこを狙ったんだよ。"
      - speaker: zundamon
        emotion: thinking
        text: "……でも、なんで大企業にできなくて、6人にできたんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "作り方が、まったく違ったから。今日はその話だよ。"
      - speaker: reimu
        text: "痛みの少ない注射針。先端の太さは、0.2ミリしかありません。"
        reading: "いたみのすくないちゅうしゃばり。せんたんのふとさわ、れーてんにみりしかありません。"
      - speaker: reimu
        text: "作ったのは、東京都墨田区の従業員6人の町工場でした。"
        reading: "つくったのわ、とうきょうとすみだくのじゅうぎょういんろくにんのまちこうばでした。"
      - speaker: reimu
        text: "物語は、1945年の向島から始まります。"
        reading: "ものがたりわ、せんきゅうひゃくよんじゅうごねんのむこうじまからはじまります。"
  - id: shonen
    title: "1945・工場を手伝う"
    background: il_nd_gakko
    bgm: 10do
    stage:
      - {who: zundamon, x: 0.3, tag: "岡野", flip: true, scale: 0.82}
      - {who: chichi, x: 0.72}
    cuts:
      - speaker: reimu
        text: "1933年、岡野雅行は東京の向島に生まれました。"
        reading: "せんきゅうひゃくさんじゅうさんねん、おかのまさゆきわとうきょうのむこうじまにうまれました。"
      - speaker: reimu
        text: "父は、[金型|かながた]を作る小さな工場をやっていました。"
        reading: "ちちわ、かながたをつくるちいさなこうばをやっていました。"
      - speaker: chichi
        emotion: normal
        text: "[雅行|まさゆき]。学校はもういいから、手を貸せ。"
      - speaker: zundamon
        emotion: normal
        text: "……いいのか、勉強しなくて。"
      - speaker: chichi
        emotion: normal
        text: "うちの仕事は、紙の上には書いてない。"
      - speaker: zundamon
        emotion: thinking
        text: "……じゃあ、どこに書いてあるんだ。"
      - speaker: chichi
        emotion: happy
        text: "手だ。やった分だけ、手に溜まる。"
      - speaker: reimu
        text: "1945年に国民学校を出たあと、旧制中学は中退します。"
        reading: "せんきゅうひゃくよんじゅうごねんにこくみんがっこうをでたあと、きゅうせいちゅうがくわちゅうたいします。"
      - speaker: zundamon
        emotion: normal
        text: "父ちゃん。[金型|かながた]って、何を作るものなんだ。"
      - speaker: chichi
        emotion: normal
        text: "型だ。金属を、この形にしろって決める型。"
      - speaker: zundamon
        emotion: surprised
        text: "……型が、金属を曲げるのか。"
      - speaker: chichi
        emotion: normal
        text: "押すんだ。上から一発。プレスっていう。"
      - speaker: zundamon
        emotion: happy
        text: "一発。……気持ちよさそうなのだ。"
      - speaker: chichi
        emotion: angry
        text: "気持ちよくない。一発で決まらなきゃ、型を作り直しだ。"
      - speaker: zundamon
        emotion: surprised
        text: "作り直し。全部か。無理ゲーだろ。"
      - speaker: chichi
        emotion: normal
        text: "全部だ。だから、削る前に頭で決めろ。"
      - speaker: reimu
        text: "[金型|かながた]は、押す前にすべてを決めておく仕事です。"
        reading: "かながたわ、おすまえにすべてをきめておくしごとです。"
  - id: yoru
    title: "夕方5時から、朝8時まで"
    background: il_nd_yoru
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.3, tag: "岡野", flip: true}
      - {who: chichi, x: 0.72}
    cuts:
      - speaker: reimu
        text: "20代のころ、雅行は父にひとつの頼みをします。"
        reading: "にじゅうだいのころ、まさゆきわちちにひとつのたのみをします。"
      - speaker: zundamon
        emotion: normal
        text: "父ちゃん。夜、工場を貸してほしいのだ。"
      - speaker: chichi
        emotion: surprised
        text: "夜？ 何時からだ。"
      - speaker: zundamon
        emotion: normal
        text: "夕方5時から、翌朝の8時まで。"
      - speaker: chichi
        emotion: angry
        text: "……それ、寝る時間がないぞ。"
      - speaker: zundamon
        emotion: happy
        text: "昼は勤めに出るのだ。夜は自分で取ってきた仕事をやるぞ。"
      - speaker: chichi
        emotion: thinking
        text: "自分で取ってくる？ 客がいるのか。"
      - speaker: zundamon
        emotion: normal
        text: "これから作るのだ。"
      - speaker: reimu
        text: "昼は工場に勤め、夜は自分の受注をこなす。それを続けました。"
        reading: "ひるわこうばにつとめ、よるわじぶんのじゅちゅうをこなす。それをつづけました。"
      - speaker: chichi
        emotion: normal
        text: "……なあ。なんでそこまでやるんだ。"
      - speaker: zundamon
        emotion: normal
        text: "父ちゃんの型を見てて、思ったのだ。"
      - speaker: chichi
        emotion: normal
        text: "何を。"
      - speaker: zundamon
        emotion: normal
        text: "同じ形を作れる人は、たくさんいる。"
      - speaker: chichi
        emotion: thinking
        text: "……そうだな。"
      - speaker: zundamon
        emotion: normal
        text: "でも、誰も作ったことがない形は、まだ空いてるぞ。"
        telops:
          - {text: "誰も作ってない形は、空いてる", size: lg, position: bottom-center, color: "#FFFFFF", stroke: "#0A2A2A", glow: "#2AC8B0", anim: up}
      - speaker: chichi
        emotion: surprised
        text: "……空いてる、か。"
      - speaker: zundamon
        emotion: happy
        text: "そこは競争がないのだ。実質、ひとり勝ちだぞ。"
      - speaker: chichi
        emotion: happy
        text: "言い方が商売人だな。職人のくせに。"
      - speaker: zundamon
        emotion: happy
        text: "職人が商売を知らないから、買い叩かれるのだ。"
  - id: shinjo
    title: "受けない仕事を決める"
    background: il_nd_koba
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, tag: "岡野", flip: true}
      - {who: shokunin, x: 0.72}
    cuts:
      - speaker: reimu
        text: "1972年、雅行は二代目になります。"
        reading: "せんきゅうひゃくななじゅうにねん、まさゆきわにだいめになります。"
      - speaker: reimu
        text: "社名を岡野工業と改めました。"
        reading: "しゃめいをおかのこうぎょうとあらためました。"
      - speaker: reimu
        text: "従業員は6人。増やしませんでした。"
        reading: "じゅうぎょういんわろくにん。ふやしませんでした。"
      - speaker: shokunin
        emotion: normal
        text: "社長。またお断りしたんですか、あの仕事。"
      - speaker: zundamon
        emotion: happy
        text: "断ったのだ。あれは、よそでもできる。"
      - speaker: shokunin
        emotion: surprised
        text: "でも、数が出ますよ。安定します。"
      - speaker: zundamon
        emotion: normal
        text: "安定した瞬間、値段を下げろって言われるのだ。"
      - speaker: shokunin
        emotion: thinking
        text: "……たしかに。それはそう。"
      - speaker: zundamon
        emotion: normal
        text: "うちが受けるのは、2つだけと決めてるぞ。"
      - speaker: shokunin
        emotion: normal
        text: "2つ。"
      - speaker: zundamon
        emotion: normal
        text: "ひとつ。安すぎて、誰もやりたがらない仕事。"
      - speaker: shokunin
        emotion: surprised
        text: "安すぎるほうを、わざわざ？"
      - speaker: zundamon
        emotion: happy
        text: "誰もやらないなら、値段はこっちが決められるのだ。"
      - speaker: shokunin
        emotion: thinking
        text: "……逆にアリだ、それ。"
      - speaker: zundamon
        emotion: normal
        text: "ふたつ。難しすぎて、[他|ほか]の誰にもできない仕事。"
      - speaker: shokunin
        emotion: normal
        text: "そっちは分かります。"
      - speaker: zundamon
        emotion: normal
        text: "この2つは、競争相手がいないのだ。"
      - speaker: shokunin
        emotion: normal
        text: "でも社長。それ、仕事が来なくなりませんか。"
      - speaker: zundamon
        emotion: happy
        text: "逆なのだ。困った人しか来なくなるぞ。"
      - speaker: shokunin
        emotion: surprised
        text: "……困った人。"
      - speaker: zundamon
        emotion: normal
        text: "[他|ほか]で断られて、最後にうちに来るのだ。"
  - id: zippo
    title: "板が、箱になる"
    background: il_nd_koba
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, tag: "岡野", flip: true}
      - {who: shokunin, x: 0.72}
    cuts:
      - speaker: reimu
        text: "岡野工業には、以前から得意な加工がありました。"
        reading: "おかのこうぎょうにわ、いぜんからとくいなかこうがありました。"
      - speaker: shokunin
        emotion: normal
        text: "社長。この平らな板が、本当に箱になるんですか。"
      - speaker: zundamon
        emotion: happy
        text: "なるのだ。見てろ。"
      - speaker: shokunin
        emotion: surprised
        text: "……押した。……あ、へこんだ。"
      - speaker: zundamon
        emotion: normal
        text: "へこんだんじゃないのだ。伸びたんだぞ。"
      - speaker: shokunin
        emotion: thinking
        text: "……伸びる。金属がですか。"
      - speaker: zundamon
        emotion: normal
        text: "伸びるのだ。ゆっくりやれば、けっこう伸びるぞ。"
      - speaker: reimu
        text: "板を型で押し込み、深い容器にする。これを深絞りといいます。"
        reading: "いたをかたでおしこみ、ふかいようきにする。これをふかしぼりといいます。"
      - speaker: shokunin
        emotion: normal
        text: "でも、急に押すと。"
      - speaker: zundamon
        emotion: normal
        text: "[破れる|やぶれる]のだ。伸びる速さには、限界があるぞ。"
      - speaker: shokunin
        emotion: thinking
        text: "……そこを見極めるのが、腕なんですね。"
      - speaker: zundamon
        emotion: happy
        text: "そうなのだ。ライターのケースで、さんざん覚えたぞ。"
      - speaker: shokunin
        emotion: surprised
        text: "ライター。あの、四角い金属のやつですか。"
      - speaker: zundamon
        emotion: normal
        text: "あれなのだ。継ぎ目がないだろ。1枚から絞ってるぞ。"
      - speaker: shokunin
        emotion: surprised
        se: don
        text: "……言われてみたら、継ぎ目がない。"
      - speaker: reimu
        text: "継ぎ目のない容器は、一枚の板を絞ることでしか作れません。"
        reading: "つぎめのないようきわ、いちまいのいたをしぼることでしかつくれません。"
      - speaker: zundamon
        emotion: normal
        text: "継ぎ目があると、そこから漏れる。そこから割れる。"
      - speaker: shokunin
        emotion: normal
        text: "……だから、最初から1枚で作る。"
      - speaker: zundamon
        emotion: happy
        text: "そうなのだ。この考え方は、あとでもう一回出てくるぞ。"
  - id: denchi
    title: "ライターから電池へ"
    background: il_nd_koba
    bgm: hirusagari
    stage:
      - {who: zundamon, x: 0.3, tag: "岡野", flip: true}
      - {who: shokunin, x: 0.72}
    cuts:
      - speaker: zundamon
        emotion: normal
        text: "[深絞り|ふかしぼり]なのだ。平らな板を、深い箱にする。"
      - speaker: shokunin
        emotion: normal
        text: "ライターのケースで、さんざんやりましたね。"
      - speaker: zundamon
        emotion: happy
        text: "あれでレベル上げしたのだ。金属は、思ったより伸びるぞ。"
      - speaker: shokunin
        emotion: normal
        text: "社長。今度の話、電池のケースだそうです。"
      - speaker: zundamon
        emotion: normal
        text: "電池。乾電池か。"
      - speaker: shokunin
        emotion: normal
        text: "いえ、四角いやつです。ウォークマン用の。"
      - speaker: zundamon
        emotion: thinking
        text: "……四角い電池。中身は液か。"
      - speaker: shokunin
        emotion: surprised
        text: "はい。だから、絶対に漏れちゃいけないと。"
      - speaker: zundamon
        emotion: normal
        text: "……なら、継ぎ目を作れないのだ。"
      - speaker: shokunin
        emotion: surprised
        text: "継ぎ目なし！？ それ無理ゲーですよ。"
      - speaker: zundamon
        emotion: happy
        text: "1枚の板から、そのまま絞るのだ。"
      - speaker: shokunin
        emotion: normal
        text: "ステンレスですよ。薄くすると、割れます。"
      - speaker: zundamon
        emotion: normal
        text: "割れる手前で止めるのだ。そこが腕なんだ。"
      - speaker: reimu
