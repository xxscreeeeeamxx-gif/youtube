      - speaker: tsumugi
        emotion: surprised
        text: "8割……その8割が、まるごと無い状態で外を歩くのか。"
      - speaker: zundamon
        emotion: normal
        text: "残りの耳と手と足で、8割ぶんを補ってるのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "そう聞くと、外を歩くだけで、大仕事だな。"
      - speaker: zundamon
        emotion: normal
        text: "音もたよりになる。でも、雨の日や工事中は、かき消されるんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "たよりの綱が、天気で切れるんじゃ、危なすぎる。"
      - speaker: tsumugi
        emotion: thinking
