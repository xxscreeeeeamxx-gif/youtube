# 点字ブロック再現ドラマ・ミーム版（三宅精一×三郎×岩橋英行・1963→現代）。投稿前に必ず目視レビュー。
# 本編tenji-blockのセリフをミーム化した派生版。ナレ行・クリップ・年号カードは本編と共用（位相同期なし）。
# 配慮: mokugeki/iwahashi/fusetsu/bannen/jitsuyouの核・naze はミーム無しでクリーン維持。
# 裏取り: 三宅精一Wikipedia/視覚障害者誘導用ブロックWikipedia/岡山県HP/precious.jp/
# 日経2017(75カ国)/安全交通試験研究センター。1967-3-18原尾島交差点230枚・1972高田馬場1万枚・
# 1970阪和線我孫子町駅ホーム初・1974建設省協力と線状考案・1982精一没56歳・2001JIS T9251・2012 ISO23599
meta:
  title: "黄色いブロックに、全財産。友の失明から生まれた点字ブロック【ゆっくり再現ドラマ・ミーム版】"
  slug: "tenji-block-meme"
  summary: "点字ブロックを発明した岡山の発明家・三宅精一の物語。交差点で白い杖の人が車道へ入りかける場面を目撃し、失明が進む友人・岩橋英行の「コケと土の境は足の裏で分かる」という一言から、足の裏で読む道を思いつく。弟・三郎と試作を重ね、1967年、世界初の点字ブロック230枚を私費で岡山に敷設。しかし時代は動かず、私財は底をつきかける。高田馬場の1万枚、駅ホームへの採用、そして兄の遺志を継いだ弟のJIS化から世界75カ国への広がりまで、ずんだもんが三宅精一を、つむぎが弟・三郎を演じる再現ドラマ・ミーム版でお届けします。"
  tags: ["点字ブロック", "三宅精一", "岡山", "バリアフリー", "再現ドラマ", "ゆっくり", "ずんだもん", "発明", "ミーム"]
  thumbnail:
    top: "足の裏で、読む道"
    bottom: "全財産を黄色に変えた男"
  mode: drama
  narrator: reimu
  mobs:
    - {id: iwahashi, label: "岩橋英行", voice: 13, pitch: -0.03, item: mustache}
    - {id: yakunin, label: "役人", voice: 13, pitch: -0.08, item: hat}
    - {id: seito, label: "盲学校の生徒", voice: 12, hair: short}
scenes:
  - id: hook
    title: ""
    background: il_tb_st
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: zundamon
        emotion: happy
        text: "この黄色いデコボコ[道|みち]、足つぼで気持ちいい。実質無料マッサージなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "ずんだもん、そこ。立ち止まっちゃだめ。"
      - speaker: zundamon
        emotion: thinking
        text: "快適だから、ボク専用の健康ロード。俺得の道なんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "専用は合ってる。でも、あなた専用じゃないよ。"
      - speaker: zundamon
        emotion: surprised
        text: "えっ。じゃあ、誰専用なんだ？"
      - speaker: tsumugi
        emotion: normal
        text: "目の不自由な人が、足の裏で読む道。点字ブロックだよ。"
        telops:
          - {text: "足の裏で、読む道", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: zundamon
        emotion: surprised
        text: "足の裏で、読む！？ファッ！？"
      - speaker: tsumugi
        emotion: normal
        text: "突起の形で、止まれと進めを伝えてるの。"
      - speaker: zundamon
        emotion: thinking
        text: "ただのデコボコじゃ、なかったんだ……。"
      - speaker: tsumugi
        emotion: normal
        text: "世界中の駅や道にあるけど、生まれた場所は日本。岡山だよ。"
      - speaker: zundamon
        emotion: surprised
        text: "岡山！？大企業でも研究所でもなく、個人開発かよ！"
      - speaker: tsumugi
        emotion: normal
        text: "一人の発明家。自分の財産をつぎ込んで、世界に広めたの。"
      - speaker: zundamon
        emotion: surprised
        text: "ぜ、全財産！？フルコミットすぎるぞ。なんで、そこまで？"
      - speaker: tsumugi
        emotion: normal
        text: "友だちの目が、見えなくなっていったから。"
      - speaker: zundamon
        emotion: sad
        text: "……悲しい話なのだ？"
      - speaker: tsumugi
        emotion: happy
        text: "ううん、優しい話。今日はその人の物語だよ。"
      - speaker: zundamon
        emotion: normal
        text: "聞くのだ。……あ、ブロックの上からは、どくのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "その一歩の意味も、最後には分かるからね。"
      - speaker: reimu
        text: "点字ブロック。目の不自由な人が、足の裏で読む道です。"
        reading: "てんじぶろっく。めのふじゆうなひとが、あしのうらでよむみちです。"
      - speaker: reimu
        text: "作ったのは、岡山の一人の発明家と、その弟でした。"
        reading: "つくったのわ、おかやまのひとりのはつめいかと、そのおとうとでした。"
      - speaker: reimu
        text: "物語は、1963年の岡山から始まります。"
        reading: "ものがたりわ、せんきゅうひゃくろくじゅうさんねんのおかやまからはじまります。"
  - id: era1963
    title: "1963・ある交差点で"
    background: il_tb_kosaten
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.15, tag: "三宅", flip: true}
    cuts:
      - speaker: reimu
        text: "1963年、岡山。"
        reading: "せんきゅうひゃくろくじゅうさんねん、おかやま。"
