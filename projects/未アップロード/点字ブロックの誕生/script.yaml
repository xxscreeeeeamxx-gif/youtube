      - speaker: zundamon
        emotion: happy
        text: "つまずかない。でも足の裏には届く。神調整なんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "点の数と並べ方も、そろえよう。ばらばらだと読みにくい。"
      - speaker: zundamon
        emotion: normal
        text: "[縦横|たてよこ]に、きちんと格子で並べるんだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "ばらばらに散らすのと、何が違うんだ？"
      - speaker: zundamon
        emotion: normal
        text: "並びが規則正しいと、踏んだ瞬間に、模様として分かるんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "なるほど。1点じゃなくて、面で読ませるのか。"
      - speaker: zundamon
        emotion: normal
        text: "どこの町でも同じ形なら、体が覚えてくれるんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "雨の日に滑らないかも、確かめないとな。"
      - speaker: tsumugi
