      - speaker: reimu
        text: "白い杖の人が、車の前へ出かける場面でした。"
        reading: "しろいつえのひとが、くるまのまええでかけるばめんでした。"
      - speaker: zundamon
        emotion: thinking
        text: "歩道と車道の境目に、足で分かる目印が、何もないのだ。"
      - speaker: zundamon
        emotion: sad
        text: "あの人は毎日、音だけをたよりに、ここを渡ってるのだ。"
      - speaker: zundamon
        emotion: normal
        text: "見えないままで、安全に歩ける道。この町には、無いのだ。"
      - speaker: reimu
        text: "この光景が、精一の頭を離れなくなります。"
        reading: "このこうけいが、せいいちのあたまをはなれなくなります。"
  - id: iwahashi
