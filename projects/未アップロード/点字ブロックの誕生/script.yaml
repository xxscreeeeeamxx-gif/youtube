      - {who: tsumugi, x: 0.15, tag: "三郎"}
    cuts:
      - speaker: reimu
        text: "1辺30センチ、点は5かける5、高さ5ミリ。どの町でも、同じ形です。"
        reading: "いっぺんさんじゅっせんち、てんわごかけるご、たかさごみり。どのまちでも、おなじかたちです。"
        video: assets/clips/tb_jis.mp4
        video_full: true
  - id: iro
    title: "なぜ、黄色なのか"
    background: il_tb_sekai
    bgm: beat
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: reimu
        text: "時は流れて、現代。"
        reading: "ときわながれて、げんだい。"
      - speaker: tsumugi
        emotion: normal
        text: "ところで、なんで黄色だと思う？"
      - speaker: zundamon
        emotion: thinking
        text: "足の裏で読む道なのに、色が要るんだ？"
      - speaker: tsumugi
        emotion: normal
        text: "見えにくい人と、全く見えない人は、違うんだよ。"
      - speaker: zundamon
        emotion: surprised
        text: "……そうか。ぼんやりなら見える人も、たくさんいるんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "弱視の人にはね、灰色の道の上で、黄色がいちばん浮いて見えるの。"
      - speaker: zundamon
        emotion: thinking
        text: "たしかに暗い道でも、あの黄色は視認性がレベチなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "まわりの道より明るく目立つこと、って国の指針にもあるんだよ。"
      - speaker: zundamon
        emotion: normal
        text: "足の裏と、杖の先と、目。三重の合図だったんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "2012年には、日本の規格をもとに、国際規格もできたよ。"
      - speaker: zundamon
        emotion: happy
        text: "岡山生まれの形が、世界標準になった。覇権なのだ。"
        telops:
          - {text: "岡山の形が、世界標準に", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: reimu
        text: "点字ブロックは今、およそ75の国で使われています。"
        reading: "てんじぶろっくわいま、およそななじゅうごのくにでつかわれています。"
      - speaker: zundamon
        emotion: normal
        text: "ロンドンでもニューヨークでも、あの黄色が道を教えてるんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "たった一人の思いつきが、世界の足元を変えたんだね。"
  - id: jitsuyou
    title: "私たちに、できること"
    background: il_tb_st
    bgm: beat
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "最後に、私たちにできることの話。"
      - speaker: zundamon
        emotion: normal
        text: "ブロックの上に、立ち止まらないこと。冒頭のボクなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "そう。あそこで立ち止まると、誰かの道をふさいじゃう。"
      - speaker: zundamon
        emotion: thinking
        text: "スマホを見ながらブロックの上を歩くのも、あぶないんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。あの線の上は、よけられない人が通る道だからね。"
      - speaker: zundamon
        emotion: normal
        text: "自転車や看板を、上に置くのも、だめなんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "線の上の障害物は、見えない人には、突然の壁だからね。"
      - speaker: zundamon
        emotion: thinking
        text: "もし、白い杖の人が困ってたら、どうすればいいんだ？"
      - speaker: tsumugi
        emotion: normal
        text: "正面から、何かお手伝いしましょうか、って声をかけるの。"
      - speaker: zundamon
        emotion: normal
        text: "いきなり腕をつかむのは、びっくりさせるから、だめなんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "よく知ってるね。こちらの肩や腕に、つかまってもらうのが基本。"
      - speaker: zundamon
        emotion: normal
        text: "ブロックを空けて、困ってたら声をかける。それだけなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。それだけで、あの黄色い道は、ちゃんと働ける。"
      - speaker: reimu
        text: "道は、敷いた人と、使う人と、ゆずる人とで、できています。"
        reading: "みちわ、しいたひとと、つかうひとと、ゆずるひととで、できています。"
  - id: musubi
    title: ""
    background: il_tb_st
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: zundamon
        emotion: normal
        text: "駅までの黄色い道、今日から違って見えるんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "あの一枚一枚が、岡山の兄弟の全財産と、執念だからね。"
      - speaker: zundamon
        emotion: normal
        text: "始まりは、友だちの、歩きたいという一言なんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "庭のコケの感触に気づいた、友だちもすごいんだよ。"
      - speaker: zundamon
        emotion: normal
        text: "岡山の230枚が、75の国に広がったんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "優しさって、ちゃんと広がるんだね。"
      - speaker: zundamon
        emotion: normal
        text: "しかも、発明した人の名前は、ほとんど知られてないんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "名前は残らなくても、道は残った。それでいいって笑いそうだね。"
      - speaker: zundamon
        emotion: normal
        text: "明日から、黄色い道の上を、空けて歩くのだ。"
      - speaker: zundamon
        emotion: happy
        text: "あの黄色は、誰かの目なのだ！"
        telops:
          - {text: "黄色いブロックは、誰かの目", size: xl, position: middle-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: tsumugi
        emotion: happy
        text: "面白かったら、高評価とチャンネル登録で応援してね。"
      - speaker: zundamon
        emotion: normal
        text: "コメントで、あなたの町の点字ブロックの話も、教えてほしいんだ。"
      - speaker: tsumugi
        emotion: happy
        text: "それでは、また次の動画で。"
      - speaker: zundamon
        emotion: happy
        text: "ご視聴、ありがとうございましたなのだ！"
        duet_with: tsumugi
