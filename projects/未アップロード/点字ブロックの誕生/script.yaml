      - speaker: zundamon
        emotion: normal
        text: "点字は手で読むものなのだ。歩きながら、地面は触れないんだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "地面から情報をもらう方法が、ひとつも無いんだな。"
      - speaker: zundamon
        emotion: normal
        text: "そこなのだ。だから、道そのものに情報を埋め込みたいんだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "道が、しゃべるようにするってことか。"
      - speaker: zundamon
        emotion: normal
        text: "ここは危ない、こっちは安全。道に言わせるんだ。"
      - speaker: reimu
        text: "道そのものを、情報に変える。前例のない発想でした。"
        reading: "みちそのものを、じょうほうにかえる。ぜんれいのないはっそうでした。"
      - speaker: tsumugi
        emotion: normal
        text: "言うのは簡単だけどな。どうやって、道に言わせるんだ。"
      - speaker: zundamon
        emotion: thinking
