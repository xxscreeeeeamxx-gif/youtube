      - speaker: iwahashi
        text: "感触を、合図に？"
      - speaker: zundamon
        emotion: happy
        text: "突起を並べたブロックを、道の要所に敷くんだ。"
      - speaker: zundamon
        emotion: normal
        text: "足の裏でも、杖の先でも分かる、でこぼこの合図なのだ。"
      - speaker: iwahashi
        text: "……くつ越しに読める、地面の点字ですか。"
      - speaker: zundamon
        emotion: happy
