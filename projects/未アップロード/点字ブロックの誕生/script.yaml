        text: "兄さん、また発明か。旅館の仕事はどうしたんだ。"
      - speaker: zundamon
        emotion: normal
        text: "旅館はやってる。発明は、その合間の倍やってるんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "威張るところじゃないだろ、それ。"
      - speaker: zundamon
        emotion: normal
        text: "旅館はいいのだ。お客さんの困りごとが、よく見えるんだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "そういえば、階段の手すりも、兄さんが勝手に増やしてたな。"
      - speaker: zundamon
        emotion: normal
        text: "お年寄りのお客さんが、のぼるのに苦労してたんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "商売より先に、手が動くんだから、しょうがない人だ。"
      - speaker: zundamon
        emotion: normal
        text: "世の中の困りごとを見つけると、直したくなる性分なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "まあ、兄さんの図面は、おれが形にしてやるけどさ。"
      - speaker: reimu
        text: "弟の三郎は、建設の技術者でした。"
        reading: "おとうとのさぶろうわ、けんせつのぎじゅつしゃでした。"
      - speaker: zundamon
        emotion: happy
        text: "兄弟がそろえば、たいていの物は作れる。実質、無敵なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "で、次は何を直すんだ？"
      - speaker: zundamon
        emotion: thinking
        text: "それが、まだ見つかってない。ネタ探しに、町を歩くぞ。"
  - id: mokugeki
    title: ""
    background: il_tb_kosaten
