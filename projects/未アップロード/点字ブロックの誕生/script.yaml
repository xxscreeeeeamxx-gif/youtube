    background: il_tb_home
    bgm: curious
    stage:
      - {who: zundamon, x: 0.24, tag: "三宅", flip: true}
      - {who: tsumugi, x: 0.76, tag: "三郎"}
    cuts:
      - speaker: tsumugi
        emotion: thinking
        text: "兄さん、道を作るって、どういうことだよ。"
      - speaker: zundamon
