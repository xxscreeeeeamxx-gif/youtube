      - speaker: reimu
        text: "庭のコケの感触から、点字ブロックの発想が生まれました。"
        reading: "にわのこけのかんしょくから、てんじぶろっくのはっそうがうまれました。"
  - id: kaihatsu
    title: "5ミリの答え"
    background: il_tb_koujou
    bgm: curious
    stage:
      - {who: zundamon, x: 0.24, tag: "三宅", flip: true}
      - {who: tsumugi, x: 0.76, tag: "三郎"}
    cuts:
