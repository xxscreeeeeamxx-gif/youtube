  background: mg_card_2000
  cuts:
  - speaker: reimu
    text: 2000年12月。メガスターが、国内で初めて一般に公開されます。
    reading: にせんねん じゅうにがつ。めがすたーが、こくないで はじめて いっぱんに こうかい されます。
- id: ch7_spiral
  title: 解説のない星空
  background: mg_spiral
  bgm: amacha_hoshizora
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, emotion: normal}
  - {who: staff, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 会場は、東京・表参道のギャラリーでした。
    reading: かいじょうわ、とうきょうの おもてさんどうの ぎゃらりーでした。
  - speaker: staff
    emotion: thinking
    text: 大平さん、星座の説明はしないんですか？
  - speaker: zundamon
    emotion: normal
    text: 今回は、波と風の音だけにします。
  - speaker: staff
    emotion: thinking
    text: じゃあ、あの光の帯は[何|なん]ですかって聞かれたら？
  - speaker: zundamon
    emotion: normal
    text: 天の川です。ボクたちの銀河を、[中|なか]から見た姿です。
  - speaker: zundamon
    emotion: normal
    text: 近くで見ると一つ一つが星で、遠くからだと帯に見えるんです。
  - speaker: staff
    emotion: surprised
    text: ……じゃあ、私たちもあの中にいるんですね。
  - speaker: reimu
    text: 宇宙の中に自分もいると感じたとき、感動は大きくなる。大平は、そう気づいたと語っています。
    reading: うちゅうの なかに じぶんも いると かんじた とき、かんどうわ おおきく なる。おおひらわ、そう きづいたと かたって います。
- id: ch8_futatsu
  title: 会社員と作り手
  background: mg_dome
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, emotion: thinking}
  - {who: staff, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 2002年。大平は渋谷の、閉館したプラネタリウムのドームで1か月あまりの上映を引き受けます。
    reading: にせんにねん。おおひらわ しぶやの、へいかん した ぷらねたりうむの どーむで いっかげつ あまりの じょうえいお ひきうけます。
  - speaker: staff
    emotion: thinking
    text: 大平さん、平日の昼に機械が止まったらどうしましょう？
  - speaker: zundamon
    emotion: thinking
    text: ……会社を抜けて、駆けつけるわけにはいきません。
  - speaker: staff
    emotion: normal
    text: お客さんは、毎日来ますからね。
  - speaker: staff
    emotion: thinking
    text: 電話をすれば……あ、会議中は出られないんでしたっけ。
    beat: true
  - speaker: zundamon
    emotion: sad
    text: ソニーの大平なのか、プラネタリウムの大平なのか……。
    se: shobon
- id: ch8_jishu
  title: 手作りのドーム
  background: mg_airdome
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, emotion: normal}
  - {who: staff, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 同じ2002年。会社員のまま、お台場の日本科学未来館で上映会を開きます。
    reading: おなじ にせんにねん。かいしゃいんの まま、おだいばの にほん かがく みらいかんで じょうえいかいお ひらきます。
  - speaker: staff
    emotion: happy
    text: 大平さん、今日のドームも満席です！
  - speaker: zundamon
    emotion: happy
    text: 手伝ってくれる、みんなのおかげです。
  - speaker: staff
    emotion: normal
    text: 直径10メートルのドームに、60人しか入れませんからね。
  - speaker: zundamon
    emotion: normal
    text: その60人に、170万個の星を見せるんです。
  - speaker: staff
    emotion: thinking
    text: 1人あたり、2万8000個ですね。
    beat: true
  - speaker: reimu
    text: 夏とクリスマスに開いた上映会は、ボランティアが運営を手伝いました。
    reading: なつと くりすますに ひらいた じょうえいかいわ、ぼらんてぃあが うんえいお てつだいました。
  - speaker: reimu
    text: 館長の毛利衛からは、未来館で一緒に育てていきましょうと声がかかります。
    reading: かんちょうの もうり まもるからわ、みらいかんで いっしょに そだてて いきましょうと こえが かかります。
- id: ch8_taisha
  title: 会社を去る日
  background: mg_sony
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, emotion: normal}
  - {who: joushi, x: 0.7, emotion: thinking}
  cuts:
  - speaker: joushi
    emotion: thinking
    text: 大平くん。本当に、辞めるんだな。
  - speaker: zundamon
    emotion: normal
    text: ソニーの大平じゃなく、プラネタリウムの大平でやっていきます。
  - speaker: joushi
    emotion: sad
    text: 会社で事業にする話も、形にしてやれなかったな。
  - speaker: zundamon
    emotion: normal
    text: 検討していただいたことは、この先に生かします。
  - speaker: joushi
    emotion: normal
    text: ……星を、頼んだぞ。
    se: namida
  - speaker: reimu
    text: 2003年、大平はソニーを退社します。
    reading: にせんさんねん、おおひらわ そにーお たいしゃ します。
  - speaker: reimu
    text: 社長の安藤国威は社内報のコラムでこの退社を取り上げ、そこに至ったことを省みました。
    reading: しゃちょうの あんどう くにたけわ しゃないほうの こらむで この たいしゃお とりあげ、そこに いたった ことお かえりみました。
- id: card2004
  title: ''
  background: mg_card_2004
  cuts:
  - speaker: reimu
    text: 2004年7月11日。日本科学未来館で、メガスターの常設の投影が始まります。
    reading: にせんよねん しちがつ じゅういちにち。にほん かがく みらいかんで、めがすたーの じょうせつの とうえいが はじまります。
- id: ch9_miraikan
  title: 国の施設の主役
  background: mg_miraikan
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 国の施設の、主役の機械なのだ。
  - speaker: tsumugi
    emotion: normal
    text: その重圧は大きかったと、大平さんは話してるわ。
  - speaker: tsumugi
    emotion: happy
    text: これでプレッシャーを感じないのは、よほど肝が据わってるかのんきかのどちらか。
  - speaker: tsumugi
    emotion: happy
    text: 大平さんは、そう笑って話してるの。
  - speaker: zundamon
    emotion: happy
    text: 大平さんは、感じるほうなんだね。
  - speaker: tsumugi
    emotion: thinking
    text: 館長の毛利さんには、あなたが事故に遭ったらどうなるのかとも聞かれたの。
  - speaker: zundamon
    emotion: thinking
    text: 作れる人が、一人しかいないからか。
  - speaker: tsumugi
    emotion: normal
    text: 映した星は、560万個。
  - speaker: tsumugi
    emotion: normal
    text: 宇宙飛行士でもある毛利さんは、宇宙で見た星空そのものだと評したわ。
  - speaker: zundamon
    emotion: surprised
    text: 本物の宇宙を見た人の、お墨付きなのだ！
  - speaker: tsumugi
    emotion: normal
    text: この年、ギネス世界記録にも認定されたの。
    telops:
    - {text: ギネス世界記録に認定, size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 世界で最も先進的なプラネタリウムの投影機、としてね。
  - speaker: zundamon
    emotion: surprised
    text: 7畳から、世界一なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: このころの大平さんは、こんな話をしてるの。
  - speaker: tsumugi
    emotion: thinking
    text: 高校生のとき以来、オーストラリアの天の川は見に行けていないって。
  - speaker: zundamon
    emotion: surprised
    text: どうして？
  - speaker: tsumugi
    emotion: normal
    text: 本物を見て自分の星空と違っていたら、ショックだから。見ないほうが幸せかも、って。
  - speaker: zundamon
    emotion: thinking
    text: 作った人ならではの、悩みなのだ。
- id: ch10_homestar
  title: 家の中の星空
  background: mg_homestar
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, emotion: normal}
  - {who: gangu, x: 0.7, emotion: normal}
  cuts:
  - speaker: gangu
    emotion: normal
    text: 大平さん。家で使えるプラネタリウムを、一緒に作りませんか。
  - speaker: zundamon
    emotion: surprised
    text: おもちゃの会社から、ですか。
  - speaker: reimu
    text: 声をかけたのは、玩具メーカーのセガトイズでした。
    reading: こえお かけたのわ、がんぐ めーかーの せがといずでした。
  - speaker: gangu
    emotion: thinking
    text: 仕事で疲れた帰り道、ふと星が見たいと思ったんです。
  - speaker: zundamon
    emotion: happy
    text: 家に帰れば星空がある、というのはいいですね。
  - speaker: zundamon
    emotion: normal
    text: この大きさで、星を1万個映します。
  - speaker: gangu
    emotion: normal
    text: 値段は、2万790円にします。
  - speaker: gangu
    emotion: thinking
    text: おもちゃとしては、かなり高い値段ですけどね。
  - speaker: reimu
    text: 2005年2月に大平は大平技研を作り、この年ホームスターが発売されます。
    reading: にせんごねん にがつに おおひらわ おおひら ぎけんお つくり、この とし ほーむすたーが はつばい されます。
  - speaker: reimu
    text: 同じ2005年、自伝が堂本剛の主演でドラマになります。
    reading: おなじ にせんごねん、じでんが どうもと つよしの しゅえんで どらまに なります。
  - speaker: reimu
    text: 当初の見込みは、1000台売れれば上出来というものでした。
    reading: とうしょの みこみわ、せんだい うれれば じょうできと いう ものでした。
  - speaker: gangu
    emotion: surprised
    text: 大平さん！ 2015年に、100万台を超えました！
    background: mg_homestar_hako
  - speaker: gangu
    emotion: happy
    text: 2021年には、170万台です。見込みの1700倍ですよ！
    se: levelup
    telops:
    - {text: 見込み1000台→170万台, size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: gangu
    emotion: thinking
    text: 1000台で上出来と言った会議は、社内ではなかったことになってます。
    beat: true
- id: ch11_shinka
  title: 10億の星
  background: mg_zukai3
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.14, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.86, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: メガスターの星の数は、そのあとも増え続けたの。
  - speaker: tsumugi
    emotion: normal
    text: 2006年には施設向けのプラネタリウムで初めて、光源にLEDを使ったわ。
  - speaker: zundamon
    emotion: thinking
    text: 電球を、取り替えなくてよくなったの？
  - speaker: tsumugi
    emotion: normal
    text: そう。今のLEDは、3万時間ほど持つのよ。
  - speaker: tsumugi
    emotion: normal
    text: 2008年には、2200万個を映す機械を発表したわ。
  - speaker: tsumugi
    emotion: normal
    text: 2012年には子どものころ[通った|かよった]川崎の科学館に、新しいメガスターが入ったの。
  - speaker: zundamon
    emotion: happy
    text: 大平さんがダイヤルを回した、あの科学館なのだ！
  - speaker: tsumugi
    emotion: normal
    text: レンズで映す星とデジタルの映像を重ねて、映像と重なる所だけ星を消せる機械よ。
  - speaker: tsumugi
    emotion: normal
    text: 2015年には、ソニーのグループ会社とブルーレイの技術で星の板を作ったの。
  - speaker: tsumugi
    emotion: normal
    text: 穴の大きさは、200ナノメートル。映せる星は、10億個を超えたわ。
    telops:
    - {text: 映せる星は10億個以上, size: xl, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 10億個！？ 辞めた会社の仲間と、また組んだのだ！
    beat: true
  - speaker: tsumugi
    emotion: happy
    text: 辞めたあとも、縁は続いてたのね。
- id: ch12_kyujo
  title: 球場いっぱいの星
  background: mg_giken
  bgm: pop
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 大平貴之, emotion: normal}
  - {who: irai, x: 0.52, emotion: normal}
  - {who: staff, x: 0.8, emotion: normal}
  cuts:
  - speaker: irai
    emotion: normal
    text: 大平さん。今度、ドーム球場で歌手のコンサートをやるんです。
  - speaker: irai
    emotion: happy
    text: ドームの天井に、星を映せませんか？
  - speaker: zundamon
    emotion: thinking
    text: 天井いっぱい、ですか……？
  - speaker: staff
    emotion: thinking
    text: さすがに、それは……。
  - speaker: zundamon
    emotion: happy
    text: ……できます。やらせてください！
  - speaker: staff
    emotion: surprised
    text: えっ！？
    se: gaan
  - speaker: reimu
    text: 断るつもりの席で、思わずできますと言ってしまったと本人は振り返っています。
    reading: ことわる つもりの せきで、おもわず できますと いって しまったと ほんにんわ ふりかえって います。
  - speaker: irai
    emotion: happy
    text: 言いましたね。じゃあ、よろしくお願いします！
  - speaker: staff
    emotion: sad
    text: ……大平さん。球場の天井って、うちのドームの何倍あると思ってるんですか。
  - speaker: staff
    emotion: thinking
    text: ……で、どう映すんですか？
  - speaker: zundamon
    emotion: normal
    text: 小さな鏡を、球にたくさん貼ります。鏡1枚が、星1つになるんです。
  - speaker: zundamon
    emotion: normal
    text: 鏡は約6000枚。直径32センチの球に、貼っていきます。
  - speaker: staff
    emotion: thinking
    text: 6000枚……。今夜も、帰れませんね。
    beat: true
- id: ch12_giganium
  title: ''
  background: mg_stadium_akari
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, emotion: normal}
  - {who: staff, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 2019年8月25日。埼玉の球場で、野球の試合のあとに星空が公開されます。
    reading: にせんじゅうきゅうねん はちがつ にじゅうごにち。さいたまの きゅうじょうで、やきゅうの しあいの あとに ほしぞらが こうかい されます。
  - speaker: staff
    emotion: surprised
    text: 照明が消えて……天井が、星でいっぱい！
    background: mg_stadium
  - speaker: reimu
    text: およそ1万人が、同じ星空を見上げました。
    reading: およそ いちまんにんが、おなじ ほしぞらお みあげました。
    telops:
    - {text: 約1万人が同じ星空を, size: lg, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: reimu
    text: 2023年、この球場の星空は投影の広さでギネス世界記録に認められます。
    reading: にせんにじゅうさんねん、この きゅうじょうの ほしぞらわ とうえいの ひろさで ぎねす せかい きろくに みとめられます。
- id: ch13_ronsou
  title: 見えない星は嘘？
  background: mg_zukai4
  bgm: jitaku_nite
  stage:
  - {who: zundamon, x: 0.14, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.86, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: でも目で見えない星まで映したら、嘘の星空にならない？
  - speaker: tsumugi
    emotion: normal
    text: そう思う人も、いるかもね。
  - speaker: tsumugi
    emotion: normal
    text: 大平さんは、星を足してるわけじゃないと説明してるわ。
  - speaker: tsumugi
    emotion: normal
    text: 本物どおりの暗さで小さな点として映しているだけ、って。
  - speaker: zundamon
    emotion: thinking
    text: 暗すぎて、見えないだけ？
  - speaker: tsumugi
    emotion: normal
    text: そう。実際ドームの中で双眼鏡をのぞくと、本物の空と同じように暗い星が見えるの。
  - speaker: zundamon
    emotion: surprised
    text: 見えない星も、ちゃんとそこにあるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 見えない星がたくさん集まるから、天の川はぼんやり光って見えるのよ。
  - speaker: tsumugi
    emotion: thinking
    text: '[日本|にほん]の人口の約7割は、天の川が見えない場所に住んでるの。'
  - speaker: tsumugi
    emotion: thinking
    text: 街の明かりのせいね。そういう研究があるの。
  - speaker: zundamon
    emotion: sad
    text: 東京で3つしか見えなかったのは、そのせいか……。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、星の数の世界一はずっとメガスター？
  - speaker: tsumugi
    emotion: normal
    text: そこは、争いが続いてるの。
  - speaker: tsumugi
    emotion: normal
    text: 2012年には、[日本|にほん]の[五藤光学|ごとうこうがく]の機械がギネスの記録を塗り替えたわ。
  - speaker: tsumugi
    emotion: normal
    text: 今は、星の数を競う記録が部門ごとに分かれてるのよ。
  - speaker: zundamon
    emotion: happy
    text: 星の数で、メーカー同士が殴り合ってるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 競い合ってる、ね。
    se: tsukkomi
- id: ch14_gendai
  title: 14の国と地域へ
  background: mg_gendai
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: '[日本|にほん]で今動いているプラネタリウムは、298か所。'
  - speaker: tsumugi
    emotion: normal
    text: 世界最大のドームも、名古屋の科学館にあるの。直径35メートルよ。
  - speaker: zundamon
    emotion: surprised
    text: プラネタリウム大国なのだ！
  - speaker: tsumugi
    emotion: normal
    text: 2022年には、横浜の科学館に約12億個の星を映す機械が入ったわ。
  - speaker: tsumugi
    emotion: normal
    text: 2023年には、その横浜の機械が星の数でギネス世界記録になったの。
  - speaker: zundamon
    emotion: surprised
    text: 12億個……もう数える気にもならないのだ。
  - speaker: tsumugi
    emotion: normal
    text: メガスターは14の国と地域で、47以上の施設に入ってるわ。
  - speaker: tsumugi
    emotion: normal
    text: 2026年の6月には、福岡でプラネタリウムの国際会議が開かれたの。
  - speaker: zundamon
    emotion: happy
    text: 大阪とロンドンで発表した会議が、また[日本|にほん]に来たんだね。
  - speaker: tsumugi
    emotion: happy
    text: 大平さんが、大事にしている言葉があるの。
  - speaker: tsumugi
    emotion: normal
    text: 人間は可能は証明できるが、不可能は証明できない。
  - speaker: zundamon
    emotion: happy
    text: 個人には無理って言われた星空が、7畳の部屋から世界に出たんだね。
- id: shime
  title: ''
  background: mg_beranda2
  bgm: haru_kitchen
  stage:
