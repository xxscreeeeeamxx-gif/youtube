  - speaker: zundamon
    emotion: happy
    text: 夕焼けの空に、消えていったのだ……！
  - speaker: reimu
    text: 13歳で、初めての打ち上げに成功しました。
    reading: じゅうさんさいで、はじめての うちあげに せいこう しました。
- id: card1986
  title: ''
  background: mg_card_1986
  cuts:
  - speaker: reimu
    text: 1986年。物理部の天文班にいた高校生の大平は、ハレー彗星を見にオーストラリアへ向かいます。
    reading: せんきゅうひゃく はちじゅうろくねん。ぶつりぶの てんもんはんに いた こうこうせいの おおひらわ、はれー すいせいお みに おーすとらりあえ むかいます。
- id: ch2_amanogawa
