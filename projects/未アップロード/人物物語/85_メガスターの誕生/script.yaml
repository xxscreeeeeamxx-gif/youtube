scenes:
- id: co_london
  title: ''
  background: mg_london
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, emotion: happy}
  - {who: gaikoku, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: 1998年6月のロンドン。プラネタリウムの国際会議の前夜、日本の若い会社員が星の数を話していました。
    reading: せんきゅうひゃく きゅうじゅうはちねん ろくがつの ろんどん。ぷらねたりうむの こくさい かいぎの ぜんや、にほんの わかい かいしゃいんが ほしの かずお はなして いました。
  - speaker: gaikoku
    emotion: happy
    text: やあ、[日本|にほん]から来たのかい。明日は何を発表するんだい？
  - speaker: zundamon
    emotion: happy
    text: 持ち運べるプラネタリウムです。星は、100万個です。
  - speaker: gaikoku
    emotion: surprised
    text: ……ソーリー、パードン？
  - speaker: zundamon
    emotion: normal
    text: 100万個。ワン、ミリオンです。
  - speaker: gaikoku
    emotion: thinking
    text: ……それ、桁の間違いだろう？ ワン、サウザンドだね。
    se: don
  - speaker: zundamon
    emotion: sad
    text: ……いえ。本当に、100万個なんです。
  - speaker: reimu
    text: この男は、大平貴之。7畳の自室で作った、のちのメガスターは翌日150万個の星を映しました。
    reading: この おとこわ おおひら たかゆき。ななじょうの じしつで つくった、のちの めがすたーわ よくじつ ひゃくごじゅうまんこの ほしお うつしました。
  - speaker: reimu
    text: それまでのプラネタリウムの星は、多いものでも3万個ほどでした。
    reading: それまでの ぷらねたりうむの ほしわ、おおい ものでも さんまんこほどでした。
- id: hook
  title: ''
  background: mg_beranda
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、星を数えるのだ。ひとつ……ふたつ……。
  - speaker: zundamon
    emotion: thinking
    text: ……みっつ。もう終わったのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 東京じゃ、それが限界ね。
  - speaker: zundamon
    emotion: happy
    text: 都会の星は、少数精鋭なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 物は言いようね。
    beat: true
  - speaker: tsumugi
    emotion: normal
    text: でも150万個の星を、7畳の部屋で作った会社員がいたのよ。
  - speaker: zundamon
    emotion: surprised
    text: 7畳で150万個！？ どうやって作ったの？
    telops:
    - {text: 7畳の部屋で150万個の星？, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、天井に貼った紙の星よ。
- id: card1970
  title: ''
  background: mg_card_1970
  cuts:
  - speaker: reimu
    text: 1970年。神奈川県の川崎市で、大平貴之が生まれます。
    reading: せんきゅうひゃく ななじゅうねん。かながわけんの かわさきしで、おおひら たかゆきが うまれます。
- id: ch1_yakou
  title: 天井の星座
  background: mg_heya70
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, scale: 0.8, emotion: happy}
  - {who: kinjo, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 小学生の大平は実験や工作に夢中で、7畳の自室は実験室のようになっていました。
    reading: しょうがくせいの おおひらわ じっけんや こうさくに むちゅうで、ななじょうの じしつわ じっけんしつの ように なって いました。
  - speaker: kinjo
    emotion: normal
    text: '[貴之|たかゆき]くん、見せたい物って何？ 天井に、紙の丸が貼ってあるけど。'
  - speaker: zundamon
    emotion: happy
    text: 暗い所で光る塗料を、紙に塗ったのだ。星座の形に貼ったんだよ。
  - speaker: kinjo
    emotion: thinking
    text: 昼間に見ると、ただの紙の丸ね。
  - speaker: zundamon
    emotion: happy
    text: 電気を消してみて。
  - speaker: kinjo
    emotion: surprised
    text: あらっ、天井に星空が！
    background: mg_heya70d
    se: jaan
  - speaker: zundamon
    emotion: happy
    text: あれがオリオン座。こっちが、冬の大三角だよ。
  - speaker: kinjo
    emotion: happy
    text: 解説までつくのね。今度、うちの子も連れてくるわ。
  - speaker: reimu
    text: 見た人が喜んでくれたのがうれしかったと、本人は振り返っています。
    reading: みた ひとが よろこんで くれたのが うれしかったと、ほんにんわ ふりかえって います。
  - speaker: zundamon
    emotion: normal
    text: 次は、紙のドームに穴をあけて電球で映すんだ。
  - speaker: zundamon
    emotion: sad
    text: ……ぼやけて、星に見えないのだ。
  - speaker: kinjo
    emotion: thinking
    text: 光が、にじんじゃってるわね。
  - speaker: zundamon
    emotion: happy
    text: 本の付録の型紙で作ったら、ぼんやりだけど映ったよ！
  - speaker: zundamon
    emotion: happy
    text: 型紙を3倍に大きくしたら、もっとくっきりしたのだ。
  - speaker: kinjo
    emotion: thinking
    text: 星はくっきり。……そのぶん、部屋はどんどん狭くなるわね。
    beat: true
  - speaker: reimu
    text: 小さな穴から光を漏らす、ピンホール式と呼ばれるプラネタリウムです。
    reading: ちいさな あなから ひかりお もらす、ぴんほーるしきと よばれる ぷらねたりうむです。
- id: ch1_kagakukan
  title: 科学館の少年
  background: mg_kagakukan
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, scale: 0.8, emotion: normal}
  - {who: shokuin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 近くの川崎市青少年科学館では、プラネタリウムを見ることができました。
    reading: ちかくの かわさきし せいしょうねん かがくかんでわ、ぷらねたりうむお みる ことが できました。
  - speaker: shokuin
    emotion: happy
    text: また来たのかい。今日も、星を見に来たんだね。
  - speaker: zundamon
    emotion: happy
    text: 星もだけど、この機械が見たいんです。
  - speaker: zundamon
    emotion: normal
    text: '[中|なか]の電球は、[何|なん]ワットですか？ モーターは、いくつ入ってますか？'
  - speaker: shokuin
    emotion: surprised
    text: 星座じゃなくて、モーターの質問かい。
  - speaker: zundamon
    emotion: normal
    text: 夕焼けは、どうやって映してるんですか？
  - speaker: shokuin
    emotion: thinking
    text: ……新人の解説員より、質問が細かいね。
    beat: true
  - speaker: shokuin
    emotion: happy
    text: じゃあ、この解説台のダイヤルを回してごらん。
  - speaker: zundamon
    emotion: surprised
    text: 星が、動いた……！
- id: ch1_lens
  title: 電話帳のレンズ会社
  background: mg_heya70
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, scale: 0.85, emotion: normal}
  - {who: lens, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 小学6年。大平は、レンズで映すプラネタリウムの設計図を描きます。
    reading: しょうがく ろくねん。おおひらわ、れんずで うつす ぷらねたりうむの せっけいずお かきます。
  - speaker: zundamon
    emotion: normal
    text: レンズが要るのだ。電話帳で、レンズの会社を探そう。
  - speaker: lens
    emotion: normal
    text: はい、こちら営業部ですが……。
  - speaker: zundamon
    emotion: happy
    text: プラネタリウムを作るので、レンズを分けてください！
  - speaker: lens
    emotion: surprised
    text: '……[君|きみ]、小学生かい？'
  - speaker: lens
    emotion: thinking
    text: 悪いけどね、子どもの工作に出すレンズはないよ。
  - speaker: zundamon
    emotion: normal
    text: 分かりました。次の会社にかけます。
  - speaker: lens
    emotion: surprised
    text: ……つ、次？ もしもし？
    beat: true
  - speaker: zundamon
    emotion: happy
    text: ひとつダメでも、次に行けばいい。断られても、損はしないのだ。
  - speaker: reimu
    text: 片っ端から電話をかけると、ある工場の人がレンズをタダで分けてくれました。
    reading: かたっぱしから でんわお かけると、ある こうじょうの ひとが れんずお ただで わけて くれました。
  - speaker: zundamon
    emotion: sad
    text: ……レンズはもらえたけど、うまく映らないのだ。
- id: ch1_renji
  title: 電子レンジの自由研究
  background: mg_heya70
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, scale: 0.85, emotion: happy}
  - {who: soudan, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 夏休みの自由研究は、電子レンジを作るのだ。
  - speaker: zundamon
    emotion: normal
    text: 作り方は、メーカーに聞いてみよう。
  - speaker: soudan
    emotion: normal
    text: はい、お客様相談室でございます。
  - speaker: zundamon
    emotion: happy
    text: 電子レンジを、自分で作りたいんです。部品は、どこで買えますか？
  - speaker: soudan
    emotion: surprised
    text: ……作る？ 電子レンジを、ですか？
    se: bikkuri
  - speaker: soudan
    emotion: thinking
    text: 失礼ですが、何にお使いで？
  - speaker: zundamon
    emotion: normal
    text: 夏休みの、自由研究です。
  - speaker: soudan
    emotion: angry
    text: 危険ですから、絶対にやめてください！
  - speaker: zundamon
    emotion: sad
