meta:
  title: 【メガスターの誕生】「個人には無理」と言われ、7畳で作った星150万個【ずんだもん解説】
  slug: ohira-megastar-v2
  summary: ドームの天井に夜空を映す、プラネタリウム。1970年に川崎で生まれた大平貴之は、天井に光る紙の星を貼り、レンズの会社に片っ端から電話をかけ、高校の卒業式の日には校庭でロケットを飛ばしました。「個人には無理」と言われたレンズ式のプラネタリウムに挑んだ若者は、会社員になってから実家の7畳の部屋で何を作ったのか。ロンドンの国際会議で聞き返された星の数の正体を、再現ドラマでたどります。
  tags:
  - プラネタリウム
  - メガスター
  - 大平貴之
  - 星空
  - 天の川
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 雑学
  - ものづくり
  thumbnail:
    top: 7畳で作った星空
    bottom: メガスターの誕生
  mode: drama
  narrator: reimu
