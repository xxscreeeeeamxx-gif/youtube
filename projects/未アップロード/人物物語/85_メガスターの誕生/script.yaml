- id: ch1_rocket
  title: 夕焼けのロケット
  background: mg_kawara
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, scale: 0.85, emotion: normal}
  - {who: doukyu, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 中学生になると、手作りのロケットに挑みます。火薬の調合に苦しみ、何百回も失敗しました。
    reading: ちゅうがくせいに なると、てづくりの ろけっとに いどみます。かやくの ちょうごうに くるしみ、なんびゃっかいも しっぱい しました。
  - speaker: doukyu
    emotion: thinking
    text: 大平、これで何回目だよ。
  - speaker: zundamon
    emotion: normal
    text: 何百回目か、もう数えてない。
  - speaker: doukyu
    emotion: surprised
    text: 何百回！？ ……オレ、そのうち百回は付き合わされてるぞ。
  - speaker: doukyu
    emotion: angry
    text: 今日こそ飛ばなかったら、オレは帰るからな。
  - speaker: doukyu
    emotion: thinking
    text: ……って、先週も言ったけどな。
    beat: true
  - speaker: zundamon
    emotion: normal
    text: 火薬の混ぜ方を、また変えた。……3……2……1……！
- id: ch1_rocket2
  title: ''
  background: mg_kawara2
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, scale: 0.85, emotion: happy}
  - {who: doukyu, x: 0.7, emotion: surprised}
