  background: mg_australia
  bgm: amacha_hoshizora
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 大平貴之, scale: 0.9, emotion: surprised}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: ……空が、星で埋まってる。
  - speaker: zundamon
    emotion: surprised
    text: 天の川って、こんなにすごいのか……。
  - speaker: reimu
    text: 南半球で見た天の川の迫力が、のちの開発の原動力になったと本人は語っています。
    reading: みなみはんきゅうで みた あまのがわの はくりょくが、のちの かいはつの げんどうりょくに なったと ほんにんわ かたって います。
- id: ch2_bunkasai
