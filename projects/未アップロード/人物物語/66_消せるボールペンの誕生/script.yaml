meta:
  title: 【消せるボールペンの誕生】紅葉を見て作った「色が変わるインク」が、30年後にボールペンになった【ずんだもん解説】
  slug: frixion-metamo
  summary: こすると消えるボールペンのインクは、もともと筆記具のために作られたものではありませんでした。1970年の秋、渓谷の紅葉を見たパイロットの研究者・中筋憲一は、一夜で色が変わる葉のように、温度で色が変わるインクを試験管の中で作ろうとします。社内で「筆記具には使えない」と言われたインクは、どこで生き延び、どうやってボールペンになったのか。温度で色が変わる仕組みとあわせて、再現ドラマでたどります。
  tags:
  - フリクション
  - 消せるボールペン
  - パイロット
  - メタモカラー
  - 文房具
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 化学
  - 雑学
  thumbnail:
    top: 紅葉から30年
    bottom: 消せるボールペンの誕生
  mode: drama
  narrator: reimu
  mobs:
  - id: sensei
    label: 平林先生
    voice: 42
    pitch: 0.0
  - id: senpai
    label: 先輩
    voice: 13
    pitch: 0.06
  - id: buchou
    label: 開発部長
    voice: 42
    pitch: 0.04
  - id: douryou
    label: 同僚
    voice: 12
    pitch: 0.1
  - id: eigyou
    label: 先輩社員
    voice: 13
    pitch: -0.04
  - id: oushu
    label: 欧州担当
    voice: 13
    pitch: 0.1
  - id: shain
    label: 開発責任者
    voice: 12
    pitch: 0.08
  - id: eigyou2
    label: 営業担当
    voice: 13
    pitch: 0.1
  - id: tenin
    label: 店員
    voice: 8
    pitch: 0.1
  - id: kenkyu1
    label: 研究員
    voice: 12
