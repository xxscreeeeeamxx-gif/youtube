    text: 今では、蛍光ペンや色鉛筆、スタンプまで、約40の商品に広がったわ。
  - speaker: tsumugi
    emotion: normal
    text: 2022年には、濃い色で書ける、ノックゾーンも出たわ。
  - speaker: tsumugi
    emotion: normal
    text: 2024年には、ボールの直径が0.3ミリの、一番細いものも出てるの。
  - speaker: zundamon
    emotion: happy
    text: 手帳の小さな欄にも、書き込めるのだ。
  - speaker: tsumugi
    emotion: normal
    text: 2025年の末までに、世界で50億本。100を超える国と地域で売られてるわ。
  - speaker: zundamon
    emotion: surprised
    text: 地球の人の、半分以上に1本ずつなのだ！
  - speaker: tsumugi
    emotion: normal
    text: 千賀さんたちは、摩擦の熱で字を消すペンの発明で、全国発明表彰を受けたの。
  - speaker: tsumugi
    emotion: normal
    text: 中筋さんは、パイロットインキの社長や会長を務めて、2016年に退いているわ。
  - speaker: tsumugi
    emotion: normal
    text: その後も、母校の大学などで、自分の研究の話をしているの。
  - speaker: zundamon
    emotion: thinking
    text: 紅葉の話も、しているのだ？
  - speaker: tsumugi
    emotion: happy
    text: この鮮やかな色変化を試験管の中で創りたい。講演の紹介には、そう書かれていたわ。
  - speaker: tsumugi
    emotion: normal
    text: 産みの苦しみの期間の方が長くて、ここまでの成功は想像もしていなかった、と語ってるの。
  - speaker: zundamon
    emotion: thinking
    text: 紅葉を見てから、ボールペンになるまで、30年以上なのだ。
  - speaker: tsumugi
    emotion: happy
    text: 人は好きなことは続けられるし、その気になれば[何|なん]でもできる。中筋さんの言葉よ。
