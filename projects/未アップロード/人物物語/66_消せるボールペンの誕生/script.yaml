scenes:
- id: hook
  title: ''
  background: fx_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: つむぎ、大変なのだ！ ノートの字が、全部消えてる！
  - speaker: tsumugi
    emotion: thinking
    text: どこに置いてたの？
  - speaker: zundamon
    emotion: sad
    text: 夏の車の中なのだ。ダッシュボードの上。
  - speaker: tsumugi
    emotion: normal
    text: それ、消せるボールペンで書いたでしょ。熱くなると、色が消えちゃうの。
  - speaker: zundamon
    emotion: happy
    text: じゃあ、テストの答案も、車に置いておけば白紙に……。
  - speaker: tsumugi
    emotion: thinking
    text: 答案は、消せるボールペンで書いちゃだめよ。
  - speaker: tsumugi
    emotion: normal
    text: 大丈夫。冷凍庫で冷やせば、字は戻ってくるから。
  - speaker: zundamon
    emotion: happy
    text: 本当なのだ！ ノートを、アイスの横に入れてくるぞ。
  - speaker: zundamon
    emotion: surprised
    text: 一晩たったら、戻ったのだ。こすって消した落書きまで、うっすら出てきた。
    se: oti
  - speaker: tsumugi
    emotion: thinking
    text: 何を書いてたのよ。
  - speaker: zundamon
    emotion: thinking
    text: ……ひみつなのだ。
  - speaker: zundamon
    emotion: thinking
    text: それより、消えた字が、どうして冷やすと戻るのだ？
  - speaker: reimu
    text: 消せるボールペン、フリクション。シリーズの累計は、世界で50億本を超えました。
    reading: けせる ぼーるぺん ふりくしょん。しりーずの るいけいわ せかいで ごじゅうおくほんお こえました。
  - speaker: tsumugi
    emotion: normal
    text: 実はこのインク、もとはボールペンのために作られたものじゃないの。
  - speaker: zundamon
    emotion: surprised
    text: えっ、じゃあ、[何|なん]のためなのだ？
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、1970年の秋。紅葉を見た、一人の研究者よ。
  - speaker: zundamon
    emotion: thinking
    text: 紅葉と、ボールペン……？
- id: ch1_yokkaichi
  title: コンビナートの光
  background: fx_kombinat
  bgm: warm
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, scale: 0.9, emotion: normal}
  cuts:
  - speaker: reimu
    text: 中筋憲一は、三重県四日市市の出身です。
    reading: なかすじ のりかずわ みえけん よっかいちしの しゅっしんです。
  - speaker: reimu
    text: 高校生のころ、町では、石油化学コンビナートの建設が進んでいました。
    reading: こうこうせいの ころ まちでわ、せきゆかがく こんびなーとの けんせつが すすんで いました。
  - speaker: zundamon
    emotion: surprised
    text: パイプとタンクが、どこまでも並んでるのだ。
  - speaker: zundamon
    emotion: happy
    text: きれいだ……。ぼく、化学を勉強したいのだ。
  - speaker: reimu
    text: コンビナートの美しさに惹かれて、化学を学ぼうと思った、と本人は語っています。
    reading: こんびなーとの うつくしさに ひかれて、かがくお まなぼうと おもったと ほんにんわ かたって います。
- id: ch1_akahon
  title: 赤本の一文
  background: fx_heya2
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, scale: 0.9, emotion: normal}
  cuts:
  - speaker: reimu
    text: 大学選びの決め手は、受験の参考書、いわゆる赤本にあった一文でした。
    reading: だいがく えらびの きめてわ、じゅけんの さんこうしょ いわゆる あかほんに あった いちぶんでした。
  - speaker: zundamon
    emotion: thinking
    text: 大学から[金華山|きんかざん]が見え、その裾には長良川の清流が……。
  - speaker: zundamon
    emotion: happy
    text: きれいな所なのだ。この大学に決めた！
  - speaker: reimu
    text: この記述に惹かれて岐阜大学に進んだ、と本人は明かしています。
    reading: この きじゅつに ひかれて ぎふ だいがくに すすんだと ほんにんわ あかして います。
- id: ch1_daigaku
  title: ビーカーの外側
  background: fx_daigaku
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, emotion: normal}
  - {who: sensei, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 工学部で化学を学び、卒業論文は、平林先生のもとで書きました。
    reading: こうがくぶで かがくお まなび そつぎょう ろんぶんわ ひらばやし せんせいの もとで かきました。
  - speaker: zundamon
    emotion: happy
    text: 先生、実験が終わったので、ビーカーを洗ったのだ。
  - speaker: sensei
    emotion: thinking
    text: 実験で使ったビーカーは、内側だけでなく、外側もしっかり洗うように。
  - speaker: zundamon
    emotion: surprised
    text: 外側も、なのだ？
  - speaker: sensei
    emotion: normal
    text: 外側もだ。
  - speaker: zundamon
    emotion: thinking
    text: ……分かったのだ。
  - speaker: reimu
    text: 実験のいろはを徹底的に教わった、と本人は振り返っています。
    reading: じっけんの いろはお てっていてきに おそわったと ほんにんわ ふりかえって います。
  - speaker: sensei
    emotion: happy
    text: 君の研究に立ち向かう姿勢は、間違っていない。自信を持ってやりなさい。
  - speaker: reimu
    text: 卒業のとき、先生からかけられた言葉です。
    reading: そつぎょうの とき せんせいから かけられた ことばです。
- id: card1966
  title: ''
  background: fx_card_1966
  cuts:
  - speaker: reimu
    text: 1966年。中筋は、パイロットインキに入社します。
    reading: せんきゅうひゃく ろくじゅうろくねん。なかすじわ ぱいろっといんきに にゅうしゃ します。
- id: ch1_nyusha
  title: 傍流の研究室
  background: fx_kenkyu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, emotion: normal}
  - {who: senpai, x: 0.7, emotion: normal}
  cuts:
  - speaker: senpai
    emotion: normal
    text: 中筋くん、うちは筆記具の会社だが、この部署の担当は、本業から外れた物ばかりだ。
  - speaker: zundamon
    emotion: surprised
    text: ボールペンのインクじゃ、ないのだ？
  - speaker: senpai
    emotion: sad
    text: 本業の部署のような人も、予算も、設備もない。
  - speaker: zundamon
    emotion: thinking
    text: 人も予算も、ないのだ……。
  - speaker: reimu
    text: 担当は傍流のものばかりで、人も予算も設備もなかった、と本人は振り返っています。
    reading: たんとうわ ぼうりゅうの ものばかりで、ひとも よさんも せつびも なかったと ほんにんわ ふりかえって います。
- id: card1970
  title: ''
  background: fx_card_1970
  cuts:
  - speaker: reimu
    text: 1970年の秋。中筋は、渓谷で見事な紅葉を目にします。
    reading: せんきゅうひゃく ななじゅうねんの あき。なかすじわ けいこくで みごとな こうようお めに します。
- id: ch2_kouyou
  title: 一夜で変わる色
  background: fx_kouyou
  bgm: warm
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, emotion: surprised}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 真っ赤だ……。少し前まで、緑だった葉なのだ。
  - speaker: zundamon
    emotion: thinking
    text: 緑の葉が、一夜で紅葉に変わる。
  - speaker: zundamon
    emotion: happy
    text: この色の変わり方を、試験管の中で作れないのだ？
  - speaker: reimu
    text: これがメタモカラーの出発点だった、と本人は明かしています。
    reading: これが めたもからーの しゅっぱつてんだったと ほんにんわ あかして います。
- id: ch2_kenkyu
  title: 上司の一言
  background: fx_kenkyu2
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, emotion: thinking}
  - {who: buchou, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 研究は、うまく進みませんでした。
    reading: けんきゅうわ うまく すすみませんでした。
  - speaker: zundamon
    emotion: sad
    text: 今日も、色は変わらなかった……。
  - speaker: zundamon
    emotion: thinking
    text: 組み合わせを変えて、もう一回なのだ。
  - speaker: reimu
    text: 毎日遅くまで研究しても、成果の出ない日が続きました。
    reading: まいにち おそくまで けんきゅう しても せいかの でない ひが つづきました。
  - speaker: buchou
    emotion: normal
    text: 中筋くん、まだ残ってたのか。
  - speaker: zundamon
    emotion: sad
    text: 部長……。すみません、まだ成果が出ていないのだ。
  - speaker: buchou
    emotion: happy
    text: もうそろそろ大きな仕事をしていい頃だな。
  - speaker: zundamon
    emotion: surprised
    text: ……大きな仕事。よし、やるぞ！
  - speaker: reimu
    text: 当時27歳。取締役開発部長のこの一言を、本人は転機に挙げています。
    reading: とうじ にじゅうななさい。とりしまりやく かいはつぶちょうの この ひとことお ほんにんわ てんきに あげて います。
- id: ch2_hakken
  title: 熱で変わる色
  background: fx_kenkyu2
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, emotion: normal}
  - {who: douryou, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: その1か月後。熱で色が変わる組み合わせが、見つかります。
    reading: その いっかげつご。ねつで いろが かわる くみあわせが みつかります。
  - speaker: zundamon
    emotion: surprised
    text: 温めたら……色が変わったのだ。
  - speaker: douryou
    emotion: surprised
    text: 本当だ。[冷ます|さます]と、元の色に戻りますね。
  - speaker: zundamon
    emotion: happy
    text: 試験管の中で、紅葉が起きたぞ！
  - speaker: reimu
    text: パイロットの記録では、着想から約1年での発見でした。
    reading: ぱいろっとの きろくでわ ちゃくそうから やく いちねんでの はっけんでした。
  - speaker: reimu
    text: アメリカの特許には、発明者として、中筋を含む4人の名前が並んでいます。
    reading: あめりかの とっきょにわ はつめいしゃとして、なかすじお ふくむ よにんの なまえが ならんで います。
  - speaker: reimu
    text: 日本では1972年に特許を出願し、1975年に特許を取りました。
    reading: にほんでわ せんきゅうひゃく ななじゅうにねんに とっきょお しゅつがんし せんきゅうひゃく ななじゅうごねんに とっきょお とりました。
  - speaker: reimu
    text: 名前は、変身を意味するメタモルフォーゼから取って、メタモカラーとなりました。
    reading: なまえわ へんしんお いみする めたもるふぉーぜから とって、めたもからーと なりました。
- id: ch2_hantai
  title: 筆記具には使えない
  background: fx_kaigi
  bgm: mystery
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, emotion: normal}
  - {who: eigyou, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 温度で色が変わるインクなのだ。ボールペンに使えないのだ？
  - speaker: eigyou
    emotion: thinking
    text: インクというのは、一度書いたら、何年たっても色が変わらないのが良いんだよ。
  - speaker: eigyou
    emotion: normal
    text: 色が変わる字なんて、筆記具では使えないね。
  - speaker: zundamon
    emotion: thinking
    text: 書いた字が変わったら、困る人がいるのだ？
  - speaker: eigyou
    emotion: thinking
    text: 契約書の字の色が、暑い日に変わったら、大騒ぎだよ。
  - speaker: reimu
    text: 社内では、主力事業の筆記具には応用できないと言われた、と本人は語っています。
    reading: しゃないでわ しゅりょく じぎょうの ひっきぐにわ おうよう できないと いわれたと ほんにんわ かたって います。
  - speaker: zundamon
    emotion: normal
    text: だったら、筆記具じゃない所で使ってもらうのだ。
- id: card1976
  title: ''
  background: fx_card_1976
  cuts:
  - speaker: reimu
    text: 1976年。メタモカラーを使った、最初の商品が生まれます。
    reading: せんきゅうひゃく ななじゅうろくねん。めたもからーお つかった さいしょの しょうひんが うまれます。
- id: ch3_cup
  title: 魔法のコップ
  background: fx_shouhin
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, emotion: normal}
  - {who: douryou, x: 0.7, emotion: normal}
  cuts:
  - speaker: douryou
    emotion: happy
    text: 冷たい水を入れると、色が変わる紙コップ。名前は、魔法のコップです。
  - speaker: zundamon
    emotion: happy
    text: 子どもが、びっくりするのだ。
  - speaker: reimu
    text: その後も、グラスや人形など、さまざまな商品が作られていきます。
    reading: その ごも ぐらすや にんぎょうなど、さまざまな しょうひんが つくられて いきます。
- id: ch3_keiyaku
  title: 契約も自分たちで
  background: fx_kaigi
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, emotion: normal}
  - {who: douryou, x: 0.7, emotion: normal}
  cuts:
  - speaker: douryou
    emotion: thinking
    text: 中筋さん、売り込みも契約の交渉も、うちでやるんですよね。
  - speaker: zundamon
    emotion: normal
    text: うちの食い扶持は、自分たちで稼ぐのだ。
  - speaker: douryou
    emotion: surprised
    text: 特許の裁判まで、自分たちでやるんですか。
  - speaker: zundamon
    emotion: normal
    text: ……全部やるのだ。
  - speaker: reimu
    text: 市場開拓や契約交渉、さらには特許訴訟まで全てやった、と本人は語っています。
    reading: しじょう かいたくや けいやく こうしょう、さらにわ とっきょ そしょうまで すべて やったと ほんにんわ かたって います。
  - speaker: reimu
    text: 1980年代には、アメリカのメーカーと組んで、グラスなどの商品が作られています。
    reading: せんきゅうひゃく はちじゅうねんだいにわ、あめりかの めーかーと くんで ぐらすなどの しょうひんが つくられて います。
  - speaker: reimu
    text: 傍流の荒波が、自分たちを成長させてくれた、とも振り返っています。
    reading: ぼうりゅうの あらなみが じぶんたちお せいちょう させて くれたとも ふりかえって います。
- id: ch3_omocha
  title: 冷水で揚げるエビフライ
  background: fx_shouhin2
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: メタモカラーは、おもちゃの世界でも活躍したの。
  - speaker: tsumugi
    emotion: normal
    text: 1985年には、パイロット初のおもちゃが出たわ。
  - speaker: tsumugi
    emotion: normal
    text: 冷たい水の鍋に、白いエビフライを入れると、こんがり色になるの。
  - speaker: zundamon
    emotion: surprised
    text: 冷たい水で、揚げるのだ？
  - speaker: tsumugi
    emotion: happy
    text: 冷やすと色が出るインクを、使ってるのよ。
  - speaker: tsumugi
    emotion: normal
    text: アメリカのおもちゃの会社とは、お化粧できる人形も作ったの。
  - speaker: tsumugi
    emotion: normal
    text: 1992年には、36度以上のお湯で、髪の色が変わるお人形も出たわ。
  - speaker: zundamon
    emotion: happy
    text: お風呂に入れると、髪の色が変わるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: どれも、ボールペンとは関係のない所で、インクの技術が磨かれていったの。
  - speaker: zundamon
    emotion: thinking
    text: 本業じゃない所で、力をつけていったのだ。
- id: ch3_memory
  title: 色を覚えておくインク
  background: fx_zukai0
  bgm: pop
  motion: none
  stage:
  - {who: zundamon, x: 0.14, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.86, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 最初のメタモカラーは、温めて色が変わっても、少し冷めるとすぐ戻ったの。
  - speaker: zundamon
    emotion: thinking
    text: 変わる温度と戻る温度が、とても近いのだ？
  - speaker: tsumugi
    emotion: normal
    text: そう。差はわずか数度で、境目もあいまいだったそうよ。
  - speaker: zundamon
    emotion: happy
    text: ぼくの反省みたいに、すぐ元に戻るのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 自分で言わないの。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: 1988年に、変わった色をそのまま保てるメモリータイプができたの。
  - speaker: tsumugi
    emotion: normal
    text: 約20度の幅の中なら、一度変わった色が、そのままになるのよ。
  - speaker: zundamon
    emotion: surprised
    text: 温めて消したら、少し冷めても、消えたままなのだ？
