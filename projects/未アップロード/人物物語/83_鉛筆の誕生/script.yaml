meta:
  title: 【鉛筆の誕生】財閥より先に「三菱」を登録した男が、独学で作った国産の鉛筆【ずんだもん解説】
  slug: masaki-pencil-v2
  summary: 鉛筆の軸に並ぶ、三つのひし形。三菱鉛筆は、三菱グループの会社ではありません。明治11年、パリ万博の会場の片すみで初めて鉛筆を見た、佐賀藩士の子の眞崎仁六。持ち帰った手がかりは、黒鉛と粘土を混ぜて芯を作るという一言だけでした。崩れる芯、雨漏りのする竹やぶの水車小屋、削れない棒っきれだと突き返す問屋。師匠のいない鉛筆づくりを、再現ドラマでたどります。
  tags:
  - 鉛筆
  - 三菱鉛筆
  - 眞崎仁六
  - 三菱マーク
  - 文房具
  - 明治
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  thumbnail:
    top: 財閥より先に三菱
    bottom: 鉛筆の誕生
  mode: drama
  narrator: reimu
