  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 今の芯も、黒鉛と粘土を混ぜて焼いて作るの。
  - speaker: zundamon
    emotion: thinking
    text: そもそも、なんで黒鉛は紙に黒く残るの？
  - speaker: tsumugi
    emotion: normal
    text: 黒鉛は、炭素のうすい層が何枚も重なってできてるの。
  - speaker: tsumugi
    emotion: normal
    text: 層どうしのつながりが弱いから、こすると層がはがれて紙に残るのよ。
  - speaker: zundamon
    emotion: happy
    text: トランプの山を、ずらして配る感じか。
  - speaker: tsumugi
    emotion: happy
    text: そう。配ったカードが、線になるの。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、粘土は何をしてるの？
  - speaker: tsumugi
    emotion: normal
    text: 焼くと固まって、黒鉛の粒をつなぐ骨組みになるの。
  - speaker: tsumugi
    emotion: normal
    text: 黒鉛が多いほど黒くて柔らかい。粘土が多いほど、硬くて薄くなるわ。
  - speaker: tsumugi
    emotion: normal
    text: HBなら、黒鉛と粘土はおよそ7対3よ。
    telops:
    - {text: HB＝黒鉛7：粘土3, size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 仁六さんの崩れた芯は、骨組みが足りなかったのか。
  - speaker: tsumugi
    emotion: normal
    text: 最後は1000度から1200度で焼いて、熱い油をしみこませるの。
  - speaker: zundamon
    emotion: thinking
    text: 焼いたのに、わざわざ油？
  - speaker: tsumugi
    emotion: normal
    text: 焼いた芯には、細かいすき間がたくさんあるの。
  - speaker: tsumugi
    emotion: normal
    text: そこに油が入ると、紙の上でなめらかに滑るのよ。
  - speaker: zundamon
    emotion: happy
    text: 料理の、レシピみたいだね。
  - speaker: tsumugi
    emotion: thinking
    text: 仁六さんは、そのレシピを誰にも教わらずに探したのよ。
