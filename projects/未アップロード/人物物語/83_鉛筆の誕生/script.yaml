scenes:
- id: co_tonya
  title: ''
  background: pc_nihonbashi
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 眞崎仁六, emotion: normal}
  - {who: tonya, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 明治の半ばの東京で、ある男が自分で作った鉛筆を問屋に売り込んでいました。
    reading: めいじの なかばの とうきょうで、ある おとこが じぶんで つくった えんぴつお とんやに うりこんで いました。
  - speaker: tonya
    emotion: thinking
    text: 鉛筆ってのは、ドイツから来るもんだ。国産なんざ、聞いたこともねえ。
  - speaker: zundamon
    emotion: normal
    text: '[日本|にほん]で作ったんです。一度だけ、削ってみてください。'
  - speaker: tonya
    emotion: thinking
    text: ……なんだい、こりゃ。削るそばから、芯がぽきぽき折れやがる。
  - speaker: zundamon
    emotion: surprised
    text: そ、それは削り方が……
  - speaker: tonya
    emotion: angry
    text: 削れねえ鉛筆なんざ、ただの棒っきれだ。
    se: don
  - speaker: zundamon
    emotion: sad
    text: ……棒っきれ、なのだ。
  - speaker: reimu
    text: この男は、眞崎仁六。三菱の名前とマークを、財閥より11年早く登録します。
    reading: この おとこわ まさき にろく。みつびしの なまえと まーくお、ざいばつより じゅういちねん はやく とうろく します。
- id: hook
  title: ''
  background: pc_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: ロケットを作る会社の鉛筆なら、答えも勝手に書けるはずだ！
  - speaker: tsumugi
    emotion: thinking
    text: 三菱鉛筆は、三菱グループの会社じゃないわよ。
  - speaker: zundamon
    emotion: surprised
    text: ……じゃあ、ロケットは？
  - speaker: tsumugi
    emotion: thinking
    text: 飛ぶのは、削りかすくらいね。
    beat: true
  - speaker: zundamon
    emotion: thinking
    text: 鉛筆屋さんが、なんで財閥より先に三菱なの？
    telops:
    - {text: なぜ鉛筆が先に「三菱」？, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 答えは、さっきの男の家紋にあるの。
- id: card1848
  title: ''
  background: pc_card_1848
  cuts:
  - speaker: reimu
    text: 1848年。今の佐賀市にあった侍の家に、眞崎仁六が生まれます。
    reading: せんはっぴゃく よんじゅうはちねん。いまの さがしに あった さむらいの いえに、まさき にろくが うまれます。
- id: ch1_nagasaki
  title: 侍の子と英語
  background: pc_zashiki
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 眞崎仁六, scale: 0.9, emotion: normal}
  - {who: chichi, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1866年、幕末の佐賀。18歳の仁六は、長崎で英語を学ぶことになります。
    reading: せんはっぴゃく ろくじゅうろくねん、ばくまつの さが。じゅうはっさいの にろくわ、ながさきで えいごお まなぶ ことに なります。
  - speaker: chichi
    emotion: thinking
    text: 仁六。長崎で、異国の言葉を習うと聞いたが。
  - speaker: zundamon
    emotion: normal
    text: はい、父上。英語です。
  - speaker: chichi
    emotion: thinking
    text: 侍の子が、異人の言葉を覚えてどうする。
  - speaker: zundamon
    emotion: happy
    text: これからは、異国と付き合う世の中になります。
  - speaker: chichi
    emotion: angry
    text: 英語とやらは、刀より役に立つのか。
  - speaker: zundamon
    emotion: thinking
    text: ……刀では、異人と話ができません。
    se: hammer
  - speaker: chichi
    emotion: surprised
    text: ……一本、取られたな。
  - speaker: chichi
    emotion: normal
    text: わしには、英語の英の字も分からん。分からんから、お前が行ってこい。
  - speaker: zundamon
    emotion: happy
    text: ありがとうございます、父上！ いつか、英語で手紙を書きます。
  - speaker: chichi
    emotion: thinking
    text: 読めんから、日本語で書け。
    beat: true
  - speaker: reimu
    text: 長崎で英語を学んだ仁六は、明治元年に東京へ出て汽船の会社の書記になります。
    reading: ながさきで えいごお まなんだ にろくわ、めいじ がんねんに とうきょうえ でて きせんの かいしゃの しょきに なります。
- id: ch1_kiritsu
  title: 佐賀弁の社長
  background: pc_kiritsu
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 眞崎仁六, emotion: normal}
  - {who: matsuo, x: 0.7, emotion: happy}
  cuts:
  - speaker: reimu
    text: やがて同じ佐賀出身の大隈重信の紹介で、起立工商会社に入ります。
    reading: やがて おなじ さが しゅっしんの おおくま しげのぶの しょうかいで、きりつ こうしょう がいしゃに はいります。
  - speaker: reimu
    text: 日本の工芸品を海外へ売る会社です。仁六は、金属工場の技師長になりました。
    reading: にほんの こうげいひんお かいがいえ うる かいしゃです。にろくわ、きんぞく こうじょうの ぎしちょうに なりました。
  - speaker: matsuo
    emotion: happy
    text: '[眞崎|まさき]さん。あんた、英語のできるとやろ？'
  - speaker: zundamon
    emotion: normal
    text: 長崎で、少し習っただけです。
  - speaker: matsuo
    emotion: happy
    text: 少しでよか。アメリカの博覧会に、行ってもらうけん。
  - speaker: zundamon
    emotion: surprised
    text: ア、アメリカですか！？
  - speaker: matsuo
    emotion: normal
    text: うちの品ば並べて、異人さんに売ってくるとよ。
  - speaker: zundamon
    emotion: thinking
    text: 英語で値段の交渉まで、できるかどうか……
  - speaker: matsuo
    emotion: happy
    text: 心配なか。値段は、指で見せればよか。
  - speaker: zundamon
    emotion: thinking
    text: ……それなら、英語は要らないのだ。
    se: manuke
  - speaker: reimu
    text: 社長の松尾儀助も、佐賀の出身でした。1876年、仁六はフィラデルフィア万博へ出張します。
    reading: しゃちょうの まつお ぎすけも、さがの しゅっしんでした。せんはっぴゃく ななじゅうろくねん、にろくわ ふぃらでるふぃあ ばんぱくえ しゅっちょう します。
- id: ch1_phila
  title: ''
  background: pc_phila
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 眞崎仁六, emotion: normal}
  - {who: kenbutsu, x: 0.7, emotion: happy}
  cuts:
  - speaker: kenbutsu
    emotion: happy
    text: この花びんは、すてきですね。おいくらですか？
  - speaker: zundamon
    emotion: thinking
    text: え、ええと……これです。
  - speaker: kenbutsu
    emotion: happy
    text: 指が3本。では、いただきます。
  - speaker: zundamon
    emotion: surprised
    text: ……本当に、指で通じたのだ。
    beat: true
  - speaker: kenbutsu
    emotion: normal
    text: 機械館は、もう見ましたか？
  - speaker: kenbutsu
    emotion: happy
    text: 大きな蒸気の機械が一つで、ほかの機械をまとめて動かしてますよ。
  - speaker: zundamon
    emotion: surprised
    text: 一つで、まとめて……！
  - speaker: zundamon
    emotion: thinking
    text: 日本では、[何|なん]でも手で作っているのに。
- id: ch1_kikoku
  title: ''
  background: pc_kiritsu
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 眞崎仁六, emotion: thinking}
  - {who: matsuo, x: 0.7, emotion: happy}
  cuts:
  - speaker: matsuo
    emotion: happy
    text: '[眞崎|まさき]さん、お帰り。アメリカは、どげんやった？'
  - speaker: zundamon
    emotion: thinking
    text: ……正直に言っても、いいですか。
  - speaker: matsuo
    emotion: happy
    text: よかよ。品物は、よう売れたろう。
  - speaker: zundamon
    emotion: happy
    text: 売り場より、機械館ばかり見ていました。
  - speaker: matsuo
    emotion: surprised
    text: ……あんた、正直すぎるばい。
    beat: true
  - speaker: zundamon
    emotion: thinking
    text: 見たこともない機械が、並んでいたんです。
- id: card1878
  title: ''
  background: pc_card_1878
  cuts:
  - speaker: reimu
    text: 1878年。パリで、万国博覧会が開かれます。
    reading: せんはっぴゃく ななじゅうはちねん。ぱりで ばんこく はくらんかいが ひらかれます。
- id: ch2_paris
  title: パリの片すみの鉛筆
  background: pc_paris
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 眞崎仁六, emotion: normal}
  - {who: kakari, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 仁六は30歳。会社の仕事で、パリへ出かけました。
    reading: にろくわ さんじゅっさい。かいしゃの しごとで ぱりえ でかけました。
  - speaker: reimu
    text: 会場の片すみに、いろいろな鉛筆が並んでいました。
    reading: かいじょうの かたすみに いろいろな えんぴつが ならんで いました。
  - speaker: zundamon
    emotion: surprised
    text: これは、[何|なん]ですか？ 筆でもないし、墨も付けていない。
  - speaker: kakari
    emotion: happy
    text: 鉛筆です。削れば、どこでもすぐに書けますよ。
  - speaker: zundamon
    emotion: thinking
    text: 墨は、どこですか。
  - speaker: kakari
    emotion: normal
    text: 要りません。
  - speaker: zundamon
    emotion: thinking
    text: 筆を洗う水は？
  - speaker: kakari
    emotion: normal
    text: 要りません。
  - speaker: zundamon
    emotion: surprised
    text: では、[硯|すずり]は！？
  - speaker: kakari
    emotion: thinking
    text: ……お客様。何も、要りません。
    se: tenten
  - speaker: zundamon
    emotion: surprised
    text: ……書けた。墨をすらなくても、すぐに書けるのだ！
    telops:
    - {text: 墨も筆も要らない, size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: これは、どこの国の鉛筆ですか。
  - speaker: kakari
    emotion: normal
    text: ドイツやイギリス、フランスの鉛筆ですね。
  - speaker: zundamon
    emotion: thinking
    text: ……日本の鉛筆は、ここには並んでいないのだ。
  - speaker: zundamon
    emotion: happy
    text: こんなに便利な物、日本でも作りたい。
  - speaker: kakari
    emotion: surprised
    text: お客様。それは見本ですので、お持ち帰りは……
  - speaker: zundamon
    emotion: sad
    text: ……返します。
    beat: true
  - speaker: reimu
    text: 仁六は、このとき初めて鉛筆を見ました。
    reading: にろくわ、この とき はじめて えんぴつお みました。
  - speaker: reimu
    text: 会場の片すみの鉛筆が、仁六の一生を決めた。鉛筆の業界団体の歴史には、そう書かれています。
    reading: かいじょうの かたすみの えんぴつが にろくの いっしょうお きめた。えんぴつの ぎょうかい だんたいの れきしにわ、そう かかれて います。
- id: ch2_kigen
  title: 鉛筆はどこから来た
  background: pc_kunozan
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 仁六さんが驚いたのも、無理はないの。
  - speaker: tsumugi
    emotion: normal
    text: 鉛筆の始まりは、16世紀のイギリス。とても質のいい黒鉛が見つかったの。
  - speaker: zundamon
    emotion: thinking
    text: 黒鉛って、芯の黒いところ？
  - speaker: tsumugi
    emotion: normal
    text: そう。最初は黒鉛を棒に切って、そのまま書いてたのよ。
  - speaker: tsumugi
    emotion: normal
    text: 日本では、静岡の久能山東照宮に家康の鉛筆が残ってるわ。
  - speaker: tsumugi
    emotion: normal
    text: 芯の黒鉛は、メキシコ産。海を渡ってきた、珍しい道具ね。
  - speaker: tsumugi
    emotion: normal
    text: 伊達政宗のお墓からも、1974年の調査で筆のような形の鉛筆が見つかってるわ。
  - speaker: zundamon
    emotion: happy
    text: 殿様たちの、自慢の道具だったのか。
  - speaker: tsumugi
    emotion: normal
    text: 大きく変わったのは、1795年。フランスのコンテが、黒鉛の粉に粘土を混ぜて焼いたの。
  - speaker: tsumugi
    emotion: normal
    text: イギリスと戦争になって、黒鉛が手に入らなくなったからよ。
  - speaker: zundamon
    emotion: surprised
    text: 困ったから、混ぜ物で作ったのか。
  - speaker: tsumugi
    emotion: normal
    text: しかも混ぜる割合で、濃さまで変えられるようになったの。
  - speaker: tsumugi
    emotion: normal
    text: 明治のはじめの日本では、鉛筆はまだ珍しい物だったの。
  - speaker: tsumugi
    emotion: thinking
    text: でも仁六さんに、作り方を教えてくれる[人|ひと]はいなかったの。
- id: ch3_shin
  title: 崩れる芯
  background: pc_yoru
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 眞崎仁六, emotion: thinking}
  - {who: ienomono, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 持ち帰った手がかりは、黒鉛と粘土を混ぜて芯を作るという一言だけでした。
    reading: もちかえった てがかりわ、こくえんと ねんどお まぜて しんお つくると いう ひとことだけでした。
  - speaker: reimu
    text: 仁六は会社に勤めながら、今の銀座にあった自宅で研究を始めます。
    reading: にろくわ かいしゃに つとめながら、いまの ぎんざに あった じたくで けんきゅうお はじめます。
  - speaker: zundamon
    emotion: thinking
    text: 黒鉛と粘土を、半分ずつ混ぜてみるか。
  - speaker: ienomono
    emotion: thinking
    text: 旦那様。会社から帰るなり、泥遊びですか。
  - speaker: zundamon
    emotion: normal
    text: 泥じゃない。鉛筆の芯だ。
  - speaker: zundamon
    emotion: sad
    text: ……書こうとしたら、ぽろぽろ崩れたのだ。
  - speaker: ienomono
    emotion: normal
    text: 書く前に、粉に戻りましたね。
  - speaker: zundamon
    emotion: thinking
    text: なら、粘土を増やす。……今度は硬すぎて、紙に傷がつくだけだ。
  - speaker: ienomono
    emotion: thinking
    text: 字じゃなくて、ひっかき傷ですね。
    beat: true
  - speaker: zundamon
    emotion: thinking
    text: 黒鉛を増やせば、黒く書けるはず……
  - speaker: zundamon
    emotion: surprised
    text: ……折れた。
    se: chin
  - speaker: ienomono
    emotion: happy
    text: ポキッて、いい音がしましたね。
  - speaker: ienomono
    emotion: thinking
    text: 昨日も、同じ音を聞きました。
  - speaker: zundamon
    emotion: thinking
    text: 昨日のは、もう少し低い音だった。
    beat: true
  - speaker: zundamon
    emotion: happy
    text: 焼き方を変えるぞ！ 炉の火を、もっと強くするのだ！
  - speaker: ienomono
    emotion: surprised
    text: 旦那様！ 煙と粉で、壁まで真っ黒です！
    background: pc_yoru_shippai
  - speaker: zundamon
    emotion: surprised
    text: うちわで、あおいで追い出せ！
  - speaker: ienomono
    emotion: angry
    text: あおいだら、粉が舞って余計に真っ黒です！
  - speaker: zundamon
    emotion: sad
    text: ……あおがずに、続けるのだ。
  - speaker: ienomono
    emotion: sad
    text: 旦那様。お顔も、もう黒鉛と同じ色です。
    beat: true
  - speaker: reimu
    text: 初めは芯がすぐに折れるなど、失敗の連続でした。
    reading: はじめわ しんが すぐに おれるなど、しっぱいの れんぞくでした。
- id: ch3_zairyo
  title: ''
  background: pc_yoru
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 眞崎仁六, emotion: normal}
  - {who: ienomono, x: 0.7, emotion: thinking}
  cuts:
  - speaker: ienomono
    emotion: thinking
    text: 旦那様。芯を始めて、もう5年目ですよ。
  - speaker: zundamon
    emotion: normal
    text: まだ、5年だ。
  - speaker: ienomono
    emotion: thinking
    text: 1年目にこぼした粉、まだ畳から取れません。
  - speaker: zundamon
    emotion: happy
    text: 鹿児島の[加世田|かせだ]の黒鉛と、栃木の烏山の粘土を取り寄せた。
  - speaker: ienomono
    emotion: surprised
    text: 九州の南と、関東の北から。はるばるですね。
  - speaker: zundamon
    emotion: surprised
    text: ……書ける！ 線が、すっと引けるのだ！
    se: levelup
    telops:
    - {text: 芯だけで約5年, size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: ienomono
    emotion: happy
    text: 旦那様！ 字が、ちゃんと字になってます！
  - speaker: reimu
    text: 芯だけで、およそ5年。たどり着いたのは、加世田の黒鉛と烏山の粘土でした。
    reading: しんだけで およそ ごねん。たどりついたのわ、かせだの こくえんと からすやまの ねんどでした。
  - speaker: zundamon
    emotion: thinking
    text: 次は、芯を包む木だ。
  - speaker: ienomono
    emotion: thinking
    text: 旦那様。その板、石油の缶が入っていた木箱ですよね。
  - speaker: zundamon
    emotion: normal
    text: 外国の木だ。削りやすいかもしれない。
  - speaker: ienomono
    emotion: thinking
    text: ……石油のにおいの鉛筆は、ちょっと。
    beat: true
  - speaker: zundamon
    emotion: happy
    text: 北海道のアララギだ！ よく削れて、まっすぐなのだ！
  - speaker: reimu
    text: アララギは、イチイの北海道での呼び名です。機械も、自分で考えて作りました。
    reading: あららぎわ、いちいの ほっかいどうでの よびなです。きかいも、じぶんで かんがえて つくりました。
- id: ch3_kaisetsu
  title: 芯のレシピ
  background: pc_zukai
  bgm: 10do
  stage:
