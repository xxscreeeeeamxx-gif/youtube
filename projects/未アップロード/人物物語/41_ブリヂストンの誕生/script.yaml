        text: "社長。直す所が多すぎます。"
      - speaker: zundamon
        emotion: normal
        text: "三つに絞るのだ。"
      - speaker: gishi
        emotion: surprised
        text: "三つ、ですか。"
      - speaker: zundamon
        emotion: normal
        text: "一つ。作る手順を良くする。"
      - speaker: zundamon
        emotion: normal
        text: "二つ。設備を、いいものにする。"
      - speaker: zundamon
        emotion: normal
        text: "三つ。壊れる前に見つける。"
      - speaker: gishi
        emotion: thinking
