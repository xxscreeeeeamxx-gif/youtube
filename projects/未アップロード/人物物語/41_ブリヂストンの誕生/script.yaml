      - speaker: hanbai
        emotion: angry
        text: "客のせいにするんですか。"
      - speaker: seizo
        emotion: angry
        text: "事実です。[積み|つみ]すぎなんですよ。"
      - speaker: hanbai
        emotion: angry
        text: "少しでも不良が出たら、うちは終わりだ。"
      - speaker: reimu
        text: "工場と、売る側の言い争いは毎日続きました。"
        reading: "こうじょうと、うるがわの いいあらそいわ まいにち つづきました。"
      - speaker: zundamon
        emotion: normal
        text: "……二人とも、正しいのだ。"
      - speaker: seizo
        emotion: surprised
        text: "社長。両方は無理です。"
      - speaker: zundamon
        emotion: normal
        text: "無理じゃないのだ。"
      - speaker: zundamon
        emotion: angry
        text: "乱暴に使われても壊れなければいいのだ。"
      - speaker: hanbai
        emotion: surprised
        text: "……それは、作る側の話ですね。"
      - speaker: zundamon
        emotion: normal
        text: "そうだ。[金|かね]は出す。設備を入れるのだ。"

