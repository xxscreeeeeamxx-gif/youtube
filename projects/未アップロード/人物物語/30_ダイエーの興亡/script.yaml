        emotion: surprised
        text: "……。"
      - speaker: tsumugi
        emotion: normal
        text: "売上を増やすために借りて、返すために売上を増やす。"
      - speaker: tsumugi
        emotion: sad
        text: "……止まったら終わる走り方をしてたの。"
      - speaker: zundamon
        emotion: angry
        text: "止まらんかったらええ。"
      - speaker: tsumugi
        emotion: angry
        text: "止まるんだよ。人も会社も、いつかは。"
      - speaker: zundamon
        emotion: angry
        text: "……そんなもん、こっちが一番になったらええ話や。"
