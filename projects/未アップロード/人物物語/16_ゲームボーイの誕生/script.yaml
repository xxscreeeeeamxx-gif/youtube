      - speaker: reimu
        text: "56歳でした。"
        reading: "ごじゅうろくさいでした。"
        pause_after: 0.8
      - speaker: tsumugi
        emotion: sad
        text: "……早すぎるよ、横井くん。"
      - speaker: tsumugi
        emotion: normal
        text: "でも、君が遺した遊びは、ぜんぶ生きてる。"
      - speaker: reimu
        text: "その手が生んだ発明は、いまも世界中で動き続けています。"
        reading: "そのてがうんだはつめいわ、いまもせかいじゅうでうごきつづけています。"
        pause_after: 0.6
