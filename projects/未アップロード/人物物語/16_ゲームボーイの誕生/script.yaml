      - speaker: tsumugi
        emotion: happy
        text: "横井くん、すごい勢いだ。工場がフル回転だってさ。"
      - speaker: reimu
        text: "ウルトラハンドは、120万個を売ったと言われる大ヒットになりました。"
        reading: "うるとらはんどわ、ひゃくにじゅうまんこをうったといわれるだいひっとになりました。"
        telops:
          - {text: "120万個の大ヒット", size: xl, position: middle-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: zundamon
        emotion: happy
        text: "暇つぶしの工作が、120万個……バグみたいな数字なのだ。"
      - speaker: zundamon
        emotion: normal
        text: "コピー品まで出回ってるらしいのだ。人気の証明なんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "会社も、君を保守係にしておく気は、もう無いみたいだよ。"
      - speaker: zundamon
        emotion: surprised
        text: "えっ。"
      - speaker: tsumugi
        emotion: happy
        text: "開発部に、異動だってさ。おもちゃを作る側だ。"
      - speaker: zundamon
        emotion: happy
        text: "保守係から開発へ……転職なしで、転職なのだ。"
      - speaker: reimu
        text: "横井は開発の担当となり、玩具を次々と生み出していきます。"
        reading: "よこいわかいはつのたんとうとなり、がんぐをつぎつぎとうみだしていきます。"
  - id: omocha
