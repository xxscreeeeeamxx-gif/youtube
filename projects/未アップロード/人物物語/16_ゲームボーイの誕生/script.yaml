        text: "仕組みは、理科の実験レベル。枯れきった技術なのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "これ、科学というより、口実の発明だよね。"
      - speaker: zundamon
        emotion: normal
        text: "手をつなぐ理由を、機械が作ってあげる。優しさなんだ。"
      - speaker: tsumugi
        emotion: happy
        text: "太陽電池を使った、光線銃も当たったねえ。"
      - speaker: zundamon
        emotion: normal
        text: "光で的を撃つ。火薬より安全で、未来っぽいのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "太陽電池も、当時はもう値段がこなれてた部品だしね。"
      - speaker: zundamon
        emotion: normal
        text: "高い部品はひとつも無い。でも、遊びは新しいんだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "とはいえ、全部が当たったわけじゃないよね。"
      - speaker: zundamon
        emotion: normal
        text: "外れも山ほどあるのだ。でも、打席に立ち続けるんだ。"
      - speaker: reimu
        text: "どの玩具にも、共通の考え方がありました。"
        reading: "どのがんぐにも、きょうつうのかんがえかたがありました。"
  - id: tetsugaku
    title: "枯れた技術の、水平思考"
    background: il_yg_kaihatsu
    bgm: curious
    stage:
      - {who: zundamon, x: 0.24, tag: "横井", flip: true}
      - {who: tsumugi, x: 0.76, tag: "同僚"}
    cuts:
      - speaker: tsumugi
        emotion: thinking
        text: "横井くんの発明って、実は最新技術を使ってないよね。"
      - speaker: zundamon
        emotion: normal
        text: "そこが、狙いだ。ボクは、枯れた技術しか使わないんだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "枯れた技術？しおれてるの？"
      - speaker: zundamon
        emotion: normal
        text: "枯れた技術は、世に出て時間がたって、こなれた技術のことなのだ。"
      - speaker: zundamon
        emotion: normal
        text: "作り方が確立してて、安くて、めったに壊れないんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "たしかに、最新技術は高いし、不具合も多い。"
      - speaker: zundamon
        emotion: normal
        text: "最新での勝負は、資金が多い大企業の課金ゲーなのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "じゃあ、枯れた技術で、どう新しさを出すの？"
      - speaker: zundamon
        emotion: normal
        text: "使い道を、横にずらすのだ。それが、水平思考なんだ。"
      - speaker: zundamon
        emotion: normal
        text: "電卓の部品も、使い道を変えれば、おもちゃになるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "電卓、数年前は[高級品|こうきゅうひん]だったのに、いまや誰でも持ってる。"
      - speaker: zundamon
        emotion: normal
        text: "量産合戦のおかげで、液晶もチップも激安になったのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "つまり、値崩れした戦場の技術を、別の戦場で使うのか。"
      - speaker: tsumugi
        emotion: normal
        text: "性能を上げるんじゃなくて、使い方を発明するのか。"
      - speaker: zundamon
        emotion: happy
        text: "枯れた技術の水平思考。これが、ボクの必勝法なのだ。"
        telops:
          - {text: "枯れた技術の水平思考", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: reimu
        text: "安くて確実な技術に、新しい遊びをさせる。横井の哲学でした。"
        reading: "やすくてかくじつなぎじゅつに、あたらしいあそびをさせる。よこいのてつがくでした。"
