# 横井軍平再現ドラマ・ミーム版（1965→現代）。投稿前に必ず目視レビュー。
# 新方針: ミーム版のみ1本。センシティブ場面(死去jiko・バーチャルボーイの失敗の核)はクリーン維持。
# 故人だが遺族が存命のため、公知エピソードのみ・敬意ある描写。事故の詳細は「交通事故で急逝」に留める。
# 裏取り: 横井軍平Wikipedia/ASCII記事/本人著書の広く知られた逸話。
# 1941京都生・同志社大電気工学科・1965入社(設備保守)・ウルトラハンド(山内社長が見つけ商品化・
# 120万個と言われる)・ラブテスター/光線銃・新幹線で電卓のサラリーマン→ゲーム&ウォッチ1980
# (4340万個と言われる)・十字キー考案(ゲーム&ウォッチ版ドンキーコング・特許)・ゲームボーイ1989
# (12500円・単3電池4本で約35時間と言われる・白黒液晶・通信ケーブル・シリーズ累計約1億1900万台)・
# テトリス北米同梱・ポケモン1996・バーチャルボーイ1995→1996自主退社・コト設立・1997交通事故死56歳
meta:
  title: "白黒画面で、世界を取った男。ゲームボーイの父・横井軍平【ゆっくり再現ドラマ・ミーム版】"
  slug: "yokoi-gunpei"
  summary: "任天堂の設備保守係だった青年が、暇つぶしに作ったおもちゃを社長に見つかりました。クビを覚悟して呼ばれた社長室で、返ってきた言葉は「商品化しろ」。のちにゲームボーイを生む横井軍平が、生涯貫いた考え方とは。ずんだもんが横井を演じる再現ドラマです。"
  tags: ["横井軍平", "ゲームボーイ", "任天堂", "ゲームアンドウォッチ", "枯れた技術の水平思考", "再現ドラマ", "ゆっくり", "ずんだもん", "ミーム"]
  thumbnail:
    top: "白黒画面で"
    bottom: "世界を取った男"
  mode: drama
  narrator: reimu
  mobs:
    - {id: yamauchi, label: "山内社長", voice: 13, pitch: -0.07, item: mustache}
    - {id: salaryman, label: "サラリーマン", voice: 13, pitch: 0.02, item: hat}
    - {id: kodomo, label: "子ども", voice: 12, hair: short}
scenes:
  - id: hook
    title: ""
    background: il_yg_living
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "カラーが当たり前の時代に、白黒の画面で1億台売れたゲーム機があるの。"
      - speaker: zundamon
        emotion: surprised
        text: "1億！？白黒で！？画面がカラーの機種に、どうやって勝つのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "作ったのは、もともとゲームと関係ない、機械の保守係さんだよ。"
      - speaker: zundamon
        emotion: thinking
        text: "保守係！？初期配置から主人公になったのか。"
      - speaker: tsumugi
        emotion: normal
        text: "しかも白黒にしたのは、技術が足りなかったからじゃない。選んだの。"
      - speaker: zundamon
        emotion: surprised
        text: "わざと弱いほうを選んだのか。意味が分からんぞ。"
      - speaker: zundamon
        emotion: happy
        text: "……ところで見るのだ、この携帯ゲーム機。グラフィックが実写レベルなんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "きれいだね。じゃあ、その先祖の話をしようか。"
      - speaker: zundamon
        emotion: normal
        text: "先祖？どうせ昔も、最新技術の塊だったんだろ。"
      - speaker: tsumugi
        emotion: normal
        text: "逆。世界でいちばん売れた携帯ゲーム機のひとつは、白黒画面だよ。"
      - speaker: zundamon
        emotion: surprised
        text: "白黒！？カラーもない画面で、世界を取ったのか？"
      - speaker: tsumugi
        emotion: normal
        text: "そう。ゲームボーイ。シリーズ累計、約1億1900万台。"
        telops:
          - {text: "累計、約1億1900万台", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: zundamon
        emotion: surprised
        text: "1億！？レトロ機のくせに、販売数が壊れてるんだが。"
      - speaker: tsumugi
        emotion: normal
        text: "しかも当時、ライバルは全部カラー画面だったの。"
      - speaker: zundamon
        emotion: thinking
        text: "カラー相手に白黒で勝負？縛りプレイにもほどがあるぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "その縛りこそが、勝因だったんだよ。"
      - speaker: zundamon
        emotion: thinking
        text: "……何を言っているのか、分からないのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "作ったのは、もともとゲームと関係ない、機械の保守係さん。"
      - speaker: zundamon
        emotion: surprised
        text: "保守係！？初期配置から主人公になったのか？"
      - speaker: tsumugi
        emotion: happy
        text: "暇つぶしのおもちゃが、社長にバレたところから始まるの。"
      - speaker: zundamon
        emotion: thinking
        text: "バレて、クビじゃなくて、伝説になるのか……。"
      - speaker: tsumugi
        emotion: happy
        text: "今日はその人の話。電源を入れながら、聞いていこう。"
      - speaker: zundamon
        emotion: happy
        text: "聞くのだ。白黒で勝つ方法、ボクも知りたいぞ。"
      - speaker: reimu
        text: "ゲームボーイ。白黒の画面で、世界一売れた携帯ゲーム機のひとつです。"
        reading: "げーむぼーい。しろくろのがめんで、せかいいちうれたけいたいげーむきのひとつです。"
      - speaker: reimu
        text: "生んだのは、機械の保守係から始まった一人の開発者でした。"
        reading: "うんだのわ、きかいのほしゅがかりからはじまったひとりのかいはつしゃでした。"
      - speaker: reimu
        text: "物語は、1965年の京都から始まります。"
        reading: "ものがたりわ、せんきゅうひゃくろくじゅうごねんのきょうとからはじまります。"
  - id: era1965
    title: "1965・京都"
    background: il_yg_kojo
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.15, tag: "横井", flip: true}
    cuts:
      - speaker: reimu
        text: "1965年、京都。"
        reading: "せんきゅうひゃくろくじゅうごねん、きょうと。"
        video: assets/clips/era_yg1965.mp4
        video_full: true
        pause_after: 0.8
  - id: hozen
    title: ""
    background: il_yg_kojo
    bgm: pastel_house
    stage:
      - {who: zundamon, x: 0.24, tag: "横井", flip: true}
      - {who: tsumugi, x: 0.76, tag: "同僚"}
    cuts:
      - speaker: reimu
        text: "横井軍平は、大学の電気工学科を出て、任天堂に入社しました。"
        reading: "よこいぐんぺいわ、だいがくのでんきこうがっかをでて、にんてんどうににゅうしゃしました。"
      - speaker: tsumugi
        emotion: normal
        text: "横井くん、今日の点検は終わったのかい。"
      - speaker: zundamon
        emotion: normal
        text: "午前中に、ぜんぶ終わったんだ。"
      - speaker: reimu
        text: "当時の任天堂は、トランプや花札を作る会社でした。"
        reading: "とうじのにんてんどうわ、とらんぷやはなふだをつくるかいしゃでした。"
      - speaker: tsumugi
        emotion: normal
        text: "うちはカードの会社だから、電気設備は多くないしね。"
      - speaker: zundamon
        emotion: normal
        text: "花札の印刷機を、たまに直すくらいなんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "電気工学科を出て、花札の会社に入る人も珍しいよ。"
      - speaker: zundamon
        emotion: normal
        text: "京都で暮らしたかったのだ。それが第一条件だったんだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "ゆるい志望動機だなあ。"
      - speaker: zundamon
        emotion: thinking
        text: "機械が壊れないと、ボクの仕事は、ないんだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "つまり、暇ってことかい。"
      - speaker: zundamon
        emotion: happy
        text: "そう。暇すぎて、経験値がまったく入らないんだ。"
      - speaker: zundamon
        emotion: normal
        text: "だから……工場の道具を借りて、こんな物を作ったのだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "格子が伸び縮みして……先のツメで、物がつかめる！"
      - speaker: zundamon
        emotion: normal
        text: "ほら、あそこのハンコ。取ってみせるのだ。……ほい。"
      - speaker: tsumugi
        emotion: surprised
        text: "おお、届いた。席から動かずに取れた。"
      - speaker: zundamon
        emotion: happy
        text: "マジックハンドだ。離れた物を、これでキャッチするんだ。"
      - speaker: tsumugi
        emotion: happy
        text: "面白いなあ。……あっ、横井くん、後ろ。"
      - speaker: zundamon
        emotion: surprised
        text: "……ん？"
      - speaker: tsumugi
        emotion: sad
        text: "しゃ、社長……。"
      - speaker: zundamon
        emotion: surprised
        text: "…………詰んだ。"
      - speaker: reimu
        text: "勤務中の工作を、社長の山内溥に見られてしまいました。"
        reading: "きんむちゅうのこうさくを、しゃちょうのやまうちひろしにみられてしまいました。"
  - id: shacho
    title: "社長室への、呼び出し"
    background: il_yg_shacho
    bgm: kinakusai
    stage:
