      - {who: yamauchi, x: 0.72}
    cuts:
      - speaker: reimu
        text: "翌日、横井は社長室に呼び出されます。"
        reading: "よくじつ、よこいわしゃちょうしつによびだされます。"
      - speaker: zundamon
        emotion: sad
        text: "（終わった……ボクの社会人生活、1年でゲームオーバーなのだ。）"
      - speaker: yamauchi
        text: "横井くん。昨日の、あれを持ってきたか。"
      - speaker: zundamon
        emotion: sad
        text: "[は|ハ]、はい……。勤務中に、申し訳ありませんでした！"
      - speaker: yamauchi
        text: "……ふむ。伸びて、つかんで、縮む、と。"
      - speaker: zundamon
        emotion: sad
        text: "処分は、覚悟しています……。"
      - speaker: yamauchi
        text: "……横井くん。これで遊んでいるとき、楽しかったか。"
      - speaker: zundamon
        emotion: normal
        text: "……はい。正直、夢中になってました。"
      - speaker: yamauchi
        text: "同僚たちも、面白がっていたな。"
      - speaker: zundamon
        emotion: normal
        text: "[は|ハ]、はい。取り合いに、なってました……。"
      - speaker: yamauchi
        text: "それを、商品にしろ。"
        telops:
          - {text: "それを、商品にしろ", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: zundamon
        emotion: surprised
        text: "…………は？"
      - speaker: yamauchi
        text: "面白いものは、売れる。おもちゃとして、仕上げてみろ。"
      - speaker: zundamon
        emotion: surprised
        text: "クビじゃ、ないんですか！？"
      - speaker: yamauchi
        text: "怒られると思ったか。うちは、面白いものを作る会社だ。"
      - speaker: zundamon
        emotion: happy
        text: "や、やりますなのだ！全力で、やらせてもらうのだ！"
      - speaker: reimu
        text: "処分どころか、まさかの商品化命令でした。"
        reading: "しょぶんどころか、まさかのしょうひんかめいれえでした。"
      - speaker: zundamon
        emotion: happy
        text: "（怒られる流れから、大抜擢……人生、何が起きるか分からないのだ。）"
  - id: hit
