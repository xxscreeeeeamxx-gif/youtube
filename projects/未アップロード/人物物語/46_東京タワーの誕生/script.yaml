  - speaker: tsumugi
    emotion: thinking
    text: 1926年ごろから、専門家の意見が真っ二つに割れたの。
  - speaker: zundamon
    emotion: surprised
    text: 内藤先生は、どっちだったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 硬い派の中心だった、佐野先生の弟子よ。
  - speaker: tsumugi
    emotion: normal
    text: 壁を入れる理論は、硬く造る考え方を、実際の建物で支えたの。
  - speaker: tsumugi
    emotion: thinking
    text: ただ、論争の[表|おもて]に立って言い合ったのは、別の先生たちなんだけどね。
  - speaker: zundamon
    emotion: thinking
    text: "[勝った|かった]のは、どっちなのだ。"
  - speaker: tsumugi
    emotion: normal
    text: そのときは硬い派。日本の建物の決まりも、その考えで作られていったの。
  - speaker: zundamon
    emotion: happy
    text: 硬いのが正解なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: ところが1968年、霞が関ビルという超高層ビルが、柔らかい造りで建つの。
  - speaker: zundamon
    emotion: surprised
    text: ひっくり返った！
  - speaker: tsumugi
    emotion: normal
    text: 計算を率いたのは[武藤清|むとうきよし]。昔、硬い造りしかないと書いた先生よ。
  - speaker: zundamon
    emotion: surprised
    text: 同じ人が！？ 手のひら返しなのだ。
  - speaker: tsumugi
    emotion: normal
    text: コンピューターで、揺れ方を細かく計算できるようになったの。
  - speaker: tsumugi
    emotion: normal
    text: 道具が変わったから、答えも変えたのよ。
  - speaker: zundamon
    emotion: thinking
    text: 前の答えは、間違いだったのだ？
  - speaker: tsumugi
    emotion: normal
    text: 低い建物なら硬く、高い建物なら柔らかく。使い分けられるようになったの。
  - speaker: tsumugi
    emotion: happy
    text: しかも、その霞が関ビルにも、壁の工夫が入っていたのよ。
  - speaker: zundamon
    emotion: happy
    text: 壁、しぶといな。
  - speaker: tsumugi
    emotion: normal
    text: それにね、東京タワーも、強い風を受けると少ししなって力を逃がすの。
  - speaker: zundamon
    emotion: surprised
    text: 壁の先生の塔が、しなるのだ。
  - speaker: tsumugi
    emotion: happy
    text: 塔に壁は入らないもの。建てる物に合わせて、答えを変えたのよ。
  - speaker: zundamon
    emotion: normal
    text: 硬いか柔らかいかより、何を建てるかが先なのだ。
- id: ch15_bannen
  title: 積み重ね
  background: nt_kenkyushitsu
  bgm: amacha_hoshizora
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 内藤多仲, emotion: normal}
  - {who: gakusei, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1962年、多仲は文化功労者に選ばれます。
    reading: せんきゅうひゃく ろくじゅうにねん、たちゅうわ ぶんか こうろうしゃに えらばれます。
  - speaker: reimu
    text: その後も塔を手がけ、博多ポートタワーが6兄弟の最後の1本になりました。
    reading: そのごも とおお てがけ、はかた ぽおと たわあが ろくきょうだいの さいごの いっぽんに なりました。
  - speaker: gakusei
    emotion: normal
    text: 先生。[色紙|しきし]に、何か[一言|ひとこと]いただけませんか。
  - speaker: zundamon
    emotion: thinking
    text: 一言か。
  - speaker: gakusei
    emotion: happy
    text: 研究室の壁に、飾りたいんです。
  - speaker: zundamon
    emotion: happy
    text: 壁なら、ちゃんと支えてくれるのだ。
  - speaker: gakusei
    emotion: thinking
    text: '[色紙|しきし]は、そんなに重くないです。'
  - speaker: zundamon
    emotion: normal
    text: ……積み重ね、積み重ねても、また積み重ね。
  - speaker: reimu
    text: 多仲が信条にしていた言葉です。
    reading: たちゅうが しんじょうに していた ことばです。
    telops:
    - {text: "積み重ね 積み重ねても また積み重ね", size: lg, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: gakusei
    emotion: surprised
    text: 三回も積むんですか。
  - speaker: zundamon
    emotion: normal
    text: 積んだら、崩れることもあるのだ。
  - speaker: gakusei
    emotion: thinking
    text: 崩れたら、どうするんです。
  - speaker: zundamon
    emotion: happy
    text: また積むのだ。石垣も、計算も、塔も、同じなのだ。
  - speaker: gakusei
    emotion: happy
    text: 先生らしいです。
  - speaker: zundamon
    emotion: normal
    text: 計算尺も、まだ現役だぞ。
  - speaker: gakusei
    emotion: surprised
    text: まだ、それを使ってるんですか。
  - speaker: zundamon
    emotion: happy
    text: 一生使うと、約束したのだ。
- id: card1970
  title: ''
  background: nt_card_1970
  cuts:
  - speaker: reimu
    text: 1970年8月25日。内藤多仲は、84歳で亡くなりました。
    reading: せんきゅうひゃく ななじゅうねん はちがつ にじゅうごにち。ないとう たちゅうわ、はちじゅうよんさいで なくなりました。
  - speaker: reimu
    text: 生涯に手がけた塔は、60を超えると言われています。
    reading: しょうがいに てがけた とおわ、ろくじゅうお こえると いわれています。
- id: ch16_gendai
  title: 控えの塔
  background: nt_tower
  bgm: amacha_milkyway
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 今は、スカイツリーがあるのだ。東京タワーは、もう[用済み|ようずみ]なのだ？
  - speaker: tsumugi
    emotion: angry
    text: 失礼ね。
  - speaker: tsumugi
    emotion: normal
    text: 2013年に、テレビの電波を送る役目はスカイツリーに移ったわ。
  - speaker: zundamon
    emotion: sad
    text: やっぱり、引退か。
  - speaker: tsumugi
    emotion: normal
    text: でも、スカイツリーに何かあったときの、予備の電波塔なの。
  - speaker: zundamon
    emotion: surprised
    text: 控えの選手なのだ。
  - speaker: tsumugi
    emotion: happy
    text: それに、FMラジオの電波は、今も東京タワーから出てるのよ。
  - speaker: zundamon
    emotion: happy
    text: 現役だ！
  - speaker: reimu
    text: 2024年までに登った人は、合計1億9000万人。
    reading: にせん にじゅうよねんまでに のぼった ひとわ、ごうけい いちおく きゅうせんまんにん。
    telops:
    - {text: "登った人は、合わせて1億9000万人", size: lg, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 日本の人口より多いのだ！
  - speaker: tsumugi
    emotion: happy
    text: 何回も登る人がいるからね。
  - speaker: zundamon
    emotion: happy
    text: ボクも登りたいのだ。
  - speaker: tsumugi
    emotion: normal
    text: 登る前に、塔の色も見てみて。赤と白のペンキは、何年かごとに塗り直してるの。
  - speaker: zundamon
    emotion: thinking
    text: 全部、塗り直すのだ？
  - speaker: tsumugi
    emotion: normal
    text: ペンキは1回で、3万4000リットル使うと言われてるわ。
  - speaker: zundamon
    emotion: surprised
    text: お風呂、何杯分なのだ。
  - speaker: tsumugi
    emotion: happy
    text: 170杯くらいね。
  - speaker: zundamon
    emotion: happy
    text: 塗るのも、積み重ねなのだ。
  - speaker: tsumugi
    emotion: normal
    text: そうね。建てて終わりじゃないの。
- id: shime
  title: ''
  background: nt_ima
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。漫画の箱、仕切りを戻して、二つに分けたのだ。
  - speaker: tsumugi
    emotion: happy
    text: 欲張らなくなったのね。
  - speaker: zundamon
    emotion: normal
    text: ちゃんと持てたのだ。形も崩れないぞ。
  - speaker: tsumugi
    emotion: normal
    text: みんなの家にも、見えない仕切りが入ってるかもしれないわ。
  - speaker: zundamon
    emotion: thinking
    text: 見えない仕切りなのだ？
  - speaker: tsumugi
    emotion: normal
    text: 壁の中よ。家やマンションには、地震に耐えるための壁が入ってるの。
  - speaker: zundamon
    emotion: surprised
    text: ただの壁だと思ってたぞ。
  - speaker: tsumugi
    emotion: normal
    text: リフォームで壁を抜きたくなったら、その壁が何を支えてるか、必ず確かめてね。
  - speaker: zundamon
    emotion: thinking
    text: 抜いたら、ぐにゃっとなるかもしれないのだ。
  - speaker: tsumugi
    emotion: happy
    text: 段ボールと同じよ。
  - speaker: zundamon
    emotion: normal
    text: 仕切りは、[邪魔者|じゃまもの]じゃなかったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 箱を支えてたのは、外の枠じゃなくて、中の板だったのね。
  - speaker: zundamon
    emotion: thinking
    text: 目立たない所が、一番働いてたのだ。
  - speaker: tsumugi
    emotion: happy
    text: 窓の外の塔も、今日から少し違って見えるでしょ。
  - speaker: zundamon
    emotion: happy
    text: ……揺れてるように、見えてきたのだ。
  - speaker: tsumugi
    emotion: angry
    text: 気のせいよ。
    se: oti
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
