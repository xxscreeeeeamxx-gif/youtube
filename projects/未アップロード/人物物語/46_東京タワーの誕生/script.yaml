scenes:
- id: hook
  title: ''
  background: nt_ima
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.3, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、見るのだ。漫画を全部、箱に詰めてるのだ。
  - speaker: tsumugi
    emotion: normal
    text: 引っ越しでもするの？
  - speaker: zundamon
    emotion: normal
    text: 部屋を片づけるのだ。42巻、ひと箱に入れるぞ。
  - speaker: tsumugi
    emotion: thinking
    text: ひと箱に、全部？
  - speaker: zundamon
    emotion: happy
    text: 大きい箱なら一回で運べる。賢いのだ。
  - speaker: tsumugi
    emotion: normal
    text: 重くない？
  - speaker: zundamon
    emotion: thinking
    text: ……あと5冊、入らない。
  - speaker: zundamon
    emotion: normal
    text: 箱の真ん中の、この板が邪魔なのだ。
  - speaker: tsumugi
    emotion: surprised
    text: それ、仕切りでしょ。
  - speaker: zundamon
    emotion: happy
    text: 抜いたら全部入った。ボクは天才なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 知らないわよ、どうなっても。
  - speaker: zundamon
    emotion: normal
    text: よいしょ、と。
  - speaker: zundamon
    emotion: surprised
    text: ……箱が、ぐにゃってなった。
    se: don
  - speaker: tsumugi
    emotion: normal
    text: 横から押されて、ひし形につぶれてるわね。
  - speaker: zundamon
    emotion: angry
    text: 箱が弱いのだ。もっと大きい箱にするぞ。
  - speaker: tsumugi
    emotion: angry
    text: 大きくしたら、もっとつぶれるわよ。
  - speaker: zundamon
    emotion: sad
    text: ……今度は、底が抜けたのだ。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: ほら。仕切り、戻してみて。
  - speaker: zundamon
    emotion: surprised
    text: ……箱が、しゃんとした。
  - speaker: tsumugi
    emotion: happy
    text: その板一枚が、箱を支えてたの。
  - speaker: zundamon
    emotion: thinking
    text: ただの板なのに、そんなに働くのだ？
  - speaker: tsumugi
    emotion: normal
    text: ただの板で、ビルを地震から守った人がいるのよ。
  - speaker: zundamon
    emotion: surprised
    text: ビルを。
  - speaker: tsumugi
    emotion: normal
    text: 建ててから3か月後に、関東大震災が来たの。
  - speaker: zundamon
    emotion: surprised
    text: 3か月。できたばかりなのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 東京の銀行の本店で、無事だったのはほんの一握り。
  - speaker: tsumugi
    emotion: normal
    text: その一つが、その人が骨組みを計算した銀行だったの。
  - speaker: zundamon
    emotion: thinking
    text: 運が良かっただけでは。
  - speaker: tsumugi
    emotion: normal
    text: 運じゃないの。壁をどこに入れるか、全部計算してたのよ。
  - speaker: zundamon
    emotion: normal
    text: 壁の、入れ方。
  - speaker: tsumugi
    emotion: happy
    text: その人は、窓の外のあれも作ったわ。
  - speaker: zundamon
    emotion: surprised
    text: ……東京タワーなのだ！
  - speaker: reimu
    text: 東京タワー、高さ333メートル。
    reading: とうきょうたわあ、たかさ さんびゃく さんじゅうさん めえとる。
  - speaker: reimu
    text: 設計したのは、内藤多仲という70歳の構造学者でした。
    reading: せっけいしたのわ ないとう たちゅうという ななじゅっさいの こうぞう がくしゃでした。
  - speaker: zundamon
    emotion: thinking
    text: 構造学者って、何をする人なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 建物が倒れないように、骨組みを計算する人よ。
  - speaker: zundamon
    emotion: happy
    text: 骨組みの先生か。
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、山梨の小さな村よ。
- id: card1886
  title: ''
  background: nt_card_1886
  cuts:
  - speaker: reimu
    text: 1886年6月12日。山梨県の村に生まれました。
    reading: せんはっぴゃく はちじゅうろくねん ろくがつ じゅうににち。やまなしけんの むらに うまれました。
- id: ch1_mura
  title: 石垣を数える少年
  background: nt_inaka
  bgm: natsuyasumi
  stage:
  - {who: zundamon, x: 0.3, flip: true, tag: 多仲, scale: 0.8, emotion: normal}
  - {who: haha, x: 0.68, emotion: normal}
  cuts:
  - speaker: haha
    emotion: normal
    text: '[多仲|たちゅう]。さっきから、何を数えてるの。'
  - speaker: zundamon
    emotion: happy
    text: 石なのだ。この石垣に、石が何個あるか数えてるのだ。
  - speaker: haha
    emotion: surprised
    text: 数えて、どうするの。
  - speaker: zundamon
    emotion: thinking
    text: 大きい石が下で、小さい石が上なのだ。
  - speaker: haha
    emotion: normal
    text: そりゃあ、そうでしょう。
  - speaker: zundamon
    emotion: normal
    text: 逆に積んだら、どうなるのだ。
  - speaker: haha
    emotion: thinking
    text: 崩れるに決まってるわ。
  - speaker: zundamon
    emotion: happy
    text: 試してみるのだ。
  - speaker: haha
    emotion: angry
    text: 試さなくていいの。
  - speaker: zundamon
    emotion: surprised
    text: ……崩れた。
  - speaker: haha
    emotion: normal
    text: ほら、言ったでしょう。
  - speaker: zundamon
    emotion: thinking
    text: 上が重いと、下の石が押し出されるのだ。
  - speaker: haha
    emotion: surprised
    text: 崩れ方まで見てたの。
  - speaker: zundamon
    emotion: normal
    text: 見ないと、次に積めないのだ。
  - speaker: haha
    emotion: thinking
    text: 次は、どう積むの。
  - speaker: zundamon
    emotion: happy
    text: 大きいのを下にして、また積む。崩れたら、また積むぞ。
  - speaker: reimu
    text: 多仲は、算数の得意な子だったと伝わっています。
    reading: たちゅうわ さんすうの とくいな こだったと つたわっています。
- id: ch1_chugaku
  title: ''
  background: nt_kyoshitsu
  stage:
  - {who: zundamon, x: 0.3, flip: true, tag: 多仲, scale: 0.9, emotion: normal}
  - {who: sensei, x: 0.68, emotion: normal}
  cuts:
  - speaker: reimu
    text: 甲府の中学へ進んだ多仲は、4年生のとき学校の雑誌に文章を書きます。
    reading: こうふの ちゅうがくえ すすんだ たちゅうわ、よねんせいの とき がっこうの ざっしに ぶんしょうお かきます。
  - speaker: sensei
    emotion: normal
    text: 内藤。お前の原稿、読んだぞ。
  - speaker: zundamon
    emotion: surprised
    text: もう読んでくれたのか！
  - speaker: sensei
    emotion: thinking
    text: 発明について書いたんだな。
  - speaker: zundamon
    emotion: happy
    text: 発明が、どうやって生まれるのか、考えてみたかったのだ。
  - speaker: sensei
    emotion: surprised
    text: 中学生が、発明を論じるのか。
  - speaker: zundamon
    emotion: normal
    text: 新しい物は、誰かが最初に思いつくのだ。
  - speaker: zundamon
    emotion: thinking
    text: その最初が、どこから来るのか知りたいのだ。
  - speaker: sensei
    emotion: thinking
    text: 答えは出たのか。
  - speaker: zundamon
    emotion: sad
    text: ……まだだ。
  - speaker: sensei
    emotion: happy
    text: 正直でいい。続きは、大人になってから書け。
  - speaker: zundamon
    emotion: happy
    text: 書くぞ。
  - speaker: reimu
    text: この文章が載った雑誌は、今も山梨の博物館に残っています。
    reading: この ぶんしょうが のった ざっしわ、いまも やまなしの はくぶつかんに のこっています。
- id: ch2_teidai
  title: 船から建物へ
  background: nt_seizu
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 内藤多仲, emotion: normal}
  - {who: doukyu, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1904年に中学を出た多仲は、一高を経て東京帝国大学へ進みます。
    reading: せんきゅうひゃく よねんに ちゅうがくお でた たちゅうわ、いちこうお へて とうきょう ていこく だいがくえ すすみます。
  - speaker: doukyu
    emotion: surprised
    text: 内藤。お前、造船に行くんじゃなかったのか。
  - speaker: zundamon
    emotion: normal
    text: そのつもりだったのだ。
  - speaker: doukyu
    emotion: thinking
    text: 船が好きだと、あれほど言ってたのに。
  - speaker: zundamon
    emotion: thinking
    text: ……建築に、移ることにしたのだ。
  - speaker: doukyu
    emotion: surprised
    text: 何かあったのか。
  - speaker: zundamon
    emotion: normal
    text: 思うところが、あるのだ。
  - speaker: doukyu
    emotion: angry
    text: それじゃ、何も分からんぞ。
  - speaker: zundamon
    emotion: happy
    text: ボクにも、まだうまく言えないのだ。
  - speaker: doukyu
    emotion: thinking
    text: 船も建物も、大きな箱みたいなもんだがな。
  - speaker: zundamon
    emotion: surprised
    text: ……箱。
  - speaker: doukyu
    emotion: normal
    text: 船は海に浮かぶ箱、建物は地面に立つ箱だ。
  - speaker: zundamon
    emotion: thinking
    text: 立つ箱のほうが、揺らされたら逃げ場がないのだ。
  - speaker: reimu
    text: 造船から建築へ移った理由について、本人はほとんど語っていません。
    reading: ぞうせんから けんちくえ うつった りゆうに ついて、ほんにんわ ほとんど かたっていません。
  - speaker: reimu
    text: ただ、ここで生涯の師に出会います。
    reading: ただ、ここで しょうがいの しに であいます。
- id: ch2_sano
  title: ''
  background: nt_kenkyushitsu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 内藤多仲, emotion: normal}
  - {who: sano, x: 0.7, emotion: normal}
  cuts:
  - speaker: sano
    emotion: normal
    text: 内藤くん。船から移ってきたそうだね。
  - speaker: zundamon
    emotion: normal
    text: はい。建築は、まだ分からないことだらけなのだ。
  - speaker: sano
    emotion: thinking
    text: 一つ聞こう。日本で建物を建てるとき、一番の敵は[何|なん]だと思う。
  - speaker: zundamon
    emotion: thinking
    text: 雨……それとも、火事か。
  - speaker: sano
    emotion: normal
    text: 地震だよ。
  - speaker: zundamon
    emotion: surprised
    text: 地震。
  - speaker: sano
    emotion: normal
    text: 我々が読む西洋の本は、地震の少ない国で書かれている。
  - speaker: sano
    emotion: thinking
    text: そのまま真似して建てたら、この国では倒れるかもしれない。
  - speaker: zundamon
    emotion: surprised
    text: じゃあ、誰が考えるのだ。
  - speaker: sano
    emotion: happy
    text: 我々だよ。
  - speaker: zundamon
    emotion: thinking
    text: ……倒れない建物を、計算で作れるのだ？
  - speaker: sano
    emotion: normal
    text: 作れるようにするのが、構造という学問だ。
  - speaker: zundamon
    emotion: happy
    text: それを、やりたいのだ。
  - speaker: sano
    emotion: happy
    text: いい返事だ。地震の国には、君みたいな人間が要る。
- id: card1910
  title: ''
  background: nt_card_1910
  cuts:
  - speaker: reimu
    text: 1910年。大学を出た多仲は、その年のうちに早稲田大学の講師になります。
    reading: せんきゅうひゃく じゅうねん。だいがくお でた たちゅうわ、そのとしの うちに わせだ だいがくの こうしに なります。
- id: ch3_waseda
  title: 大声の先生
  background: nt_kenkyushitsu
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 内藤多仲, emotion: happy}
  - {who: gakusei, x: 0.7, emotion: surprised}
  cuts:
  - speaker: gakusei
    emotion: surprised
    text: 先生。廊下の端まで、声が聞こえました。
  - speaker: zundamon
    emotion: happy
    text: '[謡|うたい]の稽古なのだ。能の[節|ふし]を、うなっていたのだ。'
  - speaker: gakusei
    emotion: thinking
    text: 授業の前に、ですか。
  - speaker: zundamon
    emotion: normal
    text: 教室の一番後ろまで、声を届けないといけないのだ。
  - speaker: gakusei
    emotion: happy
    text: 一番後ろは、寝るための席なんですが。
  - speaker: zundamon
    emotion: angry
    text: だから届けるんだ。
  - speaker: gakusei
    emotion: sad
    text: ……起きてます。
  - speaker: zundamon
    emotion: normal
    text: 今日は、柱と[梁|はり]の話をするぞ。
  - speaker: gakusei
    emotion: thinking
    text: 柱が縦で、[梁|はり]が横ですよね。
  - speaker: zundamon
    emotion: normal
    text: そうなのだ。縦と横で四角い枠を作って、床や屋根を載せるのだ。
  - speaker: gakusei
    emotion: normal
    text: アメリカの高いビルも、そうやって建っていると聞きました。
  - speaker: zundamon
    emotion: thinking
    text: そうなのだ。でも、あっちは地震が少ないのだ。
  - speaker: gakusei
    emotion: thinking
    text: 日本で揺らしたら、どうなるんですか。
  - speaker: zundamon
    emotion: thinking
    text: ……それを、まだ誰も計算しきれていないのだ。
  - speaker: gakusei
    emotion: surprised
    text: 先生でも、ですか。
  - speaker: zundamon
    emotion: normal
    text: ボクでも、なのだ。だから研究するのだ。
  - speaker: reimu
    text: 多仲は謡を好み、授業で大声を出す稽古も兼ねていたと、教え子が語っています。
    reading: たちゅうわ うたいお このみ じゅぎょうで おおごえお だす けいこも かねていたと、おしえごが かたっています。
- id: ch3_keisanjaku
  title: ''
  background: nt_kenkyushitsu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 内藤多仲, emotion: normal}
  - {who: sano, x: 0.7, emotion: happy}
  cuts:
  - speaker: sano
    emotion: happy
    text: 内藤くん。講義は順調かね。
  - speaker: zundamon
    emotion: happy
    text: 声だけは、よく届いているのだ。
  - speaker: sano
    emotion: normal
    text: それは何よりだ。これを使いなさい。
  - speaker: zundamon
    emotion: surprised
    text: 計算尺だ……！
  - speaker: sano
    emotion: normal
    text: 目盛りを滑らせれば、掛け算も割り算もすぐに出る。
  - speaker: zundamon
    emotion: happy
    text: 一生、使うのだ。
  - speaker: sano
    emotion: surprised
    text: 一生とは、大きく出たね。
  - speaker: zundamon
    emotion: normal
    text: 本気だぞ。
  - speaker: reimu
    text: 師の佐野利器から贈られた計算尺を、多仲は生涯使い続けたと言われています。
    reading: しの さの としかたから おくられた けいさんじゃくお、たちゅうわ しょうがい つかいつづけたと いわれています。
  - speaker: reimu
    text: 20代の半ばで、多仲は早稲田の教授になりました。
    reading: にじゅうだいの なかばで、たちゅうわ わせだの きょうじゅに なりました。
  - speaker: reimu
    text: 1916年には、結婚もしています。
    reading: せんきゅうひゃく じゅうろくねんにわ、けっこんも しています。
- id: card1917
  title: ''
  background: nt_card_1917
  cuts:
  - speaker: reimu
    text: 1917年。多仲は、アメリカへ渡ります。
    reading: せんきゅうひゃく じゅうななねん。たちゅうわ あめりかえ わたります。
- id: ch4_america
  title: 地震の少ない国
  background: nt_america
  bgm: curious
  stage:
  - {who: zundamon, x: 0.3, flip: true, tag: 内藤多仲, emotion: surprised}
  - {who: tsumugi, x: 0.74, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 見上げても、てっぺんが見えないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 当時のアメリカは、高いビルが次々に建っていたのよ。
  - speaker: zundamon
    emotion: thinking
    text: 柱と[梁|はり]の骨組みだけで、ここまで高くするのだ。
  - speaker: tsumugi
    emotion: normal
    text: この国では、それで十分なのよ。
  - speaker: zundamon
    emotion: thinking
    text: 日本に持ち帰るには、何かが足りないのだ。
  - speaker: tsumugi
    emotion: normal
    text: それを探しに来たんでしょ。
  - speaker: zundamon
    emotion: normal
    text: そうだったのだ。資料を集めまくるぞ。
  - speaker: tsumugi
    emotion: surprised
    text: 集めまくる。
  - speaker: zundamon
    emotion: happy
    text: 本も図面も、持って帰れる分は全部なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: ……それ、どこに入れるつもり？
  - speaker: zundamon
    emotion: happy
    text: トランクに決まってるぞ。
- id: ch4_trunk
  title: トランクの仕切り
  background: nt_eki
  bgm: mystery
  stage:
  - {who: zundamon, x: 0.3, flip: true, tag: 内藤多仲, emotion: happy}
  - {who: tsumugi, x: 0.74, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: ……入りきらない。
  - speaker: zundamon
    emotion: happy
    text: 中の仕切りの板を外せば、もっと入るのだ。
  - speaker: tsumugi
    emotion: surprised
    text: それ、どこかで見た気がするわ。
  - speaker: zundamon
    emotion: normal
    text: 気のせいなのだ。ぎゅうぎゅうに詰めるぞ。
  - speaker: tsumugi
    emotion: thinking
    text: '[留め金|とめがね]が、悲鳴を上げてるわよ。'
  - speaker: zundamon
    emotion: happy
    text: 閉まった。完璧なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: もう一つのトランクは？
  - speaker: zundamon
    emotion: normal
    text: あっちは仕切りを入れたまま、普通に詰めたのだ。
  - speaker: reimu
    text: 旅のあいだ、荷物は何度も積み下ろされ、揺られます。
    reading: たびの あいだ にもつわ なんども つみおろされ、ゆられます。
  - speaker: zundamon
    emotion: surprised
    text: ……トランクが、ゆがんでる！
    se: don
  - speaker: tsumugi
    emotion: normal
    text: '[角|かど]が押されて、ひし形になってるわね。'
  - speaker: zundamon
    emotion: sad
    text: '[留め金|とめがね]も外れて、中身が飛び出してるのだ。'
  - speaker: tsumugi
    emotion: thinking
    text: 仕切りを外したからよ。
  - speaker: zundamon
    emotion: angry
    text: 仕切りなんて、ただの板なのだ。
  - speaker: tsumugi
    emotion: normal
    text: じゃあ、隣のトランクを見て。
  - speaker: zundamon
    emotion: thinking
    text: ……仕切りを入れたままのほうは、平気なのだ。
  - speaker: tsumugi
    emotion: normal
    text: 同じように揺られたのに？
  - speaker: zundamon
    emotion: thinking
    text: 外の枠は同じなのだ。違うのは、中の板だけなのだ。
  - speaker: zundamon
    emotion: surprised
    text: ……板が、箱のゆがみを止めてたんだ。
  - speaker: tsumugi
    emotion: happy
    text: そう。横から押されても、中の壁が突っ張るの。
  - speaker: zundamon
    emotion: normal
    text: 建物も、箱なのだ。
  - speaker: tsumugi
    emotion: surprised
    text: 急に話が大きくなったわね。
  - speaker: zundamon
    emotion: normal
    text: 柱と[梁|はり]の枠だけだと、横から押されたら、ひし形になるのだ。
  - speaker: zundamon
    emotion: happy
    text: でも、ところどころに丈夫な壁を入れたら、踏ん張るのだ！
  - speaker: reimu
    text: 中に壁を入れた箱は、横から押されても形を保ちます。
    reading: なかに かべお いれた はこわ、よこから おされても かたちお たもちます。
    telops:
    - {text: "中の壁が、箱のゆがみを止める", size: lg, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: happy
    text: 帰ったら、これを計算にするのだ。
  - speaker: reimu
    text: この話は、資料によって場所や細かい中身が少しずつ違います。
    reading: この はなしわ しりょうに よって、ばしょや こまかい なかみが すこしずつ ちがいます。
  - speaker: reimu
    text: ただ、仕切りの大切さに気づいたという点は、どれも同じです。
    reading: ただ しきりの たいせつさに きづいたという てんわ、どれも おなじです。
- id: ch5_riron
  title: 壁の置き場所
  background: nt_kenkyushitsu
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 内藤多仲, emotion: normal}
  - {who: gakusei, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1918年に帰国した多仲は、この考えを数字で確かめ始めます。
    reading: せんきゅうひゃく じゅうはちねんに きこくした たちゅうわ、この かんがえお すうじで たしかめ はじめます。
  - speaker: gakusei
    emotion: thinking
    text: 先生。壁を入れると、どれくらい強くなるんですか。
  - speaker: zundamon
    emotion: normal
    text: それを、壁の一枚ごとに数字で出すのだ。
  - speaker: gakusei
    emotion: surprised
    text: 一枚ごとに。
  - speaker: zundamon
    emotion: normal
    text: 地震で横から押されたとき、どの壁が、どれだけ力を受け持つかなのだ。
  - speaker: gakusei
    emotion: thinking
    text: 全部の壁で、均等に分けるんじゃないんですか。
  - speaker: zundamon
    emotion: thinking
    text: 硬い壁ほど、たくさん力を集めるのだ。
  - speaker: gakusei
    emotion: surprised
    text: 力が、硬いほうへ寄っていく。
  - speaker: zundamon
    emotion: normal
    text: だから硬い壁を片側に固めると、建物がねじれるぞ。
  - speaker: gakusei
    emotion: surprised
    text: ねじれる。
  - speaker: zundamon
    emotion: normal
    text: 壁は、釣り合いよく散らして置くのだ。
  - speaker: gakusei
    emotion: thinking
    text: でも先生。壁が増えたら、窓が減ります。
  - speaker: zundamon
    emotion: sad
    text: ……そこだ。
  - speaker: gakusei
    emotion: normal
    text: 建てる人は、明るくて広い部屋を欲しがります。
  - speaker: zundamon
    emotion: thinking
    text: だから壁の数は最小限にして、置き場所で勝負するのだ。
  - speaker: gakusei
    emotion: happy
    text: 計算尺の出番ですね。
  - speaker: zundamon
    emotion: happy
    text: 毎晩、滑らせているぞ。
  - speaker: reimu
    text: 1922年から、多仲はこの理論を建築の専門誌に6回に分けて発表します。
    reading: せんきゅうひゃく にじゅうにねんから、たちゅうわ この りろんお けんちくの せんもんしに ろっかいに わけて はっぴょうします。
- id: card1923
