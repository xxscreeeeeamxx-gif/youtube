meta:
  title: 【東京タワーの誕生】トランクの仕切りから、地震に耐えるビルが生まれた【ずんだもん解説】
  slug: naito-tower
  summary: 山梨の村に生まれ、船を作るつもりで大学に入った青年がいました。専攻を建築に変えた彼は、地震の国で建物をどう立たせるかという問いを抱えて、アメリカへ渡ります。答えのヒントは、旅の荷物の中にありました。のちに70歳で東京タワーの計算を引き受けることになる、ひとりの構造学者の物語です。
  tags:
  - 東京タワー
  - 内藤多仲
  - 塔博士
  - 耐震壁
  - 関東大震災
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 建築
  - 構造設計
  thumbnail:
    top: 70歳の計算
    bottom: 東京タワーの誕生
  mode: drama
  narrator: reimu
