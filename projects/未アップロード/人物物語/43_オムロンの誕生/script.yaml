      - speaker: zundamon
        emotion: surprised
        text: "……全部にですか。"
      - speaker: rentgen
        emotion: happy
        text: "全部に。もう、人には数えさせません。"
      - speaker: zundamon
        emotion: happy
        text: "……それが、いちばん嬉しいのだ。"

