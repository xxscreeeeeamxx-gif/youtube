      - speaker: reimu
        text: "使ううちに変わる分まで、見込む必要がありました。"
        reading: "つかう うちに かわる ぶんまで、みこむ ひつようが ありました。"
      - speaker: gishi
        emotion: sad
        text: "社長。何回やればいいんですか。"
      - speaker: zundamon
        emotion: happy
        text: "同じになるまでなのだ。"

  - id: timer
