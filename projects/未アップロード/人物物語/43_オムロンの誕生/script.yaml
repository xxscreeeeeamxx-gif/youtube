        emotion: thinking
        text: "[一真|かずま]。学校は、何を選んだの。"
      - speaker: zundamon
        emotion: normal
        text: "電気なのだ。"
      - speaker: haha
        emotion: surprised
        text: "……焼き物の家に生まれて、電気。"
      - speaker: zundamon
        emotion: normal
        text: "焼き物は、父ちゃんの手が要った。"
      - speaker: haha
        emotion: sad
        text: "……そうね。あの人しか作れなかった。"
      - speaker: zundamon
        emotion: normal
        text: "だから、店がなくなったのだ。"
      - speaker: haha
        emotion: surprised
        text: "……[一真|かずま]。"
      - speaker: zundamon
        emotion: normal
        text: "人が一人おらんようになっても、"
      - speaker: zundamon
        emotion: normal
        text: "止まらんものを作りたいのだ。"
      - speaker: reimu
        text: "1921年、電気の学校を出ます。"
        reading: "せんきゅうひゃくにじゅういちねん、でんきの がっこうお でます。"
      - speaker: reimu
        text: "そのあと京都で、小さな会社を興しました。"
        reading: "そのあと きょうとで、ちいさな かいしゃお おこしました。"
      - speaker: haha
        emotion: thinking
        text: "……うまくいってるの。"
      - speaker: zundamon
        emotion: normal
        text: "いってへん。まだ、何屋か決まってへんのだ。"

  - id: dokuritsu
