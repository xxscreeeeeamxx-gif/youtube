      - speaker: zundamon
        emotion: normal
        text: "どれくらいだ。"
      - speaker: gishi
        emotion: sad
        text: "……ほんの、わずかです。"
      - speaker: zundamon
        emotion: angry
        text: "わずかでは駄目なのだ。"
      - speaker: gishi
        emotion: surprised
        text: "人が数えるより、ずっと正確ですが。"
      - speaker: zundamon
        emotion: normal
        text: "人より正確では、意味がないのだ。"
      - speaker: gishi
        emotion: thinking
        text: "……では、何が要るのですか。"
      - speaker: zundamon
        emotion: normal
        text: "いつも同じ、が要る。"
      - speaker: zundamon
        emotion: normal
        text: "写真を撮り直したら、体に二度あたる。"
      - speaker: gishi
        emotion: surprised
        text: "……患者さんに、ですか。"
      - speaker: zundamon
        emotion: normal
        text: "そうだ。だから一回で決めるのだ。"
      - speaker: reimu
        text: "ばねの強さが変わると、時間がずれます。"
