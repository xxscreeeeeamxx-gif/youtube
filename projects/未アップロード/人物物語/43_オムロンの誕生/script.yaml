      - speaker: rentgen
        emotion: sad
        text: "レントゲンの[撮影|さつえい]時間、人が数えとるんです。"
      - speaker: zundamon
        emotion: surprised
        text: "……人が。声に出してか。"
      - speaker: rentgen
        emotion: sad
        text: "はい。いち、に、さん、と。"
      - speaker: zundamon
        emotion: thinking
        text: "……ずれますな。それ。"
      - speaker: rentgen
        emotion: sad
