      - speaker: zundamon
        emotion: normal
        text: "その人らは、どこへ行きました。"
      - speaker: tetsudo
        emotion: surprised
        text: "……ホームです。客に、案内をしとります。"
      - speaker: zundamon
        emotion: happy
        text: "それでええのだ。"

