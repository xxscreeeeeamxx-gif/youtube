      - speaker: zundamon
        emotion: normal
        text: "足りなかったのは腕じゃなくて、5人目の基本味だったのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "湯豆腐の違和感を流さなかった観察力が、全部の始まりだよ。"
      - speaker: zundamon
        emotion: normal
        text: "名前のない味に、名前をつけた。それが世界共通語になったんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "科学者の発見と、商人の執念。二人がかりの偉業だね。"
      - speaker: tsumugi
        emotion: normal
        text: "トマトもチーズも干ししいたけも、うま味の仲間だからね。"
      - speaker: zundamon
        emotion: normal
        text: "洋食のコクも中華の深みも、正体は同じ5人目なのだ。"
      - speaker: zundamon
        emotion: normal
        text: "今夜の晩ごはんの、だしの味。ちゃんと味わって食べるのだ。"
      - speaker: zundamon
        emotion: happy
        text: "あなたの舌にも、うま味センサーが標準装備なのだ！"
        telops:
          - {text: "UMAMIは、日本語", size: xl, position: middle-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: tsumugi
        emotion: happy
        text: "面白かったら、高評価とチャンネル登録で応援してね。"
      - speaker: zundamon
        emotion: normal
        text: "コメントで、あなたのいちばん好きなだしも教えてほしいのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "それでは、また次の動画で。"
      - speaker: zundamon
        emotion: happy
        text: "ご視聴、ありがとうございましたなのだ！"
        duet_with: tsumugi
