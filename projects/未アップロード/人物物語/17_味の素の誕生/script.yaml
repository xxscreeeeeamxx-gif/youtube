# うま味発見再現ドラマ・ミーム版（池田菊苗×鈴木三郎助・1899→現代）。投稿前に必ず目視レビュー。
# 新方針: ミーム版のみ1本。センシティブ場面(論争章は正確に・晩年bannenはクリーン)。
# 裏取り: 味の素グループ公式ストーリー(池田菊苗物語)/池田菊苗Wikipedia/鈴木三郎助Wikipedia/
# 国会図書館・うま味インフォメーションセンター。
# 1899ドイツ留学(オストワルト師事・体格差痛感・発明を形に)・帰国後東京帝大教授・
# 妻が買った昆布の湯豆腐(1907)→昆布12kgから30gのグルタミン酸結晶(1908年2月)→
# 「うま味」命名・5基本味・1908年7月特許→鈴木三郎助(葉山のヨード業・鈴木商店)が事業化→
# 1909年5月20日「味の素」発売→当初は不信とデマで苦戦→料理店・実演から普及→
# 志「佳良にして廉価なる調味料を造り出し滋養に富める粗食を美味ならしむること」→
# 1985ハワイでUMAMI国際合意・2000舌の受容体発見・2006胃にも→世界の共通語へ。
# 論争章: 化学調味料への俗説→グルタミン酸はトマト・チーズ・母乳にも天然/国際機関の安全評価→
# 本当の注意点はバランス。池田1936没(十大発明家)は静かに。
meta:
  title: "だしの正体を、世界の言葉にした男たち。うま味の発見【ゆっくり再現ドラマ・ミーム版】"
  slug: "ajinomoto"
  summary: "甘い、しょっぱい、すっぱい、苦い。この4つのどれでもない味がある。ドイツ留学から帰った化学者・池田菊苗は、妻が作った湯豆腐でそれに気づきます。昆布から取り出そうとした、まだ名前のない味。ずんだもんが池田を、つむぎが商人・鈴木三郎助を演じる再現ドラマです。"
  tags: ["うま味", "池田菊苗", "鈴木三郎助", "味の素", "UMAMI", "再現ドラマ", "ゆっくり", "ずんだもん", "ミーム"]
  thumbnail:
    top: "だしの正体"
    bottom: "第五の味を見つけた男"
  mode: drama
  narrator: reimu
  mobs:
    - {id: tsuma, label: "妻・貞", voice: 8, pitch: 0.03, hair: bun}
    - {id: ostwald, label: "オストワルト教授", voice: 13, pitch: -0.06, item: mustache}
    - {id: kyaku, label: "お客", voice: 8, pitch: 0.06, hair: bun}
scenes:
  - id: hook
    title: ""
    background: il_aj_kitchen
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "味の基本は、甘い、しょっぱい、すっぱい、苦い。この4つだと思ってない？"
      - speaker: zundamon
        emotion: normal
        text: "4つなのだ。理科で習ったぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "5つ目があるの。見つけたのは日本の化学者で、きっかけは晩ごはんの湯豆腐。"
      - speaker: zundamon
        emotion: surprised
        text: "湯豆腐！？スケールの差がすごいぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "その5つ目、いまや世界中で[UMAMI|うまみ]って日本語のまま呼ばれてるんだよ。"
      - speaker: zundamon
        emotion: surprised
        text: "ファッ！？日本語のまま世界デビューしてるのか！？"
      - speaker: zundamon
        emotion: thinking
        text: "……ところで、スープを自作したのだ。でも、なんか味が決まらないんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "どれどれ。……ああ、塩気はあるのに、コクがないんだね。"
      - speaker: zundamon
        emotion: normal
        text: "塩を足しても、しょっぱくなるだけで、おいしくならないぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "ちなみに、これまで何を試したの？"
      - speaker: zundamon
        emotion: normal
        text: "具を倍にした。次に肉を足した。最後に、気合いを入れた。"
      - speaker: tsumugi
        emotion: thinking
        text: "最後のは調味料じゃないね。"
      - speaker: tsumugi
        emotion: normal
        text: "足りないのは塩じゃなくて、うま味だよ。"
      - speaker: zundamon
        emotion: thinking
        text: "うま味？おいしい味、っていう雑なネーミングか？"
      - speaker: tsumugi
        emotion: normal
        text: "れっきとした味の名前。[甘味|かんみ]、[塩味|えんみ]、酸味、苦味、そしてうま味。"
      - speaker: zundamon
        emotion: surprised
        text: "基本の味、5人パーティーだったのか？"
        telops:
          - {text: "味の基本は、5つ", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: tsumugi
        emotion: normal
        text: "5人目のうま味だけ、見つかったのが100年ちょっと前なの。"
      - speaker: zundamon
        emotion: surprised
        text: "[他の|ほかの]4人より、圧倒的に新入りなんだが。"
      - speaker: tsumugi
        emotion: normal
        text: "スシ、テンプラ、ウマミ。世界の共通語だよ。"
      - speaker: tsumugi
        emotion: happy
        text: "そのスープを直しながら、聞いていこう。"
      - speaker: zundamon
        emotion: happy
        text: "聞くのだ。ボクのスープの伏線も、回収してほしいんだ。"
      - speaker: reimu
        text: "うま味。世界がUMAMIと呼ぶ、5つめの基本味です。"
        reading: "うまみ。せかいがうまみとよぶ、いつつめのきほんあじです。"
      - speaker: reimu
        text: "見つけたのは、一人の化学者と、一杯の湯豆腐でした。"
        reading: "みつけたのわ、ひとりのかがくしゃと、いっぱいのゆどうふでした。"
      - speaker: reimu
        text: "物語は、1899年のドイツから始まります。"
        reading: "ものがたりわ、せんはっぴゃくきゅうじゅうきゅうねんのどいつからはじまります。"
  - id: era1899
    title: "1899・ドイツ留学"
    background: il_aj_germany
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.15, tag: "池田", flip: true}
    cuts:
      - speaker: reimu
        text: "1899年、ドイツ・ライプツィヒ。"
        reading: "せんはっぴゃくきゅうじゅうきゅうねん、どいつ、らいぷつぃひ。"
        video: assets/clips/era_aj1899.mp4
        video_full: true
        pause_after: 0.8
  - id: germany
    title: ""
    background: il_aj_germany
    bgm: pastel_house
    stage:
      - {who: zundamon, x: 0.24, tag: "池田", flip: true}
      - {who: ostwald, x: 0.72}
    cuts:
      - speaker: reimu
        text: "化学者の池田菊苗は、ドイツに留学していました。"
        reading: "かがくしゃのいけだきくなえわ、どいつにりゅうがくしていました。"
      - speaker: ostwald
        text: "イケダ君。今日の実験データを、見せてもらおう。"
      - speaker: zundamon
        emotion: normal
        text: "はい、教授。まとめてあります。"
      - speaker: reimu
        text: "師は、のちにノーベル化学賞を受けるオストワルト教授でした。"
        reading: "しわ、のちにのーべるかがくしょうをうけるおすとわるときょうじゅでした。"
      - speaker: zundamon
        emotion: thinking
        text: "（それにしても……この国の人は、体が大きいのだ。）"
      - speaker: zundamon
        emotion: sad
        text: "（ボクたち日本人と、頭ひとつ違う。栄養の差なのだ……。）"
      - speaker: ostwald
        text: "どうした、浮かない顔だな。"
      - speaker: zundamon
        emotion: normal
        text: "母国の食生活を、考えていました。"
      - speaker: zundamon
        emotion: normal
        text: "日本の庶民の食事は、質素です。麦飯と、漬物と、汁だけの日も。"
      - speaker: ostwald
        text: "こちらの食事は、どうかね。"
      - speaker: zundamon
        emotion: normal
        text: "肉とチーズとパン。カロリーの桁が、違います。"
      - speaker: zundamon
        emotion: thinking
        text: "（この差が続けば、国の体力の差になるのだ……。）"
      - speaker: ostwald
        text: "栄養は、国力の土台だ。科学者が取り組むべき課題だな。"
      - speaker: zundamon
        emotion: normal
        text: "はい。いつか、この問題に化学で挑みたいのです。"
      - speaker: ostwald
        text: "イケダ君。science は、論文で終わらせるな。"
      - speaker: ostwald
        text: "発明を、世の中で使われる形にしてこそ、価値がある。"
      - speaker: zundamon
        emotion: normal
        text: "……発明を、形に。胸に刻みます。"
      - speaker: reimu
        text: "体格の差への衝撃と、師の言葉。ふたつが池田の土台になります。"
        reading: "たいかくのさえのしょうげきと、しのことば。ふたつがいけだのどだいになります。"
  - id: kadai
    title: "粗食を、うまくせよ"
    background: il_aj_lab
    bgm: curious
    stage:
      - {who: zundamon, x: 0.24, tag: "池田", flip: true}
      - {who: tsumugi, x: 0.76, tag: "鈴木"}
    cuts:
      - speaker: reimu
        text: "帰国した池田は、東京帝国大学の教授になりました。"
        reading: "きこくしたいけだわ、とうきょうていこくだいがくのきょうじゅになりました。"
      - speaker: reimu
        text: "研究室には、事業家の鈴木三郎助も出入りしていました。"
        reading: "けんきゅうしつにわ、じぎょうかのすずきさぶろうすけもでいりしていました。"
      - speaker: tsumugi
        emotion: normal
        text: "池田先生、うちのヨード事業の相談、ありがとうございました。"
      - speaker: zundamon
        emotion: normal
        text: "鈴木さんの工場は、海藻を扱うのが上手なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "海藻から薬の材料を作るのが、うちの家業ですからね。"
      - speaker: zundamon
        emotion: thinking
        text: "ときに鈴木さん。日本人の食事を、どう思うのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "うちの職人たちの弁当は、麦飯に漬物。まあ、質素ですね。"
      - speaker: zundamon
        emotion: normal
        text: "栄養のある物を食べたくても、まずくて安い物しか買えない。"
      - speaker: tsumugi
        emotion: normal
        text: "うまい物は、高い。世の常です。"
      - speaker: zundamon
        emotion: normal
        text: "なら、安い食事をうまくする調味料があれば、いいのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "安くて、うまくなる魔法の粉ですか。あったら大発明ですよ。"
      - speaker: zundamon
        emotion: normal
        text: "粗食が進めば、栄養が進む。栄養が進めば、体が変わるのだ。"
      - speaker: reimu
        text: "佳良にして廉価な調味料で、粗食をうまく。それが池田の志でした。"
        reading: "かりょうにしてれんかなちょうみりょうで、そしょくをうまく。それがいけだのこころざしでした。"
  - id: yudofu
    title: "運命の、湯豆腐"
    background: il_aj_home
    bgm: you_and_me
    stage:
      - {who: zundamon, x: 0.24, tag: "池田", flip: true}
      - {who: tsuma, x: 0.72}
    cuts:
      - speaker: reimu
        text: "1907年のある晩。[池田家|いけだけ]の食卓に、湯豆腐が出ました。"
        reading: "せんきゅうひゃくななねんのあるばん。いけだけのしょくたくに、ゆどうふがでました。"
      - speaker: tsuma
        text: "あなた、今夜は湯豆腐ですよ。いい昆布が手に入ったの。"
      - speaker: zundamon
        emotion: normal
        text: "ほう、いい昆布とは、ぜいたくなのだ。"
      - speaker: tsuma
        text: "催し物の即売で、上等なのを見つけたんです。"
      - speaker: zundamon
        emotion: normal
        text: "湯豆腐は、昆布が命なのだ。楽しみなんだ。"
      - speaker: tsuma
        text: "お豆腐も、いつものお店の、いいのを選びましたよ。"
      - speaker: zundamon
        emotion: happy
        text: "いただきます。……うん、うまいのだ。"
      - speaker: zundamon
        emotion: thinking
        text: "…………ん？"
      - speaker: tsuma
        text: "どうしました？"
      - speaker: zundamon
        emotion: thinking
        text: "この、だしの味……甘く、ないのだ。"
      - speaker: tsuma
        text: "ええ、お砂糖は入れてませんから。"
      - speaker: zundamon
        emotion: thinking
        text: "塩辛くもない。酸っぱくもない。苦くも、ない。"
      - speaker: tsuma
        text: "あらあら、味見の顔が、実験の顔になってますよ。"
      - speaker: zundamon
        emotion: surprised
        text: "[貞|てい]。この味は、4つの基本味の、どれでもないのだ。"
        se: don
        telops:
          - {text: "どの基本味でも、ない", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: tsuma
        text: "でも、たしかに、おいしい味ですよねえ。"
      - speaker: zundamon
        emotion: surprised
        text: "そう、確かに存在する。なのに、名前がない味なのだ。"
      - speaker: zundamon
        emotion: normal
        text: "この正体を、突き止めるのだ。昆布、あるだけ買ってくるのだ。"
      - speaker: tsuma
        text: "はいはい。うちの台所が、実験室になりそうですねえ。"
      - speaker: reimu
        text: "一杯の湯豆腐が、世紀の研究の始まりでした。"
        reading: "いっぱいのゆどうふが、せえきのけんきゅうのはじまりでした。"
  - id: naze
    title: "そもそも、味とは何か"
    background: il_aj_lab
    bgm: curious
    stage:
      - {who: zundamon, x: 0.24, tag: "池田", flip: true}
      - {who: tsumugi, x: 0.76, tag: "鈴木"}
    cuts:
      - speaker: tsumugi
        emotion: thinking
        text: "先生、だしの味の研究を始めたって、本当ですか。"
      - speaker: zundamon
        emotion: normal
        text: "本当だ。鈴木さん、そもそも味とは[何|なん]なのか、知ってるか。"
      - speaker: tsumugi
        emotion: normal
        text: "舌で感じる……甘い、塩辛い、酸っぱい、苦い、ですか。"
      - speaker: zundamon
        emotion: normal
        text: "今の学問では、その4つが基本とされているんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "組み合わせれば、どんな味も説明できる、と。"
      - speaker: zundamon
        emotion: normal
        text: "でも、昆布だしの味は、4つのどれでも説明できないんだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "あれ、でも先生。[辛い|からい]は？辛味は基本味じゃないんですか。"
      - speaker: zundamon
        emotion: normal
        text: "いい質問なのだ。実は辛味は、味ではないんだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "えっ。あんなに主張が強いのに？"
      - speaker: zundamon
        emotion: normal
        text: "[辛さ|からさ]は、痛みや熱の感覚なのだ。舌が、ヒリヒリしてるだけなんだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "だから[辛い|からい]ものを食べると、汗が出るのか。"
      - speaker: zundamon
        emotion: normal
        text: "[渋味|しぶみ]も、口の中が縮む触覚に近い。味のセンサーとは別なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "基本味を名乗るには、専用センサーの席が要るんですね。"
      - speaker: tsumugi
        emotion: thinking
        text: "うーん。でも味なんて、気分にもよるでしょう。"
      - speaker: zundamon
        emotion: normal
        text: "いいや。舌に、専用のセンサーがあるはずなんだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "第五のセンサーが、隠しコマンドみたいに残ってると？"
      - speaker: zundamon
        emotion: normal
        text: "そうだ。誰も見つけてない、5人目の基本味なのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "学会の常識に、真っ向勝負ですね。"
      - speaker: zundamon
        emotion: normal
        text: "常識は、更新するためにあるんだ。"
      - speaker: reimu
        text: "基本味は4つ。その常識への、挑戦でした。"
        reading: "きほんあじわよっつ。そのじょうしきえの、ちょうせんでした。"
  - id: kenkyu
    title: "昆布12キロとの、格闘"
    background: il_aj_lab
    bgm: kinakusai
    stage:
      - {who: zundamon, x: 0.24, tag: "池田", flip: true}
      - {who: tsuma, x: 0.72}
    cuts:
      - speaker: reimu
        text: "研究は、地道な煮出し作業から始まりました。"
        reading: "けんきゅうわ、じみちなにだしさぎょうからはじまりました。"
      - speaker: zundamon
        emotion: normal
        text: "昆布を煮出して、煮詰めて、余計な成分を取り除くんだ。"
      - speaker: tsuma
        text: "あなた、今日も研究室に泊まりですか。"
      - speaker: zundamon
        emotion: normal
        text: "だしの正体に、あと少しで手が届きそうなんだ。"
      - speaker: tsuma
        text: "台所の昆布、また減ってましたよ。"
      - speaker: zundamon
        emotion: normal
        text: "すまない。実験用が、足りなくなったんだ。"
      - speaker: reimu
        text: "使った昆布は、およそ12キロにのぼりました。"
        reading: "つかったこんぶわ、およそじゅうにきろにのぼりました。"
      - speaker: zundamon
        emotion: thinking
        text: "煮汁から、砂糖のような甘い成分を除いて、塩の成分も除いて……。"
      - speaker: zundamon
        emotion: normal
        text: "残った液を、ゆっくり冷やして、結晶を待つのだ。"
      - speaker: tsuma
        text: "研究のほう、進んでいますか。"
      - speaker: zundamon
        emotion: sad
        text: "煮詰めても煮詰めても、狙いの成分だけが、残ってくれないのだ。"
      - speaker: tsuma
        text: "根気くらべですねえ。お夜食、置いておきますよ。"
      - speaker: zundamon
        emotion: normal
        text: "すまないのだ。……よし、もう一晩、粘るのだ。"
      - speaker: reimu
        text: "そして1908年2月。"
        reading: "そしてせんきゅうひゃくはちねんにがつ。"
      - speaker: zundamon
        emotion: surprised
        text: "……出た。小さな結晶が、出てきたのだ。"
      - speaker: zundamon
        emotion: thinking
        text: "12キロの昆布から、たった30グラム。……なめてみるのだ。"
        telops:
          - {text: "12キロから、30グラム", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: zundamon
        emotion: surprised
        text: "…………これだ！湯豆腐の、あの味なのだ！"
      - speaker: reimu
        text: "結晶の正体は、グルタミン酸。うま味の主成分でした。"
        reading: "けっしょうのしょうたいわ、ぐるたみんさん。うまみのしゅせえぶんでした。"
      - speaker: zundamon
        emotion: happy
        text: "見つけたのだ。5人目の基本味、ここに確保なのだ！"
