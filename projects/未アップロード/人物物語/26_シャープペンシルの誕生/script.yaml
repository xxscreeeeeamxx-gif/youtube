# シャープペンシル再現ドラマ・ミーム版（[早川徳次|はやかわとくじ]・1893→1980）。投稿前に必ず目視レビュー。
# 配役: ずんだもん=早川徳次 / つむぎ=妻・文子（結婚〜震災）＋現代パートは素のつむぎ / ナレ=ゆっくり
# ★ミーム完全禁止の章: inoue（恩人）/ shinsai・kawa・fumiko（震災と死別）/ shitsumei（失明者の工場）
# 裏取り: 早川徳次(シャープ)Wikipedia / シャープ公式「シャープの歩み」創業者 /
#   岡田晃「関東大震災を乗り越えた先人の教訓」/ シャープ特選工業70年史 / ライオン事務器
# 確定事実:
#   1893-11-3 東京市日本橋区久松町42番地生まれ。父・早川政吉、母・花子。三男
#   生後1年11か月で出野家の養子。継養母に厳しく当たられ食事も満足に与えられず
#   目の不自由な近所の井上という女性が手を引いて坂田芳松の店へ連れて行った
#   1901-9-15 出野家を出る。本所区の錺屋・坂田芳松に丁稚奉公。1909-4-15 に7年7か月の年季明け
#   1912 徳尾錠（ベルトに穴を開けないバックル）登録実用新案第25356号。33グロス=4,752個の受注で独立
#   1915 早川姓に復籍。早川式繰出鉛筆を出願（特許は1920）。兄・政治が部品の仕事を持ち込んだ
#   当初「和服には向かない」「金属製は冷たい」と全く売れず。第一次大戦で欧米が品薄になり
#   横浜の商館から大量注文。1916 関西総代理店・福井商店の勧めで
#   「エバー・レディ・シャープ・ペンシル」に改名。従業員200人超に
#   1923-9-1 関東大震災。妻・文子と子2人（9歳と7歳）が避難中に火に巻かれ川へ。子2人は死亡、
#   文子も約2か月後に死亡。工場焼失。徳次自身も大火傷。借金2万円
#   1923-11 大阪市浪速区の日本文具製造へ。社長・中山豊三と親会社 中山太陽堂社長・中山太一に面会。
#   機械類（2万2000円相当）を譲渡し、48種類の特許を無償で使わせる条件で清算
#   1924-8 契約満了で退社。1924-9-1（震災からちょうど1年後）大阪に早川金属工業研究所を設立。
#   東京時代の従業員3人と。金属加工の下請けから
#   1925-4 国産第1号の鉱石ラジオ受信機。1944 失明軍人が働く早川電機分工場。
#   1950 合資会社特選金属工場。1953-2 国産第1号テレビ TV3-14T（17万5000円）。
#   1962 国産第1号電子レンジ / 大阪市立早川福祉会館に寄付。
#   1964 世界初のオールトランジスタ電卓 コンペット CS-10A。1980-6-24 逝去、享年86
meta:
  title: "【シャープペンシルの誕生】全部失って、大阪へ【ずんだもん解説】"
  slug: "sharp-pencil"
  summary: "シャープという名前は、会社より先に商品にありました。東京の下町で育った早川徳次が21歳で作った金属製の繰出鉛筆です。売れず、海外で評価され、従業員200人まで伸びた矢先に関東大震災が来ます。何を手放して大阪へ向かったのか。ずんだもんが徳次を演じる再現ドラマです。"
  tags: ["シャープペンシル", "早川徳次", "シャープ", "関東大震災", "明治", "大正", "再現ドラマ", "ゆっくり", "ずんだもん", "発明", "ミーム"]
  thumbnail:
    top: "全部失って大阪へ"
    bottom: "シャープの名前の由来"
  mode: drama
  narrator: reimu
  mobs:
    - {id: youbo, label: "継養母", voice: 8, pitch: -0.07}
    - {id: inoue, label: "井上", voice: 8, pitch: -0.15, hair: bun}
    - {id: sakata, label: "坂田親方", voice: 13, pitch: -0.05, item: mustache}
    - {id: masaji, label: "兄・政治", voice: 12}
    - {id: tonya, label: "文具問屋", voice: 13, pitch: 0.07, item: hat}
    - {id: shokan, label: "商館の人", voice: 12, pitch: 0.09}
    - {id: taichi, label: "中山太一", voice: 13, pitch: -0.11, item: book}
    - {id: shain, label: "従業員", voice: 12, pitch: -0.06}
    - {id: kouin, label: "工員", voice: 42}
scenes:
  - id: hook
    title: ""
    background: il_sp_ima
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "シャープって、会社の名前だと思ってる？"
      - speaker: zundamon
        emotion: normal
        text: "思ってるのだ。テレビとか、電卓とかの。"
      - speaker: tsumugi
        emotion: normal
        text: "先に商品があったの。それがシャープペンシル。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "……えっ。会社が先じゃないのか？"
      - speaker: tsumugi
        emotion: normal
        text: "作った人はね。その商品も、工場も、家族も、いっぺんに失ってる。"
        telops:
          - {text: "シャープは、商品名が先", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#0A2A3A", glow: "#2A9AD8", anim: up}
      - speaker: zundamon
        emotion: sad
        text: "情緒どうなってんの。重い話が急に来たぞ。"
      - speaker: tsumugi
        emotion: happy
        text: "その話をする前に。ずんだもん、それ何本目？"
      - speaker: zundamon
        emotion: happy
        text: "シャーペンの芯なのだ。今ので7本目。"
      - speaker: tsumugi
        emotion: surprised
        text: "7本。折りすぎでしょ。"
      - speaker: zundamon
        emotion: normal
        text: "ボクは芯を長く出す派なのだ。そういう界隈があるんだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "どのくらい出すの。"
      - speaker: zundamon
        emotion: happy
        text: "1センチなのだ。攻めの筆記なんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "攻めた結果が、7本折れてるんだけど。"
      - speaker: zundamon
        emotion: normal
        text: "……分かった。今日は短くするのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "お、えらい。"
      - speaker: zundamon
        emotion: happy
        text: "だから今、芯をぜんぶ引っ込めたのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。それだと書けないよ。"
      - speaker: zundamon
        emotion: normal
        text: "……あ。じゃあ出すのだ。カチカチカチカチ。"
      - speaker: tsumugi
        emotion: surprised
        text: "出しすぎ。全部出てきてる。"
      - speaker: zundamon
        emotion: sad
        text: "床に落ちたのだ。8本目。完全に詰んだぞ。"
      - speaker: tsumugi
        emotion: happy
        text: "その、押すと芯が出てくる仕組みね。"
      - speaker: zundamon
        emotion: normal
        text: "うん。当たり前すぎて、考えたこともないのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "当たり前になるまでに、100年以上かかってるの。"
      - speaker: zundamon
        emotion: surprised
        text: "100年！？ たかが鉛筆にか。"
      - speaker: tsumugi
        emotion: normal
        text: "今の形にしたのは、日本の職人だよ。1915年。"
      - speaker: zundamon
        emotion: surprised
        text: "日本！？ ファッ！？"
      - speaker: tsumugi
        emotion: normal
        text: "そのとき21歳。工場は、自分ひとりで建てたばかり。"
      - speaker: zundamon
        emotion: thinking
        text: "……21歳で工場。経歴がバグってるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "ただ、そこに行くまでが長いの。学校に通えてないから。"
      - speaker: zundamon
        emotion: surprised
        text: "え。学校、行ってないのか？"
      - speaker: tsumugi
        emotion: normal
        text: "うん。8歳で奉公に出てる。手を引いてくれた人がいてね。"
      - speaker: zundamon
        emotion: normal
        text: "……聞くのだ。"
      - speaker: reimu
        text: "シャープペンシル。押すと芯が出てくる、あの鉛筆です。"
        reading: "しゃーぷぺんしる。おすとしんがでてくる、あのえんぴつです。"
      - speaker: reimu
        text: "作ったのは、東京の下町で育った職人でした。"
        reading: "つくったのわ、とうきょうのしたまちでそだったしょくにんでした。"
      - speaker: reimu
        text: "物語は、1893年の日本橋から始まります。"
        reading: "ものがたりわ、せんはっぴゃくきゅうじゅうさんねんのにほんばしからはじまります。"
  - id: deno
    title: "1893・もらわれた子"
    background: il_sp_deno
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.3, tag: "徳次", flip: true, scale: 0.75}
      - {who: youbo, x: 0.72}
    cuts:
      - speaker: reimu
        text: "1893年11月3日、東京市日本橋区に早川徳次が生まれます。"
        reading: "せんはっぴゃくきゅうじゅうさんねんじゅういちがつみっか、とうきょうしにほんばしくにはやかわとくじがうまれます。"
      - speaker: reimu
        text: "早川家の三男で、上に兄が二人いました。"
        reading: "はやかわけのさんなんで、うえにあにがふたりいました。"
      - speaker: reimu
        text: "生後1年11か月で、出野という家の養子になります。"
        reading: "せいごいちねんじゅういっかげつで、でのというええのようしになります。"
      - speaker: youbo
        emotion: normal
        text: "[徳次|とくじ]。その箱、まだ終わってないの。"
      - speaker: zundamon
        emotion: normal
        text: "……あと10個です。"
      - speaker: youbo
        emotion: angry
        text: "終わるまで、ごはんはなし。"
      - speaker: zundamon
        emotion: sad
        text: "……はい。"
      - speaker: reimu
        text: "継養母は徳次に厳しく当たり、食事も満足に与えませんでした。"
        reading: "けいようぼわとくじにきびしくあたり、しょくじもまんぞくにあたえませんでした。"
      - speaker: youbo
        emotion: normal
        text: "うちは、あんたを食べさせてやってるんだからね。"
      - speaker: zundamon
        emotion: normal
        text: "……はい。"
      - speaker: youbo
        emotion: normal
        text: "学校？ そんな[暇|ひま]があったら、手を動かしな。"
      - speaker: zundamon
        emotion: sad
        text: "……はい。"
      - speaker: reimu
        text: "近所の子が学校へ通う時間、徳次は内職をしていました。"
        reading: "きんじょのこががっこうえかようじかん、とくじわないしょくをしていました。"
      - speaker: zundamon
        emotion: thinking
        text: "……箱を100個折ると、指の腹が固くなるのだ。"
      - speaker: zundamon
        emotion: normal
        text: "固くなると、紙で切れなくなる。得したのかな。"
      - speaker: reimu
        text: "この家に、徳次の味方はいませんでした。"
        reading: "このいえに、とくじのみかたわいませんでした。"
  - id: inoue
    title: "手を引いた人"
    background: il_sp_michi
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.3, tag: "徳次", flip: true, scale: 0.75}
      - {who: inoue, x: 0.72}
    cuts:
      - speaker: reimu
        text: "近所に、目の不自由な井上という女性が住んでいました。"
        reading: "きんじょに、めのふじゆうないのうえというじょせいがすんでいました。"
      - speaker: inoue
        emotion: normal
        text: "そこにいるのは、[徳次|とくじ]ちゃんかい。"
      - speaker: zundamon
        emotion: surprised
        text: "……はい。なんで分かるんですか。"
      - speaker: inoue
        emotion: happy
        text: "足の音。あんたの歩き方は、いつも急いでる。"
      - speaker: zundamon
        emotion: normal
        text: "……怒られるから、急いでるんです。"
      - speaker: inoue
        emotion: normal
        text: "今日も学校は行ってないのかい。"
      - speaker: zundamon
        emotion: sad
        text: "……はい。"
      - speaker: inoue
        emotion: normal
        text: "手を出してごらん。"
      - speaker: zundamon
        emotion: surprised
        text: "手、ですか。"
      - speaker: inoue
        emotion: normal
        text: "……固いね。まだ小さい手なのに。"
      - speaker: zundamon
        emotion: normal
        text: "……箱を折ってるので。"
      - speaker: inoue
        emotion: normal
        text: "この子は、字を習うより先に、手を覚えたほうがいい。"
      - speaker: reimu
        text: "井上は、出野家に一つの提案をします。"
        reading: "いのうえわ、でのけにひとつのていあんをします。"
      - speaker: reimu
        text: "学校に行かせないなら、手に職をつけさせてやってくれ、と。"
        reading: "がっこうにいかせないなら、てにしょくをつけさせてやってくれと。"
      - speaker: inoue
        emotion: normal
        text: "知り合いに、[錺屋|かざりや]の親方がいるんだよ。"
      - speaker: zundamon
        emotion: thinking
        text: "……かざりや。"
      - speaker: inoue
        emotion: normal
        text: "金物に細工をする仕事。ちゃんと覚えれば、食っていける。"
      - speaker: zundamon
        emotion: normal
        text: "……ボクに、できますか。"
      - speaker: inoue
        emotion: happy
        text: "分からないよ。でも、ここにいるよりはいい。"
      - speaker: inoue
        emotion: normal
        text: "さ、行こうか。手を貸しな。"
      - speaker: zundamon
        emotion: surprised
        text: "……え。今からですか。"
      - speaker: inoue
        emotion: normal
        text: "今からだよ。明日にしたら、明日にはならない。"
      - speaker: reimu
        text: "1901年9月15日。徳次は出野家を出ました。"
        reading: "せんきゅうひゃくいちねんくがつじゅうごにち。とくじわでのけをでました。"
      - speaker: reimu
        text: "目の見えない女性が、7歳の子の手を引いて歩きます。"
        reading: "めのみえないじょせいが、ななさいのこのてをひいてあるきます。"
      - speaker: zundamon
        emotion: normal
        text: "……[井上|いのうえ]さん。道、分かるんですか。"
      - speaker: inoue
        emotion: happy
        text: "何十年も歩いた道だよ。目より足が覚えてる。"
      - speaker: zundamon
        emotion: thinking
        text: "……遠いですか。"
      - speaker: inoue
        emotion: normal
        text: "1時間くらいかね。まあ、話しながら行けばすぐだよ。"
      - speaker: reimu
        text: "本所まで、およそ1時間。二人は歩いて行きました。"
        reading: "ほんじょまで、およそいちじかん。ふたりわあるいていきました。"
      - speaker: zundamon
        emotion: normal
        text: "……あの。ひとつ聞いていいですか。"
      - speaker: inoue
        emotion: normal
        text: "なんだい。"
      - speaker: zundamon
        emotion: normal
        text: "なんで、ボクなんですか。"
      - speaker: inoue
        emotion: normal
        text: "……さあね。急いで歩く音が、気になっただけだよ。"
      - speaker: zundamon
        emotion: sad
        text: "……それだけで。"
      - speaker: inoue
        emotion: happy
        text: "それだけで十分だろ。ほら、手が離れる。"
      - speaker: reimu
        text: "徳次は後年まで、この手の温かさを覚えていたといいます。"
        reading: "とくじわこうねんまで、このてのあたたかさをおぼえていたといいます。"
  - id: kazariya
    title: "7年7か月"
    background: il_sp_kazariya
    bgm: 10do
    stage:
      - {who: zundamon, x: 0.3, tag: "徳次", flip: true, scale: 0.8}
      - {who: sakata, x: 0.72}
    cuts:
      - speaker: reimu
        text: "奉公先は、本所の錺屋でした。"
        reading: "ほうこうさきわ、ほんじょのかざりやでした。"
      - speaker: reimu
        text: "親方の名は、坂田芳松といいます。"
        reading: "おやかたのなわ、さかたよしまつといいます。"
      - speaker: sakata
        emotion: normal
        text: "おい、小僧。まず床を掃け。"
      - speaker: zundamon
        emotion: normal
        text: "はい。……あの、細工は。"
      - speaker: sakata
        emotion: angry
        text: "3年早い。"
      - speaker: zundamon
        emotion: sad
        text: "3年。……チュートリアルが長すぎるのだ。"
      - speaker: sakata
        emotion: normal
        text: "床が読めない奴に、金物は読めん。"
      - speaker: zundamon
        emotion: thinking
        text: "……床を、読む。"
      - speaker: reimu
        text: "当時の職人の世界に、教科書はありません。"
        reading: "とうじのしょくにんのせかいに、きょうかしょわありません。"
      - speaker: reimu
        text: "手元を見て盗み、手が覚えるまで繰り返すだけでした。"
        reading: "てもとをみてぬすみ、てがおぼえるまでくりかえすだけでした。"
      - speaker: zundamon
        emotion: normal
        text: "親方。今日の削り、見てもらえますか。"
      - speaker: sakata
        emotion: normal
        text: "……ふん。角が甘い。"
      - speaker: zundamon
        emotion: normal
        text: "はい。もう一回やります。"
      - speaker: sakata
        emotion: surprised
        text: "おい。もう夜中だぞ。"
      - speaker: zundamon
        emotion: happy
        text: "夜中のほうが、静かでよく見えるのだ。"
      - speaker: sakata
        emotion: thinking
        text: "……変な小僧だな。"
      - speaker: zundamon
        emotion: normal
        text: "ここを追い出されたら、帰る家がないんです。"
      - speaker: sakata
        emotion: sad
        text: "……そうか。"
      - speaker: zundamon
        emotion: happy
        text: "だから、フルコミットします。"
      - speaker: sakata
        emotion: normal
        text: "働くのはいい。だが、目も休めろ。"
      - speaker: reimu
        text: "1909年4月15日。7年7か月の年季を勤め上げました。"
        reading: "せんきゅうひゃくくねんしがつじゅうごにち。ななねんななかげつのねんきをつとめあげました。"
      - speaker: zundamon
        emotion: normal
        text: "親方。長いあいだ、ありがとうございました。"
      - speaker: sakata
        emotion: normal
        text: "……おい、[徳次|とくじ]。"
      - speaker: zundamon
        emotion: normal
        text: "はい。"
      - speaker: sakata
        emotion: normal
        text: "お前の手は、もう俺のより速い。"
      - speaker: zundamon
        emotion: surprised
        text: "……そんなことは。"
      - speaker: sakata
        emotion: happy
        text: "速いだけだ。深さはこれからだ。"
      - speaker: zundamon
        emotion: happy
        text: "……最後の最後まで、塩対応なのだ。"
  - id: tokubijo
    title: "1912・穴を開けない留め具"
    background: il_sp_kazariya
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, tag: "徳次", flip: true}
      - {who: masaji, x: 0.72}
    cuts:
      - speaker: reimu
        text: "1912年。徳次は一つの金具を考えます。"
        reading: "せんきゅうひゃくじゅうにねん。とくじわひとつのかなぐをかんがえます。"
      - speaker: masaji
        emotion: normal
        text: "[徳次|とくじ]。何をにらんでるんだ。"
      - speaker: zundamon
        emotion: normal
        text: "ベルトなのだ。兄さん、これ変じゃないか。"
      - speaker: masaji
        emotion: surprised
        text: "変？ 普通のベルトだろ。"
      - speaker: zundamon
        emotion: normal
        text: "穴が5つしかないのだ。太ったら人生オワタだぞ。"
      - speaker: masaji
        emotion: happy
        text: "……そりゃそうだけど。穴を足せばいいだろ。"
      - speaker: zundamon
        emotion: normal
        text: "足したら、革が弱くなる。そこから切れるのだ。"
      - speaker: masaji
        emotion: thinking
        text: "……言われてみれば。"
