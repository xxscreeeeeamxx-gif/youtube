        reading: "はやかわでんきこうぎょうわ、のちにしゃめいそのものをしゃーぷとします。"
      - speaker: reimu
        text: "由来は、あの繰出鉛筆の商品名でした。"
        reading: "ゆらいわ、あのくりだしえんぴつのしょうひんめいでした。"
      - speaker: zundamon
        emotion: thinking
        text: "……テレビも、電卓も、あの鉛筆の名前だったのか。"
      - speaker: tsumugi
        emotion: happy
        text: "そうだよ。いつでも、とがってる、っていう意味の。"
      - speaker: zundamon
        emotion: normal
        text: "……失った[側|がわ]が、名前だけ抱えて西に行ったのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。そして、その名前で百年やってる。"
      - speaker: zundamon
        emotion: surprised
        text: "百年！ ……重すぎるのだ、由来が。"
  - id: shitsumei
    title: "手を引く側になる"
    background: il_sp_shitsumei
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.3, tag: "徳次", flip: true}
      - {who: kouin, x: 0.72}
    cuts:
      - speaker: reimu
        text: "1944年、徳次は目の見えない人が働く分工場を作ります。"
        reading: "せんきゅうひゃくよんじゅうよねん、とくじわめのみえないひとがはたらくぶんこうじょうをつくります。"
      - speaker: kouin
        emotion: normal
        text: "社長さん。わしらに、本当に務まりますか。"
      - speaker: zundamon
        emotion: normal
        text: "務まるのだ。プレスは、目より手の仕事だぞ。"
      - speaker: kouin
        emotion: surprised
        text: "……手の。"
      - speaker: zundamon
        emotion: normal
        text: "型に置いて、押す。位置は、指が覚えるのだ。"
      - speaker: kouin
        emotion: thinking
        text: "……覚えられますかね。"
      - speaker: zundamon
        emotion: normal
        text: "覚えるのだ。ボクも、そうやって覚えたぞ。"
      - speaker: reimu
        text: "作業台の位置も通路も、手で分かるように作り直されました。"
        reading: "さぎょうだいのいちもつうろも、てでわかるようにつくりなおされました。"
      - speaker: kouin
        emotion: normal
        text: "社長さん。ひとつ、伺ってもいいですか。"
      - speaker: zundamon
        emotion: normal
        text: "どうぞ。"
      - speaker: kouin
        emotion: normal
        text: "なんで、わしらなんですか。"
      - speaker: zundamon
        emotion: surprised
        text: "……。"
      - speaker: kouin
        emotion: normal
        text: "情けをかけてくださるなら、金をくれたほうが早い。"
      - speaker: zundamon
        emotion: normal
        text: "……情けではないのだ。"
      - speaker: kouin
        emotion: thinking
        text: "……では。"
      - speaker: zundamon
        emotion: normal
        text: "働いて、自分で食える。それが本当の助けだと思ってるぞ。"
      - speaker: kouin
        emotion: normal
        text: "……。"
      - speaker: zundamon
        emotion: normal
        text: "……それに、ボクは昔、手を引いてもらったのだ。"
      - speaker: kouin
        emotion: surprised
        text: "手を。"
      - speaker: zundamon
        emotion: normal
        text: "目の見えない人に、1時間、引かれて歩いたぞ。"
      - speaker: kouin
        emotion: normal
        text: "……[その方|そのかた]は。"
      - speaker: zundamon
        emotion: sad
        text: "……名前しか覚えてないのだ。[井上|いのうえ]さんという。"
      - speaker: kouin
        emotion: normal
        text: "……。"
      - speaker: zundamon
        emotion: normal
        text: "手が、温かかった。それだけは、はっきり覚えてるぞ。"
      - speaker: reimu
        text: "1950年、この工場は合資会社特選金属工場として独立します。"
        reading: "せんきゅうひゃくごじゅうねん、このこうじょうわごうしがいしゃとくせんきんぞくこうじょうとしてどくりつします。"
  - id: sengo
    title: "国産第1号が並ぶ"
    background: il_sp_radio
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, tag: "徳次", flip: true}
      - {who: shain, x: 0.72}
    cuts:
      - speaker: reimu
        text: "1953年2月、国産第1号のテレビを発売します。"
        reading: "せんきゅうひゃくごじゅうさんねんにがつ、こくさんだいいちごうのてれびをはつばいします。"
      - speaker: shain
        emotion: happy
        text: "社長、値段が決まりました。17万5000円です。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "……17万5000円。無課金では無理なのだ。"
      - speaker: shain
        emotion: sad
        text: "当時の大卒の初任給が、月に1万円いかないくらいで。"
      - speaker: zundamon
        emotion: thinking
        text: "……一年半、まるまる働いて1台か。"
      - speaker: shain
        emotion: normal
        text: "誰が買うんでしょうね。"
      - speaker: zundamon
        emotion: normal
        text: "最初は、街の人が集まって見るのだ。"
      - speaker: shain
        emotion: surprised
        text: "1台をみんなでですか。実質、無料公開ですね。"
      - speaker: zundamon
        emotion: happy
        text: "そこから始めればいいのだ。ラジオもそうだったぞ。"
      - speaker: reimu
        text: "1962年には国産第1号の電子レンジを発売します。"
        reading: "せんきゅうひゃくろくじゅうにねんにわこくさんだいいちごうのでんしれんじをはつばいします。"
      - speaker: shain
        emotion: normal
        text: "社長。次は計算機だと聞きました。"
      - speaker: zundamon
        emotion: happy
        text: "そうなのだ。歯車をやめて、全部電気にするぞ。"
      - speaker: shain
        emotion: surprised
        text: "全部……ですか。"
      - speaker: zundamon
        emotion: normal
        text: "トランジスタだけで作るのだ。世界のどこもやってないぞ。"
      - speaker: reimu
        text: "1964年、世界初のオールトランジスタ電卓を完成させます。"
        reading: "せんきゅうひゃくろくじゅうよねん、せかいはつのおーるとらんじすたでんたくをかんせいさせます。"
      - speaker: reimu
        text: "コンペット、CS-10A。ここから電卓の競争が始まりました。"
        reading: "こんぺっと、しーえすじゅうえー。ここからでんたくのきょうそうがはじまりました。"
      - speaker: shain
        emotion: happy
        text: "社長。鉛筆から、ずいぶん遠くまで来ましたね。"
      - speaker: zundamon
        emotion: thinking
        text: "……遠いか？"
      - speaker: shain
        emotion: surprised
        text: "遠いですよ。鉛筆と電卓ですよ。"
      - speaker: zundamon
        emotion: normal
        text: "同じなのだ。人が手で書く手間を、機械が肩代わりする。"
      - speaker: shain
        emotion: thinking
        text: "……あ。"
      - speaker: zundamon
        emotion: happy
        text: "削る手間。計算する手間。減らしてるのは、いつも手間だぞ。"
  - id: bannen
    title: "1980・享年86"
    background: il_sp_shitsumei
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.3, tag: "徳次", flip: true}
      - {who: kouin, x: 0.72}
    cuts:
      - speaker: reimu
        text: "1962年、徳次の寄付をもとに大阪市立早川福祉会館が建ちます。"
        reading: "せんきゅうひゃくろくじゅうにねん、とくじのきふをもとにおおさかしりつはやかわふくしかいかんがたちます。"
      - speaker: reimu
        text: "共働きの家庭や、障害のある家庭の子を預かる場所も作りました。"
        reading: "ともばたらきのかていや、しょうがいのあるかていのこをあずかるばしょもつくりました。"
      - speaker: kouin
        emotion: normal
        text: "社長さん。ずいぶん、この手のことばかりされますね。"
      - speaker: zundamon
        emotion: normal
        text: "……子どもが預けられる場所がないと、親が働けないのだ。"
      - speaker: kouin
        emotion: thinking
        text: "……。"
      - speaker: zundamon
        emotion: normal
        text: "働けないと、その子は学校に行けなくなるぞ。"
      - speaker: kouin
        emotion: sad
        text: "……社長さんの、子どものころの話ですか。"
      - speaker: zundamon
        emotion: normal
        text: "……そこまでは、言ってないのだ。"
      - speaker: kouin
        emotion: happy
        text: "……はい。伺っておりません。"
      - speaker: reimu
        text: "1980年6月24日、早川徳次は亡くなりました。享年86。"
        reading: "せんきゅうひゃくはちじゅうねんろくがつにじゅうよっか、はやかわとくじわなくなりました。きょうねんはちじゅうろく。"
      - speaker: reimu
        text: "生涯に取った特許と実用新案は、数百件にのぼります。"
        reading: "しょうがいにとったとっきょとじつようしんあんわ、すうひゃっけんにのぼります。"
      - speaker: reimu
        text: "そのうち最も有名なものは、いま他社の手で作られています。"
        reading: "そのうちもっともゆうめいなものわ、いまたしゃのてでつくられています。"
  - id: ima
    title: "いま手元にあるもの"
    background: il_sp_ima
    bgm: you_and_me
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: zundamon
        emotion: normal
        text: "……つむぎさん。ボクの手元のこれ。"
      - speaker: tsumugi
        emotion: normal
        text: "シャープペンシルね。"
      - speaker: zundamon
        emotion: normal
        text: "作ってる会社、シャープじゃないのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "そうだよ。ほとんどが文具メーカーのもの。"
      - speaker: zundamon
        emotion: thinking
        text: "……名前だけ、あっちに行ったんだな。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。名前は会社に、物は世の中に。分かれたの。"
      - speaker: zundamon
        emotion: normal
        text: "……分かれて、両方生き残ってるのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "そこがこの話の、いちばんいいところだと思う。"
      - speaker: zundamon
        emotion: normal
        text: "ひとつ聞いていいか。今のって、あの仕組みなのか。"
      - speaker: tsumugi
        emotion: normal
        text: "ネジで送るやつ？ あれは、もう主流じゃないの。"
      - speaker: zundamon
        emotion: surprised
        text: "え。変わったのか。"
      - speaker: tsumugi
        emotion: normal
        text: "今はノック式。押すと、中の口が芯をつかんで送るの。"
      - speaker: reimu
        text: "現在の主流は、押すと芯をつかんで送るノック式です。"
        reading: "げんざいのしゅりゅうわ、おすとしんをつかんでおくるのっくしきです。"
      - speaker: zundamon
        emotion: thinking
        text: "……じゃあ、あの人の仕組みは消えたのか。"
      - speaker: tsumugi
        emotion: normal
        text: "仕組みはね。でも、考え方は残ってる。"
      - speaker: zundamon
        emotion: normal
        text: "考え方。"
      - speaker: tsumugi
        emotion: normal
        text: "削らずに書ける。芯を細くして、金属で精度を出す。"
      - speaker: zundamon
        emotion: surprised
        text: "……先っぽの金属の筒、今のにもあるのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "そこ。あそこだけは、ずっと金属なの。"
      - speaker: zundamon
        emotion: thinking
        text: "……100年、同じところが金属なのか。ナーフされてないのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "細い芯を、まっすぐ支えられる素材が他にないから。"
      - speaker: zundamon
        emotion: happy
        text: "……[錺屋|かざりや]の7年が、まだそこにいるのだ。"
  - id: end
    title: ""
    background: il_sp_ima
    bgm: you_and_me
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "今度シャーペンを使うとき、先の金属を見てみて。"
      - speaker: zundamon
        emotion: normal
        text: "あの、細い筒か。"
      - speaker: tsumugi
        emotion: normal
        text: "そこを金属にすると決めたのが、100年前の職人。"
      - speaker: zundamon
        emotion: thinking
        text: "……全部失った人なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。でもね、失ったあとの選び方が変わってる。"
      - speaker: zundamon
        emotion: normal
        text: "変わってる？"
      - speaker: tsumugi
        emotion: normal
        text: "普通は、残った権利を握るでしょ。それが最後の財産だもん。"
      - speaker: zundamon
        emotion: normal
        text: "握らずに、渡したのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "渡したから、あの鉛筆は途切れなかった。"
      - speaker: zundamon
        emotion: thinking
        text: "……もし握ってたら、どうなってたんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "作る工場がないから、たぶん誰も作れないまま消えてた。"
      - speaker: zundamon
        emotion: surprised
        text: "……持ってるほうが、消えるのか。"
      - speaker: tsumugi
        emotion: normal
        text: "抱えたまま動けないなら、そうなることもある。"
      - speaker: zundamon
        emotion: normal
        text: "……ボク、ひとつ分かったことがあるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "なに。"
      - speaker: zundamon
        emotion: normal
        text: "この人、助けてもらった手を、ずっと返してるだけなのだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "……手を、返す。"
      - speaker: zundamon
        emotion: normal
        text: "7歳で手を引かれて、あとは引く側をやり続けたぞ。"
      - speaker: tsumugi
        emotion: happy
        text: "……うん。そう読むと、全部つながるね。"
      - speaker: zundamon
        emotion: happy
        text: "……あ。それでボク、芯を折らないように書くのだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "急にどうしたの。"
      - speaker: zundamon
        emotion: happy
        text: "1センチ出すの、やめるのだ。攻めるのは今日でおしまい。"
      - speaker: tsumugi
        emotion: happy
        text: "……それ、いちばんいい感想だと思う。"
      - speaker: zundamon
        emotion: happy
        text: "チャンネル登録も、してくれると嬉しいのだ！"
      - speaker: tsumugi
        emotion: happy
        text: "感想もコメントで教えてね。"
      - speaker: tsumugi
        emotion: happy
        duet_with: zundamon
        text: "ご視聴、ありがとうございました！"
