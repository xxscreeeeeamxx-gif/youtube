scenes:
- id: co_kanban
  title: ''
  background: sa_kanban
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 三洋の社員, emotion: sad}
  - {who: sagyo, x: 0.56, emotion: normal}
  - {who: moto, x: 0.78, emotion: sad}
  cuts:
  - speaker: reimu
    text: 2011年12月23日の朝。大阪・守口の本社ビルから、SANYOの看板が1文字ずつ下ろされます。
    reading: にせん じゅういちねん じゅうにがつ にじゅうさんにちの あさ。おおさか もりぐちの ほんしゃ びるから、さんよーの かんばんが ひともじずつ おろされます。
  - speaker: sagyo
    emotion: normal
    text: 次の[1文字|ひともじ]、吊るすで。50キロはあるからな、気ぃつけや！
  - speaker: zundamon
    emotion: sad
    text: ……ボクの会社の名前が、[空|そら]から降りてくるのだ。
  - speaker: moto
    emotion: sad
    text: 覚悟をしていたことではあるが……。
  - speaker: moto
    emotion: sad
    text: 自分が働いていた場所から、[SANYO|さんよー]のロゴが消えるのは寂しい。
  - speaker: reimu
    text: 一番大きかった頃、この会社では世界で10万人が働いていました。
    reading: いちばん おおきかった ころ、この かいしゃでわ せかいで じゅうまんにんが はたらいて いました。
  - speaker: reimu
    text: 会社の名前は、三洋電機。始まりは、自転車のランプでした。
    reading: かいしゃの なまえわ さんよう でんき。はじまりわ、じてんしゃの らんぷでした。
- id: hook
  title: ''
  background: sa_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。リモコンが動かないから、電池を替えるのだ！
  - speaker: zundamon
    emotion: surprised
    text: 引き出しの電池……これも[空|から]、これも[空|から]。
  - speaker: zundamon
    emotion: happy
    text: 使い切った電池も、とりあえずしまっておく主義なのだ！
  - speaker: tsumugi
    emotion: normal
    text: それ、充電すれば何度も使える電池よ。充電器は？
  - speaker: zundamon
    emotion: happy
    text: 充電器も、大事にどこかへしまったのだ！
  - speaker: tsumugi
    emotion: thinking
    text: しまい込むことにかけては、天才ね。
    se: zukko
  - speaker: tsumugi
    emotion: normal
    text: その電池、もとは三洋電機という会社が作ったのよ。
  - speaker: zundamon
    emotion: thinking
    text: さんよう？ 聞いたことないぞ。
  - speaker: tsumugi
    emotion: normal
    text: 世界で10万人が働いてた会社。今は、看板も残ってないの。
  - speaker: zundamon
    emotion: surprised
    text: 10万人もいたのに、どうして消えちゃったの？
    telops:
    - {text: 10万人の会社が消えた, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 始まりは、淡路島の船乗りの家に生まれた男よ。
- id: card1917
  title: ''
  background: sa_card_1917
  cuts:
  - speaker: reimu
    text: 1917年、淡路島。船乗りの家に育った井植歳男は、14歳でした。
    reading: せんきゅうひゃく じゅうななねん、あわじしま。ふなのりの いえに そだった いうえ としおわ、じゅうよんさいでした。
- id: ch1_awaji
  title: 姉からの手紙
  background: sa_awaji
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 井植歳男, scale: 0.85, emotion: happy}
  - {who: shima, x: 0.7, emotion: normal}
  cuts:
  - speaker: shima
    emotion: normal
    text: '[歳男|としお]。学校を出たら、どないするんや。'
  - speaker: zundamon
    emotion: happy
    text: 大阪の姉ちゃんから、手紙が来たのだ！
  - speaker: shima
    emotion: surprised
    text: むめのちゃんか。大阪へ嫁いだ子やな。
  - speaker: zundamon
    emotion: happy
    text: '[義兄さん|にいさん]が、電気の器具を作る商売を始める。手伝いに来いって。'
  - speaker: shima
    emotion: thinking
    text: 海の男の息子が、陸で電気をいじるんか。
  - speaker: zundamon
    emotion: happy
    text: 大阪で、ひと山当てるんだ！
  - speaker: shima
    emotion: thinking
    text: まだ14やろ。当てる前に、迷子になるなよ。
    beat: true
- id: card1918
  title: ''
  background: sa_card_1918
  cuts:
  - speaker: reimu
    text: 1918年3月。大阪の小さな借家で、松下電気器具製作所が始まります。
    reading: せんきゅうひゃく じゅうはちねん さんがつ。おおさかの ちいさな しゃくやで、まつした でんき きぐ せいさくしょが はじまります。
- id: ch1_shakuya
  title: 3人だけの会社
  background: sa_shakuya
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 井植歳男, scale: 0.85, emotion: surprised}
  - {who: konosuke, x: 0.56, emotion: happy}
  - {who: mumeno, x: 0.78, emotion: normal}
  cuts:
  - speaker: konosuke
    emotion: happy
    text: '[歳男|としお]くん。今日から、ここが松下電気器具製作所や。'
  - speaker: zundamon
    emotion: surprised
    text: 製作所……。ここ、[義兄さん|にいさん]の家ですよね。
  - speaker: mumeno
    emotion: normal
    text: 住むのも作るのも、ここなんよ。ぼさっとせんと、手ぇ動かし！
  - speaker: zundamon
    emotion: normal
    text: 姉ちゃん、社員は何人いるの？
  - speaker: mumeno
    emotion: normal
    text: うちの人とうちと、あんたの3人や。
  - speaker: zundamon
    emotion: thinking
    text: 3人……。しかも全員、親戚なのだ。
    beat: true
  - speaker: konosuke
    emotion: happy
    text: 小さく始めて、大きくしたらええんや。
  - speaker: zundamon
    emotion: happy
    text: はい、[義兄さん|にいさん]！ 何から作りますか。
  - speaker: konosuke
    emotion: normal
    text: 電気の器具や。まずは、わしの手元をよう見とき。
  - speaker: mumeno
    emotion: angry
    text: 見とるだけやったら、ご飯は出えへんで。
  - speaker: zundamon
    emotion: sad
    text: 姉ちゃん、家でも仕事場でも厳しい……。
  - speaker: reimu
    text: 23歳の幸之助と妻のむめの、15歳の歳男の3人でした。
    reading: にじゅうさんさいの こうのすけと つまの むめの、じゅうごさいの としおの さんにんでした。
- id: ch1_senmu
  title: 肩書きが増えていく
  background: sa_matsushita
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 井植歳男, emotion: normal}
  - {who: mshain, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1920年。17歳の歳男は東京の駐在員として、ひとりで送り出されます。
    reading: せんきゅうひゃく にじゅうねん。じゅうななさいの としおわ とうきょうの ちゅうざいいんとして、ひとりで おくりだされます。
  - speaker: zundamon
    emotion: surprised
    text: 17で、東京にひとり……。
    beat: true
  - speaker: reimu
    text: 1935年。会社は松下電器産業になり、歳男は専務になりました。
    reading: せんきゅうひゃく さんじゅうごねん。かいしゃわ まつした でんき さんぎょうに なり、としおわ せんむに なりました。
  - speaker: mshain
    emotion: normal
    text: 専務。今日は、松下無線の社長として行かれますか。
  - speaker: mshain
    emotion: thinking
    text: それとも、松下乾電池の専務として？
  - speaker: zundamon
    emotion: thinking
    text: ……今日のボクは、どのボクなのだ。
    se: manuke
  - speaker: mshain
    emotion: normal
    text: どれで行かれても、お顔は同じですけど。
    beat: true
  - speaker: reimu
    text: 1943年には松下造船の社長も兼ね、木の船を造りました。
    reading: せんきゅうひゃく よんじゅうさんねんにわ まつした ぞうせんの しゃちょうも かね、きの ふねお つくりました。
  - speaker: zundamon
    emotion: surprised
    text: 船乗りの息子が、今度は船を造るのか。
  - speaker: mshain
    emotion: surprised
    text: 電気の会社が、船までですか。
- id: ch2_seigen
  title: 戦争が終わって
  background: sa_matsushita_sengo
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 井植歳男, emotion: thinking}
  - {who: kumiai, x: 0.7, emotion: angry}
  cuts:
  - speaker: reimu
    text: 1946年。松下電器は、GHQから制限会社に指定されるなど7つの制限を受けます。
    reading: せんきゅうひゃく よんじゅうろくねん。まつした でんきわ、じーえいちきゅーから せいげん がいしゃに してい されるなど ななつの せいげんお うけます。
  - speaker: reimu
    text: 社長の幸之助も、公職追放の指定を受けました。
    reading: しゃちょうの こうのすけも こうしょく ついほうの していお うけました。
  - speaker: kumiai
    emotion: angry
    text: この時期に会社再建の支柱である[社主|しゃしゅ]を失うことは、会社の崩壊を意味する！
  - speaker: kumiai
    emotion: angry
    text: '[社主|しゃしゅ]の追放解除を、GHQに嘆願しよう！'
  - speaker: zundamon
    emotion: surprised
    text: 組合のみんなが、[義兄さん|にいさん]を守ろうとしてる……。
  - speaker: kumiai
    emotion: normal
    text: 専務。わしら、代理店さんとも一緒に動きます。
  - speaker: zundamon
    emotion: thinking
    text: ……頼む。
  - speaker: reimu
    text: 組合や代理店の嘆願は実り、幸之助の追放は翌年に解かれます。
    reading: くみあいや だいりてんの たんがんわ みのり、こうのすけの ついほうわ よくねんに とかれます。
- id: ch2_yameru
  title: 松下を去る
  background: sa_matsushita_yoru
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 井植歳男, emotion: thinking}
  - {who: goto, x: 0.7, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 1946年12月。歳男は、松下電器の専務を辞めます。
    reading: せんきゅうひゃく よんじゅうろくねん じゅうにがつ。としおわ、まつした でんきの せんむお やめます。
  - speaker: reimu
    text: 長男の敏は、父もGHQの追放を受けて辞めたと書いています。
    reading: ちょうなんの さとしわ、ちちも じーえいちきゅーの ついほうお うけて やめたと かいて います。
  - speaker: goto
    emotion: surprised
    text: 専務、ほんまに松下を出はるんですか。
  - speaker: zundamon
    emotion: thinking
    text: ……もう、決めたことだ。
  - speaker: goto
    emotion: sad
    text: 14の時から、30年近くおったのに。
  - speaker: zundamon
    emotion: sad
    text: 人生の3分の2を、ここで過ごしたな。
  - speaker: goto
    emotion: thinking
    text: これから、どないしはるんですか。
  - speaker: zundamon
    emotion: normal
    text: 自分の会社を作る。……元手は、まだ無いけどな。
  - speaker: goto
    emotion: surprised
    text: 一番大事なとこが、[空|から]っぽやないですか！
    beat: true
  - speaker: goto
    emotion: normal
    text: ……工場がでけたら、わしも呼んでください。
  - speaker: zundamon
    emotion: happy
    text: その時は、真っ先に呼ぶ。
- id: ch2_rakkasan
  title: 落下傘で傘を作る
  background: sa_sagyoba
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 井植歳男, emotion: happy}
  - {who: shokunin, x: 0.7, emotion: surprised}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 見てくれ。軍が使ってた落下傘だ。もう誰も使わないのだ。
  - speaker: shokunin
    emotion: surprised
    text: そんなもん集めて、どないしますねん。
  - speaker: zundamon
    emotion: happy
    text: これは絹だ。ほどいて、傘にする！
  - speaker: shokunin
    emotion: thinking
    text: '[空|そら]から落ちる道具で、雨を防ぐんかいな。'
