  - speaker: zundamon
    emotion: normal
    text: 落ちるのを、ゆっくりにする布だ。雨くらい、なんてことない。
  - speaker: shokunin
    emotion: thinking
    text: 理屈は分かりませんけど、縫うのはわしですな。
  - speaker: zundamon
    emotion: happy
    text: 落下傘は、まだまだあるぞ。どんどん縫ってくれ！
  - speaker: shokunin
    emotion: sad
    text: わしの指が、先に落ちてまいますわ。
  - speaker: reimu
    text: 落下傘の絹は、本当に傘になりました。
    reading: らっかさんの きぬわ、ほんとうに かさに なりました。
    background: sa_sagyoba_kasa
  - speaker: shokunin
    emotion: surprised
    text: ……ほんまに、傘がずらっと並んでもうた。
  - speaker: zundamon
    emotion: happy
    text: 次は、進駐軍の兵隊さんに電気スタンドを売る。
  - speaker: shokunin
    emotion: thinking
    text: 松下の専務さんが、傘屋とスタンド屋ですか。
  - speaker: zundamon
    emotion: normal
    text: '[元専務|もとせんむ]だ。元手が無いから、何でも売る。'
  - speaker: reimu
    text: 戦争の残り物を元手に変えて、歳男は新しい会社の準備を進めました。
    reading: せんそうの のこりものお もとでに かえて、としおわ あたらしい かいしゃの じゅんびお すすめました。
- id: card1947
  title: ''
  background: sa_card_1947
  cuts:
  - speaker: reimu
    text: 1947年2月1日。歳男は大阪の守口で、三洋電機製作所を始めます。
