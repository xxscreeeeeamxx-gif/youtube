  - speaker: senpai
    emotion: thinking
    text: 創業者が、[姑|しゅうとめ]さんにけしからん言われながら売った機械やで。
  - speaker: zundamon
    emotion: sad
    text: ……それが、海の向こうの会社へ行くのか。
  - speaker: senpai
    emotion: normal
    text: 行った先で作り続けられるなら、それでええ。
  - speaker: reimu
    text: ハイアールは、およそ3100人の社員を受け入れると発表しました。
    reading: はいあーるわ、およそ さんぜん ひゃくにんの しゃいんお うけいれると はっぴょう しました。
- id: ch11_kanban
  title: 看板が降りる日
  background: sa_kanban
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.2, flip: true, tag: 三洋の社員, emotion: sad}
  - {who: sagyo, x: 0.56, emotion: normal}
  - {who: moto, x: 0.78, emotion: sad}
  cuts:
  - speaker: reimu
    text: 2011年12月23日、朝8時。守口の本社で、看板を下ろす作業が始まります。
    reading: にせん じゅういちねん じゅうにがつ にじゅうさんにち、あさ はちじ。もりぐちの ほんしゃで、かんばんお おろす さぎょうが はじまります。
  - speaker: reimu
    text: 看板の大きさは縦3メートル、横9.3メートルでした。
    reading: かんばんの おおきさわ たて さんめーとる、よこ きゅうてんさん めーとるでした。
  - speaker: sagyo
    emotion: normal
    text: '[1文字|ひともじ]で50キロから60キロある。10人がかりで行くで！'
  - speaker: sagyo
    emotion: normal
    text: クレーン、ゆっくりや！ 次の[1文字|ひともじ]、吊るすで。
  - speaker: zundamon
    emotion: sad
    text: ……ボクの会社の名前が、[空|そら]から降りてくるのだ。
  - speaker: moto
    emotion: sad
    text: 覚悟をしていたことではあるが……。
  - speaker: moto
    emotion: sad
    text: 自分が働いていた場所から、[SANYO|さんよー]のロゴが消えるのは寂しい。
  - speaker: sagyo
    emotion: normal
    text: あと[1文字|ひともじ]や。最後まで、気ぃ抜くなよ！
  - speaker: zundamon
    emotion: sad
    text: ……やっぱり、ボクより重かったのだ。
    se: namida
  - speaker: reimu
    text: 作業は、夕方の4時半まで続きました。
    reading: さぎょうわ、ゆうがたの よじはんまで つづきました。
    background: sa_kanban_kara
    telops:
    - {text: SANYOの5文字が降りた, size: md, position: top-right, color: "#FFFFFF", stroke: "#1A1A2A", glow: "#7AA8FF", anim: up}
  - speaker: zundamon
    emotion: sad
    text: ……[空|から]っぽだ。
  - speaker: reimu
    text: 25日からは、横13.4メートルのPanasonicの看板への付け替えが始まりました。
    reading: にじゅうごにちからわ、よこ じゅうさんてんよん めーとるの ぱなそにっくの かんばんえの つけかえが はじまりました。
- id: ch12_ronsou
  title: 地震で潰れたのか
  background: sa_ronsou
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、ネットで見たのだ。三洋は、地震のせいで潰れたって！
  - speaker: tsumugi
    emotion: normal
    text: 引き金になったのは本当よ。被害は503億円で、保険金はなし。
  - speaker: zundamon
    emotion: angry
    text: やっぱり、地震が悪いのだ！
  - speaker: tsumugi
    emotion: thinking
    text: でも、問題はその前からあったの。
  - speaker: tsumugi
    emotion: normal
    text: 2007年に直した決算は、2001年3月期までさかのぼるのよ。
  - speaker: zundamon
    emotion: surprised
    text: 地震より、3年以上も前の決算！？
    telops:
    - {text: 地震は引き金・問題はその前から, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: それに、事業を広げすぎてたの。テレビも洗濯機も、半導体も金融もね。
  - speaker: zundamon
    emotion: surprised
    text: 洗濯機の会社が、金融まで！？
  - speaker: tsumugi
    emotion: normal
    text: 2005年の計画では、その4つを中心から外す事業にしたの。
  - speaker: tsumugi
    emotion: normal
    text: '[井植敏|いうえさとし]さんも、我々はライバルを知ることを怠ったと語ってるわ。'
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、決算のほうは粉飾だったの？
  - speaker: tsumugi
    emotion: thinking
    text: そこは、答えが分かれてるの。
  - speaker: tsumugi
    emotion: normal
    text: 国は虚偽の記載と認めて、830万円の課徴金を命じたわ。
  - speaker: tsumugi
    emotion: normal
    text: でも株主が起こした裁判で、裁判所は違法な配当とは認めなかったの。
  - speaker: tsumugi
    emotion: normal
    text: 地裁は、会計処理の経営判断が不合理だったとは言えないと判断したわ。
  - speaker: zundamon
    emotion: surprised
    text: 国と裁判所で、答えが違うのだ……。
    se: tenten
  - speaker: tsumugi
    emotion: thinking
    text: 地震の前の2000年には、太陽電池の出力を偽って売っていた問題も出てたの。
  - speaker: tsumugi
    emotion: normal
    text: 地震は、きっかけ。弱っていたのは、その前からだったのよ。
- id: ch13_ima
  title: 今も残るもの
  background: sa_gendai
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 一番多い頃は10万人。2014年に、パナソニックに残ってたのは9000人よ。
  - speaker: zundamon
    emotion: surprised
    text: 10人に1人も、残ってない……。
    telops:
    - {text: 10万人から9000人へ, size: md, position: top-right, color: "#FFFFFF", stroke: "#1A1A2A", glow: "#7AA8FF", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 2015年4月には、三洋電機の社員約7000人がパナソニック側へ移ったの。
  - speaker: tsumugi
    emotion: normal
    text: 社員が移ったあとも、三洋電機という会社そのものは残されたわ。
  - speaker: tsumugi
    emotion: normal
    text: '[守口|もりぐち]の本社ビルは、2017年から[守口|もりぐち]市役所になってるわ。'
  - speaker: zundamon
    emotion: happy
    text: 看板の降りたビルで、今は住民票が取れるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 洗濯機と冷蔵庫は、ハイアールの[AQUA|あくあ]という名前で続いてるの。
  - speaker: tsumugi
    emotion: normal
    text: '[北條|ほうじょう]の跡地には、三洋電機発祥の地の[碑|ひ]が立ってるわ。'
  - speaker: zundamon
    emotion: normal
    text: ランプの工場の場所で、今はみんなが買い物してるのか。
  - speaker: tsumugi
    emotion: normal
    text: 散らばった人たちも、それぞれの場所で物を作ってるわ。
  - speaker: tsumugi
    emotion: normal
    text: デジカメの部門は、ザクティという会社になって大阪の[大東市|だいとうし]にあるの。
  - speaker: tsumugi
    emotion: normal
    text: 電池の技術者だった人は、淡路島の[洲本|すもと]でコンサルティングの会社を作ったのよ。
  - speaker: zundamon
    emotion: happy
    text: 創業者の島に、三洋の技術が帰ってきたのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 気をつけたいのは、家に古い三洋の家電がある人。
  - speaker: tsumugi
    emotion: normal
    text: 家庭用の修理と部品の受け付けは、2024年9月で終わってるの。
  - speaker: zundamon
    emotion: surprised
    text: 壊れたら、もう直してもらえないの！？
  - speaker: tsumugi
    emotion: thinking
    text: メーカーの修理は、もう受けてもらえないの。
  - speaker: tsumugi
    emotion: normal
    text: 2025年の万博では、別の会社が新しい人間洗濯機を出したわ。
  - speaker: zundamon
    emotion: happy
    text: 55年たって、人がまた洗われたのだ！
  - speaker: tsumugi
    emotion: normal
    text: それに、あの充電池。20年で、6億本を超えたの。
  - speaker: zundamon
    emotion: happy
    text: 却下された何度も電池が、6億本！
- id: shime
  title: ''
  background: sa_heya_jyuden
  bgm: haru_kitchen
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ！ 充電器、冷蔵庫の上にあったのだ！
  - speaker: tsumugi
    emotion: happy
    text: 充電すれば、引き出しの電池も全部使えるわね。
  - speaker: zundamon
    emotion: happy
    text: 何度も使える……つまり、[NANDOMO|なんども]なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: その名前、発表の2か月前に却下されてるわよ。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: あなたの家の引き出しにも、使いかけの電池が眠ってない？
  - speaker: tsumugi
    emotion: happy
    text: 面白かったら、高評価とチャンネル登録をお願いします。
  - speaker: zundamon
    emotion: happy
    text: ご視聴、ありがとうございました！
    duet_with: tsumugi
