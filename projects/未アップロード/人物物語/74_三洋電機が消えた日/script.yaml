meta:
  title: 【三洋電機が消えた日】看板が1文字ずつ降りた、10万人の会社の最後【ずんだもん解説】
  slug: sanyo-end
  summary: 大阪・守口の本社ビルから、ある冬の朝、看板の文字が1文字ずつ下ろされていきました。その会社の始まりは、戦後すぐの小さな工場です。義兄の松下幸之助の会社を離れた井植歳男は、自転車のランプから出直し、主婦の重労働だった洗濯を変える機械を世に出します。三つの海の名を持つ会社は、なぜ看板を下ろすことになったのか。ずんだもんが創業者と社員を演じる再現ドラマで、三洋電機の歩みをたどります。
  tags:
  - 三洋電機
  - 井植歳男
  - 松下幸之助
  - パナソニック
  - SANYO
  - エネループ
  - 洗濯機
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 平成史
