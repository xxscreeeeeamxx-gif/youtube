      - speaker: reimu
        text: "毎年 二万五千ポンドずつ、四回に分けて。"
        reading: "まいとし にまんごせんぽんどずつ、よんかいに わけて。"
      - speaker: zundamon
        emotion: thinking
        text: "……向こうが欲しがる機械なのだ。"
      - speaker: oshima
        emotion: happy
        text: "日本の機械が、イギリスに買われる。"
      - speaker: zundamon
        emotion: normal
        text: "大島さん。ついでに寄りたい所があるのだ。"
      - speaker: oshima
        emotion: surprised
        text: "どこだ。"
      - speaker: zundamon
        emotion: normal
        text: "アメリカ。車の工場を見たいのだ。"

