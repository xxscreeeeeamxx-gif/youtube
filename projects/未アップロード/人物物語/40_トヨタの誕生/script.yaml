        reading: "とよだきいちろうが うまれます。"
      - speaker: reimu
        text: "父の佐吉は、[機織り機|はたおりき]の発明家でした。"
        reading: "ちちの さきちわ はたおりきの はつめいかでした。"
      - speaker: sakichi
        emotion: normal
        text: "[喜一郎|きいちろう]。この音、分かるか。"
      - speaker: zundamon
        emotion: thinking
        text: "……糸が切れた音なのだ。"
      - speaker: sakichi
        emotion: happy
        text: "そうだ。切れたら、止まらなあかん。"
      - speaker: zundamon
        emotion: surprised
        text: "止めるのか。動いてるのに。"
      - speaker: sakichi
        emotion: normal
        text: "切れたまま織ったら、布が屑になる。"
      - speaker: zundamon
        emotion: normal
        text: "……なるほどなのだ。"
      - speaker: reimu
        text: "糸が切れたら自分で止まる[織機|しょっき]。"
        reading: "いとが きれたら じぶんで とまる しょっき。"
      - speaker: reimu
        text: "佐吉が作ったのは それでした。"
        reading: "さきちが つくったのわ それでした。"
      - speaker: zundamon
        emotion: happy
        text: "父ちゃん、それ売れるのか。"
      - speaker: sakichi
        emotion: happy
        text: "売れる。人が一人、[要らん|いらん]ようになる。"
      - speaker: zundamon
        emotion: thinking
        text: "……[要らん|いらん]ように、か。"

