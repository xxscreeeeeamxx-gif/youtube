# トヨタ・再現ドラマ（[豊田喜一郎|とよだきいちろう]・1894→1952）。
# 投稿前に必ず目視レビュー。
# ★企業の一代記シリーズ10本目。ホンダ回・ソニー回と同じ「町工場が世界へ」の型だが、
#   この回の敵は役所でも大手でもなく**自分の鋳物**。9割が屑になる工程を延々やる話。
#   ホンダ＝宣言と時間 / ソニー＝許可が下りない / トヨタ＝作っても作っても割れる
# ★配役: ずんだもん=豊田喜一郎 / つむぎ=現代から見ている解説役 / ナレ=ゆっくり
#   父・佐吉はモブ（主人公は喜一郎。父子を二人主人公にすると焦点がぼける）
# ★ミーム禁止の章: shibo（佐吉の死）/ sougi（労働争議と辞任）/ shi（喜一郎の死）
# 裏取り:
#   トヨタ自動車75年史 第1部第1章第4節第2項「プラット社との特許権譲渡契約」
#   同 第2章第2節第1項「自動車製作部門の設置」/ 第3項「A型エンジンとA1型乗用車の試作」
#   同 第2章第2節第4項「G1型トラックの施策・発表」/ 第6項「AA型乗用車とGA型トラックの発表」
#   同 第2章第4節第3項「トヨタ自動車工業株式会社の設立と挙母工場の建設」
#   同 第2章第6節第6項「喜一郎社長の辞任」/ トヨタ産業技術記念館「豊田喜一郎」
#   トヨタ公式「トヨタマーク」/ GAZOO 自動車人物伝 豊田喜一郎 第1〜3編
# 確定事実:
#   豊田喜一郎 1894-6-11 生 / 1952-3-27 没（57歳・脳溢血）
#   父 豊田佐吉 1867-1930-10-30 没。自動織機の発明家
#   1929-12-21 英プラット社とG型自動織機の特許権譲渡契約
#     総額10万ポンドを4回分割、毎年2万5,000ポンド（約25万円）
#     ※最終的に1934-7に未払い6万1,500ポンドを4万5,000ポンドに減額、総額8万3,500ポンド
#     ※「その金で自動車をやれ」と佐吉が遺言したという話は社史に無い。**言わせない**
#   1929 喜一郎が渡欧米。フォードの工場視察と工作機械の調査に没頭
#   1933-9 豊田自動織機製作所に自動車部を設置
#   1933 工場の倉庫に板囲いをつくり、33年型シボレーを分解と組み立てで繰り返す
#   1933-10 33年型シボレー乗用車を分解して部品をスケッチ、エンジン試作用図面
#   1934-5 A型エンジンのシリンダーブロックとピストンの鋳物の試作を開始
#     ウオータージャケットの中子の製作に苦労。大島理三郎取締役が米国から持ち帰った
#     油中子を参考に試行錯誤。織機とは比べものにならないほど複雑で不良品が続出し、
#     作っても9割以上は廃棄するしかなかった
#   1934-8 シリンダーブロック鋳物が完成
#   1934-9-25 試作エンジン第1号が完成
#   1935-8 G1型トラック完成 / 1935-11 発表
#   1936 AA型乗用車（1935年試作のA1型を改良した初の量産乗用車）
#   1936 「トヨダ・マーク」を懸賞付きで一般公募。全国から2万7000点。
#     「トヨタ」は濁音がなく調子がよい／片仮名の総画数が8画／
#     創業者の姓から離れ個人の会社から世界的企業へ、という意味
#   1937-8-27 創立総会 / 8-28 設立登記完了。資本金1,200万円のトヨタ自動車工業株式会社
#   1950-4-11 労働争議が始まり 6-10 終結。6-5 喜一郎が争議の責を負って社長辞任
#     喜一郎の言葉「人員整理をできるだけ避けたいということは、私の最高道徳律だ」
#   1952-3 石田退三が喜一郎を訪ね社長復帰を促し、喜一郎は快諾。3-27 急死
meta:
  title: "【トヨタの誕生】9割が屑になる。織機屋がエンジンを作るまで【ずんだもん解説】"
  slug: "toyoda-kiichiro"
  summary: "世界でいちばん車を売っている会社は、もともと機織り機の会社でした。父が遺した工場で、その息子はアメリカ車を一台買ってきて、バラバラに分解します。ただ、作り方が分かっても作れるとは限りませんでした。鋳物は割れ、九割が屑になります。ずんだもんが豊田喜一郎を演じる再現ドラマです。"
  tags: ["トヨタ", "豊田喜一郎", "豊田佐吉", "自動織機", "自動車", "昭和史", "再現ドラマ", "ゆっくり", "ずんだもん", "企業史", "ミーム"]
  thumbnail:
    top: "9割が屑になる"
    bottom: "トヨタの誕生"
  mode: drama
  narrator: reimu
  mobs:
    - {id: sakichi, label: "父・豊田佐吉", voice: 42, pitch: 0.0}
    - {id: shain, label: "自動車部の社員", voice: 12, pitch: 0.04}
    - {id: shainb, label: "鋳物場の職人", voice: 12, pitch: -0.02}
    - {id: oshima, label: "大島理三郎", voice: 13, pitch: -0.04, item: hat}
    - {id: ginkou, label: "銀行の人", voice: 13, pitch: -0.1, item: hat}
    - {id: ishida, label: "石田退三", voice: 13, pitch: 0.02, item: hat}
    - {id: kumiai, label: "組合の人", voice: 12, pitch: -0.06}
scenes:
  - id: hook
    title: ""
    background: il_toy_ima
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true, emotion: happy}
      - {who: tsumugi, x: 0.74, emotion: normal}
    cuts:
      - speaker: zundamon
        emotion: happy
        text: "つむぎ、車を買うのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "免許は。"
      - speaker: zundamon
        emotion: surprised
        text: "……まだなのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "順番。"
      - speaker: zundamon
        emotion: normal
        text: "でも車は、乗るより見るものなのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "そういう楽しみ方もあるけどね。"
      - speaker: zundamon
        emotion: happy
        text: "よし、じゃあ自分で作るのだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "飛んだね。免許より遠いよ。"
      - speaker: zundamon
        emotion: angry
        text: "作れば免許はあとから付いてくるのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "付いてこないよ。……でもね。"
      - speaker: tsumugi
        emotion: normal
        text: "同じことを本気でやった人がいるの。"
      - speaker: zundamon
        emotion: surprised
        text: "……いるのか。"
      - speaker: tsumugi
        emotion: normal
        text: "いま世界でいちばん車を売ってる会社。"
      - speaker: tsumugi
        emotion: normal
        text: "あれ、もとは[機織り機|はたおりき]の会社。"
      - speaker: zundamon
        emotion: surprised
        text: "[は|はぁ]、[機織り機|はたおりき]！？"
        se: don
        telops:
          - {text: "もとは機織り機の会社", size: xl, position: middle-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
      - speaker: tsumugi
        emotion: normal
        text: "うん。布を織る機械。"
      - speaker: zundamon
        emotion: thinking
        text: "……布とエンジン、遠すぎないか。"
      - speaker: tsumugi
        emotion: normal
        text: "遠いよ。だから、九割が屑になった。"

  - id: umare
