  # ============ 大学の21ビット ============
  - id: daigaku
    title: "17万通りを21個の0と1で"
    background: il_kg_univ
    bgm: serious
    stage:
      - {who: zundamon, x: 0.3, flip: true, tag: "田中"}
      - {who: sensei, x: 0.74}
    cuts:
      - speaker: reimu
        text: "定期券には、もっと厄介な問題がありました。"
      - speaker: sensei
        emotion: normal
        text: "定期は区間券です。その経路を通ったかどうかを、機械が判断せねばなりません。"
      - speaker: zundamon
        emotion: thinking
        text: "路線は280駅。経路の数は。"
      - speaker: sensei
        emotion: normal
        text: "17万通りです。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "17万！？そんな表、機械に持たせられないのだ！"
      - speaker: reimu
        text: "この時代、集積回路はまだ使えません。トランジスタを並べて回路を組みます。"
      - speaker: sensei
        emotion: normal
        text: "ですから、覚えさせるのではなく、計算で判定させます。"
      - speaker: zundamon
        emotion: thinking
        text: "計算で。"
      - speaker: sensei
        emotion: normal
        text: "路線を木の枝に見立てて、経路に番号を割り当てるのです。"
      - speaker: sensei
        emotion: normal
        text: "17万通りなら、18個の0と1があれば足ります。"
      - speaker: sensei
        emotion: happy
        text: "そこへ3個だけ足して、21個にする。すると。"
      - speaker: zundamon
        emotion: surprised
        text: "……大小を比べるだけで、正しい経路かどうか分かるのか。"
      - speaker: sensei
        emotion: normal
        text: "そうです。引き算と比較だけ。トランジスタでも間に合います。"
      - speaker: zundamon
        emotion: happy
        text: "理屈が、機械を小さくするのだ。"
      - speaker: reimu
        text: "この方式のおかげで、路線が増えても定期券を作り直す必要はありませんでした。"
      - speaker: reimu
        text: "開発から半世紀、一度もです。"
