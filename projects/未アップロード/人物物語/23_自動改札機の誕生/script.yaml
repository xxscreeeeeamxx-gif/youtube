# 自動改札機を作った人たち 再現ドラマ・ミーム版（仕組みの解説も統合）
#
# == 裏取り済みの事実（出典: 吹田市立千里ニュータウン情報館 セミナー「自動改札機開発秘話」
#    田中・浅田 両氏の証言録 2021-11-21 / IEEE ETHW マイルストーン公式 / 阪急電鉄公式 /
#    日本機械学会 機械遺産第43号 / 発明協会 戦後日本のイノベーション100選 / オムロンSS 畑山氏講演）==
#
# ★通説の誤り・注意点4点★
# 1. 「世界初」は無条件では言えない。ロンドン交通局は1963年に実験・1964年に設置済み。
#    正確には【常時開放（ノーマルオープン）方式で、複雑な定期券を高速処理できるシステムとして初】。
#    IEEE自身が海外先行例を認めている → 動画では必ず修飾を付ける
# 2. IEEEマイルストーンの正式名称は【Railroad Ticketing Examining System, 1965-1971】。
#    銘板に「世界初」も「自動改札機」も入っていない。対象は1965〜1971年
# 3. 「駅員が腱鞘炎になった」は裏付けなし → 使わない。
#    裏が取れるのは改札鋏で【手に血豆ができた】まで（関東交通印刷）
# 4. 江尻正員は日立の研究者で【別人・無関係】→ 登場させない
#
# == 人物（実名が確認できるのは2名。ともにプロジェクトX出演・千里NT情報館で証言）==
# - 田中壽雄: 開発リーダー格。★読み仮名が公開資料で確定できないため、
#   動画では【姓のみ「田中」】で呼ぶ。フルネームは出さない
# - 浅田武夫: メカ設計の中心。同じく【姓のみ「浅田」】で呼ぶ
# - 立石一真（創業者）は自動改札への具体的関与を示す一次資料がない → 会社の理念のみ引用し、
#   「創業者が英断した」式の演出はしない
#
# == 4者の分担（どれか一社の手柄にしない）==
# - 近畿日本鉄道: 発案・最初の発注元。1964年2月に研究会を設立
# - 大阪大学: 経路符号化の理論（グラフ理論・21ビット）
# - 立石電機（現オムロン）: ハードウェア。1964年9月に参加
# - 京阪神急行電鉄（現阪急）: 最初の実用設置場所を提供
#
# == 裏取りできた事実 ==
# - 1960年代、駅員のいる改札は毎分75〜80人が通過（IEEE）。田中の観察では毎分60〜80人
# - 1日の総乗客の50%超が朝ラッシュに集中（IEEE）
# - 田中と浅田が阪急梅田駅で張り込み観察 → 係員は「ちゃんと見てる。問題がないから黙っている」
#   → 客は常に正しいという前提 →【性善説のノーマルオープン】という設計思想へ
# - 鉄道側の最大要件は速度。「係員の処理能力を下回るな。混雑が起きたら駅で暴動が起こるかもしれない」
# - 自社で3本バーのターンスタイルを試作 → 【毎分20人】が限界。海外の4扉式も毎分15〜20人
# - 機械が長い理由: 客は歩きながら券を入れ、手は体の後ろに残る。手を入れ替えるのに【0.6秒】、
#   歩行4km/h＝1.1m/sなので【70cm】進む。手前30cm＋70cm＋取る30cm＝【1.3m】必要。
#   券は客より速く運ばれ、客を追い抜く
# - 券の整列機構（浅田の設計）: 中心をずらして回るコマで、表裏も前後も問わず縦に揃える。
#   「渓流で岩に当たった笹の葉がまっすぐになるように」
# - 搬送は幅【5mm】の特殊ベルト。芯にナイロンを入れてベルトメーカーに開発を頼んだ
# - 大阪大学の経路符号化: 近鉄【280駅・17万通り】の経路を、最低18ビットのところ
#   冗長3ビットを足した【21ビット】で表現し、比較演算だけで妥当性判定
# - 親子連れ対応: 手すりのセンサーで人と荷物をパターン認識（海外の改札にはない発想）
# - 近鉄は鶴橋駅で導入予定だったが、国鉄が「穴のあいた定期券はダメだ」として連絡改札で扱えず頓挫。
#   ★国鉄を悪役にしない（当時は規格が統一されておらず技術的に妥当な判断でもあった）
# - そこで立石電機の営業が阪急へ。万博前で北千里駅の新設が進んでいた。
#   「うちに置かしてあげる、入れてみるか」「ぜひお願いします」
# - 【1967年3月1日】北千里駅で稼働。阪急公式によれば【10台】導入。当日は最高10度・最低マイナス2度
# - 当初は定期券用と切符用で改札機も改札口も別だった。約2年後に一体化を要求され、
#   北千里を実験場に設計者自身が泊まり込みで改修。1971年に新型へ
# - 開発チームの日常: 商店街で毎日同じ店に通うと奥さんが自宅用の漬物を出してくれた／
#   終電後に屋台で酒とつまみを買い、駅員と一杯やってから寝るのが楽しみだった
# - 特許は全公開。メーカーからは適度なロイヤリティを取るが鉄道会社からは取らない方針
#   → 全国統一規格が守られた
# - 1971年5月 日本鉄道サイバネティクス協議会が磁気カードの全国統一規格を制定
# - 2007年11月27日 IEEEマイルストーン認定（大阪大学・近鉄・阪急・オムロンの4か所に銘板）
# - 1970年 新技術開発財団 市村産業賞本賞（第2回）
# - 現在: 磁気券【0.6秒】/ ICカード【0.2秒】で処理。運賃計算の組み合わせは【10の40乗】オーダー
# - 実用化から30年で全国約2万台
#
# == センシティブルール ==
# - 「世界初」は必ず修飾付き。海外の先行例（ロンドン1964年）に触れる
# - 4者の分担を潰さない。「オムロンが作った」と単純化しない
# - 国鉄・労組を悪役にしない。JR導入が遅れた事情には深入りしない
# - 性善説は文化論に寄せすぎない。「混雑という制約への解」として描く
# - 人名は姓のみ。読みが不確定なフルネームを音声にしない
meta:
  title: "1秒に1人を通せ。世界の改札が真似しなかった日本の答え【自動改札機誕生・再現ドラマ・ミーム版】"
  slug: "kaisatsu-drama"
  summary: "毎朝くぐるあの箱は、1967年に大阪の新しい駅で動きはじめました。当時の改札は駅員が1枚ずつハサミを入れ、1分間に80人をさばいていた場所。機械にそれを超えろと言われた技術者たちが、まず何をしたか。ずんだもんと春日部つむぎが開発者を演じる再現ドラマです。後半では、切符が機械の中で何をされているのか、ICカードが電池なしで動く理由も解説します。"
  tags: ["自動改札機", "オムロン", "阪急", "北千里", "再現ドラマ", "ゆっくり", "ずんだもん", "ミーム"]
  thumbnail:
    top: "1秒に1人を通せ"
    bottom: "1967年・大阪"
  mode: drama
  narrator: reimu
  mobs:
    - {id: ekiin, label: "改札の係員", voice: 42, pitch: 0.0}
    - {id: tetsudo, label: "鉄道会社の人", voice: 13, pitch: -0.04, item: hat}
    - {id: sensei, label: "大学の先生", voice: 42, pitch: -0.03}
    - {id: eigyo, label: "営業担当", voice: 12, pitch: 0.02}
    - {id: hankyu, label: "阪急の人", voice: 13, pitch: 0.03, item: hat}
    - {id: kyaku, label: "通勤客", voice: 12, pitch: 0.05}
scenes:
  # ============ 茶番フック ============
  - id: hook
    title: ""
    background: il_kg_now
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "駅員さんが手で切符を切っていた頃、1分間に80人をさばいてたの。"
      - speaker: zundamon
        emotion: surprised
        text: "1分で80人！？1秒に1人以上なのだ！"
      - speaker: tsumugi
        emotion: normal
        text: "機械を作る側は、その速さを超えろと言われたんだよ。"
      - speaker: zundamon
        emotion: thinking
        text: "人間の職人技に、機械が勝てと。無茶ぶりなんだが。"
      - speaker: tsumugi
        emotion: normal
        text: "しかも遅れたら、朝のホームで人が詰まる。失敗できない機械なの。"
      - speaker: zundamon
        emotion: surprised
        text: "毎朝くぐってるあの箱、そんな重い任務を背負ってたのか。"
      - speaker: zundamon
        emotion: angry
        text: "……ところでつむぎ、聞いてほしいのだ。今朝、改札に閉じ込められたのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "閉じ込められた？"
      - speaker: zundamon
        emotion: angry
        text: "カードをかざしたら、扉がバタンと閉まって、ボクを止めたのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "残高、足りてた？"
      - speaker: zundamon
        emotion: sad
        text: "……20円足りなかったのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "改札は悪くないね。"
      - speaker: zundamon
        emotion: normal
        text: "でも気づいたのだ。あの扉、ふだんは開きっぱなしだぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "そう。日本の改札は、普段は開いていて、問題があるときだけ閉じるの。"
      - speaker: zundamon
        emotion: thinking
        text: "無賃乗車し放題じゃないか。閉めておけばいいのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "外国の改札は、たいてい閉まってるよ。入れて、開けて、通る。"
      - speaker: zundamon
        emotion: surprised
        text: "じゃあなんで日本だけ開けてるんだ？"
      - speaker: tsumugi
        emotion: normal
        text: "1960年代の駅を、技術者がずっと立って見ていたからだよ。"
      - speaker: zundamon
        emotion: thinking
        text: "立って、見ていた。"
      - speaker: tsumugi
        emotion: normal
        text: "そのとき彼らに突きつけられた条件が、これ。"
      - speaker: tsumugi
        emotion: normal
        se: don
        text: "「1分間に80人。駅員より遅かったら、失敗だ」"
      - speaker: zundamon
        emotion: surprised
        text: "1分で80人！？1秒に1人以上なのだ！"
      - speaker: tsumugi
        emotion: happy
        text: "しかも、切符の裏表がバラバラのままでね。"
      - speaker: zundamon
        emotion: happy
        text: "聞くのだ。閉じ込められた恨みは、いったん置いておくのだ。"
  # ============ 1960年代・通勤地獄 ============
  - id: era1960
    title: ""
    background: il_kg_station
    bgm: serious
    cuts:
      - speaker: reimu
        text: "1960年代の日本。経済は年に10パーセント以上の勢いで膨らんでいました。"
        video: assets/clips/kg_era1960.mp4
        video_full: true
        video_span: 2
      - speaker: reimu
        text: "駅には、その勢いがそのまま押し寄せていました。"
  - id: rush
    title: "1分間に80人"
    background: il_kg_station
    bgm: kinakusai
    stage:
      - {who: ekiin, x: 0.5}
    cuts:
      - speaker: reimu
        text: "当時の改札に、機械はありません。係員が一人ひとりの切符にハサミを入れます。"
      - speaker: ekiin
        emotion: normal
        text: "はい、どうぞ。どうぞ。次の[方|かた]。"
      - speaker: reimu
        text: "その速さ、1分間におよそ75人から80人。1秒に1人以上です。"
      - speaker: ekiin
        emotion: sad
        text: "……手が、痛い。鋏を握りすぎて豆ができた。"
      - speaker: reimu
        text: "1日の乗客の半分以上が、朝のわずかな時間に集中していました。"
      - speaker: ekiin
        emotion: angry
        text: "ホームがいっぱいだ！改札を止めろ！"
      - speaker: reimu
        text: "ホームが満員になると、転落を防ぐために改札そのものを閉めます。"
      - speaker: reimu
        text: "電車が出れば、また開ける。その繰り返しでした。"
      - speaker: ekiin
        emotion: sad
        text: "人を増やしたくても、混むのは朝と夕方だけなんだ。"
  # ============ 梅田駅の張り込み ============
  - id: harikomi
    title: "立って、見ていた"
    background: il_kg_umeda
    bgm: curious
    stage:
      - {who: zundamon, x: 0.22, flip: true, tag: "田中"}
      - {who: tsumugi, x: 0.5, tag: "浅田"}
      - {who: ekiin, x: 0.8}
    cuts:
      - speaker: reimu
        text: "機械を作ることになった技術者たちは、まず駅へ行きました。"
      - speaker: zundamon
        emotion: normal
        text: "[浅田|あさだ]。今日もここに立つぞ。"
      - speaker: tsumugi
        emotion: thinking
        text: "田中さん、もう三日目ですよ。何を見てるんですか。"
      - speaker: zundamon
        emotion: normal
        text: "係員の手だ。あの人、切符をほとんど見てないように見えるだろう。"
      - speaker: tsumugi
        emotion: normal
        text: "たしかに。ただ立ってるだけに見えます。"
      - speaker: zundamon
        emotion: normal
        text: "……すみません。あなた、切符を見ていますか。"
      - speaker: ekiin
        emotion: normal
        text: "見てますよ。ちゃんと見てる。"
      - speaker: ekiin
        emotion: normal
        text: "問題がないから、黙ってるだけです。"
      - speaker: tsumugi
        emotion: surprised
        text: "……本当ですか？"
      - speaker: ekiin
        emotion: normal
        text: "あ、もしもしお客さん。それ、期限が切れてますよ。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "……見えてる。あの速さで、全部見えてるのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "お客さんも、定期をさっと見せて、止まりもしない。"
      - speaker: zundamon
        emotion: normal
        text: "[浅田|あさだ]。ここには、信頼があるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "信頼、ですか。"
      - speaker: zundamon
        emotion: normal
        text: "ほとんどの客は、正しい券を持っている。係員はそれを知っている。"
      - speaker: zundamon
        emotion: normal
        text: "だから、止めない。止めないから、流れる。"
      - speaker: reimu
        text: "この観察が、のちの設計思想を決めます。"
  # ============ 暴動が起こるかもしれない ============
  - id: joken
    title: "失敗は許されない"
    background: il_kg_office
    bgm: serious
    stage:
      - {who: zundamon, x: 0.22, flip: true, tag: "田中"}
      - {who: tsumugi, x: 0.5, tag: "浅田"}
      - {who: tetsudo, x: 0.8}
    cuts:
      - speaker: zundamon
        emotion: normal
        text: "券が正しければ扉を開く。それでいいはずなのだ。"
      - speaker: tetsudo
        emotion: normal
        text: "違います。それは改札機の、基本機能です。"
      - speaker: zundamon
        emotion: surprised
        text: "基本機能。では、最大の要件は。"
      - speaker: tetsudo
        emotion: normal
        text: "速度です。ラッシュ時の係員の処理能力を、下回ってはいけない。"
      - speaker: tsumugi
        emotion: thinking
        text: "……下回ると、どうなるんですか。"
      - speaker: tetsudo
        emotion: sad
        text: "改札に人が溜まります。ホームにも、階段にも。"
      - speaker: tetsudo
        emotion: normal
        se: don
        text: "駅で、暴動が起こるかもしれない。"
      - speaker: zundamon
        emotion: surprised
        text: "暴動。"
      - speaker: tetsudo
        emotion: normal
        text: "それに、一度失敗すれば、世の中は二度と自動化を受け入れません。"
      - speaker: tetsudo
        emotion: normal
        text: "だから、失敗は絶対に許されないんです。"
      - speaker: reimu
        text: "この一言を聞いたときの衝撃を、田中はのちに語っています。"
      - speaker: zundamon
        emotion: sad
        text: "……[浅田|あさだ]。これは、機械を作る話じゃないぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "はい。人の流れを、止めない話です。"
  # ============ 3本バーの壁 ============
  - id: kabe
    title: "毎分20人の壁"
    background: il_kg_lab
    bgm: kinakusai
    stage:
      - {who: zundamon, x: 0.3, flip: true, tag: "田中"}
      - {who: tsumugi, x: 0.74, tag: "浅田"}
    cuts:
      - speaker: reimu
        text: "当時、世界にあった自動改札は、どれも普段は閉じている方式でした。"
      - speaker: tsumugi
        emotion: normal
        text: "海外の方式を、まず作ってみました。三本のバーが回るやつです。"
      - speaker: zundamon
        emotion: normal
        text: "よし、測るぞ。何人通せる。"
      - speaker: tsumugi
        emotion: sad
        text: "……毎分20人です。"
      - speaker: zundamon
        emotion: surprised
        text: "20人！？係員の四分の一なのだ！"
      - speaker: tsumugi
        emotion: normal
        text: "どう改良しても、これ以上は上がりません。"
      - speaker: reimu
        text: "ロンドンやアメリカで動いていた最新式でも、毎分15人から20人ほどでした。"
      - speaker: zundamon
        emotion: thinking
        text: "……なぜ上がらないか、分かるか。"
      - speaker: tsumugi
        emotion: thinking
        text: "止まるからです。閉まっているから、人はいったん止まる。"
      - speaker: zundamon
        emotion: normal
        text: "そうだ。止まった人を動かすのに、時間がかかるのだ。"
      - speaker: zundamon
        emotion: happy
        se: don
        text: "なら、閉めるのをやめるぞ。"
      - speaker: tsumugi
        emotion: surprised
        text: "開けっぱなしにするんですか！？ただ乗りされます。"
      - speaker: zundamon
        emotion: normal
        text: "梅田で見ただろう。ほとんどの客は、正しい券を持っているのだ。"
      - speaker: zundamon
        emotion: normal
        text: "普段は開けておく。おかしい券のときだけ、閉じる。"
      - speaker: tsumugi
        emotion: thinking
        text: "……お客さんを、疑わない改札。"
      - speaker: reimu
        text: "普段は開いている方式は、ノーマルオープンと呼ばれます。"
      - speaker: reimu
        text: "ただしこれは、性善説である以前に、混雑をさばくための答えでもありました。"
  # ============ 機械の長さの謎 ============
  - id: nagasa
    title: "なぜ改札は長いのか"
    background: il_kg_lab
    bgm: curious
    stage:
      - {who: zundamon, x: 0.3, flip: true, tag: "田中"}
      - {who: tsumugi, x: 0.74, tag: "浅田"}
    cuts:
      - speaker: tsumugi
        emotion: thinking
        text: "田中さん。読み取りは、切符を入れた瞬間に終わってるんですよね。"
      - speaker: zundamon
        emotion: normal
        text: "終わってる。一瞬だ。"
      - speaker: tsumugi
        emotion: thinking
        text: "じゃあ、すぐ横から返せばいい。機械はもっと短くできます。"
      - speaker: zundamon
        emotion: normal
        text: "……いや。それだと、客は立ち止まるぞ。"
      - speaker: tsumugi
        emotion: surprised
        text: "なぜですか。"
      - speaker: zundamon
        emotion: normal
        text: "客は歩きながら券を入れる。入れた手は、体の後ろに残るのだ。"
      - speaker: zundamon
        emotion: normal
