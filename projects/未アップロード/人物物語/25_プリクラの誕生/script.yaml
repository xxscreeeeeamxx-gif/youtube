        reading: "ちゅうしょうきぎょうのゆうしゅうしんぎじゅつしんせいひんしょうもうけています。"
      - speaker: otoko
        emotion: happy
        text: "[佐々木|ささき]さん、賞だって。二つも。"
      - speaker: zundamon
        emotion: normal
        text: "実績解除なのだ。……というか、プリクラって略されてるぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。誰も[倶楽部|くらぶ]まで言わない。"
      - speaker: zundamon
        emotion: sad
        text: "硬い字にした意味、なかったのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "略される商品は、当たった商品だよ。"
      - speaker: zundamon
        emotion: thinking
        text: "……いい言葉なのだ。今のは覚えておくぞ。"
      - speaker: otoko
        emotion: normal
        text: "あと、あの青いのも人気になってる。"
      - speaker: zundamon
        emotion: normal
        text: "青いの。"
      - speaker: otoko
        emotion: happy
        text: "案内役の悪魔。プリクラ太郎って呼ばれてるらしい。"
      - speaker: zundamon
        emotion: surprised
        text: "太郎！？ 名前が変わってるぞ。"
      - speaker: tsumugi
        emotion: sad
        text: "うちのゲーム知らない人からしたら、そう見えるんだよ。"
      - speaker: zundamon
        emotion: normal
        text: "悪魔だと知らないまま愛されてるのだ。逆にアリだぞ。"
      - speaker: otoko
        emotion: normal
        text: "しかし、あんなに反対して悪かったね。"
      - speaker: zundamon
        emotion: happy
        text: "反対は別にいいのだ。ボクも根拠なかったし。"
      - speaker: otoko
        emotion: normal
        text: "じゃあ、何が悪かったの。"
      - speaker: zundamon
        emotion: normal
        text: "そんなの持って帰ってどうすんの、の言い方なのだ。"
      - speaker: otoko
        emotion: sad
        text: "……あー。"
      - speaker: zundamon
        emotion: normal
        text: "分からないなら、分からないって言えばよかったぞ。"
      - speaker: otoko
        emotion: sad
        text: "……はい。"
      - speaker: zundamon
        emotion: happy
        text: "はい、この話おわり。伝票やるぞ。"
  - id: harano_no
    title: "自分たちだけが儲けるのは"
    background: il_pk_kaigi
    bgm: 223am
    stage:
      - {who: harano, x: 0.26, flip: true}
      - {who: otoko, x: 0.72}
    cuts:
      - speaker: reimu
        text: "ヒットを受けて、役員会である案が出ました。"
        reading: "ひっとをうけて、やくいんかいであるあんがでました。"
      - speaker: otoko
        emotion: happy
        text: "うちの機械だけを置いた、専用の店を作りませんか。"
      - speaker: harano
        emotion: normal
        text: "専用。他社のは置かない、ということか。"
      - speaker: otoko
        emotion: happy
        text: "はい。今なら行列ができます。全部うちの売上です。"
      - speaker: harano
        emotion: thinking
        text: "……たしかに儲かるな。"
      - speaker: otoko
        emotion: happy
        text: "でしょう。今やらないと。"
      - speaker: harano
        emotion: normal
        se: don
        text: "やらない。"
      - speaker: otoko
        emotion: surprised
        text: "……え。"
      - speaker: harano
        emotion: normal
        text: "自分たちだけが儲けるのは、だめだ。"
        telops:
          - {text: "自分たちだけが儲けるのはダメだ", size: lg, position: bottom-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: otoko
        emotion: normal
        text: "……なんでですか。"
      - speaker: harano
        emotion: normal
        text: "この機械、うちの店だけで育ったか？"
      - speaker: otoko
        emotion: thinking
        text: "……いえ。全国の店が置いてくれたので。"
      - speaker: harano
        emotion: normal
        text: "[焼津|やいづ]の店員が言い出した話でもある。"
      - speaker: otoko
        emotion: sad
        text: "……そうでした。"
      - speaker: harano
        emotion: normal
        text: "囲い込んだら、次に持ってきてくれる人がいなくなる。"
      - speaker: reimu
        text: "原野は、この案に反対しました。"
        reading: "はらのわ、このあんにはんたいしました。"
  - id: shimizu_ato
    title: ""
    background: il_pk_yaizu
    bgm: 223am
    stage:
      - {who: shimizu, x: 0.28, flip: true}
      - {who: harano, x: 0.72}
    cuts:
      - speaker: harano
        emotion: normal
        text: "[清水|しみず]さん。あの話、権利のことなんだが。"
      - speaker: shimizu
        emotion: normal
        text: "説明は聞きました。難しくてよく分からなかったです。"
      - speaker: harano
        emotion: normal
        text: "分からないまま決めなくていい。"
      - speaker: shimizu
        emotion: happy
        text: "いいですよ。うちの店に置いてもらえれば。"
      - speaker: harano
        emotion: surprised
        text: "本当にいいのか。"
      - speaker: shimizu
        emotion: normal
        text: "はい。女の子が来るようになりましたから。"
      - speaker: reimu
        text: "清水は権利について説明を受けましたが、無償での扱いを了承しています。"
        reading: "しみずわけんりについてせつめいをうけましたが、むしょうでのあつかいをりょうしょうしています。"
      - speaker: shimizu
        emotion: happy
        text: "土曜の夕方に、うちの店に列ができるんです。"
      - speaker: harano
        emotion: normal
        text: "……そうか。"
      - speaker: shimizu
        emotion: normal
        text: "前は、男の子だけの店だったので。"
  - id: peak
    title: "ブームは2年で"
    background: il_pk_purikura
    bgm: hirusagari
    stage:
      - {who: zundamon, x: 0.26, tag: "佐々木", flip: true}
      - {who: tsumugi, x: 0.72, tag: "岡田"}
    cuts:
      - speaker: reimu
        text: "他社も次々と同じ機械を出し、遊びの要素が増えていきます。"
        reading: "たしゃもつぎつぎとおなじきかいをだし、あそびのようそがふえていきます。"
      - speaker: tsumugi
        emotion: normal
        text: "他社のやつ、ペンで文字が書けるようになってる。"
      - speaker: zundamon
        emotion: surprised
        text: "書ける！？ シールに落書きできるのか。"
      - speaker: tsumugi
        emotion: normal
        text: "有名人の写真と合成できるのもある。"
      - speaker: zundamon
        emotion: thinking
        text: "……どんどん先に行かれてるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "悔しい？"
      - speaker: zundamon
        emotion: happy
        text: "全然。ボクが欲しかったのは、これなのだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "これ？"
      - speaker: zundamon
        emotion: normal
        text: "女の子が、遊べる場所。作ったのが誰かは、二番目なのだ。"
      - speaker: reimu
        text: "1999年ごろ、第一次ブームがピークを迎えます。"
        reading: "せんきゅうひゃくきゅうじゅうきゅうねんごろ、だいいちじぶーむがぴーくをむかえます。"
      - speaker: reimu
        text: "そして、過熱したブームは2年ほどでしぼんでいきました。"
        reading: "そして、かねつしたぶーむわにねんほどでしぼんでいきました。"
      - speaker: tsumugi
        emotion: sad
        text: "……街から、ずいぶん減ったな。"
      - speaker: zundamon
        emotion: normal
        text: "うん。あれだけあったのに。"
      - speaker: tsumugi
        emotion: normal
        text: "終わったと思う？"
      - speaker: zundamon
        emotion: thinking
        text: "……どうだろうな。"
      - speaker: tsumugi
        emotion: normal
        text: "みんな携帯を持ち始めた。写真も撮れる。"
      - speaker: zundamon
        emotion: normal
        text: "自分で撮れるなら、300円払わないのだ。"
      - speaker: tsumugi
        emotion: sad
        text: "……役目、終わりかな。"
      - speaker: zundamon
        emotion: normal
        text: "終わらないと思うぞ。ひとつだけ、携帯にできないことがある。"
      - speaker: tsumugi
        emotion: surprised
        text: "なに。"
      - speaker: zundamon
        emotion: normal
        text: "紙で出て、その場で分けられるのだ。"
  - id: ima
    title: "30年後の、盛る"
    background: il_pk_purikura
    bgm: you_and_me
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: zundamon
        emotion: normal
        text: "……で、今はどうなってるんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "残ってるよ。30年、ずっと。"
      - speaker: zundamon
        emotion: surprised
        text: "30年！？ ブームが終わったのに？"
      - speaker: tsumugi
        emotion: normal
        text: "終わったのはブーム。機械は進化し続けたの。"
      - speaker: reimu
        text: "その後の機械は、目の大きさや肌の明るさを調整できるようになります。"
        reading: "そのごのきかいわ、めのおおきさやはだのあかるさをちょうせいできるようになります。"
      - speaker: zundamon
        emotion: thinking
        text: "……それが、盛るなのだ？"
      - speaker: tsumugi
        emotion: normal
        text: "そう。きれいに写ることを盛るって呼んだの。"
      - speaker: zundamon
        emotion: surprised
        text: "ボクが30分かけてやってるやつ！"
      - speaker: tsumugi
        emotion: happy
        text: "そう。あなたの102枚は、ここから来てるの。"
      - speaker: zundamon
        emotion: normal
        text: "……ボク、30年前の会議の続きをやってたのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "写真を加工していい、っていう考え方も、ここから広まったんだよ。"
      - speaker: zundamon
        emotion: thinking
        text: "……前は、写真っていじっちゃだめだったのか。"
      - speaker: tsumugi
        emotion: normal
        text: "記録だったからね。ありのままを残すもの。"
      - speaker: zundamon
        emotion: normal
        text: "それが、遊んでいいものになったのだ。"
      - speaker: reimu
        text: "自分の顔を加工して見せることは、今では当たり前になりました。"
        reading: "じぶんのかおをかこうしてみせることわ、いまでわあたりまえになりました。"
      - speaker: tsumugi
        emotion: normal
        text: "スマホの自撮りも、加工のアプリも、たどると同じ場所に行き着く。"
      - speaker: zundamon
        emotion: surprised
        text: "……ゲームセンターの、隅っこなのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "そう。3時間で2人しか来なかった、あの機械。"
  - id: sasaki_ato
    title: "宝くじに当たったようなもの"
    background: il_pk_kaigo
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.3, tag: "佐々木", flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: reimu
        text: "佐々木美穂は、その後アトラスを離れました。"
        reading: "ささきみほわ、そのごあとらすをはなれました。"
      - speaker: reimu
        text: "都内の介護施設で、お年寄りの世話をする仕事に就いています。"
        reading: "とないのかいごしせつで、おとしよりのせわをするしごとについています。"
      - speaker: zundamon
        emotion: normal
        text: "……はい、ゆっくりでいいですよ。手すり、つかまって。"
      - speaker: tsumugi
        emotion: surprised
        text: "……ゲームの会社じゃ、なくなったんだ。"
      - speaker: zundamon
        emotion: normal
        text: "うん。今はこっちなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "あれだけのものを作った人が、って言われない？"
      - speaker: zundamon
        emotion: happy
        text: "言われるのだ。でも、あれは運がよかっただけだぞ。"
      - speaker: tsumugi
        emotion: surprised
        text: "運。"
      - speaker: zundamon
        emotion: normal
        text: "宝くじに当たったようなものなのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "……そんな言い方する？"
      - speaker: zundamon
        emotion: normal
        text: "だって、当たると思って作ってないぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "でも、買わなきゃ当たらない。"
      - speaker: zundamon
        emotion: happy
        text: "……そこは、たしかにそうなのだ。"
      - speaker: reimu
        text: "宝くじに当たったようなもの。いつ死んでも悔いはありません。"
        reading: "たからくじにあたったようなもの。いつしんでもくいわありません。"
      - speaker: reimu
        text: "佐々木美穂は、そう語っています。"
        reading: "ささきみほわ、そうかたっています。"
      - speaker: tsumugi
        emotion: sad
        text: "……悔いがない、か。"
      - speaker: zundamon
        emotion: normal
        text: "会議で、ひとりだけ反対されたのを覚えてるか。"
      - speaker: tsumugi
        emotion: normal
        text: "覚えてる。そんなの持って帰ってどうすんの。"
      - speaker: zundamon
        emotion: normal
        text: "あそこで黙ってたら、何も残らなかったのだ。"
      - speaker: tsumugi
        emotion: sad
        text: "……うん。"
      - speaker: zundamon
        emotion: happy
        text: "だから、あの日のボクにだけは、ちょっと感謝してるぞ。"
      - speaker: reimu
        text: "佐々木美穂さんは、いまはもうこの世にいません。"
        reading: "ささきみほさんわ、いまわもうこのよにいません。"
      - speaker: reimu
        text: "あの機械は、いまも街のどこかで動いています。"
        reading: "あのきかいわ、いまもまちのどこかでうごいています。"
  - id: end
    title: ""
    background: il_pk_purikura
    bgm: you_and_me
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "今度プリクラを見かけたら、値段のところを見てみて。"
      - speaker: zundamon
        emotion: normal
        text: "値段。"
      - speaker: tsumugi
        emotion: normal
        text: "そこが100円じゃない理由を、ひとりの人が押し通したの。"
      - speaker: zundamon
        emotion: thinking
        text: "……100円玉、3枚なのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "覚えてたね。"
      - speaker: zundamon
        emotion: normal
        text: "でも不思議なのだ。会議で勝ったのは、多数決じゃないぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "そうだね。全員が反対してた。"
      - speaker: zundamon
        emotion: normal
        text: "反対した人たちも、間違ってなかったのだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "え。"
      - speaker: zundamon
        emotion: normal
        text: "自分が欲しくないものを、欲しくないって言っただけなのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "……そうか。正直ではあったんだ。"
      - speaker: zundamon
        emotion: normal
        text: "足りなかったのは、その部屋にいない人の分なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "……その場にいない人のことは、その場では分からない。"
      - speaker: zundamon
        emotion: happy
        text: "だから、ひとりだけ違うことを言う人が要るのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "うん。……あ、ずんだもん。写真、まだ加工してる？"
      - speaker: zundamon
        emotion: happy
        text: "してるのだ。今103枚目。"
      - speaker: tsumugi
        emotion: surprised
        text: "増えてる。1枚だけって言ってたよね。"
      - speaker: zundamon
        emotion: happy
        text: "つむぎさんと撮ったのだ。だから、これは配る用なのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "……それ、いちばん正しい使い方だよ。"
      - speaker: zundamon
        emotion: happy
        text: "チャンネル登録も、してくれると嬉しいのだ！"
      - speaker: tsumugi
        emotion: happy
        text: "感想もコメントで教えてね。"
      - speaker: tsumugi
        emotion: happy
        duet_with: zundamon
        text: "ご視聴、ありがとうございました！"
