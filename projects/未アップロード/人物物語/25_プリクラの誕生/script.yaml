      - speaker: tsumugi
        emotion: normal
        text: "俺、思い出したことがある。"
      - speaker: zundamon
        emotion: normal
        text: "なに。"
      - speaker: tsumugi
        emotion: normal
        text: "駅の証明写真の機械。あそこに女の子が2人で入ってた。"
      - speaker: zundamon
        emotion: surprised
        text: "履歴書用じゃなくて？"
      - speaker: tsumugi
