      - speaker: zundamon
        emotion: surprised
        text: "何がだ。"
      - speaker: tsumugi
        emotion: normal
        text: "ピンときてない、って言ったやつ。あれ、俺が見えてなかっただけだ。"
      - speaker: zundamon
        emotion: happy
        text: "見えたなら、それでいいのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "手のひら返して悪いけど、これ、いけるんじゃないか。"
      - speaker: zundamon
        emotion: happy
        text: "手のひらは、何回返してもいいのだ。"
  - id: nedan
