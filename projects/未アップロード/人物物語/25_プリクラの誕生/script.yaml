# プリクラ再現ドラマ・ミーム版（[佐々木美穂|ささきみほ]×[岡田耕始|おかだこうじ]・1986→現代）。投稿前に必ず目視レビュー。
# 配役: ずんだもん=佐々木美穂（アトラス営業）/ つむぎ=岡田耕始（開発）/ ナレ=ゆっくり
# 配慮: sasaki_ato（その後・逝去）はミーム完全禁止でクリーン維持。shimizu_kenri も静かに。
# 裏取り: プリント倶楽部Wikipedia「企画・開発」「本稼働後の反響」/ Yahoo!ニュース特集1189（佐々木本人インタビュー）/
#   朝日新聞「はじまりを歩く」プリントシール機（佐々木美穂さん=故人・技術職の矢野さんとの雑談）/ 愛ラブSMAP!Wikipedia（テレビ東京・1991-10-06〜1996-03-25）
# 確定事実: 1986年4月原野直也がアトラス設立 / 佐々木はリクルートから1987年移籍 /
#   焼津のゲーセン店員・清水隆志が女性客向けに発案 / 当時の女性向け機は占い機とパズル機のみ /
#   電話のやり取りで偶然見たビデオプリンターが着想元 / 男性陣「そんなの持って帰ってどうすんの」/
#   90年代半ばは格闘ゲーム全盛で客層は格ゲー男子 / ロケテストは芳しくない反応 /
#   1995年2月アミューズメントの展示会でコンパニオンが空き時間に並び長蛇の列 /
#   1995年7月発売・原価約200円だが女性の意見で1回300円 / 案内役はジャックフロスト /
#   峰岸不二男のツテで1995年「愛ラブSMAP!」（テレビ東京）→回線パンク /
#   1996年流行語大賞・第八回中小企業優秀新技術新製品賞 / 1997年時点で設置5万台超 /
#   1999年頃ピーク・2年ほどで収縮 / 原野「自分たちだけが儲けるのはダメだ」/
#   清水は権利の説明を受けたが当時は無償を了承 / 佐々木は退社後に介護の仕事・故人
meta:
  title: "【プリクラの誕生】そんなの持って帰ってどうすんの【ずんだもん解説】"
  slug: "purikura-meme"
  summary: "ゲームセンターが男の子だけの場所だった1990年代。アトラスという小さなゲーム会社の営業だった佐々木美穂は、会議である提案をします。返ってきたのは「そんなの持って帰ってどうすんの」でした。日本中の女の子を行列に並ばせることになる機械が、どこから生まれたのか。ずんだもんが佐々木を演じる再現ドラマです。"
  tags: ["プリクラ", "プリント倶楽部", "佐々木美穂", "アトラス", "セガ", "90年代", "再現ドラマ", "ゆっくり", "ずんだもん", "発明", "ミーム"]
  thumbnail:
    top: "ゲーセンは男の場所"
    bottom: "そんなの誰が持って帰る"
  mode: drama
  narrator: reimu
  mobs:
    - {id: harano, label: "原野", voice: 13, pitch: -0.05, item: mustache}
    - {id: otoko, label: "男性社員", voice: 12, hair: short}
    - {id: shimizu, label: "清水", voice: 12, pitch: 0.06, item: hat}
    - {id: nakayama, label: "中山社長", voice: 13, pitch: -0.1, item: none}
    - {id: konpanion, label: "コンパニオン", voice: 8, pitch: 0.06, hair: twintail}
    - {id: jk, label: "女子高生", voice: 8, pitch: 0.1, hair: twintail}
    - {id: minegishi, label: "峰岸", voice: 13, pitch: 0.05, item: book}
scenes:
  - id: hook
    title: ""
    background: il_pk_heya
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "そんなの持って帰って、どうすんの。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "な、なんだ急に。ボク何も持ってないぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "30年前、ある女の人の企画に、会社の男の人たちが返した言葉。"
      - speaker: zundamon
        emotion: angry
        text: "うわ、言い方。塩対応にもほどがあるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "その企画がね。[日本中|にほんじゅう]の女の子を、ゲームセンターに並ばせたの。"
        telops:
          - {text: "そんなの持って帰ってどうすんの", size: lg, position: bottom-center, color: "#FFF15A", stroke: "#3A1A2A", glow: "#E85096", anim: up}
      - speaker: zundamon
        emotion: surprised
        text: "情緒どうなってんの。で、何を作ったんだ？"
      - speaker: tsumugi
        emotion: happy
        text: "その話をする前に。ずんだもん、さっきから何してるの。"
      - speaker: zundamon
        emotion: happy
        text: "自撮りなのだ。今ので102枚目。"
      - speaker: tsumugi
        emotion: surprised
        text: "102枚。全部おんなじ顔だけど。"
      - speaker: zundamon
        emotion: normal
        text: "違うのだ。1枚目は前髪が3ミリ右で、42枚目は光が違う。"
      - speaker: tsumugi
        emotion: thinking
        text: "その差、誰が分かるの。"
      - speaker: zundamon
        emotion: happy
        text: "ボクは記録係なのだ。歴史を残しているんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "自分の顔の歴史ね。それ、誰得なの。"
      - speaker: zundamon
        emotion: normal
        text: "俺得なのだ。……いや、分かった。今日は反省するぞ。"
      - speaker: tsumugi
        emotion: happy
        text: "お、えらい。"
      - speaker: zundamon
        emotion: happy
        text: "今日はもう、1枚だけにするのだ。厳選するぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん、それでいいと思う。"
      - speaker: zundamon
        emotion: normal
        text: "……で、この1枚を30分かけて盛るのだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "枚数減らして、時間増えてる。総量は変わってないよ。"
      - speaker: zundamon
        emotion: happy
        text: "質を上げたのだ。圧倒的成長。"
      - speaker: tsumugi
        emotion: normal
        text: "その盛るっていう言葉ね。生まれたきっかけが、今日の話。"
      - speaker: zundamon
        emotion: surprised
        text: "えっ。盛るに誕生日があったのか。"
      - speaker: tsumugi
        emotion: normal
        text: "写真を、その場でシールにする機械。プリクラだよ。"
        telops:
          - {text: "プリクラ", size: xl, position: bottom-center, color: "#FFFFFF", stroke: "#3A1A2A", glow: "#E85096", anim: up}
      - speaker: zundamon
        emotion: thinking
        text: "プリクラ。ボクでも知ってるのだ。昔からあるやつ。"
      - speaker: tsumugi
        emotion: normal
        text: "昔からじゃないよ。1995年、日本で生まれたの。"
      - speaker: zundamon
        emotion: surprised
        text: "日本！？世界のどこかから来たと思ってたのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "作ったのは、社員が数十人の小さなゲーム会社。"
      - speaker: zundamon
        emotion: surprised
        text: "大手じゃないのか。ファッ！？"
      - speaker: tsumugi
        emotion: normal
        text: "そこの営業だった、ひとりの女の人が言い出したの。"
      - speaker: zundamon
        emotion: normal
        text: "それで、さっきの塩対応につながるんだな。"
      - speaker: tsumugi
        emotion: happy
        text: "そう。今日はその人の話だよ。"
      - speaker: reimu
        text: "プリクラ。写真をその場でシールにする機械です。"
        reading: "ぷりくら。しゃしんをそのばでしーるにするきかいです。"
      - speaker: reimu
        text: "作ったのは、社員数十人の小さなゲーム会社の営業でした。"
        reading: "つくったのわ、しゃいんすうじゅうにんのちいさなげーむがいしゃのえいぎょうでした。"
      - speaker: reimu
        text: "物語は、1986年の東京から始まります。"
        reading: "ものがたりわ、せんきゅうひゃくはちじゅうろくねんのとうきょうからはじまります。"
  - id: era1986
    title: "1986・神楽坂の小さな会社"
    background: il_pk_atlas
    bgm: 10do
    stage:
      - {who: zundamon, x: 0.28, tag: "佐々木", flip: true}
      - {who: harano, x: 0.7}
    cuts:
      - speaker: reimu
        text: "1986年4月、原野直也がアトラスというゲーム会社を作りました。"
        reading: "せんきゅうひゃくはちじゅうろくねんしがつ、はらのなおやがあとらすというげーむがいしゃをつくりました。"
      - speaker: reimu
        text: "場所は東京の神楽坂。社員は数えるほどでした。"
        reading: "ばしょわとうきょうのかぐらざか。しゃいんわかぞえるほどでした。"
      - speaker: harano
        emotion: normal
        text: "うちは小さい。だから、大きいところがやらないことをやる。"
      - speaker: zundamon
        emotion: normal
        text: "……[原野|はらの]さん。今日も名刺、置いていきますね。"
      - speaker: harano
        emotion: normal
        text: "[佐々木|ささき]さん、今月何回目だ。もう顔だけで用件が分かる。"
      - speaker: zundamon
        emotion: happy
        text: "営業なので。通うのが仕事なのだ。"
      - speaker: reimu
        text: "佐々木美穂。このときはリクルートの営業でした。"
        reading: "ささきみほ。このときわりくるーとのえいぎょうでした。"
      - speaker: reimu
        text: "求人広告を売るために、アトラスへ通っていたのです。"
        reading: "きゅうじんこうこくをうるために、あとらすえかよっていたのです。"
      - speaker: harano
        emotion: thinking
        text: "[佐々木|ささき]さん。逆に聞くけど、うちで働く気はない？"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "……え。今、ボクを引き抜こうとしたか？"
      - speaker: harano
        emotion: normal
        text: "した。だって、うちの誰より、うちに詳しいだろ。"
      - speaker: zundamon
        emotion: thinking
        text: "……たしかに。通いすぎて社員だと思われてるのだ。"
      - speaker: harano
        emotion: happy
        text: "給料は保証できない。おもしろいことは保証する。"
      - speaker: zundamon
        emotion: normal
        text: "後半だけで判断するの、危ないと思うぞ。"
      - speaker: harano
        emotion: normal
        text: "危ないよ。でも来ないか。"
      - speaker: zundamon
        emotion: happy
        text: "……行くのだ。"
      - speaker: reimu
        text: "1987年、佐々木はアトラスへ移りました。"
        reading: "せんきゅうひゃくはちじゅうななねん、ささきわあとらすえうつりました。"
      - speaker: zundamon
        emotion: normal
        text: "ところで、うちは何を作る会社なんだ？"
      - speaker: harano
        emotion: normal
        text: "決めてない。ゲームも作るし、カラオケボックスもやる。"
      - speaker: zundamon
        emotion: surprised
        text: "ジャンル、ガバガバすぎるのだ。"
      - speaker: harano
        emotion: happy
        text: "小さい会社の強みだ。呼ばれたところに全部行く。"
      - speaker: zundamon
        emotion: thinking
        text: "無節操を強みと言い張るの、けっこう好きなのだ。"
  - id: gamecenter
    title: "格ゲー男子しかいない店"
    background: il_pk_gamecenter
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.26, tag: "佐々木", flip: true}
      - {who: tsumugi, x: 0.72, tag: "岡田"}
    cuts:
      - speaker: reimu
        text: "1990年代の半ば。ゲームセンターは格闘ゲームの全盛期でした。"
        reading: "せんきゅうひゃくきゅうじゅうねんだいのなかば。げーむせんたーわかくとうげーむのぜんせいきでした。"
      - speaker: tsumugi
        emotion: normal
        text: "[佐々木|ささき]さん、見てよ。今日も満席だ。"
      - speaker: zundamon
        emotion: normal
        text: "[岡田|おかだ]さん。ちょっと数えてみたのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "うん。何を？"
      - speaker: zundamon
        emotion: normal
        text: "この店にいる人。48人。全員、男。"
      - speaker: tsumugi
        emotion: surprised
        text: "……言われてみれば。"
      - speaker: zundamon
        emotion: normal
        text: "対戦台に張りついて、100円ずつ入れて、勝った負けたなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "それがいちばん儲かるからね。負けたらもう100円入るし。"
      - speaker: zundamon
        emotion: thinking
        text: "負けるほど売上が伸びる仕組み。よくできてるのだ。"
      - speaker: reimu
        text: "対戦台は、客が負けるたびに次の百円が入る仕組みでした。"
        reading: "たいせんだいわ、きゃくがまけるたびにつぎのひゃくえんがはいるしくみでした。"
      - speaker: reimu
        text: "店の売上は、この繰り返しで成り立っていたのです。"
        reading: "みせのうりあげわ、このくりかえしでなりたっていたのです。"
      - speaker: zundamon
        emotion: normal
        text: "じゃあ聞くけど。女の人が来たら、何をするんだ？"
      - speaker: tsumugi
        emotion: thinking
        text: "……占いの機械。あとはパズル。"
      - speaker: zundamon
        emotion: normal
        text: "以上？"
      - speaker: tsumugi
        emotion: normal
        text: "以上。それが当時の全部だよ。"
      - speaker: reimu
        text: "当時、女性向けの機械は占い機とパズル機しかありませんでした。"
        reading: "とうじ、じょせいむけのきかいわうらないきとぱずるきしかありませんでした。"
      - speaker: zundamon
        emotion: angry
        text: "選択肢が2つ。無理ゲーすぎるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "まあ、来ないものは仕方ないでしょ。"
      - speaker: zundamon
        emotion: thinking
        text: "……順番が逆じゃないか？"
      - speaker: tsumugi
        emotion: surprised
        text: "逆？"
      - speaker: zundamon
        emotion: normal
        text: "来ないから置かないんじゃなくて、置いてないから来ないのだ。"
        telops:
          - {text: "置いてないから、来ない", size: lg, position: bottom-center, color: "#FFFFFF", stroke: "#2A1A3A", glow: "#6CD8C8", anim: up}
      - speaker: tsumugi
        emotion: thinking
        text: "……それ、けっこう痛いところ突いてる。"
      - speaker: zundamon
        emotion: normal
        text: "ボクだって、この店に一人では入れないのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "入りにくい？"
      - speaker: zundamon
        emotion: normal
        text: "暗いし、うるさいし、知らない男の背中しかない。"
      - speaker: tsumugi
        emotion: sad
        text: "……そこは考えたことなかったな。"
      - speaker: zundamon
        emotion: normal
        text: "もうひとつあるのだ。こっちのほうが大きいぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "なに？"
      - speaker: zundamon
        emotion: normal
        text: "この店、100円入れて、手に何も残らないのだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "……残らない？"
      - speaker: zundamon
        emotion: normal
        text: "遊んだ記憶は残る。でも、持って帰るものがないのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "クレーンゲームがあるじゃない。ぬいぐるみ取れるよ。"
      - speaker: zundamon
        emotion: angry
        text: "取れたらな。あれ、100円で必ず取れるのか？"
      - speaker: tsumugi
        emotion: sad
        text: "……取れないね。"
      - speaker: zundamon
        emotion: normal
        text: "運ゲーなのだ。ガチャ運がない日は、財布だけ軽くなる。"
      - speaker: reimu
        text: "女性が確実に持ち帰れるものは、当時の店にありませんでした。"
        reading: "じょせいがかくじつにもちかえれるものわ、とうじのみせにありませんでした。"
  - id: yaizu
    title: "焼津のゲームセンターから"
    background: il_pk_yaizu
    bgm: natsuyasumi
    stage:
      - {who: shimizu, x: 0.28, flip: true}
      - {who: harano, x: 0.72}
    cuts:
      - speaker: reimu
        text: "同じころ、静岡県[焼津|やいづ]市のゲームセンターに一人の店員がいました。"
        reading: "おなじころ、しずおかけんやいづしのげーむせんたーにひとりのてんいんがいました。"
      - speaker: shimizu
        emotion: normal
        text: "[原野|はらの]さん、わざわざ[焼津|やいづ]まですみません。"
      - speaker: harano
        emotion: happy
        text: "いいよ。現場の話がいちばん役に立つ。"
      - speaker: shimizu
        emotion: normal
        text: "うち、女の子のお客さんが来ても、すぐ帰っちゃうんです。"
      - speaker: harano
        emotion: thinking
        text: "うん。どこもそうだ。"
      - speaker: shimizu
        emotion: normal
        text: "で、考えたんですけど。自分の写真をシールにできたら、どうですか。"
      - speaker: harano
        emotion: surprised
        se: don
        text: "……写真を、シールに？"
      - speaker: shimizu
        emotion: happy
        text: "はい。撮って、その場でペタッと。"
      - speaker: harano
        emotion: thinking
        text: "[清水|しみず]さん。それ、誰が欲しがるんだ。"
      - speaker: shimizu
        emotion: normal
        text: "分かりません。でも、女の子はシール好きですよ。"
      - speaker: harano
        emotion: normal
        text: "根拠がふわっとしてるな。データとかあるんですか。"
      - speaker: shimizu
        emotion: normal
        text: "ないです。店で毎日見てるだけです。"
      - speaker: harano
        emotion: happy
        text: "……いや、それがいちばん強いデータかもしれん。"
      - speaker: reimu
        text: "この企画は、[焼津|やいづ]の店員である清水隆志が持ち込んだものでした。"
        reading: "このきかくわ、やいづのてんいんであるしみずたかしがもちこんだものでした。"
      - speaker: reimu
        text: "需要があるかどうかは、誰にも分かりませんでした。"
        reading: "じゅようがあるかどうかわ、だれにもわかりませんでした。"
      - speaker: harano
        emotion: normal
        text: "持ち帰る。そのひとことが引っかかってるんだ。"
      - speaker: shimizu
        emotion: surprised
        text: "そこですか？"
      - speaker: harano
        emotion: normal
        text: "うちの店は、金だけ取って何も渡してない。ずっとそうだ。"
      - speaker: shimizu
        emotion: normal
        text: "……言われてみると、そうですね。"
      - speaker: harano
        emotion: normal
        text: "会社に持って帰る。うちの[佐々木|ささき]に投げてみるよ。"
  - id: printer
    title: "電話の向こうで、紙が出た"
    background: il_pk_atlas
    bgm: hirusagari
    stage:
      - {who: zundamon, x: 0.28, tag: "佐々木", flip: true}
      - {who: tsumugi, x: 0.72, tag: "岡田"}
    cuts:
      - speaker: zundamon
        emotion: normal
        text: "はい、アトラスです。……はい、来週の件ですね。"
      - speaker: reimu
        text: "電話をしながら、佐々木はある機械に目をやりました。"
        reading: "でんわをしながら、ささきわあるきかいにめをやりました。"
      - speaker: zundamon
        emotion: thinking
        text: "……ん。あの機械、何が出てるんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "ビデオプリンター。ビデオの映像を、紙に出すやつ。"
      - speaker: zundamon
        emotion: surprised
        text: "映像が、紙に。"
      - speaker: tsumugi
        emotion: normal
        text: "資料用にね。会議で使う画面を止めて、印刷してる。"
      - speaker: reimu
        text: "ビデオプリンターは、映像の一こまを紙に印刷する装置です。"
        reading: "びでおぷりんたーわ、えいぞうのひとこまをかみにいんさつするそうちです。"
      - speaker: zundamon
        emotion: normal
        text: "……[岡田|おかだ]さん。これ、紙じゃなくてもいいのか？"
      - speaker: tsumugi
        emotion: surprised
        text: "[は|はぁ]？"
      - speaker: zundamon
        emotion: normal
        text: "出てくる先が、シールの紙だったら。"
      - speaker: tsumugi
        emotion: thinking
        text: "……できなくはない。裏に糊がついてるだけだし。"
      - speaker: zundamon
        emotion: happy
        se: don
        text: "できるのか！"
      - speaker: tsumugi
        emotion: normal
        text: "落ち着いて。何を出すつもりなの。"
      - speaker: zundamon
        emotion: normal
        text: "顔なのだ。ゲームセンターで、自分の顔を撮って、シールにする。"
        telops:
          - {text: "顔を、シールにする", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#3A1A2A", glow: "#E85096", anim: up}
      - speaker: tsumugi
        emotion: surprised
        text: "……えっ、何のために？"
      - speaker: zundamon
        emotion: normal
        text: "持って帰るためなのだ。手に、必ず残るぞ。"
      - speaker: tsumugi
        emotion: thinking
        text: "……[焼津|やいづ]から来た話と、つながってる？"
      - speaker: zundamon
        emotion: happy
        text: "つながったのだ。[焼津|やいづ]の人と、同じ絵を見てるぞ。"
      - speaker: reimu
        text: "写真の機械は、それまでフィルムで撮って現像するものでした。"
        reading: "しゃしんのきかいわ、それまでふぃるむでとってげんぞうするものでした。"
      - speaker: reimu
        text: "映像をそのまま紙にできるようになったのは、この時代からです。"
        reading: "えいぞうをそのままかみにできるようになったのわ、このじだいからです。"
      - speaker: tsumugi
        emotion: normal
        text: "でも[佐々木|ささき]さん。それ、証明写真の機械と何が違うの。"
      - speaker: zundamon
        emotion: normal
        text: "いい質問なのだ。証明写真は、1枚だけ大きく出るだろ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。履歴書に貼るやつ。"
      - speaker: zundamon
        emotion: happy
        text: "小さいのが、たくさん出たら？"
      - speaker: tsumugi
        emotion: thinking
        text: "……たくさん出て、どうするの。"
      - speaker: zundamon
        emotion: normal
        text: "配るのだ。1枚は自分。あとは友達に。"
      - speaker: tsumugi
        emotion: surprised
        text: "配る……。写真を、配る？"
      - speaker: zundamon
        emotion: normal
        text: "そこが本体なのだ。持って帰るだけじゃ、半分なんだ。"
      - speaker: reimu
        text: "一枚の写真が、複数のシールになる。これが分かれ目でした。"
        reading: "いちまいのしゃしんが、ふくすうのしーるになる。これがわかれめでした。"
  - id: kaigi
    title: "そんなの持って帰ってどうすんの"
    background: il_pk_kaigi
    bgm: serious
    stage:
      - {who: zundamon, x: 0.2, tag: "佐々木", flip: true}
      - {who: otoko, x: 0.52}
      - {who: tsumugi, x: 0.82, tag: "岡田"}
    cuts:
      - speaker: reimu
        text: "会議で、佐々木はこの案を出しました。"
        reading: "かいぎで、ささきわこのあんをだしました。"
      - speaker: zundamon
        emotion: normal
        text: "撮った顔が、その場でシールになって出てくる機械なのだ。"
      - speaker: otoko
        emotion: normal
        text: "……ちょっといい？"
      - speaker: zundamon
        emotion: normal
        text: "どうぞ。"
      - speaker: otoko
        emotion: normal
        se: don
        text: "そんなの持って帰って、どうすんの。"
        telops:
          - {text: "そんなの持って帰ってどうすんの", size: xl, position: bottom-center, color: "#FFFFFF", stroke: "#2A2A3A", glow: "#4466AA", anim: up}
      - speaker: zundamon
        emotion: surprised
        text: "……どうすんの、とは。"
      - speaker: otoko
        emotion: normal
        text: "自分の顔のシールでしょ。貼る場所ある？"
      - speaker: zundamon
        emotion: normal
        text: "ある。手帳とか、定期入れとか。"
      - speaker: otoko
        emotion: thinking
        text: "俺は貼らないな。"
      - speaker: zundamon
        emotion: angry
        text: "そりゃそうなのだ。あなた向けじゃないのだ。"
      - speaker: otoko
        emotion: surprised
        text: "え、じゃあ誰向け。"
      - speaker: zundamon
        emotion: normal
        text: "女の子なのだ。うちの店に、来てない人たち。"
      - speaker: otoko
        emotion: normal
        text: "来てない人向けに作るの？ 売れる根拠は？"
      - speaker: zundamon
        emotion: normal
        text: "……ないのだ。今は。"
      - speaker: otoko
        emotion: normal
        text: "でしょ。それってあなたの感想ですよね。"
      - speaker: zundamon
        emotion: angry
        text: "感想なのだ。でも、感想を持ってるのがボクだけなんだ。"
      - speaker: reimu
        text: "会議室に、女性は佐々木ひとりでした。"
        reading: "かいぎしつに、じょせいわささきひとりでした。"
      - speaker: tsumugi
        emotion: thinking
        text: "……[佐々木|ささき]さん。俺も正直、ピンときてないんだ。"
      - speaker: zundamon
        emotion: sad
        text: "[岡田|おかだ]さんもか。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。写真が出るのは分かる。その先が見えない。"
      - speaker: zundamon
        emotion: normal
        text: "じゃあ聞くのだ。あなたたち、店で何にお金を使った？"
      - speaker: otoko
        emotion: happy
        text: "対戦。昨日は2000円溶けた。"
      - speaker: zundamon
        emotion: normal
        text: "2000円で、何が手元に残ってるんだ。"
      - speaker: otoko
        emotion: thinking
        text: "……勝った記憶。"
      - speaker: zundamon
        emotion: normal
        text: "それで満足できるのが、あなたたちなのだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "……あー。"
      - speaker: zundamon
        emotion: normal
        text: "満足できない人が、外にいっぱいいるのだ。"
      - speaker: otoko
        emotion: normal
        text: "でも、うちに来ないんでしょ。"
      - speaker: zundamon
        emotion: normal
        text: "来る理由を作ってないからなのだ。ずっとその話をしてるぞ。"
      - speaker: reimu
        text: "岡田耕始によれば、当時の反応は冷たいものでした。"
        reading: "おかだこうじによれば、とうじのはんのうわつめたいものでした。"
      - speaker: reimu
        text: "客層は格闘ゲームの男性ばかりで、期待は薄かったといいます。"
        reading: "きゃくそうわかくとうげーむのだんせいばかりで、きたいわうすかったといいます。"
  - id: sanbyaku
    title: "300円払ってでも"
    background: il_pk_kaigi
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.2, tag: "佐々木", flip: true}
      - {who: otoko, x: 0.52}
      - {who: tsumugi, x: 0.82, tag: "岡田"}
    cuts:
      - speaker: zundamon
        emotion: normal
        text: "ひとつ、値段の話をしていいか。"
      - speaker: otoko
        emotion: normal
        text: "どうぞ。まあ100円だよね。"
      - speaker: zundamon
        emotion: normal
        text: "300円なのだ。"
      - speaker: otoko
        emotion: surprised
        se: don
        text: "300！？ 高いって。誰も入れないよ。"
      - speaker: zundamon
        emotion: normal
        text: "100円で、必ず取れないクレーンゲームがあるだろ。"
      - speaker: otoko
        emotion: normal
        text: "ある。昨日も取れなかった。"
      - speaker: zundamon
        emotion: normal
        text: "あれ、5回やったら500円なのだ。それで手ぶらもある。"
      - speaker: otoko
        emotion: sad
        text: "……昨日のボクだ。"
      - speaker: zundamon
        emotion: normal
        text: "300円で、必ず持って帰れる。どっちが安いんだ。"
        telops:
          - {text: "300円で、必ず持って帰れる", size: lg, position: bottom-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: tsumugi
        emotion: surprised
        text: "……あ。"
      - speaker: zundamon
        emotion: normal
        text: "運がいらないのだ。入れたら、絶対に出る。"
      - speaker: reimu
        text: "1回300円払ってでも、必ず持ち帰れるものがあると気持ちが違う。"
        reading: "いっかいさんびゃくえんはらってでも、かならずもちかえれるものがあるときもちがちがう。"
      - speaker: reimu
        text: "佐々木は、同性の視点からそう考えていました。"
        reading: "ささきわ、どうせいのしてんからそうかんがえていました。"
      - speaker: otoko
        emotion: thinking
        text: "……でも300円は、感覚的に高いよ。"
      - speaker: zundamon
        emotion: normal
        text: "あなたの感覚なのだ。ボクの感覚だと安いのだ。"
      - speaker: otoko
        emotion: normal
        text: "感覚と感覚じゃ、決まらないでしょ。"
      - speaker: zundamon
        emotion: normal
        text: "決まらないのだ。だから作って、置いてみるしかない。"
      - speaker: tsumugi
        emotion: normal
        text: "……[原野|はらの]さんに聞いてみようか。"
      - speaker: zundamon
        emotion: happy
        text: "それは賛成なのだ。あの人、変な話が好きだぞ。"
  - id: sega
    title: "セガの社長室"
    background: il_pk_sega
    bgm: serious
    stage:
      - {who: harano, x: 0.26, flip: true}
      - {who: nakayama, x: 0.72}
    cuts:
      - speaker: reimu
        text: "アトラスだけでは、全国に置くことができません。"
        reading: "あとらすだけでわ、ぜんこくにおくことができません。"
      - speaker: reimu
        text: "原野は、セガの社長である中山隼雄に会いに行きました。"
        reading: "はらのわ、せがのしゃちょうであるなかやまはやおにあいにいきました。"
      - speaker: nakayama
        emotion: normal
        text: "[原野|はらの]さん。それで、持ってきたのは何。"
      - speaker: harano
        emotion: normal
        text: "写真をシールにする機械です。"
      - speaker: nakayama
        emotion: thinking
        text: "……写真。ゲームじゃなくて。"
      - speaker: harano
        emotion: normal
        text: "ゲームじゃないです。遊びではありますが。"
      - speaker: nakayama
        emotion: normal
        text: "誰が入れるの。"
      - speaker: harano
        emotion: normal
        text: "女の子です。今、うちの店に来てない人たち。"
      - speaker: nakayama
        emotion: normal
        text: "来てないなら、いないのと同じでしょ。"
      - speaker: harano
        emotion: normal
        text: "そこは、うちの営業が食い下がってまして。"
      - speaker: nakayama
        emotion: surprised
        text: "食い下がる？"
      - speaker: harano
        emotion: happy
        text: "会議で男が全員反対して、女がひとりで押し返してます。"
      - speaker: nakayama
        emotion: thinking
        text: "……その構図は、ちょっとおもしろいな。"
      - speaker: harano
        emotion: normal
        text: "需要は分かりません。正直に言います。"
      - speaker: nakayama
        emotion: normal
        text: "分からないものを、なんで作るの。"
      - speaker: harano
        emotion: normal
        text: "分かってるものは、もう誰かが作ってるからです。"
      - speaker: nakayama
        emotion: surprised
        se: don
        text: "……いい言葉だ。"
      - speaker: harano
        emotion: happy
        text: "小さい会社の言い訳です。"
      - speaker: nakayama
        emotion: normal
        text: "分かった。うちが販売を持つ。作りなさい。"
      - speaker: harano
        emotion: happy
        text: "……ありがとうございます。"
      - speaker: reimu
        text: "セガがパブリッシャーとなり、アトラスが開発に入りました。"
        reading: "せががぱぶりっしゃーとなり、あとらすがかいはつにはいりました。"
  - id: shikumi
    title: "シールになる仕組み"
    background: il_pk_atlas
    bgm: 10do
    stage:
      - {who: zundamon, x: 0.28, tag: "佐々木", flip: true}
      - {who: tsumugi, x: 0.72, tag: "岡田"}
    cuts:
      - speaker: zundamon
        emotion: normal
        text: "[岡田|おかだ]さん。中身って、どうなってるんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "そんなに難しくないよ。3つ並んでるだけ。"
      - speaker: zundamon
        emotion: normal
        text: "3つ。"
      - speaker: tsumugi
        emotion: normal
        text: "カメラ、コンピューター、プリンター。順番に渡していく。"
      - speaker: zundamon
        emotion: thinking
        text: "……普通じゃないか？"
      - speaker: tsumugi
        emotion: normal
        text: "普通だよ。でも10年前は、この普通ができなかった。"
      - speaker: zundamon
        emotion: surprised
        text: "なんでだ。"
      - speaker: tsumugi
        emotion: normal
        text: "写真がフィルムだったから。撮ったら、現像しないと見えない。"
      - speaker: zundamon
        emotion: normal
        text: "あー。その場で出せないのだ。"
      - speaker: reimu
        text: "フィルムの写真は、薬品で現像するまで見ることができません。"
        reading: "ふぃるむのしゃしんわ、やくひんでげんぞうするまでみることができません。"
      - speaker: reimu
        text: "その場で出す機械は、原理として作れなかったのです。"
        reading: "そのばでだすきかいわ、げんりとしてつくれなかったのです。"
      - speaker: tsumugi
        emotion: normal
        text: "それが、映像を数字として扱えるようになった。"
      - speaker: zundamon
        emotion: thinking
        text: "数字。写真が、数字なのか。"
      - speaker: tsumugi
        emotion: normal
        text: "そう。明るさの数字が、点の数だけ並んでるだけ。"
      - speaker: zundamon
        emotion: surprised
        text: "顔が、数字の列になってるのだ。ちょっと怖いぞ。"
      - speaker: tsumugi
        emotion: happy
        text: "怖いけど、便利。数字なら、いじれるからね。"
      - speaker: zundamon
        emotion: normal
        text: "いじれる。……たとえば？"
      - speaker: tsumugi
        emotion: normal
        text: "枠をつける。背景を重ねる。縮めて、並べる。"
      - speaker: zundamon
        emotion: happy
        se: don
        text: "並べる！そこなのだ！"
      - speaker: tsumugi
        emotion: surprised
        text: "そこ？"
      - speaker: zundamon
        emotion: normal
        text: "1枚の紙に、小さい顔を何枚も並べて印刷するのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "で、その紙がシール。切り離して配れる。"
      - speaker: zundamon
        emotion: happy
        text: "配れる。1回で、何人分にもなるのだ。"
      - speaker: reimu
        text: "写真がデジタルになったこと。それが、この機械の土台でした。"
        reading: "しゃしんがでじたるになったこと。それが、このきかいのどだいでした。"
      - speaker: tsumugi
        emotion: normal
        text: "でも[佐々木|ささき]さん。ここまで全部、技術の話だよ。"
      - speaker: zundamon
        emotion: normal
        text: "うん。技術は、どこの会社にもあるのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "……じゃあ、何が違うの。"
      - speaker: zundamon
        emotion: normal
        text: "これを、誰のために置くかなのだ。そこだけは譲らないぞ。"
  - id: loketest
    title: "ロケテスト"
    background: il_pk_gamecenter
    bgm: kinakusai
    stage:
      - {who: zundamon, x: 0.26, tag: "佐々木", flip: true}
      - {who: tsumugi, x: 0.72, tag: "岡田"}
    cuts:
      - speaker: reimu
        text: "試作機を実際の店に置き、反応を見ることをロケテストといいます。"
        reading: "しさくきをじっさいのみせにおき、はんのうをみることをろけてすとといいます。"
      - speaker: tsumugi
        emotion: normal
        text: "置いたよ。あそこの角に。"
      - speaker: zundamon
        emotion: happy
        text: "どうだ。並んでるか。"
      - speaker: tsumugi
        emotion: sad
        text: "……3時間で、2人。"
      - speaker: zundamon
        emotion: surprised
        text: "2人！？"
      - speaker: tsumugi
        emotion: normal
        text: "しかも1人は、うちの社員。"
      - speaker: zundamon
        emotion: sad
        text: "実質1人なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "みんな前を通るんだよ。[通って|とおって]、そのまま対戦台に行く。"
      - speaker: zundamon
        emotion: thinking
        text: "……見えてないのか。"
      - speaker: tsumugi
        emotion: normal
        text: "見えてるけど、何をする機械か分からないみたい。"
      - speaker: zundamon
        emotion: sad
        text: "そうか。写真の機械なんて、ゲーセンにはなかったのだ。"
      - speaker: reimu
        text: "ロケテストの反応は芳しくなく、社内の期待は薄いままでした。"
        reading: "ろけてすとのはんのうわかんばしくなく、しゃないのきたいわうすいままでした。"
      - speaker: tsumugi
        emotion: normal
        text: "[佐々木|ささき]さん。数字は数字だよ。"
      - speaker: zundamon
        emotion: normal
        text: "分かってるのだ。でも、ひとつ気になることがある。"
      - speaker: tsumugi
        emotion: normal
        text: "なに。"
      - speaker: zundamon
        emotion: normal
        text: "この店に、女の子が何人来たんだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "……ほとんど来てないな。"
      - speaker: zundamon
        emotion: normal
        text: "じゃあ今のテストは、何を測ったんだ。"
      - speaker: tsumugi
        emotion: surprised
        se: don
        text: "……あ。"
      - speaker: zundamon
        emotion: normal
        text: "男の人が、女の子向けの機械を素通りした。それだけなのだ。"
        telops:
          - {text: "測る相手が、そこにいない", size: lg, position: bottom-center, color: "#FFFFFF", stroke: "#2A1A3A", glow: "#6CD8C8", anim: up}
      - speaker: tsumugi
        emotion: thinking
        text: "……テストとして、成立してないってこと？"
      - speaker: zundamon
        emotion: normal
        text: "全否定はしないのだ。でも、これで諦めるのは早いぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "……メンタル鋼だな。"
      - speaker: zundamon
        emotion: normal
        text: "豆腐なのだ。毎晩へこんでるぞ。"
      - speaker: tsumugi
        emotion: surprised
        text: "へこんでたの。"
      - speaker: zundamon
        emotion: normal
        text: "へこむのと、間違ってると認めるのは、別なのだ。"
  - id: expo
    title: "1995年2月・展示会"
    background: il_pk_expo
    bgm: you_and_me
    stage:
      - {who: zundamon, x: 0.2, tag: "佐々木", flip: true}
      - {who: konpanion, x: 0.52}
      - {who: tsumugi, x: 0.82, tag: "岡田"}
    cuts:
      - speaker: reimu
        text: "1995年2月。業界向けの展示会に、試作機を出しました。"
        reading: "せんきゅうひゃくきゅうじゅうごねんにがつ。ぎょうかいむけのてんじかいに、しさくきをだしました。"
      - speaker: tsumugi
        emotion: normal
        text: "まあ、業者向けの会だからね。期待はしないでおこう。"
      - speaker: zundamon
        emotion: normal
        text: "うん。今日は様子を見るのだ。"
      - speaker: konpanion
        emotion: normal
        text: "あの、すみません。これって撮れるんですか。"
      - speaker: zundamon
        emotion: surprised
        text: "……え。あ、はい。撮れるのだ。"
      - speaker: konpanion
        emotion: happy
        text: "休憩なんです。撮ってもいいですか。"
      - speaker: zundamon
        emotion: happy
        text: "どうぞどうぞ。"
      - speaker: reimu
        text: "会場のコンパニオンたちが、空き時間を割いて並び始めました。"
        reading: "かいじょうのこんぱにおんたちが、あきじかんをさいてならびはじめました。"
      - speaker: tsumugi
        emotion: surprised
        text: "……[佐々木|ささき]さん。列ができてる。"
      - speaker: zundamon
        emotion: surprised
        text: "え。"
      - speaker: tsumugi
        emotion: surprised
        se: don
        text: "うちのブースだけ、長蛇の列だ。"
        telops:
          - {text: "【速報】うちのブースだけ長蛇の列", size: lg, position: top-center, color: "#FFF15A", stroke: "#3A1A2A", glow: "#E85096", anim: up}
      - speaker: zundamon
        emotion: happy
        text: "キタ━━━━！"
      - speaker: konpanion
        emotion: happy
        text: "ねえ、2人で入れる？ 一緒に撮ろうよ。"
      - speaker: zundamon
        emotion: surprised
