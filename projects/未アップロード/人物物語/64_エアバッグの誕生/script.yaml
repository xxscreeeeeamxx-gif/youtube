scenes:
- id: hook
  title: ''
  background: kb_kuruma
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: つむぎ、このハンドルの真ん中に、SRSって書いてあるのだ。
  - speaker: tsumugi
    emotion: normal
    text: そこには、エアバッグが入ってるの。
  - speaker: zundamon
    emotion: happy
    text: 分かったのだ。運転に疲れたら、ここで昼寝をする枕なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 寝るための物じゃないわよ。
  - speaker: zundamon
    emotion: happy
    text: じゃあ、ここを押したら、ふかふかの枕が出てくるのだ！
  - speaker: tsumugi
    emotion: surprised
    text: 待って、そこは……
  - speaker: zundamon
    emotion: surprised
    text: ……プーって鳴ったのだ。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: そこは、クラクションよ。
  - speaker: zundamon
    emotion: sad
    text: 枕は、出てこなかったのだ。
  - speaker: tsumugi
    emotion: normal
    text: エアバッグは、車がぶつかったときにしか、ふくらまないの。
  - speaker: reimu
    text: エアバッグ。袋がふくらむのにかかる時間は、およそ0.03秒。まばたきより短い時間です。
    reading: えあばっぐ。ふくろが ふくらむのに かかる じかんわ およそ れいてん れいさんびょう。まばたきより みじかい じかんです。
  - speaker: tsumugi
    emotion: normal
    text: この仕組みを1960年代に考えて、14の国で特許を得た日本人がいるの。
  - speaker: zundamon
    emotion: surprised
    text: '[日本|にほん]の人が、考えてたのだ！？'
  - speaker: tsumugi
    emotion: thinking
    text: でも、その人の特許は、一度も車に使われなかったのよ。
  - speaker: zundamon
    emotion: sad
    text: ……どうしてなのだ。
- id: card1899
  title: ''
  background: kb_card_1899
  cuts:
  - speaker: reimu
    text: 1899年。栃木県の農村で、小堀保三郎が生まれます。
    reading: せんはっぴゃく きゅうじゅうきゅうねん。とちぎけんの のうそんで こぼり やすざぶろうが うまれます。
- id: ch1_mura
  title: 三男の奉公
  background: kb_mura
  bgm: warm
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, scale: 0.85, emotion: normal}
  - {who: chichi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 今の上三川町のあたりです。保三郎は、小堀家の三男でした。
    reading: いまの かみのかわまちの あたりです。やすざぶろうわ こぼりけの さんなんでした。
  - speaker: chichi
    emotion: normal
    text: 保三郎、小学校を出たら、奉公に行くことになったぞ。
  - speaker: zundamon
    emotion: surprised
    text: 家を、出るのだ？
  - speaker: chichi
    emotion: thinking
    text: お前は三男だ。外へ出て、自分の力で身を立てなさい。
  - speaker: zundamon
    emotion: thinking
    text: 奉公って、何をするのだ？
  - speaker: chichi
    emotion: normal
    text: よその家に住み込んで、働きながら仕事を覚えるんだ。
  - speaker: zundamon
    emotion: thinking
    text: 住み込み……ごはんは出るのだ？
  - speaker: chichi
    emotion: surprised
    text: ……まず、そこか。
  - speaker: zundamon
    emotion: happy
    text: 大事なことなのだ。でも、外の世界も見てみたいのだ。
  - speaker: reimu
    text: 1912年、小学校を終えた保三郎は、奉公に出ます。
    reading: せんきゅうひゃく じゅうにねん しょうがっこうお おえた やすざぶろうわ ほうこうに でます。
- id: card1924
  title: ''
  background: kb_card_1924
  cuts:
  - speaker: reimu
    text: 1924年。保三郎は、大阪の通信社で、記者になっていました。
    reading: せんきゅうひゃく にじゅうよねん。やすざぶろうわ おおさかの つうしんしゃで きしゃに なって いました。
- id: ch1_kisha
  title: 通信社の記者
  background: kb_tsushin
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: senpai, x: 0.7, emotion: normal}
  cuts:
  - speaker: senpai
    emotion: angry
    text: 小堀くん、原稿はまだか。
  - speaker: zundamon
    emotion: surprised
    text: 今、書き上がったのだ！
  - speaker: senpai
    emotion: normal
    text: どれどれ……今度は、新しい工場の記事か。
  - speaker: zundamon
    emotion: happy
    text: 大きな機械が、重い鉄をひょいと持ち上げてたのだ。
  - speaker: senpai
    emotion: thinking
    text: 機械の話になると、君はいつも筆が止まらんな。
  - speaker: zundamon
    emotion: happy
    text: 人の力でできないことを、機械がやるのだ。見ていて飽きないのだ。
  - speaker: senpai
    emotion: happy
    text: 記者より、作る側のほうが向いてるんじゃないか。
  - speaker: zundamon
    emotion: thinking
    text: 作る側……。
  - speaker: reimu
    text: 1934年には、大阪電気鉄道の嘱託として働きます。
    reading: せんきゅうひゃく さんじゅうよねんにわ おおさか でんき てつどうの しょくたくとして はたらきます。
- id: card1937
  title: ''
  background: kb_card_1937
  cuts:
  - speaker: reimu
    text: 1937年。保三郎は尼崎で、自分の工場を始めます。
    reading: せんきゅうひゃく さんじゅうななねん。やすざぶろうわ あまがさきで じぶんの こうじょうお はじめます。
- id: ch2_kojo
  title: クレーンの工場
  background: kb_kojo
  bgm: beat
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: kouin, x: 0.7, emotion: normal}
  cuts:
  - speaker: kouin
    emotion: happy
    text: 社長、大阪工機製作所の看板、掛け終わりました！
  - speaker: zundamon
    emotion: happy
    text: 今日から、ここでクレーンを作るぞ！
  - speaker: kouin
    emotion: normal
    text: 天井のクレーン、試しに動かしてみますか。
  - speaker: zundamon
    emotion: happy
    text: 動かすのだ！ 持てない物を、上から吊って運ぶぞ。
  - speaker: kouin
    emotion: normal
    text: 鉄の塊を人が担いだら、腰を痛めますからね。
  - speaker: zundamon
    emotion: normal
    text: 機械に任せれば、けがをする人も減る。
  - speaker: kouin
    emotion: happy
    text: 社長、記者だったのに、よく機械のことを知ってますね。
  - speaker: zundamon
    emotion: happy
    text: 記者のころから、ずっと見て回ってたのだ。
- id: ch2_munakata
  title: 民芸の仲間
  background: kb_mingei
  bgm: warm
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: munakata, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1939年ごろから、保三郎は民芸の人たちと広く付き合うようになります。
    reading: せんきゅうひゃく さんじゅうきゅうねんごろから、やすざぶろうわ みんげいの ひとたちと ひろく つきあう ように なります。
  - speaker: reimu
    text: 名もない職人が作る、毎日の道具の美しさを大事にする考え方です。
    reading: なも ない しょくにんが つくる、まいにちの どうぐの うつくしさお だいじに する かんがえかたです。
  - speaker: munakata
    emotion: surprised
    text: 小堀さん、器が増えましたね。
  - speaker: zundamon
    emotion: happy
    text: 毎日使う器こそ、きれいなのだ。
  - speaker: munakata
    emotion: happy
    text: 分かります。使う人の手に、なじんだ形ですから。
  - speaker: zundamon
    emotion: normal
    text: 棟方さん、今度、栃木の実家に来ないか。
  - speaker: zundamon
    emotion: happy
    text: 栃木の農村は、勉強をするのに静かで良いところなのだ。
  - speaker: munakata
    emotion: happy
    text: それは、ありがたい。ぜひ伺います。
  - speaker: reimu
    text: 保三郎は、版画家の棟方志功を、世に出る前の下積みのころから、支え続けたといいます。
    reading: やすざぶろうわ はんがかの むなかた しこうお、よに でる まえの したづみの ころから ささえつづけたと いいます。
  - speaker: reimu
    text: 民芸運動を始めた柳宗悦や、陶芸家の浜田庄司とも、長く親しくしました。
    reading: みんげい うんどうお はじめた やなぎ むねよしや、とうげいかの はまだ しょうじとも ながく したしく しました。
- id: ch2_kojo2
  title: 飛行機のエンジン
  background: kb_kojo2
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: kouin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1941年、工場を大阪の城東区へ移します。
    reading: せんきゅうひゃく よんじゅういちねん こうじょうお おおさかの じょうとうくえ うつします。
  - speaker: reimu
    text: 作ったのは、軍用機のエンジンを取り付けるための、小さなクレーンでした。
    reading: つくったのわ、ぐんようきの えんじんお とりつける ための ちいさな くれーんでした。
  - speaker: kouin
    emotion: surprised
    text: 社長、飛行機の工場から、また注文が来ました！
  - speaker: zundamon
    emotion: thinking
    text: エンジンは重いのに、ぴったりの位置に下ろさないといけないのだ。
  - speaker: kouin
    emotion: thinking
    text: 少しでもずれたら、ボルトの穴が合いませんからね。
  - speaker: zundamon
    emotion: happy
    text: だから、ゆっくり細かく動くクレーンを作るぞ。
- id: ch2_sengo
  title: 炭鉱の機械
  background: kb_jimusho
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: kouin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 戦争が終わると、保三郎は炭鉱の機械の研究会を作ります。
    reading: せんそうが おわると やすざぶろうわ たんこうの きかいの けんきゅうかいお つくります。
  - speaker: kouin
    emotion: surprised
    text: 社長、今度は炭鉱ですか。
  - speaker: zundamon
    emotion: normal
    text: 石炭を掘らないと、工場も汽車も動かないのだ。
- id: ch2_kiyomoto
  title: 清元の声
  background: kb_hotel
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: tsumugi, x: 0.7, tag: 小堀艶子, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1959年11月。保三郎は、帝国ホテルで清元を披露します。
    reading: せんきゅうひゃく ごじゅうきゅうねん じゅういちがつ。やすざぶろうわ ていこく ほてるで きよもとお ひろう します。
  - speaker: tsumugi
    emotion: normal
    text: あなた、そろそろ出番ですよ。
  - speaker: zundamon
    emotion: happy
    text: '[艶子|つやこ]、声はばっちりなのだ。'
  - speaker: tsumugi
    emotion: thinking
    text: 三味線に合わせて語る清元は、あなたの一番の楽しみね。
  - speaker: zundamon
    emotion: happy
    text: 機械の次に、いや、機械と同じくらい好きなのだ。
  - speaker: tsumugi
    emotion: happy
    text: 工場の機械の音より、ずっといい声ですよ。
  - speaker: zundamon
    emotion: surprised
    text: ……それは、比べるものじゃないのだ。
    se: oti
  - speaker: reimu
    text: 短歌も詠み、自作の歌集を2冊残しています。
    reading: たんかも よみ じさくの かしゅうお にさつ のこして います。
- id: ch2_yuzuru
  title: 会社を譲る
  background: kb_jimusho
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: kouin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: そして1962年、保三郎は会社の経営を、大きな会社へ譲ることにします。
    reading: そして せんきゅうひゃく ろくじゅうにねん、やすざぶろうわ かいしゃの けいえいお おおきな かいしゃえ ゆずる ことに します。
  - speaker: kouin
    emotion: sad
    text: 社長、本当に会社を譲ってしまうんですか。
  - speaker: zundamon
    emotion: normal
    text: 次は、思いついたアイデアを、形にする仕事をするのだ。
  - speaker: kouin
    emotion: thinking
    text: 社長の歳で、一から始めるんですか。
  - speaker: zundamon
    emotion: happy
    text: アイデアに、歳は関係ないのだ。
- id: card1962
  title: ''
  background: kb_card_1962
  cuts:
  - speaker: reimu
    text: 1962年。保三郎は東京の伊皿子で、新しい仕事場を開きます。
    reading: せんきゅうひゃく ろくじゅうにねん。やすざぶろうわ とうきょうの いさらごで あたらしい しごとばお ひらきます。
- id: ch3_gic
  title: グッドアイデアセンター
  background: kb_gic
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: tsumugi, x: 0.7, tag: 小堀艶子, emotion: normal}
  cuts:
  - speaker: reimu
    text: 住まいの近くの玉鳳寺の境内にある、木造の一軒家を借りたのです。
    reading: すまいの ちかくの ぎょくほうじの けいだいに ある もくぞうの いっけんやお かりたのです。
  - speaker: tsumugi
    emotion: thinking
    text: あなた、お寺の中で、いったい何を始めるんです？
  - speaker: zundamon
    emotion: happy
    text: ここを、グッドアイデアセンターと名付けるのだ。略して、[GIC|じーあいしー]なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: グッド、アイデア……。
  - speaker: zundamon
    emotion: normal
    text: 思いついたアイデアを、ここで形にして、特許を取るのだ。
  - speaker: tsumugi
    emotion: normal
    text: それで、最初のアイデアは？
  - speaker: zundamon
    emotion: happy
    text: この、サンドイッチを自動で作る機械なのだ！
  - speaker: tsumugi
    emotion: surprised
    text: サンドイッチを、機械で作るんですか？
  - speaker: zundamon
    emotion: happy
    text: パンと具を入れれば、機械がはさんでくれるのだ。
  - speaker: tsumugi
    emotion: happy
    text: お昼ごはんの支度が、楽になりそうね。
  - speaker: zundamon
    emotion: happy
    text: まずは、ぼくのお昼の分を作るのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 結局、あなたのお昼なのね。
    se: oti
  - speaker: reimu
    text: ここでは、サンドイッチの自動製造機をはじめ、多くの特許を取っています。
    reading: ここでわ さんどいっちの じどう せいぞうきお はじめ、おおくの とっきょお とって います。
- id: ch3_hikouki
  title: 揺れる機内
  background: kb_hikouki
  bgm: mystery
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 小堀保三郎, emotion: normal}
  - {who: joumuin, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: ある日、保三郎は旅客機に乗っていました。
    reading: あるひ やすざぶろうわ りょかくきに のって いました。
  - speaker: joumuin
    emotion: surprised
    text: ただいま、気流の悪いところを通過しております。
  - speaker: zundamon
    emotion: surprised
    text: 揺れるのだ！ 体が、ふわっと浮くのだ！
  - speaker: reimu
    text: 飛行機がエアポケットに入ると、機体は大きく上下します。
    reading: ひこうきが えあぽけっとに はいると きたいわ おおきく じょうげ します。
  - speaker: reimu
    text: 当時はシートベルトを締めない人も多く、頭を打つ事故もあったといいます。
    reading: とうじわ しーとべるとお しめない ひとも おおく、あたまお うつ じこも あったと いいます。
  - speaker: zundamon
    emotion: surprised
    text: テーブルに伏せて、荷物を抱えるのだ！
  - speaker: zundamon
    emotion: thinking
    text: ……こうしていると、不思議と安心なのだ。
  - speaker: joumuin
    emotion: normal
    text: お客様、揺れは収まりました。お怪我はございませんか。
  - speaker: zundamon
    emotion: thinking
    text: 体と、ぶつかる物のあいだに、やわらかい物があれば……。
  - speaker: reimu
    text: 手伝った人の話では、これがエアバッグを思いついたきっかけだといいます。
    reading: てつだった ひとの はなしでわ、これが えあばっぐお おもいついた きっかけだと いいます。
  - speaker: reimu
    text: きっかけの話は、伝える資料によって少しずつ違います。
    reading: きっかけの はなしわ つたえる しりょうに よって すこしずつ ちがいます。
- id: card1964
  title: ''
  background: kb_card_1964
  bgm: curious
  cuts:
  - speaker: reimu
    text: 1964年。保三郎は自動車の安全ネットを作り始めます。
    reading: せんきゅうひゃく ろくじゅうよねん。やすざぶろうわ じどうしゃの あんぜん ねっとお つくりはじめます。
  - speaker: reimu
    text: 東京で、オリンピックが開かれた年でした。
    reading: とうきょうで おりんぴっくが ひらかれた としでした。
- id: ch4_net
