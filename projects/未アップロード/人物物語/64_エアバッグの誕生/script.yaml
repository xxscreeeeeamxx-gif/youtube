meta:
  title: 【エアバッグの誕生】14か国で特許を取ったのに、1台も使われなかった発明家【ずんだもん解説】
  slug: kobori-airbag
  summary: ハンドルの真ん中に入っている、エアバッグ。1964年、東京の寺の境内にある小さな仕事場で、この仕組みの開発を始めた発明家がいました。小堀保三郎。クレーン会社の経営を譲ったあとの挑戦で、特許を出願したときは65歳でした。大学や防衛庁の実験隊の協力を得て、14の国で特許を取り、ヤナセの梁瀬次郎は実験フィルムを持ってベンツを訪ねます。それでも、保三郎の特許を使う会社は現れませんでした。保三郎の生涯と、世界の車にエアバッグが積まれるまでを、再現ドラマでたどります。
  tags:
  - エアバッグ
  - 小堀保三郎
  - 自動車
  - 交通安全
  - 発明
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 技術史
  - 雑学
  thumbnail:
    top: 14か国で特許
    bottom: エアバッグの誕生
  mode: drama
  narrator: reimu
  mobs:
  - id: chichi
    label: 父
    voice: 13
    pitch: -0.1
  - id: senpai
    label: 先輩記者
