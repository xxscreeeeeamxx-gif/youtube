    text: 主役は、シートベルト。エアバッグは、その助っ人なの。
  - speaker: zundamon
    emotion: happy
    text: 枕でも、主役でもなかったのだ。
- id: card1987
  title: ''
  background: kb_card_1987
  cuts:
  - speaker: reimu
    text: 1987年9月。日本でも、エアバッグを積んだ車が発売されます。
    reading: せんきゅうひゃく はちじゅうななねん くがつ。にほんでも えあばっぐお つんだ くるまが はつばい されます。
- id: ch8_legend
  title: 20万円の安全
  background: kb_showroom
  bgm: pop
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: ホンダのレジェンド。国産の車で、初めてエアバッグを積んだ車よ。
  - speaker: tsumugi
    emotion: normal
    text: 付いたのは、運転席だけ。ホンダは1970年代の初めから、16年かけて作ったの。
  - speaker: zundamon
    emotion: happy
    text: みんな、すぐに付けたのだ？
  - speaker: tsumugi
    emotion: thinking
    text: 一番上の型には最初から付いてたけど、ほかの多くの型は、20万円高くなったわ。
  - speaker: zundamon
    emotion: sad
    text: 20万円は、高いのだ……。
  - speaker: tsumugi
    emotion: normal
    text: 袋は、0.03秒ほどで、約60リットルにふくらむの。
  - speaker: zundamon
    emotion: surprised
    text: 保三郎さんの図の、前の席の袋の4分の1くらいなのだ！
  - speaker: tsumugi
    emotion: normal
    text: 1992年には、エアバッグの付いた車の保険料を、安くする割引もできたわ。
  - speaker: tsumugi
    emotion: normal
    text: 90年代の後半に一気に広がり、2002年には、走る車の約半分に付いてたそうよ。
  - speaker: tsumugi
    emotion: normal
    text: アメリカでは、1998年型の車から、前の2つの席で義務になったの。
  - speaker: zundamon
    emotion: happy
    text: 今は、新しい車なら、ほとんど付いてるのだ。
- id: ch9_ronsou
  title: 世界初は誰か
  background: kb_nenpyo
  bgm: mystery
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: じゃあ、エアバッグを世界で初めて考えたのは、保三郎さんなのだ！
  - speaker: tsumugi
    emotion: thinking
    text: そう書かれることも多いけど、実はもっと前があるの。
  - speaker: tsumugi
    emotion: normal
    text: 1951年、西ドイツのリンデラーが、ふくらむ袋の特許を出願してるわ。
  - speaker: tsumugi
    emotion: normal
    text: 1952年には、アメリカのヘトリックも出願してるの。
  - speaker: zundamon
    emotion: surprised
    text: 保三郎さんより、10年以上も前なのだ！
  - speaker: tsumugi
    emotion: normal
    text: ヘトリックさんは、海軍の魚雷の圧縮空気をヒントに、台所のテーブルで試作したそうよ。
  - speaker: zundamon
    emotion: happy
    text: 発明は、台所でも始まるのだ。
  - speaker: tsumugi
    emotion: normal
    text: ただ、どちらも圧縮空気でふくらませる仕組みで、実用にはならなかったの。
  - speaker: tsumugi
    emotion: normal
    text: 保三郎さんの特許は、火薬でガスを作って、一瞬でふくらませる仕組みよ。
  - speaker: tsumugi
    emotion: normal
    text: だから、ガスを作る方式を早くに特許にした先駆けの一人、と言うのが正確ね。
  - speaker: zundamon
    emotion: thinking
    text: 世界初、と言い切るのは、言い過ぎなのだ。
  - speaker: tsumugi
    emotion: normal
    text: ベンツが保三郎さんの設計を使った、という話もあるけど、その資料は見つかってないの。
  - speaker: tsumugi
    emotion: normal
    text: ベンツは1971年に、自社の特許を出願してるわ。
  - speaker: zundamon
    emotion: normal
    text: 有名な話ほど、確かめるのが大事なのだ。
- id: ch10_shikumi
  title: まばたきの間に
  background: kb_shikumi
  motion: none
  bgm: pop
  stage:
  - {who: zundamon, x: 0.14, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.86, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 今のエアバッグの仕組みを、見てみましょう。
  - speaker: tsumugi
    emotion: normal
    text: まず、センサーが強い衝撃を感じて、本当にふくらませるかを判断するの。
  - speaker: tsumugi
    emotion: normal
    text: 決まったら、ガスを作る装置に、火をつけるのよ。
  - speaker: zundamon
    emotion: happy
    text: 保三郎さんの特許と、流れは同じなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 火がつくまで約0.03秒、ふくらむのに約0.03秒。
  - speaker: tsumugi
    emotion: normal
    text: 最後は、袋の裏の穴からガスが抜けて、しぼむの。
  - speaker: zundamon
    emotion: surprised
    text: せっかくふくらんだのに、しぼんじゃうのだ？
  - speaker: tsumugi
    emotion: normal
    text: しぼまないと、前が見えないし、体を跳ね返してしまうでしょ。
  - speaker: tsumugi
    emotion: normal
    text: 全部で約0.11秒。まばたきのあいだに、終わってしまうの。
  - speaker: zundamon
    emotion: thinking
    text: そんなに一瞬で、どうして助かるのだ？
  - speaker: tsumugi
    emotion: normal
    text: 硬い物にぶつかると、体は一瞬で止まるわ。
  - speaker: tsumugi
    emotion: normal
    text: 袋に当たると、ほんの少しだけ時間をかけて止まるの。
  - speaker: tsumugi
    emotion: normal
    text: 止まるまでの時間が長いほど、体にかかる力は小さくなるのよ。
  - speaker: zundamon
    emotion: happy
    text: ゆっくり止まるほど、痛くないのだ。
  - speaker: zundamon
    emotion: thinking
    text: ふくらむ勢いは、どれくらいなのだ？
  - speaker: tsumugi
    emotion: normal
    text: 時速100キロから300キロ、とも言われてるわ。
  - speaker: zundamon
    emotion: surprised
    text: そんな勢いで、顔に当たるのだ！？
  - speaker: tsumugi
    emotion: normal
    text: だから、正しい姿勢で座るのが大事なの。ハンドルからは、25センチ以上離れてね。
  - speaker: zundamon
    emotion: normal
    text: 運転席を、前に出しすぎない。
  - speaker: tsumugi
    emotion: normal
    text: それに、ふくらんだ直後の袋は熱くなってるから、すぐに触っちゃだめよ。
  - speaker: zundamon
    emotion: surprised
    text: 熱い袋……さわらないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 子どもは、後ろの席に乗せてね。
  - speaker: tsumugi
    emotion: normal
    text: 後ろ向きのチャイルドシートは、助手席に付けてはいけないの。
  - speaker: zundamon
    emotion: sad
    text: 赤ちゃんに、あの勢いで袋が当たったら、大変なのだ。
  - speaker: tsumugi
    emotion: sad
    text: アメリカでは、助手席のエアバッグで、子どもが亡くなる事故が続いたの。
  - speaker: tsumugi
    emotion: normal
    text: それで1997年から、弱めにふくらむエアバッグが認められたのよ。
- id: ch10_kusuri
  title: ガスを作る薬
  background: kb_shikumi2
  bgm: serious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: ガスを作る薬も、時代とともに変わってきたの。
  - speaker: tsumugi
    emotion: normal
    text: 最初は、毒のある薬が使われてたけど、[日本|にほん]では1999年ごろに使われなくなったわ。
  - speaker: zundamon
    emotion: thinking
    text: 車の中に、毒があったのだ……。
  - speaker: tsumugi
    emotion: thinking
    text: 2008年からは、タカタのエアバッグで、大きな問題が起きたの。
  - speaker: tsumugi
    emotion: normal
    text: 薬が暑さと湿気で傷んで、ふくらませるときに、装置が破裂することがあったのよ。
  - speaker: tsumugi
    emotion: normal
    text: 世界中で、大規模なリコールになったわ。
  - speaker: tsumugi
    emotion: sad
    text: タカタは、2017年に経営破綻したの。
  - speaker: zundamon
    emotion: sad
    text: 命を守る装置だからこそ、中の薬まで、確かでないといけないのだ。
- id: ch11_gendai
  title: 歩く人を守る袋
  background: kb_gendai
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 2006年、保三郎さんは、[日本自動車殿堂|にほんじどうしゃでんどう]に入ったの。
  - speaker: zundamon
    emotion: happy
    text: 名前が、ちゃんと残ったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 保三郎さんの図にあった、横からの袋や、天井の袋。
  - speaker: tsumugi
    emotion: normal
    text: 形は違うけど、今は多くの車に付いてるわ。
  - speaker: tsumugi
    emotion: normal
    text: サイドエアバッグや、カーテンエアバッグね。
  - speaker: zundamon
    emotion: happy
    text: 横からぶつかっても、守ってくれるのだ。
  - speaker: tsumugi
    emotion: normal
    text: 2012年には、スウェーデンのボルボが、歩く人のためのエアバッグを出したの。
  - speaker: tsumugi
    emotion: normal
    text: バンパーのセンサーが人の足を感じると、ボンネットの後ろで[袋|ふくろ]がふくらむの。
  - speaker: zundamon
    emotion: surprised
    text: 保三郎さんが描いてた、歩く人を守る袋なのだ！
  - speaker: tsumugi
    emotion: normal
    text: 形は違うけど、バンパーで人を感じるところは、同じ考え方ね。
  - speaker: tsumugi
    emotion: normal
    text: 交通事故で亡くなる人は、1970年には1万6765人いたの。
  - speaker: tsumugi
    emotion: normal
    text: それが2024年には、2663人まで減ってるわ。
  - speaker: zundamon
    emotion: happy
    text: 道路や救急、ベルトや袋。たくさんの工夫が重なったのだ。
  - speaker: tsumugi
    emotion: normal
    text: 2025年8月30日、亡くなって50年の日には、新聞のコラムにも載ったわ。
  - speaker: zundamon
    emotion: normal
    text: 60年前、お寺の一軒家で、同じような袋を描いた人がいたのだ。
