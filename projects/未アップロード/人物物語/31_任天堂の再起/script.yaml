  - id: ima
    title: "いま、手の中にあるもの"
    background: il_ym_ima
    bgm: pastel_house
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: zundamon
        emotion: thinking
        text: "……つむぎさん。ひとつ聞いていいか。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。"
      - speaker: zundamon
        emotion: normal
        text: "この人、失敗した人なのか。成功した人なのか。"
      - speaker: tsumugi
        emotion: normal
        text: "……どっちだと思う？"
      - speaker: zundamon
        emotion: thinking
        text: "……10年やって全部あかんかった。"
      - speaker: zundamon
        emotion: normal
        text: "でも、そのあと世界を取ってる。"
      - speaker: tsumugi
        emotion: normal
        text: "順番が大事なんだよ。"
      - speaker: zundamon
        emotion: surprised
        text: "順番。"
      - speaker: tsumugi
        emotion: normal
        text: "全部やって全部だめだったから、何が得意か分かったの。"
      - speaker: zundamon
        emotion: normal
        text: "……先に分かってたら、10年浮いたのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "そこなんだけどね。先には分からないんだよ、たぶん。"
      - speaker: zundamon
        emotion: thinking
        text: "……。"
      - speaker: tsumugi
        emotion: normal
        text: "[花札|はなふだ]屋のままだったら、いまも[花札|はなふだ]屋でしょ。"
      - speaker: zundamon
        emotion: normal
        text: "……確かに。動かんかったら、何も分からん。"
      - speaker: tsumugi
        emotion: happy
        text: "動いて、全部外して、最後に元の場所に戻ってきた人だよ。"
      - speaker: zundamon
        emotion: normal
        text: "……元の場所。遊びか。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。1889年から、ずっと同じことをやってる会社なの。"
      - speaker: zundamon
        emotion: surprised
        text: "……札もゲームも、遊ぶ道具なのだ。"
      - speaker: zundamon
        emotion: thinking
        text: "……つむぎさん。もうひとつだけ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。"
      - speaker: zundamon
        emotion: normal
        text: "この人、22歳で親戚を全部切ったよな。"
      - speaker: tsumugi
        emotion: normal
        text: "切ったね。"
      - speaker: zundamon
        emotion: normal
        text: "……止めてくれる人がおらんかったから、10年失敗したのか。"
      - speaker: tsumugi
        emotion: surprised
        text: "……。"
      - speaker: tsumugi
        emotion: normal
        text: "……そこ、たぶん両方なんだと思う。"
      - speaker: zundamon
        emotion: thinking
        text: "両方？"
      - speaker: tsumugi
        emotion: normal
        text: "止める人がいたら、10年の失敗はなかった。"
      - speaker: tsumugi
        emotion: normal
        text: "でも、プラスチックのトランプも出てなかったかもしれない。"
      - speaker: zundamon
        emotion: normal
        text: "……止めてくれる人は、いいことも止めるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。だから正解はないよ。"
      - speaker: tsumugi
        emotion: happy
        text: "そういうこと。130年以上、何屋か変わってない。"

