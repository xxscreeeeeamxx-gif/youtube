# 任天堂・山内溥 再現ドラマ・ミーム版（[山内溥|やまうちひろし]・1927→2013）。投稿前に必ず目視レビュー。
# ★ジャンル転換の実験2本目（繁栄側）。1本目のダイエー回（失敗側）と条件を揃えて比較する:
#   尺20分台 / 冒頭フック15秒以内 / つむぎ=現代からの解説役（殴る役）/ 再現ドラマ形式
# ★配役: ずんだもん=山内溥 / つむぎ=現代から見ている解説役 / ナレ=ゆっくり
# ★ミーム禁止の章: bannen（逝去）
# ★重複回避: 既存の 16_ゲームボーイの誕生（横井軍平）が ウルトラハンド〜ゲーム&ウォッチ〜
#   ゲームボーイ を横井の視点で扱っている。こちらは **経営者の視点で1927〜1983** に絞り、
#   ゲームボーイには触れない。横井は転機を作った社員として1章だけ出す
# 裏取り: 山内溥Wikipedia / 任天堂Wiki(Fandom) / ニコニコ大百科
# 確定事実:
#   1927-11-7 京都市生まれ。祖父は2代目社長・山内積良（1883-12-10生）
#   父・山内鹿之丞（婿養子・旧姓 稲葉）が幼少期に近所の女性と駆け落ちして失踪。祖父母に育てられた
#   早稲田大学専門部法律科で学ぶ / 1947 株式会社丸福の取締役
#   1949 祖父・積良が病に倒れ、22歳で急遽あとを継ぐ。
#     「任天堂で働く山内家の者は自分以外に必要ない」と条件を出し、従兄弟たちを退けた
#   1953 日本初のプラスチック製トランプを開発 / 1959 ディズニートランプが大ヒット
#   1958 U.S.プレイング・カード社を訪問。「トランプだけではちっぽけな会社で終わってしまう」
#   多角化: 1960 ダイヤ交通（タクシー）設立→1969撤退 /
#     1961 近江絹糸と共同出資で三近食品設立→1965撤退 /
#     1971 家庭用コピー機コピラス発売。10万台売った後、返品の嵐
#   1965 横井軍平が入社 / 1966 ウルトラハンドを商品化、120万個以上
#   1970 光線銃SPがヒット / レーザークレー射撃場は全国展開を計画するも
#     第一次オイルショックで建設撤回が相次ぎ、倒産の危機に直面
#   1977 テレビゲーム15/6 / 1980 ゲーム&ウオッチ 5000万台、70億円の借金を完済
#   1983-7 ファミリーコンピュータ発売。1984 累計211万台 / 1985年末 579万台 / 1990 1460万台
#   1992 シアトル・マリナーズの経営危機に個人資金で出資。MLB史上初の日本人オーナー（保有49%）
#   2002 岩田聡に社長を譲り取締役相談役へ / 2005 取締役を退任
#   2013-9-19 肺炎のため京都大学医学部附属病院で死去。享年85
#   言葉:「面白いか、面白くないかは誰にでもわかる」「娯楽は二番煎じではダメ」
#     「異業種には絶対手を出すな」（岩田への引き継ぎ時）「人とは同じことをしない」
meta:
  title: "【任天堂の再起】タクシーも食品も失敗した男が、世界を取るまで【ずんだもん解説】"
  slug: "yamauchi-nintendo"
  summary: "任天堂は花札の会社でした。22歳で社長になった山内溥は、タクシー・食品・コピー機と手を広げ、そのすべてに失敗します。借金は70億円。倒産の一歩手前で、彼は自分の会社が何屋なのかを考え直しました。ずんだもんが山内を演じる再現ドラマです。"
  tags: ["任天堂", "山内溥", "ファミコン", "経営", "昭和史", "ゲーム", "再現ドラマ", "ゆっくり", "ずんだもん", "企業史", "ミーム"]
  thumbnail:
    top: "全部失敗した"
    bottom: "任天堂の再起"
  mode: drama
  narrator: reimu
  mobs:
    - {id: sofu, label: "祖父・積良", voice: 42, pitch: -0.06, item: mustache}
    - {id: itoko, label: "従兄弟", voice: 13, pitch: 0.02}
    - {id: shain, label: "社員", voice: 12, pitch: 0.04}
    - {id: yokoi, label: "横井", voice: 12, pitch: -0.02}
    - {id: ginko, label: "銀行の人", voice: 13, pitch: -0.1, item: hat}
    - {id: iwata, label: "岩田", voice: 13, pitch: 0.04}
scenes:
  - id: hook
    title: ""
    background: il_ym_ima
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: zundamon
        emotion: happy
        text: "任天堂って、昔から強い会社なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "……そうでもないよ。"
      - speaker: zundamon
        emotion: surprised
        text: "えっ。ずっと勝ってるだろ。"
      - speaker: tsumugi
        emotion: normal
        text: "昔ね、借金が70億円あった。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "70億！？ 倒産するやつじゃないか。"
        telops:
          - {text: "借金70億円", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#0A2A1E", glow: "#4AC888", anim: up}
      - speaker: tsumugi
        emotion: normal
        text: "うん。一歩手前まで行った。"
      - speaker: zundamon
        emotion: thinking
        text: "……何で失敗したんだ。ゲームがコケたのか。"
      - speaker: tsumugi
        emotion: normal
        text: "ううん。まだゲーム会社じゃなかったの。"
      - speaker: zundamon
        emotion: surprised
        text: "は？ じゃあ何屋だったんだ。"
      - speaker: tsumugi
        emotion: happy
        text: "[花札|はなふだ]屋。"
      - speaker: zundamon
        emotion: surprised
        text: "[花札|はなふだ]！？ おじいちゃんが正月にやるやつか。"
      - speaker: tsumugi
        emotion: normal
        text: "そう。創業は1889年。ゲームより100年近く前だよ。"
      - speaker: zundamon
        emotion: thinking
        text: "……で、その[花札|はなふだ]屋がなんで70億も借りたのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "タクシー会社をやって、食品会社をやって、コピー機を売った。"
      - speaker: zundamon
        emotion: surprised
        text: "全部関係ないだろ！"
      - speaker: tsumugi
        emotion: happy
        text: "全部失敗した。"
      - speaker: zundamon
        emotion: angry
        text: "そりゃそうだ！ 何がしたかったんだ！"
      - speaker: tsumugi
        emotion: normal
        text: "その人がね、22歳で社長になった人なんだけど。"
      - speaker: zundamon
        emotion: surprised
        text: "22歳！？ ボクより若いのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "[山内溥|やまうちひろし]。任天堂の3代目。"
      - speaker: zundamon
        emotion: thinking
        text: "……全部失敗して、そこからどうしたんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "自分の会社が何屋なのかを、考え直したの。"
      - speaker: zundamon
        emotion: normal
        text: "……聞くのだ。"

  - id: kyoto
    title: "1927・京都、花札の家"
    background: il_ym_karuta
    bgm: warm
    stage:
      - {who: zundamon, x: 0.24, tag: "山内", scale: 0.8, flip: true}
      - {who: sofu, x: 0.52}
      - {who: tsumugi, x: 0.80}
    cuts:
      - speaker: reimu
        text: "1927年11月7日、[山内溥|やまうちひろし]は京都市に生まれました。"
        reading: "せんきゅうひゃくにじゅうしちねんじゅういちがつなのか、やまうちひろしわきょうとしにうまれました。"
      - speaker: reimu
        text: "家は、[花札|はなふだ]とトランプを作る任天堂という会社でした。"
        reading: "いえわ、はなふだととらんぷをつくるにんてんどうというかいしゃでした。"
      - speaker: reimu
        text: "父は彼が幼いころ、家を出て行きました。"
        reading: "ちちわかれがおさないころ、いえをでていきました。"
      - speaker: zundamon
        emotion: normal
        text: "……おじいちゃん。お父ちゃんは。"
      - speaker: sofu
        emotion: sad
        text: "……もう、帰ってこん。"
      - speaker: zundamon
        emotion: normal
        text: "……。"
      - speaker: sofu
        emotion: normal
        text: "溥。この家は、お前が継ぐんや。"
      - speaker: tsumugi
        emotion: normal
        text: "この時点で、もう逃げ場がないんだよね。"
      - speaker: reimu
        text: "彼は祖父母に育てられます。祖父は2代目社長の[積良|せきりょう]でした。"
        reading: "かれわそふぼにそだてられます。そふわにだいめしゃちょうのせきりょうでした。"
      - speaker: zundamon
        emotion: thinking
        text: "……この札、何枚売ったら家が回るんですか。"
      - speaker: sofu
        emotion: surprised
        text: "……子どもが聞くことやないな。"
      - speaker: zundamon
        emotion: normal
        text: "気になるんです。"
      - speaker: tsumugi
        emotion: happy
        text: "かわいくない子どもだ。"
      - speaker: reimu
        text: "やがて彼は、早稲田大学の専門部で法律を学び始めます。"
        reading: "やがてかれわ、わせだだいがくのせんもんぶでほうりつをまなびはじめます。"
      - speaker: zundamon
        emotion: happy
        text: "京都を出たのだ。東京は広いぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "でも、そんなに長くはいられなかった。"

  - id: shunin
    title: "1949・22歳の社長"
    background: il_ym_shacho
    bgm: kinakusai
    stage:
      - {who: zundamon, x: 0.22, tag: "山内", flip: true}
      - {who: itoko, x: 0.46}
      - {who: shain, x: 0.62}
      - {who: tsumugi, x: 0.82}
    cuts:
      - speaker: reimu
        text: "1949年、祖父の[積良|せきりょう]が病に倒れます。"
        reading: "せんきゅうひゃくよんじゅうくねん、そふのせきりょうがやまいにたおれます。"
      - speaker: reimu
        text: "急きょ呼び戻された溥は、22歳で3代目の社長になりました。"
        reading: "きゅうきょよびもどされたひろしわ、にじゅうにさいでさんだいめのしゃちょうになりました。"
      - speaker: tsumugi
        emotion: normal
        text: "大学生がいきなり社長。しかも創業60年の会社。"
      - speaker: zundamon
        emotion: normal
        text: "……引き受けます。ただし、条件があります。"
      - speaker: itoko
        emotion: surprised
        text: "条件？ お前が言う立場か。"
      - speaker: zundamon
        emotion: normal
        text: "任天堂で働く[山内家|やまうちけ]の者は、ボク以外に必要ありません。"
      - speaker: itoko
        emotion: angry
        se: don
        text: "……なんやと。"
      - speaker: tsumugi
        emotion: surprised
        text: "うわ、いきなり親族全員を切りにいった。"
      - speaker: itoko
        emotion: angry
        text: "わしらはこの家のもんやぞ。"
      - speaker: zundamon
        emotion: normal
        text: "そうです。だから、居られたら困るんです。"
      - speaker: itoko
        emotion: angry
        text: "……子どもが、何を言うとる。"
      - speaker: zundamon
        emotion: normal
        text: "22歳の社長の言うことを、親戚が聞くと思いますか。"
      - speaker: itoko
        emotion: surprised
        text: "……。"
      - speaker: zundamon
        emotion: normal
        text: "聞かへんでしょう。だから、要らんのです。"
      - speaker: tsumugi
        emotion: thinking
        text: "……理屈は分かる。分かるけど、えぐいなあ。"
      - speaker: reimu
        text: "従兄弟たちは、会社を去りました。"
        reading: "いとこたちわ、かいしゃをさりました。"
      - speaker: tsumugi
        emotion: normal
        text: "この人、22歳で味方を全部切ってスタートしてるの。"
      - speaker: zundamon
        emotion: normal
        text: "……味方やない。上司や。"
      - speaker: tsumugi
        emotion: normal
        text: "そこを分けられるのが、この人の強いとこであり。"
      - speaker: zundamon
        emotion: thinking
        text: "……であり？"
      - speaker: tsumugi
        emotion: sad
        text: "……あとで、相談する相手がいなくなるとこ。"
      - speaker: reimu
        text: "社内には、二十代の社長を認めない空気が残りました。"
        reading: "しゃないにわ、にじゅうだいのしゃちょうをみとめないくうきがのこりました。"
      - speaker: shain
        emotion: thinking
        text: "……社長。この件、先代ならこうされました。"
      - speaker: zundamon
        emotion: normal
        text: "先代はもうおらん。ボクが決める。"
      - speaker: shain
        emotion: sad
        text: "……はい。"
      - speaker: tsumugi
        emotion: normal
        text: "この人、決めるのは速いんだけど。"
      - speaker: zundamon
        emotion: thinking
        text: "……なんや。"
      - speaker: tsumugi
        emotion: normal
        text: "止めてくれる人を、自分で全部消したよね。"
      - speaker: zundamon
        emotion: normal
        text: "……止められたら、決められへん。"
      - speaker: tsumugi
        emotion: sad
        text: "うん。だから、この後めちゃくちゃ突っ走るの。"

  - id: trump
    title: "1953・プラスチックの札"
    background: il_ym_karuta
    bgm: haru_kitchen
    stage:
      - {who: zundamon, x: 0.24, tag: "山内", flip: true}
      - {who: shain, x: 0.52}
      - {who: tsumugi, x: 0.80}
    cuts:
      - speaker: shain
        emotion: sad
        text: "社長。[花札|はなふだ]は、もう伸びません。"
      - speaker: zundamon
        emotion: normal
        text: "分かってる。正月にしか出えへんからな。"
      - speaker: shain
        emotion: normal
        text: "トランプもやってますが、紙は破れますし。"
      - speaker: zundamon
        emotion: thinking
        text: "……紙やなかったら、どうや。"
      - speaker: shain
        emotion: surprised
        text: "紙じゃない札、ですか。"
      - speaker: zundamon
        emotion: normal
        text: "プラスチックや。破れん。濡れても平気や。"
      - speaker: shain
        emotion: thinking
        text: "……ただ、うちに樹脂を扱える者がおりません。"
      - speaker: zundamon
        emotion: normal
        text: "おらんかったら、覚えたらええ。"
      - speaker: shain
        emotion: sad
        text: "何年かかるか分かりませんが。"
      - speaker: zundamon
        emotion: normal
        text: "[花札|はなふだ]は正月しか売れん。待ってたら潰れる。"
      - speaker: tsumugi
        emotion: normal
        text: "この判断は正しいんだよ。季節商品だけの会社は危ないから。"
      - speaker: reimu
        text: "1953年、任天堂は日本で初めてのプラスチック製トランプを開発します。"
        reading: "せんきゅうひゃくごじゅうさんねん、にんてんどうわにほんではじめてのぷらすちっくせいとらんぷをかいはつします。"
      - speaker: tsumugi
        emotion: normal
        text: "これ、地味に大きいの。麻雀とかと違って、汚れても洗える。"
      - speaker: zundamon
        emotion: happy
        text: "水をこぼしても死なん札なのだ。無敵だぞ。"
      - speaker: reimu
        text: "1959年には、ディズニーの絵柄を使ったトランプを売り出します。"
        reading: "せんきゅうひゃくごじゅうくねんにわ、でずにーのえがらをつかったとらんぷをうりだします。"
      - speaker: shain
        emotion: happy
        text: "社長、子どもが買っていきます。"
      - speaker: zundamon
        emotion: normal
        text: "そらそうや。今までトランプは大人のもんやった。"
      - speaker: tsumugi
        emotion: surprised
        text: "……お客を増やしたんじゃなくて、増やす相手を変えたのか。"
      - speaker: zundamon
        emotion: happy
        text: "人とは同じことをせん。それが信条や。"
      - speaker: tsumugi
        emotion: normal
        text: "この頃までは、ほんとに順調なんだよね。"
      - speaker: zundamon
        emotion: thinking
        text: "……含みのある言い方をするな。"

  - id: america
    title: "1958・世界一を見た日"
    background: il_ym_america
    bgm: curious
    stage:
      - {who: zundamon, x: 0.24, tag: "山内", flip: true}
      - {who: shain, x: 0.52}
      - {who: tsumugi, x: 0.80}
    cuts:
      - speaker: reimu
        text: "1958年、彼はアメリカへ渡ります。"
        reading: "せんきゅうひゃくごじゅうはちねん、かれわあめりかえわたります。"
      - speaker: reimu
        text: "訪ねたのは、世界最大のトランプ会社、U.S.プレイング・カード社でした。"
        reading: "たずねたのわ、せかいさいだいのとらんぷがいしゃ、ゆーえすぷれいんぐかーどしゃでした。"
      - speaker: shain
        emotion: happy
        text: "社長、世界一の工場ですよ。さぞ大きいんでしょうね。"
      - speaker: zundamon
        emotion: normal
        text: "……。"
      - speaker: shain
        emotion: thinking
        text: "……社長？"
      - speaker: zundamon
        emotion: normal
        text: "……これが、世界一か。"
      - speaker: tsumugi
        emotion: normal
        text: "ここ、大事だから注意して聞いてね。"
      - speaker: zundamon
        emotion: normal
        text: "でかい。うちより、ずっとでかい。"
      - speaker: zundamon
        emotion: sad
        text: "……でも、それだけや。"
      - speaker: shain
        emotion: surprised
        text: "それだけ、とは。"
      - speaker: zundamon
        emotion: normal
        text: "世界の頂点が、この程度の大きさなんや。"
      - speaker: zundamon
        emotion: normal
        text: "つまりトランプいう商売は、これ以上でかならん。"
        telops:
          - {text: "世界一でも、この程度か", size: lg, position: bottom-center, color: "#FFFFFF", stroke: "#0A2A1E", glow: "#4AC888", anim: up}
      - speaker: tsumugi
        emotion: surprised
        text: "……世界一を見て、逆に絶望して帰ってきたの。"
      - speaker: zundamon
        emotion: normal
        text: "トランプだけでは、ちっぽけな会社で終わってしまう。"
      - speaker: tsumugi
        emotion: normal
        text: "この焦りが、正しい方向に向けばよかったんだけど。"
      - speaker: zundamon
        emotion: angry
        text: "また不吉なこと言うのやめろ。"
      - speaker: shain
        emotion: thinking
        text: "……社長。帰りの飛行機、ずっと黙っておられますね。"
      - speaker: zundamon
        emotion: normal
        text: "考えとる。"
      - speaker: shain
        emotion: normal
        text: "何をです。"
      - speaker: zundamon
        emotion: normal
        text: "うちは、何をやったらでかなれるか。"
      - speaker: tsumugi
        emotion: normal
        text: "……問いの立て方が、ちょっとずれてるんだよね。"
      - speaker: zundamon
        emotion: surprised
        text: "ずれてるか？"
      - speaker: tsumugi
        emotion: normal
        text: "うん。うちは何が得意か、じゃなくて、何ならでかくなれるか。"
      - speaker: zundamon
        emotion: thinking
        text: "……同じやろ。"
      - speaker: tsumugi
        emotion: normal
        text: "全然ちがう。そこが10年ぶんの差になるの。"
      - speaker: tsumugi
        emotion: happy
        text: "だってここから10年、ずっと失敗するもん。"

  - id: takaku
    title: "全部やる"
    background: il_ym_taxi
    bgm: pop
    stage:
      - {who: zundamon, x: 0.24, tag: "山内", flip: true}
      - {who: shain, x: 0.52}
      - {who: tsumugi, x: 0.80}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "じゃあ、この人がやったことを順番に並べるね。"
      - speaker: zundamon
        emotion: happy
        text: "おう、来い。"
      - speaker: reimu
        text: "1960年、タクシー会社のダイヤ交通を設立します。"
        reading: "せんきゅうひゃくろくじゅうねん、たくしーがいしゃのだいやこうつうをせつりつします。"
