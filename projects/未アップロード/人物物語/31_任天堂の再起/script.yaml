        reading: "せんきゅうひゃくきゅうじゅうねんにわ、るいけいでせんよんひゃくろくじゅうまんだいにたっしています。"
      - speaker: tsumugi
        emotion: normal
        text: "[花札|はなふだ]の会社が、[日本|にほん]の子ども部屋を全部取ったの。"
      - speaker: zundamon
        emotion: normal
        text: "……面白いか、面白くないか。"
      - speaker: zundamon
        emotion: normal
        text: "それは、誰にでも分かる。"
        telops:
          - {text: "面白いかどうかは、誰にでも分かる", size: lg, position: bottom-center, color: "#FFFFFF", stroke: "#0A2A1E", glow: "#4AC888", anim: up}
      - speaker: tsumugi
        emotion: normal
        text: "専門知識が要らないのが、娯楽の怖いところだよね。"
      - speaker: zundamon
        emotion: normal
        text: "そうや。せやから、[二番煎じ|にばんせんじ]はあかん。"
      - speaker: zundamon
        emotion: normal
        text: "同じもんを出したら、面白ないのは誰でも分かる。"
      - speaker: shain
        emotion: normal
        text: "社長。よそのメーカーが、うちの機械で作りたいと。"
      - speaker: zundamon
        emotion: thinking
        text: "……よそに作らせるんか。"
      - speaker: tsumugi
        emotion: normal
        text: "自分のところだけで作るか、外にも開くか。"
      - speaker: zundamon
        emotion: normal
        text: "開く。ただし、条件を付ける。"
      - speaker: shain
        emotion: thinking
        text: "条件、ですか。"
      - speaker: zundamon
        emotion: normal
        text: "面白ないもんは、出させへん。"
      - speaker: tsumugi
        emotion: surprised
        text: "……品質を自分で握ったんだ。"
      - speaker: zundamon
        emotion: normal
        text: "つまらんソフトが並んだら、機械ごと死ぬ。"
      - speaker: tsumugi
        emotion: normal
        text: "実際その通りになった業界があるから、判断は正しいよ。"
      - speaker: zundamon
        emotion: normal
        text: "……娯楽は、一回飽きられたら戻ってこん。"

  - id: mariners
    title: "1992・シアトルへ"
    background: il_ym_shacho
    bgm: warm
    stage:
      - {who: zundamon, x: 0.24, tag: "山内", flip: true}
      - {who: shain, x: 0.52}
      - {who: tsumugi, x: 0.80}
    cuts:
      - speaker: reimu
        text: "1992年、アメリカの球団シアトル・マリナーズが経営難に陥ります。"
        reading: "せんきゅうひゃくきゅうじゅうにねん、あめりかのきゅうだんしあとるまりなーずがけいえいなんにおちいります。"
      - speaker: shain
        emotion: normal
        text: "社長。マリナーズが、身売りするかもしれないそうです。"
      - speaker: zundamon
        emotion: thinking
        text: "……シアトルか。"
      - speaker: tsumugi
        emotion: normal
        text: "任天堂のアメリカ法人が、シアトルにあるの。"
      - speaker: zundamon
        emotion: normal
        text: "うちがアメリカで食えとるのは、あの街のおかげや。"
      - speaker: zundamon
        emotion: normal
        text: "……買う。ボクの金でや。"
      - speaker: shain
        emotion: surprised
        se: don
        text: "個人でですか！？"
      - speaker: tsumugi
        emotion: surprised
        text: "会社の金じゃなくて、私財を出したの。"
      - speaker: reimu
        text: "彼は個人の資金で出資し、MLB史上初の[日本人|にほんじん]オーナーとなりました。"
        reading: "かれわこじんのしきんでしゅっしし、えむえるびーしじょうはつのにほんじんおーなーとなりました。"
      - speaker: reimu
        text: "保有の割合は、49パーセントに抑えられています。"
        reading: "ほゆうのわりあいわ、よんじゅうきゅうぱーせんとにおさえられています。"
      - speaker: tsumugi
        emotion: thinking
        text: "……ねえ、球団って儲かるの？"
      - speaker: zundamon
        emotion: normal
        text: "儲からん。"
      - speaker: tsumugi
        emotion: surprised
        text: "即答した。"
      - speaker: zundamon
        emotion: normal
        text: "これは商売やない。恩返しや。"
      - speaker: tsumugi
        emotion: normal
        text: "……多角化で全部失敗した人が、儲からないものを買ってる。"
      - speaker: zundamon
        emotion: normal
        text: "商売でやるから失敗するんや。これは違う。"
      - speaker: tsumugi
        emotion: happy
        text: "……線引きが、できるようになったんだね。"

  - id: iwata
    title: "2002・引き継ぐ"
