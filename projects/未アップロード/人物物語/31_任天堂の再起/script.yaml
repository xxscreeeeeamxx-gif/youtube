      - speaker: reimu
        text: "53年ぶりの、社長の交代でした。"
        reading: "ごじゅうさんねんぶりの、しゃちょうのこうたいでした。"
      - speaker: iwata
        emotion: normal
        text: "……何か、言い残すことはありますか。"
      - speaker: zundamon
        emotion: normal
