scenes:
- id: hook
  title: ''
  background: sc_machi
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ、ぼく、そば屋さんで出前のアルバイトを始めるのだ！
  - speaker: tsumugi
    emotion: surprised
    text: バイクの免許は？
  - speaker: zundamon
    emotion: happy
    text: 原付の免許を、取ったのだ！
  - speaker: tsumugi
    emotion: normal
    text: えらいわね。で、どうやって運ぶの？
  - speaker: zundamon
    emotion: happy
    text: 片手で天ぷらそばを持って、もう片手で運転するのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 片手運転は、危ないわよ。
  - speaker: zundamon
    emotion: thinking
    text: じゃあ、おそばは頭の上にのせるのだ！
  - speaker: tsumugi
    emotion: surprised
    text: もっと危ないわよ。
    se: oti
  - speaker: tsumugi
    emotion: normal
    text: 出前のバイクには、おそばをつるす専用の台があるの。
  - speaker: tsumugi
    emotion: normal
    text: それに、あの赤い郵便のバイクも、実は同じ仲間なのよ。
  - speaker: reimu
    text: スーパーカブ。1958年の発売から、シリーズ累計1億台を超えた二輪車です。
    reading: すーぱーかぶ。せんきゅうひゃく ごじゅうはちねんの はつばいから しりーず るいけい いちおくだいお こえた にりんしゃです。
  - speaker: zundamon
    emotion: surprised
    text: 1億台！ 作ったのは、本田宗一郎さんなのだ？
  - speaker: tsumugi
    emotion: normal
    text: 作ったのは、本田さんたち技術者ね。
  - speaker: tsumugi
    emotion: thinking
    text: でも、こういうのを作ってくれと頼んで、月に3万台売れると言い切った人がいるの。
  - speaker: tsumugi
    emotion: normal
    text: ホンダのお[金|かね]と売り方を任された、藤沢武夫さんよ。
  - speaker: zundamon
    emotion: surprised
    text: 作った人じゃなくて、売る人の話なのだ！？
- id: card1910
  title: ''
  background: sc_card_1910
  cuts:
  - speaker: reimu
    text: 1910年。東京の小石川で、藤沢武夫が生まれます。
    reading: せんきゅうひゃく じゅうねん。とうきょうの こいしかわで ふじさわ たけおが うまれます。
- id: ch1_shinsai
  title: 震災と受験の失敗
  background: sc_ie
  bgm: warm
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, scale: 0.85, emotion: normal}
  - {who: chichi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 父の秀四郎は、広告にかかわる仕事をしていました。
    reading: ちちの ひでしろうわ こうこくに かかわる しごとお して いました。
  - speaker: reimu
    text: 1923年の関東大震災のあと、一家の暮らしは苦しくなります。
    reading: せんきゅうひゃく にじゅうさんねんの かんとう だいしんさいの あと いっかの くらしわ くるしく なります。
  - speaker: chichi
    emotion: sad
    text: 武夫、すまんな。しばらくは、ぜいたくはできん。
  - speaker: zundamon
    emotion: normal
    text: 分かってる。ぼくも、何か手伝うのだ。
  - speaker: chichi
    emotion: thinking
    text: 手伝うより、まずは学校を出なさい。
  - speaker: zundamon
    emotion: thinking
    text: 学校を出たら、自分でお[金|かね]を稼いで、家を楽にするのだ。
  - speaker: reimu
    text: 1928年に京華中学を卒業しますが、東京高等師範学校の受験には失敗しました。
    reading: せんきゅうひゃく にじゅうはちねんに けいか ちゅうがくお そつぎょう しますが、とうきょう こうとう しはん がっこうの じゅけんにわ しっぱい しました。
  - speaker: reimu
    text: その後、兵役を経て、働き口を探すことになります。
    reading: そのご へいえきお へて はたらきぐちお さがす ことに なります。
- id: card1934
  title: ''
  background: sc_card_1934
  cuts:
  - speaker: reimu
    text: 1934年。23歳の武夫は、東京・日本橋の鋼材店に入ります。
    reading: せんきゅうひゃく さんじゅうよねん。にじゅうさんさいの たけおわ とうきょう にほんばしの こうざいてんに はいります。
- id: ch1_kouzai
  title: 鋼材のセールスマン
  background: sc_kouzai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: tenshu, x: 0.7, emotion: normal}
  cuts:
  - speaker: tenshu
    emotion: normal
    text: 藤沢くん、今日も工場回りかね。
  - speaker: zundamon
    emotion: happy
    text: 鉄の棒や板を使う工場に、売り込みに行ってくるのだ。
  - speaker: tenshu
    emotion: thinking
    text: 月給は15円だ。売れなくても、同じだぞ。
  - speaker: zundamon
    emotion: normal
    text: 売れたら、店が大きくなる。それでいいのだ。
  - speaker: tenshu
    emotion: surprised
    text: ……店のことまで考えとるのか。
  - speaker: zundamon
    emotion: thinking
    text: まず、工場の人が、どんな鉄で困ってるかを聞くのだ。
  - speaker: tenshu
    emotion: happy
    text: 商売の筋がいいな、君は。
- id: card1939
  title: ''
  background: sc_card_1939
  cuts:
  - speaker: reimu
    text: 1939年。武夫は、自分の会社を立ち上げます。
    reading: せんきゅうひゃく さんじゅうきゅうねん。たけおわ じぶんの かいしゃお たちあげます。
- id: ch1_kiko
  title: 終戦の日の工場
  background: sc_kiko
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 名前は日本機工研究所。金属を削る刃物を作る会社です。
    reading: なまえわ にほん きこう けんきゅうじょ。きんぞくお けずる はものお つくる かいしゃです。
  - speaker: reimu
    text: 戦争の終わりが近づくと、空襲を避けて、工場を福島へ移すことにします。
    reading: せんそうの おわりが ちかづくと、くうしゅうお さけて こうじょうお ふくしまえ うつす ことに します。
  - speaker: shain
    emotion: normal
    text: 社長、最後の機械、福島に運び込みました！
  - speaker: zundamon
    emotion: happy
    text: よし、これでまた刃物が作れるのだ。
  - speaker: shain
    emotion: surprised
    text: 社長、ラジオを……。戦争が、終わったそうです。
  - speaker: zundamon
    emotion: surprised
    text: ……今日、運び終えたばかりなのに。
  - speaker: reimu
    text: 機械を運び込んだその日に、終戦を迎えたと伝わります。
    reading: きかいお はこびこんだ その ひに しゅうせんお むかえたと つたわります。
  - speaker: zundamon
    emotion: thinking
    text: 刃物は、もう売れないのだ。
  - speaker: zundamon
    emotion: normal
    text: でも、焼けた町には家が要る。家には材木が要るのだ。
  - speaker: reimu
    text: 戦後、武夫は福島の二本松で、材木を扱う製材業を始めました。
    reading: せんご たけおわ ふくしまの にほんまつで ざいもくお あつかう せいざいぎょうお はじめました。
- id: card1949
  title: ''
  background: sc_card_1949
  cuts:
  - speaker: reimu
    text: 1949年8月。東京・阿佐ヶ谷の、ある家の座敷。
    reading: せんきゅうひゃく よんじゅうきゅうねん はちがつ。とうきょう あさがやの ある いえの ざしき。
- id: ch2_deai
  title: 二人の出会い
  background: sc_zashiki
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: takeshima, x: 0.56, emotion: normal}
  - {who: honda, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 前の年、武夫は旧知の竹島弘と再会し、東京で材木店を開いていました。
    reading: まえの とし、たけおわ きゅうちの たけしま ひろしと さいかいし とうきょうで ざいもくてんお ひらいて いました。
  - speaker: reimu
    text: 竹島は、戦時中は飛行機の会社にいて、このころは国の技官でした。
    reading: たけしまわ せんじちゅうわ ひこうきの かいしゃに いて、この ころわ くにの ぎかんでした。
  - speaker: takeshima
    emotion: normal
    text: 藤沢くん、紹介するよ。浜松でオートバイを作っている、本田宗一郎さんだ。
  - speaker: honda
    emotion: happy
    text: 本田です。エンジンの話なら、いくらでもしますよ。
  - speaker: zundamon
    emotion: normal
    text: 藤沢です。機械のことは、まるで分かりません。
  - speaker: honda
    emotion: thinking
    text: じゃあ、あんたは何ができる？
  - speaker: zundamon
    emotion: happy
    text: お[金|かね]を集めて、作った物を売ることなら、できるのだ。
  - speaker: honda
    emotion: surprised
    text: ……それは、おれの一番苦手なことだ。
  - speaker: zundamon
    emotion: normal
    text: だったら、お[金|かね]と売ることは、ぼくが引き受ける。
  - speaker: zundamon
    emotion: normal
    text: 本田さんは、技術に集中してほしいのだ。
  - speaker: honda
    emotion: happy
    text: そいつは、助かる。
  - speaker: reimu
    text: 本田は42歳、藤沢は38歳でした。
    reading: ほんだわ よんじゅうにさい ふじさわわ さんじゅうはっさいでした。
  - speaker: reimu
    text: 二人とも、自分に無いものを相手が持っていた、と後に語っています。
    reading: ふたりとも、じぶんに ない ものお あいてが もって いたと のちに かたって います。
  - speaker: reimu
    text: この年の10月、武夫は本田技研工業の常務になりました。
    reading: この としの じゅうがつ たけおわ ほんだ ぎけん こうぎょうの じょうむに なりました。
- id: ch2_tegami
  title: 5万通の手紙
  background: sc_honsha
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: shain, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1952年、ホンダは自転車に取り付ける小さなエンジン、カブF型を出します。
    reading: せんきゅうひゃく ごじゅうにねん、ほんだわ じてんしゃに とりつける ちいさな えんじん かぶ えふがたお だします。
  - speaker: shain
    emotion: thinking
    text: 専務、これを売るには、オートバイ屋が足りませんよ。
  - speaker: zundamon
    emotion: normal
    text: オートバイ屋じゃない。自転車屋さんに頼むのだ。
  - speaker: shain
    emotion: surprised
    text: 自転車屋さん、ですか。
  - speaker: zundamon
    emotion: happy
    text: 自転車屋さんなら、全国に何万軒もある。そこに手紙を出すのだ。
  - speaker: shain
    emotion: surprised
    text: 全部に、ですか！？
  - speaker: zundamon
    emotion: normal
    text: 文面は、こうするのだ。
  - speaker: zundamon
    emotion: normal
    text: あなた[方|がた]のご先祖は、日露戦争の後、勇気をもって輸入自転車を売る決心をされた。
  - speaker: zundamon
    emotion: normal
    text: 今、お客さまは、エンジンの付いたものを求めている。
  - speaker: zundamon
    emotion: happy
    text: そのエンジンを、ホンダがつくりました。
  - speaker: reimu
    text: 手紙は、全国の自転車店5万軒以上に送られました。
    reading: てがみわ ぜんこくの じてんしゃてん ごまんけん いじょうに おくられました。
  - speaker: shain
    emotion: surprised
    text: 専務、3万軒以上から、返事が来ました！
  - speaker: zundamon
    emotion: normal
    text: 1軒に1台ずつ、申し込み順に送る。
  - speaker: zundamon
    emotion: normal
    text: 卸値は、1万9000円にする。
  - speaker: zundamon
    emotion: normal
    text: 代金は、郵便為替か、銀行への振り込みで先に受け取る。
  - speaker: shain
    emotion: surprised
    text: 先にお[金|かね]をもらうんですか！？
  - speaker: reimu
    text: すぐに約5000軒から送金があり、最終的に約1万5000店の販売網ができました。
    reading: すぐに やく ごせんけんから そうきんが あり、さいしゅうてきに やく いちまん ごせんてんの はんばいもうが できました。
  - speaker: zundamon
    emotion: happy
    text: 良い品も、置く場所が無ければ売れないのだ。
- id: ch2_kiki
  title: 1954年の危機
  background: sc_honsha
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: thinking}
  - {who: keiri, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1954年、ジュノオやドリームなど、主力の商品がそろって問題を抱えます。
    reading: せんきゅうひゃく ごじゅうよねん、じゅのおや どりーむなど しゅりょくの しょうひんが そろって もんだいお かかえます。
  - speaker: keiri
    emotion: sad
    text: 専務、ドリームは販売を止めて、在庫の山です。
  - speaker: keiri
    emotion: sad
    text: 輸入した機械の支払いも、止まっています。
  - speaker: zundamon
    emotion: thinking
    text: 協力してくれる会社には、支払いを少し待ってもらうしかない。
  - speaker: zundamon
    emotion: normal
    text: 銀行には、包み隠さず全部話すのだ。
  - speaker: keiri
    emotion: thinking
    text: 組合からは、手当をもっと出せ、という声が出ています。
  - speaker: zundamon
    emotion: normal
    text: 組合には、ぼくが自分で話す。
- id: ch2_kumiai
  title: ''
  background: sc_kumiai
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: kumiai, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 組合員1800人の前に、藤沢は自分で立ちました。
    reading: くみあいいん せんはっぴゃくにんの まえに ふじさわわ じぶんで たちました。
  - speaker: zundamon
    emotion: normal
    text: もう少し出せたとしても、後で会社がつぶれたら、
  - speaker: zundamon
    emotion: normal
    text: なぜあの時頑張らなかったのか、と言われる。
  - speaker: zundamon
    emotion: sad
    text: それでは、経営者として誠に申し訳ないことになる。
  - speaker: kumiai
    emotion: normal
    text: ……。
  - speaker: kumiai
    emotion: happy
    text: 頼むぞ！ 専務、頼むぞ！
    se: don
  - speaker: reimu
    text: 組合員たちは、大きな拍手で応えたといいます。
    reading: くみあいいんたちわ おおきな はくしゅで こたえたと いいます。
- id: card1956
  title: ''
  background: sc_card_1956
  cuts:
  - speaker: reimu
    text: 1956年の暮れ。本田と藤沢は、ヨーロッパへ視察に向かいます。
    reading: せんきゅうひゃく ごじゅうろくねんの くれ。ほんだと ふじさわわ よーろっぱえ しさつに むかいます。
- id: ch3_kinai
  title: 機内の頼み
  background: sc_kinai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: honda, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: 本田さん。自転車に付けるエンジンでは、もうだめなのだ。
  - speaker: honda
    emotion: thinking
    text: じゃあ、何を作れと言うんだ。
  - speaker: zundamon
    emotion: normal
    text: 車体ごと作った、50ccのバイクなのだ。
  - speaker: zundamon
    emotion: thinking
    text: 誰でも扱えて、特に女の人が乗りたくなるようなもの。
  - speaker: zundamon
    emotion: normal
    text: エンジンがむき出しでないものが、いい。
  - speaker: honda
    emotion: surprised
    text: 女の人が乗るバイク、か。
  - speaker: zundamon
    emotion: normal
    text: 誰でも買える品がないと、会社に先はないのだ。
  - speaker: honda
    emotion: thinking
    text: 50ccが、そんなに売れるか。
  - speaker: zundamon
    emotion: happy
    text: 自転車に乗ってる人が、みんなお客さんになるのだ。
  - speaker: honda
    emotion: surprised
    text: ……大きく出たな。
  - speaker: zundamon
    emotion: happy
    text: 作ってくれたら、ぼくが必ず売る！
  - speaker: honda
    emotion: normal
    text: ……よし。ヨーロッパで、じっくり見てこよう。
  - speaker: reimu
    text: 藤沢は著書で、欧州へ向かう機内で、50ccを何度も頼んだと書いています。
    reading: ふじさわわ ちょしょで おうしゅうえ むかう きないで、ごじゅっしーしーお なんども たのんだと かいて います。
- id: ch3_europe
  title: ヨーロッパの町で
  background: sc_europe
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: honda, x: 0.76, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 自転車にエンジンを付けたような乗り物が、たくさん走ってるのだ。
  - speaker: honda
    emotion: thinking
    text: モペッドだな。こっちは、スクーターか。
  - speaker: zundamon
    emotion: thinking
    text: どれも、日本の道で乗るには、ちょっと違う気がする。
  - speaker: honda
    emotion: normal
    text: ああ。モペッドでもスクーターでもない、日本人に合うものを作る。
  - speaker: reimu
    text: この視察で、作るべきバイクの考えが固まりつつあった、とホンダは記しています。
    reading: この しさつで つくるべき ばいくの かんがえが かたまりつつ あったと ほんだわ しるして います。
- id: ch4_nendo
  title: 手のうちに入るもの
  background: sc_kenkyujo
  bgm: honwaka_puppu
  stage:
  - {who: designer, x: 0.28, flip: true, emotion: normal}
  - {who: honda, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 帰国した本田は、若いデザイナーたちと、実物大の粘土の模型を作り始めます。
    reading: きこくした ほんだわ、わかい でざいなーたちと じつぶつだいの ねんどの もけいお つくり はじめます。
  - speaker: honda
    emotion: normal
    text: 日本の道路は悪い。エンジンは、4馬力はないとだめだ。
  - speaker: honda
    emotion: normal
    text: 悪い道でも乗りやすい、頑丈なものにしなきゃならん。
  - speaker: designer
    emotion: surprised
    text: 社長、ご自分で粘土を削るんですか。
  - speaker: honda
    emotion: happy
    text: 実物大なら、見た瞬間に分かる。計算も試作も[要らん|いらん]。
  - speaker: honda
    emotion: normal
    text: いいか、風はこう来て、こう飛ぶんだ。
  - speaker: honda
    emotion: surprised
    text: '[痛て|いて]！'
    se: oti
  - speaker: designer
    emotion: surprised
    text: 社長、粘土の中の金網が、指に刺さってます！
  - speaker: honda
    emotion: normal
    text: なんのこれしき。まだ削るぞ。
  - speaker: designer
    emotion: thinking
    text: ……刺さっても、手が止まらない。
  - speaker: honda
    emotion: happy
    text: いいか。手のうちに入るものを作れ。
  - speaker: designer
    emotion: thinking
    text: 誰でも簡単に扱える、小さなもの、ですね。
  - speaker: honda
    emotion: happy
    text: そうだ。
  - speaker: reimu
    text: この話は、担当のデザイナーが後に語ったものです。
    reading: この はなしわ たんとうの でざいなーが のちに かたった ものです。
- id: ch4_shikumi
  title: クラッチの無いバイク
  background: sc_zukai
  bgm: pop
  motion: none
  stage:
  - {who: zundamon, x: 0.14, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.86, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 開発では、たくさんの工夫が重ねられたの。
  - speaker: tsumugi
    emotion: normal
    text: まず、左手でにぎるクラッチのレバーが無いのよ。
  - speaker: zundamon
    emotion: surprised
    text: 無いのだ！？ ギアを変えるとき、どうするのだ？
  - speaker: tsumugi
    emotion: normal
    text: 自動遠心クラッチ、という仕組みよ。ギアは足で変えるの。
  - speaker: tsumugi
    emotion: normal
    text: クラッチは、足の操作とエンジンの回転で、自動で切れるの。
  - speaker: tsumugi
    emotion: normal
    text: 8つの案から3つを試作して、やっと完成したそうよ。
  - speaker: zundamon
    emotion: happy
    text: 左手が[空く|あく]から、出前も持てるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: それは昔の話。今は、両手で運転してね。
  - speaker: tsumugi
    emotion: normal
    text: 燃料のタンクは座席の下。前が低くて、スカートのままでもまたげるわ。
  - speaker: tsumugi
    emotion: normal
    text: 足元の大きなカバーは、軽いポリエチレンの樹脂。跳ねた泥から足を守るの。
  - speaker: zundamon
    emotion: thinking
    text: 樹脂のカバーなんて、当時は珍しかったのだ？
  - speaker: tsumugi
    emotion: normal
    text: 大きな成形は初めての会社に、ホンダが型を用意して、作ってもらったそうよ。
  - speaker: tsumugi
    emotion: normal
    text: エンジンは、50ccの4ストローク。
  - speaker: tsumugi
    emotion: normal
    text: 当時の小さいバイクは、2ストロークが普通だったの。
  - speaker: tsumugi
    emotion: normal
    text: 丈夫で、静かで、排気もきれい。そのかわり、仕組みが複雑になるの。
  - speaker: tsumugi
    emotion: happy
    text: 本田さんの4馬力の注文には、4.5馬力で応えたのよ。
  - speaker: tsumugi
    emotion: normal
    text: タイヤは17インチ。日本人の体に合わせて選んだ大きさよ。
  - speaker: tsumugi
    emotion: thinking
    text: でも、その大きさのタイヤは、当時の日本に無かったの。
  - speaker: zundamon
    emotion: surprised
    text: 無いのに、どう試したのだ？
  - speaker: tsumugi
    emotion: normal
    text: 18インチのタイヤを、1インチ切り詰めて試作したんですって。
  - speaker: tsumugi
    emotion: normal
    text: 大きなメーカーには断られて、小さなタイヤメーカーが引き受けてくれたそうよ。
  - speaker: reimu
    text: そば屋の出前持ちが、片手で運転できるバイク。本田の言葉として、よく語られるコンセプトです。
    reading: そばやの でまえもちが かたてで うんてん できる ばいく。ほんだの ことばとして よく かたられる こんせぷとです。
- id: card1957
  title: ''
  background: sc_card_1957
  cuts:
  - speaker: reimu
    text: 1957年の暮れ。試作車が、できあがります。
    reading: せんきゅうひゃく ごじゅうななねんの くれ。しさくしゃが できあがります。
- id: ch5_sanman
  title: 月に3万台
  background: sc_mockup
  bgm: you_and_me
