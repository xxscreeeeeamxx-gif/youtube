    text: 退任が決まったあとの、ある集まり。本田は目で合図をして、藤沢と連れ立って席を外しました。
    reading: たいにんが きまった あとの ある あつまり。ほんだわ めで あいずお して ふじさわと つれだって せきお はずしました。
  - speaker: honda
    emotion: normal
    text: まあまあだな。
  - speaker: zundamon
    emotion: normal
    text: そう、まあまあさ。
  - speaker: honda
    emotion: happy
    text: 幸せだったな。
  - speaker: zundamon
    emotion: happy
    text: 本当に幸せでした。心からお礼を言います。
  - speaker: honda
    emotion: happy
    text: 俺も礼を言うよ。良い人生だったな。
  - speaker: reimu
    text: このやりとりは、藤沢自身が書き残したものです。
    reading: この やりとりわ ふじさわ じしんが かきのこした ものです。
- id: ch9_bannen
  title: 和服の骨董屋
  background: sc_kotto
  bgm: warm
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: reimu
    text: 晩年の藤沢は、東京・六本木の自宅で、骨董の店を開きました。
    reading: ばんねんの ふじさわわ とうきょう ろっぽんぎの じたくで こっとうの みせお ひらきました。
  - speaker: tsumugi
    emotion: normal
    text: いつも和服で、常磐津っていう、三味線で語る芸を習ってたの。
  - speaker: zundamon
    emotion: surprised
    text: バイクの会社の副社長が、和服で三味線なのだ？
  - speaker: tsumugi
    emotion: normal
    text: 歌舞伎やオペラも好きで、車は自分で運転しなかったそうよ。
  - speaker: zundamon
    emotion: surprised
    text: 乗り物の会社なのに、運転しないのだ！？
  - speaker: tsumugi
    emotion: happy
    text: 作る人と、売る人。本田さんとは正反対ね。
  - speaker: tsumugi
    emotion: normal
    text: 藤沢さんは、2001年に日本の、2023年にはアメリカの自動車殿堂に入ったわ。
  - speaker: zundamon
    emotion: happy
    text: 作った人だけじゃなく、売った人も、ちゃんと残ったのだ。
- id: card1988
  title: ''
  background: sc_card_1988
  bgm: ambient
  cuts:
  - speaker: reimu
    text: 1988年12月30日。藤沢武夫は、78歳で亡くなりました。
    reading: せんきゅうひゃく はちじゅうはちねん じゅうにがつ さんじゅうにち。ふじさわ たけおわ ななじゅうはっさいで なくなりました。
  - speaker: reimu
    text: 本田宗一郎が亡くなるのは、1991年のことです。
    reading: ほんだ そういちろうが なくなるのわ せんきゅうひゃく きゅうじゅういちねんの ことです。
- id: ch10_ronsou
  title: 誰の言葉か
  background: sc_ronsou
  bgm: mystery
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: そば屋の出前持ちが片手で乗れる、って言ったのは、本田さんなのだ？ 藤沢さんなのだ？
  - speaker: tsumugi
    emotion: thinking
    text: 藤沢さんの言葉として書かれることもあるけど、ホンダの資料では、そうされてないの。
  - speaker: tsumugi
    emotion: normal
    text: ホンダ自身は、本田宗一郎の言葉として、よく語られる、と書いているわ。
  - speaker: tsumugi
    emotion: normal
    text: 資料にある藤沢さんの注文は、女の人が乗りたくなるバイクよ。
  - speaker: zundamon
    emotion: normal
    text: 有名な言葉ほど、誰が言ったか、あいまいになるのだ。
  - speaker: tsumugi
    emotion: normal
    text: アメリカで売れた話にも、二つの語り方があるの。
  - speaker: tsumugi
    emotion: normal
    text: 社員がカブで走っていたら、たまたま注目された、という話があるの。
  - speaker: tsumugi
    emotion: normal
    text: 研究者が、当時の人に聞き取りをして、広まった話よ。
  - speaker: tsumugi
    emotion: normal
    text: ホンダ自身は、アメリカには狙って挑んだ、と書いているの。
  - speaker: zundamon
    emotion: thinking
    text: 偶然と計画、どっちもあったのかもしれないのだ。
  - speaker: tsumugi
    emotion: normal
    text: それと、1億台という数には、ウェーブなど、形の近い兄弟車も入ってるの。
  - speaker: zundamon
    emotion: happy
    text: 家族みんなで、1億台なのだ。
- id: ch10_nenpi
  title: 1リットルで何キロ
  background: sc_nenpi
  bgm: pop
  motion: none
  stage:
  - {who: zundamon, x: 0.14, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.86, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: カブって、ガソリンはどれくらいで走るのだ？
  - speaker: tsumugi
    emotion: normal
    text: 最初のカブは、1リットルで90キロ走ると言われてたの。
  - speaker: zundamon
    emotion: surprised
    text: 東京から、小田原くらいまで行けるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 1983年のカブは、決まった速さで走る測り方で、1リットル180キロよ。
  - speaker: zundamon
    emotion: surprised
    text: 静岡まで、行けちゃうのだ！？
  - speaker: tsumugi
    emotion: thinking
    text: ただ、測り方が今と違うの。今の測り方だと、110のカブは1リットル約68キロね。
  - speaker: zundamon
    emotion: happy
    text: それでも、車よりずっと少ないガソリンで走れるのだ。
  - speaker: tsumugi
    emotion: normal
    text: だから、毎日何十キロも走る、郵便や新聞の配達にぴったりなのよ。
- id: ch11_gendai
  title: 働くバイクの今
  background: sc_gendai
  bgm: you_and_me
  motion: none
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.86, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 1971年には、郵便のための赤いカブが登場したわ。
  - speaker: tsumugi
    emotion: normal
    text: 2019年からは、電動のバイクに替わり始めてるわ。
  - speaker: tsumugi
    emotion: normal
    text: 出前のおそばをつるす台は、東京のそば屋さんが考えたものなの。
  - speaker: zundamon
    emotion: surprised
    text: そば屋さんが、自分で発明したのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 目黒の祐天寺にあった、大朝日というお店のご主人よ。
  - speaker: tsumugi
    emotion: normal
    text: ばねで吊るして、揺れても汁がこぼれにくいようにしてるの。
  - speaker: tsumugi
    emotion: normal
    text: 1964年の東京オリンピックでは、その台が聖火の予備のランプを運んだそうよ。
  - speaker: zundamon
    emotion: surprised
    text: おそばの台が、オリンピックに出たのだ！
  - speaker: tsumugi
    emotion: normal
    text: ベトナムでは、どこの会社のバイクでも、ホンダと呼ばれるほど広まったわ。
  - speaker: tsumugi
    emotion: normal
    text: 2014年には、形そのものが立体商標になったの。二輪車では初めてよ。
  - speaker: zundamon
    emotion: happy
    text: 形を見ただけで、カブだと分かるのだ。
  - speaker: tsumugi
    emotion: normal
    text: 2017年10月、世界の累計生産が1億台を超えたわ。
  - speaker: tsumugi
    emotion: normal
    text: そのころは15の国で作られて、160以上の国で売られてたの。
  - speaker: tsumugi
    emotion: thinking
    text: ただ、50ccのカブは、2025年に生産を終えたの。
  - speaker: tsumugi
    emotion: normal
    text: 新しい排ガスの決まりに、50ccで合わせるのが難しかったの。
  - speaker: zundamon
    emotion: sad
    text: えっ。ぼくの原付の免許で乗れるカブは、もう無いのだ？
  - speaker: tsumugi
    emotion: happy
    text: 大丈夫。2025年からは、決まりが変わったの。
  - speaker: tsumugi
    emotion: normal
    text: 125cc以下でも、力を抑えたバイクなら、原付の免許で乗れるのよ。
  - speaker: tsumugi
    emotion: normal
    text: ホンダは、スーパーカブ110ライトを出してるわ。
  - speaker: zundamon
    emotion: happy
    text: よかった！ 出前のアルバイト、続けられるのだ！
