  - speaker: reimu
    text: 1969年ごろ。車のエンジンを空気で冷やすか、水で冷やすかで、社内の意見が割れます。
    reading: せんきゅうひゃく ろくじゅうきゅうねんごろ。くるまの えんじんお くうきで ひやすか みずで ひやすかで、しゃないの いけんが われます。
  - speaker: kenkyuin
    emotion: sad
    text: 副社長、排ガスの規制には、水冷でないと間に合いません。
  - speaker: kenkyuin
    emotion: sad
    text: でも、社長は空冷だと言って聞かないんです。
  - speaker: zundamon
    emotion: thinking
    text: ……分かった。ぼくが、社長と話す。
- id: ch8_ronsou1
  title: ''
  background: sc_honsha2
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: thinking}
  - {who: honda, x: 0.7, emotion: normal}
  cuts:
  - speaker: honda
    emotion: angry
    text: 水で冷やしても、その水を空気で冷やすんだ。最初から空冷でいい。
  - speaker: zundamon
    emotion: thinking
    text: 本田さん。社長として残りますか。それとも、技術屋として残りますか。
  - speaker: honda
    emotion: surprised
    text: ……。
  - speaker: honda
    emotion: sad
    text: ……やっぱり、おれは社長として残るよ。
  - speaker: reimu
    text: 本田は社長として残る道を選び、水冷の開発を若い技術者に任せました。
    reading: ほんだわ しゃちょうとして のこる みちお えらび、すいれいの かいはつお わかい ぎじゅつしゃに まかせました。
- id: card1973
  title: ''
  background: sc_card_1973
  cuts:
  - speaker: reimu
    text: 1973年3月。藤沢は、ひとつの決心をします。
    reading: せんきゅうひゃく ななじゅうさんねん さんがつ。ふじさわわ ひとつの けっしんお します。
- id: ch8_intai
  title: 二人の退任
  background: sc_honsha2
  bgm: ambient
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: nishida, x: 0.7, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: normal
    text: 西田くん。ぼくは今季限りで辞めるよ。本田社長に、そう伝えてくれ。
  - speaker: nishida
    emotion: surprised
    text: お辞めになるんですか。
  - speaker: zundamon
    emotion: normal
    text: そろそろ、若い人たちに任せる時なのだ。
  - speaker: nishida
    emotion: thinking
    text: 社長が、[何|なん]とおっしゃるか。
  - speaker: zundamon
    emotion: normal
    text: そのまま伝えてくれ。決めるのは、社長だ。
  - speaker: nishida
    emotion: sad
    text: ……分かりました。お伝えします。
- id: ch8_intai2
  title: ''
  background: sc_honsha2
  stage:
  - {who: nishida, x: 0.28, flip: true, emotion: normal}
  - {who: honda, x: 0.7, emotion: normal}
  cuts:
  - speaker: nishida
    emotion: sad
    text: 社長。藤沢副社長が、今季限りで辞めると。
  - speaker: honda
    emotion: thinking
    text: ……そうか。
  - speaker: honda
    emotion: normal
    text: おれは藤沢武夫あっての社長だ。
  - speaker: honda
    emotion: normal
    text: 副社長が辞めるなら、おれも一緒。辞めるよ。
  - speaker: reimu
    text: 1973年10月、66歳の本田と62歳の藤沢は、そろって経営の第一線を退きました。
    reading: せんきゅうひゃく ななじゅうさんねん じゅうがつ、ろくじゅうろくさいの ほんだと ろくじゅうにさいの ふじさわわ そろって けいえいの だいいっせんお しりぞきました。
- id: ch8_saigo
  title: まあまあだな
  background: sc_kaigou
  bgm: warm
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 藤沢武夫, emotion: normal}
  - {who: honda, x: 0.7, emotion: normal}
