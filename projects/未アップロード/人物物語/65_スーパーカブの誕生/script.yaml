    reading: せんきゅうひゃく ごじゅうはちねん はちがつ。すーぱーかぶが はつばい されます。ねだんわ ごまん ごせんえんでした。
- id: ch5_zaimoku
  title: 材木屋への手紙
  background: sc_zaimoku
  bgm: honwaka_puppu
  stage:
  - {who: zaimoku, x: 0.28, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.7, tag: おかみさん, emotion: normal}
  cuts:
  - speaker: reimu
    text: 発売の反響を受けて、藤沢はまた手紙を書きます。
