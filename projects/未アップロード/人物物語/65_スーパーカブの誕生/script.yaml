    reading: とうじ にほんの にりんしゃわ、ぎょうかい ぜんたいでも つきに やく よんまん にせんだいでした。
  - speaker: designer
    emotion: surprised
    text: 業界の全部を合わせた数に、近いじゃないですか。
  - speaker: zundamon
    emotion: happy
    text: バイクに乗らなかった人が、買うのだ。
  - speaker: designer
    emotion: thinking
