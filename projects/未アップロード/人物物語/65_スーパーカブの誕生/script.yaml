  - speaker: tsumugi
    emotion: surprised
    text: 材木屋で、バイクを？
  - speaker: zaimoku
    emotion: thinking
    text: バイクのことなんぞ、なんにも分からんがなあ。
  - speaker: tsumugi
    emotion: thinking
