  - speaker: zaimoku
    emotion: happy
    text: ……なるほど。それなら、わしにも売れるかもしれん。
  - speaker: reimu
    text: 応募は約3500通。その中から、約600店が選ばれました。
    reading: おうぼわ やく さんぜんごひゃくつう。その なかから やく ろっぴゃくてんが えらばれました。
  - speaker: reimu
    text: その後も申し込みは相次ぎ、販売店は倍増しました。
    reading: その ごも もうしこみわ あいつぎ はんばいてんわ ばいぞう しました。
