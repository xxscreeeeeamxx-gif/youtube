meta:
  title: 【八木アンテナの誕生】実験したのは宇田だった。日本が見落とし、敵のレーダーで知った発明【ずんだもん解説】
  slug: yagi-uda-antenna
  summary: 屋根の上の、魚の骨のようなテレビアンテナ。正式には八木・宇田アンテナと呼ばれます。1924年、東北帝国大学の実験室で、学生が電流計のおかしな振れに気づきました。教授の八木秀次が考えを示し、講師の宇田新太郎が真鍮の棒を並べて実験を重ねます。ところが日本ではほとんど使われず、戦争中、占領したシンガポールで見つけた英軍の手帳に、YAGIの文字がありました。二人の研究者と、世界中の屋根に立ったアンテナの100年を、再現ドラマでたどります。
  tags:
  - 八木アンテナ
  - 八木・宇田アンテナ
  - 宇田新太郎
  - 八木秀次
  - 東北大学
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 技術史
  - 雑学
  thumbnail:
    top: 実験したのは宇田
    bottom: 八木アンテナの誕生
  mode: drama
  narrator: reimu
  mobs:
  - id: yagi
    label: 八木秀次
    voice: 13
    pitch: -0.08
  - id: nishimura
