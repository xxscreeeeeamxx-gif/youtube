  - id: shain
    label: 会社の人
    voice: 13
    pitch: 0.1
scenes:
- id: hook
  title: ''
  background: yg_yane
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: つむぎ、おばあちゃんの家のテレビが、ザーザーしか映らないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 屋根のアンテナを、見てみましょうか。
  - speaker: zundamon
    emotion: surprised
    text: 屋根に、魚の骨があるのだ！
  - speaker: tsumugi
    emotion: normal
    text: あれがテレビのアンテナよ。
  - speaker: zundamon
    emotion: happy
    text: 分かったのだ。映らないのは、電波が照れてるのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 電波は照れないわよ。
  - speaker: zundamon
    emotion: happy
    text: だったら、骨をもっと増やすのだ。骨が多いほど、よく映る気がするのだ！
  - speaker: tsumugi
    emotion: normal
    text: 実はそれ、少し合ってるのよ。
  - speaker: zundamon
    emotion: surprised
    text: 合ってるのだ！？
  - speaker: tsumugi
    emotion: thinking
    text: ただ、そのアンテナ、電波塔と逆を[向|む]いてるわ。
  - speaker: zundamon
    emotion: sad
    text: ……骨より、向きだったのだ。
    se: oti
  - speaker: reimu
    text: 屋根の上の、魚の骨のようなアンテナ。正式には、八木・宇田アンテナと呼ばれます。
    reading: やねの うえの さかなの ほねの ような あんてな。せいしきにわ やぎ うだ あんてなと よばれます。
  - speaker: reimu
    text: 生まれたのは、およそ100年前の仙台。東北帝国大学の実験室でした。
    reading: うまれたのわ およそ ひゃくねんまえの せんだい。とうほく ていこく だいがくの じっけんしつでした。
  - speaker: tsumugi
    emotion: normal
    text: ところがこの発明、日本ではほとんど使われなかったの。
  - speaker: tsumugi
    emotion: thinking
    text: 日本がその価値に気づいたのは、戦争中。敵のレーダーの中だったのよ。
  - speaker: zundamon
    emotion: surprised
    text: 自分の国の発明なのに、なのだ！？
- id: card1896
  title: ''
  background: yg_card_1896
  cuts:
  - speaker: reimu
    text: 1896年。富山県で、宇田新太郎が生まれます。
    reading: せんはっぴゃく きゅうじゅうろくねん。とやまけんで うだ しんたろうが うまれます。
- id: ch1_uda
  title: 先生から大学生へ
  background: yg_gakkou
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 宇田新太郎, emotion: normal}
  - {who: douryou, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 両親は学校の先生で、転勤に合わせて、小学3年から魚津の町で育ちます。
    reading: りょうしんわ がっこうの せんせいで、てんきんに あわせて しょうがく さんねんから うおづの まちで そだちます。
  - speaker: reimu
    text: 広島の高等師範学校を出ると、中学校の先生になりました。
    reading: ひろしまの こうとう しはん がっこうお でると ちゅうがっこうの せんせいに なりました。
  - speaker: douryou
    emotion: surprised
    text: 宇田先生、学校を辞めて、大学に入り直すんですか？
  - speaker: zundamon
    emotion: normal
    text: 電気のことを、もっと深く学びたいのだ。
  - speaker: douryou
    emotion: thinking
    text: 先生になってから、また学生とは、思い切りましたね。
  - speaker: zundamon
    emotion: happy
    text: 仙台の東北帝国大学に、電気の学科があるのだ。
  - speaker: reimu
    text: 1921年、宇田は25歳で、東北帝国大学の電気工学科に入学します。
    reading: せんきゅうひゃく にじゅういちねん、うだわ にじゅうごさいで とうほく ていこく だいがくの でんき こうがっかに にゅうがく します。
  - speaker: reimu
    text: 同じ魚津ゆかりの博士たちと合わせて、魚津の三太郎博士と呼ばれることになります。
    reading: おなじ うおづ ゆかりの はかせたちと あわせて、うおづの さんたろう はかせと よばれる ことに なります。
- id: ch1_yagi
  title: 弱い電気の時代
  background: yg_lab
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 大学で待っていたのが、八木秀次という教授よ。
  - speaker: tsumugi
    emotion: normal
    text: 八木さんは1886年、大阪の生まれ。東京帝国大学で電気工学を学んだの。
  - speaker: tsumugi
    emotion: normal
    text: 1913年からは、3つの国に留学したの。ドイツ、イギリス、アメリカよ。
  - speaker: zundamon
    emotion: surprised
    text: 3つの国を回ったのだ！
  - speaker: tsumugi
    emotion: normal
    text: ドイツにいる間に、第一次世界大戦が始まって、イギリスへ移ったのよ。
  - speaker: tsumugi
    emotion: normal
    text: そこで八木さんは、これからは通信のような弱い電気の時代だ、と確信したそうよ。
  - speaker: zundamon
    emotion: thinking
    text: 強い電気のほうが、すごそうなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 当時は、発電所やモーターのような強い電気が、電気工学の主役だったの。
  - speaker: tsumugi
    emotion: normal
    text: 八木さんは雑誌に文章を書いて、弱い電気の研究も大事だと訴えたわ。
  - speaker: tsumugi
    emotion: normal
    text: 1919年、東北帝国大学に工学部ができると、教授になったの。
  - speaker: tsumugi
    emotion: normal
    text: 仙台の財団から、毎年4万円という大きな研究費も出たの。
  - speaker: zundamon
    emotion: happy
    text: 仙台に、電波の研究の拠点ができたのだ。
- id: card1924
  title: ''
  background: yg_card_1924
  cuts:
  - speaker: reimu
    text: 1924年。八木の研究室で、一人の学生が実験をしていました。
    reading: せんきゅうひゃく にじゅうよねん。やぎの けんきゅうしつで ひとりの がくせいが じっけんお して いました。
- id: ch2_kizuki
  title: 電流計のおかしな振れ
  background: yg_lab
  bgm: 223am
  stage:
  - {who: nishimura, x: 0.28, emotion: thinking}
  - {who: yagi, x: 0.7, emotion: normal}
  cuts:
  - speaker: nishimura
    emotion: thinking
    text: 先生、短い電波の受け方を調べていたんですが、どうも変なんです。
  - speaker: yagi
    emotion: normal
    text: 変とは、どういうことだね。
  - speaker: nishimura
    emotion: normal
    text: 近くに置いた金属の棒の位置で、電流計の振れ方が変わるんです。
  - speaker: yagi
    emotion: thinking
    text: 棒の、位置でか。
  - speaker: nishimura
    emotion: surprised
    text: はい。棒を動かすと、急に大きく振れるときがあります。
  - speaker: yagi
    emotion: happy
    text: ……それは面白い。そのまま、詳しく調べてみなさい。
  - speaker: nishimura
    emotion: thinking
    text: ただの、測り間違いかもしれませんよ。
  - speaker: yagi
    emotion: normal
    text: 間違いかどうかも、測って確かめるのだ。おかしな数字ほど、大事にしなさい。
  - speaker: reimu
    text: 学生の西村雄二が気づいた、電流計のおかしな振れ。ここが、始まりだったとされます。
    reading: がくせいの にしむら ゆうじが きづいた でんりゅうけいの おかしな ふれ。ここが はじまりだったと されます。
- id: ch2_koushi
  title: 電波を導く棒
  background: yg_lab
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 宇田新太郎, emotion: normal}
  - {who: yagi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: その年の春に卒業した宇田は、秋に講師となり、アンテナの研究を始めます。
    reading: その としの はるに そつぎょう した うだわ、あきに こうしと なり あんてなの けんきゅうお はじめます。
  - speaker: yagi
    emotion: normal
    text: 宇田くん、電波の後ろに棒を置くと、電波が前へ返されるのは知っているね。
  - speaker: zundamon
    emotion: normal
    text: はい、反射器ですね。
  - speaker: yagi
    emotion: thinking
    text: では、前に置いた棒が、電波を導くことはないだろうか。
  - speaker: zundamon
    emotion: surprised
    text: 前に置いた棒が、電波を……導く、のだ？
  - speaker: yagi
    emotion: normal
    text: 西村くんの測定が、それを示しているように思うのだ。君が確かめてくれ。
  - speaker: zundamon
    emotion: happy
    text: やってみるのだ！
  - speaker: reimu
    text: 八木は後に、自分が導く働きの考えを示し、宇田が多くの実験を重ねた、と振り返っています。
    reading: やぎわ のちに じぶんが みちびく はたらきの かんがえお しめし、うだが おおくの じっけんお かさねたと ふりかえっています。
- id: ch2_jikken
  title: 真鍮の棒を並べて
  background: yg_jikken
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 宇田新太郎, emotion: normal}
  - {who: joshu, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 当時は、電波を出す装置も、波長を測る計器も、売っていませんでした。
    reading: とうじわ でんぱお だす そうちも はちょうお はかる けいきも うって いませんでした。
  - speaker: zundamon
    emotion: normal
    text: 真空管で、電波を出す装置から作るのだ。
  - speaker: joshu
    emotion: thinking
    text: 波長は、どうやって測るんです？
  - speaker: zundamon
    emotion: normal
    text: 2本の電線に電波を流して、強い所と弱い所の間を測るのだ。
  - speaker: zundamon
    emotion: happy
    text: 波長は4.4メートル。これで実験を始めるのだ。
  - speaker: joshu
    emotion: thinking
    text: 受けた電波の強さは、どう見るんです？
  - speaker: zundamon
    emotion: normal
    text: 鉱石の検波器につないで、検流計の針の振れで見るのだ。
  - speaker: joshu
    emotion: happy
    text: 針が大きく振れるほど、電波が強いんですね。
  - speaker: joshu
    emotion: normal
    text: 棒は、どう並べましょう。
  - speaker: zundamon
    emotion: normal
    text: 後ろに、少し長い棒を1本。前には、少し短い棒を並べていくのだ。
  - speaker: joshu
    emotion: surprised
    text: 前の棒を増やすたびに、電流計の針が上がっていきます！
  - speaker: zundamon
    emotion: happy
    text: 短い棒が、電波を前へ前へと、導いているのだ！
  - speaker: reimu
    text: 180センチの真鍮の棒を、150センチおきに、最大25本まで並べて測ったといいます。
    reading: ひゃくはちじっせんちの しんちゅうの ぼうお、ひゃくごじっせんちおきに さいだい にじゅうごほんまで ならべて はかったと いいます。
  - speaker: reimu
    text: 反射器と導波器を組み合わせることを思いついた、と宇田は振り返っています。
    reading: はんしゃきと どうはきお くみあわせる ことお おもいついたと、うだわ ふりかえっています。
  - speaker: joshu
    emotion: happy
    text: 電波が、一つの方向に、ぎゅっと集まってますね。
  - speaker: zundamon
    emotion: happy
    text: 電波の、ビームなのだ！
- id: ch2_kyori
  title: 4キロ、10キロ、60キロ
  background: yg_kaigan
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 宇田新太郎, emotion: normal}
  - {who: joshu, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 宇田は受信機を持ち出して、少しずつ距離を延ばしていきます。
    reading: うだわ じゅしんきお もちだして すこしずつ きょりお のばして いきます。
  - speaker: joshu
    emotion: happy
    text: 先生、4キロ先の台原でも、受かりました！
  - speaker: zundamon
    emotion: happy
    text: 次は、10キロ先の岩切なのだ。
  - speaker: joshu
    emotion: surprised
    text: 塩釜の15キロも、松島の20キロも、届いてます！
  - speaker: zundamon
    emotion: normal
    text: 電波を絞れば、弱い電波でも、遠くまで届くのだ。
  - speaker: joshu
    emotion: thinking
    text: 次は、海の向こうの[金華山|きんかさん]ですか。60キロですよ。
  - speaker: zundamon
    emotion: happy
    text: 試してみるのだ！
  - speaker: reimu
    text: 台原から金華山まで、宇田たちは距離を延ばしながら、電波の届き方を調べました。
    reading: だいのはらから きんかさんまで、うだたちわ きょりお のばしながら でんぱの とどきかたお しらべました。
- id: ch2_shikumi
  title: 魚の骨のしくみ
  background: yg_zukai
  bgm: curious
  stage:
  - {who: zundamon, x: 0.14, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.86, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 真ん中の、電線がつながった棒が、電波を出したり受けたりする本体よ。
  - speaker: tsumugi
    emotion: normal
    text: その後ろの、少し長い棒が反射器。電波を前へ跳ね返すの。
  - speaker: tsumugi
    emotion: normal
    text: 前に並ぶ、少し短い棒が導波器。電波を、前へ前へと導くのよ。
  - speaker: zundamon
    emotion: surprised
    text: 骨の長さが、ちょっとずつ違ったのだ！
  - speaker: tsumugi
    emotion: normal
    text: 導波器の列を、二人は電波の運河、と名付けたわ。
  - speaker: zundamon
    emotion: happy
    text: 電波が、運河を進んでいくのだ。
  - speaker: tsumugi
    emotion: normal
    text: 導波器を増やすほど、電波は細く、鋭いビームになるの。
  - speaker: zundamon
    emotion: happy
    text: だから、骨を増やすと、少し合ってたのだ。
  - speaker: tsumugi
    emotion: thinking
    text: その代わり、決まった方向しか受けられないの。だから、向きが大事なのよ。
  - speaker: zundamon
    emotion: sad
    text: おばあちゃんの家のは、逆を[向|む]いてたのだ……。
  - speaker: tsumugi
    emotion: normal
    text: それに、うまく働く電波の幅も、あまり広くないの。
- id: card1925
  title: ''
  background: yg_card_1925
  cuts:
  - speaker: reimu
    text: 1925年12月。宇田は、6行ほどの短い報告を、学会の雑誌に載せます。
    reading: せんきゅうひゃく にじゅうごねん じゅうにがつ。うだわ ろくぎょうほどの みじかい ほうこくお がっかいの ざっしに のせます。
- id: ch3_tokkyo
  title: 一人の名前の特許
  background: yg_lab
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 同じ12月の28日、八木さんは特許を出願したの。
  - speaker: tsumugi
    emotion: normal
    text: 名前は、電波指向方式。電波の向きを決める仕組み、という意味ね。
  - speaker: tsumugi
    emotion: thinking
    text: 出願したのは、八木さん一人の名前だったわ。
  - speaker: zundamon
    emotion: surprised
    text: 実験をしたのは、宇田さんなのに、なのだ？
  - speaker: tsumugi
    emotion: thinking
    text: なぜ宇田さんの名前が入らなかったのかは、今もはっきりしないの。
  - speaker: tsumugi
    emotion: normal
    text: 研究者の間でも、いくつかの見方があるわ。
  - speaker: tsumugi
    emotion: normal
    text: 1926年の2月には、二人の連名で、英語の論文も出てるの。
  - speaker: tsumugi
    emotion: normal
    text: 特許は8月に登録されたの。アメリカにも出願したわ。
  - speaker: zundamon
    emotion: thinking
    text: 論文は二人。特許は一人。ちょっと複雑なのだ。
- id: ch3_kaigi
  title: 電波の灯台
  background: yg_kaijou
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 宇田新太郎, emotion: normal}
  - {who: yagi, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1926年、東京で、太平洋の国々の学者が集まる会議が開かれました。
    reading: せんきゅうひゃく にじゅうろくねん、とうきょうで たいへいようの くにぐにの がくしゃが あつまる かいぎが ひらかれました。
  - speaker: yagi
    emotion: normal
    text: 宇田くん、この会議で、二人で発表しよう。
  - speaker: zundamon
    emotion: happy
    text: 題は、新しい電波の投射器と、無線の灯台なのだ。
  - speaker: yagi
    emotion: thinking
    text: 灯台、か。
  - speaker: zundamon
    emotion: normal
    text: 灯台の光みたいに、電波を決まった方向へ送れば、船や飛行機の道しるべになるのだ。
  - speaker: yagi
    emotion: happy
    text: 電波で、道を照らすわけだな。
  - speaker: reimu
    text: 二人はこの会議で、アンテナの研究を発表しています。
