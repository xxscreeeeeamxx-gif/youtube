    emotion: normal
    text: だから今の正式な名前は、八木・宇田アンテナなの。
  - speaker: zundamon
    emotion: thinking
    text: 特許は、延長を断られて切れたと聞いたのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 期限が切れたのは確かだけど、断られたという話は、確かな資料が見つかっていないの。
  - speaker: zundamon
    emotion: thinking
    text: 特許が、外国の会社に売られた、という話もあるのだ？
  - speaker: tsumugi
    emotion: normal
    text: アメリカの特許は、アメリカの会社に譲られてるわ。
  - speaker: tsumugi
    emotion: thinking
    text: イギリスの会社に売られた、という話は、確かめられていないの。
  - speaker: zundamon
    emotion: thinking
    text: テレビのアンテナは、全部これなのだ？
  - speaker: tsumugi
    emotion: normal
    text: 地上波のアンテナはほとんどがそうだけど、衛星放送はお皿の形のパラボラよ。
  - speaker: zundamon
    emotion: thinking
    text: 日本の人は、誰も知らなかったのだ？
  - speaker: tsumugi
    emotion: normal
    text: 島との電話もあったうえに、宇田さんは賞も受けてた。
  - speaker: tsumugi
    emotion: normal
    text: 知らなかったのは、主に軍の人たちね。
- id: ch8_gendai
  title: 100年目のアンテナ
  background: yg_gendai
  bgm: pop
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 1985年、特許庁は八木さんを、日本の十大発明家の一人に選んだわ。
  - speaker: tsumugi
    emotion: normal
    text: 1995年には、電気の国際的な学会が、歴史的な業績として認定したの。
  - speaker: tsumugi
    emotion: normal
    text: アジアで初めての認定よ。記念の銘板は、東北大学にあるわ。
  - speaker: tsumugi
    emotion: normal
    text: 2016年には、国の未来技術遺産にも登録されたの。
  - speaker: tsumugi
    emotion: normal
    text: 同じ年の1月28日、八木さんの生誕130年には、グーグルのトップの絵にもなったわ。
  - speaker: zundamon
    emotion: happy
    text: 世界中の人が、八木さんのアンテナを見たのだ。
  - speaker: tsumugi
    emotion: normal
    text: ベルギーの博覧会に出した、当時のアンテナが残ってるのよ。
  - speaker: zundamon
    emotion: surprised
    text: 100年近く前の、本物のアンテナなのだ！
  - speaker: tsumugi
    emotion: normal
    text: 2024年には、東北大学で、発明100周年の記念の会も開かれたわ。
  - speaker: tsumugi
    emotion: normal
    text: 今年は、特許の登録と最初の英語の論文から、ちょうど100年。
  - speaker: tsumugi
    emotion: normal
    text: そして、八木さんと宇田さんが亡くなって、50年の年でもあるの。
  - speaker: tsumugi
    emotion: normal
    text: 八木さんが作った会社も、名前を変えて今も続いてるの。
  - speaker: zundamon
    emotion: happy
    text: 今も、アマチュア無線やテレビで、たくさん使われているのだ。
- id: ch8_chideji
  title: 屋根の付け替え
  background: yg_yane3
  bgm: pop
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 2011年、多くの地域で、テレビのアナログ放送が終わったの。
  - speaker: zundamon
    emotion: surprised
    text: テレビが、映らなくなったのだ！？
  - speaker: tsumugi
    emotion: normal
    text: 地上デジタル放送に、切り替わったのよ。
  - speaker: tsumugi
    emotion: normal
    text: 使う電波が変わったから、屋根のアンテナを付け替えた家も多かったわ。
  - speaker: zundamon
    emotion: thinking
    text: 新しいアンテナは、どんな形なのだ？
  - speaker: tsumugi
    emotion: normal
    text: 骨が短くて、数の多いアンテナよ。これも八木式なの。
  - speaker: zundamon
    emotion: happy
    text: 電波が変わると、骨の長さも変わるのだ？
  - speaker: tsumugi
    emotion: happy
    text: そう。棒の長さは、波長に合わせて決めるのよ。
  - speaker: zundamon
    emotion: happy
    text: 骨が多いほどよく映るっていう、ぼくの説も合ってたのだ？
  - speaker: tsumugi
    emotion: normal
    text: 半分、当たりね。この骨を、素子と呼ぶの。
  - speaker: tsumugi
    emotion: normal
    text: 電波の弱い所ほど、素子の多いアンテナを使うのよ。
  - speaker: tsumugi
    emotion: normal
    text: 14素子や、20素子のアンテナも売られてるわ。
  - speaker: zundamon
    emotion: happy
    text: やっぱり、骨を増やせば解決なのだ！
  - speaker: tsumugi
    emotion: thinking
    text: ただし、向きが合っていればね。
  - speaker: zundamon
    emotion: sad
    text: ……結局、向きなのだ。
    se: oti
- id: ch8_mori
  title: 電波の来る方向
  background: yg_mori
  motion: none
  bgm: curious
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 八木アンテナは、屋根の上だけじゃないの。
  - speaker: tsumugi
    emotion: normal
    text: 野生の動物を調べる研究でも、使われてるわ。
  - speaker: zundamon
    emotion: thinking
    text: 動物に、テレビを見せるのだ？
  - speaker: tsumugi
    emotion: normal
    text: 見せないわよ。
  - speaker: tsumugi
    emotion: normal
    text: 動物の首輪に、小さな発信器を付けるの。
  - speaker: tsumugi
    emotion: normal
    text: その電波を、手に持った八木アンテナで受けるのよ。
  - speaker: zundamon
    emotion: surprised
    text: 一つの方向によく効くから、向けた方向で強さが変わるのだ！
  - speaker: tsumugi
    emotion: happy
    text: そう。受信の音が一番大きくなる方向に、動物がいるの。
  - speaker: zundamon
    emotion: happy
    text: 森の中の、かくれんぼなのだ。
  - speaker: tsumugi
    emotion: normal
    text: アマチュア無線にも、隠した発信器を探し出す競技があるわ。
  - speaker: zundamon
    emotion: happy
    text: みんなでアンテナを振りながら、野山を走るのだ？
  - speaker: tsumugi
    emotion: normal
    text: そう。フォックスハンティング、とも呼ばれてるの。
  - speaker: zundamon
    emotion: thinking
    text: キツネは、どこにもいないのだ。
  - speaker: tsumugi
    emotion: normal
    text: 隠れた発信器を、キツネに見立てているの。
  - speaker: zundamon
    emotion: happy
    text: 島まで電波を届けたアンテナが、今は森の中で、動物を探してるのだ。
