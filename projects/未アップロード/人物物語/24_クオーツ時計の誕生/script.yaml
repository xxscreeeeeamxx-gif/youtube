      - speaker: reimu
        text: "同じ1964年。中村たちはヌーシャテルで、検定にすら通りませんでした。"
        reading: "おなじせんきゅうひゃくろくじゅうよねん。なかむらたちわぬーしゃてるで、けんていにすらとおりませんでした。"
      - speaker: wakate
        text: "……両方やってたんですね。機械式も、水晶も。"
      - speaker: zundamon
        emotion: normal
        text: "両方だ。片方に賭けられるほど、余裕のある会社じゃない。"
      - speaker: zundamon
        emotion: normal
        text: "機械式では、スイスに追いつく。水晶では、追い越す。"
