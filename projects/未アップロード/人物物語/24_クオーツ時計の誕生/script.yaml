        reading: "はなしわ、そのごねんまえにさかのぼります。"
        video: assets/clips/qa_era1959.mp4
        video_full: true
        pause_after: 0.8
  - id: kojo1
    title: ""
    background: il_qz_kojo
    bgm: pastel_house
    stage:
      - {who: zundamon, x: 0.24, tag: "中村", flip: true}
      - {who: joushi, x: 0.72}
    cuts:
      - speaker: reimu
        text: "1959年、長野県[諏訪|すわ]。冬は氷点下十度まで下がる、山あいの町です。"
        reading: "せんきゅうひゃくごじゅうきゅうねん、ながのけんすわ。ふゆわひょうてんかじゅうどまでさがるやまあいのまちです。"
      - speaker: joushi
        text: "中村さん。東京の[亀戸|かめいど]が、また新しいのを出したそうだ。"
      - speaker: zundamon
        emotion: thinking
        text: "[第二精工舎|だいにせいこうしゃ]か。あっちも必死だな。"
      - speaker: joushi
        text: "同じ会社なのに、競わされる。やりにくいもんですな。"
      - speaker: zundamon
        emotion: normal
        text: "やりやすいぞ。負けたくない相手が、廊下の向こうにいるんだ。"
      - speaker: reimu
        text: "セイコーは諏訪と[亀戸|かめいど]のふたつの工場に、同じものを競って作らせていました。"
        reading: "せいこーわすわとかめいどのふたつのこうじょうに、おなじものをきそってつくらせていました。"
      - speaker: joushi
        text: "しかし中村さん、あんたが設計したマーベル、よく売れてますな。"
      - speaker: zundamon
        emotion: normal
        text: "3年前のだ。もう次を考えてる。"
      - speaker: joushi
        text: "次って、また機械式でしょう。ほかに何があるんです。"
      - speaker: zundamon
        emotion: thinking
        text: "……水晶を、考えてるんだ。"
      - speaker: joushi
        text: "水晶？あの、放送局に納めてるやつですか。"
      - speaker: zundamon
        emotion: normal
        text: "そう。去年うちが商品にした、水晶時計。"
      - speaker: reimu
        text: "1958年、セイコーは放送局用の水晶時計を商品化していました。"
        reading: "せんきゅうひゃくごじゅうはちねん、せいこーわほうそうきょくようのすいしょうどけいをしょうひんかしていました。"
      - speaker: joushi
        text: "あれは大きさが、こう、大型ロッカーくらいありますが。"
      - speaker: zundamon
