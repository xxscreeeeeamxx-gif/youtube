        text: "まだあるのか。"
      - speaker: wakate
        text: "電気です。いまの水晶時計は、100ワットほど食っています。"
      - speaker: zundamon
        emotion: normal
        text: "電球より食うな。壁のコンセントがあるから成り立ってる。"
      - speaker: wakate
        text: "腕時計は、小さな電池ひとつです。10マイクロワットに収めないと。"
      - speaker: zundamon
        emotion: thinking
        text: "10マイクロ……つまり、1000万分の1か。"
      - speaker: wakate
        text: "はい。体積を30万分の1、電気を1000万分の1です。"
      - speaker: zundamon
        emotion: thinking
        text: "（ひとつでも常識外れだ。それを両方、同時に。）"
      - speaker: wakate
        text: "……あの、これ、やる意味があるんでしょうか。"
      - speaker: zundamon
        emotion: normal
        text: "スイスで144位だった。同じやり方を続けても、143位止まりだ。"
      - speaker: wakate
        text: "でも、無理なものは無理では。"
      - speaker: zundamon
        emotion: normal
        text: "無理かどうかは、どこが無理かを分けてから決めるぞ。"
      - speaker: zundamon
        emotion: normal
        text: "でかいのは[何だ|なんだ]。水晶か、回路か、電池か。"
      - speaker: wakate
        text: "……水晶の棒が、まず長いです。周波数を出すのに長さが要るので。"
      - speaker: zundamon
        emotion: thinking
        text: "長さが要るなら、まっすぐ伸ばさなければいい。"
      - speaker: wakate
        text: "曲げる、ということですか。"
      - speaker: zundamon
