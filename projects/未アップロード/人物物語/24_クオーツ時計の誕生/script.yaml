# クオーツ時計の誕生 再現ドラマ・ミーム版（中村恒也と諏訪精工舎・1950年代→現代）
#
# == 裏取り済みの事実（出典: セイコーミュージアム銀座「クオーツ時計の誕生」「クオーツショックと
#    スイス時計の復興」「スイス天文台クロノメーター・コンクールへの挑戦」/ 中村恒也Wikipedia /
#    発明協会 戦後日本のイノベーション100選「クオーツ腕時計」/ セイコーウオッチ公式 アストロン特設 /
#    エプソン公式 沿革）==
#
# ★注意点★
# 1. ヌーシャテル天文台コンクールの終了は【1976年】。「1967年以降開催されていない」と書く
#    ネット記事があるが、セイコーミュージアムは「1976年、100年余り続いた歴史の幕を閉じた」と明記。
#    一次情報に近い方を採る
# 2. 「世界初のクオーツ腕時計」は無条件で言える（アストロン35SQ・1969年12月25日）
# 3. 中村恒也の個人的な逸話は公開資料が乏しい。生没年・経歴・役職は事実、
#    会話と心情は再現ドラマとしての脚色。断定的な人物評はナレーションで言わない
# 4. 特許公開は「デファクト・スタンダード化のため」というセイコーミュージアムの記述に沿う。
#    「善意で無償公開した」式の美談にしない（戦略だった）
#
# == 人物 ==
# - 中村恒也（1923-2018）: 主人公。1944年日本大学卒→第二精工舎。1956年マーベル設計、
#   1959年ジャイロマーベル。1963年諏訪精工舎取締役。1964年東京五輪のクオーツ開発
#   プロジェクトリーダー。1969年に世界初のクオーツ腕時計を商品化。1987年セイコーエプソン社長
# - 諏訪精工舎（長野県諏訪・現セイコーエプソン）と第二精工舎（東京・亀戸）が
#   社内で競い合う二社体制。1967年のコンクールで2位（第二）と3位（諏訪）
#
# == 数字（すべて出典あり）==
# - 1958年 放送局用水晶時計を商品化。大型ロッカー並みの大きさ
# - 腕時計にするには体積を【30万分の1】、消費電力を【1000万分の1】（100W→10μW）に
# - 1959年 社内にプロジェクト発足（59Aプロジェクト）
# - 1964年 ヌーシャテル初参加。諏訪144位（7.97点）第二153位（8.60点）。検定不合格
# - 1964年 東京五輪でクリスタルクロノメーターが親時計。消費電力は約10万分の1まで到達
# - 1967年 ヌーシャテル シリーズ賞 第二2位・諏訪3位
# - 1968年 ジュネーブ天文台コンクール 諏訪が機械式腕時計最高の4位（58.19点）腕時計総合1位
# - 1969年12月25日 クオーツアストロン35SQ 発売。45万円（中型車1台ぶん）。1週間で100台
# - 精度 日差±0.2秒・月差±5秒。機械式の日差20秒前後に対して桁違い
# - 音叉型水晶振動子（棒状の水晶をU字に加工し真空封入）・振動数8,192Hz
# - ハイブリッドIC（セラミック基板にトランジスタ76個・コンデンサ29個）
# - ステッピングモーター（1秒に1度だけ動かす）
# - セイコーは特許を一般公開しデファクト・スタンダード化を狙った
# - スイスの時計企業 1970年1600社以上 → 1980年代中頃600社割れ
# - スイスの時計産業就業者 1970年9万人 → 1984年3万3千人
# - スイスの時計輸出額 80年代前半にピーク（1974年）の1/2
# - 1976年 ヌーシャテル天文台コンクール終了（100年余りの歴史）
meta:
  title: "スイスを倒した日本の時計。世界初のクオーツを作った男【クオーツ誕生・再現ドラマ・ミーム版】"
  slug: "quartz-astron"
  summary: "腕時計はかつて、スイスのものでした。長野県諏訪の工場では、天文台のコンクールで最下位に沈んだ技術者たちが、別の何かを作ろうとしていました。中村恒也が挑んだのは、体積を30万分の1にするという無茶です。ずんだもんが中村を演じる再現ドラマです。後半では、電池で動く時計がなぜ月に5秒しかずれないのかも解説します。"
  tags: ["クオーツ", "セイコー", "アストロン", "中村恒也", "腕時計", "再現ドラマ", "ゆっくり", "ずんだもん", "ミーム"]
  thumbnail:
    top: "スイスを倒した"
    bottom: "日本の時計"
  mode: drama
  narrator: reimu
  mobs:
    - {id: joushi, label: "工場長", voice: 13, pitch: -0.06, item: mustache}
    - {id: wakate, label: "若手技師", voice: 12, hair: short}
    - {id: swiss, label: "天文台の人", voice: 13, pitch: -0.08, item: hat}
    - {id: eigyo, label: "営業部長", voice: 13, pitch: 0.02, item: hat}
    - {id: kyaku, label: "銀座の客", voice: 42, item: hat}
scenes:
  - id: hook
    title: ""
    background: il_qz_now
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "スイスの時計会社、1600社あったのが600社を切ったの。"
      - speaker: zundamon
        emotion: surprised
        text: "1000社が消えたのか！？何があったのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "日本の技術者が、電池で動く腕時計を作ったから。"
      - speaker: zundamon
        emotion: thinking
        text: "たかが電池の時計で、国の産業が傾くのか？"
      - speaker: tsumugi
        emotion: normal
        text: "月に5秒しかずれないの。当時の高級な機械式で、日に20秒。"
      - speaker: zundamon
        emotion: surprised
        text: "桁が違うのだ。勝負にならんぞ。"
      - speaker: zundamon
        emotion: happy
        text: "……ところで、ボクの腕時計、止まってるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "電池でしょ。何年替えてないの。"
      - speaker: zundamon
        emotion: normal
        text: "覚えてないのだ。時間はスマホで見るから、困ってないんだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "そのスマホの時計もね、同じ仕組みで動いてるよ。"
      - speaker: zundamon
        emotion: surprised
        text: "スマホの中にも、時計が入ってるのか！？"
      - speaker: tsumugi
        emotion: normal
        text: "水晶のかけらが、1秒間に8192回ふるえてる。それを数えてるの。"
      - speaker: zundamon
        emotion: thinking
        text: "8192回……ボクの手首とポケットで、石が震えてるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "その石を腕時計に入れるまでに、10年かかってるんだよ。"
      - speaker: zundamon
        emotion: thinking
        text: "10年！？石を入れるだけだが。"
      - speaker: tsumugi
        emotion: normal
        text: "最初の[水晶時計はね|すいしょうどけいわね]、大型ロッカーくらいの大きさだったの。"
      - speaker: zundamon
        emotion: surprised
        text: "ロッカーを手首に巻けるかよ！"
      - speaker: tsumugi
        emotion: happy
        text: "その無理を通した人の話。止まった時計を持ったまま、聞いていこう。"
      - speaker: zundamon
        emotion: happy
        text: "聞くのだ。電池、あとで買いに行くんだ。"
      - speaker: reimu
        text: "クオーツ時計。水晶のふるえを数えて時を刻む、電池式の時計です。"
        reading: "くおーつどけい。すいしょうのふるえをかぞえてときをきざむ、でんちしきのとけいです。"
      - speaker: reimu
        text: "世界で初めて作ったのは、長野県[諏訪|すわ]の工場でした。"
        reading: "せかいではじめてつくったのわ、ながのけんすわのこうじょうでした。"
      - speaker: reimu
        text: "物語は、1964年のスイスから始まります。"
        reading: "ものがたりわ、せんきゅうひゃくろくじゅうよねんのすいすからはじまります。"
  - id: era1964a
    title: "1964・スイス、ヌーシャテル"
    background: il_qz_observatory
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.15, tag: "中村", flip: true}
    cuts:
      - speaker: reimu
        text: "1964年、スイス。ヌーシャテル天文台。"
        reading: "せんきゅうひゃくろくじゅうよねん、すいす。ぬーしゃてるてんもんだい。"
        video: assets/clips/qa_era1964.mp4
        video_full: true
        pause_after: 0.8
  - id: contest
    title: ""
    background: il_qz_observatory
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.24, tag: "中村", flip: true}
      - {who: swiss, x: 0.72}
    cuts:
      - speaker: reimu
        text: "この天文台では、100年以上ものあいだ時計の精度を競う大会が開かれていました。"
        reading: "このてんもんだいでわ、ひゃくねんいじょうものあいだとけいのせいどをきそうたいかいがひらかれていました。"
      - speaker: reimu
        text: "スイスの名門が並ぶそこに、日本の会社が初めて出場します。"
        reading: "すいすのめいもんがならぶそこに、にほんのかいしゃがはじめてしゅつじょうします。"
      - speaker: swiss
        text: "ミスター・ナカムラ。日本から、はるばる。"
      - speaker: zundamon
        emotion: normal
        text: "はじめまして。[諏訪精工舎|すわせいこうしゃ]の、中村なのだ。"
      - speaker: swiss
        text: "スワ。どこにある町だね。"
      - speaker: zundamon
        emotion: normal
        text: "東京から、汽車で4時間ほどの山の中だ。"
      - speaker: swiss
        text: "山の中で、時計を。……まあ、がんばりたまえ。"
      - speaker: zundamon
        emotion: thinking
        text: "（笑ってはいない。でも、勘定にも入ってないのだ。）"
      - speaker: reimu
        text: "審査は45日間。温度と姿勢を変えながら、日ごとのずれを測り続けます。"
        reading: "しんさわよんじゅうごにちかん。おんどとしせいをかえながら、ひごとのずれをはかりつづけます。"
      - speaker: zundamon
        emotion: normal
        text: "こっちは持てるものを全部積んできたんだ。"
      - speaker: zundamon
        emotion: normal
        text: "てんぷの振動数も上げた。ひげゼンマイも作り直した。"
      - speaker: reimu
        text: "そして、結果が張り出されます。"
        reading: "そして、けっかがはりだされます。"
      - speaker: swiss
        text: "スワ・セイコーシャ、144位。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "……144位。"
        telops:
          - {text: "初参加は144位", size: xl, position: middle-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: swiss
        text: "ダイニ・セイコーシャ、153位。"
      - speaker: zundamon
        emotion: sad
        text: "2社とも、合格の線にすら届いてないのだ。"
      - speaker: reimu
        text: "点数は7.97点と8.60点。検定に合格することもできませんでした。"
        reading: "てんすうわ、ななてんきゅうななてんとはちてんろくまるてん。けんていにごうかくすることもできませんでした。"
      - speaker: swiss
        text: "悪くはない。100年の差だ。仕方あるまい。"
      - speaker: zundamon
        emotion: sad
        text: "……100年。"
      - speaker: swiss
        text: "時計は、我々がやってきたことだ。積み重ねが違う。"
      - speaker: zundamon
        emotion: thinking
        text: "（正しい。悔しいが、ぜんぶ正しいのだ。）"
      - speaker: zundamon
        emotion: normal
        text: "来年も来るぞ。順位は上げてくる。"
      - speaker: swiss
        text: "ふむ。待っているよ。"
      - speaker: reimu
        text: "中村恒也。当時41歳。[諏訪精工舎|すわせいこうしゃ]の取締役でした。"
        reading: "なかむらつねや。とうじよんじゅういっさい。すわせいこうしゃのとりしまりやくでした。"
      - speaker: zundamon
        emotion: thinking
        text: "（積み重ねで負けてるなら、同じ土俵で積んでも追いつけないのでは。）"
      - speaker: reimu
        text: "この帰り道の思いつきが、100年の歴史を終わらせることになります。"
        reading: "このかえりみちのおもいつきが、ひゃくねんのれきしをおわらせることになります。"
