  - id: shikumi
    title: "水晶は、なぜ正確なのか"
    background: il_qz_lab
    bgm: 10do
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: zundamon
        emotion: thinking
        text: "先生。そもそも、なんで水晶だと正確なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "水晶に電気をかけると、決まった速さでふるえる性質があるの。"
      - speaker: zundamon
        emotion: surprised
        text: "石が、電気で震えるのか。"
      - speaker: tsumugi
        emotion: normal
        text: "しかも、そのふるえる速さが形と大きさでほぼ決まるんだよ。"
      - speaker: zundamon
        emotion: thinking
        text: "同じ形に切れば、同じ速さで震えるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "そう。腕時計のは1秒間に8192回ふるえるよう作られてる。"
      - speaker: zundamon
        emotion: thinking
        text: "8192。中途半端な数字なんだが。"
      - speaker: tsumugi
        emotion: normal
        text: "2を13回かけた数なの。半分にしていくと、ちょうど1になる。"
      - speaker: zundamon
        emotion: surprised
        text: "半分、半分と割っていって、13回で1秒か。"
      - speaker: tsumugi
        emotion: normal
        text: "だから回路は、割り算じゃなくて半分にするだけでいいの。"
      - speaker: zundamon
        emotion: thinking
        text: "電気を食わない理由が、そこにあるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "で、1秒ぶんの合図が来たら、針を1度だけ動かす。"
      - speaker: zundamon
        emotion: thinking
        text: "動かしっぱなしじゃないのか。"
      - speaker: tsumugi
        emotion: normal
        text: "1秒に一瞬だけ電気を流して、あとは休んでる。だから電池がもつの。"
      - speaker: reimu
        text: "1秒に一度だけ針を送る、ステッピングモーターです。"
        reading: "いちびょうにいちどだけはりをおくる、すてっぴんぐもーたーです。"
      - speaker: zundamon
        emotion: surprised
        text: "秒針がカクカク動くのは、サボってたんじゃなくて省エネなのだ！"
      - speaker: tsumugi
        emotion: happy
        text: "そういうこと。あのカクカクは、電池を延ばすための動きだよ。"
      - speaker: zundamon
        emotion: thinking
        text: "機械式のは、なめらかに動くのだ。あれは。"
      - speaker: tsumugi
        emotion: normal
        text: "ゼンマイの力を歯車で少しずつ逃がしてるから、連続に近く見えるの。"
      - speaker: zundamon
        emotion: normal
        text: "なめらかだけどずれる。カクカクだけど合ってる。"
      - speaker: tsumugi
        emotion: normal
        text: "そこが分かれ目だったんだよ。1969年の。"
  - id: shikumi_zukai
    title: ""
    background: il_qz_lab
