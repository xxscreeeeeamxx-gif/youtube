  - id: ginza
    title: ""
    background: il_qz_ginza
    bgm: pastel_house
    stage:
      - {who: zundamon, x: 0.24, tag: "中村", flip: true}
      - {who: kyaku, x: 0.72}
    cuts:
      - speaker: reimu
        text: "クリスマスの銀座。ショーウィンドウに、世界初のクオーツ腕時計が並びます。"
        reading: "くりすますのぎんざ。しょーうぃんどうに、せかいはつのくおーつうでどけいがならびます。"
      - speaker: reimu
        text: "セイコークオーツアストロン35SQ。金無垢のケースに、45万円の値札でした。"
        reading: "せいこーくおーつあすとろんさんじゅうごえすきゅー。きんむくのけーすに、よんじゅうごまんえんのねふだでした。"
      - speaker: kyaku
        text: "……これが、噂の電気で動く時計かね。"
      - speaker: zundamon
        emotion: normal
        text: "電池で動く。ゼンマイは巻かなくていいんだ。"
      - speaker: kyaku
        text: "ゼンマイを巻かない時計。それは、時計と呼べるのかね。"
      - speaker: zundamon
        emotion: normal
        text: "呼べるぞ。月に5秒しか、ずれないんだ。"
      - speaker: kyaku
        se: don
        text: "月に、5秒。"
        telops:
          - {text: "月差わずか5秒", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: zundamon
        emotion: normal
        text: "そちらの腕にあるのは、たぶん日に20秒前後だ。"
      - speaker: kyaku
        text: "……これでも、いいほうだと言われて買ったんだが。"
      - speaker: zundamon
        emotion: normal
        text: "いいほうだ。そこは嘘じゃないぞ。"
      - speaker: kyaku
        text: "だが、月に5秒か。桁が違うな。"
      - speaker: kyaku
        text: "……値段も、桁が違うが。"
      - speaker: zundamon
        emotion: normal
        text: "そこは、そのうち下がる。約束するのだ。"
      - speaker: reimu
        text: "発売から1週間のうちに、100台は売り切れました。"
        reading: "はつばいからいっしゅうかんのうちに、ひゃくだいわうりきれました。"
      - speaker: kyaku
        text: "しかし、なぜ水晶なんだ。石が時間を知っているわけでもあるまい。"
      - speaker: zundamon
        emotion: normal
        text: "知らんぞ。ただ、電気をかけると決まった回数だけふるえるんだ。"
      - speaker: zundamon
        emotion: normal
        text: "1秒間に、8192回。それを数えて1秒にしてる。"
      - speaker: kyaku
        text: "数えている。……時計の中で、そんなことを。"
      - speaker: zundamon
        emotion: happy
        text: "そうだ。ゼンマイの代わりに、勘定してるんだ。"
  - id: patent
    title: "特許を、開ける"
    background: il_qz_kaigi
    bgm: kinakusai
    stage:
      - {who: zundamon, x: 0.24, tag: "中村", flip: true}
      - {who: eigyo, x: 0.72}
    cuts:
      - speaker: reimu
        text: "世界初を取ったあと、セイコーはひとつの決断をします。"
        reading: "せかいはつをとったあと、せいこーわひとつのけつだんをします。"
      - speaker: eigyo
        text: "中村さん。特許のことで、上と話がついたと聞きましたが。"
      - speaker: zundamon
        emotion: normal
        text: "ついた。一般に公開する。"
      - speaker: eigyo
        se: don
        text: "公開！？よその会社が、同じものを作れてしまいますよ。"
      - speaker: zundamon
        emotion: normal
        text: "作らせるんだ。"
      - speaker: eigyo
        text: "……意味が分かりません。10年かけたんですよ。"
      - speaker: zundamon
        emotion: normal
        text: "うちだけが作ってるうちは、これは変わり種のままだ。"
      - speaker: eigyo
        text: "変わり種、ですか。"
      - speaker: zundamon
        emotion: normal
        text: "世界中が同じ作り方をして、はじめて当たり前になる。"
      - speaker: reimu
        text: "クオーツ技術をデファクト・スタンダード、つまり業界の標準にするための公開でした。"
        reading: "くおーつぎじゅつをでふぁくとすたんだーど、つまりぎょうかいのひょうじゅんにするためのこうかいでした。"
      - speaker: eigyo
        text: "しかし、値段の競争になれば、うちも巻き込まれます。"
      - speaker: zundamon
        emotion: normal
        text: "巻き込まれるぞ。だが、市場そのものが無いよりましだ。"
      - speaker: eigyo
        text: "……善意でやるわけでは、ないんですね。"
      - speaker: zundamon
        emotion: normal
        text: "善意じゃない。標準を握るための、計算だ。"
      - speaker: reimu
        text: "狙いどおり、各社はこぞってこの技術でクオーツ時計に参入していきます。"
        reading: "ねらいどおり、かくしゃわこぞってこのぎじゅつでくおーつどけいにさんにゅうしていきます。"
      - speaker: eigyo
        text: "スイスは、どうなりますか。"
      - speaker: zundamon
        emotion: thinking
        text: "……分からん。"
      - speaker: eigyo
        text: "分からない、で済みますか。あそこは、時計の国ですよ。"
      - speaker: zundamon
        emotion: thinking
        text: "（分からないんじゃない。想像はついている。）"
  - id: shock
    title: "1600社が、600社に"
    background: il_qz_observatory
    bgm: kinakusai
    stage:
      - {who: zundamon, x: 0.24, tag: "中村", flip: true}
      - {who: swiss, x: 0.72}
    cuts:
      - speaker: reimu
        text: "1970年代。安くて正確なクオーツ時計が、世界中で作られはじめます。"
        reading: "せんきゅうひゃくななじゅうねんだい。やすくてせいかくなくおーつどけいが、せかいじゅうでつくられはじめます。"
      - speaker: reimu
        text: "1970年に1600社以上あったスイスの時計企業は、80年代中頃には600社を割り込みました。"
        reading: "せんきゅうひゃくななじゅうねんにせんろっぴゃくしゃいじょうあったすいすのとけいきぎょうわ、はちじゅうねんだいなかごろにわろっぴゃくしゃをわりこみました。"
      - speaker: reimu
        text: "働く人も、1970年の9万人から1984年には3万3千人に減りました。"
        reading: "はたらくひとわせんきゅうひゃくななじゅうねんのきゅうまんにんから、せんきゅうひゃくはちじゅうよねんにわさんまんさんぜんにんにへりました。"
      - speaker: reimu
        text: "輸出額は、過去最高だった1974年の半分にまで落ち込みます。"
        reading: "ゆしゅつがくわ、かこさいこうだったせんきゅうひゃくななじゅうよねんのはんぶんにまでおちこみます。"
      - speaker: reimu
        text: "のちに、クオーツショックと呼ばれる出来事です。"
        reading: "のちに、くおーつしょっくとよばれるできごとです。"
      - speaker: swiss
        text: "……ミスター・ナカムラ。久しぶりだな。"
      - speaker: zundamon
        emotion: sad
        text: "……ああ。"
      - speaker: swiss
        text: "うちの町の工場は、半分が畳んだ。職人はよそへ行った。"
      - speaker: zundamon
        emotion: sad
        text: "……知っている。"
      - speaker: swiss
        text: "恨み言を言いに来たわけじゃない。技術は技術だ。"
      - speaker: zundamon
        emotion: thinking
        text: "言ってくれてもいいんだ。おれが撒いたことだ。"
      - speaker: swiss
        text: "君が撒かなくても、誰かが撒いた。10年遅かっただけだろう。"
      - speaker: zundamon
        emotion: sad
        text: "……それでも、10年は10年だ。"
      - speaker: reimu
        text: "1976年。100年余り続いたヌーシャテル天文台コンクールの歴史が、幕を閉じます。"
        reading: "せんきゅうひゃくななじゅうろくねん。ひゃくねんあまりつづいたぬーしゃてるてんもんだいこんくーるのれきしが、まくをとじます。"
      - speaker: zundamon
        emotion: sad
        text: "……144位だと言われた、あの場所が。"
      - speaker: swiss
        text: "無くなった。精度を競う意味が、なくなってしまったからな。"
      - speaker: zundamon
        emotion: sad
        text: "追いつきたかっただけなんだ。追い越して、消すつもりはなかった。"
      - speaker: swiss
        text: "分かっている。……時計は、まだ死んでいないよ。"
      - speaker: zundamon
        emotion: thinking
        text: "……そうだといいのだ。"
      - speaker: reimu
        text: "のちにスイスの時計産業は、機械式を工芸品として位置づけ直すことで立ち直っていきます。"
        reading: "のちにすいすのとけいさんぎょうわ、きかいしきをこうげいひんとしていちづけなおすことでたちなおっていきます。"
