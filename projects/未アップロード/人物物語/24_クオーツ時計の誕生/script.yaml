      - speaker: wakate
        text: "ですが、空気の抵抗で振動が乱れます。"
      - speaker: zundamon
        emotion: normal
        text: "なら空気を抜け。真空に封じ込めるんだ。"
      - speaker: wakate
        text: "……なるほど。やってみます。"
      - speaker: reimu
        text: "[音叉|おんさ]型の水晶を真空に封じることで、小さくても安定してふるえるようになります。"
        reading: "おんさがたのすいしょうをしんくうにふうじることで、ちいさくてもあんていしてふるえるようになります。"
      - speaker: wakate
        text: "残るのは電気です。回路がとにかく食います。"
      - speaker: zundamon
        emotion: thinking
        text: "そっちは時間がかかる。だが、締め切りをひとつ置くぞ。"
      - speaker: wakate
        text: "締め切り、ですか。"
      - speaker: zundamon
        emotion: normal
        text: "1964年。東京でオリンピックがある。"
      - speaker: wakate
        text: "……あと5年です。"
