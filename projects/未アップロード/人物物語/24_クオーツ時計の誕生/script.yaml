  - id: lab1
    title: "30万分の1と、1000万分の1"
    background: il_qz_lab
    bgm: curious
    stage:
      - {who: zundamon, x: 0.24, tag: "中村", flip: true}
      - {who: wakate, x: 0.72}
    cuts:
      - speaker: wakate
        text: "中村さん、言われたとおり計算しました。ですが。"
      - speaker: zundamon
        emotion: normal
        text: "言ってみろ。悪い数字ほど、早く知りたいんだ。"
      - speaker: wakate
        text: "放送局用の水晶時計を、腕時計の大きさにするには。"
      - speaker: wakate
        text: "体積を、30万分の1にする必要があります。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "30万分の1！？"
        telops:
          - {text: "体積を30万分の1に", size: xl, position: middle-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: wakate
        text: "しかも、そこで終わりじゃないんです。"
      - speaker: zundamon
