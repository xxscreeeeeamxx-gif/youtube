        text: "3年後。中村たちは、同じ天文台に戻ってきました。"
        reading: "さんねんご。なかむらたちわ、おなじてんもんだいにもどってきました。"
      - speaker: swiss
        text: "……ミスター・ナカムラ。今年の結果だが。"
      - speaker: zundamon
        emotion: thinking
        text: "聞かせてくれ。"
      - speaker: swiss
        text: "企業賞、シリーズ賞。2位、ダイニ・セイコーシャ。"
      - speaker: zundamon
        emotion: surprised
        text: "[亀戸|かめいど]が、2位。"
      - speaker: swiss
        se: don
        text: "3位、スワ・セイコーシャ。"
        telops:
          - {text: "144位 → 3位", size: xl, position: middle-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: zundamon
        emotion: surprised
        text: "……3年で、144位から3位。"
      - speaker: swiss
        text: "正直に言う。ここまで来るとは思っていなかった。"
      - speaker: zundamon
        emotion: normal
        text: "100年の差だと言われたのだ。忘れてないぞ。"
      - speaker: swiss
        text: "覚えていたか。あれは、悪気があったわけでは。"
      - speaker: zundamon
        emotion: normal
        text: "分かってる。事実だったんだ。"
      - speaker: reimu
        text: "翌1968年、[諏訪精工舎|すわせいこうしゃ]はジュネーブ天文台コンクールに初挑戦します。"
        reading: "よくせんきゅうひゃくろくじゅうはちねん、すわせいこうしゃわじゅねーぶてんもんだいこんくーるにはつちょうせんします。"
      - speaker: reimu
        text: "機械式腕時計としては最高の4位。腕時計の総合では、1位でした。"
        reading: "きかいしきうでどけいとしてわさいこうのよんい。うでどけいのそうごうでわ、いちいでした。"
      - speaker: zundamon
        emotion: happy
        text: "追いついたぞ。山の中の工場が、時計の本場で1位だ。"
      - speaker: swiss
        text: "おめでとう。これで君たちも、我々の仲間だ。"
      - speaker: zundamon
        emotion: thinking
        text: "（仲間、か。……言いにくいのだ。）"
      - speaker: swiss
        text: "どうした。浮かない顔だな。"
      - speaker: zundamon
        emotion: normal
        text: "いや。……来年、別のものを出すんだ。"
      - speaker: swiss
        text: "別のもの。また新しい機械式かね。"
      - speaker: zundamon
        emotion: normal
        text: "機械では、ない。"
      - speaker: reimu
        text: "[諏訪|すわ]では10年前から、まったく別の時計が仕上げに入っていました。"
        reading: "すわでわじゅうねんまえから、まったくべつのとけいがしあげにはいっていました。"
  - id: kaigi
    title: "45万円の値札"
    background: il_qz_kaigi
    bgm: curious
    stage:
      - {who: zundamon, x: 0.24, tag: "中村", flip: true}
      - {who: eigyo, x: 0.72}
    cuts:
      - speaker: reimu
        text: "1969年の秋。腕時計に載る大きさまで、すべてが縮んでいました。"
        reading: "せんきゅうひゃくろくじゅうきゅうねんのあき。うでどけいにのるおおきさまで、すべてがちぢんでいました。"
      - speaker: eigyo
        text: "中村さん。現物、見せてもらいました。ですが。"
      - speaker: zundamon
        emotion: normal
        text: "値段の話だな。"
      - speaker: eigyo
        text: "ええ。回路の[歩留まり|ぶどまり]が悪すぎて、原価が下がりません。"
      - speaker: reimu
        text: "セラミックの板に、トランジスタ76個とコンデンサ29個を並べたハイブリッド回路です。"
        reading: "せらみっくのいたに、とらんじすたななじゅうろっことこんでんさにじゅうきゅうこをならべたはいぶりっどかいろです。"
      - speaker: eigyo
        text: "ひとつずつ手で載せて、ひとつずつ確かめて。数が作れません。"
      - speaker: zundamon
        emotion: thinking
        text: "……で、いくらになる。"
      - speaker: eigyo
        text: "45万円です。"
      - speaker: zundamon
        emotion: surprised
        text: "45万。中型車が1台買えるじゃないか。"
        telops:
          - {text: "45万円＝車1台", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#3A2A00", glow: "#FFAA00", anim: up}
      - speaker: eigyo
        text: "そうなんです。誰が腕に車を巻くのかと。"
      - speaker: zundamon
        emotion: thinking
        text: "（安くできる日は来る。だが、それを待つと誰かに先を越される。）"
      - speaker: eigyo
        text: "もう少し待って、量産のめどが立ってからでは。"
      - speaker: zundamon
        emotion: normal
        text: "出すぞ。100本でいい。"
      - speaker: eigyo
        text: "100本！？商売になりませんが。"
      - speaker: zundamon
        emotion: normal
        text: "商売にはならん。だが、世界で最初になる。"
      - speaker: eigyo
        text: "最初、ですか。それに、そこまでの値打ちが。"
      - speaker: zundamon
        emotion: normal
        text: "ある。最初にやった者だけが、次の形を決められるんだ。"
      - speaker: eigyo
        text: "……日にちは、いつにします。"
      - speaker: zundamon
        emotion: normal
        text: "年内だ。1969年のうちに出す。"
