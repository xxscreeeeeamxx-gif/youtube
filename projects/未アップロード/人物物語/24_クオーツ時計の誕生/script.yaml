  - id: gendai
    title: ""
    background: il_qz_now
    bgm: hirusagari
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: reimu
        text: "中村恒也は、1982年にエプソンの社長となり、1987年にはセイコーエプソンの社長を務めます。"
        reading: "なかむらつねやわせんきゅうひゃくはちじゅうにねんにえぷそんのしゃちょうとなり、せんきゅうひゃくはちじゅうななねんにわせいこーえぷそんのしゃちょうをつとめます。"
      - speaker: reimu
        text: "郷里の庄内には、生産の子会社を作りました。"
        reading: "きょうりのしょうないにわ、せいさんのこがいしゃをつくりました。"
      - speaker: reimu
        text: "2018年12月25日、95歳で亡くなりました。"
        reading: "にせんじゅうはちねんじゅうにがつにじゅうごにち、きゅうじゅうごさいでなくなりました。"
      - speaker: zundamon
        emotion: surprised
        text: "12月25日。……アストロンを出したのと、同じ日付なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "偶然だけどね。49年後の、同じ日。"
      - speaker: zundamon
        emotion: thinking
        text: "……なんか、できすぎてるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "いまはクオーツの時計、千円台でも買えるでしょ。"
      - speaker: zundamon
        emotion: normal
        text: "買えるのだ。ボクの止まってるやつも、たしか安かったぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "その安い時計が、45万円だったアストロンより正確なこともあるの。"
      - speaker: zundamon
        emotion: surprised
        text: "ファッ！？車1台が、千円に負けるのか。"
      - speaker: tsumugi
        emotion: normal
        text: "50年ぶんの改良が乗ってるからね。特許を開けたから、みんなで直せた。"
      - speaker: zundamon
        emotion: thinking
        text: "独り占めしてたら、こうはならなかったのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "そしてスイスの機械式も、いま値段が上がってるんだよ。"
      - speaker: zundamon
        emotion: surprised
        text: "潰れたんじゃなかったのか！？"
      - speaker: tsumugi
        emotion: normal
        text: "正確さで勝てなくなったから、手仕事の値打ちで売る方に変えたの。"
      - speaker: zundamon
        emotion: thinking
        text: "負けた[側|がわ]が、別の勝ち方を見つけたのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "だから今は、両方が並んで売られてる。"
  - id: shime
    title: ""
    background: il_qz_now
    bgm: hirusagari
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "ずんだもん、その止まった時計。電池を替えたら、また月に5秒だよ。"
      - speaker: zundamon
        emotion: happy
        text: "替えてくるのだ。急に、大事なものに見えてきたぞ。"
      - speaker: zundamon
        emotion: normal
        text: "山の中の工場が、144位から始めたやつなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "追いつくために磨いた技術が、追い越して、競技場ごと消した。"
      - speaker: zundamon
        emotion: thinking
        text: "……勝ちすぎるのも、寂しいものなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "その寂しさごと、いまあなたの手首で動いてるよ。"
      - speaker: zundamon
        emotion: happy
        text: "動いてないのだ。電池が切れてるんだ。"
      - speaker: tsumugi
        emotion: happy
        text: "……早く替えてきなさい。"
      - speaker: tsumugi
        emotion: normal
        text: "面白かったら、高評価とチャンネル登録よろしくね。"
      - speaker: zundamon
        emotion: happy
        text: "次も、身近な当たり前にかくれた話をやるのだ。"
      - speaker: tsumugi
        emotion: happy
        duet_with: zundamon
        text: "ご視聴、ありがとうございました！"
