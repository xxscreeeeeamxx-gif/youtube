meta:
  title: 【消せるボールペンの誕生】紅葉を見て作った「色が変わるインク」が、30年後にボールペンになった【ずんだもん解説】
  slug: frixion-metamo-v2
  summary: こすると消えるボールペンのインクは、もともと筆記具のために作られたものではありませんでした。1970年の秋、紅葉を見たパイロットの研究者・中筋憲一は、一夜で色が変わる葉のように、温度で色が変わるインクを試験管の中で作ろうとします。社内で「筆記具には使えない」と言われたインクは、どこで生き延び、どうやってボールペンになったのか。温度で色が変わる仕組みとあわせて、再現ドラマでたどります。
  tags:
  - フリクション
  - 消せるボールペン
  - パイロット
  - メタモカラー
  - 中筋憲一
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 文房具
  - 雑学
  thumbnail:
    top: 紅葉から30年
    bottom: 消せるボールペンの誕生
  mode: drama
  narrator: reimu
