    emotion: normal
    text: 葉の緑は、葉緑素という色なの。秋になると、それが分解されていくのよ。
  - speaker: tsumugi
    emotion: normal
    text: かわりに、アントシアニンという赤い色が葉の中で作られるの。
  - speaker: zundamon
    emotion: happy
    text: じゃあ、冷やしたら緑に戻る？
  - speaker: tsumugi
    emotion: thinking
    text: 戻らないわ。紅葉は、行ったきりの一方通行よ。
    se: chin
  - speaker: tsumugi
    emotion: normal
    text: メタモカラーは温めれば変わって、冷やせば戻る。行ったり来たりできるの。
  - speaker: zundamon
    emotion: thinking
    text: 紅葉にできないことを、試験管でやったのか。
- id: ch7_shikumi
  title: こすると消える仕組み
  background: fx_zukai2
  bgm: pastel_house
  stage:
  - {who: zundamon, x: 0.14, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.86, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: インクの粒は、直径2から3ミクロン。髪の毛の約40分の1よ。
  - speaker: tsumugi
    emotion: normal
    text: その粒の中に、3つの成分が入ってるの。
  - speaker: tsumugi
    emotion: normal
    text: 1つ目は、色のもと。ひとりでいるときは、色がないの。
  - speaker: tsumugi
    emotion: normal
    text: 2つ目は、色のもとにくっついて色を出させる相棒よ。
  - speaker: zundamon
    emotion: happy
    text: 二人がくっつくと、黒や青の色が出るのか。
  - speaker: tsumugi
    emotion: normal
    text: 3つ目が、温度を決める成分。熱くなると、相棒を自分の方へ引き寄せるの。
  - speaker: zundamon
    emotion: surprised
    text: 相棒が離れたら、色のもとはまた色がなくなるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 専用のラバーでこすると、摩擦の熱で60度くらいになるの。65度で、見えなくなるのよ。
  - speaker: zundamon
    emotion: thinking
    text: 消しゴムみたいに、紙を削ってるわけじゃないのか。
  - speaker: tsumugi
    emotion: normal
    text: そう。字は紙に残ったまま、見えなくなっただけ。
  - speaker: tsumugi
    emotion: normal
    text: だから冷凍室で一晩冷やすと、また色が戻るの。
  - speaker: tsumugi
    emotion: thinking
    text: ただ、冷蔵室だと冷え方が足りないの。こすって消した字も、完全には戻らないわ。
  - speaker: tsumugi
    emotion: normal
    text: パイロットは、マイナス10度前後で消した字が戻る場合があると書いてるの。
  - speaker: zundamon
    emotion: surprised
    text: 冬の北海道で、消した予定が勝手に復活するのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 消したはずの予定が、出てくるかもしれないわね。
    beat: true
  - speaker: zundamon
    emotion: sad
    text: だから、ボクの落書きはうっすらだったのか。
  - speaker: zundamon
    emotion: thinking
    text: そういえば、夏の車の中って何度になるの？
  - speaker: tsumugi
    emotion: normal
    text: 気温35度の日に車内は57度、ダッシュボードは79度になったというテストがあるわ。
  - speaker: zundamon
    emotion: surprised
    text: 65度を、軽く超えてるのだ！
  - speaker: tsumugi
    emotion: normal
    text: だからパイロットも、車の中には置かないでと注意してるの。
- id: ch8_ronsou
  title: 使ってはいけない書類
  background: fx_ronsou
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: thinking}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: 消せるボールペンは、何にでも使っていいの？
  - speaker: tsumugi
    emotion: normal
    text: 証書や宛名など、消えてはいけないものには使わないで。
  - speaker: tsumugi
    emotion: normal
    text: パイロット自身が、そう書いてるの。
  - speaker: tsumugi
    emotion: thinking
    text: 実際に、書き換えの事件も起きたわ。
  - speaker: tsumugi
    emotion: normal
    text: 2012年には、警察官が調書を書き換えて書類送検されたの。
  - speaker: tsumugi
    emotion: normal
    text: 2013年には、学校給食の協会で約4200万円が着服される事件もあったわ。
  - speaker: tsumugi
    emotion: normal
    text: 同じ年に消防本部で手当の書類を書き換えて、約70万円を受け取る事件も起きたの。
  - speaker: zundamon
    emotion: surprised
    text: 消せるから、後で書き換えられてしまうのだ。
    se: tsukkomi
  - speaker: tsumugi
    emotion: normal
    text: 税理士の試験では、消せるボールペンは使えないとはっきり決められてるの。
  - speaker: zundamon
    emotion: thinking
    text: 消えるのは便利だけど、消えちゃいけない書類もあるのだ。
  - speaker: zundamon
    emotion: thinking
    text: それと、消せるボールペンはパイロットが世界初なの？
  - speaker: tsumugi
    emotion: normal
    text: 1979年に、アメリカのペーパーメイトが消しゴムで消せるペンを出してるわ。
  - speaker: tsumugi
    emotion: normal
    text: ゴムの入ったインクで、[数日|すうじつ]たつと紙に定着して消えなくなるものだったの。
  - speaker: tsumugi
    emotion: normal
    text: 温度でインクを透明にして消す仕組みを、ペンで広めたのがフリクションね。
- id: ch9_metamo
  title: 消せるトナー
  background: fx_gendai
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: メタモカラーは、ペン以外にも使われてるの。
  - speaker: tsumugi
    emotion: normal
    text: 温度を知らせるカードや、荷物の温度管理のラベルね。
  - speaker: zundamon
    emotion: thinking
    text: 荷物が途中で熱くなってないか、色で分かるのか。
  - speaker: tsumugi
    emotion: normal
    text: 本物かどうかを見分ける印にも、使われてるわ。
  - speaker: zundamon
    emotion: happy
    text: 紅葉から始まった技術が、いろんな所で色を変えてるんだな。
  - speaker: tsumugi
    emotion: normal
    text: 2007年、東芝テックとパイロットは消せるトナーの開発を始めたわ。
  - speaker: tsumugi
    emotion: normal
    text: コピーした紙を専用の機械で温めると、字が消えて紙をまた使えるの。
  - speaker: zundamon
    emotion: surprised
    text: コピー機の中は熱いのに、平気なの？
  - speaker: tsumugi
    emotion: normal
    text: ふつうのコピー機は、150度以上でトナーを紙に焼き付けるの。
  - speaker: tsumugi
    emotion: normal
    text: そこでパイロットは、消える温度を100度以上に上げたの。
  - speaker: tsumugi
    emotion: normal
    text: 東芝テックは、焼き付ける温度を100度以下に下げたわ。
  - speaker: zundamon
    emotion: happy
    text: ペンは65度、トナーは100度より上。使う場所で、消える温度を変えてるのだ。
- id: ch10_gendai
  title: 世界で50億本
  background: fx_gendai2
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: 今では蛍光ペンや色鉛筆、スタンプまで約40の商品に広がったわ。
  - speaker: tsumugi
    emotion: normal
    text: 2024年には、ボールの直径が0.3ミリの一番細いものも出てるの。
  - speaker: zundamon
    emotion: happy
    text: 手帳の小さな欄にも、書き込めるね。
  - speaker: tsumugi
    emotion: normal
    text: 累計は2012年に4億本。2016年に15億本。2019年に26億本。
  - speaker: zundamon
    emotion: surprised
    text: ぐんぐん増えるのだ！
  - speaker: tsumugi
    emotion: normal
    text: 2025年の末までに、世界で50億本。100を超える国と地域で売られてるわ。
    telops:
    - {text: 世界で50億本, size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: surprised
    text: 地球の人の、半分以上に1本ずつなのだ！
    se: levelup
  - speaker: tsumugi
    emotion: normal
    text: 千賀邦行さんたちは摩擦の熱で字を消すペンの発明で、全国発明表彰を受けたの。
  - speaker: tsumugi
    emotion: normal
    text: 中筋さんは2011年にパイロットインキの会長になって、2016年に退いたわ。
  - speaker: tsumugi
    emotion: normal
    text: その後は、母校の大学などで自分の研究の話をしてるの。
  - speaker: tsumugi
    emotion: normal
    text: 2019年には、NHKの逆転人生という番組にも出ているわ。
  - speaker: tsumugi
    emotion: normal
    text: 2013年には、メタモカラーの誕生からフリクションまでの道のりを論文にまとめてるの。
  - speaker: tsumugi
    emotion: happy
    text: 講演の題は、真っ赤な紅葉がフリクションボールのふるさと。
  - speaker: zundamon
    emotion: thinking
    text: 紅葉を見てから、ボールペンになるまで30年以上か。
  - speaker: tsumugi
    emotion: normal
    text: 産みの苦しみの期間の方が長くて、ここまでの成功は想像もしていなかったと語ってるの。
  - speaker: tsumugi
    emotion: happy
    text: 人は好きなことは続けられるし、その気になれば[何|なん]でもできる。中筋さんの言葉よ。
