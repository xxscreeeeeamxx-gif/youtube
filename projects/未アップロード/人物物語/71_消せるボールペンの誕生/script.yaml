  - speaker: shain
    emotion: surprised
    text: 色から、透明に……。そんなこと、できるのか。
  - speaker: oushu
    emotion: happy
    text: 色を透明にできるなら、それは字を消せるということです。
  - speaker: shain
    emotion: surprised
    text: 消せる、ボールペン……。
  - speaker: oushu
    emotion: normal
    text: フランスの小学校では、万年筆を使うのが決まりだったんです。
