scenes:
- id: co_tsukaenai
  title: ''
  background: fx_kaigi
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, emotion: happy}
  - {who: eigyou, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1970年代のはじめ。筆記具の会社の研究室で、温度で色が変わるインクが生まれます。
    reading: せんきゅうひゃく ななじゅうねんだいの はじめ。ひっきぐの かいしゃの けんきゅうしつで、おんどで いろが かわる いんくが うまれます。
  - speaker: zundamon
    emotion: happy
    text: 温めると色が変わって、冷やすと戻るインクです。
  - speaker: eigyou
    emotion: thinking
    text: 面白い。……でも、うちは筆記具の会社だ。
  - speaker: eigyou
    emotion: normal
    text: 一度書いた字は、何年たっても変わらないのが良いインクだよ。
  - speaker: eigyou
    emotion: normal
    text: 色が変わるインクは、筆記具には使えないね。
    se: don
  - speaker: zundamon
    emotion: sad
    text: ……使えない、ですか。
  - speaker: reimu
    text: この研究者は中筋憲一。使えないと言われたインクは、30年あまり後に世界で50億本のボールペンになります。
    reading: この けんきゅうしゃわ なかすじ のりかず。つかえないと いわれた いんくわ、さんじゅうねん あまり あとに せかいで ごじゅうおくほんの ぼーるぺんに なります。
- id: hook
  title: ''
  background: fx_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: surprised}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: つむぎ、大変なのだ！ ノートの字が、全部消えてる！
  - speaker: tsumugi
    emotion: thinking
    text: どこに置いてたの？
  - speaker: zundamon
    emotion: sad
    text: 夏の車の中。ダッシュボードの上なのだ。
  - speaker: tsumugi
    emotion: normal
    text: それ、消せるボールペンでしょ。熱くなると、色が消えるの。冷凍庫で冷やせば戻るわ。
  - speaker: zundamon
    emotion: happy
    text: 戻った！ ……こすって消した落書きまで、うっすら出てきたのだ。
    se: tenten
  - speaker: tsumugi
    emotion: thinking
    text: 何を書いてたのよ。
  - speaker: zundamon
    emotion: thinking
    text: ……ひみつ。それより、どうして熱で消えるインクなんてあるの？
    telops:
    - {text: 熱で消えて冷やすと戻る？, size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: tsumugi
    emotion: normal
    text: 始まりは1970年の秋。紅葉を見た、一人の研究者よ。
- id: ch1_yokkaichi
  title: コンビナートの光
  background: fx_kombinat
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, scale: 0.9, emotion: surprised}
  cuts:
  - speaker: reimu
    text: 中筋憲一は、三重県四日市市の出身です。
    reading: なかすじ のりかずわ みえけん よっかいちしの しゅっしんです。
  - speaker: reimu
    text: 高校生のころ、町では石油化学コンビナートの建設が進んでいました。
    reading: こうこうせいの ころ、まちでわ せきゆかがく こんびなーとの けんせつが すすんで いました。
  - speaker: zundamon
    emotion: surprised
    text: パイプとタンクが、どこまでも並んでるのだ。
  - speaker: zundamon
    emotion: happy
    text: きれいだ……。ボク、化学を勉強したい。
  - speaker: reimu
    text: コンビナートの美しさに惹かれて、化学を学ぼうと思ったと本人は語っています。
    reading: こんびなーとの うつくしさに ひかれて、かがくお まなぼうと おもったと ほんにんわ かたって います。
- id: ch1_akahon
  title: 赤本の一文
  background: fx_heya2
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, scale: 0.9, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 大学選びの決め手は、受験の参考書いわゆる赤本にあった一文でした。
    reading: だいがく えらびの きめてわ、じゅけんの さんこうしょ いわゆる あかほんに あった いちぶんでした。
  - speaker: zundamon
    emotion: thinking
    text: 大学から[金華山|きんかざん]が見え、その裾には長良川の清流が……。
  - speaker: zundamon
    emotion: happy
    text: きれいな所なのだ。この大学に決めた！
  - speaker: zundamon
    emotion: thinking
    text: ……入試の科目より先に、景色で決めてしまった。
    beat: true
  - speaker: reimu
    text: この一文に惹かれて岐阜大学に進んだと、本人は明かしています。
    reading: この いちぶんに ひかれて ぎふ だいがくに すすんだと、ほんにんわ あかして います。
- id: ch1_daigaku
  title: ビーカーの外側
  background: fx_daigaku
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, emotion: normal}
  - {who: sensei, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 工学部で化学を学び、卒業論文は平林先生のもとで書きました。
    reading: こうがくぶで かがくお まなび、そつぎょう ろんぶんわ ひらばやし せんせいの もとで かきました。
  - speaker: zundamon
    emotion: happy
    text: 先生。実験が終わったので、ビーカーを洗いました。
  - speaker: sensei
    emotion: thinking
    text: 実験で使ったビーカーは、内側だけでなく外側もしっかり洗うように。
  - speaker: zundamon
    emotion: surprised
    text: 外側も、ですか？
  - speaker: sensei
    emotion: normal
    text: 外側もだ。
  - speaker: zundamon
    emotion: thinking
    text: ……外側は、薬に触ってないのに。
  - speaker: sensei
    emotion: normal
    text: 触ってないと、思い込まないことだ。
    se: hammer
  - speaker: reimu
    text: 実験のいろはを徹底的に教わったと、本人は振り返っています。
    reading: じっけんの いろはお てっていてきに おそわったと、ほんにんわ ふりかえって います。
  - speaker: sensei
    emotion: happy
    text: 君の研究に立ち向かう姿勢は、間違っていない。自信を持ってやりなさい。
  - speaker: reimu
    text: 卒業のとき、先生からかけられた言葉です。
    reading: そつぎょうの とき、せんせいから かけられた ことばです。
- id: card1966
  title: ''
  background: fx_card_1966
  cuts:
  - speaker: reimu
    text: 1966年。中筋は、パイロットインキに入社します。
    reading: せんきゅうひゃく ろくじゅうろくねん。なかすじわ ぱいろっといんきに にゅうしゃ します。
- id: ch1_nyusha
  title: 傍流の研究室
  background: fx_kenkyu
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, emotion: normal}
  - {who: senpai, x: 0.7, emotion: normal}
  cuts:
  - speaker: senpai
    emotion: normal
    text: 中筋くん。うちは筆記具の会社だが、この部署の担当は本業から外れた物ばかりだ。
  - speaker: zundamon
    emotion: surprised
    text: ボールペンのインクじゃ、ないんですか？
  - speaker: senpai
    emotion: sad
    text: 本業の部署のような人も予算も、設備もない。
  - speaker: zundamon
    emotion: thinking
    text: 人も予算も、ない……。
  - speaker: senpai
    emotion: happy
    text: その代わり、何をやっても怒られない。
  - speaker: zundamon
    emotion: surprised
    text: ……それは、いいことなんでしょうか。
    beat: true
  - speaker: reimu
    text: 担当は傍流のものばかりで、人も予算も設備もなかったと本人は振り返っています。
    reading: たんとうわ ぼうりゅうの ものばかりで、ひとも よさんも せつびも なかったと ほんにんわ ふりかえって います。
- id: card1970
  title: ''
  background: fx_card_1970
  cuts:
  - speaker: reimu
    text: 1970年の秋。中筋は、愛知県の香嵐渓で見事な紅葉を目にします。
    reading: せんきゅうひゃく ななじゅうねんの あき。なかすじわ、あいちけんの こうらんけいで みごとな こうようお めに します。
- id: ch2_kouyou
  title: 一夜で変わる色
  background: fx_kouyou
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, emotion: surprised}
  cuts:
  - speaker: zundamon
    emotion: surprised
    text: 真っ赤だ……。少し前まで、緑だった葉なのに。
  - speaker: zundamon
    emotion: thinking
    text: 緑の葉が、一夜で紅葉に変わる。
  - speaker: zundamon
    emotion: happy
    text: この色の変わり方を、試験管の中で作れないだろうか。
    se: hirameki
  - speaker: reimu
    text: これがメタモカラーの出発点だったと、本人は明かしています。
    reading: これが めたもからーの しゅっぱつてんだったと、ほんにんわ あかして います。
- id: ch2_kenkyu
  title: 上司の一言
  background: fx_kenkyu2
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, emotion: sad}
  - {who: buchou, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 研究は、うまく進みませんでした。
    reading: けんきゅうわ、うまく すすみませんでした。
  - speaker: zundamon
    emotion: sad
    text: 今日も、色は変わらなかった……。
  - speaker: zundamon
    emotion: thinking
    text: 組み合わせを変えて、もう一回なのだ。
  - speaker: zundamon
    emotion: thinking
    text: ……この試験管、今日で何本目だろう。
  - speaker: zundamon
    emotion: sad
    text: 数えるのは、やめておこう。
    beat: true
  - speaker: reimu
    text: 毎日遅くまで研究しても、成果の出ない日が続きました。
    reading: まいにち おそくまで けんきゅう しても、せいかの でない ひが つづきました。
  - speaker: buchou
    emotion: normal
    text: 中筋くん、まだ残ってたのか。
  - speaker: zundamon
    emotion: sad
    text: 部長……。すみません、まだ成果が出ていません。
  - speaker: buchou
    emotion: happy
    text: もうそろそろ、大きな仕事をしていい頃だな。
  - speaker: zundamon
    emotion: surprised
    text: ……大きな仕事。よし、やるぞ！
  - speaker: reimu
    text: 当時27歳。開発部長のこの一言を、本人は転機に挙げています。
    reading: とうじ にじゅうななさい。かいはつ ぶちょうの この ひとことお、ほんにんわ てんきに あげて います。
- id: ch2_hakken
  title: 熱で変わる色
  background: fx_kenkyu2
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, emotion: normal}
  - {who: douryou, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: その1か月後。熱で色が変わる組み合わせが、見つかります。
    reading: その いっかげつご。ねつで いろが かわる くみあわせが、みつかります。
  - speaker: zundamon
    emotion: surprised
    text: 温めたら……色が変わった。
  - speaker: douryou
    emotion: surprised
    text: 本当だ。[冷ます|さます]と、元の色に戻りますね。
  - speaker: zundamon
    emotion: surprised
    text: もう一回、温めてみよう。……また変わった！
  - speaker: zundamon
    emotion: happy
    text: 試験管の中で、紅葉が起きたのだ！
    background: fx_kenkyu2_kouyou
    se: levelup
  - speaker: reimu
    text: パイロットの記録では、着想から約1年での発見でした。
    reading: ぱいろっとの きろくでわ、ちゃくそうから やく いちねんでの はっけんでした。
  - speaker: reimu
    text: アメリカの特許には、発明者として中筋を含む4人の名前が並んでいます。
    reading: あめりかの とっきょにわ、はつめいしゃとして なかすじお ふくむ よにんの なまえが ならんで います。
  - speaker: reimu
    text: 日本では1972年に特許を出願し、1975年に特許を取りました。
    reading: にほんでわ せんきゅうひゃく ななじゅうにねんに とっきょお しゅつがんし、せんきゅうひゃく ななじゅうごねんに とっきょお とりました。
  - speaker: reimu
    text: 名前は変身を意味するメタモルフォーゼから取って、メタモカラーです。
    reading: なまえわ へんしんお いみする めたもるふぉーぜから とって、めたもからーです。
- id: ch2_hantai
  title: 筆記具には使えない
  background: fx_kaigi
  bgm: serious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, emotion: happy}
  - {who: eigyou, x: 0.7, emotion: thinking}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 温めると色が変わって、冷やすと戻るインクです。
  - speaker: eigyou
    emotion: thinking
    text: 面白い。……でも、うちは筆記具の会社だ。
  - speaker: eigyou
    emotion: normal
    text: 一度書いた字は、何年たっても変わらないのが良いインクだよ。
  - speaker: eigyou
    emotion: normal
    text: 色が変わるインクは、筆記具には使えないね。
    se: gaan
  - speaker: zundamon
    emotion: sad
    text: ……使えない、ですか。
  - speaker: eigyou
    emotion: thinking
    text: 契約書の字が暑い日に消えたら、大騒ぎだよ。
  - speaker: zundamon
    emotion: normal
    text: だったら、筆記具じゃない所で使ってもらいます。
  - speaker: reimu
    text: 社内では、主力の筆記具には応用できないと言われたと本人は語っています。
    reading: しゃないでわ、しゅりょくの ひっきぐにわ おうよう できないと いわれたと ほんにんわ かたって います。
- id: card1976
  title: ''
  background: fx_card_1976
  cuts:
  - speaker: reimu
    text: 1976年。メタモカラーを使った、最初の商品が生まれます。
    reading: せんきゅうひゃく ななじゅうろくねん。めたもからーお つかった、さいしょの しょうひんが うまれます。
- id: ch3_cup
  title: 魔法のコップ
  background: fx_shouhin
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, emotion: happy}
  - {who: douryou, x: 0.7, emotion: happy}
  cuts:
  - speaker: douryou
    emotion: happy
    text: 冷たい水を入れると、色が変わる紙コップ。名前は、魔法のコップです。
  - speaker: zundamon
    emotion: happy
    text: 子どもが、びっくりするぞ。
  - speaker: douryou
    emotion: happy
    text: 水を入れるたびに色が変わるので、何回でも遊べます。
  - speaker: douryou
    emotion: thinking
    text: ……大人の僕も、さっきから3杯飲んでます。
    background: fx_shouhin_cups
    beat: true
- id: ch3_senmitsu
  title: 千三つ
  background: fx_kaigi
  bgm: curious
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 中筋憲一, emotion: normal}
  - {who: douryou, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
    text: 中筋たちは、何百もの商品を開発していきます。
    reading: なかすじたちわ、なんびゃくもの しょうひんお かいはつ して いきます。
  - speaker: douryou
    emotion: sad
    text: 中筋さん。この前のおもちゃ、また売れませんでした。
  - speaker: zundamon
    emotion: normal
    text: 千三つだ。1000やって、当たるのは3つ。
  - speaker: douryou
    emotion: surprised
    text: 997回は、外れるんですか。
  - speaker: zundamon
    emotion: happy
    text: だから、数を出すのだ。
  - speaker: douryou
    emotion: thinking
    text: 売り込みも契約の交渉も、うちでやるんですよね。
  - speaker: zundamon
    emotion: normal
    text: うちの食い扶持は、自分たちで稼ぐ。
  - speaker: douryou
    emotion: surprised
    text: 特許の裁判まで、自分たちでやるんですか。
  - speaker: zundamon
    emotion: normal
    text: ……全部やる。
    se: zukko
  - speaker: reimu
    text: 市場開拓や契約交渉、特許訴訟まで全部やったと本人は語っています。
    reading: しじょう かいたくや けいやく こうしょう、とっきょ そしょうまで ぜんぶ やったと ほんにんわ かたって います。
  - speaker: reimu
    text: 1980年代にはアメリカのメーカーと組んで、絵柄が変わるグラスを作りました。
    reading: せんきゅうひゃく はちじゅうねんだいにわ あめりかの めーかーと くんで、えがらが かわる ぐらすお つくりました。
- id: ch3_omocha
  title: 冷水で揚げるエビフライ
  background: fx_shouhin2
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: normal}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: tsumugi
    emotion: normal
    text: メタモカラーは、おもちゃの世界でも活躍したの。
  - speaker: tsumugi
    emotion: normal
    text: 1985年には、パイロット初のおもちゃが出たわ。
  - speaker: tsumugi
    emotion: normal
    text: 冷たい水の鍋に白いエビフライを入れると、こんがり色になるの。
  - speaker: zundamon
    emotion: surprised
    text: 冷たい水で、揚げるのだ？
