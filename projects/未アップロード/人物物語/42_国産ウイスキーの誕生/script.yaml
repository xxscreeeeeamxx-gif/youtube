      - speaker: zundamon
        emotion: surprised
        text: "……場所。どこがええんや。"
      - speaker: taketsuru
        emotion: normal
        text: "北海道。[余市|よいち]です。"
        se: don
      - speaker: zundamon
        emotion: surprised
        text: "……北海道。"
      - speaker: taketsuru
        emotion: normal
        text: "冷たくて、湿っていて、水がいい。"
      - speaker: taketsuru
        emotion: happy
        text: "向こうの土地に、よく似ています。"
      - speaker: zundamon
        emotion: thinking
        text: "……似てるのは分かった。"

