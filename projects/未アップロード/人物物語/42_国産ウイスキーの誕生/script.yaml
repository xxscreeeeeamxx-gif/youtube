    cuts:
      - speaker: zundamon
        emotion: happy
        text: "つむぎ。日本のウイスキー、強いらしいのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。世界の賞も取ってるよ。"
      - speaker: zundamon
        emotion: happy
        text: "最初からうまかったのだな。"
      - speaker: tsumugi
        emotion: happy
        text: "ううん。第一号、売れなかったの。"
      - speaker: zundamon
        emotion: surprised
        text: "……売れなかった。"
        se: don
        telops:
          - {text: "国産第一号は売れなかった", size: lg, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
      - speaker: tsumugi
        emotion: normal
        text: "六年かけて作って、不評だった。"
      - speaker: zundamon
        emotion: thinking
        text: "……六年。長いのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "しかもね。作った二人は、そのあと別れるの。"
      - speaker: zundamon
        emotion: surprised
        text: "喧嘩したのか。"
      - speaker: tsumugi
        emotion: normal
        text: "そこがね。喧嘩じゃないの。"
      - speaker: zundamon
        emotion: thinking
        text: "……どういうことなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "二人とも、正しかったの。"

  - id: akadama
