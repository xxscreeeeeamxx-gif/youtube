    background: il_wsk_mise
    bgm: you_and_me
    stage:
      - {who: zundamon, x: 0.3, flip: true, emotion: normal}
      - {who: taketsuru, x: 0.68}
    cuts:
      - speaker: reimu
        text: "ウイスキーを作れる日本人は、ほとんどいませんでした。"
        reading: "ういすきーお つくれる にほんじんわ ほとんど いませんでした。"
      - speaker: reimu
        text: "鳥井は、スコットランドで学んだ男を招きます。"
        reading: "とりいわ すこっとらんどで まなんだ おとこお まねきます。"
      - speaker: zundamon
        emotion: normal
        text: "[竹鶴|たけつる]さん。うちに来てほしいのや。"
      - speaker: taketsuru
        emotion: surprised
        text: "……本気ですか。日本でスコッチを。"
      - speaker: zundamon
        emotion: normal
        text: "本気や。金は出す。十年、頼む。"
      - speaker: taketsuru
        emotion: thinking
