    background: il_wsk_mise
    bgm: hirusagari
    stage:
      - {who: zundamon, x: 0.3, flip: true, emotion: happy}
      - {who: banto, x: 0.68}
    cuts:
      - speaker: reimu
        text: "大阪の洋酒店に、鳥井信治郎という主人がいました。"
        reading: "おおさかの ようしゅてんに とりいしんじろうと いう しゅじんが いました。"
      - speaker: banto
        emotion: thinking
        text: "旦那さん。[葡萄酒|ぶどうしゅ]は、酸っぱいと言われます。"
      - speaker: zundamon
        emotion: normal
        text: "そうやろな。日本人の口に合わんのや。"
      - speaker: banto
        emotion: surprised
        text: "では、どうします。"
      - speaker: zundamon
        emotion: happy
        text: "甘うするのや。日本人の口に、合わせる。"
      - speaker: banto
        emotion: surprised
        text: "……本場と違うものになりますが。"
      - speaker: zundamon
        emotion: angry
        text: "飲まれへん本物に、何の値打ちがある。"
      - speaker: reimu
        text: "1907年、赤玉ポートワインを売り出します。"
        reading: "せんきゅうひゃくななねん、あかだま ぽーとわいんお うりだします。"
      - speaker: reimu
        text: "これが、のちの商売の土台になりました。"
        reading: "これが のちの しょうばいの どだいに なりました。"
      - speaker: banto
        emotion: happy
        text: "旦那さん。売れてます。よう売れてます。"
      - speaker: zundamon
        emotion: happy
        text: "せやろ。……次は、ウイスキーや。"
      - speaker: banto
        emotion: surprised
        text: "……ウイスキー。日本で、ですか。"
      - speaker: zundamon
        emotion: happy
        text: "やってみなはれ。"
        se: don

  - id: yatoi
