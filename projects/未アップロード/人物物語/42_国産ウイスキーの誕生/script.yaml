# 国産ウイスキー・再現ドラマ（[鳥井信治郎|とりいしんじろう]・1879→1962）。
# 投稿前に必ず目視レビュー。
# ★企業の一代記シリーズ12本目。この回だけ**敵がいない**。
#   ホンダ＝宣言と時間 / ソニー＝役所 / トヨタ＝割れる鋳物 / ブリヂストン＝返品
#   **サントリー＝味方だった人と別れる話**。二人とも正しくて、それでも分かれる
# ★配役: ずんだもん=鳥井信治郎 / つむぎ=現代から見ている解説役 / ナレ=ゆっくり
#   竹鶴政孝はモブ。**竹鶴を悪く描かない**。どちらが正しいとも言わせない
# ★ミーム禁止の章: wakare（決別の章）
# 裏取り:
#   鳥井信治郎 Wikipedia / コトバンク / サントリー公式「赤玉の歴史」
#   竹鶴政孝 Wikipedia / 山崎蒸溜所 Wikipedia
#   JWIC「JW物語」/ ダイヤモンド「国産ウイスキー第1号の記憶」
# 確定事実:
#   鳥井信治郎 1879-1-30 生 / 1962-2-20 没（83歳）
#   1899 独立して店を構える。洋酒を日本人の口に合わせて作る
#   1906 店の名を寿屋洋酒店に改める
#   1907-4 赤玉ポートワインの販売を開始。これが事業拡大の土台になった
#   口ぐせ「やってみなはれ」。のちのサントリーの社是になる
#   1923 鳥井が竹鶴政孝を招き、山崎に日本初のモルトウイスキー蒸溜所を開く
#     竹鶴は初代工場長として、日本初の本格スコッチ式ウイスキー製造を指揮
#   ※竹鶴が適地と考えていたのは山崎ではなく北海道余市（冷涼・湿潤・水・空気）
#     鳥井は山崎を選んだ。**どちらが正しいとは言わせない**
#   1929 国産ウイスキー第1号「サントリー白札」発売。予想に反して売れなかった
#     スコッチ独特のスモーキーな香りが当時の日本人に不評だったとされる
#   1933-11 寿屋が鶴見工場の売却を発表。工場長の竹鶴に事前の連絡がなく、
#     竹鶴は寿屋に不信感を持つようになった
#   1934-3-1 竹鶴が寿屋を退職。理由は、後続の技師が育ったこと／
#     鳥井の長男・吉太郎への指導を終えたこと／最初の約束の十年が過ぎたこと
#   1934 竹鶴は北海道余市に大日本果汁株式会社を設立
#   1936 余市蒸溜所でウイスキーづくりを開始
#   ※白札の具体的な販売本数・返品率は裏が取れなかったので**数字を言わせない**
meta:
  title: "【国産ウイスキーの誕生】売れなかった一本と、出て行った男【ずんだもん解説】"
  slug: "torii-whisky"
  summary: "日本で初めてウイスキーを作った男は、スコットランド帰りの技師を破格で雇いました。ところが二人は、作る場所の意見が最初から違っていました。六年かけて出した国産第一号は、まったく売れません。やがて約束の十年が過ぎます。ずんだもんが鳥井信治郎を演じる再現ドラマです。"
  tags: ["サントリー", "鳥井信治郎", "竹鶴政孝", "ウイスキー", "山崎蒸溜所", "余市", "昭和史", "再現ドラマ", "ゆっくり", "ずんだもん", "企業史", "ミーム"]
  thumbnail:
    top: "売れなかった"
    bottom: "国産ウイスキーの誕生"
  mode: drama
  narrator: reimu
  mobs:
    - {id: taketsuru, label: "竹鶴政孝", voice: 13, pitch: 0.0, item: hat}
    - {id: banto, label: "寿屋の番頭", voice: 42, pitch: 0.0}
    - {id: shain, label: "寿屋の社員", voice: 12, pitch: 0.04}
    - {id: kyaku, label: "酒屋の主人", voice: 42, pitch: 0.04}
    - {id: nomi, label: "客", voice: 12, pitch: -0.04}
    - {id: kichitaro, label: "長男", voice: 12, pitch: 0.06}
