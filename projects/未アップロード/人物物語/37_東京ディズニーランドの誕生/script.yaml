# 東京ディズニーランド・再現ドラマ（[高橋政知|たかはしまさとも]・1913→2000）。投稿前に必ず目視レビュー。
# ★企業の一代記シリーズ8本目。**題材の認知は最大級なのに、人物はほぼ知られていない**。
#   ダイエー型の「知っているものの、知らない裏側」でいちばん差分が大きい題材
# ★配役: ずんだもん=高橋政知 / つむぎ=現代から見ている解説役 / ナレ=ゆっくり
# ★注意: ディズニーの作品名・キャラクター名は出さない（商標）。
#   「あの会社」「向こう」と呼び、記号も描かない。園の中身の描写もしない。
#   この動画で描くのは、**土地と交渉の話**であって、パークの中身ではない
# ★ミーム禁止の章: gyogyo（漁民の生活が変わる場面は軽口を減らす）
# 裏取り: 高橋政知Wikipedia
# 確定事実:
#   1913-9-4 福島県福島市 生 / 2000-1-31 没（86歳・東京都港区）
#   第一東京市立中学→山形高等学校(旧制)→東京帝国大学法学部 1939卒→理研重工業
#   1940 富士製紙専務・高橋貞三郎の娘 弘子と見合い結婚し高橋姓に改姓
#   戦後 富士石油販売の役員に招かれ、そこで三井不動産の江戸英雄と出会う。
#     江戸がオリエンタルランドを紹介した
#   1961 オリエンタルランド入社。浦安の漁業権交渉を開始
#     相手は気性の荒い漁師たち。浦安漁業組合は二つに分裂していた
#     漁民の家を直接訪問して次々にまとめ、料亭に実力者を招いて酒を交わしながら重ねた
#     常に相手の立場を尊重しながら対話を進めた
#   埋め立て: 当初申請 約330万m² → 約250万m²の払い下げ → 最終的に約380万m²を取得
#   1975年から交渉を始め、4年5か月かかった。1979-4-30 基本契約を締結
#   1978-8 社長に就任（第2代）/ 1988-6-25 会長へ
#   1983-4-15 東京ディズニーランド開園
#   本人の言葉:「金に糸目はつけず、本物を造る」
#     「目先のコストを惜しめば、貧弱なものしかできない」
#     浦安の土地に愛着が生まれ「ここに国民の幸福に寄与するものを作りたい」
meta:
  title: "【東京ディズニーランドの誕生】海だった場所を、20年かけて陸にした男【ずんだもん解説】"
  slug: "takahashi-urayasu"
  summary: "いま人が並んでいるあの場所は、もともと海でした。埋め立ての前に、そこで漁をしていた人たちがいます。交渉を任されたのは、法学部を出た会社員でした。二つに割れた漁業組合を相手に、彼は一軒ずつ家を訪ねます。開園までの20年を、ずんだもんが高橋政知を演じる再現ドラマでたどります。"
  tags: ["東京ディズニーランド", "高橋政知", "浦安", "オリエンタルランド", "埋め立て", "昭和史", "再現ドラマ", "ゆっくり", "ずんだもん", "企業史", "ミーム"]
  thumbnail:
    top: "ここは海だった"
    bottom: "東京ディズニーランドの誕生"
  mode: drama
  narrator: reimu
  mobs:
    - {id: edo, label: "江戸英雄", voice: 13, pitch: -0.06, item: hat}
    - {id: ryoshi, label: "漁師", voice: 13, pitch: -0.02}
    - {id: ryoshi2, label: "漁師", voice: 42, pitch: 0.0}
    - {id: kumiai, label: "組合の人", voice: 13, pitch: -0.1, item: hat}
    - {id: yakunin, label: "県の人", voice: 13, pitch: -0.08, item: hat}
    - {id: shain, label: "会社の人", voice: 12, pitch: 0.02}
    - {id: mukou, label: "向こうの担当", voice: 13, pitch: 0.04, item: hat}
scenes:
  - id: hook
    title: ""
    background: il_tdl_ima
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: zundamon
        emotion: happy
        text: "つむぎ、来月あそこに行くのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "おお、いいね。何時に出る？"
      - speaker: zundamon
        emotion: normal
        text: "始発だ。並ぶからな。"
      - speaker: tsumugi
        emotion: happy
        text: "気合い入ってる。"
      - speaker: zundamon
        emotion: thinking
        text: "……あそこ、なんであんなに広いのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "お、いい質問。"
      - speaker: zundamon
        emotion: normal
        text: "都心から近いのに、あれだけの土地が空いてたのはおかしいぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "空いてなかったよ。"
      - speaker: zundamon
        emotion: surprised
        text: "え。"
      - speaker: tsumugi
        emotion: normal
        text: "あそこ、もともと海なの。"
        telops:
          - {text: "あの場所は、海だった", size: xl, position: middle-center, color: "#FFF15A", stroke: "#0A1A2A", glow: "#7AA8FF", anim: up}
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "海！？"
      - speaker: tsumugi
        emotion: normal
        text: "うん。浅い海で、貝や海苔が獲れた。"
      - speaker: zundamon
        emotion: normal
        text: "……じゃあ、漁師がいたのだな。"
      - speaker: tsumugi
        emotion: normal
        text: "いた。だから、埋める前にやることがあったの。"
      - speaker: zundamon
        emotion: thinking
        text: "……その人たちに、海をやめてもらう。"
      - speaker: tsumugi
        emotion: normal
        text: "そう。[漁業権|ぎょぎょうけん]っていう権利を、手放してもらう交渉。"
      - speaker: zundamon
        emotion: angry
        text: "……無理だろ。仕事を捨てろという話じゃないか。"
      - speaker: tsumugi
        emotion: normal
        text: "しかもね、地元の組合が二つに割れてたの。"
      - speaker: zundamon
        emotion: surprised
        text: "割れてる相手と交渉！？ 二重に無理ゲーだぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。任されたのは、法学部を出た会社員。"
      - speaker: zundamon
        emotion: normal
        text: "……喧嘩慣れしてる人じゃないのだな。"
      - speaker: tsumugi
        emotion: normal
        text: "しない。その人がやったのは、一軒ずつ家に行くこと。"
      - speaker: zundamon
        emotion: surprised
        text: "……足で回ったのか。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。交渉を始めたのが1961年。開園は1983年。"
      - speaker: zundamon
        emotion: surprised
        text: "二十二年かかってるのだ！"
      - speaker: tsumugi
        emotion: normal
        text: "[高橋政知|たかはしまさとも]。名前、聞いたことある？"
      - speaker: zundamon
        emotion: normal
        text: "……無いのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "だよね。行った人はみんな知ってるのに、この人は知られてない。"
      - speaker: zundamon
        emotion: normal
        text: "……よし。ボク、その人をやるのだ。"

  - id: keireki
    title: "1913・法学部の男"
    background: il_tdl_office
    bgm: 10do
    stage:
      - {who: zundamon, x: 0.3, tag: "高橋", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: edo, x: 0.52}
    cuts:
      - speaker: reimu
        text: "1913年9月4日、福島市に生まれます。"
        reading: "せんきゅうひゃくじゅうさんねんくがつよっか、ふくしましにうまれます。"
      - speaker: reimu
        text: "東京帝国大学の法学部を1939年に卒業し、会社に入りました。"
        reading: "とうきょうていこくだいがくのほうがくぶをせんきゅうひゃくさんじゅうくねんにそつぎょうし、かいしゃにはいりました。"
      - speaker: zundamon
        emotion: normal
        text: "……ボクは、法律の人間なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "土地の[埋め立て|うめたて]も、遊園地も、専門じゃないんだよね。"
      - speaker: reimu
        text: "戦後、石油の販売会社に役員として招かれます。"
        reading: "せんご、せきゆのはんばいがいしゃにやくいんとしてまねかれます。"
      - speaker: reimu
        text: "そこで、三井不動産の[江戸英雄|えどひでお]と出会いました。"
        reading: "そこで、みついふどうさんのえどひでおとであいました。"
      - speaker: edo
        emotion: normal
        text: "高橋さん。ひとつ、面倒な話があるんですが。"
      - speaker: zundamon
        emotion: normal
        text: "……面倒、ですか。"
      - speaker: edo
        emotion: normal
        text: "千葉の[浦安|うらやす]沖を[埋め立て|うめたて]て、大きい土地を作る計画です。"
      - speaker: zundamon
        emotion: normal
        text: "……海を、埋める。"
      - speaker: edo
        emotion: sad
        text: "ええ。ただ、[漁業権|ぎょぎょうけん]の話が、まったく進んでいない。"
      - speaker: zundamon
        emotion: normal
        text: "……誰が、やっているんですか。"
      - speaker: edo
        emotion: sad
        text: "何人か行きました。全員、帰ってきました。"
      - speaker: zundamon
        emotion: surprised
        text: "……。"
      - speaker: tsumugi
        emotion: normal
        text: "門前払いどころか、追い返されてたの。"
      - speaker: edo
        emotion: normal
        text: "行ってもらえませんか。"
      - speaker: zundamon
        emotion: normal
        text: "……条件を、伺っても。"
      - speaker: edo
        emotion: normal
        text: "条件は、あなたが作ってください。"
      - speaker: zundamon
        emotion: thinking
        text: "……。"
      - speaker: reimu
        text: "1961年、彼はオリエンタルランドに入ります。"
        reading: "せんきゅうひゃくろくじゅういちねん、かれわおりえんたるらんどにはいります。"
      - speaker: tsumugi
        emotion: normal
        text: "四十七歳。ここから二十二年の話が始まるの。"

