      - speaker: yakunin
        emotion: normal
        text: "二百五十万ほどです。"
      - speaker: zundamon
        emotion: normal
        text: "……分かりました。まず、そこから。"
      - speaker: tsumugi
        emotion: normal
        text: "全部通そうとしないの。通る分から始める。"
      - speaker: zundamon
        emotion: normal
        text: "……ゼロで粘るより、[動く|うごく]分を動かすのだ。"
      - speaker: reimu
        text: "最終的には、およそ380万平方メートルを取得しています。"
        reading: "さいしゅうてきにわ、およそさんびゃくはちじゅうまんへいほうめーとるをしゅとくしています。"
      - speaker: zundamon
        emotion: surprised
        text: "……最初の申請より、増えているぞ。"
      - speaker: tsumugi
        emotion: happy
        text: "うん。一度で全部取るより、時間をかけたほうが多く取れた。"
      - speaker: zundamon
        emotion: thinking
        text: "……粘り勝ちなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "……で、陸ができた。ここでやっと本題。"
      - speaker: zundamon
        emotion: normal
        text: "……何を作るか、だな。"

  - id: nanika
    title: "何を作るのか"
    background: il_tdl_kaigi
    bgm: kinakusai
    stage:
      - {who: zundamon, x: 0.3, tag: "高橋", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: shain, x: 0.5}
      - {who: edo, x: 0.62}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "陸はできた。でも、まだ何を作るか決まってないの。"
      - speaker: zundamon
        emotion: normal
        text: "……広い土地が、そのまま空いているのだ。"
      - speaker: shain
        emotion: sad
        text: "社長。住宅にしては、という声も出ています。"
      - speaker: zundamon
        emotion: normal
        text: "……売れば、すぐ金にはなる。"
      - speaker: edo
        emotion: normal
        text: "早いのは、そちらです。"
      - speaker: zundamon
        emotion: normal
        text: "……売ってしまえば、それで終わりです。"
      - speaker: tsumugi
        emotion: normal
        text: "……漁師さんに[何て|なんて]言ったか、覚えてるからね。"
      - speaker: zundamon
        emotion: normal
        text: "人が来る場所を作る、と言ったのだ。"
      - speaker: shain
        emotion: normal
        text: "……遊園地、ですか。"
      - speaker: zundamon
        emotion: normal
        text: "普通の遊園地では、続かん。"
      - speaker: tsumugi
        emotion: normal
        text: "当時ね、日本の遊園地って何度も行く場所じゃなかったの。"
      - speaker: zundamon
        emotion: normal
        text: "……一度行けば、それで満足してしまう。"
      - speaker: zundamon
        emotion: angry
        text: "何度でも来たくなるものが要るのだ。"
      - speaker: edo
        emotion: thinking
        text: "……そんなものが、どこかにありますか。"
      - speaker: zundamon
        emotion: normal
        text: "……アメリカに、あります。"
      - speaker: shain
        emotion: surprised
        text: "……買えるんですか、そんなもの。"
      - speaker: zundamon
        emotion: normal
        text: "……買うのではなく、来てもらうんです。"
      - speaker: tsumugi
        emotion: surprised
        text: "……ここからが、もうひと山。"

  - id: koushou
    title: "1975・向こうとの交渉"
    background: il_tdl_kaigi
    bgm: kinakusai
    stage:
      - {who: zundamon, x: 0.3, tag: "高橋", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: mukou, x: 0.52}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "作りたいものは、アメリカにあったの。"
      - speaker: zundamon
        emotion: normal
        text: "……あの会社の遊園地か。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。当時、アメリカの外には無かった。"
      - speaker: zundamon
        emotion: surprised
        text: "……国外初なのか。"
      - speaker: mukou
        emotion: normal
        text: "……率直に申し上げます。難しい。"
      - speaker: zundamon
        emotion: normal
        text: "……理由を、伺っても。"
      - speaker: mukou
        emotion: normal
        text: "気候です。冬は寒く、夏は湿気が多い。"
      - speaker: mukou
        emotion: normal
        text: "それに、我々は海の外でやったことがありません。"
      - speaker: zundamon
        emotion: normal
        text: "……はい。"
      - speaker: tsumugi
        emotion: normal
        text: "しかも向こう、そもそも乗り気じゃなかったの。"
      - speaker: zundamon
        emotion: normal
        text: "……それでも、通う。"
      - speaker: reimu
        text: "交渉は1975年から始まり、4年5か月続きました。"
        reading: "こうしょうわせんきゅうひゃくななじゅうごねんからはじまり、よねんごかげつつづきました。"
        telops:
          - {text: "交渉に 4年5か月", size: xl, position: middle-center, color: "#FFFFFF", stroke: "#1A1A2A", glow: "#7AA8FF", anim: up}
      - speaker: zundamon
        emotion: surprised
        text: "……四年五か月。[漁業権|ぎょぎょうけん]のときと同じやり方だぞ。"
      - speaker: tsumugi
        emotion: happy
        text: "そう。何度も行って、相手の言い分を聞く。"
      - speaker: mukou
        emotion: thinking
        text: "……高橋さん。なぜ、そこまで。"
      - speaker: zundamon
        emotion: normal
        text: "……あの土地を、海から作りましたので。"
      - speaker: mukou
        emotion: surprised
        text: "……海から。"
      - speaker: zundamon
        emotion: normal
        text: "はい。漁をしていた人に、頭を下げて回りました。"
      - speaker: zundamon
        emotion: normal
        text: "中途半端なものは、作れません。"
      - speaker: reimu
        text: "1979年4月30日、基本契約が結ばれます。"
        reading: "せんきゅうひゃくななじゅうくねんしがつさんじゅうにち、きほんけいやくがむすばれます。"
      - speaker: tsumugi
        emotion: happy
        text: "海の外で、初めての一件。"

  - id: shacho
    title: "1978・社長になる"
    background: il_tdl_office
    bgm: serious
    stage:
      - {who: zundamon, x: 0.3, tag: "高橋", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: shain, x: 0.52}
    cuts:
      - speaker: reimu
        text: "1978年8月、彼はオリエンタルランドの社長になります。"
        reading: "せんきゅうひゃくななじゅうはちねんはちがつ、かれわおりえんたるらんどのしゃちょうになります。"
      - speaker: zundamon
        emotion: normal
        text: "……六十四歳だ。"
      - speaker: tsumugi
        emotion: normal
        text: "普通なら、そろそろ退く年でしょ。"
      - speaker: zundamon
        emotion: normal
        text: "……まだ、何も建っていないのだ。"
      - speaker: shain
        emotion: sad
        text: "社長。……借入の額が、相当なことになります。"
      - speaker: zundamon
        emotion: normal
        text: "……いくらだ。"
      - speaker: shain
        emotion: sad
        text: "会社が、傾く額です。"
      - speaker: zundamon
        emotion: normal
        text: "……傾く、で済むならいい。"
      - speaker: shain
        emotion: surprised
        text: "……。"
      - speaker: tsumugi
        emotion: thinking
        text: "……失敗したら、[埋め立て|うめたて]の借金だけが残るの。"
      - speaker: zundamon
        emotion: normal
        text: "……そのときは、私が責任を取る。"
      - speaker: zundamon
        emotion: normal
        text: "判を押してもらった相手の顔が、分かっているからな。"
      - speaker: tsumugi
        emotion: normal
        text: "……逃げられない立場に、自分で入っていったんだよね。"
      - speaker: zundamon
        emotion: normal
        text: "……最初から、逃げ場は無いのだ。"

  - id: honmono
    title: "本物を造る"
    background: il_tdl_kensetsu
    bgm: you_and_me
    stage:
      - {who: zundamon, x: 0.3, tag: "高橋", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: shain, x: 0.52}
    cuts:
      - speaker: shain
        emotion: sad
        text: "社長。……この仕様だと、費用が跳ね上がります。"
      - speaker: zundamon
        emotion: normal
        text: "……いくら違う。"
      - speaker: shain
        emotion: sad
        text: "桁が変わります。"
      - speaker: zundamon
        emotion: normal
        text: "……それでいい。"
      - speaker: shain
        emotion: surprised
        text: "よろしいんですか。"
      - speaker: zundamon
        emotion: normal
        text: "金に糸目はつけない。本物を造れ。"
        telops:
          - {text: "金に糸目はつけず、本物を造る", size: xl, position: middle-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
      - speaker: tsumugi
        emotion: surprised
        text: "……普通、社長は逆のことを言うよね。"
      - speaker: zundamon
        emotion: normal
        text: "……目先の金を惜しめば、貧弱なものしかできんのだ。"
      - speaker: shain
        emotion: thinking
        text: "……ですが、回収は。"
      - speaker: zundamon
        emotion: normal
        text: "安く作って、誰も来なかったら、回収もできん。"
      - speaker: tsumugi
        emotion: normal
        text: "……ここ、賭けなんだよね。"
      - speaker: zundamon
        emotion: normal
        text: "……二十年かけた土地だ。"
      - speaker: zundamon
        emotion: angry
        text: "安物を置くために、頭を下げて回ったんじゃない。"
      - speaker: tsumugi
        emotion: thinking
        text: "……漁師さんの顔が、ずっと残ってるんだと思う。"
      - speaker: reimu
        text: "1983年4月15日、開園しました。"
        reading: "せんきゅうひゃくはちじゅうさんねんしがつじゅうごにち、かいえんしました。"
        telops:
          - {text: "1983年4月15日 開園", size: xl, position: bottom-center, color: "#FFFFFF", stroke: "#1A1A2A", glow: "#7AA8FF", anim: up}
      - speaker: zundamon
        emotion: surprised
        text: "……交渉を始めてから、二十二年。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。海だった場所に、人が並んだ。"
      - speaker: shain
        emotion: happy
        text: "社長。……入り口に、列ができています。"
      - speaker: zundamon
        emotion: normal
        text: "……何人ほどだ。"
      - speaker: shain
        emotion: happy
        text: "……数えきれません。"
      - speaker: zundamon
        emotion: normal
        text: "……そうか。"
      - speaker: tsumugi
        emotion: thinking
        text: "……この人、開園の日に何を思ったんだろうね。"
      - speaker: zundamon
        emotion: normal
        text: "……あの人たちに、見せたいのだ。"
      - speaker: shain
        emotion: surprised
        text: "あの人たち、といいますと。"
      - speaker: zundamon
        emotion: normal
        text: "……判を押してくれた人たちだ。"
      - speaker: zundamon
        emotion: normal
        text: "海が無くなって、何ができたのかを。"
      - speaker: tsumugi
        emotion: normal
        text: "……「人が来る場所を作ります」って言ったもんね。"
      - speaker: zundamon
        emotion: normal
        text: "……二十二年前の約束だ。"
      - speaker: tsumugi
        emotion: happy
        text: "うん。ちゃんと来たね、人。"

  - id: shime
    title: ""
    background: il_tdl_ima
    bgm: 10do
    stage:
      - {who: zundamon, x: 0.3, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
    cuts:
      - speaker: reimu
        text: "彼は1988年に会長へ退き、2000年1月31日に亡くなりました。"
        reading: "かれわせんきゅうひゃくはちじゅうはちねんにかいちょうえしりぞき、にせんねんいちがつさんじゅういちにちになくなりました。"
      - speaker: zundamon
        emotion: normal
        text: "……つむぎ。"
      - speaker: tsumugi
        emotion: normal
        text: "ん。"
      - speaker: zundamon
        emotion: normal
        text: "ボク、来月あそこに行くのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "始発でね。"
      - speaker: zundamon
        emotion: thinking
        text: "……あの下は、海だったのだな。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。貝や海苔が獲れてた。"
      - speaker: zundamon
        emotion: normal
        text: "……その人たちが、判を押してくれたから並べるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "そこを、押し切らずにまとめた人がいたの。"
      - speaker: zundamon
        emotion: normal
        text: "……一軒ずつ、家に行った人だ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。組合が割れてたから、まとめて説得はできなかった。"
      - speaker: zundamon
        emotion: thinking
        text: "……近道が、無かったのだな。"
      - speaker: tsumugi
        emotion: happy
        text: "そう。二十二年、近道をしなかった人の話。"
      - speaker: zundamon
        emotion: normal
        text: "……並んでる時間が、急に短く思えてきたぞ。"
      - speaker: tsumugi
        emotion: happy
        text: "それは言い過ぎ。"
      - speaker: zundamon
        emotion: normal
        text: "この動画がよかったら、高評価とチャンネル登録をしてほしいのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "次に行くとき、足元が昔は海だったことだけ思い出してみて。"
      - speaker: zundamon
        emotion: happy
        duet_with: tsumugi
        text: "ご視聴、ありがとうございました！"
