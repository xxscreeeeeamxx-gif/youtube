      - speaker: tsumugi
        emotion: normal
        text: "社員は7500人。全員、職を失った。"
      - speaker: zundamon
        emotion: sad
        text: "……7500人。町ひとつじゃないか。"
      - speaker: tsumugi
        emotion: normal
        text: "その日、社長がテレビカメラの前に立ったの。"
      - speaker: zundamon
        emotion: thinking
        text: "……言い訳するのだな。床が悪いとか。"
      - speaker: tsumugi
        emotion: thinking
        text: "ううん。泣きながら、こう言った。"
      - speaker: tsumugi
