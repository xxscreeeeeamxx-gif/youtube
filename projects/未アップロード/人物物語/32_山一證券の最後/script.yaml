      - speaker: tsumugi
        emotion: thinking
        text: "……三十年、営業をやってきた人だから。"
      - speaker: zundamon
        emotion: normal
        text: "……頭を下げるのは、慣れてるのだ。"
      - speaker: tsumugi
        emotion: thinking
