      - speaker: zundamon
        emotion: surprised
        text: "……同じ月に、二つもか。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。もう、誰も誰かを助けられる状態じゃなかったの。"
      - speaker: zundamon
        emotion: normal
        text: "……三十二年前は、助けてもらったのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "覚えてたんだね。"
      - speaker: zundamon
        emotion: normal
        text: "入社二年目で、列を見てるからな。"
      - speaker: tsumugi
        emotion: thinking
