      - speaker: zundamon
        emotion: angry
        text: "……桁がおかしいのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "そしてこれ、社内でもごく一部しか知らなかった。"
      - speaker: zundamon
        emotion: surprised
        text: "……ごく一部。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。営業一筋で来た人は、知らない。"
      - speaker: zundamon
        emotion: sad
        text: "……嫌な予感がするのだ。"

