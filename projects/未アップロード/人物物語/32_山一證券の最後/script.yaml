        reading: "じゅういちがつじゅうくにち。おおくらしょうからのつうこくでした。"
      - speaker: tsumugi
        emotion: normal
        text: "「潰れる」じゃないの。「自分たちで畳んでくれ」なの。"
      - speaker: zundamon
        emotion: thinking
        text: "……違うのか。"
      - speaker: tsumugi
        emotion: normal
        text: "違う。倒産すると、お客さんの資産が凍る。"
      - speaker: zundamon
        emotion: surprised
        text: "……預けてるお金が、動かせなくなるのか。"
      - speaker: tsumugi
        emotion: normal
        text: "そう。自主廃業なら、返しながら閉じられる。"
      - speaker: zundamon
        emotion: normal
        text: "……客の[金|かね]は、守るのだな。"
      - speaker: tsumugi
        emotion: thinking
        text: "うん。守る。……社員の仕事は、守れない。"
      - speaker: zundamon
        emotion: sad
        text: "……。"

  - id: scoop
    title: "1997年11月22日・午前3時"
    background: il_yam_honsha_yoru
