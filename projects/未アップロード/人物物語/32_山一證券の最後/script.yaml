        text: "5月28日の午後11時30分、日本銀行が発表します。"
        reading: "ごがつにじゅうはちにちのごごじゅういちじさんじゅっぷん、にほんぎんこうがはっぴょうします。"
      - speaker: reimu
        text: "証券業界が必要とする資金は、無制限・無担保で融資する。"
        reading: "しょうけんぎょうかいがひつようとするしきんわ、むせいげん・むたんぽでゆうしする。"
        telops:
          - {text: "無制限・無担保で融資する", size: xl, position: middle-center, color: "#FFFFFF", stroke: "#0A1A2A", glow: "#7AA8FF", anim: up}
