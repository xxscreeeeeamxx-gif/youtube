      - speaker: shain
        emotion: surprised
        text: "社長！ 新聞に出てます！"
      - speaker: zundamon
        emotion: surprised
        text: "……もう、出たのか。"
      - speaker: shain
        emotion: sad
        text: "うちの会社が、無くなるって……本当ですか。"
      - speaker: zundamon
        emotion: sad
        text: "……。"

  - id: scoop2
    title: ""
