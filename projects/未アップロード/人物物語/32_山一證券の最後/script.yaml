  - id: rirekisho
    title: "その後"
    background: il_yam_machi
    bgm: warm
    stage:
      - {who: zundamon, x: 0.3, tag: "野澤", flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: reimu
        text: "会見の映像は、多くの人の心を動かしました。"
        reading: "かいけんのえいぞうわ、おおくのひとのこころをうごかしました。"
      - speaker: reimu
        text: "社長だけでなく、[山一|やまいち]の社員に同情が集まります。"
        reading: "しゃちょうだけでなく、やまいちのしゃいんにどうじょうがあつまります。"
      - speaker: reimu
        text: "そして、社員に対して多くの求人が寄せられました。"
        reading: "そして、しゃいんにたいしておおくのきゅうじんがよせられました。"
        telops:
          - {text: "社員に、求人が殺到した", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
      - speaker: zundamon
        emotion: surprised
        text: "……集まったのか。"
      - speaker: tsumugi
        emotion: happy
        text: "うん。「[山一|やまいち]の営業なら取りたい」って。"
      - speaker: zundamon
        emotion: normal
        text: "……あの会見が、効いたのだな。"
      - speaker: tsumugi
        emotion: normal
        text: "たぶんね。「この会社の社員は悪くない」って、社長が言い切ったから。"
      - speaker: zundamon
        emotion: thinking
        text: "……もし言い訳してたら。"
      - speaker: tsumugi
        emotion: thinking
        text: "……たぶん、みんなまとめて疑われてた。"
      - speaker: zundamon
        emotion: sad
        text: "……。"
      - speaker: reimu
        text: "[山一證券|やまいちしょうけん]の清算は、2005年1月の債権者集会をもって終わります。"
        reading: "やまいちしょうけんのせいさんわ、にせんごねんいちがつのさいけんしゃしゅうかいをもっておわります。"
      - speaker: reimu
        text: "同じ[年|とし]の2月、破産手続の終結が登記されました。"
        reading: "おなじとしのにがつ、はさんてつづきのしゅうけつがとうきされました。"
      - speaker: zundamon
        emotion: normal
        text: "……百年と、八年。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。畳むのにも、八年かかったの。"

  - id: shime
    title: ""
    background: il_yam_ima
    bgm: 10do
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: zundamon
        emotion: normal
        text: "……つむぎ。"
      - speaker: tsumugi
        emotion: normal
        text: "ん。"
      - speaker: zundamon
        emotion: normal
        text: "ボク、さっきコップを割ったとき、床のせいにしたのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "したね。重力も訴えてた。"
      - speaker: zundamon
        emotion: sad
        text: "……あれ、恥ずかしいのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "コップ一個だからね。あの人は、会社ひとつだった。"
      - speaker: zundamon
        emotion: normal
        text: "……しかも、自分で割ってないのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。割ったのは前の人たち。彼は片付けを引き継いだだけ。"
      - speaker: zundamon
        emotion: thinking
        text: "……なんで、逃げなかったのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "看板を持ってたから、じゃないかな。"
      - speaker: zundamon
        emotion: normal
        text: "……恩人の家紋を、掲げた会社の。"
      - speaker: tsumugi
        emotion: happy
        text: "うん。百年前から、そういう会社だったの。"
      - speaker: zundamon
        emotion: normal
        text: "……ボクも、次に何か割ったら。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。"
      - speaker: zundamon
        emotion: normal
        text: "床のせいにする前に、ほうきを取るのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "それ、けっこう難しいことだよ。"
      - speaker: zundamon
        emotion: happy
        text: "難しいから、覚えてる人がいるんだろ。"
      - speaker: tsumugi
        emotion: normal
        text: "……三十年経っても、あの映像は残ってるもんね。"
      - speaker: zundamon
        emotion: normal
        text: "この動画がよかったら、高評価とチャンネル登録をしてほしいのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "あなたの周りにも、黙って片付けてる人がいるかもしれないね。"
      - speaker: zundamon
