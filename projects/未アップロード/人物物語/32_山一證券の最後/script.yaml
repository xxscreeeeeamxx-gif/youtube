      - speaker: zundamon
        emotion: thinking
        text: "……山に、一。なんでその名前なのだ。"
      - speaker: reimu
        text: "[小池|こいけ]が最も尊敬していた[若尾逸平|わかおいっぺい]という人の家紋が、"
