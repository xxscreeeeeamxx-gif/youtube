      - speaker: okura
        emotion: normal
        text: "自主廃業を、選択していただきたい。"
        telops:
          - {text: "自主廃業を選択してもらいたい", size: xl, position: middle-center, color: "#FFFFFF", stroke: "#1A1A2A", glow: "#7AA8FF", anim: up}
