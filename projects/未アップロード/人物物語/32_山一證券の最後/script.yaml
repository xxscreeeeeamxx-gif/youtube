      - speaker: okura
        emotion: normal
        text: "はい。"
      - speaker: zundamon
        emotion: normal
        text: "……七千五百人、おります。"
      - speaker: okura
        emotion: sad
        text: "……承知しています。"
      - speaker: zundamon
        emotion: sad
        text: "……。"

  - id: tsukoku2
    title: ""
    background: il_yam_okurasho
