      - {who: tsumugi, x: 0.74}
      - {who: kyaku, x: 0.52}
    cuts:
      - speaker: reimu
        text: "1965年5月21日の朝刊に、[山一|やまいち]の経営悪化が載りました。"
        reading: "せんきゅうひゃくろくじゅうごねんごがつにじゅういちにちのちょうかんに、やまいちのけいえいあっかがのりました。"
      - speaker: zundamon
