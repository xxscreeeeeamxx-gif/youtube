      - speaker: reimu
        text: "山梨から出てきた[小池国三|こいけくにぞう]の、[小池国三|こいけくにぞう]商店です。"
        reading: "やまなしからでてきたこいけくにぞうの、こいけくにぞうしょうてんです。"
      - speaker: zundamon
        emotion: normal
