        emotion: sad
        text: "……野澤さん。数字は、見ました。"
      - speaker: zundamon
        emotion: normal
        text: "はい。"
      - speaker: ginko
        emotion: sad
        text: "うちだけでは、支えきれません。"
      - speaker: zundamon
        emotion: sad
        text: "……。"

  - id: ginko2
