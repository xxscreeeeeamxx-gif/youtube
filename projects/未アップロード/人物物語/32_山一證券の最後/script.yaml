# 山一證券・再現ドラマ（[野澤正平|のざわしょうへい]・1938〜）。投稿前に必ず目視レビュー。
# ★企業の一代記シリーズ3本目。ダイエー(失敗)・任天堂(成功)に続く「失敗側」。
#   ダイエーが1日86再生でチャンネル最高だったため、同じ型を続ける（2026-09-05）
# ★★★ 主人公は存命人物（1938-4-3生・2026年時点で88歳）★★★
#   SKILL.md「存命の人物を主人公にするときの線引き」に従う:
#     - 公表されている経歴と仕事の中身だけを描く
#     - 家族・私生活・内面の創作はしない（父が畳職人という経歴は公表情報なので
#       ナレで事実として述べるだけにし、父との会話は作らない）
#     - 会話は仕事上のやりとりに限る
#     - 本人が語ったと確認できない美談は書かない
#   簿外債務を作った前経営陣は「前の経営陣」とだけ呼び、個人名を出さない
#   （刑事責任を問われた人物を名指しで演じさせない。物語上も必要ない）
# ★配役: ずんだもん=野澤正平 / つむぎ=現代から見ている解説役 / ナレ=ゆっくり
# ★ミーム禁止の章: kokuhaku / tsukoku / kaiken / shain / rirekisho / sonogo
#   （告白から会見以降は一切入れない。人が職を失う場面に笑いを乗せない）
# 裏取り: 野澤正平Wikipedia / 山一證券Wikipedia / nippon.com「1997年の今日」/
#   日経「1997年11月24日 山一証券、自主廃業発表」/ テレ東BIZ「破綻から20年」
# 読み検査で見つけた実誤読（全部タグで修正済み・2026-09-05）:
#   金=キン ×2（預けた金 / 客の金）→ [金|かね] ※SKILL.md既知の系統
#   方=ホオ（社員の方には）→ [方|かた] ※「次の方=ツギノホオ」と同じ
#   は？=ワ（間投詞）→ [は|はぁ]
#   強いて=ツヨイテ → [強いて|しいて] ※一般語なので readings_common.yaml へ登録した
#   角=カク（通りの角）→ [角|かど] ※Sudachiだけが カド を出していた
#   年=ネン（同じ年の2月・ナレ）→ [年|とし]
#     ★ナレは reading: を見ない（voice.py:327 が is_aq のとき cut.reading を使わない）。
#       AquesTalkは漢字かな交じりの text を読むので、誤読はタグでしか直せない
# whisper照合の既知の偽陽性:
#   idx125「小池国三」…… タグ有り(カナ)は「恋結二堂」、タグ無し(漢字)は「小池区2号」と
#   書き起こされる。カナを直接渡している以上、音は定義上正しい。
#   whisperがゆっくり声の珍しい固有名詞を書き起こせないだけ（A/B合成で確認済み）
# 確定事実:
#   1938-4-3 長野県長野市川中島付近に生まれる。父は畳職人で農業も営んでいた
#   長野県屋代東高等学校を卒業後、3年間畑仕事に従事
#   その後、法政大学経済学部に入学し1964年卒業
#   1964-4 山一證券入社。「やったらやっただけ認めてくれる業種は証券しかない」と証券業を選択。
#     山一を選んだ理由は外資との結びつきが強かったため
#   歴代社長と違いエリート大学の出身ではなかった
#   1897 山梨県出身の小池国三が東京兜町に「小池国三商店」を創業。
#     社名は小池が最も尊敬する若尾逸平の家紋「山に一」から取った
#   1965-5-21 朝刊で経営悪化が報道され取り付け騒ぎ。
#     5-28 午後11時30分、日銀が「証券業界が必要とする資金は無制限・無担保で融資する」と発表。
#     特融は3行経由で、それぞれ80億円までと決められていた
#   バブル崩壊後、子会社のペーパーカンパニーへ貸し出しつつ買い戻す形で損失補填資金を流した。
#     外国債は山一オーストラリアへ買い戻す約束で売却（いわゆる「飛ばし」）
#   簿外債務は日本で1,583億円、世界で1,065億円。最大2,720億円の損失を隠していた
#   1997-8 前社長ら取締役11人が退任し、野澤が社長に昇格。簿外債務は就任後に初めて知った
#   1997-10-14 常務と前副社長が富士銀行を訪れ「飛ばし」の存在を明らかにした
#   1997-11-19 大蔵省が「自主廃業を選択してもらいたい」と通告
#   1997-11-22 午前3時頃、日本経済新聞が自主廃業を報じた
#   1997-11-24 午前11時30分、社長の野澤と会長が記者会見。
#     野澤は号泣しながら「私らが悪いんであって、社員は悪くありませんから」と述べた
#   約7,500人が職を失った
#   野澤は簿外債務に関与しておらず起訴されていない
#   廃業業務に追われながら、自ら社員の履歴書を持って求職活動をした
#   涙の会見が同情を呼び、社員に多数の求人が集まった
#   2005-1-26 の債権者集会をもって終了。同年2月に破産手続終結登記
meta:
  title: "【山一證券の最後】「社員は悪くありませんから」と泣いた社長【ずんだもん解説】"
  slug: "yamaichi-nozawa"
  summary: "1997年11月24日、ひとりの社長がテレビカメラの前で泣きました。畳職人の家に生まれ、高校を出て3年間畑を耕してから大学へ進んだ男が、59歳で100年企業の社長になります。その3か月後、彼は自分が知らなかった2600億円を突きつけられました。ずんだもんが野澤正平を演じる再現ドラマです。"
  tags: ["山一證券", "野澤正平", "1997年", "金融", "平成史", "経営", "再現ドラマ", "ゆっくり", "ずんだもん", "企業史", "ミーム"]
  thumbnail:
    top: "社員は悪くありませんから"
    bottom: "山一證券の最後"
  mode: drama
  narrator: reimu
  mobs:
    - {id: senpai, label: "先輩社員", voice: 13, pitch: -0.04, item: hat}
    - {id: kyaku, label: "お客", voice: 42, pitch: -0.02}
    - {id: koike, label: "小池国三", voice: 42, pitch: 0.02, item: mustache}
    - {id: joumu, label: "常務", voice: 13, pitch: -0.1, item: hat}
    - {id: fukusha, label: "前副社長", voice: 13, pitch: -0.06, item: hat}
    - {id: okura, label: "大蔵省の人", voice: 13, pitch: -0.08, item: hat}
    - {id: ginko, label: "銀行の人", voice: 13, pitch: -0.02, item: hat}
    - {id: kisha, label: "記者", voice: 12, pitch: 0.02}
