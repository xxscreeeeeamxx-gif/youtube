        text: "三十二年後に、同じことをお願いすることになるから。"
      - speaker: zundamon
        emotion: surprised
        text: "……えっ。"
      - speaker: tsumugi
        emotion: thinking
        text: "そのときは、断られる。"
      - speaker: zundamon
