      - speaker: zundamon
        emotion: normal
        text: "コップが落ちたのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "落ちた。……自分で落としたんじゃなくて？"
      - speaker: zundamon
        emotion: angry
        text: "ボクは悪くないぞ。置き場所が悪い。"
      - speaker: tsumugi
        emotion: thinking
        text: "その置き場所、昨日あなたが決めたよね。"
      - speaker: zundamon
        emotion: angry
        text: "昨日のボクと今日のボクは別人なのだ。"
      - speaker: tsumugi
        emotion: angry
        text: "出た。都合のいいときだけ別人。"
      - speaker: zundamon
        emotion: normal
        text: "[強いて|しいて]言えば、重力が悪い。"
      - speaker: tsumugi
        emotion: thinking
        text: "重力を訴えるの？"
      - speaker: zundamon
        emotion: happy
        text: "まあ、次から気をつけるのだ。ボクは反省できる子だぞ。"
      - speaker: tsumugi
        emotion: happy
        text: "えらいえらい。じゃあその皿、そーっと運んで。"
      - speaker: zundamon
        emotion: normal
        text: "任せろ。慎重に、丁寧に……"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "……あっ。"
      - speaker: tsumugi
        emotion: angry
        text: "学習しろ。"
      - speaker: zundamon
        emotion: angry
        text: "今のは床が悪い。傾いてる。"
      - speaker: tsumugi
        emotion: normal
        text: "……あのね。人って、なかなか自分のせいだって言えないの。"
      - speaker: zundamon
        emotion: thinking
        text: "うっ。"
      - speaker: tsumugi
        emotion: normal
        text: "コップ一個でこれだもん。もっと大きいものだったら、なおさら。"
      - speaker: zundamon
        emotion: normal
        text: "大きいものって、どのくらいなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "……会社。百年続いた、日本で四番目に大きい証券会社。"
      - speaker: zundamon
        emotion: surprised
        text: "スケールが飛びすぎだろ。"
      - speaker: tsumugi
        emotion: normal
        text: "1997年。その会社が、なくなったの。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "百年続いたのに！？"
