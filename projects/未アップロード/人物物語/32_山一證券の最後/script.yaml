      - speaker: reimu
        text: "貸し出しては買い戻す形で、損を埋める資金を流していきます。"
        reading: "かしだしてわかいもどすかたちで、そんをうめるしきんをながしていきます。"
      - speaker: reimu
        text: "外国の債券は、オーストラリアの子会社へ、買い戻す約束で売られました。"
