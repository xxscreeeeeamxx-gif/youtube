# スバル360・再現ドラマ（[百瀬晋六|ももせしんろく]・1919→1997）。投稿前に必ず目視レビュー。
# ★企業の一代記シリーズ6本目。戦闘機の技術者が、戦後に国民車を作る話。
#   「作れないはずのものを作った」型で、制約（軽自動車規格）が敵になる
# ★配役: ずんだもん=百瀬晋六 / つむぎ=現代から見ている解説役 / ナレ=ゆっくり
# ★ミーム禁止の章: haisen（敗戦・飛行機を取り上げられる場面）
# 裏取り: 百瀬晋六Wikipedia / スバル・360Wikipedia / COBBY「スバル360はてんとう虫と
#   呼ばれた国民車」/ CARPRIME「スバル360てんとう虫とはどんな車？」
# 確定事実:
#   1919-2-20 生 / 1997-1-21 没（77歳）。長野県塩尻市 出身
#   松本高等学校(旧制)→東京帝国大学工学部航空学科（1939入学・1941-12卒・原動機専攻）
#   1942-1 中島飛行機入社。偵察機「彩雲」用「誉」エンジンの改造に従事。
#     高高度用過給機の追加、ターボとインタークーラーの開発を1944年終戦まで担当
#   1949 日本初のモノコック構造リアエンジンバス「ふじ号」を開発
#   1954 すばる1500(コードネームP-1)を開発。モノコックボディ・前輪独立サスペンションの
#     画期的設計だったが、メインバンクの日本興業銀行が日産自動車の大株主だったため
#     設備投資の承認が得られず、試作のみで終了。数台は社用車やタクシーとして使用
#   1955〜 スバル360の開発を主導。1958 発売。1970年まで継続生産
#     大人4人が乗れるスペースを確保。価格 42万5000円。累計 約39万2000台
#     愛称「てんとう虫」（VWタイプ1=ビートル＝かぶと虫 に対して）
#   1961 スバル・サンバー / 1966 スバル1000（水平対向4気筒、D.O.Jを世界初実用化）
#   1966 自動車技術本部長 / 1968〜 取締役スバル技術本部長
#   本人の言葉:「図面に書く前にまず絵を描け。良い絵は必ず良い製品になる」
#   口癖:「技術に上下の差は無い」
#   逸話: 身長180cm台。自らモックアップに出入りしてダミーの代役をし、居住性を詰めた
#   ※車重は未確認なので数字を出さない
meta:
  title: "【スバル360の誕生】戦闘機のエンジン屋が、国民車を作るまで【ずんだもん解説】"
  slug: "momose-subaru360"
  summary: "飛行機を作れなくなった技術者たちがいました。彼らに与えられたのは、長さ3メートル・排気量360ccという厳しい枠です。その中に大人4人を乗せろと言われて、設計者は自分の体でモックアップに出入りしました。ずんだもんが百瀬晋六を演じる再現ドラマです。"
  tags: ["スバル360", "百瀬晋六", "てんとう虫", "軽自動車", "中島飛行機", "昭和史", "再現ドラマ", "ゆっくり", "ずんだもん", "企業史", "ミーム"]
  thumbnail:
    top: "作れないはずの車"
    bottom: "スバル360の誕生"
  mode: drama
  narrator: reimu
  mobs:
    - {id: joushi, label: "上司", voice: 13, pitch: -0.08, item: hat}
    - {id: gishi, label: "設計の技師", voice: 12, pitch: 0.02}
    - {id: gishif, label: "設計の技師", voice: 8, pitch: 0.06}
    - {id: ginko, label: "銀行の人", voice: 13, pitch: -0.04, item: hat}
    - {id: keiei, label: "経営陣", voice: 13, pitch: -0.02, item: hat}
    - {id: kyaku, label: "お客", voice: 42, pitch: 0.0}
scenes:
  - id: hook
    title: ""
    background: il_sub_ima
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: zundamon
        emotion: angry
        text: "つむぎ、この箱に四人入るのだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "どの箱。"
      - speaker: zundamon
        emotion: happy
        text: "この段ボールだ。ボクが計算した。"
      - speaker: tsumugi
        emotion: thinking
        text: "……計算って、面積だけ見てない？"
      - speaker: zundamon
        emotion: normal
        text: "見た。四人ぶんの面積はある。"
      - speaker: tsumugi
        emotion: angry
        text: "人は薄い板じゃないの。頭も膝もあるでしょ。"
      - speaker: zundamon
        emotion: thinking
        text: "……うっ。"
      - speaker: tsumugi
        emotion: happy
        text: "紙の上だと入るんだよね。実物だと入らない。"
      - speaker: zundamon
        emotion: angry
        text: "じゃあ、どうすればいいのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "自分で入ってみるしかないよ。"
      - speaker: zundamon
        emotion: surprised
        text: "……原始的すぎるだろ。"
      - speaker: tsumugi
        emotion: normal
        text: "でもね、それを本当にやった設計者がいるの。"
      - speaker: zundamon
        emotion: normal
        text: "誰なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "国民車を作った人。身長は百八十センチ台。"
      - speaker: zundamon
        emotion: surprised
        text: "でかいのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "うん。その人が自分でモックアップに出たり入ったりして、"
      - speaker: tsumugi
        emotion: happy
        text: "「これなら大人四人が座れる」を決めたの。"
      - speaker: zundamon
        emotion: normal
        text: "……なんでそんなに狭い車を作るのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "枠が決まってたから。当時の軽自動車の規格。"
      - speaker: reimu
        text: "長さも幅も排気量も、法律で上限が決められていました。"
        reading: "ながさもはばもはいきりょうも、ほうりつでじょうげんがきめられていました。"
      - speaker: zundamon
        emotion: normal
        text: "……その中に、大人四人。"
      - speaker: tsumugi
        emotion: normal
        text: "当時の常識では、無理。二人乗りがせいぜいと言われてた。"
      - speaker: zundamon
        emotion: angry
        text: "無理ゲーじゃないか。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。しかもこの人、もともと車の人じゃないの。"
      - speaker: zundamon
        emotion: surprised
        text: "また出たぞ、その展開。"
      - speaker: tsumugi
        emotion: normal
        text: "戦闘機のエンジンをやってた人。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "飛行機！？"
      - speaker: tsumugi
        emotion: normal
        text: "[百瀬晋六|ももせしんろく]。作った車は「てんとう虫」と呼ばれた。"
      - speaker: zundamon
        emotion: happy
        text: "かわいい名前なのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "うん。中身は、飛行機の理屈でできてる。"
      - speaker: zundamon
        emotion: normal
        text: "……よし。ボク、その人をやるのだ。"

  - id: nakajima
    title: "1942・中島飛行機"
    background: il_sub_hikoki
    bgm: serious
    stage:
      - {who: zundamon, x: 0.3, tag: "百瀬", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: joushi, x: 0.52}
    cuts:
      - speaker: reimu
        text: "[百瀬晋六|ももせしんろく]は1919年2月20日、長野県の[塩尻|しおじり]に生まれました。"
        reading: "ももせしんろくわせんきゅうひゃくじゅうくねんにがつはつか、ながのけんのしおじりにうまれました。"
      - speaker: reimu
        text: "東京帝国大学の航空学科で、原動機を専攻します。"
        reading: "とうきょうていこくだいがくのこうくうがっかで、げんどうきをせんこうします。"
      - speaker: zundamon
        emotion: normal
        text: "原動機。エンジンのことなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "そう。飛行機のエンジン屋さんになる進路。"
      - speaker: reimu
        text: "1942年1月、中島飛行機に入社します。"
        reading: "せんきゅうひゃくよんじゅうにねんいちがつ、なかじまひこうきににゅうしゃします。"
      - speaker: joushi
        emotion: normal
        text: "百瀬くん。担当は、偵察機のエンジンだ。"
      - speaker: zundamon
        emotion: normal
        text: "……高いところを飛ぶ機体ですね。"
      - speaker: joushi
        emotion: normal
        text: "そうだ。高く飛べば、撃たれにくい。"
      - speaker: zundamon
        emotion: thinking
        text: "ですが、高いところは空気が薄い。"
      - speaker: joushi
        emotion: normal
        text: "そこが君の仕事だ。"
      - speaker: tsumugi
        emotion: normal
        text: "……ここ、あとで効いてくるの。"
      - speaker: zundamon
        emotion: normal
        text: "空気が薄いと、燃やす分が足りないのだ。"
      - speaker: reimu
        text: "彼は、空気を押し込む装置と、その熱を冷ます装置を担当しました。"
        reading: "かれわ、くうきをおしこむそうちと、そのねつをさますそうちをたんとうしました。"
      - speaker: zundamon
        emotion: normal
        text: "押し込むと、空気は熱くなる。"
      - speaker: zundamon
        emotion: normal
        text: "熱いままだと薄いのと同じだから、冷ましてから入れるのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "……いま説明したの、いまの車のターボと同じ理屈だよ。"
      - speaker: zundamon
        emotion: surprised
        text: "八十年前の話だぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。飛行機のほうが先だったの。"
      - speaker: zundamon
        emotion: normal
        text: "……軽く作る、というのも飛行機の話だな。"
      - speaker: tsumugi
        emotion: normal
        text: "そこが一番大事。一グラムでも軽くしないと飛ばないから。"
      - speaker: joushi
        emotion: normal
        text: "百瀬くん。この機体は、逃げ切るための機体だ。"
      - speaker: zundamon
        emotion: normal
        text: "……戦うのではなく。"
      - speaker: joushi
        emotion: normal
        text: "写真を撮って、帰る。撃たれる前に離れる。"
      - speaker: zundamon
        emotion: normal
        text: "……速さと、高さだけが命ですね。"
      - speaker: tsumugi
        emotion: normal
        text: "ここも効いてくるの。「何を捨てるか」を最初に決める設計。"
      - speaker: zundamon
        emotion: normal
        text: "武装を積めば、そのぶん重くなる。"
      - speaker: zundamon
        emotion: normal
        text: "重くなれば、高く飛べない。"
      - speaker: gishi
        emotion: normal
        text: "……では、積まないと。"
      - speaker: zundamon
        emotion: normal
        text: "そうだ。全部を持てる機体は、無い。"
      - speaker: tsumugi
        emotion: happy
        text: "……これ、あとで軽自動車でそのまま言うことになるんだよね。"
      - speaker: zundamon
        emotion: normal
        text: "……何を捨てるか、か。"

  - id: haisen
    title: "1945・飛行機を作れない"
    background: il_sub_haikyo
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.3, tag: "百瀬", flip: true, emotion: thinking}
      - {who: tsumugi, x: 0.74, emotion: thinking}
      - {who: joushi, x: 0.52}
    cuts:
      - speaker: reimu
        text: "戦争が終わり、日本は航空機を作ることを禁じられます。"
        reading: "せんそうがおわり、にほんわこうくうきをつくることをきんじられます。"
      - speaker: joushi
        emotion: sad
        text: "……百瀬くん。飛行機は、もう作れない。"
      - speaker: zundamon
        emotion: sad
        text: "……。"
      - speaker: joushi
        emotion: sad
        text: "設計図も、設備も、残らないだろう。"
      - speaker: zundamon
        emotion: normal
        text: "……人は、残ります。"
      - speaker: joushi
        emotion: surprised
        text: "……。"
      - speaker: zundamon
        emotion: normal
        text: "薄い空気で力を出す方法も、軽く作る方法も。"
      - speaker: zundamon
        emotion: normal
        text: "全部、頭の中にあります。"
      - speaker: tsumugi
        emotion: thinking
        text: "……この人たち、行き場を失ったんだよね。"
      - speaker: zundamon
        emotion: normal
        text: "……次は、何を作るんですか。"
      - speaker: joushi
        emotion: normal
        text: "……鍋。それから、自転車。"
      - speaker: zundamon
        emotion: sad
        text: "……鍋。"
      - speaker: tsumugi
        emotion: thinking
        text: "実際、そういう時代なの。作れるものを作るしかなかった。"
      - speaker: reimu
        text: "やがて彼は、バスの車体を任されます。"
        reading: "やがてかれわ、ばすのしゃたいをまかされます。"
      - speaker: zundamon
        emotion: normal
        text: "……バス。"
      - speaker: zundamon
        emotion: normal
        text: "……バス。人を、運ぶのですね。"
      - speaker: joushi
        emotion: normal
        text: "そうだ。空は飛べんが、地面は走れる。"
      - speaker: zundamon
        emotion: normal
        text: "……失礼を承知で言いますが。"
      - speaker: joushi
        emotion: normal
        text: "なんだ。"
      - speaker: zundamon
        emotion: normal
        text: "飛行機とバスは、そんなに遠くありません。"
      - speaker: joushi
        emotion: surprised
        text: "……遠く、ない。"
      - speaker: zundamon
        emotion: normal
        text: "どちらも、人を乗せて、軽く、丈夫に作る箱です。"
      - speaker: tsumugi
        emotion: thinking
        text: "……この言い方ができる人は、たぶん強いよね。"
      - speaker: zundamon
        emotion: normal
        text: "扱う空気の速さが違うだけなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "1949年。日本で初めての、あの構造のバス。"

  - id: fujigo
    title: "1949・ふじ号"
    background: il_sub_bus
    bgm: you_and_me
    stage:
      - {who: zundamon, x: 0.3, tag: "百瀬", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: gishi, x: 0.52}
    cuts:
      - speaker: gishi
        emotion: normal
        text: "バスは、丈夫な骨組みの上に箱を載せて作ります。"
      - speaker: zundamon
        emotion: normal
        text: "……骨と、皮が別なんですね。"
      - speaker: gishi
        emotion: normal
        text: "はい。骨が強度を持ちます。"
      - speaker: zundamon
        emotion: thinking
        text: "……重いでしょう。"
      - speaker: gishi
        emotion: surprised
        text: "それは、そうですが。"
      - speaker: zundamon
        emotion: normal
        text: "飛行機に、骨組みだけの機体はありません。"
      - speaker: gishi
        emotion: surprised
        text: "……といいますと。"
      - speaker: reimu
        text: "飛行機は、外側の板そのものに力を持たせて軽くします。"
        reading: "ひこうきわ、そとがわのいたそのものにちからをもたせてかるくします。"
      - speaker: zundamon
        emotion: normal
        text: "皮を厚くして、骨を減らすのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "これがモノコック。卵の殻みたいに、外側で支える作り方。"
      - speaker: zundamon
        emotion: happy
        text: "卵は、骨が入ってないのに握っても割れないぞ。"
      - speaker: tsumugi
        emotion: happy
        text: "そう。形そのものが強度なの。"
      - speaker: gishi
        emotion: thinking
        text: "……バスで、それをやるんですか。"
      - speaker: zundamon
        emotion: normal
        text: "やります。軽くなれば、同じ力でよく走る。"
      - speaker: reimu
        text: "1949年、日本初のモノコック構造のリアエンジンバスができました。"
        reading: "せんきゅうひゃくよんじゅうくねん、にほんはつのものこっくこうぞうのりああえんじんばすができました。"
        telops:
          - {text: "日本初のモノコックバス", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
      - speaker: zundamon
        emotion: happy
        text: "飛行機の理屈が、そのまま使えたのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "……で、次に「車をやろう」って話になるの。"

  - id: p1
    title: "1954・幻の1500"
    background: il_sub_kaigi
    bgm: kinakusai
    stage:
      - {who: zundamon, x: 0.3, tag: "百瀬", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: ginko, x: 0.5}
      - {who: keiei, x: 0.62}
    cuts:
      - speaker: reimu
        text: "1954年、自動車に進出するための試作車ができます。"
        reading: "せんきゅうひゃくごじゅうよねん、じどうしゃにしんしゅつするためのしさくしゃができます。"
      - speaker: zundamon
        emotion: happy
        text: "モノコックで、前輪は独立させました。"
      - speaker: keiei
        emotion: surprised
        text: "……独立、といいますと。"
      - speaker: zundamon
        emotion: normal
        text: "左右の車輪が、別々に動きます。"
      - speaker: zundamon
        emotion: normal
        text: "片側が石を踏んでも、反対側が跳ねません。"
      - speaker: keiei
        emotion: happy
        text: "……乗り心地が、まるで違う。"
      - speaker: tsumugi
        emotion: normal
        text: "1954年でこれ。当時としては、かなり進んでるの。"
      - speaker: zundamon
        emotion: happy
        text: "作りましょう。"
      - speaker: ginko
        emotion: normal
        text: "……その設備投資は、承認できません。"
      - speaker: zundamon
        emotion: surprised
        text: "……理由を、伺っても。"
      - speaker: ginko
        emotion: normal
        text: "……お答えできません。"
      - speaker: tsumugi
        emotion: normal
        text: "銀行側の事情なの。"
      - speaker: reimu
        text: "メインバンクは、別の自動車会社の大株主でもありました。"
        reading: "めいんばんくわ、べつのじどうしゃがいしゃのおおかぶぬしでもありました。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "……車の出来と、関係ないところで落ちたのか。"
      - speaker: tsumugi
        emotion: thinking
        text: "うん。技術は問題なかった。"
      - speaker: reimu
        text: "試作だけで終わり、数台が社用車やタクシーとして使われました。"
        reading: "しさくだけでおわり、すうだいがしゃようしゃやたくしいとしてつかわれました。"
      - speaker: zundamon
        emotion: sad
        text: "……数台。"
      - speaker: tsumugi
        emotion: thinking
        text: "……悔しいよね。"
      - speaker: zundamon
        emotion: normal
        text: "……大きい車は、金がかかるのだ。"
      - speaker: gishi
        emotion: sad
        text: "……部長。あの車、社用車になるそうです。"
      - speaker: zundamon
        emotion: normal
        text: "……走らせてもらえるだけ、ましだ。"
      - speaker: gishi
        emotion: sad
        text: "タクシーにも回るとか。"
      - speaker: zundamon
        emotion: thinking
        text: "……乗った人は、どう言っている。"
      - speaker: gishi
        emotion: happy
        text: "……よく走る、と。"
      - speaker: zundamon
        emotion: sad
        text: "……そうか。"
      - speaker: tsumugi
        emotion: thinking
        text: "……いちばん効くやつだよね、それ。"
      - speaker: zundamon
        emotion: normal
        text: "設計は、悪くなかったのだ。"
      - speaker: zundamon
        emotion: normal
        text: "……止まったのは、金の話だ。"
      - speaker: gishif
        emotion: sad
        text: "では、どうにもなりません。"
      - speaker: zundamon
        emotion: normal
        text: "……いや。金の話なら、金がかからない車を作ればいい。"
      - speaker: gishi
        emotion: surprised
        text: "……といいますと。"
      - speaker: zundamon
        emotion: thinking
        text: "……大きい車は、金がかかるのだ。"
      - speaker: zundamon
