      - speaker: zundamon
        emotion: normal
        text: "……人は、削れない。"
      - speaker: gishif
        emotion: normal
        text: "では、エンジンを後ろに。"
      - speaker: zundamon
        emotion: normal
        text: "そうだ。前に置くと、そのぶん膝が入らない。"
      - speaker: tsumugi
        emotion: normal
        text: "後ろに追いやると、前が丸ごと人の場所になるの。"
      - speaker: zundamon
        emotion: normal
        text: "次に、骨だ。"
      - speaker: gishi
        emotion: surprised
        text: "……バスと、同じですか。"
      - speaker: zundamon
        emotion: happy
        text: "同じだ。外側の板で支える。"
      - speaker: zundamon
        emotion: normal
        text: "骨を抜けば、その厚みぶん、内側が広くなる。"
      - speaker: gishif
        emotion: surprised
        text: "……壁が薄くなるということですね。"
      - speaker: zundamon
        emotion: normal
        text: "そうだ。軽くもなる。一石二鳥だ。"
      - speaker: tsumugi
        emotion: normal
        text: "飛行機で当たり前だったことが、車ではまだ当たり前じゃなかったの。"
      - speaker: zundamon
        emotion: normal
        text: "……屋根も、削る。"
      - speaker: gishi
        emotion: surprised
        text: "屋根を、ですか。"
      - speaker: zundamon
        emotion: normal
        text: "布にする。軽いし、そのぶん頭上が稼げる。"
      - speaker: tsumugi
        emotion: happy
        text: "一ミリ単位で削っていくんだよね。"
      - speaker: gishi
        emotion: sad
        text: "……ですが部長。これだけ削ると、荷物が積めません。"
      - speaker: zundamon
        emotion: normal
        text: "積まなくていい。"
      - speaker: gishi
        emotion: surprised
        text: "……いいんですか。"
      - speaker: zundamon
        emotion: normal
        text: "この車で運ぶのは、荷物じゃない。人だ。"
      - speaker: tsumugi
        emotion: normal
        text: "全部を持てる箱は無い、ってさっき言ってたもんね。"
      - speaker: zundamon
        emotion: normal
        text: "速さも要らない。長距離も要らない。"
      - speaker: gishif
        emotion: surprised
        text: "……ずいぶん、捨てますね。"
      - speaker: zundamon
        emotion: angry
        text: "捨てないと、四人が乗らないのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "……ここ、宅急便の人と同じこと言ってるの、面白いよね。"
      - speaker: zundamon
        emotion: normal
        text: "……絞り込め、ということか。"
      - speaker: gishi
        emotion: normal
        text: "エンジンは、どこまで小さくしますか。"
      - speaker: zundamon
        emotion: normal
        text: "枠の上限まで使う。小さくする理由が無い。"
      - speaker: gishi
        emotion: thinking
        text: "……上限、いっぱいに。"
      - speaker: zundamon
        emotion: normal
        text: "決められた枠は、いっぱいまで使うものだ。"

  - id: mockup
