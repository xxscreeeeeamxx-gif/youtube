    cuts:
      - speaker: reimu
        text: "1958年、スバル360が発売されました。"
        reading: "せんきゅうひゃくごじゅうはちねん、すばるさんびゃくろくじゅうがはつばいされました。"
      - speaker: reimu
        text: "価格は42万5000円です。"
        reading: "かかくわよんじゅうにまんごせんえんです。"
