  - id: sonogo
    title: "その後"
    background: il_sub_kojo
    bgm: warm
    stage:
      - {who: zundamon, x: 0.3, tag: "百瀬", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: gishi, x: 0.52}
    cuts:
      - speaker: reimu
        text: "1961年には軽トラック、1966年にはスバル1000が出ます。"
        reading: "せんきゅうひゃくろくじゅういちねんにわけいとらっく、せんきゅうひゃくろくじゅうろくねんにわすばるせんがでます。"
      - speaker: tsumugi
        emotion: normal
        text: "スバル1000でね、世界で初めて実用化した部品があるの。"
      - speaker: zundamon
        emotion: normal
        text: "何なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "前輪で駆動すると、ハンドルを切ったとき軸に無理がかかるでしょ。"
      - speaker: zundamon
        emotion: normal
        text: "……曲がりながら、回さないといけないのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "その継ぎ手を、なめらかに回るように作り直した。"
      - speaker: gishi
        emotion: happy
        text: "おかげで、前輪駆動の弱点がかなり消えました。"
      - speaker: zundamon
        emotion: normal
        text: "……前で駆動できると、後ろの場所が空く。"
      - speaker: tsumugi
        emotion: happy
        text: "そう。また広くなるんだよね。ずっと同じことをやってる。"
      - speaker: zundamon
        emotion: normal
        text: "……軽く作って、場所を稼ぐ。"
      - speaker: reimu
        text: "彼は1966年に技術本部長、1968年からは取締役になりました。"
        reading: "かれわせんきゅうひゃくろくじゅうろくねんにぎじゅつほんぶちょう、せんきゅうひゃくろくじゅうはちねんからわとりしまりやくになりました。"
      - speaker: tsumugi
        emotion: normal
        text: "口癖があってね。「技術に上下の差は無い」。"
      - speaker: zundamon
        emotion: normal
        text: "……上下の差。"
      - speaker: tsumugi
        emotion: normal
        text: "飛行機が上で、軽自動車が下、みたいな見方をしなかったの。"
      - speaker: zundamon
        emotion: normal
        text: "……鍋を作れと言われた時期があるからかもしれないぞ。"
      - speaker: tsumugi
        emotion: thinking
        text: "……かもね。"
      - speaker: reimu
        text: "[百瀬晋六|ももせしんろく]は、1997年1月21日に亡くなりました。"
        reading: "ももせしんろくわ、せんきゅうひゃくきゅうじゅうななねんいちがつにじゅういちにちになくなりました。"

