      - speaker: zundamon
        emotion: happy
        text: "かわいいのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "ドイツの大衆車が「かぶと虫」って呼ばれてたから、その並びね。"
      - speaker: reimu
        text: "生産は1970年まで続き、およそ39万2000台が作られました。"
        reading: "せいさんわせんきゅうひゃくななじゅうねんまでつづき、およそさんじゅうきゅうまんにせんだいがつくられました。"
      - speaker: zundamon
        emotion: surprised
        text: "……四十万台近く。"
      - speaker: tsumugi
        emotion: normal
