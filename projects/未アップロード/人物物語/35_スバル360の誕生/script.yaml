        emotion: happy
        text: "どうぞ、乗ってみてください。"
      - speaker: kyaku
        emotion: surprised
        text: "……おお。膝が当たらん。"
      - speaker: kyaku
        emotion: happy
        text: "後ろも、大人が座れる。"
      - speaker: zundamon
        emotion: happy
        text: "そこは、何度も出たり入ったりしましたので。"
      - speaker: kyaku
        emotion: thinking
        text: "……丸いね。"
