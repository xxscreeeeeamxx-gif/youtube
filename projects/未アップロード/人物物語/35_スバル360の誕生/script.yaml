  - id: hatsubai
    title: "1958・てんとう虫"
    background: il_sub_machi
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, tag: "百瀬", flip: true, emotion: happy}
      - {who: tsumugi, x: 0.74, emotion: normal}
