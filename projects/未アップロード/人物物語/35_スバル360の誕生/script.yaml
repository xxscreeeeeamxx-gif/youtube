      - speaker: zundamon
        emotion: happy
        text: "……四人、ですか。"
      - speaker: tsumugi
        emotion: happy
        text: "その「ちょうど四人」のために、何十回も出入りしたんだよね。"
      - speaker: zundamon
        emotion: normal
        text: "……はい。"
      - speaker: tsumugi
        emotion: normal
        text: "当時ね、車は一部の人のものだったの。"
      - speaker: zundamon
        emotion: normal
        text: "……高いですからね。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。それが、家族で買えるところまで降りてきた。"
      - speaker: zundamon
        emotion: normal
        text: "……値段も、枠のうちなのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "そこも設計だよね。"

