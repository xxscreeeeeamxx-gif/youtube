      - speaker: zundamon
        emotion: normal
        text: "壊れる場所が分かる。それでいい。"
      - speaker: tsumugi
        emotion: normal
        text: "……ロータリーの人と、同じこと言ってるね。"
      - speaker: zundamon
        emotion: normal
        text: "壊さんと、どこが弱いか分からんのだ。"

