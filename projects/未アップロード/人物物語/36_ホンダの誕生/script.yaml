      - speaker: shain
        emotion: normal
        text: "社長。この者、学校を出ておりませんが。"
      - speaker: zundamon
        emotion: angry
        text: "手を見せろ。"
      - speaker: shainf
        emotion: surprised
        text: "……手、ですか。"
      - speaker: zundamon
        emotion: normal
        text: "何を触ってきたかは、手に出る。"
      - speaker: tsumugi
        emotion: happy
        text: "……鍛冶屋の子だからね。"
      - speaker: zundamon
        emotion: normal
        text: "図面が読めなくても、直せる人間はいるのだ。"
      - speaker: shain
        emotion: thinking
        text: "……逆に、学校を出ていても。"
      - speaker: zundamon
        emotion: normal
        text: "壊せん人間は、いる。"
      - speaker: tsumugi
        emotion: surprised
        text: "壊すの前提なんだ。"
      - speaker: zundamon
        emotion: happy
        text: "壊さん奴は、[直せん|なおせん]ぞ。"

  - id: taijin
    title: "1973・辞める"
    background: il_hon_shachoshitsu
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.3, tag: "本田", flip: true, emotion: thinking}
      - {who: tsumugi, x: 0.74, emotion: thinking}
      - {who: fujisawa, x: 0.5}
      - {who: shain, x: 0.62}
    cuts:
      - speaker: tsumugi
        emotion: thinking
        text: "……そして、この会社のいちばん有名な話が来るの。"
      - speaker: zundamon
        emotion: normal
        text: "何がだ。"
      - speaker: tsumugi
        emotion: normal
        text: "辞め方。"
      - speaker: reimu
        text: "1970年代、排気ガスの規制が厳しくなり、技術の中身が変わっていきます。"
        reading: "せんきゅうひゃくななじゅうねんだい、はいきがすのきせいがきびしくなり、ぎじゅつのなかみがかわっていきます。"
      - speaker: zundamon
        emotion: angry
        text: "……ここは、こう直せばいい。"
      - speaker: shain
        emotion: sad
        text: "社長。……そのやり方では、もう通りません。"
      - speaker: zundamon
        emotion: surprised
        text: "……。"
      - speaker: tsumugi
        emotion: thinking
        text: "手で分かる範囲を、技術が超えていったの。"
      - speaker: fujisawa
        emotion: normal
        text: "本田さん。ひとつ、伺います。"
      - speaker: zundamon
        emotion: normal
        text: "……言え。"
      - speaker: fujisawa
        emotion: normal
        text: "あなたは社長なのか、技術者なのか。"
        telops:
          - {text: "あなたは社長なのか、技術者なのか", size: xl, position: middle-center, color: "#FFFFFF", stroke: "#1A1A2A", glow: "#7AA8FF", anim: up}
      - speaker: zundamon
        emotion: surprised
        text: "……。"
      - speaker: tsumugi
        emotion: thinking
        text: "……二十四年、経営を全部引き受けてきた人の質問だからね。"
      - speaker: zundamon
        emotion: normal
        text: "……技術者だ。"
      - speaker: fujisawa
        emotion: normal
        text: "……では、社長の椅子は要りませんね。"
      - speaker: zundamon
        emotion: normal
        text: "……要らん。"
      - speaker: reimu
        text: "1973年、彼は社長を退きます。"
        reading: "せんきゅうひゃくななじゅうさんねん、かれわしゃちょうをしりぞきます。"
      - speaker: zundamon
        emotion: normal
        text: "……藤沢。あんたも辞めるのか。"
      - speaker: fujisawa
        emotion: happy
        text: "はい。二人で始めたので。"
      - speaker: zundamon
        emotion: happy
        text: "……律儀な男だ。"
      - speaker: tsumugi
        emotion: normal
        text: "同じ時に、二人とも退いたの。"
      - speaker: zundamon
        emotion: normal
        text: "……六十六歳。まだ手は動くぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。でも、会社に必要な手はもう別の形になってた。"
      - speaker: zundamon
        emotion: normal
        text: "……居座らんのが、最後の仕事なのだ。"

