      - speaker: tsumugi
        emotion: normal
        text: "この人の会社ね、採用のときに変わった方針があったの。"
      - speaker: zundamon
        emotion: normal
        text: "何なのだ。"
      - speaker: reimu
        text: "彼は後年、こう語っています。"
        reading: "かれわこうねん、こうかたっています。"
      - speaker: reimu
        text: "人種や家柄や学歴で人を判断することを、徹底してやらなかった、と。"
        reading: "じんしゅやいえがらやがくれきでひとをはんだんすることを、てっていしてやらなかった、と。"
