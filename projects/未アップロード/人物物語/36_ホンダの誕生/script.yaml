      - speaker: zundamon
        emotion: happy
        text: "……まず、何をやるか決めるところからだな。"
      - speaker: tsumugi
        emotion: happy
        text: "そこからか。"
      - speaker: zundamon
        emotion: normal
        text: "この動画がよかったら、高評価とチャンネル登録をしてほしいのだ。"
