      - speaker: zundamon
        emotion: surprised
        text: "……五年もかかったのか。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。宣言してすぐ出られたわけじゃないの。"
      - speaker: rider
        emotion: surprised
        text: "……相手のバイク、速いです。"
      - speaker: zundamon
        emotion: normal
