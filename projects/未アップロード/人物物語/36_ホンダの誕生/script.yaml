  - id: sengen
    title: "1954・宣言"
    background: il_hon_kojo
    bgm: serious
    stage:
      - {who: zundamon, x: 0.3, tag: "本田", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: shain, x: 0.5}
      - {who: shainf, x: 0.62}
    cuts:
      - speaker: reimu
        text: "1954年3月、彼は社内報にある文章を載せます。"
        reading: "せんきゅうひゃくごじゅうよねんさんがつ、かれわしゃないほうにあるぶんしょうをのせます。"
      - speaker: zundamon
        emotion: normal
        text: "[マン島|まんとう]のTTレースに出る。"
      - speaker: shain
        emotion: surprised
        text: "……[マン島|まんとう]、ですか。"
      - speaker: tsumugi
        emotion: normal
        text: "イギリスの島でやる、当時いちばん格の高いバイクのレース。"
      - speaker: shainf
        emotion: sad
        text: "……日本の会社は、まだ一社も出ていません。"
      - speaker: zundamon
        emotion: normal
        text: "知っている。"
      - speaker: shain
        emotion: surprised
        text: "出場、されるんですか。"
      - speaker: zundamon
        emotion: normal
        text: "いや。"
      - speaker: zundamon
        emotion: angry
        se: don
        text: "優勝する、と書く。"
        telops:
          - {text: "出場ではなく、優勝すると書いた", size: xl, position: middle-center, color: "#FFF15A", stroke: "#2A0A0A", glow: "#E85A4A", anim: up}
      - speaker: shainf
        emotion: surprised
        text: "……ゆ、優勝。"
      - speaker: tsumugi
        emotion: surprised
        text: "……ここ、けっこうすごいところだからね。"
      - speaker: zundamon
        emotion: normal
        text: "何がだ。"
      - speaker: tsumugi
        emotion: normal
        text: "「頑張ります」じゃなくて「勝ちます」って先に言ったの。"
      - speaker: zundamon
        emotion: normal
        text: "……逃げられなくするためだ。"
      - speaker: shain
        emotion: sad
        text: "……できなかったら、恥をかきます。"
      - speaker: zundamon
        emotion: normal
        text: "そうだ。だから、やる。"
      - speaker: zundamon
        emotion: normal
        text: "やってみもせんで、何が分かる。"
        telops:
          - {text: "やってみもせんで、何がわかる", size: xl, position: bottom-center, color: "#FFFFFF", stroke: "#1A1A2A", glow: "#7AA8FF", anim: up}
      - speaker: tsumugi
        emotion: normal
        text: "この人の、いちばん有名な言葉。"
      - speaker: zundamon
        emotion: normal
        text: "……できない理由は、やった人にしか分からんのだ。"
      - speaker: shainf
        emotion: normal
        text: "……では、何から始めますか。"
      - speaker: zundamon
        emotion: normal
        text: "まず、見に行く。話はそれからだ。"

  - id: manto
    title: "1959・初出場"
    background: il_hon_circuit
