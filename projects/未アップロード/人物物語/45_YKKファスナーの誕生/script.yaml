scenes:
- id: hook
  title: ''
  background: yk_ima
  bgm: shuffle_shuffle
  stage:
  - who: zundamon
    x: 0.3
    flip: true
    emotion: normal
  - who: tsumugi
    x: 0.74
    emotion: normal
  cuts:
  - speaker: zundamon
    emotion: thinking
    text: つむぎ。ズボンに知らない三文字が書いてあるのだ。
  - speaker: tsumugi
    emotion: normal
    text: ファスナーのつまみのところでしょ。
  - speaker: zundamon
    emotion: surprised
    text: エヌ、じゃなくて、ワイ、ケイ、ケイ。
  - speaker: tsumugi
    emotion: happy
    text: 読めてるじゃない。
  - speaker: zundamon
    emotion: thinking
    text: 誰かがボクのズボンに落書きしたのだ。
  - speaker: tsumugi
    emotion: angry
    text: 最初から付いてるの。作った会社の名前よ。
  - speaker: zundamon
    emotion: surprised
    text: 会社の名前。じゃあ何の略なのだ。
  - speaker: tsumugi
    emotion: thinking
    text: ……それ、答えると先が長くなるんだけど。
  - speaker: zundamon
    emotion: happy
    text: いいのだ。ボクは今日ひまだぞ。
  - speaker: tsumugi
    emotion: normal
    text: じゃあ、上着のファスナーも見てみて。
  - speaker: zundamon
    emotion: surprised
    text: ……同じ三文字なのだ。
  - speaker: tsumugi
    emotion: normal
    text: カバンは。
  - speaker: zundamon
    emotion: surprised
    text: 同じ。
  - speaker: zundamon
    emotion: angry
    text: 全部同じところが作ってるのか。手抜きなのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 逆よ。よそが真似できなかったの。
  - speaker: zundamon
    emotion: normal
    text: ファスナーなんて、誰が作っても同じだと思うのだ。
  - speaker: tsumugi
    emotion: happy
    text: じゃあ聞くけど、途中で引っかかったことある？
  - speaker: zundamon
    emotion: thinking
    text: ……最近は、無い。
  - speaker: tsumugi
    emotion: normal
    text: その無いが、ものすごく難しいの。
  - speaker: reimu
    text: ファスナーは、金属やプラスチックの歯を布に植えて作ります。
    reading: ふぁすなあわ、きんぞくやぷらすちっくのはお ぬのに うえて つくります。
  - speaker: reimu
    text: 歯の間隔が少しでも狂うと、そこで噛み合わなくなります。
    reading: はの かんかくが すこしでも くるうと、そこで かみあわなく なります。
  - speaker: zundamon
    emotion: surprised
    text: 少しって、どのくらいなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 髪の毛より細い単位の話よ。
  - speaker: zundamon
    emotion: surprised
    text: ……ボクのズボンに、そんな技術が。
  - speaker: tsumugi
    emotion: normal
    text: それを作った会社を始めた人がいるの。
  - speaker: zundamon
    emotion: happy
    text: さぞ立派な工場から始めたのだ。
  - speaker: tsumugi
    emotion: thinking
    text: 始まりは、潰れた店に残っていた売れ残りよ。
  - speaker: zundamon
    emotion: surprised
    text: 売れ残り。
  - speaker: tsumugi
    emotion: normal
    text: しかも、代金を払っていない品物だったの。
  - speaker: zundamon
    emotion: surprised
    text: それ、持ち出したらまずいのでは。
  - speaker: tsumugi
    emotion: normal
    text: だから頭を下げに行ったのよ。仕入れ先に。
  - speaker: reimu
    text: 名前は、吉田忠雄。富山の魚津で生まれた男です。
    reading: なまえわ、よしだ ただお。とやまの うおづで うまれた おとこです。
  - speaker: zundamon
    emotion: thinking
    text: 吉田。あの三文字と、関係あるのだ？
  - speaker: tsumugi
    emotion: happy
    text: 最後まで聞いたら分かるわ。
- id: card1908
  title: ''
  background: yk_card_1908
  cuts:
  - speaker: reimu
    text: 1908年9月19日。富山県の魚津に生まれました。
    reading: せんきゅうひゃくはちねん くがつ じゅうくにち。とやまけんの うおづに うまれました。
- id: ch1_ie
  title: カーネギーを読んだ少年
  background: yk_uozu_ie
  bgm: 223am
  stage:
