meta:
  title: 【YKKの誕生】勤め先が潰れて、残ったのは未払いの半製品だった【ずんだもん解説】
  slug: ykk
  summary: ズボンのファスナーに刻まれた三文字。あれが何の略か、考えたことはあるでしょうか。 小学校を出ただけの少年が東京へ出て、四年働いた店は潰れます。 整理した店に残っていたのは、代金も払っていない半端な品物でした。 そこから始めた男が、最後にたどり着いた考え方の話です。
  tags:
  - YKK
  - 吉田忠雄
  - ファスナー
  - 善の巡環
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 富山
  - 黒部
  thumbnail:
    top: 残ったのは未払い品
    bottom: YKKの誕生
  mode: drama
  narrator: reimu
  mobs:
