  - speaker: haha
    emotion: normal
    text: 鉄。うちとは縁のない話だね。
  - speaker: zundamon
    emotion: normal
    text: でも、面白いことが書いてあるのだ。
  - speaker: zundamon
    emotion: thinking
    text: 金は、ひとりじめするものではない、と。
  - speaker: haha
    emotion: surprised
    text: 商売の本で、そんなことを言うのかい。
  - speaker: zundamon
    emotion: normal
    text: 人の[得|とく]にならんと、自分も続かん、とも書いてある。
  - speaker: haha
    emotion: thinking
