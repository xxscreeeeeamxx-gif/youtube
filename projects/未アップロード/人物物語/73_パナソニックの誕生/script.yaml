scenes:
- id: co_urenai
  title: ''
  background: pn_ikaino
  bgm: serious
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 松下幸之助, emotion: thinking}
  - {who: hayashi, x: 0.56, emotion: sad}
  - {who: mumeno, x: 0.78, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1917年の冬。大阪・猪飼野の借家で、若い夫婦が売れないソケットを作っていました。
    reading: せんきゅうひゃく じゅうななねんの ふゆ。おおさか いかいのの しゃくやで、わかい ふうふが うれない そけっとお つくって いました。
  - speaker: hayashi
    emotion: sad
    text: 松下君。10日回って、売れたんは100個ほどや。
  - speaker: zundamon
    emotion: surprised
    text: ……100個。
  - speaker: hayashi
    emotion: thinking
    text: すまん。わしらは、抜けさせてもらう。
    se: don
  - speaker: mumeno
    emotion: normal
    text: あなた。この着物、質屋さんに持っていきますね。
  - speaker: zundamon
    emotion: sad
    text: ……すまん。
- id: co_chumon
  title: ''
  background: pn_ikaino
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 松下幸之助, emotion: sad}
  - {who: kawakita, x: 0.7, emotion: normal}
  cuts:
  - speaker: kawakita
    emotion: normal
    text: ごめんください。扇風機の[碍盤|がいばん]、1,000枚。年内に頼めますか。
  - speaker: zundamon
    emotion: surprised
    text: 1,000枚……！
  - speaker: reimu
    text: この男は、松下幸之助。5人で始めた仕事場は今、18万人あまりが働くパナソニックです。
    reading: この おとこわ まつした こうのすけ。ごにんで はじめた しごとばわ いま、じゅうはちまんにん あまりが はたらく ぱなそにっくです。
- id: hook
  title: ''
  background: pn_heya
  bgm: shuffle_shuffle
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: ストーブもドライヤーも、延長コードに延長コードでつなぐのだ！
  - speaker: tsumugi
    emotion: surprised
    text: タコ足の先に、またタコ。もうイカより足が多いわよ。
    beat: true
  - speaker: zundamon
    emotion: thinking
    text: そもそも、1つの穴を2つに増やしたのは誰なのだ？
  - speaker: tsumugi
    emotion: normal
    text: それを安く売って大きくなったのが、松下[幸之助|こうのすけ]よ。
  - speaker: zundamon
    emotion: surprised
    text: 100個しか売れなかったのに、どうやって？
    telops:
    - {text: '100個から18万人へ', size: lg, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
- id: card1894
  title: ''
  background: pn_card_1894
  cuts:
  - speaker: reimu
    text: 1894年。和歌山の村で、松下幸之助が生まれます。8人きょうだいの末っ子でした。
    reading: せんはっぴゃく きゅうじゅうよねん。わかやまの むらで まつした こうのすけが うまれます。はちにん きょうだいの すえっこでした。
- id: ch1_wasa
  title: 大きな松の家
  background: pn_wasa
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 松下幸之助, scale: 0.85, emotion: happy}
  - {who: haha, x: 0.7, emotion: sad}
  cuts:
  - speaker: reimu
    text: 家は大きな松のある旧家でした。ところが4歳のとき、父が米の相場で失敗します。
    reading: いえわ おおきな まつの ある きゅうかでした。ところが よんさいの とき、ちちが こめの そうばで しっぱい します。
  - speaker: haha
    emotion: sad
    text: '[幸之助|こうのすけ]。この家も田んぼも、手放すことになったんよ。'
  - speaker: zundamon
    emotion: surprised
    text: あの大きな松も、置いていくのだ？
  - speaker: haha
    emotion: thinking
    text: 松は持っていかれへん。町に出て、下駄屋をするんよ。
  - speaker: zundamon
    emotion: happy
    text: 下駄屋！ じゃあボク、毎日新しい下駄をはけるのだ！
  - speaker: haha
    emotion: thinking
    text: 売りもんやから、はいたらあかんよ。
    se: tenten
- id: ch1_nagaya
  title: ''
  background: pn_nagaya
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 松下幸之助, scale: 0.85, emotion: sad}
  - {who: haha, x: 0.7, emotion: sad}
  cuts:
  - speaker: haha
    emotion: sad
    text: 下駄屋は、2年でたたむことになったわ。狭い長屋で[堪忍|かんにん]な。
  - speaker: reimu
    text: 1900年から翌年にかけて、兄2人と姉1人が次々に亡くなります。
    reading: せんきゅうひゃくねんから よくねんに かけて、あに ふたりと あね ひとりが つぎつぎに なくなります。
  - speaker: haha
    emotion: sad
    text: ……兄ちゃんらの分まで、元気でおってな。
  - speaker: zundamon
    emotion: sad
    text: ……うん。
  - speaker: haha
    emotion: thinking
    text: お父さんは一人で大阪へ出て、[盲唖院|もうあいん]で働いてはる。
  - speaker: haha
    emotion: thinking
    text: 学校は、卒業まであと4か月やのにな。
  - speaker: zundamon
    emotion: normal
    text: ……大阪で、がんばってきます。
- id: card1904
  title: ''
  background: pn_card_1904
  cuts:
  - speaker: reimu
    text: 1904年11月。9歳の幸之助は小学校をやめ、一人で大阪へ向かいます。
    reading: せんきゅうひゃく よねん じゅういちがつ。きゅうさいの こうのすけわ しょうがっこうお やめ、ひとりで おおさかえ むかいます。
- id: ch1_kinokawa
  title: 紀ノ川駅の別れ
  background: pn_kinokawa
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 松下幸之助, scale: 0.85, emotion: sad}
  - {who: haha, x: 0.56, emotion: thinking}
  - {who: joukyaku, x: 0.78, emotion: normal}
  cuts:
  - speaker: haha
    emotion: thinking
    text: すんまへん。この子、大阪まで一人で行きますんや。
  - speaker: haha
    emotion: thinking
    text: 向こうに着いたら、迎えが来てます。どうか途中を、よろしく頼みます。
  - speaker: joukyaku
    emotion: surprised
    text: 坊、一人かいな。
  - speaker: zundamon
    emotion: sad
    text: ……はい。一人です。
  - speaker: haha
    emotion: thinking
    text: すんまへん。この子のこと、どうかよろしゅうに。
  - speaker: joukyaku
    emotion: happy
    text: おかみさん、それもう3回目やで。ちゃんと見とくさかい。
    beat: true
  - speaker: haha
    emotion: sad
    text: '[幸之助|こうのすけ]。体に気をつけてな。'
  - speaker: haha
    emotion: sad
    text: 先方のご主人に、かわいがってもらうんやで。
  - speaker: zundamon
    emotion: sad
    text: ……行ってきます。
    se: namida
  - speaker: reimu
    text: 汽車が動き出します。満10歳の誕生日の、4日前のことでした。
    reading: きしゃが うごきだします。まん じゅっさいの たんじょうびの、よっかまえの ことでした。
- id: ch2_hibachi
  title: 火鉢を磨く9歳
  background: pn_hibachi
  bgm: honwaka_puppu
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 松下幸之助, scale: 0.85, emotion: normal}
  - {who: hibachiya, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 奉公先は、大阪・八幡筋の火鉢店。拭き掃除に子守り、そして火鉢磨きが仕事です。
    reading: ほうこうさきわ、おおさか はちまんすじの ひばちてん。ふきそうじに こもり、そして ひばちみがきが しごとです。
  - speaker: hibachiya
    emotion: normal
    text: 坊。高い火鉢は、一日中トクサで磨くんやで。
  - speaker: zundamon
    emotion: normal
    text: はい、旦那さん。
  - speaker: zundamon
    emotion: sad
    text: ……手の皮がすりむけて、腫れてきました。
  - speaker: hibachiya
    emotion: thinking
    text: 磨くのは火鉢や。手ぇ磨いてどないすんねん。
    beat: true
  - speaker: zundamon
    emotion: sad
    text: ……夜になると、お母さんの顔ばかり浮かぶのだ。
  - speaker: hibachiya
    emotion: happy
    text: 坊、半月ごくろうさん。給料をあげよう。
  - speaker: zundamon
    emotion: surprised
    text: ご、5銭の白銅！
  - speaker: zundamon
    emotion: happy
    text: お[金|かね]をもらったら、涙が止まったのだ。
  - speaker: hibachiya
    emotion: thinking
    text: 現金な子やな。
    beat: true
  - speaker: reimu
    text: 90歳のころ本人は、生涯でいちばんうれしかったことにこの5銭を挙げています。
    reading: きゅうじゅっさいの ころ ほんにんわ、しょうがいで いちばん うれしかった ことに この ごせんお あげて います。
- id: ch2_manju
  title: ''
  background: pn_hibachi
  stage:
  - {who: zundamon, x: 0.4, flip: true, tag: 松下幸之助, scale: 0.85, emotion: happy}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: 子守りの赤ちゃんを背負ったまま、鉄ごまで遊ぶのだ！
  - speaker: zundamon
    emotion: surprised
    text: あっ……！ 赤ちゃんの頭を、床にぶつけてしまった！
  - speaker: zundamon
    emotion: sad
    text: 泣きやまない……。お饅頭を、買ってくるのだ！
  - speaker: reimu
    text: 饅頭は1つ1銭。給金の3日分でした。
    reading: まんじゅうわ ひとつ いっせん。きゅうきんの みっかぶんでした。
  - speaker: zundamon
    emotion: sad
    text: 3日分の給金が、一口で消えたのだ……。
    se: chin
- id: ch2_godai
  title: 煙草の買いおき
  background: pn_godai
  bgm: pop
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 松下幸之助, scale: 0.85, emotion: normal}
  - {who: godai, x: 0.56, emotion: normal}
  - {who: kozo, x: 0.78, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1905年2月。火鉢店が閉まり、幸之助は船場の五代自転車商会へ移ります。
    reading: せんきゅうひゃく ごねん にがつ。ひばちてんが しまり、こうのすけわ せんばの ごだい じてんしゃ しょうかいえ うつります。
  - speaker: godai
    emotion: normal
    text: '[幸吉ッとん|こうきっとん]。ちょっと煙草を[買うて|こうて]きてんか、ってお客さんが。'
  - speaker: zundamon
    emotion: normal
    text: はい！ 手を洗って、走ってきます！
  - speaker: zundamon
    emotion: thinking
    text: 毎回これでは、お客さんを待たせる。……給金で、箱ごと買っておこう。
  - speaker: zundamon
    emotion: happy
    text: 20個入りを箱で買うと、1個おまけが付くんです！
  - speaker: zundamon
    emotion: happy
    text: 月に50個から60個売れて、もうけが給金の4分の1の月もあるのだ！
  - speaker: kozo
    emotion: angry
    text: '[幸吉ッとん|こうきっとん]だけ、ずるいわ。お客さんの用事で、小遣い稼いどる。'
  - speaker: godai
    emotion: sad
    text: おまえ、もうやめとけ。
  - speaker: godai
    emotion: sad
    text: 皆があれこれ言うんで、わしもつらいんや。
  - speaker: zundamon
    emotion: sad
    text: ……はい。今日で、やめます。
    se: shobon
- id: ch2_chichi
  title: 学校か、商売か
  background: pn_tenma
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 松下幸之助, scale: 0.85, emotion: normal}
  - {who: haha, x: 0.56, emotion: happy}
  - {who: chichi, x: 0.78, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1906年。母と姉が、大阪の天満に移ってきます。
    reading: せんきゅうひゃく ろくねん。ははと あねが、おおさかの てんまに うつって きます。
  - speaker: haha
    emotion: happy
    text: 姉さんの勤め先の貯金局で、給仕を探してるんやて。
  - speaker: haha
    emotion: happy
    text: 給仕をしながら、夜学へ通うたらええ。
  - speaker: zundamon
    emotion: happy
    text: また、学校に行けるのだ？
  - speaker: chichi
    emotion: normal
    text: わしは反対じゃ。奉公を続けて、やがて商売で身を立てよ。
  - speaker: chichi
    emotion: normal
    text: 手紙一本よう書かん人でも、商売で多くの人を使うとる例はたくさんある。
  - speaker: zundamon
    emotion: thinking
    text: ……はい。奉公を、続けます。
  - speaker: reimu
    text: この年は姉2人に続いて、9月に父が51歳で亡くなります。
    reading: この としわ あね ふたりに つづいて、くがつに ちちが ごじゅういっさいで なくなります。
  - speaker: zundamon
    emotion: sad
    text: ……商売で身を立てる。お父さんとの、約束です。
- id: ch2_hatsuuri
  title: 初めて売った自転車
  background: pn_kaya
  bgm: pop
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 松下幸之助, scale: 0.85, emotion: happy}
  - {who: kaya, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1908年。13歳の幸之助は、初めて一人で自転車を売りに行きます。
    reading: せんきゅうひゃく はちねん。じゅうさんさいの こうのすけわ、はじめて ひとりで じてんしゃお うりに いきます。
  - speaker: zundamon
    emotion: happy
    text: この自転車、よく走ります！ 乗り心地も、ばつぐんです！
  - speaker: kaya
    emotion: thinking
    text: 熱心な小僧さんやな。……よっしゃ、[買うたろ|こうたろ]。
  - speaker: kaya
    emotion: happy
    text: その代わり、一割まけとき。
  - speaker: zundamon
    emotion: happy
