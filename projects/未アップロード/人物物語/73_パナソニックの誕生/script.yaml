  background: pn_taiikukan
  bgm: you_and_me
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 松下幸之助, emotion: happy}
  - {who: mumeno, x: 0.7, emotion: normal}
  cuts:
