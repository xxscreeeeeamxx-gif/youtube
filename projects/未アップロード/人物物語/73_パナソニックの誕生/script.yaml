meta:
  title: 【パナソニックの誕生】「売れたんは100個ほどや」妻が着物を質に入れた冬【ずんだもん解説】
  slug: matsushita-socket
  summary: 電灯の差し込み口を、1つから2つに。その差し込みを安く売って会社を大きくしたのが、和歌山生まれの松下幸之助でした。9歳で大阪へ奉公に出て、火鉢を磨き、自転車を売り、電気工事の見習いへ。独立して作ったソケットは、10日歩いて100個ほどしか売れません。仲間は去り、妻は着物を質に入れます。その冬、小さな借家に思いがけない注文が届きました。パナソニックの誕生を、再現ドラマでたどります。
  tags:
  - パナソニック
  - 松下幸之助
  - 二股ソケット
  - 松下電器
  - 創業
  - 再現ドラマ
  - ゆっくり
  - ずんだもん
  - 企業史
  - 雑学
  thumbnail:
    top: 売れないソケット
    bottom: パナソニック誕生
  mode: drama
  narrator: reimu
