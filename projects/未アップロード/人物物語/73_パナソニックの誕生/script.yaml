    text: わしの経営が間違っていてこうなったんとは違うから、ええよ。
  - speaker: zundamon
    emotion: thinking
    text: 国の政治が、悪かったからや。
  - speaker: reimu
    text: 1949年には初めて希望退職者を募り、翌年は567人を待命休職にします。
    reading: せんきゅうひゃく よんじゅうきゅうねんにわ はじめて きぼう たいしょくしゃお つのり、よくねんわ ごひゃく ろくじゅうななにんお たいめい きゅうしょくに します。
  - speaker: reimu
    text: 1951年に再び開業すると宣言し、1961年には社長を娘婿の正治に譲って会長になります。
    reading: せんきゅうひゃく ごじゅういちねんに ふたたび かいぎょう すると せんげんし、せんきゅうひゃく ろくじゅういちねんにわ しゃちょうお むすめむこの まさはるに ゆずって かいちょうに なります。
- id: card1964
  title: ''
  background: pn_card_1964
  cuts:
  - speaker: reimu
    text: 1964年7月。熱海のホテルに、全国の販売会社と代理店の社長が集まります。
    reading: せんきゅうひゃく ろくじゅうよねん しちがつ。あたみの ほてるに、ぜんこくの はんばい がいしゃと だいりてんの しゃちょうが あつまります。
- id: ch12_atami
  title: 熱海会談
  background: pn_atami
  bgm: kinakusai
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 松下幸之助, emotion: normal}
  - {who: dairiten, x: 0.56, emotion: angry}
  - {who: hansha, x: 0.78, emotion: angry}
  cuts:
  - speaker: reimu
    text: 集まった170社のうち、黒字は20数社だけでした。
    reading: あつまった ひゃくななじゅっしゃの うち、くろじわ にじゅうすうしゃ だけでした。
  - speaker: dairiten
    emotion: angry
    text: 親の代から松下の代理店をやっているのに、赤字続きだ。
  - speaker: dairiten
    emotion: angry
    text: いったい松下は、どうしてくれるんだ。
  - speaker: zundamon
    emotion: angry
    text: 皆さんは、松下電器に甘えている部分がありはしませんか。
  - speaker: hansha
    emotion: angry
    text: 甘えとるやと！？
  - speaker: reimu
    text: 会長の幸之助と代理店の言い合いは、2日続きます。
    reading: かいちょうの こうのすけと だいりてんの いいあいわ、ふつか つづきます。
- id: ch12_atami3
  title: ''
  background: pn_atami
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.24, flip: true, tag: 松下幸之助, emotion: sad}
  - {who: dairiten, x: 0.56, emotion: thinking}
  - {who: hansha, x: 0.78, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 3日目。
    reading: みっかめ。
  - speaker: zundamon
    emotion: sad
    text: よくよく考えてみますと、結局は松下電器が悪かったのです。
  - speaker: zundamon
    emotion: sad
    text: この[一語|いちご]に、尽きます。
    telops:
    - {text: '結局は松下電器が悪かった', size: md, position: top-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: dairiten
    emotion: surprised
    text: ……会長。
  - speaker: zundamon
    emotion: sad
    text: 昔、電球を売り込んだとき……。将来はきっと横綱になってみせますと、頼んで……。
    se: namida
  - speaker: reimu
    text: 話の途中で、幸之助は言葉に詰まりました。会場は、静まり返ります。
    reading: はなしの とちゅうで、こうのすけわ ことばに つまりました。かいじょうわ、しずまりかえります。
  - speaker: reimu
    text: 最後に、共存共栄と書いた色紙を一人ずつに手渡します。色紙は前もって200枚書いてありました。
    reading: さいごに、きょうぞん きょうえいと かいた しきしお ひとりずつに てわたします。しきしわ まえもって にひゃくまい かいて ありました。
  - speaker: hansha
    emotion: surprised
    text: ……一人ずつ、手書きで。
  - speaker: reimu
    text: 3日間で、幸之助が壇上に立った時間は延べ13時間でした。
    reading: みっかかんで、こうのすけが だんじょうに たった じかんわ のべ じゅうさんじかんでした。
- id: ch13_gojunen
