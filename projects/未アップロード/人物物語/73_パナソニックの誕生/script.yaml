  - speaker: zundamon
    emotion: surprised
    text: 18万人！ [猪飼野|いかいの]の借家、何軒分なのだ？
  - speaker: tsumugi
    emotion: thinking
    text: '[4畳半|よじょうはん]には、まず入らないわね。'
    se: zukko
  - speaker: tsumugi
    emotion: normal
    text: 売り上げは、1年で8兆円を超えてるわ。
  - speaker: tsumugi
    emotion: normal
    text: この春には、家電や自転車などを手がける新しいパナソニック株式会社もできたの。
  - speaker: zundamon
    emotion: happy
    text: 自転車！ [幸之助|こうのすけ]さんが丁稚のころに売ってたのと、同じなのだ。
  - speaker: tsumugi
    emotion: normal
    text: 大阪の[門真|かどま]にある松下幸之助歴史館は、入館無料よ。
  - speaker: tsumugi
    emotion: normal
    text: 政経塾からは、首相が2人出てるわ。[野田佳彦|のだよしひこ]さんと、[高市早苗|たかいちさなえ]さんよ。
  - speaker: zundamon
    emotion: surprised
