- id: ch15_ronsou
  title: 二股ソケットは発明か
  background: pn_ronsou
  bgm: 10do
  stage:
  - {who: zundamon, x: 0.2, flip: true, emotion: happy}
  - {who: tsumugi, x: 0.8, emotion: normal}
  cuts:
  - speaker: zundamon
    emotion: happy
    text: つむぎ。ネットで見たのだ。二股ソケットは、松下幸之助の大発明！
  - speaker: tsumugi
    emotion: normal
    text: 本人の自伝には、東京と京都でもう作られてよく売れてた品だと書いてあるの。
  - speaker: zundamon
    emotion: surprised
    text: ええっ。発明じゃないのだ！？
  - speaker: tsumugi
    emotion: normal
    text: まだ良くできると考えて、工夫して実用新案を取った。改良品なの。
  - speaker: tsumugi
    emotion: normal
    text: それを3割から5割安く売ったのが、松下の手柄よ。
    telops:
    - {text: '発明ではなく改良と安さ', size: md, position: top-right, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
  - speaker: zundamon
    emotion: thinking
    text: 東京や京都で、もう売れてたのだ……。
  - speaker: tsumugi
    emotion: thinking
    text: それに二股ソケットとしてよく載る写真は、別の商品なの。
  - speaker: zundamon
    emotion: surprised
    text: 写真まで、別人なのだ！？
    se: bikkuri
  - speaker: tsumugi
    emotion: normal
    text: 1968年の社史に載った写真から、取り違えが広まったのよ。
  - speaker: tsumugi
    emotion: normal
    text: 正式な名前は、[二灯用|にとうよう]差込みプラグ。大正の三大発明という呼び方も、わりと新しいの。
  - speaker: zundamon
    emotion: happy
    text: じゃあ、これは本当なのだ。経営の神様は、一人もクビにしなかった！
  - speaker: tsumugi
    emotion: normal
    text: 1929年は、そのとおり。生産を半分にしても、給料は全額払ったわ。
  - speaker: tsumugi
    emotion: thinking
    text: でも戦後の1949年には、初めて希望退職を募ってるの。
  - speaker: tsumugi
    emotion: normal
    text: 1950年には、4,438人のうち567人を[待命|たいめい]休職にしたわ。
  - speaker: zundamon
    emotion: surprised
    text: 神様の会社でも、減らした年があったのか！？
  - speaker: tsumugi
    emotion: normal
    text: GHQの制限を受けて、会社が傾いてた時期よ。
  - speaker: tsumugi
    emotion: normal
    text: 戦前は守って、戦後は減らした。どちらも事実なの。
  - speaker: zundamon
    emotion: thinking
    text: 水道の話も、物だけじゃなかったし……。
  - speaker: tsumugi
    emotion: normal
    text: そう。水道哲学って呼び方も、世間がつけた名前なの。
  - speaker: tsumugi
    emotion: normal
    text: 本当に気をつけたいのは、あなたの家の二股のほう。
  - speaker: tsumugi
    emotion: normal
    text: 延長コードには、つないでいい電気の量が書いてあるの。
  - speaker: tsumugi
    emotion: normal
    text: 壁のコンセントも、2つの口を合わせて1500ワットまでよ。
  - speaker: tsumugi
    emotion: normal
    text: 電気をたくさん使う家電には、延長コードを使わないでと書いてある物もあるわ。
  - speaker: zundamon
    emotion: surprised
    text: ボクのタコ足、ストーブもドライヤーもつながってるのだ！
  - speaker: tsumugi
    emotion: thinking
    text: 今日のうちに、説明書を読みなさい。
    beat: true
