    reading: せんきゅうひゃく ろくじゅうはちねん、そうぎょう ごじっしゅうねんの しきてんです。
  - speaker: zundamon
    emotion: happy
    text: 3人で始めた会社が、50年になりました。
  - speaker: zundamon
    emotion: normal
    text: 奥さん。長いあいだ、どうもありがとう。
  - speaker: mumeno
    emotion: surprised
    text: ……あなた。みんなの前で、急にどないしたん。
  - speaker: zundamon
    emotion: thinking
    text: 2銭の風呂代も、なかったころから……。
  - speaker: mumeno
    emotion: happy
    text: 風呂屋が閉まるまで、話そらしてましたなあ。
    beat: true
- id: ch13_juku
  title: 84歳の塾
  background: pn_zashiki
  bgm: hirusagari
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 松下幸之助, emotion: normal}
  - {who: mumeno, x: 0.7, emotion: normal}
  cuts:
  - speaker: reimu
    text: 1973年に会長を退いて相談役となり、1979年6月に私財70億円で松下政経塾を作ります。
    reading: せんきゅうひゃく ななじゅうさんねんに かいちょうお しりぞいて そうだんやくと なり、せんきゅうひゃく ななじゅうきゅうねん ろくがつに しざい ななじゅうおくえんで まつした せいけいじゅくお つくります。
  - speaker: mumeno
    emotion: surprised
    text: 70億円！？ 84にもなって、まだ新しいこと始めはりますの？
  - speaker: zundamon
    emotion: normal
    text: 政治と経済を学ぶ塾だ。若い人を、ここで育てる。
  - speaker: mumeno
    emotion: thinking
    text: 相談役って、ヒマなお仕事やなかったんですか。
  - speaker: zundamon
    emotion: happy
    text: ヒマだから、作るのだ。
    beat: true
  - speaker: reimu
    text: 翌年の第1期には約900人が応募し、合格は20人あまりでした。
    reading: よくねんの だいいっきにわ やく きゅうひゃくにんが おうぼし、ごうかくわ にじゅうにん あまりでした。
- id: ch13_saigo
  title: お願いするのは私です
  background: pn_byoin
  bgm: 223am
  stage:
  - {who: zundamon, x: 0.28, flip: true, tag: 松下幸之助, emotion: sad}
  - {who: shujii, x: 0.7, emotion: thinking}
  cuts:
  - speaker: reimu
    text: 1989年4月。94歳の幸之助は、気管支肺炎にかかります。
    reading: せんきゅうひゃく はちじゅうきゅうねん しがつ。きゅうじゅうよんさいの こうのすけわ、きかんし はいえんに かかります。
  - speaker: reimu
    text: 4月20日。管を喉に入れる前に、主治医が苦しいでしょうがご辛抱くださいと声をかけます。
    reading: しがつ はつか。くだお のどに いれる まえに、しゅじいが くるしいでしょうが ごしんぼう くださいと こえお かけます。
  - speaker: zundamon
    emotion: normal
    text: いやいや。お願いするのは、私です。
  - speaker: reimu
    text: これが、最期の言葉になりました。4月27日、松下幸之助は94歳で亡くなります。
    reading: これが、さいごの ことばに なりました。しがつ にじゅうしちにち、まつした こうのすけわ きゅうじゅうよんさいで なくなります。
  - speaker: reimu
    text: 合同葬には、約2万人が参列しました。
    reading: ごうどうそうにわ、やく にまんにんが さんれつ しました。
