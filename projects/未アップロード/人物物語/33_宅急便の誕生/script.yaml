      - speaker: zundamon
        emotion: angry
        text: "……全部やるのは、優しさじゃなくて弱さなのだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "急にいいこと言うじゃん。"
      - speaker: zundamon
