      - speaker: zundamon
        emotion: thinking
        text: "……逆に考えるのだ。"
      - speaker: zundamon
        emotion: normal
        text: "誰もいない場所なら、値下げ合戦も無い。"
      - speaker: tsumugi
        emotion: surprised
        text: "……その発想を、この人は本当にやるんだよ。"

