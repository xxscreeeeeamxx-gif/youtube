      - speaker: tsumugi
        emotion: thinking
        text: "……この四年、あとから効いてくるんだよね。"
      - speaker: zundamon
        emotion: normal
        text: "どういうことなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "現場を走り回ってた人には、立ち止まって考える時間が無いから。"
      - speaker: zundamon
        emotion: thinking
        text: "……考えるしかない四年間、か。"
      - speaker: reimu
        text: "退院後、彼は会社に戻ります。"
        reading: "たいいんご、かれわかいしゃにもどります。"

