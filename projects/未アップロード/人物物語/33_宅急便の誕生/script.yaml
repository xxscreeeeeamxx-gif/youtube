      - speaker: zundamon
        emotion: normal
        text: "外。"
      - speaker: tsumugi
        emotion: happy
        text: "一つ目は、牛丼屋。"
      - speaker: zundamon
        emotion: surprised
        text: "牛丼！？ 荷物と何の関係があるのだ。"
