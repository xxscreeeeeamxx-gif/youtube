      - speaker: zundamon
        emotion: sad
        text: "……四年。"
      - speaker: tsumugi
        emotion: thinking
        text: "二十四歳から二十八歳まで。いちばん動ける時期。"
      - speaker: kanja
        emotion: normal
        text: "……小倉さん。今日も本かい。"
      - speaker: zundamon
        emotion: normal
        text: "動けないので。読むしかないんです。"
      - speaker: kanja
