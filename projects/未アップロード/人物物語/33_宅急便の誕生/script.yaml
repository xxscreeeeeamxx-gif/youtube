        emotion: normal
        text: "十一個の荷物を、ちゃんと翌日に届けた。"
      - speaker: zundamon
        emotion: normal
        text: "商品が良ければ、次がある。"
      - speaker: reimu
        text: "1998年、パンの店の一号店が開きます。"
        reading: "せんきゅうひゃくきゅうじゅうはちねん、ぱんのみせのいちごうてんがひらきます。"
      - speaker: tsumugi
        emotion: happy
        text: "いまはフランチャイズも含めて、全国に三十店ほど。"
