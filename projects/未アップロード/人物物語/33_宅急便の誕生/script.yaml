        text: "また関係ないのが来たぞ。"
      - speaker: reimu
        text: "日本航空の「ジャルパック」という商品です。"
        reading: "にほんこうくうのじゃるぱっくというしょうひんです。"
      - speaker: tsumugi
        emotion: normal
        text: "飛行機とホテルと観光を、ひとつの値段にまとめて売るの。"
      - speaker: zundamon
        emotion: normal
        text: "……ばらばらに買うより分かりやすいのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。悩まなくていい。だから売れる。"
      - speaker: zundamon
        emotion: thinking
        text: "……荷物も、同じにできるのか。"
      - speaker: zundamon
        emotion: normal
        text: "重さで細かく分けるのをやめる。"
      - speaker: zundamon
        emotion: normal
        text: "面倒な計算もやめる。"
      - speaker: zundamon
        emotion: happy
        se: don
        text: "箱の大きさだけで、値段を決めるのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "はい優勝。それが商品になるの。"
      - speaker: zundamon
        emotion: normal
        text: "……絞り込んで、家庭に向けて、分かりやすく売る。"
      - speaker: tsumugi
        emotion: normal
        text: "三つのヒントが、ここで一本になったんだよ。"
      - speaker: zundamon
        emotion: normal
        text: "名前も要るな。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。「宅急便」。"

  - id: hantai
    title: "全員、反対"
    background: il_ogu_kaigi
    bgm: kinakusai
    stage:
      - {who: zundamon, x: 0.3, tag: "小倉", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: yakuin, x: 0.5}
      - {who: shain, x: 0.62}
    cuts:
      - speaker: zundamon
        emotion: normal
        text: "個人の荷物を、家から家へ運びます。"
      - speaker: yakuin
        emotion: surprised
        text: "……本気ですか。"
      - speaker: zundamon
        emotion: normal
        text: "本気です。"
      - speaker: yakuin
        emotion: angry
        text: "一個いくらの商売ですよ。トラック一台で何十軒も回る。"
      - speaker: shain
        emotion: sad
        text: "しかも、いつ荷物が出るか分かりません。"
      - speaker: yakuin
        emotion: angry
        text: "空のトラックが走るだけです。"
      - speaker: zundamon
        emotion: normal
        text: "……最初は、そうなります。"
      - speaker: yakuin
        emotion: surprised
        text: "認めるんですか。"
      - speaker: zundamon
        emotion: normal
        text: "はい。数が集まるまでは、赤字です。"
      - speaker: shain
        emotion: surprised
        text: "……ではなぜ。"
      - speaker: zundamon
        emotion: normal
        text: "数が集まったら、誰も追いつけなくなるからです。"
      - speaker: tsumugi
        emotion: normal
        text: "密度がね、この商売の全部なの。"
      - speaker: zundamon
        emotion: normal
        text: "一本の道に荷物が十個あれば、一軒あたりの手間は十分の一なのだ。"
      - speaker: yakuin
        emotion: thinking
        text: "……集まれば、ですが。"
      - speaker: zundamon
        emotion: angry
        text: "集めるんです。"
      - speaker: tsumugi
        emotion: normal
        text: "役員はほぼ全員反対。業界も、官庁も、反対。"
      - speaker: zundamon
        emotion: normal
        text: "……四面楚歌なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。そして彼は、大口の商売を減らす決断までする。"
      - speaker: zundamon
        emotion: surprised
        text: "稼ぎ頭を減らすのか！？"
      - speaker: tsumugi
        emotion: normal
        text: "絞り込みだからね。両方は持てないの。"

  - id: shonichi
    title: "1976・初日11個"
    background: il_ogu_gaito
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.3, tag: "小倉", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: shain, x: 0.52}
    cuts:
      - speaker: reimu
        text: "1976年、宅急便が始まりました。"
        reading: "せんきゅうひゃくななじゅうろくねん、たっきゅうびんがはじまりました。"
      - speaker: shain
        emotion: normal
        text: "社長。本日の集荷、まとまりました。"
      - speaker: zundamon
        emotion: happy
        text: "何個だ。"
      - speaker: shain
        emotion: sad
        text: "……十一個です。"
      - speaker: zundamon
        emotion: surprised
        text: "……十一。"
        telops:
          - {text: "初日 11個", size: xl, position: middle-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
      - speaker: shain
        emotion: sad
        text: "トラックは、ほとんど空のまま走りました。"
      - speaker: zundamon
        emotion: normal
        text: "……そうか。"
      - speaker: tsumugi
        emotion: thinking
        text: "……ここで折れる人が、たぶんほとんどだよね。"
      - speaker: zundamon
        emotion: normal
        text: "十一個、届いたのか。"
      - speaker: shain
        emotion: surprised
        text: "は、はい。全部、届きました。"
      - speaker: zundamon
        emotion: happy
        text: "なら、いい。"
      - speaker: zundamon
        emotion: normal
        text: "十一人が、便利だと思ったはずだ。"
      - speaker: zundamon
        emotion: normal
        text: "その人が、次は誰かに話す。"
      - speaker: tsumugi
        emotion: normal
        text: "宣伝費をかけるより、届いた体験のほうが強いって考えたの。"
      - speaker: zundamon
        emotion: angry
        text: "だから、絶対に翌日に届けるぞ。"
      - speaker: shain
        emotion: surprised
        text: "……翌日、ですか。"
      - speaker: zundamon
        emotion: normal
        text: "できないなら、やる意味がない。"
      - speaker: reimu
        text: "取扱いの数は、そこから伸びていきます。"
        reading: "とりあつかいのかずわ、そこからのびていきます。"

  - id: mitsukoshi
    title: "1979・大口を切る"
    background: il_ogu_hyakkaten
    bgm: serious
    stage:
      - {who: zundamon, x: 0.3, tag: "小倉", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: hyakka, x: 0.52}
    cuts:
      - speaker: reimu
        text: "1979年、[小倉|おぐら]はある通告を出します。"
        reading: "せんきゅうひゃくななじゅうくねん、おぐらわあるつうこくをだします。"
      - speaker: hyakka
        emotion: angry
        text: "……取引を、やめる？ そちらから、ですか。"
      - speaker: zundamon
        emotion: normal
        text: "はい。"
      - speaker: hyakka
        emotion: angry
        text: "うちは創業以来のお得意先ですよ。"
      - speaker: zundamon
        emotion: normal
        text: "承知しています。"
      - speaker: tsumugi
        emotion: normal
        text: "ここ、間違えられやすいんだけど。"
      - speaker: tsumugi
        emotion: normal
        text: "切られたんじゃなくて、ヤマトの側から切ってるの。"
      - speaker: zundamon
        emotion: surprised
        text: "自分から一番の客を切ったのか！？"
      - speaker: tsumugi
        emotion: normal
        text: "うん。条件の要求が続いて、これ以上は無理だと判断した。"
      - speaker: zundamon
        emotion: normal
        text: "……大口を抱えたままだと、宅急便に人を回せないのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "そこも大きいね。牛丼屋になるって、そういうこと。"
      - speaker: zundamon
        emotion: angry
        text: "……退路を、自分で焼いたのだな。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。もう戻れない。"
      - speaker: hyakka
        emotion: sad
        text: "……後悔しますよ。"
      - speaker: zundamon
        emotion: normal
        text: "するかもしれません。それでも、やります。"

  - id: menkyo
    title: "免許が下りない"
    background: il_ogu_unyusho
    bgm: kinakusai
    stage:
      - {who: zundamon, x: 0.3, tag: "小倉", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: yakunin, x: 0.52}
    cuts:
      - speaker: reimu
        text: "1980年代の半ば、荷物を運ぶ路線には国の免許が必要でした。"
        reading: "せんきゅうひゃくはちじゅうねんだいのなかば、にもつをはこぶろせんにわくにのめんきょがひつようでした。"
      - speaker: zundamon
        emotion: normal
        text: "申請は出しています。返事をください。"
      - speaker: yakunin
        emotion: normal
        text: "……検討中です。"
      - speaker: zundamon
        emotion: normal
        text: "前も、そう聞きました。"
      - speaker: yakunin
        emotion: normal
        text: "検討中です。"
      - speaker: tsumugi
        emotion: normal
        text: "この「検討中」がね、五年続くの。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "五年！？"
        telops:
          - {text: "申請から5年、返事なし", size: xl, position: bottom-center, color: "#FFF15A", stroke: "#2A0A0A", glow: "#E85A4A", anim: up}
      - speaker: tsumugi
        emotion: normal
        text: "却下でもない。許可でもない。ただ、止まってる。"
      - speaker: zundamon
        emotion: angry
        text: "……断られたほうがマシなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "そう。理由が分かれば、直せるからね。"
      - speaker: zundamon
        emotion: normal
        text: "なぜ出ないんですか。基準を教えてください。"
      - speaker: yakunin
        emotion: normal
        text: "……総合的に判断しています。"
      - speaker: zundamon
        emotion: angry
        text: "総合的。"
      - speaker: tsumugi
        emotion: angry
        text: "何も言ってないのと同じだよね。"
      - speaker: zundamon
        emotion: normal
        text: "……その間、届けたい家は待っているのだ。"

  - id: teiso
    title: "1986・監督官庁を訴える"
    background: il_ogu_hotei
    bgm: serious
    stage:
      - {who: zundamon, x: 0.3, tag: "小倉", flip: true, emotion: angry}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: bengo, x: 0.52}
    cuts:
      - speaker: zundamon
        emotion: normal
        text: "……訴えます。"
      - speaker: bengo
        emotion: surprised
        text: "訴える、とおっしゃいますと。相手は。"
      - speaker: zundamon
        emotion: normal
        text: "運輸省です。"
      - speaker: bengo
        emotion: surprised
        se: don
        text: "……監督官庁ですよ。"
      - speaker: zundamon
        emotion: normal
        text: "知っています。"
      - speaker: bengo
        emotion: sad
        text: "この先ずっと、許認可でお世話になる相手です。"
      - speaker: zundamon
        emotion: normal
        text: "だから、いま直さないといけないんです。"
      - speaker: tsumugi
        emotion: surprised
        text: "……ここ、たぶん一番ヤバいところ。"
      - speaker: zundamon
        emotion: normal
        text: "何がヤバいのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "普通の会社は、役所と喧嘩しないの。あとが怖いから。"
      - speaker: zundamon
        emotion: angry
        text: "……あとが怖いから、五年待ったのだ。"
      - speaker: reimu
        text: "1986年の夏、彼は行政訴訟に踏み切ります。"
        reading: "せんきゅうひゃくはちじゅうろくねんのなつ、かれわぎょうせいそしょうにふみきります。"
      - speaker: reimu
        text: "訴えの中身は、決めないことそのものが違法だ、というものでした。"
        reading: "うったえのなかみわ、きめないことそのものがいほうだ、というものでした。"
      - speaker: zundamon
        emotion: normal
        text: "……許可しろ、とは言っていない。"
      - speaker: zundamon
        emotion: angry
        text: "決めろ、と言っているのだ。"
        telops:
          - {text: "「決めないこと」が違法だと訴えた", size: xl, position: bottom-center, color: "#FFFFFF", stroke: "#1A1A2A", glow: "#7AA8FF", anim: up}
      - speaker: tsumugi
        emotion: surprised
        text: "……論点の置き方が、うますぎるんだよね。"
      - speaker: bengo
        emotion: normal
        text: "……勝てるかもしれません。"

  - id: shori
    title: "4か月後"
    background: il_ogu_unyusho
    bgm: you_and_me
    stage:
      - {who: zundamon, x: 0.3, tag: "小倉", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: yakunin, x: 0.52}
    cuts:
      - speaker: reimu
        text: "提訴のあと、免許は四か月で交付されました。"
        reading: "ていそのあと、めんきょわよんかげつでこうふされました。"
        telops:
          - {text: "5年 → 提訴して4か月", size: xl, position: middle-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
      - speaker: zundamon
        emotion: surprised
        text: "五年出なかったものが、四か月！？"
      - speaker: tsumugi
        emotion: angry
        text: "つまり、出せたんだよね。ずっと。"
      - speaker: zundamon
        emotion: angry
        text: "……出せたのに、出さなかったのだ。"
      - speaker: yakunin
        emotion: sad
        text: "……交付いたします。"
      - speaker: zundamon
        emotion: normal
        text: "ありがとうございます。"
      - speaker: zundamon
        emotion: normal
        text: "それと、もうひとつ。"
      - speaker: yakunin
        emotion: surprised
        text: "……まだ何か。"
      - speaker: zundamon
        emotion: normal
        text: "基準を、はっきり決めてください。"
      - speaker: tsumugi
        emotion: normal
        text: "自分の免許を取って終わり、にしなかったの。"
      - speaker: zundamon
        emotion: normal
        text: "ボクだけ通っても、意味がないのだ。"
      - speaker: zundamon
        emotion: normal
        text: "次に来る誰かが、また五年待つ。"
      - speaker: reimu
        text: "路線免許の審査基準は、このあと明確化されます。"
        reading: "ろせんめんきょのしんさきじゅんわ、このあとめいかくかされます。"
      - speaker: tsumugi
        emotion: happy
        text: "一社の勝ちじゃなくて、ルールが変わった。"
      - speaker: zundamon
        emotion: happy
        text: "……これが本丸なのだ。"

  - id: zenkoku
    title: "当たり前になるまで"
    background: il_ogu_track
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, tag: "小倉", flip: true, emotion: happy}
      - {who: tsumugi, x: 0.74, emotion: normal}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "宅急便は、そこから全国に広がっていくの。"
      - speaker: zundamon
        emotion: happy
        text: "十一個から始まったのに。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。密度が上がると、一気に強くなる商売だからね。"
      - speaker: zundamon
        emotion: normal
        text: "……最初に赤字を覚悟した意味が、ここで出るのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "そう。しかもこの人、便利な仕組みをどんどん足していく。"
      - speaker: zundamon
        emotion: normal
        text: "時間を指定して届ける、とかか。"
      - speaker: tsumugi
        emotion: happy
        text: "そういうの。当たり前の顔してるけど、全部あとから作られたもの。"
      - speaker: zundamon
        emotion: thinking
        text: "……ボクが不在票を三枚ためたのも、この人のおかげなのだ。"
      - speaker: tsumugi
        emotion: angry
        text: "それは違う。あなたのせい。"
      - speaker: reimu
        text: "1991年に相談役、1995年6月29日に退任します。"
        reading: "せんきゅうひゃくきゅうじゅういちねんにそうだんやく、せんきゅうひゃくきゅうじゅうごねんろくがつにじゅうくにちにたいにんします。"
      - speaker: zundamon
        emotion: normal
        text: "……七十歳か。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。ここで終わりだと思うでしょ。"
      - speaker: zundamon
        emotion: normal
        text: "終わりじゃないのか。"
      - speaker: tsumugi
        emotion: normal
        text: "この人、ここから全然違うことを始めるの。"

  - id: ichimanen
    title: "月に、一万円"
    background: il_ogu_sagyosho
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.3, tag: "小倉", flip: true, emotion: thinking}
      - {who: tsumugi, x: 0.74, emotion: thinking}
      - {who: sagyo, x: 0.52}
    cuts:
      - speaker: reimu
        text: "1993年9月10日、彼は福祉の財団を設立し、理事長になります。"
        reading: "せんきゅうひゃくきゅうじゅうさんねんくがつとおか、かれわふくしのざいだんをせつりつし、りじちょうになります。"
      - speaker: zundamon
        emotion: normal
        text: "……運送と関係ないのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。無いね。"
      - speaker: reimu
        text: "1995年、彼は障がいのある人たちの給料を知ることになります。"
        reading: "せんきゅうひゃくきゅうじゅうごねん、かれわしょうがいのあるひとたちのきゅうりょうをしることになります。"
      - speaker: sagyo
        emotion: normal
        text: "……うちの作業所ですと、月に一万円ほどです。"
      - speaker: zundamon
        emotion: surprised
        text: "……一万円。日給ですか。"
      - speaker: sagyo
        emotion: sad
        text: "いえ。月給です。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "……。"
        telops:
          - {text: "給料は、月に1万円に満たなかった", size: xl, position: middle-center, color: "#FFFFFF", stroke: "#1A1A2A", glow: "#7AA8FF", anim: up}
      - speaker: zundamon
        emotion: normal
        text: "……それでは、暮らせません。"
      - speaker: sagyo
        emotion: sad
        text: "はい。"
      - speaker: zundamon
        emotion: normal
        text: "……作っているものは、売れているんですか。"
      - speaker: sagyo
        emotion: sad
        text: "……買ってくださる方はいます。同情で。"
      - speaker: zundamon
        emotion: thinking
        text: "……同情で。"
      - speaker: tsumugi
        emotion: thinking
        text: "ここで、この人の考え方が出るの。"
      - speaker: zundamon
        emotion: normal
        text: "……それでは、一回きりです。"
      - speaker: zundamon
        emotion: normal
        text: "同情は、続かないのだ。"

  - id: swan
    title: "1998・パン屋"
    background: il_ogu_pan
    bgm: warm
    stage:
      - {who: zundamon, x: 0.3, tag: "小倉", flip: true, emotion: normal}
      - {who: tsumugi, x: 0.74, emotion: normal}
      - {who: sagyo, x: 0.52}
    cuts:
      - speaker: zundamon
        emotion: normal
        text: "……売れるものを、作りましょう。"
      - speaker: sagyo
        emotion: surprised
        text: "売れるもの、ですか。"
      - speaker: zundamon
        emotion: normal
        text: "焼きたてのパンは、どうですか。"
      - speaker: sagyo
        emotion: surprised
        text: "……パン。"
      - speaker: zundamon
        emotion: normal
        text: "美味しければ、毎日買いに来ます。"
      - speaker: zundamon
        emotion: normal
        text: "「障がいのある人が作ったから」ではなく。"
