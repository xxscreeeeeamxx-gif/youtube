        text: "何を読んでるんだ。"
      - speaker: zundamon
        emotion: normal
        text: "……経済の本です。あと、会社の数字を。"
      - speaker: kanja
        emotion: surprised
        text: "病室で仕事の勉強かい。"
      - speaker: zundamon
        emotion: normal
