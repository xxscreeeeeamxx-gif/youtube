# 宅急便・再現ドラマ（[小倉昌男|おぐらまさお]・1924→2005）。投稿前に必ず目視レビュー。
# ★企業の一代記シリーズ4本目。山一證券（失敗側）の対になる成功側。
#   敵が「役所」という構図が明快なので、ダイエー型の転落譚とは別の引きが作れる
# ★配役: ずんだもん=小倉昌男 / つむぎ=現代から見ている解説役 / ナレ=ゆっくり
# ★ミーム禁止の章: kekkaku（4年の療養）/ ichimanen（月1万円）/ swan
#   （病気と障害者福祉の場面には入れない）
# 裏取り: 小倉昌男Wikipedia / 日経BOOKプラス「宅急便のヒントになった2つの異業種」/
#   ダイヤモンド「官僚と闘い官業を食った男」/ 補助金さがすAI「初日わずか11個」/
#   スワンベーカリー公式「スワンの想い」
# 確定事実:
#   1924-12-13 生 / 2005-6-30 没（故人）。父は小倉康臣、大和運輸を営む
#   東京高等学校（旧制）→東京帝国大学経済学部 1947年卒
#   1949-2-2 肺結核で入院。4年間の入院生活。1953-7-9 退院
#   1971-3-30 代表取締役社長に就任
#   1970年代初頭から経営が悪化。郵便局が独占していた個人向け小口輸送への参入を検討
#   着想の3つのヒント:
#     ①吉野家がメニューを牛丼だけに絞って高収益を上げていた →「絞り込み」
#     ②千葉に住む甥に荷物を送ろうとしたら送る手段が無かった →ターゲットは家庭
#     ③日本航空「ジャルパック」→商品のパッケージ化という概念
#   1976年 宅急便を開始。**初日の取扱いは11個**
#   1979年 創業以来の取引先だった三越へ、ヤマト側から取引停止を通告
#     （※三越に切られたのではなく、こちらから切った。逆に書かないこと）
#   1980年代半ば 路線免許は運輸省の認可が必要。申請しても5年待たされた
#   1986年夏 運輸大臣・橋本龍太郎を相手取り「不作為の違法」で行政訴訟。
#     「運輸省なんて腐った官庁は要らない」→ 提訴後4か月で免許交付。
#     路線免許の審査基準の明確化も認めさせた
#   1991年 相談役 / 1993-9-10 ヤマト福祉財団を設立し理事長 / 1995-6-29 退任
#   1995年 阪神淡路大震災を機に、障がい者の給料が月1万円に満たない現状を知る。
#     「障がい者が作ったから」ではなく「良い商品だから」買ってもらえる商売を、と考える
#   1998年 スワンベーカリー1号店
#   著書『小倉昌男 経営学』(1999)
meta:
  title: "【宅急便の誕生】初日11個。役所を訴えた男が日本の当たり前を作るまで【ずんだもん解説】"
  slug: "ogura-takkyubin"
  summary: "いま玄関に届く荷物は、50年前には送る方法がありませんでした。作ったのは、4年間を病室で過ごし、47歳で父の会社を継いだ男です。最初の日に集まった荷物はたった11個。そこから彼は、監督官庁である運輸省を相手に裁判を起こすことになります。ずんだもんが小倉昌男を演じる再現ドラマです。"
  tags: ["宅急便", "小倉昌男", "ヤマト運輸", "経営", "昭和史", "規制", "再現ドラマ", "ゆっくり", "ずんだもん", "企業史", "ミーム"]
  thumbnail:
    top: "初日、11個"
    bottom: "宅急便の誕生"
  mode: drama
  narrator: reimu
  mobs:
    - {id: chichi, label: "父・康臣", voice: 42, pitch: -0.02, item: mustache}
    - {id: kanja, label: "同じ病室の人", voice: 13, pitch: -0.04}
    - {id: yakuin, label: "役員", voice: 13, pitch: -0.08, item: hat}
    - {id: shain, label: "ヤマトの社員", voice: 12, pitch: 0.02}
    - {id: shufu, label: "主婦", voice: 8, pitch: 0.06}
    - {id: hyakka, label: "百貨店の人", voice: 13, pitch: -0.02, item: hat}
    - {id: yakunin, label: "運輸省の人", voice: 13, pitch: -0.1, item: hat}
    - {id: bengo, label: "弁護士", voice: 13, pitch: 0.0, item: hat}
    - {id: sagyo, label: "作業所の人", voice: 42, pitch: 0.04}
scenes:
  - id: hook
    title: ""
    background: il_ogu_ima
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: zundamon
        emotion: angry
        text: "また不在票が入ってるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "何時に頼んだの？"
      - speaker: zundamon
        emotion: normal
        text: "明日の午前中で頼んだのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "……それ、今日の分だよね。"
      - speaker: zundamon
        emotion: angry
        text: "ボクは家にいたぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "いたのに受け取れなかったの？"
      - speaker: zundamon
        emotion: normal
        text: "玄関にいなかっただけなのだ。"
      - speaker: tsumugi
        emotion: angry
        text: "それは家にいないのと同じ。"
      - speaker: zundamon
        emotion: happy
        text: "次は絶対に受け取る。玄関で待つのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "おお、やる気だね。"
      - speaker: zundamon
        emotion: normal
        text: "……あ。ちょっとトイレ行ってくる。"
      - speaker: tsumugi
        emotion: angry
        text: "フラグを自分で立てるな。"
      - speaker: zundamon
        emotion: sad
        se: don
        text: "……不在票が増えたのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "三枚目。コレクションになってきたね。"
      - speaker: zundamon
        emotion: angry
        text: "だいたい、なんで家まで持ってきてくれるのだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "え、いま文句の向きが変わったよ。"
      - speaker: zundamon
        emotion: normal
        text: "当たり前だからな。荷物は家に来るものなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "……その当たり前、五十年前は無かったんだよ。"
      - speaker: zundamon
        emotion: surprised
        text: "無かった！？ じゃあどうしてたのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "駅まで自分で運んで、荷物として預けるの。"
      - speaker: zundamon
        emotion: angry
        text: "重いだろ。"
      - speaker: tsumugi
        emotion: normal
        text: "重いよ。しかも、いつ着くか分からない。"
      - speaker: zundamon
        emotion: surprised
        text: "無理ゲーじゃないか。"
      - speaker: tsumugi
        emotion: normal
        text: "個人の小さい荷物は、儲からないから誰もやりたがらなかったの。"
      - speaker: zundamon
        emotion: thinking
        text: "……たしかに。一個ずつ違う家に行くんだもんな。"
      - speaker: tsumugi
        emotion: normal
        text: "そう。効率が悪すぎて、業界の常識では「やってはいけない商売」。"
      - speaker: zundamon
        emotion: normal
        text: "誰がやったのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "[小倉昌男|おぐらまさお]。ヤマト運輸の社長。"
      - speaker: zundamon
        emotion: normal
        text: "……当たり前を作った人か。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。ちなみにこの人、始めた最初の日の荷物の数、覚えてる？"
      - speaker: zundamon
        emotion: happy
        text: "全国で始めたなら、何万個かなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "十一個。"
        telops:
          - {text: "初日、11個", size: xl, position: middle-center, color: "#FFF15A", stroke: "#2A2A0A", glow: "#FFAA00", anim: up}
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "十一！？ 個人宅十一軒！？"
      - speaker: tsumugi
        emotion: happy
        text: "そう。そこから始まってる。"
      - speaker: zundamon
        emotion: normal
        text: "……よし。ボク、その人をやるのだ。"

