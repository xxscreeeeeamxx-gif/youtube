      - speaker: zundamon
        emotion: normal
        text: "儲からない、と。"
      - speaker: yakuin
        emotion: normal
        text: "はい。一個ずつ違う家に行きます。とても合いません。"
      - speaker: tsumugi
        emotion: normal
        text: "しかもこの分野、郵便局がほぼ独占してたの。"
      - speaker: zundamon
        emotion: surprised
