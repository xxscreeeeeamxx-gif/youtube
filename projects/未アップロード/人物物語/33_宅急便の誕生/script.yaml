      - {who: tsumugi, x: 0.74}
      - {who: chichi, x: 0.52}
    cuts:
      - speaker: reimu
        text: "1924年12月13日、[小倉昌男|おぐらまさお]が生まれます。"
        reading: "せんきゅうひゃくにじゅうよねんじゅうにがつじゅうさんにち、おぐらまさおがうまれます。"
      - speaker: reimu
        text: "父の[康臣|やすおみ]は、[大和|やまと]運輸という運送会社を営んでいました。"
        reading: "ちちのやすおみわ、やまとうんゆといううんそうがいしゃをいとなんでいました。"
      - speaker: chichi
        emotion: happy
        text: "うちはな、トラックで物を運ぶ会社だ。"
      - speaker: zundamon
        emotion: normal
        text: "何を運ぶのだ。"
      - speaker: chichi
        emotion: normal
        text: "百貨店の品物だ。まとめて、決まった所へ。"
      - speaker: zundamon
        emotion: normal
        text: "……まとめて。"
      - speaker: tsumugi
        emotion: normal
        text: "これが当時の運送の形。大口の荷物を、決まったルートで運ぶ。"
      - speaker: zundamon
        emotion: normal
        text: "効率がいいのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。安定してるし、儲かる。"
      - speaker: zundamon
        emotion: happy
        text: "じゃあ何も問題ないぞ。"
      - speaker: tsumugi
        emotion: thinking
        text: "……その安定が、あとで足を引っぱるの。"
      - speaker: reimu
        text: "彼は東京高等学校を経て、東京帝国大学の経済学部に進みます。"
        reading: "かれわとうきょうこうとうがっこうをへて、とうきょうていこくだいがくのけいざいがくぶにすすみます。"
      - speaker: reimu
        text: "卒業は1947年。戦争が終わった二年後でした。"
        reading: "そつぎょうわせんきゅうひゃくよんじゅうななねん。せんそうがおわったにねんごでした。"
      - speaker: zundamon
        emotion: normal
        text: "父の会社に入るのだな。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。……でも、そのすぐあとで倒れるの。"
      - speaker: zundamon
        emotion: surprised
        text: "え。"

  - id: kekkaku
