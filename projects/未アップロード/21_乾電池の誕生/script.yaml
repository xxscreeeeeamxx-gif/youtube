# 乾電池を作った男・屋井[先蔵|さきぞう] 再現ドラマ・ミーム版
#
# == 裏取り済みの事実（出典: 国立科学博物館 理工電子資料館 / 国立公文書館「公文書にみる発明のチカラ」/
#    IEEE ETHW マイルストーン / 電気学会「でんきの礎」/ 東京理科大学 / 上山明博『白いツツジ』系）==
#
# ★通説の誤り3点（この動画で正しく描く）★
# 1. 受験したのは「東京物理学校」ではなく【東京職工学校】（後の東京工業大学）。
#    東京物理学校（現・東京理科大）は後年、実験所付属の職工として働き学んだ場所
# 2. 受験失敗は【2回】（3回ではない）。遅刻したのは2回目
# 3. 「特許を取れなかった」は誤り。乾電池の特許は【取っている】（特許第2086号）。
#    取れなかったのは「日本初の乾電池特許」の座
#
# - 生没: 1864年1月13日（文久3年12月5日）〜1927年6月1日・享年63
#   ※和暦をそのまま取って「1863年生まれ」と書く資料が多いので注意
# - 越後長岡の武士の家。6歳で父が死去し家が没落（単一出典・弱いので断定しない）
# - 1875年（13歳）東京・神田の時計店へ丁稚奉公→病気で2年余りで帰郷
# - 1877〜84年 長岡の時計店で7年の年季奉公
# - 東京職工学校を2度受験して失敗。2度目は「手元の時計では1分前なのに会場では5分遅刻」
#   と伝えられる（★一次史料なし・伝承。ナレで「伝えられています」と必ず添える）
# - 1885年（21歳）連続電気時計を発明。特許第1205号（出願1889/12/12・登録1891/5/21）
#   日本で最初の電気関係の特許とされる
# - 当時の湿電池（ルクランシェ電池等）の問題: 手入れが要る・薬液が沁みて金具が腐る・冬に凍る
# - 炭素棒にパラフィンを含浸させて腐食を封じ、金属ケースで包んだ＝乾電池
# - 発明年は1887年頃が通説だが1885年説・1889年説もあり、★国立科学博物館は
#   「発明年次を証明する明確な資料は確認できない」と明記→動画では年を断定しない
# - 特許: 屋井の出願1892/10/4→登録1893/11/21（第2086号）。
#   高橋市三郎は屋井より【11日遅く出願】したが【1か月以上早く登録】され第2062号を得た。
#   ★高橋を「横取りした悪人」に描かない。出願が5年遅れた屋井側の事情の話にする
# - 世界初論争: ドイツのガスナー（独特許1886年・米特許1887年）、デンマークのヘレセン（1887年）。
#   ★「屋井が世界初」と地の文で断定しない。「日本では世界初とされる」「独立にほぼ同時期に」まで
# - 1894年 日清戦争。厳寒の満洲で湿電池が凍る中、屋井乾電池が電信用に使われ成功
#   （電池工業会・国立公文書館・IEEEが揃って記述）。ただし
#   ★「満洲の勝利はひとえに乾電池のおかげ」という号外の文言は原資料未確認→「と伝えられる」
#   ★受注個数（500個/50個で資料が矛盾）と当時の価格は使わない
# - 1892年 帝国大学がシカゴ万博に出品した地震計に屋井乾電池が使われ注目される
# - 米国から模造品が逆輸入された
# - 1910年 合資会社屋井乾電池を設立。筒型金属ケースで現在の乾電池の形を確立
# - 1921年時点で浅草工場の年産20万個超（当時日本最大）
# - 1923年 関東大震災で全施設焼失→川崎に新工場を再建
# - 1927年6月1日 死去（胃がんと急性肺炎の併発）
# - 2014年 IEEEマイルストーン「日本の一次・二次電池産業の誕生と成長 1893」認定。
#   銘板は長岡市・東京理科大学近代科学資料館・GSユアサ・パナソニックへ
# - 東京理科大学近代科学資料館が屋井乾電池の実物を所蔵・展示
#
# == センシティブルール ==
# - 父の死・本人の死の場面はクリーン（ミーム・SE禁止）
# - 高橋市三郎は実在の技術者。悪役化・揶揄は禁止。事実（出願は屋井が先、登録は高橋が先）だけ描く
# - 「世界初」は断定しない。ナレは「日本では世界初とされます」「国際的にはドイツの
#   ガスナーが最初とされることが多い」と両論を出す
# - 遅刻の逸話は「伝えられています」で必ずヘッジする
meta:
  title: "5分の遅刻から始まった。凍らない電池を作った男【乾電池誕生・再現ドラマ・ミーム版】"
  slug: "yai-denchi"
  summary: "リモコンにもリチウムイオンにも先立つ、乾電池という発明。作ったのは越後長岡の没落士族の子、屋井先蔵という男でした。13歳で丁稚に出され、進学の道も断たれた青年が、冬になると凍ってしまう当時の電池に挑みます。日本では世界初とも語られる発明の裏で、彼が5年間できなかったこととは。ずんだもんが屋井先蔵を演じる再現ドラマです。"
  tags: ["乾電池", "屋井[先蔵|さきぞう]", "発明", "明治", "再現ドラマ", "ゆっくり", "ずんだもん", "ミーム"]
  thumbnail:
    top: "5分の遅刻から"
    bottom: "凍らない電池"
  mode: drama
  narrator: reimu
  mobs:
    - {id: tokei, label: "時計店主", voice: 42, pitch: 0.0}
    - {id: shiken, label: "試験官", voice: 13, pitch: -0.06, item: hat}
    - {id: haha, label: "母", voice: 8, pitch: 0.04, hair: bun}
    - {id: gunjin, label: "陸軍の男", voice: 13, pitch: 0.05, item: hat}
    - {id: shokko, label: "職工", voice: 12, pitch: 0.0}
scenes:
  # ============ 茶番フック ============
  - id: hook
    title: ""
    background: il_yi_room
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: zundamon
        emotion: angry
        text: "つむぎ、大変なのだ。テレビが言うことを聞かないぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "リモコン、電池切れじゃない？"
      - speaker: zundamon
        emotion: happy
        text: "そんなときは、こうするのだ。"
      - speaker: zundamon
        emotion: happy
        text: "電池を取り出して、手のひらでコロコロ転がすぞ。"
      - speaker: tsumugi
        emotion: surprised
        text: "おばあちゃんの知恵みたいなことするじゃん。"
      - speaker: zundamon
        emotion: happy
        text: "ほら、ついた。ボクの手には電力があるのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "それ[手|て]じゃなくて、接点が動いて一瞬つながっただけだからね。"
      - speaker: zundamon
        emotion: normal
        text: "夢のない解説をありがとうなのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "ところでずんだもん、その筒、何本持ってる？"
      - speaker: zundamon
        emotion: thinking
        text: "リモコンに2本、時計に1本、ゲームのコントローラーに2本……。"
      - speaker: zundamon
        emotion: surprised
        text: "家じゅうにいるじゃないか。実質、[同居人|どうきょにん]なのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "その[同居人|どうきょにん]の元祖を作った日本人がいるんだよ。"
      - speaker: zundamon
        emotion: thinking
        text: "電池って、外国の発明じゃないのか？"
      - speaker: tsumugi
        emotion: normal
        text: "電池そのものはね。でも、持ち歩ける乾いた電池を作った一人が日本にいたの。"
      - speaker: tsumugi
        emotion: normal
        text: "しかもその人、5分の遅刻で人生が変わったと言われてる。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "5分！？電池の話じゃなかったのか！"
      - speaker: tsumugi
        emotion: happy
        text: "そこから始まる話なの。聞いてみる？"
      - speaker: zundamon
        emotion: happy
        text: "聞くのだ。電池が切れるまで聞くぞ。"
  # ============ 1864 年号カード ============
  - id: era1864
    title: ""
    background: il_yi_nagaoka
    bgm: pastel_house
    cuts:
      - speaker: reimu
        reading: "ゆきぐにの えちご ながおか。ぶしの いえに ひとりの おとこのこが うまれました。"
        text: "雪国の越後長岡。武士の家に、一人の男の子が生まれました。"
        video: assets/clips/yi_era1864.mp4
        video_full: true
        video_span: 2
      - speaker: reimu
        reading: "せんはっぴゃくろくじゅうよねん いちがつ。なまえわ やい さきぞう。"
        text: "1864年1月。名前は、屋井[先蔵|さきぞう]。"
  # ============ 幼少期・父の死（クリーン）============
  - id: youth
    title: "1870年代・越後長岡"
    background: il_yi_nagaoka
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.3, flip: true, scale: 0.78, tag: "先蔵"}
      - {who: haha, x: 0.74}
    cuts:
      - speaker: reimu
        reading: "さきぞうが むっつの ころ、ちちが なくなったと つたえられます。"
        text: "[先蔵|さきぞう]が6つのころ、父が亡くなったと伝えられます。"
      - speaker: haha
        emotion: sad
        text: "[先蔵|さきぞう]。これからは、二人で生きていくのよ。"
      - speaker: zundamon
        emotion: sad
        text: "……うん。"
      - speaker: haha
        emotion: sad
        text: "[先蔵|さきぞう]。この家は、もう出なければならないの。"
      - speaker: zundamon
        emotion: surprised
        text: "どうしてなのだ。父上の家だぞ。"
      - speaker: haha
        emotion: sad
        text: "刀を差していれば食べられた時代は、終わったのよ。"
      - speaker: zundamon
        emotion: thinking
        text: "……侍は、もう仕事じゃないのか。"
      - speaker: haha
        emotion: normal
        text: "これからは、手に職のある人が強いのですって。"
      - speaker: zundamon
        emotion: normal
        text: "手に職。……ボクにも、持てるだろうか。"
      - speaker: reimu
        reading: "おやこわ おじの もとに ひきとられました。"
        text: "親子は叔父のもとに引き取られました。"
      - speaker: reimu
        reading: "そして じゅうさんさいの はる。さきぞうわ ひとりで とうきょうえ むかいます。"
        text: "そして13歳の春。[先蔵|さきぞう]は一人で東京へ向かいます。"
      - speaker: haha
        emotion: normal
        text: "神田の時計屋さんが、預かってくださるそうよ。"
      - speaker: zundamon
        emotion: normal
        text: "……時計屋。ボク、機械はきらいじゃないぞ。"
      - speaker: haha
        emotion: sad
        text: "体だけは、こわさないでね。"
      - speaker: zundamon
        emotion: normal
        text: "行ってくるのだ。"
  # ============ 丁稚時代 ============
  - id: decchi
    title: "1875・神田の時計店"
    background: il_yi_tokeiten
    bgm: curious
    stage:
      - {who: zundamon, x: 0.3, flip: true, scale: 0.82, tag: "先蔵"}
      - {who: tokei, x: 0.74}
    cuts:
      - speaker: reimu
        reading: "めいじはちねん。とうきょう かんだの とけいてんに、でっちとして はいります。"
        text: "明治8年。東京・神田の時計店に、丁稚として入ります。"
      - speaker: tokei
        emotion: normal
        text: "小僧。まずは掃除と使い走りじゃ。機械にはまだ触らせん。"
      - speaker: zundamon
        emotion: normal
        text: "はい。……いつになったら触れるんだ？"
      - speaker: tokei
        emotion: angry
        text: "口より手を動かせ。三年は下働きじゃ。"
      - speaker: zundamon
        emotion: sad
        text: "三年……修行の道のりが長すぎるぞ。"
      - speaker: tokei
        emotion: normal
        text: "小僧、水を汲んでこい。それが終わったら炭だ。"
      - speaker: zundamon
        emotion: normal
        text: "はい。……親方、その机の上のは何ですか。"
      - speaker: tokei
        emotion: normal
        text: "分解した懐中時計じゃ。触るなよ。"
      - speaker: zundamon
        emotion: normal
        text: "触りません。見るだけなのだ。"
      - speaker: tokei
        emotion: angry
        text: "見るのも仕事の邪魔じゃ。行け。"
      - speaker: reimu
        reading: "それでも さきぞうわ、しごとの あいまに ぶんかいされた とけいを ながめつづけました。"
        text: "それでも[先蔵|さきぞう]は、仕事の合間に分解された時計を眺め続けました。"
      - speaker: zundamon
        emotion: thinking
        text: "……歯車が、こっちを回して、あっちが止まる。"
      - speaker: zundamon
        emotion: happy
        text: "分かったぞ。時計は、規則正しい歯車の会議だ。"
      - speaker: tokei
        emotion: surprised
        text: "小僧、なぜそれを知っとる。教えとらんぞ。"
      - speaker: zundamon
        emotion: happy
        text: "見てたら分かったぞ。"
      - speaker: tokei
        emotion: normal
        text: "……妙な小僧じゃ。"
      - speaker: reimu
        reading: "しかし にねんあまりで びょうきに たおれ、ながおかえ かえることに なります。"
        text: "しかし2年あまりで病気に倒れ、長岡へ帰ることになります。"
      - speaker: zundamon
        emotion: sad
        text: "せっかく、機械に触れそうだったのに……。"
  # ============ 長岡での修業 ============
  - id: shugyo
    title: "1877・長岡で7年"
    background: il_yi_tokeiten
    bgm: you_and_me
    stage:
      - {who: zundamon, x: 0.3, flip: true, scale: 0.9, tag: "先蔵"}
      - {who: tokei, x: 0.74}
    cuts:
      - speaker: reimu
        reading: "ながおかの とけいてんで、こんどわ しゅうりこうとして ななねん。"
        text: "長岡の時計店で、今度は修理工として7年。"
      - speaker: tokei
        emotion: normal
        text: "この柱時計、また遅れとると苦情が来た。直せるか。"
      - speaker: zundamon
        emotion: normal
        text: "任せるのだ。……ふむ。ゼンマイの力が弱っているぞ。"
      - speaker: zundamon
        emotion: thinking
        text: "巻きたてはよく進んで、ほどけてくると遅れる。"
      - speaker: tokei
        emotion: normal
        text: "そういうもんじゃ。毎朝きっちり巻けばよい。"
      - speaker: zundamon
        emotion: thinking
        text: "でも親方。それって、時計が悪いんじゃなくて仕組みが悪いんじゃないか？"
      - speaker: tokei
        emotion: surprised
        text: "……なんじゃと？"
      - speaker: zundamon
        emotion: normal
        text: "力が弱っていくものを、力の元にしてるのがおかしいのだ。"
      - speaker: tokei
        emotion: angry
        text: "口の減らん男になったのう。二百年そうやって動いとるわ。"
      - speaker: zundamon
        emotion: normal
        text: "二百年おかしいままなら、二百年ぶんの改善余地があるってことだ。"
      - speaker: reimu
        reading: "ぜんまいで うごく とけいわ、まくたびに ちからが かわり、じかんが ずれる。"
        text: "ゼンマイで動く時計は、巻くたびに力が変わり、時間がずれる。"
      - speaker: reimu
        reading: "このころの まちの とけいわ、いえごとに ばらばらの じこくを さしていました。"
        text: "このころの街の時計は、家ごとにばらばらの時刻を指していました。"
      - speaker: zundamon
        emotion: thinking
        text: "……ずれない時計が、あればいいのだ。"
  # ============ 1884 年号カード ============
  - id: era1884
    title: ""
    background: il_yi_school
    bgm: serious
    cuts:
      - speaker: reimu
        reading: "めいじじゅうしちねん。にじゅっさいの さきぞうわ、もういちど とうきょうえ むかいます。"
        text: "明治17年。20歳の[先蔵|さきぞう]は、もう一度東京へ向かいます。"
        video: assets/clips/yi_era1884.mp4
        video_full: true
  # ============ 受験失敗（伝承としてヘッジ）============
  - id: juken
    title: "5分の遅刻"
    background: il_yi_school
    bgm: kinakusai
    stage:
      - {who: zundamon, x: 0.3, flip: true, tag: "先蔵"}
      - {who: shiken, x: 0.74}
    cuts:
      - speaker: reimu
        reading: "めざしたのわ、とうきょう しょっこう がっこう。のちの とうきょう こうぎょう だいがくです。"
        text: "目指したのは、東京職工学校。のちの東京工業大学です。"
      - speaker: zundamon
        emotion: normal
        text: "ここで[学|まな]べば、機械を一から作れるようになるはずだ。"
      - speaker: reimu
        reading: "しかし いちどめの じゅけんわ、ふごうかくに おわります。"
        text: "しかし一度目の受験は、不合格に終わります。"
      - speaker: zundamon
        emotion: sad
        text: "……独学の限界か。来年、もう一度やるぞ。"
      - speaker: reimu
        reading: "そして にどめの しけんの ひ。"
        text: "そして二度目の試験の日。"
      - speaker: zundamon
        emotion: happy
        text: "よし、間に合ったぞ。ボクの時計では、まだ1分前だ。"
      - speaker: shiken
        emotion: normal
        text: "締め切りだ。門を閉めろ。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "待つのだ！まだ時間前だぞ！"
      - speaker: shiken
        emotion: normal
        text: "こちらの時計では、5分過ぎている。"
      - speaker: zundamon
        emotion: surprised
        text: "5分！？そんなはずは……。"
      - speaker: shiken
        emotion: normal
        text: "規則は規則だ。来年また来なさい。"
      - speaker: zundamon
        emotion: sad
        text: "……ボクの時計は、間違っていたのか。"
      - speaker: reimu
        reading: "この えぴそーどわ、いちじ しりょうで かくにんできる ものでわ ありません。"
        text: "このエピソードは、一次史料で確認できるものではありません。"
      - speaker: reimu
        reading: "のちに かたられる でんしょうとして、ひろく しられている はなしです。"
        text: "のちに語られる伝承として、広く知られている話です。"
      - speaker: reimu
        reading: "たしかなのわ、さきぞうが にど しっぱいし、しんがくの みちが とざされたこと。"
        text: "確かなのは、[先蔵|さきぞう]が二度失敗し、進学の道が閉ざされたこと。"
      - speaker: zundamon
        emotion: sad
        text: "……もう、受けられないのだ。"
      - speaker: reimu
        reading: "がっこうえの みちわ、とざされました。"
        text: "学校への道は、閉ざされました。"
  # ============ 決意 ============
  - id: ketsui
    title: ""
    background: il_yi_room
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.3, flip: true, tag: "先蔵"}
      - {who: tsumugi, x: 0.74, tag: "下宿の人"}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "屋井さん、ずっと部屋にこもってるけど、大丈夫？"
      - speaker: zundamon
        emotion: normal
        text: "考えてたのだ。なぜ、あの5分が生まれたのか。"
      - speaker: tsumugi
        emotion: thinking
        text: "そりゃあ、時計が合ってなかったんでしょ。"
      - speaker: zundamon
        emotion: normal
        text: "そうだ。でも、どっちが合ってたと思う？"
