        text: "液がむき出しでない乾電池は、凍らずに電気を送り続けました。"
      - speaker: reimu
        reading: "この ことわ ごうがいで ほうじられ、しんぶんが やいの せいひんだと つきとめたと つたえられています。"
        text: "このことは号外で報じられ、新聞が屋井の製品だと突き止めたと伝えられています。"
  - id: goukai
    title: ""
    background: il_yi_koba
    bgm: you_and_me
    stage:
      - {who: zundamon, x: 0.3, flip: true, tag: "先蔵"}
      - {who: shokko, x: 0.74}
    cuts:
      - speaker: shokko
        emotion: surprised
        text: "屋井さん、新聞！屋井さんの名前が出てます！"
      - speaker: zundamon
        emotion: surprised
        text: "ボクの名前が、新聞に出てるのだ！？"
      - speaker: shokko
        emotion: happy
        text: "満洲で使われた電池は、東京の屋井の品だ、と。"
      - speaker: zundamon
        emotion: normal
        text: "……冬に負けない電池を作れと、あの5分が言ってたんだ。"
      - speaker: shokko
        emotion: thinking
        text: "また5分の話ですか。"
      - speaker: zundamon
        emotion: happy
        text: "一生言うと決めてるのだ。"
      - speaker: reimu
        reading: "むめいの しょっこうの なまえが、いっきに しられる ように なりました。"
        text: "無名の職工の名前が、一気に知られるようになりました。"
  # ============ 逆輸入の模造品 ============
  - id: mozo
    title: "海を渡った模造品"
    background: il_yi_koba
    bgm: kinakusai
    stage:
      - {who: zundamon, x: 0.3, flip: true, tag: "先蔵"}
      - {who: shokko, x: 0.74}
    cuts:
      - speaker: shokko
        emotion: surprised
        text: "屋井さん、これ見てくれ。アメリカから入ってきた電池だ。"
      - speaker: zundamon
        emotion: thinking
        text: "……どれ。"
      - speaker: zundamon
        emotion: angry
        se: don
        text: "これ、ボクのじゃないか！形も中身もそっくりだぞ！"
      - speaker: shokko
        emotion: sad
        text: "海の向こうで真似されて、それが日本に売られてるんだ。"
      - speaker: zundamon
        emotion: angry
        text: "自分の発明の模造品を、輸入品として買う国。世界一の実質無料奉仕だぞ。"
      - speaker: shokko
        emotion: normal
        text: "怒っていいところだぞ、それ。"
      - speaker: reimu
        reading: "べいこくで つくられた もぞうひんが、にほんに ぎゃくゆにゅうされていました。"
        text: "米国で作られた模造品が、日本に逆輸入されていました。"
      - speaker: zundamon
        emotion: normal
        text: "……真似されるということは、いい物だという証拠でもあるのだ。"
      - speaker: shokko
        emotion: surprised
        text: "前向きすぎないか！？"
      - speaker: zundamon
        emotion: happy
        text: "泣いてる[暇|ひま]があったら、もっといい物を作るのだ。"
  # ============ 1910 年号カード ============
  - id: era1910
    title: ""
    background: il_yi_kojo
    bgm: you_and_me
    cuts:
      - speaker: reimu
        reading: "せんきゅうひゃくじゅうねん。ごうしがいしゃ やい かんでんちが せつりつされます。"
        text: "1910年。合資会社屋井乾電池が設立されます。"
        video: assets/clips/yi_era1910.mp4
        video_full: true
  # ============ 会社・筒の形 ============
  - id: kaisha
    title: "いまの形になるまで"
    background: il_yi_kojo
    bgm: you_and_me
    stage:
      - {who: zundamon, x: 0.3, flip: true, tag: "先蔵"}
      - {who: shokko, x: 0.74}
    cuts:
      - speaker: shokko
        emotion: normal
        text: "社長、新しい形の試作ができました。"
      - speaker: zundamon
        emotion: happy
        text: "見せてみろ。……ふむ。筒か。"
      - speaker: shokko
        emotion: normal
        text: "四角より、金属の筒で包んだほうが丈夫で、詰めやすいです。"
      - speaker: zundamon
        emotion: happy
        text: "持ちやすいし、転がしても平気だ。これでいこう。"
      - speaker: reimu
        reading: "きんぞくの つつで つつむ かたち。いま わたしたちが しっている かんでんちの すがたです。"
        text: "金属の筒で包む形。いま私たちが知っている乾電池の姿です。"
      - speaker: shokko
        emotion: happy
        text: "工場も手狭になってきました。注文が止まりません。"
      - speaker: zundamon
        emotion: happy
        text: "あの時計を作ったときは、一人だったのになあ。"
      - speaker: reimu
        reading: "あさくさの こうじょうわ、たいしょうじゅうねんの じてんで ねんかん にじゅうまんこ いじょうを つくる、とうじ にほん さいだいの きぼに なっていました。"
        text: "浅草の工場は、大正10年の時点で年間20万個以上を作る、当時日本最大の規模になっていました。"
        stat: {value: 20, unit: "万個", label: "年間生産数・1921年"}
      - speaker: zundamon
        emotion: happy
        text: "20万個！？ボクの手はもう追いつかないぞ。"
      - speaker: reimu
        reading: "ひとびとわ さきぞうを、かんでんち おうと よぶように なります。"
        text: "人々は[先蔵|さきぞう]を、乾電池王と呼ぶようになります。"
      - speaker: zundamon
        emotion: happy
        text: "王だそうだ。5分で門前払いされた男が、王なのだ。"
      - speaker: shokko
        emotion: happy
        text: "その5分、いつまで言うんですか。"
      - speaker: zundamon
        emotion: normal
        text: "一生言うぞ。あれが無ければ、ボクは何も作ってない。"
  # ============ 震災（クリーン寄り）============
  - id: shinsai
    title: "1923・すべて焼ける"
    background: il_yi_kojo
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.3, flip: true, tag: "先蔵"}
      - {who: shokko, x: 0.74}
    cuts:
      - speaker: reimu
        reading: "たいしょうじゅうにねん くがつ。かんとう だいしんさい。"
        text: "大正12年9月。関東大震災。"
      - speaker: reimu
        reading: "とうきょうの しせつわ、すべて うしなわれました。"
        text: "東京の施設は、すべて失われました。"
      - speaker: shokko
        emotion: sad
        text: "社長……工場も、機械も、何も残っていません。"
      - speaker: zundamon
        emotion: sad
        text: "……そうか。"
      - speaker: zundamon
        emotion: normal
        text: "みんなは無事か。"
      - speaker: shokko
        emotion: normal
        text: "はい。みんな、生きています。"
      - speaker: zundamon
        emotion: normal
        text: "なら、また作れる。"
      - speaker: shokko
        emotion: surprised
        text: "また、一からですか。"
      - speaker: zundamon
        emotion: normal
        text: "ボクは一からしかやったことがないのだ。"
      - speaker: reimu
        reading: "かわさきに あたらしい こうじょうが たてられ、せいさんわ さいかいされました。このとき、さきぞうわ ごじゅうきゅうさいでした。"
        text: "川崎に新しい工場が建てられ、生産は再開されました。このとき、[先蔵|さきぞう]は59歳でした。"
  # ============ 晩年・死（完全クリーン）============
  - id: bannen
    title: ""
    background: il_yi_room
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.3, flip: true, tag: "先蔵"}
      - {who: tsumugi, x: 0.74, tag: "妻"}
    cuts:
      - speaker: tsumugi
        emotion: normal
        text: "あなた、少し休んだら。"
      - speaker: zundamon
        emotion: normal
        text: "もう少しだけ、この試作を見ておきたい。"
      - speaker: tsumugi
        emotion: normal
        text: "五十年、そればっかりね。"
      - speaker: zundamon
        emotion: normal
        text: "……そうだな。"
      - speaker: zundamon
        emotion: normal
        text: "冬に凍らない電池を作ろうと思っただけで、ここまで来たのだ。"
      - speaker: reimu
        reading: "しょうわ にねん ろくがつ ついたち。やい さきぞうわ、ろくじゅうさんさいで この よを さりました。"
        text: "昭和2年6月1日。屋井[先蔵|さきぞう]は、63歳でこの世を去りました。"
      - speaker: reimu
        reading: "あの ごふんの ちこくから、よんじゅうねんあまりが たっていました。"
        text: "あの5分の遅刻から、40年あまりが経っていました。"
  # ============ 現代へ ============
  - id: gendai
    title: "そして現代へ"
    background: il_yi_gendai
    bgm: pastel_house
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: reimu
        reading: "やい かんでんちわ、せんきゅうひゃくよんじゅうごねんの しゅうせんごに すがたを けしました。"
        text: "屋井乾電池は、1945年の終戦後に姿を消しました。"
      - speaker: zundamon
        emotion: sad
        text: "会社は、残らなかったのか……。"
      - speaker: tsumugi
        emotion: normal
        text: "うん。でも、形は残ったよ。"
      - speaker: tsumugi
        emotion: normal
        text: "あなたが今日コロコロ転がしてた、その筒。"
      - speaker: zundamon
        emotion: surprised
        text: "……これが、あの人の形なのだ？"
      - speaker: zundamon
        emotion: thinking
        text: "会社が消えたのに、形だけ生き残るって、変な話なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "作った人の名前を知らなくても、みんな使ってるからね。"
      - speaker: zundamon
        emotion: normal
        text: "……それはそれで、いい発明の証拠かもしれないぞ。"
      - speaker: reimu
        reading: "にせんじゅうよねん。あいとりぷるいーの まいるすとーんに、にほんの でんち さんぎょうの たんじょうが にんていされました。"
        text: "2014年。IEEEのマイルストーンに、日本の電池産業の誕生が認定されました。"
      - speaker: reimu
        reading: "めいばんわ、しゅっしんちの ながおかしと、まなびの ばだった とうきょう りか だいがくなどに おくられています。"
        text: "銘板は、出身地の長岡市と、学びの場だった東京理科大学などに贈られています。"
      - speaker: zundamon
        emotion: normal
        text: "受験に落ちた男が、学校に飾られてるぞ。"
      - speaker: tsumugi
        emotion: happy
        text: "しかも、その人が入れなかったほうじゃない学校でね。"
      - speaker: zundamon
        emotion: normal
        text: "……人生、どこで拾われるか分からないな。"
      - speaker: reimu
        reading: "とうきょう りか だいがくの しりょうかんにわ、やい かんでんちの じつぶつが いまも のこされています。"
        text: "東京理科大学の資料館には、屋井乾電池の実物が今も残されています。"
  # ============ 締め ============
  - id: musubi
    title: ""
    background: il_yi_room
    bgm: warm
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
