      - speaker: tsumugi
        emotion: normal
        text: "使い切ったならね。ちゃんと分別してね。"
      - speaker: zundamon
        emotion: normal
        text: "捨てる前に、ちょっと持っておきたくなったのだ。"
      - speaker: tsumugi
        emotion: happy
        text: "気持ちは分かるよ。しょうがないで止まらなかった人の形だもんね。"
      - speaker: zundamon
        emotion: normal
        text: "冬は凍る、手入れが要る、みんなそう言ってたのだ。"
      - speaker: zundamon
        emotion: normal
        text: "そこで一人だけ、しょうがなくないって言ったんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "あなたの家の不便も、誰かのしょうがないで止まってるかもよ。"
      - speaker: zundamon
        emotion: happy
        text: "じゃあボクは、リモコンが行方不明になる問題を解決するのだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "それは置き場所を決めるだけで解決するからね！？"
      - speaker: zundamon
        emotion: happy
        text: "発明の前に、片付けなのだ……。"
      - speaker: tsumugi
        emotion: happy
        text: "面白かったら、高評価とチャンネル登録で応援してね。"
      - speaker: zundamon
        emotion: happy
        text: "コメントで、あなたの家の不便も教えてほしいぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "それでは、また次の動画で。"
      - speaker: tsumugi
        emotion: happy
        duet_with: zundamon
        text: "ご視聴、ありがとうございました！"
