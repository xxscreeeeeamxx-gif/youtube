# カラオケを産業にした男・井上大佑 再現ドラマ・ミーム版
#
# == 裏取り済みの事実（出典: 本人回想The Appendix2005 / SCMP2020 / WIPO / Improbable Research /
#    コトバンク / カラオケ白書2024。詳細URLはリサーチ記録参照）==
# - 1940年5月10日 大阪・十三生まれ。本名は祐輔。幼少期の大けがの後、僧侶が「大佑(大きな助け)」に改名
# - ドラム担当。楽譜は読めず「ドラムなら叩けばいいだけ」(本人談)。プロで約9年
# - 神戸のクラブでサラリーマン客の歌の伴奏。客のキーに合わせる職人芸
# - 転機: 得意客の社長が旅行先で歌うため、伴奏テープを吹き込んで渡した(1970年ごろ)
# - 1971年「8JUKE」を11台製作(8トラックカーステレオ+アンプ+マイク+コインボックス+エコー)
#   100円で5分(本人談)。曲庫は約300曲、月8曲追加。レンタル方式で1年で神戸約200店→累計約2万5000台
# - 特許は取らなかった。本人の弁「私は発明家ではない。既にある物を組み合わせただけ」
#   「特許を取っていたらカラオケはここまで広がらなかったと思う。後悔していない」
#   逃した額は「年1億ドル超」ともいわれる(SCMP2020の推計。累計◯兆円という出典は無いので使わない)
# - 「カラオケ」の語源は放送業界の「空(から)オーケストラ」(一説。井上の造語ではない)
# - 先行発明者が複数実在: 根岸重一(1967年スパルコボックス、2024年に100歳で死去)ら。
#   自称発明者は約20人(烏賀陽弘道『カラオケ秘史』)。井上は「産業にして広めた人」
# - カラオケボックスは井上の事業ではない(1985年・岡山が通説)→本作では触れない
# - 1990年前後に体調を崩し一線を退いた時期がある(クリーン1行のみ・ミーム禁止)
# - 1993年 カラオケ機の配線をかじるゴキブリ・ネズミの駆除剤を開発、これは特許制度を利用
# - 1999年 TIMEアジア版「今世紀最も影響力のあったアジアの20人」(毛沢東・ガンジー・黒澤明らと)
# - 2004年 イグノーベル平和賞。受賞理由「カラオケの発明により、人々が互いに寛容になる
#   まったく新しい方法を提供した」。観客約1100人、ノーベル賞受賞者3人がセレナーデ、
#   本人の歌にイグノーベル史上最長といわれるスタンディングオベーション
# - 2023年度の国内カラオケ市場は約4430億円・カラオケボックス8298店(カラオケ白書2024)
#
# == センシティブルール ==
# - 井上大佑さんは存命。本人が公開の場で笑い話にしているエピソード(特許・下手なドラム・熱唱)だけを
#   描き、本人を嘲笑するミームは入れない(ずんだもん・つむぎのリアクション側で笑いを取る)
# - 「カラオケの発明者」と単独断定しない。「産業にした男」+本人の「私は発明家ではない」を軸にする
# - 先行者(根岸重一さんら)の場面はクリーン(ミーム禁止)。故人と遺族への敬意を保つ
# - 体調を崩した時期はクリーン1行のみ。ミーム・SE禁止
meta:
  title: "手作りの11台で世界を変え、特許を取らなかった男【カラオケ誕生・再現ドラマ・ミーム版】"
  slug: "karaoke"
  summary: "カラオケを産業にした男、井上大佑の物語。大阪・十三に生まれ、楽譜の読めないドラマーとして神戸のクラブでサラリーマンの歌を支え、1971年、伴奏テープの機械「8JUKE」を11台手作りした。特許は取らず、機械はレンタルで神戸のスナックから世界へ。逃した特許料は年1億ドル超ともいわれるが、本人は「特許を取っていたらここまで広がらなかった」と笑う。1999年タイム誌のアジアの20人、2004年イグノーベル平和賞、ハーバードの講堂1100人のスタンディングオベーションまで、ずんだもんが井上を演じる再現ドラマ・ミーム版でお届けします。"
  tags: ["カラオケ", "井上大佑", "イグノーベル賞", "再現ドラマ", "ゆっくり", "ずんだもん", "昭和", "ミーム"]
  thumbnail:
    top: "特許を取らなかった"
    bottom: "カラオケの父"
  mode: drama
  narrator: reimu
  mobs:
    - {id: shacho, label: "社長", voice: 13, pitch: -0.06, item: hat}
    - {id: nakama, label: "バンド仲間", voice: 12, pitch: 0.0}
    - {id: osho, label: "和尚", voice: 42, pitch: 0.0}
    - {id: mama, label: "ママ", voice: 8, pitch: 0.06, hair: bun}
scenes:
  # ============ 茶番フック: 現代のカラオケボックス ============
  - id: hook
    title: ""
    background: il_ka_box
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: zundamon
        emotion: happy
        text: "採点97点！今日のボクは優勝なのだ！"
      - speaker: tsumugi
        emotion: normal
        text: "すごいじゃん。で、それ何曲目？"
      - speaker: zundamon
        emotion: happy
        text: "21曲目だ。喉が仕上がってきたぞ。"
      - speaker: tsumugi
        emotion: surprised
        text: "仕上がる前に閉店するよ。もう3時間経ってるからね。"
      - speaker: zundamon
        emotion: happy
        text: "ヒトカラは時間が溶けるのだ。実質タイムマシンだ。"
      - speaker: tsumugi
        emotion: normal
        text: "溶けてるのはお小遣いだよ。ドリンクバーも3杯目でしょ。"
      - speaker: zundamon
        emotion: happy
        text: "歌ってストレス発散、毎日カラオケ健康生活なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "昨日も一昨日も来てたもんね。その健康、偏ってない？"
      - speaker: zundamon
        emotion: thinking
        text: "むむ。じゃあ明日は歌わずに、静かに過ごすぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "えらい。何するの？"
      - speaker: zundamon
        emotion: happy
        text: "家で採点アプリの練習だ。[明後日|あさって]の本番に備えるんだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "それ休みじゃなくて[自主練|じしゅれん]だからね！？"
      - speaker: zundamon
        emotion: happy
        text: "ところでこの機械、押せば伴奏が出てくる。天才の発明なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "その機械をね、最初に商売にした人がいるんだけど。"
      - speaker: tsumugi
        emotion: normal
        text: "特許を取らなくて、世界中で使われてるのに1円も入ってないの。"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "世界中で使われて0円！？計算が合わないのだ！"
      - speaker: tsumugi
        emotion: happy
        text: "しかも本人は、後悔してないって笑ってるんだよね。"
      - speaker: zundamon
        emotion: thinking
        text: "どういうメンタルだ……その人の話、詳しく聞かせてほしいのだ。"
  # ============ 1940 年号カード ============
  - id: era1940
    title: ""
    background: il_ka_juso
    bgm: pastel_house
    cuts:
      - speaker: reimu
        reading: "かたやきそばいっちょう。おおさかわ じゅうそうの しょくどうがいにそのこわ うまれました。"
        text: "かた焼きそば、一丁。大阪は十三の食堂街に、その子は生まれました。"
        video: assets/clips/ka_era1940.mp4
        video_full: true
        video_span: 2
      - speaker: reimu
        reading: "せんきゅうひゃくよんじゅうねん ごがつとおか。なまえわ いのうえ ゆうすけ。のちの いのうえ だいすけです。"
        text: "1940年5月10日。名前は井上祐輔。のちの井上大佑です。"
  # ============ 幼少期: 名前の由来 ============
  - id: youth
    title: "1940・大阪十三"
    background: il_ka_juso
    stage:
      - {who: zundamon, x: 0.3, flip: true, scale: 0.8, tag: "祐輔"}
      - {who: osho, x: 0.74}
    cuts:
      - speaker: reimu
        reading: "やんちゃな ゆうすけしょうねんわ、あるひ おおけがを してしまいます。"
        text: "やんちゃな祐輔少年は、ある日大けがをしてしまいます。"
      - speaker: osho
        emotion: normal
        text: "この子の名前を、変えなさい。"
      - speaker: zundamon
        emotion: surprised
        text: "ボクの名前、変わっちゃうのだ！？"
      - speaker: osho
        emotion: normal
        text: "大きな助けと書いて、[大佑|だいすけ]。人を助ける名前じゃ。"
      - speaker: zundamon
        emotion: thinking
        text: "だいすけ……なんか強そうだから、まあいいのだ。"
      - speaker: reimu
        reading: "おてらの おしょうさんの ひとことでなまえわ だいすけに。ほんにんが のちに かたっているじつわです。"
        text: "お寺の和尚さんの一言で、名前は大佑に。本人がのちに語っている実話です。"
      - speaker: reimu
        reading: "おおきなたすけ という なまえわ、ごじゅうねんごに せかいじゅうの うたごえを たすけることに なります。"
        text: "大きな助けという名前は、50年後に世界中の歌声を助けることになります。"
  # ============ 1956 年号カード ============
  - id: era1956
    title: ""
    background: il_ka_club
    bgm: you_and_me
    cuts:
      - speaker: reimu
        reading: "せんきゅうひゃくごじゅうろくねん。じゅうろくさいの だいすけわバンドで ドラムを たたいていました。"
        text: "1956年。16歳の大佑は、バンドでドラムを叩いていました。"
        video: assets/clips/ka_era1956.mp4
        video_full: true
  # ============ バンド時代 ============
  - id: band
    title: "1956・ドラム少年"
    background: il_ka_club
    stage:
      - {who: zundamon, x: 0.3, flip: true, scale: 0.9, tag: "井上"}
      - {who: nakama, x: 0.74}
    cuts:
      - speaker: nakama
        emotion: normal
        text: "おい[井上|いのうえ]、なんでドラム希望なんだ？"
      - speaker: zundamon
        emotion: happy
        text: "ボク、楽譜が読めないのだ。"
      - speaker: nakama
        emotion: surprised
        text: "威張って言うことか！？"
      - speaker: zundamon
        emotion: happy
        text: "でもドラムなら、[叩|たた]けばいいだけだ。頭脳プレーだぞ。"
      - speaker: nakama
        emotion: angry
        text: "それは頭脳を使ってないって言うんだよ！"
      - speaker: reimu
        reading: "がくふわ よめない。それでも リズムかんと あいきょうで、プロの ドラマーとして やく くねん。"
        text: "楽譜は読めない。それでもリズム感と愛嬌で、プロのドラマーとして約9年。"
      - speaker: zundamon
        emotion: happy
        text: "音楽は理論じゃなくて、ノリだ。"
      - speaker: nakama
        emotion: normal
        text: "お前のそういうとこ、嫌いじゃないぜ。"
      - speaker: reimu
        reading: "キャバレーに ダンスホール。うたと えんそうがよるの まちの ごちそうだった じだいです。"
        text: "キャバレーにダンスホール。歌と演奏が、夜の街のごちそうだった時代です。"
      - speaker: zundamon
        emotion: normal
        text: "テレビより、[生|なま]の音楽の時代。ボクらが夜のBGM係というわけだ。"
  # ============ 神戸のクラブ: 伴奏職人 ============
  - id: kobe
    title: "1960年代・神戸のクラブ"
    background: il_ka_club
    bgm: curious
    stage:
      - {who: zundamon, x: 0.28, flip: true, tag: "井上"}
      - {who: shacho, x: 0.76}
      - {who: nakama, x: 0.55}
    cuts:
      - speaker: reimu
        reading: "にじゅうはっさいの だいすけわこうべの クラブに いました。しごとわおきゃくの うたの ばんそうです。"
        text: "28歳の大佑は、神戸のクラブにいました。仕事は、お客の歌の伴奏です。"
      - speaker: shacho
        emotion: happy
        text: "[井上|いのうえ]くん！今夜もあれ、頼むで！"
      - speaker: zundamon
        emotion: happy
        text: "社長の[十八番|おはこ]、了解だ。キーは低めで合わせるぞ。"
      - speaker: reimu
        reading: "じょうれんの しゃちょうわうたが だいすき。ただし おんていわかなり じゆうでした。"
        text: "常連の社長は、歌が大好き。ただし音程は、かなり自由でした。"
      - speaker: nakama
        emotion: thinking
        text: "なあ、社長の歌、今日も音を外してないか。"
      - speaker: zundamon
        emotion: normal
        text: "いいんだ。外れたら、こっちが合わせにいく。"
      - speaker: nakama
        emotion: surprised
        text: "伴奏が歌に寄せるのか！？逆だろ普通！"
      - speaker: zundamon
        emotion: happy
        text: "お客が気持ちよく歌えたら、それが正解の演奏なのだ。"
      - speaker: reimu
        reading: "おきゃくの キーに あわせテンポを あわせ、まちがえても しらんかおで ついていく。"
        text: "お客のキーに合わせ、テンポを合わせ、間違えても知らん顔でついていく。"
      - speaker: reimu
        reading: "へたな うたを きもちよく うたわせる ぎじゅつなら、だれにも まけませんでした。"
        text: "下手な歌を気持ちよく歌わせる技術なら、誰にも負けませんでした。"
      - speaker: shacho
        emotion: happy
        text: "キミの伴奏やと、わし、歌がうまなった気がするんや！"
      - speaker: zundamon
        emotion: happy
        text: "気のせいじゃないぞ。社長は今夜、優勝だ。"
      - speaker: nakama
        emotion: normal
        text: "接客の天才かよ。"
  # ============ 転機: 社長の依頼 ============
  - id: tape
    title: "1970・運命の依頼"
    background: il_ka_club
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.3, flip: true, tag: "井上"}
      - {who: shacho, x: 0.74}
    cuts:
      - speaker: shacho
        emotion: normal
        text: "[井上|いのうえ]くん、[折り入って|おりいって]頼みがあるんや。"
      - speaker: zundamon
        emotion: normal
        text: "改まってどうしたんだ、社長。"
      - speaker: shacho
        emotion: normal
        text: "こんど会社の旅行でな、宴会で歌わなあかんのや。"
      - speaker: shacho
        emotion: sad
        text: "せやけど旅先に、キミの伴奏はあらへん。わし、あの伴奏なしでは歌えん。"
      - speaker: zundamon
        emotion: surprised
        text: "社長、ボクの伴奏に依存してたのだ！？"
      - speaker: shacho
        emotion: normal
        text: "せや。そこでや。キミの伴奏を、テープに吹き込んでくれへんか。"
      - speaker: zundamon
        emotion: thinking
        text: "伴奏だけを、テープに……。"
      - speaker: reimu
        reading: "だいすけわ しゃちょうの キーに あわせた ばんそうを、テープに ふきこんで わたしました。"
        text: "大佑は社長のキーに合わせた伴奏を、テープに吹き込んで渡しました。"
      - speaker: shacho
        emotion: happy
        text: "おおきに！これで宴会、無双できるわ！"
      - speaker: reimu
        reading: "りょこうから もどった しゃちょうわ、おおよろこびで みせに きました。"
        text: "旅行から戻った社長は、大喜びで店に来ました。"
      - speaker: shacho
        emotion: happy
        text: "大成功や！満場一致で、わしの独壇場やった！"
      - speaker: zundamon
        emotion: happy
        text: "よかったな。テープの伴奏でも、ちゃんと歌えるんだ。"
      - speaker: zundamon
        emotion: thinking
        text: "……ん？待つのだ。"
      - speaker: zundamon
        emotion: thinking
        text: "テープで歌えるなら、バンドがいない店でも、歌えるのでは？"
      - speaker: zundamon
        emotion: surprised
        se: don
        text: "伴奏の機械を置けば、どの店でも歌える！これは、いけるのだ！"
      - speaker: reimu
        reading: "ばんそうを きかいに やらせる。よの なかを かえる おもいつきわ、じょうれんの たのみごとから うまれました。"
        text: "伴奏を機械にやらせる。世の中を変える思いつきは、常連の頼みごとから生まれました。"
  # ============ 1971 年号カード ============
  - id: era1971
    title: ""
    background: il_ka_workshop
    bgm: curious
    cuts:
      - speaker: reimu
        reading: "せんきゅうひゃくななじゅういちねん。だいすけさんじゅういっさい。てづくりの きかいづくりが はじまります。"
        text: "1971年。大佑、31歳。手作りの機械づくりが始まります。"
        video: assets/clips/ka_era1971.mp4
        video_full: true
  # ============ 8JUKE製作 ============
  - id: build8juke
    title: "1971・8JUKE誕生"
    background: il_ka_workshop
    stage:
      - {who: zundamon, x: 0.3, flip: true, tag: "井上"}
      - {who: nakama, x: 0.74}
    cuts:
      - speaker: nakama
        emotion: normal
        text: "で、伴奏の機械って、どう作るんだ？"
      - speaker: zundamon
        emotion: happy
        text: "作らないのだ。組み合わせるのだ。"
      - speaker: nakama
        emotion: thinking
        text: "どういうことだ？"
      - speaker: reimu
        reading: "ざいりょうわすべて まちで かえる ありものでした。"
        text: "材料は、すべて街で買えるありものでした。"
      - speaker: zundamon
        emotion: normal
        text: "まず、車用の[8トラ|ハチトラ]ックデッキ。伴奏テープはここに入れる。"
        video: assets/clips/ka_jbox.mp4
        video_full: true
        video_span: 4
      - speaker: zundamon
        emotion: normal
        text: "次に100円のコインボックス。お金を入れたら動く仕掛けだ。"
      - speaker: zundamon
        emotion: normal
        text: "アンプとマイクをつないで、声と伴奏を一緒に鳴らすのだ。"
      - speaker: zundamon
        emotion: happy
        text: "仕上げはエコー。声を響かせれば、誰でも3割うまく聞こえるんだ。"
      - speaker: nakama
        emotion: surprised
        text: "最後のやつ、機能というより魔法だろ。"
      - speaker: zundamon
        emotion: happy
        text: "[風呂場|ふろば]で歌うと、うまく聞こえるだろ。あれを機械に積んだんだ。"
      - speaker: nakama
        emotion: happy
        text: "天才かよ。"
      - speaker: nakama
        emotion: thinking
        text: "でも、なんでエコーだと、うまく聞こえるんだ？"
      - speaker: zundamon
        emotion: normal
        text: "声に、ちょっと遅れた自分の声が重なるからだ。"
      - speaker: zundamon
        emotion: normal
        text: "重なった響きが音の輪郭をぼかして、外した瞬間が耳で特定できなくなるのだ。"
      - speaker: nakama
        emotion: surprised
        text: "粗が隠れるのか。音のモザイクじゃないか。"
      - speaker: zundamon
        emotion: happy
        text: "響きが増えるぶん[声|こえ]も豊かに聞こえる。いいことずくめなんだ。"
      - speaker: reimu
        reading: "エコーで きもちよく。クラブで みがいた せっきゃくじゅつが、そのまま きかいに なりました。"
        text: "エコーで気持ちよく。クラブで磨いた接客術が、そのまま機械になりました。"
      - speaker: reimu
        reading: "かんせいした きかいわその なも エイトジューク。てづくりでじゅういちだい。"
        text: "完成した機械は、その名も8JUKE。手作りで、11台。"
      - speaker: zundamon
        emotion: happy
        text: "100円で5分。歌い放題とはいかないが、1曲歌うには十分だ。"
      - speaker: nakama
        emotion: normal
        text: "曲はどうすんだ？"
      - speaker: zundamon
        emotion: normal
