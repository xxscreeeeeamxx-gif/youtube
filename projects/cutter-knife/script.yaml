# カッターナイフ再現ドラマ・ミーム版（岡田良男・1950年代→現代）。投稿前に必ず目視レビュー。
# 新方針: ミーム版のみ1本。戦後の貧しさの描写は茶化さない。死去シーンなし（明るい伝記）。
# 裏取り: オルファ公式「誕生秘話」/オルファWikipedia/カッターナイフWikipedia/precious.jp/CBC/SK弁理士法人。
# 印刷工の岡田(30歳・1956)が紙裁断の刃の消耗に悩む→進駐軍向け靴職人がガラス片で靴底を削り
# 切れなくなると割って新しい縁を使うのを目撃+進駐軍の板チョコの割り線→折る刃式を着想→
# 試作1号(長さ13cm・幅1cm・折り筋ピッチ約5mm)・実用新案→メーカーに断られ続ける→
# 資金難で日本転写紙に製造協力を求め1959特許出願・取得→1967-6-8 弟の三朗・四郎・博と
# 妻・輝子と岡田工業設立→ブランドOLFA(折る刃→H音を発音しない国があるためOLHAでなくOLFA)→
# 刃幅9mm/18mm・折れ線角度59度が世界のデファクトスタンダード・黄色いボディ・ジャパニーズナイフ
meta:
  title: "刃を折ったら、世界が切れた。カッターナイフを発明した印刷工・岡田良男【ゆっくり再現ドラマ・ミーム版】"
  slug: "cutter-knife"
  summary: "カッターナイフを発明した大阪の印刷工・岡田良男の物語。紙を切るカミソリの刃がすぐ駄目になる悩みの中、進駐軍の靴を直す職人が「切れなくなったガラス片を割って、新しい縁で削る」のを目撃。進駐軍の板チョコの割り線と掛け合わせて、世界初の「折れば切れ味が戻る刃」を思いつく。メーカーに断られ続けた試作品が、弟たちと建てた会社オルファとなり、刃幅9ミリ・折れ線59度が世界標準になるまで。ずんだもんが岡田を演じる再現ドラマ・ミーム版でお届けします。"
  tags: ["カッターナイフ", "岡田良男", "オルファ", "発明", "大阪", "再現ドラマ", "ゆっくり", "ずんだもん", "ミーム"]
  thumbnail:
    top: "刃を折ったら"
    bottom: "世界が切れた"
  mode: drama
  narrator: reimu
  mobs:
    - {id: oyakata, label: "印刷所の親方", voice: 13, pitch: -0.06, item: mustache}
    - {id: shokunin, label: "靴職人", voice: 42, item: hat}
    - {id: tantou, label: "メーカーの担当", voice: 13, pitch: 0.02, item: hat}
    - {id: teruko, label: "妻・輝子", voice: 8, pitch: 0.03, hair: bun}
scenes:
  - id: hook
    title: ""
    background: il_ck_desk
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: zundamon
        emotion: thinking
        text: "工作中なのだ。……むむ、カッターの切れ味が、落ちてきたんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "じゃあ、刃を折らないと。"
      - speaker: zundamon
        emotion: surprised
        text: "はあ！？切れないのに、さらに壊すのか！？"
      - speaker: tsumugi
        emotion: normal
        text: "壊すんじゃなくて、折るの。ほら、ペンチで、ポキッ。"
      - speaker: zundamon
        emotion: surprised
        text: "……切れ味が、完全回復したのだ。回復魔法か？"
      - speaker: tsumugi
        emotion: normal
        text: "刃に最初から折り線が入ってて、折ると新品の刃先が出るの。"
      - speaker: zundamon
        emotion: thinking
        text: "回復じゃなくて、交代だったのか。野球の投手みたいなんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "そう。疲れた先発の後ろに、新品が何人も控えてる。"
      - speaker: zundamon
        emotion: thinking
        text: "言われてみれば、この斜めの線、なんで入ってるんだ？"
      - speaker: tsumugi
        emotion: normal
        text: "その線こそが、世紀の大発明。日本生まれだよ。"
      - speaker: zundamon
        emotion: surprised
        text: "カッターナイフ、日本発なのか！？"
      - speaker: tsumugi
        emotion: normal
        text: "折る刃式はね。海外にはジャパニーズ・ナイフって呼ぶ国もあるの。"
      - speaker: zundamon
        emotion: thinking
        text: "誰が考えたんだ？刃物の職人？大企業の研究所？"
      - speaker: tsumugi
        emotion: normal
        text: "大阪の、紙を切る仕事をしてた印刷工さん。"
      - speaker: zundamon
        emotion: surprised
        text: "作る側じゃなくて、使う側の発明なのか。"
      - speaker: tsumugi
        emotion: normal
        text: "しかも、刃物のメーカーには、断られまくったの。"
      - speaker: zundamon
        emotion: thinking
        text: "世界標準になる発明が、書類選考で全落ちしてたのか……。"
      - speaker: tsumugi
        emotion: normal
        text: "ヒントは、板チョコと、ガラスのかけら。"
      - speaker: zundamon
        emotion: thinking
        text: "チョコとガラス……情報量が渋滞してるんだが。"
      - speaker: tsumugi
        emotion: happy
        text: "今日はその話。工作しながら、聞いていこう。"
      - speaker: zundamon
        emotion: happy
        text: "聞くのだ。この斜め線の正体、気になって作業が進まないんだ。"
      - speaker: reimu
        text: "カッターナイフ。折ると切れ味が戻る、日本生まれの道具です。"
        reading: "かったーないふ。おるときれあじがもどる、にほんうまれのどうぐです。"
      - speaker: reimu
        text: "発明したのは、刃物屋ではなく、一人の印刷工でした。"
        reading: "はつめいしたのわ、はものやでわなく、ひとりのいんさつこうでした。"
      - speaker: reimu
        text: "物語は、1950年代の大阪から始まります。"
        reading: "ものがたりわ、せんきゅうひゃくごじゅうねんだいのおおさかからはじまります。"
