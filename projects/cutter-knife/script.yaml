      - speaker: oyakata
        text: "ほう。ほな紙を切るっちゅうのは、石の粉を切っとるようなもんか。"
      - speaker: zundamon
        emotion: normal
        text: "そう。だから紙の現場の刃は、人一倍早く丸くなるんだ。"
      - speaker: oyakata
        text: "道理でうちの替え刃代が、かさむわけや。"
      - speaker: oyakata
        text: "刃物は消耗品や。けど、もったいない話やで。"
      - speaker: zundamon
        emotion: thinking
        text: "刃のほとんどは、まだピカピカの新品なのに……。"
      - speaker: zundamon
        emotion: thinking
        text: "使ってるのは、先っぽの数ミリだけ。あとは全部、無駄死になのだ。"
      - speaker: oyakata
        text: "ほな、先っぽだけ新品にできたら、大発明やな。ハッハッハ。"
      - speaker: zundamon
        emotion: thinking
        text: "（親方は冗談で言ってるけど……それ、できたら革命なのだ。）"
      - speaker: reimu
        text: "刃はすぐ切れなくなる。それが、岡田の毎日の悩みでした。"
        reading: "はわすぐきれなくなる。それが、おかだのまいにちのなやみでした。"
