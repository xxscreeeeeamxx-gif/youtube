      - speaker: zundamon
        emotion: normal
        text: "刃先の数ミリだけ折って捨てれば、残り全部が予備の新品なんだ。"
      - speaker: teruko
        text: "一本の刃が、何本ぶんにもなるんですね。"
      - speaker: reimu
