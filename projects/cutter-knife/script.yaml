  - id: insatsu
    title: ""
    background: il_ck_insatsu
    bgm: pastel_house
    stage:
      - {who: zundamon, x: 0.24, tag: "岡田", flip: true}
      - {who: oyakata, x: 0.72}
    cuts:
      - speaker: reimu
        text: "岡田良男は、印刷の仕事場で働く、30歳の職人でした。"
        reading: "おかだよしおわ、いんさつのしごとばではたらく、さんじゅっさいのしょくにんでした。"
      - speaker: oyakata
        text: "岡田、この紙の山、昼までに断ち終わるか。"
      - speaker: zundamon
        emotion: normal
        text: "任せてほしいのだ。……よし、どんどん切るぞ。"
      - speaker: zundamon
        emotion: thinking
        text: "……むむ。もう刃が、引っかかり始めたのだ。"
      - speaker: oyakata
        text: "カミソリの刃、また換えるんか。今日それで何枚目や。"
      - speaker: zundamon
