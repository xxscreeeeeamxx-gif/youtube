# 新幹線×カワセミ再現ドラマ・ミーム版（仲津英治・1990→現代）。投稿前に必ず目視レビュー。
# 新方針(2026-07): 新作はミーム版のみ1本。センシティブ場面(住民苦情の生活被害・kotobaの名言)はクリーン維持。
# 仲津氏は存命の可能性が高いため、本人インタビューで公知のエピソードのみ使用し敬意をもって描く。
# 裏取り: JFSインタビュー(仲津英治)/日本機械学会W20200/JR西日本500系記録。
# 1990開発開始・300km/h・トンネル微気圧波=400m先から苦情・若手の「列車が縮む」発言・
# カワセミのダイブ・ノーズ15m・空気抵抗3割減・速度1割増でも電力15%減・フクロウのセレーション
# (ボルテックスジェネレーター・4年研究・翼型パンタグラフ)・アデリーペンギン=パンタ支持部・
# 1997営業運転(当時世界最速タイと言われる)・名言「一木一草、一鳥一魚、皆我々の輝ける永遠の教師」
meta:
  title: "新幹線の鼻は、なぜカワセミなのか。バードウォッチングが世界最速を作った話【ゆっくり再現ドラマ・ミーム版】"
  slug: "shinkansen-bird"
  summary: "500系新幹線を設計したJR西日本の技術者・仲津英治の物語。時速300キロの壁は、トンネル出口の「ドン！」という爆音だった。400メートル先から苦情が来る騒音問題に悩む中、試験班の若手の「列車が縮む気がする」という一言と、趣味のバードウォッチングで見慣れたカワセミのダイブが答えをくれる。フクロウの羽が教えたパンタグラフ、アデリーペンギンの支持部、そして1997年のデビューまで。自然を先生にした技術者の実話を、ずんだもんが仲津を演じる再現ドラマ・ミーム版でお届けします。"
  tags: ["新幹線", "500系", "カワセミ", "バイオミメティクス", "仲津英治", "再現ドラマ", "ゆっくり", "ずんだもん", "ミーム"]
  thumbnail:
    top: "鼻が長いのは"
    bottom: "鳥のパクリ？いいえ師匠"
  mode: drama
  narrator: reimu
  mobs:
    - {id: juumin, label: "沿線の住民", voice: 8, pitch: 0.05, hair: bun}
    - {id: joushi, label: "上司", voice: 13, pitch: -0.06, item: hat}
    - {id: nakama, label: "野鳥の会の会員", voice: 42, item: mustache}
scenes:
  - id: hook
    title: ""
    background: il_sb_homu
    bgm: shuffle_shuffle
    stage:
      - {who: zundamon, x: 0.3, flip: true}
      - {who: tsumugi, x: 0.74}
    cuts:
      - speaker: zundamon
        emotion: happy
        text: "新幹線で旅なのだ！見るのだ、この長い鼻。かっこよすぎるぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "ほんと、先頭だけで15メートルもあるんだよ。"
      - speaker: zundamon
        emotion: thinking
        text: "15メートル！？もはや鼻が本体なんだが。"
      - speaker: tsumugi
        emotion: normal
        text: "なんでこんなに長いか、知ってる？"
      - speaker: zundamon
        emotion: thinking
        text: "長いほうが、先に目的地に着くからか？"
      - speaker: tsumugi
        emotion: normal
        text: "鼻の分だけね。所要時間は、変わらないよ。"
      - speaker: zundamon
        emotion: normal
        text: "決まってるのだ。速そうに見えて、かっこいいからだ。"
      - speaker: tsumugi
        emotion: normal
        text: "デザイン優先じゃないんだな、これが。"
      - speaker: zundamon
        emotion: thinking
        text: "じゃあ、空気抵抗？それくらい、ボクでも分かるぞ。"
      - speaker: tsumugi
        emotion: normal
        text: "半分正解。本当の敵は、トンネルの出口で鳴る「ドン！」。"
      - speaker: zundamon
        emotion: surprised
        text: "ドン？新幹線が、太鼓でも積んでるのか？"
      - speaker: tsumugi
        emotion: normal
        text: "積んでない。速すぎる列車がトンネルに入ると、爆音が出ちゃうの。"
      - speaker: zundamon
        emotion: surprised
        text: "そんな物理現象、初めて聞いたんだが。"
      - speaker: tsumugi
        emotion: normal
        text: "それを解決したのが、この鼻。お手本は、鳥のくちばしだよ。"
      - speaker: zundamon
        emotion: surprised
        text: "鳥！？ファッ！？新幹線が、実質バードなのか！？"
      - speaker: tsumugi
        emotion: happy
        text: "設計したのは、バードウォッチングが趣味の技術者さん。"
      - speaker: zundamon
        emotion: thinking
        text: "趣味が仕事を救ったのか。ずるいぞ、そんな伏線回収。"
      - speaker: tsumugi
        emotion: happy
        text: "今日はその人の話。乗りながら、聞いていこう。"
      - speaker: zundamon
        emotion: happy
        text: "聞くぞ。鼻の正体、気になって夜しか眠れないんだ。"
      - speaker: reimu
        text: "新幹線500系。先頭の長い鼻には、3種類の鳥が隠れています。"
        reading: "しんかんせんごひゃくけい。せんとうのながいはなにわ、さんしゅるいのとりがかくれています。"
      - speaker: reimu
        text: "設計したのは、鳥を愛する一人の技術者でした。"
        reading: "せっけいしたのわ、とりをあいするひとりのぎじゅつしゃでした。"
      - speaker: reimu
        text: "物語は、1990年ごろの日本から始まります。"
        reading: "ものがたりわ、せんきゅうひゃくきゅうじゅうねんごろのにほんからはじまります。"
  - id: era1990
    title: "1990・最速への挑戦"
    background: il_sb_kaigi
    bgm: 223am
    stage:
      - {who: zundamon, x: 0.15, tag: "仲津", flip: true}
    cuts:
      - speaker: reimu
        text: "1990年ごろ、日本。"
        reading: "せんきゅうひゃくきゅうじゅうねんごろ、にほん。"
        video: assets/clips/era_sb1990.mp4
        video_full: true
        pause_after: 0.8
  - id: project
    title: ""
    background: il_sb_kaigi
    bgm: pastel_house
    stage:
      - {who: zundamon, x: 0.24, tag: "仲津", flip: true}
      - {who: joushi, x: 0.72}
    cuts:
      - speaker: reimu
        text: "JR西日本の技術者、仲津英治。新型新幹線の開発チームにいました。"
        reading: "じぇいあーるにしにほんのぎじゅつしゃ、なかつえいじ。しんがたしんかんせんのかいはつちーむにいました。"
      - speaker: joushi
        text: "目標は、時速300キロでの営業運転だ。"
      - speaker: zundamon
        emotion: surprised
        text: "300キロ……世界最速級への挑戦なんだ。"
      - speaker: joushi
        text: "飛行機に、客を取られ続けている。速さで取り返す。"
      - speaker: zundamon
        emotion: normal
        text: "エンジンのパワーなら、いけるはずなんだ。"
      - speaker: joushi
        text: "ああ。だが、本当の壁は速さじゃない。"
      - speaker: zundamon
        emotion: normal
        text: "パワーだけなら、もう出せる時代なんだ。"
      - speaker: joushi
        text: "そのとおり。問題は、出したあとに何が起きるかだ。"
      - speaker: zundamon
        emotion: thinking
        text: "……音、ですか。"
      - speaker: joushi
        text: "そうだ。日本の騒音基準は、世界一厳しい。"
      - speaker: zundamon
        emotion: thinking
        text: "住宅のそばを走る以上、うるさい最速に、価値はないんだ。"
      - speaker: joushi
        text: "静かで、速い。両方だ。仲津くん、頼んだぞ。"
      - speaker: zundamon
        emotion: thinking
        text: "静かで速い……縛りプレイにも、ほどがあるぞ。"
      - speaker: reimu
        text: "速く、しかも静かに。無理難題への挑戦が始まりました。"
        reading: "はやく、しかもしずかに。むりなんだいえのちょうせんがはじまりました。"
  - id: don
    title: "トンネルの出口で、ドン"
    background: il_sb_tonneru
    bgm: kinakusai
    stage:
      - {who: zundamon, x: 0.24, tag: "仲津", flip: true}
      - {who: juumin, x: 0.72}
    cuts:
      - speaker: reimu
        text: "最大の敵は、トンネルでした。"
        reading: "さいだいのてきわ、とんねるでした。"
      - speaker: juumin
        text: "あの、すみません。トンネルの近くに住んでる者ですが。"
      - speaker: zundamon
        emotion: normal
        text: "はい、どうされました？"
      - speaker: juumin
        text: "新幹線が通るたび、ドン！って。雷みたいな音がするんです。"
      - speaker: zundamon
        emotion: surprised
        text: "トンネルの、出口からですか？"
      - speaker: juumin
        text: "ええ。窓もビリビリ震えて。うちは400メートルも離れてるのに。"
      - speaker: zundamon
        emotion: sad
        text: "400メートル先まで……申し訳ないです。"
      - speaker: juumin
        text: "夜中はね、ドンのたびに、子どもが起きちゃうんですよ。"
      - speaker: zundamon
        emotion: sad
        text: "生活の中に、響いてしまってるのだ……。"
      - speaker: juumin
        text: "速くなるのはいいけど、これ以上うるさくなるのは困ります。"
      - speaker: zundamon
        emotion: normal
        text: "……必ず、静かにします。約束するのだ。"
      - speaker: reimu
        text: "トンネル微気圧波。出口で低い音が響く現象でした。"
        reading: "とんねるびきあつは。でぐちでひくいおとがひびくげんしょうでした。"
      - speaker: zundamon
        emotion: thinking
        text: "これで300キロに上げたら、音はもっとひどくなるのだ。"
      - speaker: zundamon
        emotion: sad
        text: "速くするほど、うるさくなる。詰んでるんだが。"
      - speaker: reimu
        text: "苦情は深刻でした。解決なくして、300キロはありません。"
        reading: "くじょうわしんこくでした。かいけつなくして、さんびゃっきろわありません。"
  - id: naze
    title: "なぜ、ドンが鳴るのか"
    background: il_sb_lab
    bgm: curious
    stage:
      - {who: zundamon, x: 0.24, tag: "仲津", flip: true}
      - {who: tsumugi, x: 0.76, tag: "若手"}
    cuts:
      - speaker: tsumugi
        emotion: thinking
        text: "仲津さん、そもそも、なんでトンネルだと音が出るんですか。"
      - speaker: zundamon
        emotion: normal
        text: "列車は、前の空気を押しのけながら走ってるんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "[開けた|ひらけた]場所なら、空気は横に逃げられますね。"
      - speaker: zundamon
        emotion: normal
        text: "でも、トンネルは筒なのだ。逃げ場が、ないんだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "押された空気は、どうなるんです？"
      - speaker: zundamon
        emotion: normal
        text: "注射器を想像してほしいのだ。筒の中で、ピストンを押す。"
      - speaker: tsumugi
        emotion: normal
        text: "先がふさがってたら、中の空気がぎゅっと詰まりますね。"
      - speaker: zundamon
        emotion: normal
        text: "トンネルの中の列車は、まさにあのピストンなんだ。"
      - speaker: zundamon
        emotion: normal
        text: "ぎゅっと圧縮されて、波になって、トンネルの奥へ走るんだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "波の速さは？"
      - speaker: zundamon
        emotion: normal
        text: "音速なのだ。列車より先に、出口へ届くんだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "その波が出口から出るとき……。"
      - speaker: zundamon
        emotion: normal
        text: "一気に解放されて、ドン。空気の津波が、はじけるんだ。"
      - speaker: tsumugi
        emotion: sad
        text: "つまり、列車が空気の逃げ場を奪うのが原因。"
      - speaker: zundamon
        emotion: normal
        text: "しかも日本のトンネルは、断面が狭いんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "海外より、空気の逃げ場がさらに少ないんですね。"
      - speaker: zundamon
        emotion: thinking
        text: "そして速度を上げるほど、波は急激に強くなるんだ。"
      - speaker: tsumugi
        emotion: sad
        text: "300キロなんて、無理ゲーじゃないですか。"
      - speaker: zundamon
        emotion: normal
        text: "無理ゲーを、攻略するのがボクらの仕事なのだ。"
      - speaker: reimu
        text: "問題は、入り口。空気をどう押しのけるかが、鍵でした。"
        reading: "もんだいわ、いりぐち。くうきをどうおしのけるかが、かぎでした。"
  - id: wakate
    title: "列車が、縮む気がする"
    background: il_sb_shaken
    bgm: you_and_me
    stage:
      - {who: zundamon, x: 0.24, tag: "仲津", flip: true}
      - {who: tsumugi, x: 0.76, tag: "若手"}
    cuts:
      - speaker: reimu
        text: "ヒントは、試験走行の現場で生まれました。"
        reading: "ひんとわ、しけんそうこうのげんばでうまれました。"
      - speaker: tsumugi
        emotion: thinking
        text: "仲津さん。変なこと言っても、いいですか。"
      - speaker: zundamon
        emotion: normal
        text: "むしろ、変なことしか聞きたくないんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "相変わらずですね、その方針。"
      - speaker: zundamon
        emotion: normal
        text: "変なこと、大歓迎だ。"
      - speaker: tsumugi
        emotion: thinking
        text: "試験車両に乗ってると、トンネルに入る瞬間……。"
      - speaker: tsumugi
        emotion: thinking
        text: "列車が、ぎゅっと縮むような気がするんです。"
      - speaker: zundamon
        emotion: surprised
        text: "……縮む。"
      - speaker: tsumugi
        emotion: normal
        text: "空気の壁に、突っ込んでる感じというか。"
      - speaker: zundamon
        emotion: thinking
        text: "空気の薄いところから、濃いところへ、一瞬で突っ込む……。"
      - speaker: zundamon
        emotion: thinking
        text: "抵抗が急に変わる場所へ、飛び込んでる。それと同じ状況を……。"
      - speaker: zundamon
        emotion: surprised
        text: "毎日こなしてる生き物が、いるんだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "生き物？"
      - speaker: zundamon
        emotion: happy
        text: "週末、川に来てほしいのだ。ボクの趣味に、付き合ってくれ。"
      - speaker: tsumugi
        emotion: thinking
        text: "趣味って、たしか鳥でしたよね。まさか……。"
      - speaker: zundamon
        emotion: happy
        text: "そのまさかなのだ。会社の会議室に、答えはないのだ。"
      - speaker: reimu
        text: "若手の直感が、仲津の頭の中の鳥と、つながった瞬間でした。"
        reading: "わかてのちょっかんが、なかつのあたまのなかのとりと、つながったしゅんかんでした。"
  - id: bird
    title: "青い弾丸"
    background: il_sb_kawa
    bgm: curious
    stage:
      - {who: zundamon, x: 0.24, tag: "仲津", flip: true}
      - {who: tsumugi, x: 0.76, tag: "若手"}
    cuts:
      - speaker: reimu
        text: "仲津は、日本野鳥の会にも入る、鳥のガチ勢でした。"
        reading: "なかつわ、にほんやちょうのかいにもはいる、とりのがちぜいでした。"
      - speaker: tsumugi
        emotion: thinking
        text: "休みの日に呼び出して、バードウォッチングですか……。"
      - speaker: zundamon
        emotion: happy
        text: "遊びじゃないのだ。これも仕事。実質、休日出張なのだ。"
      - speaker: tsumugi
        emotion: normal
        text: "その理屈は、経理に通るんですかね。"
      - speaker: tsumugi
        emotion: surprised
        text: "その双眼鏡と望遠レンズ、完全にプロの装備じゃないですか。"
      - speaker: zundamon
        emotion: happy
        text: "野鳥の会の会員なのだ。装備は、魂なのだ。"
      - speaker: zundamon
        emotion: normal
        text: "しっ。……ほら、あそこ。川の上の枝なのだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "わっ、青い鳥。宝石みたいですね。"
      - speaker: zundamon
        emotion: happy
        text: "カワセミなのだ。水辺の宝石、飛ぶ青い弾丸だ。"
      - speaker: tsumugi
        emotion: normal
        text: "ずいぶん、くちばしが長くて、とがってますね。"
      - speaker: zundamon
        emotion: normal
        text: "見てるのだ。……ほら、いま魚を狙って……。"
      - speaker: tsumugi
        emotion: surprised
        text: "飛び込んだ！……えっ、水しぶきが、ほとんど出てない。"
      - speaker: zundamon
        emotion: happy
        text: "それなのだ！それを見せたかったのだ！"
        se: don
      - speaker: tsumugi
        emotion: thinking
        text: "たしかに……もっと、バシャッてなるはずじゃ。"
      - speaker: zundamon
        emotion: normal
        text: "空気から水へ。密度はおよそ800倍と言われる世界への突入なのだ。"
      - speaker: tsumugi
        emotion: thinking
        text: "私たちがプールに飛び込むだけでも、おなかが痛いのに。"
      - speaker: zundamon
        emotion: normal
        text: "カワセミは、それを時速数十キロでやってのけるんだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "もう一回、飛び込みました。……やっぱり、しぶきが出ない。"
      - speaker: zundamon
        emotion: normal
        text: "何回見ても、しぶきはゼロ。これが、俺じゃなきゃ見逃しちゃうね、なのだ。"
      - speaker: tsumugi
        emotion: surprised
        text: "急に抵抗が変わる場所へ、飛び込んでる……。"
      - speaker: tsumugi
        emotion: surprised
        text: "トンネルに入る新幹線と、完全に一致じゃないですか！"
      - speaker: zundamon
        emotion: happy
        text: "カワセミは、この難題を毎日ノーダメでクリアしてる。"
      - speaker: tsumugi
        emotion: thinking
        text: "しかも狙いを外さない。空中で止まって照準まで合わせてました。"
      - speaker: zundamon
        emotion: normal
        text: "ホバリングなのだ。目も体も、狩りに全振りした鳥なんだ。"
      - speaker: zundamon
        emotion: normal
        text: "つまり、答えは何億年も前から、川辺にいたんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "自然が先に、正解を出してたんですね。"
      - speaker: reimu
        text: "水しぶきを立てないダイブ。それが、答えの形でした。"
        reading: "みずしぶきをたてないだいぶ。それが、こたえのかたちでした。"
  - id: kuchibashi
    title: "くちばしの、種明かし"
    background: il_sb_lab
    bgm: curious
    stage:
      - {who: zundamon, x: 0.24, tag: "仲津", flip: true}
      - {who: tsumugi, x: 0.76, tag: "若手"}
    cuts:
      - speaker: tsumugi
        emotion: thinking
        text: "でも、なんであのくちばしだと、しぶきが出ないんです？"
      - speaker: zundamon
        emotion: normal
        text: "秘密は、先っぽから根元への、太くなり方なんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "先は針みたいに細くて、じわじわ太くなりますね。"
      - speaker: zundamon
        emotion: normal
        text: "断面積が、急に増えないんだ。なだらかに、少しずつ増える。"
      - speaker: tsumugi
        emotion: thinking
        text: "水を、一気に押しのけない……。"
      - speaker: zundamon
        emotion: normal
        text: "そう。少しずつ、そっと押しのけていくんだ。"
      - speaker: tsumugi
        emotion: normal
        text: "だから水面が、驚かない。しぶきも波も立たない。"
      - speaker: zundamon
        emotion: normal
        text: "逆に、丸い頭から飛び込んだら、どうなると思う？"
      - speaker: tsumugi
        emotion: normal
